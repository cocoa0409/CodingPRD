scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Lot vs SalesOrder)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lot_carrying_value_straight_line_vs_mark_to_market
        grounds:
          - calculations.lot_carrying_value
          - entities.Lot.fields.carrying_value_straight_line_cents
          - entities.Lot.fields.carrying_value_market_cents
        distinguishing_aspect: |
          Lot entity domain: identical lot state (cost_basis 10000, qty 10, age 100 days,
          latest spot 11000) yields straight-line value 72603 and mark-to-market value
          93500 — two valid accounting bases on the same Lot row that MUST differ.
        test_recipe:
          setup:
            - "Broker-owned lot L: mpn LM317T, quantity_received 10, cost_basis_per_unit_cents 10000, received_at 2026-08-01T00:00:00Z, no reservations"
            - "MarketPriceSnapshot for LM317T spot 11000 observed at 2026-11-01T00:00:00Z"
            - "Logical clock at 2026-11-09T00:00:00Z (age_days = 100)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Acme Surplus", contact_email: "acme@x.com" }
              as: BrokerOps
              captures: { seller_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-A1", capacity_units: 100 }
              as: BrokerOps
              captures: { bin_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${seller_id}", mpn: "LM317T", quantity: 10, ask_price_per_unit_cents: 10000, provenance_doc_url: "https://docs.x.com/p1.pdf" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /buy-offers/${offer_id}/accept"
              payload: { agreed_unit_price_cents: 10000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${offer_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${offer_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${offer_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /market-price-snapshots"
              payload: { mpn: "LM317T", spot_price_cents: 11000, source: "DISTRIBUTOR_FEED" }
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-09T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: BrokerOps
          assert:
            - "Lot.${lot_id}.carrying_value_straight_line_cents == 72603  (round_half_up(10000*10*(1-100/365)) = round_half_up(72602.7397))"
            - "Lot.${lot_id}.carrying_value_market_cents == 93500  (round_half_up(11000*0.85*10))"
            - "Lot.${lot_id}.carrying_value_straight_line_cents != Lot.${lot_id}.carrying_value_market_cents"

      - name: order_price_provisional_vs_final_settlement
        grounds:
          - calculations.provisional_order_pricing
          - calculations.final_settlement_pricing
          - entities.SalesOrder.fields.provisional_unit_price_cents
          - entities.SalesOrder.fields.final_unit_price_cents
        distinguishing_aspect: |
          SalesOrder entity domain: identical order data prices twice — provisional 12500
          (asking x urgency premium at creation) versus final 11519 (provisional x age
          discount x volatility dampener at settlement) — two valid lifecycle variants
          that MUST differ by 981 cents per unit.
        test_recipe:
          setup:
            - "CONSIGNMENT lot L2: mpn STM32F103, quantity 10, cost_basis 8000, received_at 2026-08-01T00:00:00Z"
            - "ACTIVE consignment agreement window [2026-08-01, 2027-08-01) broker_fee_bps 1500"
            - "ACTIVE listing asking 10000 on L2; customer urgency CRITICAL, credit 200000"
            - "Order qty 10 fully escrowed (125000) and advanced to DELIVERED"
            - "Snapshots spot 8000 at 2026-10-10 and 11000 at 2026-10-20; clock at 2026-11-04T00:00:00Z (age 95, AGED 5%; volatility 0.375 > 0.20 so dampener 3%)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Beta Excess", contact_email: "beta@x.com" }
              as: BrokerOps
              captures: { s2_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cris Corp", contact_email: "cris@x.com", credit_limit_cents: 200000, urgency_tier: "CRITICAL" }
              as: BrokerOps
              captures: { c2_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-B1", capacity_units: 100 }
              as: BrokerOps
              captures: { bin2_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s2_id}", mpn: "STM32F103", quantity: 10, ask_price_per_unit_cents: 8000, provenance_doc_url: "https://docs.x.com/p2.pdf" }
              as: Seller
              as_user_id: "${s2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /buy-offers/${o2_id}/accept"
              payload: { agreed_unit_price_cents: 8000, acquisition_mode: "CONSIGNMENT" }
              as: BrokerOps
            - call: "POST /buy-offers/${o2_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o2_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o2_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin2_id}" }
              as: BrokerOps
              captures: { lot2_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { seller_id: "${s2_id}", lot_id: "${lot2_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", broker_fee_bps: 1500 }
              as: BrokerOps
            - call: "POST /listings"
              payload: { lot_id: "${lot2_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst2_id: $.data.id }
            - call: "POST /listings/${lst2_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c2_id}", listing_id: "${lst2_id}", quantity: 10 }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { ord2_id: $.data.id, prov_unit: $.data.provisional_unit_price_cents }
            - call: "POST /sales-orders/${ord2_id}/escrow/deposit"
              payload: { amount_cents: 125000 }
              as: Customer
              as_user_id: "${c2_id}"
            - call: "POST /sales-orders/${ord2_id}/fulfill"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord2_id}/ship"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord2_id}/deliver"
              payload: {}
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: BrokerOps
            - call: "POST /market-price-snapshots"
              payload: { mpn: "STM32F103", spot_price_cents: 8000, source: "TRADE_DESK" }
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BrokerOps
            - call: "POST /market-price-snapshots"
              payload: { mpn: "STM32F103", spot_price_cents: 11000, source: "TRADE_DESK" }
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /sales-orders/${ord2_id}/settle"
              payload: {}
              as: FinanceAdmin
          assert:
            - "SalesOrder.${ord2_id}.provisional_unit_price_cents == 12500  (round_half_up(10000*1.25))"
            - "SalesOrder.${ord2_id}.final_unit_price_cents == 11519  (round_half_up(12500*0.95*0.97) = round_half_up(11518.75))"
            - "SalesOrder.${ord2_id}.final_total_cents == 115190"
            - "SalesOrder.${ord2_id}.customer_refund_cents == 9810"
            - "SalesOrder.${ord2_id}.final_unit_price_cents != SalesOrder.${ord2_id}.provisional_unit_price_cents"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (mode (a) vs mode (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_price_three_input_tiered_interaction
        grounds:
          - calculations.final_settlement_pricing
          - calculations.market_volatility_index
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction: provisional unit
          price, age-bucket conditional (0/5/12%), and volatility conditional (0/3%
          gated by strict > 0.20) multiply; a PRIORITY customer on a 200-day STALE lot
          with no snapshots yields final_unit 9680, distinct from any subset of inputs.
        test_recipe:
          setup:
            - "BROKER_OWNED lot L3: mpn TL074, qty 5, cost 4000, received_at 2026-08-01T00:00:00Z"
            - "ACTIVE listing asking 10000; customer urgency PRIORITY, credit 100000"
            - "Order qty 1 escrowed and DELIVERED; no snapshots for TL074 (volatility = 0)"
            - "Clock at settle time 2027-02-17T00:00:00Z (age_days = 200 -> STALE, discount 12%)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Gamma Parts", contact_email: "gamma@x.com" }
              as: BrokerOps
              captures: { s3_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Pri Purchaser", contact_email: "pri@x.com", credit_limit_cents: 100000, urgency_tier: "PRIORITY" }
              as: BrokerOps
              captures: { c3_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-C1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin3_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s3_id}", mpn: "TL074", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/p3.pdf" }
              as: Seller
              as_user_id: "${s3_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /buy-offers/${o3_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o3_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o3_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o3_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin3_id}" }
              as: BrokerOps
              captures: { lot3_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot3_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst3_id: $.data.id }
            - call: "POST /listings/${lst3_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c3_id}", listing_id: "${lst3_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { ord3_id: $.data.id }
            - call: "POST /sales-orders/${ord3_id}/escrow/deposit"
              payload: { amount_cents: 11000 }
              as: Customer
              as_user_id: "${c3_id}"
            - call: "POST /sales-orders/${ord3_id}/fulfill"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord3_id}/ship"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord3_id}/deliver"
              payload: {}
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-17T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /sales-orders/${ord3_id}/settle"
              payload: {}
              as: FinanceAdmin
          assert:
            - "SalesOrder.${ord3_id}.provisional_unit_price_cents == 11000  (round_half_up(10000*1.10))"
            - "SalesOrder.${ord3_id}.final_unit_price_cents == 9680  (round_half_up(11000*(1-0.12)*(1-0)))"
            - "SalesOrder.${ord3_id}.final_total_cents == 9680"
            - "SalesOrder.${ord3_id}.customer_refund_cents == 1320"

      - name: escrow_split_pinned_rounding_order
        grounds:
          - calculations.escrow_settlement_split
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins broker_fee =
          round_half_up(final_total x bps/10000) computed FIRST, seller_payout =
          final_total - broker_fee as exact remainder; the alternative order
          (payout = round_half_up(final_total x 0.85) = 97912, fee = remainder)
          differs by one cent and is forbidden.
        test_recipe:
          setup:
            - "Same consignment scenario as order_price_provisional_vs_final_settlement: final_total_cents 115190, broker_fee_bps 1500"
            - "Order fully delivered and clock at 2026-11-04T00:00:00Z"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Delta Devices", contact_email: "delta@x.com" }
              as: BrokerOps
              captures: { s4_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Split Buyer", contact_email: "split@x.com", credit_limit_cents: 200000, urgency_tier: "CRITICAL" }
              as: BrokerOps
              captures: { c4_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-D1", capacity_units: 100 }
              as: BrokerOps
              captures: { bin4_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s4_id}", mpn: "STM32F103", quantity: 10, ask_price_per_unit_cents: 8000, provenance_doc_url: "https://docs.x.com/p4.pdf" }
              as: Seller
              as_user_id: "${s4_id}"
              captures: { o4_id: $.data.id }
            - call: "POST /buy-offers/${o4_id}/accept"
              payload: { agreed_unit_price_cents: 8000, acquisition_mode: "CONSIGNMENT" }
              as: BrokerOps
            - call: "POST /buy-offers/${o4_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o4_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o4_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin4_id}" }
              as: BrokerOps
              captures: { lot4_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { seller_id: "${s4_id}", lot_id: "${lot4_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", broker_fee_bps: 1500 }
              as: BrokerOps
            - call: "POST /listings"
              payload: { lot_id: "${lot4_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst4_id: $.data.id }
            - call: "POST /listings/${lst4_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c4_id}", listing_id: "${lst4_id}", quantity: 10 }
              as: Customer
              as_user_id: "${c4_id}"
              captures: { ord4_id: $.data.id }
            - call: "POST /sales-orders/${ord4_id}/escrow/deposit"
              payload: { amount_cents: 125000 }
              as: Customer
              as_user_id: "${c4_id}"
            - call: "POST /sales-orders/${ord4_id}/fulfill"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord4_id}/ship"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders/${ord4_id}/deliver"
              payload: {}
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: BrokerOps
            - call: "POST /market-price-snapshots"
              payload: { mpn: "STM32F103", spot_price_cents: 8000, source: "TRADE_DESK" }
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BrokerOps
            - call: "POST /market-price-snapshots"
              payload: { mpn: "STM32F103", spot_price_cents: 11000, source: "TRADE_DESK" }
              as: BrokerOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /sales-orders/${ord4_id}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "GET /sales-orders/${ord4_id}/escrow-entries"
              payload: {}
              as: FinanceAdmin
              captures: { fee_entry: "$.data[2].amount_cents", payout_entry: "$.data[3].amount_cents" }
          assert:
            - "EscrowEntry[2] (BROKER_FEE).amount_cents == -17279  (round_half_up(115190*1500/10000) = round_half_up(17278.5))"
            - "EscrowEntry[3] (SELLER_PAYOUT).amount_cents == -97911  (115190 - 17279 exactly; the alternative round_half_up(115190*0.85) = 97912 is forbidden)"
            - "fee_entry + payout_entry + customer_refund 9810 + broker-side entries sum to the 125000 deposited"
            - "Seller.${s4_id}.account_balance_cents == 97911"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: listing_active_pause_cycle
        grounds:
          - state_machines.Listing.ACTIVE_to_PAUSED
          - state_machines.Listing.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Listing entity: cyclic shape ACTIVE -> PAUSED -> ACTIVE is legal twice in a
          row; the lot posture follows each hop (LISTED -> IN_STOCK -> LISTED), proving
          the cycle is not a one-way pipeline.
        test_recipe:
          setup:
            - "BROKER_OWNED lot L5 in IN_STOCK with listing G5 DRAFT asking 8000 (cost 5000)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Echo Electronics", contact_email: "echo@x.com" }
              as: BrokerOps
              captures: { s5_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-E1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin5_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s5_id}", mpn: "NE555", quantity: 20, ask_price_per_unit_cents: 5000, provenance_doc_url: "https://docs.x.com/p5.pdf" }
              as: Seller
              as_user_id: "${s5_id}"
              captures: { o5_id: $.data.id }
            - call: "POST /buy-offers/${o5_id}/accept"
              payload: { agreed_unit_price_cents: 5000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o5_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o5_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o5_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin5_id}" }
              as: BrokerOps
              captures: { lot5_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot5_id}", asking_price_per_unit_cents: 8000 }
              as: BrokerOps
              captures: { lst5_id: $.data.id }
          trigger:
            - call: "POST /listings/${lst5_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /listings/${lst5_id}/pause"
              payload: {}
              as: BrokerOps
            - call: "POST /listings/${lst5_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /listings/${lst5_id}/pause"
              payload: {}
              as: BrokerOps
            - call: "POST /listings/${lst5_id}/activate"
              payload: {}
              as: BrokerOps
          assert:
            - "Listing.${lst5_id}.status == ACTIVE after the second cycle"
            - "Lot.${lot5_id}.status == LISTED after the final activate"
            - "intermediate states observed: PAUSED after each pause call with Lot IN_STOCK"

      - name: buy_offer_inspection_branching_divergent_effects
        grounds:
          - state_machines.BuyOffer.UNDER_INSPECTION_to_INSPECTION_PASSED
          - state_machines.BuyOffer.UNDER_INSPECTION_to_INSPECTION_FAILED
          - state_machines.BuyOffer.INSPECTION_FAILED_to_RETURN_PENDING
        distinguishing_aspect: |
          BuyOffer entity: fork at UNDER_INSPECTION — the PASS branch creates a Lot and
          occupies bin capacity, the FAIL branch never creates a Lot and instead walks
          RETURN_PENDING -> RETURNED with seller balance untouched; side-effect sets
          diverge completely per branch.
        test_recipe:
          setup:
            - "Two accepted+received offers O-pass (qty 10, agreed 6000) and O-fail (qty 7, agreed 6000) from the same seller, one bin capacity 100"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Foxtrot Surplus", contact_email: "fox@x.com" }
              as: BrokerOps
              captures: { s6_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-F1", capacity_units: 100 }
              as: BrokerOps
              captures: { bin6_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s6_id}", mpn: "LM358", quantity: 10, ask_price_per_unit_cents: 6000, provenance_doc_url: "https://docs.x.com/p6a.pdf" }
              as: Seller
              as_user_id: "${s6_id}"
              captures: { op_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s6_id}", mpn: "LM358", quantity: 7, ask_price_per_unit_cents: 6000, provenance_doc_url: "https://docs.x.com/p6b.pdf" }
              as: Seller
              as_user_id: "${s6_id}"
              captures: { of_id: $.data.id }
            - call: "POST /buy-offers/${op_id}/accept"
              payload: { agreed_unit_price_cents: 6000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${op_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${of_id}/accept"
              payload: { agreed_unit_price_cents: 6000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${of_id}/receive"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /buy-offers/${op_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${op_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin6_id}" }
              as: BrokerOps
              captures: { lot6_id: $.data.id }
            - call: "POST /buy-offers/${of_id}/inspect"
              payload: { outcome: "FAIL_DAMAGED", failure_note: "bent pins" }
              as: Inspector
            - call: "POST /buy-offers/${of_id}/initiate-return"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${of_id}/mark-returned"
              payload: {}
              as: BrokerOps
          assert:
            - "BuyOffer.${op_id}.status == CONVERTED and Lot.${lot6_id} exists with qty_available == 10"
            - "BuyOffer.${of_id}.status == RETURNED and GET /lots?buy_offer_id=${of_id} returns an empty array"
            - "StorageBin.${bin6_id}.occupied_units == 10 (only the PASS branch occupies capacity)"
            - "Seller.${s6_id}.account_balance_cents == 0 (FAIL branch never touches seller balance)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_order_lot_listing_and_seller
        grounds:
          - state_machines.SalesOrder.DELIVERED_to_SETTLED
          - calculations.lot_posture_derivation
        distinguishing_aspect: |
          Trigger POST /sales-orders/{id}/settle: SalesOrder -> SETTLED mutates Lot
          (qty_reserved->qty_sold), that Lot mutation forces posture recompute to
          DEPLETED which itself cascades the lot's ACTIVE Listing to SOLD_OUT, and in
          parallel the created SELLER_PAYOUT EscrowEntry increments
          Seller.account_balance_cents — depth >= 3 on two distinct chains from one
          trigger.
        test_recipe:
          setup:
            - "CONSIGNMENT lot L7 qty 10 fully ordered (qty 10), escrowed, DELIVERED; fee 1500 bps; clock 2026-11-04 (final_total 115190)"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Golf Components", contact_email: "golf@x.com" }
              as: BrokerOps
              captures: { s7_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cascade Buyer", contact_email: "cascade@x.com", credit_limit_cents: 200000, urgency_tier: "CRITICAL" }
