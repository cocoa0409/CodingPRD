  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: switching_approve_same_user_sod_then_other_user_succeeds
        claim_type: role_exclusive_denied
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.SwitchingOrder.ISSUED_to_APPROVED
        distinguishing_aspect: "Segregation of duties by X-User-ID: the issuer (op-1) cannot approve their own switching order; a different SystemOperator (op-2) can."
        test_recipe:
          setup: ["Outage confirmed; switching-gated work order CREATED; switching order ISSUED by op-1"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm R1", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - { call: "POST /om/outages/${ot}/confirm", payload: { customers_affected: 5, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "SWITCHING", required_crew_type: "LINE", requires_switching_order: true }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /om/switching-orders"
              payload: { work_order_id: "${wo}", switching_steps: ["Open breaker 7"] }
              as: SystemOperator
              as_user_id: "op-1"
              captures: { so: $.data.id }
            - { call: "POST /om/switching-orders/${so}/issue", payload: {}, as: SystemOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /om/switching-orders/${so}/approve", payload: {}, as: SystemOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
            - { call: "POST /om/switching-orders/${so}/approve", payload: {}, as: SystemOperator, as_user_id: "op-2", captures: { st: $.data.so_status, ap: $.data.approver_user_id } }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES (http 403) when approver == issuer"
            - "${st} == APPROVED with ${ap} == \"op-2\" when a different operator approves"

      - name: fema_full_chain_with_certifier_sod
        claim_type: role_exclusive_denied
        grounds:
          - state_machines.FemaClaim
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - calculations.fema_eligibility
        distinguishing_aspect: "Full FEMA lifecycle DRAFT->SUBMITTED->CERTIFIED->OBLIGATED->PAID with two SoD facts: the preparer (co-1) cannot certify; a second ClaimsOfficer (co-2) certifies; only Regulator obligates/pays. Also exercises the threshold_cents == 0 edge (0 >= 0 qualifies) and the snapshot freeze."
        test_recipe:
          setup: ["Event with zero outages demobilized (vacuous preconditions); DRAFT claim county C1 threshold 0"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm R2", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - { call: "POST /om/storm-events/${ev_id}/begin_demobilization", payload: {}, as: EmergencyDirector, captures: { evst: $.data.event_status } }
            - call: "POST /om/fema-claims"
              payload: { storm_event_id: "${ev_id}", county_code: "C1", threshold_cents: 0 }
              as: ClaimsOfficer
              captures: { fc: $.data.id }
          trigger:
            - { call: "POST /om/fema-claims/${fc}/submit", payload: {}, as: ClaimsOfficer, as_user_id: "co-1", captures: { st1: $.data.claim_status, snap: $.data.eligible_snapshot_cents } }
            - { call: "POST /om/fema-claims/${fc}/certify", payload: {}, as: ClaimsOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
            - { call: "POST /om/fema-claims/${fc}/certify", payload: {}, as: ClaimsOfficer, as_user_id: "co-2", captures: { st2: $.data.claim_status } }
            - { call: "POST /om/fema-claims/${fc}/obligate", payload: {}, as: Regulator, captures: { st3: $.data.claim_status } }
            - { call: "POST /om/fema-claims/${fc}/mark_paid", payload: {}, as: Regulator, captures: { st4: $.data.claim_status } }
          assert:
            - "Demobilization with zero outages succeeds vacuously: ${evst} == DEMOBILIZING"
            - "Submit at threshold edge: ${st1} == SUBMITTED with ${snap} == 0 (0 >= 0 qualifies) and preparer_user_id == \"co-1\""
            - "SoD: ${err} == ERR_SEGREGATION_OF_DUTIES when co-1 certifies their own submission"
            - "${st2} == CERTIFIED (co-2), ${st3} == OBLIGATED (Regulator), ${st4} == PAID (terminal)"

      - name: field_crew_lead_cannot_arrive_other_crews_work_order
        claim_type: role_exclusive_denied
        grounds:
          - errors[ERR_OWNERSHIP_MISMATCH]
          - roles[FieldCrewLead]
        distinguishing_aspect: "entity_backed identity: X-User-ID of a FieldCrewLead must equal the assigned Crew.id; crew L-2 arriving L-1's work order is rejected."
        test_recipe:
          setup: ["Outage confirmed; assessment accepted; REPAIR work order DISPATCHED to crew L-1; second crew L-2 exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm R3", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - call: "POST /om/outages/${ot}/confirm"
              payload: { customers_affected: 5, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/crews"
              payload: { crew_code: "L-1", crew_type: "LINE", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_l1: $.data.id }
            - call: "POST /om/crews"
              payload: { crew_code: "L-2", crew_type: "LINE", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_l2: $.data.id }
            - { call: "POST /om/crews/${cr_l1}/start_shift", payload: {}, as: Dispatcher }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da: $.data.id }
            - { call: "POST /om/damage-assessments/${da}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/assign", payload: { crew_id: "${cr_l1}" }, as: Dispatcher }
          trigger:
            - { call: "POST /om/work-orders/${wo}/arrive", payload: {}, as: FieldCrewLead, as_user_id: "${cr_l2}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OWNERSHIP_MISMATCH (http 403); WorkOrder.${wo}.arrived_at remains null; Crew.${cr_l1} remains EN_ROUTE"

      - name: regulator_cannot_submit_claims
        claim_type: role_exclusive_denied
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - roles[Regulator]
        distinguishing_aspect: "Regulator (obligate/mark_paid only) calling submit gets ERR_FORBIDDEN_ROLE — role check (p2) fires before the claim's state check (p4)."
        test_recipe:
          setup: ["Event ACTIVE; DRAFT claim exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm R4", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/fema-claims"
              payload: { storm_event_id: "${ev_id}", county_code: "C1", threshold_cents: 1000 }
              as: ClaimsOfficer
              captures: { fc: $.data.id }
          trigger:
            - { call: "POST /om/fema-claims/${fc}/submit", payload: {}, as: Regulator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE (http 403) — not ERR_EVENT_NOT_DEMOBILIZING, proving role ordering ahead of state"

