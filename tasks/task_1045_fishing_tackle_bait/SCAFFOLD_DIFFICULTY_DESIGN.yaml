              payload: { guide_id: "${g_id}", title: "Trio", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T12:00:00Z", capacity: 3, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
