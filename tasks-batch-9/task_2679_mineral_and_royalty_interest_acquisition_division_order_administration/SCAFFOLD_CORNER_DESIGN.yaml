  - name: entity_version_increments_on_every_write
    claim_type: optimistic_concurrency
    grounds:
    - response_envelope.common_fields.version
    - endpoints[PATCH /royalty-owners/{id}]
    distinguishing_aspect: "version is a per-row write counter, not a timestamp: two successive PATCHes of the same owner leave version at the creation value plus 2, and a read between them does not advance it."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "one registered owner"
      setup_api_calls:
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: false }
        as: DivisionOrderAdmin
        captures: { x3o: $.data.id, x3v: $.data.version }
      trigger:
      - call: "GET /royalty-owners/${x3o}"
        payload: {}
        as: DivisionOrderAdmin
      - call: "PATCH /royalty-owners/${x3o}"
        payload: { tax_id_on_file: true }
        as: DivisionOrderAdmin
      - call: "PATCH /royalty-owners/${x3o}"
        payload: { mailing_address: "9 Pecos Rd, Pecos TX" }
        as: DivisionOrderAdmin
      assert:
      - "the GET returns version == ${x3v} - reads never advance the counter"
      - "the first PATCH returns version == ${x3v} + 1 with tax_id_on_file true"
