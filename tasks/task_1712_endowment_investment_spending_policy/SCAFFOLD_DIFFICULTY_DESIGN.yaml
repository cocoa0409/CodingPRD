            - { call: "GET /endowment/distributions/${ec_d}", as: InvestmentOfficer, captures: { ec_d_st: $.data.distribution_status, ec_d_final: $.data.final_amount_cents, ec_d_exc: $.data.applied_exception_id } }
            - { call: "GET /endowment/funds/${ec_fund}", as: InvestmentOfficer, captures: { ec_posture: $.data.spending_posture } }
          assert:
            - "PolicyException.${ec_ex}.exception_status == EXPIRED (FY2026's last quarter 4 closed unused)"
            - "SpendingDistribution.${ec_d}.distribution_status == PROPOSED (reverted by the expiry, not by the finalize directly)"
            - "SpendingDistribution.${ec_d}.final_amount_cents == 0 (recomputed: still underwater, no exception left)"
            - "SpendingDistribution.${ec_d}.applied_exception_id is null"
            - "Fund.${ec_fund}.spending_posture == SPENDING_SUSPENDED (EXCEPTION_ACTIVE exited when the exception did)"

      - name: exception_rescind_cascades_distribution_revert_and_posture_depth2
        grounds:
          - state_machines.PolicyException.APPROVED_to_RESCINDED
          - state_machines.SpendingDistribution.APPROVED_to_PROPOSED
          - state_machines.Fund.EXCEPTION_ACTIVE_to_SPENDING_SUSPENDED
        distinguishing_aspect: |
          Depth-2 chain fired by a different trigger (POST rescind, not a finalize):
          rescinding the APPROVED exception (link 1) reverts the citing distribution to
          PROPOSED with final_amount recomputed to 0 (link 2) and flips the fund posture
          back to SPENDING_SUSPENDED (link 2's sibling effect of the same exception exit).
        test_recipe:
          setup:
            - "Same underwater arrangement as the sibling instance: Pool RC2 with policy ADOPTED, fund FEC... (FRESC) underwater since Q2 (price 40000), exception (FY2026, 300000) APPROVED, FY2026 distribution APPROVED with final_amount 300000 citing the exception"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool RC2", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { rc_pool: $.data.id, rc_pv: $.data.version } }
