          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "oic@example.com", full_name: "O IC", phone: "+12025559130" }
              as: Anonymous
              captures: { oic_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "sic@example.com", full_name: "S IC", phone: "+12025559131" }
              as: Anonymous
              captures: { sic_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${sic_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bgic_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bgic_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${oic_id}", name: "IC", species: "DOG", weight_kg: 9 }
              as: Owner
              as_user_id: "${oic_id}"
              captures: { pic_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${oic_id}", sitter_id: "${sic_id}", pet_id: "${pic_id}", scheduled_at: "2026-07-06T07:30:00Z" }
              as: Owner
              as_user_id: "${oic_id}"
              captures: { mgic_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgic_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${oic_id}"
          trigger:
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${oic_id}", sitter_id: "${sic_id}", pet_id: "${pic_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-07-06T09:00:00Z", end_at: "2026-07-06T10:00:00Z" }
              as: Owner
              as_user_id: "${oic_id}"
              captures: { bic_id: $.data.id, bic_quote: $.data.booking_quote_cents, bic_version: $.data.version }
          assert:
            - "Booking.${bic_id}.booking_quote_cents == 3500  # present in CREATE response, immediate"
            - "Booking.${bic_id}.version == 1"
