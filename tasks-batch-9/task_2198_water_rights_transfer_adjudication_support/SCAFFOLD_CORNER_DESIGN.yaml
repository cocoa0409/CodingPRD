  - section: state_machines
    instances:
      - name: sm_water_right_activate_authorizes_pods_and_refreshes_risk
        claim_type: valid_transition
        grounds:
          - state_machines.WaterRight.UNADJUDICATED_to_ACTIVE
          - state_machines.PointOfDiversion.PROPOSED_to_AUTHORIZED
          - calculations.forfeiture_risk_score
        distinguishing_aspect: >-
          One activation moves three rows: the right to ACTIVE and EVERY PROPOSED
          point of diversion on it to AUTHORIZED (cascade down, not just the
          first one), while re-running the risk score so the derived band is
          fresh in the same response.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A; UNADJUDICATED right with authorized_diversion_af 400.00; TWO PROPOSED points of diversion; one 2018 METER record of 300.000 AF on 100.00 acres."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/points-of-diversion", payload: {legal_description: "NE1/4 SEC 12 T3N R4E headgate", stream_reach_code: "SNK-14-A", max_rate_cfs: 5.000, stream_miles_from_headwater: 41.20}, as: WaterRightsAnalyst, captures: {pod1: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/points-of-diversion", payload: {legal_description: "SW1/4 SEC 18 T3N R4E headgate", stream_reach_code: "SNK-14-B", max_rate_cfs: 3.000, stream_miles_from_headwater: 46.80}, as: WaterRightsAnalyst, captures: {pod2: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2018, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
