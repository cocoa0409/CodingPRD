            - call: "POST /exercises/${exSmallC_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exBigC_id}/execution-transitions"
              payload: { action: "CANCEL", reason: "Business owner withdrew the production window" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "after the first schedule Site.${sr_id}.reserved_capacity_units == 6"
            - "after the second schedule Site.${sr_id}.reserved_capacity_units == 8 == 6 + 2"
            - "after the cancellation Site.${sr_id}.reserved_capacity_units == 2, exactly the sum over the remaining exercises in {SCHEDULED, IN_EXECUTION, FAILOVER_COMPLETE}"
            - "Exercise.${exBigC_id}.execution_state == CANCELLED with closure_reason == CANCELLED_BY_COORDINATOR, and its required_capacity_units field still reads 6 — the release is a recompute of the site, not an erasure of the exercise"
            - "Exercise.${exSmallC_id}.execution_state == SCHEDULED, untouched by the neighbour's cancellation"
            - "reserved_capacity_units never went negative and never exceeded usable_capacity_units of 40 at any step"

      - name: open_finding_count_returns_to_zero_after_every_finding_is_withdrawn
        grounds:
