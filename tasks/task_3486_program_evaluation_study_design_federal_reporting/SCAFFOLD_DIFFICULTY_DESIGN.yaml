              payload: { decision: "ACCEPTED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/reports/${report_id}/publish"
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Second Evaluation", award_amount_cents: 50000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_b: $.data.id }
            - call: "POST /evaluation/contracts/${contract_b}/studies"
              payload: { title: "Secondary Study", research_question: "Exploratory" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_b: $.data.id }
          trigger:
            - call: "POST /evaluation/contracts/${contract_b}/terminate"
              payload: { reason: "Agency descope" }
              as: AgencyOfficer
              as_user_id: "ao-1"
          assert:
            - "Contract A: disbursed_cents == 30000000, forfeited_cents == 0, remaining_cents == 60000000; disbursed + forfeited + remaining == 90000000"
            - "Contract B after terminate: disbursed_cents == 0, forfeited_cents == 50000000, remaining_cents == 0; sum == award_amount_cents == 50000000"
            - "Study.${study_b}.status == TERMINATED (terminate cascade)"
