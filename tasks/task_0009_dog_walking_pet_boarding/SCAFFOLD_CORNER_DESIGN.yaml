            - call: "POST /api/v1/background-checks/${bgocc_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${oocc_id}", name: "OCC", species: "DOG", weight_kg: 8 }
              as: Owner
              as_user_id: "${oocc_id}"
              captures: { pocc_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T08:00:00Z" }
