      - name: clock_regression_rejected
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - errors[ERR_INVALID_CLOCK_VALUE]
        distinguishing_aspect: 'The logical clock is monotonic non-decreasing: setting it to 2026-08-01 (before the startup default 2026-09-01T00:00:00Z) fails ERR_INVALID_CLOCK_VALUE and the clock still
          reads the default.'
        test_recipe:
          setup:
            - no clock call has been made; the clock reads the startup default 2026-09-01T00:00:00Z
          setup_api_calls: []
          trigger:
            - call: POST /_clock/set_current_utc
              payload:
                to_iso8601: '2026-08-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                err: $.data.error_id
            - call: POST /_clock/set_current_utc
              payload:
                to_iso8601: '2026-09-15T00:00:00Z'
              as: ProgramOfficer
              captures:
                cur: $.data.current_utc
          assert:
            - regressive set fails with error_id == ERR_INVALID_CLOCK_VALUE (http 400)
            - a later valid set succeeds and reads back 2026-09-15T00:00:00Z
  - section: consistency_model
    instances:
      - name: award_issuance_response_immediate
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/grants/applications/{id}/award
          - calculations.award_budget_build
        distinguishing_aspect: 'Immediate consistency: the award issuance RESPONSE already carries the computed budget (total 30000000, period_total_cents [30000000], end_date 2028-01-01), and a read of
          the institute in the same sequence shows committed_cents 30000000 — no re-read or settling delay.'
