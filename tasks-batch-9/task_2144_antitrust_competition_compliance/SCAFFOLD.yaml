  # ----------------------------------------------------------- Test-driving clock
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is EXACTLY 2026-08-01T00:00:00Z; before any call to this endpoint every time-dependent rule (training expiry, agenda lead time, meeting attendance confirmation, HSR waiting period, marker validity, drill windows) evaluates against that fixed instant and never against real wall-clock time. Moving the clock never retro-fires cascades; time-gated transitions are evaluated lazily on the next request that touches the affected row."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock used by every subsequent request is set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of ComplianceAdmin / AntitrustCounsel / BusinessLead / Employee" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not listed in the endpoint's §1.5 roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "an entity_backed actor (BusinessLead, Employee) targets a resource owned by a different BusinessUnit / EmployeeProfile than its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the acting counsel already performed the incompatible prior step — legal clearance on the participation whose minutes they are reviewing, or the minutes review on the attendance whose remediation they are closing" }

  # --- request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required field is missing, an enum member is undeclared, a numeric value is out of its declared range, affected_years is empty, or a datetime is not ISO 8601 UTC" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset negative" }

  # --- existence
  - { id: ERR_BUSINESS_UNIT_NOT_FOUND, http: 404, condition: "business_unit_id in path or body does not resolve" }
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "employee_id in path or body does not resolve" }
  - { id: ERR_CURRICULUM_NOT_FOUND, http: 404, condition: "curriculum_id in path or body does not resolve" }
  - { id: ERR_TRAINING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "training assignment id in path does not resolve" }
  - { id: ERR_ASSOCIATION_NOT_FOUND, http: 404, condition: "association_id in path or body does not resolve" }
  - { id: ERR_PARTICIPATION_NOT_FOUND, http: 404, condition: "participation id in path or participation_id in body does not resolve" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "meeting_id in path or body does not resolve" }
  - { id: ERR_ATTENDANCE_NOT_FOUND, http: 404, condition: "meeting attendance id in path does not resolve" }
  - { id: ERR_CONTACT_NOT_FOUND, http: 404, condition: "competitor contact id in path or source_contact_id in body does not resolve" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "transaction id in path or transaction_id in body does not resolve" }
  - { id: ERR_HSR_ANALYSIS_NOT_FOUND, http: 404, condition: "hsr analysis id in path does not resolve" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "site id in path or site_id in body does not resolve" }
  - { id: ERR_DRILL_NOT_FOUND, http: 404, condition: "readiness drill id in path does not resolve" }
  - { id: ERR_DOCUMENT_AUDIT_NOT_FOUND, http: 404, condition: "document audit id in path does not resolve" }
  - { id: ERR_LENIENCY_APPLICATION_NOT_FOUND, http: 404, condition: "leniency application id in path does not resolve" }
  - { id: ERR_RISK_ASSESSMENT_NOT_FOUND, http: 404, condition: "risk assessment id in path does not resolve" }

  # --- optimistic concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_business_unit_version / expected_transaction_version does not equal the parent's current version" }

  # --- state
  - { id: ERR_INVALID_STATE, http: 409, condition: "the requested transition is not declared in §1.2 from the target's current state (including every attempt from a terminal state and every repeat of an already-applied transition)" }
  - { id: ERR_BUSINESS_UNIT_FROZEN, http: 409, condition: "BusinessUnit.posture == FROZEN and the endpoint is one of the posture-gated writes" }
  - { id: ERR_BUSINESS_UNIT_RESTRICTED, http: 409, condition: "BusinessUnit.posture == RESTRICTED and a new participation is being created" }
  - { id: ERR_PARTICIPATION_NOT_ACTIVE, http: 409, condition: "an attendance is booked against a participation whose status != ACTIVE" }
  - { id: ERR_TRANSACTION_NOT_ANALYZED, http: 409, condition: "filing is attempted while the transaction is not ANALYZED, or while its ACTIVE analysis has filing_required == false" }
  - { id: ERR_MARKER_NOT_GRANTED, http: 409, condition: "a disclosure is submitted while marker_status NOT IN {MARKER_REQUESTED, MARKER_GRANTED}" }
  - { id: ERR_MARKER_ALREADY_HELD, http: 409, condition: "the unit already holds a live marker (MARKER_REQUESTED / MARKER_GRANTED / PERFECTED) for the same cartel_code" }
  - { id: ERR_WAITING_PERIOD_ACTIVE, http: 409, condition: "HSR clearance is recorded before the logical clock reaches waiting_period_end" }

  # --- business: safety / referential / constraint / temporal / fiscal
  - { id: ERR_RISK_BAND_TOO_LOW, http: 422, condition: "a marker is requested while the unit has no ACTIVE RiskAssessment, or its risk_band NOT IN {HIGH, SEVERE}" }
  - { id: ERR_TRAINING_NOT_CURRENT, http: 422, condition: "a SALES or PRICING employee whose training_status != CURRENT logs a contact, is nominated, is submitted for approval, or is granted clearance" }
  - { id: ERR_CLEARANCE_NOT_GRANTED, http: 422, condition: "an attendance is booked for a delegate whose clearance_status != GRANTED" }
  - { id: ERR_ASSOCIATION_NOT_APPROVED, http: 422, condition: "a participation is created or submitted, or a meeting scheduled, for an association whose status != APPROVED" }
  - { id: ERR_CURRICULUM_ROLE_MISMATCH, http: 422, condition: "a curriculum is assigned to an employee whose role_category is not in the curriculum's target_role_categories" }
  - { id: ERR_DUPLICATE_PARTICIPATION, http: 409, condition: "a live participation already exists for the same (business_unit_id, association_id, employee_id) triple" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "scheduled_end <= scheduled_start, or window_end <= window_start" }
  - { id: ERR_AGENDA_DEADLINE_MISSED, http: 422, condition: "the meeting's agenda has not been received, or the meeting starts less than 48 hours after the current logical clock" }
  - { id: ERR_ATTENDEE_WINDOW_CONFLICT, http: 409, condition: "the delegate's closed occupancy interval [scheduled_start - 60min, scheduled_end] intersects one of their other occupying attendances, endpoints included" }
  - { id: ERR_SITE_DRILL_CAPACITY_EXCEEDED, http: 409, condition: "adding the candidate drill would exceed Site.concurrent_drill_capacity at some instant in the half-open window" }
  - { id: ERR_REVIEW_MINUTES_EXCEEDED, http: 422, condition: "legal clearance would push BusinessUnit.review_minutes_consumed above BusinessUnit.review_minutes_budget" }
  - { id: ERR_EXPOSURE_BUDGET_EXCEEDED, http: 422, condition: "logging the contact would push BusinessUnit.exposure_points above BusinessUnit.exposure_budget_points" }

# =============================================================================
# §1.7 RBAC Matrix  (segregation of duties)
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Programme administrator. Owns reference data (business units, employees, curricula, assignments, associations, meetings, sites) and records external agency decisions on leniency filings. Never adjudicates compliance questions."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/business-units"
      - "POST /compliance/employees"
      - "POST /compliance/training-curricula"
      - "POST /compliance/training-assignments"
      - "POST /compliance/trade-associations"
      - "POST /compliance/association-meetings"
      - "POST /compliance/sites"
      - "POST /compliance/leniency-applications/{id}/marker-decisions"
      - "POST /compliance/leniency-applications/{id}/disclosure-decision"
      - "POST /compliance/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "POST /compliance/readiness-drills and its start / completion / abort actions (shared with AntitrustCounsel)"

  - name: AntitrustCounsel
    description: "Corporate antitrust counsel. Adjudicates every compliance decision: association approval, participation legal clearance, minutes review, contact review/clearance/escalation, risk assessment, HSR analysis and filing, document audits, and leniency strategy. Segregation of duties is enforced on this role's X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/business-units/{id}/exposure-adjustments"
      - "POST /compliance/employees/{id}/clearance-grants"
      - "POST /compliance/employees/{id}/clearance-revocations"
      - "POST /compliance/training-assignments/{id}/waiver"
      - "POST /compliance/trade-associations/{id}/approval"
      - "POST /compliance/participations/{id}/legal-clearance"
      - "POST /compliance/participations/{id}/reinstatement"
      - "POST /compliance/meeting-attendances/{id}/minutes-review"
      - "POST /compliance/meeting-attendances/{id}/remediation-closure"
      - "POST /compliance/competitor-contacts/{id}/review-opening"
      - "POST /compliance/competitor-contacts/{id}/remediation-order"
      - "POST /compliance/competitor-contacts/{id}/clearance"
      - "POST /compliance/competitor-contacts/{id}/escalation"
      - "POST /compliance/transactions/{id}/filing"
      - "POST /compliance/transactions/{id}/clearance"
      - "POST /compliance/hsr-analyses"
      - "POST /compliance/document-audits"
      - "POST /compliance/document-audits/{id}/findings"
      - "POST /compliance/leniency-applications"
      - "POST /compliance/leniency-applications/{id}/marker-request"
      - "POST /compliance/leniency-applications/{id}/disclosure-submission"
      - "POST /compliance/leniency-applications/{id}/withdrawal"
      - "POST /compliance/risk-assessments"
    shared_operations:
      - "all GET endpoints"
      - "POST /compliance/participations/{id}/termination (shared with BusinessLead)"
      - "POST /compliance/readiness-drills and its start / completion / abort actions (shared with ComplianceAdmin)"

  - name: BusinessLead
    description: "Business-unit leadership. X-User-ID is the BusinessUnit id the lead speaks for; every write must target that unit's own resources."
    identity: "entity_backed:BusinessUnit"
    exclusive_operations:
      - "POST /compliance/participations"
      - "POST /compliance/participations/{id}/submission"
      - "POST /compliance/participations/{id}/business-justification"
      - "POST /compliance/meeting-attendances"
      - "POST /compliance/meeting-attendances/{id}/cancellation"
      - "POST /compliance/transactions"
    shared_operations:
      - "all GET endpoints"
      - "POST /compliance/participations/{id}/termination (shared with AntitrustCounsel)"

  - name: Employee
    description: "Individual in a sales, pricing, legal or other role. X-User-ID is the EmployeeProfile id; every write must target that person's own training, contacts and attendances."
    identity: "entity_backed:EmployeeProfile"
    exclusive_operations:
      - "POST /compliance/training-assignments/{id}/start"
      - "POST /compliance/training-assignments/{id}/completion"
      - "POST /compliance/competitor-contacts"
      - "POST /compliance/competitor-contacts/{id}/remediation-response"
      - "POST /compliance/meeting-attendances/{id}/attendance-confirmation"
      - "POST /compliance/meeting-attendances/{id}/minutes"
    shared_operations:
      - "all GET endpoints"
