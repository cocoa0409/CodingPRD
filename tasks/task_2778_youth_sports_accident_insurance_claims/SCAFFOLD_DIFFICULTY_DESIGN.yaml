          The dependency spans TWO hops rather than one: adjudicating a Claim reads its LeaguePolicy's
          coverage_posture, which is itself derived from the grandparent League's sanctioning_status.
          Suspending the League - an entity the adjudication payload never mentions - freezes the policy
          and makes the adjudication fail 409 ERR_POLICY_FROZEN; reinstating the League thaws the policy
