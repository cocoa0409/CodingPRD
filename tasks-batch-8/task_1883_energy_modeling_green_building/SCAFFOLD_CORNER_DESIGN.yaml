          assert: ["HTTP 404, captured err == ERR_TEAM_MEMBER_NOT_FOUND"]

      - name: get_credit_entry_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CREDIT_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent entry UUID yields 404 ERR_CREDIT_ENTRY_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
