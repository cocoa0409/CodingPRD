  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: store_dock_tolerates_overlap_up_to_the_door_count_and_ignores_adjacency
        grounds:
          - calculations.dock_capacity_occupancy
          - validations[priority 14 temporal]
          - errors.ERR_DOCK_CAPACITY_EXCEEDED
          - entities.Store.dock_count
          - endpoints[POST /fleet/trips/{trip_id}/plan]
        distinguishing_aspect: |
          RESOURCE: Store dock doors. INTERVAL SEMANTICS: HALF-OPEN
          [scheduled_arrival_at, scheduled_departure_at) with AGGREGATE
          capacity - overlap is legal until the number of overlapping
          committed stops reaches dock_count, and a stop whose arrival equals
          another's departure never collides at all. With dock_count == 1 the
          rule degenerates to exclusion, which is what makes the adjacency
          question decidable: TRIP-2 (09:00-11:00) collides with TRIP-1
          (08:00-10:00) while TRIP-3 (10:00-12:00) does not. The check also
          only counts stops of committed trips, so all three trips are staffed
          BEFORE any of them is planned and the outcome depends purely on plan
          order. Different resource and opposite adjacency rule from the
          tractor instance, and unlike the driver instance no separation is
          required at all.
        test_recipe:
          setup:
            - "Store S-1009 has dock_count 1, unloads 600 cases/hour and is open around the clock; every delivery is 600 cases, so service_minutes is 75 everywhere and no HOS or capacity gate can interfere."
            - "Three drivers, three tractors and three trailers exist: assignment reserves equipment, so each trip needs its own set and the driver rest gap never applies across different drivers."
            - "All three trips are staffed while every trip is still DRAFT. DRAFT stops are outside the occupancy input set, so no assignment can fail on dock capacity and the whole experiment is decided by the three plan calls."
            - "TRIP-1 occupies [08:00, 10:00), TRIP-2 [09:00, 11:00) and TRIP-3 [10:00, 12:00) on 2026-08-10."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
