  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-ID/X-User-Role headers fails priority-1 auth with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "No Header", customer_type: "RESIDENTIAL", email: "x@example.com", phone: "1" }, as: OfficeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "When the request is sent with auth headers stripped: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"
            - "Header auth precedes role/permission checks (priority 1 < 2)"

      - name: quote_create_assessment_property_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ASSESSMENT_PROPERTY_MISMATCH]"]
        distinguishing_aspect: "Quoting property B with an assessment that belongs to property A fails ERR_ASSESSMENT_PROPERTY_MISMATCH (422)."
