          assert:
            - "captured err == ERR_FORBIDDEN, HTTP 403"
            - "RiskReport.${rep}.status remains DRAFT"

      - name: riskowner_cannot_attest_control_forbidden
        claim_type: rbac_denial
        grounds: ["roles[ControlOwner]", "roles[RiskOwner]"]
        distinguishing_aspect: "Attestation is exclusive to ControlOwner; RiskOwner is denied."
        test_recipe:
          setup: ["control UNDER_REVIEW"]
          setup_api_calls:
