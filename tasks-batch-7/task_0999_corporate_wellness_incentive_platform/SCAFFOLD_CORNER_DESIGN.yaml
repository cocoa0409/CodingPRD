      - name: event_duplicate_key_conflict_rejected
        claim_type: idempotency
        grounds: ["errors[ERR_DUPLICATE_EVENT]", endpoints.POST_/wellness/activity-events]
        distinguishing_aspect: "Same idempotency key with a different quantity is a conflict: ERR_DUPLICATE_EVENT (409), and no state changes."
