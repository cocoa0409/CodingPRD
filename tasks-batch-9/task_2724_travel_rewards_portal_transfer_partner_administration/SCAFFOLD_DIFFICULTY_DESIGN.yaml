          setup:
            - "One CORE account holding 40000 points from a single 4000000-cent GROCERY transaction."
            - "One ACTIVE agency with markup 0 bps and tolerance 0 bps."
            - "One OPEN offer: net_rate_cents 10000, agency_public_price_cents 10000, agency_public_seats 4, portal_seats 4, tax_cents 0, so portal_price_cents is 10000, parity_status IN_PARITY and each CORE booking debits 10000 points."
            - "Two QUOTED orders already committed against the offer, then a resync that lowers portal_seats to 2 while leaving net_rate_cents and agency_public_price_cents alone."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
