  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_admission_depends_on_channel_connection_state
        grounds:
          - validations[priority=12]
          - state_machines.ChannelConnection
          - errors[ERR_CONNECTION_NOT_SELLABLE]
          - endpoints[POST /distribution/reservations]
        distinguishing_aspect: |
          Entity pair Reservation x ChannelConnection: whether a booking is admitted at all is read off
          a THIRD entity's state (the channel's connection), and the dependency is re-evaluated in both
          directions - PENDING refuses, HEALTHY admits, and a later SUSPENDED refuses again
          without anything about the reservation, the plan or the inventory having changed.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING (capacity 10, ceiling 11), inventory day 2026-09-10 open with no allotments (shared_pool_units 11)."
            - "Rate plan BAR ACTIVE at 25000 with floor 18000, no promotions."
            - "Channel OTA1 (commission_bp 1750) has a ChannelConnection that is created but deliberately NOT activated, so connection_state == PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_10_id: $.data.id }
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_ok_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
          assert:
            - "First booking attempt (connection PENDING): HTTP 409 with data.error_id == ERR_CONNECTION_NOT_SELLABLE, and InventoryDay.${inv_10_id}.committed_units stays 0 (a refused booking commits nothing)"
            - "After activate: ChannelConnection.${conn_id}.connection_state == HEALTHY, consecutive_failures == 0, suspended_at == null"
            - "Second booking attempt: HTTP 201, Reservation.${res_ok_id}.reservation_state == CONFIRMED, nightly_breakdown == [{stay_date: 2026-09-10, sell_rate_cents: 25000, commissionable_cents: 25000, commission_cents: 4375}], gross_amount_cents == 25000, commission_amount_cents == 4375, net_amount_cents == 20625, overbooking_overridden == false"
            - "InventoryDay.${inv_10_id}.committed_units == 1, allocated_units == 0, shared_pool_units == 10"
            - "After the three ERROR heartbeats: ChannelConnection.${conn_id}.connection_state == SUSPENDED, consecutive_failures == 3, suspended_at == 2026-08-25T00:00:00.000Z, last_failure_code == TIMEOUT"
            - "Third booking attempt: HTTP 409 with data.error_id == ERR_CONNECTION_NOT_SELLABLE again, and InventoryDay.${inv_10_id}.committed_units is still 1 - the identical request that just succeeded is now refused purely because the other entity moved"
            - "Reservation.${res_ok_id}.reservation_state is still CONFIRMED: suspending the connection does not retroactively cancel bookings already taken through it"

