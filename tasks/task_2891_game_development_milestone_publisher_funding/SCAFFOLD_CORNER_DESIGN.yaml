              captures: { b1_id: $.data.id }
          assert:
            - "trigger call 1 -> HTTP 403 with data.error_id == ERR_NOT_AGREEMENT_PARTY (403, not 404: the row exists, the actor simply is not a party)"
            - "trigger call 2 -> HTTP 403 with data.error_id == ERR_NOT_AGREEMENT_PARTY on the computed read as well"
            - "trigger call 3 -> HTTP 403 with data.error_id == ERR_NOT_AGREEMENT_PARTY and Milestone.${m1_id}.latest_build_number still 0, proving priority 20 runs before the build rules at 31/46/48"
