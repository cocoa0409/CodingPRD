              captures: { o1_id: $.data.id }
          trigger:
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /players/${p1_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /contract-offers/${o1_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /organizations/${org_id}/cap-summary"
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "POST /sponsorship-deals"
              payload: { organization_id: "${org_id}", sponsor_name: "Volt Surge", exclusivity_category: "ENERGY_DRINK", total_fee_cents: 1000000, deliverable_count_required: 1, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /sponsorship-deals/${deal_id}/activate"
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { deal_v2: $.data.version }
            - call: "POST /sponsorship-deals/${deal_id}/deliverables"
              payload: { contract_id: "${c1_id}", deliverable_type: "STREAM_SEGMENT", due_at: "2026-08-20T00:00:00Z", expected_deal_version: "${deal_v2}" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /deliverable-assignments/${d1_id}/submit"
              payload: { submission_note: "VOD uploaded" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
            - call: "POST /deliverable-assignments/${d1_id}/review"
              payload: { decision: "APPROVE", review_note: "Looks good" }
              as: SponsorshipManager
