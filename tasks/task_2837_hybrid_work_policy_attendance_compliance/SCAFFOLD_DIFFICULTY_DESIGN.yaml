# ===========================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  -  SKILL.md §1.8 test-targeting index
# Task: 2837 Hybrid Work Policy & Attendance Compliance
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this file
# leaves declared behaviour identical; it exists to drive test coverage.
#
# Shared conventions used by every test_recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (ISO 2026-W31) and is
#     moved explicitly to 2026-09-01T09:00:00Z (ISO 2026-W36) by the first
#     setup call, so every fixture week lies in the future-relative-to-nothing
#     but strictly inside the policy cycle window.
#   * ISO week Mondays used throughout: W37=2026-09-07, W38=2026-09-14,
#     W39=2026-09-21, W40=2026-09-28, W41=2026-10-05, W42=2026-10-12,
#     W43=2026-10-19.
#   * Opaque-role callers pin as_user_id only where segregation of duties or a
#     manager-identity precondition depends on it.
#   * Every numeric literal in an `assert:` was computed by executing the
#     matching §1.3 formula with Decimal/ROUND_HALF_UP.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: credited_days_union_versus_corroborated
        grounds:
          - calculations.credited_office_days
          - entities.AttendanceWeek.fields.variant_applied
          - entities.AttendanceWeek.fields.credited_days
          - entities.Team.fields.signal_corroboration_required
          - entities.ComplianceSignal.fields.signal_source
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED
        distinguishing_aspect: |
          The two variants of credited_office_days live in the attendance-evidence
          domain and are selected by Team.signal_corroboration_required, not by a
          lifecycle position: fed the byte-identical five-signal set, SIGNAL_UNION
          credits 3 days while SIGNAL_CORROBORATED credits 1, because the union
          reading accepts a badge-only or network-only date whereas the
          corroborated reading demands both automated sources on the same date.
        test_recipe:
          setup:
            - "One OPEN policy cycle FY27-H1 with days_in_office_floor 2."
            - "Team T1-CORE with signal_corroboration_required false, headcount 25, 5 expected days."
            - "Team T2-FIELD with signal_corroboration_required true, headcount 12, 3 expected days."
            - "Employee E-1001 on T1-CORE and employee E-2001 on T2-FIELD, both ACTIVE, both with no eligibility classification so current_eligibility_class is the ONSITE_REQUIRED default and required_days resolves to 5."
            - "Both employees have an OPEN AttendanceWeek for 2026-W37 carrying the same five signals: BADGE 480 min on 2026-09-08, NETWORK 300 min on 2026-09-08, BADGE 480 min on 2026-09-09, NETWORK 480 min on 2026-09-10, BADGE 120 min on 2026-09-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-H1", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 5, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 25, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T2-FIELD", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: true }
              as: WorkplaceProgramOffice
              captures: { t2_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t2_id}", employee_number: "E-2001", work_email: "e2001@corp.example", home_timezone: "America/Chicago", tenure_start_date: "2023-11-06", demographic_band: "BAND_B", manager_user_id: "mgr-2", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e2_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w1_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e2_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w2_id: $.data.id }
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "NETWORK", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 300, dedupe_key: "N-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-09", minutes_present: 480, dedupe_key: "B-0909" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "NETWORK", site_code: "NYC-01", observed_date: "2026-09-10", minutes_present: 480, dedupe_key: "N-0910" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-11", minutes_present: 120, dedupe_key: "B-0911" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/signals"
              payload: { signal_source: "BADGE", site_code: "CHI-02", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/signals"
              payload: { signal_source: "NETWORK", site_code: "CHI-02", observed_date: "2026-09-08", minutes_present: 300, dedupe_key: "N-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/signals"
              payload: { signal_source: "BADGE", site_code: "CHI-02", observed_date: "2026-09-09", minutes_present: 480, dedupe_key: "B-0909" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/signals"
              payload: { signal_source: "NETWORK", site_code: "CHI-02", observed_date: "2026-09-10", minutes_present: 480, dedupe_key: "N-0910" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/signals"
              payload: { signal_source: "BADGE", site_code: "CHI-02", observed_date: "2026-09-11", minutes_present: 120, dedupe_key: "B-0911" }
              as: SystemIntegration
          trigger:
            - call: "POST /attendance-weeks/${w1_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2_id}/finalize"
              payload: {}
              as: SystemIntegration
          assert:
            - "AttendanceWeek.${w1_id}.variant_applied == SIGNAL_UNION"
            - "AttendanceWeek.${w1_id}.credited_days == 3"
            - "AttendanceWeek.${w2_id}.variant_applied == SIGNAL_CORROBORATED"
            - "AttendanceWeek.${w2_id}.credited_days == 1"
            - "AttendanceWeek.${w1_id}.credited_days - AttendanceWeek.${w2_id}.credited_days == 2 for byte-identical signal sets"
            - "AttendanceWeek.${w1_id}.required_days == 5 and AttendanceWeek.${w2_id}.required_days == 5"
            - "AttendanceWeek.${w1_id}.shortfall_days == 2"
            - "AttendanceWeek.${w2_id}.shortfall_days == 4"
            - "Employee.${e1_id}.non_compliance_pressure == 4.00"
            - "Employee.${e1_id}.escalation_stage == WRITTEN_WARNING"
            - "Employee.${e2_id}.non_compliance_pressure == 7.00"
            - "Employee.${e2_id}.escalation_stage == PERFORMANCE_PLAN"
            - "GET /compliance-signals?attendance_week_id=${w1_id} returns exactly 5 rows"

      - name: relocation_risk_preliminary_versus_final
        grounds:
          - calculations.relocation_risk_score
          - entities.RemoteLocationRequest.fields.preliminary_risk_score
          - entities.RemoteLocationRequest.fields.final_risk_score
          - state_machines.RemoteLocationRequest.UNDER_REVIEW_to_APPROVED
          - validations[priority=80]
        distinguishing_aspect: |
          These two variants live in the remote-work-location risk domain and are
          selected by LIFECYCLE POSITION rather than by a configuration flag:
          PRELIMINARY is scored once at creation from jurisdiction and data tier
          alone (30 for US_NY + CONFIDENTIAL), while FINAL is scored at the join
          point and adds the capped licensing, control-gap and nexus-cost
          penalties (59), so the same row carries two different scores 29 points
          apart and only FINAL is compared against APPROVAL_RISK_CEILING.
        test_recipe:
          setup:
            - "One OPEN policy cycle, one team, one ACTIVE employee whose APPROVED classification is HYBRID so the request is not blocked by ERR_CLASS_NOT_REMOTE_ELIGIBLE."
            - "A SUBMITTED RemoteLocationRequest for jurisdiction US_NY at data tier CONFIDENTIAL, both review dimensions PENDING and all three penalty inputs still 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-RLR", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /eligibility-classifications"
              payload: { employee_id: "${e1_id}", requested_class: "HYBRID", justification_code: "ROLE_DESIGN", effective_from: "2026-09-01", expected_employee_version: "${e1_v}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls_id: $.data.id }
            - call: "POST /eligibility-classifications/${cls_id}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls_id}/decision"
              payload: { decision: "APPROVE", decision_note: "role is hybrid by design" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /remote-location-requests"
              payload: { employee_id: "${e1_id}", jurisdiction_code: "US_NY", data_classification_tier: "CONFIDENTIAL", proposed_start_date: "2026-10-01" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { rlr_id: $.data.id, prelim: $.data.preliminary_risk_score }
          trigger:
            - call: "POST /remote-location-requests/${rlr_id}/tax-review"
              payload: { review_outcome: "CLEARED", licensing_gap_count: 2, tax_nexus_registration_cost_cents: 1500000 }
              as: HRBusinessPartner
            - call: "POST /remote-location-requests/${rlr_id}/security-review"
              payload: { review_outcome: "CLEARED", control_gap_count: 1 }
              as: ComplianceAuditor
            - call: "POST /remote-location-requests/${rlr_id}/decide"
              payload: { decision: "APPROVE" }
              as: WorkplaceProgramOffice
          assert:
            - "The capture ${prelim} taken at creation == 30"
            - "RemoteLocationRequest.${rlr_id}.preliminary_risk_score == 30 after the decision (never rescored)"
            - "RemoteLocationRequest.${rlr_id}.final_risk_score == 59"
            - "RemoteLocationRequest.${rlr_id}.final_risk_score - RemoteLocationRequest.${rlr_id}.preliminary_risk_score == 29"
            - "RemoteLocationRequest.${rlr_id}.status == APPROVED"
            - "RemoteLocationRequest.${rlr_id}.decision_reason == BOTH_REVIEWS_CLEARED"
            - "RemoteLocationRequest.${rlr_id}.final_risk_score == 59 < 60, i.e. the ceiling comparison uses FINAL and not the 30 of PRELIMINARY"

  - rule_id: combinatorial_formula
    instances:

      - name: pressure_three_input_conditional_multiplier_with_ceiling
        grounds:
          - calculations.non_compliance_pressure
          - calculations.pressure_derived_stage
          - entities.Employee.fields.cumulative_shortfall_days
          - entities.Employee.fields.consecutive_breach_weeks
          - entities.Employee.fields.current_eligibility_class
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Combinatorial mode (a): non_compliance_pressure combines THREE inputs -
          cumulative shortfall, the consecutive-breach streak and a severity
          multiplier that is conditional on current_eligibility_class - and then
          clamps at PRESSURE_CEILING, so an ONSITE_REQUIRED employee with 10
          shortfall days over 2 consecutive weeks scores a raw 17.00 that is
          stored as exactly 12.00, while a HYBRID employee on a 3-day team with
          the same two empty weeks scores 8.00 and is never clamped.
        test_recipe:
          setup:
            - "One OPEN cycle with days_in_office_floor 2."
            - "Team T1-CORE (5 expected days, headcount 25, corroboration off) and team T2-FIELD (3 expected days, headcount 12, corroboration off)."
            - "Employee E-1001 on T1-CORE left unclassified so current_eligibility_class is the ONSITE_REQUIRED default (severity 1.5, required_days 5)."
            - "Employee E-2001 on T2-FIELD with an APPROVED HYBRID classification (severity 1.0, required_days 3)."
            - "Both employees have OPEN AttendanceWeeks for 2026-W37 and 2026-W38 carrying NO signals at all, so credited_days will be 0 for every week."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-PRESS", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 5, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 25, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T2-FIELD", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t2_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t1_id}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t2_id}", employee_number: "E-2001", work_email: "e2001@corp.example", home_timezone: "America/Chicago", tenure_start_date: "2023-11-06", demographic_band: "BAND_B", manager_user_id: "mgr-2", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e2_id: $.data.id, e2_v: $.data.version }
            - call: "POST /eligibility-classifications"
              payload: { employee_id: "${e2_id}", requested_class: "HYBRID", justification_code: "ROLE_DESIGN", effective_from: "2026-09-01", expected_employee_version: "${e2_v}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls2_id: $.data.id }
            - call: "POST /eligibility-classifications/${cls2_id}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls2_id}/decision"
              payload: { decision: "APPROVE", decision_note: "hybrid role" }
              as: PeopleManager
              as_user_id: "mgr-2"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w1a_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W38", week_start_date: "2026-09-14" }
              as: SystemIntegration
              captures: { w1b_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e2_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w2a_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e2_id}", iso_week: "2026-W38", week_start_date: "2026-09-14" }
              as: SystemIntegration
              captures: { w2b_id: $.data.id }
          trigger:
            - call: "POST /attendance-weeks/${w1a_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2a_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1b_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w2b_id}/finalize"
              payload: {}
              as: SystemIntegration
          assert:
            - "AttendanceWeek.${w1a_id}.required_days == 5 and AttendanceWeek.${w1a_id}.shortfall_days == 5"
            - "AttendanceWeek.${w2a_id}.required_days == 3 and AttendanceWeek.${w2a_id}.shortfall_days == 3"
            - "Employee.${e1_id}.cumulative_shortfall_days == 10"
            - "Employee.${e1_id}.consecutive_breach_weeks == 2"
            - "Employee.${e1_id}.non_compliance_pressure == 12.00 (raw 10*1.5 + 2*1.0 == 17.00 clamped by PRESSURE_CEILING)"
            - "Employee.${e1_id}.escalation_stage == REFERRED"
            - "Employee.${e1_id}.compliance_state == BREACH"
            - "Employee.${e2_id}.cumulative_shortfall_days == 6"
            - "Employee.${e2_id}.consecutive_breach_weeks == 2"
            - "Employee.${e2_id}.non_compliance_pressure == 8.00 (raw 6*1.0 + 2*1.0, no clamp)"
            - "Employee.${e2_id}.escalation_stage == PERFORMANCE_PLAN"
            - "Team.${t1_id}.formal_action_count == 1 and Team.${t2_id}.formal_action_count == 1"
            - "PolicyCycle.${cyc_id}.formal_action_total == 2"
            - "PolicyCycle.${cyc_id}.aggregate_compliance_rate == 0.00"

      - name: chargeback_round_per_line_then_sum
        grounds:
          - calculations.space_chargeback_cents
          - entities.SeatAllocation.fields.line_chargeback_cents
          - entities.SeatAllocation.fields.weeks_in_window
          - entities.RecalibrationReview.fields.total_space_chargeback_cents
          - state_machines.SeatAllocation.RESERVED_to_COMMITTED
          - state_machines.RecalibrationReview.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Combinatorial mode (b): the chargeback nests two rounding steps and the
          ORDER decides the answer - both fixture lines land on an exact .5 cent
          (41163.5 and 36830.5), so rounding per line and then summing yields
          77995 while summing the raw values and rounding once yields 77994; the
          pinned per-line order makes 77995 the only correct total.
        test_recipe:
          setup:
            - "One OPEN cycle with days_in_office_floor 2."
            - "Team T3-OPS with 4 expected days and headcount 20 (entitled_seats 18) and team T4-LAB with 2 expected days and headcount 30 (entitled_seats 14)."
            - "Neighborhood N-A1 in the same cycle with seat_count 30, buffer_seats 4, desk band 1..30, so usable capacity is 26."
            - "Two COMMITTED allocations created in this order: line A for T3-OPS, 5 seats, half-open window [2026-W37, 2026-W39) i.e. 2 weeks; line B for T4-LAB, 2 seats, half-open window [2026-W37, 2026-W42) i.e. 5 weeks."
            - "One DRAFT RecalibrationReview on the cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CHG", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T3-OPS", expected_days_in_office_per_week: 4, core_collaboration_days: ["MON", "TUE", "WED", "THU"], headcount_planned: 20, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t3_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T4-LAB", expected_days_in_office_per_week: 2, core_collaboration_days: ["TUE", "THU"], headcount_planned: 30, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t4_id: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t3_id}", neighborhood_code: "N-A1", site_code: "NYC-01", seat_count: 30, buffer_seats: 4, desk_index_from: 1, desk_index_to: 30 }
              as: WorkplaceProgramOffice
