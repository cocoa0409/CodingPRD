          assert:
            - "l_dr_total == 1 and l_dr_first == ${dr_a_id}"
            - "l_agr_total == 1 and l_agr_first == ${agr_a_id}"
            - "l_mr_total == 1 and l_mr_first == ${link_mr_id} — the MarketingReview.agreement_id FK is reachable from the agreement id, not only from the partner id"
            - "l_ca_total == 2 — the 1:1-shaped custody pair is still returned as an array, one RESERVE and one FBO_END_USER, both ACTIVE"
            - "l_sb_total == 1 and l_sb_first == ${b1_id}"
            - "l_cmp_total == 1 and l_cmp_first == ${link_cmp_id}"
            - "l_alr_total == 1 and l_alr_first == ${link_alr_id}"
            - "l_sub_total == 1 and l_sub_first == ${sub_id} with sub_parent == ${pa_id} — the self-referential group edge is reachable through the parent_partner_id filter"
            - "l_wd_total == 0, l_wd_more == false and the data array is empty — an FK with no children is an empty array, never a 404"

  # ===========================================================================
  # §1.6 ERRORS — 72 codes. Coverage map (code -> the §1.9 instance that
  # triggers it) so that no code in the catalogue is untested:
  #   401 ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE .......... the_auth_header_ladder_*
  #   403 ERR_ROLE_NOT_PERMITTED ............................... the_auth_header_ladder_*
  #   403 ERR_PARTNER_SCOPE_VIOLATION .......................... the_fintech_partner_scope_check_*
  #   403 ERR_SEGREGATION_OF_DUTIES ............................ segregation_of_duties_*
  #   403 ERR_POSTURE_BLOCKS_MARKETING ......................... the_restricted_posture_*
  #   403 ERR_POSTURE_BLOCKS_INFLOW ............................ the_restricted_posture_* (documented unreachable)
  #   404 all eleven *_NOT_FOUND codes ......................... every_collection_answers_its_own_not_found_code
  #   409 ERR_PARTNER_TERMINAL ................................. occ_version_checks_rank_* / a_diligence_failed_partner_*
  #   409 review/agreement/marketing state codes ............... the_review_and_agreement_state_errors_*
  #   409 batch/complaint/alert/cycle/plan state codes ......... the_batch_complaint_alert_cycle_and_plan_state_errors_*
  #   409 ERR_AGREEMENT_PARTNER_MISMATCH ....................... the_review_and_agreement_state_errors_*
  #   409 ERR_CUSTODY_PARTNER_MISMATCH ......................... ledger_sign_and_account_type_discipline_*
  #   409 ERR_BATCH_NOT_RECONCILED / ERR_PARTNER_NOT_LIVE /
  #       ERR_CUSTODY_ACCOUNT_NOT_ACTIVE ....................... funding_walks_four_gates_*
  #   402 ERR_RESERVE_SHORTFALL_BLOCKS_FUNDING ................. funding_walks_four_gates_*
  #   409 ERR_PROGRAM_NOT_READY_FOR_LAUNCH ..................... go_live_with_a_nonzero_reserve_shortfall_*
  #   409 ERR_PARTNER_NOT_CONTRACTED ........................... go_live_with_a_nonzero_reserve_shortfall_*
  #   409 ERR_PARTNER_NOT_IN_WIND_DOWN / ERR_UNSETTLED_BATCHES_
  #       OUTSTANDING / ERR_WIND_DOWN_NOTICE_NOT_ELAPSED ....... the_wind_down_gates_*
  #   409 ERR_ROOT_CAUSE_REQUIRED .............................. root_cause_discipline_*
  #   409 ERR_NO_OPEN_CYCLE .................................... ledger_sign_and_account_type_discipline_*
  #   409 ERR_CUSTODY_INSUFFICIENT_FUNDS / ERR_END_USER_BALANCE_
  #       CAP_EXCEEDED ......................................... the_end_user_balance_cap_*
  #   409 ERR_CONCENTRATION_CAP_BREACH ......................... concentration_ratio_is_zero_*
  #   409 ERR_SETTLEMENT_WINDOW_OVERLAP / ERR_CYCLE_PERIOD_
  #       OVERLAP .............................................. interval_sanity_precedes_overlap_*
  #   409 ERR_DISCLOSURE_WINDOW_CONFLICT ....................... the_disclosure_cooling_buffer_*
  #   409 ERR_CYCLE_PERIOD_NOT_ELAPSED ......................... the_logical_clock_boundaries_*
  #   409 ERR_DILIGENCE_ALREADY_OPEN / ERR_AGREEMENT_ALREADY_
  #       OPEN / ERR_PLAN_ALREADY_OPEN ......................... at_most_one_open_artefact_*
  #   412 ERR_STALE_PARTNER_VERSION ............................ occ_version_checks_rank_*
  #   412 ERR_STALE_CUSTODY_ACCOUNT_VERSION .................... the_batch_complaint_alert_cycle_and_plan_state_errors_*
  #   422 ERR_VALIDATION ....................................... body_foreign_key_existence_*
  #   422 ERR_PARTNER_GROUP_CYCLE ............................... partner_create_with_a_self_referential_parent_chain_cycle_*
  #   422 ERR_DISCLOSURE_INCOMPLETE ............................ marketing_risk_flags_*
  #   422 ERR_COMPLIANCE_CAPABILITY_FLOOR ...................... segregation_of_duties_*
  #   422 ERR_DILIGENCE_SCORE_BELOW_FLOOR ...................... renewal_diligence_discards_*
  #   422 ERR_TERMINATION_TRIGGER_NOT_CONTRACTED ............... the_wind_down_gates_*
  #   422 ERR_INVALID_INTERVAL ................................. interval_sanity_precedes_overlap_*
  #   422 ERR_TIMESTAMP_IN_FUTURE / ERR_EFFECTIVE_DATE_IN_PAST . the_logical_clock_boundaries_*
  #   422 ERR_LEDGER_SIGN_MISMATCH ............................. ledger_sign_and_account_type_discipline_*
  #   422 ERR_VARIANCE_NOT_EXPLAINED ........................... root_cause_discipline_*
  # ===========================================================================
  - section: errors
    instances:

      - name: every_collection_answers_its_own_not_found_code_and_never_a_neighbours
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_PARTNER_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_MARKETING_REVIEW_NOT_FOUND
          - errors.ERR_CUSTODY_ACCOUNT_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_LEDGER_ENTRY_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_ALERT_NOT_FOUND
          - errors.ERR_CYCLE_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - validations.priority_8
        distinguishing_aspect: "Eleven collections share ONE validation rule (priority 8) but must each emit their own error id, and the id is chosen by the collection the segment belongs to rather than by the entity the endpoint returns. The SAME uuid is used for all eleven probes, so a single generic ERR_NOT_FOUND or a copy-pasted ERR_PARTNER_NOT_FOUND is immediately visible."
        test_recipe:
          setup:
            - "An empty database. The id 00000000-0000-0000-0000-0000000000ff is absent from every table."
          setup_api_calls: []
          trigger:
            - call: "GET /oversight/partners/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_partner: $.data.error_id }
            - call: "GET /oversight/diligence-reviews/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_review: $.data.error_id }
            - call: "GET /oversight/agreements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_agreement: $.data.error_id }
            - call: "GET /oversight/marketing-reviews/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_marketing: $.data.error_id }
            - call: "GET /oversight/custody-accounts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_custody: $.data.error_id }
            - call: "GET /oversight/settlement-batches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_batch: $.data.error_id }
            - call: "GET /oversight/ledger-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_ledger: $.data.error_id }
            - call: "GET /oversight/complaints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_complaint: $.data.error_id }
            - call: "GET /oversight/alerts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_alert: $.data.error_id }
            - call: "GET /oversight/cycles/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_cycle: $.data.error_id }
            - call: "GET /oversight/wind-down-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { nf_plan: $.data.error_id }
          assert:
            - "nf_partner == ERR_PARTNER_NOT_FOUND, nf_review == ERR_REVIEW_NOT_FOUND, nf_agreement == ERR_AGREEMENT_NOT_FOUND, nf_marketing == ERR_MARKETING_REVIEW_NOT_FOUND"
            - "nf_custody == ERR_CUSTODY_ACCOUNT_NOT_FOUND, nf_batch == ERR_BATCH_NOT_FOUND, nf_ledger == ERR_LEDGER_ENTRY_NOT_FOUND"
            - "nf_complaint == ERR_COMPLAINT_NOT_FOUND, nf_alert == ERR_ALERT_NOT_FOUND, nf_cycle == ERR_CYCLE_NOT_FOUND, nf_plan == ERR_PLAN_NOT_FOUND"
            - "all eleven return HTTP 404 with response_type == error and a non-empty message"
            - "note the naming asymmetry the catalogue deliberately carries: the DiligenceReview collection uses ERR_REVIEW_NOT_FOUND while MarketingReview uses ERR_MARKETING_REVIEW_NOT_FOUND"

      - name: the_review_and_agreement_state_errors_name_the_endpoint_not_just_the_resource
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_REVIEW_NOT_SUBMITTED
          - errors.ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED
          - errors.ERR_AGREEMENT_NOT_DRAFT
          - errors.ERR_AGREEMENT_NOT_PENDING_APPROVAL
          - errors.ERR_AGREEMENT_NOT_EXECUTED
          - errors.ERR_MARKETING_NOT_DECIDABLE
          - errors.ERR_MARKETING_NOT_CHANGES_REQUESTED
          - errors.ERR_AGREEMENT_PARTNER_MISMATCH
          - validations.priority_34
        distinguishing_aspect: "One resource in one state yields DIFFERENT error ids depending on which action is attempted: a DRAFT agreement answers ERR_AGREEMENT_NOT_PENDING_APPROVAL to risk-decision and ERR_AGREEMENT_NOT_EXECUTED to terminate. Likewise the diligence machine distinguishes the decide direction (ERR_REVIEW_NOT_SUBMITTED) from the submit direction (ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED) on the very same row."
        test_recipe:
          setup:
            - "Partner A with a DRAFT diligence review, and after it passes, a DRAFT agreement; Partner B exists so the mismatch probe has a foreign partner."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_partner_b
            - *q_dr_a
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Deciding a DRAFT review." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_rev_not_sub: $.data.error_id }
            - *q_dr_a_submit
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Submitting a SUBMITTED review." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_rev_not_draft: $.data.error_id }
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - call: "POST /oversight/agreements/${agr_a_id}/risk-decision"
              payload: { decision: "EXECUTE", decision_note: "Deciding a DRAFT agreement." }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_agr_not_pending: $.data.error_id }
            - call: "POST /oversight/agreements/${agr_a_id}/terminate"
              payload: { termination_trigger: "VOLUNTARY", notice_days: 30 }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_agr_not_exec: $.data.error_id }
            - *q_agr_a_submit
            - call: "POST /oversight/agreements/${agr_a_id}/submit-for-approval"
              payload: { submission_note: "Submitting a PENDING_RISK_APPROVAL agreement." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_agr_not_draft: $.data.error_id }
            - *q_agr_a_execute
            - call: "POST /oversight/marketing-reviews"
              payload: { partner_id: "${pb_id}", agreement_id: "${agr_a_id}", material_type: "AD", placement_channel: "SEARCH", disclosure_elements: ["BANK_NAME"], apr_disclosed: true, fdic_signage_correct: true, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-09-10T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_agr_mismatch: $.data.error_id }
            - call: "POST /oversight/marketing-reviews"
              payload: { partner_id: "${pa_id}", agreement_id: "${agr_a_id}", material_type: "AD", placement_channel: "SEARCH", disclosure_elements: ["APR", "FEE_SCHEDULE", "FDIC_SIGNAGE", "BANK_NAME", "DISPUTE_RIGHTS"], apr_disclosed: true, fdic_signage_correct: true, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-09-10T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_mr_id: $.data.id }
            - call: "POST /oversight/marketing-reviews/${err_mr_id}/resubmit"
              payload: { disclosure_elements: ["APR", "FEE_SCHEDULE", "FDIC_SIGNAGE", "BANK_NAME", "DISPUTE_RIGHTS"], apr_disclosed: true, fdic_signage_correct: true, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-09-10T00:00:00Z" }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_mkt_not_cr: $.data.error_id }
            - call: "POST /oversight/marketing-reviews/${err_mr_id}/decide"
              payload: { decision: "APPROVE", decision_note: "First approval." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_mr_status: $.data.status }
            - call: "POST /oversight/marketing-reviews/${err_mr_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Second approval on an APPROVED review." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_mkt_not_dec: $.data.error_id }
          assert:
            - "e_rev_not_sub == ERR_REVIEW_NOT_SUBMITTED (409) — decide requires SUBMITTED"
            - "e_rev_not_draft == ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED (409) — submit accepts only DRAFT or INFO_REQUESTED, and the two directions carry different ids on the same row"
            - "e_agr_not_pending == ERR_AGREEMENT_NOT_PENDING_APPROVAL and e_agr_not_exec == ERR_AGREEMENT_NOT_EXECUTED — same DRAFT agreement, two different actions, two different ids"
            - "e_agr_not_draft == ERR_AGREEMENT_NOT_DRAFT once the agreement is PENDING_RISK_APPROVAL"
            - "e_agr_mismatch == ERR_AGREEMENT_PARTNER_MISMATCH (409) — the agreement belongs to Partner A but the body names Partner B"
            - "e_mkt_not_cr == ERR_MARKETING_NOT_CHANGES_REQUESTED (409) — resubmit is legal only from CHANGES_REQUESTED, and it is FintechPartner-only per §1.5"
            - "err_mr_status == APPROVED and e_mkt_not_dec == ERR_MARKETING_NOT_DECIDABLE (409) — a decided review cannot be decided again"

      - name: the_batch_complaint_alert_cycle_and_plan_state_errors_are_each_reachable_exactly_once
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_BATCH_NOT_UNRECONCILED
          - errors.ERR_BATCH_NO_OPEN_VARIANCE
          - errors.ERR_BATCH_ALREADY_FUNDED
          - errors.ERR_BATCH_NOT_FUNDED
          - errors.ERR_COMPLAINT_NOT_DISPOSABLE
          - errors.ERR_ALERT_TERMINAL
          - errors.ERR_CYCLE_NOT_OPEN
          - errors.ERR_PLAN_NOT_DRAFT
          - errors.ERR_PLAN_NOT_PENDING_APPROVAL
          - errors.ERR_PLAN_NOT_APPROVED
          - errors.ERR_STALE_CUSTODY_ACCOUNT_VERSION
        distinguishing_aspect: "The settlement batch carries two independent dimensions on one row, so ERR_BATCH_NOT_FUNDED and ERR_BATCH_ALREADY_FUNDED come from the funding dimension while ERR_BATCH_NOT_UNRECONCILED and ERR_BATCH_NO_OPEN_VARIANCE come from the reconciliation dimension, and reaching one of each requires driving the two dimensions in opposite directions. The plan machine similarly emits three distinct ids for submit, decide and execute from the wrong state."
        test_recipe:
          setup:
            - "Partner A LIVE, reserve topped to 506250, FBO 8100000, cycle 2026-08 OPEN, one MATCHED batch."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
            - *q_res_a_read2
            - *q_res_top_193750
            - *q_batch_1
          trigger:
            - call: "POST /oversight/settlement-batches/${b1_id}/clawback"
              payload: { clawback_reason: "Clawing back a batch that was never funded." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_b_not_funded: $.data.error_id }
            - call: "POST /oversight/settlement-batches/${b1_id}/clear-variance"
              payload: { variance_adjustment_cents: 1000, root_cause_note: "No variance is open." }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_b_no_var: $.data.error_id }
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { b_recon: $.data.reconciliation_status }
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_b_not_unrec: $.data.error_id }
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-ERR-1" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { b_fund: $.data.funding_status }
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-ERR-2" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_b_already: $.data.error_id }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${fbo_a_id}", entry_type: "END_USER_CREDIT", amount_cents: 1000, effective_at: "2026-08-06T00:00:00Z", expected_custody_account_version: "${fbo_a_v}", memo: "stale custody version after the funding debit" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_stale_custody: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "SOCIAL", category: "SERVICING", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Complaint used for the not-disposable probe.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_cmp_id: $.data.id }
            - call: "POST /oversight/complaints/${err_cmp_id}/disposition"
              payload: { outcome: "WITHDRAWN", resolution_note: "Withdrawn." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_cmp_status: $.data.status }
            - call: "POST /oversight/complaints/${err_cmp_id}/disposition"
              payload: { outcome: "WITHDRAWN", resolution_note: "Withdrawing an already withdrawn complaint." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_cmp_not_disp: $.data.error_id }
            - call: "POST /oversight/alerts"
              payload: { partner_id: "${pa_id}", alert_type: "VELOCITY_SPIKE", triggered_at: "2026-08-01T00:00:00Z", transaction_volume_cents: 400000, detection_note: "Alert used for the terminal probe." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_alr_id: $.data.id }
            - call: "POST /oversight/alerts/${err_alr_id}/dispose"
              payload: { disposition: "CLEARED", disposition_note: "False positive." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_alr_disp: $.data.disposition }
            - call: "POST /oversight/alerts/${err_alr_id}/dispose"
              payload: { disposition: "SAR_FILED", disposition_note: "Disposing an already cleared alert." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_alr_terminal: $.data.error_id }
            - *q_clock_sep
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "First close." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_cyc_status: $.data.status }
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "Second close of a CLOSED cycle." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_cyc_not_open: $.data.error_id }
            - *q_terminate_a
            - *q_plan_a
            - call: "POST /oversight/wind-down-plans/${plan_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Deciding a DRAFT plan." }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_plan_not_pending: $.data.error_id }
            - call: "POST /oversight/wind-down-plans/${plan_id}/execute"
              payload: { execution_note: "Executing a DRAFT plan." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_plan_not_approved: $.data.error_id }
            - call: "POST /oversight/wind-down-plans/${plan_id}/submit"
              payload: { submission_note: "To risk." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_plan_status: $.data.status }
            - call: "POST /oversight/wind-down-plans/${plan_id}/submit"
              payload: { submission_note: "Submitting a PENDING_APPROVAL plan." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_plan_not_draft: $.data.error_id }
          assert:
            - "e_b_not_funded == ERR_BATCH_NOT_FUNDED (409) and e_b_no_var == ERR_BATCH_NO_OPEN_VARIANCE (409) — both raised while the batch is UNRECONCILED/UNFUNDED, from the two different dimensions"
            - "b_recon == MATCHED then e_b_not_unrec == ERR_BATCH_NOT_UNRECONCILED (409) on the repeat reconcile"
            - "b_fund == FUNDED then e_b_already == ERR_BATCH_ALREADY_FUNDED (409) on the repeat fund"
            - "e_stale_custody == ERR_STALE_CUSTODY_ACCOUNT_VERSION with HTTP 412 — funding synthesised an END_USER_DEBIT that bumped the FBO account's version, so the version captured before funding is stale"
            - "err_cmp_status == WITHDRAWN then e_cmp_not_disp == ERR_COMPLAINT_NOT_DISPOSABLE (409)"
            - "err_alr_disp == CLEARED then e_alr_terminal == ERR_ALERT_TERMINAL (409) — CLEARED and SAR_FILED are both terminal"
            - "err_cyc_status == CLOSED then e_cyc_not_open == ERR_CYCLE_NOT_OPEN (409) — the ops-run checkpoint is not idempotent, it is refused"
            - "e_plan_not_pending == ERR_PLAN_NOT_PENDING_APPROVAL and e_plan_not_approved == ERR_PLAN_NOT_APPROVED — the same DRAFT plan, two actions, two ids"
            - "err_plan_status == PENDING_APPROVAL then e_plan_not_draft == ERR_PLAN_NOT_DRAFT (409)"

  # ===========================================================================
  # §1.7 RBAC — 5 roles. NOTE ON AUTHORITY: §1.5's per-endpoint `roles:` list is
  # treated as normative everywhere below, because validation priority 5 cites
  # §1.5 explicitly. Three §1.7 role descriptions disagree with it and are
  # reported as scaffold defects in the instances that touch them:
  #   (1) §1.7 lists fund / clawback / cycles-close / clear-variance under
  #       RiskCommittee's exclusive_operations, but §1.5 grants fund, clawback
  #       and close to ProgramOfficer and clear-variance to InternalAudit;
  #   (2) §1.7 calls InternalAudit "strictly read-only ... appears on no write
  #       endpoint", but §1.5 puts it on POST reconcile and POST clear-variance;
  #   (3) §1.7 says FintechPartner "can see neither diligence files, nor
  #       agreements, nor monitoring alerts, nor wind-down plans", but §1.5
  #       lists FintechPartner on every one of those GETs.
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_performs_its_own_exclusive_write_and_is_refused_every_other_roles
        claim_type: Role Permission
        grounds:
          - roles.ProgramOfficer.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.RiskCommittee.exclusive_operations
          - validations.priority_5
          - errors.ERR_ROLE_NOT_PERMITTED
          - complexity_profile.role_model
        distinguishing_aspect: "The permission grid is per ENDPOINT, not per collection: ProgramOfficer may create and submit a diligence review but not decide it, ComplianceOfficer may decide it but not create it, and both may create a complaint while only ComplianceOfficer may assign its root cause. Every refusal is a 403 that leaves no row behind, and the positive call immediately afterwards proves the refusal was about the role and not about the state."
        test_recipe:
          setup:
            - "Partner A only, created by the ProgramOfficer who alone may do so."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Pay Inc", business_model: "CARD_ISSUING", funding_stage: "SERIES_B_PLUS", months_runway: 24, disclosed_complaints_per_10k: 3.50, end_user_account_count: 0 }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_co_create_partner: $.data.error_id }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Pay Inc", business_model: "CARD_ISSUING", funding_stage: "SERIES_B_PLUS", months_runway: 24, disclosed_complaints_per_10k: 3.50, end_user_account_count: 0 }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_rc_create_partner: $.data.error_id }
            - *q_partner_a
            - *q_dr_a
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Program officer attempting a decision." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_po_decide: $.data.error_id }
            - *q_dr_a_submit
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Risk committee attempting a diligence decision." }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_rc_decide: $.data.error_id }
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - call: "POST /oversight/agreements/${agr_a_id}/submit-for-approval"
              payload: { submission_note: "Compliance officer attempting the submission." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_co_submit_agr: $.data.error_id }
            - *q_agr_a_submit
            - call: "POST /oversight/agreements/${agr_a_id}/risk-decision"
              payload: { decision: "EXECUTE", decision_note: "Program officer attempting the execution." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_po_execute: $.data.error_id }
            - *q_agr_a_execute
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "BANK_CALL_CENTER", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Intaken by the program officer, which §1.5 permits.", is_reg_e_dispute: false }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { rb_cmp_id: $.data.id }
            - call: "POST /oversight/complaints/${rb_cmp_id}/assign-root-cause"
              payload: { root_cause_code: "FEE_DISCLOSURE_GAP", investigation_note: "Program officer attempting a root-cause assignment." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_po_root: $.data.error_id }
            - call: "POST /oversight/complaints/${rb_cmp_id}/assign-root-cause"
              payload: { root_cause_code: "FEE_DISCLOSURE_GAP", investigation_note: "Compliance officer assigns the cause." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { rb_cmp_root: $.data.root_cause_code, rb_cmp_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { e_rc_clock: $.data.error_id }
          assert:
            - "e_co_create_partner == e_rc_create_partner == ERR_ROLE_NOT_PERMITTED (403) — POST /oversight/partners lists ProgramOfficer alone"
            - "e_po_decide == ERR_ROLE_NOT_PERMITTED and NOT ERR_REVIEW_NOT_SUBMITTED, even though the review is also still DRAFT — priority 5 precedes priority 34"
            - "e_rc_decide == ERR_ROLE_NOT_PERMITTED — the diligence decision is ComplianceOfficer's exclusive, not a general approval power"
            - "e_co_submit_agr == ERR_ROLE_NOT_PERMITTED and e_po_execute == ERR_ROLE_NOT_PERMITTED — author and approver are disjoint at the ENDPOINT level, independently of the per-user check at priority 14"
            - "rb_cmp_id is created by the ProgramOfficer (201) — the complaints collection is shared by ProgramOfficer, ComplianceOfficer and FintechPartner"
            - "e_po_root == ERR_ROLE_NOT_PERMITTED while the ComplianceOfficer call succeeds with rb_cmp_root == FEE_DISCLOSURE_GAP and rb_cmp_status == ROOT_CAUSE_ASSIGNED — same collection, different endpoint, different grid cell"
            - "e_rc_clock == ERR_ROLE_NOT_PERMITTED — the logical clock is ProgramOfficer's exclusive, so no other role can move time"

      - name: internal_audit_reads_everything_and_writes_only_the_two_reconciliation_endpoints
        claim_type: Role Permission
        grounds:
          - roles.InternalAudit
          - endpoints.POST_/oversight/settlement-batches/{id}/reconcile
          - endpoints.POST_/oversight/settlement-batches/{id}/clear-variance
          - validations.priority_5
        distinguishing_aspect: "InternalAudit has an empty exclusive_operations list yet §1.5 names it on two POSTs, and clear-variance names it ALONE — so it is the only role that can close a settlement variance. Every other write must still be refused, including the neighbouring fund on the very same batch, which makes this the sharpest test of a per-endpoint rather than per-role-description permission model."
        test_recipe:
          setup:
            - "Partner A LIVE with a batch reconciled to VARIANCE_OPEN (bank 8200000 against partner 8100000)."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_batch_1
          trigger:
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8200000 }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { ia_recon: $.data.reconciliation_status, ia_var: $.data.variance_cents }
            - call: "POST /oversight/settlement-batches/${b1_id}/clear-variance"
              payload: { variance_adjustment_cents: 100000, root_cause_note: "Interchange posted late; audit signs off." }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { ia_cleared: $.data.reconciliation_status }
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-IA-1" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_ia_fund: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Audit attempting an intake.", is_reg_e_dispute: false }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_ia_complaint: $.data.error_id }
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-09", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_ia_cycle: $.data.error_id }
            - call: "GET /oversight/partners/${pa_id}/oversight-summary"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { ia_sum_partner: $.data.partner_id }
            - call: "GET /oversight/wind-down-plans"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { ia_wd_total: $.total_count }
          assert:
            - "ia_recon == VARIANCE_OPEN with ia_var == 100000, and ia_cleared == VARIANCE_CLEARED — both writes succeed for InternalAudit per §1.5"
            - "e_ia_fund == ERR_ROLE_NOT_PERMITTED (403) — the adjacent action on the same batch is ProgramOfficer's"
            - "e_ia_complaint == ERR_ROLE_NOT_PERMITTED and e_ia_cycle == ERR_ROLE_NOT_PERMITTED"
            - "ia_sum_partner == ${pa_id} and ia_wd_total == 0 — the read surface, including the computed summary and empty collections, is open to audit"
            - "SCAFFOLD DEFECT NOTE: §1.7's InternalAudit description asserts it 'appears on no write endpoint', which §1.5 contradicts twice; and §1.7 assigns clear-variance to RiskCommittee's exclusive_operations while §1.5 assigns it to InternalAudit alone. §1.5 is followed here because validation priority 5 cites it"

      - name: the_fintech_partner_read_surface_is_scoped_to_its_own_rows_on_every_shared_list
        claim_type: Role Permission
        grounds:
          - roles.FintechPartner
          - validations.priority_12
          - endpoints.GET_/oversight/partners
          - endpoints.GET_/oversight/partners/{id}/oversight-summary
        distinguishing_aspect: "FintechPartner is entity_backed, so the same GET returns different rows for different X-User-ID values and priority 12 must filter rather than 403 on a LIST while 403-ing on a single-row read of a foreign partner. The oversight-summary is the one read endpoint §1.5 withholds from the partner entirely, which separates row scoping from endpoint permission."
        test_recipe:
          setup:
            - "Partner A and Partner B each with one complaint and one settlement batch; cycle 2026-08 OPEN."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_partner_b
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "PARTNER_APP", category: "ACCOUNT_ACCESS", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Partner A's own complaint.", is_reg_e_dispute: false }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { scope_cmp_a: $.data.id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pb_id}", channel: "PARTNER_APP", category: "ACCOUNT_ACCESS", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Partner B's own complaint.", is_reg_e_dispute: false }
              as: FintechPartner
              as_user_id: "${pb_id}"
              captures: { scope_cmp_b: $.data.id }
            - call: "POST /oversight/settlement-batches"
              payload: { partner_id: "${pa_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z", gross_settlement_cents: 400000, interchange_cents: 0, returns_cents: 0, partner_reported_net_cents: 400000 }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { scope_b_a: $.data.id }
          trigger:
            - call: "GET /oversight/complaints"
              payload: {}
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { fp_cmp_total: $.total_count, fp_cmp_first: "$.data[0].id" }
            - call: "GET /oversight/complaints"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { co_cmp_total: $.total_count }
            - call: "GET /oversight/complaints/${scope_cmp_b}"
              payload: {}
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_fp_foreign_row: $.data.error_id }
            - call: "GET /oversight/partners"
              payload: {}
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { fp_partners_total: $.total_count, fp_partners_first: "$.data[0].id" }
            - call: "GET /oversight/partners/${pb_id}"
              payload: {}
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_fp_foreign_partner: $.data.error_id }
            - call: "GET /oversight/settlement-batches"
              payload: {}
              as: FintechPartner
              as_user_id: "${pb_id}"
              captures: { fp_b_batches_total: $.total_count }
            - call: "GET /oversight/partners/${pa_id}/oversight-summary"
              payload: {}
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_fp_summary: $.data.error_id }
          assert:
            - "fp_cmp_total == 1 and fp_cmp_first == ${scope_cmp_a} — the list is FILTERED to the caller's own partner_id, not refused"
            - "co_cmp_total == 2 — a bank role sees both partners' complaints through the identical unfiltered request"
            - "e_fp_foreign_row == ERR_PARTNER_SCOPE_VIOLATION (403) — a single-row read of a foreign complaint is refused rather than 404'd, so the partner cannot probe existence"
            - "fp_partners_total == 1 and fp_partners_first == ${pa_id} — the partner list collapses to the caller's own record"
            - "e_fp_foreign_partner == ERR_PARTNER_SCOPE_VIOLATION — reading another partner's record by id is refused"
            - "fp_b_batches_total == 0 for Partner B while Partner A's identical call returns 1 — scoping is driven purely by X-User-ID"
            - "e_fp_summary == ERR_ROLE_NOT_PERMITTED (403), NOT ERR_PARTNER_SCOPE_VIOLATION — §1.5 omits FintechPartner from oversight-summary entirely, so priority 5 fires before priority 12 even for the partner's OWN id"
            - "SCAFFOLD DEFECT NOTE: §1.7 claims FintechPartner can see neither diligence files nor agreements nor alerts nor wind-down plans, but §1.5 lists it on all four GETs; under §1.5 those reads succeed and return only the caller's own rows"

  # ===========================================================================
  # Cross-cutting complexity layers declared in §1.0:
  #   optimistic_concurrency | cascading_side_effects |
  #   dual_variant_calculation | ops_run_checkpoint
  # One instance per layer; the OCC instance covers all three §1.2.1 rules.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: all_three_occ_rules_reject_a_stale_parent_version_and_accept_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.diligence-create-stale-partner
          - concurrency_rules.agreement-create-stale-partner
          - concurrency_rules.ledger-entry-stale-custody-account
          - errors.ERR_STALE_PARTNER_VERSION
          - errors.ERR_STALE_CUSTODY_ACCOUNT_VERSION
          - validations.priority_28
          - validations.priority_29
        distinguishing_aspect: "All three rules are exercised in one chain, and each stale attempt is followed immediately by the identical payload carrying the refreshed version, so a 412 can only be attributed to the version token. The chain also proves that the version an OCC token must match is bumped by writes the client never issued: a census bumps Partner.version, a diligence DECISION bumps it again, and the client's own reserve funding bumps CustodyAccount.version so that a second entry replaying the first token fails."
        test_recipe:
          setup:
            - "Partner A freshly created (version v1), then an account census that advances the Partner version behind the client's back."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - call: "POST /oversight/partners/${pa_id}/account-census"
              payload: { end_user_account_count: 120000, as_of_date: "2026-08-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_v2: $.data.version, pa_census_count: $.data.end_user_account_count }
          trigger:
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 90, complaint_history_score: 85, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_stale_dr: $.data.error_id }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 90, complaint_history_score: 85, expected_partner_version: "${pa_v2}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_a_id: $.data.id, dr_a_status: $.data.status }
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${pa_id}", kyc_owner: "BANK", dispute_owner: "PARTNER", marketing_owner: "PARTNER", oversight_rights_level: "ENHANCED", audit_access_notice_days: 10, termination_triggers: ["COMPLAINT_RATE", "RESERVE_SHORTFALL", "SANCTIONS_EVENT", "CONCENTRATION_CAP", "GROWTH_BREACH", "VOLUNTARY"], monthly_growth_cap_pct: 50.00, concentration_cap_pct: 80.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${pa_v2}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_stale_agr: $.data.error_id }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${pa_id}", kyc_owner: "BANK", dispute_owner: "PARTNER", marketing_owner: "PARTNER", oversight_rights_level: "ENHANCED", audit_access_notice_days: 10, termination_triggers: ["COMPLAINT_RATE", "RESERVE_SHORTFALL", "SANCTIONS_EVENT", "CONCENTRATION_CAP", "GROWTH_BREACH", "VOLUNTARY"], monthly_growth_cap_pct: 50.00, concentration_cap_pct: 80.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${pa_v_passed}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { agr_a_id: $.data.id }
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${res_a_id}", entry_type: "RESERVE_FUND", amount_cents: 100000, effective_at: "2026-08-05T00:00:00Z", expected_custody_account_version: "${res_a_v}", memo: "replay of the token the first funding already consumed" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_stale_led: $.data.error_id }
            - *q_res_a_read2
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${res_a_id2}", entry_type: "RESERVE_FUND", amount_cents: 100000, effective_at: "2026-08-05T00:00:00Z", expected_custody_account_version: "${res_a_v2}", memo: "same movement, refreshed custody version" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { led_ok_id: $.data.id, led_ok_amt: $.data.amount_cents, led_ok_seq: $.data.sequence_no }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}", account_type: "RESERVE" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { led_ok_bal: "$.data[0].balance_cents", led_ok_v: "$.data[0].version" }
          assert:
            - "pa_census_count == 120000 and pa_v2 == ${pa_v1} + 1 — the census is a write and bumps Partner.version"
            - "e_stale_dr == ERR_STALE_PARTNER_VERSION with HTTP 412, and the byte-identical retry carrying pa_v2 returns 201 with dr_a_status == DRAFT"
            - "e_stale_agr == ERR_STALE_PARTNER_VERSION (412) — pa_v2 was fresh two calls ago but the PASSED decision rewrote capability_tier and latest_composite_score, so the token is stale again; the retry with pa_v_passed returns 201"
            - "e_stale_led == ERR_STALE_CUSTODY_ACCOUNT_VERSION (412) and no second entry is created — the reserve balance is still 312500 at this point"
            - "res_a_v2 == ${res_a_v} + 1, and the refreshed retry returns 201 with led_ok_amt == 100000 and led_ok_seq == 2; the RESERVE account then reads led_ok_bal == 412500 and led_ok_v == ${res_a_v2} + 1"
            - "every 412 is returned before any state change: the failing diligence create leaves the collection empty, and the failing ledger create leaves CustodyAccount.version at res_a_v2"

      - name: funding_drives_the_full_five_link_cascade_and_the_link_order_decides_whether_it_is_allowed
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/oversight/settlement-batches/{id}/fund
          - calculations.settlement_net_to_partner_cents
          - calculations.required_reserve_cents
          - calculations.partner_oversight_posture
          - validations.priority_86
        distinguishing_aspect: "Cascade A is five links deep — ledger inserts, custody balances, Partner reserve fields, posture re-derivation, custody freeze — and the SAME endpoint is first refused and then allowed with no change to the batch, only to the reserve balance one link away. The reserve top-up that unblocks it must be 193750 rather than the 92500 shortfall visible beforehand, because the top-up's own recompute pass re-reads the heightened multiplier it triggered on the previous pass."
        test_recipe:
          setup:
            - "Partner A LIVE, reserve at 312500, FBO seeded to 8100000, batch b1 reconciled MATCHED."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
            - *q_batch_1
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { casc_recon: $.data.reconciliation_status }
          trigger:
            - call: "GET /oversight/partners/${pa_id}"
