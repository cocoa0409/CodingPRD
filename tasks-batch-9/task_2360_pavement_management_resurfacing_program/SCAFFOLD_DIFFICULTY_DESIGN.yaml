      - name: project_accept_cascades_segment_moratorium_to_cut_permit_to_service_request
        grounds: ["state_machines.ResurfacingProject.delivery_status.SUBSTANTIALLY_COMPLETE_to_ACCEPTED", "state_machines.CutPermit.PENDING_to_MORATORIUM_REVIEW", "state_machines.ServiceRequest.DEFERRED_TO_CAPITAL_to_CLOSED_BY_CAPITAL", "calculations.cut_permit_degradation_fee", "calculations.service_request_backlog_conservation", "entities.NetworkSegment.fields.moratorium_until"]
        distinguishing_aspect: "Final acceptance walks four levels across four entity types: line -> ACCEPTED, segment gains moratorium_until 2029-10-01 with a rebuilt PCI of 100.0, the PENDING cut permit is re-priced from 170,000 to 510,000 cents as it enters MORATORIUM_REVIEW, and the DEFERRED_TO_CAPITAL complaint closes as CLOSED_BY_CAPITAL with the segment's open counter falling 1 -> 0 — none of which the acceptance payload mentions."
