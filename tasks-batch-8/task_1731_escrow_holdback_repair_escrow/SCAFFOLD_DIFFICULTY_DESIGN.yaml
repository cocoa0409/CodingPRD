              payload: { holdback_id: "${hb_id}", amount_cents: 80000, description: "Stage 1", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { draw1_id: $.data.id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins1_id: $.data.id }
            - { call: "POST /escrow/inspections/${ins1_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
            - { call: "POST /escrow/draw-requests/${draw1_id}/approve", payload: {}, as: EscrowOfficer }
            - { call: "POST /escrow/draw-requests/${draw1_id}/pay", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/work-orders"
              as: EscrowOfficer
              captures: { wo_id: "$.data[0].id" }
            - { call: "POST /escrow/work-orders/${wo_id}/submit-completion", payload: {}, as: Contractor, as_user_id: "contr_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "FINAL_VERIFICATION", scheduled_start: "2026-08-25T09:00:00Z", scheduled_end: "2026-08-25T10:00:00Z" }
              as: EscrowOfficer
              captures: { fins_id: $.data.id }
            - { call: "POST /escrow/inspections/${fins_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
          trigger:
            - { call: "POST /escrow/holdbacks/${hb_id}/close", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { bal: $.data.trust_balance_cents, disb: $.data.total_disbursed_cents }
            - call: "GET /escrow/holdbacks/${hb_id}/ledger-entries"
              as: EscrowOfficer
              captures: { s1: "$.data[0].amount_cents", s2: "$.data[1].amount_cents", s3: "$.data[2].amount_cents", r3: "$.data[2].running_balance_cents" }
          assert:
            - "s1 == 230000 (FUNDING), s2 == -80000 (DRAW_DEBIT from pay), s3 == -150000 (RETURN_TO_SELLER remainder)"
            - "s1 + s2 + s3 == 0 == bal — the conserved trust-cash quantity nets to zero after the full lifecycle"
            - "r3 == 0 (chronological running balance agrees with the sum invariant)"
            - "disb == 80000 and Holdback.${hb_id}.status == CLOSED_COMPLETED"

      - name: reserved_commitment_approve_pay_neutral
        grounds:
          - calculations.ledger_reconciliation
          - entities.Holdback.fields.reserved_cents
          - state_machines.DrawRequest.APPROVED_to_PAID
        distinguishing_aspect: |
          Conserved quantity: approved-but-unpaid commitment dollars (reserved_cents) — a
          different quantity than trust cash. Forward action approve (+80000, then +50000)
          paired with the compensating pay (-80000) leaves reserved_cents == 50000, exactly
          equal to the remaining APPROVED draw; no drift after the round trip.
        test_recipe:
          setup:
            - "ACTIVE holdback 230000; draw1 80000 and draw2 50000 both APPROVED-unpaid (reserved 130000)"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/bids"
              payload: { holdback_id: "${hb_id}", amount_cents: 210000, scope_text: "Full tear-off" }
              as: Contractor
              as_user_id: "contr_1"
              captures: { bid_id: $.data.id }
            - { call: "POST /escrow/bids/${bid_id}/select", payload: {}, as: Buyer, as_user_id: "buyer_1" }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 80000, description: "Stage 1", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { draw1_id: $.data.id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins1_id: $.data.id }
            - { call: "POST /escrow/inspections/${ins1_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
            - { call: "POST /escrow/draw-requests/${draw1_id}/approve", payload: {}, as: EscrowOfficer }
            - call: "POST /escrow/draw-requests"
              payload: { holdback_id: "${hb_id}", amount_cents: 50000, description: "Stage 2", is_final: false }
              as: Contractor
              as_user_id: "contr_1"
              captures: { draw2_id: $.data.id }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_id}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-21T10:00:00Z", scheduled_end: "2026-08-21T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins2_id: $.data.id }
            - { call: "POST /escrow/inspections/${ins2_id}/report", payload: { result: "PASSED" }, as: Inspector, as_user_id: "insp_1" }
            - { call: "POST /escrow/draw-requests/${draw2_id}/approve", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /escrow/draw-requests/${draw1_id}/pay", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { resv: $.data.reserved_cents, bal: $.data.trust_balance_cents, disb: $.data.total_disbursed_cents }
          assert:
            - "resv == 50000 (approve 80000 + approve 50000 - pay 80000: the forward/compensating pair nets to the surviving commitment)"
            - "bal == 150000 (230000 funded - 80000 paid; pay moved cash, approve never does)"
            - "disb == 80000"
            - "reserved_cents == sum of APPROVED-state draw amounts (50000) — the invariant holds exactly, no drift"
