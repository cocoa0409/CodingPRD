              as: NetworkIssuer
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_d1}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_dep: $.data.id }
            - call: "POST /network/offers/${off_dep}/submit-review"
              payload: {}
              as: NetworkDataSteward
            - call: "POST /network/offers/${off_dep}/request-consent"
              payload: {}
              as: NetworkDataSteward
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_dep}", original_merchant_id: "${m_d1}", final_merchant_id: "${m_d1}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_dep}"
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_dep}", original_merchant_id: "${m_d1}", final_merchant_id: "${m_d1}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_dep}"
            - call: "POST /network/merchants/${m_d1}/suppress"
              payload: {}
              as: NetworkCompliance
          trigger:
            - call: "POST /network/offers/${off_dep}/request-consent"
