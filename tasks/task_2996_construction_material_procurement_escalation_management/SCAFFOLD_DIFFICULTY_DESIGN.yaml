    - state_machines.SubstitutionRequest.SUBMITTED_to_APPROVED_AS_NOTED
    - entities.SubstitutionRequest.fields.applied_schedule_delta_days
    - calculations.release_for_fabrication_schedule
    distinguishing_aspect: 'BRANCHING with divergent side-effect sets: from the identical SUBMITTED state and identical payload (cost_delta 45000.00, schedule_delta_days 12), APPROVED writes applied_schedule_delta_days 12 and moves the release date to 2026-10-29, while APPROVED_AS_NOTED writes applied_schedule_delta_days 0 and leaves the release date at 2026-11-10 — both apply the same 45000.00 cost delta.'
    test_recipe:
      setup:
      - Clock at its 2026-08-01T00:00:00Z startup default
      - Two identical steel packages (fab 70, transit 20, submittal 21, required_onsite 2027-03-01, estimated_cost 1200000.00), each with release_for_fabrication_date 2026-11-10 and float_days 101
      - Substitute supplier 'Northline Steel Mills' registered as US with declared_tariff_rate_pct 0.00
      - Two SUBMITTED substitution requests, one per package, both with cost_delta 45000.00 and schedule_delta_days 12
      - The request on package A has already been dispositioned APPROVED
