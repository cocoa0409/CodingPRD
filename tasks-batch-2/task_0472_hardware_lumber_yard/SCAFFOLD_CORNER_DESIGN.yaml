              captures: { oco: $.data.id, oco_v0: $.data.version }
            - call: "POST /sales-orders/${oco}/lines"
              payload: { product_id: "${ocp}", qty: 5 }
              as: SalesAssociate
            - call: "GET /sales-orders/${oco}"
              payload: {}
              as: SalesAssociate
              captures: { oco_vnow: $.data.version }
          trigger:
            - call: "POST /sales-orders/${oco}/place"
              payload: { expected_sales_order_version: "${oco_vnow}" }
              as: SalesAssociate
              captures: { vafter: $.data.version }
          assert:
            - "HTTP status == 200"
            - "SalesOrder.${oco}.fulfillment_status == PLACED"
            - "SalesOrder.${oco}.version == ${oco_vnow} + 1"

      - name: occ_place_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-place-stale-version]", "errors[ERR_STALE_ORDER_VERSION]", "entities.SalesOrder.fields.version"]
        distinguishing_aspect: "After adding a line bumps the order's version, placing with the pre-line (stale) version -> ERR_STALE_ORDER_VERSION 412; order stays DRAFT."
        test_recipe:
          setup: ["cash order; version captured at create (v0); a line then added (version advances)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "OV2" }
              as: InventoryManager
              captures: { ov2: $.data.id }
            - call: "POST /products"
              payload: { sku: "OC-2", vendor_id: "${ov2}", sell_mode: "EACH", aisle: "OC", bin: "OD", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { ocp2: $.data.id }
            - call: "POST /products/${ocp2}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { oco2: $.data.id, oco2_v0: $.data.version }
            - call: "POST /sales-orders/${oco2}/lines"
              payload: { product_id: "${ocp2}", qty: 5 }
              as: SalesAssociate
            - call: "GET /sales-orders/${oco2}"
              payload: {}
              as: SalesAssociate
              captures: { oco2_vnow: $.data.version }
          trigger:
            - call: "POST /sales-orders/${oco2}/place"
              payload: { expected_sales_order_version: "${oco2_vnow} - 1" }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_ORDER_VERSION"
            - "SalesOrder.${oco2}.fulfillment_status == DRAFT"

      - name: occ_fulfill_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-fulfill-stale-version]", "errors[ERR_STALE_ORDER_VERSION]", "entities.SalesOrder.fields.version"]
        distinguishing_aspect: "Fulfilling with the pre-place (stale) version after place advanced version -> ERR_STALE_ORDER_VERSION 412; fulfillment_status stays PLACED."
        test_recipe:
          setup: ["cash order one line qty 5 placed; version captured BEFORE place (stale)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "OV3" }
              as: InventoryManager
              captures: { ov3: $.data.id }
            - call: "POST /products"
              payload: { sku: "OC-3", vendor_id: "${ov3}", sell_mode: "EACH", aisle: "OE", bin: "OF", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { ocp3: $.data.id }
            - call: "POST /products/${ocp3}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { oco3: $.data.id }
            - call: "POST /sales-orders/${oco3}/lines"
              payload: { product_id: "${ocp3}", qty: 5 }
              as: SalesAssociate
            - call: "GET /sales-orders/${oco3}"
              payload: {}
              as: SalesAssociate
              captures: { oco3_vplace: $.data.version }
            - call: "POST /sales-orders/${oco3}/place"
              payload: { expected_sales_order_version: "${oco3_vplace}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${oco3}/fulfill"
              payload: { expected_sales_order_version: "${oco3_vplace}" }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_ORDER_VERSION"
            - "SalesOrder.${oco3}.fulfillment_status == PLACED"

      - name: derived_balance_reconciles_after_pay
        claim_type: derived_field_reconciliation
        grounds: ["entities.ContractorAccount.fields.balance_cents", "state_machines.SalesOrder.payment_status=INVOICED_to_payment_status=PAID", "calculations.account_credit_available"]
        distinguishing_aspect: "After invoicing (balance 10000) then paying, balance_cents reconciles back to 0 because the PAID invoice leaves the ISSUED sweep."
        test_recipe:
          setup: ["net-term order placed+fulfilled+invoiced (balance 10000)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "DBV" }
              as: InventoryManager
              captures: { dbv: $.data.id }
            - call: "POST /products"
              payload: { sku: "DB-1", vendor_id: "${dbv}", sell_mode: "EACH", aisle: "DB", bin: "EB", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { dbp: $.data.id }
            - call: "POST /products/${dbp}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "DBA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { dba: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${dba}" }
              as: SalesAssociate
              captures: { dbo: $.data.id, dbo_v0: $.data.version }
            - call: "POST /sales-orders/${dbo}/lines"
              payload: { product_id: "${dbp}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${dbo}/place"
              payload: { expected_sales_order_version: "${dbo_v0}" }
              as: SalesAssociate
              captures: { dbo_v1: $.data.version }
            - call: "POST /sales-orders/${dbo}/fulfill"
              payload: { expected_sales_order_version: "${dbo_v1}" }
              as: SalesAssociate
            - call: "POST /sales-orders/${dbo}/invoice"
              payload: {}
              as: AccountsManager
          trigger:
            - call: "POST /sales-orders/${dbo}/pay"
              payload: {}
              as: AccountsManager
          assert:
            - "ContractorAccount.${dba}.balance_cents == 0"
            - "SalesOrder.${dbo}.payment_status == PAID"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: place_total_visible_in_same_response
        claim_type: immediate
        grounds: ["calculations.order_total_provisional", "entities.SalesOrder.fields.total_cents"]
        distinguishing_aspect: "The place response already carries the recomputed subtotal_cents/total_cents (immediate consistency, no re-read needed)."
        test_recipe:
          setup: ["cash order one EACH line qty 10 list 1000"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "IMV" }
              as: InventoryManager
              captures: { imv: $.data.id }
            - call: "POST /products"
              payload: { sku: "IM-1", vendor_id: "${imv}", sell_mode: "EACH", aisle: "IM", bin: "JM", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { imp: $.data.id }
            - call: "POST /products/${imp}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { imo: $.data.id, imo_v0: $.data.version }
            - call: "POST /sales-orders/${imo}/lines"
              payload: { product_id: "${imp}", qty: 10 }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${imo}/place"
              payload: { expected_sales_order_version: "${imo_v0}" }
              as: SalesAssociate
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "place response data.subtotal_cents == 10000"
            - "place response data.total_cents == 10000"

  # =========================================================================
  # Excluded stubs — corners fully exercised by §1.8 instances
  # =========================================================================
  - section: validations
    instances:
      - name: error_credit_limit_exceeded_on_place
        claim_type: Violation to Error
        grounds: ["validations[priority=18]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / credit_available_committed_vs_settled_diverge
          rationale: "The committed-exposure projection that this error guards is exercised numerically by the committed-vs-settled credit instance; a second place above the limit is its negative tail."
      - name: error_rental_overlap_interior
        claim_type: Violation to Error
        grounds: ["validations[priority=15]", "errors[ERR_RENTAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rental_half_open_overlap_backtoback_allowed
          rationale: "ERR_RENTAL_OVERLAP is asserted as the trigger outcome of the rental half-open overlap difficulty instance."
      - name: error_station_booking_conflict
        claim_type: Violation to Error
        grounds: ["validations[priority=16]", "errors[ERR_STATION_BOOKING_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / service_station_buffer_expanded_overlap
          rationale: "ERR_STATION_BOOKING_CONFLICT is the asserted failure path of the buffer-expanded overlap instance."
      - name: error_cylinder_not_certified
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_CYLINDER_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_vs_state_offline_station_propane_uncertified
          rationale: "The propane safety check is grounded by the safety-vs-state priority instance (its first start asserts the certified path; the uncertified rejection is the same rule)."
      - name: error_product_discontinued
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_PRODUCT_DISCONTINUED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_fulfill_blocked_by_discontinued_product
          rationale: "ERR_PRODUCT_DISCONTINUED is the asserted outcome of the Order->Product cross-entity dependency instance."
