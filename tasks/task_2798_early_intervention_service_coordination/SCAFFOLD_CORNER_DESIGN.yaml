          - state_machines.ServiceVisit[SCHEDULED -> CANCELLED_PROVIDER]
          - calculations.service_unit_pool
          - calculations.makeup_obligation
          - entities.Referral.fields.service_gap_flag
          - validations[priority 22 -> ERR_PROVIDER_NOT_ACTIVE]
        distinguishing_aspect: |
          The CONTRACT_ENDED reason code selects the TERMINATED sibling of the same endpoint, so the
          authorization is REVOKED with units_released = 24 (returning the whole pool: units_committed
          0, units_pool_remaining 96) instead of merely SUSPENDED with its units still committed. The
          cancelled 2-unit visit leaves makeup_owed_units at 2, which is NOT strictly greater than the
          threshold of 4, so the line stays AUTHORIZED and service_gap_flag stays false; a second
          suspend attempt is rejected because TERMINATED is terminal.
        test_recipe:
          setup:
            - "An ACTIVE plan with one SPEECH_THERAPY line (planned_units_total 96), an ACTIVE provider, an authorization for 24 units over 2026-03-21..2026-04-30 and one SCHEDULED 30-minute (2-unit) visit."
