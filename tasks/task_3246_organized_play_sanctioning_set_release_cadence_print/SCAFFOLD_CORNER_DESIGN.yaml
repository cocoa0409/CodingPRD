          assert:
            - "the response status is 403 and ${eid} == \"ERR_UNAUTHORIZED\""
            - "no RulesEnforcementCase exists: GET /op/enforcement-cases filtered by event_application_id ${app_id} reports total_count 0"
            - "Store.${store_id}.reporting_violation_points stays 0"

      - name: missing_role_header_is_unauthenticated_not_forbidden
        claim_type: Violation -> Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
