scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two instances on DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tier_assessment_partial_year_actual_vs_annualized
        grounds:
          - calculations.tier_determination
          - entities.DeveloperOrg.fields.effective_tier_code
        distinguishing_aspect: |
          Operates on the DeveloperOrg domain: with 4 months of declarations the
          actual_ttm variant yields 160,000,000 cents (no tier breach) while the
          annualized_projection variant yields 480,000,000 cents (breaches the
          PERSONAL 20,000,000-cent ceiling) for identical declaration rows.
        test_recipe:
          setup:
            - "PERSONAL tier with revenue_ceiling_cents=20000000 (i.e. $200,000) and PRO/ENTERPRISE tiers exist"
            - "Org declared PERSONAL with four monthly declarations of gross_revenue_cents=40000000 each (2026-01..2026-04)"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "ENTERPRISE", revenue_ceiling_cents: 0, funding_ceiling_cents: 0, seat_minimum: 10, seat_overage_cents: 40000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Small Studio", contact_email: "s@x.com", declared_tier_code: "PERSONAL" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 40000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-02", gross_revenue_cents: 40000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-03", gross_revenue_cents: 40000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-04", gross_revenue_cents: 40000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /orgs/${org_id}/tier-assessment"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "response.actual_ttm_revenue_cents == 160000000"
            - "response.annualized_revenue_cents == 480000000"
            - "response.months_declared == 4"
            - "response.tier_by_actual == PERSONAL"
            - "response.tier_by_annualized == PRO"
            - "response.effective_tier_code == PRO"

      - name: runtime_fee_provisional_vs_final_after_dispute_revision
        grounds:
          - calculations.runtime_fee_assessment
          - state_machines.InstallReport.UNDER_REVIEW_to_DISPUTED
          - state_machines.InstallReport.DISPUTED_to_DRAFT
        distinguishing_aspect: |
          Operates on the RuntimeFeeInvoice domain (different domain from tier
          assessment): provisional amount 2,250,000 cents computed at submit from
          self-reported 150,000 billable installs crossing the 1,000,000 threshold,
          while the final variant recomputed after a dispute revision lowering
          billable to 50,000 yields 0 cents for what began as identical submitted data.
        test_recipe:
          setup:
            - "PRO org with TTM revenue 160,000,000 cents (>= 100,000,000 revenue gate) and a SHIPPED project with lifetime_installs already 1,000,000 from one prior ACCEPTED report"
            - "Editor version SUPPORTED"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Pro Studio", contact_email: "p@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.1f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game A", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-02", new_device_installs: 1000000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /install-reports/${rep1_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep1_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_v2: $.data.version }
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-03", new_device_installs: 150000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep2_id: $.data.id }
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "GET /projects/${proj_id}/invoices"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { inv_prov: $.data.0.provisional_amount_cents }
            - call: "POST /install-reports/${rep2_id}/review"
              payload: { action: "DISPUTE", review_note: "install count overstated" }
              as: ReviewBoard
            - call: "POST /install-reports/${rep2_id}/revise"
              payload: { new_device_installs: 50000, reinstalls: 0, bundle_installs: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /install-reports/${rep2_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
          assert:
            - "captured inv_prov == 2250000 (100,000 installs x 20c + 50,000 x 5c, line-then-sum)"
            - "after revision+accept, the invoice for report ${rep2_id} has final_amount_cents == 0"
            - "GameProject.${proj_id}.lifetime_installs == 1050000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (two instances in DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyout_quote_nonlinear_tenure_and_remaining_months
        grounds:
          - calculations.buyout_settlement
        distinguishing_aspect: |
          Mode (a): buyout_settlement has 4 inputs (outstanding invoices, purchased
          seats, remaining whole-months with partial-rounds-UP, tenure tier) with
          non-linear interaction — the early-termination percentage switches across
          three tenure tiers and multiplies the seat remainder.
        test_recipe:
          setup:
            - "Org created 2025-09-01 (tenure ~15 months at trigger date 2026-12-15 => reduced 10% fee tier)"
            - "One ACTIVE PRO SeatSubscription purchased_seats=4 covering 2026-09-01..2027-03-01"
            - "No invoices (balance_due 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Migrator", contact_email: "m@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /orgs/${org_id}/seat-subscriptions"
              payload: { tier_code: "PRO", purchased_seats: 4, coverage_start: "2026-09-01", coverage_end: "2027-03-01", expected_org_version: "${org_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orgs/${org_id}/migration-assessments"
              payload: { target_engine: "OtherEngine" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { ma_id: $.data.id }
          trigger:
            - call: "POST /migration-assessments/${ma_id}/advance"
              payload: { target: "EXPORT_READY" }
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "MigrationAssessment.${ma_id}.buyout_quote_cents == 198000"
            - "breakdown: committed_seat_remainder 4 x 15000 x 3 months (Dec partial rounds UP) = 180000; tenure 15 months => 10% early-termination 18000; total 198000"

      - name: runtime_fee_line_then_sum_rounding_pinned
        grounds:
          - calculations.runtime_fee_assessment
        distinguishing_aspect: |
          Mode (b) nested rounding: runtime_fee_assessment pins per-rate-tier line
          rounding (round_half_up per line) THEN summation — the line-then-sum order
          is load-bearing because 100,000x20c and 50,000x5c must be computed as two
          separate lines, not as a single blended rate over 150,000 installs.
        test_recipe:
          setup:
            - "PRO org, revenue gate met (single declaration 160,000,000 cents), SHIPPED project already at lifetime_installs 1,000,000"
            - "New report with billable 150,000 crosses both rate tiers in one period"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "LineSum", contact_email: "l@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2023.1.0f1", major_line: "2023.1", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game L", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 1000000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /install-reports/${rep1_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep1_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_v2: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-02", new_device_installs: 150000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep2_id: $.data.id }
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "the PROVISIONAL invoice for report ${rep2_id} has provisional_amount_cents == 2250000"
            - "line split honored: 100000 installs at 20c (2,000,000) plus 50000 at 5c (250,000), each line rounded then summed"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (two instances, DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: install_report_dispute_revision_cycle
        grounds:
          - state_machines.InstallReport
        distinguishing_aspect: |
          InstallReport has a true cycle DRAFT->SUBMITTED->UNDER_REVIEW->DISPUTED->DRAFT:
          after revision the report re-enters DRAFT and can be re-submitted, with the
          linked invoice flipping PROVISIONAL->DISPUTED->ADJUSTED on each pass.
        test_recipe:
          setup:
            - "PRO org, revenue gate met, SHIPPED project at lifetime 1,000,000; report R2 submitted with billable 150,000 then disputed"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Cycle Studio", contact_email: "c@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.9f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game C", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 1000000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /install-reports/${rep1_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep1_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_v2: $.data.version }
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-02", new_device_installs: 150000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep2_id: $.data.id }
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep2_id}/review"
              payload: { action: "DISPUTE", review_note: "overcount" }
              as: ReviewBoard
          trigger:
            - call: "POST /install-reports/${rep2_id}/revise"
              payload: { new_device_installs: 120000, reinstalls: 0, bundle_installs: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "InstallReport.${rep2_id}.report_status == SUBMITTED after the second submit (cycle completed DRAFT->SUBMITTED->UNDER_REVIEW->DISPUTED->DRAFT->SUBMITTED)"
            - "InstallReport.${rep2_id}.billable_installs == 120000"
            - "the invoice for ${rep2_id} has assessment_status == PROVISIONAL again with recomputed provisional_amount_cents == 2100000 (100,000x20c + 20,000x5c)"

      - name: runtime_invoice_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.RuntimeFeeInvoice
        distinguishing_aspect: |
          RuntimeFeeInvoice carries two parallel state dimensions: assessment_status
          (PROVISIONAL/FINALIZED/DISPUTED/ADJUSTED) evolves via review actions while
          payment_status (UNPAID/OVERDUE/PAID/WAIVED) evolves via clock and payment —
          an invoice can be FINALIZED/OVERDUE, a combination unreachable by any linear
          pipeline.
        test_recipe:
          setup:
            - "PRO org, revenue gate met, SHIPPED project with one ACCEPTED report and FINALIZED invoice due 30 days after finalization"
            - "Logical clock advanced past due_date without payment"
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Parallel Studio", contact_email: "pa@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.10f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game P", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-09", new_device_installs: 1100000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /install-reports/${rep_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /projects/${proj_id}/invoices"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { inv_id: $.data.0.id }
          assert:
            - "RuntimeFeeInvoice.${inv_id}.assessment_status == FINALIZED while payment_status == OVERDUE (two dimensions, distinct axes)"
            - "RuntimeFeeInvoice.${inv_id}.final_amount_cents == 2000000 (crossing: first 1,000,000 free, 100,000 chargeable x 20c; the high-rate line is empty and contributes 0)"
            - "DeveloperOrg.${org_id}.org_standing == REVIEW (>=1 overdue invoice)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (two instances, different triggers, depth >=3 / >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_conversion_depth3_tier_seatbackbill_invoicererate
        grounds:
          - state_machines.AuditCase.EVIDENCE_REQUESTED_to_CONVERTED
          - calculations.back_bill_computation
          - entities.DeveloperOrg.fields.trust_score
        distinguishing_aspect: |
          Depth-3 cascade from POST /audit-cases/{id}/resolve CONVERT: hop 1 org
          effective tier PERSONAL->PRO and trust_score -15; hop 2 seat shortfall vs
          PRO seat_minimum computes back_bill_cents = 250,000; hop 3 the open
          PROVISIONAL invoice (0 under exempt PERSONAL) is re-rated under PRO, whose
          100,000,000-cent revenue gate is NOT met at 25,000,000 cents, so the amount
          stays 0 while fee_schedule_label flips to CONVERTED — the re-rate ran even
          though the number did not change.
        test_recipe:
          setup:
