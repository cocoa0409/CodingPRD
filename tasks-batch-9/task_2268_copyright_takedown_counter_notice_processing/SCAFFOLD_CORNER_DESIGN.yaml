      - name: third_reference_file_exceeds_a_quota_counted_over_pending_plus_active
        claim_type: aggregate_validation
        grounds:
          - validations.priority_18
          - errors[ERR_REFERENCE_QUOTA_EXCEEDED]
          - entities.RightsHolder.fields.reference_file_quota
        distinguishing_aspect: "The quota counts PENDING and ACTIVE files together, so a holder with reference_file_quota 2 holding one ACTIVE and one PENDING file is already full: each individual create was legal but the collective third one is 409 ERR_REFERENCE_QUOTA_EXCEEDED."
        test_recipe:
          setup:
            - "One RightsHolder created with reference_file_quota 2 and then ENROLLED."
            - "File A is created and activated (ACTIVE); file B is created and left PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
