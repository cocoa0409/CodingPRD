            - call: "POST /dmca/notices/${n_meridian_id}/process"
              payload: {}
              as: TakedownAgent
          assert:
            - "Account.${acct_id}.strike_points == 19.75"
            - "Account.${acct_id}.strike_points != 25.00 (the snapshot_aggregate reading)"
            - "Account.${acct_id}.standing == ACTIVE"
            - "Account.${acct_id}.upload_restricted == false"
            - "StrikeRecord.${strike_orbit_id}.status == DECAYED"
            - "StrikeRecord.${strike_orbit_id}.weight == 1.5"
            - "StrikeRecord.${strike_orbit_id}.base_points == 15"
            - "StrikeRecord.${strike_orbit_id}.effective_points == 9.75"
            - "GET /dmca/accounts/${acct_id}/strikes returns total_count == 2 and $.data[1].effective_points == 10.00 with $.data[1].weight == 1.0"
            - "GET /dmca/accounts/${acct_id}/strike-summary returns strike_points == 19.75, active_strike_count == 1, decayed_strike_count == 1, standing == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: misrepresentation_penalty_surcharge_tier_keyed_on_base_not_total
        grounds:
          - calculations.misrepresentation_penalty
          - entities.MisrepresentationCase.fields.base_penalty_cents
          - entities.MisrepresentationCase.fields.surcharge_cents
          - entities.MisrepresentationCase.fields.total_penalty_cents
          - state_machines.MisrepresentationCase.OPEN_to_SUBSTANTIATED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the surcharge tier is selected from
          base_penalty_cents 457500 (tier 1, 10%) giving total 503250, whereas
          re-selecting the tier from the running total (503250 >= 500000 -> 20%)
          would give 549000; the scaffold pins base-first evaluation order.
        test_recipe:
          setup:
            - "Provider fully documented; policy PUBLISHED with defaults."
            - "Account with three ContentItems, all AVAILABLE at the start."
            - "One notice claiming all three URLs is PROCESSED at 2026-08-01T00:00:00Z, producing three DISABLED claims and three strikes (30.00 points -> standing LIMITED)."
            - "Clock advanced to 2026-10-25T00:00:00Z, 85 whole days of disabled access per claim (255 in total)."
            - "One MisrepresentationCase in OPEN, opened by investigator-01 against the first claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
