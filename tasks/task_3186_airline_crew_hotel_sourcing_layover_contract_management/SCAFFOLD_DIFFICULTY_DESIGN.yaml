          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_REST_VIOLATION]
          - errors[ERR_ROOM_BLOCK_EXHAUSTED]
        distinguishing_aspect: |
          Category pair business_safety (priority 5) vs business_constraint/fiscal capacity
          (priority 11): a book that violates rest compliance AND targets a contract whose block
          is already full on the stay_date MUST return ERR_REST_VIOLATION, not
          ERR_ROOM_BLOCK_EXHAUSTED — safety outranks capacity.
        test_recipe:
          setup:
            - "Station LIT (min_rest_hours 10, transport 30), union PILOT min_rest 10"
            - "ACTIVE contract K5 at LIT with room_block_size 1, rate 8000"
            - "layover G1 (crew 2, compliant rest) booked against K5 stay 2026-06-05 and its allocation CONFIRMED — the block of size 1 is now exhausted for that stay_date"
            - "layover G2 (crew 2) with arrival 2026-06-05T18:00:00Z, departure 2026-06-05T23:00:00Z, required_rest_hours 10 — layover_hours 5, effective rest 4.0 < 10, so rest_compliant == false"
