# =============================================================================
# Task 1704 — Cleanroom Assembly & Environmental Monitoring
# ISO-class cleanroom contract assembler: gowning qualification & personnel
# entry log, particle/viable count sampling plan & alert-action limit,
# excursion investigation & product impact, room certification &
# recertification cycle, material transfer & wipe-down protocol, batch record
# & assembly traveler, cleaning validation, customer audit hosting.
# =============================================================================

scenario: |
  Cleanroom Assembly & Environmental Monitoring (ISO-class cleanroom contract
  assembler): gowning qualification & personnel entry log, particle/viable
  count sampling plan & alert-action limit, excursion investigation & product
  impact, room certification & recertification cycle, material transfer &
  wipe-down protocol, batch record & assembly traveler, cleaning validation,
  customer audit hosting

domain_name: cleanroom-assembly-environmental
api_prefix: /cleanroom

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  # Actions constrained by ISO/GMP-style regulatory rules with tamper-evident
  # audit trail; segregation of duties; excursion→investigation→disposition
  # cascades.
  secondary_archetype: posture_driven_gating
  # Cleanroom.environment_posture (IN_CONTROL / ALERT / ACTION / SHUTDOWN) is
  # a derived aggregate of open Excursions and latest certification; it gates
  # personnel entry, material transfer, traveler start, and batch release.
  complexity_layers:
    - cascading_side_effects      # excursion → investigation → product impact → batch hold → room posture
    - rate_threshold_triggers     # alert vs action limits, boundary >= semantics, cleaning-cycle counters
    - derived_field_reconciliation # environment_posture, certification validity, qualification expiry
    - optimistic_concurrency      # OCC on Cleanroom.version for certification supersede

  entity_topology: flat
  # Peer entities joined by foreign keys (no URL nesting); every aggregate is
  # reached by filtered-list or sub-resource GETs.

  state_machine_shape: parallel
  # Cleanroom carries TWO independent state dimensions (certification_status ×
  # environment_posture); Excursion has a cyclic investigation loop
  # (OPEN → UNDER_INVESTIGATION → OPEN on rejected investigation);
  # CleaningValidationProgram has a cycle counter with reset-on-failure.

  relationship_patterns:
    - one_to_many        # Room → SamplingPoints, Room → EntryLogs, Batch → Travelers
    - cross_aggregate    # Excursion references SamplingPoint AND triggers BatchHold on Batch
    - self_referential   # Excursion.recurrence_of_excursion_id links excursions

  role_model: segregation_of_duties
  # The operator who records an excursion CANNOT close its investigation;
  # the QA who releases a batch CANNOT be the operator who started its traveler
  # (same X-User-ID check); the technician who performs a cleaning cycle cannot
  # verify that same cycle.

  consistency_model: immediate
  # All side effects are atomic within the triggering request.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cleanroom
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: room_code, type: string, source: input, description: "Unique room identifier, e.g. CR-101" }
      - { name: iso_class, type: enum, source: input, description: "ISO_5 | ISO_6 | ISO_7 | ISO_8 — cleanroom classification target" }
      - { name: particle_alert_limit, type: integer, source: input, description: "Particles/m^3 >= 0.5um alert limit; excursion when sample result >= this" }
      - { name: particle_action_limit, type: integer, source: input, description: "Particles/m^3 >= 0.5um action limit; must be > particle_alert_limit" }
      - { name: viable_alert_limit, type: integer, source: input, description: "CFU/m^3 viable alert limit" }
      - { name: viable_action_limit, type: integer, source: input, description: "CFU/m^3 viable action limit; must be > viable_alert_limit" }
      - { name: recert_interval_days, type: integer, source: input, description: "Recertification interval; certification expires when now >= certified_at + recert_interval_days" }
      - { name: certification_status, type: enum, source: system, default: UNCERTIFIED, description: "UNCERTIFIED | CERTIFIED | CERTIFICATION_EXPIRED | CERTIFICATION_SUSPENDED" }
      - { name: certified_at, type: datetime, source: system, description: "Timestamp of latest passed certification; null when UNCERTIFIED", default: null }
      - { name: environment_posture, type: enum, source: computed, default: IN_CONTROL, description: "IN_CONTROL | ALERT | ACTION | SHUTDOWN — derived from open excursions and certification_status; gates entry, transfer, traveler start, batch release" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECOMMISSIONED" }

  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique employee badge code" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: role_title, type: string, source: input, description: "Job title" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — suspension blocks all room entries" }

  - name: GowningQualification
    parent: null
    common_fields: true
    fields:
      - { name: personnel_id, type: string, source: input, description: "FK -> Personnel.id; the qualified operator" }
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id; qualification is per-room" }
      - { name: qualified_at, type: datetime, source: system, description: "Server timestamp when qualification was granted" }
      - { name: qualification_expires_at, type: datetime, source: computed, description: "= qualified_at + 365 days; entry denied when now >= qualification_expires_at" }
      - { name: status, type: enum, source: system, default: QUALIFIED, description: "QUALIFIED | EXPIRED | REVOKED" }

  - name: SamplingPoint
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id" }
      - { name: point_code, type: string, source: input, description: "Unique-within-room location code, e.g. SP-01" }
      - { name: metric, type: enum, source: input, description: "PARTICLE | VIABLE" }
      - { name: zone_iso_class, type: enum, source: input, description: "ISO_5 | ISO_6 | ISO_7 | ISO_8 — zone class used by severity scoring; must equal room iso_class at creation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED — retired points reject new samples" }

  - name: EnvironmentalSample
    parent: null
    common_fields: true
    fields:
      - { name: sampling_point_id, type: string, source: input, description: "FK -> SamplingPoint.id" }
      - { name: result_value, type: integer, source: input, description: "Measured count (particles/m^3 or CFU/m^3); >= 0" }
      - { name: sampled_at, type: datetime, source: input, description: "When the sample was physically taken" }
      - { name: classification, type: enum, source: computed, description: "IN_CONTROL | ALERT_EXCEEDED | ACTION_EXCEEDED — per-sample: result >= action_limit -> ACTION_EXCEEDED; else result >= alert_limit -> ALERT_EXCEEDED (boundary is >=)" }
      - { name: triggered_excursion_id, type: string, source: system, description: "FK -> Excursion.id; excursion auto-created when classification != IN_CONTROL", default: null }

  - name: Excursion
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: system, description: "FK -> Cleanroom.id; denormalized from sampling point" }
      - { name: sampling_point_id, type: string, source: system, description: "FK -> SamplingPoint.id" }
      - { name: sample_id, type: string, source: system, description: "FK -> EnvironmentalSample.id that triggered this excursion" }
      - { name: severity, type: enum, source: computed, description: "ALERT | ACTION — mirrors sample classification" }
      - { name: severity_score, type: number, source: computed, description: "base_weight(metric) * zone_multiplier * (1 + 0.25 * recurrence_count); see calculations.excursion_severity_score" }
      - { name: recurrence_of_excursion_id, type: string, source: input, description: "FK -> Excursion.id; optional self-link declaring this a recurrence of an earlier CLOSED excursion at the same point", default: null }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the sampler who recorded the triggering sample; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_INVESTIGATION | CLOSED" }

  - name: ExcursionInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: excursion_id, type: string, source: input, description: "FK -> Excursion.id; exactly one OPEN investigation per excursion" }
      - { name: root_cause, type: string, source: input, description: "Root cause narrative, min 20 chars" }
      - { name: product_impact, type: enum, source: input, description: "NONE | POTENTIAL | CONFIRMED — CONFIRMED forces batch holds" }
      - { name: disposition, type: enum, source: input, description: "RELEASE | REJECT | REWORK — product disposition decision" }
      - { name: investigated_by_user_id, type: string, source: system, description: "X-User-ID of investigating QA; must differ from excursion.recorded_by_user_id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | REJECTED — REJECTED loops excursion back to OPEN" }

  - name: RoomCertification
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id" }
      - { name: executed_at, type: datetime, source: input, description: "When the certification test was physically executed" }
      - { name: location_mean_values, type: array, source: input, description: "Per-location mean particle concentrations used for the mean-based grade check" }
      - { name: grade_passed, type: boolean, source: computed, description: "true iff mean(location_mean_values) < room.particle_alert_limit (strictly below; certification uses MEAN, excursion uses PER-SAMPLE)" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL — PASS requires grade_passed AND zero excursions in {OPEN, UNDER_INVESTIGATION} for the room" }
      - { name: supersedes_certification_id, type: string, source: input, description: "FK -> RoomCertification.id; when set, this certification replaces the referenced one", default: null }

  - name: MaterialTransfer
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id; destination room" }
      - { name: material_lot, type: string, source: input, description: "Supplier lot identifier" }
      - { name: item_description, type: string, source: input, description: "What is being transferred" }
      - { name: staged_at, type: datetime, source: system, description: "When item entered the pass-through airlock (creation time)" }
      - { name: dwell_minutes, type: integer, source: input, description: "Required airlock dwell before introduction; introduction allowed when now >= staged_at + dwell_minutes (boundary is >=)" }
      - { name: wiped_down, type: boolean, source: input, description: "Whether the wipe-down protocol step was performed" }
      - { name: status, type: enum, source: system, default: STAGED, description: "STAGED | INTRODUCED | REJECTED" }

  - name: AssemblyBatch
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id; room where assembly occurs" }
      - { name: batch_number, type: string, source: input, description: "Unique batch identifier" }
      - { name: product_code, type: string, source: input, description: "Product being assembled" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_PROGRESS | COMPLETE | RELEASED | REJECTED | ON_HOLD" }
      - { name: hold_reason, type: string, source: system, description: "Populated when ON_HOLD: e.g. EXCURSION_PRODUCT_IMPACT", default: null }

  - name: AssemblyTraveler
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> AssemblyBatch.id" }
      - { name: step_sequence, type: integer, source: input, description: "Step number within the traveler; steps must complete in ascending order" }
      - { name: step_description, type: string, source: input, description: "Work instruction text" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the operator performing the step; segregation anchor vs batch releaser" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | IN_PROGRESS | COMPLETE | VOID" }

  - name: EntryLog
    parent: null
    common_fields: true
    fields:
      - { name: personnel_id, type: string, source: input, description: "FK -> Personnel.id" }
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id" }
      - { name: entered_at, type: datetime, source: system, description: "Server timestamp of entry" }
      - { name: exited_at, type: datetime, source: system, description: "Server timestamp of exit; null while inside", default: null }

  - name: CleaningValidationProgram
    parent: null
    common_fields: true
    fields:
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id; one ACTIVE program per room" }
      - { name: method_code, type: string, source: input, description: "Cleaning method identifier" }
      - { name: required_consecutive_passes, type: integer, source: input, default: 3, description: "Consecutive verified passes needed to reach VALIDATED" }
      - { name: consecutive_pass_count, type: integer, source: computed, default: 0, description: "Resets to 0 on any failed or rejected cycle" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | VALIDATED | RE_VALIDATION_REQUIRED" }

  - name: CleaningCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CleaningValidationProgram.id" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of technician who cleaned; cannot verify own cycle" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL — analytical result of the cleaning run" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of QA verifier, set on verify", default: null }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VERIFIED | REJECTED" }

  - name: CustomerAudit
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Customer identifier hosting the audit" }
      - { name: cleanroom_id, type: string, source: input, description: "FK -> Cleanroom.id; audited room" }
      - { name: window_start, type: datetime, source: input, description: "Audit scope window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Audit scope window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | CLOSED — CLOSED requires every finding CAPA_VERIFIED" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> CustomerAudit.id" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Finding text" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CAPA_SUBMITTED | CAPA_VERIFIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cleanroom
    initial_state: "certification_status=UNCERTIFIED, environment_posture=IN_CONTROL, status=ACTIVE"
    terminal_states: ["status=DECOMMISSIONED"]
    note: >
      TWO PARALLEL state dimensions on one row. Dimension 1 (certification_status):
      UNCERTIFIED -> CERTIFIED -> CERTIFICATION_EXPIRED -> CERTIFIED (cycle via
      recertification) and CERTIFIED -> CERTIFICATION_SUSPENDED -> CERTIFIED.
      Dimension 2 (environment_posture): derived, IN_CONTROL <-> ALERT <-> ACTION
      <-> SHUTDOWN; recomputed after every excursion status change and every
      certification result. environment_posture is NEVER set directly.
    transitions:
      - from: "certification_status=UNCERTIFIED"
        to: "certification_status=CERTIFIED"
        trigger: "POST /cleanroom/rooms/{id}/certifications (result=PASS)"
        actor: QualityAssurance
        preconditions:
          - "Room status == ACTIVE (ERR_ROOM_NOT_ACTIVE)"
          - "grade_passed == true, i.e. mean(location_mean_values) < particle_alert_limit (ERR_CERTIFICATION_GRADE_FAILED)"
          - "Zero excursions in {OPEN, UNDER_INVESTIGATION} for this room (ERR_OPEN_EXCURSIONS_BLOCK_CERTIFICATION)"
          - "At least one CleaningValidationProgram for this room in VALIDATED status (ERR_CLEANING_NOT_VALIDATED)"
        side_effects:
          - "certified_at = executed_at; referenced supersedes_certification_id (if any) is marked superseded"
          - "increments Cleanroom.version by 1; recompute environment_posture"
      - from: "certification_status=CERTIFIED"
        to: "certification_status=CERTIFICATION_EXPIRED"
        trigger: "system (lazy evaluation on any room read/write when now >= certified_at + recert_interval_days)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute environment_posture per calculations.environment_posture_derivation (a non-CERTIFIED certification_status forces a floor of ALERT)"
      - from: "certification_status=CERTIFICATION_EXPIRED"
        to: "certification_status=CERTIFIED"
        trigger: "POST /cleanroom/rooms/{id}/certifications (result=PASS, supersedes prior)"
        actor: QualityAssurance
        preconditions:
          - "Same as UNCERTIFIED -> CERTIFIED"
        side_effects:
          - "certified_at refreshed; version incremented; environment_posture recomputed"
      - from: "certification_status=CERTIFIED"
        to: "certification_status=CERTIFICATION_SUSPENDED"
        trigger: "POST /cleanroom/rooms/{id}/certifications/{certId}/void"
        actor: QualityAssurance
        preconditions:
          - "Target certification is the room's latest PASS certification, where 'latest' is pinned as: among RoomCertification rows with cleanroom_id == room.id and result == PASS, order by executed_at DESC with tie-break created_at DESC, take the first (ERR_NOT_LATEST_CERTIFICATION if the target is not that row)"
        side_effects:
          - "environment_posture recomputed; any room-dependent gating now fails"
      - from: "certification_status=CERTIFICATION_SUSPENDED"
        to: "certification_status=CERTIFIED"
        trigger: "POST /cleanroom/rooms/{id}/certifications (new PASS)"
        actor: QualityAssurance
        preconditions:
          - "Same as UNCERTIFIED -> CERTIFIED"
        side_effects: ["version incremented; posture recomputed"]
      - from: "environment_posture=IN_CONTROL"
        to: "environment_posture=ALERT"
        trigger: "system (derived): an ALERT-severity excursion enters {OPEN, UNDER_INVESTIGATION}, or certification expires"
        actor: system
        preconditions: []
        side_effects: []
      - from: "environment_posture=ALERT"
        to: "environment_posture=IN_CONTROL"
        trigger: "system (derived): last open ALERT excursion CLOSED and certification_status == CERTIFIED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "environment_posture=ALERT"
        to: "environment_posture=ACTION"
        trigger: "system (derived): an ACTION-severity excursion enters {OPEN, UNDER_INVESTIGATION}"
        actor: system
        preconditions: []
        side_effects: []
      - from: "environment_posture=ACTION"
        to: "environment_posture=SHUTDOWN"
        trigger: "system (derived): an excursion investigation is APPROVED with product_impact=CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "All AssemblyBatch in {OPEN, IN_PROGRESS} for this room -> ON_HOLD (hold_reason=EXCURSION_PRODUCT_IMPACT)"
          - "All MaterialTransfer in STAGED for this room -> REJECTED"
      - from: "environment_posture=SHUTDOWN"
        to: "environment_posture=IN_CONTROL"
        trigger: "system (derived) per calculations.environment_posture_derivation: a fresh PASS certification recorded AFTER the CONFIRMED-impact approval, with zero excursions in {OPEN, UNDER_INVESTIGATION}"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Excursion
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "CYCLIC: OPEN -> UNDER_INVESTIGATION -> OPEN when investigation is REJECTED (loop count unbounded)."
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /cleanroom/excursions/{id}/investigations"
        actor: QualityAssurance
        preconditions:
          - "Excursion status == OPEN (ERR_EXCURSION_NOT_OPEN)"
          - "No other ExcursionInvestigation for this excursion in {DRAFT} (ERR_INVESTIGATION_ALREADY_OPEN)"
        side_effects:
          - "investigated_by_user_id = X-User-ID; must differ from excursion.recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
      - from: UNDER_INVESTIGATION
        to: CLOSED
        trigger: "POST /cleanroom/investigations/{investigationId}/approve"
        actor: QualityAssurance
        preconditions:
          - "Investigation status == DRAFT (ERR_INVESTIGATION_NOT_DRAFT)"
          - "Approver X-User-ID != investigation.investigated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Investigation.status -> APPROVED; Excursion.status -> CLOSED"
          - "If product_impact == CONFIRMED: room posture recompute (may enter SHUTDOWN; batch holds fire)"
          - "If product_impact == NONE or POTENTIAL: room posture recompute (may recover)"
      - from: UNDER_INVESTIGATION
        to: OPEN
        trigger: "POST /cleanroom/investigations/{investigationId}/reject"
        actor: QualityAssurance
        preconditions:
          - "Investigation status == DRAFT (ERR_INVESTIGATION_NOT_DRAFT)"
        side_effects:
          - "Investigation.status -> REJECTED; Excursion.status -> OPEN (cycle); posture recomputed (stays ALERT/ACTION)"

  - entity: ExcursionInvestigation
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Created in DRAFT by POST /cleanroom/excursions/{id}/investigations; exactly one DRAFT per excursion. Approve/reject are terminal and drive the parent Excursion's state."
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /cleanroom/investigations/{investigationId}/approve"
        actor: QualityAssurance
        preconditions:
          - "Investigation status == DRAFT (ERR_INVESTIGATION_NOT_DRAFT)"
          - "Approver X-User-ID != investigation.investigated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Parent Excursion UNDER_INVESTIGATION -> CLOSED"
          - "Posture recompute per calculations.environment_posture_derivation; CONFIRMED impact cascades (batches ON_HOLD, staged transfers REJECTED)"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /cleanroom/investigations/{investigationId}/reject"
        actor: QualityAssurance
        preconditions:
          - "Investigation status == DRAFT (ERR_INVESTIGATION_NOT_DRAFT)"
        side_effects:
          - "Parent Excursion UNDER_INVESTIGATION -> OPEN (cycle)"

  - entity: AssemblyBatch
    initial_state: OPEN
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "system (automatic when the batch's first traveler step moves PENDING -> IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "system (automatic when every AssemblyTraveler of the batch is COMPLETE or VOID and at least one is COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: RELEASED
        trigger: "POST /cleanroom/batches/{batchId}/release"
        actor: QualityAssurance
        preconditions:
          - "Batch status == COMPLETE (ERR_BATCH_NOT_COMPLETE)"
          - "Room environment_posture == IN_CONTROL (ERR_ROOM_NOT_IN_CONTROL)"
          - "Room certification_status == CERTIFIED (ERR_ROOM_NOT_CERTIFIED)"
          - "Releaser X-User-ID differs from performed_by_user_id of EVERY traveler step of this batch (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["increments AssemblyBatch.version by 1"]
      - from: COMPLETE
        to: REJECTED
        trigger: "POST /cleanroom/batches/{batchId}/reject"
        actor: QualityAssurance
        preconditions:
          - "Batch status == COMPLETE (ERR_BATCH_NOT_COMPLETE)"
        side_effects: []
      - from: "OPEN or IN_PROGRESS"
        to: ON_HOLD
        trigger: "system (cascade from room entering SHUTDOWN)"
        actor: system
        preconditions: []
        side_effects: ["hold_reason = EXCURSION_PRODUCT_IMPACT"]
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /cleanroom/batches/{batchId}/resume"
        actor: QualityAssurance
        preconditions:
          - "Batch status == ON_HOLD (ERR_BATCH_NOT_ON_HOLD)"
          - "Room environment_posture == IN_CONTROL (ERR_ROOM_NOT_IN_CONTROL)"
        side_effects: ["hold_reason cleared"]

  - entity: AssemblyTraveler
    initial_state: PENDING
    terminal_states: [COMPLETE, VOID]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /cleanroom/travelers/{travelerId}/start"
        actor: ProductionOperator
        preconditions:
          - "Batch status in {OPEN, IN_PROGRESS} (ERR_BATCH_NOT_STARTABLE)"
          - "Room environment_posture == IN_CONTROL (ERR_ROOM_NOT_IN_CONTROL)"
          - "All sibling travelers with lower step_sequence are COMPLETE or VOID (ERR_TRAVELER_STEP_ORDER)"
          - "Operator holds a QUALIFIED GowningQualification for this room, not expired (ERR_GOWNING_NOT_QUALIFIED)"
        side_effects:
          - "performed_by_user_id = X-User-ID; batch OPEN -> IN_PROGRESS on first start"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /cleanroom/travelers/{travelerId}/complete"
        actor: ProductionOperator
        preconditions:
          - "Traveler status == IN_PROGRESS (ERR_TRAVELER_NOT_IN_PROGRESS)"
          - "Completer X-User-ID == traveler.performed_by_user_id (ERR_TRAVELER_PERFORMER_MISMATCH)"
        side_effects:
          - "If all batch travelers COMPLETE/VOID and >= 1 COMPLETE: batch -> COMPLETE"
      - from: PENDING
        to: VOID
        trigger: "POST /cleanroom/travelers/{travelerId}/void"
        actor: QualityAssurance
        preconditions:
          - "Traveler status == PENDING (ERR_TRAVELER_NOT_VOIDABLE)"
        side_effects: []

  - entity: CleaningValidationProgram
    initial_state: DRAFT
    terminal_states: []
    note: "CYCLIC: VALIDATED -> RE_VALIDATION_REQUIRED -> VALIDATED (re-validation loop); DRAFT -> ACTIVE once."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cleanroom/cleaning-programs/{programId}/activate"
        actor: QualityAssurance
        preconditions:
          - "No other program for the same room in {ACTIVE, VALIDATED} (ERR_PROGRAM_ALREADY_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: VALIDATED
        trigger: "system (automatic when consecutive_pass_count >= required_consecutive_passes; boundary is >=)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: RE_VALIDATION_REQUIRED
        trigger: "system (automatic when a CleaningCycle of this program is REJECTED or records result=FAIL)"
        actor: system
        preconditions: []
        side_effects: ["consecutive_pass_count reset to 0"]
      - from: RE_VALIDATION_REQUIRED
        to: VALIDATED
        trigger: "system (automatic when consecutive_pass_count again reaches required_consecutive_passes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CleaningCycle
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /cleanroom/cleaning-cycles/{cycleId}/verify"
        actor: QualityAssurance
        preconditions:
          - "Cycle status == RECORDED (ERR_CYCLE_NOT_RECORDED)"
          - "Cycle result == PASS (ERR_CYCLE_RESULT_FAIL)"
          - "Verifier X-User-ID != cycle.performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID; program.consecutive_pass_count += 1"
          - "If consecutive_pass_count >= required_consecutive_passes: program ACTIVE/RE_VALIDATION_REQUIRED -> VALIDATED"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /cleanroom/cleaning-cycles/{cycleId}/reject"
        actor: QualityAssurance
        preconditions:
          - "Cycle status == RECORDED (ERR_CYCLE_NOT_RECORDED)"
        side_effects:
          - "program.consecutive_pass_count = 0; if program VALIDATED -> RE_VALIDATION_REQUIRED"
      - from: RECORDED
        to: REJECTED
        trigger: "system (automatic when the cycle is recorded with result=FAIL — recorded directly as REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "program.consecutive_pass_count = 0; if program VALIDATED -> RE_VALIDATION_REQUIRED"

  - entity: MaterialTransfer
    initial_state: STAGED
    terminal_states: [INTRODUCED, REJECTED]
    transitions:
      - from: STAGED
        to: INTRODUCED
        trigger: "POST /cleanroom/material-transfers/{transferId}/introduce"
        actor: MaterialHandler
        preconditions:
          - "Transfer status == STAGED (ERR_TRANSFER_NOT_STAGED)"
          - "wiped_down == true (ERR_WIPE_DOWN_MISSING)"
          - "now >= staged_at + dwell_minutes (ERR_DWELL_TIME_NOT_MET) — boundary is >="
          - "Room environment_posture == IN_CONTROL (ERR_ROOM_NOT_IN_CONTROL)"
          - "Room certification_status == CERTIFIED (ERR_ROOM_NOT_CERTIFIED)"
        side_effects: []
      - from: STAGED
        to: REJECTED
        trigger: "POST /cleanroom/material-transfers/{transferId}/reject  OR  system cascade when room enters SHUTDOWN"
        actor: "MaterialHandler | system"
        preconditions:
          - "Transfer status == STAGED (ERR_TRANSFER_NOT_STAGED) — manual path only"
        side_effects: []

  - entity: CustomerAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cleanroom/audits/{auditId}/open"
        actor: QualityAssurance
        preconditions:
          - "Audit status == SCHEDULED (ERR_AUDIT_NOT_SCHEDULED)"
          - "now >= window_start (ERR_AUDIT_WINDOW_NOT_STARTED)"
        side_effects: []
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /cleanroom/audits/{auditId}/close"
        actor: QualityAssurance
        preconditions:
          - "Audit status == IN_PROGRESS (ERR_AUDIT_NOT_IN_PROGRESS)"
          - "Every AuditFinding of this audit has status == CAPA_VERIFIED (ERR_AUDIT_FINDINGS_OPEN)"
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CAPA_VERIFIED]
    transitions:
      - from: OPEN
        to: CAPA_SUBMITTED
        trigger: "POST /cleanroom/audit-findings/{findingId}/submit-capa"
        actor: QualityAssurance
        preconditions:
          - "Finding status == OPEN (ERR_FINDING_NOT_OPEN)"
        side_effects: []
      - from: CAPA_SUBMITTED
        to: CAPA_VERIFIED
        trigger: "POST /cleanroom/audit-findings/{findingId}/verify-capa"
        actor: QualityAssurance
        preconditions:
          - "Finding status == CAPA_SUBMITTED (ERR_FINDING_NOT_CAPA_SUBMITTED)"
        side_effects:
          - "If this was the audit's last non-verified finding, audit remains IN_PROGRESS until explicitly closed"

  - entity: Personnel
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cleanroom/personnel/{personnelId}/suspend"
        actor: QualityAssurance
        preconditions:
          - "Personnel status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["Any open EntryLog (exited_at null) for this personnel is force-closed with exited_at = now"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cleanroom/personnel/{personnelId}/reinstate"
        actor: QualityAssurance
        preconditions:
          - "Personnel status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: GowningQualification
    initial_state: QUALIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system (lazy evaluation on read when now >= qualification_expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /cleanroom/gowning-qualifications/{qualId}/revoke"
        actor: QualityAssurance
        preconditions:
          - "Qualification status == QUALIFIED (ERR_INVALID_STATE)"
        side_effects: []
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /cleanroom/gowning-qualifications/{qualId}/revoke"
        actor: QualityAssurance
        preconditions:
          - "Qualification status in {QUALIFIED, EXPIRED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: SamplingPoint
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cleanroom/sampling-points/{pointId}/retire"
        actor: QualityAssurance
        preconditions:
          - "Point status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["New samples on a RETIRED point are rejected (ERR_INVALID_STATE)"]

  - entity: Cleanroom (lifecycle dimension)
    initial_state: "status=ACTIVE"
    terminal_states: ["status=DECOMMISSIONED"]
    transitions:
      - from: "status=ACTIVE"
        to: "status=DECOMMISSIONED"
        trigger: "POST /cleanroom/rooms/{roomId}/decommission"
        actor: QualityAssurance
        preconditions:
          - "Room status == ACTIVE (ERR_INVALID_STATE)"
          - "No batches in {OPEN, IN_PROGRESS, ON_HOLD} for this room (ERR_INVALID_STATE)"
          - "No STAGED transfers for this room (ERR_INVALID_STATE)"
        side_effects: ["Room rejects all further operational writes (entries, samples, transfers, travelers, certifications) with ERR_ROOM_NOT_ACTIVE"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only, serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: certification-create-stale-room
    parent_entity: Cleanroom
    write_endpoint: "POST /cleanroom/rooms/{id}/certifications"
    occ_field: expected_room_version
    description: |
      Recording a RoomCertification against a Cleanroom whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just recorded a certification (which
      legitimately supersedes the prior certification under the recertification
      cycle) or where an excursion cascade recomputed the room posture, and
      the current writer's view of the room is therefore stale.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: batch-release-stale-batch
    parent_entity: AssemblyBatch
    write_endpoint: "POST /cleanroom/batches/{batchId}/release"
    occ_field: expected_batch_version
    description: |
      Releasing an AssemblyBatch whose version has advanced since the client
      last observed it is rejected. A room SHUTDOWN cascade may have moved the
      batch to ON_HOLD and back, or a traveler completion may have just
      advanced the batch, leaving the releaser's view stale.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sample_classification
    trigger: "EnvironmentalSample creation"
    algorithm: threshold
    formula: |
      let alert = (metric == PARTICLE) ? room.particle_alert_limit : room.viable_alert_limit
      let action = (metric == PARTICLE) ? room.particle_action_limit : room.viable_action_limit
      if result_value >= action: classification = ACTION_EXCEEDED
      elif result_value >= alert: classification = ALERT_EXCEEDED
      else: classification = IN_CONTROL
      Boundary is STRICTLY >= on both limits: a result exactly equal to the
      alert limit trips ALERT; exactly equal to the action limit trips ACTION.
    input_set: "single EnvironmentalSample + limits of the parent SamplingPoint's room"
    constants:
      BOUNDARY_OPERATOR: ">="
    precision: "integer counts; no rounding"
    variants:
      - name: per_sample_excursion
        when: "excursion detection — every individual sample is judged against the limits"
        difference: "ANY single result >= alert limit creates an excursion, regardless of other samples"
      - name: mean_based_certification
        when: "room certification grade check (RoomCertification.grade_passed)"
        difference: "uses mean(location_mean_values) < particle_alert_limit (strictly below) — the SAME numbers can trip a per-sample ALERT excursion while the mean-based certification grade still passes"

  - name: excursion_severity_score
    trigger: "Excursion creation"
    algorithm: weighted_scoring
    formula: |
      base = (metric == VIABLE) ? 10 : 4
      zone = { ISO_5: 3, ISO_6: 2.5, ISO_7: 2, ISO_8: 1 }[sampling_point.zone_iso_class]
      recurrence_count = number of CLOSED excursions at the SAME sampling_point_id
                         with sampled_at within the 30 days preceding this sample's
                         sampled_at (window: [sampled_at - 30d, sampled_at), inclusive
                         of the lower bound, exclusive of sampled_at itself)
      severity_score = base * zone * (1 + 0.25 * recurrence_count)
      Evaluation order is pinned: recurrence_count is computed from excursions
      CLOSED BEFORE this excursion's creation; this excursion never counts itself.
    input_set: "Excursion + SamplingPoint + closed sibling excursions at the same point in the trailing 30-day half-open window"
    constants:
      VIABLE_BASE: 10
      PARTICLE_BASE: 4
      RECURRENCE_WEIGHT: 0.25
      RECURRENCE_WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"

  - name: certification_grade_check
    trigger: "RoomCertification creation"
    algorithm: aggregation
    formula: |
      grade_passed = ( mean(location_mean_values) < room.particle_alert_limit )
      mean = sum(location_mean_values) / count(location_mean_values)
      Comparison is STRICTLY below (<): a mean exactly equal to the alert limit
      FAILS certification, even though a single sample exactly AT the alert limit
      only produces an ALERT excursion. location_mean_values must be non-empty.
    input_set: "RoomCertification.location_mean_values (input array) + room.particle_alert_limit"
    precision: "mean computed at full precision; comparison on the unrounded mean"

  - name: certification_expiry
    trigger: "any read or write touching a Cleanroom with certification_status == CERTIFIED"
    algorithm: threshold
    formula: |
      expired = ( now >= certified_at + recert_interval_days * 86400 seconds )
      Boundary is >= : at the exact instant certified_at + interval the
      certification is EXPIRED. Lazy transition CERTIFIED -> CERTIFICATION_EXPIRED.
    input_set: "Cleanroom.certified_at, Cleanroom.recert_interval_days, logical clock"
    precision: "second precision on ISO8601 timestamps"

  - name: gowning_qualification_expiry
    trigger: "entry-log creation and traveler start"
    algorithm: threshold
    formula: |
      qualification_expires_at = qualified_at + 365 * 86400 seconds
      expired = ( now >= qualification_expires_at )
      Boundary is >= : at the exact expiry instant entry is DENIED.
    input_set: "GowningQualification.qualified_at, logical clock"
    constants:
      QUALIFICATION_VALID_DAYS: 365
    precision: "second precision"

  - name: consecutive_pass_count
    trigger: "CleaningCycle verify / reject / fail-record"
    algorithm: aggregation
    formula: |
      On VERIFIED cycle (result==PASS): consecutive_pass_count += 1
      On REJECTED cycle or cycle recorded with result==FAIL: consecutive_pass_count = 0
      Program reaches VALIDATED when consecutive_pass_count >= required_consecutive_passes
      (boundary is >= : reaching exactly the required count validates).
    input_set: "CleaningCycle rows of one CleaningValidationProgram, ordered by created_at ASC"
    precision: "integer"

  - name: environment_posture_derivation
    trigger: "any Excursion status change, any certification_status change, any investigation approval"
    algorithm: constraint_propagation
    formula: |
      open_excursions = Excursion rows with cleanroom_id == room.id
                        AND status IN {OPEN, UNDER_INVESTIGATION}
      if any open_excursions has an APPROVED investigation with product_impact == CONFIRMED
         whose closure has not yet been superseded by a fresh PASS certification:
           posture = SHUTDOWN
      elif any open_excursions has severity == ACTION: posture = ACTION
      elif any open_excursions has severity == ALERT:  posture = ALERT
      elif certification_status != CERTIFIED:          posture = ALERT  (floor)
      else:                                            posture = IN_CONTROL
      Evaluation order is pinned top-to-bottom; first match wins. SHUTDOWN
      recovery requires BOTH zero open excursions AND a fresh PASS
      certification recorded after the CONFIRMED approval.
    input_set: "Excursion + ExcursionInvestigation + Cleanroom certification_status"
    precision: "enum; no rounding"

  - name: audit_scope_record_count
    trigger: "CustomerAudit open (IN_PROGRESS)"
    algorithm: aggregation
    formula: |
      scope covers EnvironmentalSample rows of the audited room with
      sampled_at in [window_start, window_end) — start inclusive, end exclusive.
      A sample exactly AT window_end is OUT of scope; exactly AT window_start is IN scope.
    input_set: "EnvironmentalSample by room via SamplingPoint.cleanroom_id"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK id in the body exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "OCC expected_*_version, when required by a §1.2.1 rule, matches the parent's current version"
    error_id: "ERR_STALE_ROOM_VERSION | ERR_STALE_BATCH_VERSION"
    http_status: 412
    applies_to: "POST /cleanroom/rooms/{id}/certifications, POST /cleanroom/batches/{batchId}/release"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Room environment_posture == IN_CONTROL where required (entry, transfer introduction, traveler start, batch release)"
    error_id: ERR_ROOM_NOT_IN_CONTROL
    http_status: 409
    applies_to: "POST /cleanroom/entry-logs, POST /cleanroom/material-transfers/{id}/introduce, POST /cleanroom/travelers/{id}/start, POST /cleanroom/batches/{id}/release"

  - priority: 7
    category: business_safety
    check: "Room certification_status == CERTIFIED where required (transfer introduction, batch release)"
    error_id: ERR_ROOM_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /cleanroom/material-transfers/{id}/introduce, POST /cleanroom/batches/{id}/release"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: actor differs from the anchored prior actor (excursion recorder vs investigator, investigator vs approver, cycle performer vs verifier, traveler performer vs batch releaser)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cleanroom/excursions/{id}/investigations, POST /cleanroom/investigations/{id}/approve, POST /cleanroom/cleaning-cycles/{id}/verify, POST /cleanroom/batches/{id}/release"

  - priority: 9
    category: business_constraint
    check: "Structural request validity: required fields present, enum values valid, action_limit > alert_limit, window_end > window_start, dwell_minutes >= 0, result_value >= 0, root_cause >= 20 chars"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 10
    category: business_referential
    check: "Cross-references coherent: sampling point belongs to room, qualification matches (personnel, room), traveler belongs to batch, recurrence_of_excursion_id points to a CLOSED excursion at the same point"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "endpoints carrying FK ids in body"

  - priority: 11
    category: business_temporal
    check: "Temporal gates: gowning qualification not expired (now < qualification_expires_at), dwell elapsed (now >= staged_at + dwell_minutes), audit window started (now >= window_start)"
    error_id: "ERR_GOWNING_NOT_QUALIFIED | ERR_DWELL_TIME_NOT_MET | ERR_AUDIT_WINDOW_NOT_STARTED"
    http_status: 409
    applies_to: "POST /cleanroom/entry-logs, POST /cleanroom/travelers/{id}/start, POST /cleanroom/material-transfers/{id}/introduce, POST /cleanroom/audits/{id}/open"

  - priority: 11.5
    category: business_safety
    check: "Personnel status == ACTIVE at entry (SUSPENDED personnel may not enter any room)"
    error_id: ERR_PERSONNEL_SUSPENDED
    http_status: 409
    applies_to: "POST /cleanroom/entry-logs"

  - priority: 12
    category: business_constraint
    check: "Aggregate guards: no second DRAFT investigation per excursion, no second ACTIVE/VALIDATED cleaning program per room, no second open (exited_at null) EntryLog for the same (personnel_id, cleanroom_id) pair, traveler step order, batch release requires all travelers settled, audit close requires all findings CAPA_VERIFIED, certification requires zero open excursions and a VALIDATED cleaning program"
    error_id: "ERR_INVESTIGATION_ALREADY_OPEN | ERR_PROGRAM_ALREADY_ACTIVE | ERR_ENTRY_ALREADY_OPEN | ERR_TRAVELER_STEP_ORDER | ERR_BATCH_TRAVELERS_UNSETTLED | ERR_AUDIT_FINDINGS_OPEN | ERR_OPEN_EXCURSIONS_BLOCK_CERTIFICATION | ERR_CLEANING_NOT_VALIDATED"
    http_status: 409
    applies_to: "per-endpoint aggregate checks"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/cleanroom/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [QualityAssurance]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Lazy certification/qualification expiry re-evaluated on next room access"]

  # --- Cleanrooms ---
  - method: POST
    path: "/cleanroom/rooms"
    description: "Register a cleanroom"
    roles: [QualityAssurance]
    code: 201
    input: [room_code, iso_class, particle_alert_limit, particle_action_limit, viable_alert_limit, viable_action_limit, recert_interval_days]
    output: Cleanroom
    side_effects: ["certification_status=UNCERTIFIED, environment_posture=IN_CONTROL, status=ACTIVE, version=1"]

  - method: GET
    path: "/cleanroom/rooms"
    description: "List cleanrooms"
    roles: [QualityAssurance, ProductionOperator, MaterialHandler, EnvironmentTech]
    code: 200
    input: ["iso_class?", "certification_status?", "limit?", "offset?"]
    output: "Cleanroom[]"
    side_effects: ["Lazy expiry: CERTIFIED -> CERTIFICATION_EXPIRED when now >= certified_at + recert_interval_days"]

  - method: GET
    path: "/cleanroom/rooms/{roomId}"
    description: "Get one cleanroom (with lazy expiry evaluation)"
    roles: [QualityAssurance, ProductionOperator, MaterialHandler, EnvironmentTech]
    code: 200
    input: []
    output: Cleanroom
    side_effects: ["Lazy expiry evaluation"]

  # --- Sampling points ---
  - method: POST
    path: "/cleanroom/rooms/{id}/sampling-points"
    description: "Define a sampling point in a room"
    roles: [QualityAssurance]
    code: 201
    input: [point_code, metric, zone_iso_class]
    output: SamplingPoint
    side_effects: []

  - method: GET
    path: "/cleanroom/rooms/{id}/sampling-points"
    description: "List sampling points of a room"
    roles: [QualityAssurance, ProductionOperator, MaterialHandler, EnvironmentTech]
    code: 200
    input: []
    output: "SamplingPoint[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/sampling-points/{pointId}"
    description: "Get one sampling point"
    roles: [QualityAssurance, ProductionOperator, MaterialHandler, EnvironmentTech]
    code: 200
    input: []
    output: SamplingPoint
    side_effects: []

  - method: POST
    path: "/cleanroom/sampling-points/{pointId}/retire"
    description: "Retire a sampling point (rejects new samples)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: SamplingPoint
    side_effects: ["status ACTIVE -> RETIRED"]

  - method: POST
    path: "/cleanroom/rooms/{roomId}/decommission"
    description: "Decommission a cleanroom (requires no open batches or staged transfers)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: Cleanroom
    side_effects: ["status ACTIVE -> DECOMMISSIONED; room rejects all further operational writes"]

  # --- Environmental samples (trigger excursions) ---
  - method: POST
    path: "/cleanroom/samples"
    description: "Record an environmental sample; auto-creates an Excursion when classification != IN_CONTROL"
    roles: [EnvironmentTech]
    code: 201
    input: [sampling_point_id, result_value, sampled_at, "recurrence_of_excursion_id?"]
    output: EnvironmentalSample
    side_effects:
      - "classification computed per calculations.sample_classification"
      - "if classification != IN_CONTROL: create Excursion (status=OPEN, severity mirrored, severity_score computed, recorded_by_user_id=X-User-ID) and recompute room environment_posture (IN_CONTROL->ALERT or ->ACTION)"

  - method: GET
    path: "/cleanroom/samples"
    description: "List samples, filterable"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["sampling_point_id?", "classification?", "limit?", "offset?"]
    output: "EnvironmentalSample[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/samples/{sampleId}"
    description: "Get one sample"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: EnvironmentalSample
    side_effects: []

  # --- Excursions & investigations ---
  - method: GET
    path: "/cleanroom/excursions"
    description: "List excursions, filterable"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["cleanroom_id?", "status?", "severity?", "sampling_point_id?", "sample_id?", "recurrence_of_excursion_id?", "limit?", "offset?"]
    output: "Excursion[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/excursions/{id}/samples"
    description: "List samples that triggered a given excursion (0 or 1 element)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "EnvironmentalSample[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/excursions/{excursionId}"
    description: "Get one excursion"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: Excursion
    side_effects: []

  - method: POST
    path: "/cleanroom/excursions/{id}/investigations"
    description: "Open an investigation (moves excursion OPEN -> UNDER_INVESTIGATION)"
    roles: [QualityAssurance]
    code: 201
    input: [root_cause, product_impact, disposition]
    output: ExcursionInvestigation
    side_effects: ["Excursion OPEN -> UNDER_INVESTIGATION"]

  - method: GET
    path: "/cleanroom/excursions/{id}/investigations"
    description: "List investigations of an excursion"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "ExcursionInvestigation[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/investigations/{investigationId}"
    description: "Get one investigation"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: ExcursionInvestigation
    side_effects: []

  - method: POST
    path: "/cleanroom/investigations/{investigationId}/approve"
    description: "Approve investigation: closes excursion; CONFIRMED impact cascades room -> SHUTDOWN, batches -> ON_HOLD, staged transfers -> REJECTED"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: ExcursionInvestigation
    side_effects:
      - "Investigation DRAFT -> APPROVED; Excursion UNDER_INVESTIGATION -> CLOSED"
      - "if product_impact == CONFIRMED: room posture -> SHUTDOWN; room batches in {OPEN, IN_PROGRESS} -> ON_HOLD; room STAGED transfers -> REJECTED"
      - "else: room posture recomputed (may recover to IN_CONTROL)"

  - method: POST
    path: "/cleanroom/investigations/{investigationId}/reject"
    description: "Reject investigation: excursion loops back UNDER_INVESTIGATION -> OPEN"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: ExcursionInvestigation
    side_effects: ["Investigation DRAFT -> REJECTED; Excursion -> OPEN; posture recomputed (stays raised)"]

  # --- Certifications ---
  - method: POST
    path: "/cleanroom/rooms/{id}/certifications"
    description: "Record a room certification (OCC-guarded; PASS requires grade_passed, zero open excursions, and a VALIDATED cleaning program)"
    roles: [QualityAssurance]
    code: 201
    input: [executed_at, location_mean_values, expected_room_version, "supersedes_certification_id?"]
    output: RoomCertification
    side_effects:
      - "result = PASS iff grade_passed AND zero excursions in {OPEN, UNDER_INVESTIGATION} AND a VALIDATED CleaningValidationProgram exists for the room; else FAIL"
      - "on PASS: room certification_status -> CERTIFIED, certified_at = executed_at, increments Cleanroom.version by 1, posture recomputed"

  - method: GET
    path: "/cleanroom/rooms/{id}/certifications"
    description: "List certifications of a room"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "RoomCertification[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/certifications/{certId}"
    description: "Get one certification"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: RoomCertification
    side_effects: []

  - method: GET
    path: "/cleanroom/certifications"
    description: "List certifications across rooms (filtered)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["cleanroom_id?", "supersedes_certification_id?", "limit?", "offset?"]
    output: "RoomCertification[]"
    side_effects: []

  - method: POST
    path: "/cleanroom/rooms/{id}/certifications/{certId}/void"
    description: "Void the latest PASS certification (suspends room certification)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: RoomCertification
    side_effects: ["Room certification_status -> CERTIFICATION_SUSPENDED; posture recomputed"]

  # --- Personnel, gowning, entry ---
  - method: POST
    path: "/cleanroom/personnel"
    description: "Register personnel"
    roles: [QualityAssurance]
    code: 201
    input: [employee_code, full_name, role_title]
    output: Personnel
    side_effects: []

  - method: GET
    path: "/cleanroom/personnel"
    description: "List personnel"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["limit?", "offset?"]
    output: "Personnel[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/personnel/{personnelId}"
    description: "Get one personnel record"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  - method: POST
    path: "/cleanroom/personnel/{personnelId}/suspend"
    description: "Suspend a personnel record (blocks entries; force-closes open entry logs)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: Personnel
    side_effects: ["status ACTIVE -> SUSPENDED; open EntryLogs force-closed"]

  - method: POST
    path: "/cleanroom/personnel/{personnelId}/reinstate"
    description: "Reinstate a suspended personnel record"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: Personnel
    side_effects: ["status SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/cleanroom/gowning-qualifications"
    description: "Grant a per-room gowning qualification (valid 365 days)"
    roles: [QualityAssurance]
    code: 201
    input: [personnel_id, cleanroom_id]
    output: GowningQualification
    side_effects: ["qualified_at = now; qualification_expires_at = now + 365d; status=QUALIFIED"]

  - method: GET
    path: "/cleanroom/gowning-qualifications"
    description: "List gowning qualifications (filtered by personnel_id or cleanroom_id)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["personnel_id?", "cleanroom_id?", "status?", "limit?", "offset?"]
    output: "GowningQualification[]"
    side_effects: ["Lazy expiry: QUALIFIED -> EXPIRED when now >= qualification_expires_at"]

  - method: GET
    path: "/cleanroom/gowning-qualifications/{qualId}"
    description: "Get one gowning qualification"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: GowningQualification
    side_effects: ["Lazy expiry evaluation"]

  - method: POST
    path: "/cleanroom/gowning-qualifications/{qualId}/revoke"
    description: "Revoke a gowning qualification"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: GowningQualification
    side_effects: ["status {QUALIFIED, EXPIRED} -> REVOKED"]

  - method: GET
    path: "/cleanroom/rooms/{id}/gowning-qualifications"
    description: "List gowning qualifications for a room (sub-resource)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "GowningQualification[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/personnel/{id}/gowning-qualifications"
    description: "List gowning qualifications for a personnel record (sub-resource)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "GowningQualification[]"
    side_effects: []

  - method: POST
    path: "/cleanroom/entry-logs"
    description: "Log a personnel entry; requires ACTIVE personnel, QUALIFIED non-expired gowning qualification for the room, and room posture IN_CONTROL"
    roles: [ProductionOperator]
    code: 201
    input: [personnel_id, cleanroom_id]
    output: EntryLog
    side_effects: ["entered_at = now"]

  - method: GET
    path: "/cleanroom/entry-logs"
    description: "List entry logs (filtered)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["personnel_id?", "cleanroom_id?", "limit?", "offset?"]
    output: "EntryLog[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/entry-logs/{entryLogId}"
    description: "Get one entry log"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: EntryLog
    side_effects: []

  - method: POST
    path: "/cleanroom/entry-logs/{entryLogId}/exit"
    description: "Log the matching exit"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: EntryLog
    side_effects: ["exited_at = now"]

  # --- Material transfer ---
  - method: POST
    path: "/cleanroom/material-transfers"
    description: "Stage a material transfer into the airlock"
    roles: [MaterialHandler]
    code: 201
    input: [cleanroom_id, material_lot, item_description, dwell_minutes, wiped_down]
    output: MaterialTransfer
    side_effects: ["staged_at = now; status=STAGED"]

  - method: GET
    path: "/cleanroom/material-transfers"
    description: "List transfers (filtered)"
    roles: [QualityAssurance, MaterialHandler]
    code: 200
    input: ["cleanroom_id?", "status?", "limit?", "offset?"]
    output: "MaterialTransfer[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/material-transfers/{transferId}"
    description: "Get one transfer"
    roles: [QualityAssurance, MaterialHandler]
    code: 200
    input: []
    output: MaterialTransfer
    side_effects: []

  - method: POST
    path: "/cleanroom/material-transfers/{transferId}/introduce"
    description: "Introduce a staged transfer into the room"
    roles: [MaterialHandler]
    code: 200
    input: []
    output: MaterialTransfer
    side_effects: ["status STAGED -> INTRODUCED"]

  - method: POST
    path: "/cleanroom/material-transfers/{transferId}/reject"
    description: "Reject a staged transfer"
    roles: [MaterialHandler]
    code: 200
    input: []
    output: MaterialTransfer
    side_effects: ["status STAGED -> REJECTED"]

  # --- Batches & travelers ---
  - method: POST
    path: "/cleanroom/batches"
    description: "Open an assembly batch"
    roles: [ProductionOperator]
    code: 201
    input: [cleanroom_id, batch_number, product_code]
    output: AssemblyBatch
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/cleanroom/batches"
    description: "List batches (filtered)"
    roles: [QualityAssurance, ProductionOperator]
    code: 200
    input: ["cleanroom_id?", "status?", "limit?", "offset?"]
    output: "AssemblyBatch[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/batches/{batchId}"
    description: "Get one batch"
    roles: [QualityAssurance, ProductionOperator]
    code: 200
    input: []
    output: AssemblyBatch
    side_effects: []

  - method: POST
    path: "/cleanroom/batches/{id}/travelers"
    description: "Add a traveler step to a batch"
    roles: [ProductionOperator]
    code: 201
    input: [step_sequence, step_description]
    output: AssemblyTraveler
    side_effects: []

  - method: GET
    path: "/cleanroom/batches/{id}/travelers"
    description: "List travelers of a batch"
    roles: [QualityAssurance, ProductionOperator]
    code: 200
    input: []
    output: "AssemblyTraveler[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/travelers/{travelerId}"
    description: "Get one traveler"
    roles: [QualityAssurance, ProductionOperator]
    code: 200
    input: []
    output: AssemblyTraveler
    side_effects: []

  - method: POST
    path: "/cleanroom/travelers/{travelerId}/start"
    description: "Start a traveler step (gated on posture, qualification, step order)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: AssemblyTraveler
    side_effects: ["performed_by_user_id = X-User-ID; first start moves batch OPEN -> IN_PROGRESS"]

  - method: POST
    path: "/cleanroom/travelers/{travelerId}/complete"
    description: "Complete a traveler step (performer only); last settle completes the batch"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: AssemblyTraveler
    side_effects: ["if all siblings COMPLETE/VOID and >= 1 COMPLETE: batch -> COMPLETE"]

  - method: POST
    path: "/cleanroom/travelers/{travelerId}/void"
    description: "Void a pending traveler step"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: AssemblyTraveler
    side_effects: []

  - method: POST
    path: "/cleanroom/batches/{batchId}/release"
    description: "Release a completed batch (OCC-guarded; posture, certification, and segregation-of-duties gated)"
    roles: [QualityAssurance]
    code: 200
    input: [expected_batch_version]
    output: AssemblyBatch
    side_effects: ["status COMPLETE -> RELEASED; increments AssemblyBatch.version by 1"]

  - method: POST
    path: "/cleanroom/batches/{batchId}/reject"
    description: "Reject a completed batch"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: AssemblyBatch
    side_effects: ["status COMPLETE -> REJECTED"]

  - method: POST
    path: "/cleanroom/batches/{batchId}/resume"
    description: "Resume an ON_HOLD batch after the room returns IN_CONTROL"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: AssemblyBatch
    side_effects: ["status ON_HOLD -> IN_PROGRESS; hold_reason cleared"]

  # --- Cleaning validation ---
  - method: POST
    path: "/cleanroom/cleaning-programs"
    description: "Create a cleaning validation program for a room"
    roles: [QualityAssurance]
    code: 201
    input: [cleanroom_id, method_code, "required_consecutive_passes?"]
    output: CleaningValidationProgram
    side_effects: ["status=DRAFT, consecutive_pass_count=0"]

  - method: GET
    path: "/cleanroom/cleaning-programs"
    description: "List cleaning programs (filtered)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["cleanroom_id?", "status?", "limit?", "offset?"]
    output: "CleaningValidationProgram[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/cleaning-programs/{programId}"
    description: "Get one cleaning program"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: CleaningValidationProgram
    side_effects: []

  - method: POST
    path: "/cleanroom/cleaning-programs/{programId}/activate"
    description: "Activate a program (only one ACTIVE/VALIDATED per room)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: CleaningValidationProgram
    side_effects: ["status DRAFT -> ACTIVE"]

  - method: POST
    path: "/cleanroom/cleaning-programs/{id}/cycles"
    description: "Record a cleaning cycle; result=FAIL records the cycle directly as REJECTED and resets the program counter"
    roles: [EnvironmentTech]
    code: 201
    input: [result]
    output: CleaningCycle
    side_effects:
      - "performed_by_user_id = X-User-ID"
      - "if result == FAIL: status=REJECTED, program.consecutive_pass_count=0, VALIDATED program -> RE_VALIDATION_REQUIRED"

  - method: GET
    path: "/cleanroom/cleaning-programs/{id}/cycles"
    description: "List cycles of a program"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "CleaningCycle[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/cleaning-cycles/{cycleId}"
    description: "Get one cycle"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: CleaningCycle
    side_effects: []

  - method: POST
    path: "/cleanroom/cleaning-cycles/{cycleId}/verify"
    description: "QA-verify a passing cycle (segregation: verifier != performer); increments consecutive_pass_count and may validate the program"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: CleaningCycle
    side_effects: ["status RECORDED -> VERIFIED; program.consecutive_pass_count += 1; program -> VALIDATED at required_consecutive_passes (>=)"]

  - method: POST
    path: "/cleanroom/cleaning-cycles/{cycleId}/reject"
    description: "QA-reject a cycle; resets program counter and forces re-validation"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: CleaningCycle
    side_effects: ["status RECORDED -> REJECTED; program.consecutive_pass_count = 0; VALIDATED program -> RE_VALIDATION_REQUIRED"]

  # --- Customer audits ---
  - method: POST
    path: "/cleanroom/audits"
    description: "Schedule a customer audit over a scope window"
    roles: [QualityAssurance]
    code: 201
    input: [customer_code, cleanroom_id, window_start, window_end]
    output: CustomerAudit
    side_effects: []

  - method: GET
    path: "/cleanroom/audits"
    description: "List audits (filtered)"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: ["cleanroom_id?", "status?", "limit?", "offset?"]
    output: "CustomerAudit[]"
    side_effects: []

  - method: GET
    path: "/cleanroom/audits/{auditId}"
    description: "Get one audit"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: CustomerAudit
    side_effects: []

  - method: POST
    path: "/cleanroom/audits/{auditId}/open"
    description: "Open an audit (requires now >= window_start)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: CustomerAudit
    side_effects: ["status SCHEDULED -> IN_PROGRESS; audit scope snapshot computed per calculations.audit_scope_record_count"]

  - method: POST
    path: "/cleanroom/audits/{id}/findings"
    description: "Record an audit finding"
    roles: [QualityAssurance]
    code: 201
    input: [severity, description]
    output: AuditFinding
    side_effects: []

  - method: GET
    path: "/cleanroom/audits/{id}/findings"
    description: "List findings of an audit"
    roles: [QualityAssurance, EnvironmentTech]
    code: 200
    input: []
    output: "AuditFinding[]"
    side_effects: []

  - method: POST
    path: "/cleanroom/audit-findings/{findingId}/submit-capa"
    description: "Submit a CAPA for an open finding"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["status OPEN -> CAPA_SUBMITTED"]

  - method: POST
    path: "/cleanroom/audit-findings/{findingId}/verify-capa"
    description: "Verify a submitted CAPA"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["status CAPA_SUBMITTED -> CAPA_VERIFIED"]

  - method: POST
    path: "/cleanroom/audits/{auditId}/close"
    description: "Close an audit (requires every finding CAPA_VERIFIED)"
    roles: [QualityAssurance]
    code: 200
    input: []
    output: CustomerAudit
    side_effects: ["status IN_PROGRESS -> CLOSED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }

  # --- existence / concurrency ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_STALE_ROOM_VERSION, http: 412, condition: "expected_room_version does not match Cleanroom.version (certification create)" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version does not match AssemblyBatch.version (batch release)" }

  # --- generic state / request ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, action_limit <= alert_limit, window_end <= window_start, result_value < 0, dwell_minutes < 0, root_cause < 20 chars" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Cross-reference incoherent (point not in room, qualification mismatch, recurrence target not CLOSED at same point)" }

  # --- room posture / certification ---
  - { id: ERR_ROOM_NOT_IN_CONTROL, http: 409, condition: "Room environment_posture != IN_CONTROL for entry / transfer introduction / traveler start / batch release" }
  - { id: ERR_ROOM_NOT_CERTIFIED, http: 409, condition: "Room certification_status != CERTIFIED for transfer introduction / batch release" }
  - { id: ERR_ROOM_NOT_ACTIVE, http: 409, condition: "Room status != ACTIVE for certification recording" }
  - { id: ERR_CERTIFICATION_GRADE_FAILED, http: 409, condition: "mean(location_mean_values) >= particle_alert_limit on a PASS-attempt certification" }
  - { id: ERR_OPEN_EXCURSIONS_BLOCK_CERTIFICATION, http: 409, condition: "Room has excursions in {OPEN, UNDER_INVESTIGATION} when recording a certification" }
  - { id: ERR_CLEANING_NOT_VALIDATED, http: 409, condition: "No VALIDATED CleaningValidationProgram for the room when recording a certification" }
  - { id: ERR_NOT_LATEST_CERTIFICATION, http: 409, condition: "Void target is not the room's latest PASS certification" }

  # --- excursion / investigation ---
  - { id: ERR_EXCURSION_NOT_OPEN, http: 409, condition: "Investigation open attempted on excursion not in OPEN" }
  - { id: ERR_INVESTIGATION_ALREADY_OPEN, http: 409, condition: "A DRAFT investigation already exists for this excursion" }
  - { id: ERR_INVESTIGATION_NOT_DRAFT, http: 409, condition: "Approve/reject attempted on investigation not in DRAFT" }

  # --- segregation of duties ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated pair (recorder/investigator, investigator/approver, performer/verifier, performer/releaser)" }

  # --- gowning / entry ---
  - { id: ERR_GOWNING_NOT_QUALIFIED, http: 409, condition: "No QUALIFIED, non-expired GowningQualification for (personnel, room) at entry or traveler start" }
  - { id: ERR_PERSONNEL_SUSPENDED, http: 409, condition: "Personnel status == SUSPENDED at entry" }
  - { id: ERR_ENTRY_ALREADY_OPEN, http: 409, condition: "An EntryLog with exited_at null already exists for the same (personnel_id, cleanroom_id) pair" }

  # --- material transfer ---
  - { id: ERR_TRANSFER_NOT_STAGED, http: 409, condition: "Introduce/reject attempted on transfer not in STAGED" }
  - { id: ERR_WIPE_DOWN_MISSING, http: 409, condition: "wiped_down == false at introduction" }
  - { id: ERR_DWELL_TIME_NOT_MET, http: 409, condition: "now < staged_at + dwell_minutes at introduction" }

  # --- batch / traveler ---
  - { id: ERR_BATCH_NOT_COMPLETE, http: 409, condition: "Release/reject attempted on batch not in COMPLETE" }
  - { id: ERR_BATCH_NOT_ON_HOLD, http: 409, condition: "Resume attempted on batch not in ON_HOLD" }
  - { id: ERR_BATCH_NOT_STARTABLE, http: 409, condition: "Traveler start attempted while batch not in {OPEN, IN_PROGRESS}" }
  - { id: ERR_BATCH_TRAVELERS_UNSETTLED, http: 409, condition: "Release attempted while any traveler in {PENDING, IN_PROGRESS}" }
  - { id: ERR_TRAVELER_STEP_ORDER, http: 409, condition: "A lower step_sequence sibling is still PENDING or IN_PROGRESS" }
  - { id: ERR_TRAVELER_NOT_IN_PROGRESS, http: 409, condition: "Complete attempted on traveler not IN_PROGRESS" }
  - { id: ERR_TRAVELER_PERFORMER_MISMATCH, http: 409, condition: "Completer X-User-ID != traveler.performed_by_user_id" }
  - { id: ERR_TRAVELER_NOT_VOIDABLE, http: 409, condition: "Void attempted on traveler not in PENDING" }

  # --- cleaning validation ---
  - { id: ERR_PROGRAM_ALREADY_ACTIVE, http: 409, condition: "Another program for the room is ACTIVE or VALIDATED" }
  - { id: ERR_CYCLE_NOT_RECORDED, http: 409, condition: "Verify/reject attempted on cycle not in RECORDED" }
  - { id: ERR_CYCLE_RESULT_FAIL, http: 409, condition: "Verify attempted on a cycle with result == FAIL" }

  # --- audit ---
  - { id: ERR_AUDIT_NOT_SCHEDULED, http: 409, condition: "Open attempted on audit not in SCHEDULED" }
  - { id: ERR_AUDIT_WINDOW_NOT_STARTED, http: 409, condition: "now < window_start at audit open" }
  - { id: ERR_AUDIT_NOT_IN_PROGRESS, http: 409, condition: "Close attempted on audit not IN_PROGRESS" }
  - { id: ERR_AUDIT_FINDINGS_OPEN, http: 409, condition: "Close attempted while any finding not CAPA_VERIFIED" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "submit-capa attempted on finding not OPEN" }
  - { id: ERR_FINDING_NOT_CAPA_SUBMITTED, http: 409, condition: "verify-capa attempted on finding not CAPA_SUBMITTED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QualityAssurance
    description: "QA unit: owns rooms, certifications, investigations, cleaning verification, batch release, audits, gowning grants, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /cleanroom/rooms"
      - "POST /cleanroom/rooms/{id}/sampling-points"
      - "POST /cleanroom/rooms/{id}/certifications"
      - "POST /cleanroom/rooms/{id}/certifications/{certId}/void"
      - "POST /cleanroom/excursions/{id}/investigations"
      - "POST /cleanroom/investigations/{investigationId}/approve"
      - "POST /cleanroom/investigations/{investigationId}/reject"
      - "POST /cleanroom/personnel"
      - "POST /cleanroom/gowning-qualifications"
      - "POST /cleanroom/batches/{batchId}/release"
      - "POST /cleanroom/batches/{batchId}/reject"
      - "POST /cleanroom/batches/{batchId}/resume"
      - "POST /cleanroom/travelers/{travelerId}/void"
      - "POST /cleanroom/cleaning-programs"
      - "POST /cleanroom/cleaning-programs/{programId}/activate"
      - "POST /cleanroom/cleaning-cycles/{cycleId}/verify"
      - "POST /cleanroom/cleaning-cycles/{cycleId}/reject"
      - "POST /cleanroom/audits"
      - "POST /cleanroom/audits/{auditId}/open"
      - "POST /cleanroom/audits/{id}/findings"
      - "POST /cleanroom/audit-findings/{findingId}/submit-capa"
      - "POST /cleanroom/audit-findings/{findingId}/verify-capa"
      - "POST /cleanroom/audits/{auditId}/close"
      - "POST /cleanroom/personnel/{personnelId}/suspend"
      - "POST /cleanroom/personnel/{personnelId}/reinstate"
      - "POST /cleanroom/gowning-qualifications/{qualId}/revoke"
      - "POST /cleanroom/sampling-points/{pointId}/retire"
      - "POST /cleanroom/rooms/{roomId}/decommission"
      - "POST /cleanroom/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: EnvironmentTech
    description: "Environmental monitoring technician: records samples and cleaning cycles"
    identity: opaque
    exclusive_operations:
      - "POST /cleanroom/samples"
      - "POST /cleanroom/cleaning-programs/{id}/cycles"
    shared_operations:
      - "All GET endpoints"

  - name: ProductionOperator
    description: "Assembly operator: logs room entry/exit, opens batches, works traveler steps"
    identity: opaque
    exclusive_operations:
      - "POST /cleanroom/entry-logs"
      - "POST /cleanroom/entry-logs/{entryLogId}/exit"
      - "POST /cleanroom/batches"
      - "POST /cleanroom/batches/{id}/travelers"
      - "POST /cleanroom/travelers/{travelerId}/start"
      - "POST /cleanroom/travelers/{travelerId}/complete"
    shared_operations:
      - "All GET endpoints"

  - name: MaterialHandler
    description: "Warehouse/material handler: stages and introduces material transfers"
    identity: opaque
    exclusive_operations:
      - "POST /cleanroom/material-transfers"
      - "POST /cleanroom/material-transfers/{transferId}/introduce"
      - "POST /cleanroom/material-transfers/{transferId}/reject"
    shared_operations:
      - "All GET endpoints"

# =============================================================================
# Actor identity convention (binds segregation-of-duties comparisons)
# =============================================================================
actor_identity_convention: |
  All roles are `identity: opaque` — X-User-ID is an opaque operator id not
  backed by any entity. Segregation-of-duties checks (validations priority 8)
  compare X-User-ID STRING equality. In §1.8/§1.9 test recipes, a call that
  omits `as_user_id:` is understood to send a fresh, unique opaque id that is
  distinct from every explicitly pinned `as_user_id` literal and from every
  other omitted-id call in the same instance — so an omitted-id actor never
  accidentally collides with a pinned actor on a segregation check. A
  segregation violation is tested ONLY by pinning the same literal id on both
  sides of a segregated pair (e.g. as_user_id: "tech-rb5" on both the cycle
  record and its verify).
