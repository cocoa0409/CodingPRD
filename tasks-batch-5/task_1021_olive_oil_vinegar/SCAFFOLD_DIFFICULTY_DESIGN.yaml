scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final
        grounds:
          - calculations.order_line_pricing
          - entities.Order.provisional_total_cents
          - entities.Order.final_total_cents
          - state_machines.Order.RESERVED_to_FULFILLED
        distinguishing_aspect: "On an Order (cost domain), the provisional variant prices a 5000ml REFILL at list (total 2495) while the final variant applies the 15% stale-freshness markdown at fulfillment (total 2270); same inputs, different results."
        test_recipe:
          setup:
            - "Member with no allergen restrictions; BULK_OIL product at 0.30 cents/ml, shelf_life 540d; one fusti (cap 10000, vol 10000, reorder 2000, harvest 2026-01-01) not past best-by; clock at fulfillment = 2026-06-30 so the fusti label/sensory score is 66.67 (<70), triggering markdown."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "dv1@x.com", full_name: "DV One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-DV1", name: "EVOO", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-01-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 5000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
              captures: { o_v3: $.data.version }
          assert:
            - "Order.${o_id}.provisional_total_cents == 2495"
            - "Order.${o_id}.final_total_cents == 2270"
            - "Order.${o_id}.final_total_cents < Order.${o_id}.provisional_total_cents"

      - name: fusti_freshness_label_vs_sensory
        grounds:
          - calculations.fusti_freshness
          - entities.Fusti.label_freshness_score
          - entities.Fusti.sensory_freshness_score
        distinguishing_aspect: "On a Fusti (quality domain), once first_draw_at is set the sensory method (accelerated 2.5/day decay from the open event) yields 8.33 while the label method (straight-line to best_by) yields 77.78 for the same batch at the same clock."
        test_recipe:
          setup:
            - "One BULK_OIL fusti (harvest 2026-01-01, shelf 540d) opened by a fulfilled 100ml draw at 2026-04-01 (sets first_draw_at); freshness read at clock 2026-05-01."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "dv2@x.com", full_name: "DV Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-DV2", name: "EVOO2", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 1000, harvest_date: "2026-01-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 100 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/fusti/${f_id}"
              payload: {}
              as: InventoryManager
              captures: { lbl: $.data.label_freshness_score, sns: $.data.sensory_freshness_score }
          assert:
            - "Fusti.${f_id}.label_freshness_score == 77.78"
            - "Fusti.${f_id}.sensory_freshness_score == 8.33"
            - "Fusti.${f_id}.sensory_freshness_score < Fusti.${f_id}.label_freshness_score"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gift_set_round_per_component_then_sum
        grounds:
          - calculations.gift_set_bundle_price
          - entities.Order.provisional_subtotal_cents
        distinguishing_aspect: "Mode (b) nested rounding: a GIFT_SET of two 1005-cent components at 10% off is priced round(904.5)+round(904.5)=905+905=1810, NOT round(904.5+904.5)=1809 — the pinned round-per-component-then-sum order changes the cent."
        test_recipe:
          setup:
            - "Two BOTTLE components priced 1005 cents each; one GIFT_SET product containing one of each; a retail order with a single BUNDLE line of quantity 1."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cf1@x.com", full_name: "CF One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-A", name: "Bottle A", product_type: "BOTTLE", unit_price_cents: 1005 }
              as: InventoryManager
              captures: { comp_a: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-B", name: "Bottle B", product_type: "BOTTLE", unit_price_cents: 1005 }
              as: InventoryManager
              captures: { comp_b: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "GIFT-1", name: "Duo Set", product_type: "GIFT_SET" }
              as: InventoryManager
              captures: { gift_id: $.data.id }
            - call: "POST /api/products/${gift_id}/components"
              payload: { component_product_id: "${comp_a}", quantity: 1 }
              as: InventoryManager
            - call: "POST /api/products/${gift_id}/components"
              payload: { component_product_id: "${comp_b}", quantity: 1 }
              as: InventoryManager
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "BUNDLE", product_id: "${gift_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.provisional_subtotal_cents == 1810"
            - "Order.${o_id}.provisional_total_cents == 2805"

      - name: order_settlement_shipping_on_discounted_subtotal
        grounds:
          - calculations.order_total_settlement
          - entities.Order.discount_cents
          - entities.Order.shipping_fee_cents
        distinguishing_aspect: "Mode (c) circular-looking eval order: subtotal 8000 with TIER_1 10% gives discount 800, discounted_subtotal 7200; free-ship threshold is evaluated against 7200 (<7500 -> ship 995, total 8195), NOT against the gross 8000 (which would zero shipping)."
        test_recipe:
          setup:
            - "Member with an APPROVED TIER_1 wholesale account; one BOTTLE product priced 8000; a wholesale order with a single UNIT line quantity 1."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cf2@x.com", full_name: "CF Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-BIG", name: "Magnum", product_type: "BOTTLE", unit_price_cents: 8000 }
              as: InventoryManager
              captures: { p_big: $.data.id }
            - call: "POST /api/wholesale-accounts"
              payload: { business_name: "Trattoria", tax_id: "TX-1" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_id: $.data.id, wa_v: $.data.version }
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_v2: $.data.version }
            - call: "POST /api/wholesale-accounts/${wa_id}/decision"
              payload: { decision: "APPROVE", tier: "TIER_1", expected_wholesale_account_version: "${wa_v2}" }
              as: WholesaleApprover
              captures: { wa_v3: $.data.version }
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_big}", quantity: 1 } ], wholesale_account_id: "${wa_id}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.provisional_subtotal_cents == 8000"
            - "Order.${o_id}.discount_cents == 800"
            - "Order.${o_id}.shipping_fee_cents == 995"
            - "Order.${o_id}.provisional_total_cents == 8195"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order.UNPAID_PENDING_to_PAID_RESERVED
          - entities.Order.payment_status
          - entities.Order.fulfillment_status
        distinguishing_aspect: "On Order, pay advances two independent axes at once: payment_status UNPAID->PAID AND fulfillment_status PENDING->RESERVED, which then evolve separately — a parallel-dimension machine, not a single linear chain."
        test_recipe:
          setup:
            - "Member with one UNIT-priced BOTTLE product; an unpaid, pending order."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "nl1@x.com", full_name: "NL One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-NL1", name: "Bottle NL1", product_type: "BOTTLE", unit_price_cents: 3000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
          assert:
            - "Order.${o_id}.payment_status == PAID"
            - "Order.${o_id}.fulfillment_status == RESERVED"

      - name: wholesale_account_changes_requested_revision_cycle
        grounds:
          - state_machines.WholesaleAccount.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.WholesaleAccount.CHANGES_REQUESTED_to_SUBMITTED
          - entities.WholesaleAccount.status
        distinguishing_aspect: "On WholesaleAccount, the machine cycles SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED before reaching APPROVED — a revision loop that revisits SUBMITTED, distinct from any linear approval chain and on a different entity than the Order parallel machine."
        test_recipe:
          setup:
            - "A member's wholesale account submitted, sent back for changes, and resubmitted, then approved at TIER_2."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "nl2@x.com", full_name: "NL Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/wholesale-accounts"
              payload: { business_name: "Deli Co", tax_id: "TX-2" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_id: $.data.id, wa_v: $.data.version }
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_v2: $.data.version }
            - call: "POST /api/wholesale-accounts/${wa_id}/decision"
              payload: { decision: "REQUEST_CHANGES", rejection_reason: "add tax cert", expected_wholesale_account_version: "${wa_v2}" }
              as: WholesaleApprover
              captures: { wa_v3: $.data.version }
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_v4: $.data.version }
          trigger:
            - call: "POST /api/wholesale-accounts/${wa_id}/decision"
              payload: { decision: "APPROVE", tier: "TIER_2", expected_wholesale_account_version: "${wa_v4}" }
              as: WholesaleApprover
              captures: { wa_v5: $.data.version }
          assert:
            - "WholesaleAccount.${wa_id}.status == APPROVED"
            - "WholesaleAccount.${wa_id}.tier == TIER_2"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_commit_draws_volume_trips_low_creates_replenishment
        grounds:
          - state_machines.Order.RESERVED_to_FULFILLED
          - state_machines.Reservation.HELD_to_COMMITTED
          - state_machines.Fusti.IN_SERVICE_to_LOW
          - entities.ReplenishmentOrder.requested_volume_ml
        distinguishing_aspect: "Depth-4 chain from fulfill: Order.fulfill -> Reservation HELD->COMMITTED -> Fusti.current_volume_ml 6000->5000 -> Fusti IN_SERVICE->LOW (5000 <= reorder 5000) -> ReplenishmentOrder auto-created with requested_volume_ml 5000, each hop caused by the prior."
        test_recipe:
          setup:
            - "One BULK_OIL fusti (cap 10000, vol 6000, reorder 5000, harvest 2026-06-01, not expired); a paid order reserving a 1000ml REFILL."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "tc1@x.com", full_name: "TC One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-TC1", name: "EVOO TC1", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 6000, reorder_point_ml: 5000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "GET /api/reservations?order_id=${o_id}"
              payload: {}
              as: ShopStaff
              captures: { res_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
              captures: { o_v3: $.data.version }
          assert:
            - "Reservation.${res_id}.status == COMMITTED"
            - "Fusti.${f_id}.current_volume_ml == 5000"
            - "Fusti.${f_id}.reserved_volume_ml == 0"
            - "Fusti.${f_id}.status == LOW"
            - "GET /api/replenishment-orders?fusti_id=${f_id} returns exactly 1 item with status == REQUESTED and requested_volume_ml == 5000"

      - name: cancel_releases_reservation_returns_reserved_volume
        grounds:
          - state_machines.Order.PAID_RESERVED_to_REFUNDED_CANCELLED
          - state_machines.Reservation.HELD_to_RELEASED
          - entities.Fusti.reserved_volume_ml
        distinguishing_aspect: "Depth-2 chain from a different trigger (cancel): Order.cancel -> Reservation HELD->RELEASED -> Fusti.reserved_volume_ml 1000->0, while current_volume_ml stays 6000 (release never draws physical volume)."
        test_recipe:
          setup:
            - "One BULK_OIL fusti (cap 10000, vol 6000, reorder 2000); a paid order holding a 1000ml reservation."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "tc2@x.com", full_name: "TC Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-TC2", name: "EVOO TC2", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 6000, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "GET /api/reservations?order_id=${o_id}"
              payload: {}
              as: ShopStaff
              captures: { res_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/orders/${o_id}/cancel"
              payload: { expected_order_version: "${o_v2}" }
              as: Customer
              as_user_id: "${m_id}"
          assert:
            - "Reservation.${res_id}.status == RELEASED"
            - "Fusti.${f_id}.reserved_volume_ml == 0"
            - "Fusti.${f_id}.current_volume_ml == 6000"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_second_fulfill
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: "A second fulfill of an already-FULFILLED order whose fusti is now past best_by triggers both the state check (priority 6, ERR_INVALID_STATE) and the freshness-safety check (priority 12, ERR_FUSTI_EXPIRED); the lower-priority-number state error wins."
        test_recipe:
          setup:
            - "Short-shelf (30d) BULK_OIL fusti (harvest 2026-06-01, best_by 2026-07-01); an order fulfilled at 2026-06-20; clock then advanced to 2026-07-15 (past best_by)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "pp1@x.com", full_name: "PP One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-SHORT", name: "Fresh Press", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 30 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 1000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 100 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
              captures: { o_v3: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v3}" }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: safety_beats_constraint_on_pay
        grounds:
          - validations[priority=11]
          - validations[priority=18]
        distinguishing_aspect: "Paying an order whose NUTOIL line both conflicts with the member's TREE_NUT restriction (priority 11, ERR_ALLERGEN_CONFLICT) and cannot be satisfied by any fusti's available volume (priority 18, ERR_INSUFFICIENT_VOLUME) returns the allergen-safety error — a different category pair than the state/safety conflict above."
        test_recipe:
          setup:
            - "Member restricted to TREE_NUT; a TREE_NUT BULK_OIL product whose only fusti holds 100ml; an order for a 5000ml REFILL (creatable, since allergen and volume are checked at pay)."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "pp2@x.com", full_name: "PP Two", allergen_restrictions: ["TREE_NUT"] }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-NUT", name: "Walnut Oil", product_type: "BULK_OIL", price_per_ml_cents: 0.50, allergens: ["TREE_NUT"], shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_nut: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_nut}", capacity_ml: 200, initial_volume_ml: 100, reorder_point_ml: 50, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_nut}", quantity: 1, volume_ml: 5000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALLERGEN_CONFLICT"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fusti_reorder_point_inclusive_boundary
        grounds:
          - entities.Fusti.reorder_point_ml
          - state_machines.Fusti.IN_SERVICE_to_LOW
        distinguishing_aspect: "Metric = volume threshold on POST /orders/{id}/fulfill: a commit landing current_volume_ml at exactly reorder_point_ml (5000 == 5000) trips LOW because the rule is <= (inclusive); a draw leaving 5001 would stay IN_SERVICE."
        test_recipe:
          setup:
            - "One BULK_OIL fusti (cap 10000, vol 6000, reorder 5000); a paid order reserving exactly 1000ml so the commit lands at 5000."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "bp1@x.com", full_name: "BP One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-BP1", name: "EVOO BP1", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 6000, reorder_point_ml: 5000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
          assert:
            - "Fusti.${f_id}.current_volume_ml == 5000"
            - "Fusti.${f_id}.status == LOW"

      - name: tasting_station_buffer_exact_gap_accepted
        grounds:
          - validations[priority=14]
          - entities.TastingSession.start_at
        distinguishing_aspect: "Metric = time gap on POST /tasting-sessions: a new session starting exactly BUFFER_MINUTES (15) after the prior session ends is accepted (201), because the collision rule is gap < buffer; a start 1 minute earlier (11:14) would be rejected."
        test_recipe:
          setup:
            - "One station with a BOOKED session 2026-08-01 10:00-11:00; a new booking starting 11:15 (gap exactly 15 min)."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "bp2@x.com", full_name: "BP Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/tasting-stations"
              payload: { name: "Bar 1" }
              as: InventoryManager
              captures: { st_id: $.data.id }
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st_id}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", party_size: 2 }
              as: Customer
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st_id}", start_at: "2026-08-01T11:15:00Z", end_at: "2026-08-01T12:15:00Z", party_size: 2 }
              as: Customer
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          assert:
            - "TastingSession.${b_id}.status == BOOKED"
            - "TastingSession.${b_id}.start_at == 2026-08-01T11:15:00Z"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: wholesale_order_requires_account_approved
        grounds:
          - validations[priority=17]
          - entities.Order.wholesale_account_id
          - state_machines.WholesaleAccount.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Order creation with wholesale_account_id set is gated by the referenced WholesaleAccount.status: a SUBMITTED (not APPROVED) account yields ERR_WHOLESALE_NOT_APPROVED — an Order<->WholesaleAccount dependency."
        test_recipe:
          setup:
            - "A member with a SUBMITTED (un-approved) wholesale account and one BOTTLE product."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "ce1@x.com", full_name: "CE One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-CE1", name: "Bottle CE1", product_type: "BOTTLE", unit_price_cents: 3000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/wholesale-accounts"
              payload: { business_name: "Bistro", tax_id: "TX-CE1" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_id: $.data.id }
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ], wholesale_account_id: "${wa_id}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WHOLESALE_NOT_APPROVED"

      - name: fulfill_requires_reserved_fusti_in_service
        grounds:
          - validations[priority=13]
          - state_machines.Fusti.IN_SERVICE_to_QUARANTINED
          - state_machines.Order.RESERVED_to_FULFILLED
        distinguishing_aspect: "Order.fulfill is gated by the reserved REFILL line's Fusti.status: quarantining the fusti after pay makes fulfill return ERR_FUSTI_QUARANTINED — an Order<->Fusti dependency, a different entity pair than the Order<->WholesaleAccount case."
        test_recipe:
          setup:
            - "A paid order with a 1000ml REFILL reservation against a fusti that is then QUARANTINED before fulfillment."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "ce2@x.com", full_name: "CE Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-CE2", name: "EVOO CE2", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/fusti/${f_id}/transition"
              payload: { action: "QUARANTINE" }
              as: InventoryManager
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FUSTI_QUARANTINED"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_buffer_window_conflict
        grounds:
          - validations[priority=14]
          - entities.TastingSession.station_id
        distinguishing_aspect: "On the TastingStation resource, a second session whose start is only 10 minutes after the prior session ends (gap 10 < BUFFER 15) collides under buffered-adjacency semantics -> ERR_STATION_UNAVAILABLE."
        test_recipe:
          setup:
            - "One station with a BOOKED session 2026-08-01 10:00-11:00; a same-station booking starting 11:10."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "rt1@x.com", full_name: "RT One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/tasting-stations"
              payload: { name: "Bar RT1" }
              as: InventoryManager
              captures: { st_id: $.data.id }
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st_id}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st_id}", start_at: "2026-08-01T11:10:00Z", end_at: "2026-08-01T12:10:00Z" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STATION_UNAVAILABLE"

      - name: member_cross_station_overlap_conflict
        grounds:
          - validations[priority=15]
          - entities.TastingSession.member_id
        distinguishing_aspect: "On the Member resource, two sessions on DIFFERENT stations whose intervals overlap (10:00-11:00 vs 10:30-11:30) collide under bare half-open overlap with zero buffer -> ERR_MEMBER_DOUBLE_BOOKED; a different resource entity and interval semantics than the station buffer rule."
        test_recipe:
          setup:
            - "Member booked on station 1 for 2026-08-01 10:00-11:00; attempts an overlapping session on station 2 for 10:30-11:30."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "rt2@x.com", full_name: "RT Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/tasting-stations"
              payload: { name: "Bar RT2-A" }
              as: InventoryManager
              captures: { st1: $.data.id }
            - call: "POST /api/tasting-stations"
              payload: { name: "Bar RT2-B" }
              as: InventoryManager
              captures: { st2: $.data.id }
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st1}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "${st2}", start_at: "2026-08-01T10:30:00Z", end_at: "2026-08-01T11:30:00Z" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_DOUBLE_BOOKED"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_credit_conserved_across_pay_and_cancel
        grounds:
          - state_machines.Order.UNPAID_PENDING_to_PAID_RESERVED
          - state_machines.Order.PAID_RESERVED_to_REFUNDED_CANCELLED
          - entities.Member.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = money (wallet_credit_cents): paying order B with 5995 of wallet credit then cancelling it restores exactly 5995, so the member's wallet returns to its pre-pay value of 5995."
        test_recipe:
          setup:
            - "Member seeded to wallet_credit_cents=5995 by fulfilling then returning a 5995-total UNIT order; then order B (UNIT, total 5995) paid with use_wallet_credit=true (wallet -> 0)."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "ci1@x.com", full_name: "CI One" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BOT-CI1", name: "Bottle CI1", product_type: "BOTTLE", unit_price_cents: 5000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { os_id: $.data.id, os_v: $.data.version }
            - call: "POST /api/orders/${os_id}/pay"
              payload: { expected_order_version: "${os_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { os_v2: $.data.version }
            - call: "POST /api/orders/${os_id}/fulfill"
              payload: { expected_order_version: "${os_v2}" }
              as: ShopStaff
              captures: { os_v3: $.data.version }
            - call: "POST /api/orders/${os_id}/cancel"
              payload: { expected_order_version: "${os_v3}" }
              as: ShopStaff
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ], use_wallet_credit: true }
              as: Customer
              as_user_id: "${m_id}"
              captures: { ob_id: $.data.id, ob_v: $.data.version }
            - call: "POST /api/orders/${ob_id}/pay"
              payload: { expected_order_version: "${ob_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { ob_v2: $.data.version }
          trigger:
            - call: "POST /api/orders/${ob_id}/cancel"
              payload: { expected_order_version: "${ob_v2}" }
              as: Customer
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.wallet_credit_cents == 5995"
            - "Order.${ob_id}.wallet_credit_applied_cents == 5995"

      - name: fusti_physical_volume_conserved_across_reserve_and_release
        grounds:
          - state_machines.Reservation.HELD_to_RELEASED
          - entities.Fusti.current_volume_ml
          - entities.Fusti.reserved_volume_ml
        distinguishing_aspect: "Conserved quantity = volume (current_volume_ml, millilitres): reserve at pay (+1000 reserved) paired with release at cancel (-1000 reserved) leaves Fusti.current_volume_ml unchanged at 6000 and reserved_volume_ml back at 0 — a different conserved quantity than wallet cents."
        test_recipe:
          setup:
            - "One BULK_OIL fusti (cap 10000, vol 6000, reorder 2000); a paid order holding a 1000ml reservation, then cancelled."
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "ci2@x.com", full_name: "CI Two" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OIL-CI2", name: "EVOO CI2", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 6000, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id, f_vol: $.data.current_volume_ml }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/cancel"
              payload: { expected_order_version: "${o_v2}" }
              as: Customer
              as_user_id: "${m_id}"
          assert:
            - "Fusti.${f_id}.current_volume_ml == 6000"
            - "Fusti.${f_id}.reserved_volume_ml == 0"
