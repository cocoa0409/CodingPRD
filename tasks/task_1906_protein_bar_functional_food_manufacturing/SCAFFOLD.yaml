- method: GET
  path: /mfg/claim-reviews/{id}
  description: Read one claim review
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - BrandCustomerRep
  code: 200
  input: []
  output: ClaimReview
  side_effects: []
- method: POST
  path: /mfg/claim-reviews/{id}/start-review
  description: SUBMITTED -> IN_REVIEW
  roles:
  - QualityManager
  code: 200
  input: []
  output: ClaimReview
  side_effects:
  - increments review.version
- method: POST
  path: /mfg/claim-reviews/{id}/approve
  description: IN_REVIEW -> APPROVED; substantiation + disclaimer guards
  roles:
  - QualityManager
  code: 200
  input: []
