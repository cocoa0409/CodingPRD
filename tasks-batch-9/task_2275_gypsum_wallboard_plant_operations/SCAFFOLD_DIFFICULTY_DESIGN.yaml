  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: run_status_and_quality_dimensions_advance_independently
        grounds:
          - state_machines.ProductionRun.status
          - state_machines.ProductionRun.quality_state
          - state_machines.ProductionRun.UNTESTED_to_IN_TEST
          - state_machines.ProductionRun.IN_TEST_to_DOWNGRADED
          - calculations.board_quality_evaluation
          - entities.ProductionRun.fields.quality_state
        distinguishing_aspect: |
          ProductionRun carries two parallel state dimensions: `status` walks
          DRAFT -> SCHEDULED -> RUNNING -> COMPLETED while `quality_state` is still UNTESTED, and
          `quality_state` then walks UNTESTED -> IN_TEST -> DOWNGRADED with `status` frozen at
          COMPLETED — neither dimension's transition list mentions the other's states, so the
          combined state (COMPLETED, DOWNGRADED) is reachable and status never leaves COMPLETED.
