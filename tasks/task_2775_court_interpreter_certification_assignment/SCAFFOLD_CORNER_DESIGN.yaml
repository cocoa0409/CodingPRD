      - name: quality_score_computed_read_exposes_both_variants_and_the_point_split
        claim_type: Computed read
        grounds: ["endpoints[GET /interpreters/{id}/quality-score]", calculations.interpreter_quality_score, calculations.interpreter_quality_score.constants]
        distinguishing_aspect: "The computed read returns six derived numbers for one interpreter and no stored row of its own: a single LETTER sanction (5 points, effective_from inside the 365-day window) yields recent_points 5, older_points 0 and both variants at 80, which the read must agree with the roster row about."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; no language, courthouse or credential is required — the score reads only DisciplinaryAction rows."
