        grounds:
          - state_machines.MakeSheet.SCHEDULED_to_IN_PROGRESS
          - state_machines.AdditiveLot.RELEASED_to_RECALLED
          - errors[ERR_ADDITIVE_LOT_UNUSABLE]
        distinguishing_aspect: |
          Pair MakeSheet -> AdditiveLot: a SCHEDULED make whose culture lot was
          RECALLED after booking cannot start (ERR_ADDITIVE_LOT_UNUSABLE),
          proving the make's valid transitions depend on the lot's state.
        test_recipe:
          setup:
            - "SCHEDULED MakeSheet; culture lot RECALLED between booking and start"
