              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-A", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_a: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-B", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_b: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-C", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_c: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_a}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T08:00:00Z", window_end: "2026-06-10T10:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_b}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T13:00:00Z", window_end: "2026-06-10T15:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_c}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T14:00:00Z", window_end: "2026-06-10T16:00:00Z" }
              as: Dispatcher
              captures: { d3: $.data.id }
          assert:
            - "3-hour gap fails: error_id == ERR_TANK_SETTLE_WINDOW (409) — buffer is 4h even though windows do not overlap"
            - "Exactly 4-hour gap (10:00 end -> 14:00 start) succeeds (201) — boundary inclusive"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_restores_exposure
        grounds:
          - calculations.credit_exposure_cents
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.TransportDrop.EN_ROUTE_to_DELIVERED
