              payload: { member_id: "${m1}", contract_id: "00000000-0000-4000-8000-0000000000ff", elected_tier_code: "TIER_9", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m2}"
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "00000000-0000-4000-8000-0000000000ff", elected_tier_code: "TIER_9", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_9", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
