scenario: |
  221. Pool & Spa Maintenance Service: service route/frequency, chemical reading & dosing log,
  equipment-repair work order, seasonal open/close, one-time vs recurring plan, weather/holiday skip,
  billing per visit, green-pool recovery
domain_name: pool-spa-maintenance
api_prefix: ""

# ---------------------------------------------------------------------------
# Complexity profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # provisional (route-plan) vs final (post-visit) dosing & billing
    - cascading_side_effects          # green-pool recovery, skip-with-makeup, work-order hold cascades
    - optimistic_concurrency          # OCC on Pool.version for visit logging that supersedes a draft
    - derived_field_reconciliation    # Pool.balance_due_cents, ServicePlan.visits_remaining

  entity_topology: flat
  # Pool, ServicePlan, RouteAssignment, ServiceVisit, ChemicalReading, WorkOrder,
  # SeasonalEvent, Invoice are peer entities linked by FK references, not nested URL paths.

  state_machine_shape: branching
  # ServiceVisit forks SCHEDULED -> {COMPLETED, SKIPPED, RECOVERY} with divergent
  # side-effect sets; WorkOrder has a revert loop (ON_HOLD -> DIAGNOSED).

  relationship_patterns:
    - one_to_many        # Pool -> ServiceVisit, Pool -> WorkOrder, ServicePlan -> ServiceVisit
    - cross_aggregate    # ServiceVisit references both Pool and RouteAssignment

  role_model: peer_roles
  # FieldTechnician (does visits/readings), RouteManager (plans routes/seasonal/skips),
  # AccountManager (plans/invoices/billing), Customer (entity-backed pool owner, read + approve repairs).

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
