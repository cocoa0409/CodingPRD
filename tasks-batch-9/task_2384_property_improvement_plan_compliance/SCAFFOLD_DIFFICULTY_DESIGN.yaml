              captures: { budget1_id: $.data.id }
            - call: "POST /pip/capital-budgets/${budget1_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/items/${item1_id}/start"
