            - "at clock 2027-01-01T00:00:00Z (== effective_until, exclusive): the second debt's activation fails with 409 ERR_AGREEMENT_NOT_ACTIVE — an ACTIVE agreement past its window covers nothing"

      - name: refund_claim_requires_offset_applied
        grounds:
          - state_machines.Offset
          - state_machines.RefundClaim
          - errors.ERR_OFFSET_NOT_APPLIED
          - endpoints.POST /refund-claims
        distinguishing_aspect: "Entity pair RefundClaim x Offset: a claim is filable only while its offset is APPLIED — filing against a PROPOSED offset fails with ERR_OFFSET_NOT_APPLIED, and succeeds after execution flips the same offset to APPLIED. The sibling dependency crosses Debt x ReciprocalAgreement."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333; FULL SALARY policy ACTIVE; ACTIVE 50000-cent FEDERAL_NONTAX debt; a 30000-cent SALARY payment evaluated so its offset sits PROPOSED."
          setup_api_calls:
