              payload: { third_party_name: "Portage County Paving", at_fault_percentage: 50, basis_note: "unmarked lane closure caused the swerve" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { sd_id: $.data.id }
            - call: "POST /demands/${dm_id}/offers"
              payload: { carrier_offer_cents: 925001 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          trigger:
            - call: "POST /demands/${dm_id}/settle"
