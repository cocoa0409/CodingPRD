  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusivity_window_half_open_adjacency_permitted_overlap_rejected
        grounds:
          - validations.priority_28_exclusivity_window_no_overlap
          - entities.DealContract.fields.exclusivity_category
          - entities.DealContract.fields.effective_start_at
          - errors.ERR_EXCLUSIVITY_WINDOW_CONFLICT
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_start_at, effective_end_at) with
          zero tolerance for any positive-length intersection. Resource: the
          individual Athlete, keyed by exclusivity_category. A second APPAREL deal
          that starts exactly at the first deal's end instant is PERMITTED, while a
          third deal that starts one day before that instant is REJECTED, so the
          test pins the touching-endpoint case as non-overlapping.
        test_recipe:
          setup:
            - "A collective whose only settled contribution is gross 307723 -> net 300000 UNRESTRICTED, which keeps funding_posture non-FROZEN across all three contract creations (worst case available 300000 against committed 200000)."
            - "One ENROLLED FOOTBALL athlete."
            - "A first APPAREL contract worth 100000 covering 2026-08-01 to 2026-09-01."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Exclusivity Collective", institution_name: "California Institution D", institution_ipeds_code: "015100", home_state_code: "CA", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Apparel Club", annual_dues_cents: 40000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Wes Whiskey", email: "wes@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 307723, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Xan Xray", portal_user_id: "ath-xan", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-09-01T00:00:00Z", funding_designation: "UNRESTRICTED", exclusivity_category: "APPAREL" }
              as: CollectiveDirector
              captures: { dc1_id: $.data.id }
          trigger:
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-09-01T00:00:00Z", effective_end_at: "2026-10-01T00:00:00Z", funding_designation: "UNRESTRICTED", exclusivity_category: "APPAREL" }
              as: CollectiveDirector
              captures: { dc2_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-31T00:00:00Z", effective_end_at: "2026-09-15T00:00:00Z", funding_designation: "UNRESTRICTED", exclusivity_category: "APPAREL" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "DealContract.${dc1_id}.exclusivity_category == APPAREL"
            - "DealContract.${dc2_id}.exclusivity_category == APPAREL"
            - "DealContract.${dc2_id}.effective_start_at == 2026-09-01T00:00:00Z"
            - "DealContract.${dc2_id}.lifecycle_status == DRAFT"
            - "${err_id} == ERR_EXCLUSIVITY_WINDOW_CONFLICT"
            - "The rejected third attempt returns HTTP 409."
            - "Athlete.${ath_id}.annual_committed_value_cents == 200000"
            - "Collective.${col_id}.committed_unreleased_cents == 200000"
            - "Under half-open semantics the second window touching the first at 2026-09-01 has an empty intersection and is accepted, while 2026-08-31 to 2026-09-15 intersects the first window on [2026-08-31, 2026-09-01) and is rejected; a closed-interval implementation would wrongly reject the second call as well."

      - name: roster_batch_closed_interval_aggregate_capacity_saturation
        grounds:
          - validations.priority_46_roster_batch_overlap_capacity
          - global_constants.BATCH_OVERLAP_CAPACITY
          - entities.DealContract.fields.allocation_batch_code
          - errors.ERR_BATCH_OVERLAP_CAPACITY_EXCEEDED
          - endpoints."POST /nil/deal-contracts/roster-allocations"
        distinguishing_aspect: |
          Different interval semantics AND a different resource from
          exclusivity_window_half_open_adjacency_permitted_overlap_rejected. Here
          windows are CLOSED intervals, so collision is s1 <= e2 AND s2 <= e1 and a
          batch that merely touches another at an endpoint DOES collide. The
          resource is the Collective-plus-sport pair rather than an individual
          athlete, and the rule is an aggregate capacity of
          BATCH_OVERLAP_CAPACITY = 2 simultaneous colliding batches rather than
          zero tolerance, so the second batch is admitted despite colliding and only
          the third, which collides with both predecessors, is refused.
        test_recipe:
          setup:
            - "A collective with 4895000 cents of settled ROSTER_POOL net funds (gross 5000000, fee 105000), so funding_posture stays OPEN throughout."
            - "One ENROLLED FOOTBALL athlete, so each 300000-cent EQUAL_SHARE batch produces exactly one 300000-cent contract with remainder 0."
            - "Batch B1 covers 2026-08-01 to 2026-09-01."
            - "Batch B2 covers 2026-09-01 to 2026-10-01: under closed-interval semantics it touches B1 at 2026-09-01 and therefore already counts as ONE collision, which is below the capacity of 2 and so is admitted."
            - "All batches use exclusivity_category NONE, so priority 28 never fires and the only temporal rule in play is priority 46."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Batch Capacity Collective", institution_name: "Texas Institution D", institution_ipeds_code: "016100", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T4", tier_name: "Pool Platinum", annual_dues_cents: 300000, benefit_rank: 4 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Yara Yankee", email: "yara@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 5000000, source_kind: "ONE_TIME_GIFT", designation: "ROSTER_POOL", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Zed Zulu", portal_user_id: "ath-zed", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { col_ver1: $.data.version }
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "B1", sport: "FOOTBALL", pool_amount_cents: 300000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-09-01T00:00:00Z", funding_designation: "ROSTER_POOL", exclusivity_category: "NONE", expected_collective_version: "${col_ver1}" }
              as: CollectiveDirector
              captures: { b1_created: $.data.created_contract_count }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { col_ver2: $.data.version }
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "B2", sport: "FOOTBALL", pool_amount_cents: 300000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-09-01T00:00:00Z", effective_end_at: "2026-10-01T00:00:00Z", funding_designation: "ROSTER_POOL", exclusivity_category: "NONE", expected_collective_version: "${col_ver2}" }
              as: CollectiveDirector
              captures: { b2_created: $.data.created_contract_count }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { col_ver3: $.data.version }
          trigger:
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "B3", sport: "FOOTBALL", pool_amount_cents: 300000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-08-15T00:00:00Z", effective_end_at: "2026-09-15T00:00:00Z", funding_designation: "ROSTER_POOL", exclusivity_category: "NONE", expected_collective_version: "${col_ver3}" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${b1_created} == 1"
            - "${b2_created} == 1"
            - "${err_id} == ERR_BATCH_OVERLAP_CAPACITY_EXCEEDED"
            - "The refused third batch returns HTTP 409."
            - "Collective.${col_id}.version == ${col_ver3}"
            - "Collective.${col_id}.committed_unreleased_cents == 600000"
            - "Collective.${col_id}.settled_net_funds_cents == 4895000"
            - "Athlete.${ath_id}.annual_committed_value_cents == 600000"
            - "B3 collides with B1 because 2026-08-15 <= 2026-09-01 and 2026-08-01 <= 2026-09-15, and with B2 because 2026-08-15 <= 2026-10-01 and 2026-09-01 <= 2026-09-15, giving 2 colliding batch codes which reaches BATCH_OVERLAP_CAPACITY."
            - "No DealContract row carries allocation_batch_code B3."

  - rule_id: compensating_invariant
    instances:

      - name: release_then_reversal_conserves_collective_funds_identity
        grounds:
          - state_machines.sm_payment_release_status
          - entities.Collective.fields.settled_net_funds_cents
          - entities.Collective.fields.released_total_cents
          - entities.Collective.fields.reversed_total_cents
          - entities.Collective.fields.committed_unreleased_cents
          - endpoints."POST /nil/payment-releases/{id}/reversals"
        distinguishing_aspect: |
          Action pair: RELEASE then REVERSE on a PaymentRelease. Conserved quantity:
          the collective's spendable cash identity
          available_cents = settled_net_funds_cents - released_total_cents, together
          with committed_unreleased_cents. Both are numerically identical before the
          release and after the reversal (487470 and 200000), while
          reversed_total_cents rises to 150000 as an audit trail, so the reversal is
          proven to be a compensation and not a second withdrawal.
        test_recipe:
          setup:
            - "A collective whose only settled contribution is gross 500000 -> fee 12530 -> net 487470, designated UNRESTRICTED."
            - "One ENROLLED FOOTBALL athlete and one ACTIVE contract worth 200000 with disclosure ACCEPTED."
            - "Before the trigger: settled_net_funds_cents 487470, released_total_cents 0, reversed_total_cents 0, committed_unreleased_cents 200000, funding_posture OPEN, payment_status UNPAID."
            - "The reversal uses reversal_reason ERRONEOUS_PAYMENT and happens with the logical clock still in calendar year 2026, so validation priority 30 is satisfied."
