  - section: validations
    instances:
      - name: search_limit_exceeded_at_plan_daily_cap
        claim_type: Violation → Error
        grounds:
          - "validations[priority=9\"]"
          - "errors.ERR_SEARCH_LIMIT_EXCEEDED"
        distinguishing_aspect: "CarrierAdmin searches consume the daily limit; at search_daily_limit==2 the third GET /load-posts in the same logical day returns 402 ERR_SEARCH_LIMIT_EXCEEDED, and advancing the clock to the next day resets the counter."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C subscribed to a plan with search_daily_limit 2. Broker B has 1 OPEN load."]
          setup_api_calls:
            - *cc_clock
            - &cc_plan_s2
              call: "POST /subscription-plans"
              payload: { code: "BASIC", monthly_posting_allowance: 5, overage_tier1_limit: 2, overage_hard_cap: 2, search_daily_limit: 2, analytics_depth: "NONE", requires_data_contribution: false }
              as: PlatformAdmin
              captures: { cc_plan_s2_id: $.data.id }
            - *cc_broker
            - &cc_sub_s
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_s2_id}", broker_org_id: "${cc_broker_id}" }
              as: PlatformAdmin
            - *cc_av
            - *cc_av_verify
            - &cc_lp_s
              call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 100000 }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
            - *cc_carrier
            - &cc_carrier_sub3
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_s2_id}", carrier_org_id: "${cc_carrier_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /load-posts"
              payload: { origin: "DAL" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
            - call: "GET /load-posts"
              payload: { origin: "DAL" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
            - call: "GET /load-posts"
              payload: { origin: "DAL" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /load-posts"
              payload: { origin: "DAL" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
          assert:
            - "First two searches return 200"
            - "Third search same logical day: 402 and err == ERR_SEARCH_LIMIT_EXCEEDED"
            - "After clock advances to 2026-08-02: search succeeds again (counter reset per logical day)"

      - name: dispute_filed_after_ninety_days_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=7\"]"
          - "errors.ERR_DISPUTE_WINDOW_EXPIRED"
        distinguishing_aspect: "Temporal validation: a dispute filed when the logical clock is more than 90 days past reported_at returns 422 ERR_DISPUTE_WINDOW_EXPIRED even though the event is PUBLISHED."
        test_recipe:
          setup: ["Clock 2026-01-01T00:00:00Z. Broker B, carrier C, one PUBLISHED credit event reported 2026-01-01."]
          setup_api_calls:
            - &cc_clock_jan
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - *cc_broker
            - *cc_carrier
            - &cc_cre_old
              call: "POST /credit-report-events"
              payload: { broker_org_id: "${cc_broker_id}", invoice_amount_cents: 50000, days_to_pay: 45 }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { cc_cre_old_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit-report-events/${cc_cre_old_id}/disputes"
              payload: { reason: "Too late to dispute" }
              as: BrokerAdmin
              as_user_id: "${cc_broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "422 and err == ERR_DISPUTE_WINDOW_EXPIRED; CreditReportEvent.${cc_cre_old_id}.status remains PUBLISHED"

      - name: existence_checked_before_state_on_unknown_load_id
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=3\"]"
          - "validations[priority=4]"
        distinguishing_aspect: "Booking against an unknown load_post_id AND an unknown truck_post_id reports the first FK in declared input order: ERR_LOAD_POST_NOT_FOUND (load_post_id precedes truck_post_id in the endpoint input list)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C VERIFIED and subscribed."]
          setup_api_calls:
            - *cc_clock
            - *cc_carrier
            - *cc_carrier_sub
            - *cc_av_c
            - *cc_av_c_verify
          trigger:
            - call: "POST /bookings"
              payload: { load_post_id: "00000000-0000-4000-8000-000000000001", truck_post_id: "00000000-0000-4000-8000-000000000002", agreed_rate_cents: 100000 }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "404 and err == ERR_LOAD_POST_NOT_FOUND (not ERR_TRUCK_POST_NOT_FOUND)"

      - name: full_analytics_blended_requires_contribution_when_plan_demands_it
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2\"]"
          - "errors.ERR_DATA_CONTRIBUTION_REQUIRED"
          - "calculations.data_contribution_flag"
        distinguishing_aspect: "On a plan with requires_data_contribution=true, a caller org with data_contribution_flag==false gets 403 ERR_DATA_CONTRIBUTION_REQUIRED for variant=BLENDED even with FULL analytics_depth."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C subscribed to FULL plan with requires_data_contribution=true; 5 SPOT transactions on lane DAL->HOU DRY_VAN reported by a DIFFERENT carrier D (so C's flag is false)."]
          setup_api_calls:
            - *cc_clock
            - &cc_plan_fc
              call: "POST /subscription-plans"
              payload: { code: "ENTERPRISE", monthly_posting_allowance: 50, overage_tier1_limit: 10, overage_hard_cap: 20, search_daily_limit: 100, analytics_depth: "FULL", requires_data_contribution: true }
              as: PlatformAdmin
              captures: { cc_plan_fc_id: $.data.id }
            - *cc_carrier
            - &cc_sub_fc
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_fc_id}", carrier_org_id: "${cc_carrier_id}" }
              as: PlatformAdmin
            - &cc_carrier_d
              call: "POST /carrier-orgs"
              payload: { legal_name: "Donor Carriers", dot_number: "DOT-1200" }
              as: PlatformAdmin
              captures: { cc_carrier_d_id: $.data.id }
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 100000, fuel_price_cents: 400, transaction_date: "2026-07-20T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_d_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 101000, fuel_price_cents: 400, transaction_date: "2026-07-21T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_d_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 102000, fuel_price_cents: 400, transaction_date: "2026-07-22T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_d_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 103000, fuel_price_cents: 400, transaction_date: "2026-07-23T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_d_id}"
            - call: "POST /rate-transactions"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", rate_kind: "SPOT", rate_cents: 104000, fuel_price_cents: 400, transaction_date: "2026-07-24T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_d_id}"
          trigger:
            - call: "GET /lane-rate-benchmarks"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", variant: "BLENDED" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 and err == ERR_DATA_CONTRIBUTION_REQUIRED (sample data exists, but caller's flag is false)"

      - name: lane_level_plan_cannot_request_blended_variant
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_ANALYTICS_DEPTH_FORBIDDEN"
        distinguishing_aspect: "A LANE_LEVEL plan permits only SPOT_ONLY; requesting BLENDED returns 403 ERR_ANALYTICS_DEPTH_FORBIDDEN regardless of contribution status."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C on a LANE_LEVEL plan subscription."]
          setup_api_calls:
