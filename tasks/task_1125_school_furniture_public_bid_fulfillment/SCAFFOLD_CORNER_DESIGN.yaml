  - section: cross_cutting_layers
    instances:
      - name: version_pinning_stale_spec_blocks_line_until_amendment_repins
        claim_type: version_pinning_stale_reference
        grounds: ["validations[priority=9]", "errors[ERR_SPEC_VERSION_STALE]", "concurrency_rules[award-amendment-stale-award]", entities.Award.fields.awarded_spec_version]
        distinguishing_aspect: "The award pins spec_version at creation; a post-award addendum (spec_version 2 vs pin 1) blocks PO-line creation with ERR_SPEC_VERSION_STALE until an OCC-guarded amendment re-pins to 2, after which the identical line creation succeeds."
        test_recipe:
          setup: ["District D1; coop award accepted (pin 1); spec amended (addendum + re-publish -> spec_version 2); PO created; clock still 2026-05-10 (before order_by_date)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager, captures: { award_v: $.data.version } }
            - { call: "POST /v1/bid-specs/${specA}/issue-addendum", payload: { addendum_note: "post-award clarification" }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { spec_v_now: $.data.spec_version } }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/awards/${awardA}/issue-amendment", payload: { expected_award_version: "${award_v}", amendment_note: "ratify addendum 1" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { pin2: $.data.awarded_spec_version } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id, l1_status: $.data.status } }
          assert:
            - "spec_v_now == 2 while the award pin is still 1 -> err == ERR_SPEC_VERSION_STALE"
            - "pin2 == 2 (amendment re-pinned the award to the current spec_version)"
            - "l1_status == PENDING (identical line creation succeeds after re-pin)"

      - name: occ_stale_version_on_award_amendment_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[award-amendment-stale-award]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The amendment endpoint is OCC-guarded on Award.version: the first amendment carrying the observed version succeeds and bumps the version; a second amendment replaying the same stale expected_award_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["District D1; coop award accepted (version observed at accept); spec amended to spec_version 2"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
