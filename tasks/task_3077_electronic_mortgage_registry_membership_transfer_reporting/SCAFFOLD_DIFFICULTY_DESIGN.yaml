              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
          trigger:
            - call: "GET /registry/borrower-inquiries/100000000000000016"
              payload: {}
              as: BorrowerInquirer
              as_user_id: "borrower-line-1"
            - call: "GET /registry/borrower-inquiries/100000000000000017"
              payload: {}
              as: BorrowerInquirer
              as_user_id: "borrower-line-1"
              captures: { err: $.data.error_id }
          assert:
            - "the valid MIN returns 200 with loan_id == ${loan}, current_investor_org_id == \"1000000\" and current_servicer_org_id == \"1000000\""
            - "the same payload with last digit flipped returns 404 and err == ERR_LOAN_NOT_FOUND"
            - "RegisteredLoan.${loan}.min == \"100000000000000016\" (org 1000000, serial 1, check digit 6)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_requires_to_member_active
        grounds:
          - state_machines.Transfer.(creation)_to_CONFIRMED
          - entities.Member.fields.status
          - errors.ERR_MEMBER_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair Transfer -> Member (to-side): a transfer to a SUSPENDED
          receiving member is rejected even though the loan and from-side are
          in perfect order — the target's lifecycle gates this entity's
          creation.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers one TX loan (version 1). RegistryAdmin suspends B."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/members/${m_b}/suspend"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-xs-1", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_MEMBER_NOT_ACTIVE"
            - "no Transfer row is created: GET /registry/transfers?loan_id=${loan} returns 0 rows"
            - "RegisteredLoan.${loan}.current_servicer_id is still ${m_a}"

      - name: review_settle_blocked_by_creator_identity
        grounds:
          - state_machines.QAReview.FINDINGS_ISSUED_to_SETTLED
          - entities.QAReview.fields.created_by
          - errors.ERR_SOD_SAME_ACTOR
        distinguishing_aspect: |
          Entity pair Sanction/QAReview transition -> QAReview.created_by
          (different pair than Transfer -> Member): whether FINDINGS_ISSUED ->
          SETTLED is allowed depends on a field of the same aggregate recorded
          at creation — the settling auditor's identity must differ from the
          creator's — and the identical call by a different auditor succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member D (org 1000002) ACTIVE with signer; one loan; review by qa-creator with 1 MINOR finding, issued."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Delta Funding", org_id: "1000002", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m_d: $.data.id }
            - call: "POST /registry/members/${m_d}/signers"
              payload: { full_name: "Dan Signer", email: "dan@delta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_d}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${d_loan}", field_name: "CLOSING_DATE", expected_value: "2026-01-05", actual_value: "2026-01-06", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/qa-reviews/${rev}/settle"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { err: $.data.error_id }
            - call: "POST /registry/qa-reviews/${rev}/settle"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-settler"
          assert:
            - "the first settle returns 403 with err == ERR_SOD_SAME_ACTOR (creator cannot settle own review)"
            - "the second settle (different auditor) returns 200 and QAReview.${rev}.status == SETTLED"
            - "QAReview.${rev}.settled_by == \"qa-settler\""
            - "exactly one Sanction exists for review ${rev} with status ASSESSED and total_amount_cents == 25005"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: signer_windows_touching_at_boundary_are_clean_exact_overlap_rejects
        grounds:
          - entities.AuthorizedSigner.fields.effective_from
          - entities.AuthorizedSigner.fields.effective_until
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics: half-open signer authority windows on the Member
          resource. A second signer whose effective_from exactly equals the
          first signer's effective_until (2026-07-01 == 2026-07-01) is a clean
          adjacency and succeeds, while a one-second-overlapping window
          (effective_from 2026-06-30T23:59:59Z) is rejected — half-open
          [from, until) arithmetic on the AuthorizedSigner resource.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member A (org 1000000) exists in PENDING_ACTIVATION with one signer S1 (effective 2026-01-01 to 2026-07-01)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Signer One", email: "one@alpha.example", effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-07-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Signer Adjacent", email: "adj@alpha.example", effective_from: "2026-07-01T00:00:00Z", role_scope: "TRANSFER" }
              as: RegistryAdmin
              captures: { s2: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Signer Overlap", email: "ovl@alpha.example", effective_from: "2026-06-30T23:59:59Z", role_scope: "TRANSFER" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent signer is created (201): touching at the boundary is not an overlap under half-open semantics"
            - "the overlapping signer is rejected with 409 err == ERR_SIGNER_WINDOW_OVERLAP (overlapping authority windows for the same member are forbidden)"
            - "AuthorizedSigner.${s1} remains ACTIVE and unchanged"

      - name: annual_report_year_boundary_adjacent_years_clean_same_year_rejects
        grounds:
          - entities.AnnualReport.fields.report_year
          - state_machines.AnnualReport.(creation)_to_FINAL
          - errors.ERR_DUPLICATE_ANNUAL_REPORT
        distinguishing_aspect: |
          Different interval semantics on a different resource: whole
          calendar-year periods on the AnnualReport resource are compared by
          closed, inclusive year equality — adjacent years 2026 and 2027 are
          clean, but a second report for the same year (a fully coincident
          period) is 409 ERR_DUPLICATE_ANNUAL_REPORT unless force_regenerate
          voids the prior one.
        test_recipe:
          setup:
            - "Logical clock 2026-12-31T00:00:00Z. Member A (org 1000000) ACTIVE with signer; no transfers, no reviews."
            - "Report for 2026 generated (FINAL)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2026 }
              as: RegistryAdmin
              captures: { rep26: $.data.id }
          trigger:
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2027 }
              as: RegistryAdmin
              captures: { rep27: $.data.id }
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2026 }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the 2027 report is created (201): the adjacent year is a distinct period"
            - "the duplicate 2026 report returns 409 and err == ERR_DUPLICATE_ANNUAL_REPORT"
            - "AnnualReport.${rep26}.status is still FINAL (no force_regenerate supplied)"
            - "AnnualReport.${rep26}.reporting_rate == 1.0 (vacuous: zero CONFIRMED transfers in 2026)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rights_conservation_through_rejected_match
        grounds:
          - state_machines.Transfer.CONFIRMED_to_REJECTED
          - entities.RegisteredLoan.fields.current_investor_id
          - entities.RegisteredLoan.fields.current_servicer_id
        distinguishing_aspect: |
          Conserved quantity: the set of rights-holding members on the loan.
          A BENEFICIAL transfer followed by the from-side's reject-match must
          leave exactly one investor and one servicer assigned at every step —
          the transfer moved investor to B (conservation preserved by
          reassignment, not duplication), and the rejection flags QA without
          rolling the rights back: after rejection current_investor_id is still
          B and no loan field points at a vanished holder.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers one TX loan (version 1); A -> B BENEFICIAL transfer CONFIRMED on time."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 90000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "BENEFICIAL", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-con-1", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /registry/transfers/${tr}/reject-match"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
          assert:
            - "invariant: exactly one current_investor_id and one current_servicer_id on RegisteredLoan.${loan} at every observation"
            - "before rejection: current_investor_id == ${m_b}, current_servicer_id == ${m_a}"
            - "after rejection: current_investor_id is STILL ${m_b} (rejection does not roll back rights — conservation holds without duplication or loss)"
            - "Transfer.${tr}.status == REJECTED and the loan remains ACTIVE"

      - name: exactly_one_final_annual_report_through_regeneration
        grounds:
          - state_machines.AnnualReport.FINAL_to_VOID
          - entities.AnnualReport.fields.status
          - errors.ERR_DUPLICATE_ANNUAL_REPORT
        distinguishing_aspect: |
          Conserved quantity (different type than rights holders): the count
          of FINAL reports per (member, report_year). force_regenerate voids
          the prior report and creates a new one — the invariant count(FINAL
          reports for (member, 2026)) == 1 holds before, during, and after
          regeneration; the compensating action (VOID) exactly offsets the new
          FINAL creation.
        test_recipe:
          setup:
            - "Logical clock 2026-12-31T00:00:00Z. Member A (org 1000000) ACTIVE with signer; no transfers."
            - "Report R1 for 2026 generated (FINAL, standing_score 100.00, GOOD_STANDING)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2026 }
              as: RegistryAdmin
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2026, force_regenerate: true }
              as: RegistryAdmin
              captures: { rep2: $.data.id }
          assert:
            - "AnnualReport.${rep1}.status == VOID (the compensating write)"
            - "AnnualReport.${rep2}.status == FINAL"
            - "GET /registry/annual-reports?member_id=${m_a}&report_year=2026&status=FINAL returns exactly 1 row (the conserved count)"
            - "GET /registry/annual-reports?member_id=${m_a}&report_year=2026 returns exactly 2 rows total (history is preserved, not deleted)"
