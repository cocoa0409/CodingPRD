              payload: { area_code: "BRW-02", name: "Bear River Canyon", total_allocated_service_days: 300, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
