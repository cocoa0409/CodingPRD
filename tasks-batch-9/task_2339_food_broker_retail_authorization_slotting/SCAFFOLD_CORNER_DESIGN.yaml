              payload: { authorization_id: "${auth}", expected_authorization_version: "${av0}", period_index: 1, reported_store_count: 400, distributed_store_count: 390, reported_case_volume: 900 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av0}", period_index: 9, reported_store_count: 900, distributed_store_count: 950, reported_case_volume: 900 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e3: $.data.error_id }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av1}", period_index: 2, reported_store_count: 400, distributed_store_count: 390, reported_case_volume: 900 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { s2: $.data.id }
            - call: "GET /authorizations/${auth}"
              payload: {}
              as: BrokerAccountManager
              captures: { av2: $.data.version, pr2: $.data.periods_reported }
            - call: "POST /distribution-snapshots/${s2}/reverse"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /authorizations/${auth}"
              payload: {}
              as: BrokerAccountManager
              captures: { av3: $.data.version, pr3: $.data.periods_reported }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av3}", period_index: 9, reported_store_count: 400, distributed_store_count: 390, reported_case_volume: 900 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e4: $.data.error_id }
            - call: "GET /authorizations/${auth}"
              payload: {}
              as: BrokerAccountManager
              captures: { av4: $.data.version }
          assert:
            - "Call 1 returns 201 and call 2 shows ${av1} == ${av0} + 1 with ${pr1} == 1 — every accepted posting bumps the authorization exactly once"
            - "Call 3 returns 412 ERR_STALE_AUTHORIZATION_VERSION — the period_index is perfectly legal, only the version is old"
            - "Call 4 returns 412 ERR_STALE_AUTHORIZATION_VERSION, NOT 409 ERR_PERIOD_ALREADY_POSTED — OCC at priority 6 outranks the uniqueness bound at priority 11"
            - "Call 5 returns 412 as well, even though it violates the sequence bound, the authorized-store bound AND the distributed<=reported bound at once — the stale version short-circuits all of them"
            - "Call 6 with the refreshed ${av1} returns 201; call 7 shows ${av2} == ${av1} + 1 and ${pr2} == 2"
            - "Call 8 (reverse) takes no expected version — it is guarded by ERR_SNAPSHOT_NOT_LATEST instead — yet call 9 shows ${av3} == ${av2} + 1 and ${pr3} == 1, so a client that keeps posting after a reversal without re-reading will get a 412"
            - "Call 10 with a FRESH version but period_index 9 while periods_reported == 1 returns 409 ERR_PERIOD_OUT_OF_SEQUENCE — the bound is still enforced once OCC passes — and call 11 shows ${av4} == ${av3}: a rejected posting never bumps the version"

      - name: stale_principal_version_outranks_the_slotting_budget_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.deal-accept-stale-principal
          - errors.ERR_STALE_PRINCIPAL_VERSION
          - validations.v-slotting-budget
        distinguishing_aspect: |
          The principal budget is the one truly shared resource, so accept carries
          expected_principal_version. This test makes the version stale AND the
          budget insufficient in the same request: the 412 must win (priority 6 over
          the fiscal priority 12), and only after refreshing the version does the
          real 409 become visible. Restoring the budget bumps the version again, so
          the client that just learned the budget error must re-read once more —
          exactly the retry loop the layer is designed to force.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF ACTIVE with slotting_budget_cents 20000000; item i1 VALIDATED; review decided with a PROPOSED deal (fee 12500/store, 400 stores, 1 item, forecast 100000, 4 periods, FORECAST_STRAIGHT) so quoted_fee_cents == 4817500 and one PENDING_SETUP authorization is linked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr: $.data.id }
            - call: "POST /commission-agreements/${agr}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i1: $.data.id }
            - call: "POST /items/${i1}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
            - call: "POST /items/${i1}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev: $.data.id }
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${prin}", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { pres: $.data.id }
            - call: "POST /presentations/${pres}/submit"
              payload: {}
              as: BrokerAccountManager
            - call: "POST /slotting-deals"
              payload: { presentation_id: "${pres}", requested_fee_per_store_cents: 12500, store_count_in_scope: 400, item_count_in_scope: 1, forecast_annual_units: 100000, amortization_periods: 4, amortization_method: "FORECAST_STRAIGHT" }
              as: BrokerAccountManager
              captures: { deal: $.data.id }
            - call: "POST /slotting-deals/${deal}/propose"
              payload: { proposed_fee_per_store_cents: 12500 }
              as: BrokerAccountManager
              captures: { quoted: $.data.quoted_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /category-reviews/${rev}/lock"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: BrokerAdmin
            - call: "GET /category-reviews/${rev}"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_v: $.data.version }
            - call: "POST /category-reviews/${rev}/decide"
              payload: { expected_review_version: "${rev_v}", authorized_item_ids: ["${i1}"] }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { pv0: $.data.version }
          trigger:
            - call: "PATCH /principals/${prin}"
              payload: { slotting_budget_cents: 4000000 }
              as: BrokerAdmin
              captures: { pv1: $.data.version, post1: $.data.credit_posture }
            - call: "POST /slotting-deals/${deal}/accept"
              payload: { expected_principal_version: "${pv0}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /slotting-deals/${deal}/accept"
              payload: { expected_principal_version: "${pv1}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { pv2: $.data.version }
            - call: "PATCH /principals/${prin}"
              payload: { slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { pv3: $.data.version }
            - call: "POST /slotting-deals/${deal}/accept"
              payload: { expected_principal_version: "${pv1}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e3: $.data.error_id }
            - call: "POST /slotting-deals/${deal}/accept"
              payload: { expected_principal_version: "${pv3}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { dstate: $.data.state, accepted: $.data.accepted_fee_cents }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { pv4: $.data.version, comm: $.data.slotting_committed_cents, ratio: $.data.liability_ratio_bps }
          assert:
            - "Setup: ${quoted} == 4817500 == 5000000 gross - 300000 volume credit + 117500 admin at 250 bps, and the authorization is PENDING_SETUP because the deal is still PROPOSED"
            - "Call 1 lowers the budget below the quote and returns ${pv1} == ${pv0} + 1 with ${post1} == NORMAL (nothing is committed yet)"
            - "Call 2 returns 412 ERR_STALE_PRINCIPAL_VERSION even though the budget is ALSO insufficient — priority 6 beats the fiscal check at priority 12, so the client never learns about the budget while its read is stale"
            - "Call 3 with the fresh ${pv1} returns 409 ERR_SLOTTING_BUDGET_EXCEEDED — 0 + 4817500 > 4000000; the deal stays PROPOSED"
            - "Call 4 shows ${pv2} == ${pv1} — neither rejected accept bumped the principal"
            - "Call 5 restores the budget and returns ${pv3} == ${pv1} + 1, so call 6 with the now-stale ${pv1} returns 412 again: fixing the business problem invalidates the client's version, which is the retry loop this layer forces"
            - "Call 7 with ${pv3} returns 200 with ${dstate} == AMORTIZING and ${accepted} == 4817500"
            - "Call 8: ${pv4} == ${pv3} + 1, ${comm} == 4817500 and ${ratio} == 2408 == floor(4817500*10000/20000000)"

      - name: snapshot_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: "cascading_side_effect_chain / snapshot_post_cascades_authorization_deal_and_principal_posture"
          rationale: "That instance walks the full six-step ordering of POST /distribution-snapshots (ledger → counters → amortization → void rate → RECOVERY_HOLD → principal posture) and asserts the ordering sensitivity that step 4 is evaluated after step 3."
      - name: amortization_dual_variant_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calculation / amortization_forecast_straight_vs_volume_weighted_divergence"
          rationale: "That instance posts identical snapshots to two deals differing only in amortization_method and asserts both period amounts and the final true-up delta."
      - name: at_risk_rate_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: "boundary_condition_cluster / void_rate_exactly_at_at_risk_threshold_flips_authorization_state"
          rationale: "That instance tests void_rate_bps at threshold-1, exactly at the threshold and above it, including the reset back to AUTHORIZED after a reversal."

  # ==========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.SlottingDeal.ACCEPTED_to_AMORTIZING
        distinguishing_aspect: |
          The consistency model is `immediate`, so the accept response must already
          show the state AFTER the auto-advance and all three cascade hops — a body
          reporting state ACCEPTED with a null accepted_fee_cents, or a principal
          whose aggregates only settle on the next request, is a failure even if the
          data converges later. The very next reads must agree with that body
          without any retry or delay.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF ACTIVE with slotting_budget_cents 20000000; items i1 and i2 VALIDATED; review with new_item_slots 2; presentation listing both items SUBMITTED; deal PROPOSED at 12500/store over 400 stores, 2 items in scope, forecast 100000, 4 periods, FORECAST_STRAIGHT; review DECIDED awarding both items so two PENDING_SETUP authorizations are linked to the deal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
