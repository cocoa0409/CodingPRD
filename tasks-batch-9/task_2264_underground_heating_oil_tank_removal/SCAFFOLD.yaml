# =============================================================================
# PRD Benchmark Seed Tables — Underground Heating-Oil Tank Removal &
# Soil Remediation (residential oil tank services contractor)
# §1.0 – §1.7.  Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2264. Underground Heating-Oil Tank Removal & Soil Remediation (residential oil tank services contractor): tank locating, sweep survey and homeowner disclosure, permit and fire-marshal notification before decommissioning, removal vs abandonment-in-place decision rules, soil sampling and laboratory turnaround with contamination thresholds, state trust-fund reimbursement application and eligibility, remediation scope change orders and excavation limits, no-further-action letter issuance for real-estate closings, insurance carrier notification and third-party liability

domain_name: "oil-tank-remediation"

# Flat topology: every business resource is a top-level collection linked by
# foreign keys carried in the request body. `api_prefix` is therefore the root.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # 12 peer entities joined by FK fields in request bodies; no nested URL paths.

  state_machine_shape: branching
  # TankProject is branching + cyclic (SAMPLING⇄REMEDIATION_ACTIVE,
  # CLOSED_NFA→REMEDIATION_ACTIVE); DecommissionWorkOrder carries two
  # independent parallel dimensions (field_status × billing_status);
  # TrustFundClaim carries a review cycle (UNDER_REVIEW⇄INFO_REQUESTED→SUBMITTED);
  # Permit is a fork with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Property → TankProject; TankProject → samples/permits/claims
    - self_referential     # SoilSample.retest_of_sample_id; RemediationChangeOrder.supersedes_change_order_id
    - cross_aggregate      # DecommissionWorkOrder ↔ Crew; SoilSample ↔ Laboratory

  role_model: segregation_of_duties
  # Field work, laboratory reporting, licensed-professional sign-off and
  # compliance/regulatory decisions are held by different roles, and the
  # Licensed Site Professional who DRAFTS an NFA letter may not ISSUE it.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities / 49 endpoints / 43 error codes / 7 calculations (3 of them
# dual-variant or order-pinned) / 9 state-machine dimensions across 8 entities.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: street_address
        type: string
        source: input
        description: "Residential street address of the tank site."
      - name: state_code
        type: enum
        source: input
        description: "Regulating state; selects the trust-fund deductible."
        constraints: "NJ | NY | CT"
      - name: county_code
        type: string
        source: input
        description: "County identifier used on the municipal permit."
      - name: homeowner_name
        type: string
        source: input
        description: "Name of the homeowner receiving disclosures."
      - name: homeowner_email
        type: string
        source: input
        description: "Contact address the disclosure notice is sent to."
      - name: insurance_carrier_code
        type: string
        source: input
        description: "Carrier identifier notified for first-party and liability claims."
      - name: first_party_coverage_limit_cents
        type: integer
        source: input
        description: "Bucket-1 capacity of the insurance waterfall, in cents."
        default: 2000000
        constraints: ">= 0"
      - name: third_party_sublimit_cents
        type: integer
        source: input
        description: "Bucket-2 capacity of the insurance waterfall, in cents."
        default: 5000000
        constraints: ">= 0"
      - name: trust_fund_deductible_cents
        type: integer
        source: computed
        description: "STATE_DEDUCTIBLE_CENTS[state_code]; snapshotted onto each TrustFundClaim."
      - name: open_project_count
        type: integer
        source: computed
        description: "count of TankProject where property_id == this.id AND status NOT IN {CLOSED_SETTLED, VOID}."
        default: 0

  - name: TankProject
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the site this decommissioning job belongs to."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 TankProject."
        default: INTAKE
        constraints: "INTAKE | SURVEYED | DISCLOSED | PERMITTED | DECOMMISSIONING | SAMPLING | ASSESSED | REMEDIATION_ACTIVE | CLEARED | CLOSED_NFA | CLOSED_SETTLED | VOID"
      - name: survey_method
        type: enum
        source: system
        description: "Locating technique recorded by the sweep survey."
        default: null
        constraints: "GPR | MAGNETOMETER | PROBE_ROD | null"
      - name: survey_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the sweep survey was recorded."
        default: null
      - name: tanks_detected_count
        type: integer
        source: system
        description: "Number of underground tanks the sweep survey located."
        default: null
        constraints: ">= 0"
      - name: tank_capacity_gallons
        type: integer
        source: system
        description: "Nominal capacity of the located tank."
        default: null
      - name: tank_depth_to_top_inches
        type: integer
        source: system
        description: "Depth of cover over the tank crown, in inches."
        default: null
      - name: tank_distance_to_foundation_inches
        type: integer
        source: system
        description: "Horizontal clearance from tank shell to the dwelling foundation."
        default: null
      - name: tank_under_structure
        type: boolean
        source: system
        description: "True when any part of the tank lies beneath a permanent structure."
        default: null
      - name: tank_material
        type: enum
        source: system
        description: "Shell material of the located tank."
        default: null
        constraints: "STEEL | FIBERGLASS | null"
      - name: method_score
        type: number
        source: computed
        description: "Abandonment-in-place suitability score, calculations.decommission_method_recommendation."
        default: null
        constraints: "0.00 .. 100.00, 2 dp"
      - name: recommended_method
        type: enum
        source: computed
        description: "ABANDONMENT_IN_PLACE when method_score >= 55.00, else REMOVAL."
        default: null
        constraints: "REMOVAL | ABANDONMENT_IN_PLACE | null"
      - name: decommission_method
        type: enum
        source: system
        description: "Method actually executed; copied from the work order at field START."
        default: null
        constraints: "REMOVAL | ABANDONMENT_IN_PLACE | null"
      - name: baseline_scope_cubic_yards
        type: number
        source: input
        description: "Contracted excavation volume before any change order."
        default: 8.0
        constraints: "> 0"
      - name: excavation_limit_cubic_yards
        type: number
        source: input
        description: "Hard ceiling on approved_scope_cubic_yards enforced at change-order approval."
        default: 40.0
        constraints: "> 0"
      - name: approved_scope_cubic_yards
        type: number
        source: computed
        description: "baseline_scope_cubic_yards + sum of additional_cubic_yards over RemediationChangeOrder rows with status == APPROVED."
      - name: sampling_round
        type: integer
        source: system
        description: "Index of the current confirmation-sampling round; 0 before field completion."
        default: 0
      - name: contamination_class
        type: enum
        source: computed
        description: "calculations.contamination_classification over the current round."
        default: UNCLASSIFIED
        constraints: "UNCLASSIFIED | CLEAN | ELEVATED | GROSS"
      - name: max_tph_mg_kg
        type: number
        source: computed
        description: "Highest tph_mg_kg among RESULTED samples of the current round; null when the round has none."
        default: null
      - name: max_benzene_mg_kg
        type: number
        source: computed
        description: "Highest benzene_mg_kg among RESULTED samples of the current round; null when the round has none."
        default: null
      - name: remediation_started
        type: boolean
        source: system
        description: "Set true the first time the project enters REMEDIATION_ACTIVE; never reset."
        default: false
      - name: contamination_disclosure_required
        type: boolean
        source: system
        description: "Set true the first time contamination_class becomes ELEVATED or GROSS; never reset."
        default: false
      - name: remediation_volume_cubic_yards
        type: number
        source: computed
        description: "calculations.remediation_soil_volume result under the currently selected variant."
        default: null
      - name: remediation_volume_basis
        type: enum
        source: computed
        description: "Which variant produced remediation_volume_cubic_yards."
        default: null
        constraints: "PROVISIONAL_GRID | FINAL_SURVEYED | null"
      - name: remediation_cost_cents
        type: integer
        source: computed
        description: "calculations.remediation_cost; 0 while remediation_started == false."
        default: 0
      - name: actual_excavated_cubic_yards
        type: number
        source: system
        description: "Volume reported by the crew at field COMPLETE."
        default: null
      - name: hauled_tons
        type: number
        source: system
        description: "Tonnage of soil hauled off site, reported at field COMPLETE; drives FINAL_SURVEYED volume."
        default: null
      - name: nfa_blockers
        type: array
        source: computed
        description: "calculations.nfa_blocker_set — sorted ascending list of blocker codes; NFA issuance requires an empty list."
        default: []

  - name: HomeownerDisclosure
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project whose findings are disclosed."
      - name: disclosure_kind
        type: enum
        source: input
        description: "Which findings the notice covers."
        constraints: "SWEEP_FINDINGS | CONTAMINATION_FINDINGS"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was issued."
      - name: expires_at
        type: datetime
        source: computed
        description: "sent_at + DISCLOSURE_RESPONSE_WINDOW_HOURS (72h)."
      - name: responded_at
        type: datetime
        source: system
        description: "Instant the homeowner acknowledged or declined."
        default: null
      - name: response_channel
        type: enum
        source: input
        description: "Channel the homeowner used to respond."
        default: null
        constraints: "EMAIL | PORTAL | WET_SIGNATURE | null"
      - name: status
        type: enum
        source: system
        description: "See §1.2 HomeownerDisclosure."
        default: PENDING
        constraints: "PENDING | ACKNOWLEDGED | DECLINED | EXPIRED"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project the authorization belongs to."
      - name: permit_type
        type: enum
        source: input
        description: "Municipal decommissioning permit, or the statutory fire-marshal notification."
        constraints: "MUNICIPAL_DECOMMISSION | FIRE_MARSHAL_NOTIFICATION"
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant the application/notification was filed."
      - name: issued_at
        type: datetime
        source: system
        description: "Instant the authority issued or acknowledged it."
        default: null
      - name: notice_effective_at
        type: datetime
        source: computed
        description: "issued_at + FIRE_MARSHAL_NOTICE_LEAD_HOURS (48h) for FIRE_MARSHAL_NOTIFICATION; equal to issued_at for MUNICIPAL_DECOMMISSION."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + PERMIT_VALIDITY_DAYS (180 days)."
        default: null
      - name: denial_reason
        type: string
        source: input
        description: "Free-text reason recorded on the DENIED branch."
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason recorded on the REVOKED (stop-work) branch."
        default: null
      - name: status
        type: enum
        source: system
        description: "See §1.2 Permit."
        default: SUBMITTED
        constraints: "SUBMITTED | ISSUED | DENIED | REVOKED | EXPIRED"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_name
        type: string
        source: input
        description: "Label of the excavation crew."
      - name: cert_level
        type: enum
        source: input
        description: "Certification tier of the crew lead."
        constraints: "TANK_TECH_I | TANK_TECH_II | LSP_SUPERVISED"
      - name: mobilization_buffer_minutes
        type: integer
        source: input
        description: "Symmetric travel/decon buffer applied to both ends of this crew's bookings."
        default: 90
        constraints: ">= 0"

  - name: DecommissionWorkOrder
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project being decommissioned."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; crew whose calendar this booking occupies."
      - name: method
        type: enum
        source: input
        description: "Decommissioning method to execute."
        constraints: "REMOVAL | ABANDONMENT_IN_PLACE"
      - name: method_override_reason
        type: string
        source: input
        description: "Required when method != TankProject.recommended_method."
        default: null
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Inclusive start of the crew booking interval."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Exclusive end of the crew booking interval."
      - name: field_status
        type: enum
        source: system
        description: "Field dimension of the parallel state machine; see §1.2."
        default: SCHEDULED
        constraints: "SCHEDULED | MOBILIZED | IN_PROGRESS | FIELD_COMPLETE | ABORTED"
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension of the parallel state machine; evolves independently of field_status."
        default: UNBILLED
        constraints: "UNBILLED | BILLABLE | INVOICED | RECONCILED | WRITTEN_OFF"
      - name: actual_excavated_cubic_yards
        type: number
        source: input
        description: "Volume the crew reports at field COMPLETE."
        default: null
      - name: hauled_tons
        type: number
        source: input
        description: "Tonnage hauled off site, reported at field COMPLETE."
        default: null
      - name: abort_reason
        type: string
        source: input
        description: "Reason recorded when the field dimension is aborted."
        default: null

  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - name: lab_name
        type: string
        source: input
        description: "Name of the analytical laboratory."
      - name: accredited
        type: boolean
        source: input
        description: "Whether the lab holds state accreditation; unaccredited labs cannot receive samples."
        default: true
      - name: committed_turnaround_hours
        type: integer
        source: input
        description: "Contract turnaround; also the length of a sample's analysis-window occupation."
        default: 72
        constraints: "> 0"
      - name: holding_time_hours
        type: integer
        source: input
        description: "Maximum permitted collected_at → received_at elapsed time."
        default: 336
        constraints: "> 0"
      - name: max_concurrent_analyses
        type: integer
        source: input
        description: "Aggregate capacity of overlapping analysis windows at this lab."
        default: 2
        constraints: ">= 1"

  - name: SoilSample
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project the sample belongs to."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> DecommissionWorkOrder.id; excavation the sample was taken from."
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> Laboratory.id; lab that analyses this sample."
      - name: retest_of_sample_id
        type: string
        source: input
        description: "FK -> SoilSample.id; the INVALIDATED sample this one re-tests."
        default: null
      - name: sampling_round
        type: integer
        source: system
        description: "TankProject.sampling_round at the moment of collection."
      - name: sample_point
        type: enum
        source: input
        description: "Location within the excavation the aliquot came from."
        constraints: "TANK_BOTTOM | NORTH_SIDEWALL | SOUTH_SIDEWALL | STOCKPILE | CONFIRMATION_FLOOR"
      - name: depth_inches
        type: integer
        source: input
        description: "Sample depth below grade; drives the grid volume estimate."
        constraints: "> 0"
      - name: collected_at
        type: datetime
        source: system
        description: "Logical-clock instant of collection."
      - name: collected_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldTechnician who collected the aliquot."
      - name: dispatched_at
        type: datetime
        source: system
        description: "Instant the chain-of-custody DISPATCH event fired."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Instant the lab logged RECEIVE; start of the analysis window."
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: "Instant the lab posted the result."
        default: null
      - name: holding_time_elapsed_hours
        type: number
        source: computed
        description: "(received_at - collected_at) in hours, 2 dp."
        default: null
      - name: turnaround_hours
        type: number
        source: computed
        description: "(reported_at - received_at) in hours, 2 dp."
        default: null
      - name: turnaround_breach
        type: boolean
        source: computed
        description: "True when turnaround_hours > Laboratory.committed_turnaround_hours (strict)."
        default: false
      - name: tph_mg_kg
        type: number
        source: input
        description: "Total petroleum hydrocarbons reported by the lab."
        default: null
        constraints: ">= 0"
      - name: benzene_mg_kg
        type: number
        source: input
        description: "Benzene concentration reported by the lab."
        default: null
        constraints: ">= 0"
      - name: qc_flag
        type: enum
        source: system
        description: "Quality-control disposition assigned by the server."
        default: NONE
        constraints: "NONE | HOLDING_TIME_EXCEEDED | RESULT_RETRACTED"
      - name: status
        type: enum
        source: system
        description: "See §1.2 SoilSample."
        default: COLLECTED
        constraints: "COLLECTED | IN_TRANSIT | AT_LAB | RESULTED | INVALIDATED | VOIDED"

  - name: RemediationChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project whose remediation scope changes."
      - name: supersedes_change_order_id
        type: string
        source: input
        description: "FK -> RemediationChangeOrder.id; APPROVED change order this one replaces."
        default: null
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensedSiteProfessional who drafted the change order."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who decided it."
        default: null
      - name: additional_cubic_yards
        type: number
        source: input
        description: "Extra excavation volume requested."
        constraints: "> 0"
      - name: unit_rate_cents
        type: integer
        source: input
        description: "Per-cubic-yard rate in cents before the disposal multiplier."
        constraints: "> 0"
      - name: disposal_class
        type: enum
        source: input
        description: "Selects DISPOSAL_MULTIPLIER."
        constraints: "NON_HAZARDOUS | HAZARDOUS"
      - name: line_amount_cents
        type: integer
        source: computed
        description: "round_half_up(additional_cubic_yards * unit_rate_cents * DISPOSAL_MULTIPLIER[disposal_class]) — rounded per line BEFORE summation."
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Free-text note recorded with the approval/rejection."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Instant of the approve/reject decision; cleared to null if the row is later superseded."
        default: null
      - name: status
        type: enum
        source: system
        description: "See §1.2 RemediationChangeOrder."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED"

  - name: TrustFundClaim
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project the reimbursement is claimed for."
      - name: variant
        type: enum
        source: input
        description: "Which eligibility algorithm applies; see calculations.trust_fund_eligible_amount."
        constraints: "PRELIMINARY_ESTIMATE | FINAL_SETTLEMENT"
      - name: state_code
        type: enum
        source: system
        description: "Snapshot of Property.state_code at claim creation."
        constraints: "NJ | NY | CT"
      - name: claimed_costs_cents
        type: integer
        source: input
        description: "Gross remediation costs submitted to the trust fund, in cents."
        constraints: "> 0"
      - name: deductible_cents
        type: integer
        source: computed
        description: "STATE_DEDUCTIBLE_CENTS[state_code], snapshotted at creation."
      - name: cap_cents
        type: integer
        source: computed
        description: "Reimbursement cap tier selected by claimed_costs_cents."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(min(claimed_costs_cents, cap_cents) * ADMIN_FEE_RATE)."
      - name: eligible_amount_cents
        type: integer
        source: computed
        description: "Variant-specific eligible reimbursement; see calculations.trust_fund_eligible_amount."
      - name: reimbursed_amount_cents
        type: integer
        source: computed
        description: "Cash actually disbursed; set to eligible_amount_cents on PAID, reset to 0 when an APPROVED claim is reverted."
        default: 0
      - name: unreimbursed_balance_cents
        type: integer
        source: computed
        description: "eligible_amount_cents - reimbursed_amount_cents."
      - name: eligibility_findings
        type: array
        source: computed
        description: "Sorted ascending list of finding codes recorded by the eligibility evaluation and by compensating reverts."
        default: []
      - name: info_request_count
        type: integer
        source: system
        description: "Number of times the reviewer has requested more information; capped at MAX_INFO_REQUESTS."
        default: 0
      - name: decision_note
        type: string
        source: input
        description: "Free-text note recorded with a review decision."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant of the most recent submit."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Instant of the APPROVED/DENIED decision; cleared to null on a compensating revert."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Instant of disbursement."
        default: null
      - name: status
        type: enum
        source: system
        description: "See §1.2 TrustFundClaim."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | PAID | WITHDRAWN"

  - name: NFALetter
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project being closed out."
      - name: closing_date
        type: datetime
        source: input
        description: "Scheduled real-estate closing the letter is needed for; must not be in the past at issuance."
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensedSiteProfessional who created the draft."
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicensedSiteProfessional who signed the letter; must differ from drafted_by_user_id."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Instant of issuance."
        default: null
      - name: rescinded_at
        type: datetime
        source: system
        description: "Instant of rescission."
        default: null
      - name: rescission_reason
        type: string
        source: input
        description: "Reason recorded when the letter is pulled back."
        default: null
      - name: status
        type: enum
        source: system
        description: "See §1.2 NFALetter."
        default: DRAFT
        constraints: "DRAFT | ISSUED | RESCINDED"

  - name: InsuranceNotification
    parent: null
    common_fields: true
    fields:
      - name: tank_project_id
        type: string
        source: input
        description: "FK -> TankProject.id; project reported to the carrier."
      - name: notification_kind
        type: enum
        source: input
        description: "First-party property claim, or third-party liability tender."
        constraints: "FIRST_PARTY | THIRD_PARTY_LIABILITY"
      - name: carrier_code
        type: string
        source: system
        description: "Snapshot of Property.insurance_carrier_code at creation."
      - name: notified_at
        type: datetime
        source: system
        description: "Instant the carrier was notified."
      - name: first_party_allocated_cents
        type: integer
        source: computed
        description: "Bucket-1 share of calculations.insurance_reserve_allocation."
        default: 0
      - name: third_party_allocated_cents
        type: integer
        source: computed
        description: "Bucket-2 share of calculations.insurance_reserve_allocation."
        default: 0
      - name: homeowner_out_of_pocket_cents
        type: integer
        source: computed
        description: "Bucket-3 remainder of calculations.insurance_reserve_allocation."
        default: 0
      - name: reserve_amount_cents
        type: integer
        source: computed
        description: "first_party_allocated_cents + third_party_allocated_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "See §1.2 InsuranceNotification."
        default: OPEN
        constraints: "OPEN | RESERVED | THIRD_PARTY_REVIEW | CLOSED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- TankProject
  - entity: TankProject
    initial_state: INTAKE
    terminal_states: [CLOSED_SETTLED, VOID]
    transitions:

      - from: INTAKE
        to: SURVEYED
        trigger: "POST /tank-projects/{id}/sweep-survey"
        actor: ProjectCoordinator | FieldTechnician
        preconditions:
          - "status == INTAKE"
          - "tanks_detected_count >= 1 (0 rejected with ERR_NO_TANK_LOCATED)"
          - "tank_capacity_gallons, tank_depth_to_top_inches, tank_distance_to_foundation_inches, tank_under_structure and tank_material all present"
        side_effects:
          - "sets survey_method, survey_completed_at = logical clock, tanks_detected_count and the five tank_* fields"
          - "computes method_score and recommended_method per calculations.decommission_method_recommendation"
          - "increments TankProject.version by 1"

      - from: SURVEYED
        to: DISCLOSED
        trigger: "POST /disclosures/{id}/respond with response == ACKNOWLEDGED"
        actor: Homeowner
        preconditions:
          - "disclosure.disclosure_kind == SWEEP_FINDINGS"
          - "disclosure.status == PENDING"
          - "logical clock <= disclosure.expires_at"
          - "TankProject.status == SURVEYED"
        side_effects:
          - "HomeownerDisclosure.status PENDING -> ACKNOWLEDGED, responded_at = logical clock"
          - "TankProject.status SURVEYED -> DISCLOSED"

      - from: SURVEYED
        to: VOID
        trigger: "POST /disclosures/{id}/respond with response == DECLINED"
        actor: Homeowner
        preconditions:
          - "disclosure.disclosure_kind == SWEEP_FINDINGS"
          - "disclosure.status == PENDING"
          - "TankProject.status == SURVEYED"
        side_effects:
          - "HomeownerDisclosure.status PENDING -> DECLINED"
          - "TankProject.status SURVEYED -> VOID"
          - "every Permit on this project with status IN {SUBMITTED, ISSUED} -> REVOKED with revocation_reason = 'HOMEOWNER_DECLINED'"
          - "every DecommissionWorkOrder on this project with field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS} -> ABORTED with abort_reason = 'PROJECT_VOIDED', and its billing_status -> WRITTEN_OFF"
          - "decrements Property.open_project_count by 1"

      - from: DISCLOSED
        to: PERMITTED
        trigger: "POST /permits/{id}/decision with decision == ISSUED on a MUNICIPAL_DECOMMISSION permit"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == SUBMITTED"
          - "permit.permit_type == MUNICIPAL_DECOMMISSION"
          - "TankProject.status == DISCLOSED"
        side_effects:
          - "Permit.status SUBMITTED -> ISSUED; issued_at = logical clock; notice_effective_at = issued_at; expires_at = issued_at + 180 days"
          - "TankProject.status DISCLOSED -> PERMITTED"

      - from: PERMITTED
        to: DECOMMISSIONING
        trigger: "POST /work-orders/{id}/field-events with event == START"
        actor: FieldTechnician
        preconditions:
          - "work_order.field_status == MOBILIZED"
          - "TankProject.status == PERMITTED"
        side_effects:
          - "DecommissionWorkOrder.field_status MOBILIZED -> IN_PROGRESS"
          - "TankProject.decommission_method = work_order.method"
          - "TankProject.status PERMITTED -> DECOMMISSIONING"

      - from: DECOMMISSIONING
        to: SAMPLING
        trigger: "POST /work-orders/{id}/field-events with event == COMPLETE"
        actor: FieldTechnician
        preconditions:
          - "work_order.field_status == IN_PROGRESS"
          - "actual_excavated_cubic_yards and hauled_tons present"
          - "TankProject.status == DECOMMISSIONING"
        side_effects:
          - "DecommissionWorkOrder.field_status IN_PROGRESS -> FIELD_COMPLETE"
          - "DecommissionWorkOrder.billing_status UNBILLED -> BILLABLE (billing dimension advances only from UNBILLED)"
          - "TankProject.actual_excavated_cubic_yards and hauled_tons copied from the work order"
          - "TankProject.sampling_round 0 -> 1"
          - "TankProject.status DECOMMISSIONING -> SAMPLING"

      - from: SAMPLING
        to: ASSESSED
        trigger: "system, evaluated at the end of POST /soil-samples/{id}/result"
        actor: system
        preconditions:
          - "count of SoilSample with tank_project_id == project.id AND sampling_round == project.sampling_round AND status IN {COLLECTED, IN_TRANSIT, AT_LAB} == 0"
          - "count of SoilSample with tank_project_id == project.id AND sampling_round == project.sampling_round AND status == RESULTED >= 1"
        side_effects:
          - "recomputes max_tph_mg_kg, max_benzene_mg_kg and contamination_class per calculations.contamination_classification"
          - "TankProject.status SAMPLING -> ASSESSED"

      - from: ASSESSED
        to: CLEARED
        trigger: "system, evaluated immediately on entering ASSESSED"
        actor: system
        preconditions:
          - "contamination_class == CLEAN"
        side_effects:
          - "TankProject.status ASSESSED -> CLEARED"

      - from: ASSESSED
        to: REMEDIATION_ACTIVE
        trigger: "system, evaluated immediately on entering ASSESSED"
        actor: system
        preconditions:
          - "contamination_class IN {ELEVATED, GROSS}"
        side_effects:
          - "TankProject.contamination_disclosure_required = true"
          - "TankProject.remediation_started = true"
          - "recomputes remediation_volume_cubic_yards with variant PROVISIONAL_GRID and sets remediation_volume_basis = PROVISIONAL_GRID (calculations.remediation_soil_volume)"
          - "recomputes remediation_cost_cents per calculations.remediation_cost"
          - "the remediation_cost_cents change itself re-runs calculations.insurance_reserve_allocation and rewrites first_party_allocated_cents / third_party_allocated_cents / homeowner_out_of_pocket_cents / reserve_amount_cents on every InsuranceNotification of this project whose status != CLOSED"
          - "each rewritten InsuranceNotification then re-derives its own status: THIRD_PARTY_REVIEW when third_party_allocated_cents > 0, else RESERVED when reserve_amount_cents > 0, else OPEN"
          - "TankProject.status ASSESSED -> REMEDIATION_ACTIVE"
        note: "Cascade depth 5 measured from POST /soil-samples/{id}/result: result -> sample RESULTED -> project ASSESSED -> project REMEDIATION_ACTIVE + cost -> notification allocation -> notification status."

      - from: REMEDIATION_ACTIVE
        to: SAMPLING
        trigger: "POST /soil-samples (first sample created while status == REMEDIATION_ACTIVE)"
        actor: FieldTechnician
        preconditions:
          - "count of RemediationChangeOrder on this project with status IN {DRAFT, SUBMITTED} == 0"
          - "TankProject.status == REMEDIATION_ACTIVE"
        side_effects:
          - "TankProject.sampling_round += 1"
          - "the new SoilSample.sampling_round is set to the incremented value"
          - "TankProject.contamination_class -> UNCLASSIFIED; max_tph_mg_kg -> null; max_benzene_mg_kg -> null"
          - "TankProject.status REMEDIATION_ACTIVE -> SAMPLING"
        note: "Samples created while status == SAMPLING do NOT increment sampling_round."

      - from: ASSESSED
        to: SAMPLING
        trigger: "POST /soil-samples/{id}/retract-result"
        actor: LabAnalyst
        preconditions:
          - "sample.status == RESULTED"
          - "sample.sampling_round == project.sampling_round"
        side_effects:
          - "SoilSample.status RESULTED -> INVALIDATED; qc_flag = RESULT_RETRACTED; tph_mg_kg and benzene_mg_kg preserved for audit"
          - "TankProject.contamination_class -> UNCLASSIFIED; max_tph_mg_kg -> null; max_benzene_mg_kg -> null"
          - "TankProject.status ASSESSED -> SAMPLING"

      - from: CLEARED
        to: SAMPLING
        trigger: "POST /soil-samples/{id}/retract-result"
        actor: LabAnalyst
        preconditions:
          - "sample.status == RESULTED"
          - "sample.sampling_round == project.sampling_round"
        side_effects:
          - "SoilSample.status RESULTED -> INVALIDATED; qc_flag = RESULT_RETRACTED"
          - "TankProject.contamination_class -> UNCLASSIFIED; max_tph_mg_kg -> null; max_benzene_mg_kg -> null"
          - "TankProject.status CLEARED -> SAMPLING"

      - from: REMEDIATION_ACTIVE
        to: SAMPLING
        trigger: "POST /soil-samples/{id}/retract-result"
        actor: LabAnalyst
        preconditions:
          - "sample.status == RESULTED"
          - "sample.sampling_round == project.sampling_round"
        side_effects:
          - "SoilSample.status RESULTED -> INVALIDATED; qc_flag = RESULT_RETRACTED"
          - "TankProject.contamination_class -> UNCLASSIFIED; max_tph_mg_kg -> null; max_benzene_mg_kg -> null"
          - "TankProject.status REMEDIATION_ACTIVE -> SAMPLING"

      - from: CLEARED
        to: CLOSED_NFA
        trigger: "POST /nfa-letters/{id}/issue"
        actor: LicensedSiteProfessional
        preconditions:
          - "nfa_letter.status == DRAFT"
          - "TankProject.status == CLEARED"
          - "TankProject.nfa_blockers == [] (empty)"
          - "X-User-ID != nfa_letter.drafted_by_user_id"
          - "nfa_letter.closing_date >= logical clock"
        side_effects:
          - "NFALetter.status DRAFT -> ISSUED; issued_at = logical clock; issued_by_user_id = X-User-ID"
          - "TankProject.status CLEARED -> CLOSED_NFA"

      - from: CLOSED_NFA
        to: REMEDIATION_ACTIVE
        trigger: "POST /nfa-letters/{id}/rescind"
        actor: ComplianceOfficer
        preconditions:
          - "nfa_letter.status == ISSUED"
          - "TankProject.status == CLOSED_NFA"
        side_effects:
          - "NFALetter.status ISSUED -> RESCINDED; rescinded_at = logical clock"
          - "TankProject.status CLOSED_NFA -> REMEDIATION_ACTIVE; contamination_class -> UNCLASSIFIED; remediation_volume_cubic_yards -> null; remediation_volume_basis -> null; remediation_started = true"
          - "the project's departure from CLOSED_NFA then reverts every TrustFundClaim on this project whose status == APPROVED to UNDER_REVIEW: reimbursed_amount_cents -> 0, decided_at -> null, unreimbursed_balance_cents recomputed, and 'NFA_RESCINDED_REVALIDATION_REQUIRED' appended to eligibility_findings"
          - "the project's re-entry into REMEDIATION_ACTIVE recomputes remediation_cost_cents, which in turn re-runs calculations.insurance_reserve_allocation over every InsuranceNotification of this project with status != CLOSED, and each rewritten notification then re-derives its status"
        note: "Cascade depth 4 measured from POST /nfa-letters/{id}/rescind: letter RESCINDED -> project REMEDIATION_ACTIVE -> claim reverted to UNDER_REVIEW -> notification allocation/status rewritten."

      - from: CLOSED_NFA
        to: CLOSED_SETTLED
        trigger: "POST /trust-fund-claims/{id}/decision with decision == PAID"
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == APPROVED"
          - "TankProject.status == CLOSED_NFA"
        side_effects:
          - "TrustFundClaim.status APPROVED -> PAID; paid_at = logical clock; reimbursed_amount_cents = eligible_amount_cents; unreimbursed_balance_cents = 0"
          - "TankProject.status CLOSED_NFA -> CLOSED_SETTLED"
          - "every InsuranceNotification on this project with status != CLOSED -> CLOSED"
          - "decrements Property.open_project_count by 1"

  # ------------------------------------------- DecommissionWorkOrder (field dim)
  - entity: DecommissionWorkOrder
    dimension: field_status
    initial_state: SCHEDULED
    terminal_states: [FIELD_COMPLETE, ABORTED]
    transitions:
      - from: SCHEDULED
        to: MOBILIZED
        trigger: "POST /work-orders/{id}/field-events with event == MOBILIZE"
        actor: FieldTechnician
        preconditions:
          - "field_status == SCHEDULED"
          - "TankProject.status == PERMITTED"
          - "a Permit on the project with permit_type == FIRE_MARSHAL_NOTIFICATION and status == ISSUED exists whose notice_effective_at <= logical clock"
          - "the project's MUNICIPAL_DECOMMISSION Permit has status == ISSUED and logical clock <= its expires_at"
        side_effects:
          - "field_status SCHEDULED -> MOBILIZED"
          - "if the MUNICIPAL_DECOMMISSION Permit's expires_at < logical clock, that Permit.status ISSUED -> EXPIRED is written before the request is rejected with ERR_PERMIT_EXPIRED"
      - from: MOBILIZED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/field-events with event == START"
        actor: FieldTechnician
        preconditions:
          - "field_status == MOBILIZED"
          - "TankProject.status == PERMITTED"
        side_effects:
          - "field_status MOBILIZED -> IN_PROGRESS"
          - "TankProject.status PERMITTED -> DECOMMISSIONING; TankProject.decommission_method = method"
      - from: IN_PROGRESS
        to: FIELD_COMPLETE
        trigger: "POST /work-orders/{id}/field-events with event == COMPLETE"
        actor: FieldTechnician
        preconditions:
          - "field_status == IN_PROGRESS"
          - "actual_excavated_cubic_yards and hauled_tons present in the request"
        side_effects:
          - "field_status IN_PROGRESS -> FIELD_COMPLETE; stores actual_excavated_cubic_yards and hauled_tons"
          - "billing_status UNBILLED -> BILLABLE"
          - "TankProject.status DECOMMISSIONING -> SAMPLING; TankProject.sampling_round 0 -> 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /work-orders/{id}/field-events with event == ABORT, or cascade from Permit REVOKED / project VOID"
        actor: FieldTechnician | system
        preconditions:
          - "field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
        side_effects:
          - "field_status -> ABORTED; abort_reason recorded"
          - "billing_status -> WRITTEN_OFF when billing_status IN {UNBILLED, BILLABLE, INVOICED}"
          - "releases the crew booking interval so the crew's calendar no longer collides"
      - from: MOBILIZED
        to: ABORTED
        trigger: "POST /work-orders/{id}/field-events with event == ABORT, or cascade from Permit REVOKED / project VOID"
        actor: FieldTechnician | system
        preconditions:
          - "field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
        side_effects:
          - "field_status -> ABORTED; abort_reason recorded"
          - "billing_status -> WRITTEN_OFF when billing_status IN {UNBILLED, BILLABLE, INVOICED}"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /work-orders/{id}/field-events with event == ABORT, or cascade from Permit REVOKED / project VOID"
        actor: FieldTechnician | system
        preconditions:
          - "field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
        side_effects:
          - "field_status -> ABORTED; abort_reason recorded"
          - "billing_status -> WRITTEN_OFF when billing_status IN {UNBILLED, BILLABLE, INVOICED}"

  # ----------------------------------------- DecommissionWorkOrder (billing dim)
  - entity: DecommissionWorkOrder
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [RECONCILED, WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: BILLABLE
        trigger: "system, side effect of field event COMPLETE"
        actor: system
        preconditions:
          - "billing_status == UNBILLED"
          - "field_status transition IN_PROGRESS -> FIELD_COMPLETE succeeded"
        side_effects:
          - "billing_status UNBILLED -> BILLABLE"
      - from: BILLABLE
        to: INVOICED
        trigger: "POST /work-orders/{id}/billing-events with event == INVOICE"
        actor: ProjectCoordinator
        preconditions:
          - "billing_status == BILLABLE"
        side_effects:
          - "billing_status BILLABLE -> INVOICED"
        note: "Independent of field_status: a work order can be INVOICED while the project has already moved on to SAMPLING or REMEDIATION_ACTIVE."
      - from: INVOICED
        to: RECONCILED
        trigger: "POST /work-orders/{id}/billing-events with event == RECONCILE"
        actor: ProjectCoordinator
        preconditions:
          - "billing_status == INVOICED"
          - "field_status == FIELD_COMPLETE"
          - "TankProject.remediation_started == true"
        side_effects:
          - "billing_status INVOICED -> RECONCILED"
          - "recomputes TankProject.remediation_volume_cubic_yards with variant FINAL_SURVEYED and sets remediation_volume_basis = FINAL_SURVEYED"
      - from: BILLABLE
        to: WRITTEN_OFF
        trigger: "POST /work-orders/{id}/billing-events with event == WRITE_OFF"
        actor: ProjectCoordinator
        preconditions:
          - "billing_status IN {UNBILLED, BILLABLE, INVOICED}"
        side_effects:
          - "billing_status -> WRITTEN_OFF"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /work-orders/{id}/billing-events with event == WRITE_OFF"
        actor: ProjectCoordinator
        preconditions:
          - "billing_status IN {UNBILLED, BILLABLE, INVOICED}"
        side_effects:
          - "billing_status -> WRITTEN_OFF"

  # ------------------------------------------------------- HomeownerDisclosure
  - entity: HomeownerDisclosure
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /disclosures/{id}/respond with response == ACKNOWLEDGED"
        actor: Homeowner
        preconditions:
          - "status == PENDING"
          - "logical clock <= expires_at"
          - "X-User-ID == TankProject.property_id of this disclosure's project"
        side_effects:
          - "status PENDING -> ACKNOWLEDGED; responded_at = logical clock; response_channel stored"
          - "when disclosure_kind == SWEEP_FINDINGS and project.status == SURVEYED: project -> DISCLOSED"
          - "when disclosure_kind == CONTAMINATION_FINDINGS: recomputes TankProject.nfa_blockers"
      - from: PENDING
        to: DECLINED
        trigger: "POST /disclosures/{id}/respond with response == DECLINED"
        actor: Homeowner
        preconditions:
          - "status == PENDING"
          - "X-User-ID == TankProject.property_id of this disclosure's project"
        side_effects:
          - "status PENDING -> DECLINED; responded_at = logical clock"
          - "when disclosure_kind == SWEEP_FINDINGS and project.status == SURVEYED: project -> VOID plus the VOID cascade"
      - from: PENDING
        to: EXPIRED
        trigger: "system, evaluated at the start of POST /disclosures/{id}/respond"
        actor: system
        preconditions:
          - "status == PENDING"
          - "logical clock > expires_at"
        side_effects:
          - "status PENDING -> EXPIRED; the triggering respond request is then rejected with ERR_DISCLOSURE_EXPIRED"

  # -------------------------------------------------------------------- Permit
  - entity: Permit
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /permits/{id}/decision with decision == ISSUED"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "TankProject.status == DISCLOSED for permit_type == MUNICIPAL_DECOMMISSION"
          - "TankProject.status IN {DISCLOSED, PERMITTED} for permit_type == FIRE_MARSHAL_NOTIFICATION"
        side_effects:
          - "status SUBMITTED -> ISSUED; issued_at = logical clock; expires_at = issued_at + 180 days"
          - "notice_effective_at = issued_at + 48h for FIRE_MARSHAL_NOTIFICATION, = issued_at for MUNICIPAL_DECOMMISSION"
          - "for MUNICIPAL_DECOMMISSION only: TankProject.status DISCLOSED -> PERMITTED"
        note: "ISSUED branch: advances the project. Divergent from the DENIED and REVOKED branches below."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /permits/{id}/decision with decision == DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "denial_reason present in the request"
        side_effects:
          - "status SUBMITTED -> DENIED; denial_reason stored"
          - "TankProject.status unchanged (remains DISCLOSED)"
        note: "DENIED branch: no project transition, no cascade."
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/decision with decision == REVOKED"
        actor: ComplianceOfficer
        preconditions:
          - "status == ISSUED"
          - "revocation_reason present in the request"
        side_effects:
          - "status ISSUED -> REVOKED; revocation_reason stored"
          - "every DecommissionWorkOrder on this project with field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS} -> ABORTED with abort_reason = 'PERMIT_REVOKED', and its billing_status -> WRITTEN_OFF"
          - "recomputes TankProject.nfa_blockers, which now includes 'PERMIT_REVOKED'"
        note: "REVOKED branch: stop-work cascade onto work orders plus an NFA blocker — a side-effect set disjoint from both ISSUED and DENIED."
      - from: ISSUED
        to: EXPIRED
        trigger: "system, evaluated at the start of POST /work-orders/{id}/field-events with event == MOBILIZE"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "logical clock > expires_at"
        side_effects:
          - "status ISSUED -> EXPIRED; the triggering MOBILIZE is then rejected with ERR_PERMIT_EXPIRED"

  # ---------------------------------------------------------------- SoilSample
  - entity: SoilSample
    initial_state: COLLECTED
    terminal_states: [INVALIDATED, VOIDED]
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /soil-samples/{id}/chain-of-custody with event == DISPATCH"
        actor: FieldTechnician
        preconditions:
          - "status == COLLECTED"
        side_effects:
          - "status COLLECTED -> IN_TRANSIT; dispatched_at = logical clock"
      - from: IN_TRANSIT
        to: AT_LAB
        trigger: "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"
        actor: LabAnalyst
        preconditions:
          - "status == IN_TRANSIT"
          - "X-User-ID == laboratory_id"
          - "Laboratory.accredited == true"
          - "(logical clock - collected_at) in hours <= Laboratory.holding_time_hours"
          - "count of SoilSample with laboratory_id == this.laboratory_id AND status == AT_LAB AND received_at <= logical clock <= received_at + Laboratory.committed_turnaround_hours < Laboratory.max_concurrent_analyses"
        side_effects:
          - "status IN_TRANSIT -> AT_LAB; received_at = logical clock; holding_time_elapsed_hours computed"
      - from: IN_TRANSIT
        to: INVALIDATED
        trigger: "system, evaluated inside POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"
        actor: system
        preconditions:
          - "status == IN_TRANSIT"
          - "(logical clock - collected_at) in hours > Laboratory.holding_time_hours"
        side_effects:
          - "status IN_TRANSIT -> INVALIDATED; qc_flag = HOLDING_TIME_EXCEEDED; holding_time_elapsed_hours computed; received_at left null"
          - "recomputes TankProject.nfa_blockers, which now includes 'INVALIDATED_SAMPLE_WITHOUT_RETEST'"
          - "the triggering RECEIVE is then rejected with ERR_HOLDING_TIME_EXCEEDED"
      - from: AT_LAB
        to: RESULTED
        trigger: "POST /soil-samples/{id}/result"
        actor: LabAnalyst
        preconditions:
          - "status == AT_LAB"
          - "X-User-ID == laboratory_id"
          - "tph_mg_kg and benzene_mg_kg present and >= 0"
        side_effects:
          - "status AT_LAB -> RESULTED; reported_at = logical clock; turnaround_hours and turnaround_breach computed"
          - "when the round then has zero pending samples: the SAMPLING -> ASSESSED project transition fires (see TankProject)"
      - from: RESULTED
        to: INVALIDATED
        trigger: "POST /soil-samples/{id}/retract-result"
        actor: LabAnalyst
        preconditions:
          - "status == RESULTED"
          - "X-User-ID == laboratory_id"
          - "TankProject.status IN {SAMPLING, ASSESSED, CLEARED, REMEDIATION_ACTIVE}"
          - "TankProject.status != CLOSED_NFA and != CLOSED_SETTLED"
        side_effects:
          - "status RESULTED -> INVALIDATED; qc_flag = RESULT_RETRACTED"
          - "TankProject reverts to SAMPLING with contamination_class -> UNCLASSIFIED (see TankProject)"
      - from: COLLECTED
        to: VOIDED
        trigger: "POST /soil-samples/{id}/chain-of-custody with event == VOID"
        actor: FieldTechnician
        preconditions:
          - "status IN {COLLECTED, IN_TRANSIT}"
        side_effects:
          - "status -> VOIDED; the sample no longer counts toward round completeness or nfa_blockers"
      - from: IN_TRANSIT
        to: VOIDED
        trigger: "POST /soil-samples/{id}/chain-of-custody with event == VOID"
        actor: FieldTechnician
        preconditions:
          - "status IN {COLLECTED, IN_TRANSIT}"
        side_effects:
          - "status -> VOIDED"

  # ------------------------------------------------- RemediationChangeOrder
  - entity: RemediationChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit"
        actor: LicensedSiteProfessional
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == requested_by_user_id"
          - "TankProject.status == REMEDIATION_ACTIVE"
        side_effects:
          - "status DRAFT -> SUBMITTED"
          - "recomputes TankProject.nfa_blockers, which includes 'OPEN_CHANGE_ORDER' while any DRAFT/SUBMITTED row exists"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/decision with decision == APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "TankProject.status == REMEDIATION_ACTIVE"
          - "when supersedes_change_order_id is present: that row belongs to the same project and has status == APPROVED"
          - "baseline_scope_cubic_yards + sum(additional_cubic_yards over APPROVED rows after applying this approval and any supersession) <= TankProject.excavation_limit_cubic_yards"
        side_effects:
          - "status SUBMITTED -> APPROVED; approved_by_user_id = X-User-ID; decided_at = logical clock; line_amount_cents computed"
          - "when supersedes_change_order_id is present: that row's status APPROVED -> SUPERSEDED and its decided_at -> null"
          - "recomputes TankProject.approved_scope_cubic_yards and remediation_cost_cents"
          - "the remediation_cost_cents change re-runs calculations.insurance_reserve_allocation over every InsuranceNotification of this project with status != CLOSED, and each rewritten notification re-derives its status"
          - "recomputes TankProject.nfa_blockers"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/decision with decision == REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status SUBMITTED -> REJECTED; approved_by_user_id = X-User-ID; decided_at = logical clock"
          - "TankProject.approved_scope_cubic_yards and remediation_cost_cents unchanged"
          - "recomputes TankProject.nfa_blockers, dropping 'OPEN_CHANGE_ORDER' when no DRAFT/SUBMITTED row remains"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, side effect of approving a later change order whose supersedes_change_order_id == this.id"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "status APPROVED -> SUPERSEDED; decided_at -> null; additional_cubic_yards leaves the approved_scope sum"

  # ------------------------------------------------------------ TrustFundClaim
  - entity: TrustFundClaim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /trust-fund-claims/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "TankProject.status IN {ASSESSED, REMEDIATION_ACTIVE, CLEARED, CLOSED_NFA}"
          - "eligible_amount_cents > 0"
          - "when TankProject.contamination_disclosure_required == true: a HomeownerDisclosure on this project with disclosure_kind == CONTAMINATION_FINDINGS and status == ACKNOWLEDGED exists"
        side_effects:
          - "status DRAFT -> SUBMITTED; submitted_at = logical clock"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /trust-fund-claims/{id}/decision with decision == UNDER_REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status SUBMITTED -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /trust-fund-claims/{id}/decision with decision == INFO_REQUESTED"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "info_request_count < MAX_INFO_REQUESTS (2)"
        side_effects:
          - "status UNDER_REVIEW -> INFO_REQUESTED; info_request_count += 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /trust-fund-claims/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == INFO_REQUESTED"
          - "TankProject.status IN {ASSESSED, REMEDIATION_ACTIVE, CLEARED, CLOSED_NFA}"
        side_effects:
          - "status INFO_REQUESTED -> SUBMITTED; submitted_at = logical clock"
        note: "Review cycle: SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED, bounded by MAX_INFO_REQUESTS."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /trust-fund-claims/{id}/decision with decision == APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "eligible_amount_cents > 0"
        side_effects:
          - "status UNDER_REVIEW -> APPROVED; decided_at = logical clock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /trust-fund-claims/{id}/decision with decision == DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "status UNDER_REVIEW -> DENIED; decided_at = logical clock; reimbursed_amount_cents = 0"
      - from: APPROVED
        to: PAID
        trigger: "POST /trust-fund-claims/{id}/decision with decision == PAID"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPROVED"
          - "TankProject.status == CLOSED_NFA"
        side_effects:
          - "status APPROVED -> PAID; paid_at = logical clock; reimbursed_amount_cents = eligible_amount_cents; unreimbursed_balance_cents = 0"
          - "TankProject.status CLOSED_NFA -> CLOSED_SETTLED plus its cascade"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "system, compensating side effect of POST /nfa-letters/{id}/rescind"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the project transition CLOSED_NFA -> REMEDIATION_ACTIVE fired"
        side_effects:
          - "status APPROVED -> UNDER_REVIEW; decided_at -> null; reimbursed_amount_cents -> 0; unreimbursed_balance_cents = eligible_amount_cents; 'NFA_RESCINDED_REVALIDATION_REQUIRED' appended to eligibility_findings"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system, side effect of POST /trust-fund-claims creating a FINAL_SETTLEMENT claim on the same project"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
          - "variant == PRELIMINARY_ESTIMATE"
        side_effects:
          - "status -> WITHDRAWN; 'SUPERSEDED_BY_FINAL_SETTLEMENT' appended to eligibility_findings"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system, side effect of POST /trust-fund-claims creating a FINAL_SETTLEMENT claim on the same project"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
          - "variant == PRELIMINARY_ESTIMATE"
        side_effects:
          - "status -> WITHDRAWN; 'SUPERSEDED_BY_FINAL_SETTLEMENT' appended to eligibility_findings"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system, side effect of POST /trust-fund-claims creating a FINAL_SETTLEMENT claim on the same project"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
          - "variant == PRELIMINARY_ESTIMATE"
        side_effects:
          - "status -> WITHDRAWN; 'SUPERSEDED_BY_FINAL_SETTLEMENT' appended to eligibility_findings"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "system, side effect of POST /trust-fund-claims creating a FINAL_SETTLEMENT claim on the same project"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
          - "variant == PRELIMINARY_ESTIMATE"
        side_effects:
          - "status -> WITHDRAWN; 'SUPERSEDED_BY_FINAL_SETTLEMENT' appended to eligibility_findings"

  # ----------------------------------------------------------------- NFALetter
  - entity: NFALetter
    initial_state: DRAFT
    terminal_states: [RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /nfa-letters/{id}/issue"
        actor: LicensedSiteProfessional
        preconditions:
          - "status == DRAFT"
          - "TankProject.status == CLEARED"
          - "TankProject.nfa_blockers == []"
          - "X-User-ID != drafted_by_user_id"
          - "closing_date >= logical clock"
        side_effects:
          - "status DRAFT -> ISSUED; issued_at = logical clock; issued_by_user_id = X-User-ID"
          - "TankProject.status CLEARED -> CLOSED_NFA"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /nfa-letters/{id}/rescind"
        actor: ComplianceOfficer
        preconditions:
          - "status == ISSUED"
          - "TankProject.status == CLOSED_NFA"
          - "rescission_reason present"
        side_effects:
          - "status ISSUED -> RESCINDED; rescinded_at = logical clock"
          - "TankProject.status CLOSED_NFA -> REMEDIATION_ACTIVE plus the depth-4 cascade documented on TankProject"

  # ------------------------------------------------------ InsuranceNotification
  - entity: InsuranceNotification
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "system, whenever calculations.insurance_reserve_allocation rewrites this row"
        actor: system
        preconditions:
          - "status != CLOSED"
          - "reserve_amount_cents > 0 AND third_party_allocated_cents == 0"
        side_effects:
          - "status -> RESERVED"
      - from: OPEN
        to: THIRD_PARTY_REVIEW
        trigger: "system, whenever calculations.insurance_reserve_allocation rewrites this row"
        actor: system
        preconditions:
          - "status != CLOSED"
          - "third_party_allocated_cents > 0"
        side_effects:
          - "status -> THIRD_PARTY_REVIEW"
      - from: RESERVED
        to: THIRD_PARTY_REVIEW
        trigger: "system, whenever calculations.insurance_reserve_allocation rewrites this row"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "third_party_allocated_cents > 0"
        side_effects:
          - "status RESERVED -> THIRD_PARTY_REVIEW"
      - from: THIRD_PARTY_REVIEW
        to: RESERVED
        trigger: "system, whenever calculations.insurance_reserve_allocation rewrites this row"
        actor: system
        preconditions:
          - "status == THIRD_PARTY_REVIEW"
          - "third_party_allocated_cents == 0 AND reserve_amount_cents > 0"
        side_effects:
          - "status THIRD_PARTY_REVIEW -> RESERVED"
      - from: RESERVED
        to: CLOSED
        trigger: "system, side effect of the TankProject CLOSED_NFA -> CLOSED_SETTLED transition"
        actor: system
        preconditions:
          - "status IN {OPEN, RESERVED, THIRD_PARTY_REVIEW}"
        side_effects:
          - "status -> CLOSED; allocation fields frozen at their current values"
      - from: THIRD_PARTY_REVIEW
        to: CLOSED
        trigger: "system, side effect of the TankProject CLOSED_NFA -> CLOSED_SETTLED transition"
        actor: system
        preconditions:
          - "status IN {OPEN, RESERVED, THIRD_PARTY_REVIEW}"
        side_effects:
          - "status -> CLOSED; allocation fields frozen"
      - from: OPEN
        to: CLOSED
        trigger: "system, side effect of the TankProject CLOSED_NFA -> CLOSED_SETTLED transition"
        actor: system
        preconditions:
          - "status IN {OPEN, RESERVED, THIRD_PARTY_REVIEW}"
        side_effects:
          - "status -> CLOSED; allocation fields frozen"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on TankProject.version only)
# =============================================================================
concurrency_rules:

  - rule_id: change-order-create-stale-project
    parent_entity: TankProject
    write_endpoint: "POST /change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a RemediationChangeOrder against a TankProject whose version has
      advanced past the value the client last observed is rejected. This is the
      CREATE-with-supersede case: a change order that legitimately replaces a
      prior APPROVED change order must be authored against a current view of the
      project's approved scope and cost, so a stale expected_project_version
      means the author's scope arithmetic was derived from superseded data.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: final-claim-create-stale-project
    parent_entity: TankProject
    write_endpoint: "POST /trust-fund-claims"
    occ_field: "expected_project_version"
    description: |
      Creating a TrustFundClaim against a TankProject whose version has advanced
      past the value the client last observed is rejected. A FINAL_SETTLEMENT
      claim legitimately withdraws the project's open PRELIMINARY_ESTIMATE
      claim, so it must be filed against a current project version; a stale
      expected_project_version means the claimed costs were copied from a
      project snapshot that a change-order approval has since replaced.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: decommission_method_recommendation
    trigger: "POST /tank-projects/{id}/sweep-survey (INTAKE -> SURVEYED); writes TankProject.method_score and TankProject.recommended_method"
    algorithm: weighted_scoring
    formula: |
      # Five factors, each independently clamped, then summed, then clamped, then rounded.
      depth_factor     = min(40.0, max(0.0, (tank_depth_to_top_inches - DEPTH_FREE_INCHES) * DEPTH_POINTS_PER_INCH))
      proximity_factor = min(30.0, max(0.0, (FOUNDATION_CONCERN_INCHES - tank_distance_to_foundation_inches) * PROXIMITY_POINTS_PER_INCH))
      structure_factor = UNDER_STRUCTURE_POINTS if tank_under_structure == true else 0.0
      capacity_factor  = 15.0 if tank_capacity_gallons >= 1000
                         else (8.0 if tank_capacity_gallons >= 550 else 0.0)
      material_factor  = 10.0 if tank_material == "STEEL" else 0.0

      raw          = depth_factor + proximity_factor + structure_factor + capacity_factor + material_factor
      method_score = round_half_up(min(100.0, raw), 2)          # clamp BEFORE rounding — pinned order

      recommended_method = "ABANDONMENT_IN_PLACE" if method_score >= ABANDONMENT_SCORE_THRESHOLD
                           else "REMOVAL"
    input_set: "Only the five tank_* fields supplied by the triggering sweep-survey request; no other project or sample data participates."
    constants:
      DEPTH_FREE_INCHES: 24
      DEPTH_POINTS_PER_INCH: 0.5
      FOUNDATION_CONCERN_INCHES: 60
      PROXIMITY_POINTS_PER_INCH: 0.75
      UNDER_STRUCTURE_POINTS: 35.0
      ABANDONMENT_SCORE_THRESHOLD: 55.0
    precision: "method_score: 2 decimal places, round_half_up; clamp to [0.00, 100.00] before rounding"

  - name: contamination_classification
    trigger: "system, on entering TankProject.status == ASSESSED (end of POST /soil-samples/{id}/result); also reset to UNCLASSIFIED on retract-result, on a new sampling round, and on NFA rescission"
    algorithm: threshold
    formula: |
      round_samples = SoilSample rows where tank_project_id == project.id
                        AND sampling_round == project.sampling_round
                        AND status == "RESULTED"          # explicit status filter
      if count(round_samples) == 0:
          max_tph_mg_kg      = null
          max_benzene_mg_kg  = null
          contamination_class = "UNCLASSIFIED"
      else:
          max_tph_mg_kg     = max(s.tph_mg_kg     for s in round_samples)
          max_benzene_mg_kg = max(s.benzene_mg_kg for s in round_samples)
          if   max_tph_mg_kg > TPH_GROSS_MG_KG    or max_benzene_mg_kg > BENZENE_GROSS_MG_KG:
              contamination_class = "GROSS"
          elif max_tph_mg_kg > TPH_ACTION_MG_KG   or max_benzene_mg_kg > BENZENE_ACTION_MG_KG:
              contamination_class = "ELEVATED"
          else:
              contamination_class = "CLEAN"
    input_set: "RESULTED samples of the project's current sampling_round only. INVALIDATED, VOIDED, COLLECTED, IN_TRANSIT and AT_LAB samples are excluded, as are samples from earlier rounds."
    constants:
      TPH_ACTION_MG_KG: 500.0
      TPH_GROSS_MG_KG: 5000.0
      BENZENE_ACTION_MG_KG: 0.5
      BENZENE_GROSS_MG_KG: 5.0
    precision: "Comparisons are strictly greater-than: a sample at exactly 500.0 mg/kg TPH and exactly 0.5 mg/kg benzene classifies CLEAN."

  - name: remediation_soil_volume
    trigger: "system, on the TankProject ASSESSED -> REMEDIATION_ACTIVE transition (PROVISIONAL_GRID) and on the DecommissionWorkOrder billing_status INVOICED -> RECONCILED transition (FINAL_SURVEYED); writes TankProject.remediation_volume_cubic_yards and TankProject.remediation_volume_basis"
    algorithm: aggregation
    formula: |
      # variant PROVISIONAL_GRID
      impacted = SoilSample rows where tank_project_id == project.id
                   AND sampling_round == project.sampling_round
                   AND status == "RESULTED"
                   AND tph_mg_kg > TPH_ACTION_MG_KG
      if count(impacted) == 0:
          volume = 0.00
      else:
          grid_area_sqft = count(impacted) * GRID_CELL_SQFT
          max_depth_ft   = max(s.depth_inches for s in impacted) / 12.0
          volume = round_half_up(grid_area_sqft * max_depth_ft / CUBIC_FEET_PER_CUBIC_YARD, 2)

      # variant FINAL_SURVEYED
      volume = round_half_up(TankProject.hauled_tons / SOIL_DENSITY_TONS_PER_CY, 2)
    input_set: "PROVISIONAL_GRID reads only RESULTED samples of the current round whose tph_mg_kg strictly exceeds 500.0. FINAL_SURVEYED reads only TankProject.hauled_tons as reported at field COMPLETE and ignores all sample data."
    constants:
      GRID_CELL_SQFT: 100.0
      CUBIC_FEET_PER_CUBIC_YARD: 27.0
      SOIL_DENSITY_TONS_PER_CY: 1.35
      TPH_ACTION_MG_KG: 500.0
    precision: "2 decimal places, round_half_up, applied once at the end of each variant"
    variants:
      - name: PROVISIONAL_GRID
        when: "Selected when the project enters REMEDIATION_ACTIVE from ASSESSED — the estimate that drives change-order scoping and the insurance reserve."
        difference: "Derived from sample geometry (impacted grid cells × deepest impacted sample), so it grows with the number of exceeding sample points and is independent of what was actually hauled."
      - name: FINAL_SURVEYED
        when: "Selected when the work order's billing dimension reaches RECONCILED — the surveyed number used for close-out."
        difference: "Derived from weigh-ticket tonnage divided by soil density; for identical project data it differs from PROVISIONAL_GRID because it measures removed mass rather than impacted footprint."

  - name: remediation_cost
    trigger: "system, on TankProject entering REMEDIATION_ACTIVE, on RemediationChangeOrder SUBMITTED -> APPROVED, and on APPROVED -> SUPERSEDED; writes RemediationChangeOrder.line_amount_cents and TankProject.remediation_cost_cents"
    algorithm: aggregation
    formula: |
      # Step 1 — per-line amount, rounded to whole cents BEFORE any summation.
      for each co in RemediationChangeOrder where tank_project_id == project.id
                                              AND status == "APPROVED",
          iterated in created_at ASC order:
          co.line_amount_cents = round_half_up(
              co.additional_cubic_yards * co.unit_rate_cents * DISPOSAL_MULTIPLIER[co.disposal_class]
          )                                        # integer cents

      # Step 2 — sum the already-rounded integer line amounts.
      lines_total_cents = sum(co.line_amount_cents for those co)

      # Step 3 — add mobilization only once remediation has actually started.
      remediation_cost_cents = 0 if project.remediation_started == false
                               else BASE_MOBILIZATION_CENTS + lines_total_cents

      # PINNED ORDER: round-per-line-then-sum. Sum-then-round is WRONG and will
      # differ by whole cents whenever two or more lines carry a .5 remainder.
    input_set: "Only RemediationChangeOrder rows with status == APPROVED on this project. DRAFT, SUBMITTED, REJECTED and SUPERSEDED rows contribute nothing. Iteration order created_at ASC (never id)."
    constants:
      BASE_MOBILIZATION_CENTS: 185000
      DISPOSAL_MULTIPLIER:
        NON_HAZARDOUS: 1.0
        HAZARDOUS: 1.85
    precision: "Each line rounded to integer cents with round_half_up; the sum is exact integer arithmetic thereafter."

  - name: trust_fund_eligible_amount
    trigger: "POST /trust-fund-claims (creation) and any recomputation of the claim; writes TrustFundClaim.deductible_cents, cap_cents, admin_fee_cents, eligible_amount_cents and unreimbursed_balance_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED. cap_cents is keyed on the gross amount and
      # admin_fee_cents is keyed on the capped amount, while eligible_amount_cents
      # is keyed on both — the dependency looks circular but is resolved by
      # executing S1..S6 exactly once, in this order, with no iteration.
      S1: gross_cents      = claimed_costs_cents
      S2: deductible_cents = STATE_DEDUCTIBLE_CENTS[state_code]
      S3: cap_cents        = CAP_TIER_1_CENTS if gross_cents <= TIER_1_MAX_CENTS
                             else CAP_TIER_2_CENTS if gross_cents <= TIER_2_MAX_CENTS
                             else CAP_TIER_3_CENTS
      S4: capped_cents     = min(gross_cents, cap_cents)
      S5: admin_fee_cents  = round_half_up(capped_cents * ADMIN_FEE_RATE)
      S6: variant PRELIMINARY_ESTIMATE:
              net_cents = max(0, capped_cents - deductible_cents) - admin_fee_cents
          variant FINAL_SETTLEMENT:
              net_cents = max(0, min(gross_cents - deductible_cents, cap_cents)) - admin_fee_cents
      S7: eligible_amount_cents      = max(0, net_cents)
      S8: unreimbursed_balance_cents = eligible_amount_cents - reimbursed_amount_cents
    input_set: "Only the claim's own claimed_costs_cents, its snapshotted state_code, and its variant. No project or change-order data enters the formula."
    constants:
      STATE_DEDUCTIBLE_CENTS:
        NJ: 50000
        NY: 100000
        CT: 25000
      TIER_1_MAX_CENTS: 5000000
      TIER_2_MAX_CENTS: 12000000
      CAP_TIER_1_CENTS: 4000000
      CAP_TIER_2_CENTS: 9000000
      CAP_TIER_3_CENTS: 12500000
      ADMIN_FEE_RATE: 0.035
      MAX_INFO_REQUESTS: 2
    precision: "admin_fee_cents rounded to integer cents with round_half_up at S5; all later steps are exact integer arithmetic"
    variants:
      - name: PRELIMINARY_ESTIMATE
        when: "variant == PRELIMINARY_ESTIMATE — the interim application filed while remediation is still open."
        difference: "The cap is applied to the gross amount FIRST and the deductible is subtracted from the already-capped figure, so a claim above the cap absorbs the deductible out of the reimbursable ceiling."
      - name: FINAL_SETTLEMENT
        when: "variant == FINAL_SETTLEMENT — the close-out application; creating one withdraws the project's open PRELIMINARY_ESTIMATE claim."
        difference: "The deductible is subtracted from the gross amount FIRST and the cap is applied to the net, so for identical claimed_costs_cents above the cap the eligible amount is exactly one deductible higher than under PRELIMINARY_ESTIMATE."

  - name: insurance_reserve_allocation
    trigger: "system, whenever TankProject.remediation_cost_cents is recomputed (project entering REMEDIATION_ACTIVE, change-order APPROVED, change-order SUPERSEDED, NFA rescission) and on POST /insurance-notifications; writes first_party_allocated_cents, third_party_allocated_cents, homeowner_out_of_pocket_cents and reserve_amount_cents on every InsuranceNotification of the project whose status != CLOSED"
    algorithm: waterfall_allocation
    formula: |
      target_cents = TankProject.remediation_cost_cents

      # Bucket 1 — first-party property coverage.
      cap1 = Property.first_party_coverage_limit_cents
      first_party_allocated_cents = min(target_cents, cap1)

      # Bucket 2 — third-party liability sublimit. Capacity is zero unless the
      # project has tendered liability: an InsuranceNotification with
      # notification_kind == THIRD_PARTY_LIABILITY and status IN
      # {OPEN, RESERVED, THIRD_PARTY_REVIEW} must exist on the project.
      cap2 = Property.third_party_sublimit_cents if such a notification exists else 0
      third_party_allocated_cents = min(target_cents - first_party_allocated_cents, cap2)

      # Bucket 3 — homeowner absorbs the remainder; unbounded.
      homeowner_out_of_pocket_cents = target_cents
                                      - first_party_allocated_cents
                                      - third_party_allocated_cents

      reserve_amount_cents = first_party_allocated_cents + third_party_allocated_cents

      # CONSERVATION INVARIANT (integer cents, exact):
      #   first_party_allocated_cents + third_party_allocated_cents
      #     + homeowner_out_of_pocket_cents == TankProject.remediation_cost_cents
      # Every non-CLOSED notification of the project carries the same triple.
    input_set: "TankProject.remediation_cost_cents plus the two limit fields on the project's Property, plus the existence test over the project's THIRD_PARTY_LIABILITY notifications with status IN {OPEN, RESERVED, THIRD_PARTY_REVIEW}. Buckets are filled in the fixed order first-party, third-party, homeowner — never by created_at or id."
    constants:
      BUCKET_ORDER: ["FIRST_PARTY", "THIRD_PARTY_LIABILITY", "HOMEOWNER"]
    precision: "Pure integer cents; no rounding, so the conservation invariant holds exactly with zero drift"

  - name: nfa_blocker_set
    trigger: "system, recomputed on every mutation of TankProject, SoilSample, HomeownerDisclosure, Permit and RemediationChangeOrder belonging to the project; writes TankProject.nfa_blockers and is read by POST /nfa-letters/{id}/issue"
    algorithm: aggregation
    formula: |
      blockers = []
      if project.contamination_class != "CLEAN":
          blockers += ["CONTAMINATION_NOT_CLEARED"]
      if count(SoilSample where tank_project_id == project.id
               AND sampling_round == project.sampling_round
               AND status IN {"COLLECTED", "IN_TRANSIT", "AT_LAB"}) > 0:
          blockers += ["SAMPLES_PENDING"]
      if count(SoilSample s where s.tank_project_id == project.id
               AND s.sampling_round == project.sampling_round
               AND s.status == "INVALIDATED"
               AND count(SoilSample r where r.retest_of_sample_id == s.id
                         AND r.status == "RESULTED") == 0) > 0:
          blockers += ["INVALIDATED_SAMPLE_WITHOUT_RETEST"]
      if count(RemediationChangeOrder where tank_project_id == project.id
               AND status IN {"DRAFT", "SUBMITTED"}) > 0:
          blockers += ["OPEN_CHANGE_ORDER"]
      if project.contamination_disclosure_required == true
         AND count(HomeownerDisclosure where tank_project_id == project.id
                   AND disclosure_kind == "CONTAMINATION_FINDINGS"
                   AND status == "ACKNOWLEDGED") == 0:
          blockers += ["CONTAMINATION_DISCLOSURE_NOT_ACKNOWLEDGED"]
      if count(Permit where tank_project_id == project.id
               AND permit_type == "MUNICIPAL_DECOMMISSION"
               AND status IN {"REVOKED", "EXPIRED"}) > 0:
          blockers += ["PERMIT_REVOKED"]
      if count(DecommissionWorkOrder where tank_project_id == project.id
               AND field_status == "FIELD_COMPLETE") == 0:
          blockers += ["FIELD_WORK_INCOMPLETE"]
      nfa_blockers = sort_ascending_lexicographic(blockers)
    input_set: "All five child collections of the project, each with the explicit status filter shown above. Sample-based clauses are scoped to the project's current sampling_round only. Ordering is lexicographic ascending over the blocker codes — never created_at or id."
    constants:
      BLOCKER_CODES: ["CONTAMINATION_DISCLOSURE_NOT_ACKNOWLEDGED", "CONTAMINATION_NOT_CLEARED", "FIELD_WORK_INCOMPLETE", "INVALIDATED_SAMPLE_WITHOUT_RETEST", "OPEN_CHANGE_ORDER", "PERMIT_REVOKED", "SAMPLES_PENDING"]
    precision: "Exact set membership; the list is deduplicated and sorted lexicographically ascending"

  - name: laboratory_timing
    trigger: "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE (holding time) and POST /soil-samples/{id}/result (turnaround); writes SoilSample.holding_time_elapsed_hours, turnaround_hours and turnaround_breach"
    algorithm: threshold
    formula: |
      holding_time_elapsed_hours = round_half_up(
          (logical_clock_at_receive - collected_at).total_seconds() / 3600.0, 2)
      # STRICT comparison: elapsed exactly equal to holding_time_hours is COMPLIANT.
      holding_time_exceeded = holding_time_elapsed_hours > Laboratory.holding_time_hours

      turnaround_hours = round_half_up(
          (reported_at - received_at).total_seconds() / 3600.0, 2)
      # STRICT comparison: turnaround exactly equal to the commitment is NOT a breach.
      turnaround_breach = turnaround_hours > Laboratory.committed_turnaround_hours
    input_set: "The sample's own collected_at / received_at / reported_at timestamps and the two threshold fields on its Laboratory. No other sample participates."
    constants:
      SECONDS_PER_HOUR: 3600.0
    precision: "Both elapsed figures rounded to 2 decimal places with round_half_up before the threshold comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: "for entity_backed roles, X-User-ID matches the resource's owning id: Homeowner's X-User-ID == TankProject.property_id of the addressed disclosure/project; LabAnalyst's X-User-ID == SoilSample.laboratory_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /disclosures/{id}/respond, GET /disclosures, GET /disclosures/{id}, GET /properties/{id}, GET /tank-projects/{id}, GET /nfa-letters/{id}, POST /soil-samples/{id}/chain-of-custody, POST /soil-samples/{id}/result, POST /soil-samples/{id}/retract-result"

  - priority: 30
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: ERR_TANK_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the entity-specific 404 code from §1.6 is used"

  - priority: 32
    category: existence
    check: "every foreign key supplied in the request body resolves: property_id, tank_project_id, crew_id, laboratory_id, work_order_id, retest_of_sample_id, supersedes_change_order_id"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "POST /tank-projects, POST /disclosures, POST /permits, POST /work-orders, POST /soil-samples, POST /change-orders, POST /trust-fund-claims, POST /nfa-letters, POST /insurance-notifications"

  - priority: 35
    category: business_constraint
    check: "request body shape: all required fields present, enum members valid, numeric ranges honoured, scheduled_end_at > scheduled_start_at, and the five tank_* fields present when tanks_detected_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 36
    category: business_constraint
    check: "limit within [1, 100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 38
    category: business_constraint
    check: "expected_project_version equals the addressed TankProject's current version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /change-orders, POST /trust-fund-claims"

  - priority: 40
    category: state
    check: "the target resource and its project are in a state from which this operation is declared in §1.2"
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 409
    applies_to: "all action endpoints; the entity-specific state code from §1.6 is used for non-project targets"

  - priority: 45
    category: business_safety
    check: "segregation of duties: the LicensedSiteProfessional issuing an NFA letter (X-User-ID) must differ from NFALetter.drafted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nfa-letters/{id}/issue"

  - priority: 50
    category: business_safety
    check: "a FIRE_MARSHAL_NOTIFICATION Permit on the project has status == ISSUED and notice_effective_at <= logical clock"
    error_id: ERR_FIRE_MARSHAL_NOTICE_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /work-orders/{id}/field-events with event == MOBILIZE"

  - priority: 51
    category: business_safety
    check: "the project's MUNICIPAL_DECOMMISSION Permit has status == ISSUED (ERR_PERMIT_NOT_ISSUED) and logical clock <= its expires_at (ERR_PERMIT_EXPIRED, after flipping the permit to EXPIRED)"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /work-orders/{id}/field-events with event == MOBILIZE"

  - priority: 52
    category: business_safety
    check: "tanks_detected_count >= 1 on the sweep survey"
    error_id: ERR_NO_TANK_LOCATED
    http_status: 409
    applies_to: "POST /tank-projects/{id}/sweep-survey"

  - priority: 53
    category: business_safety
    check: "the addressed disclosure has not passed expires_at (the row is flipped to EXPIRED first)"
    error_id: ERR_DISCLOSURE_EXPIRED
    http_status: 409
    applies_to: "POST /disclosures/{id}/respond"

  - priority: 54
    category: business_safety
    check: "Laboratory.accredited == true for the sample's lab"
    error_id: ERR_LAB_NOT_ACCREDITED
    http_status: 409
    applies_to: "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"

  - priority: 55
    category: business_safety
    check: "when TankProject.contamination_disclosure_required == true, a CONTAMINATION_FINDINGS disclosure on the project has status == ACKNOWLEDGED"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /trust-fund-claims/{id}/submit"

  - priority: 56
    category: business_safety
    check: "TankProject.nfa_blockers is empty"
    error_id: ERR_NFA_BLOCKED
    http_status: 409
    applies_to: "POST /nfa-letters/{id}/issue"

  - priority: 60
    category: business_referential
    check: "supersedes_change_order_id, when supplied, names a RemediationChangeOrder on the same tank_project_id whose status == APPROVED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 409
    applies_to: "POST /change-orders, POST /change-orders/{id}/decision"

  - priority: 61
    category: business_referential
    check: "retest_of_sample_id, when supplied, names a SoilSample on the same tank_project_id whose status == INVALIDATED"
    error_id: ERR_RETEST_TARGET_INVALID
    http_status: 409
    applies_to: "POST /soil-samples"

  - priority: 62
    category: business_referential
    check: "method_override_reason is present whenever method != TankProject.recommended_method"
    error_id: ERR_METHOD_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders"

  - priority: 65
    category: business_temporal
    check: "the requested crew booking does not collide with any existing booking of the same crew: reject when (new_start - buffer) < existing_end AND existing_start < (new_end + buffer), over DecommissionWorkOrder rows with the same crew_id and field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}; buffer = Crew.mobilization_buffer_minutes applied symmetrically; raw intervals are half-open [start, end)"
    error_id: ERR_CREW_BOOKING_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders"

  - priority: 66
    category: business_temporal
    check: "the lab's aggregate analysis capacity is free: count of SoilSample rows with the same laboratory_id, status == AT_LAB and received_at <= now <= received_at + Laboratory.committed_turnaround_hours (CLOSED interval, both endpoints inclusive) must be < Laboratory.max_concurrent_analyses"
    error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"

  - priority: 67
    category: business_temporal
    check: "holding time from collected_at to now must not strictly exceed Laboratory.holding_time_hours (the sample is flipped to INVALIDATED first)"
    error_id: ERR_HOLDING_TIME_EXCEEDED
    http_status: 409
    applies_to: "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"

  - priority: 68
    category: business_temporal
    check: "NFALetter.closing_date >= logical clock at issuance"
    error_id: ERR_CLOSING_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /nfa-letters/{id}/issue"

  - priority: 70
    category: business_fiscal
    check: "baseline_scope_cubic_yards + sum(additional_cubic_yards over APPROVED rows, after applying this approval and any supersession) <= TankProject.excavation_limit_cubic_yards"
    error_id: ERR_EXCAVATION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /change-orders/{id}/decision with decision == APPROVED"

  - priority: 71
    category: business_fiscal
    check: "TrustFundClaim.eligible_amount_cents > 0"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /trust-fund-claims/{id}/submit, POST /trust-fund-claims/{id}/decision with decision == APPROVED"

  - priority: 75
    category: business_constraint
    check: "at most one HomeownerDisclosure with status == PENDING per (tank_project_id, disclosure_kind)"
    error_id: ERR_DUPLICATE_DISCLOSURE
    http_status: 409
    applies_to: "POST /disclosures"

  - priority: 76
    category: business_constraint
    check: "at most one DecommissionWorkOrder per project with field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
    error_id: ERR_WORK_ORDER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /work-orders"

  - priority: 77
    category: business_constraint
    check: "at most one TrustFundClaim per project with variant == FINAL_SETTLEMENT and status NOT IN {DENIED, WITHDRAWN}"
    error_id: ERR_DUPLICATE_FINAL_CLAIM
    http_status: 409
    applies_to: "POST /trust-fund-claims"

  - priority: 78
    category: business_constraint
    check: "info_request_count < MAX_INFO_REQUESTS (2)"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /trust-fund-claims/{id}/decision with decision == INFO_REQUESTED"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ Property
  - method: POST
    path: "/properties"
    description: "Register a residential tank site."
    roles: [ProjectCoordinator]
    code: 201
    input: [street_address, state_code, county_code, homeowner_name, homeowner_email, insurance_carrier_code, "first_party_coverage_limit_cents?", "third_party_sublimit_cents?"]
    output: Property
    side_effects:
      - "sets trust_fund_deductible_cents = STATE_DEDUCTIBLE_CENTS[state_code]"
      - "open_project_count = 0"

  - method: GET
    path: "/properties/{id}"
    description: "Read one property."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, LicensedSiteProfessional, ComplianceOfficer, Homeowner]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --------------------------------------------------------------- TankProject
  - method: POST
    path: "/tank-projects"
    description: "Open a decommissioning project on a property."
    roles: [ProjectCoordinator]
    code: 201
    input: [property_id, "baseline_scope_cubic_yards?", "excavation_limit_cubic_yards?"]
    output: TankProject
    side_effects:
      - "status = INTAKE; sampling_round = 0; contamination_class = UNCLASSIFIED"
      - "approved_scope_cubic_yards = baseline_scope_cubic_yards; remediation_cost_cents = 0"
      - "recomputes nfa_blockers (contains FIELD_WORK_INCOMPLETE and CONTAMINATION_NOT_CLEARED)"
      - "increments Property.open_project_count by 1"

  - method: GET
    path: "/tank-projects"
    description: "List projects, optionally filtered by property or status."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: TankProject[]
    side_effects: []

  - method: GET
    path: "/tank-projects/{id}"
    description: "Read one project, including all computed fields and its current version."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, LicensedSiteProfessional, ComplianceOfficer, Homeowner]
    code: 200
    input: []
    output: TankProject
    side_effects: []

  - method: GET
    path: "/tank-projects/{id}/summary"
    description: "Computed read: posture snapshot used by the coordinator dashboard."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: "{ status: string, contamination_class: string, approved_scope_cubic_yards: number, remediation_volume_cubic_yards: number, remediation_volume_basis: string, remediation_cost_cents: integer, nfa_blockers: string[], open_change_order_count: integer, current_round_sample_count: integer, version: integer }"
    side_effects: []

  - method: POST
    path: "/tank-projects/{id}/sweep-survey"
    description: "Record the tank-locating sweep survey and derive the removal-vs-abandonment recommendation."
    roles: [ProjectCoordinator, FieldTechnician]
    code: 200
    input: [survey_method, tanks_detected_count, "tank_capacity_gallons?", "tank_depth_to_top_inches?", "tank_distance_to_foundation_inches?", "tank_under_structure?", "tank_material?"]
    output: TankProject
    side_effects:
      - "status INTAKE -> SURVEYED; survey_completed_at = logical clock"
      - "computes method_score and recommended_method (calculations.decommission_method_recommendation)"
      - "increments TankProject.version by 1"

  # -------------------------------------------------------- HomeownerDisclosure
  - method: POST
    path: "/disclosures"
    description: "Send a homeowner disclosure notice for sweep findings or contamination findings."
    roles: [ProjectCoordinator]
    code: 201
    input: [tank_project_id, disclosure_kind]
    output: HomeownerDisclosure
    side_effects:
      - "status = PENDING; sent_at = logical clock; expires_at = sent_at + 72h"

  - method: GET
    path: "/disclosures"
    description: "List disclosures, optionally filtered by project, kind or status."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer, Homeowner]
    code: 200
    input: ["tank_project_id?", "disclosure_kind?", "status?", "limit?", "offset?"]
    output: HomeownerDisclosure[]
    side_effects: []

  - method: GET
    path: "/disclosures/{id}"
    description: "Read one disclosure."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer, Homeowner]
    code: 200
    input: []
    output: HomeownerDisclosure
    side_effects: []

  - method: POST
    path: "/disclosures/{id}/respond"
    description: "Homeowner acknowledges or declines a disclosure notice."
    roles: [Homeowner]
    code: 200
    input: [response, response_channel]
    output: HomeownerDisclosure
    side_effects:
      - "flips PENDING -> EXPIRED and rejects when logical clock > expires_at"
      - "ACKNOWLEDGED on a SWEEP_FINDINGS notice advances the project SURVEYED -> DISCLOSED"
      - "DECLINED on a SWEEP_FINDINGS notice voids the project and revokes its SUBMITTED/ISSUED permits"
      - "recomputes TankProject.nfa_blockers"

  # -------------------------------------------------------------------- Permit
  - method: POST
    path: "/permits"
    description: "File a municipal decommissioning permit application or the statutory fire-marshal notification."
    roles: [ProjectCoordinator]
    code: 201
    input: [tank_project_id, permit_type]
    output: Permit
    side_effects:
      - "status = SUBMITTED; submitted_at = logical clock"

  - method: GET
    path: "/permits"
    description: "List permits, optionally filtered by project, type or status."
    roles: [ProjectCoordinator, FieldTechnician, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: GET
    path: "/permits/{id}"
    description: "Read one permit."
    roles: [ProjectCoordinator, FieldTechnician, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/permits/{id}/decision"
    description: "Authority issues, denies or revokes the permit; the three branches carry disjoint side-effect sets."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "denial_reason?", "revocation_reason?"]
    output: Permit
    side_effects:
      - "ISSUED: sets issued_at, expires_at = issued_at + 180 days, notice_effective_at (+48h for FIRE_MARSHAL_NOTIFICATION); MUNICIPAL_DECOMMISSION additionally advances the project DISCLOSED -> PERMITTED"
      - "DENIED: stores denial_reason; no project transition"
      - "REVOKED: aborts every non-terminal work order on the project and writes off its billing dimension; adds PERMIT_REVOKED to nfa_blockers"

  # ---------------------------------------------------------------------- Crew
  - method: POST
    path: "/crews"
    description: "Register an excavation crew and its symmetric mobilization buffer."
    roles: [ProjectCoordinator]
    code: 201
    input: [crew_name, cert_level, "mobilization_buffer_minutes?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Read one crew."
    roles: [ProjectCoordinator, FieldTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --------------------------------------------------- DecommissionWorkOrder
  - method: POST
    path: "/work-orders"
    description: "Schedule the decommissioning field work; occupies the crew's calendar interval."
    roles: [ProjectCoordinator]
    code: 201
    input: [tank_project_id, crew_id, method, scheduled_start_at, scheduled_end_at, "method_override_reason?"]
    output: DecommissionWorkOrder
    side_effects:
      - "field_status = SCHEDULED; billing_status = UNBILLED"
      - "runs the buffered crew-overlap check (validations priority 65)"
      - "runs the one-open-work-order-per-project check (validations priority 76)"

  - method: GET
    path: "/work-orders"
    description: "List work orders, optionally filtered by project, crew or either state dimension."
    roles: [ProjectCoordinator, FieldTechnician, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "crew_id?", "field_status?", "billing_status?", "limit?", "offset?"]
    output: DecommissionWorkOrder[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}"
    description: "Read one work order, including both state dimensions."
    roles: [ProjectCoordinator, FieldTechnician, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: DecommissionWorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/field-events"
    description: "Advance the field dimension: MOBILIZE, START, COMPLETE or ABORT."
    roles: [FieldTechnician]
    code: 200
    input: [event, "actual_excavated_cubic_yards?", "hauled_tons?", "abort_reason?"]
    output: DecommissionWorkOrder
    side_effects:
      - "MOBILIZE: checks the fire-marshal notice effectiveness and municipal permit validity, flipping an over-age permit to EXPIRED before rejecting"
      - "START: advances the project PERMITTED -> DECOMMISSIONING and copies method onto TankProject.decommission_method"
      - "COMPLETE: advances billing_status UNBILLED -> BILLABLE, copies actual_excavated_cubic_yards and hauled_tons to the project, sets sampling_round 0 -> 1 and advances the project DECOMMISSIONING -> SAMPLING"
      - "ABORT: writes off the billing dimension and releases the crew booking"

  - method: POST
    path: "/work-orders/{id}/billing-events"
    description: "Advance the billing dimension independently of field progress: INVOICE, RECONCILE or WRITE_OFF."
    roles: [ProjectCoordinator]
    code: 200
    input: [event]
    output: DecommissionWorkOrder
    side_effects:
      - "RECONCILE: recomputes TankProject.remediation_volume_cubic_yards under the FINAL_SURVEYED variant and sets remediation_volume_basis = FINAL_SURVEYED"

  # ----------------------------------------------------------------- Laboratory
  - method: POST
    path: "/laboratories"
    description: "Register an analytical laboratory with its accreditation, turnaround commitment, holding time and concurrent-analysis capacity."
    roles: [ComplianceOfficer]
    code: 201
    input: [lab_name, "accredited?", "committed_turnaround_hours?", "holding_time_hours?", "max_concurrent_analyses?"]
    output: Laboratory
    side_effects: []

  - method: GET
    path: "/laboratories/{id}"
    description: "Read one laboratory."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Laboratory
    side_effects: []

  # ----------------------------------------------------------------- SoilSample
  - method: POST
    path: "/soil-samples"
    description: "Log a collected soil aliquot; the first sample created while the project is REMEDIATION_ACTIVE opens a new confirmation round."
    roles: [FieldTechnician]
    code: 201
    input: [tank_project_id, work_order_id, laboratory_id, sample_point, depth_inches, "retest_of_sample_id?"]
    output: SoilSample
    side_effects:
      - "status = COLLECTED; collected_at = logical clock; collected_by_user_id = X-User-ID"
      - "sampling_round = TankProject.sampling_round, after incrementing it when the project transitions REMEDIATION_ACTIVE -> SAMPLING"
      - "recomputes TankProject.nfa_blockers (adds SAMPLES_PENDING)"

  - method: GET
    path: "/soil-samples"
    description: "List samples, optionally filtered by project, work order, lab, retest parent, round or status."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "work_order_id?", "laboratory_id?", "retest_of_sample_id?", "sampling_round?", "status?", "limit?", "offset?"]
    output: SoilSample[]
    side_effects: []

  - method: GET
    path: "/soil-samples/{id}"
    description: "Read one sample with its chain-of-custody timestamps and timing metrics."
    roles: [ProjectCoordinator, FieldTechnician, LabAnalyst, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: SoilSample
    side_effects: []

  - method: POST
    path: "/soil-samples/{id}/chain-of-custody"
    description: "Record a custody event: DISPATCH (technician), RECEIVE (lab), or VOID (technician)."
    roles: [FieldTechnician, LabAnalyst]
    code: 200
    input: [event]
    output: SoilSample
    side_effects:
      - "DISPATCH: COLLECTED -> IN_TRANSIT; dispatched_at = logical clock"
      - "RECEIVE: computes holding_time_elapsed_hours; flips the sample to INVALIDATED with qc_flag = HOLDING_TIME_EXCEEDED and rejects when the holding time is strictly exceeded; otherwise runs the closed-interval lab capacity check and sets IN_TRANSIT -> AT_LAB with received_at = logical clock"
      - "VOID: -> VOIDED; the sample stops counting toward round completeness and nfa_blockers"

  - method: POST
    path: "/soil-samples/{id}/result"
    description: "Laboratory posts the analytical result; may complete the sampling round and cascade through classification, remediation volume, cost and insurance allocation."
    roles: [LabAnalyst]
    code: 200
    input: [tph_mg_kg, benzene_mg_kg]
    output: SoilSample
    side_effects:
      - "AT_LAB -> RESULTED; reported_at = logical clock; turnaround_hours and turnaround_breach computed"
      - "when the round has no pending samples left: project SAMPLING -> ASSESSED with contamination_class recomputed, then ASSESSED -> CLEARED or ASSESSED -> REMEDIATION_ACTIVE"
      - "on REMEDIATION_ACTIVE: PROVISIONAL_GRID volume, remediation_cost_cents, then the insurance allocation and notification-status rewrite"

  - method: POST
    path: "/soil-samples/{id}/retract-result"
    description: "Laboratory retracts a posted result; the project reverts to SAMPLING and its classification is cleared."
    roles: [LabAnalyst]
    code: 200
    input: [reason]
    output: SoilSample
    side_effects:
      - "RESULTED -> INVALIDATED; qc_flag = RESULT_RETRACTED"
      - "project reverts to SAMPLING; contamination_class -> UNCLASSIFIED; max_tph_mg_kg and max_benzene_mg_kg -> null"
      - "recomputes TankProject.nfa_blockers (adds INVALIDATED_SAMPLE_WITHOUT_RETEST and CONTAMINATION_NOT_CLEARED)"

  # ---------------------------------------------------- RemediationChangeOrder
  - method: POST
    path: "/change-orders"
    description: "Draft a remediation scope change order against a current view of the project."
    roles: [LicensedSiteProfessional]
    code: 201
    input: [tank_project_id, additional_cubic_yards, unit_rate_cents, disposal_class, expected_project_version, "supersedes_change_order_id?"]
    output: RemediationChangeOrder
    side_effects:
      - "rejects with ERR_STALE_PROJECT_VERSION (412) when expected_project_version != TankProject.version"
      - "status = DRAFT; requested_by_user_id = X-User-ID"
      - "increments TankProject.version by 1"
      - "recomputes TankProject.nfa_blockers (adds OPEN_CHANGE_ORDER)"

  - method: GET
    path: "/change-orders"
    description: "List change orders, optionally filtered by project, supersession parent or status."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "supersedes_change_order_id?", "status?", "limit?", "offset?"]
    output: RemediationChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders/{id}"
    description: "Read one change order."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: RemediationChangeOrder
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Author submits their draft change order for compliance decision."
    roles: [LicensedSiteProfessional]
    code: 200
    input: []
    output: RemediationChangeOrder
    side_effects:
      - "DRAFT -> SUBMITTED"

  - method: POST
    path: "/change-orders/{id}/decision"
    description: "Compliance approves or rejects the change order; approval enforces the excavation limit and supersedes the named prior order."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: RemediationChangeOrder
    side_effects:
      - "APPROVED: line_amount_cents computed; the superseded row flips APPROVED -> SUPERSEDED; approved_scope_cubic_yards and remediation_cost_cents recomputed; the insurance allocation and notification statuses rewritten; nfa_blockers recomputed"
      - "REJECTED: no scope or cost change; nfa_blockers recomputed"

  # ---------------------------------------------------------- TrustFundClaim
  - method: POST
    path: "/trust-fund-claims"
    description: "File a state trust-fund reimbursement claim against a current view of the project."
    roles: [ComplianceOfficer]
    code: 201
    input: [tank_project_id, variant, claimed_costs_cents, expected_project_version]
    output: TrustFundClaim
    side_effects:
      - "rejects with ERR_STALE_PROJECT_VERSION (412) when expected_project_version != TankProject.version"
      - "status = DRAFT; state_code snapshotted from the project's Property"
      - "computes deductible_cents, cap_cents, admin_fee_cents, eligible_amount_cents and unreimbursed_balance_cents under the requested variant"
      - "variant == FINAL_SETTLEMENT additionally withdraws every PRELIMINARY_ESTIMATE claim on the project whose status IN {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
      - "increments TankProject.version by 1"

  - method: GET
    path: "/trust-fund-claims"
    description: "List trust-fund claims, optionally filtered by project, variant or status."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "variant?", "status?", "limit?", "offset?"]
    output: TrustFundClaim[]
    side_effects: []

  - method: GET
    path: "/trust-fund-claims/{id}"
    description: "Read one trust-fund claim with its full eligibility breakdown."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: TrustFundClaim
    side_effects: []

  - method: POST
    path: "/trust-fund-claims/{id}/submit"
    description: "Submit a DRAFT or INFO_REQUESTED claim to the trust fund."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TrustFundClaim
    side_effects:
      - "DRAFT -> SUBMITTED or INFO_REQUESTED -> SUBMITTED; submitted_at = logical clock"

  - method: POST
    path: "/trust-fund-claims/{id}/decision"
    description: "Record a review decision: UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED or PAID."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: TrustFundClaim
    side_effects:
      - "INFO_REQUESTED: info_request_count += 1, capped at 2"
      - "PAID: reimbursed_amount_cents = eligible_amount_cents; unreimbursed_balance_cents = 0; project CLOSED_NFA -> CLOSED_SETTLED; every non-CLOSED InsuranceNotification -> CLOSED; Property.open_project_count decremented"

  # -------------------------------------------------------------------- NFALetter
  - method: POST
    path: "/nfa-letters"
    description: "Draft a no-further-action letter for a real-estate closing."
    roles: [LicensedSiteProfessional]
    code: 201
    input: [tank_project_id, closing_date]
    output: NFALetter
    side_effects:
      - "status = DRAFT; drafted_by_user_id = X-User-ID"

  - method: GET
    path: "/nfa-letters"
    description: "List NFA letters, optionally filtered by project or status."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "status?", "limit?", "offset?"]
    output: NFALetter[]
    side_effects: []

  - method: GET
    path: "/nfa-letters/{id}"
    description: "Read one NFA letter."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer, Homeowner]
    code: 200
    input: []
    output: NFALetter
    side_effects: []

  - method: POST
    path: "/nfa-letters/{id}/issue"
    description: "A second licensed site professional signs and issues the letter, closing the project out."
    roles: [LicensedSiteProfessional]
    code: 200
    input: []
    output: NFALetter
    side_effects:
      - "DRAFT -> ISSUED; issued_at = logical clock; issued_by_user_id = X-User-ID"
      - "project CLEARED -> CLOSED_NFA"

  - method: POST
    path: "/nfa-letters/{id}/rescind"
    description: "Compliance pulls back an issued letter, reopening remediation and revalidating the trust-fund claim."
    roles: [ComplianceOfficer]
    code: 200
    input: [rescission_reason]
    output: NFALetter
    side_effects:
      - "ISSUED -> RESCINDED; rescinded_at = logical clock"
      - "project CLOSED_NFA -> REMEDIATION_ACTIVE with contamination_class -> UNCLASSIFIED and remediation_volume_* -> null"
      - "every APPROVED TrustFundClaim on the project reverts to UNDER_REVIEW with reimbursed_amount_cents -> 0, decided_at -> null and NFA_RESCINDED_REVALIDATION_REQUIRED appended to eligibility_findings"
      - "remediation_cost_cents recomputed, then the insurance allocation and notification statuses rewritten"

  # ----------------------------------------------------- InsuranceNotification
  - method: POST
    path: "/insurance-notifications"
    description: "Notify the carrier of a first-party claim or tender a third-party liability exposure."
    roles: [ComplianceOfficer]
    code: 201
    input: [tank_project_id, notification_kind]
    output: InsuranceNotification
    side_effects:
      - "status = OPEN; carrier_code snapshotted from the project's Property; notified_at = logical clock"
      - "runs calculations.insurance_reserve_allocation over the project's non-CLOSED notifications and re-derives each status"

  - method: GET
    path: "/insurance-notifications"
    description: "List insurance notifications, optionally filtered by project, kind or status."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: ["tank_project_id?", "notification_kind?", "status?", "limit?", "offset?"]
    output: InsuranceNotification[]
    side_effects: []

  - method: GET
    path: "/insurance-notifications/{id}"
    description: "Read one insurance notification with its waterfall allocation."
    roles: [ProjectCoordinator, LicensedSiteProfessional, ComplianceOfficer]
    code: 200
    input: []
    output: InsuranceNotification
    side_effects: []

  # ---------------------------------------------------------------- test clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every timestamp the server stamps (sent_at, issued_at, collected_at, received_at, reported_at, notified_at, ...) and every deadline comparison (expires_at, notice_effective_at, holding time, turnaround, closing_date) reads this clock."
    roles: [ComplianceOfficer, ProjectCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock; performs no entity mutation and fires no cascade"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (Homeowner X-User-ID != project's property_id; LabAnalyst X-User-ID != sample's laboratory_id)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the LicensedSiteProfessional issuing an NFA letter is the same user who drafted it"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in path or body does not resolve"
  - id: ERR_TANK_PROJECT_NOT_FOUND
    http: 404
    condition: "tank_project_id in path or body does not resolve"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosure id in path does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id in path does not resolve"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew_id in path or body does not resolve"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work order id in path or work_order_id in body does not resolve"
  - id: ERR_LABORATORY_NOT_FOUND
    http: 404
    condition: "laboratory id in path or laboratory_id in body does not resolve"
  - id: ERR_SOIL_SAMPLE_NOT_FOUND
    http: 404
    condition: "sample id in path or retest_of_sample_id in body does not resolve"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "change order id in path or supersedes_change_order_id in body does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "trust-fund claim id in path does not resolve"
  - id: ERR_NFA_LETTER_NOT_FOUND
    http: 404
    condition: "NFA letter id in path does not resolve"
  - id: ERR_INSURANCE_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "insurance notification id in path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required body field, invalid enum member, out-of-range number, scheduled_end_at <= scheduled_start_at, or tank_* fields absent while tanks_detected_count >= 1"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset < 0"
  - id: ERR_METHOD_OVERRIDE_REASON_REQUIRED
    http: 422
    condition: "work-order method differs from TankProject.recommended_method and method_override_reason is absent"
  - id: ERR_CLOSING_DATE_IN_PAST
    http: 422
    condition: "NFA letter issuance attempted when closing_date < logical clock"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the addressed TankProject's current version"
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: "TankProject is not in a state from which the requested operation is declared"
  - id: ERR_DISCLOSURE_STATE_INVALID
    http: 409
    condition: "disclosure is not PENDING when a response is submitted"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "permit decision requested from a state that does not allow it (e.g. ISSUED asked for again, or REVOKED requested on a SUBMITTED permit)"
  - id: ERR_WORK_ORDER_STATE_INVALID
    http: 409
    condition: "field or billing event requested from a state that does not allow it"
  - id: ERR_SAMPLE_STATE_INVALID
    http: 409
    condition: "custody, result or retraction requested from a sample state that does not allow it"
  - id: ERR_CHANGE_ORDER_STATE_INVALID
    http: 409
    condition: "submit or decision requested from a change-order state that does not allow it"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "submit or decision requested from a claim state that does not allow it"
  - id: ERR_NFA_STATE_INVALID
    http: 409
    condition: "issue or rescind requested from an NFA-letter state that does not allow it"
  - id: ERR_NO_TANK_LOCATED
    http: 409
    condition: "sweep survey reports tanks_detected_count == 0"
  - id: ERR_FIRE_MARSHAL_NOTICE_NOT_EFFECTIVE
    http: 409
    condition: "MOBILIZE attempted with no ISSUED fire-marshal notification, or before its notice_effective_at"
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "MOBILIZE attempted while the project has no MUNICIPAL_DECOMMISSION permit in status ISSUED"
  - id: ERR_PERMIT_EXPIRED
    http: 409
    condition: "MOBILIZE attempted after the MUNICIPAL_DECOMMISSION permit's expires_at; the permit is flipped to EXPIRED before rejection"
  - id: ERR_DISCLOSURE_EXPIRED
    http: 409
    condition: "homeowner responds after expires_at; the disclosure is flipped to EXPIRED before rejection"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 409
    condition: "claim submitted while contamination_disclosure_required is true and no CONTAMINATION_FINDINGS disclosure is ACKNOWLEDGED"
  - id: ERR_LAB_NOT_ACCREDITED
    http: 409
    condition: "RECEIVE attempted at a laboratory whose accredited flag is false"
  - id: ERR_NFA_BLOCKED
    http: 409
    condition: "NFA issuance attempted while TankProject.nfa_blockers is non-empty"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 409
    condition: "supersedes_change_order_id names a change order on another project or one whose status is not APPROVED"
  - id: ERR_RETEST_TARGET_INVALID
    http: 409
    condition: "retest_of_sample_id names a sample on another project or one whose status is not INVALIDATED"
  - id: ERR_CREW_BOOKING_CONFLICT
    http: 409
    condition: "requested crew interval, expanded by the crew's mobilization buffer on both ends, intersects an existing booking of the same crew with field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "the lab already has max_concurrent_analyses samples whose closed analysis window contains the receive instant"
  - id: ERR_HOLDING_TIME_EXCEEDED
    http: 409
    condition: "collected_at to receive instant strictly exceeds Laboratory.holding_time_hours; the sample is flipped to INVALIDATED before rejection"
  - id: ERR_EXCAVATION_LIMIT_EXCEEDED
    http: 409
    condition: "approving the change order would push approved_scope_cubic_yards above TankProject.excavation_limit_cubic_yards"
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 409
    condition: "claim submission or approval attempted while eligible_amount_cents == 0"
  - id: ERR_DUPLICATE_DISCLOSURE
    http: 409
    condition: "a PENDING disclosure of the same kind already exists on the project"
  - id: ERR_WORK_ORDER_ALREADY_OPEN
    http: 409
    condition: "the project already has a work order with field_status IN {SCHEDULED, MOBILIZED, IN_PROGRESS}"
  - id: ERR_DUPLICATE_FINAL_CLAIM
    http: 409
    condition: "the project already has a FINAL_SETTLEMENT claim whose status is not DENIED or WITHDRAWN"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "INFO_REQUESTED decision attempted when info_request_count is already 2"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProjectCoordinator
    description: "Contractor-side operator who intakes sites, records sweep surveys, sends disclosures, files permits, registers crews, schedules field work and drives the billing dimension."
    identity: "opaque"
    exclusive_operations:
      - "POST /properties"
      - "POST /tank-projects"
      - "POST /tank-projects/{id}/sweep-survey (shared with FieldTechnician)"
      - "POST /disclosures"
      - "POST /permits"
      - "POST /crews"
      - "POST /work-orders"
      - "POST /work-orders/{id}/billing-events"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with ComplianceOfficer)"
      - "GET /properties/{id}, GET /tank-projects, GET /tank-projects/{id}, GET /tank-projects/{id}/summary"
      - "GET /disclosures, GET /disclosures/{id}, GET /permits, GET /permits/{id}, GET /crews/{id}"
      - "GET /work-orders, GET /work-orders/{id}, GET /laboratories/{id}"
      - "GET /soil-samples, GET /soil-samples/{id}, GET /change-orders, GET /change-orders/{id}"
      - "GET /trust-fund-claims, GET /trust-fund-claims/{id}, GET /nfa-letters, GET /nfa-letters/{id}"
      - "GET /insurance-notifications, GET /insurance-notifications/{id}"

  - name: FieldTechnician
    description: "Crew member who executes the decommissioning field events and collects soil aliquots; may not report or retract laboratory results."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/field-events"
      - "POST /soil-samples"
      - "POST /soil-samples/{id}/chain-of-custody with event IN {DISPATCH, VOID}"
    shared_operations:
      - "POST /tank-projects/{id}/sweep-survey (shared with ProjectCoordinator)"
      - "GET /properties/{id}, GET /tank-projects, GET /tank-projects/{id}"
      - "GET /permits, GET /permits/{id}, GET /crews/{id}, GET /work-orders, GET /work-orders/{id}"
      - "GET /laboratories/{id}, GET /soil-samples, GET /soil-samples/{id}"

  - name: LabAnalyst
    description: "Accredited laboratory acting on its own samples only. X-User-ID is the Laboratory id."
    identity: "entity_backed:Laboratory"
    exclusive_operations:
      - "POST /soil-samples/{id}/chain-of-custody with event == RECEIVE"
      - "POST /soil-samples/{id}/result"
      - "POST /soil-samples/{id}/retract-result"
    shared_operations:
      - "GET /properties/{id}, GET /tank-projects, GET /tank-projects/{id}"
      - "GET /laboratories/{id}, GET /soil-samples, GET /soil-samples/{id}"

  - name: Homeowner
    description: "Residential owner who acknowledges or declines disclosure notices. X-User-ID is the Property id."
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /disclosures/{id}/respond"
    shared_operations:
      - "GET /properties/{id}, GET /tank-projects/{id}"
      - "GET /disclosures, GET /disclosures/{id}, GET /nfa-letters/{id}"

  - name: LicensedSiteProfessional
    description: "Licensed environmental professional who scopes remediation change orders and drafts and signs NFA letters; the drafter of a letter may not be its signer."
    identity: "opaque"
    exclusive_operations:
      - "POST /change-orders"
      - "POST /change-orders/{id}/submit"
      - "POST /nfa-letters"
      - "POST /nfa-letters/{id}/issue"
    shared_operations:
      - "GET /properties/{id}, GET /tank-projects, GET /tank-projects/{id}, GET /tank-projects/{id}/summary"
      - "GET /disclosures, GET /disclosures/{id}, GET /permits, GET /permits/{id}"
      - "GET /work-orders, GET /work-orders/{id}, GET /soil-samples, GET /soil-samples/{id}"
      - "GET /change-orders, GET /change-orders/{id}, GET /trust-fund-claims, GET /trust-fund-claims/{id}"
      - "GET /nfa-letters, GET /nfa-letters/{id}, GET /insurance-notifications, GET /insurance-notifications/{id}"

  - name: ComplianceOfficer
    description: "Regulatory/compliance operator who renders permit decisions, registers laboratories, decides change orders, administers trust-fund claims, notifies carriers and rescinds NFA letters. Cannot draft or issue NFA letters, cannot perform field work, cannot report lab results."
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/{id}/decision"
      - "POST /laboratories"
      - "POST /change-orders/{id}/decision"
      - "POST /trust-fund-claims"
      - "POST /trust-fund-claims/{id}/submit"
      - "POST /trust-fund-claims/{id}/decision"
      - "POST /nfa-letters/{id}/rescind"
      - "POST /insurance-notifications"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with ProjectCoordinator)"
      - "GET /properties/{id}, GET /tank-projects, GET /tank-projects/{id}, GET /tank-projects/{id}/summary"
      - "GET /disclosures, GET /disclosures/{id}, GET /permits, GET /permits/{id}, GET /crews/{id}"
      - "GET /work-orders, GET /work-orders/{id}, GET /laboratories/{id}"
      - "GET /soil-samples, GET /soil-samples/{id}, GET /change-orders, GET /change-orders/{id}"
      - "GET /trust-fund-claims, GET /trust-fund-claims/{id}, GET /nfa-letters, GET /nfa-letters/{id}"
      - "GET /insurance-notifications, GET /insurance-notifications/{id}"
