              payload: { cat_code: "CAT-2026-126", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-09-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.1000 }
