  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: program_appropriation_conserved_across_reserve_pay_and_clawback
        grounds:
          - calculations.program_budget_conservation
          - calculations.disbursement_reconciliation
          - state_machines.RebateProject.PAID_to_CLAWED_BACK
          - state_machines.Reservation.COMMITTED_to_CLAWED_BACK
          - entities.ClawbackAction.fields.recovered_cents
        distinguishing_aspect: |
          Conserved quantity: the PROGRAM APPROPRIATION, pinned as the explicit
          formula
            budget_total_cents == budget_available_cents
                                + budget_reserved_cents
                                + budget_committed_cents
          with the two supporting identities
            budget_reserved_cents  == sum(reserved_amount_cents of RESERVED reservations)
            budget_committed_cents == sum(reserved_amount_cents of COMMITTED reservations)
            budget_clawed_back_cents == sum(ClawbackAction.recovered_cents)
          The compensating action is the POST-PAYMENT CLAWBACK, which must
          return budget_available_cents to its pre-reservation value with zero
          drift even though the money moved through three buckets and was
          reconciled downward on the way (800000 reserved, 700000 disbursed,
          100000 released at commit time).
        test_recipe:
          setup:
            - "An OPEN program with budget_total_cents 50000000, low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000 and quality_suspension_threshold 0 (so the SPOT failure does not also suspend the contractor)."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
            - "A LOW-tier household, an ENROLLED_ACTIVE contractor and an APPROVED assessment (assessed_panel_amps 200)."
            - "A project reserved for 800000 (provisional, estimated cost 1000000), installed at actual cost 700000, POST_INSTALL PASSED so final_total_incentive_cents is 700000, then PAID with disbursed_amount_cents 700000; reviewed_by_user_id is reviewer-1 and the payment was recorded by admin-1."
            - "A SPOT inspection is then scheduled on the PAID project for 2026-09-15T09:00:00Z-10:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Appropriation", state_code: "CO", budget_total_cents: 50000000, low_tier_cap_cents: 1400000, low_tier_cost_share_pct: 1.00, group_cap_cents: 800000, quality_suspension_threshold: 0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
