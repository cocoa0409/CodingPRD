# =============================================================================
# Task: task_3135_donated_medicine_allocation_safety_net_providers
# Donated Medicine Allocation to Safety-Net Providers (Direct Relief)
# =============================================================================
scenario: |
  Donated Medicine Allocation to Safety-Net Providers (Direct Relief): product
  donation intake from manufacturers with expiration dating, cold chain
  requirements and restricted-use conditions, recipient qualification of
  clinics, health centers and disaster responders with licensure verification,
  allocation decisions balancing need, storage capability and product
  suitability across many requesting sites, controlled and restricted product
  exclusions and handling protocols, shipment logistics with
  temperature-controlled packing and customs documentation for international
  consignments, inventory valuation and donor reporting obligations, emergency
  response surges with pre-positioned modules, recipient reporting on
  distribution and patient reach.

domain_name: donated-medicine-allocation
api_prefix: /medicine-relief

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ManufacturerDonor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Manufacturer or donor organization legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the donating entity" }
      - { name: dea_registration_no, type: string, source: input, description: "DEA registration number; required to donate any CONTROLLED product class" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier used on valuation/donation reports" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEACTIVATED" }

  - name: ProductLot
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> ManufacturerDonor.id; donating organization" }
      - { name: ndc_code, type: string, source: input, description: "National Drug Code (or international equivalent) identifying the product" }
      - { name: product_name, type: string, source: input, description: "Generic + brand label of the donated product" }
      - { name: product_class, type: enum, source: input, description: "STANDARD | COLD_CHAIN | CONTROLLED | RESTRICTED_USE" }
      - { name: dosage_form, type: enum, source: input, description: "TABLET | CAPSULE | VIAL | AMPOULE | SYRUP | CREAM | DEVICE" }
      - { name: unit_of_measure, type: enum, source: input, description: "UNIT | VIAL | PACK | BOX" }
      - { name: quantity_received, type: integer, source: input, description: "Total units originally donated into this lot" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_received - quantity_quarantined - quantity_committed - quantity_shipped - quantity_expired" }
      - { name: quantity_quarantined, type: integer, source: computed, description: "Units held under QUARANTINED status pending QA release" }
      - { name: quantity_committed, type: integer, source: computed, description: "Sum of units on AllocationLines in RESERVED or PICKED status against this lot" }
      - { name: quantity_shipped, type: integer, source: computed, description: "Sum of units on AllocationLines in SHIPPED or DELIVERED status against this lot" }
      - { name: quantity_expired, type: integer, source: computed, description: "Units transitioned to EXPIRED by expiry sweep" }
      - { name: expiration_date, type: datetime, source: input, description: "Manufacturer-stamped expiration date (ISO date)" }
      - { name: storage_temp_min_c, type: number, source: input, description: "Lower bound of required storage temperature band in Celsius" }
      - { name: storage_temp_max_c, type: number, source: input, description: "Upper bound of required storage temperature band in Celsius" }
      - { name: restricted_use_conditions, type: array, source: input, description: "Free-form list of restricted-use conditions attached at intake (e.g. ['hospital-only','not-for-retail'])" }
      - { name: requires_cold_chain, type: boolean, source: computed, description: "true iff product_class == COLD_CHAIN" }
      - { name: is_controlled, type: boolean, source: computed, description: "true iff product_class == CONTROLLED" }
      - { name: unit_acquisition_value_usd, type: number, source: input, description: "Per-unit fair-market acquisition value declared by donor at intake (USD)" }
      - { name: unit_wholesale_value_usd, type: number, source: input, description: "Per-unit wholesale acquisition cost reference (USD) used by the wholesale valuation variant" }
      - { name: lot_posture, type: enum, source: computed, description: "RELEASABLE | QUARANTINED | RECALLED | EXPIRED — derived from QA / expiry / recall signals" }
      - { name: intake_recorded_at, type: datetime, source: system, description: "Timestamp the lot intake was accepted (logical clock)" }

  - name: RecipientSite
    parent: null
    common_fields: true
    fields:
      - { name: organization_name, type: string, source: input, description: "Clinic / health center / disaster responder organization name" }
      - { name: site_type, type: enum, source: input, description: "FREE_CLINIC | FQHC | RURAL_HEALTH_CENTER | DISASTER_RESPONDER | HOSPITAL_CHARITY" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of operation" }
      - { name: is_international, type: boolean, source: computed, description: "true iff country_code != 'US'" }
      - { name: cold_storage_capacity_l, type: integer, source: input, description: "Verified refrigerated volume available at the site, in liters" }
      - { name: has_dea_registration, type: boolean, source: input, description: "Site-level DEA registration; required for CONTROLLED products" }
      - { name: monthly_patient_volume, type: integer, source: input, description: "Self-reported unique patients served per month; feeds need scoring" }
      - { name: underserved_index, type: number, source: input, description: "0.0-1.0 measure of community medical underservice (1.0 = most underserved); feeds need scoring" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING_REVIEW | QUALIFIED | SUSPENDED | REVOKED" }
      - { name: qualified_at, type: datetime, source: system, description: "When the site transitioned to QUALIFIED; null until first qualification" }
      - { name: active_license_count, type: integer, source: computed, description: "Count of License rows in VERIFIED status with expiry >= current logical clock" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> RecipientSite.id; owning site" }
      - { name: license_type, type: enum, source: input, description: "PHARMACY | MEDICAL_DIRECTOR | DEA | WHOLESALER | IMPORT" }
      - { name: issuing_authority, type: string, source: input, description: "Issuing agency (e.g. state board of pharmacy)" }
      - { name: license_number, type: string, source: input, description: "License identifier; unique per (issuing_authority, license_number)" }
      - { name: expires_on, type: datetime, source: input, description: "License expiration date (ISO date)" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | EXPIRED" }

  - name: AllocationRequest
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> RecipientSite.id; requesting site" }
      - { name: requested_by_user_id, type: string, source: input, description: "Opaque id of the site coordinator user who submitted the request" }
      - { name: ndc_code, type: string, source: input, description: "Requested product NDC" }
      - { name: quantity_requested, type: integer, source: input, description: "Units requested (positive integer)" }
      - { name: justification_text, type: string, source: input, description: "Free-text clinical / program justification" }
      - { name: emergency_event_id, type: string, source: input, description: "FK -> EmergencyEvent.id; optional — set iff this request is in response to a declared emergency" , constraints: "may be null"}
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | PARTIALLY_APPROVED | REJECTED | CANCELLED" }
      - { name: need_score, type: number, source: computed, description: "Computed from RecipientSite.underserved_index, monthly_patient_volume, and emergency event severity at approval time" }
      - { name: quantity_approved, type: integer, source: computed, description: "Sum of quantities on APPROVED/PARTIAL AllocationDecision lines for this request" }

  - name: AllocationDecision
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> AllocationRequest.id; decision belongs to exactly one request" }
      - { name: reviewer_user_id, type: string, source: input, description: "Opaque id of the AllocationOfficer who rendered this decision" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp when decision was finalized" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale recorded by reviewer" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED | VOID" }

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - { name: decision_id, type: string, source: input, description: "FK -> AllocationDecision.id; owning decision" }
      - { name: lot_id, type: string, source: input, description: "FK -> ProductLot.id; lot the units are reserved against" }
      - { name: quantity, type: integer, source: input, description: "Units of this lot reserved by this line" }
      - { name: status, type: enum, source: system, description: "RESERVED | PICKED | SHIPPED | DELIVERED | RELEASED | FORFEITED" }
      - { name: reservation_expires_at, type: datetime, source: system, description: "Logical-clock deadline for pickup/shipment; if passed while RESERVED, the line auto-forfeits" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> RecipientSite.id; destination site" }
      - { name: allocation_decision_id, type: string, source: input, description: "FK -> AllocationDecision.id; the decision whose lines this shipment fulfils" }
      - { name: carrier_name, type: string, source: input, description: "Carrier / freight forwarder name" }
      - { name: is_international, type: boolean, source: computed, description: "mirrors RecipientSite.is_international at shipment creation" }
      - { name: requires_cold_chain, type: boolean, source: computed, description: "true iff any included AllocationLine references a lot with requires_cold_chain=true" }
      - { name: temperature_band_min_c, type: number, source: computed, description: "max over included lots' storage_temp_min_c (tightest lower bound)" }
      - { name: temperature_band_max_c, type: number, source: computed, description: "min over included lots' storage_temp_max_c (tightest upper bound)" }
      - { name: packed_with_cold_shipper, type: boolean, source: input, description: "Whether a validated cold shipper was used; mandatory if requires_cold_chain" }
      - { name: customs_declaration_id, type: string, source: system, description: "FK -> CustomsDeclaration.id; populated iff is_international at DISPATCHED time", constraints: "null for domestic shipments" }
      - { name: status, type: enum, source: system, description: "PACKING | AWAITING_CUSTOMS_DOCS | READY_TO_DISPATCH | DISPATCHED | DELIVERED | DELIVERY_FAILED | CANCELLED" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp of DISPATCHED transition" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of DELIVERED transition" }

  - name: CustomsDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; one declaration per international shipment" }
      - { name: hs_code, type: string, source: input, description: "Harmonized System tariff code" }
      - { name: declared_value_usd, type: number, source: computed, description: "Sum over shipment lines of (quantity * unit_acquisition_value_usd) using acquisition-cost valuation" }
      - { name: import_license_id, type: string, source: input, description: "FK -> License.id; recipient's IMPORT license used for customs; must be VERIFIED and unexpired" }
      - { name: destination_country_code, type: string, source: computed, description: "copied from destination RecipientSite.country_code" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CLEARED | REJECTED" }

  - name: EmergencyEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Hurricane / earthquake / outbreak event label" }
      - { name: severity, type: integer, source: input, description: "1-5 severity scale (5 = catastrophic)" }
      - { name: affected_country_codes, type: array, source: input, description: "ISO country codes affected" }
      - { name: declared_at, type: datetime, source: system, description: "Logical-clock declaration timestamp" }
      - { name: surge_window_ends_at, type: datetime, source: input, description: "Logical-clock end of the priority surge window" }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | STAND_DOWN | CLOSED" }

  - name: PrepositionedModule
    parent: null
    common_fields: true
    fields:
      - { name: module_code, type: string, source: input, description: "Unique module identifier (e.g. MODULE-IEHK-2026-A)" }
      - { name: intended_use, type: enum, source: input, description: "PRIMARY_CARE | TRAUMA | CHOLERA | MATERNAL | COLD_CHAIN_VACCINE" }
      - { name: holding_country_code, type: string, source: input, description: "Country where the module is pre-positioned" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Sum of unit counts across module manifest lines that have not been consumed by deployments" }
      - { name: reserved_for_event_id, type: string, source: system, description: "FK -> EmergencyEvent.id; null unless the module is currently reserved" , constraints: "null when AVAILABLE"}
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | DEPLOYED | CONSUMED | DECOMMISSIONED" }

  - name: ValuationSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: snapshot_period, type: string, source: input, description: "YYYY-MM period key" }
      - { name: donor_id, type: string, source: input, description: "FK -> ManufacturerDonor.id; donor this snapshot covers" }
      - { name: method, type: enum, source: input, description: "ACQUISITION_COST | WHOLESALE_REFERENCE" }
      - { name: total_value_usd, type: number, source: computed, description: "Sum over that donor's lots received in the period of (quantity_received * per-unit value for the chosen method)" }
      - { name: lot_count, type: integer, source: computed, description: "Number of the donor's lots received in the period" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock generation timestamp" }

  - name: DistributionReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> RecipientSite.id; reporting site" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the DELIVERED shipment being reported on" }
      - { name: reporting_period, type: string, source: input, description: "YYYY-MM period covered" }
      - { name: units_distributed, type: integer, source: input, description: "Units actually dispensed/distributed during the period" }
      - { name: patients_reached, type: integer, source: input, description: "Unique patients served during the period" }
      - { name: wastage_units, type: integer, source: input, description: "Units wasted (expired/damaged) during the period" }
      - { name: submitted_by_user_id, type: string, source: input, description: "Opaque id of the site coordinator submitting" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque id of the ComplianceOfficer who reviewed; null until reviewed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductLot
    field: lot_posture
    initial_state: QUARANTINED
    terminal_states: [RECALLED, EXPIRED]
    transitions:
      - from: QUARANTINED
        to: RELEASABLE
        trigger: POST /medicine-relief/lots/{lot_id}/release
        actor: QAPharmacist
        preconditions:
          - "lot_posture == QUARANTINED (ERR_INVALID_STATE)"
          - "ManufacturerDonor.status == ACTIVE (ERR_DONOR_NOT_ACTIVE)"
          - "If lot.is_controlled, ManufacturerDonor.dea_registration_no must be non-empty (ERR_CONTROLLED_DONOR_UNREGISTERED)"
        side_effects:
          - "quantity_quarantined -= quantity_received"
          - "quantity_available += quantity_received"
          - "increments ProductLot.version by 1"

      - from: RELEASABLE
        to: RECALLED
        trigger: POST /medicine-relief/lots/{lot_id}/recall
        actor: QAPharmacist
        preconditions:
          - "lot_posture in {QUARANTINED, RELEASABLE} (ERR_INVALID_STATE)"
        side_effects:
          - "All AllocationLines against this lot in RESERVED status transition to RELEASED and decrement quantity_committed"
          - "Any Shipment in PACKING or READY_TO_DISPATCH containing lines against this lot transitions to CANCELLED"
          - "quantity_available recomputed (drops to 0 for non-shipped units)"
          - "increments ProductLot.version by 1"

      - from: QUARANTINED
        to: RECALLED
        trigger: POST /medicine-relief/lots/{lot_id}/recall
        actor: QAPharmacist
        preconditions:
          - "lot_posture in {QUARANTINED, RELEASABLE}"
        side_effects:
          - "Same as RELEASABLE -> RECALLED"

      - from: RELEASABLE
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches expiration_date and lot has unshipped units)"
        actor: system
        preconditions:
          - "logical clock >= expiration_date"
        side_effects:
          - "quantity_expired += quantity_available"
          - "quantity_available -> 0"
          - "All RESERVED AllocationLines against this lot transition to FORFEITED"

      - from: QUARANTINED
        to: EXPIRED
        trigger: "system (automatic expiry sweep)"
        actor: system
        preconditions:
          - "logical clock >= expiration_date"
        side_effects:
          - "quantity_expired += quantity_quarantined"

  - entity: RecipientSite
    field: qualification_status
    initial_state: PENDING_REVIEW
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: QUALIFIED
        trigger: POST /medicine-relief/sites/{site_id}/qualify
        actor: ComplianceOfficer
        preconditions:
          - "qualification_status == PENDING_REVIEW (ERR_INVALID_STATE)"
          - "active_license_count >= 1 (ERR_NO_VERIFIED_LICENSE)"
          - "If site.country_code != 'US', site must hold a VERIFIED IMPORT license whose expiry > current logical clock (ERR_IMPORT_LICENSE_MISSING)"
        side_effects:
          - "qualified_at set to current logical clock"
          - "increments RecipientSite.version by 1"

      - from: QUALIFIED
        to: SUSPENDED
        trigger: POST /medicine-relief/sites/{site_id}/suspend
        actor: ComplianceOfficer
        preconditions:
          - "qualification_status == QUALIFIED"
        side_effects:
          - "All AllocationRequests for this site in SUBMITTED or UNDER_REVIEW transition to CANCELLED"
          - "All AllocationLines in RESERVED for this site transition to RELEASED; corresponding lots' quantity_committed decreases (cascade via AllocationLine -> ProductLot)"
          - "increments RecipientSite.version by 1"

      - from: SUSPENDED
        to: QUALIFIED
        trigger: POST /medicine-relief/sites/{site_id}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "qualification_status == SUSPENDED"
          - "active_license_count >= 1"
        side_effects:
          - "increments RecipientSite.version by 1"

      - from: QUALIFIED
        to: REVOKED
        trigger: POST /medicine-relief/sites/{site_id}/revoke
        actor: ComplianceOfficer
        preconditions:
          - "qualification_status in {QUALIFIED, SUSPENDED}"
        side_effects:
          - "Same cascade as SUSPENDED, plus Shipments in PACKING/AWAITING_CUSTOMS_DOCS/READY_TO_DISPATCH to this site transition to CANCELLED"
          - "REVOKED is terminal; no reinstate"

      - from: SUSPENDED
        to: REVOKED
        trigger: POST /medicine-relief/sites/{site_id}/revoke
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Same as QUALIFIED -> REVOKED"

  - entity: License
    field: verification_status
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: POST /medicine-relief/licenses/{license_id}/verify
        actor: ComplianceOfficer
        preconditions:
          - "verification_status == PENDING"
          - "expires_on > current logical clock"
        side_effects:
          - "Recompute RecipientSite.active_license_count"

      - from: PENDING
        to: REJECTED
        trigger: POST /medicine-relief/licenses/{license_id}/reject
        actor: ComplianceOfficer
        preconditions:
          - "verification_status == PENDING"
        side_effects:
          - "Recompute RecipientSite.active_license_count"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches expires_on)"
        actor: system
        preconditions:
          - "logical clock >= expires_on"
        side_effects:
          - "Recompute RecipientSite.active_license_count"
          - "If the site's active_license_count drops to 0 and the site is QUALIFIED, the site auto-transitions to SUSPENDED"

  - entity: AllocationRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /medicine-relief/allocation-requests/{id}/begin-review
        actor: AllocationOfficer
        preconditions:
          - "status == SUBMITTED"
          - "site.qualification_status == QUALIFIED (ERR_SITE_NOT_QUALIFIED)"
        side_effects:
          - "increments AllocationRequest.version by 1"

      - from: APPROVED
        to: UNDER_REVIEW
        trigger: POST /medicine-relief/allocation-requests/{id}/begin-review
        actor: AllocationOfficer
        preconditions:
          - "status == APPROVED"
          - "site.qualification_status == QUALIFIED"
          - "The existing FINALIZED decision's lines are all still RESERVED (none PICKED/SHIPPED/DELIVERED)"
        side_effects:
          - "increments AllocationRequest.version by 1"
          - "Allows the officer to draft a superseding decision (cyclic revision loop)"

      - from: PARTIALLY_APPROVED
        to: UNDER_REVIEW
        trigger: POST /medicine-relief/allocation-requests/{id}/begin-review
        actor: AllocationOfficer
        preconditions:
          - "status == PARTIALLY_APPROVED"
          - "site.qualification_status == QUALIFIED"
          - "The existing FINALIZED decision's lines are all still RESERVED"
        side_effects:
          - "increments AllocationRequest.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system (upon AllocationDecision FINALIZED covering the full quantity_requested)"
        actor: system
        preconditions:
          - "exactly one AllocationDecision in FINALIZED status for this request"
          - "sum of decision's AllocationLine quantities == quantity_requested"
        side_effects:
          - "quantity_approved set to quantity_requested"

      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "system (upon AllocationDecision FINALIZED covering a positive quantity less than quantity_requested)"
        actor: system
        preconditions:
          - "sum of decision's AllocationLine quantities > 0 and < quantity_requested"
        side_effects:
          - "quantity_approved set to the covered quantity"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /medicine-relief/allocation-requests/{id}/reject
        actor: AllocationOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "No FINALIZED AllocationDecision exists for this request"
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /medicine-relief/allocation-requests/{id}/cancel
        actor: SiteCoordinator
        preconditions:
          - "status == SUBMITTED"
          - "requested_by_user_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []

      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: POST /medicine-relief/allocation-requests/{id}/cancel
        actor: SiteCoordinator
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW}"
          - "requested_by_user_id == X-User-ID"
          - "No FINALIZED AllocationDecision exists for this request"
        side_effects: []

  - entity: AllocationDecision
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST /medicine-relief/allocation-decisions/{id}/finalize
        actor: AllocationOfficer
        preconditions:
          - "status == DRAFT"
          - "reviewer_user_id == X-User-ID (segregation-of-duties: only the drafting reviewer finalizes; a different officer may not)"
          - "decision has at least one AllocationLine"
          - "For every line, lot.lot_posture == RELEASABLE (ERR_LOT_NOT_RELEASABLE)"
          - "For every line, site cold-chain capability suffices when lot.requires_cold_chain (ERR_COLD_CHAIN_INADEQUATE)"
          - "For every line with lot.is_controlled, site.has_dea_registration must be true (ERR_CONTROLLED_SITE_NOT_AUTHORIZED)"
          - "sum of line quantities <= request.quantity_requested"
          - "OCC: request body carries expected_request_version equal to AllocationRequest.version"
        side_effects:
          - "Each line's quantity is added to its ProductLot.quantity_committed"
          - "AllocationLine.status set to RESERVED, reservation_expires_at = decided_at + RESERVATION_TTL_HOURS hours"
          - "Request.need_score computed and stored"
          - "Request transitions to APPROVED or PARTIALLY_APPROVED per coverage"
          - "increments AllocationRequest.version by 1"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (when a superseding AllocationDecision for the same request is FINALIZED — only allowed while all this decision's lines are still RESERVED)"
        actor: system
        preconditions:
          - "all lines in RESERVED status (none PICKED/SHIPPED/DELIVERED)"
        side_effects:
          - "Each line transitions to RELEASED; lot.quantity_committed decreases"
          - "quantity_approved on the request is recomputed from the superseding decision"

      - from: DRAFT
        to: VOID
        trigger: POST /medicine-relief/allocation-decisions/{id}/void
        actor: AllocationOfficer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "No quantity_committed change (never reserved)"

  - entity: AllocationLine
    field: status
    initial_state: RESERVED
    terminal_states: [DELIVERED, RELEASED, FORFEITED]
    transitions:
      - from: RESERVED
        to: PICKED
        trigger: POST /medicine-relief/shipments (when the shipment references this line's decision)
        actor: LogisticsCoordinator
        preconditions:
          - "line.status == RESERVED"
          - "decision.status == FINALIZED"
        side_effects:
          - "lot.quantity_committed -= quantity (moves from committed to in-flight)"

      - from: PICKED
        to: SHIPPED
        trigger: "system (upon owning Shipment DISPATCHED)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.quantity_shipped += quantity"

      - from: SHIPPED
        to: DELIVERED
        trigger: "system (upon owning Shipment DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "system (decision superseded / site suspended / lot recalled / request cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.quantity_committed -= quantity"
          - "lot.quantity_available += quantity"

      - from: RESERVED
        to: FORFEITED
        trigger: "system (logical clock passes reservation_expires_at while line still RESERVED)"
        actor: system
        preconditions:
          - "logical clock >= reservation_expires_at"
        side_effects:
          - "lot.quantity_committed -= quantity"
          - "lot.quantity_available += quantity"
          - "Request.quantity_approved recomputed; if 0, request transitions to REJECTED"

  - entity: Shipment
    field: status
    initial_state: PACKING
    terminal_states: [DELIVERED, DELIVERY_FAILED, CANCELLED]
    transitions:
      - from: PACKING
        to: AWAITING_CUSTOMS_DOCS
        trigger: POST /medicine-relief/shipments/{id}/pack-complete
        actor: LogisticsCoordinator
        preconditions:
          - "status == PACKING"
          - "shipment.is_international == true"
          - "requires_cold_chain -> packed_with_cold_shipper == true (ERR_COLD_CHAIN_PACK_REQUIRED)"
        side_effects:
          - "temperature_band_min_c and temperature_band_max_c computed and stored"

      - from: PACKING
        to: READY_TO_DISPATCH
        trigger: POST /medicine-relief/shipments/{id}/pack-complete
        actor: LogisticsCoordinator
        preconditions:
          - "status == PACKING"
          - "shipment.is_international == false"
          - "requires_cold_chain -> packed_with_cold_shipper == true"
        side_effects:
          - "temperature_band_min_c and temperature_band_max_c computed and stored"

      - from: AWAITING_CUSTOMS_DOCS
        to: READY_TO_DISPATCH
        trigger: "system (upon linked CustomsDeclaration transitions to CLEARED)"
        actor: system
        preconditions:
          - "customs_declaration.status == CLEARED"
        side_effects: []

      - from: READY_TO_DISPATCH
        to: DISPATCHED
        trigger: POST /medicine-relief/shipments/{id}/dispatch
        actor: LogisticsCoordinator
        preconditions:
          - "status == READY_TO_DISPATCH"
          - "If is_international, customs_declaration.status == CLEARED (ERR_CUSTOMS_NOT_CLEARED)"
          - "RecipientSite.qualification_status == QUALIFIED (ERR_SITE_NOT_QUALIFIED)"
        side_effects:
          - "dispatched_at set"
          - "All PICKED AllocationLines transition to SHIPPED; lot.quantity_shipped incremented"
          - "If is_international and customs_declaration_id is null, synthesize a DRAFT CustomsDeclaration placeholder (rejected on read; dispatch precondition still applies)"

      - from: DISPATCHED
        to: DELIVERED
        trigger: POST /medicine-relief/shipments/{id}/confirm-delivery
        actor: SiteCoordinator
        preconditions:
          - "status == DISPATCHED"
          - "X-User-ID is a SiteCoordinator whose RecipientSite.id == shipment.site_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "delivered_at set"
          - "All SHIPPED AllocationLines transition to DELIVERED"

      - from: DISPATCHED
        to: DELIVERY_FAILED
        trigger: POST /medicine-relief/shipments/{id}/mark-delivery-failed
        actor: LogisticsCoordinator
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "All SHIPPED AllocationLines transition to FORFEITED; lot.quantity_shipped decremented and lot.quantity_expired incremented (product considered spoiled in transit)"

      - from: PACKING
        to: CANCELLED
        trigger: POST /medicine-relief/shipments/{id}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "status in {PACKING, AWAITING_CUSTOMS_DOCS, READY_TO_DISPATCH}"
        side_effects:
          - "All PICKED AllocationLines transition back to RESERVED (lot.quantity_committed incremented)"

      - from: AWAITING_CUSTOMS_DOCS
        to: CANCELLED
        trigger: POST /medicine-relief/shipments/{id}/cancel
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["Same as PACKING -> CANCELLED"]

      - from: READY_TO_DISPATCH
        to: CANCELLED
        trigger: POST /medicine-relief/shipments/{id}/cancel
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["Same as PACKING -> CANCELLED"]

  - entity: CustomsDeclaration
    field: status
    initial_state: DRAFT
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /medicine-relief/customs-declarations/{id}/submit
        actor: LogisticsCoordinator
        preconditions:
          - "status == DRAFT"
          - "shipment.is_international == true"
          - "import_license_id references a License in VERIFIED status with expires_on > current logical clock (ERR_IMPORT_LICENSE_MISSING)"
          - "hs_code non-empty"
        side_effects:
          - "declared_value_usd computed and stored"

      - from: SUBMITTED
        to: CLEARED
        trigger: POST /medicine-relief/customs-declarations/{id}/clear
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "Shipment transitions AWAITING_CUSTOMS_DOCS -> READY_TO_DISPATCH"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /medicine-relief/customs-declarations/{id}/reject
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "Shipment remains AWAITING_CUSTOMS_DOCS; LogisticsCoordinator may submit a new declaration"

  - entity: EmergencyEvent
    field: status
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: POST /medicine-relief/emergency-events/{id}/activate
        actor: EmergencyManager
        preconditions:
          - "status == DECLARED"
        side_effects:
          - "AllocationRequests referencing this event receive priority weighting in need_score"

      - from: ACTIVE
        to: STAND_DOWN
        trigger: "system (when logical clock reaches surge_window_ends_at)"
        actor: system
        preconditions:
          - "logical clock >= surge_window_ends_at"
        side_effects:
          - "PrepositionedModules in RESERVED for this event return to AVAILABLE"

      - from: STAND_DOWN
        to: CLOSED
        trigger: POST /medicine-relief/emergency-events/{id}/close
        actor: EmergencyManager
        preconditions:
          - "status == STAND_DOWN"
          - "All AllocationRequests referencing this event are in a terminal status"
        side_effects: []

  - entity: PrepositionedModule
    field: status
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: POST /medicine-relief/prepositioned-modules/{id}/reserve
        actor: EmergencyManager
        preconditions:
          - "status == AVAILABLE"
          - "Target EmergencyEvent.status == ACTIVE"
          - "Module.holding_country_code must be in EmergencyEvent.affected_country_codes OR EmergencyEvent.severity >= 4 (ERR_MODULE_OUT_OF_REGION)"
          - "Module.intended_use must be compatible with the event (COLD_CHAIN_VACCINE only for outbreak-class events)"
        side_effects:
          - "reserved_for_event_id set"

      - from: RESERVED
        to: DEPLOYED
        trigger: POST /medicine-relief/prepositioned-modules/{id}/deploy
        actor: EmergencyManager
        preconditions:
          - "status == RESERVED"
          - "EmergencyEvent.status == ACTIVE"
        side_effects:
          - "quantity_on_hand unchanged (still in transit)"

      - from: DEPLOYED
        to: CONSUMED
        trigger: POST /medicine-relief/prepositioned-modules/{id}/consume
        actor: EmergencyManager
        preconditions:
          - "status == DEPLOYED"
          - "EmergencyEvent.status in {ACTIVE, STAND_DOWN}"
        side_effects:
          - "quantity_on_hand -> 0"

      - from: RESERVED
        to: AVAILABLE
        trigger: "system (when EmergencyEvent transitions ACTIVE -> STAND_DOWN)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_for_event_id set to null"

  - entity: DistributionReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /medicine-relief/distribution-reports/{id}/submit
        actor: SiteCoordinator
        preconditions:
          - "status == DRAFT"
          - "X-User-ID is a SiteCoordinator whose site matches the report.site_id"
          - "units_distributed + wastage_units <= sum of DELIVERED AllocationLine quantities on the shipment (ERR_OVERREPORTED)"
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /medicine-relief/distribution-reports/{id}/accept
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "reviewed_by_user_id (the ComplianceOfficer) != submitted_by_user_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id recorded"
          - "Feeds donor-facing ValuationSnapshot regeneration for the period"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /medicine-relief/distribution-reports/{id}/reject
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "reviewed_by_user_id != submitted_by_user_id"
        side_effects:
          - "reviewed_by_user_id recorded"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: decision-finalize-stale-request
    parent_entity: AllocationRequest
    write_endpoint: "POST /medicine-relief/allocation-decisions/{decision_id}/finalize"
    occ_field: "expected_request_version"
    description: |
      Finalizing an AllocationDecision against an AllocationRequest whose
      version has advanced since the officer last observed it is rejected.
      This captures the case where another writer has just finalized a
      superseding decision (which legitimately supersedes the prior one
      per §1.2) or advanced the request through some other transition, and
      the current officer's view of the request is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: site-suspend-stale-site
    parent_entity: RecipientSite
    write_endpoint: "POST /medicine-relief/sites/{site_id}/suspend"
    occ_field: "expected_site_version"
    description: |
      Suspending a RecipientSite whose version has advanced since the
      ComplianceOfficer last observed it is rejected. Suspension cascades
      cancel outstanding requests and release reserved lines; if some other
      transition (e.g., a qualification refresh) has already bumped the
      site's version, the officer's understanding of what is being
      suspended is stale and the operation must be rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_available_quantity
    trigger: "any AllocationLine or ProductLot posture mutation affecting this lot"
    algorithm: aggregation
    formula: |
      quantity_available = quantity_received
                         - quantity_quarantined
                         - quantity_committed
                         - quantity_shipped
                         - quantity_expired
      quantity_available MUST remain >= 0; a mutation that would drive it
      negative is rejected with ERR_INSUFFICIENT_AVAILABLE.
    input_set: "single ProductLot row"
    precision: "integer units, no rounding"

  - name: need_score
    trigger: "AllocationDecision finalize"
    algorithm: weighted_scoring
    formula: |
      Let S = RecipientSite (the requesting site).
      Let E = EmergencyEvent referenced by the request, or null.

      base_score     = 100 * S.underserved_index
      volume_factor  = min(S.monthly_patient_volume / 1000, 2.0)
      volume_points  = 25 * volume_factor
      emergency_boost = (E != null AND E.status == ACTIVE)
                        ? (10 * E.severity) : 0
      storage_adjust  = (lot.requires_cold_chain AND S.cold_storage_capacity_l == 0)
                        ? -50 : 0
      need_score     = round_half_up(base_score + volume_points + emergency_boost + storage_adjust, 2)

      need_score is computed once at FINALIZE time and persisted on the
      AllocationRequest; later changes to S or E do NOT retroactively
      recompute it.
    input_set: "the requesting RecipientSite + the referenced EmergencyEvent (if any) + the cold-chain flag of every lot in the decision's lines"
    constants:
      UNDERSERVED_WEIGHT: 100
      VOLUME_CAP: 2.0
      VOLUME_DIVISOR: 1000
      VOLUME_WEIGHT: 25
      EMERGENCY_PER_SEVERITY: 10
      COLD_CHAIN_SHORTFALL_PENALTY: -50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: emergency_weighted
        when: "request.emergency_event_id references an EmergencyEvent in ACTIVE status"
        difference: "adds 10 * severity (10..50 points); otherwise zero"
      - name: cold_chain_penalized
        when: "any line's lot requires_cold_chain and the site has zero cold_storage_capacity_l"
        difference: "applies a flat -50 to the otherwise-computed score"

  - name: valuation_total
    trigger: "ValuationSnapshot generation for a (donor, period, method)"
    algorithm: aggregation
    formula: |
      Let L = the set of ProductLot rows with lot.donor_id == donor_id
              AND YYYY-MM(lot.intake_recorded_at) == snapshot_period
              AND lot.lot_posture != RECALLED.

      If method == ACQUISITION_COST:
        total_value_usd = sum over L of round_half_up(quantity_received * unit_acquisition_value_usd, 2)
      Else (method == WHOLESALE_REFERENCE):
        total_value_usd = sum over L of round_half_up(quantity_received * unit_wholesale_value_usd, 2)

      lot_count = |L|

      Per-lot rounding is applied BEFORE the sum: each lot's contribution is
      rounded to 2 decimal places, then the rounded contributions are summed.
      Summing raw products and rounding the total once produces different
      cents; the scaffold pins per-lot-then-sum.
    input_set: "ProductLots filtered by donor, intake period, and lot_posture != RECALLED"
    precision: "2 decimal places, round_half_up; per-lot rounding before summation"
    variants:
      - name: acquisition_cost
        when: "snapshot.method == ACQUISITION_COST"
        difference: "uses unit_acquisition_value_usd; required for donor tax reporting"
      - name: wholesale_reference
        when: "snapshot.method == WHOLESALE_REFERENCE"
        difference: "uses unit_wholesale_value_usd; required for GAAP inventory disclosure"

  - name: customs_declared_value
    trigger: "CustomsDeclaration submit"
    algorithm: aggregation
    formula: |
      Let LINES = the AllocationLines on the Shipment's AllocationDecision
      whose status is PICKED (in-flight) at submit time.

      declared_value_usd = sum over LINES of
                           round_half_up(line.quantity * lot(line.lot_id).unit_acquisition_value_usd, 2)

      Per-line rounding before summation (same rule as valuation_total).
    input_set: "PICKED AllocationLines on the shipment's decision"
    precision: "2 decimal places, round_half_up; per-line rounding before summation"

  - name: site_active_license_count
    trigger: "any License verification_status transition for the site OR any logical-clock advance that crosses a license expires_on"
    algorithm: aggregation
    formula: |
      active_license_count = | { L in License : L.site_id == site.id
                                  AND L.verification_status == VERIFIED
                                  AND L.expires_on > current_logical_clock } |
    input_set: "Licenses filtered by site, VERIFIED status, and unexpired at the current logical clock"
    precision: "integer count"

  - name: shipment_temperature_band
    trigger: "Shipment pack-complete"
    algorithm: aggregation
    formula: |
      Let LOTS = distinct lots referenced by the shipment's PICKED lines.
      If LOTS is empty: rejected (shipment has no lines).
      temperature_band_min_c = max over LOTS of storage_temp_min_c
      temperature_band_max_c = min over LOTS of storage_temp_max_c
      If temperature_band_min_c > temperature_band_max_c: reject with ERR_INCOMPATIBLE_TEMPERATURE_BANDS
      requires_cold_chain = any(LOTS, requires_cold_chain == true)
    input_set: "distinct lots referenced by the shipment's PICKED AllocationLines"
    precision: "single decimal place Celsius"

  - name: overreport_check
    trigger: "DistributionReport submit"
    algorithm: threshold
    formula: |
      delivered_qty = sum of quantities on AllocationLines of the shipment's
                      decision whose status == DELIVERED.
      previously_reported = sum of units_distributed + wastage_units over all
                            DistributionReports for this shipment whose status
                            in {SUBMITTED, ACCEPTED}.
      The new report is rejected with ERR_OVERREPORTED iff
        units_distributed + wastage_units + previously_reported > delivered_qty
      Boundary: equality (== delivered_qty) is ALLOWED.
    input_set: "DELIVERED AllocationLines on this shipment's decision + prior non-rejected DistributionReports for this shipment"
    precision: "integer units"

  - name: reservation_ttl
    trigger: "AllocationDecision finalize"
    algorithm: forward_looking
    formula: |
      reservation_expires_at = decided_at + RESERVATION_TTL_HOURS hours
      Emergency-anchored requests (request.emergency_event_id references an
      ACTIVE EmergencyEvent) use EMERGENCY_RESERVATION_TTL_HOURS instead.
    input_set: "the AllocationRequest + decision decided_at"
    constants:
      RESERVATION_TTL_HOURS: 72
      EMERGENCY_RESERVATION_TTL_HOURS: 24
    precision: "logical-clock ISO8601 timestamps"
    variants:
      - name: standard_ttl
        when: "no emergency_event_id, or event not ACTIVE"
        difference: "72 hours"
      - name: emergency_ttl
        when: "request references an ACTIVE EmergencyEvent"
        difference: "24 hours (shorter shelf time under surge)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is permitted to invoke the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id referenced in path and body resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: existence
    check: "For ownership-guarded endpoints, the acting user owns the resource (SiteCoordinator.site_id == resource.site_id; requested_by_user_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /allocation-requests/{id}/cancel, POST /shipments/{id}/confirm-delivery, POST /distribution-reports (create), POST /distribution-reports/{id}/submit"

  - priority: 5
    category: state
    check: "Target resource's current state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "For AllocationDecision finalize: request body expected_request_version == current AllocationRequest.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /allocation-decisions/{id}/finalize"

  - priority: 7
    category: state
    check: "For site suspend: request body expected_site_version == current RecipientSite.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sites/{id}/suspend"

  - priority: 8
    category: business_safety
    check: "Controlled products only ship to sites with has_dea_registration == true; controlled lots only come from donors with a non-empty dea_registration_no"
    error_id: ERR_CONTROLLED_SITE_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /allocation-decisions/{id}/finalize, POST /lots (intake), POST /lots/{id}/release"

  - priority: 9
    category: business_safety
    check: "Cold-chain products may only be allocated to sites with cold_storage_capacity_l > 0, and any shipment containing a cold-chain lot must be packed with a validated cold shipper"
    error_id: ERR_COLD_CHAIN_INADEQUATE
    http_status: 422
    applies_to: "POST /allocation-decisions/{id}/finalize, POST /shipments/{id}/pack-complete"

  - priority: 10
    category: business_safety
    check: "Lots must be in RELEASABLE posture to be allocated; QUARANTINED, RECALLED, or EXPIRED lots cannot be reserved"
    error_id: ERR_LOT_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /allocation-decisions (create with lines), POST /allocation-decisions/{id}/finalize"

  - priority: 11
    category: business_safety
    check: "International shipments require a VERIFIED, unexpired IMPORT license from the destination site"
    error_id: ERR_IMPORT_LICENSE_MISSING
    http_status: 422
    applies_to: "POST /customs-declarations, POST /customs-declarations/{id}/submit"

  - priority: 12
    category: business_temporal
    check: "Qualification requires at least one VERIFIED, unexpired License at the current logical clock"
    error_id: ERR_NO_VERIFIED_LICENSE
    http_status: 422
    applies_to: "POST /sites/{id}/qualify, POST /sites/{id}/reinstate"

  - priority: 13
    category: business_temporal
    check: "License expiry must be in the future at verification time"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /licenses/{id}/verify"

  - priority: 14
    category: business_constraint
    check: "Sum of AllocationLine quantities on a decision must be > 0 and <= request.quantity_requested"
    error_id: ERR_QUANTITY_INVALID
    http_status: 422
    applies_to: "POST /allocation-decisions, POST /allocation-decisions/{id}/finalize"

  - priority: 15
    category: business_constraint
    check: "Site qualification_status must be QUALIFIED for AllocationRequest review/decision and Shipment dispatch"
    error_id: ERR_SITE_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /allocation-requests/{id}/begin-review, POST /allocation-decisions, POST /allocation-decisions/{id}/finalize, POST /shipments, POST /shipments/{id}/dispatch"

  - priority: 16
    category: business_constraint
    check: "Donor status must be ACTIVE to intake new lots or release quarantined lots"
    error_id: ERR_DONOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /lots, POST /lots/{id}/release"

  - priority: 17
    category: business_constraint
    check: "Module reservation is permitted only when holding_country_code is within the event's affected_country_codes OR the event's severity >= 4"
    error_id: ERR_MODULE_OUT_OF_REGION
    http_status: 422
    applies_to: "POST /prepositioned-modules/{id}/reserve"

  - priority: 18
    category: business_constraint
    check: "DistributionReport acceptance or rejection must be performed by a ComplianceOfficer whose user id differs from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distribution-reports/{id}/accept, POST /distribution-reports/{id}/reject"

  - priority: 19
    category: business_fiscal
    check: "Decision would over-commit a lot: sum of line quantities against a lot must leave lot.quantity_available >= 0 after commit"
    error_id: ERR_INSUFFICIENT_AVAILABLE
    http_status: 409
    applies_to: "POST /allocation-decisions, POST /allocation-decisions/{id}/finalize"

  - priority: 20
    category: business_fiscal
    check: "DistributionReport.units_distributed + wastage_units + previously_reported must not exceed delivered quantity for the shipment"
    error_id: ERR_OVERREPORTED
    http_status: 422
    applies_to: "POST /distribution-reports/{id}/submit"

  - priority: 21
    category: business_fiscal
    check: "Customs declared value must be > 0 (cannot submit a declaration for a valueless shipment)"
    error_id: ERR_CUSTOMS_VALUE_INVALID
    http_status: 422
    applies_to: "POST /customs-declarations/{id}/submit"

  - priority: 22
    category: business_referential
    check: "Request body must be well-formed; required fields present with correct types"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 23
    category: business_referential
    check: "EmergencyEvent reference must resolve and (for need_score and TTL purposes) be in ACTIVE status to confer emergency weighting"
    error_id: ERR_EMERGENCY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /allocation-requests (with emergency_event_id), POST /prepositioned-modules/{id}/reserve, POST /prepositioned-modules/{id}/deploy"

  - priority: 24
    category: business_referential
    check: "Cross-resource temperature compatibility: shipment pack-complete rejected if max(min_c) > min(max_c) across included lots"
    error_id: ERR_INCOMPATIBLE_TEMPERATURE_BANDS
    http_status: 422
    applies_to: "POST /shipments/{id}/pack-complete"

  - priority: 25
    category: business_referential
    check: "Cold-chain shipment without packed_with_cold_shipper=true is rejected at pack-complete"
    error_id: ERR_COLD_CHAIN_PACK_REQUIRED
    http_status: 422
    applies_to: "POST /shipments/{id}/pack-complete"

  - priority: 26
    category: business_referential
    check: "Customs clearance precondition: dispatch blocked until linked declaration is CLEARED"
    error_id: ERR_CUSTOMS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /shipments/{id}/dispatch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/medicine-relief/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary ISO8601 UTC instant. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z; it never falls back to wall-clock time. All expiry, deadline, TTL, and period logic uses this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["run expiry sweep (lots, licenses, allocation-line forfeits, emergency stand-down)"]

  # --- ManufacturerDonor ---
  - method: POST
    path: "/medicine-relief/donors"
    description: "Register a new manufacturer donor"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, country_code, "dea_registration_no?", tax_id]
    output: ManufacturerDonor
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/medicine-relief/donors/{donor_id}"
    description: "Get a donor"
    roles: [PlatformAdmin, ComplianceOfficer, AllocationOfficer, DonorReportingOfficer]
    code: 200
    input: []
    output: ManufacturerDonor
    side_effects: []

  - method: GET
    path: "/medicine-relief/donors"
    description: "List donors (paginated)"
    roles: [PlatformAdmin, ComplianceOfficer, AllocationOfficer, DonorReportingOfficer]
    code: 200
    input: ["status?", "country_code?", "limit?", "offset?"]
    output: ManufacturerDonor[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/donors/{donor_id}/suspend"
    description: "Suspend a donor (blocks new intake)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ManufacturerDonor
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/medicine-relief/donors/{donor_id}/deactivate"
    description: "Deactivate a donor permanently"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ManufacturerDonor
    side_effects: ["status -> DEACTIVATED"]

  # --- ProductLot ---
  - method: POST
    path: "/medicine-relief/lots"
    description: "Intake a new product lot (enters QUARANTINED)"
    roles: [PlatformAdmin, QAPharmacist]
    code: 201
    input: [donor_id, ndc_code, product_name, product_class, dosage_form, unit_of_measure, quantity_received, expiration_date, storage_temp_min_c, storage_temp_max_c, restricted_use_conditions, unit_acquisition_value_usd, unit_wholesale_value_usd]
    output: ProductLot
    side_effects: ["lot_posture=QUARANTINED, quantity_quarantined=quantity_received, version=1"]

  - method: GET
    path: "/medicine-relief/lots/{lot_id}"
    description: "Get a lot"
    roles: [PlatformAdmin, QAPharmacist, AllocationOfficer, LogisticsCoordinator, ComplianceOfficer, DonorReportingOfficer]
    code: 200
    input: []
    output: ProductLot
    side_effects: []

  - method: GET
    path: "/medicine-relief/lots"
    description: "List lots (paginated, filterable)"
    roles: [PlatformAdmin, QAPharmacist, AllocationOfficer, LogisticsCoordinator, ComplianceOfficer, DonorReportingOfficer]
    code: 200
    input: ["donor_id?", "lot_posture?", "product_class?", "ndc_code?", "limit?", "offset?"]
    output: ProductLot[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/lots/{lot_id}/release"
    description: "QA-release a QUARANTINED lot (posture -> RELEASABLE)"
    roles: [QAPharmacist]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["lot_posture -> RELEASABLE, quantity_quarantined -= quantity_received, quantity_available += quantity_received, increments ProductLot.version by 1"]

  - method: POST
    path: "/medicine-relief/lots/{lot_id}/recall"
    description: "Recall a lot (releases reserved lines, cancels in-packing shipments)"
    roles: [QAPharmacist]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["lot_posture -> RECALLED, reserved lines RELEASED, packing shipments CANCELLED, increments ProductLot.version by 1"]

  # --- RecipientSite ---
  - method: POST
    path: "/medicine-relief/sites"
    description: "Register a recipient site (status PENDING_REVIEW)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [organization_name, site_type, country_code, cold_storage_capacity_l, has_dea_registration, monthly_patient_volume, underserved_index]
    output: RecipientSite
    side_effects: ["qualification_status=PENDING_REVIEW, version=1"]

  - method: GET
    path: "/medicine-relief/sites/{site_id}"
    description: "Get a site"
    roles: [PlatformAdmin, ComplianceOfficer, AllocationOfficer, LogisticsCoordinator, SiteCoordinator, EmergencyManager]
    code: 200
    input: []
    output: RecipientSite
    side_effects: []

  - method: GET
    path: "/medicine-relief/sites"
    description: "List sites (paginated, filterable)"
    roles: [PlatformAdmin, ComplianceOfficer, AllocationOfficer, LogisticsCoordinator, EmergencyManager]
    code: 200
    input: ["qualification_status?", "country_code?", "site_type?", "limit?", "offset?"]
    output: RecipientSite[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/sites/{site_id}/qualify"
    description: "Qualify a PENDING_REVIEW site"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecipientSite
    side_effects: ["qualification_status -> QUALIFIED, qualified_at set, increments RecipientSite.version by 1"]

  - method: POST
    path: "/medicine-relief/sites/{site_id}/suspend"
    description: "Suspend a QUALIFIED site; OCC via expected_site_version"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_site_version]
    output: RecipientSite
    side_effects: ["qualification_status -> SUSPENDED, cascades cancel requests and release reserved lines, increments RecipientSite.version by 1"]

  - method: POST
    path: "/medicine-relief/sites/{site_id}/reinstate"
    description: "Reinstate a SUSPENDED site"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecipientSite
    side_effects: ["qualification_status -> QUALIFIED, increments RecipientSite.version by 1"]

  - method: POST
    path: "/medicine-relief/sites/{site_id}/revoke"
    description: "Permanently revoke a site"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecipientSite
    side_effects: ["qualification_status -> REVOKED, cascades as suspend + cancels in-packing shipments, increments RecipientSite.version by 1"]

  # --- License ---
  - method: POST
    path: "/medicine-relief/licenses"
    description: "Register a license for a site"
    roles: [SiteCoordinator, ComplianceOfficer]
    code: 201
    input: [site_id, license_type, issuing_authority, license_number, expires_on]
    output: License
    side_effects: ["verification_status=PENDING"]

  - method: GET
    path: "/medicine-relief/licenses/{license_id}"
    description: "Get a license"
    roles: [ComplianceOfficer, SiteCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/medicine-relief/licenses"
    description: "List licenses (paginated, filterable)"
    roles: [ComplianceOfficer, SiteCoordinator, PlatformAdmin]
    code: 200
    input: ["site_id?", "verification_status?", "license_type?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/licenses/{license_id}/verify"
    description: "Verify a PENDING license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["verification_status -> VERIFIED, recompute site.active_license_count"]

  - method: POST
    path: "/medicine-relief/licenses/{license_id}/reject"
    description: "Reject a PENDING license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["verification_status -> REJECTED, recompute site.active_license_count"]

  # --- AllocationRequest ---
  - method: POST
    path: "/medicine-relief/allocation-requests"
    description: "Submit an allocation request"
    roles: [SiteCoordinator]
    code: 201
    input: [site_id, ndc_code, quantity_requested, justification_text, "emergency_event_id?"]
    output: AllocationRequest
    side_effects: ["status=SUBMITTED, requested_by_user_id=X-User-ID"]

  - method: GET
    path: "/medicine-relief/allocation-requests/{request_id}"
    description: "Get an allocation request"
    roles: [SiteCoordinator, AllocationOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: []

  - method: GET
    path: "/medicine-relief/allocation-requests"
    description: "List allocation requests (paginated, filterable)"
    roles: [SiteCoordinator, AllocationOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["site_id?", "status?", "ndc_code?", "emergency_event_id?", "limit?", "offset?"]
    output: AllocationRequest[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/allocation-requests/{request_id}/begin-review"
    description: "Move a SUBMITTED request to UNDER_REVIEW"
    roles: [AllocationOfficer]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/medicine-relief/allocation-requests/{request_id}/reject"
    description: "Reject an UNDER_REVIEW request"
    roles: [AllocationOfficer]
    code: 200
    input: ["rationale?"]
    output: AllocationRequest
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/medicine-relief/allocation-requests/{request_id}/cancel"
    description: "Site coordinator cancels their own SUBMITTED or UNDER_REVIEW request"
    roles: [SiteCoordinator]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["status -> CANCELLED"]

  # --- AllocationDecision ---
  - method: POST
    path: "/medicine-relief/allocation-decisions"
    description: "Create a DRAFT decision with one or more lot lines"
    roles: [AllocationOfficer]
    code: 201
    input: [request_id, rationale, lines]
    output: AllocationDecision
    side_effects: ["status=DRAFT, reviewer_user_id=X-User-ID, lines[] created with status=RESERVED only upon finalize"]

  - method: GET
    path: "/medicine-relief/allocation-decisions/{decision_id}"
    description: "Get a decision (includes lines)"
    roles: [AllocationOfficer, ComplianceOfficer, PlatformAdmin, SiteCoordinator]
    code: 200
    input: []
    output: AllocationDecision
    side_effects: []

  - method: GET
    path: "/medicine-relief/allocation-decisions"
    description: "List decisions (paginated, filterable)"
    roles: [AllocationOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: AllocationDecision[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/allocation-decisions/{decision_id}/finalize"
    description: "Finalize a DRAFT decision; commits quantities against lots; OCC via expected_request_version"
    roles: [AllocationOfficer]
    code: 200
    input: [expected_request_version]
    output: AllocationDecision
    side_effects: ["status -> FINALIZED, lines -> RESERVED, lots' quantity_committed increased, request transitions APPROVED/PARTIALLY_APPROVED, request.need_score computed, reservation_expires_at set, increments AllocationRequest.version by 1"]

  - method: POST
    path: "/medicine-relief/allocation-decisions/{decision_id}/void"
    description: "Void a DRAFT decision"
    roles: [AllocationOfficer]
    code: 200
    input: []
    output: AllocationDecision
    side_effects: ["status -> VOID"]

  # --- AllocationLine ---
  - method: GET
    path: "/medicine-relief/allocation-lines"
    description: "List allocation lines (paginated, filterable)"
    roles: [AllocationOfficer, ComplianceOfficer, LogisticsCoordinator, PlatformAdmin, SiteCoordinator]
    code: 200
    input: ["decision_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []

  - method: GET
    path: "/medicine-relief/allocation-lines/{line_id}"
    description: "Get a single allocation line"
    roles: [AllocationOfficer, ComplianceOfficer, LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/medicine-relief/shipments"
    description: "Create a PACKING shipment covering one FINALIZED decision's lines"
    roles: [LogisticsCoordinator]
    code: 201
    input: [allocation_decision_id, carrier_name, packed_with_cold_shipper]
    output: Shipment
    side_effects: ["status=PACKING, lines move RESERVED -> PICKED, lots' quantity_committed decreased"]

  - method: GET
    path: "/medicine-relief/shipments/{shipment_id}"
    description: "Get a shipment"
    roles: [LogisticsCoordinator, ComplianceOfficer, PlatformAdmin, SiteCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/medicine-relief/shipments"
    description: "List shipments (paginated, filterable)"
    roles: [LogisticsCoordinator, ComplianceOfficer, PlatformAdmin, SiteCoordinator]
    code: 200
    input: ["site_id?", "status?", "allocation_decision_id?", "customs_declaration_id?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/shipments/{shipment_id}/pack-complete"
    description: "Mark packing complete; computes temperature band; advances to AWAITING_CUSTOMS_DOCS (international) or READY_TO_DISPATCH (domestic)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["temperature_band computed and stored, status advances per is_international"]

  - method: POST
    path: "/medicine-relief/shipments/{shipment_id}/dispatch"
    description: "Dispatch a READY_TO_DISPATCH shipment"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DISPATCHED, dispatched_at set, lines -> SHIPPED, lot.quantity_shipped incremented"]

  - method: POST
    path: "/medicine-relief/shipments/{shipment_id}/confirm-delivery"
    description: "Site coordinator confirms delivery"
    roles: [SiteCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DELIVERED, delivered_at set, lines -> DELIVERED"]

  - method: POST
    path: "/medicine-relief/shipments/{shipment_id}/mark-delivery-failed"
    description: "Mark a DISPATCHED shipment as failed"
    roles: [LogisticsCoordinator]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["status -> DELIVERY_FAILED, lines -> FORFEITED, lot.quantity_shipped decremented, lot.quantity_expired incremented"]

  - method: POST
    path: "/medicine-relief/shipments/{shipment_id}/cancel"
    description: "Cancel a pre-dispatch shipment; returns lines to RESERVED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CANCELLED, PICKED lines -> RESERVED, lot.quantity_committed incremented"]

  # --- CustomsDeclaration ---
  - method: POST
    path: "/medicine-relief/customs-declarations"
    description: "Create a DRAFT customs declaration for an international shipment"
    roles: [LogisticsCoordinator]
    code: 201
    input: [shipment_id, hs_code, import_license_id]
    output: CustomsDeclaration
    side_effects: ["status=DRAFT, shipment.customs_declaration_id set"]

  - method: GET
    path: "/medicine-relief/customs-declarations/{declaration_id}"
    description: "Get a customs declaration"
    roles: [LogisticsCoordinator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CustomsDeclaration
    side_effects: []

  - method: GET
    path: "/medicine-relief/customs-declarations"
    description: "List customs declarations (paginated, filterable)"
    roles: [LogisticsCoordinator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["shipment_id?", "status?", "import_license_id?", "limit?", "offset?"]
    output: CustomsDeclaration[]
    side_effects: []

  - method: POST
    path: "/medicine-relief/customs-declarations/{declaration_id}/submit"
    description: "Submit a DRAFT declaration; computes declared_value_usd"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: CustomsDeclaration
    side_effects: ["status -> SUBMITTED, declared_value_usd computed and stored"]

  - method: POST
    path: "/medicine-relief/customs-declarations/{declaration_id}/clear"
    description: "Compliance clears a SUBMITTED declaration; shipment advances to READY_TO_DISPATCH"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CustomsDeclaration
    side_effects: ["status -> CLEARED, shipment AWAITING_CUSTOMS_DOCS -> READY_TO_DISPATCH"]

  - method: POST
    path: "/medicine-relief/customs-declarations/{declaration_id}/reject"
    description: "Compliance rejects a SUBMITTED declaration"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: CustomsDeclaration
    side_effects: ["status -> REJECTED, shipment remains AWAITING_CUSTOMS_DOCS"]

  # --- EmergencyEvent ---
  - method: POST
    path: "/medicine-relief/emergency-events"
    description: "Declare an emergency event"
    roles: [EmergencyManager]
    code: 201
    input: [event_name, severity, affected_country_codes, surge_window_ends_at]
    output: EmergencyEvent
    side_effects: ["status=DECLARED, declared_at set"]

  - method: GET
    path: "/medicine-relief/emergency-events/{event_id}"
    description: "Get an emergency event"
    roles: [EmergencyManager, AllocationOfficer, ComplianceOfficer, PlatformAdmin, SiteCoordinator]
    code: 200
    input: []
    output: EmergencyEvent
    side_effects: []

  - method: GET
    path: "/medicine-relief/emergency-events"
    description: "List emergency events (paginated, filterable)"
    roles: [EmergencyManager, AllocationOfficer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: EmergencyEvent[]
