            - "GET /shop/customers/${bare_id}/assets returns HTTP 200 with an empty array and total_count == 0"

      - name: success_and_error_envelopes_carry_the_declared_shape
        claim_type: standard_crud
        grounds:
          - response_envelope.success
          - response_envelope.error
          - errors[ERR_BENCH_NOT_FOUND]
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; a single-object read sets response_type 'object', a list read sets 'array', and a failure sets 'error' with data.error_id and data.message."
        test_recipe:
          setup:
            - "One bench so there is something to read successfully."
          setup_api_calls:
            - call: "POST /shop/benches"
