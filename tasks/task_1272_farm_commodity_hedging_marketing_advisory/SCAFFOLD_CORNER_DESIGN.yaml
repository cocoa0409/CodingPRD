  # ============================================================ errors
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope]
        distinguishing_aspect: "Every error body matches the fixed envelope: response_type == error and data carries error_id + message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advisory/buyers/11111111-2222-4333-8444-555555555555", as: CommodityAdvisor, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "response_type == error; data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
      - name: error_coverage_cap_exceeded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_COVERAGE_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: coverage_cap_nested_min_and_profile_branch
          rationale: "Asserted as the failure path of the named §1.8 instance (14001 > 14000 cap)."
      - name: error_buyer_not_approved_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUYER_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: contract_create_blocked_by_suspended_buyer
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_disclosure_stale_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCLOSURE_STALE]"]
        excluded_because:
          difficulty_instance: contract_create_disclosure_stale_beats_buyer_suspended
          rationale: "Asserted as the failure path of the named §1.8 instance (priority-7 vs priority-8 conflict)."
      - name: error_margin_call_outstanding_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARGIN_CALL_OUTSTANDING]"]
        excluded_because:
          difficulty_instance: recommendation_execute_blocked_by_margin_call
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_over_delivery_exceeded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVER_DELIVERY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: over_delivery_tolerance_equality_vs_excess
          rationale: "Asserted at the tolerance boundary in the named §1.8 instance."
      - name: error_delivery_window_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DELIVERY_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: buyer_delivery_windows_half_open_adjacency
          rationale: "Asserted on the one-day-intersection case in the named §1.8 instance."
      - name: error_storage_bin_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_STORAGE_BIN_OVERLAP]"]
        excluded_because:
          difficulty_instance: storage_bin_seven_day_buffer_gap
          rationale: "Asserted on the 5-day-gap case in the named §1.8 instance."
  # ============================================================ rbac
  - section: rbac
    instances:
      - name: grower_cannot_create_plan
        claim_type: role_exclusive_denied
        grounds: ["roles[CommodityAdvisor]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Marketing-plan authoring is advisor-exclusive; a Grower caller gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["operation with CERTIFIED baseline"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "RBAC Farm 1", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: Grower, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "ERR_FORBIDDEN_ROLE (403); no plan persisted"
      - name: advisor_cannot_approve_buyer
        claim_type: role_exclusive_denied
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Buyer approval is compliance-exclusive; a CommodityAdvisor caller gets ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one PROVISIONAL buyer"]
          setup_api_calls:
            - { call: "POST /advisory/buyers", payload: { name: "RBAC Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
          trigger:
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "ERR_FORBIDDEN_ROLE (403); buyer remains PROVISIONAL"
      - name: grower_cannot_certify_other_operations_baseline
        claim_type: role_exclusive_denied
        grounds: ["roles[Grower]", "errors[ERR_RESOURCE_NOT_OWNED]"]
        distinguishing_aspect: "Grower identity is entity-backed: certifying a baseline owned by a different operation id yields ERR_RESOURCE_NOT_OWNED (403) even though the role is correct."
        test_recipe:
          setup: ["operations A and B; baseline of A is PROVISIONAL"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Owner A", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_a: $.data.id, op_a_v: $.data.version } }
            - { call: "POST /advisory/operations", payload: { name: "Owner B", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_b: $.data.id } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_a}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_a_v}" }, as: CommodityAdvisor, captures: { bl_a: $.data.id } }
          trigger:
            - { call: "POST /advisory/production-baselines/${bl_a}/certify", as: Grower, as_user_id: "${op_b}", captures: { err: $.data.error_id } }
          assert:
            - "ERR_RESOURCE_NOT_OWNED (403); baseline stays PROVISIONAL"
      - name: missing_auth_header_returns_unauthenticated
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without a recognized X-User-Role fails authentication at priority 1 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/operations", payload: { name: "Anon Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "ERR_UNAUTHENTICATED (401) — auth precedes role, schema, and existence checks"
      - name: certify_with_same_user_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the agreement's submitting advisor (submitted_by_user_id == adv_1) may not also certify it; a different ComplianceOfficer id succeeds."
        test_recipe:
          setup: ["Two ACTIVE agreements A and B for one operation, both submitted by advisor adv_1, both disclosures ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "SoD Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: PER_BUSHEL, rate_per_bushel: 0.02 }, as: CommodityAdvisor, captures: { ag_a: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/submit", as: CommodityAdvisor, as_user_id: adv_1 }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/deliver-disclosure", as: CommodityAdvisor, as_user_id: adv_1 }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 2000 }, as: CommodityAdvisor, captures: { ag_b: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/submit", as: CommodityAdvisor, as_user_id: adv_1 }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/deliver-disclosure", as: CommodityAdvisor, as_user_id: adv_1 }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/sign", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/advisory-agreements/${ag_a}/certify-compliance", as: ComplianceOfficer, as_user_id: comp_1, captures: { ok: $.data.compliance_certified } }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/certify-compliance", as: ComplianceOfficer, as_user_id: adv_1, captures: { err: $.data.error_id } }
          assert:
            - "Certify by comp_1 (different from submitter adv_1): compliance_certified == true"
            - "Certify by adv_1 (same user id as submitted_by_user_id): ERR_SEGREGATION_OF_DUTIES (403)"

  # ============================================================ cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: plan_amend_stale_version_rejected_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-amend-stale-version]"]
        distinguishing_aspect: "PUT with the version observed at read succeeds and bumps version 1 -> 2; replaying the same expected version is then rejected ERR_STALE_VERSION (412) — the stale writer's premise has moved."
        test_recipe:
          setup: ["Operation with PROVISIONAL baseline and a DRAFT marketing plan (version 1)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "OCC Farm 1", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id, plan_v: $.data.version } }
          trigger:
            - { call: "PUT /advisory/marketing-plans/${plan_id}", payload: { expected_marketing_plan_version: "${plan_v}", max_priced_pct: 0.75 }, as: CommodityAdvisor, captures: { v2: $.data.version, mpp: $.data.max_priced_pct } }
            - { call: "PUT /advisory/marketing-plans/${plan_id}", payload: { expected_marketing_plan_version: "${plan_v}", max_priced_pct: 0.70 }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "First amend: 200, version == 2, max_priced_pct == 0.75"
            - "Second amend with the same (now stale) expected version: ERR_STALE_VERSION (412); max_priced_pct remains 0.75"
      - name: baseline_create_stale_operation_rejected_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[baseline-create-stale-operation]"]
        distinguishing_aspect: "Baseline creation supersedes the operation's live baseline, so it is OCC-guarded on GrowerOperation.version: a create carrying the pre-supersede version is rejected 412; retrying with the fresh version succeeds and supersedes."
        test_recipe:
          setup: ["Operation (version 1) with baseline B1 created (operation now version 2)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "OCC Farm 2", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { b1: $.data.id } }
            - { call: "GET /advisory/operations/${op_id}", as: CommodityAdvisor, captures: { op_v2: $.data.version } }
          trigger:
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 110, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 110, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v2}" }, as: CommodityAdvisor, captures: { b2: $.data.id } }
            - { call: "GET /advisory/production-baselines/${b1}", as: CommodityAdvisor, captures: { b1_st: $.data.status } }
          assert:
            - "Create with stale expected_operation_version: ERR_STALE_VERSION (412), nothing superseded"
            - "Retry with fresh version: 201; B1 is now SUPERSEDED and B2 PROVISIONAL"
      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.MarketingPlan]
        distinguishing_aspect: "Every mutation (amend, activate, suspend, resume) advances MarketingPlan.version by exactly 1: 1 -> 2 -> 3 -> 4 -> 5."
        test_recipe:
          setup: ["Full ACTIVE plan on an AGGRESSIVE operation"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Ver Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /advisory/marketing-plans/${plan_id}", payload: { expected_marketing_plan_version: "${v1}", max_priced_pct: 0.95 }, as: CommodityAdvisor, captures: { v2: $.data.version } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor, captures: { v3: $.data.version } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/suspend", as: CommodityAdvisor, captures: { v4: $.data.version } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/resume", as: CommodityAdvisor, captures: { v5: $.data.version } }
          assert:
            - "Versions: create 1, amend 2, activate 3, suspend 4, resume 5 — exactly +1 per mutation"
      - name: margin_call_strict_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.margin_accounting]
        distinguishing_aspect: "The call rule is strict less-than: equity exactly equal to maintenance (11000.00) does NOT trigger a call; one tick cent further (equity 10500.00) does."
        test_recipe:
          setup: ["BALANCED operation expected 200000, ACTIVE plan, account funded 20000.00, position 50000 bu OPEN @4.50 (MM 11000.00)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Thresh Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/margin-accounts", payload: { operation_id: "${op_id}", initial_funding: 20000 }, as: CommodityAdvisor, captures: { acct: $.data.id } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.50, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 50000 }, as: CommodityAdvisor, captures: { rec: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations/${rec}/accept", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/hedge-recommendations/${rec}/execute", as: CommodityAdvisor }
          trigger:
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.68, kind: SETTLEMENT, price_date: "2026-07-01" }, as: PlatformAdmin }
            - { call: "GET /advisory/margin-accounts/${acct}", as: CommodityAdvisor, captures: { st_eq: $.data.status, eq_eq: $.data.margin_equity } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.69, kind: SETTLEMENT, price_date: "2026-07-02" }, as: PlatformAdmin }
            - { call: "GET /advisory/margin-accounts/${acct}", as: CommodityAdvisor, captures: { st_lo: $.data.status, call_lo: $.data.margin_call_amount } }
          assert:
            - "At 4.68: equity == 11000.00 == maintenance -> status stays FUNDED, margin_call_amount == 0.00 (strict <)"
            - "At 4.69: equity 10500.00 < 11000.00 -> CALL_OUTSTANDING with margin_call_amount == 4500.00"
      - name: suspended_plan_skips_target_triggers
        claim_type: cascading_side_effects
        grounds: [state_machines.MarketingPlan.ACTIVE_to_SUSPENDED, state_machines.PriceTarget.PENDING_to_TRIGGERED]
        distinguishing_aspect: "The tick cascade is gated by plan state: while SUSPENDED a qualifying tick leaves the target PENDING and mints nothing; after resume, the next qualifying tick fires it."
        test_recipe:
          setup: ["ACTIVE plan (BALANCED, expected 20000) with PENDING target 4.80/5000 @2026-12; plan then SUSPENDED"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Gate Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.80, increment_bushels: 5000 }, as: CommodityAdvisor, captures: { tgt: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/suspend", as: CommodityAdvisor }
          trigger:
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.90, kind: QUOTE, price_date: "2026-05-02" }, as: PlatformAdmin }
            - { call: "GET /advisory/price-targets/${tgt}", as: CommodityAdvisor, captures: { st_susp: $.data.status } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/resume", as: CommodityAdvisor }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.91, kind: QUOTE, price_date: "2026-05-03" }, as: PlatformAdmin }
            - { call: "GET /advisory/price-targets/${tgt}", as: CommodityAdvisor, captures: { st_live: $.data.status } }
          assert:
            - "Tick 4.90 during SUSPENDED: target stays PENDING (cascade gated off)"
            - "After resume, tick 4.91: target TRIGGERED with a PROPOSED recommendation minted"
      - name: dual_variant_layer_stub
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: expected_bushels_aph_vs_trend_diverge
          rationale: "Layer behavior asserted by the three dual_variant_calc §1.8 instances (bushels, benchmark, fee)."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the contract-create response already reflects computed state and a follow-up GET of the plan shows committed_contract_bushels updated in the same request flow — no delay, no rebuild endpoint."
        test_recipe:
          setup: ["AGGRESSIVE operation expected 20000, ACTIVE plan max 1.00, buyer APPROVED"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Cons Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Cons Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 7500, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_ps: $.data.pricing_status } }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { com: $.data.committed_contract_bushels, uncom: $.data.uncommitted_bushels, priced: $.data.priced_contract_bushels } }
