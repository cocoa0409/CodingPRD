  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: assignment_admitted_at_exactly_100_pct_projected_utilization
        grounds:
          - calculations.analyst_workload_variants
          - validations[priority=25]
          - errors[ERR_ANALYST_CAPACITY_EXCEEDED]
          - entities.Analyst.fields.weekly_capacity_hours
          - entities.Analyst.fields.training_hours_per_week
        distinguishing_aspect: |
          The capacity gate is inclusive at the ceiling: with available_hours exactly 16.00,
          a 16.00-hour request lands at projected_utilization_pct 100.00 and is ADMITTED, while a
          16.50-hour request on an identically configured analyst computes 103.13 and is refused
          with ERR_ANALYST_CAPACITY_EXCEEDED - the tested boundary is a percentage-of-capacity
          ceiling compared with <=, not a threshold trigger compared with >=.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst AEXACT: CHEMISTRY, competency 4, weekly_capacity_hours 20.00, training_hours_per_week 4.00 -> available_hours 16.00, assigned_casework_hours 0.00."
            - "Analyst AOVER: identical configuration -> available_hours 16.00, assigned_casework_hours 0.00."
            - "Method MA VALIDATED, CHEMISTRY, standard_hours_per_item 8.00, min_competency_level 3, max_items_per_request 10."
            - "Method MB VALIDATED, CHEMISTRY, standard_hours_per_item 16.50, min_competency_level 3, max_items_per_request 10."
