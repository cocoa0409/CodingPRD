  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: late_arrival_cascades_miss_across_two_connections
        grounds:
          - state_machines.TripLeg.PLANNED_to_MISSED
          - state_machines.TripLeg.EN_ROUTE_to_COMPLETED
          - calculations.connection_window
          - entities.Shipment.fields.total_missed_connections
        distinguishing_aspect: |
          Depth-3 chain from ONE CarEvent trigger: YARD_ARRIVAL at C
          (leg1 EN_ROUTE -> COMPLETED) fires connection_window, whose slack
          540 < cutoff 600 misses leg2 (PLANNED -> MISSED), whose own side
          effect misses leg3 (PLANNED -> MISSED), whose mutation flips
          Shipment.trip_plan_status and raises the MISSED_CONNECTION
          exception — each link caused by the previous link's mutation.
        test_recipe:
          setup:
            - "Yards TC-A, TC-C, TC-D, TC-E. Plans: TP1 A->C dep 2026-09-01T08:00:00Z cutoff 60; TP2 C->D dep 2026-09-02T08:30:00Z cutoff 600; TP3 D->E dep 2026-09-03T10:00:00Z cutoff 120. All ACTIVE."
            - "Shipment TS (3 cars, committed 1400 miles) assigned [TP1, TP2, TP3] at clock 2026-09-01T07:00:00Z."
            - "TP1 departure finalized on time 08:00; TRAIN_DEPARTURE event at A 08:00."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
