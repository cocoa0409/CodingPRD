        distinguishing_aspect: "A booking debit bumps pack.version after the client read it; a refund carrying the stale expected_pack_version is rejected ERR_STALE_PACK_VERSION (412)."
        test_recipe:
          setup: ["A CLASS_PACK whose version the client captures, then a booking debit bumps it; refund uses the stale version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
