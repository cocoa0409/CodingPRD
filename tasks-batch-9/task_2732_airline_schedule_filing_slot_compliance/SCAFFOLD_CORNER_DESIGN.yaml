      - name: reference_reads_are_open_to_all_six_roles_with_an_identical_body
        claim_type: role_allowed
        grounds:
          - endpoints.GET_slot_holdings_slot_holding_id
          - roles.PartnerCarrier
        distinguishing_aspect: |
          GET /slot-holdings/{id} lists all six roles, so the partner carrier and the filing agent must
          read the home carrier's series and get byte-identical entity payloads — read visibility is NOT
          narrowed by ownership on this endpoint even though writes are. An implementation that reuses the
          write-side ownership filter for reads makes PartnerCarrier 403 or 404 here.
        test_recipe:
          setup:
            - "Two carriers HX (DE, home) and XP (PT, partner); FRA LEVEL_3_COORDINATED; Season W26 OPEN; one HX-owned HELD FRA departure series with historic_precedence true."
          setup_api_calls:
            - call: "POST /carriers"
