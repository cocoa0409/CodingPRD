  # ==================================================================
  # Rule 2: combinatorial_formula — different modes (a) / (b) / (c)
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_fee_tiered_thresholds_mode_a
        grounds:
          - calculations.cancellation_fee
          - entities.Booking.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Mode (a): the formula takes >=3 inputs (hours-until-start H,
          booked chair-minutes, per_minute_rate_cents) with tiered-rate
          selection across four thresholds (24/72/168) — non-linear
          interaction. Distinct from Rule 2's other instance, which uses
          mode (b) nested rounding.
        test_recipe:
          setup:
            - "Region R0 active"
            - "CorporateAccount ACME with large credit limit"
            - "Therapist T1 ACTIVE licensed in R0, max_minutes_per_day=2000"
            - "Booking B1: EVENT 2026-06-10 window 600..720, 1 chair, slot_minutes=15, per_minute_rate_cents=200"
            - "B1 driven to CONFIRMED with 8 CLAIMED claims (no waiver/check-in — just claims)"
            - "booked_chair_minutes = 8 * 15 = 120; committed value B = 120 * 200 = 24000"
            - "Logical clock is set to 2026-06-09T22:00:00Z (12h before event start at 2026-06-10T10:00:00Z local — i.e. H = 12)"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "ap@acme.test", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R1", recipient_email: "r1@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R2", recipient_email: "r2@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}" }
