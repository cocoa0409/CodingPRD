            - "err == ERR_SLOT_OVERLAP for the 10:15-10:45 slot"
            - "Provider now has exactly 3 slots with status OPEN"

      - name: attribution_window_exactly_90_days
        grounds:
          - calculations.calc_attribution_window
          - entities.Booking.fields.attribution_status
        distinguishing_aspect: |
          Interval semantics = closed-lower / open-upper 90-day lookback on the
          Booking attribution resource (different semantics and entity than the
          half-open slot overlap): a ContactEvent at exactly created_at - 90 days
          is INSIDE the window (ORGANIC, no charge), one second earlier is
          OUTSIDE (ATTRIBUTED, charge created with fee 1500).
        test_recipe:
          setup:
            - "Bookable PER_BOOKING practice/provider with type copay 10000 and two slots"
            - "Patient A has a ContactEvent at 2026-06-03T00:00:00Z (exactly 90 days before the default clock 2026-09-01T00:00:00Z)"
            - "Patient B has a ContactEvent at 2026-06-02T23:59:59Z (one second outside)"
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T11:00:00Z", end_at: "2026-09-03T11:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s2: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat A", email: "pa@x.com" }
              as: Anonymous
              captures: { patA: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat B", email: "pb@x.com" }
              as: Anonymous
              captures: { patB: $.data.id }
            - call: "POST /marketplace/contact-events"
              payload: { patient_id: "${patA}", provider_id: "${prov_id}", contacted_at: "2026-06-03T00:00:00Z", channel: "PHONE" }
              as: PracticeStaff
              as_user_id: "${p_id}"
            - call: "POST /marketplace/contact-events"
              payload: { patient_id: "${patB}", provider_id: "${prov_id}", contacted_at: "2026-06-02T23:59:59Z", channel: "PHONE" }
              as: PracticeStaff
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${patA}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${patA}"
              captures: { bA: $.data.id, attrA: $.data.attribution_status }
            - call: "POST /marketplace/slots/${s2}/bookings"
              payload: { patient_id: "${patB}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${patB}"
              captures: { bB: $.data.id, attrB: $.data.attribution_status }
            - call: "GET /marketplace/charges?booking_id=${bA}"
              payload: {}
              as: OpsAdmin
            - call: "GET /marketplace/charges?booking_id=${bB}"
              payload: {}
              as: OpsAdmin
              captures: { feeB: "$.data[0].marketplace_fee_cents" }
          assert:
            - "attrA == ORGANIC (exactly 90 days is inside the closed-lower window) and no Charge exists for booking ${bA}"
            - "attrB == ATTRIBUTED and its charge has marketplace_fee_cents == 1500"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: slot_supply_book_cancel_round_trip
        grounds:
          - state_machines.Slot
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = the provider's OPEN-slot count: booking then
          cancelling is a compensating pair that returns the slot to OPEN with
          current_booking_id null; the OPEN count before booking equals the OPEN
          count after cancelling, while Slot.version records both mutations
          (1 -> 2 -> 3).
        test_recipe:
          setup:
            - "Bookable practice/provider with type and exactly one OPEN slot"
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id, v1: $.data.version }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
            - call: "GET /marketplace/slots?provider_id=${prov_id}&status=OPEN"
              payload: {}
              as: Any
              captures: { open_list_booked: $.data }
            - call: "POST /marketplace/bookings/${b1}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "GET /marketplace/slots/${s1}"
              payload: {}
              as: Any
              captures: { st: $.data.status, cb: $.data.current_booking_id, v3: $.data.version }
            - call: "GET /marketplace/slots?provider_id=${prov_id}&status=OPEN"
              payload: {}
              as: Any
              captures: { open_list_after: $.data }
          assert:
            - "open_list_booked has total_count 0 (the only slot is BOOKED)"
            - "st == OPEN and cb == null and v3 == v1 + 2"
            - "open_list_after has total_count 1 — the conserved OPEN-slot count equals the pre-booking count"
            - "The compensating pair leaves zero drift: no slot created or destroyed, only status/version mutated"

      - name: invoice_ledger_conservation_through_dispute_credit_and_payment
        grounds:
          - state_machines.Invoice
          - state_machines.Charge
          - calculations.calc_invoice_aggregate
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Conserved quantity = invoice ledger balance (money, different type
          than slot count): at every step amount_due_cents == sum(LedgerEntry
          .amount_cents); a REMOVE resolution posts a -1500 DISPUTE_CREDIT and
          the subsequent payment of -1500 drives the sum to exactly 0 with the
          invoice PAID and the charges split REFUNDED/SETTLED.
        test_recipe:
          setup:
            - "Practice with two ATTRIBUTED bookings (copay 10000 each, fees 1500 each) swept into one invoice (2 charges, tier 0)"
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T11:00:00Z", end_at: "2026-09-03T11:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s2: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
            - call: "POST /marketplace/slots/${s2}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b2: $.data.id }
            - call: "POST /marketplace/billing/generate-invoices"
              payload: { practice_id: "${p_id}", period: "2026-09" }
              as: OpsAdmin
              captures: { inv_id: $.data.id, due0: $.data.amount_due_cents }
            - call: "GET /marketplace/charges?invoice_id=${inv_id}"
              payload: {}
              as: OpsAdmin
              captures: { c1: "$.data[0].id", c2: "$.data[1].id" }
          trigger:
            - call: "POST /marketplace/invoices/${inv_id}/dispute"
              payload: { charge_ids: ["${c1}"], reason: "patient already knew us" }
              as: PracticeStaff
              as_user_id: "${p_id}"
            - call: "POST /marketplace/invoices/${inv_id}/resolve-dispute"
              payload: { resolutions: [{ charge_id: "${c1}", action: "REMOVE" }] }
              as: OpsAdmin
              captures: { due1: $.data.amount_due_cents }
            - call: "POST /marketplace/invoices/${inv_id}/pay"
              payload: {}
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { final_status: $.data.status, due2: $.data.amount_due_cents }
            - call: "GET /marketplace/ledger-entries?invoice_id=${inv_id}"
              payload: {}
              as: OpsAdmin
              captures: { entries: $.data }
            - call: "GET /marketplace/charges/${c1}"
              payload: {}
              as: OpsAdmin
              captures: { c1_status: $.data.status }
            - call: "GET /marketplace/charges/${c2}"
              payload: {}
              as: OpsAdmin
              captures: { c2_status: $.data.status }
          assert:
            - "due0 == 3000 (2 x 1500, charge_count 2 -> tier 0.00)"
            - "due1 == 1500 after the -1500 DISPUTE_CREDIT (amount_due_cents == sum of ledger entries at every step)"
            - "final_status == PAID and due2 == 0 and sum(entries.amount_cents) == 0"
            - "entries contains CHARGE_FEE +1500 x2, DISPUTE_CREDIT -1500, PAYMENT -1500"
            - "c1_status == REFUNDED and c2_status == SETTLED"
