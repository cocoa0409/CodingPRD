              as: ChapterOfficer
              as_user_id: "${cw}"
              captures: { iw: $.data.id }
            - call: "POST /rush/invitations/${iw}/accept"
              payload: {}
              as: PNM
              as_user_id: "${u1}"
            - call: "POST /rush/parties/${pw}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${cw}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${u1}", chapter_id: "${cw}", rank: 1 }
              as: PNM
              as_user_id: "${u1}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${u1}", chapter_id: "${cw}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${cw}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
