            - "CutListLine.${lcap}.waste_pct == 0.11 and required_board_feet == 22.20 (SPF_NO2 at 20 ft: raw 0.08+0.04 = 0.12 clamped by WASTE_CAP 0.11)"
            - "CutList.${cl_msr}.total_board_feet == 312.81 and total_pieces == 25 and total_plates == 28"
            - "CutList.${cl_no2}.total_board_feet == 22.20"

      - name: cut_list_total_rounding_order
        grounds:
