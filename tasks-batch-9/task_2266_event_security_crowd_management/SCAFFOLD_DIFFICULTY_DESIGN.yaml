scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: threat_score_preliminary_expected_vs_final_ticketed
        grounds:
          - calculations.composite_threat_score
          - calculations.risk_tier
          - calculations.required_staff_matrix
          - calculations.screening_lane_requirement
          - entities.RiskAssessment.fields.attendance_basis
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
          - state_machines.RiskAssessment.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The RiskAssessment variant pair diverges on the ATTENDANCE BASIS: the preliminary variant scores the
          expected (pre-sale) attendance at SUBMIT, the final variant re-scores the confirmed ticketed attendance
          at APPROVE, so the same assessment row moves from composite_threat_score 62.50 / T3 / 5 required staff
          to 74.50 / T4 / 27 required staff without any analyst input changing.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z"
            - "Venue with gross_capacity 8000 and door_count 1"
            - "SecurityEvent in PLANNING with expected_attendance 400 and ticketed_attendance still null"
            - "RiskAssessment in DRAFT with threat HIGH, protest LIKELY, crowd_profile GENERAL_ADMISSION, layout_complexity_score 2, history_incident_rate 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/security-events"
              payload: { venue_id: "${venue_id}", event_name: "Autumn Gala", event_type: "CONCERT", doors_open_at: "2026-09-12T17:00:00Z", event_start_at: "2026-09-12T18:30:00Z", event_end_at: "2026-09-12T22:30:00Z", expected_attendance: 400, alcohol_served: false, vip_present: false }
              as: SecurityDirector
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /event-security/security-events/${event_id}/risk-assessments"
              payload: { threat_level_input: "HIGH", protest_likelihood: "LIKELY", crowd_profile: "GENERAL_ADMISSION", ingress_door_count: 1, layout_complexity_score: 2, history_incident_rate: 0 }
              as: RiskAnalyst
              as_user_id: "analyst-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "SUBMIT" }
              as: RiskAnalyst
              as_user_id: "analyst-1"
            - call: "PATCH /event-security/security-events/${event_id}"
              payload: { expected_event_version: "${event_v}", ticketed_attendance: 3600 }
              as: SecurityDirector
              as_user_id: "director-1"
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "APPROVE" }
              as: SecurityDirector
              as_user_id: "director-1"
          assert:
            - "after SUBMIT: RiskAssessment.${ra_id}.attendance_basis == EXPECTED"
            - "after SUBMIT: RiskAssessment.${ra_id}.score_basis_attendance == 400"
            - "after SUBMIT: RiskAssessment.${ra_id}.composite_threat_score == 62.50"
            - "after SUBMIT: RiskAssessment.${ra_id}.risk_tier == T3"
            - "after SUBMIT: RiskAssessment.${ra_id}.required_line_guards == 4"
            - "after SUBMIT: RiskAssessment.${ra_id}.required_supervisors == 1"
            - "after SUBMIT: RiskAssessment.${ra_id}.required_total_staff == 5"
            - "after SUBMIT: RiskAssessment.${ra_id}.required_screening_lanes == 2"
            - "after SUBMIT: RiskAssessment.${ra_id}.minimum_staffing_cost_floor_cents == 36000"
            - "after APPROVE: RiskAssessment.${ra_id}.attendance_basis == TICKETED"
            - "after APPROVE: RiskAssessment.${ra_id}.score_basis_attendance == 3600"
            - "after APPROVE: RiskAssessment.${ra_id}.composite_threat_score == 74.50"
            - "after APPROVE: RiskAssessment.${ra_id}.risk_tier == T4"
            - "after APPROVE: RiskAssessment.${ra_id}.required_perimeter_guards == 7"
            - "after APPROVE: RiskAssessment.${ra_id}.required_ingress_guards == 6"
            - "after APPROVE: RiskAssessment.${ra_id}.required_floor_guards == 8"
            - "after APPROVE: RiskAssessment.${ra_id}.required_exit_guards == 3"
            - "after APPROVE: RiskAssessment.${ra_id}.required_line_guards == 24"
            - "after APPROVE: RiskAssessment.${ra_id}.required_supervisors == 3"
            - "after APPROVE: RiskAssessment.${ra_id}.required_total_staff == 27"
            - "after APPROVE: RiskAssessment.${ra_id}.required_screening_lanes == 9"
            - "after APPROVE: RiskAssessment.${ra_id}.minimum_staffing_cost_floor_cents == 194400"
            - "after APPROVE: SecurityEvent.${event_id}.status == RISK_ASSESSED"

      - name: density_effective_level_instantaneous_vs_rolling_window
        grounds:
          - calculations.crowd_density_classification
          - entities.DensityReading.fields.effective_level
          - entities.DensityReading.fields.rolling_mean_persons_per_sqm
          - calculations.event_gate_posture
        distinguishing_aspect: |
          The DensityReading variant pair diverges on the WINDOW SIZE available for the (event_id, zone_id) pair:
          two readings of the identical instantaneous density 4.500 persons/sqm produce effective_level AMBER in
          the zone that already holds two calmer readings (rolling variant) and effective_level CRITICAL in the
          zone whose reading is its first (instantaneous variant), and only the second one moves the event's
          gate_posture.
        test_recipe:
          setup:
            - "logical clock at 2026-09-12T18:10:00Z"
            - "Venue with two zones: ZI (floor_area_sqm 100, posted_capacity 150, exit_units 2) and ZF (floor_area_sqm 200, posted_capacity 300, exit_units 3)"
            - "SecurityEvent in PLANNING at that venue with no readings recorded yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/venues/${venue_id}/zones"
              payload: { zone_code: "ZI", zone_type: "CONCOURSE", floor_area_sqm: 100, posted_capacity: 150, exit_units: 2, post_slot_capacity: 12, is_ingress_zone: true }
              as: SecurityDirector
              captures: { zi_id: $.data.id }
            - call: "POST /event-security/venues/${venue_id}/zones"
              payload: { zone_code: "ZF", zone_type: "FLOOR", floor_area_sqm: 200, posted_capacity: 300, exit_units: 3, post_slot_capacity: 12, is_ingress_zone: false }
              as: SecurityDirector
              captures: { zf_id: $.data.id }
            - call: "POST /event-security/security-events"
              payload: { venue_id: "${venue_id}", event_name: "Autumn Gala", event_type: "CONCERT", doors_open_at: "2026-09-12T17:00:00Z", event_start_at: "2026-09-12T18:30:00Z", event_end_at: "2026-09-12T22:30:00Z", expected_attendance: 200, alcohol_served: false, vip_present: false }
              as: SecurityDirector
              captures: { event_id: $.data.id }
            - call: "POST /event-security/security-events/${event_id}/density-readings"
              payload: { zone_id: "${zi_id}", observed_at: "2026-09-12T17:50:00Z", observed_occupancy: 100 }
              as: SecurityDirector
              as_user_id: "director-1"
              captures: { zi_r1: $.data.id }
            - call: "POST /event-security/security-events/${event_id}/density-readings"
              payload: { zone_id: "${zi_id}", observed_at: "2026-09-12T17:55:00Z", observed_occupancy: 150 }
              as: SecurityDirector
              as_user_id: "director-1"
              captures: { zi_r2: $.data.id }
          trigger:
            - call: "POST /event-security/security-events/${event_id}/density-readings"
              payload: { zone_id: "${zi_id}", observed_at: "2026-09-12T18:00:00Z", observed_occupancy: 450 }
              as: SecurityDirector
              as_user_id: "director-1"
              captures: { zi_r3: $.data.id }
            - call: "GET /event-security/security-events/${event_id}"
              payload: {}
              as: SecurityDirector
            - call: "POST /event-security/security-events/${event_id}/density-readings"
              payload: { zone_id: "${zf_id}", observed_at: "2026-09-12T18:05:00Z", observed_occupancy: 900 }
              as: SecurityDirector
              as_user_id: "director-1"
              captures: { zf_r1: $.data.id }
          assert:
            - "DensityReading.${zi_r3}.density_persons_per_sqm == 4.500"
            - "DensityReading.${zi_r3}.instantaneous_level == CRITICAL"
            - "DensityReading.${zi_r3}.rolling_mean_persons_per_sqm == 2.333"
            - "DensityReading.${zi_r3}.rolling_level == AMBER"
            - "DensityReading.${zi_r3}.effective_level == AMBER"
            - "DensityReading.${zi_r3}.occupancy_ratio == 3.000"
            - "SecurityEvent.${event_id}.gate_posture == OPEN immediately after the ZI third reading"
            - "DensityReading.${zf_r1}.density_persons_per_sqm == 4.500"
            - "DensityReading.${zf_r1}.instantaneous_level == CRITICAL"
            - "DensityReading.${zf_r1}.rolling_mean_persons_per_sqm == 4.500"
            - "DensityReading.${zf_r1}.effective_level == CRITICAL"
            - "DensityReading.${zf_r1}.occupancy_ratio == 3.000"
            - "SecurityEvent.${event_id}.gate_posture == RESTRICTED immediately after the ZF first reading"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: threat_score_density_and_history_caps_applied_before_multiplication
        grounds:
          - calculations.composite_threat_score
          - calculations.risk_tier
          - calculations.required_staff_matrix
          - calculations.supervisor_span_requirement
        distinguishing_aspect: |
          This instance pins EVALUATION ORDER around two independent caps: DENSITY_PRESSURE_CAP is applied to the
          rounded density term BEFORE it enters base_points and CROWD_FACTOR_CAP is applied BEFORE the
          multiplication, giving composite_threat_score 37.80; the naive reading that multiplies the uncapped
          33.00 base by the uncapped 1.48 crowd factor yields 48.84.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z"
            - "Venue with gross_capacity 8000 and door_count 1"
            - "SecurityEvent with expected_attendance 8000 (load_ratio exactly 1.00, driving the raw density term to 30.00 against a cap of 25)"
            - "RiskAssessment in DRAFT with history_incident_rate 12.00 (raw crowd factor 1.48 against a cap of 1.35) and every other point source at zero except layout_complexity_score 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/security-events"
              payload: { venue_id: "${venue_id}", event_name: "Sellout Night", event_type: "CONCERT", doors_open_at: "2026-09-12T17:00:00Z", event_start_at: "2026-09-12T18:30:00Z", event_end_at: "2026-09-12T22:30:00Z", expected_attendance: 8000, alcohol_served: false, vip_present: false }
              as: SecurityDirector
              captures: { event_id: $.data.id }
            - call: "POST /event-security/security-events/${event_id}/risk-assessments"
              payload: { threat_level_input: "LOW", protest_likelihood: "NONE", crowd_profile: "SEATED", ingress_door_count: 1, layout_complexity_score: 1, history_incident_rate: 12.00 }
              as: RiskAnalyst
              as_user_id: "analyst-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "SUBMIT" }
              as: RiskAnalyst
              as_user_id: "analyst-1"
          assert:
            - "RiskAssessment.${ra_id}.composite_threat_score == 37.80"
            - "RiskAssessment.${ra_id}.composite_threat_score != 48.84"
            - "RiskAssessment.${ra_id}.risk_tier == T2"
            - "RiskAssessment.${ra_id}.required_perimeter_guards == 6"
            - "RiskAssessment.${ra_id}.required_ingress_guards == 5"
            - "RiskAssessment.${ra_id}.required_floor_guards == 7"
            - "RiskAssessment.${ra_id}.required_exit_guards == 2"
            - "RiskAssessment.${ra_id}.required_line_guards == 20"
            - "RiskAssessment.${ra_id}.required_supervisors == 2"
            - "RiskAssessment.${ra_id}.required_total_staff == 22"
            - "RiskAssessment.${ra_id}.required_screening_lanes == 18"
            - "RiskAssessment.${ra_id}.minimum_staffing_cost_floor_cents == 158400"

      - name: required_staff_matrix_ceil_per_share_before_summation
        grounds:
          - calculations.required_staff_matrix
          - calculations.supervisor_span_requirement
          - calculations.screening_lane_requirement
          - calculations.minimum_staffing_cost_floor
        distinguishing_aspect: |
          This instance pins ROUNDING ORDER on a four-way split: each post-type share of raw_line 10.5000 is
          ceil()'d independently and the four ceilings are summed to 13 line guards, whereas rounding the total
          first (ceil(10.5) = 11) and splitting that integer yields 11 — a two-guard, one-supervisor difference
          that also moves required_total_staff from 12 to 15.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z"
            - "Venue with gross_capacity 8000 and door_count 1"
            - "SecurityEvent with expected_attendance 2625 so that tier T3 gives raw_line exactly 10.5000"
            - "RiskAssessment in DRAFT with threat ELEVATED, protest LIKELY, crowd_profile GENERAL_ADMISSION, layout_complexity_score 2, history_incident_rate 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/security-events"
              payload: { venue_id: "${venue_id}", event_name: "Derby Match", event_type: "SPORTING", doors_open_at: "2026-09-12T17:00:00Z", event_start_at: "2026-09-12T18:30:00Z", event_end_at: "2026-09-12T22:30:00Z", expected_attendance: 2625, alcohol_served: false, vip_present: false }
              as: SecurityDirector
              captures: { event_id: $.data.id }
            - call: "POST /event-security/security-events/${event_id}/risk-assessments"
              payload: { threat_level_input: "ELEVATED", protest_likelihood: "LIKELY", crowd_profile: "GENERAL_ADMISSION", ingress_door_count: 1, layout_complexity_score: 2, history_incident_rate: 0 }
              as: RiskAnalyst
              as_user_id: "analyst-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "SUBMIT" }
              as: RiskAnalyst
              as_user_id: "analyst-1"
          assert:
            - "RiskAssessment.${ra_id}.composite_threat_score == 58.84"
            - "RiskAssessment.${ra_id}.risk_tier == T3"
            - "RiskAssessment.${ra_id}.required_perimeter_guards == 4"
            - "RiskAssessment.${ra_id}.required_ingress_guards == 3"
            - "RiskAssessment.${ra_id}.required_floor_guards == 4"
            - "RiskAssessment.${ra_id}.required_exit_guards == 2"
            - "RiskAssessment.${ra_id}.required_line_guards == 13"
            - "RiskAssessment.${ra_id}.required_line_guards != 11"
            - "RiskAssessment.${ra_id}.required_supervisors == 2"
            - "RiskAssessment.${ra_id}.required_total_staff == 15"
            - "RiskAssessment.${ra_id}.required_screening_lanes == 7"
            - "RiskAssessment.${ra_id}.minimum_staffing_cost_floor_cents == 108000"

      - name: subcontract_assignment_cost_three_level_rounding
        grounds:
          - calculations.assignment_cost
          - entities.PostAssignment.fields.line_cost_cents
          - entities.PostAssignment.fields.pay_basis
          - entities.PostAssignment.fields.night_differential_applies
        distinguishing_aspect: |
          This instance pins THREE SEQUENTIAL ROUNDING LEVELS on one assignment: straight pay and overtime pay are
          rounded separately, the night differential is rounded separately, and the vendor markup is applied to the
          already-rounded subtotal 28988 before the flat admin fee — producing line_cost_cents 47581, one cent
          above the 47580 that a single final rounding of the unrounded 28987.75 subtotal produces.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z"
            - "Venue with one FLOOR zone, SecurityEvent with an APPROVED RiskAssessment, and a DRAFT StaffingPlan with budget_cents 500000"
            - "One PERIMETER post NIGHT1 whose coverage window is 2026-09-12T22:00:00Z to 2026-09-13T09:00:00Z"
            - "APPROVED Subcontractor with markup_pct 0.60 and a SUBCONTRACTED Guard with base_hourly_rate_cents 2333"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/venues/${venue_id}/zones"
              payload: { zone_code: "ZF", zone_type: "FLOOR", floor_area_sqm: 200, posted_capacity: 300, exit_units: 3, post_slot_capacity: 12, is_ingress_zone: false }
              as: SecurityDirector
              captures: { zf_id: $.data.id }
            - call: "POST /event-security/security-events"
              payload: { venue_id: "${venue_id}", event_name: "Autumn Gala", event_type: "CONCERT", doors_open_at: "2026-09-12T17:00:00Z", event_start_at: "2026-09-12T18:30:00Z", event_end_at: "2026-09-12T22:30:00Z", expected_attendance: 200, alcohol_served: false, vip_present: false }
              as: SecurityDirector
              captures: { event_id: $.data.id }
            - call: "POST /event-security/security-events/${event_id}/risk-assessments"
              payload: { threat_level_input: "LOW", protest_likelihood: "NONE", crowd_profile: "SEATED", ingress_door_count: 1, layout_complexity_score: 1, history_incident_rate: 0 }
              as: RiskAnalyst
              as_user_id: "analyst-1"
              captures: { ra_id: $.data.id }
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "SUBMIT" }
              as: RiskAnalyst
              as_user_id: "analyst-1"
            - call: "POST /event-security/risk-assessments/${ra_id}/decision"
              payload: { action: "APPROVE" }
              as: SecurityDirector
              as_user_id: "director-1"
            - call: "GET /event-security/security-events/${event_id}"
              payload: {}
              as: SecurityDirector
              captures: { event_v: $.data.version }
            - call: "POST /event-security/security-events/${event_id}/staffing-plans"
              payload: { risk_assessment_id: "${ra_id}", budget_cents: 500000, expected_event_version: "${event_v}" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /event-security/staffing-plans/${plan_id}/posts"
              payload: { zone_id: "${zf_id}", post_code: "NIGHT1", post_type: "PERIMETER", required_guard_count: 1, min_credential_level: 1, window_start: "2026-09-12T22:00:00Z", window_end: "2026-09-13T09:00:00Z" }
              as: StaffingCoordinator
              captures: { night_post_id: $.data.id }
            - call: "POST /event-security/subcontractors"
              payload: { company_name: "Nightwatch Labour", license_number: "SC-9001", insurance_expires_on: "2026-12-31T00:00:00Z", markup_pct: 0.60 }
              as: CredentialAuditor
              captures: { vendor_id: $.data.id }
            - call: "POST /event-security/subcontractors/${vendor_id}/decision"
              payload: { action: "APPROVE" }
              as: CredentialAuditor
            - call: "POST /event-security/guards"
              payload: { full_name: "Nils Owl", employment_type: "SUBCONTRACTED", credential_level: 1, license_number: "GC-9001", credential_expires_on: "2026-12-31T00:00:00Z", base_hourly_rate_cents: 2333, subcontractor_id: "${vendor_id}" }
              as: StaffingCoordinator
              captures: { gn_id: $.data.id }
          trigger:
            - call: "POST /event-security/post-assignments"
              payload: { post_id: "${night_post_id}", guard_id: "${gn_id}", window_start: "2026-09-12T22:00:00Z", window_end: "2026-09-13T08:30:00Z" }
              as: StaffingCoordinator
              captures: { asg_id: $.data.id }
          assert:
            - "PostAssignment.${asg_id}.scheduled_hours == 10.50"
            - "PostAssignment.${asg_id}.night_differential_applies == true"
            - "PostAssignment.${asg_id}.pay_basis == SUBCONTRACT"
            - "PostAssignment.${asg_id}.line_cost_cents == 47581"
            - "PostAssignment.${asg_id}.line_cost_cents != 47580"
            - "PostAssignment.${asg_id}.assignment_status == TENTATIVE"
            - "StaffingPlan.${plan_id}.committed_cost_cents == 0"
            - "StaffingPlan.${plan_id}.budget_remaining_cents == 500000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: risk_assessment_reject_revise_resubmit_cycle
        grounds:
          - state_machines.RiskAssessment.SUBMITTED_to_REJECTED
          - state_machines.RiskAssessment.REJECTED_to_DRAFT
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
          - state_machines.RiskAssessment.SUBMITTED_to_APPROVED
          - entities.RiskAssessment.fields.revision_number
          - validations[priority=15]
        distinguishing_aspect: |
          RiskAssessment is the CYCLIC shape: REJECT returns the row to a state it has already occupied
          (DRAFT) via REVISE, incrementing revision_number to 2 and clearing submitted_by_user_id, and the row
          then completes the loop to APPROVED — the same row visits SUBMITTED twice with different
          submitted_by_user_id bookkeeping each time.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z"
            - "Venue with gross_capacity 8000 and door_count 1"
            - "SecurityEvent in PLANNING with expected_attendance 200"
            - "RiskAssessment in DRAFT (revision_number 1) with threat LOW, protest NONE, crowd_profile SEATED, layout_complexity_score 1, history_incident_rate 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /event-security/venues"
              payload: { name: "Harbor Arena", gross_capacity: 8000, door_count: 1, egress_capacity_per_minute: 500, perimeter_length_m: 400, alcohol_licensed: false, prior_incident_rate: 0 }
              as: SecurityDirector
              captures: { venue_id: $.data.id }
            - call: "POST /event-security/security-events"
