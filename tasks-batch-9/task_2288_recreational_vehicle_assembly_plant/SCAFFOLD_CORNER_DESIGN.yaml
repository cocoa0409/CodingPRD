              captures: { e_equal: $.data.error_id }
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "WATER_TEST", test_booth_id: "${booth_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T09:00:00Z" }
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { e_inverted: $.data.error_id }
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "WATER_TEST", test_booth_id: "${booth_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T10:29:00Z" }
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { e_short: $.data.error_id }
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "WATER_TEST", test_booth_id: "${booth_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T14:01:00Z" }
              as: QualityInspector
