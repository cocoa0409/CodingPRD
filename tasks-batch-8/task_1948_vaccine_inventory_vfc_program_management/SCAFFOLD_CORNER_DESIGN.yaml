        claim_type: precision
        grounds:
          - calculations.excursion_duration_minutes
        distinguishing_aspect: "Excursion opened at 10:00:00Z, closed by in-range reading at 10:01:30Z -> duration_minutes = floor(90/60) = 1 (not 2, not 1.5)."
