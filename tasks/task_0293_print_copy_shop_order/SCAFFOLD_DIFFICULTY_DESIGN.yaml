          business_fiscal (priority 14, ERR_CAPACITY_EXCEEDED). A confirm where a
          line is still OPEN (no preflight) AND capacity is already exhausted:
          lockability (higher priority) wins -> ERR_LINE_NOT_LOCKABLE.
