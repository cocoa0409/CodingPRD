                    loyalty_number: "LY00004601"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals: []
                  - external_id: "PJ2"
                    email_raw: "pj2@example.com"
                    phone_raw: null
                    loyalty_number: "LY00004602"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: "9 Pine Road"
                    event_timestamp: "2026-07-30T11:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { p1_id: "$.data[0].id", p2_id: "$.data[1].id" }
            - call: "GET /cdp/households"
              payload: { status: "ACTIVE" }
              as: IdentitySteward
