            - "sd_cancelled_status == CANCELLED (excluded from the gap candidate set despite overlapping everything)"
            - "sd_duck_status == PUBLISHED (different species: excluded from the gap check entirely)"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: finalize_posts_redemption_and_accrual_atomically
        claim_type: immediate
        grounds:
          - state_machines.WeightedSale.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: "One finalize request returns the sale with final_total_cents set AND the account's points_balance already reflects the redemption plus the new accrual — no delayed reconciliation."
        test_recipe:
          setup:
            - "WINTER_HEATING store; account with 1000 points; FEED_BULK DRUM sale gross 100 linked to the account; clock 2026-09-20T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T10:00:00Z" }
              as: RegionalAdmin
            - call: "POST /stores"
              payload: { store_name: "Winter Store", region_code: "MT-WEST" }
              as: RegionalAdmin
              captures: { cm_store: $.data.id, cm_v0: $.data.version }
            - call: "POST /season-campaigns"
              payload: { store_id: "${cm_store}", season: "WINTER_HEATING", planogram_map: "w1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { cm_camp: $.data.id }
            - call: "POST /season-campaigns/${cm_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${cm_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${cm_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${cm_camp}/activate"
              payload: { expected_store_version: "${cm_v0}" }
              as: RegionalAdmin
            - *k_account_create
            - call: "POST /loyalty-accounts/${c_acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${cm_store}", base_amount_cents: 100000, earn_context: "OTHER" }
              as: StoreAssociate
            - call: "POST /weighted-sales"
              payload: { store_id: "${cm_store}", sale_kind: "FEED_BULK", container_class: "DRUM", gross_weight_lbs: 100, loyalty_account_id: "${c_acct_id}" }
              as: StoreAssociate
              captures: { cm_sale: $.data.id }
          trigger:
            - call: "POST /weighted-sales/${cm_sale}/finalize"
              payload: { measured_tare_lbs: 20, redeem_points: 700 }
              as: StoreAssociate
              captures: { cm_final: $.data.final_total_cents, cm_status: $.data.status }
            - call: "GET /loyalty-accounts/${c_acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { cm_balance: $.data.points_balance }
          assert:
            - "cm_final == 2350 (3050 - 700) and cm_status == FINALIZED in the same response"
            - "cm_balance == 1323 immediately (1000 - 700 redemption + 23 accrual on the 2350-cent net, NEIGHBOR x1, WINTER_HEATING x1)"

