# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances.
# Every literal in an `assert:` was computed against the pinned formulas and
# constants in SCAFFOLD.yaml §1.3.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: hazard_score_preliminary_vs_ratified_diverge_by_evidence_scale
        grounds:
          - calculations.hazard_score_and_class
          - state_machines.HazardEvaluation.SUBMITTED_to_RATIFIED
          - entities.HazardEvaluation.fields.hazard_score
          - entities.HazardEvaluation.fields.variant
        distinguishing_aspect: |
          This dual variant lives in the HazardEvaluation risk-scoring domain: the PRELIMINARY
          variant forces the evidence scale to 1.00 while the RATIFIED variant applies
          EVIDENCE_SCALE[SUSPECTED] = 0.55, so identical inputs score 87.40 / CLASS_I before
          ratification and 48.07 / CLASS_II after it.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT owned by that firm."
            - "One HazardEvaluation in status SUBMITTED with probability HIGH, severity_tier 4, exposure_population 60000, vulnerable_population true, evidence_strength SUSPECTED, carrying the PRELIMINARY score 87.40 and recommended_class CLASS_I."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "SUSPECTED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { prelim_score: $.data.hazard_score, prelim_class: $.data.recommended_class }
          trigger:
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY", panel_note: "Link to illness cluster is suspected only." }
              as: HealthHazardPanel
              as_user_id: "panel-1"
          assert:
            - "${prelim_score} == 87.40 and ${prelim_class} == CLASS_I"
            - "HazardEvaluation.${he_id}.variant == RATIFIED"
            - "HazardEvaluation.${he_id}.hazard_score == 48.07"
            - "HazardEvaluation.${he_id}.recommended_class == CLASS_II"
            - "HazardEvaluation.${he_id}.hazard_score != ${prelim_score}"
            - "HazardEvaluation.${he_id}.status == RATIFIED"

      - name: effectiveness_contact_basis_diverges_from_quantity_basis_on_one_recall
        grounds:
          - calculations.effectiveness_percentage
          - calculations.effectiveness_sample_scope
          - entities.Recall.fields.contact_effectiveness_pct
          - entities.Recall.fields.quantity_effectiveness_pct
          - entities.Recall.fields.official_effectiveness_pct
        distinguishing_aspect: |
          This dual variant lives in the Recall retrieval-accounting domain, a different entity
          domain from the HazardEvaluation risk score: on identical fixture data CONTACT_BASIS
          reports 100.00 (both sampled consignees responded) while QUANTITY_BASIS reports 55.00
          (550 of 1000 shipped units accounted), and agency FDA selects CONTACT as official.
        test_recipe:
          setup:
            - "FDA Recall classified CLASS_I (level A, sample_tier_scope 3) with two tier-1 consignees, required_sample_size 2."
            - "Two CONFIRMED distribution records totalling 1000 units (600 + 400)."
            - "Both consignees notified, DELIVERED and ACKNOWLEDGED, so responded_count is 2 and the recall has auto-advanced to RETRIEVAL_ACCOUNTING."
            - "One VERIFIED RetrievalReceipt for consignee 1 accounting 550 units; consignee 2's receipt is not filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Harbor Grocery", consignee_type: "RETAILER" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c2_id: $.data.id, c2_v1: $.data.version }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-88A", quantity_shipped: 600, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c2_id}", lot_code: "L-88A", quantity_shipped: 400, ship_date: "2026-08-21T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /distribution-records/${d2_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/notifications"
              payload: { consignee_id: "${c1_id}", method: "EMAIL", expected_consignee_version: "${c1_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /recalls/${r_id}/notifications"
              payload: { consignee_id: "${c2_id}", method: "EMAIL", expected_consignee_version: "${c2_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /notifications/${n1_id}/delivery"
              payload: { outcome: "DELIVERED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n1_id}/response"
              payload: { outcome: "ACKNOWLEDGED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n2_id}/delivery"
              payload: { outcome: "DELIVERED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n2_id}/response"
              payload: { outcome: "ACKNOWLEDGED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/retrieval-receipts"
              payload: { consignee_id: "${c1_id}", quantity_returned: 500, quantity_destroyed_onsite: 50, quantity_held_segregated: 0, quantity_unrecoverable: 50 }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /retrieval-receipts/${rr1_id}/verify"
              payload: { decision: "VERIFY" }
              as: FieldInvestigator
              as_user_id: "inv-1"
          trigger:
            - call: "GET /recalls/${r_id}/effectiveness"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { contact_pct: $.data.contact_effectiveness_pct, quantity_pct: $.data.quantity_effectiveness_pct, official_pct: $.data.official_effectiveness_pct }
          assert:
            - "${contact_pct} == 100.00"
            - "${quantity_pct} == 55.00"
            - "${official_pct} == 100.00"
            - "GET /recalls/${r_id}/effectiveness -> official_basis == CONTACT"
            - "GET /recalls/${r_id}/effectiveness -> required_sample_size == 2 and responded_count == 2"
            - "GET /recalls/${r_id}/effectiveness -> shipped_units == 1000 and accounted_units == 550"
            - "${contact_pct} != ${quantity_pct}"

  - rule_id: combinatorial_formula
    instances:
      - name: cost_ledger_rounds_each_line_before_summing_mode_b
        grounds:
          - calculations.recall_cost_accumulation
          - entities.CostEntry.fields.line_loaded_cost_cents
          - entities.Recall.fields.total_loaded_cost_cents
          - state_machines.CostEntry.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER decides the cents: three NOTIFICATION lines of
          3333 cents each round to 3716 per line and sum to 11148, whereas the sum-then-round
          reading gives round(9999 * 1.115) = 11149. The scaffold pins per-line rounding first.
        test_recipe:
          setup:
            - "One Firm and one Recall in DRAFT."
            - "Three CostEntry rows of category NOTIFICATION and amount_cents 3333, each in status PENDING."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "NOTIFICATION", amount_cents: 3333, description: "Certified mail batch 1" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce1_id: $.data.id, ce1_loaded: $.data.line_loaded_cost_cents }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "NOTIFICATION", amount_cents: 3333, description: "Certified mail batch 2" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce2_id: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "NOTIFICATION", amount_cents: 3333, description: "Certified mail batch 3" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce3_id: $.data.id }
            - call: "POST /cost-entries/${ce1_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce2_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /cost-entries/${ce3_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_loaded: $.data.total_loaded_cost_cents, insurable_loaded: $.data.insurable_loaded_cost_cents }
          assert:
            - "${ce1_loaded} == 3716"
            - "${total_loaded} == 11148"
            - "${total_loaded} != 11149"
            - "${insurable_loaded} == 11148"
            - "CostEntry.${ce3_id}.status == ACCEPTED and CostEntry.${ce3_id}.line_loaded_cost_cents == 3716"
            - "CostEntry.${ce3_id}.overhead_rate == 0.115 and CostEntry.${ce3_id}.insurable == true"

      - name: insurance_waterfall_keys_coinsurance_tier_to_capped_total_mode_c
        grounds:
          - calculations.insurance_settlement
          - calculations.recall_cost_accumulation
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
          - entities.InsuranceClaim.fields.coinsurance_rate
          - entities.InsuranceClaim.fields.total_claim_value_cents
        distinguishing_aspect: |
          Mode (c) — an apparently circular dependency (total_claim_value depends on the handling
          fee, the fee on the payable, the payable on a tier a naive reader would key on the
          total) resolved by pinning the tier to STEP 2's capped_total_cents = 15733716, which
          yields coinsurance 0.85, payable 11248659, fee 337460 and total 11586119. This is a
          different combinatorial axis from the per-line rounding instance.
        test_recipe:
          setup:
            - "USDA Recall in EFFECTIVENESS_REVIEW owned by a Firm with the default 2500000 deductible, 100000000 aggregate and 0 paid to date."
            - "Five ACCEPTED CostEntry rows: LOGISTICS 6000000, DESTRUCTION 2000000, NOTIFICATION 3333, PRODUCT_VALUE 8000000 and (non-insurable) LEGAL 1000000, giving total_loaded_cost_cents 18243716 and insurable_loaded_cost_cents 17243716."
            - "One InsuranceClaim in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Ground beef 5lb", agency: "USDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-42B"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-42B", quantity_shipped: 1000, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/notifications"
              payload: { consignee_id: "${c1_id}", method: "EMAIL", expected_consignee_version: "${c1_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /notifications/${n1_id}/delivery"
              payload: { outcome: "DELIVERED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n1_id}/response"
              payload: { outcome: "ACKNOWLEDGED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/retrieval-receipts"
              payload: { consignee_id: "${c1_id}", quantity_returned: 960, quantity_destroyed_onsite: 0, quantity_held_segregated: 0, quantity_unrecoverable: 40 }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /retrieval-receipts/${rr1_id}/verify"
              payload: { decision: "VERIFY" }
              as: FieldInvestigator
              as_user_id: "inv-1"
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "LOGISTICS", amount_cents: 6000000, description: "Reverse logistics" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_log: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "DESTRUCTION", amount_cents: 2000000, description: "Incineration" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_des: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "NOTIFICATION", amount_cents: 3333, description: "Certified mail" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_not: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "PRODUCT_VALUE", amount_cents: 8000000, description: "Destroyed finished goods" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_pv: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "LEGAL", amount_cents: 1000000, description: "Outside counsel" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_leg: $.data.id }
            - call: "POST /cost-entries/${ce_log}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce_des}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce_not}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce_pv}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce_leg}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/insurance-claims"
              payload: { claim_reference: "CLM-2026-0001" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /insurance-claims/${cl_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { claimed: $.data.claimed_cents, capped: $.data.capped_total_cents, coins: $.data.coinsurance_rate, payable: $.data.settlement_payable_cents, fee: $.data.handling_fee_cents, total_value: $.data.total_claim_value_cents }
          assert:
            - "${claimed} == 17243716"
            - "${capped} == 15733716"
            - "${coins} == 0.85"
            - "${payable} == 11248659"
            - "${fee} == 337460"
            - "${total_value} == 11586119"
            - "InsuranceClaim.${cl_id}.status == SUBMITTED"
            - "Recall.${r_id}.total_loaded_cost_cents == 18243716"

  - rule_id: non_linear_state_machine
    instances:
      - name: notification_parallel_dimensions_advance_independently
        grounds:
          - state_machines.ConsigneeNotification.AWAITING_to_ACKNOWLEDGED
          - state_machines.ConsigneeNotification.SENT_to_DELIVERED
          - entities.ConsigneeNotification.fields.counts_toward_effectiveness
          - state_machines.Recall.NOTIFICATION_IN_PROGRESS_to_RETRIEVAL_ACCOUNTING
        distinguishing_aspect: |
          Non-linear shape = PARALLEL state dimensions on the ConsigneeNotification entity:
          response_state moves AWAITING -> ACKNOWLEDGED while delivery_state is still SENT, and
          only the later delivery_state SENT -> DELIVERED flips counts_toward_effectiveness to
          true. The two axes are order-independent and neither blocks the other.
        test_recipe:
          setup:
            - "FDA Recall classified CLASS_I with exactly one tier-1 consignee (required_sample_size 1)."
            - "One CONFIRMED distribution record of 600 units for that consignee."
            - "One ConsigneeNotification with delivery_state SENT and response_state AWAITING; the recall is in NOTIFICATION_IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
