  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: commitment_expiry_three_hop_cascade
        grounds:
          - state_machines.CommitmentLetter.ISSUED_to_EXPIRED
          - state_machines.LoanApplication.COMMITMENT_to_EXPIRED
          - state_machines.DocumentChecklistItem.PENDING_to_CANCELLED
          - state_machines.Participation.PROPOSED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the logical clock (distinct trigger from
          the committee-vote cascade below): clock set past expiry_date mutates
          the CommitmentLetter (hop 1), whose expiry mutation moves the
          LoanApplication (hop 2), whose expiry mutation cancels the checklist
          item and releases the participation (hop 3) — the participation
          release is caused by the application's expiry, not directly by the
          clock.
        test_recipe:
