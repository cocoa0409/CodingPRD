              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { prov_ver: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_id}", service_month: "2026-06", expected_provider_version: "${prov_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-23" }
