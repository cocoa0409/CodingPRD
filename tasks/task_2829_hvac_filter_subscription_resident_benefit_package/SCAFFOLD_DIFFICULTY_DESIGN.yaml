              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Basic Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "BASIC", damage_waiver_enabled: false, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
