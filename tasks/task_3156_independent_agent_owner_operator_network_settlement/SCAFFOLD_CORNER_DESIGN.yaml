          - calculations.settlement_split
        excluded_because:
          difficulty_instance: transitive_cascade / bco_abort_cascade_through_load_to_offer
          rationale: "The multi-hop cascade claim is grounded and asserted hop-by-hop in the named §1.8 instance; the settle-time ledger fan-out is separately covered by the Side Effect Execution corner."

      - name: both_split_variants_produce_expected_results
