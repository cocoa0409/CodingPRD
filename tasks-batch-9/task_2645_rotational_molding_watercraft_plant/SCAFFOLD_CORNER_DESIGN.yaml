      # ------------------------------------------- Side effect pattern: Bubble up
      - name: sm_bubble_up_order_reaches_complete_only_on_the_last_sellable_child
        claim_type: "Side effect pattern: Bubble up"
        grounds:
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETE
          - calculations.order_completion_rollup
          - calculations.production_order_cost
          - endpoints.POST_/finished-units/{finished_unit_id}/inspect
        distinguishing_aspect: "The order does not move when its FIRST child passes — completed_qty 1 against ordered_qty 2 keeps it IN_PRODUCTION — and flips to COMPLETE on the SECOND pass, at which moment the same total_cost_cents 18974 is divided by the new completed_qty so unit_cost_cents falls from 18974 to 9487."
        test_recipe:
          setup:
            - "Mould MLD-SM-BUB has cavity_count 2, so ONE cycle demoulds both children of ProductionOrder POR-SM-BUB (ordered_qty 2)."
