        test_recipe:
          setup: ["event with 3 volunteers"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02" }, as: Anonymous }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Three", date_of_birth: "2000-01-03" }, as: Anonymous }
          trigger:
            - { call: "GET /volunteer-ops/volunteers?event_id=${ev}", as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/volunteers?event_id=${ev}&limit=2&offset=2", as: VolunteerCoordinator }
          assert:
            - "default page: response_type == array, total_count == 3, has_more == false, limit == 10, offset == 0"
            - "limit=2&offset=2 page: exactly 1 row, total_count == 3, has_more == false"
