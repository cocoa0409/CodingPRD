              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
            - call: "POST /plans/${plan_id}/retire"
              payload: {}
              as: CurationAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: CurationAdmin
          trigger:
            - call: "POST /subscriptions/${s_id}/winback"
              payload: {}
