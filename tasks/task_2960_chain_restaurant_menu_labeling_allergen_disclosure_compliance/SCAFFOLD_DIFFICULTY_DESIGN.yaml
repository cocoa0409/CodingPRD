  # ===========================================================================
  # Rule 3 - Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: recipe_revision_loop_and_supersede_restore_cycle
        grounds:
          - state_machines.Recipe.transitions.DRAFT_to_ANALYSIS_PENDING
          - state_machines.Recipe.transitions.ANALYSIS_PENDING_to_DRAFT
          - state_machines.Recipe.transitions.ANALYSIS_PENDING_to_APPROVED
          - state_machines.Recipe.transitions.APPROVED_to_SUPERSEDED
          - state_machines.Recipe.transitions.SUPERSEDED_to_APPROVED
          - state_machines.Recipe.transitions.APPROVED_to_WITHDRAWN
          - entities.Recipe.revision_round
          - entities.Recipe.supersedes_recipe_id
          - entities.MenuItem.approved_recipe_version_no
        distinguishing_aspect: "Two cycles on the Recipe entity: DRAFT -> ANALYSIS_PENDING -> DRAFT (one absorbed rejection, revision_round 1) and APPROVED -> SUPERSEDED -> APPROVED (v1 is displaced by v2 and restored when v2 is withdrawn), so Recipe.status returns to a state it already left - the MenuBoard instance in this rule uses parallel dimensions on a different entity instead."
        test_recipe:
          setup:
            - "One Brand with one STANDARD MenuItem 'Grill Sandwich'."
            - "Recipe v1 (chicken 140 g, brioche bun 60 g, herb mayonnaise 20 g) is certified and declares 530 Cal."
            - "Recipe v2 (mayonnaise 45 g) is submitted, REJECTED once (revision_round 1, back to DRAFT), resubmitted and certified, declaring 700 Cal; v1 is now SUPERSEDED and the item sits at RELABEL_REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Herb mayonnaise", role: "BASE", grams: 20, calories_per_100g: 680, sodium_mg_per_100g: 620, added_sugar_g_per_100g: 1, allergen_group: "EGG", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Database values verified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { item_v2: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Mayonnaise portion increased to 45 g" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a2: $.data.id }
            - call: "POST /nutrition-analyses/${a2}/decision"
              payload: { decision: "REJECT", decision_note: "Mayonnaise line item missing from the build" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Herb mayonnaise", role: "BASE", grams: 45, calories_per_100g: 680, sodium_mg_per_100g: 620, added_sugar_g_per_100g: 1, allergen_group: "EGG", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a3: $.data.id }
            - call: "POST /nutrition-analyses/${a3}/decision"
              payload: { decision: "CERTIFY", decision_note: "Revised build certified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "POST /recipes/${r2}/withdraw-certification"
              payload: { reason: "Supplier changed the mayonnaise formulation; reverting to v1" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Recipe.${r2}.revision_round == 1"
            - "Recipe.${r2}.version_no == 2 and Recipe.${r2}.supersedes_recipe_id == ${r1}"
            - "Recipe.${r1}.supersedes_recipe_id == null"
            - "Recipe.${r2}.status == WITHDRAWN after the trigger"
            - "Recipe.${r1}.status == APPROVED after the trigger"
            - "NutritionAnalysis.${a2}.status == REJECTED"
            - "NutritionAnalysis.${a3}.status == CERTIFIED"
            - "MenuItem.${item}.approved_recipe_version_no == 1 after the trigger"
            - "MenuItem.${item}.declared_calorie_min == 530 and MenuItem.${item}.declared_calorie_max == 530 after the trigger"
            - "MenuItem.${item}.declared_sodium_mg == 550 after the trigger"
            - "MenuItem.${item}.labeling_status == DECLARED after the trigger"

      - name: menu_board_two_dimensions_advance_independently
        grounds:
          - entities.MenuBoard.publication_status
          - entities.MenuBoard.calorie_compliance_status
          - state_machines.MenuBoard.calorie_compliance_status.transitions.CURRENT_to_REPRINT_REQUIRED
          - state_machines.MenuBoard.calorie_compliance_status.transitions.REPRINT_REQUIRED_to_OVERDUE
