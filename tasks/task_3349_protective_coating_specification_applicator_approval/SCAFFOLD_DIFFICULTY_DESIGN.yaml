  # =========================================================================
  # Rule 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: work_order_window_closed_interval_touch_conflict
        grounds:
          - calculations.work_order_window_conflict
          - "validations[priority=9]"
          - entities.WorkOrder.fields.window_start
          - entities.WorkOrder.fields.window_end
        distinguishing_aspect: |
          CLOSED-interval semantics on the (project_id, asset_zone) resource:
          a new window whose window_start exactly equals an existing window's
          window_end (2026-09-15T00:00:00Z) CONFLICTS because both endpoints
          are inclusive, while the byte-identical touching window on a
          different asset_zone is accepted (equipment-corridor exception) —
          opposite adjacency treatment from the sibling's half-open
          regulation windows, on a different resource.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 ACTIVE on [2026-01-01, 2027-01-01)."
            - "CoatingSystem SW-WIN-100 ACTIVE; applicator CERTIFIED under a streak-0 program (min score 300)."
            - "BRIDGE project with an ISSUED spec; no work orders yet."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-WIN-100", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 300, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-WIN-100", coating_system_id: "${sys_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog_id: "$.data.id" }
            - call: "POST /coating/applicators"
              payload: { company_name: "Window Works", contact_email: "ops@windowworks.example" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id", app_v: "$.data.version" }
            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "${prog_id}" }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures: { qual_id: "$.data.id" }
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/certify"
              payload: { expected_applicator_version: "${app_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/projects"
              payload: { project_name: "Pipe Rack Repaint", owner_name: "PetroCo", jurisdiction_code: "US-FED", asset_type: BRIDGE, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sys_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { spec_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
          trigger:
            - call: "POST /coating/projects/${proj_id}/work-orders"
              payload: { specification_id: "${spec_id}", applicator_id: "${app_id}", asset_zone: "PIPE-RACK", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo1_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/work-orders"
              payload: { specification_id: "${spec_id}", applicator_id: "${app_id}", asset_zone: "PIPE-RACK", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-25T00:00:00Z" }
              as: ProjectEngineer
              captures: { err: "$.data.error_id" }
            - call: "POST /coating/projects/${proj_id}/work-orders"
              payload: { specification_id: "${spec_id}", applicator_id: "${app_id}", asset_zone: "PIPE-RACK-EAST", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-25T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo3_id: "$.data.id" }
          assert:
            - "WorkOrder.${wo1_id}.status == SCHEDULED (first window occupies [2026-09-05, 2026-09-15] closed)"
            - "second create response error_id == ERR_WINDOW_CONFLICT (touching endpoints conflict: new window_start 2026-09-15T00:00:00Z equals the existing window_end under CLOSED semantics)"
            - "WorkOrder.${wo3_id}.status == SCHEDULED (identical touching window on a different asset_zone is legal — no cross-zone conflict)"
      - name: voc_regulation_half_open_abutment
        grounds:
          - calculations.regulation_window_uniqueness
          - "validations[priority=10]"
          - state_machines.VocRegulation.ACTIVE_to_SUPERSEDED
          - entities.VocRegulation.fields.effective_from
          - entities.VocRegulation.fields.effective_to
        distinguishing_aspect: |
          HALF-OPEN [effective_from, effective_to) semantics on the
          (jurisdiction_code, application_method) resource: an interior
          overlap is ERR_REGULATION_OVERLAP, a supersede whose successor
          window starts before the predecessor's effective_to is
          ERR_REGULATION_GAP, and exact abutment (new_effective_from ==
          effective_to) is legal and REQUIRED — the opposite adjacency
          treatment from the sibling's closed work-order windows, on a
          different resource entity.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z (regulation windows are payload literals; no server-clock reads involved)."
            - "VocRegulation reg1 ACTIVE for (US-FED, SPRAY_AIRLESS) with limit 340 on [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { reg1_id: "$.data.id" }
          trigger:
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 320, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /coating/voc-regulations/${reg1_id}/supersede"
              payload: { new_voc_limit_gpl: 300, new_effective_from: "2026-07-01T00:00:00Z", new_effective_to: "2028-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_gap: "$.data.error_id" }
            - call: "POST /coating/voc-regulations/${reg1_id}/supersede"
              payload: { new_voc_limit_gpl: 300, new_effective_from: "2027-01-01T00:00:00Z", new_effective_to: "2028-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { succ_id: "$.data.id" }
            - call: "GET /coating/voc-regulations/${reg1_id}"
              as: PlatformAdmin
            - call: "GET /coating/voc-regulations/${succ_id}"
              as: PlatformAdmin
          assert:
            - "first create response error_id == ERR_REGULATION_OVERLAP ([2026-06-01, 2027-06-01) intersects [2026-01-01, 2027-01-01) under half-open semantics)"
            - "first supersede response error_id == ERR_REGULATION_GAP (new_effective_from 2026-07-01T00:00:00Z != reg1 effective_to 2027-01-01T00:00:00Z — zero-gap abutment is required)"
            - "VocRegulation.${reg1_id}.status == SUPERSEDED after the exact-abutment supersede"
            - "VocRegulation.${succ_id}.status == ACTIVE"
            - "VocRegulation.${succ_id}.effective_from == 2027-01-01T00:00:00Z"
            - "VocRegulation.${succ_id}.effective_to == 2028-01-01T00:00:00Z"
            - "VocRegulation.${succ_id}.voc_limit_gpl == 300"

  # =========================================================================
  # Rule 9 — compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: warranty_share_sum_invariant_across_adjudication
        grounds:
          - calculations.warranty_liability_split
          - entities.Warranty.fields.exposure_cents
          - entities.Warranty.fields.material_share_cents
          - entities.Warranty.fields.application_share_cents
          - state_machines.FailureInvestigation.EVIDENCE_GATHERING_to_ADJUDICATED_SHARED
        distinguishing_aspect: |
          Conserved quantity: a single Warranty row's share sum. Issuance
          splits exposure 200003 into 100002 + 100001; the compensating
          SHARED-30 adjudication re-splits it to 60001 + 140002. Both
          allocations sum to exactly exposure_cents — the forward action and
          its compensating re-split change the shares but never the total.
          Different conserved quantity from the sibling's project-level
          committed-exposure ledger.
