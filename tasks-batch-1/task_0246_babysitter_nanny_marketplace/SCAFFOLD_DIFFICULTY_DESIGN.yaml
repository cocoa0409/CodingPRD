  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_counter_offer_cycle_offered_countered_offered
        grounds:
          - state_machines.Booking.OFFERED_to_COUNTERED
          - state_machines.Booking.COUNTERED_to_OFFERED
          - entities.Booking.fields.offer_round
        distinguishing_aspect: |
          Booking is cyclic: OFFERED ->(caregiver counter)-> COUNTERED ->(family counter)-> OFFERED, with
          offer_round incrementing each hop; a distinct entity from the branching instance below.
        test_recipe:
          setup:
            - "Caregiver CLEAR/AVAILABLE rate floor 1500; OPEN posting; booking OFFERED at rate 2000 (offer_round 1, version 1)."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Cyc", email: "cyc@x.com", num_children: 1, required_tier: "BASIC", wallet_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Gus", email: "gus@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Neg", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-20T08:00:00Z", scheduled_end: "2026-03-20T12:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id, v0: $.data.version }
            - call: "POST /marketplace/bookings/${bk_id}/counter"
              payload: { agreed_rate_cents: 2500, expected_booking_version: "${v0}" }
              as: Caregiver
              as_user_id: "${cg_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /marketplace/bookings/${bk_id}/counter"
              payload: { agreed_rate_cents: 2200, expected_booking_version: "${v1}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { v2: $.data.version }
          assert:
            - "Booking.${bk_id}.status == OFFERED"
            - "Booking.${bk_id}.agreed_rate_cents == 2200"
            - "Booking.${bk_id}.offer_round == 3"

      - name: interview_branching_forkjoin_scheduled_to_three_outcomes
        grounds:
          - state_machines.Interview.SCHEDULED_to_TRIAL_BOOKED
          - state_machines.Interview.TRIAL_BOOKED_to_PASSED
          - entities.Interview.fields.status
        distinguishing_aspect: |
          Interview branches SCHEDULED -> {PASSED, FAILED, TRIAL_BOOKED} with divergent side-effects, then
          TRIAL_BOOKED rejoins to PASSED/FAILED — a fork-join shape on a different entity than the Booking cycle.
        test_recipe:
          setup:
            - "Family, caregiver, OPEN posting; TRIAL-kind interview SCHEDULED."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Fork", email: "fork@x.com", num_children: 1, required_tier: "BASIC", wallet_balance_cents: 10000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Hana", email: "hana@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Try", care_type: "RECURRING", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/interviews"
