  - rule_id: compensating_invariant
    instances:
      - name: request_withdrawal_restores_the_desk_fee_ledger_without_drift
        grounds:
          - calculations.desk_fee_budget_ledger
          - state_machines.RecordsRequest.APPEAL_FILED_to_WITHDRAWN
          - state_machines.Appeal.FILED_to_WITHDRAWN
          - entities.RecordsRequest.fields.fee_committed_cents
          - entities.Desk.fields.fee_budget_available_cents
        distinguishing_aspect: |
          The withdrawal is a pure compensating action: after a fee determination committed 5250, a denial
          released it, and an appeal committed 4500, the withdrawal must return the appeal's commitment
          through a two-hop cascade and restore the ledger to its exact opening triple
          (available 500000, committed 0, spent 0) with total unchanged. Because the denial already
          released the request's own commitment, an implementation that double-releases it overshoots
          available past total - the conservation identity, not just the final numbers, is what this
          instance pins.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk with fee_budget_total_cents 500000, one Agency (search_fee_cents_per_hour 3500, page_fee_cents 25, max_waiver_cents 10000, appeal_venue OMBUDS)."
            - "One RecordsRequest submitted, fee-determined at net 5250 (committing 5250), then DENIED with denial_reason_code EXEMPT_PRIVACY, which RELEASES the 5250 back to available."
            - "One Appeal FILED on the denial ground with filing_fee_cents 4500, committing 4500 and moving the request to APPEAL_FILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Section 8 inspection failures 2024-2025", requested_format: "CSV", estimated_page_count: 120, waiver_requested: true, public_interest_score: 85, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 3.5, billed_page_count: 120 }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "DENIED", denial_reason_code: "EXEMPT_PRIVACY" }
              as: RecordsCoordinator
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "OMBUDS", grounds: "The privacy exemption does not cover aggregate inspection outcomes.", filing_fee_cents: 4500 }
              as: LegalCounsel
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /records-desk/records-requests/${req_id}/withdrawal"
              payload: { reason: "The story was killed; we are dropping the request." }
              as: RecordsCoordinator
          assert:
            - "before the trigger: Desk.${desk_id}.fee_budget_available_cents == 495500, fee_budget_committed_cents == 4500, fee_budget_spent_cents == 0, and RecordsRequest.${req_id}.fee_committed_cents == 0"
            - "HOP 1 - RecordsRequest.${req_id}.status == \"WITHDRAWN\" and fee_committed_cents == 0"
            - "HOP 2 - Appeal.${appeal_id}.status == \"WITHDRAWN\""
            - "HOP 3 - Desk.${desk_id}.fee_budget_available_cents == 500000, fee_budget_committed_cents == 0, fee_budget_spent_cents == 0"
            - "Desk.${desk_id}.fee_budget_total_cents == 500000 == available + committed + spent (restored to the exact opening triple, no drift and no double release)"
            - "Desk.${desk_id}.open_request_count == 0 and Desk.${desk_id}.open_appeal_count == 0"
            - "Desk.${desk_id}.litigation_exposure_count == 0 and security_posture == \"OPEN\" (a withdrawal is not a litigation event)"
            - "RecordsRequest.${req_id}.gross_fee_cents == 15250 and net_fee_cents == 5250 remain recorded (the determination is history; only the commitment is compensated)"

      - name: verification_revocation_preserves_the_finding_count_partition
        grounds:
          - calculations.investigation_analysis_readiness
          - state_machines.Finding.to_UNVERIFIED
          - state_machines.ReviewAssignment.ASSIGNED_to_RELEASED
          - state_machines.ReviewAssignment.COMPLETED_to_RELEASED
          - entities.Investigation.fields.finding_count
          - entities.ExpertReviewer.fields.active_assignment_count
        distinguishing_aspect: |
          Revoking one finding's verification must move exactly one unit between buckets while leaving
          finding_count untouched, so the partition identity still sums to 2 afterwards; it must also
          release BOTH a COMPLETED and an ASSIGNED assignment on that finding while decrementing
          active_assignment_count only for the formerly ASSIGNED one. Unlike the ledger instance, the
          conserved quantity here is a four-way partition of a count rather than a three-way split of
          money, and the compensation is only partial - the sibling finding's SME_CONFIRMED verdict and
          its COMPLETED assignment must survive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
