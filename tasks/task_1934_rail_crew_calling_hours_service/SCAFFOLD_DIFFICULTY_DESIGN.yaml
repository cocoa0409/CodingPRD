  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_call_accept
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Call.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Category pair state (p5, ERR_INVALID_STATE) vs business_safety (p7,
          ERR_HOS_LIMIT_EXCEEDED): an employee who already DECLINED the call
          (state violation) AND whose month projection would exceed the cap
          (safety violation) MUST receive ERR_INVALID_STATE because state at
          priority 5 beats safety at priority 7.
        test_recipe:
          setup:
            - "Employee E (ENGINEER) with cumulative_duty_minutes_month == 16080 (one 16080-min tour)"
            - "Call C2 for a default-tour job (projection 16560 <= cap, so to force a safety violation we advance E by 1 duty minute first via a second accepted assignment; simpler: make the would-be projection 16561 by tying up 1 extra minute)"
            - "Call C3 then offered to E and DECLINED by E — accept on C3 now violates state (DECLINED) and would violate safety (16561 > 16560)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E9001", full_name: "Ivy Engineer", craft: "ENGINEER", seniority_date: "2010-02-01T00:00:00Z", home_terminal: "CHI" }
