        grounds: ["endpoints", "entities.School.fields.target_student_count", "calculations.school_impact_index"]
        distinguishing_aspect: "GET /schools/{id}/impact-summary on a school with one PUBLISHED 100-student spec and no events returns target_student_count 100, closed_event_count 0 and both indices at the equity-only 12.00."
