      - name: manifest_reject_three_link_cascade_voids_triage_decisions
        grounds:
          - state_machines.Intake.compliance_state.MANIFEST_SUBMITTED_to_MANIFEST_REJECTED
          - state_machines.Intake.custody_state.PACKAGED_to_QUARANTINED
          - entities.TriageDecision.fields.status
          - entities.Module.fields.second_life_score
          - errors[ERR_MODULES_ALREADY_COMMITTED]
        distinguishing_aspect: |
          One reject call propagates through three hops in the COMPLIANCE domain and, unlike the
          finalize and post cascades, it moves state BACKWARDS: link 1 HazmatManifest SUBMITTED
          -> REJECTED with compliance_state MANIFEST_REJECTED, link 2 custody_state PACKAGED ->
          QUARANTINED with hold_reason MANIFEST_REJECTED, link 3 both ACTIVE TriageDecisions
          become VOIDED and both modules revert from SECOND_LIFE_QUEUE / RECOVERY_QUEUE to
          PENDING_TRIAGE with second_life_score and grade reset to null.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, one campus, one supplier."
            - "One NMC622 intake at (custody_state PACKAGED, compliance_state MANIFEST_SUBMITTED) with manifest revision 1 still SUBMITTED (never closed)."
