            - { call: "GET /api/storage-sites/${s2_id}/occupancy", payload: {}, as: BrokerOps, captures: { occ2: "$.data.occupied_physical_tons" } }
          assert:
            - "BaleLot.${lot_id}.storage_site_id == ${s2_id}"
            - "BaleLot.${lot_id}.version incremented by exactly 1"
