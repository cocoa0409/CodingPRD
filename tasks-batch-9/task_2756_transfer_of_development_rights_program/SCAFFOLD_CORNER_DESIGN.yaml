              as: ProgramAdministrator
              captures: { tight_id: $.data.id }
            - call: "POST /tdr/sending-areas/${tight_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-WIDE", name: "West Flats Wide", neighborhood_code: "NB-WEST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "MODERATE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { wide_id: $.data.id }
            - call: "POST /tdr/sending-areas/${wide_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${tight_id}", apn: "APN-B01", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_b: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${tight_id}", apn: "APN-C01", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_c: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${wide_id}", apn: "APN-Z00", gross_acres: 40.00, constrained_acres: 40.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_z: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_b}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
