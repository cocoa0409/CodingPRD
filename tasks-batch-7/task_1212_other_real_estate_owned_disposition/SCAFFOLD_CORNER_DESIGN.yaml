  # =====================================================================
  # Section: cross_cutting_layers (optimistic_concurrency etc.)
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: appraisal_create_with_stale_property_version_returns_412
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[appraisal-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on OREOProperty.version: after one appraisal creation bumps the version, a second create carrying the previously observed version is rejected with 412."
        test_recipe:
          setup: ["Property exists (version captured at creation); clock 2026-06-01; appraiser registered"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
          trigger:
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-02", appraised_value: 398000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v_end: $.data.version } }
          assert:
            - "First create succeeds (201) and bumps the property version"
            - "err == ERR_STALE_VERSION (HTTP 412) for the second create carrying the stale ${p_v}"
            - "p_v_end == p_v + 1 exactly (only the successful create advanced the version)"

      - name: offer_create_with_stale_property_version_returns_412
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[offer-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC rule on a different write endpoint: offer creation against a stale property version is rejected even though offer creation itself remains a legal operation."
        test_recipe:
          setup: ["Marketed property with ACTIVE listing; fresh property version captured"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
          trigger:
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer A", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { oa_id: $.data.id } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer B", offer_price: 445000.00, financing_type: "CASH", earnest_money: 4000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "First offer created (201); second create with the same stale ${p_v2} fails with err == ERR_STALE_VERSION (HTTP 412)"
            - "Only one offer exists afterwards (GET /api/offers?property_id=${p_id} total_count == 1)"

      - name: certification_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.Appraisal.SUBMITTED_to_CERTIFIED]
        excluded_because:
          difficulty_instance: appraisal_certification_fv_writedown_cascade
          rationale: "The 3-link certification cascade is asserted hop-by-hop by the named rule-4 instance."

      - name: settle_void_compensation_covered
        claim_type: compensation
        grounds: [state_machines.ClosingStatement.SETTLED_to_VOID]
        excluded_because:
          difficulty_instance: settle_then_void_preserves_recognized_gain_total
          rationale: "Compensating reversal entries and the conserved recognized-gain total are asserted by the named rule-9 instance."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: mutations_visible_immediately_in_responses
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.CarryingCost.fields.amount]
        distinguishing_aspect: "Immediate consistency: the create response and the very next read agree on the posted (rounded) values with no lag."
        test_recipe:
          setup: ["Property exists (carrying 368000.00, expensed_cost_total 0)"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
          trigger:
