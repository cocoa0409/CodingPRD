scaffold_corner_design:

  - section: entities
    note: "Table-1 claims for the twelve 1.1 entities: creation echo, single-row read, pagination envelope, per-entity not-found, required fields, defaults, computed and system field derivation, constraint shapes, the one immutable entity and flat-topology FK integrity."
    instances:

      - name: create_state_license_profile_returns_all_fields
        claim_type: creation
        grounds:
          - "entities.StateLicenseProfile"
          - "entities.StateLicenseProfile.fields.required_permit_types"
          - "entities.StateLicenseProfile.fields.reciprocity_states"
          - "endpoints[POST /state-license-profiles]"
          - "roles.PlatformAdmin.exclusive_operations"
        distinguishing_aspect: "Entity domain = StateLicenseProfile, the only entity with no FK at all: a creation with every required field returns 201 and echoes all six inputs plus the four common fields, so the licensing regime is fully readable before any listing exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Nothing else in the database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
          trigger:
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
          assert:
            - "HTTP 201."
            - "data.state_code == \"AZ\"."
            - "data.required_permit_types == [\"PESTICIDE_APPLICATOR\", \"BUSINESS_TAX\"]."
            - "data.reciprocity_states == [\"NV\"]."
            - "data.transfer_processing_days == 21."
            - "data.cooling_off_days == 14."
            - "data.provisional_operation_allowed == false."
            - "data.version == 1."
            - "data.id is a non-empty UUID string with no type prefix; data.created_at and data.updated_at are ISO-8601 UTC timestamps with three fractional digits."
            - "response_type == \"object\" and meta.api_request_id is present."

      - name: get_route_listing_returns_stored_rollups
        claim_type: retrieval
        grounds:
          - "entities.RouteListing.fields.claimed_recurring_mrr_cents"
          - "entities.RouteListing.fields.verified_recurring_mrr_cents"
          - "entities.RouteListing.fields.verified_account_count"
          - "entities.RouteListing.fields.verification_posture"
          - "endpoints[GET /route-listings/{id}]"
        distinguishing_aspect: "Entity domain = RouteListing: the single-row read returns the two independent roll-up families side by side (claimed 43000/4000/3 versus verified 30318/3409/2) and the posture INCOMPLETE, which is only correct because A3 verified DISPUTED rather than VERIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, ACTIVE seller, APPROVED buyer."
            - "DRAFT listing PHX-NE with A1 (claimed 16000, repair 1500), A2 (claimed 15000, PASS_THROUGH chemical, repair 2000), A3 (claimed 12000, repair 500)."
            - "Nine BANK_VERIFIED billing rows; all three accounts verified: A1 VERIFIED 16000, A2 VERIFIED 14318, A3 DISPUTED 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 12000, "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a1_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A2-MESA", "service_start_date": "2023-06-01", "route_day": "MON", "monthly_service_fee_cents": 15000, "avg_monthly_chemical_cents": 5000, "avg_monthly_repair_cents": 2000, "chemical_billing_method": "PASS_THROUGH", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a2_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A3-GILBERT", "service_start_date": "2025-02-10", "route_day": "WED", "monthly_service_fee_cents": 9000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a3_id": "$.data.id"}
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-05", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-06", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-07", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-05", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-06", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-07", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-05", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-06", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-07", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /service-accounts/${a1_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
            - call: "POST /service-accounts/${a2_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
            - call: "POST /service-accounts/${a3_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
          trigger:
            - call: "GET /route-listings/${listing_id}"
              as: Broker
          assert:
            - "HTTP 200."
            - "data.status == \"DRAFT\"."
            - "data.claimed_recurring_mrr_cents == 43000 and data.claimed_repair_mrr_cents == 4000 and data.claimed_account_count == 3."
            - "data.verified_recurring_mrr_cents == 30318 and data.verified_repair_mrr_cents == 3409."
            - "data.verified_account_count == 2 (A1 and A2 only; the DISPUTED A3 is not counted)."
            - "data.verification_posture == \"INCOMPLETE\"."
            - "data.introductions_completed_count == 0 and data.withdrawal_reason_code is null."
            - "data.asking_price_cents == 460000 and data.listed_mrr_cents == 43000 and data.listed_account_count == 3 (the seller-declared inputs are never overwritten by the roll-ups)."

      - name: list_service_accounts_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "entities.ServiceAccount"
          - "endpoints[GET /service-accounts]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Entity domain = ServiceAccount collection: the same three-row set is walked in two pages of two, so total_count stays 3 across both pages while has_more flips true -> false, and the unfiltered default page (limit 10) returns all three."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, seller, buyer."
            - "DRAFT listing PHX-NE with exactly three accounts A1, A2, A3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 12000, "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a1_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A2-MESA", "service_start_date": "2023-06-01", "route_day": "MON", "monthly_service_fee_cents": 15000, "avg_monthly_chemical_cents": 5000, "avg_monthly_repair_cents": 2000, "chemical_billing_method": "PASS_THROUGH", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a2_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A3-GILBERT", "service_start_date": "2025-02-10", "route_day": "WED", "monthly_service_fee_cents": 9000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a3_id": "$.data.id"}
          trigger:
            - call: "GET /service-accounts"
              payload: {"listing_id": "${listing_id}", "limit": 2, "offset": 0}
              as: Broker
            - call: "GET /service-accounts"
              payload: {"listing_id": "${listing_id}", "limit": 2, "offset": 2}
              as: Broker
            - call: "GET /service-accounts"
              payload: {"listing_id": "${listing_id}"}
              as: Broker
          assert:
            - "First call: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second call: HTTP 200, len(data) == 1, total_count == 3, has_more == false, offset == 2."
            - "Third call: HTTP 200, len(data) == 3, total_count == 3, has_more == false, limit == 10 (the declared default), offset == 0."
            - "The three ids returned across pages one and two are exactly the three created account ids, with no repetition."

      - name: get_by_unknown_id_returns_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - "errors.ERR_LISTING_NOT_FOUND"
          - "errors.ERR_ACCOUNT_NOT_FOUND"
          - "errors.ERR_DEAL_NOT_FOUND"
          - "errors.ERR_ESCROW_NOT_FOUND"
          - "errors.ERR_SETTLEMENT_NOT_FOUND"
          - "errors.ERR_PARTY_NOT_FOUND"
          - "errors.ERR_LICENSE_PROFILE_NOT_FOUND"
          - "errors.ERR_LICENSE_TRANSFER_NOT_FOUND"
          - "errors.ERR_VALUATION_NOT_FOUND"
          - "errors.ERR_BILLING_RECORD_NOT_FOUND"
          - "errors.ERR_ATTRITION_EVENT_NOT_FOUND"
          - "validations[priority=7]"
          - "validations[priority=17]"
        distinguishing_aspect: "Not-found is per-entity, not generic: eleven single-row reads against an empty database each return the error_id of the entity family addressed, so a caller can tell WHICH reference failed to resolve rather than receiving one shared 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The database holds no listings, accounts, deals, escrows, settlements, parties, profiles, transfers, valuations, billing rows or attrition events."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
          trigger:
            - call: "GET /route-listings/11111111-1111-4111-8111-111111111111"
              as: Broker
            - call: "GET /service-accounts/22222222-2222-4222-8222-222222222222"
              as: Broker
            - call: "GET /deals/33333333-3333-4333-8333-333333333333"
              as: Broker
            - call: "GET /escrow-accounts/44444444-4444-4444-8444-444444444444"
              as: Broker
            - call: "GET /clawback-settlements/55555555-5555-4555-8555-555555555555"
              as: Broker
            - call: "GET /sellers/66666666-6666-4666-8666-666666666666"
              as: Broker
            - call: "GET /buyers/77777777-7777-4777-8777-777777777777"
              as: Broker
            - call: "GET /state-license-profiles/88888888-8888-4888-8888-888888888888"
              as: Broker
            - call: "GET /license-transfers/99999999-9999-4999-8999-999999999999"
              as: Broker
            - call: "GET /route-valuations/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              as: Broker
            - call: "GET /billing-history-records/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              as: Broker
            - call: "GET /attrition-events/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              as: Broker
          assert:
            - "GET /route-listings/{unknown}: HTTP 404, data.error_id == \"ERR_LISTING_NOT_FOUND\"."
            - "GET /service-accounts/{unknown}: HTTP 404, data.error_id == \"ERR_ACCOUNT_NOT_FOUND\"."
            - "GET /deals/{unknown}: HTTP 404, data.error_id == \"ERR_DEAL_NOT_FOUND\"."
            - "GET /escrow-accounts/{unknown}: HTTP 404, data.error_id == \"ERR_ESCROW_NOT_FOUND\"."
            - "GET /clawback-settlements/{unknown}: HTTP 404, data.error_id == \"ERR_SETTLEMENT_NOT_FOUND\"."
            - "GET /sellers/{unknown} and GET /buyers/{unknown}: HTTP 404, data.error_id == \"ERR_PARTY_NOT_FOUND\" for both."
            - "GET /state-license-profiles/{unknown}: HTTP 404, data.error_id == \"ERR_LICENSE_PROFILE_NOT_FOUND\"."
            - "GET /license-transfers/{unknown}: HTTP 404, data.error_id == \"ERR_LICENSE_TRANSFER_NOT_FOUND\"."
            - "GET /route-valuations/{unknown}: HTTP 404, data.error_id == \"ERR_VALUATION_NOT_FOUND\"."
            - "GET /billing-history-records/{unknown}: HTTP 404, data.error_id == \"ERR_BILLING_RECORD_NOT_FOUND\"."
            - "GET /attrition-events/{unknown}: HTTP 404, data.error_id == \"ERR_ATTRITION_EVENT_NOT_FOUND\"."
            - "Every one of the twelve responses carries response_type == \"error\"."

      - name: create_service_account_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "validations[priority=5]"
          - "errors.ERR_VALIDATION"
          - "endpoints[POST /service-accounts]"
          - "entities.ServiceAccount.fields.monthly_service_fee_cents"
          - "entities.ServiceAccount.fields.chemical_billing_method"
        distinguishing_aspect: "Required-field enforcement on the entity that carries nine mandatory inputs: dropping monthly_service_fee_cents (a *_cents field) and dropping chemical_billing_method (an enum that decides a downstream formula branch) each fail at priority 5 before any FK or state check runs, and no ServiceAccount row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, seller, buyer."
            - "DRAFT listing PHX-NE with no accounts yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
          trigger:
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 12000, "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "billing_frequency": "MONTHLY"}
              as: Broker
            - call: "GET /service-accounts"
              payload: {"listing_id": "${listing_id}"}
              as: Broker
            - call: "GET /route-listings/${listing_id}"
              as: Broker
          assert:
            - "First call (no monthly_service_fee_cents): HTTP 400, data.error_id == \"ERR_VALIDATION\"."
            - "Second call (no chemical_billing_method): HTTP 400, data.error_id == \"ERR_VALIDATION\"."
            - "Third call: HTTP 200 with total_count == 0 -- neither rejected request persisted anything."
            - "GET /route-listings/${listing_id} still reports claimed_recurring_mrr_cents == 0, claimed_account_count == 0 and verification_posture == \"EMPTY\"."

      - name: create_route_listing_defaults_status_and_rollups
        claim_type: defaults
        grounds:
          - "entities.RouteListing.fields.status"
          - "entities.RouteListing.fields.claimed_recurring_mrr_cents"
          - "entities.RouteListing.fields.verification_posture"
          - "entities.RouteListing.fields.introductions_completed_count"
          - "state_machines.RouteListing.initial_state"
          - "endpoints[POST /route-listings]"
        distinguishing_aspect: "Entity domain = RouteListing at birth: all nine defaulted fields are asserted in one response -- status DRAFT, six zero roll-ups, posture EMPTY and a null withdrawal_reason_code -- proving the roll-ups start from the account set (empty) and not from the seller-declared listed_* inputs, which are 43000/3."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE Seller (Sun Valley Pools LLC)."
            - "No listing exists yet for this seller."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
          trigger:
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
          assert:
            - "HTTP 201."
            - "data.status == \"DRAFT\"."
            - "data.claimed_recurring_mrr_cents == 0, data.claimed_repair_mrr_cents == 0, data.claimed_account_count == 0."
            - "data.verified_recurring_mrr_cents == 0, data.verified_repair_mrr_cents == 0, data.verified_account_count == 0."
