            - "after the revoke, TaxExemptCertificate.${cert2_id}.status == REVOKED"
            - "after the revoke, TaxExemptCertificate.${cert2_id}.revoke_reason_code == AUDIT_FAILURE"
            - "after the revoke, ProAccount.${acct_id}.tax_exempt_state_codes == []"

      - name: account_reinstate_while_credit_line_still_frozen_returns_credit_line_frozen
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProAccount.transitions[HOLD->ACTIVE]
          - validations[priority=15]
          - errors[ERR_CREDIT_LINE_FROZEN]
        distinguishing_aspect: "The account's HOLD -> ACTIVE edge is guarded by a different entity's state: while the CreditLine is FROZEN the reinstate returns ERR_CREDIT_LINE_FROZEN 409, and only after the line itself is reinstated does the account move — reinstating the line does not auto-clear the account hold."
        test_recipe:
          setup:
            - "Store HD-101; MEMBER account with a 500000 credit line, manually frozen (which cascaded the account to HOLD)."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Held Builders", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "${acct_id}", limit_cents: 500000, terms_days: 30 }
              as: CreditManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /pro/credit-lines/${cl_id}/freeze"
              payload: { reason_code: "MANUAL" }
              as: CreditManager
          trigger:
            - call: "POST /pro/pro-accounts/${acct_id}/reinstate"
              payload: {}
              as: CreditManager
              captures: { err: "$.data.error_id" }
            - call: "POST /pro/credit-lines/${cl_id}/reinstate"
              payload: {}
              as: CreditManager
            - call: "POST /pro/pro-accounts/${acct_id}/reinstate"
              payload: {}
              as: CreditManager
          assert:
            - "${err} == ERR_CREDIT_LINE_FROZEN"
            - "first reinstate http_status == 409"
            - "after the first attempt, ProAccount.${acct_id}.status == HOLD"
            - "after the credit-line reinstate, CreditLine.${cl_id}.status == ACTIVE"
            - "after the credit-line reinstate, CreditLine.${cl_id}.frozen_reason_code == null"
            - "after the credit-line reinstate but before the second account reinstate, ProAccount.${acct_id}.status == HOLD"
            - "after the second account reinstate, ProAccount.${acct_id}.status == ACTIVE"
            - "third call http_status == 200"

      - name: reinstating_an_already_active_credit_line_returns_credit_line_not_frozen
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=10]
          - errors[ERR_CREDIT_LINE_NOT_FROZEN]
        distinguishing_aspect: "Priority 10 is a specialization that runs ahead of the generic §1.2 guard: reinstating a never-frozen credit line returns ERR_CREDIT_LINE_NOT_FROZEN 409, not the generic ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Store HD-101; MEMBER account with a fresh ACTIVE 500000 credit line."
          setup_api_calls:
