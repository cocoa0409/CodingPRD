          assert:
            - "response error_id == ERR_CONSENT_MISSING (p9 wins over p10 ERR_FAMILY_LIMIT_REACHED)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: family_limit_ge_boundary_on_confirm
        grounds:
          - calculations.family_limit_gate
          - state_machines.SiblingRegistryEntry.PENDING_to_CONFIRMED
          - entities.Donor.fields.is_family_limit_reached
        distinguishing_aspect: |
          Metric: distinct CONFIRMED family count vs family_limit, boundary is `>=`. With family_limit=2, one
          CONFIRMED family leaves is_family_limit_reached=false; the second CONFIRMED distinct family makes
          reported_family_count==2 which is >= 2, flipping is_family_limit_reached to true. Reached via
          POST /sibling-registry/{id}/confirm.
        test_recipe:
          setup:
            - "Donor family_limit=2, RELEASED inventory (5 vials). Two recipients R1, R2 each with a SHIPPED reservation and a PENDING registry entry. R1's entry already CONFIRMED (count==1, not reached)."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-11", full_name: "Donor Eleven", donor_type: "SPERM", blood_type: "O_POS", family_limit: 2 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
