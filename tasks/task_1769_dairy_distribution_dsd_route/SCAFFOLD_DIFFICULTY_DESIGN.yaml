      - name: store_deactivation_cascade_releases_trip_cases
        grounds:
          - state_machines.Store.ACTIVE_to_INACTIVE
          - state_machines.RouteOrder.PLANNED_to_CANCELLED
          - entities.TruckTrip.fields.loaded_cases
        distinguishing_aspect: |
          Trigger = POST store deactivate: depth-3 chain Store -> PLANNED
          RouteOrders CANCELLED -> their trip's loaded_cases recomputed;
          different trigger and shallower depth than qa_breach_cascade_five_deep.
        test_recipe:
          setup:
            - "Distributor D1, route R1 ACTIVE, stores SA and SB (credit_limit 100000000), driver DR1; non-regulated product PL 250c units_per_case 1"
