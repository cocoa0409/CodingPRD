  - section: errors
    instances:
      - name: request_without_auth_headers_returns_missing_auth_header
        claim_type: violation_to_error
        grounds:
          - validations[P1]
          - errors[ERR_MISSING_AUTH_HEADER]
        distinguishing_aspect: "P1 sits above every other rule, so a request with neither X-User-ID nor X-User-Role must return ERR_MISSING_AUTH_HEADER (401) even when the path id does not exist - the 404 must not win."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: GET /engineered-orders/00000000-0000-4000-8000-0000000000cc
              payload: {}
              as: null
          assert:
            - "The request is sent with neither an X-User-ID nor an X-User-Role header."
            - "HTTP 401 with data.error_id == \"ERR_MISSING_AUTH_HEADER\"."
            - "The response is NOT 404 ERR_ORDER_NOT_FOUND."

      - name: unrecognised_role_header_returns_unknown_role
        claim_type: violation_to_error
        grounds:
          - validations[P2]
          - errors[ERR_UNKNOWN_ROLE]
          - roles
        distinguishing_aspect: "Only the 13 declared roles are accepted; a plausible but undeclared role name (Machinist) must fail with ERR_UNKNOWN_ROLE (401), which is distinct from the 403 ERR_ROLE_NOT_PERMITTED given to a real role lacking the grant."
        test_recipe:
          setup:
            - "One order exists so the target row is real."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-ER2"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
          trigger:
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: Machinist
              captures: { err_id: "$.data.error_id" }
              as_user_id: "u-shop-9"
          assert:
            - "The request carries X-User-Role: Machinist, which is not one of the 13 declared roles."
            - "HTTP 401 with data.error_id == \"ERR_UNKNOWN_ROLE\"."

      - name: customer_witness_whose_user_id_is_not_a_witness_party_returns_unknown_role
        claim_type: violation_to_error
        grounds:
          - validations[P2]
          - errors[ERR_UNKNOWN_ROLE]
          - roles.CustomerWitness
        distinguishing_aspect: "CustomerWitness is the only entity_backed role: its X-User-ID must resolve to a live WitnessParty row. A syntactically fine but unbacked id fails at P2 with ERR_UNKNOWN_ROLE (401), not at P6 with ERR_WITNESS_IDENTITY_MISMATCH (403)."
        test_recipe:
          setup:
            - "One order and one FactoryAcceptanceTest exist; the database contains no WitnessParty row with id u-not-a-party."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-ER3"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /factory-acceptance-tests
              payload: { engineered_order_id: "${order_id}", test_duration_hours: 10, witness_required: true, requires_impulse: false }
              as: TestEngineer
              captures: { fat_id: "$.data.id" }
          trigger:
            - call: GET /factory-acceptance-tests/${fat_id}
              payload: {}
              as: CustomerWitness
              as_user_id: "u-not-a-party"
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNKNOWN_ROLE\"."
            - "The same GET as TestEngineer returns HTTP 200 with data.status == \"REQUESTED\", proving the row itself is readable."

      - name: contract_value_cents_sent_as_string_returns_field_type_invalid
        claim_type: violation_to_error
        grounds:
          - validations[P28]
          - errors[ERR_FIELD_TYPE_INVALID]
          - endpoints[create_engineered_order]
        distinguishing_aspect: "A numerically valid but wrongly typed value (\"4000000\" as a JSON string) is a payload-shape violation caught by P28 with ERR_FIELD_TYPE_INVALID (422); it must not be silently coerced into the integer 4000000 and accepted."
        test_recipe:
          setup:
            - "Clock set; no orders exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-ER4"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: "4000000"
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_FIELD_TYPE_INVALID\"."
            - "GET /engineered-orders as PlantAdmin still returns total_count == 0, so no coerced row was written."

      - name: second_index_point_for_same_commodity_and_month_returns_duplicate_index_point
        claim_type: violation_to_error
        grounds:
          - validations[P56]
          - errors[ERR_DUPLICATE_INDEX_POINT]
          - endpoints[create_commodity_index_point]
        distinguishing_aspect: "Uniqueness for CommodityIndexPoint is on the (commodity, index_month) pair only - a second COPPER/2026-01 point is rejected with ERR_DUPLICATE_INDEX_POINT (409) even though its index_value, published_at and is_provisional all differ."
        test_recipe:
          setup:
            - "One published COPPER index point for 2026-01 already exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /commodity-index-points
              payload: { commodity: "COPPER", index_month: "2026-01", index_value: 10000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
          trigger:
            - call: POST /commodity-index-points
              payload: { commodity: "COPPER", index_month: "2026-01", index_value: 11500, published_at: "2026-02-20T00:00:00Z", is_provisional: true }
              as: ContractAdmin
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_INDEX_POINT\"."
            - "The same payload with commodity ALUMINUM succeeds with HTTP 201, proving the key is the pair and not the month alone."

      - name: escalation_adjustment_with_no_index_points_at_all_returns_index_point_missing
        claim_type: violation_to_error
        grounds:
          - validations[P68]
          - errors[ERR_INDEX_POINT_MISSING]
          - endpoints[create_escalation_adjustment]
        distinguishing_aspect: "With a well formed clause but a completely empty CommodityIndexPoint table, adjustment creation fails at P68 with ERR_INDEX_POINT_MISSING (422) - an absent-collection corner that must not be reported as a zero-valued escalation of 0 cents."
        test_recipe:
          setup:
            - "An order with an escalation clause covering 2026-01 through 2026-06; zero commodity index points exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-ER6"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 9000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /engineered-orders/${order_id}/escalation-clauses
              payload:
                copper_weight_bp: 6000
                aluminum_weight_bp: 2000
                core_steel_weight_bp: 2000
                escalatable_base_cents: 5000000
                base_index_month: "2026-01"
                cap_bp: 1000
                collar_bp: 200
                de_escalation_enabled: true
                final_window_end_month: "2026-06"
              as: ContractAdmin
              captures: { clause_id: "$.data.id" }
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: ContractAdmin
              captures: { order_version: "$.data.version" }
          trigger:
            - call: POST /engineered-orders/${order_id}/escalation-adjustments
              payload: { escalation_clause_id: "${clause_id}", variant: "PROVISIONAL", prepared_by_user_id: "u-contract-1", expected_engineered_order_version: "${order_version}" }
              as: ContractAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INDEX_POINT_MISSING\"."
            - "GET /escalation-adjustments as ContractAdmin returns total_count == 0, so no adjustment row was created."

      - name: compliance_label_pinning_a_draft_test_report_returns_test_report_not_issued
        claim_type: violation_to_error
        grounds:
          - validations[P45]
          - errors[ERR_TEST_REPORT_NOT_ISSUED]
          - endpoints[create_compliance_label]
        distinguishing_aspect: "Label creation refuses a TestReport that exists and is readable but sits in DRAFT: P45 demands status ISSUED, so the answer is 409 ERR_TEST_REPORT_NOT_ISSUED rather than 404 ERR_TEST_REPORT_NOT_FOUND."
        test_recipe:
          setup:
            - "An order with one DRAFT submittal drawing, one REQUESTED factory acceptance test and one DRAFT test report on that test."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-ER7"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-ER7-A", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
            - call: POST /factory-acceptance-tests
              payload: { engineered_order_id: "${order_id}", test_duration_hours: 8, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat_id: "$.data.id" }
            - call: POST /factory-acceptance-tests/${fat_id}/test-reports
              payload: { winding_temp_rise_c: 55, temp_rise_limit_c: 65, short_circuit_current_ka: 20, arc_duration_ms: 200, working_distance_mm: 455 }
              as: TestEngineer
              captures: { report_id: "$.data.id" }
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: ComplianceOfficer
