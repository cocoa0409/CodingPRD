# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Probate Court & Estate Administration — Expert
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not covered by §1.8.
# Flat endpoints; expected_estate_version captured from GET /estates/{id}.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_estate_returns_201_with_computed_fields
        claim_type: Creation
        grounds: [entities.Estate, endpoints]
        distinguishing_aspect: "POST /estates with all required fields returns 201, status DRAFT, supervision_level FULL (gross 6000000), all ledger fields 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { decedent_name: "Jane Doe", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id, ver: $.data.version }
          assert:
            - "response HTTP status == 201"
            - "Estate.${est_id}.status == DRAFT"
            - "Estate.${est_id}.supervision_level == FULL"
            - "Estate.${est_id}.marshaled_cash_cents == 0"
            - "Estate.${est_id}.version == 1"

      - name: get_estate_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Estate]
        distinguishing_aspect: "GET /estates/{id} returns the stored estate with matching decedent_name and INDEPENDENT supervision for gross 300000."
        test_recipe:
          setup: ["One estate exists."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "Ret Test", date_of_death: "2026-04-01T00:00:00Z", county_code: "SF", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_id}"
              as: Clerk
          assert:
            - "Estate.${est_id}.decedent_name == Ret Test"
            - "Estate.${est_id}.supervision_level == INDEPENDENT"

      - name: list_estates_paginated_envelope
        claim_type: Listing
        grounds: [entities.Estate, endpoints]
        distinguishing_aspect: "GET /estates returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two estates exist."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "E1", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
            - call: "POST /estates"
              payload: { decedent_name: "E2", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
          trigger:
            - call: "GET /estates"
              as: Clerk
          assert:
            - "response_type == array"
            - "response meta contains total_count >= 2 and has_more boolean"

      - name: get_estate_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Estate, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /estates/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /estates/00000000-0000-0000-0000-000000000000"
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_estate_missing_required_field_returns_missing_field
        claim_type: Required Fields
        grounds: [entities.Estate.fields.gross_estate_value_cents, "errors[ERR_MISSING_FIELD]"]
        distinguishing_aspect: "POST /estates omitting gross_estate_value_cents returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { decedent_name: "NoVal", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MISSING_FIELD"
            - "HTTP status == 400"

      - name: create_estate_invalid_enum_returns_missing_field
        claim_type: Type Constraints
        grounds: [entities.Estate.fields.estate_type, "errors[ERR_MISSING_FIELD]"]
        distinguishing_aspect: "POST /estates with estate_type not in {TESTATE, INTESTATE} returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { decedent_name: "BadEnum", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "PROBATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MISSING_FIELD"

      - name: estate_supervision_level_limited_boundary
        claim_type: Computed Fields
        grounds: [calculations.estate_supervision_level, entities.Estate.fields.supervision_level]
        distinguishing_aspect: "Gross exactly 500000 -> supervision_level LIMITED (strict < INDEPENDENT_MAX boundary); gross 5000000 -> FULL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "Lim", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 500000 }
              as: Clerk
              captures: { est_lim_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Full", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 5000000 }
              as: Clerk
              captures: { est_full_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_lim_id}"
              as: Clerk
            - call: "GET /estates/${est_full_id}"
              as: Clerk
          assert:
            - "Estate.${est_lim_id}.supervision_level == LIMITED"
            - "Estate.${est_full_id}.supervision_level == FULL"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Estate.fields.status]
        distinguishing_aspect: "A client-supplied status on POST /estates is ignored; server forces DRAFT (system field)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { decedent_name: "SysF", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
          assert:
            - "Estate.${est_id}.status == DRAFT (system-forced, not client-set)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grant_petition_testate_without_will_returns_will_not_lodged
        claim_type: Precondition Enforcement
        grounds: [state_machines.Petition.PENDING_to_GRANTED, "errors[ERR_WILL_NOT_LODGED]"]
        distinguishing_aspect: "Granting a TESTATE estate's petition with will_lodged=false returns ERR_WILL_NOT_LODGED (409); petition stays PENDING."
        test_recipe:
          setup: ["A DRAFT TESTATE estate with a PENDING petition that has no will lodged."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "Test", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "TESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WILL_NOT_LODGED"
            - "Petition.${pet_id}.status == PENDING"

      - name: grant_already_granted_petition_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Petition.PENDING_to_GRANTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Granting a petition that is already GRANTED returns ERR_INVALID_STATE (409); second grant does not re-fire side effects."
        test_recipe:
          setup: ["An estate whose petition is already GRANTED (estate OPEN)."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "G2", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Petition.${pet_id}.status == GRANTED"

      - name: deny_petition_without_reason_returns_missing_field
        claim_type: Precondition Enforcement
        grounds: [state_machines.Petition.PENDING_to_DENIED, "errors[ERR_MISSING_FIELD]"]
        distinguishing_aspect: "POST /petitions/{id}/deny without denial_reason returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["A DRAFT estate with a PENDING petition."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "Dn", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /petitions/${pet_id}/deny"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MISSING_FIELD"

      - name: appoint_full_estate_without_approved_bond_returns_bond_not_approved
        claim_type: Precondition Enforcement
        grounds: [state_machines.PersonalRepresentative.NOMINATED_to_APPOINTED, "errors[ERR_BOND_NOT_APPROVED]"]
        distinguishing_aspect: "Appointing a PR on a FULL estate whose bond is only FILED (not APPROVED) returns ERR_BOND_NOT_APPROVED (409)."
        test_recipe:
          setup: ["A FULL estate (gross 6000000), granted petition, NOMINATED PR, and a FILED (not yet approved) bond."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "BNA", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOND_NOT_APPROVED"
            - "PersonalRepresentative.${rep_id}.status == NOMINATED"

      - name: approve_bond_below_required_returns_bond_insufficient
        claim_type: Precondition Enforcement
        grounds: [state_machines.Bond.FILED_to_APPROVED, "errors[ERR_BOND_INSUFFICIENT]"]
        distinguishing_aspect: "Approving a bond whose penal_amount_cents (3249999) is below required_amount_cents (3250000) returns ERR_BOND_INSUFFICIENT (409)."
        test_recipe:
          setup: ["A FULL estate with a NOMINATED PR and a FILED bond of penal 3249999 (required 3250000)."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "BI", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3249999 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOND_INSUFFICIENT"
            - "Bond.${bond_id}.status == FILED"

      - name: allow_late_filed_claim_auto_barred
        claim_type: Valid Transition
        grounds: [state_machines.CreditorClaim.FILED_to_BARRED, calculations.claim_bar_date]
        distinguishing_aspect: "A claim filed at 2026-09-15 (after bar date 2026-08-29) sent to /allow becomes BARRED, not ALLOWED; allowed_amount_cents ignored."
        test_recipe:
          setup: ["An OPEN estate (granted at 2026-05-01) with APPOINTED PR (INDEPENDENT) and a claim filed at 2026-09-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Clerk
            - call: "POST /estates"
              payload: { decedent_name: "Late", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: Clerk
            - call: "POST /claims"
              payload: { estate_id: "${est_id}", creditor_name: "L", claim_class: "GENERAL", claimed_amount_cents: 100000 }
              as: Clerk
              captures: { claim_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/allow"
              payload: { allowed_amount_cents: 100000, expected_estate_version: "${v2}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
          assert:
            - "CreditorClaim.${claim_id}.status == BARRED"

      - name: allow_claim_amount_exceeds_claimed_returns_allowed_amount_invalid
        claim_type: Precondition Enforcement
        grounds: [state_machines.CreditorClaim.FILED_to_ALLOWED, "errors[ERR_ALLOWED_AMOUNT_INVALID]"]
        distinguishing_aspect: "Allowing a claim with allowed_amount_cents 200000 > claimed_amount_cents 100000 returns ERR_ALLOWED_AMOUNT_INVALID (409)."
        test_recipe:
          setup: ["An OPEN estate with an APPOINTED PR and an in-period FILED claim claimed 100000."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "AA", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /claims"
              payload: { estate_id: "${est_id}", creditor_name: "C", claim_class: "GENERAL", claimed_amount_cents: 100000 }
              as: Clerk
              captures: { claim_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/allow"
              payload: { allowed_amount_cents: 200000, expected_estate_version: "${v2}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALLOWED_AMOUNT_INVALID"
            - "CreditorClaim.${claim_id}.status == FILED"

      - name: marshal_from_listed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Asset.APPRAISED_to_MARSHALED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Marshaling a LISTED (not yet APPRAISED) asset returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPEN estate with an APPOINTED PR and a LISTED asset."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "MS", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "X", asset_class: "CASH", declared_value_cents: 100000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /assets/${asset_id}/marshal"
              payload: { expected_estate_version: "${v2}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Asset.${asset_id}.status == LISTED"

      - name: hold_hearing_before_start_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Hearing.SCHEDULED_to_HELD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Holding a hearing whose start_at (2026-06-01T10:00) is after the current clock (2026-05-01 default) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An estate with a SCHEDULED future hearing; clock at default 2026-05-01."]
          setup_api_calls:
            - call: "POST /estates"
