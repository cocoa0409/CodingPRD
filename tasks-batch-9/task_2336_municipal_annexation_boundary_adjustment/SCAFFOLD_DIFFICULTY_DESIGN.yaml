            - "UtilityAccount.${ua_s}.rate_schedule == INSIDE_CITY"
            - "UtilityAccount.${ua_s}.effective_monthly_cents == 4000"
            - "UtilityAccount.${ua_s}.account_status == INSIDE_CITY_ACTIVE"
            - "ServiceCommitment.${cm_ef_wat}.activated_account_count == 1"
            - "ServiceCommitment.${cm_ef_wat}.commitment_status == FULFILLED"
            - "ServiceCommitment.${cm_ef_sew}.activated_account_count == 1"
