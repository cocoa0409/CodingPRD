            - "the accept on the third order returns 422 with capacity_error == ERR_SITE_CAPACITY_INSUFFICIENT"
            - "capacity_error != ERR_BELOW_MIN_ORDER even though the accepted quantity is also at the minimum-order boundary"

      - name: entitlement_exhaustion_beats_program_standing_conflict
        grounds:
          - validations[priority=22]
          - validations[priority=24]
