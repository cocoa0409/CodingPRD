                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/business-units"
                payload: { name: "Unit Y", cost_center_code: "CC-701", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_y: "$.data.id" }
              - call: "POST /finops/provisioning-requests"
