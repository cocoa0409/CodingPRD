  - rule_id: non_linear_state_machine
    instances:
      - name: category_plan_revision_and_reforecast_loop
        grounds:
          - state_machines.CategoryPlan.DRAFT_to_SUBMITTED
          - state_machines.CategoryPlan.SUBMITTED_to_DRAFT
          - state_machines.CategoryPlan.SUBMITTED_to_APPROVED
          - state_machines.CategoryPlan.APPROVED_to_REFORECAST_OPEN
          - state_machines.CategoryPlan.REFORECAST_OPEN_to_SUBMITTED
          - entities.CategoryPlan.fields.reforecast_round
          - concurrency_rules[reforecast-open-stale-category-plan]
        distinguishing_aspect: |
          CategoryPlan is CYCLIC on two nested loops that re-enter the same states: the unbounded
          revision loop DRAFT -> SUBMITTED -> DRAFT and the bounded governance loop APPROVED ->
          REFORECAST_OPEN -> SUBMITTED -> APPROVED. The bounded loop is what makes it non-linear
          rather than merely revertible: reforecast_round is 0 after a full revision loop and 1
          after a full governance loop, and the plan re-enters APPROVED through the very same
          SUBMITTED -> APPROVED edge it used the first time.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine through Department WAPP, Category DRSS, StoreCluster Cold-A"
            - "CategoryPlan SPRING 2027 in DRAFT with PlanMonth M1 and M2 in DRAFT and OptionPlan OP1 OPEN carrying a balanced five-cell size curve"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 2, fiscal_month_label: "2027-04", first_receipt_date: "2027-04-02T00:00:00Z", bom_inventory_cents: 22000000, planned_sales_cents: 36000000, planned_markdown_cents: 3000000, planned_eom_cents: 24000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m2_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "round 1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/reject"
              payload: { rejection_reason: "markdown plan too thin" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "round 2" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "approved" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              captures: { plan_v1: $.data.version }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "director asked for a mid-season rebuild", expected_category_plan_version: "${plan_v1}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { cycle_id: $.data.id, cycle_round: $.data.round_index }
            - call: "POST /otb/reforecast-cycles/${cycle_id}/close"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "reforecast round 1 rebuild" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "re-approved" }
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "after the first submit: CategoryPlan.${plan_id}.status == SUBMITTED and submitted_by_user_id == planner-1 and reforecast_round == 0"
            - "after the reject: CategoryPlan.${plan_id}.status == DRAFT, PlanMonth.${m1_id}.status == DRAFT with otb_planned_cents == 0, otb_open_cents == 0, markdown_reserve_cents == 0, provisional_sell_through_bps == 0, reserve_rate_bps == 0"
            - "after the reject: OptionPlan.${op1_id}.status == OPEN with option_slots_total == null, option_slots_open == null, target_units_per_option == null"
            - "after the reject: CategoryPlan.${plan_id}.reforecast_round == 0 - the revision loop is free and consumes no reforecast round"
            - "after the first approve: CategoryPlan.${plan_id}.status == APPROVED, receipt_budget_cents == 60000000, PlanMonth.${m1_id}.status == LOCKED_PLAN with otb_planned_cents == 18200000, PlanMonth.${m2_id}.otb_planned_cents == 21970000, OptionPlan.${op1_id}.option_slots_total == 14"
            - "after the reforecast open: CategoryPlan.${plan_id}.status == REFORECAST_OPEN and reforecast_round == 1 and ReforecastCycle.${cycle_id}.status == OPEN and ${cycle_round} == 1 and ReforecastCycle.${cycle_id}.trigger_reason == DIRECTOR_REQUEST"
            - "after the reforecast open: PlanMonth.${m1_id}.status is still LOCKED_PLAN with otb_planned_cents == 18200000 - opening a round does not unwind the month locks the way a reject does"
            - "after the cycle close: ReforecastCycle.${cycle_id}.status == CLOSED, reached from OPEN without any ChaseCancelDecision ever existing"
            - "after the second submit: CategoryPlan.${plan_id}.status == SUBMITTED, entered from REFORECAST_OPEN rather than from DRAFT, and reforecast_round is still 1"
            - "after the second approve: CategoryPlan.${plan_id}.status == APPROVED, receipt_budget_cents == 60000000 again, reforecast_round == 1, and the plan has traversed DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED -> REFORECAST_OPEN -> SUBMITTED -> APPROVED, visiting SUBMITTED three times and APPROVED twice"

      - name: receipt_commitment_parallel_state_dimensions
        grounds:
          - state_machines.ReceiptCommitment.PROPOSED_to_COMMITTED
          - state_machines.ReceiptCommitment.AWAITING_SHIP_to_SHIPPED
          - state_machines.ReceiptCommitment.SHIPPED_to_PARTIALLY_RECEIVED
          - state_machines.ReceiptCommitment.PARTIALLY_RECEIVED_to_RECEIVED
          - state_machines.ReceiptCommitment.COMMITTED_to_CLOSED
          - entities.ReceiptCommitment.fields.commit_status
          - entities.ReceiptCommitment.fields.fulfillment_status
        distinguishing_aspect: |
          A different entity from CategoryPlan and a different flavour of non-linearity: one
          ReceiptCommitment row carries TWO independent state dimensions, commit_status (financial)
          and fulfillment_status (physical), each with its own initial and terminal states. The
          commit moves commit_status PROPOSED -> COMMITTED while fulfillment_status stays
          AWAITING_SHIP; the ship and the partial receipt move fulfillment_status twice while
          commit_status stays COMMITTED; the two dimensions couple at exactly one point - the
          receipt that closes the balance drives fulfillment_status to RECEIVED and commit_status to
          CLOSED in the same request.
        test_recipe:
          setup:
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 LOCKED_PLAN with otb_planned_cents 18,200,000, OptionPlan OP1 SLOTTED"
            - "one CARRYOVER AssortmentItem DRSS-PAR-01 on OP1 supplied by Aurora Mills"
