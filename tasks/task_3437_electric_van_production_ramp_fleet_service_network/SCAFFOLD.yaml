      - name: window_end
        type: datetime
        source: input
        required: true
        description: "Visit window end (half-open upper bound, exclusive)"
      - name: purpose
        type: enum
        source: input
        required: true
        description: "Reason for the visit"
        constraints: "one of {MAINTENANCE, REPAIR, RECALL}"
      - name: parts_lines
        type: array
        source: input
        required: true
        description: "Parts reserved at booking: list of {sku: string, qty: integer > 0}; reserved against the stocking center (service_center_id, else the van's home center); may be empty"
      - name: status
        type: enum
        source: system
        description: "ServiceVisit state machine state"
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
        default: SCHEDULED
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ServiceTechnician who completed the visit"
        default: null

  - name: PartsStock
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        required: true
        description: "FK -> ServiceCenter.id; stocking location"
      - name: sku
        type: string
        source: input
        required: true
        description: "Part SKU; unique per service center (POST /parts-stocks upserts on the pair)"
      - name: reorder_threshold
        type: integer
        source: input
        required: true
        description: "When on_hand_qty falls strictly below this after a mutation, restock_needed becomes true"
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Physical units present (reserved units remain on hand until consumed); invariant received_total_qty == on_hand_qty + consumed_total_qty, with reserved_qty a subset view of on_hand_qty"
        default: 0
      - name: reserved_qty
        type: integer
        source: system
        description: "Stock reserved by non-terminal ServiceVisits' parts_lines"
        default: 0
      - name: consumed_total_qty
        type: integer
        source: system
        description: "Cumulative stock consumed by COMPLETED visits"
        default: 0
      - name: received_total_qty
        type: integer
        source: system
        description: "Cumulative stock received via POST /parts-stocks qty_delta"
        default: 0
      - name: restock_needed
        type: boolean
        source: computed
        description: "True iff on_hand_qty < reorder_threshold; recomputed on every mutation of the row"
        default: false

  - name: SoftwareCampaign
