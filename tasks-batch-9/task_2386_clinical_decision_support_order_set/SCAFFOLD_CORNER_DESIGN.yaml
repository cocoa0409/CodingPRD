              as_user_id: "${s2_id}"
            - call: POST /cds/alerts/${alert_id}/activate
              payload: { activation_note: "Go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /_events/alert-firings
              payload: { alert_id: "${alert_id}", fired_at_start: "2026-08-02T00:00:00Z", interval_seconds: 3600, fire_count: 120, override_count: 39, distinct_clinician_count: 10, override_reason_code: "CLINICAL_JUDGMENT" }
              as: SystemAdmin
            - call: POST /_events/alert-firings
              payload: { alert_id: "${alert_id}", fired_at_start: "2026-08-07T00:00:00Z", interval_seconds: 3600, fire_count: 120, override_count: 38, distinct_clinician_count: 10, override_reason_code: "CLINICAL_JUDGMENT" }
              as: SystemAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: SystemAdmin
            - call: GET /cds/alerts/${alert_id}
              payload: {}
              as: SystemAdmin
              captures: { av1: $.data.version }
            - call: POST /cds/alerts/${alert_id}/burden-windows
              payload: { expected_alert_version: "${av1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-07T00:00:00Z" }
              as: SystemAdmin
              captures: { wa_id: $.data.id }
          trigger:
            - call: POST /cds/alerts/${alert_id}/burden-windows/${wa_id}/close
              payload: { closure_reason: "MANUAL_CLOSE" }
              as: SystemAdmin
              captures: { rate_a: $.data.override_rate, bi_a: $.data.burden_index, cls_a: $.data.burden_classification }
            - call: GET /cds/alerts/${alert_id}
              payload: {}
              as: SystemAdmin
              captures: { av2: $.data.version }
            - call: POST /cds/alerts/${alert_id}/burden-windows
              payload: { expected_alert_version: "${av2}", window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: SystemAdmin
              captures: { wb_id: $.data.id }
            - call: POST /cds/alerts/${alert_id}/burden-windows/${wb_id}/close
              payload: { closure_reason: "MANUAL_CLOSE" }
              as: SystemAdmin
              captures: { rate_b: $.data.override_rate, bi_b: $.data.burden_index, cls_b: $.data.burden_classification }
          assert:
            - "window A: ${rate_a} == 0.3250, volume_factor == 2.0000, ${bi_a} == 65.00 and ${cls_a} == LOW_VALUE (the threshold is inclusive)"
            - "window B: ${rate_b} == 0.3167 (round(38/120, 4)), volume_factor == 2.0000, ${bi_b} == 63.34 and ${cls_b} == MONITOR"
            - "both windows report burden_index_clinician_weighted == 50.00 (10 of 10 clinicians overriding, volume factor round(10/20,4) == 0.5000)"
            - "the two windows are adjacent on the half-open convention and neither creation raised ERR_BURDEN_WINDOW_OVERLAP"
            - "GET /cds/alerts/${alert_id} finally shows windowed_fire_count == 240, unwindowed_fire_count == 0, latest_burden_index == 63.34 and latest_burden_classification == MONITOR"

      - name: layer_optimistic_concurrency_on_the_content_request_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[OrderSet]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_conflict_stale_parent_version_412_beats_request_not_accepted_409
          rationale: "The stale expected_content_request_version 412 is asserted there, including its precedence over the state error."

      - name: layer_cascading_side_effects_across_four_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.OrderSet.review_state.transitions[SPECIALTY_APPROVAL->DRAFT]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_specialty_revise_voids_assignments_credits_workload_restages_alert
          rationale: "All four cascade links, their ordering and the untouched casting row are asserted end to end there."

      - name: layer_dual_variant_calculation_delta_on_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - calculations.alert_burden_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_burden_index_fire_weighted_versus_clinician_weighted
          rationale: "Both variants and their delta on a single firing ledger are asserted there."

  - section: consistency_model
    instances:

      - name: consistency_immediate_triage_response_carries_the_recalibrated_priority_score
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.content_request_priority_score
        distinguishing_aspect: "The recalibrated score and its basis are present in the triage response body itself, not merely on a follow-up read: the POST response and an immediately subsequent GET agree exactly, with no intervening call."
        test_recipe:
          setup:
            - "One INTAKE_SUBMITTED SAFETY_URGENT request with patient_safety_flag true and three peer-reviewed citations."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CRITICAL_CARE", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Sepsis hard stop request", request_type: "ALERT", clinical_domain: "CRITICAL_CARE", urgency: "SAFETY_URGENT", evidence_grade: "A", clinical_sponsor_id: "${sponsor_id}", patient_safety_flag: true, evidence_citations: [{ citation: "Surviving Sepsis 2021", peer_reviewed: true }, { citation: "NEJM 2018 sepsis", peer_reviewed: true }, { citation: "JAMA 2019 bundles", peer_reviewed: true }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id, intake_score: $.data.priority_score, intake_basis: $.data.priority_score_basis }
          trigger:
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Safety urgent, accept immediately" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { post_score: $.data.priority_score, post_basis: $.data.priority_score_basis, post_status: $.data.status }
            - call: GET /cds/content-requests/${cr_id}
              payload: {}
              as: SystemAdmin
              captures: { get_score: $.data.priority_score, get_basis: $.data.priority_score_basis }
          assert:
            - "${intake_score} == 80.00 (EVIDENCE_GRADE_POINTS[A] 40 plus URGENCY_POINTS[SAFETY_URGENT] 25 plus the 15 safety bonus) and ${intake_basis} == INTAKE_PROVISIONAL"
            - "${post_score} == 58.00 (min(40, 6 * 3) 18 plus 25 plus 15, times 1 + 0 backlog age) and ${post_basis} == COMMITTEE_CALIBRATED in the POST response body itself"
            - "${get_score} == ${post_score} and ${get_basis} == ${post_basis} with no re-read delay"
            - "${post_status} == TRIAGE_ACCEPTED and peer_reviewed_citation_count == 3 in the same response"

