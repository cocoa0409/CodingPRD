# =============================================================================
# PRD-bench seed tables — Naturopathic & Functional-Medicine Practice
# Task 0921. Difficulty target: beyond-Expert density.
# =============================================================================

scenario: |
  generate task hard than expert level! 921. Naturopathic & Functional-Medicine
  Practice: intake & extended history, functional lab panel & interpretation,
  protocol & supplement plan/dispensary, membership/package & visit, telehealth
  & messaging, insurance vs cash & superbill, follow-up & titration, referral

domain_name: naturopathic-functional-medicine

# Flat topology: every resource is addressed at the root. There is no single
# owning aggregate, so the prefix is empty and each entity owns a top-level
# collection segment (/patients, /lab-orders, /protocols, ...).
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - self_referential      # Protocol.supersedes_protocol_id -> Protocol.id
    - cross_aggregate       # Referral -> LabOrder, Encounter -> MessageThread

  role_model: segregation_of_duties
  consistency_model: immediate

  interval_semantics_note: |
    Interval geometry is DELIBERATELY NOT UNIFORM across this domain. No single
    habit may be applied globally:
      - HALF-OPEN [start, end): Encounter scheduling windows on a Practitioner.
        Two encounters that merely touch (one ends exactly when the next starts)
        do NOT collide.
      - CLOSED [start, end]: Membership billing cycles on a Patient. Two
        memberships that merely touch (one ends on the day the next starts) DO
        collide.
      - CLOSED lower bound: lab supplement wash-out. A collection dated exactly
        on `last_dose_date + washout_days` DOES satisfy the wash-out.
      - CLOSED both ends: menstrual cycle-day window for hormone panels
        (cycle_day 19 and cycle_day 22 both qualify for a 19..22 window).
      - Analyte bands mix both within ONE calculation: the standard laboratory
        reference range is CLOSED at both ends (a value equal to standard_high
        is IN_RANGE) while the practice's functional/optimal range is HALF-OPEN
        at the top (a value equal to optimal_high is ABOVE_OPTIMAL).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Declared constants — EVERY named constant used anywhere in this scaffold has
# an explicit value here. Nothing downstream may invent a number.
# =============================================================================
constants:
  # --- logical clock ---
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- intake completeness ---
  INTAKE_SECTION_WEIGHT_CHIEF_COMPLAINT_TIMELINE: 25
  INTAKE_SECTION_WEIGHT_SYSTEMS_REVIEW: 25
  INTAKE_SECTION_WEIGHT_DIET_LIFESTYLE: 15
  INTAKE_SECTION_WEIGHT_MEDICATIONS_SUPPLEMENTS: 25
  INTAKE_SECTION_WEIGHT_FAMILY_HISTORY: 10
  INTAKE_SUBMITTED_WEIGHT_DIVISOR: 2          # SUBMITTED counts floor(weight / 2)
  INTAKE_SECTION_VALIDITY_DAYS: 180
  INTAKE_BOOKING_MIN_SCORE: 60                # >= to book an Encounter
  INTAKE_PROTOCOL_MIN_SCORE: 85               # >= to issue a Protocol

  # --- membership tiers (fixed catalog; no plan entity) ---
  MEMBERSHIP_CYCLE_DAYS: 30
  MEMBERSHIP_TIER_FOUNDATION:
    monthly_fee_cents: 9900
    included_visits: 2
    included_lab_credits: 1
    dispensary_discount_pct: 0.05
    includes_messaging: false
  MEMBERSHIP_TIER_CORE:
    monthly_fee_cents: 19900
    included_visits: 4
    included_lab_credits: 2
    dispensary_discount_pct: 0.10
    includes_messaging: true
  MEMBERSHIP_TIER_PREMIER:
    monthly_fee_cents: 34900
    included_visits: 8
    included_lab_credits: 4
    dispensary_discount_pct: 0.20
    includes_messaging: true

  # --- visits ---
  VISIT_FEE_IN_PERSON_CENTS: 22500
  VISIT_FEE_TELEHEALTH_CENTS: 18000
  EXTENDED_VISIT_THRESHOLD_MINUTES: 45
  EXTENDED_VISIT_BLOCK_MINUTES: 15
  EXTENDED_VISIT_BLOCK_FEE_CENTS: 4500
  TELEHEALTH_TURNAROUND_BUFFER_MINUTES: 10
  ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS: 24
  LATE_CANCEL_NO_SHOW_FEE_CENTS: 7500

  # --- messaging / e-visit ---
  MESSAGE_SLA_HOURS: 48
  EVISIT_PATIENT_MESSAGE_THRESHOLD: 4
  EVISIT_CLINICAL_MINUTES_THRESHOLD: 15
  EVISIT_FEE_CENTS: 9500

  # --- functional lab panel catalog (fixed; panel_code is the enum) ---
  LAB_PANEL_SERUM_METABOLIC:
    specimen_type: SERUM
    fasting_required: true
    cycle_day_window_start: null
    cycle_day_window_end: null
    washout_class: null
    washout_days: 0
    cash_price_cents: 24000
    lab_credit_cost: 1
  LAB_PANEL_DUTCH_HORMONE:
    specimen_type: DRIED_URINE
    fasting_required: false
    cycle_day_window_start: 19
    cycle_day_window_end: 22
    washout_class: HORMONE_SUPPORT
    washout_days: 14
    cash_price_cents: 39000
    lab_credit_cost: 2
  LAB_PANEL_SALIVA_CORTISOL:
    specimen_type: SALIVA
    fasting_required: false
    cycle_day_window_start: null
    cycle_day_window_end: null
    washout_class: ADAPTOGEN
    washout_days: 7
    cash_price_cents: 21000
    lab_credit_cost: 1
  LAB_PANEL_STOOL_GI_MAP:
    specimen_type: STOOL
    fasting_required: false
    cycle_day_window_start: null
    cycle_day_window_end: null
    washout_class: PROBIOTIC
    washout_days: 10
    cash_price_cents: 45000
    lab_credit_cost: 2

  # --- flattened aliases of the two catalogue blocks above, so that every
  #     constant referenced by a calculation has a scalar value of its own ---
  MEMBERSHIP_TIER_FOUNDATION_DISCOUNT_PCT: 0.05
  MEMBERSHIP_TIER_CORE_DISCOUNT_PCT: 0.10
  MEMBERSHIP_TIER_PREMIER_DISCOUNT_PCT: 0.20
  LAB_PANEL_SERUM_METABOLIC_WASHOUT_DAYS: 0
  LAB_PANEL_DUTCH_HORMONE_WASHOUT_DAYS: 14
  LAB_PANEL_SALIVA_CORTISOL_WASHOUT_DAYS: 7
  LAB_PANEL_STOOL_GI_MAP_WASHOUT_DAYS: 10

  # --- referral ---
  RED_FLAG_REFERRAL_DUE_DAYS: 3
  REFERRAL_MAX_ATTEMPTS: 3

  # --- dispensary ---
  REVERSAL_AUTHORIZATION_THRESHOLD_CENTS: 20000
  ADVERSE_REVERSAL_WINDOW_DAYS: 14

  # --- titration ---
  SYMPTOM_SCALE_MAX: 40
  TITRATION_ADVANCE_DELTA_MIN: 8
  TITRATION_HOLD_DELTA_MIN: 3
  TITRATION_REDUCE_DELTA_MIN: 0
  TITRATION_DOSE_ADVANCE_MULTIPLIER: 1.25
  TITRATION_DOSE_REDUCE_MULTIPLIER: 0.50

  # --- superbill ---
  SUPERBILL_MAX_REVISIONS: 3

# =============================================================================
# Request-only enums — member sets that live in request bodies rather than on
# a persisted entity field. Declared here so the enum rung at validation
# priority 12 has an explicit membership list for every enum-typed input.
# =============================================================================
request_enums:
  scope_review_close_outcome: [CLEARED, RESTRICTED]
  superbill_action: [ISSUE, VOID, REISSUE, REPORT_DENIAL, APPEAL, CLOSE]
  referral_action: [ACKNOWLEDGE, REPORT, CLOSE, DECLINE, RE_REFER]
  adverse_reaction_severity: [MILD, MODERATE, SEVERE]
  system_discontinue_reasons: [ADVERSE_REACTION, SUPERSEDED_BY_REVISION, PROTOCOL_DISCONTINUED]

# =============================================================================
# Table 1: Entity-Relationship Table  (15 entities, flat topology)
# =============================================================================
entities:

  # ---------------------------------------------------------------- 1
  - name: Practitioner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Practitioner display name" }
      - { name: credential, type: enum, source: input, description: "Clinical credential", constraints: "one of ND, HEALTH_COACH, DISPENSARY_TECH, CLINICAL_DIRECTOR" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier printed on superbills; may be null for non-rendering staff", default: null }
      - { name: licensed_state_codes, type: array, source: input, description: "Two-letter state codes in which this practitioner is licensed to deliver telehealth" }
      - { name: is_active, type: boolean, source: input, default: true, description: "False disables the practitioner for new bookings" }

  # ---------------------------------------------------------------- 2
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of residence; drives telehealth licensure matching" }
      - { name: primary_practitioner_id, type: string, source: input, description: "FK -> Practitioner.id; the treating naturopathic doctor of record" }
      - { name: telehealth_consent, type: boolean, source: input, default: false, description: "Modality consent for telehealth encounters" }
      - { name: medication_classes, type: array, source: input, description: "Prescription medication classes reported on intake; matched against DispensaryProduct.interacts_with_med_classes" }
      - { name: clinical_status, type: enum, source: system, default: INTAKE, description: "Care-relationship axis", constraints: "one of INTAKE, ESTABLISHED, INACTIVE" }
      - { name: scope_review_status, type: enum, source: system, default: NONE, description: "Scope-of-practice review axis, independent of clinical_status", constraints: "one of NONE, UNDER_REVIEW, CLEARED, RESTRICTED" }
      - { name: scope_review_reason, type: string, source: system, default: null, description: "Reason captured when a scope-of-practice review was opened" }
      - { name: scope_review_opened_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ClinicalDirector who opened the current review (audit identity string, not a navigable FK)" }
      - { name: intake_booking_score, type: integer, source: computed, default: 0, description: "Booking variant of the intake completeness score (0-100); see calculations.intake_completeness_score" }
      - { name: intake_protocol_score, type: integer, source: computed, default: 0, description: "Protocol variant of the intake completeness score (0-100); attested sections only" }
      - { name: clinical_write_gate, type: enum, source: computed, default: OPEN, description: "Global write gate maintained by cascade; any value other than OPEN freezes the gated clinical-write endpoint families", constraints: "one of OPEN, FROZEN_SCOPE_REVIEW, FROZEN_RED_FLAG" }
      - { name: red_flag_referral_open, type: boolean, source: computed, default: false, description: "True while a RED_FLAG_AUTO Referral for this patient is still in status SENT" }
      - { name: cash_charged_total_cents, type: integer, source: computed, default: 0, description: "Lifetime cash charged to the patient across encounters, e-visits, lab cash orders and dispensing" }
      - { name: cash_refunded_total_cents, type: integer, source: computed, default: 0, description: "Lifetime cash reversed back to the patient; conservation counterpart of cash_charged_total_cents" }

  # ---------------------------------------------------------------- 3
  - name: IntakeSection
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; owner of this intake section" }
      - { name: section_type, type: enum, source: input, description: "Which intake section this row carries; unique per patient", constraints: "one of CHIEF_COMPLAINT_TIMELINE, SYSTEMS_REVIEW, DIET_LIFESTYLE, MEDICATIONS_SUPPLEMENTS, FAMILY_HISTORY" }
      - { name: payload_summary, type: string, source: input, description: "Free-text digest of what the patient supplied for this section" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Section lifecycle", constraints: "one of SUBMITTED, ATTESTED, EXPIRED" }
      - { name: weight, type: integer, source: system, description: "Scoring weight copied from the INTAKE_SECTION_WEIGHT_* constant for this section_type" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the most recent submission" }
      - { name: attested_at, type: datetime, source: system, default: null, description: "Logical-clock instant of attestation; null until attested" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "attested_at + INTAKE_SECTION_VALIDITY_DAYS; null until attested" }

  # ---------------------------------------------------------------- 4
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; member of record" }
      - { name: tier, type: enum, source: input, description: "Membership tier; resolves the MEMBERSHIP_TIER_* constant block", constraints: "one of FOUNDATION, CORE, PREMIER" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Membership lifecycle", constraints: "one of ACTIVE, PAUSED, EXPIRED" }
      - { name: cycle_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) on which the current cycle opens" }
      - { name: cycle_end_date, type: string, source: computed, description: "cycle_start_date + MEMBERSHIP_CYCLE_DAYS - 1 day; the cycle interval is CLOSED on both ends" }
      - { name: cycle_index, type: integer, source: system, default: 1, description: "Increments on every renewing roll-cycle" }
      - { name: paused_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the current pause; null when not paused" }
      - { name: paused_days_total, type: integer, source: system, default: 0, description: "Cumulative days spent paused; added to cycle_end_date on resume" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Resolved from the tier constant block" }
      - { name: dispensary_discount_pct, type: number, source: computed, description: "Resolved from the tier constant block; drives the MEMBER pricing variant" }
      - { name: includes_messaging, type: boolean, source: computed, description: "Resolved from the tier constant block; when true a thread never converts to a billable e-visit" }
      - { name: visits_granted, type: integer, source: computed, default: 0, description: "Cumulative visit entitlement granted across cycles" }
      - { name: visits_consumed, type: integer, source: computed, default: 0, description: "Cumulative visit entitlement reserved/consumed by encounters" }
      - { name: visits_remaining, type: integer, source: computed, default: 0, description: "Unused visit entitlement in the current cycle" }
      - { name: visits_forfeited, type: integer, source: computed, default: 0, description: "Visit entitlement lost to cycle roll or late cancellation" }
      - { name: lab_credits_granted, type: integer, source: computed, default: 0, description: "Cumulative lab-panel credit entitlement granted across cycles" }
      - { name: lab_credits_consumed, type: integer, source: computed, default: 0, description: "Cumulative lab-panel credits consumed by lab orders" }
      - { name: lab_credits_remaining, type: integer, source: computed, default: 0, description: "Unused lab-panel credits in the current cycle" }
      - { name: lab_credits_forfeited, type: integer, source: computed, default: 0, description: "Lab-panel credits lost to cycle roll" }
      - { name: last_proration_net_charge_cents, type: integer, source: computed, default: 0, description: "Net cents charged (positive) or credited (negative) by the most recent tier change" }

  # ---------------------------------------------------------------- 5
  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject of the panel" }
      - { name: ordering_practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; taken from X-User-ID of the ordering NaturopathicDoctor" }
      - { name: panel_code, type: enum, source: input, description: "Functional lab panel from the fixed catalog", constraints: "one of SERUM_METABOLIC, DUTCH_HORMONE, SALIVA_CORTISOL, STOOL_GI_MAP" }
      - { name: specimen_type, type: enum, source: computed, description: "Resolved from the panel catalog constant", constraints: "one of SERUM, DRIED_URINE, SALIVA, STOOL" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "Order lifecycle", constraints: "one of ORDERED, WASHOUT_HOLD, COLLECTED, RESULTED, CRITICAL_ESCALATED, INTERPRETED, CANCELLED" }
      - { name: funding_source, type: enum, source: input, description: "How the panel is paid for", constraints: "one of MEMBERSHIP_CREDIT, CASH" }
      - { name: price_cents, type: integer, source: computed, description: "Cash price from the panel catalog when funding_source is CASH, otherwise 0" }
      - { name: lab_credit_cost, type: integer, source: computed, description: "Credits debited from the membership when funding_source is MEMBERSHIP_CREDIT, otherwise 0" }
      - { name: requested_collection_date, type: string, source: input, description: "ISO date on which the specimen is to be collected" }
      - { name: fasting_attested, type: boolean, source: input, default: false, description: "Patient attestation that the fasting requirement was met; checked at collection" }
      - { name: cycle_day, type: integer, source: input, default: null, description: "Menstrual cycle day at collection; required for panels carrying a cycle-day window" }
      - { name: washout_class, type: string, source: computed, default: null, description: "Interfering supplement class from the panel catalog; null when the panel has none" }
      - { name: washout_clearance_date, type: string, source: computed, default: null, description: "Earliest ISO date on which collection satisfies the wash-out; see calculations.washout_clearance_date" }
      - { name: collected_at, type: datetime, source: system, default: null, description: "Logical-clock instant the specimen was recorded as collected" }
      - { name: has_critical_result, type: boolean, source: computed, default: false, description: "True once any LabResult on this order is flagged critical" }
      - { name: interpretation_summary, type: string, source: input, default: null, description: "Narrative recorded when the order is interpreted" }

  # ---------------------------------------------------------------- 6
  - name: LabResult
    parent: null
    common_fields: false
    fields:
      - { name: lab_order_id, type: string, source: system, description: "FK -> LabOrder.id; order this analyte belongs to" }
      - { name: analyte_code, type: string, source: input, description: "Analyte identifier, e.g. TSH" }
      - { name: value, type: number, source: input, description: "Measured analyte value" }
      - { name: unit, type: string, source: input, description: "Measurement unit as reported by the laboratory" }
      - { name: standard_low, type: number, source: input, description: "Lower bound of the standard laboratory reference range (CLOSED)" }
      - { name: standard_high, type: number, source: input, description: "Upper bound of the standard laboratory reference range (CLOSED)" }
      - { name: optimal_low, type: number, source: input, description: "Lower bound of the practice functional/optimal range (CLOSED)" }
      - { name: optimal_high, type: number, source: input, description: "Upper bound of the practice functional/optimal range (HALF-OPEN; a value equal to this bound is ABOVE_OPTIMAL)" }
      - { name: critical_low, type: number, source: input, description: "At or below this value the analyte is critical" }
      - { name: critical_high, type: number, source: input, description: "At or above this value the analyte is critical" }
      - { name: standard_band, type: enum, source: computed, description: "Conventional interpretation", constraints: "one of LOW, IN_RANGE, HIGH" }
      - { name: optimal_band, type: enum, source: computed, description: "Functional interpretation", constraints: "one of BELOW_OPTIMAL, OPTIMAL, ABOVE_OPTIMAL" }
      - { name: is_critical, type: boolean, source: computed, default: false, description: "True when value <= critical_low or value >= critical_high" }

  # ---------------------------------------------------------------- 7
  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject of the protocol" }
      - { name: practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; authoring naturopathic doctor from X-User-ID" }
      - { name: supersedes_protocol_id, type: string, source: input, default: null, description: "FK -> Protocol.id; the protocol this revision is intended to replace (self-referential)" }
      - { name: title, type: string, source: input, description: "Protocol title" }
      - { name: version_no, type: integer, source: system, default: 1, description: "1 for an original protocol; predecessor.version_no + 1 when supersedes_protocol_id is set" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Protocol lifecycle", constraints: "one of DRAFT, ISSUED, ACTIVE, COMPLETED, SUPERSEDED, DISCONTINUED" }
      - { name: symptom_score_baseline, type: integer, source: input, description: "Baseline symptom score (0..SYMPTOM_SCALE_MAX) used by every titration decision under this protocol" }
      - { name: advancement_blocked, type: boolean, source: computed, default: false, description: "Maintained by cascade; true while the owning patient's clinical_write_gate is not OPEN" }
      - { name: interaction_flags, type: array, source: computed, description: "MODERATE-severity product/medication interactions recorded at issue time" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock instant of issue" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of activation" }

  # ---------------------------------------------------------------- 8
  - name: ProtocolItem
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; owning protocol" }
      - { name: product_id, type: string, source: input, description: "FK -> DispensaryProduct.id; dispensary product prescribed by this line" }
      - { name: dose_amount_mg, type: number, source: input, description: "Current per-administration dose in milligrams; mutated by titration decisions" }
      - { name: frequency_per_day, type: integer, source: input, description: "Administrations per day" }
      - { name: duration_days, type: integer, source: input, description: "Planned duration of the line in days" }
      - { name: titration_interval_days, type: integer, source: input, description: "Days between titration reviews for this line" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Line lifecycle", constraints: "one of ACTIVE, HELD, DISCONTINUED, COMPLETED" }
      - { name: titration_step_no, type: integer, source: system, default: 0, description: "Number of titration decisions recorded against this line" }
      - { name: last_decision, type: enum, source: computed, default: null, description: "Most recent titration decision", constraints: "one of ADVANCE, HOLD, REDUCE, DISCONTINUE" }
      - { name: last_decision_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent titration decision" }
      - { name: next_review_due_at, type: datetime, source: computed, default: null, description: "Next titration review instant; the anchor differs by decision (see calculations.titration_decision)" }
      - { name: titration_locked, type: boolean, source: computed, default: false, description: "Maintained by cascade; true while the owning patient's clinical_write_gate is not OPEN" }
      - { name: last_dose_date, type: string, source: computed, default: null, description: "ISO date of the newest DISPENSED Dispense on this line, else the ISO date part of this line's created_at" }
      - { name: discontinue_reason, type: string, source: system, default: null, description: "Reason recorded when the line was discontinued" }

  # ---------------------------------------------------------------- 9
  - name: DispensaryProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit, unique across the dispensary" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: supplement_class, type: enum, source: input, description: "Supplement class; matched against a panel's washout_class", constraints: "one of HORMONE_SUPPORT, ADAPTOGEN, PROBIOTIC, BOTANICAL, VITAMIN_MINERAL, ENZYME" }
      - { name: retail_price_cents, type: integer, source: input, description: "Cash retail price per unit" }
      - { name: practitioner_cost_cents, type: integer, source: input, description: "Acquisition cost per unit; also the floor under any discounted unit price" }
      - { name: interacts_with_med_classes, type: array, source: input, description: "Medication classes this product interacts with; matched against Patient.medication_classes" }
      - { name: interaction_severity, type: enum, source: input, default: NONE, description: "Severity of the interaction described by interacts_with_med_classes", constraints: "one of NONE, MODERATE, SEVERE" }
      - { name: stock_on_hand, type: integer, source: computed, default: 0, description: "Sum of quantity_on_hand over this product's non-quarantined, non-expired lots" }

  # ---------------------------------------------------------------- 10
  - name: ProductLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> DispensaryProduct.id; product this lot stocks" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code, unique per product" }
      - { name: quantity_initial, type: integer, source: input, description: "Units received into the lot; never mutated" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Units still on the shelf; conserved against quantity_initial" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; a lot is expired once the logical clock date is on or after this date" }
      - { name: is_quarantined, type: boolean, source: input, default: false, description: "Quarantined lots are excluded from the dispensing candidate pool" }
      - { name: is_expired, type: boolean, source: computed, default: false, description: "True when the logical clock date >= expiry_date" }

  # ---------------------------------------------------------------- 11
  - name: Dispense
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; resolved from the protocol item's protocol" }
      - { name: protocol_item_id, type: string, source: input, description: "FK -> ProtocolItem.id; the prescribed line being filled" }
      - { name: product_lot_id, type: string, source: input, default: null, description: "FK -> ProductLot.id; when omitted the server selects a lot by the FEFO policy" }
      - { name: dispensed_by_practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; taken from X-User-ID of the dispensing actor" }
      - { name: quantity, type: integer, source: input, description: "Units dispensed; must be a positive integer" }
      - { name: pricing_variant, type: enum, source: computed, description: "Which pricing fork produced unit_price_cents", constraints: "one of RETAIL, MEMBER, PRACTITIONER_COST" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price after the discount fork and the practitioner-cost floor" }
      - { name: total_price_cents, type: integer, source: computed, description: "unit_price_cents * quantity; the discount is rounded per unit BEFORE multiplication" }
      - { name: status, type: enum, source: system, default: DISPENSED, description: "Dispense lifecycle", constraints: "one of DISPENSED, REVERSED" }
      - { name: dispensed_at, type: datetime, source: system, description: "Logical-clock instant of dispensing" }
      - { name: professional_sample, type: boolean, source: input, default: false, description: "Marks a practitioner-cost professional sample rather than a patient sale" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of reversal" }
      - { name: reversal_reason, type: string, source: system, default: null, description: "Reason recorded on reversal" }
      - { name: reversal_authorized_by_user_id, type: string, source: system, default: null, description: "X-User-ID that authorised the reversal (audit identity string, not a navigable FK)" }

  # ---------------------------------------------------------------- 12
  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient being seen" }
      - { name: practitioner_id, type: string, source: input, description: "FK -> Practitioner.id; the rendering practitioner" }
      - { name: source_thread_id, type: string, source: system, default: null, description: "FK -> MessageThread.id; set only when this encounter was created by an e-visit conversion" }
      - { name: modality, type: enum, source: input, description: "Delivery modality", constraints: "one of IN_PERSON, TELEHEALTH, EVISIT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start; the practitioner occupancy interval is HALF-OPEN [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end, exclusive" }
      - { name: scheduling_status, type: enum, source: system, default: SCHEDULED, description: "Scheduling axis, independent of billing_status", constraints: "one of SCHEDULED, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: billing_status, type: enum, source: system, default: CASH_PENDING, description: "Billing axis, independent of scheduling_status", constraints: "one of CASH_PENDING, ENTITLEMENT_RESERVED, ENTITLEMENT_CONSUMED, CASH_CHARGED, SUPERBILLED, REFUNDED, FORFEITED" }
      - { name: duration_minutes, type: integer, source: input, default: null, description: "Actual face-to-face minutes, supplied at completion" }
      - { name: service_code, type: string, source: input, default: null, description: "Professional service code recorded at completion and copied onto the superbill" }
      - { name: diagnosis_codes, type: array, source: input, description: "Diagnosis codes recorded at completion; a superbill cannot be issued while empty" }
      - { name: base_fee_cents, type: integer, source: computed, default: 0, description: "Modality base fee before entitlement is applied" }
      - { name: extended_block_count, type: integer, source: computed, default: 0, description: "Number of EXTENDED_VISIT_BLOCK_MINUTES blocks beyond EXTENDED_VISIT_THRESHOLD_MINUTES" }
      - { name: cash_charged_cents, type: integer, source: computed, default: 0, description: "Cash actually charged for this encounter; extended-time blocks are always cash even when the base fee is covered by entitlement" }
      - { name: entitlement_consumed, type: boolean, source: computed, default: false, description: "True when a membership visit unit was reserved for this encounter and not returned" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of completion" }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Logical-clock instant of cancellation" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason recorded on cancellation" }

  # ---------------------------------------------------------------- 13
  - name: MessageThread
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; thread owner" }
      - { name: practitioner_id, type: string, source: input, description: "FK -> Practitioner.id; clinician the thread is addressed to" }
      - { name: subject, type: string, source: input, description: "Thread subject line" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Thread lifecycle", constraints: "one of OPEN, ANSWERED, CONVERTED_TO_EVISIT, CLOSED" }
      - { name: patient_message_count, type: integer, source: computed, default: 1, description: "Messages posted by the Patient role, including the opening message" }
      - { name: clinician_message_count, type: integer, source: computed, default: 0, description: "Messages posted by clinical roles" }
      - { name: clinical_minutes_total, type: integer, source: computed, default: 0, description: "Sum of clinical_minutes reported on clinical replies" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the thread was opened" }
      - { name: sla_due_at, type: datetime, source: computed, description: "opened_at + MESSAGE_SLA_HOURS" }
      - { name: first_clinical_reply_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of the first clinical reply" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True when the first clinical reply landed after sla_due_at, or when the clock passed sla_due_at with no clinical reply" }
      - { name: evisit_conversion_eligible, type: boolean, source: computed, default: false, description: "True once the thread crosses either e-visit threshold; see calculations.evisit_conversion_trigger" }

  # ---------------------------------------------------------------- 14
  - name: Superbill
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the self-submitting patient" }
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the single encounter this superbill documents" }
      - { name: revision_no, type: integer, source: system, default: 1, description: "Increments on every reissue after a void" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Superbill lifecycle", constraints: "one of DRAFT, ISSUED, VOIDED, DENIED, APPEALED, CLOSED" }
      - { name: diagnosis_codes, type: array, source: computed, description: "Copied from the encounter at creation and refreshed on reissue" }
      - { name: service_code, type: string, source: computed, default: null, description: "Copied from the encounter at creation" }
      - { name: rendering_practitioner_npi, type: string, source: computed, default: null, description: "NPI of the encounter's practitioner; a superbill cannot be issued while null" }
      - { name: billable_total_cents, type: integer, source: computed, default: 0, description: "Cash portion of the encounter only; membership-covered value and dispensed supplements are excluded" }
      - { name: non_billable_membership_cents, type: integer, source: computed, default: 0, description: "Value covered by membership entitlement, reported but never billable" }
      - { name: excluded_supplement_cents, type: integer, source: computed, default: 0, description: "Value of supplements dispensed to this patient under the encounter's protocol, reported but never billable" }
      - { name: denial_code, type: string, source: input, default: null, description: "Payer denial code reported by the patient" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Payer denial narrative reported by the patient" }
      - { name: appeal_narrative, type: string, source: input, default: null, description: "Appeal packet narrative" }
      - { name: void_reason, type: string, source: input, default: null, description: "Reason recorded when the superbill was voided" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent issue" }

  # ---------------------------------------------------------------- 15
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; referred patient" }
      - { name: referring_practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; the referring naturopathic doctor, or the ordering practitioner for an auto-referral" }
      - { name: lab_order_id, type: string, source: system, default: null, description: "FK -> LabOrder.id; set only on RED_FLAG_AUTO referrals raised by a critical result" }
      - { name: referral_type, type: enum, source: system, default: ROUTINE, description: "How the referral came to exist", constraints: "one of ROUTINE, RED_FLAG_AUTO" }
      - { name: recipient_name, type: string, source: input, description: "Outside clinician or facility receiving the referral" }
      - { name: specialty, type: string, source: input, description: "Specialty the patient is referred to" }
      - { name: reason, type: string, source: input, description: "Clinical reason for the referral" }
      - { name: status, type: enum, source: system, default: SENT, description: "Loop-closure lifecycle", constraints: "one of SENT, ACKNOWLEDGED, REPORT_RECEIVED, CLOSED, DECLINED, ABANDONED" }
      - { name: attempt_no, type: integer, source: system, default: 1, description: "Incremented each time a declined referral is re-sent; ABANDONED once it would exceed REFERRAL_MAX_ATTEMPTS" }
      - { name: due_by_date, type: string, source: system, description: "ISO date the loop must be closed by; for RED_FLAG_AUTO it is the escalation date + RED_FLAG_REFERRAL_DUE_DAYS" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Logical-clock instant the recipient acknowledged" }
      - { name: report_summary, type: string, source: input, default: null, description: "Consult report narrative returned by the recipient" }
      - { name: report_received_at, type: datetime, source: system, default: null, description: "Logical-clock instant the consult report was recorded" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the loop was closed" }
      - { name: decline_reason, type: string, source: input, default: null, description: "Reason the recipient declined" }

# =============================================================================
# Table 2: State Machine Table
# 11 entities carry a lifecycle; Patient and Encounter each carry TWO
# independent axes, so 13 axis declarations follow.
# Non-linear machines: Patient (two axes + review cycles), Encounter (two axes),
# IntakeSection (re-attestation cycle), Membership (pause/resume + self-loop),
# LabOrder (branch-with-revert on wash-out), Protocol (three-way terminal
# fan-out with divergent side effects), ProtocolItem (hold/resume cycle),
# MessageThread (answer/reply cycle), Superbill (void/reissue cycle),
# Referral (decline/re-refer cycle).
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ 1
  - entity: Patient
    axis: clinical_status
    initial_state: INTAKE
    terminal_states: []
    note: "Care-relationship axis. Evolves independently of scope_review_status; a patient may be ESTABLISHED and UNDER_REVIEW at once."
    transitions:
      - from: INTAKE
        to: ESTABLISHED
        trigger: "POST /encounters/{id}/complete — first encounter completion for this patient"
        actor: system
        preconditions:
          - "patient.clinical_status == INTAKE"
          - "the completing encounter belongs to this patient"
        side_effects:
          - "Patient.clinical_status set to ESTABLISHED"
          - "Patient.version incremented by 1"
      - from: ESTABLISHED
        to: INACTIVE
        trigger: "POST /memberships/{id}/roll-cycle with renew=false"
        actor: system
        preconditions:
          - "the rolled membership belongs to this patient and its status is ACTIVE"
        side_effects:
          - "Membership.status set to EXPIRED (cascade link 1)"
          - "because the membership expired, Patient.clinical_status is set to INACTIVE (cascade link 2)"
          - "Patient.version incremented by 1"
      - from: INACTIVE
        to: ESTABLISHED
        trigger: "POST /memberships — a new membership is opened for this patient"
        actor: system
        preconditions:
          - "patient.clinical_status == INACTIVE"
        side_effects:
          - "Patient.clinical_status set back to ESTABLISHED (re-entry cycle)"
          - "Patient.version incremented by 1"

  # ------------------------------------------------------------------ 2
  - entity: Patient
    axis: scope_review_status
    initial_state: NONE
    terminal_states: []
    note: "Scope-of-practice review axis. Drives the global clinical write gate and can be re-opened after a clearance, so the axis cycles."
    transitions:
      - from: NONE
        to: UNDER_REVIEW
        trigger: "POST /patients/{id}/scope-reviews"
        actor: ClinicalDirector
        preconditions:
          - "patient.scope_review_status IN {NONE, CLEARED, RESTRICTED}"
        side_effects:
          - "Patient.scope_review_reason set from the request"
          - "Patient.scope_review_opened_by_user_id set to the acting X-User-ID"
          - "Patient.clinical_write_gate set to FROZEN_SCOPE_REVIEW"
          - "because the gate is no longer OPEN, every Protocol of this patient in status ACTIVE gets advancement_blocked = true"
          - "because those protocols are blocked, every ProtocolItem under them in status ACTIVE or HELD gets titration_locked = true"
          - "Patient.version incremented by 1"
      - from: CLEARED
        to: UNDER_REVIEW
        trigger: "POST /patients/{id}/scope-reviews"
        actor: ClinicalDirector
        preconditions:
          - "patient.scope_review_status == CLEARED"
        side_effects:
          - "same freeze cascade as the NONE -> UNDER_REVIEW transition (review re-opened)"
      - from: RESTRICTED
        to: UNDER_REVIEW
        trigger: "POST /patients/{id}/scope-reviews"
        actor: ClinicalDirector
        preconditions:
          - "patient.scope_review_status == RESTRICTED"
        side_effects:
          - "same freeze cascade as the NONE -> UNDER_REVIEW transition (review re-opened)"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /patients/{id}/scope-reviews/close with outcome=CLEARED"
        actor: ClinicalDirector
        preconditions:
          - "patient.scope_review_status == UNDER_REVIEW"
          - "the acting ClinicalDirector's practitioner id is NOT patient.primary_practitioner_id (segregation of duties)"
        side_effects:
          - "Patient.scope_review_status set to CLEARED"
          - "Patient.clinical_write_gate recomputed: OPEN when red_flag_referral_open is false, otherwise FROZEN_RED_FLAG"
          - "when the recomputed gate is OPEN, every ACTIVE Protocol of this patient gets advancement_blocked = false and every ACTIVE or HELD ProtocolItem under them gets titration_locked = false"
          - "Patient.version incremented by 1"
      - from: UNDER_REVIEW
        to: RESTRICTED
        trigger: "POST /patients/{id}/scope-reviews/close with outcome=RESTRICTED"
        actor: ClinicalDirector
        preconditions:
          - "patient.scope_review_status == UNDER_REVIEW"
          - "the acting ClinicalDirector's practitioner id is NOT patient.primary_practitioner_id (segregation of duties)"
        side_effects:
          - "Patient.scope_review_status set to RESTRICTED"
          - "Patient.clinical_write_gate stays FROZEN_SCOPE_REVIEW; protocol advancement_blocked and item titration_locked remain true"
          - "Patient.version incremented by 1"

  # ------------------------------------------------------------------ 3
  - entity: IntakeSection
    axis: status
    initial_state: SUBMITTED
    terminal_states: []
    note: "Sections expire and must be re-submitted then re-attested, so the machine cycles back to SUBMITTED from both ATTESTED and EXPIRED."
    transitions:
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /intake-sections/{id}/attest"
        actor: Patient
        preconditions:
          - "section.status == SUBMITTED"
          - "the acting X-User-ID equals section.patient_id"
        side_effects:
          - "attested_at set to the logical clock"
          - "expires_at set to attested_at + INTAKE_SECTION_VALIDITY_DAYS"
          - "Patient.intake_booking_score and Patient.intake_protocol_score recomputed"
          - "Patient.version incremented by 1"
      - from: ATTESTED
        to: EXPIRED
        trigger: "system — the logical clock reaches or passes expires_at; materialised on the next read of this section, of the owning patient, or of GET /patients/{id}/gate"
        actor: system
        preconditions:
          - "section.status == ATTESTED"
          - "current logical clock >= section.expires_at"
        side_effects:
          - "section.status set to EXPIRED"
          - "Patient.intake_booking_score and Patient.intake_protocol_score recomputed (an EXPIRED section contributes 0)"
      - from: ATTESTED
        to: SUBMITTED
        trigger: "POST /patients/{id}/intake-sections with a section_type that already exists for the patient"
        actor: Patient
        preconditions:
          - "a section with the same patient_id and section_type already exists"
        side_effects:
          - "payload_summary replaced, submitted_at set to the logical clock"
          - "attested_at and expires_at cleared to null"
          - "Patient.intake_booking_score and Patient.intake_protocol_score recomputed"
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /patients/{id}/intake-sections with a section_type that already exists for the patient"
        actor: Patient
        preconditions:
          - "a section with the same patient_id and section_type already exists"
        side_effects:
          - "same re-submission side effects as the ATTESTED -> SUBMITTED transition (re-attestation cycle)"

  # ------------------------------------------------------------------ 4
  - entity: Membership
    axis: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "Pause/resume is a genuine cycle; a renewing roll-cycle is an ACTIVE -> ACTIVE self-loop that forfeits whatever entitlement was left."
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /memberships/{id}/pause"
        actor: PracticeAdmin
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "paused_at set to the logical clock"
          - "Membership.version incremented by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /memberships/{id}/resume"
        actor: PracticeAdmin
        preconditions:
          - "membership.status == PAUSED"
        side_effects:
          - "paused_days = number of whole days from paused_at to the logical clock, rounded UP to the next whole day when any partial day has elapsed"
          - "paused_days_total increased by paused_days"
          - "cycle_end_date advanced by paused_days days"
          - "paused_at cleared to null"
          - "Membership.version incremented by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/roll-cycle with renew=true"
        actor: PracticeAdmin
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "visits_forfeited increased by visits_remaining; lab_credits_forfeited increased by lab_credits_remaining"
          - "visits_granted increased by the tier included_visits; lab_credits_granted increased by the tier included_lab_credits"
          - "visits_remaining set to the tier included_visits; lab_credits_remaining set to the tier included_lab_credits"
          - "cycle_index incremented by 1; cycle_start_date set to the previous cycle_end_date + 1 day; cycle_end_date recomputed as cycle_start_date + MEMBERSHIP_CYCLE_DAYS - 1 day"
          - "the conservation identity granted == consumed + remaining + forfeited still holds on both entitlement counters"
          - "Membership.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /memberships/{id}/roll-cycle with renew=false"
        actor: PracticeAdmin
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "visits_forfeited increased by visits_remaining and visits_remaining set to 0; lab_credits_forfeited increased by lab_credits_remaining and lab_credits_remaining set to 0"
          - "Membership.status set to EXPIRED (cascade link 1)"
          - "because the membership expired, the owning Patient.clinical_status is set to INACTIVE when it was ESTABLISHED (cascade link 2)"
          - "Membership.version incremented by 1"

  # ------------------------------------------------------------------ 5
  - entity: LabOrder
    axis: status
    initial_state: ORDERED
    terminal_states: [INTERPRETED, CANCELLED]
    note: "Branch-with-revert: an order adjudicated into WASHOUT_HOLD at creation returns to ORDERED once the wash-out clears. A critical analyte diverts the pipeline through CRITICAL_ESCALATED."
    transitions:
      - from: ORDERED
        to: WASHOUT_HOLD
        trigger: "POST /lab-orders — evaluated at creation"
        actor: system
        preconditions:
          - "the panel's washout_class is not null"
          - "the patient has at least one ProtocolItem in status ACTIVE or HELD whose product.supplement_class equals the panel's washout_class"
          - "requested_collection_date < washout_clearance_date"
        side_effects:
          - "status set to WASHOUT_HOLD instead of ORDERED; the interference is adjudicated, never silently allowed"
          - "washout_clearance_date recorded on the order"
      - from: WASHOUT_HOLD
        to: ORDERED
        trigger: "POST /lab-orders/{id}/release-washout-hold"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == WASHOUT_HOLD"
          - "the logical clock date >= washout_clearance_date, OR every interfering ProtocolItem is now in status DISCONTINUED or COMPLETED"
        side_effects:
          - "status set back to ORDERED"
          - "LabOrder.version incremented by 1"
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /lab-orders/{id}/collect"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == ORDERED"
          - "when the panel requires fasting, order.fasting_attested is true"
          - "when the panel declares a cycle-day window, order.cycle_day is within that CLOSED window"
        side_effects:
          - "collected_at set to the logical clock"
          - "LabOrder.version incremented by 1"
      - from: COLLECTED
        to: RESULTED
        trigger: "POST /lab-orders/{id}/results with a non-critical analyte"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == COLLECTED"
          - "the posted analyte is not critical"
        side_effects:
          - "a LabResult is created with standard_band and optimal_band classified by calculations.analyte_band_classification"
          - "status set to RESULTED"
      - from: RESULTED
        to: RESULTED
        trigger: "POST /lab-orders/{id}/results with a further non-critical analyte"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == RESULTED"
          - "the posted analyte is not critical"
        side_effects:
          - "a further LabResult is created and classified; status unchanged"
      - from: COLLECTED
        to: CRITICAL_ESCALATED
        trigger: "POST /lab-orders/{id}/results with a critical analyte"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == COLLECTED"
          - "the posted value is <= critical_low or >= critical_high"
        side_effects:
          - "LabResult.is_critical set true and LabOrder.has_critical_result set true (cascade link 1)"
          - "because the order carries a critical result it moves to CRITICAL_ESCALATED and a Referral is created with referral_type RED_FLAG_AUTO, status SENT, lab_order_id set to this order, referring_practitioner_id set to the order's ordering_practitioner_id, and due_by_date = the logical clock date + RED_FLAG_REFERRAL_DUE_DAYS (cascade link 2)"
          - "because an unacknowledged RED_FLAG_AUTO referral now exists, Patient.red_flag_referral_open is set true and Patient.clinical_write_gate is set to FROZEN_RED_FLAG unless it is already FROZEN_SCOPE_REVIEW (cascade link 3)"
          - "because the gate is no longer OPEN, every ACTIVE Protocol of the patient gets advancement_blocked = true (cascade link 4)"
          - "because those protocols are blocked, every ACTIVE or HELD ProtocolItem under them gets titration_locked = true (cascade link 5)"
      - from: RESULTED
        to: CRITICAL_ESCALATED
        trigger: "POST /lab-orders/{id}/results with a critical analyte after a normal one"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == RESULTED"
          - "the posted value is <= critical_low or >= critical_high"
        side_effects:
          - "identical five-link escalation cascade as the COLLECTED -> CRITICAL_ESCALATED transition"
      - from: RESULTED
        to: INTERPRETED
        trigger: "POST /lab-orders/{id}/interpret"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == RESULTED"
        side_effects:
          - "interpretation_summary stored; LabOrder.version incremented by 1"
      - from: CRITICAL_ESCALATED
        to: INTERPRETED
        trigger: "POST /lab-orders/{id}/interpret"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == CRITICAL_ESCALATED"
          - "the RED_FLAG_AUTO Referral carrying this lab_order_id is no longer in status SENT, DECLINED or ABANDONED"
        side_effects:
          - "interpretation_summary stored; LabOrder.version incremented by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /lab-orders/{id}/cancel"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status IN {ORDERED, WASHOUT_HOLD, COLLECTED}"
        side_effects:
          - "when funding_source == MEMBERSHIP_CREDIT the membership's lab_credits_consumed is decreased by lab_credit_cost and lab_credits_remaining increased by the same amount, leaving lab_credits_granted unchanged"
          - "when funding_source == CASH the patient's cash_refunded_total_cents is increased by price_cents"
          - "LabOrder.version incremented by 1"
      - from: WASHOUT_HOLD
        to: CANCELLED
        trigger: "POST /lab-orders/{id}/cancel"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == WASHOUT_HOLD"
        side_effects:
          - "same entitlement or cash compensation as the ORDERED -> CANCELLED transition"
      - from: COLLECTED
        to: CANCELLED
        trigger: "POST /lab-orders/{id}/cancel"
        actor: NaturopathicDoctor
        preconditions:
          - "order.status == COLLECTED"
        side_effects:
          - "same entitlement or cash compensation as the ORDERED -> CANCELLED transition"

  # ------------------------------------------------------------------ 6
  - entity: Protocol
    axis: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED, DISCONTINUED]
    note: "Three-way terminal fan-out with divergent side-effect sets: COMPLETED closes lines cleanly, SUPERSEDED closes them without touching money, DISCONTINUED closes them AND reverses recent dispensing."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /protocols/{id}/issue"
        actor: NaturopathicDoctor
        preconditions:
          - "protocol.status == DRAFT"
          - "patient.clinical_write_gate == OPEN"
          - "patient.intake_protocol_score >= INTAKE_PROTOCOL_MIN_SCORE"
          - "the protocol has at least one ProtocolItem"
          - "no item's product has interaction_severity == SEVERE with a class present in patient.medication_classes"
        side_effects:
          - "issued_at set to the logical clock"
          - "interaction_flags populated with one entry per item whose product has interaction_severity == MODERATE and an interacting class present in patient.medication_classes"
          - "Protocol.version incremented by 1"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /protocols/{id}/activate"
        actor: NaturopathicDoctor
        preconditions:
          - "protocol.status == ISSUED"
          - "patient.clinical_write_gate == OPEN"
        side_effects:
          - "activated_at set to the logical clock"
          - "when supersedes_protocol_id is set and that predecessor is ACTIVE, the predecessor moves to SUPERSEDED (cascade link 1)"
          - "because the predecessor was superseded, every ProtocolItem under it in status ACTIVE or HELD moves to DISCONTINUED with discontinue_reason 'SUPERSEDED_BY_REVISION' (cascade link 2)"
          - "because those lines were discontinued, their next_review_due_at is cleared to null and titration_locked is set false (cascade link 3)"
          - "no Dispense is reversed on this path — superseding a protocol never moves money"
          - "Protocol.version incremented by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /protocols/{id}/complete"
        actor: NaturopathicDoctor
        preconditions:
          - "protocol.status == ACTIVE"
        side_effects:
          - "every ProtocolItem under this protocol in status ACTIVE or HELD moves to COMPLETED and its next_review_due_at is cleared"
          - "Protocol.version incremented by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — a successor protocol naming this one in supersedes_protocol_id is activated"
        actor: system
        preconditions:
          - "protocol.status == ACTIVE"
        side_effects:
          - "see the ISSUED -> ACTIVE cascade of the successor"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /protocols/{id}/discontinue"
        actor: NaturopathicDoctor
        preconditions:
          - "protocol.status == ACTIVE"
        side_effects:
          - "every ProtocolItem under this protocol in status ACTIVE or HELD moves to DISCONTINUED (cascade link 1)"
          - "because those lines were discontinued, every Dispense against them in status DISPENSED whose dispensed_at is within ADVERSE_REVERSAL_WINDOW_DAYS of the logical clock moves to REVERSED (cascade link 2)"
          - "because those dispenses reversed, each one returns its quantity to its ProductLot.quantity_on_hand, the owning DispensaryProduct.stock_on_hand is recomputed, and Patient.cash_refunded_total_cents is increased by the reversed total_price_cents (cascade link 3)"
          - "Protocol.version incremented by 1"

  # ------------------------------------------------------------------ 7
  - entity: ProtocolItem
    axis: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, COMPLETED]
    note: "Hold/resume cycle: a HOLD decision parks the line in HELD, a later ADVANCE or REDUCE returns it to ACTIVE. ADVANCE and REDUCE are ACTIVE -> ACTIVE self-loops that mutate the dose."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to ADVANCE or REDUCE"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status == ACTIVE"
          - "item.titration_locked == false"
          - "the owning protocol.status == ACTIVE"
        side_effects:
          - "dose_amount_mg replaced per calculations.titration_decision (ADVANCE multiplies by TITRATION_DOSE_ADVANCE_MULTIPLIER, REDUCE by TITRATION_DOSE_REDUCE_MULTIPLIER, both rounded half-up to a whole milligram)"
          - "titration_step_no incremented by 1; last_decision and last_decision_at set"
          - "next_review_due_at RE-ANCHORED on the decision instant: last_decision_at + titration_interval_days"
          - "ProtocolItem.version incremented by 1"
      - from: ACTIVE
        to: HELD
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to HOLD"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status == ACTIVE"
          - "item.titration_locked == false"
          - "the owning protocol.status == ACTIVE"
        side_effects:
          - "dose_amount_mg unchanged"
          - "titration_step_no incremented by 1; last_decision and last_decision_at set"
          - "next_review_due_at PRESERVES THE ORIGINAL ANCHOR: previous next_review_due_at + titration_interval_days (never the decision instant)"
          - "ProtocolItem.version incremented by 1"
      - from: HELD
        to: ACTIVE
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to ADVANCE or REDUCE"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status == HELD"
          - "item.titration_locked == false"
          - "the owning protocol.status == ACTIVE"
        side_effects:
          - "same dose and re-anchoring side effects as the ACTIVE -> ACTIVE decision (hold/resume cycle closes)"
      - from: HELD
        to: HELD
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to HOLD"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status == HELD"
          - "item.titration_locked == false"
          - "the owning protocol.status == ACTIVE"
        side_effects:
          - "same anchor-preserving side effects as the ACTIVE -> HELD decision"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to DISCONTINUE, or POST /protocol-items/{id}/adverse-reactions with severity SEVERE"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status IN {ACTIVE, HELD}"
          - "for a titration decision, item.titration_locked == false; an adverse-reaction report is never gated"
        side_effects:
          - "item.status set to DISCONTINUED, next_review_due_at cleared to null, discontinue_reason recorded (cascade link 1)"
          - "because this line was discontinued, the owning Protocol re-evaluates: when every one of its items is now DISCONTINUED the protocol moves ACTIVE -> DISCONTINUED (cascade link 2)"
          - "because the protocol was discontinued, every Dispense against its items in status DISPENSED whose dispensed_at is within ADVERSE_REVERSAL_WINDOW_DAYS of the logical clock moves to REVERSED (cascade link 3)"
          - "because those dispenses reversed, each returns its quantity to its ProductLot.quantity_on_hand and increases Patient.cash_refunded_total_cents by its total_price_cents (cascade link 4)"
      - from: HELD
        to: DISCONTINUED
        trigger: "POST /protocol-items/{id}/titration-decisions resolving to DISCONTINUE, or POST /protocol-items/{id}/adverse-reactions with severity SEVERE"
        actor: NaturopathicDoctor
        preconditions:
          - "item.status == HELD"
        side_effects:
          - "identical four-link cascade as the ACTIVE -> DISCONTINUED transition"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system — POST /protocols/{id}/complete on the owning protocol"
        actor: system
        preconditions:
          - "item.status IN {ACTIVE, HELD}"
          - "the owning protocol moved ACTIVE -> COMPLETED"
        side_effects:
          - "item.status set to COMPLETED and next_review_due_at cleared to null"
      - from: HELD
        to: COMPLETED
        trigger: "system — POST /protocols/{id}/complete on the owning protocol"
        actor: system
        preconditions:
          - "item.status == HELD"
        side_effects:
          - "item.status set to COMPLETED and next_review_due_at cleared to null"

  # ------------------------------------------------------------------ 8
  - entity: Dispense
    axis: status
    initial_state: DISPENSED
    terminal_states: [REVERSED]
    transitions:
      - from: DISPENSED
        to: REVERSED
        trigger: "POST /dispenses/{id}/reverse, or the protocol-discontinue / adverse-reaction cascade"
        actor: ClinicalDirector
        preconditions:
          - "dispense.status == DISPENSED"
          - "when total_price_cents >= REVERSAL_AUTHORIZATION_THRESHOLD_CENTS, the acting X-User-ID must NOT equal dispense.dispensed_by_practitioner_id (segregation of duties)"
        side_effects:
          - "dispense.status set to REVERSED, reversed_at and reversal_reason recorded, reversal_authorized_by_user_id set to the acting X-User-ID"
          - "the source ProductLot.quantity_on_hand increased by dispense.quantity"
          - "the owning DispensaryProduct.stock_on_hand recomputed over its eligible lots"
          - "Patient.cash_refunded_total_cents increased by total_price_cents"
          - "the lot conservation identity quantity_initial == quantity_on_hand + sum(quantity of that lot's DISPENSED dispenses) is restored"

  # ------------------------------------------------------------------ 9
  - entity: Encounter
    axis: scheduling_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Scheduling axis. Advances independently of billing_status: the same encounter can be COMPLETED on this axis while its billing axis is still ENTITLEMENT_CONSUMED and not yet SUPERBILLED."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /encounters/{id}/complete"
        actor: NaturopathicDoctor
        preconditions:
          - "encounter.scheduling_status == SCHEDULED"
        side_effects:
          - "duration_minutes, service_code and diagnosis_codes stored; completed_at set to the logical clock"
          - "base_fee_cents, extended_block_count and cash_charged_cents computed per calculations.encounter_settlement"
          - "the billing axis advances (ENTITLEMENT_RESERVED -> ENTITLEMENT_CONSUMED, or CASH_PENDING -> CASH_CHARGED)"
          - "when this is the patient's first completed encounter, Patient.clinical_status moves INTAKE -> ESTABLISHED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system — POST /message-threads/{id}/convert-to-evisit creates the encounter and immediately completes it"
        actor: system
        preconditions:
          - "the encounter was created by an e-visit conversion with modality EVISIT"
        side_effects:
          - "duration_minutes set to EXTENDED_VISIT_BLOCK_MINUTES, completed_at set to the logical clock"
          - "billing axis advances CASH_PENDING -> CASH_CHARGED with cash_charged_cents = EVISIT_FEE_CENTS"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /encounters/{id}/cancel"
        actor: Patient
        preconditions:
          - "encounter.scheduling_status == SCHEDULED"
        side_effects:
          - "cancelled_at and cancel_reason stored"
          - "the billing axis advances to REFUNDED, FORFEITED or CASH_CHARGED depending on how far ahead of scheduled_start the cancellation lands"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /encounters/{id}/no-show"
        actor: NaturopathicDoctor
        preconditions:
          - "encounter.scheduling_status == SCHEDULED"
        side_effects:
          - "the billing axis advances to ENTITLEMENT_CONSUMED (the reserved visit unit is consumed, never returned) or to CASH_CHARGED with cash_charged_cents = LATE_CANCEL_NO_SHOW_FEE_CENTS"

  # ------------------------------------------------------------------ 10
  - entity: Encounter
    axis: billing_status
    initial_state: CASH_PENDING
    terminal_states: [REFUNDED, FORFEITED]
    note_on_terminality: "SUPERBILLED is deliberately NOT terminal: voiding the superbill returns the axis to CASH_CHARGED or ENTITLEMENT_CONSUMED so the encounter can be re-documented. REFUNDED and FORFEITED are the only absorbing states."
    note: "Billing axis. Entitlement is RESERVED at booking, not at completion, so cancelling is a genuine compensating action on the membership counters."
    transitions:
      - from: CASH_PENDING
        to: ENTITLEMENT_RESERVED
        trigger: "POST /encounters — evaluated at creation"
        actor: system
        preconditions:
          - "the patient has a Membership in status ACTIVE with visits_remaining >= 1"
          - "modality is IN_PERSON or TELEHEALTH (an EVISIT encounter never reserves entitlement)"
        side_effects:
          - "membership.visits_consumed increased by 1 and membership.visits_remaining decreased by 1, leaving visits_granted unchanged"
          - "encounter.entitlement_consumed set true"
      - from: ENTITLEMENT_RESERVED
        to: ENTITLEMENT_CONSUMED
        trigger: "POST /encounters/{id}/complete or POST /encounters/{id}/no-show"
        actor: NaturopathicDoctor
        preconditions:
          - "encounter.billing_status == ENTITLEMENT_RESERVED"
        side_effects:
          - "on completion, cash_charged_cents is set to the extended-time portion only (the base fee is covered by the reserved visit unit)"
          - "on a no-show, cash_charged_cents stays 0 and the reserved unit is not returned"
          - "Patient.cash_charged_total_cents increased by cash_charged_cents"
      - from: CASH_PENDING
        to: CASH_CHARGED
        trigger: "POST /encounters/{id}/complete, POST /encounters/{id}/no-show, a late POST /encounters/{id}/cancel, or the e-visit conversion"
        actor: NaturopathicDoctor
        preconditions:
          - "encounter.billing_status == CASH_PENDING"
        side_effects:
          - "on completion, cash_charged_cents = base_fee_cents + extended-time blocks"
          - "on a no-show or a cancellation less than ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS before scheduled_start, cash_charged_cents = LATE_CANCEL_NO_SHOW_FEE_CENTS"
          - "on an e-visit conversion, cash_charged_cents = EVISIT_FEE_CENTS"
          - "Patient.cash_charged_total_cents increased by cash_charged_cents"
      - from: ENTITLEMENT_RESERVED
        to: REFUNDED
        trigger: "POST /encounters/{id}/cancel at least ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS before scheduled_start"
        actor: Patient
        preconditions:
          - "encounter.billing_status == ENTITLEMENT_RESERVED"
          - "scheduled_start minus the logical clock >= ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS (exactly 24 hours ahead still refunds)"
        side_effects:
          - "membership.visits_consumed decreased by 1 and membership.visits_remaining increased by 1; visits_granted and visits_forfeited unchanged"
          - "encounter.entitlement_consumed set false"
      - from: ENTITLEMENT_RESERVED
        to: FORFEITED
        trigger: "POST /encounters/{id}/cancel less than ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS before scheduled_start"
        actor: Patient
        preconditions:
          - "encounter.billing_status == ENTITLEMENT_RESERVED"
          - "scheduled_start minus the logical clock < ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS"
        side_effects:
          - "membership.visits_consumed decreased by 1 and membership.visits_forfeited increased by 1; visits_remaining and visits_granted unchanged, so the unit moves from consumed to forfeited rather than returning to the pool"
          - "encounter.entitlement_consumed set false"
      - from: CASH_PENDING
        to: REFUNDED
        trigger: "POST /encounters/{id}/cancel at least ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS before scheduled_start"
        actor: Patient
        preconditions:
          - "encounter.billing_status == CASH_PENDING"
        side_effects:
          - "no money moves; the pending cash charge is voided"
      - from: ENTITLEMENT_CONSUMED
        to: SUPERBILLED
        trigger: "POST /superbills/{id}/transitions with action=ISSUE"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == ENTITLEMENT_CONSUMED"
          - "encounter.cash_charged_cents > 0 (the membership-covered portion is never billable)"
        side_effects:
          - "encounter.billing_status set to SUPERBILLED"
      - from: CASH_CHARGED
        to: SUPERBILLED
        trigger: "POST /superbills/{id}/transitions with action=ISSUE"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == CASH_CHARGED"
        side_effects:
          - "encounter.billing_status set to SUPERBILLED"
      - from: SUPERBILLED
        to: CASH_CHARGED
        trigger: "POST /superbills/{id}/transitions with action=VOID"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == SUPERBILLED"
          - "encounter.entitlement_consumed == false"
        side_effects:
          - "encounter.billing_status reverts to CASH_CHARGED so a reissued superbill can be issued again"
      - from: SUPERBILLED
        to: ENTITLEMENT_CONSUMED
        trigger: "POST /superbills/{id}/transitions with action=VOID"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == SUPERBILLED"
          - "encounter.entitlement_consumed == true"
        side_effects:
          - "encounter.billing_status reverts to ENTITLEMENT_CONSUMED"

  # ------------------------------------------------------------------ 11
  - entity: MessageThread
    axis: status
    initial_state: OPEN
    terminal_states: [CONVERTED_TO_EVISIT, CLOSED]
    note: "Answer/reply cycle: a clinical reply moves the thread to ANSWERED and a further patient message returns it to OPEN, so a long back-and-forth loops indefinitely until it is closed or converted."
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "POST /message-threads/{id}/messages posted by NaturopathicDoctor or HealthCoach"
        actor: NaturopathicDoctor
        preconditions:
          - "thread.status == OPEN"
        side_effects:
          - "clinician_message_count incremented by 1 and clinical_minutes_total increased by the reported clinical_minutes"
          - "first_clinical_reply_at set when it was null; sla_breached set true when that instant is after sla_due_at"
          - "evisit_conversion_eligible recomputed per calculations.evisit_conversion_trigger"
      - from: ANSWERED
        to: OPEN
        trigger: "POST /message-threads/{id}/messages posted by the Patient"
        actor: Patient
        preconditions:
          - "thread.status == ANSWERED"
        side_effects:
          - "patient_message_count incremented by 1"
          - "evisit_conversion_eligible recomputed (reply cycle)"
      - from: OPEN
        to: OPEN
        trigger: "POST /message-threads/{id}/messages posted by the Patient while the thread is still awaiting a clinical reply"
        actor: Patient
        preconditions:
          - "thread.status == OPEN"
        side_effects:
          - "patient_message_count incremented by 1; the status does not move because the thread is already awaiting the clinician"
          - "evisit_conversion_eligible recomputed"
      - from: OPEN
        to: CONVERTED_TO_EVISIT
        trigger: "POST /message-threads/{id}/convert-to-evisit"
        actor: NaturopathicDoctor
        preconditions:
          - "thread.status IN {OPEN, ANSWERED}"
          - "thread.evisit_conversion_eligible == true"
          - "the patient has no Membership in status ACTIVE whose tier includes_messaging is true"
          - "the thread practitioner is licensed in the patient's state_code and patient.telehealth_consent is true"
        side_effects:
          - "an Encounter is created with modality EVISIT, source_thread_id set to this thread, scheduling_status COMPLETED and billing_status CASH_CHARGED"
          - "cash_charged_cents on that encounter set to EVISIT_FEE_CENTS and Patient.cash_charged_total_cents increased by the same amount"
          - "thread.status set to CONVERTED_TO_EVISIT"
      - from: ANSWERED
        to: CONVERTED_TO_EVISIT
        trigger: "POST /message-threads/{id}/convert-to-evisit"
        actor: NaturopathicDoctor
        preconditions:
          - "thread.status == ANSWERED"
          - "same eligibility, membership, licensure and consent preconditions as the OPEN -> CONVERTED_TO_EVISIT transition"
        side_effects:
          - "identical e-visit creation side effects"
      - from: OPEN
        to: CLOSED
        trigger: "POST /message-threads/{id}/close"
        actor: NaturopathicDoctor
        preconditions:
          - "thread.status == OPEN"
        side_effects:
          - "thread.status set to CLOSED; no billing consequence"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /message-threads/{id}/close"
        actor: NaturopathicDoctor
        preconditions:
          - "thread.status == ANSWERED"
        side_effects:
          - "thread.status set to CLOSED; no billing consequence"

  # ------------------------------------------------------------------ 12
  - entity: Superbill
    axis: status
    initial_state: DRAFT
    terminal_states: [APPEALED, CLOSED]
    note: "Void/reissue cycle: VOIDED returns to DRAFT with an incremented revision_no, so the same encounter can be re-documented up to SUPERBILL_MAX_REVISIONS times."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /superbills/{id}/transitions with action=ISSUE"
        actor: BillingSpecialist
        preconditions:
          - "superbill.status == DRAFT"
          - "the referenced encounter.scheduling_status == COMPLETED"
          - "superbill.diagnosis_codes is non-empty and rendering_practitioner_npi is not null"
          - "superbill.billable_total_cents > 0"
        side_effects:
          - "issued_at set to the logical clock"
          - "the referenced encounter's billing axis moves to SUPERBILLED"
          - "Superbill.version incremented by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /superbills/{id}/transitions with action=VOID"
        actor: BillingSpecialist
        preconditions:
          - "superbill.status == ISSUED"
        side_effects:
          - "void_reason recorded"
          - "the referenced encounter's billing axis reverts from SUPERBILLED to ENTITLEMENT_CONSUMED when entitlement_consumed is true, otherwise to CASH_CHARGED"
      - from: VOIDED
        to: DRAFT
        trigger: "POST /superbills/{id}/transitions with action=REISSUE"
        actor: BillingSpecialist
        preconditions:
          - "superbill.status == VOIDED"
          - "superbill.revision_no < SUPERBILL_MAX_REVISIONS"
        side_effects:
          - "revision_no incremented by 1; diagnosis_codes, service_code, rendering_practitioner_npi and the three money partitions re-copied from the current encounter state (void/reissue cycle)"
      - from: ISSUED
        to: DENIED
        trigger: "POST /superbills/{id}/transitions with action=REPORT_DENIAL"
        actor: Patient
        preconditions:
          - "superbill.status == ISSUED"
        side_effects:
          - "denial_code and denial_reason recorded"
      - from: DENIED
        to: APPEALED
        trigger: "POST /superbills/{id}/transitions with action=APPEAL"
        actor: BillingSpecialist
        preconditions:
          - "superbill.status == DENIED"
        side_effects:
          - "appeal_narrative recorded; the appeal packet is terminal in this system"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /superbills/{id}/transitions with action=CLOSE"
        actor: BillingSpecialist
        preconditions:
          - "superbill.status == ISSUED"
        side_effects:
          - "the superbill is closed with no further payer activity"

  # ------------------------------------------------------------------ 13
  - entity: Referral
    axis: status
    initial_state: SENT
    terminal_states: [CLOSED, ABANDONED]
    note: "Loop closure with a decline cycle: DECLINED returns to SENT on a re-refer, and the loop is abandoned once REFERRAL_MAX_ATTEMPTS is reached."
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /referrals/{id}/transitions with action=ACKNOWLEDGE"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "acknowledged_at set to the logical clock (cascade link 1)"
          - "because no RED_FLAG_AUTO referral of this patient remains in status SENT, DECLINED or ABANDONED, Patient.red_flag_referral_open is set false (cascade link 2)"
          - "because red_flag_referral_open cleared, Patient.clinical_write_gate is recomputed to OPEN unless scope_review_status is UNDER_REVIEW or RESTRICTED (cascade link 3)"
          - "because the gate re-opened, every ACTIVE Protocol of the patient gets advancement_blocked = false (cascade link 4)"
          - "because those protocols unblocked, every ACTIVE or HELD ProtocolItem under them gets titration_locked = false (cascade link 5)"
      - from: ACKNOWLEDGED
        to: REPORT_RECEIVED
        trigger: "POST /referrals/{id}/transitions with action=REPORT"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == ACKNOWLEDGED"
        side_effects:
          - "report_summary and report_received_at recorded"
      - from: REPORT_RECEIVED
        to: CLOSED
        trigger: "POST /referrals/{id}/transitions with action=CLOSE"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == REPORT_RECEIVED"
        side_effects:
          - "closed_at set to the logical clock; the loop is closed"
      - from: SENT
        to: DECLINED
        trigger: "POST /referrals/{id}/transitions with action=DECLINE"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "decline_reason recorded"
          - "for a RED_FLAG_AUTO referral the patient's gate stays FROZEN_RED_FLAG — declining never clears the red flag"
      - from: DECLINED
        to: SENT
        trigger: "POST /referrals/{id}/transitions with action=RE_REFER"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_no < REFERRAL_MAX_ATTEMPTS"
        side_effects:
          - "attempt_no incremented by 1; recipient_name replaced; decline_reason cleared (decline/re-refer cycle)"
      - from: DECLINED
        to: ABANDONED
        trigger: "POST /referrals/{id}/transitions with action=RE_REFER"
        actor: NaturopathicDoctor
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_no == REFERRAL_MAX_ATTEMPTS"
        side_effects:
          - "referral.status set to ABANDONED instead of re-sending; attempt_no unchanged"
          - "for a RED_FLAG_AUTO referral the patient's gate stays FROZEN_RED_FLAG — an abandoned red flag never unfreezes clinical writes"

# =============================================================================
# Table 2.1: Concurrency Rules — OCC on a parent entity's `version` only.
# Each rule below survives the serial-observability filter: a second, strictly
# later request that carried a fresh version would legitimately succeed, so the
# rejection can only come from a stale-version check.
# =============================================================================
concurrency_rules:
  - rule_id: protocol-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /protocols"
    occ_field: "expected_patient_version"
    description: |
      Creating a Protocol against a Patient whose version has advanced since the
      client last read it is rejected. A protocol may legitimately supersede the
      patient's current one, so a second create is not blocked by any state
      precondition; the only thing distinguishing a well-informed author from
      one working off a stale view of the chart is the patient version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispense-create-stale-protocol
    parent_entity: Protocol
    write_endpoint: "POST /dispenses"
    occ_field: "expected_protocol_version"
    description: |
      Filling a protocol line against a Protocol whose version has advanced
      since the client last read it is rejected. Repeat fills of the same line
      are legitimate while stock lasts, so no state precondition catches an
      author who has not seen the titration decision or line discontinuation
      that moved the protocol on.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tier-change-stale-membership
    parent_entity: Membership
    write_endpoint: "PATCH /memberships/{id}/tier"
    occ_field: "expected_membership_version"
    description: |
      Changing the tier of a Membership whose version has advanced since the
      client last read it is rejected. Consecutive tier changes are legitimate
      and each one re-prorates from the counters it finds, so a stale author
      would otherwise silently re-prorate against entitlement figures that a
      prior change or an encounter reservation has already rewritten.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules
# =============================================================================
calculations:

  # ---------------------------------------------------------------- C1
  - name: intake_completeness_score
    trigger: "Recomputed whenever an IntakeSection is created, re-submitted, attested, or lazily materialised as EXPIRED; read as a gate by POST /encounters and by POST /protocols/{id}/issue"
    algorithm: weighted_scoring
    formula: |
      WEIGHT(section_type) = the INTAKE_SECTION_WEIGHT_<section_type> constant
        CHIEF_COMPLAINT_TIMELINE 25, SYSTEMS_REVIEW 25, DIET_LIFESTYLE 15,
        MEDICATIONS_SUPPLEMENTS 25, FAMILY_HISTORY 10   (sum = 100)

      per_section_contribution(variant, section):
        BOOKING  variant: WEIGHT                                            when section.status == ATTESTED
                          floor(WEIGHT / INTAKE_SUBMITTED_WEIGHT_DIVISOR)   when section.status == SUBMITTED
                          0                                                 when section.status == EXPIRED or absent
        PROTOCOL variant: WEIGHT                                            when section.status == ATTESTED
                          0                                                 in every other case, SUBMITTED included

      Patient.intake_booking_score  = sum over the five section_types using the BOOKING variant
      Patient.intake_protocol_score = sum over the five section_types using the PROTOCOL variant
    input_set: "The at most five IntakeSection rows of one patient, one per section_type. Expiry is materialised (ATTESTED with expires_at <= clock becomes EXPIRED) BEFORE the sum is taken."
    constants:
      INTAKE_SECTION_WEIGHT_CHIEF_COMPLAINT_TIMELINE: 25
      INTAKE_SECTION_WEIGHT_SYSTEMS_REVIEW: 25
      INTAKE_SECTION_WEIGHT_DIET_LIFESTYLE: 15
      INTAKE_SECTION_WEIGHT_MEDICATIONS_SUPPLEMENTS: 25
      INTAKE_SECTION_WEIGHT_FAMILY_HISTORY: 10
      INTAKE_SUBMITTED_WEIGHT_DIVISOR: 2
      INTAKE_BOOKING_MIN_SCORE: 60
      INTAKE_PROTOCOL_MIN_SCORE: 85
    precision: "Integer. The halved weight of a SUBMITTED section is floored (25 -> 12, 15 -> 7). No other rounding."
    variants:
      - name: booking_variant
        when: "Evaluated by POST /encounters; the gate is intake_booking_score >= INTAKE_BOOKING_MIN_SCORE (60), boundary inclusive"
        difference: "Partial credit: a merely SUBMITTED section contributes floor(weight/2) instead of 0"
      - name: protocol_variant
        when: "Evaluated by POST /protocols/{id}/issue; the gate is intake_protocol_score >= INTAKE_PROTOCOL_MIN_SCORE (85), boundary inclusive"
        difference: "No partial credit at all: only ATTESTED sections count, so the same chart yields a strictly lower number than the booking variant whenever any section is merely SUBMITTED"

  # ---------------------------------------------------------------- C2
  - name: analyte_band_classification
    trigger: "POST /lab-orders/{id}/results — classifies the posted analyte before the LabResult row is persisted"
    algorithm: threshold
    formula: |
      standard_band = LOW           when value < standard_low
                    = HIGH          when value > standard_high
                    = IN_RANGE      otherwise            # CLOSED on both ends

      optimal_band  = BELOW_OPTIMAL when value < optimal_low
                    = ABOVE_OPTIMAL when value >= optimal_high
                    = OPTIMAL       otherwise            # HALF-OPEN at the top

      is_critical   = (value <= critical_low) or (value >= critical_high)

      Downstream routing, which is what makes the two bands genuinely different:
        is_critical                             -> LabOrder moves to CRITICAL_ESCALATED and a
                                                   RED_FLAG_AUTO Referral is raised (gate freezes)
        standard_band != IN_RANGE               -> conventional abnormality; the interpretation
                                                   narrative must carry it and a ROUTINE referral
                                                   may be raised by the practitioner
        standard_band == IN_RANGE AND
        optimal_band != OPTIMAL                 -> functionally suboptimal only; no referral is
                                                   implied, this is the protocol-recommendation path
    input_set: "One posted analyte on one LabOrder. Bounds are supplied per analyte on the request; nothing is inferred from other results."
    constants: {}
    precision: "Values and bounds are compared as decimals with up to 3 fractional digits; the stored value is not rounded."
    variants:
      - name: standard_reference_range
        when: "Conventional laboratory interpretation, used to decide whether the result is reportable as abnormal"
        difference: "CLOSED interval — a value exactly equal to standard_high is IN_RANGE"
      - name: functional_optimal_range
        when: "Practice functional interpretation, used to decide whether a protocol recommendation is warranted"
        difference: "HALF-OPEN at the top — a value exactly equal to optimal_high is ABOVE_OPTIMAL, so one and the same value can be IN_RANGE conventionally and ABOVE_OPTIMAL functionally"

  # ---------------------------------------------------------------- C3
  - name: dispense_line_pricing
    trigger: "POST /dispenses — computed before stock is decremented"
    algorithm: tiered_pricing
    formula: |
      variant selection (first match wins):
        PRACTITIONER_COST  when request.professional_sample == true
        MEMBER             when professional_sample is false AND the patient has a Membership
                           in status ACTIVE
        RETAIL             otherwise

      discount_pct = membership.dispensary_discount_pct   for MEMBER      (0.05 / 0.10 / 0.20 by tier)
                   = 0                                    for RETAIL

      raw_unit_cents   = product.retail_price_cents * (1 - discount_pct)     # MEMBER and RETAIL
      unit_price_cents = max(round_half_up(raw_unit_cents),
                             product.practitioner_cost_cents)                # MEMBER and RETAIL
      unit_price_cents = product.practitioner_cost_cents                     # PRACTITIONER_COST

      total_price_cents = unit_price_cents * quantity

      ROUNDING ORDER IS PINNED: the discounted price is rounded to a whole cent
      PER UNIT and only then multiplied by quantity. Multiplying first and
      rounding the line total once is explicitly NOT the rule and produces a
      different number whenever retail_price_cents * discount_pct has a
      fractional cent (e.g. 4995 at 10% over 3 units: 13488 the pinned way,
      13487 the other way).
    input_set: "One dispense request: one ProtocolItem, its DispensaryProduct, the patient's Membership rows filtered to status ACTIVE, and the requested quantity."
    constants:
      MEMBERSHIP_TIER_FOUNDATION_DISCOUNT_PCT: 0.05
      MEMBERSHIP_TIER_CORE_DISCOUNT_PCT: 0.10
      MEMBERSHIP_TIER_PREMIER_DISCOUNT_PCT: 0.20
    precision: "Whole cents, round_half_up, applied per unit before multiplication."
    variants:
      - name: member_discounted
        when: "The patient holds a Membership in status ACTIVE and the line is not a professional sample"
        difference: "Retail price is reduced by the tier discount and then floored at practitioner_cost_cents"
      - name: retail_cash
        when: "No Membership in status ACTIVE"
        difference: "Full retail price, no floor interaction"
      - name: practitioner_cost
        when: "professional_sample is true"
        difference: "Bypasses retail and discount entirely; the unit price is the acquisition cost"

  # ---------------------------------------------------------------- C4
  - name: encounter_settlement
    trigger: "POST /encounters/{id}/complete (and the system completion inside POST /message-threads/{id}/convert-to-evisit)"
    algorithm: waterfall_allocation
    formula: |
      base_fee_cents = VISIT_FEE_IN_PERSON_CENTS    when modality == IN_PERSON     (22500)
                     = VISIT_FEE_TELEHEALTH_CENTS   when modality == TELEHEALTH    (18000)
                     = EVISIT_FEE_CENTS             when modality == EVISIT        (9500)

      extended_block_count = 0
          when duration_minutes <= EXTENDED_VISIT_THRESHOLD_MINUTES
      extended_block_count = ceil((duration_minutes - EXTENDED_VISIT_THRESHOLD_MINUTES)
                                  / EXTENDED_VISIT_BLOCK_MINUTES)
          otherwise
      extended_cents = extended_block_count * EXTENDED_VISIT_BLOCK_FEE_CENTS

      entitlement is applied as the FIRST bucket of the waterfall and it covers
      the base fee ONLY:
        variant entitlement_first  (billing_status == ENTITLEMENT_RESERVED):
            cash_charged_cents = extended_cents
        variant cash_fallback      (billing_status == CASH_PENDING):
            cash_charged_cents = base_fee_cents + extended_cents

      Patient.cash_charged_total_cents increased by cash_charged_cents.
    input_set: "One Encounter at completion, plus the membership reservation decision already recorded on its billing axis at booking time."
    constants:
      VISIT_FEE_IN_PERSON_CENTS: 22500
      VISIT_FEE_TELEHEALTH_CENTS: 18000
      EVISIT_FEE_CENTS: 9500
      EXTENDED_VISIT_THRESHOLD_MINUTES: 45
      EXTENDED_VISIT_BLOCK_MINUTES: 15
      EXTENDED_VISIT_BLOCK_FEE_CENTS: 4500
    precision: "Whole cents. The block count is a ceiling, so 46 minutes already buys a whole block; exactly 45 minutes buys none."
    variants:
      - name: entitlement_first
        when: "The encounter reserved a membership visit unit at booking (billing_status ENTITLEMENT_RESERVED)"
        difference: "The base fee is absorbed by the visit unit; only extended-time blocks reach the cash line"
      - name: cash_fallback
        when: "No visit unit was available at booking (billing_status CASH_PENDING)"
        difference: "Base fee and extended-time blocks are both charged as cash, so the identical clinical encounter yields a strictly larger cash figure"

  # ---------------------------------------------------------------- C5
  - name: membership_tier_change_proration
    trigger: "PATCH /memberships/{id}/tier"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned because the money legs and the entitlement legs
      both read remaining_days, and the entitlement legs rewrite the very
      counters the money legs would otherwise be re-derived from.

      STEP 1  elapsed_days   = whole days from cycle_start_date to the logical clock date,
                               counting cycle_start_date as day 0  (HALF-OPEN [cycle_start_date, today))
      STEP 2  remaining_days = max(MEMBERSHIP_CYCLE_DAYS - elapsed_days, 0)
      STEP 3  old_unused_credit_cents = round_half_up(old_tier.monthly_fee_cents
                                                      * remaining_days / MEMBERSHIP_CYCLE_DAYS)
      STEP 4  new_prorated_fee_cents  = round_half_up(new_tier.monthly_fee_cents
                                                      * remaining_days / MEMBERSHIP_CYCLE_DAYS)
      STEP 5  last_proration_net_charge_cents = new_prorated_fee_cents - old_unused_credit_cents
      STEP 6  prorated_visit_grant  = ceil(new_tier.included_visits      * remaining_days / MEMBERSHIP_CYCLE_DAYS)
      STEP 7  prorated_credit_grant = ceil(new_tier.included_lab_credits * remaining_days / MEMBERSHIP_CYCLE_DAYS)
      STEP 8  visits_granted      = visits_granted - visits_remaining + prorated_visit_grant
              visits_remaining    = prorated_visit_grant
      STEP 9  lab_credits_granted   = lab_credits_granted - lab_credits_remaining + prorated_credit_grant
              lab_credits_remaining = prorated_credit_grant
      STEP 10 tier, monthly_fee_cents, dispensary_discount_pct and includes_messaging
              re-resolved from the new tier constant block

      Step 8 and step 9 subtract the OLD remaining before adding the new grant, so
      visits_consumed and visits_forfeited are never touched and the conservation
      identity granted == consumed + remaining + forfeited survives the change.
      When last_proration_net_charge_cents > 0 the patient's cash_charged_total_cents
      grows by it; when it is negative, cash_refunded_total_cents grows by its
      absolute value.
    input_set: "One Membership row in status ACTIVE, its current tier constant block, the requested tier constant block, and the logical clock date."
    constants:
      MEMBERSHIP_CYCLE_DAYS: 30
    precision: "Money: whole cents, round_half_up. Entitlement grants: ceil to a whole unit."
    variants:
      - name: upgrade
        when: "new_tier.monthly_fee_cents > old_tier.monthly_fee_cents"
        difference: "net charge is positive and the entitlement counters grow"
      - name: downgrade
        when: "new_tier.monthly_fee_cents < old_tier.monthly_fee_cents"
        difference: "net charge is negative (a credit) and the entitlement counters shrink, which can leave visits_remaining below what a naive tier swap would grant"

  # ---------------------------------------------------------------- C6
  - name: titration_decision
    trigger: "POST /protocol-items/{id}/titration-decisions"
    algorithm: threshold
    formula: |
      delta = protocol.symptom_score_baseline - request.current_symptom_score
              (positive delta means the patient improved)

      decision = ADVANCE      when delta >= TITRATION_ADVANCE_DELTA_MIN            (>= 8)
               = HOLD         when TITRATION_HOLD_DELTA_MIN   <= delta < TITRATION_ADVANCE_DELTA_MIN  (3..7)
               = REDUCE       when TITRATION_REDUCE_DELTA_MIN <= delta < TITRATION_HOLD_DELTA_MIN     (0..2)
               = DISCONTINUE  when delta < TITRATION_REDUCE_DELTA_MIN             (< 0)

      dose_amount_mg = round_half_up(dose_amount_mg * TITRATION_DOSE_ADVANCE_MULTIPLIER)  for ADVANCE
                     = round_half_up(dose_amount_mg * TITRATION_DOSE_REDUCE_MULTIPLIER)   for REDUCE
                     = unchanged                                                          for HOLD and DISCONTINUE

      THE ANCHORING FORK — the same "when is the next review due" question is
      answered by two different formulas selected by the decision:
        ADVANCE, REDUCE : next_review_due_at = last_decision_at + titration_interval_days
                          (RE-ANCHORED on the decision instant)
        HOLD            : next_review_due_at = previous next_review_due_at + titration_interval_days
                          (ORIGINAL ANCHOR PRESERVED; drift from a late review is never absorbed)
                          When previous next_review_due_at is null because this is the
                          first decision on the line, the previous anchor is the item's created_at.
        DISCONTINUE     : next_review_due_at = null
    input_set: "One ProtocolItem, its owning Protocol's symptom_score_baseline, and the score reported on this request."
    constants:
      TITRATION_ADVANCE_DELTA_MIN: 8
      TITRATION_HOLD_DELTA_MIN: 3
      TITRATION_REDUCE_DELTA_MIN: 0
      TITRATION_DOSE_ADVANCE_MULTIPLIER: 1.25
      TITRATION_DOSE_REDUCE_MULTIPLIER: 0.50
      SYMPTOM_SCALE_MAX: 40
    precision: "Dose rounded half-up to a whole milligram. Timestamps carry three fractional digits."
    variants:
      - name: reanchor_on_decision
        when: "decision is ADVANCE or REDUCE"
        difference: "The interval restarts from the instant the decision was made, so a review taken late pushes every later review later"
      - name: preserve_original_anchor
        when: "decision is HOLD"
        difference: "The interval is added to the previously scheduled due instant, so a review taken late does NOT push the schedule; the two variants diverge by exactly the lateness of the review"

  # ---------------------------------------------------------------- C7
  - name: evisit_conversion_trigger
    trigger: "Recomputed on every POST /message-threads/{id}/messages; read as a precondition by POST /message-threads/{id}/convert-to-evisit"
    algorithm: threshold
    formula: |
      threshold_met = (patient_message_count      >= EVISIT_PATIENT_MESSAGE_THRESHOLD)   # >= 4
                   or (clinical_minutes_total     >= EVISIT_CLINICAL_MINUTES_THRESHOLD)  # >= 15

      messaging_included = the patient has a Membership in status ACTIVE whose tier
                           constant block sets includes_messaging = true
                           (CORE and PREMIER do, FOUNDATION does not)

      evisit_conversion_eligible = threshold_met and (not messaging_included)
    input_set: "One MessageThread's counters plus the patient's Membership rows filtered to status ACTIVE."
    constants:
      EVISIT_PATIENT_MESSAGE_THRESHOLD: 4
      EVISIT_CLINICAL_MINUTES_THRESHOLD: 15
      MESSAGE_SLA_HOURS: 48
    precision: "Integer comparisons, both inclusive: exactly 4 patient messages or exactly 15 clinical minutes already qualifies."
    variants: []

  # ---------------------------------------------------------------- C8
  - name: washout_clearance_date
    trigger: "POST /lab-orders — evaluated at creation to adjudicate the order into ORDERED or WASHOUT_HOLD; re-evaluated by POST /lab-orders/{id}/release-washout-hold"
    algorithm: interval_merge
    formula: |
      panel = the LAB_PANEL_<panel_code> constant block
      if panel.washout_class is null -> washout_clearance_date = null, order is ORDERED

      interfering_items = ProtocolItem rows whose owning Protocol.patient_id == order.patient_id
                          AND item.status IN {ACTIVE, HELD}
                          AND item.product.supplement_class == panel.washout_class

      for each interfering item:
        last_dose_date = the date part of dispensed_at on that item's newest Dispense in
                         status DISPENSED, ordered by dispensed_at DESC then created_at DESC
                         (a tie yields the same date, so the result is well defined);
                         when the item has no DISPENSED dispense, the date part of the
                         item's created_at
        item_clearance = last_dose_date + panel.washout_days days

      washout_clearance_date = the maximum item_clearance over interfering_items,
                               or null when interfering_items is empty

      The bound is CLOSED at the bottom: requested_collection_date == washout_clearance_date
      SATISFIES the wash-out and the order is created ORDERED. Only a strictly earlier
      requested_collection_date adjudicates the order into WASHOUT_HOLD.
    input_set: "All ProtocolItem rows of the patient in status ACTIVE or HELD (DISCONTINUED and COMPLETED lines never interfere), joined to their DispensaryProduct, plus the panel constant block."
    constants:
      LAB_PANEL_DUTCH_HORMONE_WASHOUT_DAYS: 14
      LAB_PANEL_SALIVA_CORTISOL_WASHOUT_DAYS: 7
      LAB_PANEL_STOOL_GI_MAP_WASHOUT_DAYS: 10
      LAB_PANEL_SERUM_METABOLIC_WASHOUT_DAYS: 0
    precision: "Whole calendar days on ISO dates; no time-of-day component participates."
    variants: []

  # ---------------------------------------------------------------- C9
  - name: fefo_lot_selection_and_stock
    trigger: "POST /dispenses when product_lot_id is omitted (selection), and on every Dispense creation or reversal (stock recompute)"
    algorithm: aggregation
    formula: |
      SELECTOR — which lot fills the line:
        eligibility filter : ProductLot rows with product_id == item.product_id
                             AND is_quarantined == false
                             AND is_expired == false
                             AND quantity_on_hand >= requested quantity
                             where is_expired is true once the logical clock date >= expiry_date
                             (a lot whose expiry_date is today is already expired)
        ranking expression : expiry_date ASC   (first-expiry-first-out)
        tie-break          : created_at ASC among lots sharing the same expiry_date
                             (ids never participate in the choice)
        empty-pool fallback: ERR_NO_ELIGIBLE_LOT (409)

      When product_lot_id IS supplied the selector does not run; that lot is checked
      directly and yields ERR_LOT_EXPIRED (422) when expired or quarantined, or
      ERR_INSUFFICIENT_STOCK (409) when quantity_on_hand < quantity.

      STOCK:
        on a dispense  : lot.quantity_on_hand decreased by quantity
        on a reversal  : lot.quantity_on_hand increased by quantity
        DispensaryProduct.stock_on_hand = sum of quantity_on_hand over that product's lots
                                          with is_quarantined == false and is_expired == false

      CONSERVATION (checked per lot, always):
        lot.quantity_initial == lot.quantity_on_hand
                                + sum(d.quantity for d in that lot's Dispense rows
                                      with d.status == DISPENSED)
    input_set: "All ProductLot rows of the item's product, and all Dispense rows referencing those lots."
    constants: {}
    precision: "Whole units; no fractional stock."
    variants: []

# =============================================================================
# Conservation invariants — named quantities that a forward action and its
# compensating action must leave unchanged. Every one is an identity over
# declared entity fields, checkable from the API surface at any instant.
# =============================================================================
conservation_invariants:
  - name: membership_visit_units
    quantity: "Membership.visits_granted"
    identity: "visits_granted == visits_consumed + visits_remaining + visits_forfeited"
    forward_action: "POST /encounters reserves one visit unit (consumed +1, remaining -1)"
    compensating_action: "POST /encounters/{id}/cancel at least ENCOUNTER_CANCEL_REFUND_WINDOW_HOURS ahead returns it (consumed -1, remaining +1); a later cancellation moves it instead (consumed -1, forfeited +1)"
    note: "The roll-cycle self-loop also moves remaining into forfeited while adding a fresh grant, so the identity has to survive three different movements of the same unit."

  - name: membership_lab_credit_units
    quantity: "Membership.lab_credits_granted"
    identity: "lab_credits_granted == lab_credits_consumed + lab_credits_remaining + lab_credits_forfeited"
    forward_action: "POST /lab-orders with funding_source MEMBERSHIP_CREDIT consumes the panel's lab_credit_cost"
    compensating_action: "POST /lab-orders/{id}/cancel returns exactly the same lab_credit_cost"

  - name: dispensary_lot_units
    quantity: "ProductLot.quantity_initial"
    identity: "quantity_initial == quantity_on_hand + sum(Dispense.quantity where Dispense.product_lot_id == lot.id and Dispense.status == DISPENSED)"
    forward_action: "POST /dispenses decrements quantity_on_hand"
    compensating_action: "POST /dispenses/{id}/reverse, or a reversal driven by the protocol-discontinue cascade, returns the units"

  - name: patient_cash_ledger
    quantity: "Patient.cash_charged_total_cents and Patient.cash_refunded_total_cents"
    identity: "cash_charged_total_cents == sum(Encounter.cash_charged_cents for that patient's encounters) + sum(Dispense.total_price_cents for that patient's dispenses in status DISPENSED or REVERSED) + sum(LabOrder.price_cents for that patient's CASH-funded orders) + sum(positive last_proration_net_charge_cents applied to that patient's memberships)"
    forward_action: "any cash-charging action"
    compensating_action: "every reversal or cancellation increases cash_refunded_total_cents rather than decreasing cash_charged_total_cents, so the two counters are monotonic and the net position is always their difference"

# =============================================================================
# Table 4: Validation Rules (ordered by priority — lowest number wins)
#
# The unusual shape of this ladder is deliberate: the GLOBAL CLINICAL WRITE GATE
# sits at priority 6, ABOVE payload-shape checking (11) and enum checking (12).
# On a gated endpoint family, a request that is both malformed and aimed at a
# frozen patient is answered with ERR_CLINICAL_WRITE_FROZEN — the
# server refuses to tell a caller what is wrong with a payload it will not
# consider. On every non-gated family the ladder behaves conventionally.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id embedded in the request path resolves to a live row, checked strictly left to right. The error_id is the entity-specific code where one exists — ERR_PATIENT_NOT_FOUND, ERR_PRACTITIONER_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_LAB_ORDER_NOT_FOUND, ERR_ENCOUNTER_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND — and ERR_RESOURCE_NOT_FOUND for IntakeSection, ProtocolItem, DispensaryProduct, ProductLot, Dispense, MessageThread, Superbill and Referral ids"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 4
    category: business_referential
    check: "Every foreign key PRESENT in the request body resolves to a live row, checked in the order the fields are declared in the endpoint's input list. A field that is absent is not checked here — it falls through to the required-field rung at priority 11. Entity-specific 404 codes are used where they exist (patient_id -> ERR_PATIENT_NOT_FOUND, practitioner_id -> ERR_PRACTITIONER_NOT_FOUND, encounter_id -> ERR_ENCOUNTER_NOT_FOUND, supersedes_protocol_id -> ERR_PROTOCOL_NOT_FOUND); product_id, product_lot_id and protocol_item_id use ERR_REFERENCE_NOT_FOUND"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /patients, POST /memberships, POST /lab-orders, POST /protocols, POST /protocols/{id}/items, POST /dispenses, POST /encounters, POST /message-threads, POST /superbills, POST /referrals"

  - priority: 5
    category: auth
    check: "When the acting role is Patient, the X-User-ID must equal the patient_id that owns the addressed resource — the section's patient, the thread's patient, the encounter's patient, the superbill's patient, or the protocol item's patient"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include Patient"

  - priority: 6
    category: business_safety
    check: |
      GLOBAL CLINICAL WRITE GATE. When the patient implicated by the request has
      clinical_write_gate != OPEN — that is, scope_review_status is UNDER_REVIEW
      or RESTRICTED, or an unacknowledged RED_FLAG_AUTO referral leaves
      red_flag_referral_open true — every endpoint in the GATED family is
      refused, and the refusal PRE-EMPTS every rung below, including the
      payload-shape rung at 11 and the enum rung at 12.
      GATED families (frozen):
        POST /lab-orders
        POST /lab-orders/{id}/collect
        POST /protocols
        POST /protocols/{id}/items
        POST /protocols/{id}/issue
        POST /protocols/{id}/activate
        POST /protocol-items/{id}/titration-decisions
        POST /dispenses
      NOT GATED (always available, by design — these are the ways out of a
      freeze and the safety valves):
        every GET; POST /patients; POST /patients/{id}/intake-sections;
        POST /intake-sections/{id}/attest; POST /patients/{id}/scope-reviews and
        .../close; every /memberships endpoint; POST /lab-orders/{id}/results;
        POST /lab-orders/{id}/interpret; POST /lab-orders/{id}/release-washout-hold;
        POST /lab-orders/{id}/cancel; POST /protocols/{id}/discontinue;
        POST /protocols/{id}/complete; POST /protocol-items/{id}/adverse-reactions;
        POST /dispenses/{id}/reverse; every /encounters endpoint; every
        /message-threads endpoint; every /superbills endpoint; every /referrals
        endpoint; every /dispensary-products and /product-lots endpoint;
        POST /_clock/set_current_utc
    error_id: ERR_CLINICAL_WRITE_FROZEN
    http_status: 409
    applies_to: "the eight GATED endpoints listed above"

  - priority: 7
    category: business_safety
    check: "Segregation of duties. (a) The ClinicalDirector closing a scope-of-practice review must not be the patient's primary_practitioner_id. (b) When a Dispense's total_price_cents is >= REVERSAL_AUTHORIZATION_THRESHOLD_CENTS (20000), the actor reversing it must not be the practitioner recorded in dispensed_by_practitioner_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /patients/{id}/scope-reviews/close, POST /dispenses/{id}/reverse"

  - priority: 8
    category: state
    check: "The addressed resource is in a state from which the requested transition is declared in Table 2, on the relevant axis"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "Cross-entity state preconditions hold: a Dispense requires its ProtocolItem's owning Protocol to be ACTIVE and the item to be ACTIVE or HELD; a titration decision requires the owning Protocol to be ACTIVE and item.titration_locked false; a superbill ISSUE requires the encounter's scheduling_status to be COMPLETED; an e-visit conversion requires thread.evisit_conversion_eligible to be true, which is itself false whenever the patient holds an ACTIVE membership whose tier includes messaging; a membership pause requires status ACTIVE; a wash-out release requires the interfering ProtocolItem set to have moved on or the clock to have reached the clearance date"
    error_id: ERR_DEPENDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /dispenses, POST /protocol-items/{id}/titration-decisions, POST /superbills/{id}/transitions, POST /encounters/{id}/complete, POST /message-threads/{id}/convert-to-evisit"

  - priority: 10
    category: business_constraint
    check: "When the endpoint declares an expected_<parent>_version input AND the request supplies it, the value must equal the parent's current version. A request that omits the field entirely is not judged here; it falls through to the required-field rung at priority 11, which keeps that rung reachable on these three endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /protocols, POST /dispenses, PATCH /memberships/{id}/tier"

  - priority: 11
    category: business_constraint
    check: "Every required input field for the endpoint is present, non-null and of the declared type; integers such as quantity, duration_minutes and current_symptom_score are positive where the domain demands it; scheduled_end is strictly after scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 12
    category: business_constraint
    check: "Every supplied enum-typed field carries a declared member — credential, section_type, tier, panel_code, funding_source, modality, outcome, action, severity, pricing hints"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all write endpoints carrying enum inputs"

  - priority: 13
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"

  - priority: 14
    category: business_safety
    check: "Intake completeness gate. POST /encounters requires patient.intake_booking_score >= INTAKE_BOOKING_MIN_SCORE (60). POST /protocols/{id}/issue requires patient.intake_protocol_score >= INTAKE_PROTOCOL_MIN_SCORE (85). Both boundaries are inclusive"
    error_id: ERR_INTAKE_INCOMPLETE
    http_status: 422
    applies_to: "POST /encounters, POST /protocols/{id}/issue"

  - priority: 15
    category: business_safety
    check: "Telehealth licensure. For modality TELEHEALTH — and for the EVISIT encounter minted by a thread conversion — the patient's state_code must appear in the practitioner's licensed_state_codes"
    error_id: ERR_STATE_NOT_LICENSED
    http_status: 403
    applies_to: "POST /encounters, POST /message-threads/{id}/convert-to-evisit"

  - priority: 16
    category: business_safety
    check: "Modality consent. For modality TELEHEALTH or EVISIT the patient's telehealth_consent must be true. Checked strictly after licensure, so a patient who is both out of state and unconsented is told about licensure"
    error_id: ERR_MODALITY_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /encounters, POST /message-threads/{id}/convert-to-evisit"

  - priority: 17
    category: business_safety
    check: "Contraindication check. No item on the protocol may reference a DispensaryProduct with interaction_severity SEVERE whose interacts_with_med_classes intersects the patient's medication_classes. MODERATE hits are recorded in Protocol.interaction_flags and do not block"
    error_id: ERR_CONTRAINDICATION_SEVERE
    http_status: 422
    applies_to: "POST /protocols/{id}/issue"

  - priority: 18
    category: business_safety
    check: "A LabOrder in CRITICAL_ESCALATED cannot be interpreted while its RED_FLAG_AUTO Referral is still in status SENT, DECLINED or ABANDONED. This endpoint is deliberately outside the gated family, so the rung is reachable exactly when the gate is frozen"
    error_id: ERR_RED_FLAG_UNACKNOWLEDGED
    http_status: 409
    applies_to: "POST /lab-orders/{id}/interpret"

  - priority: 19
    category: business_temporal
    check: "Collection window. When the panel constant block sets fasting_required, order.fasting_attested must be true. When it declares a cycle-day window, order.cycle_day must be present and inside the CLOSED window (19..22 for DUTCH_HORMONE, so 19 and 22 both qualify and 18 and 23 do not)"
    error_id: ERR_COLLECTION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /lab-orders/{id}/collect"

  - priority: 20
    category: business_temporal
    check: "Wash-out release requires the logical clock date to have reached washout_clearance_date (CLOSED lower bound — the clearance date itself is enough), or every interfering ProtocolItem to have moved to DISCONTINUED or COMPLETED"
    error_id: ERR_WASHOUT_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /lab-orders/{id}/release-washout-hold"

  - priority: 21
    category: business_temporal
    check: "Practitioner occupancy. The requested [scheduled_start, scheduled_end) must not overlap any existing encounter of the same practitioner whose scheduling_status is SCHEDULED or COMPLETED. The interval is HALF-OPEN, so touching windows do NOT collide. When BOTH the existing and the requested encounter are TELEHEALTH, the existing encounter's effective end is extended by TELEHEALTH_TURNAROUND_BUFFER_MINUTES (10) before the comparison; the buffer is not applied to IN_PERSON pairs or to mixed pairs. EVISIT encounters never occupy the practitioner"
    error_id: ERR_PRACTITIONER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /encounters"

  - priority: 22
    category: business_temporal
    check: "Membership cycles. A new membership's [cycle_start_date, cycle_end_date] must not overlap the CLOSED interval of any existing membership of the same patient whose status is ACTIVE or PAUSED. Unlike encounter windows, touching endpoints DO collide: a cycle ending 2026-05-30 collides with one starting 2026-05-30"
    error_id: ERR_MEMBERSHIP_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST /memberships"

  - priority: 23
    category: business_constraint
    check: "Duplicate panel. The patient may not already have a LabOrder for the same panel_code in status ORDERED, WASHOUT_HOLD or COLLECTED"
    error_id: ERR_DUPLICATE_PANEL_ORDER
    http_status: 409
    applies_to: "POST /lab-orders"

  - priority: 24
    category: business_constraint
    check: "When product_lot_id is supplied explicitly, that lot must not be quarantined and must not be expired (is_expired is true once the clock date >= expiry_date, so a lot expiring today is already unusable)"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /dispenses"

  - priority: 25
    category: business_constraint
    check: "When product_lot_id is supplied explicitly, that lot's quantity_on_hand must be >= the requested quantity"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /dispenses"

  - priority: 26
    category: business_constraint
    check: "When product_lot_id is omitted, the FEFO candidate pool must be non-empty — at least one non-quarantined, non-expired lot of the product with quantity_on_hand >= quantity"
    error_id: ERR_NO_ELIGIBLE_LOT
    http_status: 409
    applies_to: "POST /dispenses"

  - priority: 27
    category: business_fiscal
    check: "Entitlement availability. A LabOrder with funding_source MEMBERSHIP_CREDIT requires a Membership in status ACTIVE with lab_credits_remaining >= the panel's lab_credit_cost. A patient with no ACTIVE membership fails here too"
    error_id: ERR_ENTITLEMENT_EXHAUSTED
    http_status: 402
    applies_to: "POST /lab-orders"

  - priority: 28
    category: business_fiscal
    check: "A superbill can only be issued when it documents cash: billable_total_cents must be > 0, diagnosis_codes must be non-empty and rendering_practitioner_npi must not be null. An encounter fully covered by membership entitlement has billable_total_cents == 0 and is never billable"
    error_id: ERR_SUPERBILL_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /superbills/{id}/transitions with action=ISSUE"

# =============================================================================
# Table 5: API Endpoint Table  (68 endpoints, flat topology, every addressed
# resource id is written {id})
# =============================================================================
endpoints:

  # ------------------------------------------------------------ system
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time; every expiry, wash-out, cancellation-window and SLA rule in this scaffold is evaluated against this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Lazily materialises IntakeSection ATTESTED -> EXPIRED and ProductLot is_expired on the next read"

  # ------------------------------------------------------------ Practitioner
  - method: POST
    path: "/practitioners"
    description: "Register a practitioner (any credential)"
    roles: [PracticeAdmin]
    code: 201
    input: ["full_name", "credential", "licensed_state_codes", "npi?", "is_active?"]
    output: Practitioner
    side_effects: []

  - method: GET
    path: "/practitioners/{id}"
    description: "Read one practitioner"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech, ClinicalDirector, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Practitioner
    side_effects: []

  # ------------------------------------------------------------ Patient
  - method: POST
    path: "/patients"
    description: "Register a patient and attach them to a primary practitioner"
    roles: [PracticeAdmin, NaturopathicDoctor]
    code: 201
    input: ["full_name", "email", "state_code", "primary_practitioner_id", "telehealth_consent?", "medication_classes?"]
    output: Patient
    side_effects:
      - "clinical_status initialised to INTAKE, scope_review_status to NONE, clinical_write_gate to OPEN"
      - "intake_booking_score and intake_protocol_score initialised to 0"

  - method: GET
    path: "/patients/{id}"
    description: "Read one patient, including the two computed intake scores and the gate"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech, ClinicalDirector, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "Materialises any ATTESTED IntakeSection whose expires_at has passed and recomputes both intake scores"

  - method: GET
    path: "/patients"
    description: "List patients, filterable by primary practitioner and care status"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector, BillingSpecialist]
    code: 200
    input: ["primary_practitioner_id?", "clinical_status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/patients/{id}/gate"
    description: "Computed read of the global clinical write gate and everything feeding it"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech, ClinicalDirector]
    code: 200
    input: []
    output: { clinical_write_gate: string, scope_review_status: string, red_flag_referral_open: boolean, open_red_flag_referral_id: string, intake_booking_score: integer, intake_protocol_score: integer }
    side_effects:
      - "Materialises intake-section expiry before answering"

  - method: POST
    path: "/patients/{id}/scope-reviews"
    description: "Open a scope-of-practice review on a patient, freezing every gated clinical-write family"
    roles: [ClinicalDirector]
    code: 200
    input: [reason]
    output: Patient
    side_effects:
      - "scope_review_status -> UNDER_REVIEW, clinical_write_gate -> FROZEN_SCOPE_REVIEW"
      - "every ACTIVE Protocol of the patient gets advancement_blocked = true"
      - "every ACTIVE or HELD ProtocolItem under those protocols gets titration_locked = true"
      - "increments Patient.version by 1"

  - method: POST
    path: "/patients/{id}/scope-reviews/close"
    description: "Close the open scope-of-practice review with an outcome. The acting ClinicalDirector may not be the patient's primary practitioner"
    roles: [ClinicalDirector]
    code: 200
    input: ["outcome", "notes?"]
    output: Patient
    side_effects:
      - "scope_review_status -> CLEARED or RESTRICTED"
      - "on CLEARED the gate is recomputed and, when it re-opens, protocol advancement_blocked and item titration_locked are cleared"
      - "increments Patient.version by 1"

  # ------------------------------------------------------------ IntakeSection
  - method: POST
    path: "/patients/{id}/intake-sections"
    description: "Submit or re-submit one intake section. Posting a section_type that already exists overwrites it and returns it to SUBMITTED"
    roles: [Patient, HealthCoach]
    code: 201
    input: [section_type, payload_summary]
    output: IntakeSection
    side_effects:
      - "status SUBMITTED, submitted_at set to the logical clock, attested_at and expires_at cleared"
      - "weight copied from the INTAKE_SECTION_WEIGHT_* constant"
      - "recomputes Patient.intake_booking_score and Patient.intake_protocol_score"

  - method: GET
    path: "/patients/{id}/intake-sections"
    description: "List a patient's intake sections"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IntakeSection[]
    side_effects:
      - "Materialises ATTESTED -> EXPIRED for any section whose expires_at has passed"

  - method: POST
    path: "/intake-sections/{id}/attest"
    description: "Patient attests a submitted section, promoting it to full scoring weight for 180 days"
    roles: [Patient]
    code: 200
    input: []
    output: IntakeSection
    side_effects:
      - "status SUBMITTED -> ATTESTED, attested_at set, expires_at = attested_at + INTAKE_SECTION_VALIDITY_DAYS"
      - "recomputes both intake scores on the patient"

  # ------------------------------------------------------------ Membership
  - method: POST
    path: "/memberships"
    description: "Open a membership for a patient at a tier; grants the tier's visit and lab-credit entitlement"
    roles: [PracticeAdmin]
    code: 201
    input: [patient_id, tier, cycle_start_date]
    output: Membership
    side_effects:
      - "cycle_end_date = cycle_start_date + MEMBERSHIP_CYCLE_DAYS - 1 day (CLOSED interval)"
      - "visits_granted and visits_remaining set to the tier included_visits; lab_credits_granted and lab_credits_remaining set to the tier included_lab_credits; consumed and forfeited counters start at 0"
      - "when the patient's clinical_status is INACTIVE it returns to ESTABLISHED"

  - method: GET
    path: "/patients/{id}/memberships"
    description: "List a patient's memberships, newest cycle first is NOT assumed — rows are returned ordered by created_at ASC"
    roles: [PracticeAdmin, NaturopathicDoctor, BillingSpecialist, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/memberships/{id}/pause"
    description: "Pause a membership; entitlement counters are frozen where they stand"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status ACTIVE -> PAUSED, paused_at set to the logical clock"
      - "increments Membership.version by 1"

  - method: POST
    path: "/memberships/{id}/resume"
    description: "Resume a paused membership and push the cycle end out by the paused duration"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status PAUSED -> ACTIVE, paused_days_total increased, cycle_end_date advanced by the same number of days"
      - "increments Membership.version by 1"

  - method: PATCH
    path: "/memberships/{id}/tier"
    description: "Change tier mid-cycle; re-prorates the fee and the entitlement grants under optimistic concurrency"
    roles: [PracticeAdmin]
    code: 200
    input: [new_tier, expected_membership_version]
    output: Membership
    side_effects:
      - "runs calculations.membership_tier_change_proration in the pinned step order"
      - "last_proration_net_charge_cents set; the patient's cash ledger moves by it"
      - "visits_granted / visits_remaining / lab_credits_granted / lab_credits_remaining rewritten while consumed and forfeited are untouched"
      - "increments Membership.version by 1"

  - method: POST
    path: "/memberships/{id}/roll-cycle"
    description: "Roll the membership into its next cycle, or expire it. Unused entitlement is forfeited either way"
    roles: [PracticeAdmin]
    code: 200
    input: [renew]
    output: Membership
    side_effects:
      - "visits_forfeited and lab_credits_forfeited absorb whatever was remaining"
      - "renew=true: a fresh grant is added, cycle_index incremented, cycle window advanced; renew=false: status -> EXPIRED and the owning patient's clinical_status -> INACTIVE"
      - "increments Membership.version by 1"

  # ------------------------------------------------------------ LabOrder
  - method: POST
    path: "/lab-orders"
    description: "Order a functional lab panel. Wash-out interference with the patient's live protocol is adjudicated here, never silently allowed"
    roles: [NaturopathicDoctor]
    code: 201
    input: ["patient_id", "panel_code", "funding_source", "requested_collection_date", "fasting_attested?", "cycle_day?"]
    output: LabOrder
    side_effects:
      - "specimen_type, washout_class, price_cents and lab_credit_cost resolved from the panel constant block"
      - "washout_clearance_date computed; status set to WASHOUT_HOLD when requested_collection_date is strictly earlier, otherwise ORDERED"
      - "funding_source MEMBERSHIP_CREDIT debits lab_credits_remaining and increases lab_credits_consumed by lab_credit_cost"
      - "funding_source CASH increases Patient.cash_charged_total_cents by price_cents"

  - method: GET
    path: "/lab-orders/{id}"
    description: "Read one lab order"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector, Patient]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: GET
    path: "/lab-orders"
    description: "List lab orders by patient, ordering practitioner or status"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector]
    code: 200
    input: ["patient_id?", "ordering_practitioner_id?", "status?", "limit?", "offset?"]
    output: LabOrder[]
    side_effects: []

  - method: POST
    path: "/lab-orders/{id}/collect"
    description: "Record specimen collection; enforces the panel's fasting and cycle-day collection window"
    roles: [NaturopathicDoctor, HealthCoach]
    code: 200
    input: []
    output: LabOrder
    side_effects:
      - "status ORDERED -> COLLECTED, collected_at set to the logical clock"
      - "increments LabOrder.version by 1"

  - method: POST
    path: "/lab-orders/{id}/results"
    description: "Post one analyte result with both its standard and its functional bounds; classification and any critical escalation happen here"
    roles: [NaturopathicDoctor]
    code: 201
    input: [analyte_code, value, unit, standard_low, standard_high, optimal_low, optimal_high, critical_low, critical_high]
    output: LabResult
    side_effects:
      - "standard_band, optimal_band and is_critical computed by calculations.analyte_band_classification"
      - "order status COLLECTED/RESULTED -> RESULTED, or -> CRITICAL_ESCALATED when the analyte is critical"
      - "a critical analyte fires the five-link escalation cascade: order -> RED_FLAG_AUTO Referral -> Patient gate -> Protocol.advancement_blocked -> ProtocolItem.titration_locked"

  - method: GET
    path: "/lab-orders/{id}/results"
    description: "List the analyte results of one lab order"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: LabResult[]
    side_effects: []

  - method: POST
    path: "/lab-orders/{id}/interpret"
    description: "Record the interpretation and close the order. Deliberately NOT gated, so it stays available while the patient is frozen — but a critical order cannot be interpreted until its red-flag referral is acknowledged"
    roles: [NaturopathicDoctor]
    code: 200
    input: [interpretation_summary]
    output: LabOrder
    side_effects:
      - "status RESULTED or CRITICAL_ESCALATED -> INTERPRETED"
      - "increments LabOrder.version by 1"

  - method: POST
    path: "/lab-orders/{id}/release-washout-hold"
    description: "Release an order held for supplement wash-out once the clearance date is reached or the interfering lines are stopped"
    roles: [NaturopathicDoctor]
    code: 200
    input: []
    output: LabOrder
    side_effects:
      - "status WASHOUT_HOLD -> ORDERED"
      - "increments LabOrder.version by 1"

  - method: POST
    path: "/lab-orders/{id}/cancel"
    description: "Cancel a lab order and return whatever it consumed"
    roles: [NaturopathicDoctor]
    code: 200
    input: ["reason?"]
    output: LabOrder
    side_effects:
      - "MEMBERSHIP_CREDIT orders return exactly lab_credit_cost: lab_credits_consumed decreases and lab_credits_remaining increases, granted untouched"
      - "CASH orders increase Patient.cash_refunded_total_cents by price_cents"
      - "increments LabOrder.version by 1"

  # ------------------------------------------------------------ Protocol
  - method: POST
    path: "/protocols"
    description: "Draft a protocol for a patient under optimistic concurrency on the patient chart"
    roles: [NaturopathicDoctor]
    code: 201
    input: ["patient_id", "title", "symptom_score_baseline", "expected_patient_version", "supersedes_protocol_id?"]
    output: Protocol
    side_effects:
      - "status DRAFT; version_no = 1, or predecessor.version_no + 1 when supersedes_protocol_id is supplied"
      - "increments Patient.version by 1"

  - method: GET
    path: "/protocols/{id}"
    description: "Read one protocol"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech, ClinicalDirector, Patient]
    code: 200
    input: []
    output: Protocol
    side_effects: []

  - method: GET
    path: "/protocols"
    description: "List protocols; supersedes_protocol_id makes the revision chain navigable"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector]
    code: 200
    input: ["patient_id?", "practitioner_id?", "supersedes_protocol_id?", "status?", "limit?", "offset?"]
    output: Protocol[]
    side_effects: []

  - method: POST
    path: "/protocols/{id}/items"
    description: "Add a supplement line to a draft protocol"
    roles: [NaturopathicDoctor]
    code: 201
    input: [product_id, dose_amount_mg, frequency_per_day, duration_days, titration_interval_days]
    output: ProtocolItem
    side_effects:
      - "status ACTIVE, titration_step_no 0, next_review_due_at null until the first decision"
      - "increments Protocol.version by 1"

  - method: POST
    path: "/protocols/{id}/issue"
    description: "Issue the protocol. Enforces the attested-only intake gate and the severe-contraindication check"
    roles: [NaturopathicDoctor]
    code: 200
    input: []
    output: Protocol
    side_effects:
      - "status DRAFT -> ISSUED, issued_at set"
      - "interaction_flags populated from MODERATE product/medication hits"
      - "increments Protocol.version by 1"

  - method: POST
    path: "/protocols/{id}/activate"
    description: "Activate an issued protocol; a revision supersedes its predecessor and stops that predecessor's lines"
    roles: [NaturopathicDoctor]
    code: 200
    input: []
    output: Protocol
    side_effects:
      - "status ISSUED -> ACTIVE, activated_at set"
      - "a named predecessor in ACTIVE moves to SUPERSEDED, its ACTIVE/HELD items move to DISCONTINUED and their next_review_due_at is cleared"
      - "no Dispense is reversed on this path"
      - "increments Protocol.version by 1"

  - method: POST
    path: "/protocols/{id}/complete"
    description: "Complete an active protocol; all live lines close cleanly with no money movement"
    roles: [NaturopathicDoctor]
    code: 200
    input: []
    output: Protocol
    side_effects:
      - "status ACTIVE -> COMPLETED; every ACTIVE or HELD item -> COMPLETED with next_review_due_at cleared"
      - "increments Protocol.version by 1"

  - method: POST
    path: "/protocols/{id}/discontinue"
    description: "Discontinue an active protocol; live lines stop AND recent dispensing is reversed"
    roles: [NaturopathicDoctor]
    code: 200
    input: [reason]
    output: Protocol
    side_effects:
      - "status ACTIVE -> DISCONTINUED; every ACTIVE or HELD item -> DISCONTINUED"
      - "every DISPENSED Dispense on those items within ADVERSE_REVERSAL_WINDOW_DAYS -> REVERSED, restocking its lot and increasing Patient.cash_refunded_total_cents"
      - "increments Protocol.version by 1"

  # ------------------------------------------------------------ ProtocolItem
  - method: GET
    path: "/protocol-items/{id}"
    description: "Read one protocol line, including its titration state and next review anchor"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech, Patient]
    code: 200
    input: []
    output: ProtocolItem
    side_effects: []

  - method: GET
    path: "/protocol-items"
    description: "List protocol lines by protocol, product or status"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech]
    code: 200
    input: ["protocol_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ProtocolItem[]
    side_effects: []

  - method: POST
    path: "/protocol-items/{id}/titration-decisions"
    description: "Record a tolerance check-in; the symptom-score delta band picks ADVANCE, HOLD, REDUCE or DISCONTINUE and each decision anchors the next review differently"
    roles: [NaturopathicDoctor]
    code: 200
    input: [current_symptom_score]
    output: ProtocolItem
    side_effects:
      - "dose_amount_mg, status, titration_step_no, last_decision, last_decision_at and next_review_due_at set by calculations.titration_decision"
      - "a DISCONTINUE decision runs the four-link stop cascade (item -> protocol when every line is stopped -> recent dispenses reversed -> lots restocked and patient refunded)"
      - "increments ProtocolItem.version by 1"

  - method: POST
    path: "/protocol-items/{id}/adverse-reactions"
    description: "Report an adverse reaction against a line. A SEVERE report stops the line immediately and is never blocked by the clinical write gate"
    roles: [Patient, NaturopathicDoctor, HealthCoach]
    code: 200
    input: [severity, description]
    output: ProtocolItem
    side_effects:
      - "severity SEVERE: item -> DISCONTINUED with discontinue_reason ADVERSE_REACTION"
      - "when every item of the owning protocol is now DISCONTINUED the protocol moves ACTIVE -> DISCONTINUED"
      - "every DISPENSED Dispense on the stopped lines within ADVERSE_REVERSAL_WINDOW_DAYS -> REVERSED, restocking its lot and increasing Patient.cash_refunded_total_cents"
      - "severity MILD or MODERATE records the report without changing status"

  # ------------------------------------------------------------ Dispensary
  - method: POST
    path: "/dispensary-products"
    description: "Create a dispensary product with its retail price, acquisition cost and interaction profile"
    roles: [PracticeAdmin]
    code: 201
    input: ["sku", "name", "supplement_class", "retail_price_cents", "practitioner_cost_cents", "interacts_with_med_classes?", "interaction_severity?"]
    output: DispensaryProduct
    side_effects:
      - "stock_on_hand initialised to 0"

  - method: GET
    path: "/dispensary-products/{id}"
    description: "Read one dispensary product including its aggregated stock"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, DispensaryTech]
    code: 200
    input: []
    output: DispensaryProduct
    side_effects: []

  - method: POST
    path: "/dispensary-products/{id}/lots"
    description: "Receive a lot of a product into the dispensary"
    roles: [PracticeAdmin, DispensaryTech]
    code: 201
    input: ["lot_code", "quantity_initial", "expiry_date", "is_quarantined?"]
    output: ProductLot
    side_effects:
      - "quantity_on_hand initialised to quantity_initial"
      - "the owning DispensaryProduct.stock_on_hand recomputed over eligible lots"

  - method: GET
    path: "/product-lots/{id}"
    description: "Read one lot"
    roles: [PracticeAdmin, NaturopathicDoctor, DispensaryTech]
    code: 200
    input: []
    output: ProductLot
    side_effects:
      - "Materialises is_expired against the logical clock"

  - method: GET
    path: "/product-lots"
    description: "List lots, filterable by product and quarantine flag"
    roles: [PracticeAdmin, NaturopathicDoctor, DispensaryTech]
    code: 200
    input: ["product_id?", "is_quarantined?", "limit?", "offset?"]
    output: ProductLot[]
    side_effects: []

  - method: POST
    path: "/dispenses"
    description: "Fill a protocol line from the dispensary under optimistic concurrency on the protocol. Omitting product_lot_id runs the FEFO selector"
    roles: [DispensaryTech, NaturopathicDoctor]
    code: 201
    input: ["protocol_item_id", "quantity", "expected_protocol_version", "product_lot_id?", "professional_sample?"]
    output: Dispense
    side_effects:
      - "lot chosen by calculations.fefo_lot_selection_and_stock when product_lot_id is omitted"
      - "pricing_variant, unit_price_cents and total_price_cents set by calculations.dispense_line_pricing (per-unit rounding before multiplication)"
      - "ProductLot.quantity_on_hand decreased by quantity and DispensaryProduct.stock_on_hand recomputed"
      - "Patient.cash_charged_total_cents increased by total_price_cents"
      - "increments Protocol.version by 1"

  - method: GET
    path: "/dispenses/{id}"
    description: "Read one dispense"
    roles: [PracticeAdmin, NaturopathicDoctor, DispensaryTech, ClinicalDirector, Patient]
    code: 200
    input: []
    output: Dispense
    side_effects: []

  - method: GET
    path: "/dispenses"
    description: "List dispenses by patient, line, lot, dispensing practitioner or status"
    roles: [PracticeAdmin, NaturopathicDoctor, DispensaryTech, ClinicalDirector]
    code: 200
    input: ["patient_id?", "protocol_item_id?", "product_lot_id?", "dispensed_by_practitioner_id?", "status?", "limit?", "offset?"]
    output: Dispense[]
    side_effects: []

  - method: POST
    path: "/dispenses/{id}/reverse"
    description: "Reverse a dispense, restocking the lot and refunding the patient. Above the authorisation threshold the reverser may not be the dispenser"
    roles: [ClinicalDirector, DispensaryTech]
    code: 200
    input: [reason]
    output: Dispense
    side_effects:
      - "status DISPENSED -> REVERSED, reversal_authorized_by_user_id recorded"
      - "ProductLot.quantity_on_hand increased by quantity, DispensaryProduct.stock_on_hand recomputed"
      - "Patient.cash_refunded_total_cents increased by total_price_cents"
      - "increments Dispense.version by 1"

  # ------------------------------------------------------------ Encounter
  - method: POST
    path: "/encounters"
    description: "Book a visit. Reserves a membership visit unit when one is available, enforces the booking intake gate, telehealth licensure and consent, and the half-open practitioner occupancy rule"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, Patient]
    code: 201
    input: [patient_id, practitioner_id, modality, scheduled_start, scheduled_end]
    output: Encounter
    side_effects:
      - "scheduling_status SCHEDULED; billing_status ENTITLEMENT_RESERVED when an ACTIVE membership has visits_remaining >= 1, otherwise CASH_PENDING"
      - "on reservation: membership.visits_consumed +1 and visits_remaining -1, granted untouched; increments Membership.version by 1"

  - method: GET
    path: "/encounters/{id}"
    description: "Read one encounter, both axes"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: GET
    path: "/encounters"
    description: "List encounters; source_thread_id exposes the e-visits minted from message threads"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, BillingSpecialist]
    code: 200
    input: ["patient_id?", "practitioner_id?", "source_thread_id?", "scheduling_status?", "billing_status?", "limit?", "offset?"]
    output: Encounter[]
    side_effects: []

  - method: POST
    path: "/encounters/{id}/complete"
    description: "Complete a visit and settle it; entitlement covers the base fee only, extended time is always cash"
    roles: [NaturopathicDoctor, HealthCoach]
    code: 200
    input: [duration_minutes, service_code, diagnosis_codes]
    output: Encounter
    side_effects:
      - "scheduling_status SCHEDULED -> COMPLETED, completed_at set"
      - "base_fee_cents, extended_block_count and cash_charged_cents set by calculations.encounter_settlement"
      - "billing_status ENTITLEMENT_RESERVED -> ENTITLEMENT_CONSUMED, or CASH_PENDING -> CASH_CHARGED"
      - "first completion moves the patient INTAKE -> ESTABLISHED"

  - method: POST
    path: "/encounters/{id}/cancel"
    description: "Cancel a booked visit. At least 24 hours ahead the reserved visit unit is returned; later it is forfeited"
    roles: [Patient, PracticeAdmin, NaturopathicDoctor]
    code: 200
    input: [reason]
    output: Encounter
    side_effects:
      - "scheduling_status SCHEDULED -> CANCELLED"
      - "billing_status -> REFUNDED (unit returned: consumed -1, remaining +1) or FORFEITED (unit moved: consumed -1, forfeited +1), or CASH_CHARGED with LATE_CANCEL_NO_SHOW_FEE_CENTS for a late cash cancellation"
      - "increments Membership.version by 1 when a counter moved"

  - method: POST
    path: "/encounters/{id}/no-show"
    description: "Mark a booked visit as a no-show. A reserved unit is consumed and never returned"
    roles: [NaturopathicDoctor, HealthCoach, PracticeAdmin]
    code: 200
    input: []
    output: Encounter
    side_effects:
      - "scheduling_status SCHEDULED -> NO_SHOW"
      - "billing_status ENTITLEMENT_RESERVED -> ENTITLEMENT_CONSUMED with cash_charged_cents 0, or CASH_PENDING -> CASH_CHARGED with LATE_CANCEL_NO_SHOW_FEE_CENTS"

  # ------------------------------------------------------------ MessageThread
  - method: POST
    path: "/message-threads"
    description: "Open an asynchronous clinical message thread"
    roles: [Patient]
    code: 201
    input: [patient_id, practitioner_id, subject, body]
    output: MessageThread
    side_effects:
      - "status OPEN, patient_message_count 1, opened_at set, sla_due_at = opened_at + MESSAGE_SLA_HOURS"

  - method: GET
    path: "/message-threads/{id}"
    description: "Read one thread with its SLA and conversion eligibility"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, Patient]
    code: 200
    input: []
    output: MessageThread
    side_effects:
      - "Materialises sla_breached when the clock has passed sla_due_at with no clinical reply"

  - method: GET
    path: "/message-threads"
    description: "List threads by patient, practitioner or status"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach]
    code: 200
    input: ["patient_id?", "practitioner_id?", "status?", "limit?", "offset?"]
    output: MessageThread[]
    side_effects: []

  - method: POST
    path: "/message-threads/{id}/messages"
    description: "Post a message. Patient posts move the thread back to OPEN, clinical posts answer it and carry the clinical minutes that feed the e-visit threshold"
    roles: [Patient, NaturopathicDoctor, HealthCoach]
    code: 200
    input: ["body", "clinical_minutes?"]
    output: MessageThread
    side_effects:
      - "counters incremented, first_clinical_reply_at and sla_breached maintained"
      - "evisit_conversion_eligible recomputed by calculations.evisit_conversion_trigger"
      - "increments MessageThread.version by 1"

  - method: POST
    path: "/message-threads/{id}/convert-to-evisit"
    description: "Convert a thread that has crossed a conversion threshold into a billable e-visit. Refused when the patient's tier includes messaging"
    roles: [NaturopathicDoctor]
    code: 201
    input: []
    output: Encounter
    side_effects:
      - "creates an Encounter with modality EVISIT, source_thread_id set, scheduling_status COMPLETED, billing_status CASH_CHARGED and cash_charged_cents = EVISIT_FEE_CENTS"
      - "Patient.cash_charged_total_cents increased by EVISIT_FEE_CENTS"
      - "thread status -> CONVERTED_TO_EVISIT"

  - method: POST
    path: "/message-threads/{id}/close"
    description: "Close a thread with no billing consequence"
    roles: [NaturopathicDoctor, HealthCoach]
    code: 200
    input: []
    output: MessageThread
    side_effects:
      - "status -> CLOSED"
      - "increments MessageThread.version by 1"

  # ------------------------------------------------------------ Superbill
  - method: POST
    path: "/superbills"
    description: "Draft a superbill for one completed encounter, partitioning cash, membership-covered and never-billable supplement value"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, encounter_id]
    output: Superbill
    side_effects:
      - "diagnosis_codes, service_code and rendering_practitioner_npi copied from the encounter and its practitioner"
      - "billable_total_cents = encounter.cash_charged_cents; non_billable_membership_cents = the entitlement-covered base fee; excluded_supplement_cents = the patient's DISPENSED dispense value under the same protocol"
      - "status DRAFT, revision_no 1"

  - method: GET
    path: "/superbills/{id}"
    description: "Read one superbill with all three money partitions"
    roles: [BillingSpecialist, PracticeAdmin, Patient]
    code: 200
    input: []
    output: Superbill
    side_effects: []

  - method: GET
    path: "/superbills"
    description: "List superbills by patient, encounter or status"
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: ["patient_id?", "encounter_id?", "status?", "limit?", "offset?"]
    output: Superbill[]
    side_effects: []

  - method: POST
    path: "/superbills/{id}/transitions"
    description: "Drive the superbill lifecycle: ISSUE, VOID, REISSUE, REPORT_DENIAL, APPEAL or CLOSE"
    roles: [BillingSpecialist, Patient]
    code: 200
    input: ["action", "void_reason?", "denial_code?", "denial_reason?", "appeal_narrative?"]
    output: Superbill
    side_effects:
      - "ISSUE: DRAFT -> ISSUED, issued_at set, the encounter's billing axis -> SUPERBILLED"
      - "VOID: ISSUED -> VOIDED and the encounter's billing axis reverts to ENTITLEMENT_CONSUMED or CASH_CHARGED"
      - "REISSUE: VOIDED -> DRAFT with revision_no + 1 and the money partitions re-copied"
      - "REPORT_DENIAL: ISSUED -> DENIED with the payer codes recorded (the only action the Patient role may take)"
      - "APPEAL: DENIED -> APPEALED with the appeal packet narrative"
      - "CLOSE: ISSUED -> CLOSED"
      - "increments Superbill.version by 1"

  # ------------------------------------------------------------ Referral
  - method: POST
    path: "/referrals"
    description: "Raise a routine outbound referral"
    roles: [NaturopathicDoctor]
    code: 201
    input: [patient_id, recipient_name, specialty, reason]
    output: Referral
    side_effects:
      - "referral_type ROUTINE, status SENT, attempt_no 1, due_by_date = the logical clock date + RED_FLAG_REFERRAL_DUE_DAYS"

  - method: GET
    path: "/referrals/{id}"
    description: "Read one referral"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, Patient]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals; lab_order_id and referral_type expose the auto-raised red flags"
    roles: [PracticeAdmin, NaturopathicDoctor, HealthCoach, ClinicalDirector]
    code: 200
    input: ["patient_id?", "lab_order_id?", "referring_practitioner_id?", "referral_type?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/transitions"
    description: "Drive loop closure: ACKNOWLEDGE, REPORT, CLOSE, DECLINE or RE_REFER. Acknowledging a red-flag referral is what unfreezes the patient"
    roles: [NaturopathicDoctor, PracticeAdmin]
    code: 200
    input: ["action", "recipient_name?", "decline_reason?", "report_summary?"]
    output: Referral
    side_effects:
      - "ACKNOWLEDGE: SENT -> ACKNOWLEDGED and, for a RED_FLAG_AUTO referral, the five-link unfreeze cascade (referral -> red_flag_referral_open -> clinical_write_gate -> Protocol.advancement_blocked -> ProtocolItem.titration_locked)"
      - "REPORT: ACKNOWLEDGED -> REPORT_RECEIVED with report_summary and report_received_at"
      - "CLOSE: REPORT_RECEIVED -> CLOSED with closed_at"
      - "DECLINE: SENT -> DECLINED with decline_reason; a declined red flag keeps the patient frozen"
      - "RE_REFER: DECLINED -> SENT with attempt_no + 1 and a new recipient_name, or DECLINED -> ABANDONED once attempt_no has reached REFERRAL_MAX_ATTEMPTS"
      - "increments Referral.version by 1"

# =============================================================================
# Table 6: Error Code Catalog (34 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header is missing or empty" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "A Patient acts on a resource belonging to a different patient" }

  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "A patient id in the path or body does not resolve" }
  - { id: ERR_PRACTITIONER_NOT_FOUND, http: 404, condition: "A practitioner id in the path or body does not resolve" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "A protocol id in the path, or supersedes_protocol_id in a body, does not resolve" }
  - { id: ERR_LAB_ORDER_NOT_FOUND, http: 404, condition: "A lab order id in the path does not resolve" }
  - { id: ERR_ENCOUNTER_NOT_FOUND, http: 404, condition: "An encounter id in the path or body does not resolve" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "A membership id in the path does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "An addressed IntakeSection, ProtocolItem, DispensaryProduct, ProductLot, Dispense, MessageThread, Superbill or Referral id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A body foreign key without an entity-specific code (product_id, product_lot_id, protocol_item_id) does not resolve" }

  - { id: ERR_VALIDATION, http: 400, condition: "A required input field is missing, null, of the wrong type, or violates a simple range rule such as a non-positive quantity or scheduled_end not after scheduled_start" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "An enum-typed input carries a value outside its declared member set" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit is outside 1..100 or offset is negative" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "The addressed resource is not in a state from which the requested transition is declared, on the relevant axis" }
  - { id: ERR_DEPENDENT_STATE_INVALID, http: 409, condition: "A different entity the operation depends on is in the wrong state — an inactive protocol behind a dispense, a locked line behind a titration decision, an uncompleted encounter behind a superbill issue" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "An expected_<parent>_version input does not equal the parent's current version" }

  - { id: ERR_CLINICAL_WRITE_FROZEN, http: 409, condition: "The patient's clinical_write_gate is not OPEN and the request targets one of the eight gated clinical-write endpoints; pre-empts every lower-priority check including payload shape" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The actor is not allowed to be both parties — closing a scope review on their own patient, or authorising the reversal of a dispense they performed at or above the authorisation threshold" }
  - { id: ERR_INTAKE_INCOMPLETE, http: 422, condition: "intake_booking_score is below 60 at booking, or intake_protocol_score is below 85 at protocol issue" }
  - { id: ERR_RED_FLAG_UNACKNOWLEDGED, http: 409, condition: "A CRITICAL_ESCALATED lab order is interpreted while its RED_FLAG_AUTO referral is still SENT, DECLINED or ABANDONED" }

  - { id: ERR_STATE_NOT_LICENSED, http: 403, condition: "A telehealth or e-visit encounter is requested where the patient's state_code is absent from the practitioner's licensed_state_codes" }
  - { id: ERR_MODALITY_CONSENT_MISSING, http: 422, condition: "A telehealth or e-visit encounter is requested for a patient whose telehealth_consent is false" }
  - { id: ERR_CONTRAINDICATION_SEVERE, http: 422, condition: "A protocol is issued containing a product whose interaction_severity is SEVERE against a class present in the patient's medication_classes" }

  - { id: ERR_COLLECTION_WINDOW_INVALID, http: 422, condition: "Collection is recorded without the required fasting attestation, or with a cycle_day outside the panel's closed cycle-day window" }
  - { id: ERR_WASHOUT_NOT_ELAPSED, http: 409, condition: "A wash-out hold is released before the clearance date while an interfering line is still ACTIVE or HELD" }
  - { id: ERR_DUPLICATE_PANEL_ORDER, http: 409, condition: "The patient already has a lab order for the same panel_code in status ORDERED, WASHOUT_HOLD or COLLECTED" }

  - { id: ERR_PRACTITIONER_DOUBLE_BOOKED, http: 409, condition: "The requested half-open encounter window collides with another window of the same practitioner, counting the telehealth turnaround buffer where both windows are TELEHEALTH" }
  - { id: ERR_MEMBERSHIP_CYCLE_OVERLAP, http: 409, condition: "The requested closed membership cycle touches or overlaps an existing ACTIVE or PAUSED cycle of the same patient" }

  - { id: ERR_LOT_EXPIRED, http: 422, condition: "An explicitly named lot is quarantined, or its expiry_date is on or before the logical clock date" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "An explicitly named lot holds fewer units than the requested quantity" }
  - { id: ERR_NO_ELIGIBLE_LOT, http: 409, condition: "The FEFO candidate pool is empty — no unquarantined, unexpired lot of the product holds the requested quantity" }

  - { id: ERR_ENTITLEMENT_EXHAUSTED, http: 402, condition: "A membership-funded lab order is requested with no ACTIVE membership, or with fewer lab_credits_remaining than the panel's lab_credit_cost" }
  - { id: ERR_SUPERBILL_NOT_BILLABLE, http: 422, condition: "A superbill is issued with billable_total_cents of 0, empty diagnosis_codes, or a null rendering_practitioner_npi" }

# =============================================================================
# Table 7: RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Front-office and configuration operator: registers practitioners and patients, runs the dispensary catalogue, owns membership lifecycle and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /practitioners"
      - "POST /memberships"
      - "POST /memberships/{id}/pause"
      - "POST /memberships/{id}/resume"
      - "PATCH /memberships/{id}/tier"
      - "POST /memberships/{id}/roll-cycle"
      - "POST /dispensary-products"
    shared_operations:
      - "POST /patients"
      - "POST /dispensary-products/{id}/lots"
      - "POST /encounters"
      - "POST /encounters/{id}/cancel"
      - "POST /encounters/{id}/no-show"
      - "POST /referrals/{id}/transitions"
      - "every GET except the patient-owned reads restricted to their owner"

  - name: NaturopathicDoctor
    description: "Licensed naturopathic doctor: the only role that may order labs, author and advance protocols, take titration decisions and raise referrals"
    identity: "entity_backed:Practitioner"
    exclusive_operations:
      - "POST /lab-orders"
      - "POST /lab-orders/{id}/results"
      - "POST /lab-orders/{id}/interpret"
      - "POST /lab-orders/{id}/release-washout-hold"
      - "POST /lab-orders/{id}/cancel"
      - "POST /protocols"
      - "POST /protocols/{id}/items"
      - "POST /protocols/{id}/issue"
      - "POST /protocols/{id}/activate"
      - "POST /protocols/{id}/complete"
      - "POST /protocols/{id}/discontinue"
      - "POST /protocol-items/{id}/titration-decisions"
      - "POST /message-threads/{id}/convert-to-evisit"
      - "POST /referrals"
    shared_operations:
      - "POST /patients"
      - "POST /lab-orders/{id}/collect"
      - "POST /dispenses"
      - "POST /encounters"
      - "POST /encounters/{id}/complete"
      - "POST /encounters/{id}/cancel"
      - "POST /encounters/{id}/no-show"
      - "POST /message-threads/{id}/messages"
      - "POST /message-threads/{id}/close"
      - "POST /protocol-items/{id}/adverse-reactions"
      - "POST /referrals/{id}/transitions"

  - name: HealthCoach
    description: "Non-prescribing coach: helps patients complete intake, collects specimens, runs visits and answers messages, but may never order a lab or touch a protocol"
    identity: "entity_backed:Practitioner"
    exclusive_operations: []
    shared_operations:
      - "POST /patients/{id}/intake-sections"
      - "POST /lab-orders/{id}/collect"
      - "POST /encounters"
      - "POST /encounters/{id}/complete"
      - "POST /encounters/{id}/no-show"
      - "POST /message-threads/{id}/messages"
      - "POST /message-threads/{id}/close"
      - "POST /protocol-items/{id}/adverse-reactions"

  - name: DispensaryTech
    description: "Dispensary technician: receives lots and fills protocol lines; may reverse a dispense only when they were not the dispenser at or above the authorisation threshold"
    identity: "entity_backed:Practitioner"
    exclusive_operations: []
    shared_operations:
      - "POST /dispensary-products/{id}/lots"
      - "POST /dispenses"
      - "POST /dispenses/{id}/reverse"

  - name: ClinicalDirector
    description: "Supervising director: opens and closes scope-of-practice reviews and authorises high-value dispensing reversals. Never the patient's own primary practitioner when closing a review"
    identity: "entity_backed:Practitioner"
    exclusive_operations:
      - "POST /patients/{id}/scope-reviews"
      - "POST /patients/{id}/scope-reviews/close"
    shared_operations:
      - "POST /dispenses/{id}/reverse"

  - name: BillingSpecialist
    description: "Cash-practice biller: drafts, issues, voids, reissues and appeals superbills the patient self-submits"
    identity: "opaque"
    exclusive_operations:
      - "POST /superbills"
    shared_operations:
      - "POST /superbills/{id}/transitions"

  - name: Patient
    description: "The member themselves: completes and attests intake, books and cancels their own visits, opens message threads, reports adverse reactions and reports payer denials"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /intake-sections/{id}/attest"
      - "POST /message-threads"
    shared_operations:
      - "POST /patients/{id}/intake-sections"
      - "POST /encounters"
      - "POST /encounters/{id}/cancel"
      - "POST /message-threads/{id}/messages"
      - "POST /protocol-items/{id}/adverse-reactions"
      - "POST /superbills/{id}/transitions with action REPORT_DENIAL only"
