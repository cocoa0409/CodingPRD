        distinguishing_aspect: "The POST /close response itself shows status==FUNDED and swept_amount_cents==200,000 in the same request — immediate consistency."
        test_recipe:
          setup: ["Verified issuer; LIVE SAFE offering min 100,000c; one accredited 200,000c commitment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
