            - "SuitabilityAssessment.${a1_id}.hard_fail_capped == false"
            - "SuitabilityAssessment.${a1_id}.decided_by_user_id == null"
            - "Building.${b_id}.suitability_state == ASSESSING"
            - "Building.${b_id}.latest_assessment_verdict == null"

      - name: assessment_return_decision_without_note_rejected
