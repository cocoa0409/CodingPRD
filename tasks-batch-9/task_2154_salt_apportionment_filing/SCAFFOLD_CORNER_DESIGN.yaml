            - "VDAAgreement.${v_id}.computed_exposure_tax == 210000.00 and waived_penalty_amount == 0.00"
            - "VDAAgreement.${v_id}.settlement_total == 222000.00 and shield_expires_at == 2028-08-01T00:00:00Z"
            - "LegalEntity.${le_a_id}.vda_shield_until == 2028-08-01T00:00:00Z"
            - "StateRegistration.${reg_ca_id}.nexus_status == VOLUNTARY and registration_status == REGISTERED"
            - "TaxpayerGroup.${grp_id}.open_registration_obligations == 0 and compliance_posture == COMPLIANT"

