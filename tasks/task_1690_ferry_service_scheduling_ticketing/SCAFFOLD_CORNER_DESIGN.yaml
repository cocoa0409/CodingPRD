        test_recipe:
          setup: ["route; four DRAFT fare schedules for distinct seasons/windows are impossible (2 seasons only) — instead submit the same draft, read surcharge, return-for-revision, resubmit at next index"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 299 }
              as: SchedulerAdmin
              captures: { s299: $.data.fuel_surcharge_cents }
            - call: "POST /ferry/fare-schedules/${fs_id}/return-for-revision"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 300 }
              as: SchedulerAdmin
              captures: { s300: $.data.fuel_surcharge_cents }
            - call: "POST /ferry/fare-schedules/${fs_id}/return-for-revision"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 499 }
              as: SchedulerAdmin
              captures: { s499: $.data.fuel_surcharge_cents }
            - call: "POST /ferry/fare-schedules/${fs_id}/return-for-revision"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 500 }
              as: SchedulerAdmin
              captures: { s500: $.data.fuel_surcharge_cents }
