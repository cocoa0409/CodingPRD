              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_frank_id}", credential_type: "COI_GIFT_ATTESTATION", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "COI-FOUR-01" }
