# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2810 — Device Installment & Annual Upgrade Program
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. The logical clock
# starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc), so every
# date literal below is derived from that origin.
#
# Reference fixture used by most chains ("Handset B"): retail_price_cents 89900,
# monthly_protection_premium_cents 999, term_months 24, down_payment 0
#   -> principal_cents 89900, base principal component 3746, last 3742,
#      monthly_installment_cents 4745 (installment 24 = 4741),
#      premium_total_cents 23976, obligation_balance_cents 113876
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payoff_quote_variant_divergence_cancellation_vs_rollover
        grounds:
          - calculations.payoff_quote
          - calculations.unearned_premium_rebate
          - entities.PayoffQuote.fields.total_payoff_cents
          - entities.PayoffQuote.fields.unearned_premium_cents
          - entities.PayoffQuote.fields.premium_rebate_cents
          - entities.PayoffQuote.fields.admin_fee_cents
          - state_machines.PayoffQuote.null_to_ISSUED
        distinguishing_aspect: |
          This dual variant lives in the loan/quote fiscal-accounting domain: on one identical
          InstallmentLoan (24 months, 12 PAID installments) the UPGRADE_ROLLOVER variant prices
          the unearned protection premium with the rule-of-78 factor 156/600 and charges no
          admin fee (total_payoff_cents 38714) while the EARLY_CANCELLATION variant prices it
          straight-line with a 10% retention haircut and adds CANCELLATION_ADMIN_FEE_CENTS
          (total_payoff_cents 36659) — a divergence of exactly 2055 cents on byte-identical
          loan state.
        test_recipe:
          setup:
            - "One DeviceModel 'Handset B' (retail 89900, premium 999, trade-in base 45000) and one target model 'Handset A' (retail 119900, premium 1199, trade-in base 60000, capacity 2)."
            - "One PRIME customer holding one ACTIVE 24-month InstallmentLoan on Handset B, principal_cents 89900, obligation_balance_cents 113876."
            - "Exactly 12 installments PAID (one PAYMENT posting of 56940 at clock 2026-08-01), so paid_principal_cents 44952, paid_premium_cents 11988, remaining principal 44948, paid_installment_count 12, delinquency_state CURRENT, outstanding_late_fee_cents 0."
            - "The loan's handset is ACTIVATED on a carrier account; the clock has advanced to 2027-06-27 (origination_date + 330 days = upgrade_window_opens_at) and one ELIGIBILITY_PASSED UpgradeRequest exists on the loan so the UPGRADE_ROLLOVER variant is admissible."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027, concurrent_reservation_capacity: 2 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ada Vance", email: "ada.vance@example.com", mobile_number: "+15550100001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643801" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /device-units"
              payload: { loan_id: "${loan}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { dev: "$.data[0].id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "VERIZON", account_number: "ACC-2810-0001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /device-units/${dev}/activation"
              payload: { carrier_account_id: "${carr}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 56940 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-27T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /loans/${loan}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan_v: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { loan_id: "${loan}", target_device_model_id: "${m_a}", fulfillment_window_start: "2027-06-27T00:00:00Z", expected_loan_version: "${loan_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ur: "$.data.id" }
          trigger:
            - call: "POST /loans/${loan}/payoff-quotes"
              payload: { quote_type: "UPGRADE_ROLLOVER" }
              as: Customer
              as_user_id: "${cust}"
              captures: { q_roll: "$.data.id", roll_total: "$.data.total_payoff_cents" }
            - call: "POST /loans/${loan}/payoff-quotes"
              payload: { quote_type: "EARLY_CANCELLATION" }
              as: Customer
              as_user_id: "${cust}"
              captures: { q_cancel: "$.data.id", cancel_total: "$.data.total_payoff_cents" }
          assert:
            - "PayoffQuote.${q_roll}.remaining_principal_cents == 44948"
            - "PayoffQuote.${q_roll}.unearned_premium_cents == 6234"
            - "PayoffQuote.${q_roll}.premium_rebate_cents == 6234"
            - "PayoffQuote.${q_roll}.admin_fee_cents == 0"
            - "PayoffQuote.${q_roll}.total_payoff_cents == 38714"
            - "PayoffQuote.${q_roll}.paid_installment_count_at_quote == 12"
            - "PayoffQuote.${q_roll}.past_due_amount_cents == 0"
            - "PayoffQuote.${q_roll}.expires_at == 2027-07-04T00:00:00Z"
            - "PayoffQuote.${q_cancel}.remaining_principal_cents == 44948"
            - "PayoffQuote.${q_cancel}.unearned_premium_cents == 11988"
            - "PayoffQuote.${q_cancel}.premium_rebate_cents == 10789"
            - "PayoffQuote.${q_cancel}.admin_fee_cents == 2500"
            - "PayoffQuote.${q_cancel}.total_payoff_cents == 36659"
            - "PayoffQuote.${q_roll}.total_payoff_cents - PayoffQuote.${q_cancel}.total_payoff_cents == 2055"
            - "PayoffQuote.${q_roll}.status == ISSUED and PayoffQuote.${q_cancel}.status == ISSUED (different quote_type never supersedes)"

      - name: trade_in_credit_declared_estimate_vs_final_graded
        grounds:
          - calculations.trade_in_credit
          - entities.TradeIn.fields.credit_estimate_cents
          - entities.TradeIn.fields.credit_final_cents
          - entities.TradeIn.fields.credit_variance_cents
          - entities.DiagnosticReport.fields.condition_multiplier_bps
          - state_machines.TradeIn.RECEIVED_to_GRADED
        distinguishing_aspect: |
          This dual variant lives in the handset-valuation domain (DeviceUnit / TradeIn), not the
          loan ledger: the declared_estimate variant applies the condition multiplier alone
          (45000 * 8500bps = 38250) while the final_graded variant applies the multiplier and
          then subtracts the screen and battery deductions with a floor (38250 - 2500 - 4000 =
          31750), so credit_variance_cents is exactly -6500 on the same physical handset.
        test_recipe:
          setup:
            - "Same reference fixture as payoff_quote_variant_divergence_cancellation_vs_rollover: PRIME customer, ACTIVE Handset B loan with 12 PAID installments, handset ACTIVATED, clock at 2027-06-27, one ELIGIBILITY_PASSED UpgradeRequest targeting Handset A."
            - "The traded handset's model (Handset B) carries trade_in_base_credit_cents 45000."
            - "No DiagnosticReport exists yet, so TradeIn.credit_final_cents is still null after the declaration."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027, concurrent_reservation_capacity: 2 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ada Vance", email: "ada.vance@example.com", mobile_number: "+15550100001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643801" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /device-units"
              payload: { loan_id: "${loan}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { dev: "$.data[0].id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "VERIZON", account_number: "ACC-2810-0001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /device-units/${dev}/activation"
              payload: { carrier_account_id: "${carr}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 56940 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-27T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /loans/${loan}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan_v: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { loan_id: "${loan}", target_device_model_id: "${m_a}", fulfillment_window_start: "2027-06-27T00:00:00Z", expected_loan_version: "${loan_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ur: "$.data.id" }
          trigger:
            - call: "POST /upgrade-requests/${ur}/trade-in-declaration"
              payload: { device_unit_id: "${dev}", declared_condition: "GOOD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ti: "$.data.id", est: "$.data.credit_estimate_cents" }
            - call: "POST /trade-ins/${ti}/receipt"
              payload: {}
              as: ServiceTechnician
              as_user_id: "u-tech-1"
            - call: "POST /trade-ins/${ti}/diagnostic-reports"
              payload: { screen_grade: "SCRATCHED", battery_health_pct: 78, water_damage_flag: false, functional_pass: true }
              as: ServiceTechnician
              as_user_id: "u-tech-1"
              captures: { dr: "$.data.id", dr_credit: "$.data.computed_credit_cents" }
          assert:
            - "TradeIn.${ti}.credit_estimate_cents == 38250"
            - "TradeIn.${ti}.graded_condition == GOOD"
            - "TradeIn.${ti}.credit_final_cents == 31750"
            - "TradeIn.${ti}.credit_variance_cents == -6500"
            - "TradeIn.${ti}.status == GRADED"
            - "TradeIn.${ti}.latest_report_sequence_no == 1"
            - "DiagnosticReport.${dr}.sequence_no == 1"
            - "DiagnosticReport.${dr}.report_type == INITIAL"
            - "DiagnosticReport.${dr}.derived_condition == GOOD"
            - "DiagnosticReport.${dr}.condition_multiplier_bps == 8500"
            - "DiagnosticReport.${dr}.screen_deduction_cents == 2500"
            - "DiagnosticReport.${dr}.battery_deduction_cents == 4000"
            - "DiagnosticReport.${dr}.computed_credit_cents == 31750"
            - "DiagnosticReport.${dr}.diagnostic_result == PASS"
            - "UpgradeRequest.${ur}.status == TRADE_IN_GRADED"
            - "UpgradeRequest.${ur}.trade_in_credit_projection_cents == 31750"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: installment_component_rounding_residual_on_last
        grounds:
          - calculations.installment_schedule_generation
          - entities.Installment.fields.principal_component_cents
          - entities.Installment.fields.amount_due_cents
          - entities.InstallmentLoan.fields.monthly_installment_cents
          - entities.InstallmentLoan.fields.obligation_balance_cents
          - state_machines.InstallmentLoan.null_to_ACTIVE
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is pinned: round_half_up(89900 / 24) = 3746
          is computed FIRST and applied to installments 1..23, and the whole residual
          89900 - 3746*23 = 3742 lands on installment 24 only; a sum-then-round or
          spread-the-remainder implementation gives installment 24 a principal component of
          3746 or 3745 and breaks sum(principal_component_cents) == 89900.
        test_recipe:
          setup:
            - "One DeviceModel 'Handset B' (retail 89900, premium 999) and one PRIME customer with an APPROVED 24-month credit application and no other loan."
            - "No payment has been posted; the clock is still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ben Rowe", email: "ben.rowe@example.com", mobile_number: "+15550100002" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
          trigger:
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643802" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /loans/${loan}/installments"
              payload: { limit: 24 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
          assert:
            - "InstallmentLoan.${loan}.principal_cents == 89900"
            - "InstallmentLoan.${loan}.monthly_installment_cents == 4745"
            - "InstallmentLoan.${loan}.premium_total_cents == 23976"
            - "InstallmentLoan.${loan}.obligation_balance_cents == 113876"
            - "GET /loans/${loan}/installments returns total_count == 24"
            - "Installment(loan_id=${loan}, installment_number=1).principal_component_cents == 3746"
            - "Installment(loan_id=${loan}, installment_number=1).premium_component_cents == 999"
            - "Installment(loan_id=${loan}, installment_number=1).amount_due_cents == 4745"
            - "Installment(loan_id=${loan}, installment_number=1).due_date == 2026-09-01T00:00:00Z"
            - "Installment(loan_id=${loan}, installment_number=23).principal_component_cents == 3746"
            - "Installment(loan_id=${loan}, installment_number=24).principal_component_cents == 3742"
            - "Installment(loan_id=${loan}, installment_number=24).amount_due_cents == 4741"
            - "Installment(loan_id=${loan}, installment_number=24).due_date == 2028-08-01T00:00:00Z"
            - "sum over the 24 installments of principal_component_cents == 89900"
            - "sum over the 24 installments of premium_component_cents == 23976"
            - "every installment has status == SCHEDULED and late_fee_assessed == false"

      - name: trade_in_final_credit_nested_min_max_deductions
        grounds:
          - calculations.trade_in_credit
          - entities.DiagnosticReport.fields.screen_deduction_cents
          - entities.DiagnosticReport.fields.battery_deduction_cents
          - entities.DiagnosticReport.fields.computed_credit_cents
          - entities.TradeIn.fields.credit_final_cents
          - state_machines.TradeIn.RECEIVED_to_GRADED
        distinguishing_aspect: |
          Mode (a) — one formula over four inputs (trade_in_base_credit_cents, screen_grade,
          battery_health_pct, functional/water flags) with a nested min-then-max interaction:
          min_by_severity(FAIR, FAIR) selects the 6000bps multiplier, giving 9000, from which
          9500 + 8000 of un-scaled deductions are subtracted to -8500, and only then does the
          outer max(TRADE_IN_CREDIT_FLOOR_CENTS, ...) clamp the result to exactly 0; an
          implementation that clamps before subtracting, or that scales the deductions by the
          multiplier, cannot produce 0 here.
        test_recipe:
          setup:
            - "One DeviceModel 'Handset H' (retail 45000, premium 599, trade_in_base_credit_cents 15000) and one target model 'Handset A' (retail 119900, premium 1199, capacity 2)."
            - "One PRIME customer with an ACTIVE 24-month Handset H loan: principal 45000, base principal component 1875, monthly_installment_cents 2474, obligation_balance_cents 59376."
            - "12 installments PAID via a single PAYMENT of 29688, handset ACTIVATED, clock advanced to 2027-06-27, one ELIGIBILITY_PASSED UpgradeRequest on Handset A, TradeIn DECLARED as FAIR (credit_estimate_cents 9000) and RECEIVED."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-H", display_name: "Handset H", retail_price_cents: 45000, monthly_protection_premium_cents: 599, trade_in_base_credit_cents: 15000, generation_year: 2025 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_h: "$.data.id" }
            - call: "POST /device-models"
