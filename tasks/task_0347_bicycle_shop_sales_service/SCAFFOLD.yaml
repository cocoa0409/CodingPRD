scenario: "Bicycle Shop Sales & Service: inventory (bikes/parts/accessories), service ticket & labor menu, tune-up tiers & turnaround, special-order & build, layaway/financing, warranty (frame/component), trade-in/used, recall"
domain_name: bicycle-shop-sales-service
api_prefix: /shop

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested ownership URL chains. The
  # SKU is the central allocation pool; SalesOrder, BuildJob, LayawayPlan, and
  # SpecialOrder all compete for the same on_hand units via Reservation.

  state_machine_shape: parallel
  # SalesOrder carries two INDEPENDENT axes (payment_status x fulfillment_status).
  # ServiceTicket is CYCLIC (AWAITING_APPROVAL -> IN_PROGRESS revision loop).
  # WarrantyClaim is BRANCHING (fork into REPAIR vs REPLACE vs DENY).
  # BuildJob is COMPOUND/guarded (gated on parts-reservation completeness).

  relationship_patterns:
    - one_to_many        # Customer -> SalesOrder, SalesOrder -> OrderLine
    - flat_fk            # Reservation references Sku.id and a polymorphic holder
    - cross_aggregate    # ServiceTicket.warranty_claim_id references WarrantyClaim
    - polymorphic        # Reservation.holder_type/holder_id spans 4 holder kinds

  role_model: peer_roles
  # SalesAssociate owns sales/layaway/trade-in; ServiceAdvisor owns tickets/builds/
  # warranty; ShopManager is a hierarchical override for adjustments and recalls;
  # Customer is entity-backed and may only read/approve their own resources.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer display name.
      - name: email
        type: string
        source: input
        description: Contact email; unique across customers.
        constraints: "Unique (case-insensitive). Format must contain '@'."
      - name: store_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Running store-credit balance in cents. Credited when a TradeIn is ACCEPTED and applied to credit (apply_to=STORE_CREDIT); debited when consumed by a SalesOrder. Reconciled by calc apply_store_credit."
      - name: open_recall_count
        type: integer
        source: computed
        default: 0
        description: "Number of distinct RecallNotice rows that match a Sku this customer has purchased (via a DELIVERED OrderLine) and that this customer has NOT yet acknowledged. Derived by calc customer_open_recall_count."

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable product name.
      - name: category
        type: enum
        source: input
        description: Product category.
        constraints: "One of {BIKE, PART, ACCESSORY}."
      - name: list_price_cents
        type: integer
        source: input
        description: Unit list price in cents.
        constraints: ">= 1."
      - name: on_hand
        type: integer
        source: input
        default: 0
        description: "Physical units in stock. Mutated only by restock and by Reservation COMMIT/RELEASE side effects."
        constraints: ">= 0."
      - name: reserved
        type: integer
        source: computed
        default: 0
        description: "Units held by ACTIVE Reservation rows pointing at this Sku. available = on_hand - reserved. Reconciled by calc sku_available_units."
      - name: warranty_class
        type: enum
        source: input
        default: NONE
        description: "Warranty coverage class governing which WarrantyClaim defect_part values are admissible for this Sku."
        constraints: "One of {NONE, COMPONENT, FRAME_AND_COMPONENT}."
      - name: is_serialized
        type: boolean
        source: input
        default: false
        description: "True for frame-numbered bikes; required true before a Sku may be the subject of a WarrantyClaim with defect_part=FRAME."

  - name: TuneUpTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: Tier identifier.
        constraints: "One of {BASIC, STANDARD, PREMIUM}. Unique per tier code."
      - name: base_labor_cents
        type: integer
        source: input
        description: Flat labor charge for this tier in cents.
        constraints: ">= 0."
      - name: turnaround_hours
        type: integer
        source: input
        description: "Quoted turnaround in business hours; feeds promised_ready_at on the ServiceTicket."
        constraints: ">= 1."
      - name: rush_multiplier_bps
        type: integer
        source: input
        default: 5000
        description: "Rush surcharge in basis points applied to base_labor_cents when a ticket is flagged rush (5000 = +50%)."
        constraints: ">= 0."

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Bay label (e.g. "Bay 1").
      - name: is_active
        type: boolean
        source: input
        default: true
        description: "When false the bay accepts no new bookings."

  - name: BayBooking
    parent: null
    common_fields: true
    fields:
      - name: bay_id
        type: string
        source: input
        description: "FK -> ServiceBay.id; the bay being occupied."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> ServiceTicket.id; the ticket this booking is for."
      - name: start_at
        type: datetime
        source: input
        description: "Half-open interval start (inclusive)."
      - name: end_at
        type: datetime
        source: input
        description: "Half-open interval end (exclusive). Must be strictly after start_at."
      - name: status
        type: enum
        source: computed
        default: BOOKED
        description: "Booking lifecycle."
        constraints: "One of {BOOKED, RELEASED}."

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ticket owner."
      - name: tier_id
        type: string
        source: input
        description: "FK -> TuneUpTier.id; the selected tune-up tier."
      - name: warranty_claim_id
        type: string
        source: input
        default: null
        description: "FK -> WarrantyClaim.id; set when this ticket is the repair execution of an APPROVED warranty claim. Null for paid work."
      - name: status
        type: enum
        source: computed
        default: INTAKE
        description: "Workflow state."
        constraints: "One of {INTAKE, AWAITING_APPROVAL, IN_PROGRESS, READY_FOR_PICKUP, CLOSED, CANCELLED}."
      - name: is_rush
        type: boolean
        source: input
        default: false
        description: "When true, base labor carries the tier rush surcharge and promised_ready_at halves."
      - name: promised_ready_at
        type: datetime
        source: computed
        description: "Computed at INTAKE->AWAITING_APPROVAL: current_utc + effective turnaround. See calc ticket_quote."
      - name: labor_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of effective base tier labor plus all LaborLine charges on this ticket. See calc ticket_quote."
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this ticket has cycled IN_PROGRESS -> AWAITING_APPROVAL for re-approval of added labor."
      - name: customer_owes_cents
        type: integer
        source: computed
        default: 0
        description: "Amount the customer owes at pickup; 0 when warranty_claim_id is set (warranty work is not billed to the customer). See calc ticket_quote."

  - name: LaborLine
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> ServiceTicket.id; the ticket this labor line belongs to."
      - name: menu_code
        type: string
        source: input
        description: "Labor menu code (e.g. BRAKE_BLEED, WHEEL_TRUE)."
      - name: labor_cents
        type: integer
        source: input
        description: Labor charge for this line in cents.
        constraints: ">= 0."
      - name: added_after_approval
        type: boolean
        source: computed
        default: false
        description: "True when the line was added while the ticket was IN_PROGRESS (i.e. after the first approval), forcing a re-approval cycle."

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer."
      - name: payment_status
        type: enum
        source: computed
        default: UNPAID
        description: "Payment axis (independent of fulfillment_status)."
        constraints: "One of {UNPAID, PARTIALLY_PAID, PAID, REFUNDED}."
      - name: fulfillment_status
        type: enum
        source: computed
        default: PENDING
        description: "Fulfillment axis (independent of payment_status)."
        constraints: "One of {PENDING, RESERVED, DELIVERED, CANCELLED}."
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over OrderLine of qty * unit_price_cents. See calc order_total."
      - name: store_credit_applied_cents
        type: integer
        source: computed
        default: 0
        description: "Store credit consumed at delivery. See calc apply_store_credit."
      - name: total_due_cents
        type: integer
        source: computed
        default: 0
        description: "subtotal_cents - store_credit_applied_cents. See calc order_total."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Payment.amount_cents (status=CAPTURED) attached to this order. See calc order_total."

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; parent order."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the product sold."
      - name: qty
        type: integer
        source: input
        description: Units of the Sku on this line.
        constraints: ">= 1."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Snapshot of Sku.list_price_cents at line creation; immutable thereafter."

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the pool drawn from."
      - name: holder_type
        type: enum
        source: input
        description: "Polymorphic holder kind."
        constraints: "One of {SALES_ORDER, BUILD_JOB, LAYAWAY_PLAN, SPECIAL_ORDER}."
      - name: holder_id
        type: string
        source: input
        description: "Polymorphic holder id; the id of the SalesOrder / BuildJob / LayawayPlan / SpecialOrder named by holder_type."
      - name: qty
        type: integer
        source: input
        description: Units held.
        constraints: ">= 1."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Reservation lifecycle."
        constraints: "One of {ACTIVE, COMMITTED, RELEASED}."

  - name: LayawayPlan
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the plan holder."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the single Sku being laid away."
      - name: qty
        type: integer
        source: input
        default: 1
        description: Units laid away.
        constraints: ">= 1."
      - name: price_cents
        type: integer
        source: computed
        description: "Snapshot of Sku.list_price_cents * qty at plan open; immutable thereafter."
      - name: deposit_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Payment.amount_cents (status=CAPTURED) attached to this plan."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Plan lifecycle."
        constraints: "One of {ACTIVE, FORFEITED, FULFILLED, CANCELLED}."
      - name: forfeit_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Restocking fee withheld on forfeiture. See calc layaway_settlement."
      - name: refund_cents
        type: integer
        source: computed
        default: 0
        description: "Cash/credit returned on forfeiture or cancellation. See calc layaway_settlement."

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the requester."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the special-order Sku (may have on_hand 0)."
      - name: qty
        type: integer
        source: input
        description: Units to procure.
        constraints: ">= 1."
      - name: deposit_required_cents
        type: integer
        source: computed
        description: "Non-refundable deposit required to confirm. See calc special_order_deposit."
      - name: deposit_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Payment.amount_cents (status=CAPTURED) attached to this special order."
      - name: status
        type: enum
        source: computed
        default: QUOTED
        description: "Procurement lifecycle."
        constraints: "One of {QUOTED, CONFIRMED, ARRIVED, FULFILLED, CANCELLED}."

  - name: BuildJob
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who the build is for."
      - name: frame_sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the frame the build is based on (category must be BIKE)."
      - name: required_part_count
        type: integer
        source: input
        description: "Number of distinct part Reservations that must be ACTIVE before the build may start."
        constraints: ">= 1."
      - name: reserved_part_count
        type: integer
        source: computed
        default: 0
        description: "Count of ACTIVE Reservation rows with holder_type=BUILD_JOB and holder_id = this build. See calc build_readiness."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Build lifecycle (compound/guarded on parts readiness)."
        constraints: "One of {DRAFT, PARTS_RESERVED, ASSEMBLING, COMPLETED, CANCELLED}."
      - name: build_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Assembly labor fee, tiered on required_part_count. See calc build_fee."

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the claimant."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the defective product."
      - name: source_order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the DELIVERED purchase that establishes ownership and warranty start."
      - name: defect_part
        type: enum
        source: input
        description: "Which part is claimed defective."
        constraints: "One of {FRAME, COMPONENT}."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Claim lifecycle (branching: REPAIR / REPLACE / DENY)."
        constraints: "One of {SUBMITTED, UNDER_REVIEW, APPROVED_REPAIR, APPROVED_REPLACE, DENIED, RESOLVED}."
      - name: resolution_sku_id
        type: string
        source: input
        default: null
        description: "FK -> Sku.id; the replacement Sku chosen when status=APPROVED_REPLACE."

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who is trading in."
      - name: description
        type: string
        source: input
        description: Free-text description of the used bike.
      - name: condition_grade
        type: enum
        source: input
        description: "Inspected condition grade."
        constraints: "One of {A, B, C}."
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Base appraised resale value in cents, set at intake."
        constraints: ">= 0."
      - name: offer_cents
        type: integer
        source: computed
        default: 0
        description: "Trade-in offer after grade haircut. See calc tradein_offer."
      - name: apply_to
        type: enum
        source: input
        default: STORE_CREDIT
        description: "Where an accepted offer lands."
        constraints: "One of {STORE_CREDIT, CASH}."
      - name: status
        type: enum
        source: computed
        default: APPRAISED
        description: "Trade-in lifecycle."
        constraints: "One of {APPRAISED, ACCEPTED, REJECTED}."

  - name: RecallNotice
    parent: null
    common_fields: false
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the recalled product."
      - name: severity
        type: enum
        source: input
        description: "Recall severity."
        constraints: "One of {ADVISORY, MANDATORY}."
      - name: remedy
        type: string
        source: input
        description: Free-text remedy instructions.

  - name: RecallAck
    parent: null
    common_fields: false
    fields:
      - name: recall_id
        type: string
        source: input
        description: "FK -> RecallNotice.id; the acknowledged notice."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the acknowledging customer."

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: target_type
        type: enum
        source: input
        description: "Polymorphic payment target."
        constraints: "One of {SALES_ORDER, LAYAWAY_PLAN, SPECIAL_ORDER}."
      - name: target_id
        type: string
        source: input
        description: "Polymorphic target id (the SalesOrder / LayawayPlan / SpecialOrder named by target_type)."
      - name: amount_cents
        type: integer
        source: input
        description: Captured amount in cents.
        constraints: ">= 1."
      - name: status
        type: enum
        source: computed
        default: CAPTURED
        description: "Payment state (append-only ledger row)."
        constraints: "One of {CAPTURED, VOIDED}."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- ServiceTicket: CYCLIC (revision loop) + cross-entity guard on warranty ---
  - entity: ServiceTicket
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: AWAITING_APPROVAL
        trigger: "POST /shop/service-tickets/{id}/quote"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == INTAKE"
          - "TuneUpTier tier_id exists"
        side_effects:
          - "run calc ticket_quote: set labor_subtotal_cents, customer_owes_cents"
          - "run calc ticket_quote: set promised_ready_at = current_utc + effective turnaround"
          - "increment ServiceTicket.version by 1"
      - from: AWAITING_APPROVAL
        to: IN_PROGRESS
        trigger: "POST /shop/service-tickets/{id}/approve"
        actor: Customer
        preconditions:
          - "ticket.status == AWAITING_APPROVAL"
          - "acting Customer.id == ticket.customer_id OR ticket.warranty_claim_id is set"
        side_effects:
          - "increment ServiceTicket.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_APPROVAL
        trigger: "POST /shop/labor-lines (with added_after_approval becoming true)"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == IN_PROGRESS"
          - "ticket.warranty_claim_id is null (warranty repairs never bill the customer, so no re-approval cycle)"
        side_effects:
          - "set new LaborLine.added_after_approval = true"
          - "increment ServiceTicket.revision_count by 1"
          - "run calc ticket_quote: recompute labor_subtotal_cents, customer_owes_cents"
          - "increment ServiceTicket.version by 1"
        note: "CYCLE: IN_PROGRESS -> AWAITING_APPROVAL -> IN_PROGRESS may repeat; revision_count counts the loops."
      - from: IN_PROGRESS
        to: READY_FOR_PICKUP
        trigger: "POST /shop/service-tickets/{id}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == IN_PROGRESS"
        side_effects:
          - "increment ServiceTicket.version by 1"
      - from: READY_FOR_PICKUP
        to: CLOSED
        trigger: "POST /shop/service-tickets/{id}/close"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == READY_FOR_PICKUP"
          - "if ticket.warranty_claim_id is set, that WarrantyClaim.status == APPROVED_REPAIR"
        side_effects:
          - "if ticket.warranty_claim_id is set: transition that WarrantyClaim APPROVED_REPAIR -> RESOLVED (cross-entity)"
          - "increment ServiceTicket.version by 1"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /shop/service-tickets/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status IN {INTAKE, AWAITING_APPROVAL}"
        side_effects:
          - "increment ServiceTicket.version by 1"
      - from: AWAITING_APPROVAL
        to: CANCELLED
        trigger: "POST /shop/service-tickets/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status IN {INTAKE, AWAITING_APPROVAL}"
        side_effects:
          - "increment ServiceTicket.version by 1"

  # --- SalesOrder: PARALLEL dimensions (payment_status x fulfillment_status) ---
  - entity: SalesOrder
    initial_state: "PENDING|UNPAID"
    terminal_states: ["DELIVERED|PAID", "CANCELLED|REFUNDED", "CANCELLED|UNPAID"]
    transitions:
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /shop/sales-orders/{id}/reserve"
        actor: SalesAssociate
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "order has >= 1 OrderLine"
          - "for every OrderLine: Sku.on_hand - Sku.reserved >= qty (availability over the SUM of all lines for the same Sku)"
        side_effects:
          - "create one ACTIVE Reservation per OrderLine (holder_type=SALES_ORDER, holder_id=order.id)"
          - "run calc sku_available_units: increase each Sku.reserved by line qty"
          - "increment SalesOrder.version by 1"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=DELIVERED"
        trigger: "POST /shop/sales-orders/{id}/deliver"
        actor: SalesAssociate
        preconditions:
          - "order.fulfillment_status == RESERVED"
          - "order.payment_status == PAID (cannot hand over goods until fully paid)"
        side_effects:
          - "for each ACTIVE Reservation of this order: status ACTIVE -> COMMITTED"
          - "run calc sku_available_units: decrement Sku.on_hand AND Sku.reserved by committed qty (cross-entity ledger sync)"
          - "increment SalesOrder.version by 1"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /shop/sales-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "order.fulfillment_status IN {PENDING, RESERVED}"
        side_effects:
          - "for each ACTIVE Reservation of this order: status ACTIVE -> RELEASED"
          - "run calc sku_available_units: decrease Sku.reserved by released qty"
          - "if order.payment_status IN {PARTIALLY_PAID, PAID}: set payment_status=REFUNDED, void all CAPTURED Payments, restore consumed store_credit to Customer.store_credit_cents (compensation)"
          - "increment SalesOrder.version by 1"
      - from: "payment_status=UNPAID"
        to: "payment_status=PARTIALLY_PAID"
        trigger: "POST /shop/payments (target_type=SALES_ORDER, amount < total_due)"
        actor: SalesAssociate
        preconditions:
          - "order.fulfillment_status != CANCELLED"
          - "order.payment_status IN {UNPAID, PARTIALLY_PAID}"
        side_effects:
          - "create CAPTURED Payment; run calc order_total to refresh amount_paid_cents"
          - "increment SalesOrder.version by 1"
      - from: "payment_status=PARTIALLY_PAID"
        to: "payment_status=PAID"
        trigger: "POST /shop/payments (target_type=SALES_ORDER, cumulative paid >= total_due)"
        actor: SalesAssociate
        preconditions:
          - "order.fulfillment_status != CANCELLED"
          - "order.payment_status IN {UNPAID, PARTIALLY_PAID}"
        side_effects:
          - "create CAPTURED Payment; run calc order_total; set payment_status=PAID when amount_paid_cents >= total_due_cents"
          - "increment SalesOrder.version by 1"

  # --- WarrantyClaim: BRANCHING fork-join (REPAIR vs REPLACE vs DENY) ---
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /shop/warranty-claims/{id}/review"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "increment WarrantyClaim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED_REPAIR
        trigger: "POST /shop/warranty-claims/{id}/approve (resolution=REPAIR)"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "source OrderLine belongs to a SalesOrder with fulfillment_status=DELIVERED whose customer_id == claim.customer_id"
          - "if defect_part==FRAME: Sku.warranty_class==FRAME_AND_COMPONENT AND Sku.is_serialized==true"
          - "if defect_part==COMPONENT: Sku.warranty_class IN {COMPONENT, FRAME_AND_COMPONENT}"
        side_effects:
          - "increment WarrantyClaim.version by 1"
        note: "BRANCH A: a follow-on ServiceTicket with warranty_claim_id set executes the repair at zero customer cost."
      - from: UNDER_REVIEW
        to: APPROVED_REPLACE
        trigger: "POST /shop/warranty-claims/{id}/approve (resolution=REPLACE)"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "source OrderLine belongs to a SalesOrder with fulfillment_status=DELIVERED whose customer_id == claim.customer_id"
          - "resolution_sku_id provided; resolution Sku.on_hand - resolution Sku.reserved >= 1"
        side_effects:
          - "create one ACTIVE Reservation (holder_type=SALES_ORDER, holder_id=source order) for the resolution Sku qty 1"
          - "run calc sku_available_units: increase resolution Sku.reserved by 1 (cross-entity)"
          - "increment WarrantyClaim.version by 1"
        note: "BRANCH B: replacement unit is pulled from stock at zero customer cost."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /shop/warranty-claims/{id}/deny"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "increment WarrantyClaim.version by 1"
        note: "BRANCH C: terminal denial; no stock or ticket side effects."
      - from: APPROVED_REPLACE
        to: RESOLVED
        trigger: "POST /shop/warranty-claims/{id}/resolve"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == APPROVED_REPLACE"
        side_effects:
          - "commit the replacement Reservation: status ACTIVE -> COMMITTED"
          - "run calc sku_available_units: decrement resolution Sku.on_hand AND Sku.reserved by 1 (cross-entity ledger sync)"
          - "increment WarrantyClaim.version by 1"
      - from: APPROVED_REPAIR
        to: RESOLVED
        trigger: "system: triggered by the linked ServiceTicket close (READY_FOR_PICKUP -> CLOSED)"
        actor: system
        preconditions:
          - "claim.status == APPROVED_REPAIR"
          - "a ServiceTicket with warranty_claim_id == claim.id reaches CLOSED"
        side_effects:
          - "increment WarrantyClaim.version by 1"

  # --- BuildJob: COMPOUND / guarded on parts-reservation completeness ---
  - entity: BuildJob
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PARTS_RESERVED
        trigger: "POST /shop/build-jobs/{id}/mark-parts-reserved"
        actor: ServiceAdvisor
        preconditions:
          - "build.status == DRAFT"
          - "build.reserved_part_count >= build.required_part_count (compound: derived from child Reservation rows)"
          - "frame Sku reservation for this build is ACTIVE"
        side_effects:
          - "increment BuildJob.version by 1"
      - from: PARTS_RESERVED
        to: ASSEMBLING
        trigger: "POST /shop/build-jobs/{id}/start"
        actor: ServiceAdvisor
        preconditions:
          - "build.status == PARTS_RESERVED"
        side_effects:
          - "run calc build_fee: set build_fee_cents from required_part_count tier"
          - "increment BuildJob.version by 1"
      - from: ASSEMBLING
        to: COMPLETED
        trigger: "POST /shop/build-jobs/{id}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "build.status == ASSEMBLING"
        side_effects:
          - "for each ACTIVE Reservation of this build (frame + parts): status ACTIVE -> COMMITTED"
          - "run calc sku_available_units: decrement on_hand AND reserved by committed qty for each such Sku (cross-entity ledger sync)"
          - "increment BuildJob.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shop/build-jobs/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "build.status IN {DRAFT, PARTS_RESERVED, ASSEMBLING}"
        side_effects:
          - "for each ACTIVE Reservation of this build: status ACTIVE -> RELEASED"
          - "run calc sku_available_units: decrease each Sku.reserved by released qty (compensation)"
          - "increment BuildJob.version by 1"

  # --- SpecialOrder: linear-with-cancel, deposit-gated ---
  - entity: SpecialOrder
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /shop/special-orders/{id}/confirm"
        actor: SalesAssociate
        preconditions:
          - "special.status == QUOTED"
          - "special.deposit_paid_cents >= special.deposit_required_cents"
        side_effects:
          - "increment SpecialOrder.version by 1"
      - from: CONFIRMED
        to: ARRIVED
        trigger: "POST /shop/special-orders/{id}/receive"
        actor: SalesAssociate
        preconditions:
          - "special.status == CONFIRMED"
        side_effects:
          - "increase Sku.on_hand by special.qty (goods received into stock)"
          - "create one ACTIVE Reservation (holder_type=SPECIAL_ORDER, holder_id=special.id) for special.qty"
          - "run calc sku_available_units: increase Sku.reserved by special.qty (cross-entity)"
          - "increment SpecialOrder.version by 1"
      - from: ARRIVED
        to: FULFILLED
        trigger: "POST /shop/special-orders/{id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "special.status == ARRIVED"
        side_effects:
          - "commit the special-order Reservation: status ACTIVE -> COMMITTED"
          - "run calc sku_available_units: decrement Sku.on_hand AND Sku.reserved by special.qty (cross-entity ledger sync)"
          - "increment SpecialOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /shop/special-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "special.status IN {QUOTED, CONFIRMED}"
        side_effects:
          - "if status==CONFIRMED and a reservation exists, release it and decrease Sku.reserved"
          - "deposit_paid_cents is NOT refunded (deposit is non-refundable once confirmed); deposits on a QUOTED order are refunded by voiding Payments"
          - "increment SpecialOrder.version by 1"

  # --- LayawayPlan: deposit accrual then forfeit/fulfill/cancel ---
  - entity: LayawayPlan
    initial_state: ACTIVE
    terminal_states: [FORFEITED, FULFILLED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /shop/layaway-plans/{id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.deposit_cents >= plan.price_cents (fully paid off)"
        side_effects:
          - "commit the layaway Reservation: status ACTIVE -> COMMITTED"
          - "run calc sku_available_units: decrement Sku.on_hand AND Sku.reserved by plan.qty (cross-entity ledger sync)"
          - "increment LayawayPlan.version by 1"
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /shop/layaway-plans/{id}/forfeit"
        actor: ShopManager
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "release the layaway Reservation: status ACTIVE -> RELEASED; decrease Sku.reserved by plan.qty"
          - "run calc layaway_settlement: set forfeit_fee_cents and refund_cents; credit refund_cents to Customer.store_credit_cents (cross-entity)"
          - "increment LayawayPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /shop/layaway-plans/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "release the layaway Reservation: status ACTIVE -> RELEASED; decrease Sku.reserved by plan.qty"
          - "run calc layaway_settlement (cancel variant): full deposit refunded, forfeit_fee_cents=0; credit refund_cents to Customer.store_credit_cents"
          - "increment LayawayPlan.version by 1"

  # --- TradeIn: appraise then accept/reject ---
  - entity: TradeIn
    initial_state: APPRAISED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: APPRAISED
        to: ACCEPTED
        trigger: "POST /shop/trade-ins/{id}/accept"
        actor: ShopManager
        preconditions:
          - "tradein.status == APPRAISED"
        side_effects:
          - "run calc tradein_offer: set offer_cents from appraised_value_cents and condition_grade"
          - "if apply_to==STORE_CREDIT: credit offer_cents to Customer.store_credit_cents (cross-entity)"
          - "increment TradeIn.version by 1"
      - from: APPRAISED
        to: REJECTED
        trigger: "POST /shop/trade-ins/{id}/reject"
        actor: ShopManager
        preconditions:
          - "tradein.status == APPRAISED"
        side_effects:
          - "increment TradeIn.version by 1"

  # --- BayBooking: linear book -> release ---
  - entity: BayBooking
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /shop/bay-bookings/{id}/release"
        actor: ServiceAdvisor
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "increment BayBooking.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-reserve-stale-sku
    parent_entity: Sku
    write_endpoint: "POST /shop/sales-orders/{id}/reserve"
    occ_field: "expected_sku_version"
    description: |
      Reserving stock for a SalesOrder against a Sku whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another holder (a build, layaway, or a prior sales reserve) has
      already drawn down the same Sku's available units after the current
      writer read it, so the writer's view of availability is stale. The
      reserve endpoint records expected_sku_version against the order's single
      primary Sku and bumps Sku.version on success.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: layaway-open-stale-sku
    parent_entity: Sku
    write_endpoint: "POST /shop/layaway-plans"
    occ_field: "expected_sku_version"
    description: |
      Opening a LayawayPlan against a Sku whose version has advanced since the
      client last observed it is rejected. A LayawayPlan immediately reserves
      one unit of the Sku; if another reservation has drawn the pool down since
      the client read it, the open is based on a stale availability view and is
      refused. The open endpoint bumps Sku.version on success.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sku_available_units
    trigger: "On every Reservation status change (create ACTIVE, ACTIVE->COMMITTED, ACTIVE->RELEASED) and on Sku restock."
    algorithm: aggregation
    formula: |
      Sku.reserved = SUM(r.qty) for Reservation r WHERE r.sku_id == Sku.id AND r.status == 'ACTIVE'
      available     = Sku.on_hand - Sku.reserved
      # COMMIT: on_hand -= qty AND the committed row leaves the ACTIVE set, so reserved -= qty (net available unchanged at commit).
      # RELEASE: row leaves the ACTIVE set, so reserved -= qty (available rises).
    input_set: "Only Reservation rows with status == ACTIVE contribute to reserved; COMMITTED and RELEASED rows are excluded."
    constants: {}
    precision: "integer units, no rounding"

  - name: order_total
    trigger: "On OrderLine create, on POST /shop/sales-orders/{id}/reserve, on POST /shop/sales-orders/{id}/deliver, and on each Payment against the order."
    algorithm: aggregation
    formula: |
      subtotal_cents = SUM(line.qty * line.unit_price_cents) over OrderLine WHERE order_id == order.id
      # store_credit_applied_cents is set ONLY at delivery by calc apply_store_credit; before delivery it is 0.
      total_due_cents = subtotal_cents - store_credit_applied_cents
      amount_paid_cents = SUM(p.amount_cents) over Payment WHERE target_type=='SALES_ORDER' AND target_id==order.id AND status=='CAPTURED'
      payment_status = 'PAID' if amount_paid_cents >= total_due_cents AND amount_paid_cents > 0
                       else 'PARTIALLY_PAID' if 0 < amount_paid_cents < total_due_cents
                       else 'UNPAID'
    input_set: "OrderLines of this order for subtotal; CAPTURED Payments of this order for amount_paid_cents."
    constants: {}
    precision: "integer cents, no rounding"

  - name: ticket_quote
    trigger: "On POST /shop/service-tickets/{id}/quote, on each POST /shop/labor-lines for the ticket, and on the IN_PROGRESS->AWAITING_APPROVAL revision transition."
    algorithm: threshold
    formula: |
      effective_base = tier.base_labor_cents
      if ticket.is_rush:
        effective_base = round_half_up(tier.base_labor_cents * (10000 + tier.rush_multiplier_bps) / 10000)
      labor_subtotal_cents = effective_base + SUM(ll.labor_cents) over LaborLine WHERE ticket_id == ticket.id
      # turnaround: rush halves it, rounding UP to whole hours (ceil) so a 5h tier rushed = 3h, not 2h.
      effective_turnaround_h = tier.turnaround_hours
      if ticket.is_rush:
        effective_turnaround_h = ceil(tier.turnaround_hours / 2)
      promised_ready_at = current_utc + effective_turnaround_h hours
      customer_owes_cents = 0 if ticket.warranty_claim_id is not null else labor_subtotal_cents
    input_set: "The tier row referenced by tier_id plus every LaborLine on the ticket regardless of added_after_approval."
    constants: {}
    precision: "cents round_half_up for rush labor; hours ceil for rush turnaround"
    variants:
      - name: paid_work
        when: "ticket.warranty_claim_id is null"
        difference: "customer_owes_cents == labor_subtotal_cents (customer is billed)."
      - name: warranty_work
        when: "ticket.warranty_claim_id is set"
        difference: "customer_owes_cents == 0 (warranty work is not billed to the customer) even though labor_subtotal_cents is still computed."

  - name: layaway_settlement
    trigger: "On POST /shop/layaway-plans/{id}/forfeit and POST /shop/layaway-plans/{id}/cancel."
    algorithm: threshold
    formula: |
      # FORFEIT variant: shop keeps a restocking fee = max(FORFEIT_FLOOR_CENTS, ceil(price_cents * FORFEIT_PCT_BPS / 10000)),
      # capped at the deposit; the remainder is refunded.
      raw_fee = max(FORFEIT_FLOOR_CENTS, round_half_up(price_cents * FORFEIT_PCT_BPS / 10000))
      forfeit_fee_cents = min(raw_fee, deposit_cents)
      refund_cents = deposit_cents - forfeit_fee_cents
      # CANCEL variant: forfeit_fee_cents = 0; refund_cents = deposit_cents (full refund).
    input_set: "The plan's own price_cents and accrued deposit_cents."
    constants:
      FORFEIT_PCT_BPS: 1500
      FORFEIT_FLOOR_CENTS: 2000
    precision: "integer cents, round_half_up on the percentage term"
    variants:
      - name: forfeit
        when: "transition ACTIVE->FORFEITED"
        difference: "forfeit_fee_cents = min(max(FLOOR, round_half_up(price*15%)), deposit); refund = deposit - fee."
      - name: cancel
        when: "transition ACTIVE->CANCELLED"
        difference: "forfeit_fee_cents = 0; refund_cents = full deposit."

  - name: tradein_offer
    trigger: "On POST /shop/trade-ins/{id}/accept."
    algorithm: weighted_scoring
    formula: |
      # Grade haircut applied to appraised_value, then a flat handling deduction, floored at 0.
      haircut_bps = GRADE_A_BPS if grade=='A' else GRADE_B_BPS if grade=='B' else GRADE_C_BPS
      after_haircut = round_half_up(appraised_value_cents * haircut_bps / 10000)
      offer_cents = max(0, after_haircut - HANDLING_DEDUCTION_CENTS)
    input_set: "The trade-in's own appraised_value_cents and condition_grade."
    constants:
      GRADE_A_BPS: 8500
      GRADE_B_BPS: 7000
      GRADE_C_BPS: 5000
      HANDLING_DEDUCTION_CENTS: 1500
    precision: "integer cents, round_half_up on the haircut term, floor at 0"

  - name: build_fee
    trigger: "On POST /shop/build-jobs/{id}/start (PARTS_RESERVED->ASSEMBLING)."
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered assembly fee on required_part_count:
      #   parts 1..5    @ TIER1_PER_PART_CENTS each
      #   parts 6..10   @ TIER2_PER_PART_CENTS each
      #   parts 11+     @ TIER3_PER_PART_CENTS each
      # plus a flat base. Marginal (NOT average) rate: each band applies only to parts within it.
      n = required_part_count
      fee = BASE_FEE_CENTS
      fee += min(n, 5) * TIER1_PER_PART_CENTS
      if n > 5:  fee += (min(n, 10) - 5) * TIER2_PER_PART_CENTS
      if n > 10: fee += (n - 10) * TIER3_PER_PART_CENTS
      build_fee_cents = fee
    input_set: "The build's own required_part_count."
    constants:
      BASE_FEE_CENTS: 5000
      TIER1_PER_PART_CENTS: 1200
      TIER2_PER_PART_CENTS: 900
      TIER3_PER_PART_CENTS: 600
    precision: "integer cents, no rounding (all terms integral)"

  - name: special_order_deposit
    trigger: "On POST /shop/special-orders (create)."
    algorithm: threshold
    formula: |
      line_value = Sku.list_price_cents * qty
      # Deposit is 30% of line value, but a flat minimum applies, and the deposit is
      # capped so it never exceeds the line value itself.
      pct_term = round_half_up(line_value * DEPOSIT_PCT_BPS / 10000)
      deposit_required_cents = min(line_value, max(DEPOSIT_MIN_CENTS, pct_term))
    input_set: "The special order's Sku.list_price_cents (snapshot at create) and qty."
    constants:
      DEPOSIT_PCT_BPS: 3000
      DEPOSIT_MIN_CENTS: 5000
    precision: "integer cents, round_half_up on the percentage term"

  - name: apply_store_credit
    trigger: "On POST /shop/sales-orders/{id}/deliver, BEFORE the PAID precondition is re-evaluated."
    algorithm: waterfall_allocation
    formula: |
      # Store credit is applied at delivery as a single waterfall bucket against the order subtotal.
      store_credit_applied_cents = min(Customer.store_credit_cents, subtotal_cents)
      total_due_cents = subtotal_cents - store_credit_applied_cents
      # side effect: Customer.store_credit_cents -= store_credit_applied_cents
      # NOTE: this means a fully credit-covered order can reach total_due_cents == 0,
      # which counts as PAID only when amount_paid_cents (>=0) >= total_due_cents (==0).
    input_set: "Customer.store_credit_cents and the order's subtotal_cents at delivery time."
    constants: {}
    precision: "integer cents, no rounding"

  - name: customer_open_recall_count
    trigger: "On read of a Customer, and recomputed when a RecallNotice is created or a RecallAck is created."
    algorithm: aggregation
    formula: |
      purchased_skus = { ol.sku_id : OrderLine ol WHERE ol.order_id IN (SalesOrder with fulfillment_status=='DELIVERED' AND customer_id==Customer.id) }
      open = COUNT(distinct RecallNotice rn WHERE rn.sku_id IN purchased_skus
                   AND NOT EXISTS RecallAck ra WHERE ra.recall_id==rn.id AND ra.customer_id==Customer.id)
      open_recall_count = open
    input_set: "DELIVERED SalesOrders of this customer, their OrderLines' sku_ids, RecallNotices on those skus, and this customer's RecallAcks."
    constants: {}
    precision: "integer count, no rounding"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Customer actions on own resources, X-User-ID equals the resource's customer_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shop/service-tickets/{id}/approve"

  - priority: 4
    category: existence
    check: "Every path id and every FK in the body resolves to an existing resource (validated left-to-right)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed; enums in their declared domain; integers within declared ranges; email contains '@'."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "Customer email is unique (case-insensitive) on create."
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /shop/customers"

  - priority: 8
    category: business_referential
    check: "WarrantyClaim source_order_line_id belongs to a DELIVERED SalesOrder whose customer_id == claim.customer_id."
    error_id: ERR_NOT_PURCHASED
    http_status: 409
    applies_to: "POST /shop/warranty-claims, POST /shop/warranty-claims/{id}/approve"

  - priority: 9
    category: business_safety
    check: "WarrantyClaim with defect_part=FRAME requires source Sku.warranty_class=FRAME_AND_COMPONENT AND Sku.is_serialized=true; defect_part=COMPONENT requires warranty_class IN {COMPONENT, FRAME_AND_COMPONENT}."
    error_id: ERR_WARRANTY_NOT_COVERED
    http_status: 409
    applies_to: "POST /shop/warranty-claims/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "BuildJob frame_sku_id Sku.category == BIKE."
    error_id: ERR_FRAME_NOT_BIKE
    http_status: 409
    applies_to: "POST /shop/build-jobs"

  - priority: 11
    category: business_constraint
    check: "BuildJob may move DRAFT->PARTS_RESERVED only when reserved_part_count >= required_part_count and the frame reservation is ACTIVE."
    error_id: ERR_BUILD_NOT_READY
    http_status: 409
    applies_to: "POST /shop/build-jobs/{id}/mark-parts-reserved"

  - priority: 12
    category: business_temporal
    check: "Reservation/commit may proceed only if no MANDATORY RecallNotice exists on the Sku being reserved or committed."
    error_id: ERR_RECALL_BLOCK
    http_status: 409
    applies_to: "POST /shop/sales-orders/{id}/reserve, POST /shop/special-orders/{id}/receive, POST /shop/layaway-plans"

  - priority: 13
    category: business_fiscal
    check: "Reserving/committing requires available units (on_hand - reserved) >= requested qty, evaluated over the SUM of all lines for the same Sku within the request."
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /shop/sales-orders/{id}/reserve, POST /shop/layaway-plans, POST /shop/warranty-claims/{id}/approve"

  - priority: 14
    category: business_fiscal
    check: "SalesOrder may deliver only when payment_status == PAID."
    error_id: ERR_NOT_FULLY_PAID
    http_status: 409
    applies_to: "POST /shop/sales-orders/{id}/deliver"

  - priority: 15
    category: business_fiscal
    check: "SpecialOrder may confirm only when deposit_paid_cents >= deposit_required_cents."
    error_id: ERR_DEPOSIT_SHORT
    http_status: 409
    applies_to: "POST /shop/special-orders/{id}/confirm"

  - priority: 16
    category: business_fiscal
    check: "LayawayPlan may fulfill only when deposit_cents >= price_cents."
    error_id: ERR_LAYAWAY_NOT_PAID_OFF
    http_status: 409
    applies_to: "POST /shop/layaway-plans/{id}/fulfill"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_sku_version on a reserve/layaway-open call must equal the current Sku.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shop/sales-orders/{id}/reserve, POST /shop/layaway-plans"

  - priority: 18
    category: business_constraint
    check: "Payment against a target whose lifecycle no longer accepts payments (SALES_ORDER fulfillment CANCELLED/DELIVERED; LAYAWAY_PLAN not ACTIVE; SPECIAL_ORDER FULFILLED/CANCELLED) is rejected."
    error_id: ERR_TARGET_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /shop/payments"

  - priority: 19
    category: business_constraint
    check: "RecallAck duplicate: a customer may acknowledge a given RecallNotice at most once."
    error_id: ERR_ALREADY_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /shop/recall-acks"

  - priority: 20
    category: business_temporal
    check: "BayBooking end_at must be strictly after start_at; a new BOOKED interval must not overlap any existing BOOKED interval on the same bay. Intervals are HALF-OPEN [start_at, end_at): two bookings collide iff existing.start_at < new.end_at AND new.start_at < existing.end_at, so a booking starting exactly at another's end_at (touching, zero overlap) is ALLOWED."
    error_id: ERR_BAY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /shop/bay-bookings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/shop/customers"
    description: "Create a customer."
    roles: [SalesAssociate, ShopManager]
