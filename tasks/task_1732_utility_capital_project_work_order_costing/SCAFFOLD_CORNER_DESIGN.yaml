            - { call: "POST /ucp/work-orders/${wa}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wa}", pledged_cents: 50000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ca: $.data.id } }
            - { call: "POST /ucp/ciac-agreements/${ca}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Cancel late", initial_estimated_cost_cents: 400000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wb: $.data.id } }
            - { call: "POST /ucp/work-orders/${wb}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wb_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wb}" }, as: Auditor, captures: { estb: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${estb}/approve", payload: { expected_work_order_version: "${wb_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wb}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
