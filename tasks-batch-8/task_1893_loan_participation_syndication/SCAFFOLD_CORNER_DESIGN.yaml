            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-09-01", accrual_end_date: "2026-10-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "first draw created (201); second with the same (now stale) version: error_id == ERR_STALE_VERSION, HTTP 412"

      - name: occ_distribution_rerun_stale_payment_version_rejected
        claim_type: occ_stale_conflict
        grounds: ['concurrency_rules[distribution-rerun-stale-payment]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "Re-running the waterfall with the pre-run payment version (which run creation bumped) -> 412; the same call with the fresh version succeeds and supersedes."
        test_recipe:
          setup: ["funded facility; payment 50,000 value 2026-08-31 with run1 already created (payment version advanced)"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "OCC2 B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac OCC2", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "OP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v1: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v1}" }, as: AgentBank, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v1}" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION, HTTP 412 (payment version advanced when run1 was created)"

      - name: derived_field_reconciliation_on_cure
        claim_type: derived_field_reconciliation
        grounds: [calculations.default_interest_re_rate, entities.Facility.fields.accrued_interest_cents]
        distinguishing_aspect: "CURE (not waive) keeps the addon for the default window only: 13,333 (base 8/1-8/11) + 22,222 (base+800bps 8/11-8/21) + 13,333 (base 8/21-8/31) == 48,888 materialized on the next run."
        test_recipe:
          setup: ["facility 10,000,000 (P1 6M / P2 3M / P3 1M funded); draw 4,000,000 SETTLED 2026-08-01; default declared 2026-08-11, cured 2026-08-21; payment 60,000 value 2026-08-31"]
          setup_api_calls:
