              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-22T09:59:59Z" }
              as: OpsAdmin
            - call: "POST /idr-submissions"
              payload: { claim_id: "${claim_m_id}", open_negotiation_id: "${on_m_id}", payer_offer_cents: 30000, provider_offer_cents: 50000 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
