  - rule_id: compensating_invariant
    instances:
      - name: consignment_credit_reversal_conserves_invoice_credits
        grounds:
          - invariants[INV_CONSIGNMENT_CREDIT_CONSERVATION]
          - state_machines.ConsignmentLot.status.SOLD_to_SETTLED
          - state_machines.ConsignmentLot.status.SETTLED_to_RETURNED
          - calculations.consignment_credit_amount
          - calculations.invoice_total_and_balance
          - entities.Invoice.fields.credits_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY, specifically Invoice.credits_cents: the
          forward settle posts a CONSIGNMENT_CREDIT line of minus 138900 and the
          compensating return posts a CONSIGNMENT_REVERSAL line of plus 138900, so
          credits_cents returns to exactly 0 and total_cents to exactly its pre-settle
          value while two ledger rows remain on the invoice.
