          trigger:
            - call: "GET /audit/clients/9d1f4a02-7c3b-4e55-8a10-6f2b9d4c7e31"
              payload: {}
              as: Anonymous
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response is rejected with error_id ERR_MISSING_AUTH_HEADERS at http 401"
            - "the error is not ERR_CLIENT_NOT_FOUND even though the path id does not exist"
            - "supplying only X-User-Role without X-User-ID is rejected the same way"

