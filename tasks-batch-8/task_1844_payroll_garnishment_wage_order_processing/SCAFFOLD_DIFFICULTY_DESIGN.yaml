  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_balance_conservation_under_withhold_and_refund
        grounds:
          - entities.GarnishmentOrder.fields.remaining_balance_cents
          - entities.WithholdingEvent.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = order balance ledger: for every GarnishmentOrder,
          total_balance_cents == withheld_cents - refunded_cents +
          remaining_balance_cents must hold after ANY sequence of pay and
          refund actions; here a 50000-balance order is paid (withhold 50000,
          remaining 0, SATISFIED) then refunded 20000 (remaining 20000) and the
          identity holds exactly at both checkpoints.
        test_recipe:
          setup:
            - "Employer, CA employee, one ACTIVE CHILD_SUPPORT LUMP_SUM_BALANCE order with total_balance 50000"
            - "Run pays: LUMP award = min(50000, cap 65% of DE, pool, balance) = 50000 -> SATISFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
