  - rule_id: boundary_precision_check
    instances:
      - name: referral_lag_inclusive_at_window_and_one_minute_past
        grounds:
          - calculations.referral_timeliness_lag
          - entities.DeathReferral.fields.timeliness_flag
          - endpoints[POST /opo/death-referrals]
        distinguishing_aspect: |
          Numeric-threshold boundary on the referral_lag_minutes metric at POST /opo/death-referrals:
          a lag of exactly 60 against a 60-minute window is TIMELY (the comparison is <=), and a lag of
          61 is UNTIMELY, so the pass/fail edge sits between two adjacent integers.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-19T11:00:00Z."
            - "One HospitalPartner with timely_referral_window_minutes 60 and no referrals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8301", age_years: 50, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-19T10:00:00Z" }
              as: ReferralCoordinator
              captures: { ref_at_id: $.data.id, lag_at: $.data.referral_lag_minutes, flag_at: $.data.timeliness_flag }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8302", age_years: 50, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-19T09:59:00Z" }
              as: ReferralCoordinator
              captures: { ref_past_id: $.data.id, lag_past: $.data.referral_lag_minutes, flag_past: $.data.timeliness_flag }
          assert:
            - "${lag_at} == 60 and ${flag_at} == TIMELY"
            - "${lag_past} == 61 and ${flag_past} == UNTIMELY"
            - "DeathReferral.${ref_at_id}.audit_lag_minutes == null (death_pronounced_at was omitted)"
            - "HospitalPartner.${hosp_id}.referral_count == 2, timely_referral_count == 1, untimely_referral_count == 1"
            - "HospitalPartner.${hosp_id}.timely_referral_rate == 50.00"
            - "HospitalPartner.${hosp_id}.partner_posture == GOOD_STANDING (referral_count 2 is below MIN_POSTURE_SAMPLE 4)"

      - name: offer_expiry_inclusive_and_empty_candidate_pool_exhausts_run
        grounds:
          - calculations.offer_promotion_selector
          - state_machines.OrganOffer.PENDING_to_EXPIRED
          - state_machines.MatchRun.OPEN_to_EXHAUSTED
          - endpoints[POST /opo/match-runs/{id}/advance]
        distinguishing_aspect: |
          A different metric (the acceptance clock, expires_at versus clock_now) on a different endpoint
          (POST /opo/match-runs/{id}/advance): the clock is set to exactly expires_at and the
          offer is swept because the comparison is clock_now >= expires_at, which then produces the
          zero-count edge - the candidate pool is empty and pending_offer_count is 0, so the run
          EXHAUSTS, the organ walks back OFFERING -> ALLOCATABLE and slots_free returns to the full 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T09:00:00Z, then advanced to exactly 2026-08-20T10:00:00Z."
            - "An AUTHORIZED DonorCase with one ALLOCATABLE LIVER organ and a match run holding exactly one candidate with acceptance_clock_minutes 60 and primary_offer_slots 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8401", age_years: 38, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-20T08:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["BLOOD_TRANSFUSION_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-8401" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-8401" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v: $.data.version }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v}", primary_offer_slots: 2, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 60 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id, pending_at_create: $.data.pending_offer_count, free_at_create: $.data.slots_free }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer_id: "$.data[0].id", offer_expires: "$.data[0].expires_at", offer_state: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T10:00:00Z" }
              as: OpoAdmin
          trigger:
            - call: "POST /opo/match-runs/${run_id}/advance"
              payload: {}
              as: AllocationSpecialist
              captures: { run_state: $.data.status, run_reason: $.data.closed_reason, pending_after: $.data.pending_offer_count, free_after: $.data.slots_free }
          assert:
            - "${pending_at_create} == 1 and ${free_at_create} == 1 and ${offer_state} == PENDING"
            - "${offer_expires} == 2026-08-20T10:00:00Z, exactly equal to the logical clock at the trigger"
            - "OrganOffer.${offer_id}.status == EXPIRED (the sweep is inclusive at equality)"
            - "${run_state} == EXHAUSTED and ${run_reason} == CANDIDATES_EXHAUSTED"
            - "${pending_after} == 0 and ${free_after} == 2, so pending_offer_count + slots_free == primary_offer_slots"
            - "Organ.${organ_id}.status == ALLOCATABLE and DonorCase.${case_id}.allocation_status == MATCH_RUN_OPEN"

      - name: performance_zero_ventilated_denominator_yields_null_rate
        grounds:
          - calculations.hospital_timeliness_posture
          - endpoints[GET /opo/hospital-partners/{id}/performance]
        distinguishing_aspect: |
          The empty/zero-count edge on a third metric and a third endpoint: the windowed_recert
          denominator counts only ventilated referrals, so a hospital with a single non-ventilated
          referral has eligible_referral_count 0 and must report timely_referral_rate null with
          recertification_tier INSUFFICIENT_DATA rather than 0.00 with FAIL.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-21T11:00:00Z."
            - "One HospitalPartner with exactly one non-ventilated referral inside the reporting window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Harborview", hospital_code: "HARBOR", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8501", age_years: 70, ventilated: false, gcs_score: 8, cause_of_death_category: "OTHER", trigger_event_at: "2026-08-21T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /opo/hospital-partners/${hosp_id}/performance"
              payload: { window_days: 365, basis: "CLINICAL_TRIGGER" }
              as: OpoAdmin
              captures: { eligible: $.data.eligible_referral_count, rate: $.data.timely_referral_rate, conv: $.data.conversion_rate, opd: $.data.organs_per_donor, tier: $.data.recertification_tier }
          assert:
            - "${eligible} == 0"
            - "${rate} == null (not 0.00)"
            - "${conv} == null and ${opd} == null"
            - "${tier} == INSUFFICIENT_DATA (not FAIL)"
            - "DeathReferral.${ref_id}.timeliness_flag == TIMELY and HospitalPartner.${hosp_id}.timely_referral_rate == 100.00, so the lifetime metric is unaffected by the empty windowed denominator"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: donor_case_creation_gated_by_authorization_state
        grounds:
