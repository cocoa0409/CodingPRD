  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_disbursement_conserves_cents
        grounds:
          - calculations.disbursement_proration
          - entities.DisbursementLine.fields.amount_cents
          - entities.DisbursementRun.fields.total_disbursed_cents
        distinguishing_aspect: "Conserved quantity = disbursable cents: for each processed client, sum(DisbursementLine.amount_cents) == deposit.amount_cents - Agency.monthly_fee_cents exactly; no cent is created or lost across the Hamilton split + overflow re-flow. Run-level total_disbursed_cents == sum of all lines."
        test_recipe:
          setup:
            - "ACTIVE client A(prop=30000),B(prop=15000),C(prop=10000); deposit 58500; monthly_fee 3500 -> disbursable 55000."
