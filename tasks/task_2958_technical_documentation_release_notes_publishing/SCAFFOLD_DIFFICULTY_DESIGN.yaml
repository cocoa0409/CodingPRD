              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${load_b} == 51.00"
            - "${ratio_restricted} == 0.50 and ${posture_restricted} == RESTRICTED (exactly on RESTRICTED_FLOOR, which is inclusive)"
            - "${b_review_state} == PENDING_SIGNOFF — a CRITICAL item passes the RESTRICTED gate"
            - "after the revision on topic A, ReleaseTrain.${rt_id}.approved_topic_ratio == 0.00 and doc_readiness_posture == FROZEN, and DocPlanItem.${pi_a}.status == IN_AUTHORING"
            - "${err} == ERR_DOC_FREEZE_POSTURE_BLOCKED with HTTP 409 — the identical call that succeeded for topic B now fails for topic A because a THIRD entity changed"
            - "Topic.${t_a}.review_state is still NOT_SUBMITTED and last_submitted_revision_number is still 1"
            - "Topic.${t_b}.review_state is still PENDING_SIGNOFF (unaffected)"
            - "ReleaseTrain.${rt_id}.status == DOC_FREEZE throughout"

