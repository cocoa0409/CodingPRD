      - name: employer_money_ledger_survives_invoice_issue_and_void
        grounds:
          - calculations.employer_invoice_totals
          - state_machines.EmployerInvoice.DRAFT_to_ISSUED
          - state_machines.EmployerInvoice.ISSUED_to_VOID
          - entities.UsageLedgerEntry.fields.cents_delta
          - entities.Employer.fields.ytd_billed_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY IN CENTS: the append-only sum of
          UsageLedgerEntry.cents_delta (52000) is unchanged by invoicing, issuing and voiding, while
          the derived aggregates that hang off it — Employer.ytd_billed_cents and the invoice totals
          — move 0 -> 79748 -> 0 and every voided reservation returns to ACCRUED so re-invoicing the
          identical period reproduces total_cents 79748 exactly. Different conserved quantity from
          entitlement days in entitlement_days_reconcile_to_ledger_after_release_and_cancel.
        test_recipe:
