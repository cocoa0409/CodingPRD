              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { r3: $.data.round_index }
            - call: "POST /demands/${dm_a}/settle"
              payload: { settlement_reference: "SET-2026-YSP02-0001" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { st: $.data.status, tot: $.data.settlement_total_cents, rc: $.data.round_count }
            - call: "POST /claims/${cl_id}/close"
              payload: {}
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { e_open: $.data.error_id }
          assert:
            - "${r1} == 1 with ${o1} == OPEN, and ${g1} == 1300000 == 1,800,000 - 500,000 with ${o1b} == COUNTERED"
            - "${e_flat} == ERR_OFFER_NOT_MONOTONIC with HTTP 422 — repeating 500,000 is not a STRICT increase over the standing offer"
            - "${e_over} == ERR_OFFER_EXCEEDS_DEMAND with HTTP 422 — 2,500,000 is a legal increase but exceeds demand_amount_cents 2,000,000, and the two priority-61 clauses are reported by distinct error ids"
            - "${r2} == 2 and ${o2} == OPEN, and GET /demands/${dm_a}/negotiation-rounds shows round 1 flipped to SUPERSEDED"
            - "${e_up} == ERR_COUNTER_NOT_MONOTONIC with HTTP 422 — 1,900,000 exceeds the claimant's own previous position of 1,800,000; claimant positions may not increase"
            - "${e_flat_counter} == ERR_COUNTER_NOT_MONOTONIC with HTTP 422 — a counter equal to the standing offer of 900,000 is not a STRICT exceedance"
            - "${g2} == 900000 and ${cc2} == 1800000 — a counter EQUAL to the previous counter is accepted, so the bound is <= and not <"
            - "${r3} == 3 — an offer exactly EQUAL to demand_amount_cents is accepted, so that bound is <= and not <"
            - "${st} == SETTLED with ${tot} == 2160000 == 2,000,000 + round_half_up(2,000,000 * 0.08) and ${rc} == 3"
            - "${e_open} == ERR_OPEN_DEMANDS_REMAIN with HTTP 409 — Demand B is still DEMANDED, and GET /claims/${cl_id} still reports handling_status NEGOTIATION, not CLOSED"

      - name: boundary_inputs_that_exactly_satisfy_their_bounds_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=5]
          - validations[priority=43]
          - validations[priority=51]
          - response_envelope.pagination
        distinguishing_aspect: "Every bound in the ladder is inclusive on the legal side: occurred_at exactly equal to current_utc, limit 100 and 1, offset 0, at_fault_percentage 1 and 100 are all accepted, and a statement_waiver_reason satisfies the driver-statement precondition without a statement."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal and one Driver only — no crash yet, so the crash is created inside the trigger at the exact clock instant."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Zanesville East Terminal", terminal_code: "ZAN03", region_code: "OH", annual_miles_millions: 1.0 }
