              as_user_id: "investor-delta"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_one_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_one_v}" }
              as: CDESponsor
