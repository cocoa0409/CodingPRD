  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: ccl_occ_version_increments_on_write
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Appointment.fields.version"
          - "concurrency_rules[redo-schedule-stale-appointment]"
        distinguishing_aspect: "An Appointment's version starts at 1 on create and increments by 1 on each mutation (deposit -> version increases), so the OCC observed-version chain is monotone."
        test_recipe:
          setup: ["A BOOKED appointment freshly created (version 1) then deposited."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
