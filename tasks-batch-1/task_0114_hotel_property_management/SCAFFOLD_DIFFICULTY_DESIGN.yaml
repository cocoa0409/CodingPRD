              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${q_id}", rate_plan_id: "${grp_plan_id}", arrival_date: "2026-07-10", departure_date: "2026-07-11", group_block_id: "${block_id}", expected_group_block_version: "${block_v}" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res_id}" }
              as: FrontDeskAgent
              captures: { folio_id: "$.data[0].id"}
            - call: "POST /pms/reservations/${res_id}/confirm"
