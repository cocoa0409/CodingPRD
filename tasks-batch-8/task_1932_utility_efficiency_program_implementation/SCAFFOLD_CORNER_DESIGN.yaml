              as: ProgramManager
              captures: { proj2_id: $.data.id }
          trigger:
            - call: "POST /efficiency/projects/${proj2_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_PROGRAM_VERSION (prog_v0 is stale because approve #1 bumped program.version)"

