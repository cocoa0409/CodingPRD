            - "EscrowLedgerEntry.${entF}.status == REFUNDED (cascade link 3)"
            - "Contingency.${f0}.status == EXPIRED (cure window lapsed at clock 2026-08-08, six days after objection on 2026-08-02)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_escrow_release
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ESCROW_NOT_CLEARED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: releasing an escrow entry
          that is simultaneously (i) on an offer whose closing statement is
          NOT APPROVED (state precondition of the CLEARED->DISBURSED
          transition) and (ii) not CLEARED (business_fiscal rule) must return
          the state error ERR_INVALID_STATE because priority 5 < 17.
        test_recipe:
          setup:
            - "Offer ACCEPTED; DEPOSIT entry PENDING (never cleared); closing statement DRAFT (not APPROVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
