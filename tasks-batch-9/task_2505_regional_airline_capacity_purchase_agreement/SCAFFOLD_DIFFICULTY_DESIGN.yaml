              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-7002", seat: "CAPTAIN", hire_class_date: "2026-04-01" }
              as: RegionalOpsController
              captures: { p2: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N701RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N702RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac2: $.data.id }
            - call: "POST /cpa/aircraft/${ac2}/induct"
