        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order
          (distinct from modes (a) and (b)): each policy's allocation depends on
          the pot, the pot depends on retained claims, retained claims depend on
          the reinsurance share, and the share was set by the treaty — the run
