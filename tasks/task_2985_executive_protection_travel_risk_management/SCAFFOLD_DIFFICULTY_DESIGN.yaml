          trigger:
            - call: "POST /exec-protection/vendors/${vendor_id}/suspend"
              payload: { suspension_reason: "licence lapsed in country" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { act_status: $.data.activation_status, hours_after: $.data.committed_engagement_hours }
            - call: "GET /exec-protection/vendor-engagements/${eng1}"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { eng1_status_after: $.data.status, eng1_cost_after: $.data.engagement_cost_cents, eng1_reason: $.data.cancelled_reason }
            - call: "GET /exec-protection/vendor-engagements/${eng2}"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { eng2_status_final: $.data.status, eng2_cost_final: $.data.engagement_cost_cents }
          assert:
            - "the ledger walk before the trigger is exactly 0 -> 4 -> 10 -> 4: committed_engagement_hours == 0 at vendor creation, 4 after E1 (engagement_hours == 4, engagement_cost_cents == 90000), 10 after E2 (engagement_hours == 6, engagement_cost_cents == 110000), and 4 again after E2 is COMPLETED"
            - "completing E2 did NOT change its engagement_cost_cents: it is 110000 before and after the complete call, and E2.status == COMPLETED"
            - "the suspend returns HTTP 200 with activation_status == SUSPENDED and suspension_reason == 'licence lapsed in country'"
            - "after the suspend the hours ledger is restored exactly: Vendor.committed_engagement_hours == 0, which is the value it held before ANY engagement existed — not 6, not -6, and not 4"
            - "cascade CH-A hop 2 cancelled only the ACTIVE row: E1.status == CANCELLED with engagement_cost_cents == 0 and cancelled_reason == 'VENDOR_SUSPENDED'"
            - "E2 was left untouched by the compensation: status still COMPLETED, engagement_cost_cents still 110000, cancelled_reason still null — its hours had already been debited by its own completion, so debiting them again would have driven the ledger negative"
            - "TripLeg.${leg_id}.completed_advance_items is unchanged and advance_complete is unchanged: cascade CH-A hop 3 applies only to LOCAL_LIAISON engagements and both engagements here are GROUND_SECURITY"
            - "GET /exec-protection/vendor-engagements?vendor_id=${vendor_id}&status=ACTIVE returns total_count == 0 after the suspend, and the unfiltered list still returns total_count == 2 — the compensation cancels rows, it does not delete them"
