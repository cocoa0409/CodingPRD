          assert: ["err == ERR_INVALID_REQUEST (400): 2026-08-05T11:00:00Z is beyond deadline+24h (2026-08-05T10:00:00Z)"]

      - name: extend_deadline_after_expiry_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DECISION_DEADLINE_PASSED]"]
        distinguishing_aspect: "Extension after the deadline has passed is a temporal failure even while the exception is still OPEN (sweep not yet run)."
        test_recipe:
