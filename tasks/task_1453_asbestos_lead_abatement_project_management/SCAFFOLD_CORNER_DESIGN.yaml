# =============================================================================
# Task 1453: §1.9 Scaffold Corner Design (Coverage Index for non-difficulty
# claims). Complements SCAFFOLD_DIFFICULTY_DESIGN.yaml; instance names are
# unique across both files.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_project_missing_required_name_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Project.fields.name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting the required input field `name` yields ERR_VALIDATION (400); no Project row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /abatement/projects", payload: { site_address: "1 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION, http 400"

      - name: create_project_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Project.fields.work_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "work_type outside {RENOVATION, DEMOLITION} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /abatement/projects", payload: { name: "P-X", site_address: "1 Elm St", work_type: "GUTTING", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION, http 400"

      - name: project_defaults_and_initial_state
        claim_type: defaults
        grounds:
          - "entities.Project.fields.status"
          - "entities.Project.fields.reoccupancy_status"
          - "state_machines.Project"
        distinguishing_aspect: "A freshly created project starts DRAFT with reoccupancy_status BLOCKED, all computed money/weight fields 0, and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /abatement/projects", payload: { name: "P-DEF", site_address: "2 Elm St", work_type: "DEMOLITION", hazard_class: "MIXED", planned_start: "2026-09-01T00:00:00Z", base_abatement_cost_cents: 25000 }, as: ContractorAdmin, captures: { st: "$.data.status", reoc: "$.data.reoccupancy_status", mw: "$.data.manifested_weight_lbs", est: "$.data.estimated_disposal_cost_cents", ver: "$.data.version" } }
          assert:
            - "status == DRAFT; reoccupancy_status == BLOCKED"
            - "manifested_weight_lbs == 0; estimated_disposal_cost_cents == 0; total_project_cost_cents == 0"
            - "version == 1; id is a bare UUID; created_at == 2026-08-01T00:00:00.000Z (logical clock default)"

      - name: get_project_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_PROJECT_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /abatement/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_NOT_FOUND, http 404"

      - name: not_found_sweep_reads
        claim_type: not_found
        grounds:
          - "errors[ERR_WORKER_NOT_FOUND]"
          - "errors[ERR_SURVEY_NOT_FOUND]"
          - "errors[ERR_FACILITY_NOT_FOUND]"
          - "errors[ERR_UNIT_NOT_FOUND]"
        distinguishing_aspect: "Each single-resource GET returns its entity-specific 404 error id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /abatement/workers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "GET /abatement/surveys/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { e2: "$.data.error_id" } }
            - { call: "GET /abatement/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { e3: "$.data.error_id" } }
            - { call: "GET /abatement/relocation-units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { e4: "$.data.error_id" } }
          assert:
            - "e1 == ERR_WORKER_NOT_FOUND; e2 == ERR_SURVEY_NOT_FOUND; e3 == ERR_FACILITY_NOT_FOUND; e4 == ERR_UNIT_NOT_FOUND (all http 404)"

      - name: not_found_sweep_actions
        claim_type: not_found
        grounds:
          - "errors[ERR_SAMPLE_NOT_FOUND]"
          - "errors[ERR_ASSIGNMENT_NOT_FOUND]"
          - "errors[ERR_NOTIFICATION_NOT_FOUND]"
          - "errors[ERR_CONTAINMENT_NOT_FOUND]"
          - "errors[ERR_AIR_TEST_NOT_FOUND]"
          - "errors[ERR_MANIFEST_NOT_FOUND]"
          - "errors[ERR_RELOCATION_NOT_FOUND]"
        distinguishing_aspect: "Action endpoints validate path-id existence before any state or business check and return the entity-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /abatement/samples/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/result", payload: { lab_result: "NEGATIVE" }, as: IndustrialHygienist, as_user_id: "ih_1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /abatement/assignments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cancel", payload: {}, as: ContractorAdmin, captures: { e2: "$.data.error_id" } }
            - { call: "POST /abatement/notifications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1", captures: { e3: "$.data.error_id" } }
            - { call: "POST /abatement/containments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/verify", payload: { pressure_reading_inwg: -0.03 }, as: Supervisor, as_user_id: "sup_x", captures: { e4: "$.data.error_id" } }
            - { call: "POST /abatement/air-tests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/result", payload: { result_f_cc: 0.005 }, as: IndustrialHygienist, as_user_id: "ih_1", captures: { e5: "$.data.error_id" } }
            - { call: "POST /abatement/manifests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/seal", payload: {}, as: Supervisor, as_user_id: "sup_x", captures: { e6: "$.data.error_id" } }
            - { call: "POST /abatement/relocations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/return", payload: {}, as: ContractorAdmin, captures: { e7: "$.data.error_id" } }
          assert:
            - "e1 == ERR_SAMPLE_NOT_FOUND; e2 == ERR_ASSIGNMENT_NOT_FOUND; e3 == ERR_NOTIFICATION_NOT_FOUND; e4 == ERR_CONTAINMENT_NOT_FOUND; e5 == ERR_AIR_TEST_NOT_FOUND; e6 == ERR_MANIFEST_NOT_FOUND; e7 == ERR_RELOCATION_NOT_FOUND (all http 404)"

      - name: create_assignment_with_unknown_worker_returns_404
        claim_type: parent_relationships
        grounds:
          - "entities.CrewAssignment.fields.worker_id"
          - "errors[ERR_WORKER_NOT_FOUND]"
        distinguishing_aspect: "A body-referenced FK that does not resolve yields ERR_WORKER_NOT_FOUND (existence priority 4 fires before state priority 6, so the DRAFT project's state gate is never reached)."
        test_recipe:
          setup: ["Project P exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-FK", site_address: "3 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", role_on_site: "HANDLER", start_at: "2026-08-11T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_WORKER_NOT_FOUND, http 404 (existence beats the ASSESSED-only state gate)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sample_result_before_lab_submit_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Sample.PENDING_to_REPORTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A sample result is only recordable while the parent survey is IN_LAB; while the survey is DRAFT the call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P; Survey S (DRAFT) with one Sample A (PENDING); S NOT submitted"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM1", site_address: "4 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: sample_create_on_in_lab_survey_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Survey.DRAFT_to_IN_LAB"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Samples can only be added while the survey is DRAFT; after submit the survey is locked and POST /abatement/samples fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P; Survey S with one sample; S submitted (IN_LAB)"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM2", site_address: "5 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
          trigger:
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "floor tile", location_desc: "kitchen", quantity_sq_ft: 50, friable: false }, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: finalize_survey_with_pending_samples_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Survey.IN_LAB_to_FINALIZED"
          - "errors[ERR_SAMPLES_STILL_PENDING]"
        distinguishing_aspect: "Finalize requires every sample REPORTED; with one PENDING sample the call fails with ERR_SAMPLES_STILL_PENDING."
        test_recipe:
          setup: ["Project P; Survey S IN_LAB with Sample A REPORTED (NEGATIVE) and Sample B still PENDING"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM3", site_address: "6 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "floor tile", location_desc: "kitchen", quantity_sq_ft: 50, friable: false }, as: ContractorAdmin }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "NEGATIVE" }, as: IndustrialHygienist, as_user_id: "ih_1" }
          trigger:
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SAMPLES_STILL_PENDING, http 409"
            - "Survey.${s_id}.status remains IN_LAB"

      - name: resubmit_finalized_survey_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Survey"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "FINALIZED is terminal: submit on a finalized survey fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P; Survey S finalized (single POSITIVE sample); project auto-transitioned to ASSESSED"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM4", site_address: "7 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
          trigger:
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: acknowledge_already_acknowledged_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.RegulatoryNotification.FILED_to_ACKNOWLEDGED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Acknowledge is not idempotent: the second acknowledge on an ACKNOWLEDGED notification fails with ERR_INVALID_STATE and does not move acknowledged_at."
        test_recipe:
          setup: ["Project P ASSESSED; notification N filed and acknowledged at default clock"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM5", site_address: "8 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "INITIAL", declared_acm_sq_ft: 100, expected_project_version: "${p_v}" }, as: ContractorAdmin, captures: { n_id: "$.data.id" } }
            - { call: "POST /abatement/notifications/${n_id}/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1", captures: { ack1: "$.data.acknowledged_at" } }
          trigger:
            - { call: "POST /abatement/notifications/${n_id}/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1", captures: { err: "$.data.error_id" } }
          assert:
            - "second acknowledge -> error_id == ERR_INVALID_STATE, http 409"
            - "first acknowledged_at == 2026-08-01T00:00:00Z (default logical clock at filing/ack)"

      - name: verify_designed_containment_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Containment.INSTALLED_to_VERIFIED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Verify is only valid from INSTALLED or RECLEAN_REQUIRED; from DESIGNED it fails with ERR_INVALID_STATE regardless of pressure reading."
        test_recipe:
          setup: ["Project P ASSESSED; Containment C created (DESIGNED)"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM6", site_address: "9 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/containments/${c_id}/verify", payload: { pressure_reading_inwg: -0.03 }, as: Supervisor, as_user_id: "${w_sup}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409; Containment.${c_id}.status remains DESIGNED"

      - name: complete_work_before_start_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Project.IN_PROGRESS_to_AWAITING_CLEARANCE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "complete-work requires IN_PROGRESS; from ASSESSED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P ASSESSED (survey finalized); supervisor worker exists"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-SM7", site_address: "10 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/projects/${p_id}/complete-work", payload: {}, as: Supervisor, as_user_id: "${w_sup}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"

      - name: closed_project_locks_all_actions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Project"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal: after a fully-cleared project closes, every further action (here: suspend) fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
