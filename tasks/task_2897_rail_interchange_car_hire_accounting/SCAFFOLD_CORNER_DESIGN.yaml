        distinguishing_aspect: "Priority 30 forbids instants AFTER now, not instants AT now: an interchange_at equal to the logical clock to the millisecond is accepted and closes the segment with end_at == now, and an odometer reading equal to the previous event's (a car moved with no mileage) is likewise accepted because priority 32 requires only non-decreasing miles."
