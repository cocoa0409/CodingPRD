scenario: "Photo Booth Rental: booth type & package (hours/prints), event-date availability, deposit & balance, add-on (props/backdrop/attendant/album), delivery/setup/teardown window, travel fee, idle-hour & overtime, digital gallery"
domain_name: photo-booth-rental
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (BoothModel, Package, Booth, Attendant, Customer, Booking, AddOn,
  # Payment, EventLog, Gallery) linked by FK references in request bodies, not by
  # nested ownership URLs. Booking is the hub; everything else references it or is
  # referenced by it. Junctions (BookingAddOn, AttendantAssignment) realise the
  # many-to-many edges.

  state_machine_shape: parallel
  # Booking carries two independent state dimensions on the same row:
  #   schedule_status (DRAFT -> CONFIRMED -> IN_SERVICE -> COMPLETED, with CANCELLED branch)
  #   payment_status  (UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL, with REFUNDED/FORFEITED branches)
  # Gallery has its own cyclic publish/unpublish loop. The Booth/Attendant resources
  # gate Booking confirmation by their own availability.

  relationship_patterns:
    - one_to_many        # Package -> Booking, Customer -> Booking, Booking -> Payment, Booking -> Gallery
    - many_to_many       # Booking <-> AddOn (via BookingAddOn); Attendant <-> Booking (via AttendantAssignment)
    - cross_aggregate    # Booking confirmation depends on Booth + Attendant availability

  role_model: peer_roles
  # Customer owns its own bookings; OperationsManager owns booth/attendant inventory
  # and runs the event lifecycle; FinanceClerk owns settlement/refund money movements.
  # PlatformAdmin seeds the catalog and drives the test clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: BoothModel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the booth model (e.g. 'Open-Air Mirror')"
      - name: booth_type
        type: enum
        source: input
        description: "Physical form factor"
        constraints: "one of {OPEN_AIR, ENCLOSED, MIRROR, ROAMING_360}"
      - name: footprint_sqft
        type: integer
        source: input
        description: "Floor space the model needs on site; used by capacity checks"
        constraints: ">= 1"
      - name: max_prints_per_hour
        type: integer
        source: input
        description: "Printer throughput ceiling; bounds a package's print plan"
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: "Whether new packages/booths may reference this model"
        default: true

  - name: Package
    parent: null
    common_fields: true
    fields:
      - name: booth_model_id
        type: string
        source: input
        description: "FK -> BoothModel.id; the model this package is sold on"
      - name: name
        type: string
        source: input
        description: "Marketing name of the package (e.g. 'Premium 4hr')"
      - name: base_price
        type: number
        source: input
        description: "Flat price covering included_hours and included_prints, in dollars"
        constraints: ">= 0, 2 decimal places"
      - name: included_hours
        type: integer
        source: input
        description: "Hours of live coverage included in base_price"
        constraints: ">= 1"
      - name: included_prints
        type: integer
        source: input
        description: "Print copies included in base_price"
        constraints: ">= 0"
      - name: overtime_rate_per_hour
        type: number
        source: input
        description: "Dollars per whole hour of coverage beyond included_hours"
        constraints: ">= 0, 2 decimal places"
      - name: idle_rate_per_hour
        type: number
        source: input
        description: "Dollars per whole idle hour (booth set up and staffed but not running)"
        constraints: ">= 0, 2 decimal places"
      - name: overage_print_rate
        type: number
        source: input
        description: "Dollars per print beyond included_prints, settled from actual counts"
        constraints: ">= 0, 2 decimal places"
      - name: active
        type: boolean
        source: input
        description: "Whether new bookings may select this package"
        default: true

  - name: Booth
    parent: null
    common_fields: true
    fields:
      - name: booth_model_id
        type: string
        source: input
        description: "FK -> BoothModel.id; the physical unit's model"
      - name: asset_tag
        type: string
        source: input
        description: "Operator-assigned inventory tag, unique among Booths"
        constraints: "unique"
      - name: status
        type: enum
        source: input
        description: "Inventory availability of the physical unit"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE, RETIRED}"

  - name: Attendant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Attendant's name"
      - name: status
        type: enum
        source: input
        description: "Staffing availability of the attendant"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_LEAVE, INACTIVE}"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email, unique among Customers"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Customer's name"
      - name: home_zip
        type: string
        source: input
        description: "Customer's billing ZIP; informational only"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the booking owner"
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; pricing plan selected at booking time"
      - name: booth_id
        type: string
        source: computed
        description: "FK -> Booth.id; physical unit assigned at confirmation by the selector; null while DRAFT"
      - name: event_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of live coverage requested by the customer"
      - name: event_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of live coverage; must be strictly after event_start"
      - name: venue_distance_miles
        type: integer
        source: input
        description: "One-way road miles from the operator depot to the venue; drives travel_fee"
        constraints: ">= 0"
      - name: requested_setup_lead_min
        type: integer
        source: input
        description: "Minutes before event_start the customer wants the booth running and staffed (drives planned idle)"
        default: 0
        constraints: ">= 0"
      - name: schedule_status
        type: enum
        source: computed
        description: "Lifecycle dimension of the event itself"
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, IN_SERVICE, COMPLETED, CANCELLED}"
      - name: payment_status
        type: enum
        source: computed
        description: "Settlement dimension, evolves independently of schedule_status"
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED, FORFEITED}"
      - name: quote_subtotal
        type: number
        source: computed
        description: "Forward-looking estimate (calc estimate_quote) using BOOKED hours; refreshed on confirm"
      - name: deposit_due
        type: number
        source: computed
        description: "round(quote_subtotal * DEPOSIT_PCT, 2); set at confirmation"
      - name: balance_due
        type: number
        source: computed
        description: "Outstanding amount owed: settlement basis minus payments_applied; recomputed on each money event"
      - name: travel_fee
        type: number
        source: computed
        description: "Computed by calc travel_fee from venue_distance_miles; part of the subtotal"
      - name: final_subtotal
        type: number
        source: computed
        description: "Chronological actual settlement (calc final_settlement); null until EventLog finalised"
      - name: amount_paid
        type: number
        source: computed
        description: "Sum of applied non-refund Payment.amount (DEPOSIT + BALANCE) less FORFEITED writebacks"
        default: 0
      - name: amount_refunded
        type: number
        source: computed
        description: "Sum of applied REFUND Payment.amount"
        default: 0

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Catalog code of the add-on"
        constraints: "one of {PROPS, BACKDROP, ATTENDANT, ALBUM}"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: unit_price
        type: number
        source: input
        description: "Price per unit, in dollars"
        constraints: ">= 0, 2 decimal places"
      - name: requires_attendant
        type: boolean
        source: input
        description: "True for the ATTENDANT add-on: selecting it forces an AttendantAssignment at confirmation"
        default: false
      - name: max_qty
        type: integer
        source: input
        description: "Maximum quantity orderable per booking"
        default: 1
        constraints: ">= 1"

  - name: BookingAddOn
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this line belongs to"
      - name: add_on_id
        type: string
        source: input
        description: "FK -> AddOn.id; the catalog item ordered"
      - name: qty
        type: integer
        source: input
        description: "Units ordered; must be 1..AddOn.max_qty"
        constraints: ">= 1"
      - name: line_total
        type: number
        source: computed
        description: "round(AddOn.unit_price * qty, 2) frozen at the time the line is added"

  - name: AttendantAssignment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the staffed booking"
      - name: attendant_id
        type: string
        source: computed
        description: "FK -> Attendant.id; chosen by the attendant selector at confirmation"
      - name: occupied_start
        type: datetime
        source: computed
        description: "event_start - setup window; the attendant's claimed interval start"
      - name: occupied_end
        type: datetime
        source: computed
        description: "event_end + teardown window; the attendant's claimed interval end"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the staffing claim"
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this money event belongs to"
      - name: kind
        type: enum
        source: input
        description: "Money movement type"
        constraints: "one of {DEPOSIT, BALANCE, REFUND}"
      - name: amount
        type: number
        source: input
        description: "Dollar amount of this event; always positive (REFUND amount is the positive refunded value)"
        constraints: "> 0, 2 decimal places"

  - name: EventLog
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; one EventLog per booking, created at IN_SERVICE start"
      - name: actual_setup_start
        type: datetime
        source: input
        description: "ISO 8601 UTC time the crew actually began setup on site"
      - name: actual_coverage_start
        type: datetime
        source: input
        description: "ISO 8601 UTC time the booth actually started running for guests"
      - name: actual_coverage_end
        type: datetime
        source: input
        description: "ISO 8601 UTC time the booth actually stopped running"
      - name: actual_teardown_end
        type: datetime
        source: input
        description: "ISO 8601 UTC time the crew actually finished teardown"
      - name: actual_print_count
        type: integer
        source: input
        description: "Prints physically produced on site; drives overage settlement"
        constraints: ">= 0"
      - name: finalized
        type: boolean
        source: computed
        description: "True once the EventLog is closed and final_settlement has run"
        default: false

  - name: Gallery
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose photos this gallery holds"
      - name: photo_count
        type: integer
        source: input
        description: "Number of digital images uploaded to the gallery"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Publish state; toggles in a cycle"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, UNPUBLISHED}"
      - name: access_pin
        type: string
        source: system
        description: "Server-minted 6-digit share PIN, regenerated on each (re)publish"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Booking: schedule dimension ----
  - entity: Booking
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: OperationsManager
        preconditions:
          - "Booking.schedule_status == DRAFT"
          - "Booking.payment_status == DEPOSIT_PAID (deposit recorded before confirmation)"
          - "Package referenced by package_id has active == true"
          - "at least one Booth of the package's booth_model_id has status == AVAILABLE and no booth-interval conflict (see validations p=42, calc booth_selector)"
          - "if any BookingAddOn line maps to an AddOn with requires_attendant == true, at least one Attendant with status == AVAILABLE has no attendant-interval conflict (calc attendant_selector)"
        side_effects:
          - "run calc booth_selector; set Booking.booth_id to the chosen Booth.id"
          - "if a requires_attendant add-on is present, run calc attendant_selector and create one AttendantAssignment(status=ACTIVE) with occupied_start/occupied_end stamped from the setup/teardown window"
          - "recompute Booking.quote_subtotal via calc estimate_quote and set Booking.deposit_due, Booking.balance_due = quote_subtotal - amount_paid"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: IN_SERVICE
        trigger: "POST /bookings/{id}/start-service"
        actor: OperationsManager
        preconditions:
          - "Booking.schedule_status == CONFIRMED"
          - "no EventLog exists yet for this booking"
        side_effects:
          - "create one EventLog(finalized=false) for the booking"
          - "increments Booking.version by 1"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: OperationsManager
        preconditions:
          - "Booking.schedule_status == IN_SERVICE"
          - "the booking's EventLog has finalized == true (actuals submitted)"
          - "Booking.payment_status == PAID_IN_FULL"
        side_effects:
          - "release the AttendantAssignment (status ACTIVE -> RELEASED) freeing the attendant interval"
          - "create the booking's Gallery(status=DRAFT, photo_count=0) if none exists"
          - "increments Booking.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "Booking.schedule_status == DRAFT"
        side_effects:
          - "run calc cancellation_refund (no booth/attendant held yet, refundable = full amount_paid); if amount_paid > 0 the FinanceClerk must still issue the REFUND payment, else payment_status -> REFUNDED immediately when amount_paid == 0"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "Booking.schedule_status == CONFIRMED"
        side_effects:
          - "release the held Booth (clear the booth-interval claim) and, if present, RELEASE the AttendantAssignment"
          - "that release frees the attendant interval, which in turn lifts the attendant-conflict gate that had been blocking any overlapping DRAFT booking from confirming on that attendant"
          - "run calc cancellation_refund to set the refundable amount; payment_status -> REFUNDED if the tier refunds the deposit in full and a REFUND payment clears it, else FORFEITED when the tier refunds 0"
          - "increments Booking.version by 1"

  # ---- Booking: payment dimension (parallel to schedule dimension) ----
  - entity: Booking
    initial_state: UNPAID
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /bookings/{id}/payments (kind=DEPOSIT)"
        actor: FinanceClerk
        preconditions:
          - "Booking.payment_status == UNPAID"
          - "Booking.schedule_status == DRAFT"
          - "payment amount == Booking.deposit_due (deposit must be paid in full, not partially)"
        side_effects:
          - "append Payment(kind=DEPOSIT); increase Booking.amount_paid by amount"
          - "recompute Booking.balance_due"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /bookings/{id}/payments (kind=BALANCE)"
        actor: FinanceClerk
        preconditions:
          - "Booking.payment_status == DEPOSIT_PAID"
          - "Booking.schedule_status IN {CONFIRMED, IN_SERVICE}"
          - "the booking's EventLog is finalized == true so balance_due reflects the final settlement"
          - "payment amount == Booking.balance_due (must clear the outstanding balance exactly)"
        side_effects:
          - "append Payment(kind=BALANCE); increase Booking.amount_paid by amount; set Booking.balance_due = 0"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "POST /bookings/{id}/payments (kind=REFUND)"
        actor: FinanceClerk
        preconditions:
          - "Booking.schedule_status == CANCELLED"
          - "Booking.payment_status == DEPOSIT_PAID"
          - "calc cancellation_refund returned refundable_amount > 0"
          - "payment amount == calc cancellation_refund.refundable_amount"
        side_effects:
          - "append Payment(kind=REFUND); increase Booking.amount_refunded by amount"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: FORFEITED
        trigger: "POST /bookings/{id}/forfeit"
        actor: FinanceClerk
        preconditions:
          - "Booking.schedule_status == CANCELLED"
          - "Booking.payment_status == DEPOSIT_PAID"
          - "calc cancellation_refund returned refundable_amount == 0 (inside-30-day tier)"
        side_effects:
          - "no money returned; deposit is retained by the operator"
          - "increments Booking.version by 1"

  # ---- Gallery: cyclic publish/unpublish ----
  - entity: Gallery
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /galleries/{id}/publish"
        actor: OperationsManager
        preconditions:
          - "Gallery.status == DRAFT"
          - "Gallery.photo_count >= 1"
          - "the parent Booking.schedule_status == COMPLETED"
          - "the parent Booking.payment_status == PAID_IN_FULL"
        side_effects:
          - "mint a fresh 6-digit Gallery.access_pin"
          - "increments Gallery.version by 1"
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /galleries/{id}/unpublish"
        actor: OperationsManager
        preconditions:
          - "Gallery.status == PUBLISHED"
        side_effects:
          - "invalidate Gallery.access_pin (set to null)"
          - "increments Gallery.version by 1"
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /galleries/{id}/publish"
        actor: OperationsManager
        preconditions:
          - "Gallery.status == UNPUBLISHED"
          - "Gallery.photo_count >= 1"
          - "the parent Booking.payment_status == PAID_IN_FULL"
        side_effects:
          - "mint a fresh 6-digit Gallery.access_pin (different lifecycle pin per publish)"
          - "increments Gallery.version by 1"

  # ---- EventLog: actuals capture, single finalize edge ----
  - entity: EventLog
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /event-logs/{id}/finalize"
        actor: OperationsManager
        preconditions:
          - "EventLog.finalized == false"
          - "all four actual_* timestamps and actual_print_count are present"
          - "actual_setup_start <= actual_coverage_start < actual_coverage_end <= actual_teardown_end"
          - "the parent Booking.schedule_status == IN_SERVICE"
        side_effects:
          - "set EventLog.finalized = true"
          - "run calc final_settlement against the actuals; set Booking.final_subtotal, recompute Booking.balance_due = final_subtotal - amount_paid"
          - "that balance_due change re-opens the BALANCE payment gate, and clearing that balance (PAID_IN_FULL) is itself the precondition that later unblocks the IN_SERVICE -> COMPLETED transition"
          - "increments EventLog.version and Booking.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-booth-claim
    parent_entity: Booth
    write_endpoint: "POST /bookings/{id}/confirm"
    occ_field: "expected_booth_version"
    description: |
      Confirming a DRAFT booking pins a specific candidate Booth and stamps an
      interval claim on it. If that Booth's version has advanced since the client
      last read it — because another confirmation legitimately claimed an
      overlapping interval on the same unit and bumped its version — the confirm is
      rejected as stale. The loser re-reads the Booth, observes the new claim, and
      either picks another unit or another time. Resolved purely as a stale-version
      check on the parent Booth, triggerable by two strictly sequential confirms.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: finalize-stale-eventlog
    parent_entity: EventLog
    write_endpoint: "POST /event-logs/{id}/finalize"
    occ_field: "expected_eventlog_version"
    description: |
      Finalizing an EventLog whose version has advanced since the client last
      observed it — because an actuals correction was applied in between, bumping
      the EventLog version — is rejected as stale. The settlement math depends on
      the exact actuals, so a finalize carried out against an outdated view of the
      EventLog would settle the wrong number. Resolved as a stale-version check on
      the parent EventLog, triggerable by two strictly sequential calls.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: travel_fee
    trigger: "on Booking create (DRAFT quote) and refreshed on confirm; part of estimate_quote and final_settlement"
    algorithm: threshold
    formula: |
      billable_miles = max(0, venue_distance_miles - TRAVEL_FREE_RADIUS_MILES)
      raw = TRAVEL_RATE_PER_MILE * billable_miles            # one-way, NOT round-trip
      travel_fee = round(raw, 2)        # round_half_up to 2 dp
    input_set: "Single Booking's venue_distance_miles; no cross-entity aggregation"
    constants:
      TRAVEL_FREE_RADIUS_MILES: 25
      TRAVEL_RATE_PER_MILE: 1.50
    precision: "2 decimal places, round_half_up"

  - name: estimate_quote
    trigger: "on Booking create and on POST /bookings/{id}/confirm (forward-looking estimate)"
    algorithm: forward_looking
    formula: |
      # BOOKED hours come from the customer's requested event window.
      coverage_hours    = ceil((event_end - event_start) in hours)     # whole-hour billing
      overtime_hours    = max(0, coverage_hours - Package.included_hours)
      overtime_charge   = min(Package.overtime_rate_per_hour * overtime_hours, OVERTIME_DAILY_CAP)
      planned_idle_hours = ceil(requested_setup_lead_min / 60)         # whole idle hours, ceil
      idle_charge       = Package.idle_rate_per_hour * planned_idle_hours
      addon_total       = sum over BookingAddOn lines of line_total    # each line_total already round(unit_price*qty,2)
      travel            = travel_fee(venue_distance_miles)
      # Pinned evaluation order: per-line add-on rounding happens when the line is
      # created (line_total frozen), THEN the already-rounded line_totals are summed
      # (round-per-line-then-sum). overtime/idle/travel are summed at full precision.
      quote_subtotal    = round(Package.base_price + overtime_charge + idle_charge + addon_total + travel, 2)
    input_set: "The single Booking, its Package, and its current ACTIVE BookingAddOn lines (status not applicable; all lines count). Print overage is NOT included in the quote (actual prints unknown until the event)."
    constants:
      OVERTIME_DAILY_CAP: 750.00
    precision: "2 decimal places, round_half_up; add-on lines rounded per-line BEFORE summation"
    variants:
      - name: quote_estimate
        when: "at booking/confirmation, before the event happens"
        difference: "uses BOOKED coverage_hours from the requested window and requested_setup_lead_min for idle; excludes print overage entirely"

  - name: final_settlement
    trigger: "on POST /event-logs/{id}/finalize (chronological actual settlement)"
    algorithm: chronological
    formula: |
      # ACTUAL hours come from the logged on-site timestamps, processed in time order.
      actual_coverage_hours = (actual_coverage_end - actual_coverage_start) in hours   # exact
      overtime_hours   = max(0, ceil(actual_coverage_hours - Package.included_hours))
      overtime_charge  = min(Package.overtime_rate_per_hour * overtime_hours, OVERTIME_DAILY_CAP)
      actual_idle_min  = (actual_coverage_start - actual_setup_start) in minutes        # gap before guests
      idle_hours       = ceil(actual_idle_min / 60)
      idle_charge      = Package.idle_rate_per_hour * idle_hours
      overage_prints   = max(0, EventLog.actual_print_count - Package.included_prints)
      print_overage    = round(Package.overage_print_rate * overage_prints, 2)
      addon_total      = sum of frozen BookingAddOn.line_total
      travel           = travel_fee(venue_distance_miles)
      final_subtotal   = round(Package.base_price + overtime_charge + idle_charge + addon_total + travel + print_overage, 2)
    input_set: "The single Booking, its Package, its FINALIZED EventLog actuals, and its frozen BookingAddOn lines"
    constants:
      OVERTIME_DAILY_CAP: 750.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final_actual
        when: "at EventLog finalize, after the event happened"
        difference: "uses ACTUAL coverage/idle hours from logged timestamps AND adds print overage from actual_print_count — produces a different number than quote_estimate for the same Booking"

  - name: cancellation_refund
    trigger: "on POST /bookings/{id}/cancel (computes refundable_amount used by REFUND/forfeit gates)"
    algorithm: tiered_pricing
    formula: |
      days_to_event = floor((event_start - now) in days)    # whole days from clock to event_start
      if days_to_event >= 60:      deposit_refund_pct = 1.00
      elif days_to_event >= 30:    deposit_refund_pct = 0.50
      else:                        deposit_refund_pct = 0.00
      refundable_deposit = round(Booking.deposit_due * deposit_refund_pct, 2)
      refundable_balance = (amount_paid - deposit_due) if amount_paid > deposit_due else 0   # any balance beyond deposit is always 100% refundable
      refundable_amount  = round(refundable_deposit + refundable_balance, 2)
    input_set: "The single Booking's deposit_due, amount_paid, event_start, and the current clock (POST /_clock/set_current_utc)"
    constants:
      TIER_FULL_DAYS: 60
      TIER_HALF_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: outside_60
        when: "cancel >= 60 days before event_start"
        difference: "deposit fully refundable"
      - name: window_30_59
        when: "cancel 30..59 days before event_start"
        difference: "deposit 50% refundable"
      - name: inside_30
        when: "cancel < 30 days before event_start"
        difference: "deposit forfeited (0% refundable)"

  - name: booth_selector
    trigger: "on POST /bookings/{id}/confirm to choose the physical Booth"
    algorithm: aggregation
    formula: |
      candidates = Booths where booth_model_id == Booking.Package.booth_model_id
                          AND status == 'AVAILABLE'
                          AND no booth-interval conflict with this booking (see validations p=42)
      # rank: fewest existing ACTIVE interval claims first (load balancing),
      #       tie-break by Booth.created_at ASC (never by id)
      chosen = sort(candidates, key=(active_claim_count ASC, created_at ASC))[0]
      if candidates is empty: raise ERR_NO_BOOTH_AVAILABLE
    input_set: "Booths of the matching model with status AVAILABLE; their existing booth-interval claims from CONFIRMED/IN_SERVICE bookings"
    constants: {}
    precision: "exact (integer counts); deterministic ordering, created_at tie-break"

  - name: attendant_selector
    trigger: "on POST /bookings/{id}/confirm when a requires_attendant add-on is present"
    algorithm: aggregation
    formula: |
      candidates = Attendants where status == 'AVAILABLE'
                          AND no attendant-interval conflict with this booking's setup..teardown window (see validations p=44)
      # rank: fewest ACTIVE AttendantAssignments first, tie-break by Attendant.created_at ASC (never by id)
      chosen = sort(candidates, key=(active_assignment_count ASC, created_at ASC))[0]
      if candidates is empty: raise ERR_NO_ATTENDANT_AVAILABLE
    input_set: "Attendants with status AVAILABLE; their ACTIVE AttendantAssignment intervals"
    constants: {}
    precision: "exact; deterministic ordering, created_at tie-break"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers and GET /_clock"

  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for Customer-owned actions (cancel, read own booking), X-User-ID equals the Booking.customer_id"
    error_id: ERR_NOT_BOOKING_OWNER
    http_status: 403
    applies_to: "POST /bookings/{id}/cancel, GET /bookings/{id} when acting as Customer"

  - priority: 10
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} or FK body fields"

  - priority: 20
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, numeric ranges respected, event_end strictly after event_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 21
    category: business_constraint
    check: "Booth.asset_tag is unique; Customer.email is unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /booths, POST /customers"

  - priority: 22
    category: business_constraint
    check: "BookingAddOn.qty is within 1..AddOn.max_qty"
    error_id: ERR_QTY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /bookings/{id}/add-ons"

  - priority: 30
    category: state
    check: "the target entity is in the correct state for the requested transition (schedule_status / payment_status / Gallery.status / EventLog.finalized as the relevant transition requires)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (confirm, start-service, complete, cancel, forfeit, publish, unpublish, finalize, payments)"

  - priority: 31
    category: state
    check: "add-on lines may only be added while Booking.schedule_status == DRAFT"
    error_id: ERR_BOOKING_LOCKED
    http_status: 409
    applies_to: "POST /bookings/{id}/add-ons"

  - priority: 40
    category: business_constraint
    check: "OCC: expected_booth_version matches the chosen Booth.version (confirm) / expected_eventlog_version matches EventLog.version (finalize)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/confirm, POST /event-logs/{id}/finalize"

  - priority: 42
    category: business_temporal
    check: "BOOTH overlap: the booking's booth-occupied interval [event_start - SETUP_BUFFER_MIN, event_end + TEARDOWN_BUFFER_MIN + TURNAROUND_BUFFER_MIN) must not overlap any existing booth-interval claim on the selected Booth. Half-open: a new claim starting exactly at an existing claim's end edge is allowed (adjacency at the buffer edge OK); any earlier start conflicts."
    error_id: ERR_BOOTH_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 43
    category: business_constraint
    check: "no AVAILABLE Booth of the package's model survives the overlap filter"
    error_id: ERR_NO_BOOTH_AVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 44
    category: business_temporal
    check: "ATTENDANT overlap: when an attendant is required, the booking's staffing interval [event_start - SETUP_BUFFER_MIN, event_end + TEARDOWN_BUFFER_MIN] must not overlap any ACTIVE AttendantAssignment interval of the candidate attendant. Closed interval, NO turnaround buffer: two events touching exactly at the boundary minute conflict (the attendant cannot be in two places at the same edge)."
    error_id: ERR_ATTENDANT_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 45
    category: business_constraint
    check: "no AVAILABLE Attendant survives the overlap filter when an attendant is required"
    error_id: ERR_NO_ATTENDANT_AVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 50
    category: business_fiscal
    check: "DEPOSIT payment amount equals Booking.deposit_due exactly"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/payments (kind=DEPOSIT)"

  - priority: 51
    category: business_fiscal
    check: "BALANCE payment amount equals Booking.balance_due exactly (which reflects the FINAL settlement once the EventLog is finalized)"
    error_id: ERR_BALANCE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/payments (kind=BALANCE)"

  - priority: 52
    category: business_fiscal
    check: "REFUND payment amount equals calc cancellation_refund.refundable_amount exactly"
    error_id: ERR_REFUND_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/payments (kind=REFUND)"

  - priority: 60
    category: business_constraint
    check: "Gallery.photo_count must be >= 1 before publish"
    error_id: ERR_GALLERY_EMPTY
    http_status: 409
    applies_to: "POST /galleries/{id}/publish"

