          setup:
            - "Fleet cap 300000, mtd adjusted to 200000 (GOLD). S2 job invoiced at 200995 but NOT yet issued. Second fleet call TRIAGED with a PROPOSED dispatch to a second technician. Third fleet call sitting in RECEIVED."
