  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: failing_survey_cascades_five_levels_to_external_followup
        grounds:
          - state_machines.PhysicistSurvey.status.DRAFT_to_FAILED_ACTION_REQUIRED
          - state_machines.MammographyUnit.accreditation_status.PROVISIONAL_to_PROBATION
          - state_machines.MammographyUnit.operational_state.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.Facility.compliance_posture.CONDITIONAL_to_SUSPENDED
          - state_machines.SupplementalScreeningOrder.status.RECOMMENDED_to_REFERRED_OUT
          - state_machines.Exam.follow_up_status.PENDING_to_PENDING_EXTERNAL
          - calculations.survey_pass_determination
          - calculations.facility_compliance_posture
        distinguishing_aspect: |
          DEPTH 5 cascade triggered by POST /physicist-surveys/{id}/submit, where
          each link is caused strictly by the previous one: the failing decision
          sets survey_compliance FAILED (L1), which is the declared precondition
          for accreditation_status -> PROBATION and, because the deficiency codes
          are non-empty, operational_state -> OUT_OF_SERVICE (L2); those unit
          field changes are what force the posture recompute to SUSPENDED (L3);
          the posture becoming SUSPENDED is what refers the open supplemental
          order out (L4); and the order becoming REFERRED_OUT is what moves the
          exam's follow_up_status PENDING -> PENDING_EXTERNAL (L5).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one IN_SERVICE PROVISIONAL DBT_3D unit, qualified staff."
            - "One SCREENING exam interpreted BI-RADS 0 with density C, so follow_up_status is PENDING."
            - "One ULTRASOUND supplemental order on that exam still in status RECOMMENDED."
            - "One DRAFT ANNUAL PhysicistSurvey on the unit with window [2026-07-01, 2027-07-01) authored by the facility's medical physicist."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
