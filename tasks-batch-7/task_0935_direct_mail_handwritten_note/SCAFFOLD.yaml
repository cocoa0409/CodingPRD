scenario: "935. Direct-Mail & Handwritten-Note Fulfillment: campaign & template/handwriting-style, mailing-list import & CASS/dedupe, print/robot-write & envelope, postage & bulk (EDDM) rate, scheduling & drip, address-verification & return-handling, proof & approval, reporting"
domain_name: direct-mail-handwritten-note-fulfillment
api_prefix: "/mail"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: beyond_expert
  notes: |
    Two mail paths (ADDRESSED and EDDM) share one production pipeline. Recipient-level
    rules (CASS, dedupe, NCOA, returns, reprints) are structurally inapplicable to EDDM
    jobs; the ladder decides per rung whether the rung is skipped or fires
    ERR_EDDM_NOT_APPLICABLE. A campaign-level write gate (compliance hold / billing
    close) pre-empts a large set of otherwise-valid rungs across many endpoints.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants (every named constant referenced anywhere in this scaffold
# has a concrete value here; units and boundary inclusivity are stated).
# ---------------------------------------------------------------------------
global_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"          # logical-clock value at server start, before any POST /_clock/set_current_utc

  # --- CASS / DPV -> deliverability tier -----------------------------------
  DPV_TIER_MAP_Y: "AUTOMATION"                        # dpv_confirmation_code == "Y"
  DPV_TIER_MAP_D: "RETAIL"                            # "D" = primary confirmed, secondary missing
  DPV_TIER_MAP_S: "RETAIL"                            # "S" = secondary present but invalid
  DPV_TIER_MAP_N: "UNMAILABLE"                        # "N" = not confirmed
  DPV_TIER_MAP_U: "UNMAILABLE"                        # "U" = unconfirmed / not run
  DOMESTIC_COUNTRY_CODE: "US"                         # country_code != "US" forces UNMAILABLE regardless of dpv code

  # --- Presort tier thresholds (unit: AUTOMATION-tier pieces on the job) ----
  # Boundary semantics: each MIN is INCLUSIVE (>=). Tiers are evaluated
  # highest-first; the first tier whose MIN is satisfied wins.
  PRESORT_5D_MIN_PIECES: 12
  PRESORT_AADC_MIN_PIECES: 9
  PRESORT_MIXED_AADC_MIN_PIECES: 6
  # automation_piece_count < PRESORT_MIXED_AADC_MIN_PIECES -> NO_PRESORT

  # --- Per-piece rates, unit: cents per piece, one decimal place -----------
  PRESORT_5D_RATE_CENTS: 23.9
  PRESORT_AADC_RATE_CENTS: 28.1
  PRESORT_MIXED_AADC_RATE_CENTS: 31.8
  MARKETING_NO_PRESORT_RATE_CENTS: 51.0               # AUTOMATION-tier pieces when the job misses every presort tier
  MARKETING_RETAIL_TIER_RATE_CENTS: 51.6              # RETAIL-tier pieces, MARKETING_MAIL class
  FIRST_CLASS_AUTOMATION_MIN_PIECES: 6                # INCLUSIVE (>=); unit: AUTOMATION-tier pieces
  FIRST_CLASS_AUTOMATION_RATE_CENTS: 58.0
  FIRST_CLASS_RETAIL_RATE_CENTS: 73.0                 # RETAIL-tier pieces, and AUTOMATION pieces below the min
  EDDM_SATURATION_RATE_CENTS: 22.3
  EDDM_HDPLUS_RATE_CENTS: 25.6

  # --- EDDM piece bounds (unit: pieces summed over the job's routes) -------
  EDDM_MIN_PIECES_PER_JOB: 5                          # INCLUSIVE lower bound (>=)
  EDDM_MAX_PIECES_PER_JOB_DAY: 50                     # INCLUSIVE upper bound (<=)
  EDDM_HDPLUS_MIN_RESIDENTIAL_PIECES: 3               # INCLUSIVE (>=); unit: residential pieces on a single route

  # --- Commit settlement ---------------------------------------------------
  HANDLING_BASE_CENTS: 250
  HANDLING_PCT: 0.08                                  # fraction of final_postage_cents
  VOLUME_CREDIT_PCT: 0.05                             # fraction of (postage + handling)
  VOLUME_CREDIT_MIN_PIECES: 6                         # INCLUSIVE (>=); unit: billable pieces

  # --- Robot-pen production -----------------------------------------------
  RUN_SETUP_MINUTES: 12                               # unit: slot-minutes charged per setup pass
  SPLIT_RUN_SETUP_PASSES: 2                           # SPLIT_RUN charges two setups, SINGLE_PASS charges one
  SINGLE_PASS_SETUP_PASSES: 1
  DEFAULT_MACHINE_DAILY_CAPACITY_MINUTES: 480         # unit: slot-minutes per machine per run_date
  INK_SAFETY_RESERVE_UL: 500                          # unit: microlitres; a reservation may not drive remaining_ul below this
  MAX_TEMPLATE_CHARACTER_COUNT: 2000                  # INCLUSIVE upper bound (<=); unit: characters per piece
  MIN_TEMPLATE_CHARACTER_COUNT: 1                     # INCLUSIVE lower bound (>=)

  # --- Return handling -----------------------------------------------------
  RETURN_FEE_CENTS_FIRST_CLASS: 0                     # First-Class returns are free
  RETURN_FEE_CENTS_MARKETING_MAIL: 89                 # Marketing Mail returns are chargeable per piece
  REPRINT_CAP_PER_CAMPAIGN_PER_RECORD: 1              # INCLUSIVE cap; a record may be reprinted at most once per campaign

  # --- Proof & approval ----------------------------------------------------
  PROOF_APPROVAL_VALID_DAYS: 30                       # approval is stale when current_utc >= approved_at + 30 days (INCLUSIVE)

  # --- Drip scheduling -----------------------------------------------------
  TRANSIT_DAYS_FIRST_CLASS: 3                         # unit: calendar days
  TRANSIT_DAYS_MARKETING_MAIL: 10
  TRANSIT_DAYS_EDDM: 12
  PRODUCTION_LEAD_DAYS: 3                             # mail_date must satisfy mail_date >= current_date + 3 (INCLUSIVE)
  BLACKOUT_SHIFT_MAX_DAYS: 5                          # INCLUSIVE; a shift of exactly 5 days is allowed, 6 is not
  DRIP_MIN_GAP_DAYS: 2                                # INCLUSIVE minimum gap between consecutive steps' mail dates (>=)
  DRIP_MAX_STEPS: 8                                   # INCLUSIVE cap on steps per schedule

  # --- Misc bounds ---------------------------------------------------------
  MAX_RECORDS_PER_LIST: 100000
  MIN_JOB_PIECE_COUNT: 1

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer / mailer account name"
      - name: permit_number
        type: string
        source: input
        description: "USPS permit imprint number; unique across accounts"
        constraints: "unique; non-empty"
      - name: permit_balance_cents
        type: integer
        source: computed
        description: "Postage escrow balance. Invariant: equals sum(TOPUP.amount_cents) + sum(REFUND.amount_cents) - sum(DRAW.amount_cents) - sum(FORFEIT.amount_cents) over this account's PostageLedgerEntry rows"
        default: 0
      - name: lifetime_topup_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == TOPUP"
        default: 0
      - name: lifetime_draw_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == DRAW"
        default: 0
      - name: lifetime_refund_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == REFUND"
        default: 0
      - name: lifetime_forfeit_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == FORFEIT"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Account operating status"
        default: ACTIVE
        constraints: "one of [ACTIVE, SUSPENDED]"

  - name: Campaign
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning mailer account"
      - name: name
        type: string
        source: input
        description: "Campaign display name"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Axis 1 of 3 parallel status axes on Campaign"
        default: DRAFT
        constraints: "one of [DRAFT, ACTIVE, PAUSED, COMPLETED]"
      - name: compliance_status
        type: enum
        source: system
        description: "Axis 2 of 3 parallel status axes on Campaign; HOLD freezes writes"
        default: CLEAR
        constraints: "one of [CLEAR, HOLD]"
      - name: billing_status
        type: enum
        source: system
        description: "Axis 3 of 3 parallel status axes on Campaign; CLOSED freezes writes permanently"
        default: OPEN
        constraints: "one of [OPEN, CLOSED]"
      - name: write_gate
        type: enum
        source: computed
        description: "FROZEN when compliance_status == HOLD OR billing_status == CLOSED, otherwise OPEN"
        default: OPEN
        constraints: "one of [OPEN, FROZEN]"
      - name: hold_reason
        type: string
        source: system
        description: "Reason captured on the most recent compliance hold; null when never held"
        default: null
      - name: mailed_piece_count
        type: integer
        source: computed
        description: "Sum of MailJob.billable_piece_count over this campaign's jobs whose status is in {MAILED, CLOSED}"
        default: 0
      - name: returned_piece_count
        type: integer
        source: computed
        description: "Count of ReturnEvent rows whose mail job belongs to this campaign"
        default: 0
      - name: committed_postage_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == DRAW and campaign_id == this campaign"
        default: 0
      - name: refunded_postage_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == REFUND and campaign_id == this campaign"
        default: 0
      - name: forfeited_postage_cents
        type: integer
        source: computed
        description: "Sum of PostageLedgerEntry.amount_cents where entry_type == FORFEIT and campaign_id == this campaign"
        default: 0

  - name: HandwritingStyle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Style name, e.g. 'Casual Script'"
      - name: pen_type
        type: enum
        source: input
        description: "Physical pen the robot arm must be fitted with"
        constraints: "one of [GEL, FOUNTAIN, ROLLERBALL]"
      - name: ink_type
        type: enum
        source: input
        description: "Ink formulation this style binds to; a ProductionRun's InkLot.ink_type must equal this"
        constraints: "one of [INK_BLUE_A, INK_BLACK_B, INK_NAVY_C]"
      - name: chars_per_minute
        type: integer
        source: input
        description: "Robot-pen throughput for this style, unit: characters per slot-minute"
        constraints: ">= 1"
      - name: ink_ul_per_1000_chars
        type: number
        source: input
        description: "Ink consumption, unit: microlitres per 1000 characters"
        constraints: "> 0"

  - name: Template
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account"
      - name: handwriting_style_id
        type: string
        source: input
        description: "FK -> HandwritingStyle.id; style the robot writes this template in"
      - name: name
        type: string
        source: input
        description: "Template name"
      - name: body_text
        type: string
        source: input
        description: "Note body copy"
      - name: character_count
        type: integer
        source: input
        description: "Characters the robot pen writes per piece"
        constraints: ">= MIN_TEMPLATE_CHARACTER_COUNT (1) and <= MAX_TEMPLATE_CHARACTER_COUNT (2000)"
      - name: version_no
        type: integer
        source: computed
        description: "Content version; starts at 1 and increments by 1 on every PATCH that changes body_text or character_count"
        default: 1
      - name: envelope_style
        type: enum
        source: input
        description: "Envelope treatment"
        default: STANDARD
        constraints: "one of [STANDARD, WINDOW, HAND_ADDRESSED]"

  - name: MailingList
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account"
      - name: name
        type: string
        source: input
        description: "List name"
      - name: import_status
        type: enum
        source: system
        description: "Import pipeline state"
        default: UPLOADED
        constraints: "one of [UPLOADED, CASS_RUN, DEDUPED, LOCKED]"
      - name: dedupe_mode
        type: enum
        source: system
        description: "Mode used by the most recent dedupe run; null until a dedupe run completes"
        default: null
        constraints: "one of [EXACT, HOUSEHOLD] or null"
      - name: record_count
        type: integer
        source: computed
        description: "Count of ListRecord rows on this list"
        default: 0
      - name: automation_count
        type: integer
        source: computed
        description: "Count of ListRecord rows with deliverability_tier == AUTOMATION and dedupe_status in {UNSCREENED, UNIQUE, HOUSEHOLD_HEAD}"
        default: 0
      - name: retail_count
        type: integer
        source: computed
        description: "Count of ListRecord rows with deliverability_tier == RETAIL and dedupe_status in {UNSCREENED, UNIQUE, HOUSEHOLD_HEAD}"
        default: 0
      - name: unmailable_count
        type: integer
        source: computed
        description: "Count of ListRecord rows with deliverability_tier == UNMAILABLE"
        default: 0
      - name: duplicate_count
        type: integer
        source: computed
        description: "Count of ListRecord rows with dedupe_status in {DUP_EXACT, DUP_HOUSEHOLD}"
        default: 0
      - name: mailable_count
        type: integer
        source: computed
        description: "automation_count + retail_count. Partition invariant: automation_count + retail_count + unmailable_count + duplicate_count == record_count"
        default: 0

  - name: ListRecord
    parent: MailingList
    common_fields: true
    fields:
      - name: mailing_list_id
        type: string
        source: input
        description: "FK -> MailingList.id; owning list"
      - name: first_name
        type: string
        source: input
        description: "Recipient given name"
      - name: last_name
        type: string
        source: input
        description: "Recipient family name"
      - name: address_line1
        type: string
        source: input
        description: "Primary street address line"
      - name: address_line2
        type: string
        source: input
        description: "Secondary address line (unit/suite); null when absent"
        default: null
      - name: city
        type: string
        source: input
        description: "City"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state or province code"
      - name: zip5
        type: string
        source: input
        description: "Five-digit postal code"
      - name: country_code
        type: string
        source: input
        description: "ISO country code; anything other than DOMESTIC_COUNTRY_CODE ('US') forces deliverability_tier UNMAILABLE"
        default: "US"
      - name: dpv_confirmation_code
        type: enum
        source: input
        description: "Delivery-point-validation outcome supplied with the record; consumed by the CASS run"
        default: "U"
        constraints: "one of [Y, D, S, N, U]"
      - name: cass_status
        type: enum
        source: system
        description: "Parallel axis 1 of 4 on ListRecord: CASS standardization outcome"
        default: PENDING
        constraints: "one of [PENDING, STANDARDIZED, UNMAILABLE]"
      - name: deliverability_tier
        type: enum
        source: computed
        description: "Postage eligibility tier derived from dpv_confirmation_code and country_code by calculation cass_deliverability_tier"
        default: UNASSIGNED
        constraints: "one of [UNASSIGNED, AUTOMATION, RETAIL, UNMAILABLE]"
      - name: dedupe_status
        type: enum
        source: system
        description: "Parallel axis 2 of 4 on ListRecord: dedupe screening outcome"
        default: UNSCREENED
        constraints: "one of [UNSCREENED, UNIQUE, HOUSEHOLD_HEAD, DUP_EXACT, DUP_HOUSEHOLD]"
      - name: mail_status
        type: enum
        source: system
        description: "Parallel axis 3 of 4 on ListRecord: physical mail-piece lifecycle"
        default: NOT_MAILED
        constraints: "one of [NOT_MAILED, QUEUED, MAILED, DELIVERED_ASSUMED, RETURNED]"
      - name: move_status
        type: enum
        source: system
        description: "Parallel axis 4 of 4 on ListRecord: NCOA move-update outcome"
        default: NONE
        constraints: "one of [NONE, MOVE_APPLIED, MOVE_NO_FORWARD]"
      - name: exact_key
        type: string
        source: computed
        description: "Dedupe key for EXACT mode: lower(trim(first_name)) + '|' + lower(trim(last_name)) + '|' + lower(trim(address_line1)) + '|' + zip5"
      - name: household_key
        type: string
        source: computed
        description: "Dedupe key for HOUSEHOLD mode: lower(trim(last_name)) + '|' + lower(trim(address_line1)) + '|' + zip5"
      - name: reprint_count
        type: integer
        source: computed
        description: "Count of ReprintRequest rows with status == FULFILLED for this record within the campaign of its last mail job"
        default: 0
      - name: last_mail_job_id
        type: string
        source: system
        description: "FK -> MailJob.id; the job that most recently queued or mailed this record; null before first queueing"
        default: null
      - name: insertion_seq
        type: integer
        source: system
        description: "Monotonically increasing 1-based position of this record within its MailingList, assigned on create; used only as the final dedupe tie-break when two records share an identical created_at"
        default: 0

  - name: MailJob
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id; content and handwriting style for this job"
      - name: mailing_list_id
        type: string
        source: input
        description: "FK -> MailingList.id; recipient list for ADDRESSED jobs; MUST be null for EDDM jobs"
        default: null
      - name: job_kind
        type: enum
        source: input
        description: "ADDRESSED = individually addressed pieces from a mailing list; EDDM = carrier-route saturation with no recipient names"
        constraints: "one of [ADDRESSED, EDDM]"
      - name: mail_class
        type: enum
        source: input
        description: "Postage class; EDDM jobs MUST use EDDM, ADDRESSED jobs MUST use FIRST_CLASS or MARKETING_MAIL"
        constraints: "one of [FIRST_CLASS, MARKETING_MAIL, EDDM]"
      - name: eddm_rate_variant
        type: enum
        source: input
        description: "Rate variant for EDDM jobs; MUST be null for ADDRESSED jobs"
        default: null
        constraints: "one of [SATURATION, HIGH_DENSITY_PLUS] or null"
      - name: status
        type: enum
        source: system
        description: "Job pipeline state with revert edges SCHEDULED->DRAFT and COMMITTED->DRAFT"
        default: DRAFT
        constraints: "one of [DRAFT, PROOFED, SCHEDULED, COMMITTED, IN_PRODUCTION, MAILED, CLOSED]"
      - name: pinned_template_version
        type: integer
        source: computed
        description: "Template.version_no snapshotted when the job reached PROOFED; null while DRAFT"
        default: null
      - name: automation_piece_count
        type: integer
        source: computed
        description: "ADDRESSED jobs: count of the list's ListRecord rows with deliverability_tier == AUTOMATION and dedupe_status in the surviving set for the active variant. EDDM jobs: 0"
        default: 0
      - name: retail_piece_count
        type: integer
        source: computed
        description: "ADDRESSED jobs: count of surviving ListRecord rows with deliverability_tier == RETAIL. EDDM jobs: 0"
        default: 0
      - name: unmailable_piece_count
        type: integer
        source: computed
        description: "ADDRESSED jobs: count of the list's ListRecord rows with deliverability_tier == UNMAILABLE. EDDM jobs: 0"
        default: 0
      - name: eddm_piece_count
        type: integer
        source: computed
        description: "EDDM jobs: sum of EddmRouteSelection.selected_piece_count over this job's routes. ADDRESSED jobs: 0"
        default: 0
      - name: billable_piece_count
        type: integer
        source: computed
        description: "ADDRESSED jobs: automation_piece_count + retail_piece_count. EDDM jobs: eddm_piece_count"
        default: 0
      - name: presort_tier
        type: enum
        source: computed
        description: "Presort tier selected by calculation presort_tier_selection from automation_piece_count; EDDM jobs are always EDDM_ROUTE"
        default: UNASSIGNED
        constraints: "one of [UNASSIGNED, PRESORT_5D, PRESORT_AADC, PRESORT_MIXED_AADC, NO_PRESORT, EDDM_ROUTE]"
      - name: provisional_postage_cents
        type: integer
        source: computed
        description: "Output of calculation postage_estimate variant PROVISIONAL; set by POST /mail/mail-jobs/{mail_job_id}/estimate"
        default: null
      - name: final_postage_cents
        type: integer
        source: computed
        description: "Output of calculation postage_estimate variant FINAL; set at commit"
        default: null
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "Output of calculation commit_settlement step 2; set at commit"
        default: null
      - name: volume_credit_cents
        type: integer
        source: computed
        description: "Output of calculation commit_settlement step 4; set at commit"
        default: null
      - name: total_due_cents
        type: integer
        source: computed
        description: "Output of calculation commit_settlement step 5; the amount drawn from the account permit balance at commit"
        default: null
      - name: drawn_postage_cents
        type: integer
        source: computed
        description: "Amount actually drawn from the permit balance for this job; 0 after a void refunds it"
        default: 0
      - name: refunded_postage_cents
        type: integer
        source: computed
        description: "Sum of REFUND PostageLedgerEntry.amount_cents attributed to this job"
        default: 0
      - name: returned_piece_count
        type: integer
        source: computed
        description: "Count of ReturnEvent rows whose mail_job_id is this job"
        default: 0
      - name: target_in_home_date
        type: string
        source: input
        description: "Requested in-home date, ISO 8601 calendar date (YYYY-MM-DD); null when the job is scheduled through a drip step"
        default: null
      - name: mail_date
        type: string
        source: computed
        description: "Derived drop date, ISO 8601 calendar date; output of calculation mail_date_derivation"
        default: null
      - name: blackout_shifted_days
        type: integer
        source: computed
        description: "Number of calendar days the derived mail date was shifted backwards to clear blackout dates"
        default: 0
      - name: scheduled_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the job entered SCHEDULED"
        default: null

  - name: EddmRouteSelection
    parent: MailJob
    common_fields: true
    fields:
      - name: mail_job_id
        type: string
        source: input
        description: "FK -> MailJob.id; the EDDM job this route belongs to"
      - name: route_code
        type: string
        source: input
        description: "Carrier route identifier; unique within a mail job"
        constraints: "unique per mail_job_id"
      - name: total_deliveries
        type: integer
        source: input
        description: "Total delivery points on the carrier route"
        constraints: ">= 1"
      - name: residential_piece_count
        type: integer
        source: input
        description: "Residential delivery points selected on this route"
        constraints: ">= 0"
      - name: business_piece_count
        type: integer
        source: input
        description: "Business delivery points selected on this route"
        constraints: ">= 0"
      - name: selected_piece_count
        type: integer
        source: computed
        description: "residential_piece_count + business_piece_count"
        default: 0
      - name: saturation_pct
        type: number
        source: computed
        description: "round_half_up(100 * selected_piece_count / total_deliveries, 2); unit: percent"
        default: 0

  - name: Proof
    parent: MailJob
    common_fields: true
    fields:
      - name: mail_job_id
        type: string
        source: input
        description: "FK -> MailJob.id; the job whose piece is being proofed"
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id; the template this proof renders"
      - name: pinned_template_version
        type: integer
        source: computed
        description: "Template.version_no snapshotted at submit; the approval is scoped to exactly this version"
        default: null
      - name: status
        type: enum
        source: system
        description: "Proof lifecycle with a REJECTED -> SUBMITTED revision loop"
        default: DRAFT
        constraints: "one of [DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED, EXPIRED]"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who submitted this proof"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who approved this proof"
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: "Logical-clock instant of approval"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "approved_at + PROOF_APPROVAL_VALID_DAYS (30) days; the approval is stale when current_utc >= expires_at"
        default: null
      - name: reject_reason
        type: string
        source: input
        description: "Reviewer note captured on rejection"
        default: null

  - name: WritingMachine
    parent: null
    common_fields: true
    fields:
      - name: machine_code
        type: string
        source: input
        description: "Robot-pen machine identifier; unique"
        constraints: "unique"
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: "Slot-minutes available per run_date on this machine"
        default: 480
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Machine availability"
        default: ONLINE
        constraints: "one of [ONLINE, OFFLINE]"

  - name: InkLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: "Ink lot identifier; unique"
        constraints: "unique"
      - name: ink_type
        type: enum
        source: input
        description: "Ink formulation held by this lot"
        constraints: "one of [INK_BLUE_A, INK_BLACK_B, INK_NAVY_C]"
      - name: initial_volume_ul
        type: integer
        source: input
        description: "Filled volume, unit: microlitres"
        constraints: ">= 1"
      - name: remaining_ul
        type: integer
        source: computed
        description: "initial_volume_ul minus ink committed to RESERVED/RUNNING/COMPLETED ProductionRun rows drawing on this lot; a VOIDED or FAILED run returns its ink"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle; SEALED -> OPEN on first reservation, QUARANTINED <-> OPEN loop"
        default: SEALED
        constraints: "one of [SEALED, OPEN, DEPLETED, QUARANTINED]"

  - name: ProductionRun
    parent: MailJob
    common_fields: true
    fields:
      - name: mail_job_id
        type: string
        source: input
        description: "FK -> MailJob.id; the job whose pieces this run writes"
      - name: machine_id
        type: string
        source: input
        description: "FK -> WritingMachine.id; machine reserved for this run"
      - name: ink_lot_id
        type: string
        source: input
        description: "FK -> InkLot.id; lot the run draws ink from"
      - name: run_date
        type: string
        source: input
        description: "Machine-day bucket, ISO 8601 calendar date (YYYY-MM-DD)"
      - name: piece_count
        type: integer
        source: input
        description: "Pieces this run writes"
        constraints: ">= MIN_JOB_PIECE_COUNT (1)"
      - name: capacity_variant
        type: enum
        source: input
        description: "SINGLE_PASS charges SINGLE_PASS_SETUP_PASSES (1) setup; SPLIT_RUN charges SPLIT_RUN_SETUP_PASSES (2)"
        default: SINGLE_PASS
        constraints: "one of [SINGLE_PASS, SPLIT_RUN]"
      - name: planned_write_minutes
        type: integer
        source: computed
        description: "ceil(piece_count * Template.character_count / HandwritingStyle.chars_per_minute)"
        default: 0
      - name: planned_slot_minutes
        type: integer
        source: computed
        description: "planned_write_minutes + RUN_SETUP_MINUTES * setup_passes(capacity_variant)"
        default: 0
      - name: planned_ink_ul
        type: integer
        source: computed
        description: "ceil(piece_count * Template.character_count * HandwritingStyle.ink_ul_per_1000_chars / 1000)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Run lifecycle with a FAILED -> RESERVED retry loop"
        default: RESERVED
        constraints: "one of [RESERVED, RUNNING, COMPLETED, FAILED, VOIDED]"
      - name: spoiled_piece_count
        type: integer
        source: input
        description: "Pieces spoiled during the run; supplied on fail"
        default: 0

  - name: DripSchedule
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: name
        type: string
        source: input
        description: "Drip schedule name"
      - name: anchor_variant
        type: enum
        source: input
        description: "ANCHOR_IN_HOME reads each step date as a target in-home date and derives the mail date backwards; ANCHOR_MAIL_DATE reads the same date as the mail date and derives in-home forwards"
        constraints: "one of [ANCHOR_IN_HOME, ANCHOR_MAIL_DATE]"
      - name: status
        type: enum
        source: system
        description: "Schedule lifecycle"
        default: DRAFT
        constraints: "one of [DRAFT, ACTIVE, CANCELLED]"
      - name: step_count
        type: integer
        source: computed
        description: "Count of DripStep rows on this schedule whose status is not CANCELLED"
        default: 0

  - name: DripStep
    parent: DripSchedule
    common_fields: true
    fields:
      - name: drip_schedule_id
        type: string
        source: input
        description: "FK -> DripSchedule.id; owning schedule"
      - name: mail_job_id
        type: string
        source: input
        description: "FK -> MailJob.id; the job this step drops"
      - name: sequence_no
        type: integer
        source: input
        description: "Ordering position within the schedule; unique per drip_schedule_id"
        constraints: ">= 1; unique per drip_schedule_id"
      - name: anchor_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) interpreted per DripSchedule.anchor_variant"
      - name: computed_mail_date
        type: string
        source: computed
        description: "Output of calculation mail_date_derivation, ISO 8601 calendar date"
        default: null
      - name: computed_in_home_date
        type: string
        source: computed
        description: "computed_mail_date + transit_days(MailJob.mail_class), ISO 8601 calendar date"
        default: null
      - name: shifted_days
        type: integer
        source: computed
        description: "Calendar days the mail date was shifted backwards to clear blackout dates"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Step lifecycle with a SCHEDULED -> PENDING unschedule edge"
        default: PENDING
        constraints: "one of [PENDING, SCHEDULED, RELEASED, MAILED, CANCELLED]"

  - name: PostageLedgerEntry
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; account whose permit balance this row moves"
      - name: mail_job_id
        type: string
        source: system
        description: "FK -> MailJob.id; job the row is attributed to; null for TOPUP rows"
        default: null
      - name: campaign_id
        type: string
        source: system
        description: "FK -> Campaign.id; campaign the row is attributed to; null for TOPUP rows"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "Ledger row kind"
        constraints: "one of [TOPUP, DRAW, REFUND, FORFEIT]"
      - name: amount_cents
        type: integer
        source: system
        description: "Positive magnitude of the movement, unit: cents"
        constraints: ">= 1"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for TOPUP and REFUND, -amount_cents for DRAW and FORFEIT"
      - name: balance_after_cents
        type: integer
        source: computed
        description: "Account.permit_balance_cents immediately after this row was appended"
      - name: reason
        type: string
        source: system
        description: "Free-text provenance, e.g. 'commit mail job', 'void refund', 'return-to-sender fee'"

  - name: ReturnEvent
    parent: ListRecord
    common_fields: false
    fields:
      - name: list_record_id
        type: string
        source: system
        description: "FK -> ListRecord.id; the recipient record whose piece came back"
      - name: mail_job_id
        type: string
        source: system
        description: "FK -> MailJob.id; the job that mailed the returned piece"
      - name: return_reason
        type: enum
        source: input
        description: "Endorsement reason printed by the carrier"
        constraints: "one of [MOVED_NO_FORWARD, VACANT, REFUSED, INSUFFICIENT_ADDRESS]"
      - name: entitlement
        type: enum
        source: computed
        description: "Output of calculation return_settlement: REPRINT when the record has an applied NCOA move, otherwise REFUND"
        constraints: "one of [REPRINT, REFUND]"
      - name: return_fee_cents
        type: integer
        source: computed
        description: "Forfeit charged for this return per MailJob.mail_class; 0 for FIRST_CLASS, RETURN_FEE_CENTS_MARKETING_MAIL (89) for MARKETING_MAIL"
        default: 0

  - name: ReprintRequest
    parent: ListRecord
    common_fields: true
    fields:
      - name: list_record_id
        type: string
        source: input
        description: "FK -> ListRecord.id; record to be reprinted"
      - name: return_event_id
        type: string
        source: input
        description: "FK -> ReturnEvent.id; the return that entitles this reprint"
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; campaign the reprint cap is scoped to"
      - name: status
        type: enum
        source: system
        description: "Reprint lifecycle"
        default: REQUESTED
        constraints: "one of [REQUESTED, FULFILLED, DENIED]"
      - name: deny_reason
        type: string
        source: input
        description: "Reviewer note captured on denial"
        default: null

  - name: BlackoutDate
    parent: null
    common_fields: false
    fields:
      - name: blackout_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) on which no mail may drop"
        constraints: "unique"
      - name: reason
        type: string
        source: input
        description: "Why the date is blacked out, e.g. 'federal holiday'"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# 14 status axes across 11 entities. Campaign carries 3 parallel axes;
# ListRecord carries 4 parallel axes. Non-linear axes are marked in `note`.
# ---------------------------------------------------------------------------
state_machines:
  # ---- Campaign axis 1/3 : lifecycle (cyclic ACTIVE <-> PAUSED) -----------
  - entity: Campaign
    axis: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mail/campaigns/{campaign_id}/activate"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Campaign.lifecycle_status == DRAFT"
        side_effects:
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /mail/campaigns/{campaign_id}/pause"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Campaign.lifecycle_status == ACTIVE"
        side_effects:
          - "every DripStep on this campaign's schedules whose status == SCHEDULED moves to PENDING"
          - "increments Campaign.version by 1"
        note: "cyclic edge 1 of 2"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /mail/campaigns/{campaign_id}/activate"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Campaign.lifecycle_status == PAUSED"
        side_effects:
          - "increments Campaign.version by 1"
        note: "cyclic edge 2 of 2 — NON-LINEAR (cycle)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign.billing_status == OPEN"
          - "Campaign.lifecycle_status in {ACTIVE, PAUSED}"
        side_effects:
          - "sets Campaign.billing_status = CLOSED (axis 3) and Campaign.write_gate = FROZEN"
          - "CASCADE C hop 2: every MailJob on this campaign with status == MAILED moves to CLOSED"
          - "CASCADE C hop 3: every DripStep whose mail_job_id is one of the jobs closed in hop 2 and whose status is in {PENDING, SCHEDULED, RELEASED} moves to CANCELLED"
          - "CASCADE C hop 4: every DripSchedule whose recomputed step_count == 0 after hop 3 moves to CANCELLED"
          - "recomputes Campaign.mailed_piece_count from the jobs closed in hop 2"
          - "increments Campaign.version by 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign.billing_status == OPEN"
          - "Campaign.lifecycle_status in {ACTIVE, PAUSED}"
        side_effects:
          - "same CASCADE C hops 2-4 as the ACTIVE -> COMPLETED edge"
          - "increments Campaign.version by 1"

  # ---- Campaign axis 2/3 : compliance (cyclic CLEAR <-> HOLD) -------------
  - entity: Campaign
    axis: compliance_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: HOLD
        trigger: "POST /mail/campaigns/{campaign_id}/compliance-holds"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign.compliance_status == CLEAR"
          - "Campaign.billing_status == OPEN"
        side_effects:
          - "sets Campaign.write_gate = FROZEN (global write gate, ladder rung 9)"
          - "stores hold_reason"
          - "increments Campaign.version by 1"
        note: "NON-LINEAR (cycle, parallel axis) — this axis evolves independently of lifecycle_status"
      - from: HOLD
        to: CLEAR
        trigger: "POST /mail/campaigns/{campaign_id}/compliance-releases"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign.compliance_status == HOLD"
          - "Campaign.billing_status == OPEN"
        side_effects:
          - "sets Campaign.write_gate = OPEN when billing_status is still OPEN"
          - "increments Campaign.version by 1"
        note: "the ONLY write endpoint exempt from ladder rung 9"

  # ---- Campaign axis 3/3 : billing (linear, one-way) ----------------------
  - entity: Campaign
    axis: billing_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign.billing_status == OPEN"
        side_effects:
          - "sets Campaign.write_gate = FROZEN permanently (ladder rung 10 admits no exemption)"
          - "drives CASCADE C on the lifecycle axis"
        note: "linear axis; once CLOSED the campaign is frozen for every write endpoint"

  # ---- MailingList : import pipeline (cyclic re-runs) ---------------------
  - entity: MailingList
    axis: import_status
    initial_state: UPLOADED
    terminal_states: [LOCKED]
    transitions:
      - from: UPLOADED
        to: CASS_RUN
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status in {UPLOADED, CASS_RUN, DEDUPED}"
          - "MailingList.record_count >= 1"
        side_effects:
          - "for each ListRecord: runs calculation cass_deliverability_tier, sets cass_status and deliverability_tier"
          - "resets every ListRecord.dedupe_status to UNSCREENED and MailingList.dedupe_mode to null"
          - "recomputes MailingList.automation_count, retail_count, unmailable_count, duplicate_count, mailable_count"
          - "increments MailingList.version by 1"
      - from: CASS_RUN
        to: CASS_RUN
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status in {UPLOADED, CASS_RUN, DEDUPED}"
        side_effects:
          - "same recomputation as the UPLOADED -> CASS_RUN edge"
        note: "self-loop — NON-LINEAR (cycle)"
      - from: DEDUPED
        to: CASS_RUN
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status in {UPLOADED, CASS_RUN, DEDUPED}"
        side_effects:
          - "same recomputation as the UPLOADED -> CASS_RUN edge; the prior dedupe screening is discarded"
        note: "backward edge — NON-LINEAR (cycle)"
      - from: CASS_RUN
        to: DEDUPED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status in {CASS_RUN, DEDUPED}"
        side_effects:
          - "runs calculation dedupe_screen in the requested mode, writing ListRecord.dedupe_status for every record"
          - "sets MailingList.dedupe_mode to the requested mode"
          - "recomputes MailingList.automation_count, retail_count, duplicate_count, mailable_count"
          - "increments MailingList.version by 1"
      - from: DEDUPED
        to: DEDUPED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status in {CASS_RUN, DEDUPED}"
        side_effects:
          - "discards the prior screening and re-screens in the newly requested mode"
        note: "self-loop that can flip counts in either direction — NON-LINEAR (cycle)"
      - from: DEDUPED
        to: LOCKED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/lock"
        actor: ListOperator
        preconditions:
          - "MailingList.import_status == DEDUPED"
          - "MailingList.mailable_count >= 1"
        side_effects:
          - "increments MailingList.version by 1"
        note: "terminal; ladder rung 12 rejects all further list writes with ERR_LIST_LOCKED"

  # ---- ListRecord axis 1/4 : CASS (branching + revisit) -------------------
  - entity: ListRecord
    axis: cass_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: STANDARDIZED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs (system, per record)"
        actor: system
        preconditions:
          - "ListRecord.country_code == 'US'"
          - "ListRecord.dpv_confirmation_code in {Y, D, S}"
        side_effects:
          - "sets deliverability_tier to AUTOMATION for Y, RETAIL for D and S"
        note: "branch 1 of 2 — NON-LINEAR (branching with divergent side effects)"
      - from: PENDING
        to: UNMAILABLE
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs (system, per record)"
        actor: system
        preconditions:
          - "ListRecord.country_code != 'US' OR ListRecord.dpv_confirmation_code in {N, U}"
        side_effects:
          - "sets deliverability_tier to UNMAILABLE"
          - "the record is excluded from every piece count and never queued"
        note: "branch 2 of 2 — divergent side-effect set"
      - from: UNMAILABLE
        to: STANDARDIZED
        trigger: "POST /mail/list-records/{list_record_id}/ncoa-moves"
        actor: ListOperator
        preconditions:
          - "the move payload supplies a new address and a new_dpv_confirmation_code in {Y, D, S}"
          - "MailingList.import_status != LOCKED"
        side_effects:
          - "rewrites address_line1, city, state_code, zip5, dpv_confirmation_code"
          - "re-derives deliverability_tier via calculation cass_deliverability_tier"
          - "recomputes exact_key and household_key"
          - "recomputes the owning MailingList's counts"
        note: "recovery edge — NON-LINEAR (cycle back into STANDARDIZED)"
      - from: STANDARDIZED
        to: UNMAILABLE
        trigger: "POST /mail/list-records/{list_record_id}/ncoa-moves"
        actor: ListOperator
        preconditions:
          - "the move payload supplies new_dpv_confirmation_code in {N, U}"
          - "MailingList.import_status != LOCKED"
        side_effects:
          - "sets deliverability_tier to UNMAILABLE and recomputes the owning MailingList's counts"

  # ---- ListRecord axis 2/4 : dedupe (branch to 4 outcomes + reset cycle) --
  - entity: ListRecord
    axis: dedupe_status
    initial_state: UNSCREENED
    terminal_states: []
    transitions:
      - from: UNSCREENED
        to: UNIQUE
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs (system, per record)"
        actor: system
        preconditions:
          - "mode == EXACT and no other record on the list shares this record's exact_key"
        side_effects: ["record counts toward MailingList.automation_count or retail_count per its tier"]
        note: "branch 1 of 4"
      - from: UNSCREENED
        to: DUP_EXACT
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs (system, per record)"
        actor: system
        preconditions:
          - "mode == EXACT and another record on the list shares this exact_key with a strictly earlier created_at"
        side_effects: ["record counts toward MailingList.duplicate_count and is excluded from every piece count"]
        note: "branch 2 of 4"
      - from: UNSCREENED
        to: HOUSEHOLD_HEAD
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs (system, per record)"
        actor: system
        preconditions:
          - "mode == HOUSEHOLD and this record has the earliest created_at among all records sharing its household_key"
        side_effects: ["record counts toward MailingList.automation_count or retail_count per its tier"]
        note: "branch 3 of 4"
      - from: UNSCREENED
        to: DUP_HOUSEHOLD
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs (system, per record)"
        actor: system
        preconditions:
          - "mode == HOUSEHOLD and another record on the list shares this household_key with a strictly earlier created_at"
        side_effects: ["record counts toward MailingList.duplicate_count and is excluded from every piece count"]
        note: "branch 4 of 4 — NON-LINEAR (4-way branch with divergent counting side effects)"
      - from: UNIQUE
        to: UNSCREENED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs or a re-run of dedupe-runs in a different mode"
        actor: system
        preconditions: ["MailingList.import_status in {CASS_RUN, DEDUPED}"]
        side_effects: ["clears the prior screening before the new pass writes a fresh outcome"]
        note: "reset edge — NON-LINEAR (cycle); the same edge exists from HOUSEHOLD_HEAD, DUP_EXACT and DUP_HOUSEHOLD"
      - from: DUP_HOUSEHOLD
        to: UNSCREENED
        trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs (mode EXACT)"
        actor: system
        preconditions: ["MailingList.import_status in {CASS_RUN, DEDUPED}"]
        side_effects: ["record returns to the mailable population, raising MailingList.mailable_count"]

  # ---- ListRecord axis 3/4 : mail lifecycle (cycle via reprint) ----------
  - entity: ListRecord
    axis: mail_status
    initial_state: NOT_MAILED
    terminal_states: []
    transitions:
      - from: NOT_MAILED
        to: QUEUED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/commit (system, per surviving record)"
        actor: system
        preconditions:
          - "MailJob.job_kind == ADDRESSED"
          - "ListRecord.deliverability_tier in {AUTOMATION, RETAIL}"
          - "ListRecord.dedupe_status in {UNIQUE, HOUSEHOLD_HEAD}"
        side_effects: ["sets ListRecord.last_mail_job_id to the committed job"]
      - from: QUEUED
        to: MAILED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/mail (system, per queued record)"
        actor: system
        preconditions: ["MailJob.status == IN_PRODUCTION"]
        side_effects: ["increments Campaign.mailed_piece_count on the owning campaign"]
      - from: MAILED
        to: RETURNED
        trigger: "POST /mail/list-records/{list_record_id}/returns"
        actor: ListOperator
        preconditions:
          - "ListRecord.mail_status == MAILED"
          - "ListRecord.last_mail_job_id is not null and that job's job_kind == ADDRESSED"
        side_effects:
          - "CASCADE B hop 2: appends a ReturnEvent whose entitlement comes from calculation return_settlement"
          - "CASCADE B hop 3: when entitlement == REFUND, appends a FORFEIT PostageLedgerEntry of return_fee_cents and decrements Account.permit_balance_cents"
          - "CASCADE B hop 4: increments MailJob.returned_piece_count, which recomputes Campaign.returned_piece_count and Campaign.forfeited_postage_cents"
          - "increments ListRecord.version by 1"
      - from: MAILED
        to: DELIVERED_ASSUMED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close (system, per mailed record with no return)"
        actor: system
        preconditions: ["ListRecord.mail_status == MAILED"]
        side_effects: ["no ledger movement"]
      - from: RETURNED
        to: QUEUED
        trigger: "POST /mail/reprint-requests/{reprint_request_id}/fulfill"
        actor: ProductionOperator
        preconditions:
          - "ReprintRequest.status == REQUESTED"
          - "ListRecord.reprint_count < REPRINT_CAP_PER_CAMPAIGN_PER_RECORD (1)"
        side_effects:
          - "increments ListRecord.reprint_count by 1"
          - "increments ListRecord.version by 1"
        note: "recovery cycle RETURNED -> QUEUED — NON-LINEAR"

  # ---- ListRecord axis 4/4 : NCOA move (branching) ------------------------
  - entity: ListRecord
    axis: move_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: MOVE_APPLIED
        trigger: "POST /mail/list-records/{list_record_id}/ncoa-moves"
        actor: ListOperator
        preconditions:
          - "the move payload supplies a forwarding address (new_address_line1 non-null)"
          - "MailingList.import_status != LOCKED"
        side_effects: ["rewrites the address fields and re-derives cass_status / deliverability_tier"]
        note: "branch 1 of 2 — this outcome makes a later return REPRINT-entitled"
      - from: NONE
        to: MOVE_NO_FORWARD
        trigger: "POST /mail/list-records/{list_record_id}/ncoa-moves"
        actor: ListOperator
        preconditions:
          - "the move payload supplies new_address_line1 == null"
          - "MailingList.import_status != LOCKED"
        side_effects:
          - "sets dpv_confirmation_code to N and deliverability_tier to UNMAILABLE"
        note: "branch 2 of 2 — divergent side effects; this outcome makes a later return REFUND-entitled"
      - from: MOVE_NO_FORWARD
        to: MOVE_APPLIED
        trigger: "POST /mail/list-records/{list_record_id}/ncoa-moves"
        actor: ListOperator
        preconditions:
          - "the move payload supplies a forwarding address"
          - "MailingList.import_status != LOCKED"
        side_effects: ["rewrites the address fields and re-derives deliverability_tier"]
        note: "NON-LINEAR (branch converges back)"

  # ---- MailJob : pipeline with two revert edges back to DRAFT ------------
  - entity: MailJob
    axis: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PROOFED
        trigger: "POST /mail/proofs/{proof_id}/approve (system, on the proof's mail_job_id)"
        actor: system
        preconditions:
          - "Proof.mail_job_id == MailJob.id"
          - "MailJob.status == DRAFT"
        side_effects:
          - "sets MailJob.pinned_template_version = Proof.pinned_template_version"
          - "increments MailJob.version by 1"
      - from: PROOFED
        to: SCHEDULED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/schedule"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.status == PROOFED"
          - "an APPROVED Proof exists for this job whose pinned_template_version == Template.version_no and whose expires_at is strictly after current_utc"
        side_effects:
          - "runs calculation mail_date_derivation and writes mail_date and blackout_shifted_days"
          - "sets scheduled_at = current_utc"
          - "increments MailJob.version by 1"
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/schedule"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.status == DRAFT"
          - "an APPROVED Proof exists for this job whose pinned_template_version == Template.version_no and whose expires_at is strictly after current_utc"
        side_effects:
          - "runs calculation mail_date_derivation and writes mail_date and blackout_shifted_days"
          - "re-pins pinned_template_version from the live approval and sets scheduled_at = current_utc"
          - "increments MailJob.version by 1"
        note: |
          Re-entry edge for a job that returned to DRAFT through a void while its approval stayed
          live. A DRAFT job with NO approval at all reaches this edge's precondition and is rejected
          at ladder rung 24 with ERR_PROOF_NOT_APPROVED — which is the only way that error is
          reachable, since PROOFED can only be entered by an approval.
      - from: SCHEDULED
        to: COMMITTED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/commit"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.status == SCHEDULED"
          - "for ADDRESSED jobs: MailingList.import_status == LOCKED"
          - "for EDDM jobs: total eddm_piece_count within [EDDM_MIN_PIECES_PER_JOB, EDDM_MAX_PIECES_PER_JOB_DAY]"
          - "billable_piece_count >= 1"
          - "Account.permit_balance_cents >= total_due_cents"
        side_effects:
          - "runs calculation postage_estimate variant FINAL, writing final_postage_cents and presort_tier"
          - "runs calculation commit_settlement, writing handling_fee_cents, volume_credit_cents, total_due_cents"
          - "appends a DRAW PostageLedgerEntry of total_due_cents and decrements Account.permit_balance_cents"
          - "sets drawn_postage_cents = total_due_cents"
          - "for ADDRESSED jobs: every surviving ListRecord moves NOT_MAILED -> QUEUED and takes last_mail_job_id"
          - "recomputes Campaign.committed_postage_cents"
          - "increments MailJob.version by 1"
      - from: COMMITTED
        to: IN_PRODUCTION
        trigger: "POST /mail/production-runs/{production_run_id}/start (system, on the run's mail_job_id)"
        actor: system
        preconditions:
          - "MailJob.status == COMMITTED"
          - "ProductionRun.status == RESERVED"
        side_effects:
          - "increments MailJob.version by 1"
      - from: IN_PRODUCTION
        to: MAILED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/mail"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.status == IN_PRODUCTION"
          - "every ProductionRun on this job has status in {COMPLETED, VOIDED} and at least one is COMPLETED"
        side_effects:
          - "for ADDRESSED jobs: every QUEUED ListRecord moves to MAILED"
          - "every DripStep on this job with status == RELEASED moves to MAILED"
          - "recomputes Campaign.mailed_piece_count"
          - "increments MailJob.version by 1"
      - from: COMMITTED
        to: MAILED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/mail"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.job_kind == EDDM"
          - "MailJob.status == COMMITTED"
        side_effects:
          - "every DripStep on this job with status == RELEASED moves to MAILED"
          - "recomputes Campaign.mailed_piece_count from eddm_piece_count"
          - "increments MailJob.version by 1"
        note: |
          EDDM-only edge. Saturation pieces are machine-printed in bulk rather than robot-written per
          recipient, so an EDDM job never enters IN_PRODUCTION and never owns a ProductionRun —
          ladder rung 13 rejects any run reservation against it with ERR_EDDM_NOT_APPLICABLE.
      - from: MAILED
        to: CLOSED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close (CASCADE C hop 2)"
        actor: system
        preconditions:
          - "MailJob.status == MAILED"
        side_effects:
          - "every MAILED ListRecord on this job with no ReturnEvent moves to DELIVERED_ASSUMED"
          - "increments MailJob.version by 1"
      - from: COMMITTED
        to: DRAFT
        trigger: "POST /mail/mail-jobs/{mail_job_id}/void"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "MailJob.status == COMMITTED"
        side_effects:
          - "appends a REFUND PostageLedgerEntry of drawn_postage_cents and increments Account.permit_balance_cents by the same amount (compensating invariant postage_money_conservation)"
          - "sets drawn_postage_cents = 0 and refunded_postage_cents = the refunded amount"
          - "every ProductionRun on this job with status in {RESERVED, FAILED} moves to VOIDED, returning ink and machine slot-minutes"
          - "every QUEUED ListRecord on this job returns to NOT_MAILED and clears last_mail_job_id"
          - "clears final_postage_cents, handling_fee_cents, volume_credit_cents, total_due_cents, mail_date, scheduled_at, pinned_template_version"
          - "increments MailJob.version by 1"
        note: "revert edge 1 of 2 — NON-LINEAR"
      - from: SCHEDULED
        to: DRAFT
        trigger: "PATCH /mail/templates/{template_id} (CASCADE A hop 3)"
        actor: system
        preconditions:
          - "an APPROVED Proof for this job moved to SUPERSEDED in CASCADE A hop 2"
        side_effects:
          - "clears mail_date, blackout_shifted_days, scheduled_at and pinned_template_version"
          - "CASCADE A hop 7: every DripStep on this job with status == SCHEDULED moves to PENDING"
          - "increments MailJob.version by 1"
        note: "revert edge 2 of 2 — NON-LINEAR"
      - from: COMMITTED
        to: DRAFT
        trigger: "PATCH /mail/templates/{template_id} (CASCADE A hop 3)"
        actor: system
        preconditions:
          - "an APPROVED Proof for this job moved to SUPERSEDED in CASCADE A hop 2"
        side_effects:
          - "CASCADE A hop 4: every ProductionRun on this job with status == RESERVED moves to VOIDED"
          - "CASCADE A hop 5: each voided run returns planned_ink_ul to its InkLot.remaining_ul and releases planned_slot_minutes on its machine-day"
          - "CASCADE A hop 6: appends a REFUND PostageLedgerEntry of drawn_postage_cents and increments Account.permit_balance_cents"
          - "CASCADE A hop 7: every DripStep on this job with status == SCHEDULED moves to PENDING"
          - "increments MailJob.version by 1"
      - from: PROOFED
        to: DRAFT
        trigger: "PATCH /mail/templates/{template_id} (CASCADE A hop 3)"
        actor: system
        preconditions:
          - "an APPROVED Proof for this job moved to SUPERSEDED in CASCADE A hop 2"
        side_effects:
          - "clears pinned_template_version"
          - "increments MailJob.version by 1"

  # ---- Proof : approval with revision loop, supersession and expiry -------
  - entity: Proof
    axis: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mail/proofs/{proof_id}/submit"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Proof.status in {DRAFT, REJECTED}"
        side_effects:
          - "pins pinned_template_version = Template.version_no at this instant"
          - "records submitted_by_user_id = X-User-ID"
          - "increments Proof.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /mail/proofs/{proof_id}/submit"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Proof.status in {DRAFT, REJECTED}"
        side_effects:
          - "re-pins pinned_template_version to the current Template.version_no"
          - "records submitted_by_user_id = X-User-ID"
        note: "revision loop SUBMITTED -> REJECTED -> SUBMITTED — NON-LINEAR (cycle)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mail/proofs/{proof_id}/approve"
        actor: AccountOwner
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Proof.status == SUBMITTED"
          - "X-User-ID != Proof.submitted_by_user_id (segregation of duties, ladder rung 23)"
          - "Proof.pinned_template_version == Template.version_no"
        side_effects:
          - "sets approved_by_user_id, approved_at = current_utc, expires_at = approved_at + 30 days"
          - "drives MailJob DRAFT -> PROOFED"
          - "increments Proof.version by 1"
        note: "branch 1 of 2"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mail/proofs/{proof_id}/reject"
        actor: AccountOwner
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "Proof.status == SUBMITTED"
        side_effects:
          - "stores reject_reason; leaves the MailJob in DRAFT"
          - "increments Proof.version by 1"
        note: "branch 2 of 2 — divergent side-effect sets"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "PATCH /mail/templates/{template_id} (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "CASCADE A hop 1 incremented Template.version_no"
          - "Proof.status == APPROVED and Proof.template_id == the edited template"
        side_effects:
          - "drives CASCADE A hop 3 on every MailJob whose outstanding approval this was"
          - "increments Proof.version by 1"
        note: "supersession is distinguishable from expiry: ladder rung 25 fires ERR_PROOF_APPROVAL_STALE for both, rung 24 fires ERR_PROOF_NOT_APPROVED when no approval ever existed"
      - from: APPROVED
        to: EXPIRED
        trigger: "system, materialized on any read or gate evaluation of this proof once current_utc >= expires_at"
        actor: system
        preconditions:
          - "Proof.status == APPROVED"
          - "current_utc >= Proof.expires_at (INCLUSIVE boundary)"
        side_effects:
          - "increments Proof.version by 1"
          - "the owning MailJob keeps its status; the approval gate at rungs 24/25 now fails with ERR_PROOF_APPROVAL_STALE"

  # ---- ProductionRun : retry loop ---------------------------------------
  - entity: ProductionRun
    axis: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: RESERVED
        to: RUNNING
        trigger: "POST /mail/production-runs/{production_run_id}/start"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ProductionRun.status in {RESERVED, FAILED}"
          - "WritingMachine.status == ONLINE"
          - "InkLot.status == OPEN"
          - "MailJob.status in {COMMITTED, IN_PRODUCTION}"
        side_effects:
          - "drives MailJob COMMITTED -> IN_PRODUCTION"
          - "increments ProductionRun.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /mail/production-runs/{production_run_id}/complete"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ProductionRun.status == RUNNING"
        side_effects:
          - "the run's slot-minutes and ink stay committed permanently"
          - "increments ProductionRun.version by 1"
      - from: RUNNING
        to: FAILED
        trigger: "POST /mail/production-runs/{production_run_id}/fail"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ProductionRun.status == RUNNING"
        side_effects:
          - "stores spoiled_piece_count; slot-minutes and ink remain committed"
          - "increments ProductionRun.version by 1"
      - from: FAILED
        to: RUNNING
        trigger: "POST /mail/production-runs/{production_run_id}/start"
        actor: ProductionOperator
        preconditions:
          - "ProductionRun.status in {RESERVED, FAILED}"
          - "WritingMachine.status == ONLINE"
          - "InkLot.status == OPEN"
        side_effects:
          - "no additional slot-minutes or ink are drawn on retry"
        note: "retry loop RUNNING -> FAILED -> RUNNING — NON-LINEAR (cycle)"
      - from: RESERVED
        to: VOIDED
        trigger: "POST /mail/production-runs/{production_run_id}/void"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ProductionRun.status in {RESERVED, FAILED}"
        side_effects:
          - "returns planned_ink_ul to InkLot.remaining_ul (compensating invariant ink_volume_conservation)"
          - "releases planned_slot_minutes on the machine-day (compensating invariant machine_slot_conservation)"
          - "when the lot was DEPLETED and remaining_ul rises back to >= INK_SAFETY_RESERVE_UL, the lot returns to OPEN"
          - "increments ProductionRun.version by 1"
      - from: FAILED
        to: VOIDED
        trigger: "POST /mail/production-runs/{production_run_id}/void"
        actor: ProductionOperator
        preconditions:
          - "ProductionRun.status in {RESERVED, FAILED}"
        side_effects:
          - "same releases as the RESERVED -> VOIDED edge"

  # ---- InkLot : consumable with quarantine loop --------------------------
  - entity: InkLot
    axis: status
    initial_state: SEALED
    terminal_states: [DEPLETED]
    transitions:
      - from: SEALED
        to: OPEN
        trigger: "POST /mail/mail-jobs/{mail_job_id}/production-runs (system, first reservation against this lot)"
        actor: system
        preconditions:
          - "InkLot.status == SEALED"
          - "InkLot.remaining_ul - planned_ink_ul >= INK_SAFETY_RESERVE_UL (500)"
        side_effects: ["decrements remaining_ul by the run's planned_ink_ul"]
      - from: OPEN
        to: DEPLETED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/production-runs (system, after the draw)"
        actor: system
        preconditions:
          - "remaining_ul after the draw is exactly INK_SAFETY_RESERVE_UL (500)"
        side_effects: ["no further reservation may draw on this lot"]
      - from: OPEN
        to: QUARANTINED
        trigger: "POST /mail/ink-lots/{ink_lot_id}/quarantine"
        actor: ProductionOperator
        preconditions:
          - "InkLot.status in {SEALED, OPEN}"
        side_effects: ["increments InkLot.version by 1"]
      - from: QUARANTINED
        to: OPEN
        trigger: "POST /mail/ink-lots/{ink_lot_id}/release"
        actor: ProductionOperator
        preconditions:
          - "InkLot.status == QUARANTINED"
        side_effects: ["increments InkLot.version by 1"]
        note: "quarantine loop OPEN -> QUARANTINED -> OPEN — NON-LINEAR (cycle)"
      - from: DEPLETED
        to: OPEN
        trigger: "POST /mail/production-runs/{production_run_id}/void (system)"
        actor: system
        preconditions:
          - "InkLot.status == DEPLETED"
          - "remaining_ul after the return is strictly greater than INK_SAFETY_RESERVE_UL (500)"
        side_effects: ["the lot re-enters the reservable population"]
        note: "compensating edge — NON-LINEAR"

  # ---- DripSchedule ------------------------------------------------------
  - entity: DripSchedule
    axis: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mail/drip-schedules/{drip_schedule_id}/steps (system, on the first accepted step)"
        actor: system
        preconditions: ["DripSchedule.status == DRAFT", "step_count == 0 before this step"]
        side_effects: ["increments DripSchedule.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close (CASCADE C hop 4)"
        actor: system
        preconditions: ["every DripStep on this schedule was cancelled in CASCADE C hop 3"]
        side_effects: ["sets step_count = 0"]

  # ---- DripStep : unschedule loop ----------------------------------------
  - entity: DripStep
    axis: status
    initial_state: PENDING
    terminal_states: [MAILED, CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /mail/drip-schedules/{drip_schedule_id}/steps (system, at creation)"
        actor: system
        preconditions:
          - "MailJob.status in {PROOFED, SCHEDULED}"
          - "calculation mail_date_derivation produced a mail date satisfying every temporal rung"
        side_effects: ["writes computed_mail_date, computed_in_home_date and shifted_days"]
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /mail/drip-steps/{drip_step_id}/release"
        actor: CampaignManager
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "DripStep.status == SCHEDULED"
          - "MailJob.status == COMMITTED"
        side_effects: ["increments DripStep.version by 1"]
      - from: RELEASED
        to: MAILED
        trigger: "POST /mail/mail-jobs/{mail_job_id}/mail (system)"
        actor: system
        preconditions: ["DripStep.status == RELEASED"]
        side_effects: ["increments DripStep.version by 1"]
      - from: SCHEDULED
        to: PENDING
        trigger: "PATCH /mail/templates/{template_id} (CASCADE A hop 7) or POST /mail/campaigns/{campaign_id}/pause"
        actor: system
        preconditions: ["DripStep.status == SCHEDULED"]
        side_effects: ["clears computed_mail_date, computed_in_home_date and shifted_days"]
        note: "unschedule loop SCHEDULED -> PENDING -> SCHEDULED — NON-LINEAR (cycle)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /mail/campaigns/{campaign_id}/billing-close (CASCADE C hop 3)"
        actor: system
        preconditions: ["DripStep.status in {PENDING, SCHEDULED, RELEASED}"]
        side_effects: ["decrements DripSchedule.step_count"]

  # ---- ReprintRequest : branching entitlement fork -----------------------
  - entity: ReprintRequest
    axis: status
    initial_state: REQUESTED
    terminal_states: [FULFILLED, DENIED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /mail/reprint-requests/{reprint_request_id}/fulfill"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ReprintRequest.status == REQUESTED"
          - "ReturnEvent.entitlement == REPRINT"
          - "ListRecord.reprint_count < REPRINT_CAP_PER_CAMPAIGN_PER_RECORD (1)"
        side_effects:
          - "ListRecord moves RETURNED -> QUEUED and reprint_count increments by 1"
          - "increments ReprintRequest.version by 1"
        note: "branch 1 of 2 — divergent side effects"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /mail/reprint-requests/{reprint_request_id}/deny"
        actor: ProductionOperator
        preconditions:
          - "Campaign.write_gate == OPEN"
          - "ReprintRequest.status == REQUESTED"
        side_effects:
          - "stores deny_reason; the ListRecord stays RETURNED and reprint_count is unchanged"
          - "increments ReprintRequest.version by 1"
        note: "branch 2 of 2"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
# write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: run-create-stale-job
    parent_entity: MailJob
    write_endpoint: "POST /mail/mail-jobs/{mail_job_id}/production-runs"
    occ_field: "expected_mail_job_version"
    description: |
      Reserving a ProductionRun against a MailJob whose version has advanced since
      the client last observed it is rejected. A second run may legitimately be
      added to the same job (jobs are split across machine-days), so the write is
      not blocked by any state precondition; only the stale parent version
      distinguishes a client working from an out-of-date view of the job's
      committed piece budget.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: proof-approve-stale-template
    parent_entity: Template
    write_endpoint: "POST /mail/proofs/{proof_id}/approve"
    occ_field: "expected_template_version"
    description: |
      Approving a Proof against a Template whose version has advanced since the
      approver last observed it is rejected. Editing the template legitimately
      supersedes the outstanding approval, so an approval carrying a stale
      template version would bind to content the approver never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reprint-create-stale-record
    parent_entity: ListRecord
    write_endpoint: "POST /mail/reprint-requests"
    occ_field: "expected_list_record_version"
    description: |
      Creating a ReprintRequest against a ListRecord whose version has advanced
      since the client last observed it is rejected. A record can legitimately
      accumulate further return events and NCOA moves that change its entitlement,
      so the create is not blocked by state alone.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: drip-step-create-stale-schedule
    parent_entity: DripSchedule
    write_endpoint: "POST /mail/drip-schedules/{drip_schedule_id}/steps"
    occ_field: "expected_drip_schedule_version"
    description: |
      Adding a DripStep to a DripSchedule whose version has advanced since the
      client last observed it is rejected. New steps legitimately reshape the
      schedule's mail-date spacing, so a client holding a stale view of the
      schedule would compute the minimum-gap check against the wrong neighbours.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: cass_deliverability_tier
    trigger: "POST /mail/mailing-lists/{mailing_list_id}/cass-runs (per record), and POST /mail/list-records/{list_record_id}/ncoa-moves (single record re-derive)"
    algorithm: threshold
    formula: |
      # Deterministic mapping, evaluated top to bottom; the first matching clause wins.
      if record.country_code != DOMESTIC_COUNTRY_CODE:            # "US"
          cass_status = UNMAILABLE ; deliverability_tier = UNMAILABLE
      elif record.dpv_confirmation_code == "Y":
          cass_status = STANDARDIZED ; deliverability_tier = AUTOMATION
      elif record.dpv_confirmation_code in {"D", "S"}:
          cass_status = STANDARDIZED ; deliverability_tier = RETAIL
      else:                                                       # "N" or "U"
          cass_status = UNMAILABLE ; deliverability_tier = UNMAILABLE
    input_set: "Every ListRecord on the list, regardless of its current cass_status or dedupe_status. Structurally inapplicable to EDDM jobs, which own no ListRecord rows."
    constants:
      DOMESTIC_COUNTRY_CODE: "US"
      DPV_TIER_MAP_Y: "AUTOMATION"
      DPV_TIER_MAP_D: "RETAIL"
      DPV_TIER_MAP_S: "RETAIL"
      DPV_TIER_MAP_N: "UNMAILABLE"
      DPV_TIER_MAP_U: "UNMAILABLE"
    precision: "exact enum mapping; no arithmetic"

  - name: dedupe_screen
    trigger: "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs"
    algorithm: chronological
    formula: |
      # Every record on the list is first reset to UNSCREENED, then screened.
      # Grouping key depends on the variant. Within each group, records are
      # ordered by created_at ASC; the final tie-break when two records share an
      # identical created_at is insertion_seq ASC. `id` is never consulted.
      groups = group_by(records, key_of(variant))
      for g in groups:
          ordered = sort(g, by=[created_at ASC, insertion_seq ASC])
          ordered[0].dedupe_status = survivor_label(variant)
          for r in ordered[1:]:
              r.dedupe_status = duplicate_label(variant)
      # Counts recomputed afterwards:
      automation_count = count(tier == AUTOMATION and dedupe_status in {UNIQUE, HOUSEHOLD_HEAD})
      retail_count     = count(tier == RETAIL     and dedupe_status in {UNIQUE, HOUSEHOLD_HEAD})
      duplicate_count  = count(dedupe_status in {DUP_EXACT, DUP_HOUSEHOLD})
      unmailable_count = count(tier == UNMAILABLE)
      mailable_count   = automation_count + retail_count
    input_set: "All ListRecord rows on the list, including UNMAILABLE-tier rows (they are screened but never counted as mailable). The list must be in import_status CASS_RUN or DEDUPED."
    constants:
      EXACT_KEY: "lower(trim(first_name)) + '|' + lower(trim(last_name)) + '|' + lower(trim(address_line1)) + '|' + zip5"
      HOUSEHOLD_KEY: "lower(trim(last_name)) + '|' + lower(trim(address_line1)) + '|' + zip5"
    precision: "integer counts"
    variants:
      - name: EXACT
        when: "request body mode == EXACT"
        difference: "Groups on exact_key. Survivor is labelled UNIQUE, later members DUP_EXACT. A husband and wife at one address are two distinct pieces."
      - name: HOUSEHOLD
        when: "request body mode == HOUSEHOLD"
        difference: "Groups on household_key (family name at address). Survivor is labelled HOUSEHOLD_HEAD, later members DUP_HOUSEHOLD. Collapses a family to one piece, so the same list yields a strictly smaller mailable_count than EXACT whenever any two records share a household_key."

  - name: presort_tier_selection
    trigger: "POST /mail/mail-jobs/{mail_job_id}/estimate and POST /mail/mail-jobs/{mail_job_id}/commit"
    algorithm: tiered_pricing
    formula: |
      A = automation_piece_count for the active postage_estimate variant
      if job.job_kind == EDDM:                         presort_tier = EDDM_ROUTE
      elif job.mail_class == FIRST_CLASS:
          presort_tier = PRESORT_AADC if A >= FIRST_CLASS_AUTOMATION_MIN_PIECES else NO_PRESORT
      else:                                            # MARKETING_MAIL
          if   A >= PRESORT_5D_MIN_PIECES:             presort_tier = PRESORT_5D
          elif A >= PRESORT_AADC_MIN_PIECES:           presort_tier = PRESORT_AADC
          elif A >= PRESORT_MIXED_AADC_MIN_PIECES:     presort_tier = PRESORT_MIXED_AADC
          else:                                        presort_tier = NO_PRESORT
    input_set: "Only AUTOMATION-tier surviving pieces enter A. RETAIL and UNMAILABLE pieces never affect tier selection."
    constants:
      PRESORT_5D_MIN_PIECES: 12
      PRESORT_AADC_MIN_PIECES: 9
      PRESORT_MIXED_AADC_MIN_PIECES: 6
      FIRST_CLASS_AUTOMATION_MIN_PIECES: 6
    precision: "all MIN thresholds are INCLUSIVE (>=); A == 6 selects PRESORT_MIXED_AADC, A == 5 selects NO_PRESORT"

  - name: postage_estimate
    trigger: "POST /mail/mail-jobs/{mail_job_id}/estimate (PROVISIONAL) and POST /mail/mail-jobs/{mail_job_id}/commit (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # ---- surviving population (this is the ONLY difference between variants)
      if variant == PROVISIONAL:
          surviving = [r for r in list.records if r.deliverability_tier in {AUTOMATION, RETAIL}]
      else:  # FINAL
          surviving = [r for r in list.records
                       if r.deliverability_tier in {AUTOMATION, RETAIL}
                       and r.dedupe_status in {UNSCREENED, UNIQUE, HOUSEHOLD_HEAD}]
      A = count(surviving where deliverability_tier == AUTOMATION)
      R = count(surviving where deliverability_tier == RETAIL)

      if job.job_kind == EDDM:
          P    = sum(EddmRouteSelection.selected_piece_count over this job's routes)
          rate = eddm_route_pricing(job.eddm_rate_variant)
          postage_cents = round_half_up(P * rate)                       # single tier, one rounding
      elif job.mail_class == MARKETING_MAIL:
          tier      = presort_tier_selection(A)
          auto_rate = {PRESORT_5D: 23.9, PRESORT_AADC: 28.1,
                       PRESORT_MIXED_AADC: 31.8, NO_PRESORT: 51.0}[tier]
          # PINNED ROUNDING ORDER: round EACH tier subtotal to whole cents, THEN sum.
          auto_subtotal   = round_half_up(A * auto_rate)                # STEP 1
          retail_subtotal = round_half_up(R * MARKETING_RETAIL_TIER_RATE_CENTS)   # STEP 2
          postage_cents   = auto_subtotal + retail_subtotal             # STEP 3
      else:  # FIRST_CLASS
          auto_rate = (FIRST_CLASS_AUTOMATION_RATE_CENTS
                       if A >= FIRST_CLASS_AUTOMATION_MIN_PIECES
                       else FIRST_CLASS_RETAIL_RATE_CENTS)
          auto_subtotal   = round_half_up(A * auto_rate)                # STEP 1
          retail_subtotal = round_half_up(R * FIRST_CLASS_RETAIL_RATE_CENTS)      # STEP 2
          postage_cents   = auto_subtotal + retail_subtotal             # STEP 3
    input_set: "ADDRESSED jobs read the ListRecord rows of job.mailing_list_id. EDDM jobs read the job's EddmRouteSelection rows and own no ListRecord rows at all."
    constants:
      PRESORT_5D_RATE_CENTS: 23.9
      PRESORT_AADC_RATE_CENTS: 28.1
      PRESORT_MIXED_AADC_RATE_CENTS: 31.8
      MARKETING_NO_PRESORT_RATE_CENTS: 51.0
      MARKETING_RETAIL_TIER_RATE_CENTS: 51.6
      FIRST_CLASS_AUTOMATION_RATE_CENTS: 58.0
      FIRST_CLASS_RETAIL_RATE_CENTS: 73.0
      FIRST_CLASS_AUTOMATION_MIN_PIECES: 6
    precision: |
      Rates are cents per piece with one decimal place. Each tier subtotal is rounded to whole cents
      with round_half_up BEFORE the tiers are summed. Summing first and rounding once is WRONG and
      differs by one cent whenever both tier fractions are >= 0.5 and their sum is < 1.5
      (e.g. A=6 @31.8 -> 190.8 and R=1 @51.6 -> 51.6 gives 191 + 52 = 243, not round(242.4) = 242).
    variants:
      - name: PROVISIONAL
        when: "POST /mail/mail-jobs/{mail_job_id}/estimate; written to MailJob.provisional_postage_cents"
        difference: "Counts every CASS-mailable record, ignoring dedupe_status entirely — the quote a customer sees before the list is deduped."
      - name: FINAL
        when: "POST /mail/mail-jobs/{mail_job_id}/commit; written to MailJob.final_postage_cents"
        difference: "Excludes DUP_EXACT and DUP_HOUSEHOLD records. Because removing pieces can drop A below a presort MIN, the FINAL per-piece rate can be HIGHER than the PROVISIONAL one and the FINAL total can exceed the PROVISIONAL total (A=6 -> 243 provisional; after HOUSEHOLD collapse A=5 -> 307 final)."

  - name: eddm_route_pricing
    trigger: "POST /mail/mail-jobs/{mail_job_id}/estimate and POST /mail/mail-jobs/{mail_job_id}/commit, for job_kind == EDDM"
    algorithm: threshold
    formula: |
      for each EddmRouteSelection r on the job:
          r.selected_piece_count = r.residential_piece_count + r.business_piece_count
          r.saturation_pct       = round_half_up(100 * r.selected_piece_count / r.total_deliveries, 2)
      P = sum(r.selected_piece_count)
      # eligibility is evaluated over EVERY route on the job; one failing route fails the job
      if variant == SATURATION:
          eligible = all(r.selected_piece_count == r.total_deliveries for r in routes)
          rate = EDDM_SATURATION_RATE_CENTS
      else:  # HIGH_DENSITY_PLUS
          eligible = all(r.residential_piece_count >= EDDM_HDPLUS_MIN_RESIDENTIAL_PIECES for r in routes)
          rate = EDDM_HDPLUS_RATE_CENTS
      if not eligible: raise ERR_EDDM_VARIANT_INELIGIBLE
      return rate
    input_set: "All EddmRouteSelection rows on the job. Recipient-level data (ListRecord, CASS, dedupe, NCOA) is structurally absent for EDDM jobs."
    constants:
      EDDM_SATURATION_RATE_CENTS: 22.3
      EDDM_HDPLUS_RATE_CENTS: 25.6
      EDDM_HDPLUS_MIN_RESIDENTIAL_PIECES: 3
      EDDM_MIN_PIECES_PER_JOB: 5
      EDDM_MAX_PIECES_PER_JOB_DAY: 50
    precision: "saturation_pct to 2 decimal places, round_half_up; postage rounded once to whole cents"
    variants:
      - name: SATURATION
        when: "MailJob.eddm_rate_variant == SATURATION"
        difference: "Requires 100% coverage of every selected route; prices at 22.3 cents per piece. Two routes of 6 deliveries fully covered (12 pieces) price at 268 cents."
      - name: HIGH_DENSITY_PLUS
        when: "MailJob.eddm_rate_variant == HIGH_DENSITY_PLUS"
        difference: "Requires only 3 residential pieces per route, so it accepts partially covered routes, but prices at 25.6 cents per piece. The same 12 pieces price at 307 cents — a different result from identical route data."

  - name: commit_settlement
    trigger: "POST /mail/mail-jobs/{mail_job_id}/commit"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking: the volume credit is a percentage of a total that itself
      # contains a handling fee derived from postage. Evaluation order is PINNED.
      STEP 1: postage            = final_postage_cents          # from postage_estimate variant FINAL
      STEP 2: handling_fee_cents = HANDLING_BASE_CENTS + ceil(postage * HANDLING_PCT)
      STEP 3: subtotal_cents     = postage + handling_fee_cents
      STEP 4: volume_credit_cents = floor(subtotal_cents * VOLUME_CREDIT_PCT)
                                    if billable_piece_count >= VOLUME_CREDIT_MIN_PIECES else 0
      STEP 5: total_due_cents    = subtotal_cents - volume_credit_cents
      # The credit is NEVER recomputed against total_due_cents; the fixed point is the
      # value produced by STEP 4 exactly once.
    input_set: "The job's own FINAL postage and billable_piece_count. No other job on the campaign contributes."
    constants:
      HANDLING_BASE_CENTS: 250
      HANDLING_PCT: 0.08
      VOLUME_CREDIT_PCT: 0.05
      VOLUME_CREDIT_MIN_PIECES: 6
    precision: "ceil on the handling percentage, floor on the volume credit, whole cents throughout; VOLUME_CREDIT_MIN_PIECES boundary is INCLUSIVE (6 pieces earns the credit, 5 does not)"

  - name: production_capacity_plan
    trigger: "POST /mail/mail-jobs/{mail_job_id}/production-runs"
    algorithm: aggregation
    formula: |
      chars                 = piece_count * Template.character_count
      planned_write_minutes = ceil(chars / HandwritingStyle.chars_per_minute)
      setup_passes          = SINGLE_PASS_SETUP_PASSES if capacity_variant == SINGLE_PASS
                              else SPLIT_RUN_SETUP_PASSES
      planned_slot_minutes  = planned_write_minutes + RUN_SETUP_MINUTES * setup_passes
      planned_ink_ul        = ceil(chars * HandwritingStyle.ink_ul_per_1000_chars / 1000)

      committed_minutes = sum(planned_slot_minutes over ProductionRun rows with the same
                              machine_id and the same run_date and status in
                              {RESERVED, RUNNING, COMPLETED, FAILED})
      if committed_minutes + planned_slot_minutes > WritingMachine.daily_capacity_minutes:
          raise ERR_MACHINE_CAPACITY_EXCEEDED
      if InkLot.remaining_ul - planned_ink_ul < INK_SAFETY_RESERVE_UL:
          raise ERR_INK_INSUFFICIENT
    input_set: "ProductionRun rows on the same machine and the same run_date with status in {RESERVED, RUNNING, COMPLETED, FAILED}; VOIDED runs are excluded and their minutes are released."
    constants:
      RUN_SETUP_MINUTES: 12
      SINGLE_PASS_SETUP_PASSES: 1
      SPLIT_RUN_SETUP_PASSES: 2
      INK_SAFETY_RESERVE_UL: 500
    precision: "ceil on both write minutes and ink microlitres; capacity comparison uses strict > for rejection (exactly filling the day is allowed); the ink reserve comparison uses strict < for rejection (landing exactly on 500 is allowed and marks the lot DEPLETED)"
    variants:
      - name: SINGLE_PASS
        when: "request body capacity_variant == SINGLE_PASS"
        difference: "Charges one setup: planned_slot_minutes = write_minutes + 12. A 6-piece, 400-character job in a 4000 chars-per-minute style costs 13 slot-minutes."
      - name: SPLIT_RUN
        when: "request body capacity_variant == SPLIT_RUN"
        difference: "Charges two setups: planned_slot_minutes = write_minutes + 24. The identical 6-piece job costs 25 slot-minutes — the same pieces, a different machine-day footprint, which can flip the capacity check on a machine with daily_capacity_minutes = 20."

  - name: mail_date_derivation
    trigger: "POST /mail/mail-jobs/{mail_job_id}/schedule and POST /mail/drip-schedules/{drip_schedule_id}/steps"
    algorithm: interval_merge
    formula: |
      transit_days = {FIRST_CLASS: TRANSIT_DAYS_FIRST_CLASS,
                      MARKETING_MAIL: TRANSIT_DAYS_MARKETING_MAIL,
                      EDDM: TRANSIT_DAYS_EDDM}[MailJob.mail_class]
      current_date = date_part(current_utc)

      STEP 1 (rung 27): if anchor_date < current_date: raise ERR_IN_HOME_DATE_PAST
      STEP 2: raw_mail_date = anchor_date - transit_days   if variant == ANCHOR_IN_HOME
              raw_mail_date = anchor_date                  if variant == ANCHOR_MAIL_DATE
      STEP 3 (rung 28): shift = 0
              while exists BlackoutDate(blackout_date == raw_mail_date):
                  raw_mail_date = raw_mail_date - 1 day ; shift = shift + 1
                  if shift > BLACKOUT_SHIFT_MAX_DAYS: raise ERR_BLACKOUT_UNRESOLVABLE
      STEP 4 (rung 29): if raw_mail_date < current_date + PRODUCTION_LEAD_DAYS:
                  raise ERR_MAIL_DATE_UNREACHABLE
      outputs: computed_mail_date = raw_mail_date
               computed_in_home_date = raw_mail_date + transit_days
               shifted_days = shift
    input_set: "All BlackoutDate rows (the calendar is global). The clock is the logical clock, default 2026-05-01T00:00:00Z."
    constants:
      TRANSIT_DAYS_FIRST_CLASS: 3
      TRANSIT_DAYS_MARKETING_MAIL: 10
      TRANSIT_DAYS_EDDM: 12
      PRODUCTION_LEAD_DAYS: 3
      BLACKOUT_SHIFT_MAX_DAYS: 5
    precision: |
      Calendar-day arithmetic, no time component. STEP 1 uses strict < (an anchor equal to today
      passes). STEP 3's cap is INCLUSIVE: a shift of exactly 5 days is accepted, 6 raises.
      STEP 4 uses strict < (a mail date landing exactly on current_date + 3 is accepted).
      Ordering matters: an anchor date in the past raises ERR_IN_HOME_DATE_PAST even when the derived
      mail date would also be unreachable, which is how the two errors stay distinguishable.
    variants:
      - name: ANCHOR_IN_HOME
        when: "DripSchedule.anchor_variant == ANCHOR_IN_HOME, and always for POST /mail/mail-jobs/{mail_job_id}/schedule, which reads MailJob.target_in_home_date"
        difference: "Treats the supplied date as the desired in-home date and works backwards through transit. Anchor 2026-06-15 on MARKETING_MAIL yields mail date 2026-06-05."
      - name: ANCHOR_MAIL_DATE
        when: "DripSchedule.anchor_variant == ANCHOR_MAIL_DATE"
        difference: "Treats the identical supplied date as the drop date and derives in-home forwards. Anchor 2026-06-15 on MARKETING_MAIL yields mail date 2026-06-15 and in-home 2026-06-25 — the same input, a mail date 10 days apart."

  - name: return_settlement
    trigger: "POST /mail/list-records/{list_record_id}/returns"
    algorithm: projection
    formula: |
      STEP 1: entitlement = REPRINT if ListRecord.move_status == MOVE_APPLIED else REFUND
      STEP 2: return_fee_cents = {FIRST_CLASS: RETURN_FEE_CENTS_FIRST_CLASS,
                                  MARKETING_MAIL: RETURN_FEE_CENTS_MARKETING_MAIL}[job.mail_class]
      STEP 3: if entitlement == REFUND and return_fee_cents > 0:
                  append PostageLedgerEntry(entry_type=FORFEIT, amount_cents=return_fee_cents)
                  Account.permit_balance_cents -= return_fee_cents
              # REPRINT never moves money; it consumes the record's single reprint allowance instead.
    input_set: "The returned record and the MailJob named by ListRecord.last_mail_job_id. EDDM jobs never reach this calculation — they own no ListRecord rows."
    constants:
      RETURN_FEE_CENTS_FIRST_CLASS: 0
      RETURN_FEE_CENTS_MARKETING_MAIL: 89
      REPRINT_CAP_PER_CAMPAIGN_PER_RECORD: 1
    precision: "whole cents"
    variants:
      - name: REPRINT_ENTITLEMENT
        when: "ListRecord.move_status == MOVE_APPLIED at the moment the return is recorded"
        difference: "No FORFEIT row is written; the account balance is unchanged. The record may be reprinted at most once per campaign."
      - name: REFUND_ENTITLEMENT
        when: "ListRecord.move_status in {NONE, MOVE_NO_FORWARD}"
        difference: "A FORFEIT row of return_fee_cents is written and the account balance drops. On FIRST_CLASS the fee is 0, so a row is NOT written at all — the class decides whether the forfeit exists."

  - name: campaign_postage_reconciliation
    trigger: "GET /mail/campaigns/{campaign_id}/postage-reconciliation"
    algorithm: projection
    formula: |
      rows = PostageLedgerEntry where campaign_id == this campaign
      draw_cents    = sum(amount_cents where entry_type == DRAW)
      refund_cents  = sum(amount_cents where entry_type == REFUND)
      forfeit_cents = sum(amount_cents where entry_type == FORFEIT)
      net_postage_cents = draw_cents - refund_cents + forfeit_cents
      # Conservation check surfaced by the same endpoint:
      account_delta_cents = -(draw_cents) + refund_cents - forfeit_cents
    input_set: "Every PostageLedgerEntry row attributed to the campaign, in created_at ASC order. TOPUP rows carry campaign_id null and are excluded."
    constants: {}
    precision: "whole cents; integer sums only"
    variants:
      - name: LEDGER_REPLAY
        when: "AUTHORITATIVE — this is what GET /mail/campaigns/{campaign_id}/postage-reconciliation MUST return"
        difference: "Recomputes from ledger rows, so FORFEIT rows created by returns are included."
      - name: COUNTER_SNAPSHOT
        when: "the tempting shortcut: sum MailJob.total_due_cents over jobs whose status is not DRAFT"
        difference: "Omits FORFEIT rows entirely and misses refunds already folded back into the jobs. A campaign with one committed job of 553 cents and one MARKETING_MAIL return reconciles to 642 under LEDGER_REPLAY but 553 under COUNTER_SNAPSHOT — an 89-cent gap that only the partition-respecting replay gets right."

  - name: deliverability_partition_report
    trigger: "GET /mail/campaigns/{campaign_id}/deliverability-report"
    algorithm: aggregation
    formula: |
      for each ADDRESSED MailJob on the campaign, over the records of job.mailing_list_id:
          automation_pieces = count(tier == AUTOMATION and dedupe_status in {UNSCREENED, UNIQUE, HOUSEHOLD_HEAD})
          retail_pieces     = count(tier == RETAIL     and dedupe_status in {UNSCREENED, UNIQUE, HOUSEHOLD_HEAD})
          unmailable_pieces = count(tier == UNMAILABLE)
          duplicate_pieces  = count(dedupe_status in {DUP_EXACT, DUP_HOUSEHOLD})
      # CONSERVATION INVARIANT (partition):
      #   automation_pieces + retail_pieces + unmailable_pieces + duplicate_pieces == record_count
      # An UNMAILABLE record that is ALSO a duplicate is counted ONLY in unmailable_pieces —
      # the unmailable bucket is evaluated first and the buckets are mutually exclusive.
      eddm_pieces = sum(MailJob.eddm_piece_count over EDDM jobs on the campaign)
      returned_pieces = count(ReturnEvent rows on the campaign's jobs)
    input_set: "All MailJob rows on the campaign, partitioned by job_kind; ADDRESSED jobs contribute recipient-level buckets, EDDM jobs contribute only eddm_pieces."
    constants: {}
    precision: "integer counts"

  - name: machine_day_capacity_utilization
    trigger: "POST /mail/mail-jobs/{mail_job_id}/production-runs (enforcement) and GET /mail/production-runs (observation)"
    algorithm: aggregation
    formula: |
      committed_minutes(machine, run_date) =
          sum(ProductionRun.planned_slot_minutes
              where machine_id == machine and run_date == date
                and status in {RESERVED, RUNNING, COMPLETED, FAILED})
      # CONSERVATION INVARIANT (machine slot-minutes):
      #   committed_minutes(machine, date) <= WritingMachine.daily_capacity_minutes  for every (machine, date)
      # Voiding a run must restore committed_minutes to its pre-reservation value exactly.
    input_set: "ProductionRun rows keyed on (machine_id, run_date); VOIDED runs are excluded."
    constants:
      DEFAULT_MACHINE_DAILY_CAPACITY_MINUTES: 480
    precision: "integer minutes; the day is a discrete bucket, not an interval — two runs on the same date always contend regardless of clock time"

  - name: ink_lot_conservation
    trigger: "POST /mail/mail-jobs/{mail_job_id}/production-runs and POST /mail/production-runs/{production_run_id}/void"
    algorithm: aggregation
    formula: |
      InkLot.remaining_ul == InkLot.initial_volume_ul
          - sum(ProductionRun.planned_ink_ul
                where ink_lot_id == lot and status in {RESERVED, RUNNING, COMPLETED, FAILED})
      # CONSERVATION INVARIANT (ink volume): drawing then voiding the same run must
      # return remaining_ul to exactly its pre-draw value, with no drift.
    input_set: "ProductionRun rows drawing on the lot; VOIDED runs release their draw."
    constants:
      INK_SAFETY_RESERVE_UL: 500
    precision: "integer microlitres"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — a TOTAL ORDER over 41 rungs.
# Every rung carries a distinct integer priority. For any single request at most
# one rung can be the first to fail; the error it names is the response.
# The two global write-gate rungs (9 and 10) sit ABOVE every per-endpoint state
# gate, so a frozen campaign pre-empts state, kind, temporal, capacity and
# fiscal rungs alike. They sit BELOW existence and request-shape rungs, so a
# malformed or dangling request is still reported as such.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header present whenever X-User-Role is an entity_backed role (AccountOwner)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints invoked as AccountOwner"

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's declared roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "every referenced resource exists — path parameters first, left to right, then body foreign keys in the order they are listed in the endpoint's §1.5 input"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_MAIL_JOB_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "when acting as AccountOwner, X-User-ID equals the Account.id that owns the resolved resource (via Campaign.account_id, MailingList.account_id, Template.account_id, or the account reached from MailJob -> Campaign -> account_id)"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints invoked as AccountOwner"

  - priority: 6
    category: business_constraint
    check: "every field marked required in the endpoint's §1.5 input is present and of the declared JSON type; date and datetime strings parse as ISO 8601"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "every enum-valued field carries a member of its declared set. This routing is EXHAUSTIVE and closed: the fields that route here are exactly Account.status, Campaign lifecycle/compliance/billing status inputs, HandwritingStyle.pen_type, HandwritingStyle.ink_type, Template.envelope_style, ListRecord.dpv_confirmation_code, the ncoa-moves new_dpv_confirmation_code, MailJob.job_kind, MailJob.mail_class, MailJob.eddm_rate_variant, MailingList dedupe-run mode, ProductionRun.capacity_variant, DripSchedule.anchor_variant, InkLot.ink_type, WritingMachine.status, ReturnEvent.return_reason. No other field routes here; every other malformed value routes to ERR_VALIDATION at rung 6."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting one of the listed enum fields"

  - priority: 8
    category: business_constraint
    check: "every numeric field is inside its declared range: Template.character_count in [1, 2000]; ProductionRun.piece_count >= 1; EddmRouteSelection.total_deliveries >= 1 and residential_piece_count >= 0 and business_piece_count >= 0; postage top-up amount_cents >= 1; DripStep.sequence_no >= 1; WritingMachine.daily_capacity_minutes >= 1; InkLot.initial_volume_ul >= 1; HandwritingStyle.chars_per_minute >= 1 and ink_ul_per_1000_chars > 0"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all endpoints accepting one of the listed numeric fields"

  - priority: 9
    category: business_safety
    check: "GLOBAL WRITE GATE A — the campaign reached from this request (directly, or through MailJob -> Campaign, DripSchedule -> Campaign, DripStep -> MailJob -> Campaign, Proof -> MailJob -> Campaign, ProductionRun -> MailJob -> Campaign, ReprintRequest.campaign_id, or ListRecord -> last_mail_job_id -> Campaign) has compliance_status == CLEAR. The ONLY exempt write endpoint is POST /mail/campaigns/{campaign_id}/compliance-releases."
    error_id: ERR_CAMPAIGN_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "every write endpoint whose request resolves to a campaign, except POST /mail/campaigns/{campaign_id}/compliance-releases"

  - priority: 10
    category: business_safety
    check: "GLOBAL WRITE GATE B — the campaign reached from this request has billing_status == OPEN. No write endpoint is exempt, including compliance-releases."
    error_id: ERR_CAMPAIGN_BILLING_CLOSED
    http_status: 409
    applies_to: "every write endpoint whose request resolves to a campaign"

  - priority: 11
    category: state
    check: "the OCC field named by the matching §1.2.1 rule equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs, POST /mail/proofs/{proof_id}/approve, POST /mail/reprint-requests, POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 12
    category: state
    check: "the target MailingList is not LOCKED"
    error_id: ERR_LIST_LOCKED
    http_status: 409
    applies_to: "POST /mail/mailing-lists/{mailing_list_id}/records, POST /mail/mailing-lists/{mailing_list_id}/cass-runs, POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs, POST /mail/mailing-lists/{mailing_list_id}/lock, POST /mail/list-records/{list_record_id}/ncoa-moves"

  - priority: 13
    category: business_constraint
    check: "operations that presuppose an individually addressed recipient are refused when the resolved MailJob.job_kind == EDDM. An EDDM job owns no ListRecord rows and its saturation pieces are not hand-written one by one, so robot-pen production runs are structurally inapplicable to it, as are returns, NCOA moves and reprints reached through it."
    error_id: ERR_EDDM_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs, POST /mail/list-records/{list_record_id}/returns, POST /mail/list-records/{list_record_id}/ncoa-moves, POST /mail/reprint-requests"

  - priority: 14
    category: business_constraint
    check: "job_kind and its dependent fields agree: ADDRESSED requires mailing_list_id non-null, mail_class in {FIRST_CLASS, MARKETING_MAIL} and eddm_rate_variant null; EDDM requires mailing_list_id null, mail_class == EDDM and eddm_rate_variant non-null; POST /mail/mail-jobs/{mail_job_id}/eddm-routes requires job_kind == EDDM"
    error_id: ERR_JOB_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /mail/mail-jobs, POST /mail/mail-jobs/{mail_job_id}/eddm-routes"

  - priority: 15
    category: state
    check: "Campaign.lifecycle_status permits this operation (activate needs DRAFT or PAUSED; pause needs ACTIVE; billing-close needs ACTIVE or PAUSED; compliance-holds needs compliance_status CLEAR; compliance-releases needs compliance_status HOLD)"
    error_id: ERR_CAMPAIGN_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/campaigns/{campaign_id}/activate, /pause, /compliance-holds, /compliance-releases, /billing-close"

  - priority: 16
    category: state
    check: "MailingList.import_status permits this operation (records add needs UPLOADED; cass-runs needs UPLOADED, CASS_RUN or DEDUPED; dedupe-runs needs CASS_RUN or DEDUPED; lock needs DEDUPED with mailable_count >= 1; creating an ADDRESSED MailJob needs CASS_RUN, DEDUPED or LOCKED; committing an ADDRESSED MailJob needs LOCKED)"
    error_id: ERR_LIST_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/mailing-lists/{mailing_list_id}/records, /cass-runs, /dedupe-runs, /lock, POST /mail/mail-jobs, POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 17
    category: state
    check: "MailJob.status permits this operation (estimate needs DRAFT or PROOFED; schedule needs DRAFT or PROOFED — a DRAFT job is admitted at this rung so that the approval rungs 24 and 25 can report WHY it cannot be scheduled; commit needs SCHEDULED; void needs COMMITTED; mail needs IN_PRODUCTION for ADDRESSED jobs and COMMITTED for EDDM jobs, which never pass through robot-pen production; production-runs create needs COMMITTED; eddm-routes create needs DRAFT)"
    error_id: ERR_MAIL_JOB_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/estimate, /schedule, /commit, /void, /mail, /production-runs, /eddm-routes"

  - priority: 18
    category: state
    check: "Proof.status permits this operation (submit needs DRAFT or REJECTED; approve needs SUBMITTED; reject needs SUBMITTED)"
    error_id: ERR_PROOF_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/proofs/{proof_id}/submit, /approve, /reject"

  - priority: 19
    category: state
    check: "ProductionRun.status permits this operation (start needs RESERVED or FAILED; complete needs RUNNING; fail needs RUNNING; void needs RESERVED or FAILED)"
    error_id: ERR_RUN_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/production-runs/{production_run_id}/start, /complete, /fail, /void"

  - priority: 20
    category: state
    check: "the remaining state gates: DripStep.status == SCHEDULED for release; DripSchedule.status != CANCELLED for step creation; ReprintRequest.status == REQUESTED for fulfill and deny"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /mail/drip-steps/{drip_step_id}/release, POST /mail/drip-schedules/{drip_schedule_id}/steps, POST /mail/reprint-requests/{reprint_request_id}/fulfill, /deny"

  - priority: 21
    category: business_referential
    check: "the InkLot named by a run reservation has status in {SEALED, OPEN}; a start requires status == OPEN"
    error_id: ERR_INK_LOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs, POST /mail/production-runs/{production_run_id}/start"

  - priority: 22
    category: business_referential
    check: "the WritingMachine named by a run reservation or start has status == ONLINE"
    error_id: ERR_MACHINE_OFFLINE
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs, POST /mail/production-runs/{production_run_id}/start"

  - priority: 23
    category: business_safety
    check: "SEGREGATION OF DUTIES — the X-User-ID approving a proof differs from Proof.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mail/proofs/{proof_id}/approve"

  - priority: 24
    category: business_referential
    check: "the MailJob has at least one Proof that ever reached APPROVED. Failing this rung means no approval was ever granted."
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/schedule, POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 25
    category: business_referential
    check: "the job's most recent approval is still live: its Proof.status is APPROVED (not SUPERSEDED), its pinned_template_version equals Template.version_no, and current_utc < Proof.expires_at. Failing this rung means an approval existed but is stale — distinguishable from rung 24."
    error_id: ERR_PROOF_APPROVAL_STALE
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/schedule, POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 26
    category: business_constraint
    check: "scoped uniqueness holds: Account.permit_number globally, WritingMachine.machine_code globally, InkLot.lot_code globally, BlackoutDate.blackout_date globally, EddmRouteSelection.route_code per mail_job_id, DripStep.sequence_no per drip_schedule_id"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /mail/accounts, POST /mail/machines, POST /mail/ink-lots, POST /mail/blackout-dates, POST /mail/mail-jobs/{mail_job_id}/eddm-routes, POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 27
    category: business_temporal
    check: "the supplied anchor / target in-home date is not strictly before the logical clock's current date"
    error_id: ERR_IN_HOME_DATE_PAST
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/schedule, POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 28
    category: business_temporal
    check: "the backwards blackout walk terminates within BLACKOUT_SHIFT_MAX_DAYS (5) calendar days"
    error_id: ERR_BLACKOUT_UNRESOLVABLE
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/schedule, POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 29
    category: business_temporal
    check: "the derived mail date is not earlier than current_date + PRODUCTION_LEAD_DAYS (3). Distinct from rung 27: here the REQUESTED date is in the future but the DERIVED drop date is not reachable."
    error_id: ERR_MAIL_DATE_UNREACHABLE
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/schedule, POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 30
    category: business_temporal
    check: "the new step's computed_mail_date differs from every existing non-CANCELLED sibling step's computed_mail_date by at least DRIP_MIN_GAP_DAYS (2) calendar days"
    error_id: ERR_DRIP_GAP_TOO_SMALL
    http_status: 422
    applies_to: "POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 31
    category: business_constraint
    check: "the schedule holds fewer than DRIP_MAX_STEPS (8) non-CANCELLED steps before this one is added"
    error_id: ERR_DRIP_STEP_LIMIT
    http_status: 409
    applies_to: "POST /mail/drip-schedules/{drip_schedule_id}/steps"

  - priority: 32
    category: business_referential
    check: "InkLot.ink_type equals the HandwritingStyle.ink_type of the job's Template"
    error_id: ERR_INK_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs"

  - priority: 33
    category: business_constraint
    check: "the job's declared eddm_rate_variant is eligible for every route on the job per calculation eddm_route_pricing"
    error_id: ERR_EDDM_VARIANT_INELIGIBLE
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/estimate, POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 34
    category: business_constraint
    check: "the EDDM job's total selected pieces lie within [EDDM_MIN_PIECES_PER_JOB (5), EDDM_MAX_PIECES_PER_JOB_DAY (50)], both bounds INCLUSIVE"
    error_id: ERR_EDDM_PIECE_BOUNDS
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 35
    category: business_constraint
    check: "the job has at least one billable piece — for ADDRESSED jobs mailable survivors, for EDDM jobs selected route pieces"
    error_id: ERR_NO_MAILABLE_PIECES
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/estimate, POST /mail/mail-jobs/{mail_job_id}/commit"

  - priority: 36
    category: business_constraint
    check: "the run's piece_count does not exceed MailJob.billable_piece_count minus the pieces already reserved by this job's non-VOIDED runs"
    error_id: ERR_RUN_PIECES_EXCEED_JOB
    http_status: 422
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs"

  - priority: 37
    category: business_referential
    check: "the cited ReturnEvent.entitlement is REPRINT"
    error_id: ERR_REPRINT_NOT_ENTITLED
    http_status: 409
    applies_to: "POST /mail/reprint-requests, POST /mail/reprint-requests/{reprint_request_id}/fulfill"

  - priority: 38
    category: business_constraint
    check: "ListRecord.reprint_count is strictly below REPRINT_CAP_PER_CAMPAIGN_PER_RECORD (1) for the cited campaign"
    error_id: ERR_REPRINT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /mail/reprint-requests/{reprint_request_id}/fulfill"

  - priority: 39
    category: business_constraint
    check: "committed slot-minutes on (machine_id, run_date) plus this run's planned_slot_minutes does not exceed WritingMachine.daily_capacity_minutes"
    error_id: ERR_MACHINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs"

  - priority: 40
    category: business_constraint
    check: "InkLot.remaining_ul minus this run's planned_ink_ul is not below INK_SAFETY_RESERVE_UL (500)"
    error_id: ERR_INK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/production-runs"

  - priority: 41
    category: business_fiscal
    check: "Account.permit_balance_cents is at least the job's total_due_cents"
    error_id: ERR_INSUFFICIENT_PERMIT_BALANCE
    http_status: 402
    applies_to: "POST /mail/mail-jobs/{mail_job_id}/commit"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (78 endpoints)
# ---------------------------------------------------------------------------
endpoints:
  # ---- Test-driving clock ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent expiry, in-home-date and lead-time evaluation reads the new instant"]

  # ---- Accounts & postage escrow ----------------------------------------
  - method: POST
    path: "/mail/accounts"
    description: "Register a mailer account with a USPS permit."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "permit_number", "status?"]
    output: Account
    side_effects: ["permit_balance_cents starts at 0"]

  - method: GET
    path: "/mail/accounts/{account_id}"
    description: "Read one account, including its live permit escrow balance."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/mail/accounts/{account_id}/postage-topups"
    description: "Add funds to the permit escrow balance."
    roles: [PlatformAdmin, AccountOwner]
    code: 201
    input: ["amount_cents", "reason?"]
    output: Account
    side_effects:
      - "appends a TOPUP PostageLedgerEntry with campaign_id null and mail_job_id null"
      - "increments Account.permit_balance_cents and lifetime_topup_cents by amount_cents"
      - "increments Account.version by 1"

  # ---- Blackout calendar -------------------------------------------------
  - method: POST
    path: "/mail/blackout-dates"
    description: "Add a global no-drop calendar date."
    roles: [PlatformAdmin, CampaignManager]
    code: 201
    input: ["blackout_date", "reason"]
    output: BlackoutDate
    side_effects: ["every subsequent mail_date_derivation walks backwards over this date"]

  - method: GET
    path: "/mail/blackout-dates"
    description: "List the blackout calendar."
    roles: [PlatformAdmin, CampaignManager, ProductionOperator]
    code: 200
    input: ["blackout_date?", "limit?", "offset?"]
    output: BlackoutDate[]
    side_effects: []

  # ---- Handwriting styles ------------------------------------------------
  - method: POST
    path: "/mail/handwriting-styles"
    description: "Register a handwriting style bound to a pen and ink type."
    roles: [PlatformAdmin, ProductionOperator]
    code: 201
    input: ["name", "pen_type", "ink_type", "chars_per_minute", "ink_ul_per_1000_chars"]
    output: HandwritingStyle
    side_effects: []

  # ---- Writing machines --------------------------------------------------
  - method: POST
    path: "/mail/machines"
    description: "Register a robot-pen machine with a daily slot-minute capacity."
    roles: [PlatformAdmin, ProductionOperator]
    code: 201
    input: ["machine_code", "daily_capacity_minutes?", "status?"]
    output: WritingMachine
    side_effects: []

  - method: GET
    path: "/mail/machines/{machine_id}"
    description: "Read one machine."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: WritingMachine
    side_effects: []

  # ---- Ink lots ----------------------------------------------------------
  - method: POST
    path: "/mail/ink-lots"
    description: "Register a sealed ink lot of a given formulation and volume."
    roles: [PlatformAdmin, ProductionOperator]
    code: 201
    input: ["lot_code", "ink_type", "initial_volume_ul"]
    output: InkLot
    side_effects: ["remaining_ul is initialised to initial_volume_ul and status to SEALED"]

  - method: GET
    path: "/mail/ink-lots/{ink_lot_id}"
    description: "Read one ink lot, including remaining volume."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: InkLot
    side_effects: []

  - method: POST
    path: "/mail/ink-lots/{ink_lot_id}/quarantine"
    description: "Quarantine a lot so no run may reserve against it."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: ["reason?"]
    output: InkLot
    side_effects: ["moves InkLot SEALED/OPEN -> QUARANTINED", "increments InkLot.version by 1"]

  - method: POST
    path: "/mail/ink-lots/{ink_lot_id}/release"
    description: "Release a quarantined lot back into the reservable population."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: InkLot
    side_effects: ["moves InkLot QUARANTINED -> OPEN", "increments InkLot.version by 1"]

  # ---- Campaigns ---------------------------------------------------------
  - method: POST
    path: "/mail/campaigns"
    description: "Create a campaign under an account."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 201
    input: ["account_id", "name"]
    output: Campaign
    side_effects: ["lifecycle_status DRAFT, compliance_status CLEAR, billing_status OPEN, write_gate OPEN"]

  - method: GET
    path: "/mail/campaigns/{campaign_id}"
    description: "Read one campaign with all three status axes and its derived write_gate."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer, ListOperator, ProductionOperator]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/mail/campaigns"
    description: "List campaigns, optionally filtered by owning account."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: ["account_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: POST
    path: "/mail/campaigns/{campaign_id}/activate"
    description: "Move a campaign DRAFT -> ACTIVE or PAUSED -> ACTIVE."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["increments Campaign.version by 1"]

  - method: POST
    path: "/mail/campaigns/{campaign_id}/pause"
    description: "Move a campaign ACTIVE -> PAUSED and unschedule its SCHEDULED drip steps."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "every DripStep on this campaign's schedules with status == SCHEDULED moves to PENDING"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/mail/campaigns/{campaign_id}/compliance-holds"
    description: "Place a compliance hold. Sets write_gate FROZEN, pre-empting rungs 11 and below on every endpoint that resolves to this campaign."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["hold_reason"]
    output: Campaign
    side_effects: ["sets compliance_status = HOLD and write_gate = FROZEN", "increments Campaign.version by 1"]

  - method: POST
    path: "/mail/campaigns/{campaign_id}/compliance-releases"
    description: "Lift a compliance hold. The ONLY write endpoint exempt from ladder rung 9."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["sets compliance_status = CLEAR and write_gate = OPEN when billing_status is still OPEN", "increments Campaign.version by 1"]

  - method: POST
    path: "/mail/campaigns/{campaign_id}/billing-close"
    description: "Close billing on a campaign. Freezes it permanently and runs CASCADE C."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "sets billing_status = CLOSED, lifecycle_status = COMPLETED and write_gate = FROZEN"
      - "CASCADE C hop 2: MAILED MailJobs -> CLOSED, and their MAILED ListRecords -> DELIVERED_ASSUMED"
      - "CASCADE C hop 3: DripSteps on those jobs -> CANCELLED"
      - "CASCADE C hop 4: DripSchedules left with step_count 0 -> CANCELLED"
      - "increments Campaign.version by 1"

  - method: GET
    path: "/mail/campaigns/{campaign_id}/postage-reconciliation"
    description: "Recompute postage money movement for the campaign from PostageLedgerEntry rows (calculation campaign_postage_reconciliation, variant LEDGER_REPLAY)."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: []
    output: "{ draw_cents: integer, refund_cents: integer, forfeit_cents: integer, net_postage_cents: integer, account_delta_cents: integer, row_count: integer }"
    side_effects: []

  - method: GET
    path: "/mail/campaigns/{campaign_id}/deliverability-report"
    description: "Partitioned piece counts across the campaign's jobs (calculation deliverability_partition_report)."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ListOperator]
    code: 200
    input: []
    output: "{ automation_pieces: integer, retail_pieces: integer, unmailable_pieces: integer, duplicate_pieces: integer, record_total: integer, eddm_pieces: integer, returned_pieces: integer }"
    side_effects: []

  # ---- Templates ---------------------------------------------------------
  - method: POST
    path: "/mail/templates"
    description: "Create a note template bound to a handwriting style."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 201
    input: ["account_id", "handwriting_style_id", "name", "body_text", "character_count", "envelope_style?"]
    output: Template
    side_effects: ["version_no starts at 1"]

  - method: GET
    path: "/mail/templates/{template_id}"
    description: "Read one template, including its content version_no and its OCC version."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ProductionOperator]
    code: 200
    input: []
    output: Template
    side_effects: []

  - method: GET
    path: "/mail/templates"
    description: "List templates filtered by owning account or handwriting style."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ProductionOperator]
    code: 200
    input: ["account_id?", "handwriting_style_id?", "limit?", "offset?"]
    output: Template[]
    side_effects: []

  - method: PATCH
    path: "/mail/templates/{template_id}"
    description: "Edit template content. CASCADE A origin: bumps version_no, supersedes outstanding approvals and unwinds every downstream commitment."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 200
    input: ["body_text?", "character_count?", "envelope_style?"]
    output: Template
    side_effects:
      - "CASCADE A hop 1: increments Template.version_no by 1 when body_text or character_count changed"
      - "CASCADE A hop 2: every APPROVED Proof on this template -> SUPERSEDED"
      - "CASCADE A hop 3: every MailJob whose approval was superseded and whose status is PROOFED, SCHEDULED or COMMITTED -> DRAFT"
      - "CASCADE A hop 4: every RESERVED ProductionRun on those jobs -> VOIDED"
      - "CASCADE A hop 5: each voided run returns planned_ink_ul to its InkLot and releases planned_slot_minutes on its machine-day"
      - "CASCADE A hop 6: each job that left COMMITTED appends a REFUND PostageLedgerEntry of drawn_postage_cents and raises Account.permit_balance_cents"
      - "CASCADE A hop 7: every SCHEDULED DripStep on those jobs -> PENDING"
      - "increments Template.version by 1"

  # ---- Mailing lists -----------------------------------------------------
  - method: POST
    path: "/mail/mailing-lists"
    description: "Create an empty mailing list in import_status UPLOADED."
    roles: [PlatformAdmin, AccountOwner, ListOperator]
    code: 201
    input: ["account_id", "name"]
    output: MailingList
    side_effects: ["record_count and every derived count start at 0"]

  - method: GET
    path: "/mail/mailing-lists/{mailing_list_id}"
    description: "Read one mailing list with its live partition counts."
    roles: [PlatformAdmin, AccountOwner, ListOperator, CampaignManager]
    code: 200
    input: []
    output: MailingList
    side_effects: []

  - method: GET
    path: "/mail/mailing-lists"
    description: "List mailing lists filtered by owning account."
    roles: [PlatformAdmin, AccountOwner, ListOperator, CampaignManager]
    code: 200
    input: ["account_id?", "import_status?", "limit?", "offset?"]
    output: MailingList[]
    side_effects: []

  - method: POST
    path: "/mail/mailing-lists/{mailing_list_id}/records"
    description: "Import one recipient record. Allowed only while the list is UPLOADED."
    roles: [PlatformAdmin, ListOperator]
    code: 201
    input: ["first_name", "last_name", "address_line1", "address_line2?", "city", "state_code", "zip5", "country_code?", "dpv_confirmation_code?"]
    output: ListRecord
    side_effects:
      - "assigns insertion_seq as the next 1-based position on this list"
      - "computes exact_key and household_key"
      - "increments MailingList.record_count and MailingList.version by 1"

  - method: POST
    path: "/mail/mailing-lists/{mailing_list_id}/cass-runs"
    description: "Run CASS/DPV standardization over every record, deriving cass_status and deliverability_tier and discarding any prior dedupe screening."
    roles: [PlatformAdmin, ListOperator]
    code: 200
    input: []
    output: MailingList
    side_effects:
      - "runs calculation cass_deliverability_tier per record"
      - "resets every ListRecord.dedupe_status to UNSCREENED and MailingList.dedupe_mode to null"
      - "moves import_status to CASS_RUN and recomputes all partition counts"
      - "increments MailingList.version by 1"

  - method: POST
    path: "/mail/mailing-lists/{mailing_list_id}/dedupe-runs"
    description: "Screen the list in EXACT or HOUSEHOLD mode (calculation dedupe_screen)."
    roles: [PlatformAdmin, ListOperator]
    code: 200
    input: ["mode"]
    output: MailingList
    side_effects:
      - "writes ListRecord.dedupe_status for every record and sets MailingList.dedupe_mode"
      - "moves import_status to DEDUPED and recomputes automation_count, retail_count, duplicate_count, mailable_count"
      - "increments MailingList.version by 1"

  - method: POST
    path: "/mail/mailing-lists/{mailing_list_id}/lock"
    description: "Lock the list. Terminal: every further list write fails at ladder rung 12."
    roles: [PlatformAdmin, ListOperator]
    code: 200
    input: []
    output: MailingList
    side_effects: ["moves import_status to LOCKED", "increments MailingList.version by 1"]

  # ---- List records ------------------------------------------------------
  - method: GET
    path: "/mail/list-records/{list_record_id}"
    description: "Read one recipient record with all four of its parallel status axes."
    roles: [PlatformAdmin, AccountOwner, ListOperator, CampaignManager]
    code: 200
    input: []
    output: ListRecord
    side_effects: []

  - method: GET
    path: "/mail/list-records"
    description: "List recipient records, filtered by list, by the job that mailed them, or by either screening axis."
    roles: [PlatformAdmin, AccountOwner, ListOperator, CampaignManager]
    code: 200
    input: ["mailing_list_id?", "last_mail_job_id?", "cass_status?", "dedupe_status?", "mail_status?", "move_status?", "limit?", "offset?"]
    output: ListRecord[]
    side_effects: []

  - method: POST
    path: "/mail/list-records/{list_record_id}/ncoa-moves"
    description: "Apply an NCOA move-update. A forwarding address yields MOVE_APPLIED; a null forwarding address yields MOVE_NO_FORWARD and forces the record UNMAILABLE."
    roles: [PlatformAdmin, ListOperator]
    code: 200
    input: ["new_address_line1", "new_city?", "new_state_code?", "new_zip5?", "new_dpv_confirmation_code?"]
    output: ListRecord
    side_effects:
      - "sets move_status to MOVE_APPLIED or MOVE_NO_FORWARD"
      - "rewrites the address fields and re-derives cass_status and deliverability_tier via calculation cass_deliverability_tier"
      - "recomputes exact_key, household_key and the owning MailingList's partition counts"
      - "increments ListRecord.version by 1"

  - method: POST
    path: "/mail/list-records/{list_record_id}/returns"
    description: "Record a return-to-sender. CASCADE B origin."
    roles: [PlatformAdmin, ListOperator]
    code: 201
    input: ["return_reason"]
    output: ReturnEvent
    side_effects:
      - "CASCADE B hop 1: ListRecord moves MAILED -> RETURNED"
      - "CASCADE B hop 2: appends a ReturnEvent whose entitlement comes from calculation return_settlement"
      - "CASCADE B hop 3: a REFUND entitlement with a non-zero class fee appends a FORFEIT PostageLedgerEntry and lowers Account.permit_balance_cents"
      - "CASCADE B hop 4: increments MailJob.returned_piece_count, which recomputes Campaign.returned_piece_count and Campaign.forfeited_postage_cents"
      - "increments ListRecord.version by 1"

  # ---- Mail jobs ---------------------------------------------------------
  - method: POST
    path: "/mail/mail-jobs"
    description: "Create an ADDRESSED or EDDM mail job under a campaign."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 201
    input: ["campaign_id", "template_id", "job_kind", "mail_class", "mailing_list_id?", "eddm_rate_variant?", "target_in_home_date?"]
    output: MailJob
    side_effects: ["status starts at DRAFT with every money field null and every piece count 0"]

  - method: GET
    path: "/mail/mail-jobs/{mail_job_id}"
    description: "Read one mail job with its piece counts, presort tier and money fields."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ProductionOperator, ComplianceOfficer]
    code: 200
    input: []
    output: MailJob
    side_effects: []

  - method: GET
    path: "/mail/mail-jobs"
    description: "List mail jobs filtered by campaign, template or mailing list."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ProductionOperator, ComplianceOfficer]
    code: 200
    input: ["campaign_id?", "template_id?", "mailing_list_id?", "status?", "job_kind?", "limit?", "offset?"]
    output: MailJob[]
    side_effects: []

  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/estimate"
    description: "Quote the job (calculation postage_estimate variant PROVISIONAL). Counts every CASS-mailable record, ignoring dedupe."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 200
    input: []
    output: MailJob
    side_effects:
      - "writes provisional_postage_cents, automation_piece_count, retail_piece_count, unmailable_piece_count, eddm_piece_count, billable_piece_count and presort_tier"
      - "increments MailJob.version by 1"

  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/schedule"
    description: "Derive the drop date from target_in_home_date (calculation mail_date_derivation, variant ANCHOR_IN_HOME) and move the job PROOFED -> SCHEDULED."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: ["target_in_home_date?"]
    output: MailJob
    side_effects:
      - "writes mail_date, blackout_shifted_days and scheduled_at"
      - "increments MailJob.version by 1"

  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/commit"
    description: "Price the job finally (calculation postage_estimate variant FINAL and calculation commit_settlement), draw the escrow and queue the pieces."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: []
    output: MailJob
    side_effects:
      - "writes final_postage_cents, handling_fee_cents, volume_credit_cents, total_due_cents, drawn_postage_cents and presort_tier"
      - "appends a DRAW PostageLedgerEntry of total_due_cents and lowers Account.permit_balance_cents"
      - "for ADDRESSED jobs: every surviving ListRecord moves NOT_MAILED -> QUEUED and takes last_mail_job_id"
      - "recomputes Campaign.committed_postage_cents"
      - "increments MailJob.version by 1"

  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/void"
    description: "Void a committed job. Full compensation: refunds the draw, voids reserved runs and returns their ink and slot-minutes."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: ["reason?"]
    output: MailJob
    side_effects:
      - "appends a REFUND PostageLedgerEntry of drawn_postage_cents and raises Account.permit_balance_cents by exactly that amount"
      - "every RESERVED or FAILED ProductionRun on the job -> VOIDED, returning ink and slot-minutes"
      - "every QUEUED ListRecord returns to NOT_MAILED with last_mail_job_id cleared"
      - "clears final_postage_cents, handling_fee_cents, volume_credit_cents, total_due_cents, mail_date, scheduled_at and pinned_template_version; sets drawn_postage_cents to 0"
      - "moves the job COMMITTED -> DRAFT"
      - "increments MailJob.version by 1"

  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/mail"
    description: "Drop the job into the mail stream."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: MailJob
    side_effects:
      - "moves the job IN_PRODUCTION -> MAILED"
      - "every QUEUED ListRecord -> MAILED and every RELEASED DripStep -> MAILED"
      - "recomputes Campaign.mailed_piece_count"
      - "increments MailJob.version by 1"

  # ---- EDDM routes -------------------------------------------------------
  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/eddm-routes"
    description: "Select a carrier route for an EDDM job. Rejected on ADDRESSED jobs at ladder rung 14."
    roles: [PlatformAdmin, CampaignManager]
    code: 201
    input: ["route_code", "total_deliveries", "residential_piece_count", "business_piece_count"]
    output: EddmRouteSelection
    side_effects:
      - "computes selected_piece_count and saturation_pct"
      - "increments MailJob.eddm_piece_count and MailJob.version by 1"

  - method: GET
    path: "/mail/eddm-routes/{eddm_route_selection_id}"
    description: "Read one EDDM route selection."
    roles: [PlatformAdmin, CampaignManager, ProductionOperator]
    code: 200
    input: []
    output: EddmRouteSelection
    side_effects: []

  - method: GET
    path: "/mail/eddm-routes"
    description: "List EDDM route selections for a job."
    roles: [PlatformAdmin, CampaignManager, ProductionOperator]
    code: 200
    input: ["mail_job_id?", "limit?", "offset?"]
    output: EddmRouteSelection[]
    side_effects: []

  # ---- Proofs ------------------------------------------------------------
  - method: POST
    path: "/mail/proofs"
    description: "Create a proof in DRAFT for a mail job's template."
    roles: [PlatformAdmin, AccountOwner, CampaignManager]
    code: 201
    input: ["mail_job_id", "template_id"]
    output: Proof
    side_effects: ["status DRAFT with pinned_template_version null"]

  - method: GET
    path: "/mail/proofs/{proof_id}"
    description: "Read one proof. Reading materialises the APPROVED -> EXPIRED transition once current_utc >= expires_at."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: []
    output: Proof
    side_effects: ["materialises Proof APPROVED -> EXPIRED when the approval window has elapsed"]

  - method: GET
    path: "/mail/proofs"
    description: "List proofs filtered by template or mail job."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: ["template_id?", "mail_job_id?", "status?", "limit?", "offset?"]
    output: Proof[]
    side_effects: []

  - method: POST
    path: "/mail/proofs/{proof_id}/submit"
    description: "Submit a proof for approval, pinning the template's current content version. Also the REJECTED -> SUBMITTED revision edge."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: []
    output: Proof
    side_effects:
      - "pins pinned_template_version = Template.version_no and records submitted_by_user_id = X-User-ID"
      - "increments Proof.version by 1"

  - method: POST
    path: "/mail/proofs/{proof_id}/approve"
    description: "Approve a submitted proof. Segregation of duties: the approver's X-User-ID must differ from the submitter's."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["expected_template_version"]
    output: Proof
    side_effects:
      - "sets approved_by_user_id, approved_at = current_utc and expires_at = approved_at + 30 days"
      - "moves the owning MailJob DRAFT -> PROOFED and pins its pinned_template_version"
      - "increments Template.version by 1"
      - "increments Proof.version by 1"

  - method: POST
    path: "/mail/proofs/{proof_id}/reject"
    description: "Reject a submitted proof, opening the revision loop."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["reject_reason"]
    output: Proof
    side_effects: ["stores reject_reason and leaves the MailJob in DRAFT", "increments Proof.version by 1"]

  # ---- Production runs ---------------------------------------------------
  - method: POST
    path: "/mail/mail-jobs/{mail_job_id}/production-runs"
    description: "Reserve robot-pen capacity and ink for a slice of a committed job (calculation production_capacity_plan)."
    roles: [PlatformAdmin, ProductionOperator]
    code: 201
    input: ["machine_id", "ink_lot_id", "run_date", "piece_count", "capacity_variant?", "expected_mail_job_version"]
    output: ProductionRun
    side_effects:
      - "computes planned_write_minutes, planned_slot_minutes and planned_ink_ul"
      - "draws planned_ink_ul from InkLot.remaining_ul and moves a SEALED lot to OPEN, or to DEPLETED when the draw lands exactly on the safety reserve"
      - "commits planned_slot_minutes against the (machine_id, run_date) bucket"
      - "increments MailJob.version by 1"

  - method: GET
    path: "/mail/production-runs/{production_run_id}"
    description: "Read one production run with its planned slot-minutes and ink draw."
    roles: [PlatformAdmin, ProductionOperator, CampaignManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/mail/production-runs"
    description: "List production runs filtered by job, machine, ink lot or run date."
    roles: [PlatformAdmin, ProductionOperator, CampaignManager]
    code: 200
    input: ["mail_job_id?", "machine_id?", "ink_lot_id?", "run_date?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: POST
    path: "/mail/production-runs/{production_run_id}/start"
    description: "Start a reserved or previously failed run. Drives the job COMMITTED -> IN_PRODUCTION."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["moves the run to RUNNING and the MailJob COMMITTED -> IN_PRODUCTION", "increments ProductionRun.version by 1"]

  - method: POST
    path: "/mail/production-runs/{production_run_id}/complete"
    description: "Complete a running run; its slot-minutes and ink stay committed permanently."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["moves the run to COMPLETED", "increments ProductionRun.version by 1"]

  - method: POST
    path: "/mail/production-runs/{production_run_id}/fail"
    description: "Fail a running run, recording spoilage. The reservation is retained so a restart draws nothing further."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: ["spoiled_piece_count"]
    output: ProductionRun
    side_effects: ["moves the run to FAILED and stores spoiled_piece_count", "increments ProductionRun.version by 1"]

  - method: POST
    path: "/mail/production-runs/{production_run_id}/void"
    description: "Void a reserved or failed run, returning its ink and slot-minutes exactly."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: ["reason?"]
    output: ProductionRun
    side_effects:
      - "returns planned_ink_ul to InkLot.remaining_ul and releases planned_slot_minutes on the (machine_id, run_date) bucket"
      - "restores a DEPLETED lot to OPEN when remaining_ul rises strictly above the safety reserve"
      - "increments ProductionRun.version by 1"

  # ---- Drip scheduling ---------------------------------------------------
  - method: POST
    path: "/mail/drip-schedules"
    description: "Create a drip schedule on a campaign with a fixed date-anchoring variant."
    roles: [PlatformAdmin, CampaignManager]
    code: 201
    input: ["campaign_id", "name", "anchor_variant"]
    output: DripSchedule
    side_effects: ["status DRAFT with step_count 0"]

  - method: GET
    path: "/mail/drip-schedules/{drip_schedule_id}"
    description: "Read one drip schedule."
    roles: [PlatformAdmin, CampaignManager, AccountOwner]
    code: 200
    input: []
    output: DripSchedule
    side_effects: []

  - method: GET
    path: "/mail/drip-schedules"
    description: "List drip schedules for a campaign."
    roles: [PlatformAdmin, CampaignManager, AccountOwner]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: DripSchedule[]
    side_effects: []

  - method: POST
    path: "/mail/drip-schedules/{drip_schedule_id}/steps"
    description: "Add a step, deriving its mail date from the schedule's anchor variant (calculation mail_date_derivation)."
    roles: [PlatformAdmin, CampaignManager]
    code: 201
    input: ["mail_job_id", "sequence_no", "anchor_date", "expected_drip_schedule_version"]
    output: DripStep
    side_effects:
      - "writes computed_mail_date, computed_in_home_date and shifted_days"
      - "sets status SCHEDULED when the job is PROOFED or SCHEDULED, otherwise PENDING"
      - "moves the DripSchedule DRAFT -> ACTIVE on the first accepted step and recomputes step_count"
      - "increments DripSchedule.version by 1"

  - method: GET
    path: "/mail/drip-steps/{drip_step_id}"
    description: "Read one drip step with its derived dates."
    roles: [PlatformAdmin, CampaignManager, AccountOwner]
    code: 200
    input: []
    output: DripStep
    side_effects: []

  - method: GET
    path: "/mail/drip-steps"
    description: "List drip steps filtered by schedule or mail job."
    roles: [PlatformAdmin, CampaignManager, AccountOwner]
    code: 200
    input: ["drip_schedule_id?", "mail_job_id?", "status?", "limit?", "offset?"]
    output: DripStep[]
    side_effects: []

  - method: POST
    path: "/mail/drip-steps/{drip_step_id}/release"
    description: "Release a scheduled step for its committed job."
    roles: [PlatformAdmin, CampaignManager]
    code: 200
    input: []
    output: DripStep
    side_effects: ["moves the step SCHEDULED -> RELEASED", "increments DripStep.version by 1"]

  # ---- Postage ledger ----------------------------------------------------
  - method: GET
    path: "/mail/postage-ledger-entries/{postage_ledger_entry_id}"
    description: "Read one ledger row."
    roles: [PlatformAdmin, AccountOwner, CampaignManager, ComplianceOfficer]
    code: 200
    input: []
