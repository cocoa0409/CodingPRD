      - name: lot_transfer_moves_between_sites
        claim_type: action_endpoint
        grounds: [endpoints, "concurrency_rules[lot-transfer-stale-version]", calculations.storage_occupancy]
        distinguishing_aspect: "A successful transfer re-homes the lot and shifts physical occupancy between sites; no tonnage is created or destroyed."
        test_recipe:
          setup: ["Grower chain; CUT; sites S1 and S2 (cap 500.0 each); lot 50.0t in S1 harvested 2026-08-01"]
          setup_api_calls:
