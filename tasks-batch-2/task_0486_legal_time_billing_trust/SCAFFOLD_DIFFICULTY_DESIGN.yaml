              payload: {}
              as: Attorney
              captures: { err: $.data.error_id }
          assert:
            - "POST open returns HTTP 409 with error_id == ERR_CONFLICT_NOT_CLEARED (matter CONFLICT_BLOCKED)"

      - name: matter_close_requires_no_issued_invoice
