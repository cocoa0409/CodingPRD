- section: rbac
  instances:
  - name: request_with_no_role_header_is_unauthenticated
    claim_type: exclusive_operation_denied
    grounds:
    - errors[ERR_UNAUTHENTICATED]
    - validations[priority=1]
    distinguishing_aspect: |
      Authentication precedes authorisation: a carrier registration sent with no X-User-Role and no X-User-ID header returns 401 ERR_UNAUTHENTICATED — the header check runs before the role check and before any body or uniqueness validation.
    test_recipe:
      setup:
      - One carrier (OCN 9241) already registered by PlatformAdmin.
      - The request carries a well-formed body for a second carrier (OCN 8117, which is free) but neither the X-User-ID nor the X-User-Role header.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Southgate Communications Inc
          ocn: '8117'
          carrier_type: CLEC
        as: null
        captures:
          e1: $.data.error_id
      assert:
      - response.status == 401 and response.data.error_id == ERR_UNAUTHENTICATED, not ERR_UNAUTHORIZED and not ERR_INVALID_REQUEST
      - GET /interconnection/carriers as PlatformAdmin returns total_count == 1, holding only OCN 9241
  - name: network_planner_cannot_register_a_carrier
    claim_type: exclusive_operation_denied
    grounds:
    - roles.PlatformAdmin.exclusive_operations
    - errors[ERR_UNAUTHORIZED]
    distinguishing_aspect: |
      Role-model claim: carrier registration is PlatformAdmin's exclusive operation, so an authenticated NetworkPlanner is refused with 403 ERR_UNAUTHORIZED and the refusal happens before any uniqueness or body validation.
    test_recipe:
      setup:
      - One carrier (OCN 9241) already registered by PlatformAdmin.
      - The refused request is authenticated as NetworkPlanner and asks for OCN 8117, which is free.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Southgate Communications Inc
          ocn: '8117'
          carrier_type: CLEC
        as: NetworkPlanner
        captures:
          e1: $.data.error_id
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Southgate Communications Inc
          ocn: '8117'
          carrier_type: CLEC
        as: PlatformAdmin
        captures:
          car2_id: $.data.id
      assert:
      - The NetworkPlanner attempt returns 403 with error_id ERR_UNAUTHORIZED, not ERR_INVALID_REQUEST and not ERR_DUPLICATE_OCN
      - The byte-identical body posted as PlatformAdmin returns 201, proving only the role blocked it
      - Carrier.${car2_id}.ocn == 8117 and version == 1
      - GET /interconnection/carriers as PlatformAdmin returns total_count == 2
