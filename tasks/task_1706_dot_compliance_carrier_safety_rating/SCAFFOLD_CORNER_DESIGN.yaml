# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index) — enumerative breadth coverage of
# every testable claim in §1.1–§1.7 not already covered by §1.8.
# Default logical clock at startup is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_create_defaults_applied
        claim_type: creation
        grounds: [entities.Carrier]
        distinguishing_aspect: "Minimal create returns 201 with system defaults: safety_rating NONE, new_entrant_status NOT_NEW_ENTRANT (is_new_entrant omitted), posture NORMAL, version 1, UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2001", legal_name: "Corner Carrier One", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id, c_rating: $.data.safety_rating, c_ne: $.data.new_entrant_status, c_posture: $.data.posture, c_ver: $.data.version } }
          trigger: []
          assert:
            - "response code 201; data.safety_rating == NONE; data.new_entrant_status == NOT_NEW_ENTRANT; data.posture == NORMAL; data.version == 1"
            - "data.id is a prefix-free UUID; created_at == updated_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: carrier_new_entrant_missing_due_date_returns_400
        claim_type: required_fields
        grounds: [entities.Carrier.fields.safety_audit_due_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Conditional required field: is_new_entrant true without safety_audit_due_date fails shape validation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2002", legal_name: "Corner Carrier Two", fleet_size: 2, is_new_entrant: true }, as: SafetyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (safety_audit_due_date required iff is_new_entrant)"

      - name: driver_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, entities.Driver]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) pages a 12-row collection; explicit limit/offset slices the remainder."
        test_recipe:
          setup: ["one carrier with 12 drivers"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2003", legal_name: "Corner Carrier Three", fleet_size: 20 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P01", full_name: "Driver 01", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P02", full_name: "Driver 02", hire_date: "2025-01-02T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P03", full_name: "Driver 03", hire_date: "2025-01-03T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P04", full_name: "Driver 04", hire_date: "2025-01-04T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P05", full_name: "Driver 05", hire_date: "2025-01-05T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P06", full_name: "Driver 06", hire_date: "2025-01-06T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P07", full_name: "Driver 07", hire_date: "2025-01-07T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P08", full_name: "Driver 08", hire_date: "2025-01-08T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P09", full_name: "Driver 09", hire_date: "2025-01-09T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P10", full_name: "Driver 10", hire_date: "2025-01-10T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P11", full_name: "Driver 11", hire_date: "2025-01-11T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-P12", full_name: "Driver 12", hire_date: "2025-01-12T00:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "GET /safety/drivers", payload: {}, as: SafetyManager }
          assert:
            - "default page: 10 items, total_count == 12, has_more == true (pagination_defaults limit 10 offset 0)"
            - "GET with limit=5&offset=10 returns 2 items, total_count == 12, has_more == false"

      - name: document_retention_computed_by_type
        claim_type: computed_fields
        grounds: [entities.DocumentRecord.fields.retention_until, calculations.retention_until]
        distinguishing_aspect: "retention_months/retention_until derive from document_type: INSPECTION_REPORT filed 2026-01-15 -> 12 months -> 2027-01-15; DRUG_TEST_RECORD same filed_at -> 60 months -> 2031-01-15."
        test_recipe:
          setup: ["one carrier"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2004", legal_name: "Corner Carrier Four", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "INSPECTION_REPORT", filed_at: "2026-01-15T00:00:00Z" }, as: SafetyManager, captures: { d1_months: $.data.retention_months, d1_until: $.data.retention_until } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "DRUG_TEST_RECORD", filed_at: "2026-01-15T00:00:00Z" }, as: SafetyManager, captures: { d2_months: $.data.retention_months, d2_until: $.data.retention_until } }
          assert:
            - "INSPECTION_REPORT: retention_months == 12, retention_until == 2027-01-15T00:00:00Z, status RETAINED"
            - "DRUG_TEST_RECORD: retention_months == 60, retention_until == 2031-01-15T00:00:00Z"

      - name: accident_computed_reportable_and_points
        claim_type: computed_fields
        grounds: [entities.AccidentRecord.fields.dot_reportable, entities.AccidentRecord.fields.crash_points, calculations.crash_severity_points]
        distinguishing_aspect: "dot_reportable = fatality|injury|tow; crash_points = 4/2/1 flags: (0 fatalities, 1 injury, tow) -> reportable true, 3 points; (0,0,false) -> reportable false, 0 points."
        test_recipe:
          setup: ["one carrier, one driver"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2005", legal_name: "Corner Carrier Five", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2005", full_name: "Ann Elk", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: true }, as: SafetyManager, as_user_id: "sm-1", captures: { a1_rep: $.data.dot_reportable, a1_pts: $.data.crash_points } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-02T00:00:00Z", fatalities: 0, injuries: 0, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { a2_rep: $.data.dot_reportable, a2_pts: $.data.crash_points } }
          assert:
            - "accident 1: dot_reportable == true, crash_points == 3 (2 injury + 1 tow)"
            - "accident 2: dot_reportable == false, crash_points == 0"
            - "both start at preventability_status PENDING_REVIEW"

      - name: driver_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Driver.fields.risk_score]
        distinguishing_aspect: "Client-supplied computed/system fields on create are ignored: risk_score stays 0 and version stays 1 even if the payload carries decoys."
        test_recipe:
          setup: ["one carrier"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2006", legal_name: "Corner Carrier Six", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2006", full_name: "Bob Uhr", hire_date: "2025-01-01T00:00:00Z", risk_score: 999, version: 42 }, as: SafetyManager, captures: { d_risk: $.data.risk_score, d_ver: $.data.version } }
          assert:
            - "driver.risk_score == 0 and driver.version == 1 (decoy inputs ignored)"

      - name: snapshot_immutable_shape
        claim_type: immutability
        grounds: [entities.MeasurementSnapshot]
        distinguishing_aspect: "MeasurementSnapshot is append-only (common_fields false): it has id and created_at but no version/updated_at, and no update/delete endpoints exist for it."
        test_recipe:
          setup: ["carrier with one category and one violation; cycle run"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2007", legal_name: "Corner Carrier Seven", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "DRIVER_FITNESS", display_name: "Driver Fitness", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2007", full_name: "Cat Imo", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2007", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "UT" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "391.11", severity_weight: 4, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst, captures: { snap_id: "$.data[0].id" } }
          assert:
            - "snapshot has id and created_at but no version and no updated_at keys"
            - "snapshot.cycle_date == 2026-08-01 and snapshot.as_of == 2026-08-01T00:00:00Z"

      - name: violation_driver_defaults_to_inspection_driver
        claim_type: defaults
        grounds: [entities.InspectionViolation.fields.driver_id]
        distinguishing_aspect: "Omitting driver_id on violation create defaults it to the parent inspection's driver."
        test_recipe:
          setup: ["carrier, driver, inspection"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2008", legal_name: "Corner Carrier Eight", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "HAZMAT", display_name: "Hazmat", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2008", full_name: "Dan Oka", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2008", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "OR" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "397.1", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_driver: $.data.driver_id } }
          assert:
            - "violation.driver_id == ${d_id} (defaulted from the inspection)"

      - name: fk_reverse_filtered_lists
        claim_type: parent_relationships
        grounds: [entities.InspectionViolation.fields.inspection_id, entities.DataQsChallenge.fields.violation_id, entities.MeasurementSnapshot.fields.category_id]
        distinguishing_aspect: "Filtered-list reverse reachability: violations by inspection_id, challenges by violation_id, snapshots by category_id each return exactly the children of the named parent."
        test_recipe:
          setup: ["carrier; category; driver; two inspections with one violation each; challenge on the first violation; cycle run"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2009", legal_name: "Corner Carrier Nine", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "CONTROLLED_SUBSTANCES_ALCOHOL", display_name: "CSA", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2009", full_name: "Eli Ames", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2009A", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "ID" }, as: SafetyManager, captures: { i1: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2009B", inspection_date: "2026-06-01T00:00:00Z", inspection_level: 1, state_code: "ID" }, as: SafetyManager, captures: { i2: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i1}", category_id: "${cat_id}", violation_code: "392.4", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v1: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i2}", category_id: "${cat_id}", violation_code: "392.5", severity_weight: 2, occurred_at: "2026-06-01T00:00:00Z" }, as: SafetyManager, captures: { v2: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v1}", reason_code: "OTHER", evidence_note: "docs" }, as: ComplianceAnalyst, captures: { ch1: $.data.id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
          trigger:
            - { call: "GET /safety/inspection-violations", payload: {}, as: ComplianceAnalyst }
            - { call: "GET /safety/dataqs-challenges", payload: {}, as: ComplianceAnalyst }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst }
          assert:
            - "GET /safety/inspection-violations?inspection_id=${i1} returns exactly [${v1}]; ?inspection_id=${i2} returns exactly [${v2}]"
            - "GET /safety/dataqs-challenges?violation_id=${v1} returns exactly [${ch1}]; ?violation_id=${v2} returns an empty array with total_count 0"
            - "GET /safety/measurement-snapshots?carrier_id=${c_id}&category_id=${cat_id} returns exactly 1 snapshot"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: challenge_decide_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DataQsChallenge, "errors[ERR_CHALLENGE_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "decide fires only from UNDER_REVIEW; calling it on a SUBMITTED challenge returns ERR_CHALLENGE_NOT_UNDER_REVIEW and leaves the challenge untouched."
        test_recipe:
          setup: ["carrier, category, driver, inspection, one ACTIVE violation, one SUBMITTED challenge"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2101", legal_name: "SM Carrier One", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2101", full_name: "Fay Ode", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2101", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "MT" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.3", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "OTHER", evidence_note: "docs" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
          trigger:
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "UPHELD" }, as: SafetyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CHALLENGE_NOT_UNDER_REVIEW (HTTP 409); challenge remains SUBMITTED"

      - name: challenge_terminal_lockdown_after_upheld
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DataQsChallenge, "errors[ERR_CHALLENGE_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "UPHELD is terminal: a second decide on the same challenge is rejected; resubmit is also rejected (ERR_CHALLENGE_NOT_REMANDED)."
        test_recipe:
          setup: ["same chain as decide-from-submitted, but the challenge is driven to UPHELD first"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2102", legal_name: "SM Carrier Two", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2102", full_name: "Gil Eda", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2102", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "MT" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.3", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "OTHER", evidence_note: "docs" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "UPHELD" }, as: SafetyAdmin }
          trigger:
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "OVERTURNED" }, as: SafetyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/resubmit", payload: { evidence_note: "retry" }, as: ComplianceAnalyst, captures: { err2: $.data.error_id } }
          assert:
            - "second decide -> err1 == ERR_CHALLENGE_NOT_UNDER_REVIEW (terminal lockdown)"
            - "resubmit after UPHELD -> err2 == ERR_CHALLENGE_NOT_REMANDED"

      - name: inspection_begin_review_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RoadsideInspection, "errors[ERR_INSPECTION_NOT_REVIEWABLE]"]
        distinguishing_aspect: "begin-review is IMPORTED-only; the second call on an UNDER_REVIEW inspection returns ERR_INSPECTION_NOT_REVIEWABLE (also covers finalize idempotent-retry style rejection)."
        test_recipe:
          setup: ["carrier, driver, inspection IMPORTED"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2103", legal_name: "SM Carrier Three", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2103", full_name: "Hal Ibo", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2103", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "WY" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/roadside-inspections/${i_id}/begin-review", payload: {}, as: ComplianceAnalyst, captures: { st: $.data.review_status } }
            - { call: "POST /safety/roadside-inspections/${i_id}/begin-review", payload: {}, as: ComplianceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "first begin-review -> UNDER_REVIEW; second -> ERR_INSPECTION_NOT_REVIEWABLE (HTTP 409)"

      - name: coaching_overdue_sweep_then_escalate_suspends_driver
        claim_type: side_effect_execution
        grounds: [state_machines.CoachingAssignment, state_machines.Driver, "endpoints[POST /safety/measurement-cycles]"]
        distinguishing_aspect: "System auto-transition: the measurement cycle flips ASSIGNED coaching with due_date < clock to OVERDUE (counted in overdue_coaching_marked); escalate then suspends the driver and increments coaching_strikes."
        test_recipe:
          setup: ["carrier with one ACTIVE driver; coaching assignment due 2026-08-10; clock advanced to 2026-08-11"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2104", legal_name: "SM Carrier Four", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
