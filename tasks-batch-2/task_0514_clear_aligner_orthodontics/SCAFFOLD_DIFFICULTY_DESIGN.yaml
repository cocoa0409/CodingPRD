  # ───────────────────────────────────────────────────────────────────────────
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_activate
        grounds:
          - validations[priority=5]
          - validations[priority=19]
        distinguishing_aspect: |
          Error-category pair STATE (priority 5, ERR_INVALID_STATE) vs BUSINESS_FISCAL
          (priority 19, ERR_PAYMENT_NOT_SETTLED): activating a case that is still
          UNDER_REVIEW (not PLAN_APPROVED) AND has no settled payment must return the
          higher-priority ERR_INVALID_STATE, never the fiscal error.
        test_recipe:
          setup:
            - "Case UNDER_REVIEW (plan SUBMITTED, not approved) with no financing; activate attempted."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA9", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p9@x.com", full_name: "Pat Nine", state_code: "CA", date_of_birth: "1990-10-10" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TRK9" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: ManufacturingOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: existence_before_temporal_on_shipment_create
        grounds:
          - validations[priority=4]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair EXISTENCE (priority 4, ERR_FK_NOT_FOUND) vs BUSINESS_TEMPORAL
          (priority 16, ERR_WINDOW_INVERTED): a POST /shipments carrying a non-existent
          step_id AND an inverted window (window_start after window_end) must return the
          higher-priority ERR_FK_NOT_FOUND, never the temporal error. A distinct pair from
          the state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Empty DB (only roles available); a shipment is booked against a non-existent step_id with an inverted window."
          setup_api_calls: []
          trigger:
            - call: "POST /shipments"
              payload: { step_id: "00000000-0000-4000-8000-000000000000", carrier_code: "GROUND", window_start: "2026-05-05T00:00:00Z", window_end: "2026-05-02T00:00:00Z" }
              as: ManufacturingOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:
      - name: case_price_tier_boundary_step_count_14_light
        grounds:
          - calculations.case_price
          - entities.TreatmentPlan.fields.proposed_step_count
          - state_machines.TreatmentCase.UNDER_REVIEW_to_PLAN_APPROVED
        distinguishing_aspect: |
          Numeric threshold crossing on proposed_step_count via the plan-approve endpoint:
          14 steps selects LIGHT (0.80), the inclusive upper edge of the LIGHT band. With
          list 300000 IMPRESSION_KIT: 14 -> 300000*0.80 = 240000 (vs 15 -> 300000 at MODERATE).
        test_recipe:
          setup:
            - "Case list 300000 IMPRESSION_KIT; plan proposes exactly 14 steps; approved."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CB1", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
