              captures: { after_total: $.data.0.id }
          assert:
            - "before the lock the read returns an empty array with total_count == 0, so the link is only made at lock time"
            - "after the lock the read returns exactly 1 row with total_count == 1"
            - "the returned line reports clinician_id == ${clinician_id} and gross_cents == 15000"
            - "the returned line's claim_ids contains ${claim_id}"
