# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Task 1115 §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk of the claim-extraction-guide taxonomy against SCAFFOLD.yaml
# §1.1–§1.7. Corners already exercised by a §1.8 instance are emitted as
# excluded_because stubs. All names are unique across both design files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_community_applies_defaults
        claim_type: defaults
        grounds: [entities.Community]
        distinguishing_aspect: "Omitting every optional config field applies the documented defaults; version starts at 1 and checked_out_count at 0."
        test_recipe:
          setup: ["empty DB; logical clock at startup default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/communities", payload: { name: "C-DEF" }, as: PlatformAdmin, captures: { c_id: $.data.id, c_age: $.data.min_driver_age, c_ins: $.data.insurance_required, c_fleet: $.data.fleet_program_enabled, c_cov: $.data.min_liability_coverage_cents, c_win: $.data.renewal_window_days, c_grace: $.data.late_grace_days, c_out: $.data.checked_out_count, c_v: $.data.version } }
          assert:
            - "c_age == 16 and c_ins == true and c_fleet == false"
            - "c_cov == 10000000 and c_win == 60 and c_grace == 90"
            - "c_out == 0 and c_v == 1"

      - name: create_permit_holder_missing_required_birth_date
        claim_type: required_fields
        grounds: [entities.PermitHolder.fields.birth_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field birth_date is rejected at schema priority 1 with ERR_VALIDATION 400; no holder row is created."
        test_recipe:
          setup: ["community exists"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-REQ" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
          trigger:
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H REQ", driver_license_class: "STANDARD" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: vehicle_computed_equipment_count_excludes_zero_mirrors
        claim_type: computed_fields
        grounds: [entities.Vehicle.fields.equipment_count, entities.Vehicle.fields.mirror_count]
        distinguishing_aspect: "equipment_count counts the mirrors item only when mirror_count >= 1: 7 booleans true with mirror_count 0 yields 7; mirror_count 2 yields 8. Client cannot supply equipment_count (it is not in the create input schema)."
        test_recipe:
          setup: ["community + ELIGIBLE holder"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-EC" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H EC", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { ec0: $.data.equipment_count } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { ec2: $.data.equipment_count } }
          assert:
            - "ec0 == 7 (mirror_count 0 -> mirrors item absent)"
            - "ec2 == 8"

      - name: vehicle_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Vehicle.fields.vehicle_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "vehicle_type outside {GOLF_CART, LSV} is a schema violation -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["community + holder"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-EN" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H EN", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "TRUCK", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 1 }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: get_vehicle_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that does not exist returns ERR_NOT_FOUND 404 (existence, priority 4), not a schema or auth error."
        test_recipe:
          setup: ["community exists (any actor context)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-NF" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/vehicles/00000000-0000-0000-0000-000000000000", as: CommunityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: system_fields_server_minted_on_create
        claim_type: system_fields
        grounds: [entities.PermitHolder]
        distinguishing_aspect: "id is a server-minted UUID with no type prefix; version starts at 1; created_at is stamped from the logical clock (2026-05-01T00:00:00Z at startup default), not from the client."
        test_recipe:
          setup: ["community exists"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-SYS" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
          trigger:
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H SYS", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id, h_v: $.data.version, h_cat: $.data.created_at, h_pts: $.data.points_balance, h_es: $.data.eligibility_status, h_cs: $.data.compliance_status, h_w: $.data.wallet_balance_cents } }
          assert:
            - "h_id matches UUID format and contains no 'ph_'-style prefix"
            - "h_v == 1 and h_cat == 2026-05-01T00:00:00Z (logical clock stamp)"
            - "system-initialized fields: h_pts == 0, h_es == PENDING_VERIFICATION, h_cs == GOOD_STANDING, h_w == 0"

      - name: list_registrations_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses carry the fixed pagination envelope: with 2 registrations, limit=1 yields total_count 2 and has_more true; offset=1 yields the second page with has_more false."
        test_recipe:
          setup: ["community, ELIGIBLE holder, two GOLF_CART vehicles each with a DRAFT 2026 registration"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PG" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PG", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v2: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v1}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v2}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "GET /api/registrations?holder_id=${h_id}&limit=1&offset=0", as: CommunityAdmin, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /api/registrations?holder_id=${h_id}&limit=1&offset=1", as: CommunityAdmin, captures: { second_id: "$.data[0].id" } }
          assert:
            - "page 1: total_count == 2, has_more == true, exactly 1 item"
            - "page 2: has_more == false, exactly 1 item, and first_id != second_id"
            - "response envelope carries meta.api_request_id and meta.api_request_timestamp on every response"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: registration_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.VehicleRegistration]
        distinguishing_aspect: "A newly created registration starts in DRAFT with provisional_fee_cents set and finalized_fee_cents null."
        test_recipe:
          setup: ["community + holder + cart vehicle"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-INIT" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H INIT", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { st: $.data.status, fin: $.data.finalized_fee_cents, prov: $.data.provisional_fee_cents } }
          assert:
            - "st == DRAFT and fin == null"
            - "prov == 7500 (fleet program disabled by default -> no discount; 0-equipment cart at base)"

      - name: activate_draft_without_inspection_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.VehicleRegistration.DRAFT_to_ACTIVE, "errors[ERR_INSPECTION_NOT_PASSED]"]
        distinguishing_aspect: "With eligibility ELIGIBLE and insurance ACTIVE but NO finalized inspection, activation fails at the referential gate with ERR_INSPECTION_NOT_PASSED 422; registration stays DRAFT and wallet is untouched."
        test_recipe:
          setup: ["ELIGIBLE holder; DRAFT registration; ACTIVE insurance; no inspection scheduled"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PRE" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PRE", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-PRE", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSPECTION_NOT_PASSED with http 422"
            - "registration remains DRAFT"

      - name: revoked_registration_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VehicleRegistration, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: renew from REVOKED is rejected ERR_INVALID_STATE 409 regardless of clock position."
        test_recipe:
          setup: ["ACTIVE registration revoked by EnforcementOfficer; clock inside what would have been the renewal window (2027-03-15)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TERM", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TERM", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-TERM", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/revoke", payload: {}, as: EnforcementOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with http 409 (no transition out of REVOKED)"

      - name: dismiss_dismissed_violation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Violation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISMISSED is terminal: dismissing an already-DISMISSED violation fails ERR_INVALID_STATE; points_balance does not change on the rejected call."
        test_recipe:
          setup: ["holder with one violation FILED then DISMISSED (points 0)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-INV" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H INV", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "PARKING_VIOLATION", points_assessed: 3, fine_cents: 2000, occurred_at: "2026-04-15T00:00:00Z" }, as: EnforcementOfficer, captures: { vio_id: $.data.id } }
            - { call: "POST /api/violations/${vio_id}/dismiss", payload: {}, as: EnforcementOfficer }
          trigger:
            - { call: "POST /api/violations/${vio_id}/dismiss", payload: {}, as: EnforcementOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "violation status remains DISMISSED; holder points_balance remains 0"

      - name: route_pass_completes_via_clock
        claim_type: valid_transition
        grounds: [state_machines.RoutePass.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "System transition: when the logical clock reaches end_at, an ACTIVE pass flips to COMPLETED with no client action on the pass."
        test_recipe:
          setup: ["ACTIVE registration with ACTIVE pass 2026-05-01T10:00-12:00 booked at clock 2026-05-01T00:00"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CLK1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CLK1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CLK1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "R-CLK1", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_id: $.data.id } }
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { rp_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T13:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/route-passes/${rp_id}", as: CommunityAdmin, captures: { rp_st: $.data.status } }
          assert:
            - "rp_st == COMPLETED (now 13:00 >= end_at 12:00)"

      - name: registration_expires_via_clock
        claim_type: valid_transition
        grounds: [state_machines.VehicleRegistration.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "System transition: an ACTIVE registration flips to EXPIRED when the clock passes expiry_date (activation 2026-05-01 + 365 days = 2027-05-01T00:00:00Z)."
        test_recipe:
          setup: ["ACTIVE registration with expiry_date 2027-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CLK2", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CLK2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CLK2", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { exp: $.data.expiry_date } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/registrations/${reg_id}", as: CommunityAdmin, captures: { st: $.data.status } }
          assert:
            - "exp == 2027-05-01T00:00:00Z (valid_from + 365 days)"
            - "st == EXPIRED after the clock passes expiry_date"

      - name: insurance_expiry_blocks_activation
        claim_type: side_effect_execution
        grounds: [state_machines.InsurancePolicy.ACTIVE_to_EXPIRED, "errors[ERR_INSURANCE_MISSING]"]
        distinguishing_aspect: "Clock past policy expiry_date flips the policy to EXPIRED; a subsequent activation finds no ACTIVE policy and fails ERR_INSURANCE_MISSING 422."
        test_recipe:
          setup: ["DRAFT registration with PASSED inspection; policy with expiry_date 2026-06-01; ELIGIBLE holder; wallet funded"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-INS" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H INS", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-INS", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2026-06-01" }, as: PermitHolder, as_user_id: "${h_id}", captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/insurance-policies/${pol_id}", as: CommunityAdmin, captures: { pol_st: $.data.status } }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "pol_st == EXPIRED (clock-driven)"
            - "err == ERR_INSURANCE_MISSING with http 422; registration stays DRAFT; wallet unchanged at 100000"

      - name: overdue_dispatch_return_charges_late_fine
        claim_type: side_effect_execution
        grounds: [state_machines.FleetDispatch.CHECKED_OUT_to_OVERDUE, state_machines.FleetDispatch.OVERDUE_to_RETURNED, entities.FleetDispatch.fields.late_fine_cents]
        distinguishing_aspect: "Clock past shift_end flips CHECKED_OUT -> OVERDUE; returning 1.5 days late computes ceil(1.5)*500 = 1000 late_fine_cents and debits the holder wallet (5000 -> 4000), while the vehicle and count restore."
        test_recipe:
          setup: ["dispatch booked 2026-05-01T09:00 to 2026-05-02T00:00; checked out at 2026-05-01T10:00; holder wallet 5000; clock advanced to 2026-05-03T12:00"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-LATE" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H LATE", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 5000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-LATE", slot_count: 1, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/fleet-vehicles", payload: { community_id: "${comm_id}", station_id: "${st_id}", label: "F-LATE" }, as: CommunityAdmin, captures: { fv_id: $.data.id } }
            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-05-01T09:00:00Z", shift_end: "2026-05-02T00:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { d_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/fleet-dispatches/${d_id}/checkout", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T12:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/fleet-dispatches/${d_id}", as: CommunityAdmin, captures: { d_mid: $.data.status } }
          trigger:
            - { call: "POST /api/fleet-dispatches/${d_id}/return", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { d_st: $.data.status, fine: $.data.late_fine_cents } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet: $.data.wallet_balance_cents } }
            - { call: "GET /api/communities/${comm_id}", as: CommunityAdmin, captures: { cnt: $.data.checked_out_count } }
          assert:
            - "d_mid == OVERDUE (clock 2026-05-03T12:00 > shift_end 2026-05-02T00:00)"
            - "fine == 1000 (ceil(1.5 days) * 500) and d_st == RETURNED"
            - "wallet == 4000 (5000 - 1000) and cnt == 0"

      - name: registration_renewal_cycle_covered
        claim_type: valid_transition
        grounds: [state_machines.VehicleRegistration.ACTIVE_to_RENEWAL_PENDING]
        excluded_because:
          difficulty_instance: registration_cyclic_renewal_and_suspension
          rationale: "Both renewal-loop and suspension-loop transitions with expiry extension are asserted in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: charging_fee_min_charge_floor
        claim_type: constants_applied
        grounds: [calculations.charging_fee, entities.ChargingReservation.fields.fee_cents]
        distinguishing_aspect: "The MIN_CHARGE_CENTS 200 floor binds: a 10-minute booking at 10 c/min computes max(200, 100) = 200, not 100."
        test_recipe:
          setup: ["ONLINE station rate 10; holder wallet 1000"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-MIN" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H MIN", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 1000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-MIN", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T10:10:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { fee: $.data.fee_cents } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet: $.data.wallet_balance_cents } }
          assert:
            - "fee == 200 (floor binds over 10 * 10 = 100)"
            - "wallet == 800"

      - name: points_threshold_exactly_4_probation
        claim_type: correct_result
        grounds: [calculations.holder_points_standing]
        distinguishing_aspect: "PROBATION_THRESHOLD is inclusive at 4: a single upheld 4-point violation moves GOOD_STANDING -> PROBATION (not at 5)."
        test_recipe:
          setup: ["ELIGIBLE holder with 0 points"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PT4" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PT4", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "PARKING_VIOLATION", points_assessed: 4, fine_cents: 3000, occurred_at: "2026-04-15T00:00:00Z" }, as: EnforcementOfficer, captures: { vio_id: $.data.id } }
          trigger:
            - { call: "POST /api/violations/${vio_id}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { pts: $.data.points_balance, comp: $.data.compliance_status } }
          assert:
            - "pts == 4 and comp == PROBATION (4 >= 4 inclusive)"

      - name: points_recompute_on_dismiss
        claim_type: correct_result
        grounds: [calculations.holder_points_standing, state_machines.Violation.UPHELD_to_DISMISSED]
        distinguishing_aspect: "Dismissing a previously UPHELD violation (appeal) removes its points from the 730-day aggregation: 4 -> 0 and PROBATION -> GOOD_STANDING, with no automatic registration reinstatement."
        test_recipe:
          setup: ["holder at PROBATION with one upheld 4-point violation"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-DIS" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H DIS", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "OFF_ROUTE", points_assessed: 4, fine_cents: 3000, occurred_at: "2026-04-15T00:00:00Z" }, as: EnforcementOfficer, captures: { vio_id: $.data.id } }
            - { call: "POST /api/violations/${vio_id}/uphold", payload: {}, as: EnforcementOfficer }
          trigger:
            - { call: "POST /api/violations/${vio_id}/dismiss", payload: {}, as: EnforcementOfficer, captures: { vio_st: $.data.status } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { pts: $.data.points_balance, comp: $.data.compliance_status } }
          assert:
            - "vio_st == DISMISSED"
            - "pts == 0 and comp == GOOD_STANDING"

      - name: provisional_fee_floor_covered
        claim_type: correct_result
        grounds: [calculations.annual_registration_fee]
        excluded_because:
          difficulty_instance: registration_fee_tiered_equipment_multiplier_floor
          rationale: "The max(subtotal, base) floor and multiplier cap are asserted with exact literals in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: renewal_window_opens_exactly_sixty_days_before
        claim_type: satisfaction_pass
        grounds: ["validations[priority=7]", state_machines.VehicleRegistration.ACTIVE_to_RENEWAL_PENDING]
        distinguishing_aspect: "The renewal window lower bound is inclusive: at exactly expiry - 60 days (2027-03-02T00:00:00Z for expiry 2027-05-01) renew succeeds."
        test_recipe:
          setup: ["ACTIVE registration, expiry 2027-05-01T00:00:00Z; clock 2027-03-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-RW1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H RW1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-RW1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { st: $.data.status } }
          assert:
            - "st == RENEWAL_PENDING (boundary day included in the window)"

      - name: renew_before_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "One day before the window opens (2027-03-01, i.e. expiry - 61 days) renew fails ERR_RENEWAL_WINDOW_CLOSED 422; the registration stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE registration, expiry 2027-05-01T00:00:00Z; clock 2027-03-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-RW2", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H RW2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-RW2", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RENEWAL_WINDOW_CLOSED with http 422"
            - "registration status remains ACTIVE"

      - name: invalid_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An X-User-Role value that is not a declared role fails authentication at priority 2 with ERR_UNAUTHENTICATED 401 — before existence, state, or business checks."
        test_recipe:
          setup: ["community exists"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-AUTH" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
          trigger:
            - { call: "GET /api/communities/${comm_id}", as: GhostRole, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401"

      - name: permit_holder_cannot_create_route_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Route designation is exclusive to CommunityAdmin; a PermitHolder-role call is rejected ERR_FORBIDDEN 403 even with a well-formed payload."
        test_recipe:
          setup: ["community + holder"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-FB1" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H FB1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "Rogue", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

      - name: vehicle_create_for_other_holder_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", roles]
        distinguishing_aspect: "Ownership: PermitHolder acting as holder A cannot create a vehicle naming holder B in holder_id — ERR_FORBIDDEN 403 (X-User-ID must equal the owning holder_id)."
        test_recipe:
          setup: ["community; holders A and B"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-FB2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H A", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_a: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H B", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_b: $.data.id } }
          trigger:
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_b}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

      - name: activate_nonexistent_registration_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 5): activating a non-existent registration id returns ERR_NOT_FOUND 404, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["community + holder (caller context)"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-NF2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H NF2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /api/registrations/00000000-0000-0000-0000-000000000000/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: lsv_equipment_minimum_mirror_zero_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_EQUIPMENT_MINIMUM]", entities.Vehicle.fields.mirror_count]
        distinguishing_aspect: "Boundary at equipment count 0: an LSV with headlights, brake lights and seatbelts but mirror_count == 0 fails the LSV safety minimum at registration creation."
        test_recipe:
          setup: ["community + holder + LSV vehicle with mirror_count 0"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-EQ" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H EQ", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: true, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EQUIPMENT_MINIMUM with http 422 (mirror_count >= 1 required for LSV)"

      - name: insurance_coverage_one_cent_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSURANCE_COVERAGE_LOW]"]
        distinguishing_aspect: "Boundary at exactly minimum minus one cent: coverage 9999999 against min 10000000 fails ERR_INSURANCE_COVERAGE_LOW; 10000000 itself succeeds (checked by the happy paths elsewhere)."
        test_recipe:
          setup: ["community (default min 10000000) + holder + vehicle"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-COV" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H COV", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-COV", liability_coverage_cents: 9999999, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSURANCE_COVERAGE_LOW with http 422"

      - name: duplicate_registration_same_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "Aggregate/uniqueness constraint: a second non-terminal registration for the same (vehicle_id, registration_year) fails ERR_DUPLICATE_REGISTRATION 409."
        test_recipe:
          setup: ["community + holder + vehicle + existing DRAFT 2026 registration"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-DUP" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H DUP", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_REGISTRATION with http 409"

      - name: slot_index_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", entities.ChargingReservation.fields.slot_index]
        distinguishing_aspect: "slot_index must satisfy 0..slot_count-1; index == slot_count (2 for a 2-slot station) is a schema-range failure ERR_VALIDATION 400, fired before any overlap or fiscal check."
        test_recipe:
          setup: ["ONLINE station with slot_count 2; holder"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-SLOT" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H SLOT", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-SLOT", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 2, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: reservation_end_not_after_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", entities.ChargingReservation.fields.end_at]
        distinguishing_aspect: "Window shape check: end_at equal to or before start_at fails ERR_VALIDATION 400 at priority 1 before any other rule runs."
        test_recipe:
          setup: ["ONLINE station; holder"]
          setup_api_calls:
