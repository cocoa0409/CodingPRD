# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1595 (§1.8 Test Targeting Index)
# 9 rules x >=2 instances = 22 instances. Every setup chain drives empty-DB to
# the precondition state using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default at server start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rubric_provisional_vs_official_trim
        grounds:
          - calculations.pilot_composite_score
          - entities.InstructionalMaterial.fields.provisional_composite
          - entities.InstructionalMaterial.fields.official_composite
        distinguishing_aspect: |
          Same five SUBMITTED reviews produce provisional_composite 2.80 (untrimmed mean) and
          official_composite 2.87 (one low + one high trimmed at n >= 5) — a dual variant on the
          pilot-scoring entity domain, distinct from the procurement-domain pair in
          award_lowest_responsive_vs_best_value and the budget-domain pair in
          forecast_rolling_vs_straight_line.
        test_recipe:
          setup:
            - "Cycle in PILOT_OPEN with one material (VETTED, then PILOT_CANDIDATE) and one ACTIVE pilot with teacher_count 8"
            - "Five SUBMITTED reviews whose composites are 4.0, 3.0, 2.0, 3.6, 1.4"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Core Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 8 }
              as: CurriculumDirector
              captures: { pil_id: $.data.id }
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 3, alignment_score: 3, usability_score: 3, equity_score: 3 }
              as: Teacher
              as_user_id: "t2"
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 2, alignment_score: 2, usability_score: 2, equity_score: 2 }
              as: Teacher
              as_user_id: "t3"
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 3, usability_score: 4, equity_score: 3 }
              as: Teacher
              as_user_id: "t4"
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 1, alignment_score: 2, usability_score: 1, equity_score: 2 }
              as: Teacher
              as_user_id: "t5"
            - call: "GET /materials/${mat_id}"
              as: CurriculumDirector
              captures: { prov: $.data.provisional_composite }
          trigger:
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "GET /materials/${mat_id}"
              as: CurriculumDirector
              captures: { official: $.data.official_composite, participation: $.data.participation_rate }
          assert:
            - "captured provisional_composite == 2.80"
            - "Material.${mat_id}.official_composite == 2.87 (trimmed mean of 3.0, 2.0, 3.6 after dropping 1.4 and 4.0)"
            - "Material.${mat_id}.participation_rate == 0.625 (5 reviews / 8 seats)"
            - "official_composite (2.87) != provisional_composite (2.80) for identical review data"

      - name: award_lowest_responsive_vs_best_value
        grounds:
          - calculations.best_value_score
          - calculations.bundled_pricing_total
          - entities.AdoptionCycle.fields.award_method
        distinguishing_aspect: |
          Identical quote pool (50800.00 / 52300.00 / 52800.00 evaluated totals) yields different
          award winners under the two cycle-configured methods: LOWEST_RESPONSIVE picks the cheap
          quote, BEST_VALUE picks the pricier high-service quote (score 88.52) — a dual variant on
          the procurement domain, distinct from the pilot-scoring domain in
          rubric_provisional_vs_official_trim.
        test_recipe:
          setup:
            - "Cycle A (MATHEMATICS, award_method LOWEST_RESPONSIVE) ADOPTED with material MA; quotes QA/QB/QC UNDER_EVALUATION with evaluated totals 50800.00/52300.00/52800.00"
            - "Cycle B (SCIENCE, award_method BEST_VALUE) ADOPTED with material MB; identical quote pool QBA/QBB/QBC"
            - "review composites for both materials: 4.0, 3.3, 3.7 (official 3.67, participation 1.0)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 4, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_m: $.data.id }
            - call: "POST /frameworks"
