          assert:
            - "all four rider-B calls return HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\""
            - "no Appeal row is created: GET /determinations/${det_id}/appeals as the admin returns total_count == 0"
            - "rider A's two reads return HTTP 200 with ${a_app_status} == \"DETERMINED\" and ${a_det_status} == \"ISSUED\""

      - name: receiving_the_same_verification_twice_is_a_verification_state_error
        claim_type: idempotency
        grounds:
          - validations.priority_30.ERR_VERIFICATION_STATE_INVALID
          - validations.priority_30.ERR_INVALID_APPLICATION_STATE
          - errors.ERR_VERIFICATION_PENDING
        distinguishing_aspect: "Two rules share priority 30 but key on different rows, and the replay separates them: a second receive on the already-RECEIVED verification is ERR_VERIFICATION_STATE_INVALID, while requesting a brand-new verification from the now ASSESSMENT_REQUIRED application is ERR_INVALID_APPLICATION_STATE — and a second verification requested while the first is still REQUESTED is ERR_VERIFICATION_PENDING."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one SUBMITTED application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Zofia Wieczorek", date_of_birth: "1971-11-11", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: true, max_walk_distance_meters: 130, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. R Aguilar", provider_type: "PHYSICIAN", provider_license_number: "MD-90028" }
              as: IntakeClerk
              captures: { ver_id: $.data.id, ver_status: $.data.status }
          trigger:
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. S Lindgren", provider_type: "OCCUPATIONAL_THERAPIST", provider_license_number: "OT-3301" }
              as: IntakeClerk
              captures: { pending_err: $.data.error_id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["lumbar stenosis"], attests_permanent: true }
              as: IntakeClerk
              captures: { received_status: $.data.status, wait: $.data.wait_days }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["lumbar stenosis"], attests_permanent: true }
              as: IntakeClerk
              captures: { replay_err: $.data.error_id }
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. S Lindgren", provider_type: "OCCUPATIONAL_THERAPIST", provider_license_number: "OT-3301" }
              as: IntakeClerk
              captures: { after_state_err: $.data.error_id }
            - call: "GET /applications/${appn_id}/verifications"
              payload: {}
              as: IntakeClerk
          assert:
            - "${ver_status} == \"REQUESTED\" on creation"
            - "the second request while the first is REQUESTED returns HTTP 409 with data.error_id == \"ERR_VERIFICATION_PENDING\""
            - "the first receive returns HTTP 200 with ${received_status} == \"RECEIVED\" and ${wait} == 0 (requested and received at the same instant)"
            - "the replayed receive returns HTTP 409 with data.error_id == \"ERR_VERIFICATION_STATE_INVALID\""
            - "the post-receive verification request returns HTTP 409 with data.error_id == \"ERR_INVALID_APPLICATION_STATE\" (the application is ASSESSMENT_REQUIRED)"
            - "GET /applications/${appn_id}/verifications returns total_count == 1 — none of the three refusals created a row"

      - name: appeal_filing_errors_are_covered_by_the_difficulty_pair
        excluded_because:
          difficulty_instance: draft_determination_appeal_after_window_rejects_state_before_temporal
          rationale: "ERR_DETERMINATION_NOT_APPEALABLE and ERR_APPEAL_WINDOW_CLOSED are both triggered there on one fixture (a DRAFT determination appealed past the 60-day window, then an ISSUED determination appealed on day 61 versus day 60), so both catalog entries already have a reachable trigger."

      - name: booking_capacity_and_window_errors_are_covered_by_the_difficulty_layers
        excluded_because:
          difficulty_instance: vehicle_half_open_window_with_aggregate_wheelchair_lane_capacity
          rationale: "ERR_VEHICLE_WINDOW_CONFLICT is raised there by the aggregate lane-capacity fixture, and ERR_VEHICLE_NOT_ACCESSIBLE plus ERR_PICKUP_WINDOW_LATE are raised by booking_accessibility_safety_precedes_window_conflict_and_late_pickup; ERR_BOOKING_NOT_CANCELLABLE is raised by vehicle_open_reservation_counter_restored_by_booking_cancel. Re-triggering them here would add no reachability information."

      - name: slot_conflict_and_conduct_errors_are_covered_by_the_difficulty_layers
        excluded_because:
          difficulty_instance: evaluator_slot_closed_interval_plus_fifteen_minute_buffer
          rationale: "ERR_EVALUATOR_SLOT_CONFLICT is raised there at the buffer boundary; ERR_SUSPENSION_UNSUPPORTED and the dominated ERR_DUE_PROCESS_INCOMPLETE are analysed by suspension_decide_blocked_by_recomputed_applicant_conduct_mirrors, and ERR_CATEGORY_NOT_TRAINABLE by travel_training_referral_requires_trainable_determination_category."

  - section: rbac
    instances:
      - name: exclusive_operations_rejects_peer_roles_before_any_existence_check
        claim_type: exclusive_operations
        grounds:
          - roles.Evaluator.exclusive_operations
          - roles.EligibilitySpecialist.exclusive_operations
          - roles.IndependentReviewer.exclusive_operations
          - roles.ConductOfficer.exclusive_operations
          - roles.TravelTrainer.exclusive_operations
          - validations.priority_2.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The declared role model is segregation_of_duties with no hierarchical override, so each specialist role is refused on every other role's exclusive operation — and because priority 2 sits above the priority-10 existence check, the refusal is a 403 ERR_FORBIDDEN_ROLE even when the addressed id does not exist, which distinguishes a genuine authorisation model from one that resolves the resource first."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one applicant, used only to prove the shared operations still work for both holders"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Abel Fournier", date_of_birth: "1968-08-28", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { rider_v: $.data.version }
          trigger:
            - call: "POST /assessments/00000000-0000-4000-8000-0000000000f1/scores"
              payload: { board_alight_score: 2, wayfinding_score: 2, distance_meters_walked: 100, heat_sensitivity_flag: false }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { spec_scores_err: $.data.error_id }
            - call: "POST /assessments/00000000-0000-4000-8000-0000000000f1/sign-off"
              payload: {}
              as: Evaluator
              as_user_id: "eval-1"
              captures: { eval_signoff_err: $.data.error_id }
            - call: "POST /determinations/00000000-0000-4000-8000-0000000000f2/issue"
              payload: {}
              as: IndependentReviewer
              as_user_id: "rev-1"
              captures: { reviewer_issue_err: $.data.error_id }
            - call: "POST /appeals/00000000-0000-4000-8000-0000000000f3/decision"
              payload: { outcome: "UPHELD" }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { spec_decision_err: $.data.error_id }
            - call: "POST /travel-training-referrals/00000000-0000-4000-8000-0000000000f4/complete"
              payload: { fixed_route_competency_score: 90 }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { conduct_complete_err: $.data.error_id }
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${rider_v}", review_window_end_date: "2026-08-31" }
              as: TravelTrainer
              as_user_id: "tt-1"
              captures: { trainer_proceeding_err: $.data.error_id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-20", event_type: "COMPLETED" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { co_event: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-21", event_type: "COMPLETED" }
              as: AccessibilityOfficeAdmin
              captures: { admin_event: $.data.id }
            - call: "GET /applicants/${rider_id}/trip-events"
              payload: {}
              as: ConductOfficer
          assert:
            - "all six cross-role attempts return HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "the four attempts addressing non-existent ids still return 403, never 404 — priority 2 precedes priority 10"
            - "the TravelTrainer proposal is refused on the role alone even though the expected_applicant_version it carries is current — priority 2 precedes the priority-35 OCC check, so the answer is 403 and never 412"
            - "both trip-event writes succeed with HTTP 201 (the operation is shared by ConductOfficer and AccessibilityOfficeAdmin) and GET /applicants/${rider_id}/trip-events returns total_count == 2"

      - name: an_applicant_cannot_reach_staff_only_reads_but_keeps_the_shared_writes
        claim_type: shared_operations
        grounds:
          - roles.Applicant.shared_operations
          - endpoints.GET_/assessments
          - endpoints.GET_/vehicles/{id}
          - validations.priority_2.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The Applicant role is absent from the operational list endpoints (GET /assessments, GET /transportation-bookings, GET /applications/{id}/verifications, GET /vehicles/{id}) yet present on the shared write path POST /applications and POST /applications/{id}/submit: the same rider is 403 on all four reads and 201/200 on both writes, which separates role scoping from the ownership rule at priority 3."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one applicant and one vehicle"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bea Solberg", date_of_birth: "1975-05-25", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_number: "V-8200", wheelchair_positions: 1, ambulatory_seats: 4, status: "IN_SERVICE" }
              as: AccessibilityOfficeAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: true, max_walk_distance_meters: 150, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { appn_id: $.data.id, appn_status: $.data.status }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { submitted_status: $.data.status }
            - call: "GET /assessments"
              payload: {}
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { list_asmt_err: $.data.error_id }
            - call: "GET /transportation-bookings"
              payload: {}
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { list_book_err: $.data.error_id }
            - call: "GET /applications/${appn_id}/verifications"
              payload: {}
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { list_ver_err: $.data.error_id }
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { veh_err: $.data.error_id }
            - call: "GET /applications"
              payload: { applicant_id: "${rider_id}" }
              as: Applicant
              as_user_id: "${rider_id}"
          assert:
            - "${appn_status} == \"DRAFT\" then ${submitted_status} == \"SUBMITTED\" — both shared writes succeed for the rider"
            - "all four reads return HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\", including the verifications list nested under the rider's OWN application (role scoping, not ownership)"
            - "GET /applications?applicant_id=${rider_id} as the rider returns HTTP 200 with total_count == 1 — the rider can still list their own applications, which is a declared Applicant endpoint"

      - name: the_same_user_cannot_score_and_sign_off_one_assessment
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_44.ERR_SIGNOFF_NOT_INDEPENDENT
