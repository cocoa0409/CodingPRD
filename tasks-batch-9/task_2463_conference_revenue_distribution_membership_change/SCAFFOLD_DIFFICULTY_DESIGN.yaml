              as: MemberRepresentative
              as_user_id: "${m_e_id}"
            - &k_bal_w
              call: "POST /budget-proposals/${bp_id}/ballots"
              payload: { member_id: "${m_w_id}", choice: "FOR" }
              as: MemberRepresentative
              as_user_id: "${m_w_id}"
            - &k_bp_close
              call: "POST /budget-proposals/${bp_id}/close-voting"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - &k_conf_read
              call: "GET /conference"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
              captures: { conf_v: $.data.version }
            - &k_res12
              call: "POST /conference/reserve-transfers"
              payload: { transfer_type: "CONTRIBUTION", amount_cents: 12000000, expected_conference_version: "${conf_v}", memo: "FY2027 reserve seeding" }
              as: Treasurer
              as_user_id: "u_trs_1"
            - &k_g1
              call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_s_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { g1_id: $.data.id }
            - &k_g2
              call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-09-12T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { g2_id: $.data.id }
            - &k_g3
              call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_w_id}", venue_id: "${v1_id}", game_date: "2026-09-19T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { g3_id: $.data.id }
            - &k_g4
              call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_s_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-09-26T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { g4_id: $.data.id }
            - &k_g1_play
              call: "POST /schedule-games/${g1_id}/play"
              payload: {}
              as: ScheduleCoordinator
            - &k_g2_play
              call: "POST /schedule-games/${g2_id}/play"
              payload: {}
              as: ScheduleCoordinator
            - &k_g4_play
              call: "POST /schedule-games/${g4_id}/play"
              payload: {}
              as: ScheduleCoordinator
            - &k_ba_n
              call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Prairie Bowl", event_tier: "TOURNAMENT", payout_cents: 12000000, submitted_expense_cents: 9500000, travel_miles: 1400, units_claimed: 2 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_n_id: $.data.id }
            - &k_ba_n_rev
              call: "POST /bowl-appearances/${ba_n_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - &k_ba_n_app
              call: "POST /bowl-appearances/${ba_n_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - &k_ba_w
              call: "POST /members/${m_w_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Harvest Bowl", event_tier: "BOWL", payout_cents: 6000000, submitted_expense_cents: 4200000, travel_miles: 900, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_w_id: $.data.id }
            - &k_pool
              call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, pool_type: "MEDIA_RIGHTS", allocation_method: "APPEARANCE_PERFORMANCE_WEIGHTED", gross_revenue_cents: 500000000, estimated_expense_cents: 20000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_id: $.data.id }
            - &k_pool_open
              call: "POST /revenue-pools/${rp_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - &k_pool_read
              call: "GET /revenue-pools/${rp_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_v: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "FY2027 provisional" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { run_p_id: $.data.id }
            - call: "POST /bowl-appearances/${ba_w_id}/void"
              payload: { reason: "Appearance withdrawn by the institution" }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /revenue-pools/${rp_id}/close-books"
              payload: { audited_expense_cents: 26500000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /revenue-pools/${rp_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_v2: $.data.version }
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${rp_v2}", memo: "FY2027 final" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { run_f_id: $.data.id }
          assert:
            - "DistributionRun.${run_p_id}.variant == PROVISIONAL and DistributionRun.${run_p_id}.net_pool_cents == 480000000"
            - "DistributionRun.${run_p_id}.reserve_draw_cents == 6000000 and DistributionRun.${run_p_id}.distributable_cents == 474000000"
            - "DistributionRun.${run_p_id}.total_weight_bps == 57000 and DistributionRun.${run_p_id}.remainder_cents == 1"
            - "DistributionLine(run=${run_p_id}, member=${m_n_id}).weight_bps == 17000 and .gross_share_cents == 141368422 and .withheld_cents == 14136843 and .governance_fee_cents == 1250000 and .net_payable_cents == 125981579"
            - "DistributionLine(run=${run_p_id}, member=${m_s_id}).weight_bps == 13000 and .gross_share_cents == 108105263 and .withheld_cents == 10810527 and .net_payable_cents == 96044736"
            - "DistributionLine(run=${run_p_id}, member=${m_e_id}).weight_bps == 13000 and .gross_share_cents == 108105263 and .net_payable_cents == 96044736"
            - "DistributionLine(run=${run_p_id}, member=${m_w_id}).weight_bps == 14000 and .gross_share_cents == 116421052 and .withheld_cents == 11642106 and .net_payable_cents == 103528946"
            - "DistributionRun.${run_f_id}.variant == FINAL_AUDITED and DistributionRun.${run_f_id}.net_pool_cents == 473500000"
            - "DistributionRun.${run_f_id}.reserve_draw_cents == 6000000 and DistributionRun.${run_f_id}.distributable_cents == 467500000"
            - "DistributionRun.${run_f_id}.total_weight_bps == 51500 and DistributionRun.${run_f_id}.remainder_cents == 2"
            - "DistributionLine(run=${run_f_id}, member=${m_n_id}).weight_bps == 15500 and .gross_share_cents == 140703884 and .withheld_cents == 0 and .net_payable_cents == 139453884"
            - "DistributionLine(run=${run_f_id}, member=${m_w_id}).weight_bps == 10000 and .gross_share_cents == 90776699 and .net_payable_cents == 89526699"
            - "DistributionLine(run=${run_p_id}, member=${m_n_id}).gross_share_cents != DistributionLine(run=${run_f_id}, member=${m_n_id}).gross_share_cents"
            - "DistributionRun.${run_p_id}.status == SUPERSEDED is false; the provisional run remains COMPUTED because the final run is a different variant, and DistributionRun.${run_p_id}.superseded_by_run_id == null"

      - name: rolling_six_year_vs_current_year_only_unit_valuation
        grounds:
          - calculations.postseason_unit_valuation
          - entities.Member.fields.status
          - entities.PostseasonUnit.fields.fiscal_year
          - state_machines.Member.FULL_SHARE_to_WITHDRAWAL_NOTICED
        distinguishing_aspect: |
          This instance places the dual-variant calculation on a different entity domain
          from the distribution instance: the variant selector is Member.status rather than
          a request field, and it switches an aggregation window rather than an expense
          basis, so North's identical 6 validated units are worth 204000000 cents while
          FULL_SHARE and 102000000 cents the moment the member is WITHDRAWAL_NOTICED.
        test_recipe:
          setup:
            - "The conference is FORMING with current_fiscal_year 2027 and unit_value_cents 34000000."
            - "Member North is FULL_SHARE with a POSTED FY2026 final distribution behind it, giving last_full_annual_distribution_cents 147500000."
            - "North holds 6 VALIDATED postseason units: 2 from a FY2025 appearance, 1 from a FY2026 appearance and 3 from a FY2027 appearance."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2025, event_name: "Lakeside Bowl", event_tier: "BOWL", payout_cents: 5000000, submitted_expense_cents: 3000000, travel_miles: 400, units_claimed: 2 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba25_id: $.data.id }
            - call: "POST /bowl-appearances/${ba25_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba25_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2026, event_name: "Riverbend Bowl", event_tier: "BOWL", payout_cents: 5000000, submitted_expense_cents: 3000000, travel_miles: 400, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba26_id: $.data.id }
            - call: "POST /bowl-appearances/${ba26_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba26_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Prairie Bowl", event_tier: "TOURNAMENT", payout_cents: 12000000, submitted_expense_cents: 9500000, travel_miles: 1400, units_claimed: 3 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba27_id: $.data.id }
            - call: "POST /bowl-appearances/${ba27_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba27_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          trigger:
            - call: "GET /members/${m_n_id}/postseason-unit-valuation"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_n_id}/withdrawal-notice"
              payload: { withdrawal_effective_fiscal_year: 2028, notice_days: 400, reason: "Conference realignment" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "GET /members/${m_n_id}/postseason-unit-valuation"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "the first valuation response has variant == ROLLING_SIX_YEAR, window_start_fiscal_year == 2022, window_end_fiscal_year == 2027, validated_unit_count == 6 and valuation_cents == 204000000"
            - "the second valuation response has variant == CURRENT_YEAR_ONLY, window_start_fiscal_year == 2027, window_end_fiscal_year == 2027, validated_unit_count == 3 and valuation_cents == 102000000"
            - "the underlying PostseasonUnit rows are unchanged: 6 rows remain in status VALIDATED across both calls"
            - "Member.${m_n_id}.status == WITHDRAWAL_NOTICED and Member.${m_n_id}.voting_weight_bps == 0"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: bowl_reimbursement_nested_caps_and_payout_band
        grounds:
          - calculations.bowl_expense_reimbursement
          - entities.BowlAppearance.fields.reimbursement_band_bps
          - entities.BowlAppearance.fields.residual_to_pool_cents
          - state_machines.BowlAppearance.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Four inputs - submitted_expense_cents, travel_miles, payout_cents and the
          payout-derived band - interact through two independent min() caps and one
          tier branch, so no single input moves the answer monotonically: the 9500000
          claim is clipped to the 8000000 allowable cap, the 1400 miles yield 133000
          cents of allowance, and the 12000000 payout selects the 6000 bps band whose
          7200000 ceiling then binds below the 8133000 uncapped entitlement.
        test_recipe:
          setup:
            - "The conference exists in FORMING with current_fiscal_year 2027 and member North seated as a charter member."
            - "North has submitted a FY2027 TOURNAMENT appearance with payout 12000000 cents, a 9500000 cent expense claim and 1400 travel miles, and it is UNDER_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_mn
            - *k_ba_n
            - *k_ba_n_rev
          trigger:
            - call: "POST /bowl-appearances/${ba_n_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "BowlAppearance.${ba_n_id}.allowable_expense_cents == 8000000 (the 9500000 claim clipped by ALLOWABLE_EXPENSE_CAP_CENTS)"
            - "BowlAppearance.${ba_n_id}.travel_allowance_cents == 133000"
            - "BowlAppearance.${ba_n_id}.reimbursement_band_bps == 6000"
            - "BowlAppearance.${ba_n_id}.reimbursed_cents == 7200000"
            - "BowlAppearance.${ba_n_id}.residual_to_pool_cents == 4800000"
            - "BowlAppearance.${ba_n_id}.status == APPROVED"
            - "Conference.escrow_balance_cents == 4800000 and Conference.validated_postseason_unit_count == 2"

      - name: exit_settlement_bracket_keyed_on_base_not_total
        grounds:
          - calculations.exit_settlement_assessment
          - entities.Member.fields.exit_settlement_total_cents
          - entities.Member.fields.last_full_annual_distribution_cents
          - state_machines.Member.FULL_SHARE_to_WITHDRAWAL_NOTICED
        distinguishing_aspect: |
          The surcharge bracket is keyed on base_assessment_cents (295000000, which sits
          below the 300000000 bracket edge and therefore draws 350 bps) and not on the
          settlement total (305325000, which sits above that edge and would draw 500 bps),
          so the pinned evaluation order yields 305325000 cents while the naive
          bracket-on-total ordering would yield 309750000 - the divergence proves the
          order rather than merely exercising the tiers.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "Four charter members are FULL_SHARE at 10000 bps."
            - "A FY2026 EQUAL_SHARE MEDIA_RIGHTS pool holding 600000000 gross cents and 4000000 audited expense cents has been distributed FINAL_AUDITED, audited and POSTED, so every member's last_full_annual_distribution_cents is 147500000 and the reserve now holds 18000000 cents."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - &k_p26
              call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2026, pool_type: "MEDIA_RIGHTS", allocation_method: "EQUAL_SHARE", gross_revenue_cents: 600000000, estimated_expense_cents: 4000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_id: $.data.id }
            - &k_p26_open
              call: "POST /revenue-pools/${p26_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - &k_p26_cb
              call: "POST /revenue-pools/${p26_id}/close-books"
              payload: { audited_expense_cents: 4000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - &k_p26_read
              call: "GET /revenue-pools/${p26_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_v: $.data.version }
            - &k_r26
              call: "POST /revenue-pools/${p26_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${p26_v}", memo: "FY2026 final" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { r26_id: $.data.id }
            - &k_ar26
              call: "POST /audit-reports"
              payload: { conference_id: "${conf_id}", distribution_run_id: "${r26_id}", fiscal_year: 2026, opinion: "UNQUALIFIED" }
              as: Auditor
              as_user_id: "u_aud_1"
              captures: { ar26_id: $.data.id }
            - &k_ar26_issue
              call: "POST /audit-reports/${ar26_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - &k_r26_post
              call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
          trigger:
            - call: "POST /members/${m_n_id}/withdrawal-notice"
