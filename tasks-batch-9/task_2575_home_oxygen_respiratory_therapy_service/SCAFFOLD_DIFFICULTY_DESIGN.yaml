            - "The malfunction is TIER_3 (symptom LEAK, gap 5 < TIER_2_GAP_MINUTES 15), so Placement.${pl_id}.status stays PLACED and EquipmentUnit.${u_stat}.status stays DEPLOYED"
            - "After the malfunction: Patient.${p_id}.oxygen_safety_risk_score == 70.00 (ONGOING_SURVEILLANCE: base_factor 60 plus ESCALATION_STEP 5 times two extra non-zero factors) AND risk_variant_applied == ONGOING_SURVEILLANCE AND compliance_hold == true"
            - "POST /home-oxygen/travel-authorizations/${ta_id}/approve -> 409 ERR_PATIENT_ON_COMPLIANCE_HOLD (priority 53); TravelAuthorization.${ta_id}.status stays REQUESTED and decided_by_user_id stays null"
            - "The authorization's own fields are untouched: supply_cylinders_authorized is still 10 and its interval is still 2026-08-10T12:00:00Z to 2026-08-11T00:00:00Z — only the Patient row's compliance_hold changed"
            - "compliance_hold flipped at exactly the inclusive threshold: 70.00 >= COMPLIANCE_HOLD_THRESHOLD 70.00"
            - "POST /home-oxygen/travel-authorizations/${ta_id}/deny is still permitted, so the authorization is not deadlocked"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: route_stop_half_open_window_with_trailing_buffer
        grounds:
          - validations[priority=74]
          - errors[ERR_ROUTE_STOP_WINDOW_CONFLICT]
          - entities.Branch.fields.tank_exchange_buffer_minutes
          - entities.RouteStop.fields.window_start_utc
          - entities.RouteStop.fields.window_end_utc
          - calculations.route_liters_committed
          - endpoints[POST /home-oxygen/route-stops]
        distinguishing_aspect: |
          The contended resource is the DeliveryRoute (one driver's day), and its interval semantics
          are BUFFERED HALF-OPEN [start, end + 30 min): a stop starting exactly at a predecessor's
          buffered end instant is accepted, while a stop starting 15 minutes earlier is rejected.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) whose tank_exchange_buffer_minutes is 30, with one IN_STOCK STATIONARY_CONCENTRATOR."
            - "One ACTIVE patient with an ACTIVE certificate (3.0 LPM, 24 h/day, portable not prescribed, lifetime need)."
            - "One RentalContract in (billing ACCRUING, service IN_SERVICE) after a passing setup on 2026-08-01, so TANK_EXCHANGE stops are allowed for it."
            - "A second DeliveryRoute in PLANNING on 2026-08-15 with shift 12:00Z to 22:00Z and no stops yet."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
