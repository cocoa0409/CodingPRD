# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) — Jury Duty Management
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# §1.8 covers the depth rules; here we enumerate the remaining testable claims.
# All grounds resolve into SCAFFOLD.yaml; names are unique across §1.8 ∪ §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_service_term_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.ServiceTerm, endpoints]
        distinguishing_aspect: "POST /service-terms with all required fields → 201; response carries id, version==1, status==DRAFT, draw_seq==0, pool_size==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-terms"
              payload: { name: "C1", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id", v: "$.data.version" }
          assert:
            - "Response code 201; ServiceTerm.status == DRAFT, version == 1, draw_seq == 0, pool_size == 0, summoned_count == 0."
            - "fta_disqualify_threshold defaults to 3 when omitted."

      - name: create_service_term_missing_required_field
        claim_type: Required Fields
        grounds: [entities.ServiceTerm.fields.daily_pay_cents]
        distinguishing_aspect: "POST /service-terms omitting daily_pay_cents → 422 ERR_INVALID_REQUEST; no term created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-terms"
              payload: { name: "C2", report_date: "2026-07-01T00:00:00Z", half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "Response code 422 and error_id == ERR_INVALID_REQUEST."

      - name: get_service_term_not_found
        claim_type: Not Found
        grounds: [entities.ServiceTerm, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-terms/{non-existent-uuid} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: JuryAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "Response code 404 and error_id == ERR_NOT_FOUND."

      - name: juror_qualification_status_defaults_pending
        claim_type: Defaults
        grounds: [entities.Juror.fields.qualification_status]
        distinguishing_aspect: "POST /service-terms/{id}/jurors → new Juror has qualification_status PENDING, fta_strike_count 0, disqualified false, last_drawn_seq 0."
        test_recipe:
          setup: ["A DRAFT service term."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "C4", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
          trigger:
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Pen J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
          assert:
            - "Juror.qualification_status == PENDING, fta_strike_count == 0, disqualified == false, last_drawn_seq == 0."

      - name: questionnaire_ineligible_marks_juror_and_excuses_summons
        claim_type: Computed Fields
        grounds: [calculations.qualification_evaluation, entities.QualificationResponse.fields.evaluated_status, state_machines.Summons.SUMMONED_to_QUALIFIED_PENDING]
        distinguishing_aspect: "A questionnaire with is_citizen false evaluates INELIGIBLE: QualificationResponse.evaluated_status == INELIGIBLE, Juror.qualification_status == INELIGIBLE, Summons short-circuits to EXCUSED."
        test_recipe:
          setup: ["Term OPEN, one summons SUMMONED for a qualified-by-override juror who then submits a disqualifying questionnaire."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "C5", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Roe J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
          trigger:
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: false, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { evaluated: "$.data.evaluated_status" }
            - call: "GET /summonses/${summons_id}"
              payload: {}
              as: CourtClerk
          assert:
            - "QualificationResponse.evaluated_status == INELIGIBLE."
            - "Summons.status == EXCUSED and Juror.qualification_status == INELIGIBLE."

      - name: system_fields_input_ignored_on_summons
        claim_type: System Fields
        grounds: [entities.Summons.fields.badge_number, entities.Summons.fields.status]
        distinguishing_aspect: "Summons.id/badge_number/status are server-minted; the draw endpoint takes no per-summons body so client cannot set them — drawn summons has status SUMMONED and a server badge_number."
        test_recipe:
          setup: ["Term OPEN with one qualified juror."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "C6", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Sid J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
          trigger:
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id", badge: "$.data[0].badge_number", st: "$.data[0].status" }
          assert:
            - "Drawn Summons.status == SUMMONED and badge_number is a server-assigned integer (>= 1)."

      - name: invalid_enum_disposition_kind_rejected
        claim_type: Type Constraints
        grounds: [entities.Disposition.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /summonses/{id}/dispositions with kind 'POSTPONE' (not in {DEFER,EXCUSE,EXEMPT}) → 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Term OPEN, one QUALIFIED_PENDING summons owned by the juror."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "C7", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Tam J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
          trigger:
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "POSTPONE", reason_code: "OTHER" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response code 422 and error_id == ERR_INVALID_REQUEST."

      - name: list_service_terms_paginated_envelope
        claim_type: Listing
        grounds: [entities.ServiceTerm, endpoints]
        distinguishing_aspect: "GET /service-terms returns an array envelope with total_count and has_more; 3 terms created, limit 2 → 2 returned, total_count 3, has_more true."
        test_recipe:
          setup: ["Three DRAFT service terms."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "L1", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "L2", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "L3", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
          trigger:
            - call: "GET /service-terms?limit=2&offset=0"
              payload: {}
              as: JuryAdministrator
          assert:
            - "Response is an array of 2 ServiceTerms; meta/envelope total_count == 3 and has_more == true."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: requalify_already_qualified_summons_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Summons.SUMMONED_to_QUALIFIED_PENDING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a second questionnaire on a summons already in QUALIFIED_PENDING → 409 ERR_INVALID_STATE; no second QualificationResponse created."
        test_recipe:
          setup: ["Term OPEN, one summons already QUALIFIED_PENDING (questionnaire submitted once)."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "S1", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Uma J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
          trigger:
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response code 409 and error_id == ERR_INVALID_STATE."

      - name: release_terminal_summons_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Summons, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an EXCUSED (terminal) summons → 409 ERR_INVALID_STATE; no PayVoucher created."
        test_recipe:
          setup: ["A summons in terminal EXCUSED state (granted EXCUSE disposition)."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "S2", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Vic J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "EXCUSE", reason_code: "CAREGIVER" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: "$.data.id" }
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: CourtClerk
          trigger:
            - call: "POST /summonses/${summons_id}/release"
              payload: {}
              as: CourtClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "Response code 409 and error_id == ERR_INVALID_STATE; Summons stays EXCUSED."

      - name: excuse_branch_grants_terminal_excused
        claim_type: Valid Transition
        grounds: [state_machines.Summons.QUALIFIED_PENDING_to_EXCUSED, state_machines.Disposition.PENDING_to_GRANTED]
        distinguishing_aspect: "Granting an EXCUSE disposition (CourtClerk) moves the summons QUALIFIED_PENDING→EXCUSED and Disposition PENDING→GRANTED with decided_by_role stamped CourtClerk."
        test_recipe:
          setup: ["Term OPEN, one QUALIFIED_PENDING summons with a PENDING EXCUSE disposition."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "S3", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Wes J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "EXCUSE", reason_code: "MEDICAL" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: "$.data.id" }
          trigger:
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: CourtClerk
            - call: "GET /summonses/${summons_id}"
              payload: {}
              as: CourtClerk
          assert:
            - "Disposition.decision == GRANTED, decided_by_role == CourtClerk; Summons.status == EXCUSED."

      - name: exempt_branch_grants_terminal_exempt
        claim_type: Valid Transition
        grounds: [state_machines.Summons.QUALIFIED_PENDING_to_EXEMPT]
        distinguishing_aspect: "Granting an EXEMPT disposition (CourtClerk) moves the summons QUALIFIED_PENDING→EXEMPT (terminal)."
        test_recipe:
          setup: ["Term OPEN, one QUALIFIED_PENDING summons with a PENDING EXEMPT disposition."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "S4", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: "$.data.id" }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Xan J", birth_year: 1944, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: "$.data.id" }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: "$.data.version" }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "EXEMPT", reason_code: "AGE" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: "$.data.id" }
          trigger:
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: CourtClerk
            - call: "GET /summonses/${summons_id}"
              payload: {}
              as: CourtClerk
          assert:
            - "Summons.status == EXEMPT (terminal)."

      - name: deferral_third_attempt_blocked
        claim_type: cyclic
        grounds: [state_machines.Summons.QUALIFIED_PENDING_to_DEFERRED, "validations[priority=40]", "errors[ERR_DEFERRAL_LIMIT]"]
        distinguishing_aspect: "After two granted deferrals (deferral_count reaches 2 on the third summons), granting a third DEFER → 409 ERR_DEFERRAL_LIMIT."
        test_recipe:
          setup: ["A summons whose lineage has already been deferred twice (deferral_count 2), QUALIFIED_PENDING on the third term, with a PENDING DEFER disposition targeting a fourth DRAFT term."]
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "D-T1", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { t1: "$.data.id" }
            - call: "POST /service-terms"
              payload: { name: "D-T2", report_date: "2026-08-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { t2: "$.data.id" }
            - call: "POST /service-terms"
              payload: { name: "D-T3", report_date: "2026-09-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { t3: "$.data.id" }
            - call: "POST /service-terms"
              payload: { name: "D-T4", report_date: "2026-10-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { t4: "$.data.id" }
            - call: "POST /service-terms/${t1}/jurors"
              payload: { full_name: "Yul J", birth_year: 1990, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { j1: "$.data.id" }
            - call: "POST /jurors/${j1}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${t1}/open"
              payload: {}
              as: JuryAdministrator
              captures: { t1_v: "$.data.version" }
            - call: "POST /service-terms/${t1}/draw"
              payload: { count: 1, expected_service_term_version: "${t1_v}" }
              as: JuryAdministrator
              captures: { s1: "$.data[0].id" }
            - call: "POST /summonses/${s1}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${j1}"
            - call: "POST /summonses/${s1}/dispositions"
              payload: { kind: "DEFER", reason_code: "HARDSHIP", requested_term_id: "${t2}" }
              as: Juror
              as_user_id: "${j1}"
              captures: { d1: "$.data.id" }
            - call: "POST /dispositions/${d1}/decide"
              payload: { decision: "GRANTED" }
              as: JuryAdministrator
            - call: "GET /service-terms/${t2}/summonses"
              payload: { status: "SUMMONED" }
              as: JuryAdministrator
              captures: { s2: "$.data[0].id", j2: "$.data[0].juror_id" }
            - call: "POST /summonses/${s2}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${j2}"
            - call: "POST /summonses/${s2}/dispositions"
              payload: { kind: "DEFER", reason_code: "HARDSHIP", requested_term_id: "${t3}" }
              as: Juror
              as_user_id: "${j2}"
              captures: { d2: "$.data.id" }
            - call: "POST /dispositions/${d2}/decide"
              payload: { decision: "GRANTED" }
