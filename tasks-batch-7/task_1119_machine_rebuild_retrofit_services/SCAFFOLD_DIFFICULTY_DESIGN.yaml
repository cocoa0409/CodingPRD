            - { call: "GET /api/downtime-windows/${win}", payload: {}, as: LogisticsCoordinator, captures: { win_status: $.data.status } }
            - { call: "POST /api/projects/${proj}/shipment-stages", payload: { window_id: "${win}", stage_sequence: 2, planned_ship_date: "2026-06-16T00:00:00Z", planned_return_date: "2026-06-20T00:00:00Z" }, as: LogisticsCoordinator, captures: { err_gap: $.data.error_id } }
            - { call: "POST /api/projects/${proj}/shipment-stages", payload: { window_id: "${win}", stage_sequence: 2, planned_ship_date: "2026-06-17T00:00:00Z", planned_return_date: "2026-06-25T00:00:00Z" }, as: LogisticsCoordinator, captures: { st_b: $.data.id, st_b_status: $.data.status } }
            - { call: "POST /api/projects/${proj}/shipment-stages", payload: { window_id: "${win}", stage_sequence: 3, planned_ship_date: "2026-05-30T00:00:00Z", planned_return_date: "2026-06-05T00:00:00Z" }, as: LogisticsCoordinator, captures: { err_out: $.data.error_id } }
