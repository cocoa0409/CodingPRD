        default: 0
      - name: re_pierce_eligible
        type: boolean
        source: computed
        description: "Whether the customer may claim a re-pierce under the healing-failure policy."
        default: false
      - name: re_pierce_claim_count
        type: integer
        source: computed
        description: "Number of re-pierce claims already consumed against this session."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Outcome lifecycle status."
        constraints: "ASSESSED | RE_PIERCE_ELIGIBLE | RE_PIERCED | DOWNGRADED | CLOSED"
        default: ASSESSED

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- StoreLocation: posture-driven, cyclic RESTRICTED <-> OPEN --------------
  - entity: StoreLocation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when open_incident_count reaches the restriction threshold, or a bound sterilization cycle fails)"
        actor: system
        preconditions:
          - "Store.status is OPEN"
          - "open_incident_count >= 3 OR at least one bound SterilizationCycle.status == FAILED"
        side_effects:
          - "compliance_posture = RESTRICTED"
          - "Recompute compliance_posture via calculation store_posture_computation"
        note: "Posture gate: while RESTRICTED, no new SCREENED -> IN_SERVICE transition is permitted at this store."

      - from: RESTRICTED
        to: OPEN
        trigger: "POST/piercing-services/stores/{storeId}/posture/clear"
        actor: ComplianceOfficer
        preconditions:
          - "Store.status is RESTRICTED"
          - "open_incident_count == 0"
          - "No bound SterilizationCycle in status IN_PROGRESS, FAILED or QUARANTINED"
        side_effects:
          - "compliance_posture = OPEN"

      - from: OPEN
        to: FROZEN
        trigger: "POST/piercing-services/stores/{storeId}/posture/freeze"
        actor: ComplianceOfficer
        preconditions:
          - "Store.status in {OPEN, RESTRICTED}"
        side_effects:
          - "compliance_posture = FROZEN"
          - "Cascade: every Appointment at this store in status BOOKED or CONFIRMED transitions to CANCELLED"
          - "For each such Appointment: Customer.status unchanged; reschedule_count unchanged"

      - from: RESTRICTED
        to: FROZEN
        trigger: "POST/piercing-services/stores/{storeId}/posture/freeze"
        actor: ComplianceOfficer
        preconditions:
          - "Store.status in {OPEN, RESTRICTED}"
        side_effects:
          - "compliance_posture = FROZEN"
          - "Cascade: every Appointment at this store in status BOOKED or CONFIRMED transitions to CANCELLED"

      - from: FROZEN
        to: RESTRICTED
        trigger: "POST/piercing-services/stores/{storeId}/posture/unfreeze"
        actor: ComplianceOfficer
        preconditions:
          - "Store.compliance_posture is FROZEN"
        side_effects:
          - "compliance_posture = RESTRICTED"
        note: "Unfreezing never returns directly to OPEN; the store must be explicitly cleared."

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST/piercing-services/stores/{storeId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "No Appointment at this store in status CHECKED_IN, SCREENED or IN_SERVICE"
        side_effects:
          - "Cascade: every Appointment at this store in status BOOKED or CONFIRMED transitions to CANCELLED"
          - "Every Piercer with home_store_id == store.id and status ACTIVE transitions to SUSPENDED"

  # --- Piercer: cyclic SUSPENDED <-> ACTIVE ----------------------------------
  - entity: Piercer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when eligibility_score < 60 or no STANDARD-or-higher certification remains VALID/EXPIRING_SOON)"
        actor: system
        preconditions:
          - "Piercer.status is ACTIVE"
          - "eligibility_score < 60 (low-score test, evaluated first) OR no CertificationRecord of this piercer declares certification_level IN {STANDARD, SENIOR, INSTRUCTOR} with status IN {VALID, EXPIRING_SOON}"
        side_effects:
          - "status = SUSPENDED"
          - "Recompute active_certification_id via selector policy piercer_governing_certification"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST/piercing-services/piercers/{piercerId}/reinstate"
        actor: StoreManager
        preconditions:
          - "Piercer.status is SUSPENDED"
          - "eligibility_score >= 60"
          - "At least one CertificationRecord of this piercer declares certification_level IN {STANDARD, SENIOR, INSTRUCTOR} with status VALID"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: INACTIVE
        trigger: "POST/piercing-services/piercers/{piercerId}/deactivate"
        actor: StoreManager
        preconditions:
          - "assigned_session_count == 0"
        side_effects:
          - "status = INACTIVE"
          - "Every CertificationRecord with piercer_id == piercer.id and status in {VALID, EXPIRING_SOON} transitions to REVOKED"

      - from: SUSPENDED
        to: INACTIVE
        trigger: "POST/piercing-services/piercers/{piercerId}/deactivate"
        actor: StoreManager
        preconditions:
          - "assigned_session_count == 0"
        side_effects:
          - "status = INACTIVE"
          - "Every CertificationRecord with piercer_id == piercer.id and status in {VALID, EXPIRING_SOON} transitions to REVOKED"

  # --- CertificationRecord: cyclic renewal / recertification loop ------------
  - entity: CertificationRecord
    initial_state: VALID
    terminal_states: [REVOKED]
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system (automatic when the logical clock reaches recertification_due_at)"
        actor: system
        preconditions:
          - "certification.status is VALID"
          - "clock >= recertification_due_at"
        side_effects:
          - "status = EXPIRING_SOON"

      - from: EXPIRING_SOON
        to: VALID
        trigger: "POST/piercing-services/certifications/{certificationId}/recertify"
        actor: Piercer
        preconditions:
          - "certification.status is EXPIRING_SOON"
          - "attempted_practical_count < 3"
          - "The submitting piercer is the owner (X-User-ID == certification.piercer_id)"
        side_effects:
          - "status = VALID"
          - "issued_at = clock; expires_at = clock + certification_validity_months"
          - "attempted_practical_count = 0"
          - "Recompute recertification_due_at"
        note: "Successful renewal returns the record to VALID — a cyclic edge, not a terminal outcome."

      - from: EXPIRING_SOON
        to: RECERTIFICATION_PENDING
        trigger: "POST/piercing-services/certifications/{certificationId}/recertify"
        actor: Piercer
        preconditions:
          - "certification.status is EXPIRING_SOON"
          - "The practical assessment was not passed"
        side_effects:
          - "status = RECERTIFICATION_PENDING"
          - "attempted_practical_count += 1"

      - from: RECERTIFICATION_PENDING
        to: EXPIRING_SOON
        trigger: "POST/piercing-services/certifications/{certificationId}/recertify"
        actor: Piercer
        preconditions:
          - "certification.status is RECERTIFICATION_PENDING"
          - "attempted_practical_count < 3"
        side_effects:
          - "status = EXPIRING_SOON"
        note: "Retry edge closing the renewal loop."

      - from: RECERTIFICATION_PENDING
        to: EXPIRED
        trigger: "system (automatic when attempted_practical_count reaches 3)"
        actor: system
        preconditions:
          - "attempted_practical_count == 3"
        side_effects:
          - "status = EXPIRED"
          - "If this record carried certification_level IN {STANDARD, SENIOR, INSTRUCTOR}, Piercer.status -> SUSPENDED"

      - from: EXPIRED
        to: VALID
        trigger: "POST /piercing-services/certifications/{certificationId}/recertify"
        actor: Piercer
        preconditions:
          - "certification.status is EXPIRED"
          - "attempted_practical_count < 3 (ERR_CERTIFICATION_RECERT_ATTEMPTS_EXHAUSTED when count == 3)"
          - "The submitting piercer is the owner (X-User-ID == certification.piercer_id) (ERR_NOT_CERTIFICATION_OWNER otherwise)"
        side_effects:
          - "status = VALID"
          - "issued_at = clock; expires_at = clock + 12 months"
          - "attempted_practical_count = 0"
          - "Recompute recertification_due_at"
        note: "Late-renewal recovery edge. Together with VALID -> EXPIRING_SOON -> EXPIRED this closes an explicit 3-node renewal cycle."

      - from: VALID
        to: REVOKED
        trigger: "POST/piercing-services/certifications/{certificationId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "certification.status in {VALID, EXPIRING_SOON, RECERTIFICATION_PENDING}"
        side_effects:
          - "status = REVOKED"
          - "If this record carried certification_level IN {STANDARD, SENIOR, INSTRUCTOR}, Piercer.status -> SUSPENDED"

      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system (automatic when clock >= expires_at)"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "status = EXPIRED"
          - "If this record carried certification_level IN {STANDARD, SENIOR, INSTRUCTOR}, Piercer.status -> SUSPENDED"

  # --- SterilizationCycle: cyclic QUARANTINED <-> RELEASED -------------------
  - entity: SterilizationCycle
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST/piercing-services/sterilization-cycles/{cycleId}/complete"
        actor: SterilizationTechnician
        preconditions:
          - "cycle.status is IN_PROGRESS"
          - "temperature_celsius >= 134.0"
          - "biological_indicator_passed == true"
          - "The closed interval [cycle_start_at, cycle_end_at] does not overlap any other SterilizationCycle on the same autoclave_unit_id (ERR_AUTOCLAVE_CYCLE_OVERLAP)"
        side_effects:
          - "status = PASSED"
          - "Cascade: every CartridgeLot with sterilization_cycle_id == cycle.id transitions to AVAILABLE and units_available = units_received"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST/piercing-services/sterilization-cycles/{cycleId}/complete"
        actor: SterilizationTechnician
        preconditions:
          - "cycle.status is IN_PROGRESS"
          - "temperature_celsius < 134.0 OR biological_indicator_passed == false"
        side_effects:
          - "status = FAILED"
          - "Cascade: every CartridgeLot with sterilization_cycle_id == cycle.id transitions to QUARANTINED"
          - "Cascade: for each such lot, StoreLocation.open_incident_count += 1 on the lot's store"
          - "Cascade: for each such lot, recompute that store's compliance_posture via store_posture_computation"
          - "Cascade: every Piercer whose home_store_id == lot.store_location_id and status ACTIVE has eligibility_score -= 20"
          - "Cascade: for each such Piercer with eligibility_score < 60, flag every Customer with an active PiercingSession performed by that Piercer"
        note: |
          Cascade chain (depth 4): FAILED cycle -> bound CartridgeLot -> QUARANTINED
          -> owning StoreLocation posture recompute -> affected Piercer eligibility -20
          -> Customer.status FLAGGED.

      - from: PASSED
        to: QUARANTINED
        trigger: "POST/piercing-services/sterilization-cycles/{cycleId}/quarantine"
        actor: ComplianceOfficer
        preconditions:
          - "cycle.status is PASSED"
        side_effects:
          - "status = QUARANTINED"
          - "Cascade: every CartridgeLot with sterilization_cycle_id == cycle.id transitions to QUARANTINED"
          - "If a bound lot's units were already consumed by an IN_PROGRESS or COMPLETED session, create an IncidentReport with severity MODERATE at that session"

      - from: QUARANTINED
        to: RELEASED
        trigger: "POST/piercing-services/sterilization-cycles/{cycleId}/release"
        actor: ComplianceOfficer
        preconditions:
          - "cycle.status is QUARANTINED"
          - "temperature_celsius >= 134.0"
          - "biological_indicator_passed == true"
        side_effects:
          - "status = RELEASED"
          - "Cascade: every CartridgeLot with sterilization_cycle_id == cycle.id and status QUARANTINED transitions to AVAILABLE"

      - from: RELEASED
        to: QUARANTINED
        trigger: "POST/piercing-services/sterilization-cycles/{cycleId}/recall"
        actor: ComplianceOfficer
        preconditions:
          - "cycle.status is RELEASED"
        side_effects:
          - "status = QUARANTINED"
          - "Cascade: every CartridgeLot with sterilization_cycle_id == cycle.id transitions to QUARANTINED"
        note: "Recall edge makes the RELEASED <-> QUARANTINED pair cyclic."

  # --- CartridgeLot: cyclic QUARANTINED <-> AVAILABLE ------------------------
  - entity: CartridgeLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED, DISCARDED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (automatic when the bound SterilizationCycle enters FAILED or QUARANTINED)"
        actor: system
        preconditions:
          - "lot.status is AVAILABLE"
        side_effects:
          - "status = QUARANTINED"
          - "units_quarantined = units_available; units_available = 0"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (automatic when the bound SterilizationCycle enters RELEASED or PASSED)"
        actor: system
        preconditions:
          - "lot.status is QUARANTINED"
          - "expiration_date > clock"
        side_effects:
          - "status = AVAILABLE"
          - "units_available = units_quarantined; units_quarantined = 0"

      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when units_available reaches 0)"
        actor: system
        preconditions:
          - "units_available == 0"
        side_effects:
          - "status = DEPLETED"

      - from: AVAILABLE
        to: DISCARDED
        trigger: "POST/piercing-services/cartridge-lots/{lotId}/discard"
        actor: ComplianceOfficer
        preconditions:
          - "expiration_date <= clock OR lot.status is QUARANTINED"
        side_effects:
          - "status = DISCARDED"

      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST/piercing-services/cartridge-lots/{lotId}/discard"
        actor: ComplianceOfficer
        preconditions:
          - "expiration_date <= clock OR the bound cycle is FAILED with all three practical retests exhausted"
        side_effects:
          - "status = DISCARDED"
          - "units_available = 0"

  # --- Customer: cyclic FLAGGED <-> ACTIVE -----------------------------------
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FLAGGED
        trigger: "system (automatic when a cascaded piercer-eligibility drop affects one of this customer's active sessions)"
        actor: system
        preconditions:
          - "customer.status is ACTIVE"
          - "At least one IncidentReport reachable through this customer's PiercingSession rows has severity in {SEVERE, MEDICAL_EMERGENCY} with escalation_status in {LOGGED, TRIAGED, ESCALATED, REOPENED} OR the performing Piercer.eligibility_score < 60"
        side_effects:
          - "status = FLAGGED"
          - "Every Appointment of this customer in status BOOKED or CONFIRMED transitions to CANCELLED"

      - from: FLAGGED
        to: ACTIVE
        trigger: "POST/piercing-services/customers/{customerId}/clear-flag"
        actor: ComplianceOfficer
        preconditions:
          - "customer.status is FLAGGED"
          - "No IncidentReport reachable through this customer's PiercingSession rows has escalation_status in {LOGGED, TRIAGED, ESCALATED, REOPENED}"
          - "Every Piercer who served this customer has eligibility_score >= 60"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST/piercing-services/customers/{customerId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "No Appointment of this customer in status BOOKED, CONFIRMED, CHECKED_IN, SCREENED or IN_SERVICE"
        side_effects:
          - "status = CLOSED"

      - from: FLAGGED
        to: CLOSED
        trigger: "POST/piercing-services/customers/{customerId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "aftercare_credit_cents == 0"
          - "No IncidentReport reachable through this customer's PiercingSession rows has refund_status == PENDING"
        side_effects:
          - "status = CLOSED"

  # --- ConsentRecord: parallel dimensions + renewal cycle --------------------
  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST/piercing-services/consents/{consentId}/verify"
        actor: IntakeAssociate
        preconditions:
          - "consent.consent_status is PENDING"
          - "guardian_verification_status == VERIFIED OR consent_type == SELF"
          - "identification_type == required_identification_type (ERR_IDENTIFICATION_TYPE_MISMATCH)"
        side_effects:
          - "consent_status = ACTIVE"
          - "expires_at = signed_at + consent_validity_days"

      - from: PENDING
        to: REJECTED
        trigger: "POST/piercing-services/consents/{consentId}/reject"
        actor: IntakeAssociate
        preconditions:
          - "consent.consent_status is PENDING"
        side_effects:
          - "consent_status = REJECTED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when clock >= expires_at)"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "consent_status = EXPIRED"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST/piercing-services/consents/{consentId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "consent.consent_status is ACTIVE"
        side_effects:
          - "consent_status = REVOKED"
          - "Every Appointment referencing customer_id and jurisdiction_id of this consent in status BOOKED or CONFIRMED transitions to CANCELLED"

      - from: EXPIRED
        to: PENDING
        trigger: "POST/piercing-services/consents/{consentId}/renew"
        actor: IntakeAssociate
        preconditions:
          - "consent.consent_status is EXPIRED"
        side_effects:
          - "consent_status = PENDING"
          - "guardian_verification_status reset to PENDING_VERIFICATION when consent_type != SELF, else NOT_REQUIRED"
        note: "Renewal edge makes the consent_status dimension cyclic: EXPIRED -> PENDING -> ACTIVE."

      - from: PENDING
        to: PENDING
        trigger: "POST/piercing-services/consents/{consentId}/guardian-verification"
        actor: IntakeAssociate
        preconditions:
          - "guardian_verification_status in {PENDING_VERIFICATION, FAILED}"
          - "consent_type != SELF"
        side_effects:
          - "guardian_verification_status = VERIFIED or FAILED per the supplied verification outcome"
        note: "Guardian verification is a PARALLEL dimension: it moves NOT_REQUIRED/PENDING_VERIFICATION -> VERIFIED/FAILED without touching consent_status."

  # --- Appointment: branching fork-join + reschedule cycle --------------------
  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, REFUSED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST/piercing-services/appointments/{appointmentId}/confirm"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status is BOOKED"
          - "The half-open slot [slot_start_at, slot_end_at) does not overlap any other non-CANCELLED Appointment for the same store_location_id and piercer_id (ERR_SLOT_OVERLAP)"
          - "The half-open slot [slot_start_at, slot_end_at) does not overlap any competing session at the same store when the store's concurrent-session capacity piercing_room_count would be exceeded (ERR_STORE_ROOM_CAPACITY_EXCEEDED)"
          - "Jurisdiction.status is ACTIVE"
        side_effects:
          - "status = CONFIRMED"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST/piercing-services/appointments/{appointmentId}/check-in"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status is CONFIRMED"
          - "clock >= slot_start_at - check_in_lead_minutes"
          - "StoreLocation.status is OPEN"
          - "At least one ConsentRecord for the customer with consent_status == ACTIVE"
        side_effects:
          - "status = CHECKED_IN"

      - from: CHECKED_IN
        to: SCREENED
        trigger: "POST/piercing-services/appointments/{appointmentId}/screen"
        actor: Piercer
        preconditions:
          - "appointment.status is CHECKED_IN"
          - "The acting piercer owns an AnatomyScreening for this appointment"
        side_effects:
          - "status = SCREENED"
          - "AnatomyScreening.outcome set to CLEARED or REFUSED via the screening evaluator"

      - from: SCREENED
        to: IN_SERVICE
        trigger: "POST/piercing-services/appointments/{appointmentId}/start-service"
        actor: Piercer
        preconditions:
          - "appointment.status is SCREENED"
          - "Appointment.governing_screening_id resolves to an AnatomyScreening whose outcome == CLEARED (ERR_SCREENING_NOT_CLEARED, checked before all other business checks)"
          - "StoreLocation.compliance_posture == OPEN (ERR_STORE_POSTURE_BLOCKS_SERVICE)"
          - "The assigned Piercer.status == ACTIVE and the governing CertificationRecord.status == VALID (ERR_PIERCER_NOT_CERTIFIED)"
          - "The assigned Piercer has assigned_session_count == 0 (ERR_PIERCER_SESSION_IN_PROGRESS)"
        side_effects:
          - "status = IN_SERVICE"
          - "Piercer.assigned_session_count += 1"
          - "A PiercingSession is created in service_status IN_PROGRESS"
        note: "Fork branch 1 (service proceeds)."

      - from: SCREENED
        to: REFUSED
        trigger: "POST/piercing-services/appointments/{appointmentId}/refuse"
        actor: Piercer
        preconditions:
          - "appointment.status is SCREENED"
          - "Appointment.governing_screening_id resolves to an AnatomyScreening whose outcome in {REFUSED, ESCALATED}"
        side_effects:
          - "status = REFUSED"
          - "AnatomyScreening.outcome locked at REFUSED"
        note: "Fork branch 2 (service refused). Fork-join: branches SCREENED->IN_SERVICE and SCREENED->REFUSED diverge."

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST/piercing-services/appointments/{appointmentId}/complete"
        actor: Piercer
        preconditions:
          - "appointment.status is IN_SERVICE"
          - "The PiercingSession.service_status is IN_PROGRESS"
          - "aftercare_kit_included == true when the jurisdiction mandates an aftercare kit (jurisdiction.record_retention_years >= 5) (ERR_AFTERCARE_KIT_REQUIRED)"
        side_effects:
          - "status = COMPLETED"
          - "Piercer.assigned_session_count -= 1"
          - "PiercingSession.service_status -> COMPLETED"
          - "CartridgeLot.units_consumed += 1; units_available -= 1"
          - "Recompute CartridgeLot.units_available via cartridge_lot_availability"
          - "Create a HealingOutcome row in status ASSESSED"
          - "Follow-up reminder scheduled at clock + aftercare_follow_up_days"

      - from: IN_SERVICE
        to: CANCELLED
        trigger: "POST/piercing-services/appointments/{appointmentId}/abort"
        actor: Piercer
        preconditions:
          - "appointment.status is IN_SERVICE"
        side_effects:
          - "status = CANCELLED"
          - "Piercer.assigned_session_count -= 1"
          - "PiercingSession.service_status -> ABORTED"
          - "CartridgeLot.units_quarantined += 1; units_available -= 1 (consumed cartridge is not returned to stock)"
          - "Compensating action: appointment is NOT counted toward piercer_eligibility_score"

      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST/piercing-services/appointments/{appointmentId}/reschedule"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status in {BOOKED, CONFIRMED}"
          - "reschedule_count < 2"
        side_effects:
          - "status = RESCHEDULED"
          - "reschedule_count += 1"

      - from: BOOKED
        to: RESCHEDULED
        trigger: "POST/piercing-services/appointments/{appointmentId}/reschedule"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status in {BOOKED, CONFIRMED}"
          - "reschedule_count < 2"
        side_effects:
          - "status = RESCHEDULED"
          - "reschedule_count += 1"

      - from: RESCHEDULED
        to: BOOKED
        trigger: "POST/piercing-services/appointments/{appointmentId}/confirm"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status is RESCHEDULED"
          - "The new half-open slot [slot_start_at, slot_end_at) does not overlap any other non-CANCELLED Appointment for the same store_location_id and piercer_id"
        side_effects:
          - "status = BOOKED"
        note: "Cycle: CONFIRMED -> RESCHEDULED -> BOOKED -> CONFIRMED."

      - from: BOOKED
        to: CANCELLED
        trigger: "POST/piercing-services/appointments/{appointmentId}/cancel"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status in {BOOKED, CONFIRMED}"
        side_effects:
          - "status = CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST/piercing-services/appointments/{appointmentId}/cancel"
        actor: IntakeAssociate
        preconditions:
          - "appointment.status in {BOOKED, CONFIRMED}"
        side_effects:
          - "status = CANCELLED"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (automatic when clock > slot_end_at and the appointment was never checked in)"
        actor: system
        preconditions:
          - "clock > slot_end_at"
          - "appointment.status is CONFIRMED"
        side_effects:
          - "status = NO_SHOW"
          - "If the slot was WALK_IN: no penalty. Otherwise Customer retains no charge."

  # --- AnatomyScreening: cyclic ESCALATED <-> REFUSED/CLEARED ----------------
  - entity: AnatomyScreening
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST/piercing-services/screenings/{screeningId}/evaluate"
        actor: Piercer
        preconditions:
          - "screening.outcome is PENDING"
          - "contraindication_codes is empty"
          - "site_requested is in jurisdiction.permitted_sites"
        side_effects:
          - "outcome = CLEARED"
          - "refusal_reason_code = null"

      - from: PENDING
        to: REFUSED
        trigger: "POST/piercing-services/screenings/{screeningId}/evaluate"
        actor: Piercer
        preconditions:
          - "screening.outcome is PENDING"
          - "contraindication_codes is non-empty"
        side_effects:
          - "outcome = REFUSED"
          - "refusal_reason_code = the highest-severity code per contraindication_severity_rank"

      - from: PENDING
        to: ESCALATED
        trigger: "POST/piercing-services/screenings/{screeningId}/evaluate"
        actor: Piercer
        preconditions:
          - "screening.outcome is PENDING"
          - "contraindication_codes contains a code whose severity rank is >= the escalation rank (KELOID_HISTORY or BLOOD_THINNER_THERAPY)"
        side_effects:
          - "outcome = ESCALATED"
          - "An IncidentReport is created at the screening's appointment-linked session with severity MINOR"

      - from: ESCALATED
        to: CLEARED
        trigger: "POST/piercing-services/screenings/{screeningId}/override"
        actor: ComplianceOfficer
        preconditions:
          - "screening.outcome is ESCALATED"
          - "A signed medical clearance is supplied on the request"
        side_effects:
          - "outcome = CLEARED"

      - from: ESCALATED
        to: REFUSED
        trigger: "POST/piercing-services/screenings/{screeningId}/override"
        actor: ComplianceOfficer
        preconditions:
          - "screening.outcome is ESCALATED"
        side_effects:
          - "outcome = REFUSED"

      - from: REFUSED
        to: ESCALATED
        trigger: "POST/piercing-services/screenings/{screeningId}/escalate"
        actor: Piercer
        preconditions:
          - "screening.outcome is REFUSED"
          - "refusal_reason_code in {KELOID_HISTORY, BLOOD_THINNER_THERAPY}"
        side_effects:
          - "outcome = ESCALATED"
        note: "Escalation edge closes the REFUSED <-> ESCALATED cycle."

  # --- PiercingSession: parallel dimensions + downgrade/re-pierce loops ------
  - entity: PiercingSession
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when the parent Appointment completes)"
        actor: system
        preconditions:
          - "session.service_status is IN_PROGRESS"
        side_effects:
          - "service_status = COMPLETED"
          - "net_fee_cents = net_service_fee(...)"
          - "follow_up_reminder_due_at = clock + aftercare_follow_up_days"

      - from: IN_PROGRESS
        to: ABORTED
        trigger: "system (automatic when the parent Appointment is aborted mid-service)"
        actor: system
        preconditions:
          - "session.service_status is IN_PROGRESS"
        side_effects:
          - "service_status = ABORTED"
          - "healing_status remains HEALING; an aborted session is never assessed for healing"

      - from: HEALING
        to: HEALED
        trigger: "POST/piercing-services/sessions/{sessionId}/healing-assessment"
        actor: Piercer
        preconditions:
          - "session.healing_status is HEALING"
          - "The healing assessment is dated at least healing_assessment_min_days after session completion"
          - "The assessed wound shows no discharge and no embedded backing"
        side_effects:
          - "healing_status = HEALED"
          - "HealingOutcome.status -> ASSESSED with healing_result HEALED"

      - from: HEALING
        to: FAILED
        trigger: "POST/piercing-services/sessions/{sessionId}/healing-assessment"
        actor: Piercer
        preconditions:
          - "session.healing_status is HEALING"
          - "The assessed wound shows discharge, embedded backing or an active infection"
        side_effects:
          - "healing_status = FAILED"
          - "HealingOutcome.healing_result = FAILED; re_pierce_eligible = true when re_pierce_claim_count == 0"
          - "An IncidentReport is created with severity MODERATE at this session"
        note: "Cascade origin (depth 3): healing failure -> IncidentReport MODERATE -> triage escalation -> store posture recompute."

      - from: FAILED
        to: HEALING
        trigger: "POST/piercing-services/sessions/{sessionId}/re-pierce"
        actor: Piercer
        preconditions:
          - "session.healing_status is FAILED"
          - "HealingOutcome.re_pierce_eligible == true"
          - "HealingOutcome.re_pierce_claim_count == 0"
        side_effects:
          - "healing_status = HEALING"
          - "HealingOutcome.status -> RE_PIERCED; re_pierce_claim_count = 1"
          - "CartridgeLot.units_consumed += 1; units_available -= 1"
          - "net_fee_cents recomputed with the re-pierce discount"
        note: "Re-pierce edge closes the HEALING <-> FAILED cycle."

      - from: HEALED
        to: RE_PIERCED
        trigger: "POST/piercing-services/sessions/{sessionId}/downgrade"
        actor: Piercer
        preconditions:
          - "session.healing_status is HEALED"
          - "The assessed healed site is downgraded to a lower-complexity site"
        side_effects:
          - "healing_status = RE_PIERCED"
          - "HealingOutcome.healing_result = DOWNGRADED; downgrade_credited_cents = downgrade_credit_amount(...)"
          - "Customer.aftercare_credit_cents += downgrade_credited_cents"

  # --- IncidentReport: cyclic REOPENED loop ---------------------------------
  - entity: IncidentReport
    initial_state: LOGGED
    terminal_states: []
    transitions:
      - from: LOGGED
        to: TRIAGED
        trigger: "POST/piercing-services/incidents/{incidentId}/triage"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is LOGGED"
          - "The referenced session_id exists"
        side_effects:
          - "escalation_status = TRIAGED"
          - "refund_amount_cents = incident_refund_allocation(provisional variant); refund_status = PENDING"
        note: "Cascade origin (depth 3): triage escalation -> session healing_status FAILED -> store posture recompute."

      - from: TRIAGED
        to: ESCALATED
        trigger: "POST/piercing-services/incidents/{incidentId}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is TRIAGED"
          - "severity in {SEVERE, MEDICAL_EMERGENCY}"
        side_effects:
          - "escalation_status = ESCALATED"
          - "Cascade: the linked PiercingSession.healing_status -> FAILED"
          - "Cascade: for each such session, the owning StoreLocation.open_incident_count += 1"
          - "Cascade: recompute that store's compliance_posture via store_posture_computation"
          - "Cascade: when the store posture becomes RESTRICTED, every Appointment at that store in status BOOKED or CONFIRMED transitions to CANCELLED"
        note: |
          Cascade chain (depth 3): INCIDENT TRIAGED -> ESCALATED
          -> PiercingSession.healing_status FAILED
          -> StoreLocation.open_incident_count += 1 and compliance_posture recompute
          -> sibling Appointment rows auto-CANCELLED. Distinct origin from the
          sterilization-failure cascade.

      - from: TRIAGED
        to: RESOLVED
        trigger: "POST/piercing-services/incidents/{incidentId}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is TRIAGED"
          - "severity in {MINOR, MODERATE}"
        side_effects:
          - "escalation_status = RESOLVED"
          - "refund_amount_cents = incident_refund_allocation(final variant)"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST/piercing-services/incidents/{incidentId}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is ESCALATED"
          - "A resolution note and a refund decision are supplied"
        side_effects:
          - "escalation_status = RESOLVED"
          - "refund_amount_cents = incident_refund_allocation(final variant)"

      - from: RESOLVED
        to: REFUND_ISSUED
        trigger: "POST/piercing-services/incidents/{incidentId}/issue-refund"
        actor: StoreManager
        preconditions:
          - "incident.escalation_status is RESOLVED"
          - "refund_amount_cents > 0"
        side_effects:
          - "escalation_status = REFUND_ISSUED; refund_status = SETTLED"
          - "Customer.refunded_cents += refund_amount_cents"
          - "Customer.retained_cents += (net_fee_cents - refund_amount_cents)"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST/piercing-services/incidents/{incidentId}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is RESOLVED"
          - "reported_at within the reopen window (clock - reported_at <= incident_reopen_days)"
        side_effects:
          - "escalation_status = REOPENED"

      - from: REOPENED
        to: TRIAGED
        trigger: "POST/piercing-services/incidents/{incidentId}/triage"
        actor: ComplianceOfficer
        preconditions:
          - "incident.escalation_status is REOPENED"
        side_effects:
          - "escalation_status = TRIAGED"
          - "refund_status = PENDING"
        note: "Reopen edge closes the RESOLVED <-> REOPENED <-> TRIAGED cycle."

  # --- HealingOutcome: cyclic downgrade <-> eligibility ----------------------
  - entity: HealingOutcome
    initial_state: ASSESSED
    terminal_states: [CLOSED]
    transitions:
      - from: ASSESSED
        to: RE_PIERCE_ELIGIBLE
        trigger: "system (automatic when healing_result == FAILED and re_pierce_claim_count == 0)"
        actor: system
        preconditions:
          - "healing_result == FAILED"
          - "re_pierce_claim_count == 0"
        side_effects:
          - "status = RE_PIERCE_ELIGIBLE"
          - "re_pierce_eligible = true"

      - from: RE_PIERCE_ELIGIBLE
        to: RE_PIERCED
        trigger: "POST/piercing-services/healing-outcomes/{outcomeId}/claim-re-pierce"
        actor: Piercer
        preconditions:
          - "outcome.status is RE_PIERCE_ELIGIBLE"
          - "The linked PiercingSession.healing_status is FAILED"
        side_effects:
          - "status = RE_PIERCED; re_pierce_claim_count = 1; re_pierce_eligible = false"

      - from: ASSESSED
        to: DOWNGRADED
        trigger: "POST/piercing-services/healing-outcomes/{outcomeId}/downgrade"
        actor: Piercer
        preconditions:
          - "healing_result == HEALED"
        side_effects:
          - "status = DOWNGRADED; healing_result = DOWNGRADED"
          - "downgrade_credited_cents = downgrade_credit_amount(...)"

      - from: DOWNGRADED
        to: RE_PIERCE_ELIGIBLE
        trigger: "POST/piercing-services/healing-outcomes/{outcomeId}/claim-re-pierce"
        actor: Piercer
        preconditions:
          - "outcome.status is DOWNGRADED"
          - "The downgraded clawback leaves downgrade_credited_cents > 0"
        side_effects:
          - "status = RE_PIERCE_ELIGIBLE; re_pierce_eligible = true"
        note: "Cyclic edge: DOWNGRADED -> RE_PIERCE_ELIGIBLE -> RE_PIERCED, or back to DOWNGRADED via a second downgrade."

      - from: RE_PIERCED
        to: CLOSED
        trigger: "POST/piercing-services/healing-outcomes/{outcomeId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "No IncidentReport linked to this session has escalation_status in {LOGGED, TRIAGED, ESCALATED, REOPENED}"
        side_effects:
          - "status = CLOSED"

      - from: DOWNGRADED
        to: CLOSED
        trigger: "POST/piercing-services/healing-outcomes/{outcomeId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "downgrade_credited_cents == 0 or Customer.aftercare_credit_cents >= downgrade_credited_cents"
        side_effects:
          - "status = CLOSED"

# =============================================================================
# §1.2.1 Concurrency Rules
# OCC on a parent entity's `version` is the only sanctioned mechanism.
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: screening-create-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST/piercing-services/screenings"
    occ_field: "expected_appointment_version"
    description: |
      Creating an AnatomyScreening against an Appointment whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has legitimately recorded a screening or a
      check-in against the same appointment, so the current writer's view of
      the appointment is stale and its screening would be recorded against a
      superseded state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: incident-create-stale-session
    parent_entity: PiercingSession
    write_endpoint: "POST/piercing-services/incidents"
    occ_field: "expected_session_version"
    description: |
      Creating an IncidentReport against a PiercingSession whose version has
      advanced since the client last observed it is rejected. A concurrent
      writer may have already filed an incident or recorded a healing
      assessment that moved the session's healing dimension, so the current
      writer's view is stale and its incident would be filed against a
      superseded session state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: healing-outcome-create-stale-session
    parent_entity: PiercingSession
    write_endpoint: "POST/piercing-services/healing-outcomes"
    occ_field: "expected_session_version"
    description: |
      Creating a HealingOutcome against a PiercingSession whose version has
      advanced since the client last observed it is rejected. Another writer
      may have already created the outcome for this session or re-pierced it,
      so the current writer's view is stale and its new outcome would
      supersede the prior one on an outdated reading.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appointment-reschedule-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST/piercing-services/appointments/{appointmentId}/reschedule"
    occ_field: "expected_appointment_version"
    description: |
      Rescheduling an Appointment whose version has advanced since the client
      last observed it is rejected. Another writer may have already
      rescheduled, cancelled or confirmed the appointment, so the current
      writer's slot choice is computed against a stale reschedule_count and
      stale slot window.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cartridge-lot-create-stale-store
    parent_entity: StoreLocation
    write_endpoint: "POST/piercing-services/cartridge-lots"
    occ_field: "expected_store_version"
    description: |
      Registering a CartridgeLot against a StoreLocation whose version has
      advanced since the client last observed it is rejected. A bind to a
      sterilization cycle may have just quarantined the store's stock, so the
      current writer's view of the store's posture is stale and the new lot
      would be registered against superseded inventory state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: certification-create-stale-piercer
    parent_entity: Piercer
    write_endpoint: "POST/piercing-services/certifications"
    occ_field: "expected_piercer_version"
    description: |
      Issuing a CertificationRecord against a Piercer whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just revoked or renewed the piercer's STANDARD-or-higher certification,
      so the current writer's view of the piercer is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: incident_refund_allocation
    trigger: "IncidentReport triage (provisional variant) and resolution (final variant)"
    algorithm: tiered_pricing
    formula: |
      fee_components are evaluated in this pinned order:
        (1) base_fee_cents
        (2) aftercare_kit_fee_cents = 1200 when session.aftercare_kit_included else 0
      gross_fee_cents = base_fee_cents + aftercare_kit_fee_cents
      refundable_portion_cents:
        severity MINOR            -> 0
        severity MODERATE         -> floor(gross_fee_cents * 0.50)
        severity SEVERE           -> floor(gross_fee_cents * 0.75)
        severity MEDICAL_EMERGENCY-> gross_fee_cents
      retain_floor_cents = AFTERCARE_RETAIN_FLOOR_CENTS (500)
      refund = max(refundable_portion_cents - prior_refunded_cents, 0)
      if refund > gross_fee_cents - retain_floor_cents:
        refund = max(gross_fee_cents - retain_floor_cents, 0)
    input_set: "The single IncidentReport under evaluation, its linked PiercingSession, and the Customer's lifetime refunded_cents"
    constants:
      AFTERCARE_KIT_FEE_CENTS: 1200
      AFTERCARE_RETAIN_FLOOR_CENTS: 500
      MODERATE_RATE: 0.50
      SEVERE_RATE: 0.75
    precision: "floor to integer cents at each max()/tier step; no intermediate rounding other than floor"
    variants:
      - name: provisional_at_triage
        when: "IncidentReport transitions LOGGED -> TRIAGED"
        difference: "Uses the session's recorded net_fee_cents as gross_fee_cents and the tier rate at triage time; result is written to refund_amount_cents with refund_status PENDING and may be revised later."
      - name: final_at_resolution
        when: "IncidentReport transitions TRIAGED|ESCALATED -> RESOLVED"
        difference: "Recomputes gross_fee_cents from base_fee_cents + aftercare_kit_fee_cents using the aftercare kit rule, applies the retain floor against the Customer's lifetime refunded_cents, and overwrites refund_amount_cents. For identical inputs it yields a different number than the provisional variant whenever the session had a re-pierce discount or a prior refund."

  - name: piercer_eligibility_score
    trigger: "every certification mutation and every incident mutation affecting a piercer"
    algorithm: weighted_scoring
    formula: |
      base_score = 100
      for each CertificationRecord of this piercer, in ascending created_at order:
        status VALID             -> contribution  0
        status EXPIRING_SOON     -> contribution -10
        status RECERTIFICATION_PENDING -> contribution -15
        status EXPIRED           -> contribution -30
        status REVOKED           -> contribution -40
      for each IncidentReport attributable to this piercer, in ascending reported_at order:
        severity MINOR           -> contribution -5
        severity MODERATE        -> contribution -12
        severity SEVERE          -> contribution -25
        severity MEDICAL_EMERGENCY -> contribution -50
      completion_bonus = +8 per COMPLETED PiercingSession performed by this piercer since the last incident
      raw_score = base_score + sum(certification contributions) + sum(incident contributions) + completion_bonus
      eligibility_score = clamp(raw_score, 0, 100)
    input_set: "All CertificationRecord rows for the piercer; all IncidentReport rows whose session was performed by the piercer; completed PiercingSession rows since the most recent such incident"
    constants:
      BASE_SCORE: 100
      FLOOR: 0
      CEILING: 100
      COMPLETION_BONUS: 8
    precision: "integer; clamp applied last"
    variants:
      - name: rolling_window
        when: "evaluated as a gate before SCREENED -> IN_SERVICE"
        difference: "Counts only CertificationRecord and IncidentReport rows whose relevant timestamp falls within the trailing eligibility_window_days; older rows contribute 0. This is the value stored on Piercer.eligibility_score."
      - name: cumulative_chronological
        when: "evaluated for audit reporting via GET/piercing-services/piercers/{piercerId}/eligibility-audit"
        difference: "Counts every row ever recorded, in chronological order, with no window. It can differ from the rolling_window value by any amount, and in particular a piercer with two historic SEVERE incidents reports a lower cumulative score than the stored rolling score."

  - name: net_service_fee
    trigger: "session completion, re-pierce, and downgrade"
    algorithm: threshold
    formula: |
      Evaluation order is pinned: the discount tier is selected from the
      PRE-discount subtotal, so the formula is well-defined despite reading
      like a circular dependency.
      step 1: aftercare_component_cents = 0 if aftercare_kit_included is false else 1200
      step 2: pre_discount_subtotal_cents = base_fee_cents + aftercare_component_cents
      step 3: select discount_rate from the PRE_discount_subtotal_cents tier:
                pre_discount_subtotal < 4000        -> 0.00
                4000 <= pre_discount_subtotal < 8000 -> 0.10
                pre_discount_subtotal >= 8000        -> 0.15
      step 4: downgrade_credit_applied_cents = 0
      step 5: if this session is a re-pierce claim, re_pierce_discount_cents = floor(pre_discount_subtotal * 0.20)
      step 6: net_fee_cents = pre_discount_subtotal
                             - floor(pre_discount_subtotal * discount_rate)
                             - re_pierce_discount_cents
              and net_fee_cents is floored at the site_minimum_cents for site_pierced
    input_set: "The PiercingSession under evaluation plus its site minimum constant"
    constants:
      AFTERCARE_KIT_FEE_CENTS: 1200
      TIER_1_FLOOR_CENTS: 4000
      TIER_2_FLOOR_CENTS: 8000
      TIER_1_RATE: 0.10
      TIER_2_RATE: 0.15
      RE_PIERCE_RATE: 0.20
      SITE_MINIMUM_CENTS: 1500
    precision: "floor to integer cents at step 5 and step 6"
    note: "Mode-(c) pinned evaluation order: the tier is chosen on pre_discount_subtotal_cents, BEFORE the re-pierce discount is subtracted."

  - name: downgrade_credit_amount
    trigger: "HealingOutcome downgrade"
    algorithm: aggregation
    formula: |
      Nesting order is pinned: round PER SITE, then sum.
      site_credit(site) = round_half_up(site_base_value_cents(site) * DOWNGRADE_RATE, 0)
      downgrade_credit_amount = sum over every downgraded site of site_credit(site)
      WORKED: sites HELIX (site_base_value_cents 5200) and TRAGUS (site_base_value_cents 4300),
              DOWNGRADE_RATE 0.25
        per-site rounding:  round(5200*0.25)=round(1300.0)=1300 ; round(4300*0.25)=round(1075.0)=1075
        sum:                1300 + 1075 = 2375
      CONTRASTING (forbidden) order, sum-then-round, is NOT used: round((5200+4300)*0.25)=round(2375.0)=2375
      A differing case: sites at 5101 and 4301 -> per-site round(1275.25)=1275 and round(1075.25)=1075, sum = 2350;
      sum-then-round yields round(2350.5) = 2351. The pinned order is PER-SITE then sum.
    input_set: "Every downgraded site on the healing outcome, each with its own site_base_value_cents"
    constants:
      DOWNGRADE_RATE: 0.25
    precision: "round_half_up to integer cents PER SITE, then integer sum"

  - name: store_posture_computation
    trigger: "any IncidentReport escalation change and any SterilizationCycle status change at a store"
    algorithm: threshold
    formula: |
      open_incident_count = count of IncidentReport rows reachable through the store's
                            PiercingSession rows with escalation_status IN {LOGGED, TRIAGED, ESCALATED, REOPENED}
      critical_incident_count = count of those rows with severity == MEDICAL_EMERGENCY
      failed_cycle_count = count of SterilizationCycle rows at the store with status == FAILED
      if critical_incident_count >= 1 or failed_cycle_count >= 2:
        compliance_posture = FROZEN
      else if open_incident_count >= 3 or failed_cycle_count >= 1:
        compliance_posture = RESTRICTED
      else:
        compliance_posture = OPEN
      Evaluation order is pinned: the FROZEN test is applied first, so a store with
      both a failed cycle and a single critical incident reports FROZEN, not RESTRICTED.
    input_set: "Non-terminal IncidentReport rows reachable through the store's sessions; SterilizationCycle rows at the store with status FAILED"
    constants:
      RESTRICTION_INCIDENT_THRESHOLD: 3
      RESTRICTION_FAILED_CYCLE_THRESHOLD: 1
      FREEZE_FAILED_CYCLE_THRESHOLD: 2
    precision: "integer counts; no rounding"
    note: "Boundary is inclusive: open_incident_count == 3 restricts; == 2 does not."

  - name: cartridge_lot_availability
    trigger: "lot creation, cycle bind, session completion, quarantine and release"
    algorithm: aggregation
    formula: |
      units_available = units_received - units_consumed - units_quarantined
      and is floored at 0
    input_set: "The single CartridgeLot row"
    constants: {}
    precision: "integer"

  - name: site_complexity_surcharge
    trigger: "appointment screening and session fee setup"
    algorithm: constraint_propagation
    formula: |
      site_factor = 1.0 for LOBE, 1.2 for UPPER_LOBE, 1.5 for HELIX, 1.6 for TRAGUS, 2.2 for INDUSTRIAL, 1.4 for NOSTRIL
      cartilage_hazard = min(max(contraindication_count - 1, 0), 3) * 350
      quantity_hazard = max(site_count_requested - 1, 0) * 200
      surcharge = min(cartilage_hazard + quantity_hazard + floor(base_fee_cents * (site_factor - 1.0)), MAX_SURCHARGE_CENTS)
    input_set: "The appointment's requested sites and the screening's contraindication codes"
    constants:
      MAX_SURCHARGE_CENTS: 2500
      PER_CONTRAINDICATION_CENTS: 350
      PER_EXTRA_SITE_CENTS: 200
    precision: "integer; nested min/max applied outer-to-inner"

  - name: certification_recertification_due
    trigger: "certification issuance and renewal"
    algorithm: threshold
    formula: |
      recertification_due_at = expires_at - RECERTIFICATION_LEAD_DAYS
      A certification enters EXPIRING_SOON exactly when clock >= recertification_due_at
      (inclusive boundary: at the instant clock == recertification_due_at the record IS expiring soon).
    input_set: "The single CertificationRecord row"
    constants:
      RECERTIFICATION_LEAD_DAYS: 30
    precision: "instant arithmetic in UTC"

  - name: check_in_window
    trigger: "check-in eligibility and no-show detection"
    algorithm: threshold
    formula: |
      A CONFIRMED appointment may check in once clock >= slot_start_at - CHECK_IN_LEAD_MINUTES
      (inclusive boundary) and is marked NO_SHOW once clock > slot_end_at (exclusive boundary).
    input_set: "The single Appointment row"
    constants:
      CHECK_IN_LEAD_MINUTES: 30
    precision: "instant arithmetic in UTC, minute granularity"

  - name: consent_validity_window
    trigger: "consent verification"
    algorithm: threshold
    formula: |
      expires_at = signed_at + CONSENT_VALIDITY_DAYS
      A consent is usable while clock < expires_at
      (exclusive boundary: at the instant clock == expires_at the consent is EXPIRED and cannot gate check-in).
    input_set: "The single ConsentRecord row"
    constants:
      CONSENT_VALIDITY_DAYS: 30
    precision: "instant arithmetic in UTC"

  - name: quarantine_unit_exposure
    trigger: "cycle failure, cycle quarantine and lot recall"
    algorithm: aggregation
    formula: |
      quarantine_scope_units = sum of units_available over every CartridgeLot whose
                               sterilization_cycle_id == the quarantined cycle id
                               at the instant quarantine is applied
    input_set: "CartridgeLot rows bound to the cycle, taken at quarantine time"
    constants: {}
    precision: "integer sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The acting role must be permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every path identifier must resolve to an existing row, validated left to right"
    error_id: "ERR_NOT_FOUND / ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "The target row must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  # --- Business rules: safety / compliance first, fiscal last -----------------
  - priority: 5
    category: business_safety
    check: "Age gate: the customer's age in whole years at the service date must satisfy the jurisdiction. Below min_age_absolute -> refuse outright. Below min_age_self_consent -> require a consent of type GUARDIAN_PRESENT, GUARDIAN_NOTARIZED or COURT_ORDER. Below min_age_with_guardian -> ERR_AGE_BELOW_JURISDICTION_MINIMUM."
    error_id: ERR_AGE_BELOW_JURISDICTION_MINIMUM
    http_status: 422
    applies_to: "POST/piercing-services/appointments, POST/piercing-services/sessions, POST/piercing-services/consents/{id}/verify"

  - priority: 6
    category: business_safety
    check: "Permitted-site gate: site_requested must be an element of jurisdiction.permitted_sites for the customer's consent class"
    error_id: ERR_SITE_NOT_PERMITTED_IN_JURISDICTION
    http_status: 422
    applies_to: "POST/piercing-services/appointments, POST/piercing-services/screenings/{id}/evaluate"

  - priority: 7
    category: business_safety
    check: "Contraindication gate: a screening carrying any contraindication code in {KELOID_HISTORY, BLOOD_THINNER_THERAPY, ACTIVE_INFECTION, KELOID_HISTORY} must not clear; it is refused or escalated"
    error_id: ERR_MEDICAL_CONTRAINDICATION
    http_status: 422
    applies_to: "POST/piercing-services/screenings/{id}/evaluate, POST/piercing-services/appointments/{id}/start-service"

  - priority: 8
    category: business_constraint
    check: "Guardian gate: when consent_type is GUARDIAN_PRESENT or GUARDIAN_NOTARIZED, guardian_verification_status must be VERIFIED before the consent can become ACTIVE; when jurisdiction.requires_guardian_presence is true, consent_type GUARDIAN_NOTARIZED is additionally rejected"
    error_id: ERR_GUARDIAN_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST/piercing-services/consents/{id}/verify, POST/piercing-services/appointments/{id}/check-in"

  - priority: 9
    category: business_constraint
    check: "Identification gate: identification_type must equal the required_identification_type derived from the jurisdiction and consent_type"
    error_id: ERR_IDENTIFICATION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST/piercing-services/consents/{id}/verify"

  - priority: 10
    category: business_constraint
    check: "Certification gate: the assigned piercer's Piercer.active_certification_id must resolve to a CertificationRecord whose status is VALID and whose sterilization_protocol_code equals the jurisdiction's sterilization_protocol_code"
    error_id: ERR_PIERCER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST/piercing-services/appointments/{id}/start-service, POST/piercing-services/sessions"

  - priority: 11
    category: business_constraint
    check: "Sterilization gate: the referenced CartridgeLot must have status AVAILABLE, a bound SterilizationCycle with status in {PASSED, RELEASED}, and expiration_date > clock"
    error_id: ERR_CARTRIDGE_LOT_UNAVAILABLE
    http_status: 422
    applies_to: "POST/piercing-services/sessions, POST/piercing-services/sessions/{id}/re-pierce"

  - priority: 12
    category: business_constraint
    check: "Single-active-session gate: a piercer may have at most one PiercingSession in service_status IN_PROGRESS across all stores"
    error_id: ERR_PIERCER_SESSION_IN_PROGRESS
    http_status: 409
    applies_to: "POST/piercing-services/appointments/{id}/start-service"

  - priority: 13
    category: business_safety
    check: "Posture gate: when the store's compliance_posture is RESTRICTED or FROZEN the store must not begin a new service"
    error_id: ERR_STORE_POSTURE_BLOCKS_SERVICE
    http_status: 409
    applies_to: "POST/piercing-services/appointments/{id}/start-service, POST/piercing-services/sessions"

  - priority: 14
    category: business_temporal
    check: "Slot gate (piercer adjacency): two non-CANCELLED appointments for the same store_location_id and piercer_id must not have overlapping half-open intervals [slot_start_at, slot_end_at); adjacency where one slot's end equals the next slot's start is permitted. Sub-minute precision is truncated: every supplied slot bound is floored to the containing minute before comparison, and slot_end_at must be at least 15 minutes after slot_start_at"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST/piercing-services/appointments, POST/piercing-services/appointments/{id}/confirm, POST/piercing-services/appointments/{id}/reschedule"

  - priority: 15
    category: business_temporal
    check: "Room-capacity gate (aggregate concurrency): the count of non-CANCELLED appointments at the same store_location_id whose half-open slot contains a common instant must not exceed piercing_room_count"
    error_id: ERR_STORE_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST/piercing-services/appointments, POST/piercing-services/appointments/{id}/confirm, POST/piercing-services/appointments/{id}/reschedule"

  - priority: 16
    category: business_temporal
    check: "Autoclave gate (closed-interval overlap): two SterilizationCycle rows on the same autoclave_unit_id must not have overlapping CLOSED intervals [cycle_start_at, cycle_end_at]; adjacency where one cycle's end equals the next cycle's start IS rejected because both endpoints are inclusive. Sub-second precision is truncated: every supplied cycle bound is floored to the containing second before comparison"
    error_id: ERR_AUTOCLAVE_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST/piercing-services/sterilization-cycles"

  - priority: 16
    category: business_temporal
    check: "Aftercare follow-up gate: the aftercare follow-up reminder may only be acknowledged between follow_up_reminder_due_at (inclusive) and follow_up_reminder_due_at + 7 days (exclusive)"
    error_id: ERR_FOLLOW_UP_NOT_DUE
    http_status: 409
    applies_to: "POST /piercing-services/sessions/{id}/follow-up/acknowledge"

  - priority: 17
    category: business_referential
    check: "Re-pierce gate: a re-pierce claim requires HealingOutcome.re_pierce_eligible == true and re_pierce_claim_count == 0"
    error_id: ERR_RE_PIERCE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST/piercing-services/sessions/{id}/re-pierce, POST/piercing-services/healing-outcomes/{id}/claim-re-pierce"

  - priority: 18
    category: business_referential
    check: "Refund gate: a refund may not exceed gross_fee_cents minus AFTERCARE_RETAIN_FLOOR_CENTS, and may not exceed the customer's net_fee_cents for that session"
    error_id: ERR_REFUND_EXCEEDS_ALLOWABLE
    http_status: 422
    applies_to: "POST/piercing-services/incidents/{id}/issue-refund"

  - priority: 19
    category: business_fiscal
    check: "Aftercare credit gate: an aftercare credit redemption may not exceed the customer's aftercare_credit_cents"
    error_id: ERR_INSUFFICIENT_AFTERCARE_CREDIT
    http_status: 402
    applies_to: "POST/piercing-services/customers/{id}/credit-redemptions"

  - priority: 20
    category: business_constraint
    check: "OCC gate: when expected_<parent>_version is supplied it must equal the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST/piercing-services/screenings, POST/piercing-services/incidents, POST/piercing-services/healing-outcomes, POST/piercing-services/cartridge-lots, POST/piercing-services/certifications, POST/piercing-services/appointments/{id}/reschedule"

  # --- Diagnostic priority-conflict appendix (NOT a validation row) ----------
  # Conflict A: state (priority 4) vs business_safety (priority 5)
  #   A COMPLETED appointment for an under-age customer: ERR_INVALID_STATE wins.
  # Conflict B: business_safety (priority 7) vs business_referential (priority 11)
  #   A contraindicated screening on a quarantined lot: ERR_MEDICAL_CONTRAINDICATION wins.
  # Conflict C: business_constraint guardian (priority 8) vs business_constraint
  #   identification (priority 9): ERR_GUARDIAN_VERIFICATION_REQUIRED wins.
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

