              payload: {}
              as: StaffingCoordinator
              captures: { b1_v_sl: $.data.version }
          trigger:
            - call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v_sl}", reviewer_id: "${ra_id}", pass_type: "SECOND_LEVEL" }
              as: StaffingCoordinator
              captures: { err_same: $.data.error_id }
            - call: "POST /batches/${b1_id}/assignments"
