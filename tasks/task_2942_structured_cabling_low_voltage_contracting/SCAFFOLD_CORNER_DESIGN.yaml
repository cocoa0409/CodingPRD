              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "ELECTRICAL", milestone: "POWER_ENERGIZE" }
              as: ProjectManager
              captures: { coord: $.data.id }
          trigger:
            - call: "POST /cabling/telecom-rooms/${room}/energize"
              payload: {}
              as: ProjectManager
              captures: { err1: $.data.error_id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-14" }
              as: ProjectManager
            - call: "POST /cabling/telecom-rooms/${room}/energize"
              payload: {}
              as: ProjectManager
              captures: { err2: $.data.error_id }
            - call: "POST /cabling/trade-coordinations/${coord}/release"
              payload: {}
              as: ProjectManager
            - call: "POST /cabling/telecom-rooms/${room}/energize"
              payload: {}
              as: ProjectManager
          assert:
            - "the energize with the milestone in REQUESTED returns 409 with data.error_id == \"ERR_TRADE_NOT_COORDINATED\""
            - "the energize with the milestone in CONFIRMED still returns 409 with data.error_id == \"ERR_TRADE_NOT_COORDINATED\""
            - "GET /cabling/telecom-rooms/${room} returns room_state == \"GROUNDED\" after both refusals"
            - "the energize after the release returns 200 with room_state == \"ENERGIZED\""
            - "power_load_va is 0 and ups_capacity_va is 3000 throughout, so the power limb of the transition was satisfied from the start"

