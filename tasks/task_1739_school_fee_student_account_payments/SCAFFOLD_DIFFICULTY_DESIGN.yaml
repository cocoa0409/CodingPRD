          Depth-4 cascade originating from the student-withdraw trigger:
          withdraw student -> Enrollment WITHDRAWN -> PENDING Refund spawned
          -> refund EXECUTED -> DISTRIBUTION_REVERSAL LedgerEntry ->
          Department.distributed_cents drops 10000 -> 0; each hop is caused
          by the previous link, not by the original call.
