# =============================================================================
# Task 1897 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Shared fixtures: RULE_CA / RULE_NV / RULE_TX as in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# Negative triggers capture `err: $.data.error_id` (or use a *_rejected /
# *_cannot_ / *_not_found / *_missing_* name) per lint negative-test rules.
# =============================================================================

scaffold_corner_design:
  # ============================================================== Entities
  - section: entities
    instances:
      - name: association_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Association.fields.current_annual_contribution_cents, entities.Association.fields.statutory_compliance_status]
        distinguishing_aspect: "Omitting the optional contribution input yields 0, and computed/system fields initialize to COMPLIANCE_UNKNOWN / null."
        test_recipe:
          setup: ["RULE_CA exists"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /associations"
              payload: { name: "Defaults HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { contrib: $.data.current_annual_contribution_cents, comp: $.data.statutory_compliance_status, lau: $.data.last_annual_update_fiscal_year, due: $.data.next_site_visit_due_date }
          assert:
            - "contrib == 0 (default applied)"
            - "comp == COMPLIANCE_UNKNOWN"
            - "lau == null and due == null"

      - name: association_missing_required_state_code
        claim_type: required_fields
        grounds: [entities.Association.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A create body missing the required state_code is rejected 400 before any rule lookup runs."
        test_recipe:
          setup: ["empty DB is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "POST /associations"
              payload: { name: "No State HOA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: association_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /associations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: component_rul_above_ul_invalid_request
        claim_type: type_constraints
        grounds: [entities.Component.fields.remaining_useful_life_years, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "remaining_useful_life_years (6) greater than useful_life_years (5) violates the 0 <= RUL <= UL range rule."
        test_recipe:
          setup: ["RULE_CA; association; DRAFT study"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Range HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 6, current_replacement_cost_cents: 100000 }
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: component_create_extra_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An unknown field in the create body (computed-field smuggling) is rejected 400; computed fields are never client-writable."
        test_recipe:
          setup: ["RULE_CA; association; DRAFT study"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Strict HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, actual_expenditure_cents: 999 }
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (unknown/computed field actual_expenditure_cents not accepted)"

      - name: state_rule_duplicate_state_code_rejected
        claim_type: type_constraints
        grounds: [entities.StateReserveRule.fields.state_code, "errors[ERR_STATE_RULE_EXISTS]"]
        distinguishing_aspect: "state_code uniqueness: second rule for CA is rejected 409."
        test_recipe:
          setup: ["RULE_CA already created"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 10, allowed_plan_types: ["BASELINE"], site_visit_interval_years: 5, disclosure_deadline_days: 60, annual_update_required: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STATE_RULE_EXISTS (409)"

  # ============================================================== State machines
  - section: state_machines
    instances:
      - name: study_submit_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReserveStudy, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submit is only defined from DRAFT; a SUBMITTED study re-submit fails 409 and no side effects fire."
        test_recipe:
          setup: ["RULE_CA; association; study with component + BASELINE plan; visit completed; study SUBMITTED"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Twice HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
          trigger:
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409)"

      - name: study_adopt_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReserveStudy.SUBMITTED_to_ADOPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adopt requires SUBMITTED; a DRAFT study (no plan, no visit) is stopped by the state check before any cadence/statutory check."
        test_recipe:
          setup: ["RULE_CA; association; bare DRAFT study"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Draft HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409)"

      - name: study_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ReserveStudy.DRAFT_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: a subsequent submit is rejected 409."
        test_recipe:
          setup: ["RULE_CA; association; DRAFT study withdrawn"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Gone HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /reserve-studies/${s1}/withdraw"
              as: ReserveSpecialist
              captures: { st_wd: $.data.status }
          trigger:
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "st_wd == WITHDRAWN"
            - "err == ERR_INVALID_STATE (409)"

      - name: plan_create_supersedes_existing_draft_plan
        claim_type: side_effect_execution
        grounds: [state_machines.FundingPlan.DRAFT_to_RETIRED, "concurrency_rules[plan-create-stale-study]"]
        distinguishing_aspect: "Creating a same-type plan while the old one is DRAFT retires the old plan and recomputes from current component data (34897 after the cost patch vs 28825 before)."
        test_recipe:
          setup:
            - "RULE_CA; F1 DRAFT study (C1 UL 5 RUL 2 100000; C2 UL 4 RUL 1 50000); BASELINE plan P_old exists (contribution 28825)"
            - "C1 cost patched to 120000 before re-creation"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Supersede Plan HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p_old: $.data.id, c_old: $.data.annual_contribution_cents }
            - call: "PATCH /components/${c1}"
              payload: { current_replacement_cost_cents: 120000 }
              as: ReserveSpecialist
          trigger:
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
              captures: { p_new: $.data.id, c_new: $.data.annual_contribution_cents }
            - call: "GET /reserve-studies/${s1}/funding-plans"
              as: ReserveSpecialist
              captures: { old_status: "$.data[0].status"}
          assert:
            - "c_old == 28825"
            - "c_new == 34897 (recomputed against patched cost 120000)"
            - "old_status == RETIRED (P_old superseded by the same-type create)"

      - name: plan_select_from_retired_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FundingPlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETIRED plan can never be SELECTED — select from RETIRED fails 409."
        test_recipe:
          setup: ["same as plan_create_supersedes_existing_draft_plan: P_old RETIRED via same-type re-create"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Retired Plan HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p_old: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
          trigger:
            - call: "POST /funding-plans/${p_old}/select"
              as: BoardMember
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (RETIRED is terminal for selection)"

      - name: site_visit_complete_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SiteVisit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal; a second complete fails 409."
        test_recipe:
          setup: ["RULE_CA; association; visit COMPLETED"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Visit HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
              captures: { st_done: $.data.status }
          trigger:
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
              captures: { err: $.data.error_id }
          assert:
            - "st_done == COMPLETED"
            - "err == ERR_INVALID_STATE (409)"

      - name: expenditure_reverse_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Expenditure, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reverse is defined only from APPROVED; reversing a SUBMITTED expenditure fails 409 and cash is untouched."
        test_recipe:
          setup: ["RULE_NV; association cash 2000000; adopted FY2026 study with component; expenditure SUBMITTED"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "NV", min_percent_funded_pct: 0, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: false }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Reverse HOA", state_code: "NV", fiscal_year_end_month: 12, reserve_cash_balance_cents: 2000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 5000, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/reverse"
              as: BoardMember
              captures: { err: $.data.error_id }
            - call: "GET /associations/${a1}"
              as: ReserveSpecialist
              captures: { cash: $.data.reserve_cash_balance_cents }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "cash == 2000000 (no side effects fired)"

      - name: disclosure_distribute_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Disclosure, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "First distribute at the default clock is on time (is_late false, due 2026-08-31); DISTRIBUTED is terminal — a second distribute fails 409."
        test_recipe:
          setup: ["RULE_CA; association cash 500000; FY2026 study ADOPTED -> ADOPTION_SUMMARY disclosure PENDING due 2026-08-31"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Disclose HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
