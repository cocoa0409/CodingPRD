# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_3480_federal_water_project_contract_allocation_reservoir_operation
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Anchors (&b_*) are defined in the first instance and reused; each instance's
# chain is self-contained from empty-DB.
#
# Base announced fixture (small reservoir: storage 10,500, dead 5,000, flood
# max 20,000; usable 5,500; holdback 2,000 in flood months): snow 80 + runoff
# 5,000 -> declared 7,500 (tier NONE) -> waterfall SR 6,000 / JR 1,500.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: contract_create_returns_201_with_system_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.WaterContract
          - endpoints.POST_/water/contracts
        distinguishing_aspect: "A contract created with the five required inputs returns 201 with status ACTIVE (never client-supplied), repaid_credits_cents 0, version 1, and non-null id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district."
          setup_api_calls:
            - &b_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - &b_d_sr
              call: "POST /water/districts"
              payload: { name: "Senior Irrigation District", service_area_acres: 42000, contact_email: "ops@senior.example" }
              as: SystemAdmin
              captures: { d_sr: $.data.id }
            - &b_d_jr
              call: "POST /water/districts"
              payload: { name: "Junior Water District", service_area_acres: 18000, contact_email: "ops@junior.example" }
              as: SystemAdmin
              captures: { d_jr: $.data.id }
            - &b_d_tp
              call: "POST /water/districts"
              payload: { name: "Third Party District", service_area_acres: 9000, contact_email: "ops@third.example" }
              as: SystemAdmin
              captures: { d_tp: $.data.id }
          trigger:
            - &b_c_sr
              call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-100", priority_class: "SENIOR", max_annual_quantity_af: 6000, repayment_obligation_cents: 120000000 }
              as: SystemAdmin
              captures: { c_sr: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "WaterContract.${c_sr}.status == ACTIVE and repaid_credits_cents == 0 and version == 1"
            - "the response carries non-null id, created_at, updated_at and echoes contract_number C-100"

      - name: contract_get_round_trips_stored_fields_immediately
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/water/contracts/{id}
          - complexity_profile.consistency_model
        distinguishing_aspect: "GET returns exactly what POST stored, in the same logical instant (immediate consistency): all five input fields plus system fields, with no lag."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district and its contract."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_c_sr
          trigger:
            - call: "GET /water/contracts/${c_sr}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "the response status is 200"
            - "WaterContract.${c_sr}.district_id == ${d_sr} and priority_class == SENIOR and max_annual_quantity_af == 6000 and repayment_obligation_cents == 120000000"
            - "status == ACTIVE and repaid_credits_cents == 0"

      - name: contracts_list_filters_by_district_and_paginates_with_totals
        claim_type: Listing
        grounds:
          - endpoints.GET_/water/contracts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contracts across three districts, district_id and priority_class filters select exactly the matching subsets, and limit=2/offset=2 pages report total_count 3 over the whole filtered set with correct has_more flips."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. Three districts, three contracts (C-100 SENIOR d_sr, C-200 JUNIOR d_jr, C-300 JUNIOR d_tp)."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - *b_c_sr
            - &b_c_jr
              call: "POST /water/contracts"
              payload: { district_id: "${d_jr}", contract_number: "C-200", priority_class: "JUNIOR", max_annual_quantity_af: 4000, repayment_obligation_cents: 80000000 }
              as: SystemAdmin
              captures: { c_jr: $.data.id }
            - &b_c_tp
              call: "POST /water/contracts"
              payload: { district_id: "${d_tp}", contract_number: "C-300", priority_class: "JUNIOR", max_annual_quantity_af: 1000, repayment_obligation_cents: 5000000 }
              as: SystemAdmin
              captures: { c_tp: $.data.id }
          trigger:
            - call: "GET /water/contracts"
              payload: { limit: 2, offset: 0 }
              as: ReclamationOperator
          assert:
            - "GET /water/contracts?limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true"
            - "GET /water/contracts?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /water/contracts?district_id=${d_tp} returns exactly 1 row (C-300)"
            - "GET /water/contracts?priority_class=JUNIOR returns exactly 2 rows"
            - "GET /water/contracts with no parameters returns 3 rows (defaults limit 10 offset 0)"

      - name: contract_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/water/contracts/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path produces 404 ERR_NOT_FOUND with the error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. Empty database besides the clock."
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "GET /water/contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ReclamationOperator
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: contract_create_missing_required_priority_class_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.WaterContract.fields.priority_class
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "priority_class is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST at priority 3 — before any existence or business check — and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
          trigger:
            - call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-900", max_annual_quantity_af: 100, repayment_obligation_cents: 1000 }
              as: SystemAdmin
              captures: { miss_err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /water/contracts?district_id=${d_sr} returns 0 rows"

      - name: transfer_create_omitting_price_cents_defaults_zero
        claim_type: Defaults
        grounds:
          - entities.TransferRequest.fields.price_cents
          - endpoints.POST_/water/transfer-requests
        distinguishing_aspect: "price_cents declares default 0, so a transfer created without it stores 0 rather than null while quantity and parties are honored."
        test_recipe:
          setup:
            - "Base announced fixture (declared 7,500; SR 6,000 / JR 1,500)."
          setup_api_calls:
            - *b_clock
            - &b_res_small
              call: "POST /water/reservoirs"
              payload: { name: "Shasta Unit", capacity_af: 50000, dead_pool_af: 5000, flood_control_max_storage_af: 20000, initial_storage_af: 10500, outlet_capacity_cfs: 15000, power_conversion_mwh_per_af: 0.5 }
              as: SystemAdmin
              captures: { res_id: $.data.id }
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - *b_c_sr
            - *b_c_jr
            - &b_wy
              call: "POST /water/water-years"
              payload: { label: 2027, season_start: "2026-10-01T00:00:00Z", season_end: "2027-09-30T00:00:00Z" }
              as: ReclamationOperator
              captures: { wy_id: $.data.id, wy_v: $.data.version }
            - &b_clock_jan
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: SystemAdmin
            - &b_snow80
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "SNOWPACK_INDEX", value: 80, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - &b_run5000
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 5000, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - &b_ann1c
              call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v}" }
              as: ReclamationOperator
              captures: { ann1_id: $.data.id }
            - &b_ann1p
              call: "POST /water/allocation-announcements/${ann1_id}/publish"
              payload: {}
              as: ReclamationOperator
          trigger:
            - call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr_def_id: $.data.id }
          assert:
            - "the response status is 201"
            - "TransferRequest.${tr_def_id}.price_cents == 0 and status == UNDER_REVIEW and revision_count == 0"

      - name: allocation_line_remaining_recomputed_after_partial_delivery
        claim_type: Computed Fields
        grounds:
          - entities.AllocationLine.fields.remaining_af
          - calculations.allocation_remaining_balance
        distinguishing_aspect: "remaining_af is computed, never stored from input: after a 400 af order with 150 delivered on the SR 6,000 line, remaining == 6000 - 150 - (400 - 150) == 5600; the DELIVERED part and the still-reserved part are both netted exactly once."
        test_recipe:
          setup:
            - "Base announced fixture. SR order of 400 af with 150 delivered."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - &b_o_sr400
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 400 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { o_sr_id: $.data.id }
          trigger:
            - call: "POST /water/delivery-orders/${o_sr_id}/record-delivery"
              payload: { delivered_af: 150 }
              as: ReclamationOperator
            - call: "GET /water/allocation-lines"
              payload: { announcement_id: "${ann1_id}", contract_id: "${c_sr}" }
              as: ReclamationOperator
              captures: { ln_sr_rem: "$.data[0].remaining_af" }
          assert:
            - "DeliveryOrder.${o_sr_id}.fulfillment_status == PARTIALLY_DELIVERED and delivered_af == 150"
            - "the SR line's delivered_af == 150 and remaining_af == 5600"
            - "the SR line's allocated_af == 6000 is unchanged by delivery activity"

      - name: contract_create_with_status_and_version_input_ignored
        claim_type: System Fields
        grounds:
          - entities.WaterContract.fields.status
          - endpoints.POST_/water/contracts
        distinguishing_aspect: "status and version are system-managed; a client shipping status SUSPENDED and version 99 is ignored — the row is created ACTIVE with version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
          trigger:
            - call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-910", priority_class: "SENIOR", max_annual_quantity_af: 100, repayment_obligation_cents: 1000, status: "SUSPENDED", version: 99 }
              as: SystemAdmin
              captures: { c_ign: $.data.id }
          assert:
            - "the response status is 201"
            - "WaterContract.${c_ign}.status == ACTIVE and version == 1"

      - name: contract_create_invalid_enum_priority_class_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.WaterContract.fields.priority_class
          - validations[priority=3]
        distinguishing_aspect: "priority_class is a closed enum {SENIOR, JUNIOR}; MIDDLE is rejected 400 ERR_INVALID_REQUEST rather than coerced or stored."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
          trigger:
            - call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-911", priority_class: "MIDDLE", max_annual_quantity_af: 100, repayment_obligation_cents: 1000 }
              as: SystemAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /water/contracts?district_id=${d_sr} returns 0 rows"

      - name: contract_create_with_unknown_district_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.WaterContract.fields.district_id
          - validations[priority=4]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts district_id in the body; an unknown district id is a 404 ERR_NOT_FOUND at priority 4 — after shape validation, before any business rule."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. No districts exist."
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /water/contracts"
              payload: { district_id: "00000000-0000-4000-8000-000000000000", contract_number: "C-912", priority_class: "SENIOR", max_annual_quantity_af: 100, repayment_obligation_cents: 1000 }
              as: SystemAdmin
              captures: { fk_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "GET /water/contracts returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finalize_without_published_announcement_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WaterYear.ANNOUNCED_to_CLOSED
          - errors.ERR_NO_PUBLISHED_ANNOUNCEMENT
        distinguishing_aspect: "POST /water/water-years/{id}/finalize on an OPEN year (observations but no published announcement) fails 409 ERR_NO_PUBLISHED_ANNOUNCEMENT and the year stays OPEN."
        test_recipe:
          setup:
            - "Base fixture up to an OPEN year 2027 with observations, no announcement."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_c_sr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
          trigger:
            - call: "POST /water/water-years/${wy_id}/finalize"
              payload: {}
              as: ReclamationOperator
              captures: { fin_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_PUBLISHED_ANNOUNCEMENT"
            - "WaterYear.${wy_id}.status is still OPEN"

      - name: publish_supersedes_prior_announcement_and_repoints_year
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AllocationAnnouncement.DRAFT_to_PUBLISHED
          - state_machines.AllocationAnnouncement.PUBLISHED_to_SUPERSEDED
          - entities.WaterYear.fields.current_announcement_id
        distinguishing_aspect: "Publishing a revision flips the previously PUBLISHED announcement to SUPERSEDED, repoints WaterYear.current_announcement_id, keeps the year ANNOUNCED, and stamps published_at from the logical clock — without any delivery orders involved."
        test_recipe:
          setup:
            - "Base announced fixture (v1 declared 7,500). A revision forecast (runoff 4,999, observed later) is posted."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - &b_run4999
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 4999, observed_on: "2027-01-20T00:00:00Z" }
              as: HydrologyOfficer
            - &b_clock_jan20
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-20T00:00:00Z" }
              as: SystemAdmin
            - &b_get_wy_v
              call: "GET /water/water-years/${wy_id}"
              payload: {}
              as: ReclamationOperator
              captures: { wy_v_cur: $.data.version }
            - &b_ann2c
              call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v_cur}" }
              as: ReclamationOperator
              captures: { ann2_id: $.data.id }
          trigger:
            - &b_ann2p
              call: "POST /water/allocation-announcements/${ann2_id}/publish"
              payload: {}
              as: ReclamationOperator
          assert:
            - "AllocationAnnouncement.${ann1_id}.status == SUPERSEDED"
            - "AllocationAnnouncement.${ann2_id}.status == PUBLISHED and published_at == 2027-01-20T00:00:00Z and sequence_number == 2"
            - "WaterYear.${wy_id}.current_announcement_id == ${ann2_id} and status == ANNOUNCED"

      - name: decide_on_rejected_transfer_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TransferRequest.UNDER_REVIEW_to_REJECTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REJECTED is terminal: a subsequent decide (APPROVE) on the same transfer fails 409 ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup:
            - "Base announced fixture with a transfer already REJECTED."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - &b_tr1
              call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr1_id: $.data.id }
            - &b_tr1_reject
              call: "POST /water/transfer-requests/${tr1_id}/decide"
              payload: { decision: "REJECT" }
              as: RegionalDirector
          trigger:
            - call: "POST /water/transfer-requests/${tr1_id}/decide"
              payload: { decision: "APPROVE" }
              as: RegionalDirector
              captures: { term_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "TransferRequest.${tr1_id}.status is still REJECTED"

      - name: record_delivery_on_delivered_order_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.DeliveryOrder.fulfillment_status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A fully-delivered order is terminal for record-delivery: the repeat call fails 409 ERR_INVALID_STATE and delivered_af does not drift upward."
        test_recipe:
          setup:
            - "Base announced fixture; SR order of 100 af fully delivered."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - &b_o100
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { o100_id: $.data.id }
            - &b_o100_full
              call: "POST /water/delivery-orders/${o100_id}/record-delivery"
              payload: { delivered_af: 100 }
              as: ReclamationOperator
          trigger:
            - call: "POST /water/delivery-orders/${o100_id}/record-delivery"
              payload: { delivered_af: 1 }
              as: ReclamationOperator
              captures: { idem_err: $.data.error_id }
          assert:
            - "DeliveryOrder.${o100_id}.fulfillment_status == DELIVERED after the exact-fill delivery"
            - "the repeat record-delivery returns 409 with error_id == ERR_INVALID_STATE"
            - "DeliveryOrder.${o100_id}.delivered_af is still 100"

      - name: settle_already_settled_period_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RevenuePeriod.PROJECTED_to_SETTLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SETTLED is terminal: settling the same period twice returns 409 ERR_INVALID_STATE and does not double-credit contracts."
        test_recipe:
          setup:
            - "Big-reservoir fixture with one executed February release and a SETTLED period."
          setup_api_calls:
            - *b_clock
            - &b_res_big
              call: "POST /water/reservoirs"
              payload: { name: "Shasta Unit", capacity_af: 4552000, dead_pool_af: 200000, flood_control_max_storage_af: 3600000, initial_storage_af: 3000000, outlet_capacity_cfs: 15000, power_conversion_mwh_per_af: 0.5 }
              as: SystemAdmin
              captures: { res_id: $.data.id }
            - *b_d_sr
            - *b_c_sr
            - &b_rel1
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 1000, duration_days: 10, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel1_id: $.data.id }
            - &b_clock_feb03
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-03T00:00:00Z" }
              as: SystemAdmin
            - &b_exec1
              call: "POST /water/release-orders/${rel1_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &b_per1
              call: "POST /water/revenue-periods"
              payload: { reservoir_id: "${res_id}", period_month: "2027-02", rate_cents_per_mwh: 4500 }
              as: FinanceOfficer
              captures: { per1_id: $.data.id }
            - &b_settle1
              call: "POST /water/revenue-periods/${per1_id}/settle"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /water/revenue-periods/${per1_id}/settle"
              payload: {}
              as: FinanceOfficer
              captures: { dbl_err: $.data.error_id }
          assert:
            - "the second settle returns 409 with error_id == ERR_INVALID_STATE"
            - "WaterContract.${c_sr}.repaid_credits_cents reflects exactly one settlement (no double credit)"

      - name: double_publish_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AllocationAnnouncement.DRAFT_to_PUBLISHED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Publishing an already-PUBLISHED announcement fails 409 ERR_INVALID_STATE; only DRAFT accepts publish."
        test_recipe:
          setup:
            - "Base announced fixture (v1 PUBLISHED)."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
          trigger:
            - call: "POST /water/allocation-announcements/${ann1_id}/publish"
              payload: {}
              as: ReclamationOperator
              captures: { dbl_pub_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "AllocationAnnouncement.${ann1_id}.status is still PUBLISHED"

      - name: release_execute_outside_window_and_at_bounds
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReleaseOrder.SCHEDULED_to_EXECUTED
          - errors.ERR_RELEASE_WINDOW_INVALID
        distinguishing_aspect: "The execution window is half-open [scheduled_start, scheduled_end): one second before start and exactly at end both fail 422 ERR_RELEASE_WINDOW_INVALID; an instant inside succeeds."
        test_recipe:
          setup:
            - "Big reservoir; a 100 cfs x 2 day release scheduled 2027-02-01 (window [Feb 1, Feb 3))."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - &b_rel_win
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "DELIVERY", release_cfs: 100, duration_days: 2, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_win_id: $.data.id }
            - &b_clock_jan31
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-31T23:59:59Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /water/release-orders/${rel_win_id}/execute"
              payload: {}
              as: ReclamationOperator
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-03T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /water/release-orders/${rel_win_id}/execute"
              payload: {}
              as: ReclamationOperator
              captures: { late_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /water/release-orders/${rel_win_id}/execute"
              payload: {}
              as: ReclamationOperator
          assert:
            - "the attempt at 2027-01-31T23:59:59Z returns 422 ERR_RELEASE_WINDOW_INVALID"
            - "the attempt at exactly scheduled_end (2027-02-03T00:00:00Z) returns 422 ERR_RELEASE_WINDOW_INVALID — the end is exclusive"
            - "the attempt inside the window succeeds: ReleaseOrder.${rel_win_id}.status == EXECUTED"

      - name: resolve_sustained_voids_open_transfer
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ImpactReview.FILED_to_SUSTAINED
          - state_machines.TransferRequest.UNDER_REVIEW_to_VOIDED
        distinguishing_aspect: "Resolving a review SUSTAINED cascades: the UNDER_REVIEW transfer becomes VOIDED in the same request, with no ledger movement on either allocation line."
        test_recipe:
          setup:
            - "Base announced fixture; transfer SR->JR UNDER_REVIEW; third-party review filed by d_tp."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - *b_tr1
            - &b_rv1
              call: "POST /water/transfer-requests/${tr1_id}/impact-reviews"
              payload: { claimed_impact_af: 300, basis: "JUNIOR_IMPAIRMENT" }
              as: DistrictManager
              as_user_id: "${d_tp}"
              captures: { rv1_id: $.data.id }
          trigger:
            - call: "POST /water/impact-reviews/${rv1_id}/resolve"
              payload: { outcome: "SUSTAINED", rationale: "junior injury proven" }
              as: RegionalDirector
          assert:
            - "ImpactReview.${rv1_id}.status == SUSTAINED"
            - "TransferRequest.${tr1_id}.status == VOIDED"
            - "the SR line still shows transfer_out_af == 0 and the JR line transfer_in_af == 0 — a voided transfer never moves water"

      - name: ratify_reaching_quorum_flips_agreement_ratified
        claim_type: Valid Transition
        grounds:
          - state_machines.ShortageAgreement.PROPOSED_to_RATIFIED
          - entities.ShortageAgreement.fields.signatory_district_ids
        distinguishing_aspect: "Ratification is cumulative: with quorum 2 the first ratify keeps the agreement PROPOSED (signatory recorded), and the second ratify — by a different district — flips it to RATIFIED in that response."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. Three districts. Agreement with quorum 2."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - &b_ag2
              call: "POST /water/shortage-agreements"
              payload: { name: "Drought Plan 2027", tier_1_senior_pct: 70, tier_1_junior_pct: 40, tier_2_senior_pct: 55, tier_2_junior_pct: 25, quorum_district_count: 2 }
              as: ReclamationOperator
              captures: { ag2_id: $.data.id }
          trigger:
            - call: "POST /water/shortage-agreements/${ag2_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
            - call: "POST /water/shortage-agreements/${ag2_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { ag2_status: $.data.status }
          assert:
            - "the first ratify returns status PROPOSED with signatory_district_ids == [${d_sr}]"
            - "the second ratify returns status RATIFIED with signatory_district_ids == [${d_sr}, ${d_jr}] — quorum reached exactly at 2"

      - name: activate_unratified_agreement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ShortageAgreement.RATIFIED_to_ACTIVATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "activate requires RATIFIED; a PROPOSED agreement (quorum not yet met) fails 409 ERR_INVALID_STATE regardless of the year payload."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district. Agreement with quorum 2 and zero ratifications."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_ag2
          trigger:
            - call: "POST /water/shortage-agreements/${ag2_id}/activate"
              payload: { water_year_label: 2027 }
              as: RegionalDirector
              captures: { act_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ShortageAgreement.${ag2_id}.status is still PROPOSED and activated_water_year_label is null"

      - name: activate_against_normal_tier_year_returns_activation_conflict
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ShortageAgreement.RATIFIED_to_ACTIVATED
          - errors.ERR_ACTIVATION_CONFLICT
        distinguishing_aspect: "Activation is gated on real shortage: a RATIFIED agreement targeting a year whose current announcement tier is NONE (declared 7,500, ratio 0.75) fails 409 ERR_ACTIVATION_CONFLICT."
        test_recipe:
          setup:
            - "Base announced fixture at declared 7,500 (tier NONE). Agreement ratified by d_sr (quorum 1)."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - &b_ag1
              call: "POST /water/shortage-agreements"
              payload: { name: "Drought Plan Q1", tier_1_senior_pct: 70, tier_1_junior_pct: 40, tier_2_senior_pct: 55, tier_2_junior_pct: 25, quorum_district_count: 1 }
              as: ReclamationOperator
              captures: { ag1_id: $.data.id }
            - call: "POST /water/shortage-agreements/${ag1_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
          trigger:
            - call: "POST /water/shortage-agreements/${ag1_id}/activate"
              payload: { water_year_label: 2027 }
              as: RegionalDirector
              captures: { act2_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ACTIVATION_CONFLICT"
            - "ShortageAgreement.${ag1_id}.status is still RATIFIED"

      - name: duplicate_ratify_same_district_returns_already_ratified
        claim_type: Invalid Transitions
        grounds:
          - entities.ShortageAgreement.fields.signatory_district_ids
          - errors.ERR_ALREADY_RATIFIED
        distinguishing_aspect: "Signatories are a set: the same district ratifying twice fails 409 ERR_ALREADY_RATIFIED and the signatory list does not grow."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. Two districts. Agreement quorum 2 with one ratification by d_sr."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_d_jr
            - *b_ag2
            - call: "POST /water/shortage-agreements/${ag2_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
          trigger:
            - call: "POST /water/shortage-agreements/${ag2_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { dup_rat_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ALREADY_RATIFIED"
            - "ShortageAgreement.${ag2_id}.signatory_district_ids still has exactly 1 element"

      - name: suspended_contract_skipped_by_next_publish
        claim_type: Side Effect Execution
        grounds:
          - state_machines.WaterContract.ACTIVE_to_SUSPENDED
          - calculations.priority_waterfall_allocation
        distinguishing_aspect: "The waterfall's input set is ACTIVE contracts only: a contract suspended before the first publish gets no AllocationLine at all, and the tier ratio is computed against the reduced total_max (7,500 / 6,000 -> NONE)."
        test_recipe:
          setup:
            - "Base fixture; contract C-200 SUSPENDED before any announcement."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - call: "POST /water/contracts/${c_jr}/suspend"
              payload: {}
              as: FinanceOfficer
            - *b_ann1c
          trigger:
            - *b_ann1p
          assert:
            - "GET /water/allocation-lines?announcement_id=${ann1_id} returns exactly 1 row, for contract ${c_sr}"
            - "the SR line's allocated_af == 6000 (min(6000, 7500))"
            - "AllocationAnnouncement.${ann1_id}.shortage_tier == NONE — total_max is 6,000 once C-200 is SUSPENDED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: supply_uses_latest_observation_by_observed_on
        claim_type: Input Set Filtering
        grounds:
          - calculations.forecast_declared_supply
          - entities.HydrologyObservation.fields.observed_on
        distinguishing_aspect: "Between two RUNOFF_FORECAST_AF observations the later observed_on wins regardless of posting order: forecast 3,000 observed 2027-01-20 supersedes forecast 5,000 observed 2027-01-10, so declared is 5,900 not 7,500."
        test_recipe:
          setup:
            - "Base fixture: small reservoir, year 2027, snowpack 80; runoff 5,000 observed 2027-01-10 and runoff 3,000 observed 2027-01-20."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_c_sr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - &b_run3000_late
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 3000, observed_on: "2027-01-20T00:00:00Z" }
              as: HydrologyOfficer
            - *b_ann1c
          trigger:
            - *b_ann1p
          assert:
            - "AllocationAnnouncement.${ann1_id}.declared_supply_af == 5900 (usable 5500 + round(3000*80/100) - 2000)"
            - "AllocationAnnouncement.${ann1_id}.declared_supply_af != 7500 — the stale 5,000-observed-earlier forecast is excluded"

      - name: volume_conversion_applies_half_up_precision
        claim_type: Precision
        grounds:
          - calculations.release_volume_af
          - entities.ReleaseOrder.fields.volume_af
        distinguishing_aspect: "A 7 cfs x 3 day release is 7*3*1.9835 = 41.6535 af and rounds half-up to exactly 42 af at creation; the value is frozen on the row."
        test_recipe:
          setup:
            - "Big reservoir, clock 2026-10-01, no constraints."
          setup_api_calls:
            - *b_clock
            - *b_res_big
          trigger:
            - call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "ENVIRONMENTAL", release_cfs: 7, duration_days: 3, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel42_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ReleaseOrder.${rel42_id}.volume_af == 42"
            - "ReleaseOrder.${rel42_id}.scheduled_end == 2027-02-04T00:00:00Z (start + 3 days, half-open)"

      - name: revenue_period_excludes_releases_outside_the_month
        claim_type: Input Set Filtering
        grounds:
          - calculations.hydropower_revenue
          - entities.RevenuePeriod.fields.period_month
        distinguishing_aspect: "Month windowing is inclusive of the 1st and exclusive of the next 1st: a March release (even EXECUTED before period creation) contributes nothing to the February period — projected_mwh stays 9,917.5."
        test_recipe:
          setup:
            - "Big reservoir. February release 1,000 cfs x 10 days EXECUTED; March release 200 cfs x 2 days EXECUTED; then period 2027-02 created."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - *b_d_sr
            - *b_c_sr
            - *b_rel1
            - &b_rel_mar
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 200, duration_days: 2, scheduled_start: "2027-03-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_mar_id: $.data.id }
            - *b_clock_feb03
            - *b_exec1
            - &b_clock_mar02
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /water/release-orders/${rel_mar_id}/execute"
              payload: {}
              as: ReclamationOperator
          trigger:
            - call: "POST /water/revenue-periods"
              payload: { reservoir_id: "${res_id}", period_month: "2027-02", rate_cents_per_mwh: 4500 }
              as: FinanceOfficer
              captures: { per_feb_id: $.data.id }
          assert:
            - "RevenuePeriod.${per_feb_id}.projected_mwh == 9917.5 (only the February release's 19,835 af count)"
            - "RevenuePeriod.${per_feb_id}.projected_revenue_cents == 44628750"
            - "ReleaseOrder.${rel_mar_id}.status == EXECUTED — exclusion is by month window, not by release state"

      - name: inflow_observation_credits_and_execute_debits_storage
        claim_type: Correct Result
        grounds:
          - calculations.reservoir_storage_balance
          - entities.Reservoir.fields.current_storage_af
        distinguishing_aspect: "The chronological storage ledger: 3,000,000 initial + 50,000 measured inflow - 19,835 executed volume == 3,030,165, applied in event order with no reordering."
        test_recipe:
          setup:
            - "Big reservoir. Year 2027 open. A 1,000 cfs x 10 day February release."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - *b_d_sr
            - *b_c_sr
            - *b_wy
            - &b_inflow50k
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "MEASURED_INFLOW_AF", value: 50000, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - *b_rel1
            - *b_clock_feb03
          trigger:
            - *b_exec1
            - call: "GET /water/reservoirs/${res_id}"
              payload: {}
              as: ReclamationOperator
              captures: { res_storage: $.data.current_storage_af }
          assert:
            - "Reservoir.${res_id}.current_storage_af == 3030165 (3000000 + 50000 - 19835)"
            - "ReleaseOrder.${rel1_id}.executed_at == 2027-02-03T00:00:00Z"

      - name: waterfall_active_only_input_set_is_constants_applied
        claim_type: Constants Applied
        grounds:
          - calculations.priority_waterfall_allocation
          - calculations.shortage_tier_classification
        excluded_because:
          difficulty_instance: suspended_contract_skipped_by_next_publish
          rationale: "The ACTIVE-only input set and the tier thresholds are asserted there end-to-end; see also tier_boundary_ratio_exact_075 for the 0.75/0.50 constants."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_return_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED at priority 1 — before role authorization, existence, or any business check."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. Big reservoir exists."
          setup_api_calls:
            - *b_clock
            - *b_res_big
          trigger:
            - call: "GET /water/reservoirs/${res_id}"
              payload: {}
              captures: { unauth_err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: delivery_create_with_unknown_contract_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Body foreign keys are resolved in declared input order: with an unknown contract_id (checked before water_year_id), the answer is 404 ERR_NOT_FOUND even when the year exists."
        test_recipe:
          setup:
            - "Base announced fixture."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
          trigger:
            - call: "POST /water/delivery-orders"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", water_year_id: "${wy_id}", ordered_af: 10 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { do_nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "GET /water/delivery-orders?water_year_id=${wy_id} returns 0 rows"

      - name: delivery_over_remaining_returns_allocation_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_ALLOCATION_EXCEEDED
          - calculations.allocation_remaining_balance
        distinguishing_aspect: "Pure fiscal overflow with no state issue in play: ordering 1,501 af against the JR line's 1,500 af remaining fails 422 ERR_ALLOCATION_EXCEEDED, while exactly 1,500 succeeds — the comparison is ordered_af <= remaining_af."
        test_recipe:
          setup:
            - "Base announced fixture (JR line remaining 1,500)."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_jr}", water_year_id: "${wy_id}", ordered_af: 1501 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { over_err: $.data.error_id }
          trigger:
            - call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_jr}", water_year_id: "${wy_id}", ordered_af: 1500 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { exact_id: $.data.id }
          assert:
            - "the 1,501 af order returns 422 with error_id == ERR_ALLOCATION_EXCEEDED"
            - "the exactly-1,500 af order succeeds: 201, DeliveryOrder.${exact_id}.fulfillment_status == CONFIRMED"
            - "the JR line's remaining_af is now exactly 0"

      - name: transfer_over_from_line_returns_allocation_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_ALLOCATION_EXCEEDED
          - endpoints.POST_/water/transfer-requests
        distinguishing_aspect: "The same fiscal rule guards transfers from the seller side: quantity 6,001 af against the SR line's 6,000 remaining fails 422 ERR_ALLOCATION_EXCEEDED."
        test_recipe:
          setup:
            - "Base announced fixture (SR remaining 6,000)."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
          trigger:
            - call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 6001 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr_over_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ALLOCATION_EXCEEDED"
            - "GET /water/transfer-requests?water_year_id=${wy_id} returns 0 rows"

      - name: transfer_from_equals_to_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - entities.TransferRequest.fields.from_contract_id
        distinguishing_aspect: "from_contract_id == to_contract_id is a shape error caught at priority 3 — 400 ERR_INVALID_REQUEST — before any state or fiscal evaluation."
        test_recipe:
          setup:
            - "Base announced fixture."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
          trigger:
            - call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_sr}", water_year_id: "${wy_id}", quantity_af: 10 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { same_err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: min_and_max_both_violated_returns_min_flow_first
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - errors.ERR_ENV_MIN_FLOW_VIOLATION
          - errors.ERR_MAX_RELEASE_EXCEEDED
        distinguishing_aspect: "Within the safety category the sub-order is pinned MIN_FLOW before MAX_RELEASE: with MIN_FLOW 500 and MAX_RELEASE 300 both covering the window, a 400 cfs release violates both and must report ERR_ENV_MIN_FLOW_VIOLATION."
        test_recipe:
          setup:
            - "Big reservoir; MIN_FLOW 500 and MAX_RELEASE 300 constraints both covering Feb."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SMELT", requirement_type: "MIN_FLOW", required_min_cfs: 500, enforce_start: "2027-01-01T00:00:00Z", enforce_end: "2027-03-01T00:00:00Z" }
              as: EnvironmentalOfficer
            - call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SALMON", requirement_type: "MAX_RELEASE", max_release_cfs: 300, enforce_start: "2027-01-01T00:00:00Z", enforce_end: "2027-03-01T00:00:00Z" }
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 400, duration_days: 5, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { both_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ENV_MIN_FLOW_VIOLATION"
            - "error_id != ERR_MAX_RELEASE_EXCEEDED"

      - name: max_release_violation_alone_returns_max_release_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_MAX_RELEASE_EXCEEDED
        distinguishing_aspect: "With only a MAX_RELEASE 300 constraint in force, a 400 cfs release is rejected 422 ERR_MAX_RELEASE_EXCEEDED — the safety error is triggerable in isolation."
        test_recipe:
          setup:
            - "Big reservoir; MAX_RELEASE 300 constraint covering Feb."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SALMON", requirement_type: "MAX_RELEASE", max_release_cfs: 300, enforce_start: "2027-01-01T00:00:00Z", enforce_end: "2027-03-01T00:00:00Z" }
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 400, duration_days: 5, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { max_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_MAX_RELEASE_EXCEEDED"
            - "GET /water/reservoirs/${res_id}/release-orders returns 0 rows"

      - name: flood_gate_blocks_non_flood_release_and_allows_flood_release
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_FLOOD_CONTROL_REQUIRED
          - calculations.forecast_declared_supply
        distinguishing_aspect: "In a flood month with storage above flood_control_max_storage_af, a POWER release is rejected 422 ERR_FLOOD_CONTROL_REQUIRED while a FLOOD_CONTROL release for the same window is accepted — the gate is purpose-conditional."
        test_recipe:
          setup:
            - "Reservoir created with initial_storage 4,000,000 > flood_control_max 3,600,000. Clock in January (flood month)."
          setup_api_calls:
            - *b_clock
            - &b_res_flood
              call: "POST /water/reservoirs"
              payload: { name: "Flood Unit", capacity_af: 4552000, dead_pool_af: 200000, flood_control_max_storage_af: 3600000, initial_storage_af: 4000000, outlet_capacity_cfs: 15000, power_conversion_mwh_per_af: 0.5 }
              as: SystemAdmin
              captures: { res_f_id: $.data.id }
            - *b_clock_jan
          trigger:
            - call: "POST /water/reservoirs/${res_f_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 100, duration_days: 2, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { flood_err: $.data.error_id }
            - call: "POST /water/reservoirs/${res_f_id}/release-orders"
              payload: { purpose: "FLOOD_CONTROL", release_cfs: 100, duration_days: 2, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { flood_ok_id: $.data.id }
          assert:
            - "the POWER release returns 422 with error_id == ERR_FLOOD_CONTROL_REQUIRED"
            - "the FLOOD_CONTROL release succeeds: 201 with id ${flood_ok_id}"

      - name: execute_with_insufficient_storage_checked_before_window
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - errors.ERR_INSUFFICIENT_STORAGE
          - errors.ERR_RELEASE_WINDOW_INVALID
        distinguishing_aspect: "The storage check runs before the window check: a 19,835 af release against 10,500 af storage fails 422 ERR_INSUFFICIENT_STORAGE even when the clock is also outside the window — and inside the window it is the same storage error."
        test_recipe:
          setup:
            - "Small reservoir (storage 10,500). A 1,000 cfs x 10 day release scheduled 2027-02-01."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "DELIVERY", release_cfs: 1000, duration_days: 10, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_big_id: $.data.id }
          trigger:
            - *b_clock_jan31
            - call: "POST /water/release-orders/${rel_big_id}/execute"
              payload: {}
              as: ReclamationOperator
              captures: { stor_err: $.data.error_id }
            - *b_clock_feb03
            - call: "POST /water/release-orders/${rel_big_id}/execute"
              payload: {}
              as: ReclamationOperator
              captures: { stor_err2: $.data.error_id }
          assert:
            - "the attempt before the window returns 422 ERR_INSUFFICIENT_STORAGE — storage is evaluated first"
            - "the attempt inside the window also returns 422 ERR_INSUFFICIENT_STORAGE"
            - "ReleaseOrder.${rel_big_id}.status is still SCHEDULED and Reservoir.${res_id}.current_storage_af == 10500"

      - name: duplicate_contract_number_rejected
        claim_type: Violation → Error
        grounds:
          - entities.WaterContract.fields.contract_number
          - errors.ERR_DUPLICATE_CONTRACT_NUMBER
        distinguishing_aspect: "contract_number is globally unique: a second contract with C-100 fails 409 ERR_DUPLICATE_CONTRACT_NUMBER even on a different district."
