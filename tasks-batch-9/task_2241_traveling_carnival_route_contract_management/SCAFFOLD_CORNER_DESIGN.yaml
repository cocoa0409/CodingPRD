              as: RouteManager
              captures: { stop_v2: "$.data.id" }
          trigger:
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_v2}", worker_id: "${rig_v2}", crew_role: "SETUP", shift_start: "2026-09-01T06:00:00Z", shift_end: "2026-09-01T14:00:00Z" }
