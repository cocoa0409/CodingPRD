            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v2}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 4000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { job_a_id: $.data.id } }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 4000, scheduled_start: "2026-09-12T08:00:00Z", scheduled_end: "2026-09-12T16:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { job_b_id: $.data.id } }
