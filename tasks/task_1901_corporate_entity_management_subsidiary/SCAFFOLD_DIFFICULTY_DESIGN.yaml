  - rule_id: compensating_invariant
    instances:
      - name: filing_fee_accrual_reversal
        grounds:
          - state_machines.AnnualFiling.PREPARED_to_SUBMITTED
          - state_machines.AnnualFiling.SUBMITTED_to_REJECTED
          - entities.LegalEntity.fields.fees_accrued_cents
        distinguishing_aspect: |
          Conserved quantity: fee cents. Invariant (pinned on the
          fees_accrued_cents field): LegalEntity.fees_accrued_cents ==
          sum(AnnualFiling.fee_cents) over that entity's filings with status IN
          {SUBMITTED, ACCEPTED}. Submit accrues 31000 (fee 5000 + tax 26000 +
          penalty 0); reject subtracts exactly 31000; the pair leaves the
          ledger at its baseline 0 - any drift violates the invariant.
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1 with authorized_shares 10000; FRANCHISE_TAX period-2026 filing PREPARED"
            - "logical clock at the 2026-08-01 default (in period, no lateness)"
