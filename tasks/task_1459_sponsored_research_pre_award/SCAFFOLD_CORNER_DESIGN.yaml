  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_proposals_pagination_and_filter
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /proposals honors pi_id filter + limit/offset: page 1 (limit 2) of 3 has has_more true; page 2 (offset 2) returns 1 row with has_more false; status filter narrows further."
        test_recipe:
          setup: ["opportunity; PI-A with 3 proposals; PI-B with 1 proposal"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "PA", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_a: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "PB", department_code: "CHEM", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_b: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_a}", title: "A1", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_a}"
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_a}", title: "A2", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_a}"
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_a}", title: "A3", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_a}"
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_b}", title: "B1", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_b}"
          trigger:
            - { call: "GET /pre-award/proposals", payload: { pi_id: "${pi_a}", limit: 2, offset: 0 }, as: OSPDirector, captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" } }
            - { call: "GET /pre-award/proposals", payload: { pi_id: "${pi_a}", limit: 2, offset: 2 }, as: OSPDirector, captures: { page2_first: "$.data[0].id" } }
            - { call: "GET /pre-award/proposals", payload: { pi_id: "${pi_b}", status: "DRAFT" }, as: OSPDirector, captures: { b_first: "$.data[0].id" } }
          assert:
            - "page 1 response carries 2 rows with total_count == 3 and has_more == true"
            - "page 2 response carries exactly 1 row with has_more == false"
            - "page1_first != page2_first and page1_second != page2_first (no overlap across pages)"
            - "PI-B filtered list has exactly 1 row (b_first) and every row's pi_id == ${pi_b}"

      - name: jit_notice_and_response_happy_path
        claim_type: valid_transition
        grounds: [state_machines.Proposal.SUBMITTED_to_JIT_REQUESTED, state_machines.Proposal.JIT_REQUESTED_to_SUBMITTED, entities.Proposal.fields.jit_due_at]
        distinguishing_aspect: "jit-notices stamps jit_due_at = clock + due_in_days (14) = 2026-08-15T00:00:00Z; jit-responses returns the proposal to SUBMITTED."
        test_recipe:
          setup: ["proposal SUBMITTED at clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NIH", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "MED", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "JIT", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-jit-1" }, as: OSPDirector }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/jit-notices", payload: { sponsor_reference: "NIH-JIT-1", due_in_days: 14 }, as: OSPDirector, captures: { st1: $.data.status, due: $.data.jit_due_at } }
            - { call: "POST /pre-award/proposals/${prop_id}/jit-responses", payload: { sponsor_reference: "NIH-JIT-1" }, as: OSPDirector, captures: { st2: $.data.status } }
          assert:
            - "st1 == JIT_REQUESTED and due == 2026-08-15T00:00:00Z"
            - "st2 == SUBMITTED"

      - name: budget_lines_filtered_list_isolation
        claim_type: retrieval
        grounds: [endpoints]
        distinguishing_aspect: "GET /budget-lines?proposal_id=X returns only X's lines (FK filter isolation across proposals); the sub-resource list agrees."
        test_recipe:
          setup: ["opportunity; eligible PI; proposals P1 (2 lines) and P2 (1 line)"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "P1", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_id}"
              captures: { p1: $.data.id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "P2", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_id}"
              captures: { p2: $.data.id }
            - { call: "POST /pre-award/proposals/${p1}/budget-lines", payload: { category: "PERSONNEL", description: "a", fiscal_year: 2027, amount_cents: 100, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${p1}/budget-lines", payload: { category: "TRAVEL", description: "b", fiscal_year: 2027, amount_cents: 200, is_cost_share: false }, as: PreAwardAnalyst }
