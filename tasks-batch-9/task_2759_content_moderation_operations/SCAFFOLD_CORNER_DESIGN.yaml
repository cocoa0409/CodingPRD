        excluded_because:
          difficulty_instance: appeal_window_temporal_beats_credit_exhaustion_fiscal
          rationale: "The appeal_deadline_at window is tested one second before and one second after expiry there, including its interaction with the credit rule."
      - name: aggregate_validation_covered_by_difficulty_design
