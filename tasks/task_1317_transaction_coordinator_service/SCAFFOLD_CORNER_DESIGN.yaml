scaffold_corner_design:
- section: entities
  instances:
  - name: coordinator_creation_applies_defaults
    claim_type: creation
    grounds:
    - entities.Coordinator.fields.status
    distinguishing_aspect: POST /tc/coordinators with the three required inputs returns
      201 with system defaults status == ACTIVE and version == 1.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      assert:
      - Coordinator.${coord_id}.status == ACTIVE (default applied)
      - Coordinator.${coord_id}.version == 1 and created_at/updated_at are present
  - name: file_create_missing_state_code_rejected
    claim_type: required_fields
    grounds:
    - entities.TransactionFile.fields.state_code
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input state_code on file creation yields
      400 ERR_INVALID_REQUEST and persists nothing.
    test_recipe:
      setup:
      - Coordinator with seller agent on roster
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      trigger:
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 400 with error_id == ERR_INVALID_REQUEST'
      - GET /tc/files?coordinator_id=${coord_id} returns an empty data array
  - name: file_create_extra_field_rejected
    claim_type: type_constraints
    grounds:
    - validations[priority=12]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A payload key not declared in the endpoint's input list
      (e.g. fee_estimate_cents, a computed field) is rejected, not silently ignored.
    test_recipe:
      setup:
      - Coordinator with seller agent
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      trigger:
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          fee_estimate_cents: 1
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 400 with error_id == ERR_INVALID_REQUEST (client-supplied
        computed field is not accepted)'
  - name: file_create_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.TransactionFile.fields.contract_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: contract_type outside {PURCHASE_SALE, LISTING_ONLY} is
      rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Coordinator with seller agent
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      trigger:
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LEASE
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 400 with error_id == ERR_INVALID_REQUEST'
  - name: get_nonexistent_file_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_FILE_NOT_FOUND]
    distinguishing_aspect: GET on a well-formed but absent UUID yields 404 ERR_FILE_NOT_FOUND,
      not a 500 or empty object.
    test_recipe:
      setup:
      - One coordinator exists (any authenticated role may read)
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      trigger:
      - call: GET /tc/files/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 404 with error_id == ERR_FILE_NOT_FOUND'
  - name: communication_entry_append_only_shape
    claim_type: immutability
    grounds:
    - entities.CommunicationEntry
    distinguishing_aspect: 'CommunicationEntry declares common_fields: false — responses
      expose id and created_at but no version/updated_at, and the surface offers no
      update endpoint.'
    test_recipe:
      setup:
      - Coordinator with an ACTIVE file
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      trigger:
      - call: POST /tc/communications
        payload:
          file_id: ${file_id}
          party: SELLER_AGENT
          direction: OUTBOUND
          body: Please send the executed contract
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          comm_id: $.data.id
      assert:
      - CommunicationEntry.${comm_id}.status == OPEN and entry_kind == LOG (defaults)
      - Response data contains created_at and does NOT contain version or updated_at
        (append-only event entity)
  - name: agent_created_on_acting_coordinators_roster
    claim_type: parent_relationships
    grounds:
    - entities.Agent.fields.coordinator_id
    distinguishing_aspect: Agent.coordinator_id is system-filled from the acting coordinator's
      identity, not accepted from the payload.
    test_recipe:
      setup:
      - Two coordinators exist
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/coordinators
        payload:
          full_name: Dana Coord
          email: dana@tc.example
          license_number: TC-2002
        as: SystemAdmin
        captures:
          coord2_id: $.data.id
      trigger:
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          agent_id: $.data.id
      assert:
      - Agent.${agent_id}.coordinator_id == ${coord_id}
      - GET /tc/agents?coordinator_id=${coord2_id} returns an empty array
  - name: list_files_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    distinguishing_aspect: 'List responses carry the fixed envelope: meta block plus
      limit/offset/total_count/has_more pagination fields with default limit 10.'
    test_recipe:
      setup:
      - Coordinator with exactly one file
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      trigger:
      - call: GET /tc/files
        payload:
          coordinator_id: ${coord_id}
          limit: 10
          offset: 0
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - Response contains meta.api_request_id and meta.api_request_timestamp
      - 'response_type == ''array''; pagination fields present: total_count == 1,
        has_more == false, limit == 10, offset == 0'
- section: state_machines
  instances:
  - name: file_initial_state_is_draft
    claim_type: initial_state
    grounds:
    - state_machines.TransactionFile
    distinguishing_aspect: A newly created TransactionFile starts in DRAFT with last_audit_status
      NONE and open_escalation_count 0.
    test_recipe:
      setup:
      - Coordinator with seller agent
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      trigger:
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      assert:
      - TransactionFile.${file_id}.status == DRAFT
      - TransactionFile.${file_id}.last_audit_status == NONE AND open_escalation_count
        == 0
  - name: terminated_file_lockdown_rejected
    claim_type: terminal_lockdown
    grounds:
    - state_machines.TransactionFile
    - errors[ERR_FILE_ALREADY_TERMINAL]
    distinguishing_aspect: 'TERMINATED is terminal: a second terminate attempt is
      rejected and no transition out of TERMINATED exists.'
    test_recipe:
      setup:
      - An ACTIVE file that is then terminated
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      - call: POST /tc/files/${file_id}/terminate
        payload:
          reason: seller withdrew
        as: Coordinator
        as_user_id: ${coord_id}
      trigger:
      - call: POST /tc/files/${file_id}/terminate
        payload:
          reason: second attempt
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Second terminate: http 409 with error_id == ERR_FILE_ALREADY_TERMINAL'
      - TransactionFile.${file_id}.status remains TERMINATED
  - name: milestone_complete_before_start_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Milestone.PENDING_to_IN_PROGRESS
    - errors[ERR_MILESTONE_INVALID_STATE]
    distinguishing_aspect: PENDING → COMPLETED is not a declared transition (completion
      requires IN_PROGRESS or OVERDUE); completing an unstarted milestone fails.
    test_recipe:
      setup:
      - ACTIVE file with a PENDING milestone 'Listing Paperwork'
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      - call: GET /tc/milestones
        payload:
          file_id: ${file_id}
          name: Listing Paperwork
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          ms_id: $.data[0].id
      trigger:
      - call: POST /tc/milestones/${ms_id}/complete
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 409 with error_id == ERR_MILESTONE_INVALID_STATE'
      - Milestone.${ms_id}.status remains PENDING
  - name: milestone_overdue_then_late_completion
    claim_type: valid_transition
    grounds:
    - state_machines.Milestone.PENDING_to_OVERDUE
    - state_machines.Milestone.OVERDUE_to_COMPLETED
    distinguishing_aspect: Clock advance past due_date moves PENDING → OVERDUE; completing
      from OVERDUE sets late_completion == true (vs false from IN_PROGRESS).
    test_recipe:
      setup:
      - ACTIVE file; milestone 'Listing Paperwork' due 2026-08-08 (effective 2026-08-03
        + 5)
      - Clock advanced to 2026-08-09T00:00:00Z (past due, before closing 2026-08-31)
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 14
          appraisal_offset_days: 21
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      - call: GET /tc/milestones
        payload:
          file_id: ${file_id}
          name: Listing Paperwork
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          ms_id: $.data[0].id
      - call: POST /tc/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-09T00:00:00Z'
        as: SystemAdmin
      trigger:
      - call: GET /tc/milestones/${ms_id}
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          ms_status: $.data.status
      - call: POST /tc/milestones/${ms_id}/complete
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'After clock advance: Milestone.${ms_id}.status == OVERDUE (system transition)'
      - 'After complete: status == COMPLETED and late_completion == true'
  - name: mandatory_milestone_waive_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Milestone.PENDING_to_WAIVED
    - errors[ERR_MILESTONE_MANDATORY]
    distinguishing_aspect: Waive is structurally forbidden for mandatory milestones
      regardless of state; the error is the constraint ERR_MILESTONE_MANDATORY, not
      a state error.
    test_recipe:
      setup:
      - ACTIVE file whose template has a mandatory milestone 'Earnest Money'
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Earnest Money
            offset_days: 3
            mandatory: true
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      - call: GET /tc/milestones
        payload:
          file_id: ${file_id}
          name: Earnest Money
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          ms_id: $.data[0].id
      trigger:
      - call: POST /tc/milestones/${ms_id}/waive
        payload: {}
        as: Coordinator
        as_user_id: ${coord_id}
      assert:
      - 'Response: http 409 with error_id == ERR_MILESTONE_MANDATORY'
      - Milestone.${ms_id}.status remains PENDING
  - name: optional_milestone_waive_succeeds
    claim_type: valid_transition
    grounds:
    - state_machines.Milestone.PENDING_to_WAIVED
    distinguishing_aspect: The same waive transition succeeds for a non-mandatory
      milestone — the constraint is conditional on the mandatory flag.
    test_recipe:
      setup:
      - ACTIVE file with optional milestone 'Listing Paperwork' PENDING
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
