    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: /api/v1/orders
    description: "List orders (reverse-reachability for contractor_id and prebuy_program_id FKs)"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer]
    code: 200
    input: ["contractor_id?", "prebuy_program_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: PATCH
    path: /api/v1/orders/{id}
    description: "Edit a DRAFT order (change prebuy_program_id); OCC-guarded"
    roles: [ContractorUser]
    code: 200
    input: [expected_order_version, "prebuy_program_id?"]
    output: Order
    side_effects: ["increments version by 1"]
  - method: POST
    path: /api/v1/orders/{id}/lines
    description: "Add a line to a DRAFT order"
    roles: [ContractorUser]
    code: 201
    input: ["ahri_rating_id?", "equipment_model_id?", quantity]
