          setup:
            - "Market DMA-513 with one quota cell (target 2, base incentive 2000), a published 2026Q3 universe of 200000 households for that cell and a published edit rule set whose fault_missing_minutes_threshold is 1440 (suspect floor 720)."
            - "Two households hA and hB, both ACTIVE with an installed HEALTHY TV_TUNER, so the cell is FILLED (2/2), its incentive boost is off, incentive_budget_reserved_cents is 0 and the market posture is CLOSED."
