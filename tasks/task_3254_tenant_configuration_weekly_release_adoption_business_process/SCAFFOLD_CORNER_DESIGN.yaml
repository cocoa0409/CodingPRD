        test_recipe:
          setup: ["tenant t1, DRAFT definition d1"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-VA4", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
