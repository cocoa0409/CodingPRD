            - call: "POST /investigations/${inv_id}/tolling"
              payload: { action: "RESUME", tolling_reason: "Resume from ASSIGNED." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { err_resume: "$.data.error_id" }
          assert:
            - "call 1: HTTP 409 with ${err_toll} == ERR_INVESTIGATION_STATE_INVALID (SUSPEND is declared only from IN_PROGRESS)"
            - "call 2: HTTP 409 with ${err_close_unassigned} == ERR_INVESTIGATION_STATE_INVALID (close is declared only from PENDING_REVIEW)"
            - "call 3: HTTP 200; Investigation.${inv_id}.status == ASSIGNED and assignment_count == 1 and version == 2"
            - "call 4: HTTP 409 with ${err_findings} == ERR_INVESTIGATION_STATE_INVALID (findings are declared only from IN_PROGRESS; the priority-6 assigned-investigator check passed first, so this is a state rejection, not an identity rejection)"
            - "call 5: HTTP 409 with ${err_resume} == ERR_INVESTIGATION_STATE_INVALID (RESUME is declared only from TOLLED or PENDING_REVIEW)"
            - "Investigation.${inv_id}.status == ASSIGNED, tolled_days == 0, suspended_at == null, findings_submitted_at == null, version == 2 after all five calls"
            - "Officer.${inv_a_id}.open_case_load == 1 (only the accepted assignment moved the ledger)"
            - "Allegation.${a1_id}.evidence_weight_for == 0 and preponderance_met == false (the rejected findings wrote nothing)"

      - name: a_withdrawn_complaint_refuses_every_further_lifecycle_call
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Complaint.terminal_states
          - state_machines.Complaint.transitions.CLASSIFIED_to_WITHDRAWN
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          WITHDRAWN is a declared terminal state whose only outgoing edge is the purge, and the
          purge is gated on the retention clock. So a withdrawn complaint must refuse a second
          withdrawal, a screening decision, an investigation opening and a new allegation with
          ERR_COMPLAINT_STATE_INVALID (409), while the purge attempt gets past the state gate
          and fails on the retention window instead — a different error from a different
          priority band, proving the lockdown is state-driven rather than blanket.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit, Commander Reyes and Officer Vance exist."
            - "A PUBLIC-channel NEGLECT_OF_DUTY complaint reached CLASSIFIED and holds intake_reference_code CMP-000001."
