            - "LabResult.${r_id}.reported_ng_per_l == 3.00"
            - "LabResult.${r_id}.laboratory_id == ${lab_id}"
            - "LabResult.${r_id}.version == 1"
            - "GET /lab-results?sample_id=${s_id} returns total_count == 1"

      - name: a_second_accepted_result_for_the_same_period_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_DUPLICATE_PERIOD_RESULT]
          - state_machines.LabResult.transitions.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "Two independent samples for the same (entry point, contaminant, 2026Q2) triple both reach SUBMITTED legally — the uniqueness rule bites only on the SECOND acceptance, so the second row must survive in SUBMITTED rather than never being created."
        test_recipe:
