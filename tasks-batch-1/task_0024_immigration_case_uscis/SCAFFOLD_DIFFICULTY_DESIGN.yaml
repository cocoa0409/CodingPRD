              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /uscis/cases/${case_id}/interviews"
              payload: { scheduled_at: "2026-07-15T16:00:00Z", field_office_code: "FO-SFR" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_VISA_RETROGRESSED'"
            - "Case.${case_id}.status == 'UNDER_REVIEW'"

      - name: rfe_evidence_items_empty_array_rejected_metric_cardinality
        grounds:
          - validations[priority=17]
          - state_machines.Case.UNDER_REVIEW_to_RFE_PENDING
          - entities.RFE.fields.evidence_items_requested
          - endpoints."POST /uscis/cases/{id}/rfes"
        distinguishing_aspect: |
          Cardinality boundary on a DIFFERENT metric (collection size, not numeric date)
          reached via a DIFFERENT endpoint (POST /uscis/cases/{id}/rfes, not interviews).
          The transition's precondition 'evidence_items_requested length >= 1' fails at exact
          length == 0 (empty array). A length-1 request would succeed; length-0 fails with
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "I-130 case advanced to UNDER_REVIEW; rfe_round_count=0 (cap not relevant here)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A999999992", full_name: "K Cardinality", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "k@x.com" }
