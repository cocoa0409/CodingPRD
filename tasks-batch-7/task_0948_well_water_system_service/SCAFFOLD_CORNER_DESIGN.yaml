      - name: corner_validation_shared_well_party_count_ceiling
        claim_type: Aggregate validation
        grounds: ["validations[priority=68]", "errors[ERR_SHARED_WELL_SPLIT_INVALID]", "global_constants.SHARED_WELL_MAX_PARTIES", "entities.SharedWellAgreement.fields.split_pct"]
        distinguishing_aspect: |
          The party ceiling bites independently of the percentage ceiling. Four ACTIVE
          shares of 20.00 percent each are accepted even though they total only 80.00
          (under-allocation is explicitly permitted at creation), and a FIFTH share of
          10.00 percent - which would bring the total to a perfectly legal 90.00 - is
          refused 422 ERR_SHARED_WELL_SPLIT_INVALID purely because it would be the
          fifth party. An implementation that only checks the 100.00 sum accepts it.
        test_recipe:
          setup:
            - "Five accounts, one property owned by the first account, and one well on that property."
            - "Four ACTIVE SharedWellAgreement rows on that well, one per account, each 20.00 percent."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
