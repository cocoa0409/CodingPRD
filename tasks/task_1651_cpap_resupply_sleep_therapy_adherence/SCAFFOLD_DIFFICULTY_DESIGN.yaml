            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-29T00:00:00Z" }
              as: OpsAdmin
            - call: "GET /sleep-therapy/patients/${pat15}"
              payload: {}
