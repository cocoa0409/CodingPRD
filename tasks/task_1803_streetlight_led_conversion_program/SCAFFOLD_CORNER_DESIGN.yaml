        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: N-1
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 90
        as: ProgramManager
        captures:
          pole: $.data.id
      - call: POST /streetlights/outage-tickets
        payload:
          pole_id: ${pole}
          description: A
          hazard_flag: false
        as: CitizenReporter
        as_user_id: citizen-1
        captures:
          ta: $.data.id
      - call: POST /streetlights/outage-tickets/${ta}/triage
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/outage-tickets/${ta}/dispatch
        payload:
          crew_id: ${crew}
        as: ProgramManager
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-02T00:00:00Z'
        as: ProgramManager
      - call: POST /streetlights/outage-tickets/${ta}/resolve
        payload:
          resolution_code: LIGHT_OUT_FIXED
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/outage-tickets/${ta}/verify
        payload: {}
        as: CitizenReporter
        as_user_id: citizen-1
      trigger:
      - call: POST /streetlights/outage-tickets/${ta}/triage
        payload: {}
        as: ProgramManager
        captures:
          e1: $.data.error_id
      - call: POST /streetlights/outage-tickets/${ta}/resolve
        payload:
          resolution_code: NO_FAULT_FOUND
        as: FieldSupervisor
        as_user_id: ${crew}
        captures:
          e2: $.data.error_id
      - call: POST /streetlights/outage-tickets/${ta}/reopen
        payload: {}
        as: CitizenReporter
        as_user_id: citizen-1
        captures:
