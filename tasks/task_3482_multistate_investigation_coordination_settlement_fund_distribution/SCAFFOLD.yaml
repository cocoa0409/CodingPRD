  - { priority: 12, category: business_fiscal, check: "Validated loss must be in (0, claimed_loss_cents]", error_id: ERR_VALIDATION_EXCEEDS_CLAIM, http_status: 422, applies_to: "claimant validate" }
  - { priority: 12, category: business_fiscal, check: "GENERAL_FUND_ONLY offices may only request use_code GENERAL_FUND", error_id: ERR_USE_CODE_NOT_PERMITTED, http_status: 422, applies_to: "disbursement create" }

# =============================================================================
# 1.5 API Endpoint Table (44 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server default before any call is exactly 2026-09-01T00:00:00Z (never wall-clock).", roles: [CommitteeChair], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all deadline/window rules read this clock"] }
  - { method: POST, path: "/multistate/state-offices", description: "Register a state AG office", roles: [CommitteeChair], code: 201, input: [state_code, population, harm_measure_cents, appropriation_rule], output: StateOffice, side_effects: [] }
  - { method: GET, path: "/multistate/state-offices/{id}", description: "Read one office", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: StateOffice, side_effects: [] }
  - { method: PATCH, path: "/multistate/state-offices/{id}", description: "Update allocation inputs / appropriation rule; OCC on office version", roles: [CommitteeChair], code: 200, input: [expected_state_office_version, "population?", "harm_measure_cents?", "appropriation_rule?"], output: StateOffice, side_effects: ["increments StateOffice.version by 1", "allocation snapshots already taken at execution are unaffected"] }
  - { method: POST, path: "/multistate/investigations", description: "Create an investigation in DRAFT", roles: [CommitteeChair], code: 201, input: [title, target_name, summary], output: Investigation, side_effects: [] }
  - { method: GET, path: "/multistate/investigations/{id}", description: "Read one investigation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: Investigation, side_effects: [] }
  - { method: POST, path: "/multistate/investigations/{id}/advance", description: "Advance phase one step forward (OPEN|DISCOVERY|NEGOTIATION|SETTLEMENT_PENDING|SETTLED|MONITORING); DRAFT->OPEN runs committee_activation_quorum and lead-window overlap checks", roles: [CommitteeChair], code: 200, input: [to_phase], output: Investigation, side_effects: ["phase transition side effects per state machine"] }
  - { method: GET, path: "/multistate/investigations/{id}/participations", description: "List participations of an investigation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Participation[]", side_effects: [] }
  - { method: GET, path: "/multistate/investigations/{id}/responses", description: "List consolidated responses of an investigation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "ConsolidatedResponse[]", side_effects: [] }
  - { method: GET, path: "/multistate/investigations/{id}/settlements", description: "List settlements of an investigation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Settlement[]", side_effects: [] }
  - { method: POST, path: "/multistate/investigations/{id}/participations", description: "Invite a state office (creates Participation INVITED)", roles: [CommitteeChair], code: 201, input: [state_office_id], output: Participation, side_effects: ["invited_at = now"] }
  - { method: GET, path: "/multistate/participations/{id}", description: "Read one participation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: Participation, side_effects: [] }
  - { method: GET, path: "/multistate/state-offices/{id}/participations", description: "List participations of a state office across investigations", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Participation[]", side_effects: [] }
  - { method: POST, path: "/multistate/participations/{id}/execute-cia", description: "Execute the common interest agreement at a confidentiality tier; INVITED -> ACTIVE", roles: [ParticipatingStateAG, LeadStateAG], code: 200, input: [confidentiality_tier], output: Participation, side_effects: ["cia_status = EXECUTED", "cia_tier set", "cia_executed_at = now"] }
  - { method: POST, path: "/multistate/participations/{id}/designate-lead", description: "Seat the office on the executive committee (MEMBER -> LEAD)", roles: [CommitteeChair], code: 200, input: [], output: Participation, side_effects: [] }
  - { method: POST, path: "/multistate/participations/{id}/withdraw", description: "Withdraw an ACTIVE participation", roles: [ParticipatingStateAG, LeadStateAG, CommitteeChair], code: 200, input: [], output: Participation, side_effects: ["committee_role reset to MEMBER", "withdrawn_at = now"] }
  - { method: POST, path: "/multistate/participations/{id}/demands", description: "Issue an investigative demand under the office's own authority (created ISSUED)", roles: [ParticipatingStateAG, LeadStateAG], code: 201, input: [scope_text], output: Demand, side_effects: ["issued_at = now"] }
  - { method: GET, path: "/multistate/participations/{id}/demands", description: "List demands issued by a participation", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Demand[]", side_effects: [] }
  - { method: POST, path: "/multistate/investigations/{id}/responses", description: "Submit a negotiated consolidated response covering demands", roles: [DefendantCounsel], code: 201, input: [demand_ids, coverage_summary], output: ConsolidatedResponse, side_effects: ["submitted_at = now"] }
  - { method: POST, path: "/multistate/responses/{id}/accept", description: "Accept a consolidated response; consolidates its demands", roles: [LeadStateAG], code: 200, input: [], output: ConsolidatedResponse, side_effects: ["each listed Demand -> CONSOLIDATED"] }
  - { method: POST, path: "/multistate/responses/{id}/fulfill", description: "Mark an accepted response fulfilled", roles: [DefendantCounsel], code: 200, input: [], output: ConsolidatedResponse, side_effects: ["fulfilled_at = now"] }
  - { method: POST, path: "/multistate/investigations/{id}/settlements", description: "Propose a settlement term sheet (created PROPOSED; provisional allocation computed)", roles: [LeadStateAG], code: 201, input: [monetary_total_cents, restitution_reserve_cents, allocation_basis, injunctive_terms, "negotiated_shares?"], output: Settlement, side_effects: ["run provisional allocation variant", "investigation.active_settlement_id set"] }
  - { method: GET, path: "/multistate/settlements/{id}", description: "Read one settlement (includes embedded sign_ons and computed allocation fields)", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/multistate/settlements/{id}/counter", description: "Defendant counters the proposal; PROPOSED -> COUNTERED, negotiation_round += 1; OCC on settlement version", roles: [DefendantCounsel], code: 200, input: [expected_settlement_version, "counter_total_cents?", "note?"], output: Settlement, side_effects: ["investigation auto-bounces NEGOTIATION -> DISCOVERY", "increments Settlement.version by 1"] }
  - { method: POST, path: "/multistate/settlements/{id}/revise", description: "Lead state revises after a counter; COUNTERED -> PROPOSED; OCC on settlement version", roles: [LeadStateAG], code: 200, input: [expected_settlement_version, "revised_total_cents?", "note?"], output: Settlement, side_effects: ["investigation auto-returns DISCOVERY -> NEGOTIATION", "optional monetary_total_cents update recomputes provisional allocation", "increments Settlement.version by 1"] }
  - { method: POST, path: "/multistate/settlements/{id}/agree-terms", description: "Defendant accepts the current proposal; PROPOSED -> TERMS_AGREED", roles: [DefendantCounsel], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/multistate/settlements/{id}/open-sign-on", description: "Open the sign-on window; sets sign_on_deadline = now + SIGN_ON_WINDOW_DAYS", roles: [CommitteeChair], code: 200, input: [], output: Settlement, side_effects: ["sign_on_opened_at and sign_on_deadline set"] }
  - { method: POST, path: "/multistate/settlements/{id}/sign-ons", description: "Record the caller office's sign-on decision (SIGNED|DECLINED)", roles: [ParticipatingStateAG, LeadStateAG], code: 201, input: [decision], output: Settlement, side_effects: ["appends an embedded sign_ons entry"] }
  - { method: POST, path: "/multistate/settlements/{id}/execute", description: "Evaluate sign_on_quorum; EXECUTED (lock sign-ons, lapse silent states, snapshot basis, create AllocationLines) or COLLAPSED past deadline", roles: [CommitteeChair], code: 200, input: [], output: Settlement, side_effects: ["run final allocation calculations", "create AllocationLines in decided_at ASC order", "on COLLAPSED: investigation auto-returns to NEGOTIATION"] }
  - { method: POST, path: "/multistate/settlements/{id}/deposit", description: "Defendant deposits funds; cumulative deposits drive fund_status UNFUNDED -> PARTIALLY_FUNDED -> FUNDED", roles: [DefendantCounsel], code: 200, input: [amount_cents], output: Settlement, side_effects: ["deposited_cents += amount_cents", "fund_status update"] }
  - { method: GET, path: "/multistate/allocation-lines/{id}", description: "Read one allocation line", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: AllocationLine, side_effects: [] }
  - { method: GET, path: "/multistate/settlements/{id}/allocation-lines", description: "List allocation lines of a settlement", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "AllocationLine[]", side_effects: [] }
  - { method: GET, path: "/multistate/state-offices/{id}/allocation-lines", description: "List allocation lines of a state office", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "AllocationLine[]", side_effects: [] }
  - { method: POST, path: "/multistate/allocation-lines/{id}/disbursements", description: "Request a disbursement from a line; auto-CERTIFIED for PREAPPROPRIATED offices", roles: [ParticipatingStateAG, LeadStateAG], code: 201, input: [amount_cents, use_code], output: Disbursement, side_effects: ["line ELIGIBLE -> DISBURSING"] }
  - { method: GET, path: "/multistate/allocation-lines/{id}/disbursements", description: "List disbursements of a line", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Disbursement[]", side_effects: [] }
  - { method: POST, path: "/multistate/disbursements/{id}/certify", description: "Legislative certification of a requested disbursement (own state only)", roles: [StateLegislature], code: 200, input: [], output: Disbursement, side_effects: ["certified_at = now"] }
  - { method: POST, path: "/multistate/disbursements/{id}/release", description: "Release a certified disbursement; cascades line and settlement fund updates", roles: [FundAdministrator], code: 200, input: [], output: Disbursement, side_effects: ["released_cents += amount", "line disbursed/remaining recompute and possible DISBURSED", "fund_status -> DISBURSING then DISBURSED when all lines terminal"] }
  - { method: POST, path: "/multistate/settlements/{id}/claimants", description: "Register an identified consumer claimant", roles: [FundAdministrator], code: 201, input: [state_code, contact_ref, claimed_loss_cents], output: Claimant, side_effects: [] }
  - { method: GET, path: "/multistate/settlements/{id}/claimants", description: "List claimants of a settlement", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "Claimant[]", side_effects: [] }
  - { method: POST, path: "/multistate/claimants/{id}/validate", description: "Validate (with validated_loss_cents) or deny a registered claim", roles: [FundAdministrator], code: 200, input: [decision, "validated_loss_cents?"], output: Claimant, side_effects: ["on VALIDATED: estimated_payout_cents = validated_loss_cents"] }
  - { method: POST, path: "/multistate/settlements/{id}/restitution-compute", description: "After the claim window: lapse unvalidated claims, sweep stale uncertified disbursements into the reserve, pro-rate payouts, mark VALIDATED -> PAID", roles: [FundAdministrator], code: 200, input: [], output: Settlement, side_effects: ["run appropriation_reversion_sweep", "run restitution_proration", "restitution_computed = true"] }
  - { method: POST, path: "/multistate/settlements/{id}/monitoring-periods", description: "Open the next monitoring period (contiguous half-open windows)", roles: [CommitteeChair], code: 201, input: [], output: MonitoringPeriod, side_effects: ["window computed from executed_at and period_index"] }
  - { method: GET, path: "/multistate/settlements/{id}/monitoring-periods", description: "List monitoring periods of a settlement", roles: [CommitteeChair, LeadStateAG, ParticipatingStateAG, DefendantCounsel, FundAdministrator, StateLegislature, ComplianceMonitor], code: 200, input: [], output: "MonitoringPeriod[]", side_effects: [] }
  - { method: POST, path: "/multistate/monitoring-periods/{id}/findings", description: "File a compliance finding for one injunctive term; auto-closes the period when all terms have findings", roles: [ComplianceMonitor], code: 201, input: [term_index, outcome, "note?"], output: MonitoringPeriod, side_effects: ["auto-close cascade per monitoring_breach_escalation"] }

# =============================================================================
# 1.6 Error Code Catalog
