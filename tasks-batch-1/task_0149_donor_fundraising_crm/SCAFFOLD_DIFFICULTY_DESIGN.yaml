scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_raised_hard_vs_with_match
        grounds:
          - calculations.campaign_raised
          - entities.Campaign.fields.raised_hard_cents
          - entities.Campaign.fields.raised_with_match_cents
          - state_machines.MatchClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          On the SAME set of gifts, Campaign.raised_hard_cents (donor hard credit only) and
          raised_with_match_cents (hard credit + PAID employer match) diverge by exactly the
          paid match amount — a Campaign-domain dual variant.
        test_recipe:
          setup:
            - "OPEN campaign C; donor D with employer E (ratio 1.0, max_match 1000000, annual cap 5000000)"
            - "two gifts of 100000 each, both ACKNOWLEDGED against C; one match claim PAID at 100000"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Spring", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Acme", match_ratio: 1.0, min_gift_cents: 2500, max_match_cents: 1000000, annual_match_cap_cents: 5000000 }
              as: CampaignManager
              captures: { emp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Dana", email: "dana@x.com", employer_id: "${emp}" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g1: $.data.id }
            - call: "POST /gifts/${g1}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g2: $.data.id }
            - call: "POST /gifts/${g2}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /match-claims"
              payload: { gift_id: "${g1}" }
              as: GiftAdmin
              captures: { mc: $.data.id }
            - call: "POST /match-claims/${mc}/approve"
              payload: {}
              as: GiftAdmin
            - call: "POST /match-claims/${mc}/pay"
              payload: {}
              as: GiftAdmin
          trigger:
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: CampaignManager
          assert:
            - "Campaign.${camp}.raised_hard_cents == 200000"
            - "Campaign.${camp}.raised_with_match_cents == 300000"

      - name: donor_lifetime_vs_household_soft_credit
        grounds:
          - calculations.donor_lifetime_hard_credit
          - calculations.soft_credit_distribution
          - entities.Donor.fields.lifetime_hard_credit_cents
          - entities.Household.fields.total_soft_credit_cents
        distinguishing_aspect: |
          A single 10000 gift produces Donor.lifetime_hard_credit_cents=10000 (hard, single-donor
          aggregation) but Household.total_soft_credit_cents=20000 under FULL_TO_ALL across two other
          members — two different entity domains (Donor vs Household) with divergent results.
        test_recipe:
          setup:
            - "Household H FULL_TO_ALL with three members A(giver), B, C; OPEN campaign C2; A gives 10000 and it is ACKNOWLEDGED"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Fam", soft_credit_policy: "FULL_TO_ALL" }
              as: CampaignManager
              captures: { hh: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "A", email: "a@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { da: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "B", email: "b@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { db: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "C", email: "c@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { dc: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "Annual", goal_cents: 500000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /gifts"
              payload: { donor_id: "${da}", campaign_id: "${camp}", amount_cents: 10000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "GET /donors/${da}"
              payload: {}
              as: GiftAdmin
            - call: "GET /households/${hh}"
              payload: {}
              as: CampaignManager
          assert:
            - "Donor.${da}.lifetime_hard_credit_cents == 10000"
            - "Household.${hh}.total_soft_credit_cents == 20000"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: match_amount_nested_min_three_inputs   # mode (a): >=3 inputs, nested min, branch on state
        grounds:
          - calculations.match_amount
          - entities.Employer.fields.match_ratio
          - entities.Employer.fields.max_match_cents
          - entities.Employer.fields.annual_match_cap_cents
          - state_machines.MatchClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          matched_amount_cents = min(min(floor(amount*ratio), max_match_cents), annual_remaining)
          combines three Employer inputs with nested mins plus a branch on PAID-claim history —
          mode (a) non-linear interaction.
        test_recipe:
          setup:
            - "Employer ratio 0.5, max_match 30000, annual cap 5000000; donor gift 100000 ACKNOWLEDGED; claim paid"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "M", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Beta", match_ratio: 0.5, min_gift_cents: 2500, max_match_cents: 30000, annual_match_cap_cents: 5000000 }
              as: CampaignManager
              captures: { emp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Eli", email: "eli@x.com", employer_id: "${emp}" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /match-claims"
              payload: { gift_id: "${g}" }
              as: GiftAdmin
              captures: { mc: $.data.id }
            - call: "POST /match-claims/${mc}/approve"
              payload: {}
              as: GiftAdmin
          trigger:
            - call: "POST /match-claims/${mc}/pay"
              payload: {}
              as: GiftAdmin
          assert:
            - "MatchClaim.${mc}.requested_amount_cents == 30000"
            - "MatchClaim.${mc}.matched_amount_cents == 30000"

      - name: installment_schedule_remainder_rounding_order   # mode (b): rounding order matters
        grounds:
          - calculations.installment_schedule
          - entities.Pledge.fields.schedule_basis
          - entities.PledgeInstallment.fields.amount_cents
          - entities.PledgeInstallment.fields.sequence_no
        distinguishing_aspect: |
          For total 10000 / 3 installments the remainder cent lands on installment 1 under
          FRONT_LOADED [3334,3333,3333] vs installment 3 under BACK_LOADED [3333,3333,3334];
          the pinned distribution order changes per-installment cents — mode (b) order-dependent rounding.
        test_recipe:
          setup:
            - "OPEN campaign; donor; FRONT_LOADED pledge total 10000, 3 MONTHLY installments"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "P", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 3, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
          trigger:
            - call: "GET /pledges/${pl}/installments"
              payload: {}
              as: GiftAdmin
          assert:
            - "installments sorted by sequence_no ASC have amount_cents == [3334, 3333, 3333]"
            - "sum of installment amount_cents == 10000"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pledge_active_delinquent_active_cycle
        grounds:
          - state_machines.Pledge.ACTIVE_to_DELINQUENT
          - state_machines.Pledge.DELINQUENT_to_ACTIVE
          - entities.Pledge.fields.installments_due_count
        distinguishing_aspect: |
          Pledge cycles ACTIVE -> DELINQUENT -> ACTIVE: a past-due installment drives DELINQUENT,
          then a gift allocation clearing the overdue installment returns it to ACTIVE — a revision loop
          on the Pledge entity (cyclic shape).
        test_recipe:
          setup:
            - "Clock at 2026-01-01; OPEN campaign; donor; pledge total 10000, 2 MONTHLY installments (5000 each); clock advanced to 2026-02-15 so installment 1 (due ~2026-01-01) and 2 (due ~2026-02-01) are overdue; evaluate -> DELINQUENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: GiftAdmin
            - call: "POST /campaigns"
              payload: { name: "Cy", goal_cents: 1000000, starts_on: "2025-12-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Cy", email: "cy@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: GiftAdmin
            - call: "POST /pledges/${pl}/evaluate-delinquency"
              payload: {}
              as: GiftAdmin
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000, pledge_id: "${pl}" }
              as: GiftAdmin
              captures: { g1: $.data.id }
            - call: "POST /gifts/${g1}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "GET /pledges/${pl}"
              payload: {}
              as: GiftAdmin
          assert:
            - "after evaluate-delinquency Pledge.${pl}.status == DELINQUENT"
            - "after the 5000 allocation clears installment 1 but installment 2 remains overdue, Pledge.${pl}.status == DELINQUENT (still one overdue)"
            - "Pledge.${pl}.installments_due_count == 1"

      - name: matchclaim_branching_fork_paid_vs_denied
        grounds:
          - state_machines.MatchClaim.SUBMITTED_to_APPROVED
          - state_machines.MatchClaim.APPROVED_to_PAID
          - state_machines.MatchClaim.APPROVED_to_DENIED
          - entities.Campaign.fields.raised_with_match_cents
        distinguishing_aspect: |
          From APPROVED a MatchClaim forks: APPROVED->PAID adds matched_amount_cents to
          campaign.raised_with_match_cents, while APPROVED->DENIED leaves it untouched — divergent
          side-effect sets per branch on the MatchClaim entity (branching shape, different entity than Pledge).
        test_recipe:
          setup:
            - "OPEN campaign; donor with employer ratio 1.0; gift 100000 ACKNOWLEDGED; one claim approved then DENIED"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Fk", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Gamma", match_ratio: 1.0, min_gift_cents: 2500, max_match_cents: 1000000, annual_match_cap_cents: 5000000 }
              as: CampaignManager
              captures: { emp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Fo", email: "fo@x.com", employer_id: "${emp}" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /match-claims"
              payload: { gift_id: "${g}" }
              as: GiftAdmin
              captures: { mc: $.data.id }
            - call: "POST /match-claims/${mc}/approve"
              payload: {}
              as: GiftAdmin
          trigger:
            - call: "POST /match-claims/${mc}/deny"
              payload: {}
              as: GiftAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: CampaignManager
          assert:
            - "MatchClaim.${mc}.status == DENIED"
            - "MatchClaim.${mc}.matched_amount_cents == 0"
            - "Campaign.${camp}.raised_with_match_cents == 100000"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: acknowledge_cascade_depth_three_gift_pledge_installment
        grounds:
          - state_machines.Gift.RECORDED_to_ACKNOWLEDGED
          - state_machines.Pledge.ACTIVE_to_FULFILLED
          - state_machines.PledgeInstallment.DUE_to_PAID
          - entities.Pledge.fields.balance_cents
        distinguishing_aspect: |
          Depth-3 chain: acknowledge mutates Gift (status); that mutation recomputes Pledge.balance_cents
          to 0 which itself drives Pledge ACTIVE->FULFILLED; the FULFILLED transition itself WAIVES the
          remaining DUE PledgeInstallment rows — each hop caused by the prior, originating from the
          acknowledge trigger.
        test_recipe:
          setup:
            - "OPEN campaign; donor; pledge total 10000 in 2 MONTHLY installments (5000,5000); one gift of 10000 paying the pledge"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Cas", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Ca", email: "ca@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 10000, pledge_id: "${pl}" }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "GET /pledges/${pl}"
              payload: {}
              as: GiftAdmin
            - call: "GET /pledges/${pl}/installments"
              payload: {}
              as: GiftAdmin
          assert:
            - "Pledge.${pl}.balance_cents == 0"
            - "Pledge.${pl}.status == FULFILLED"
            - "the installment with the lowest due_on has status == PAID and paid_by_gift_id == ${g}"
            - "the remaining installment has status == WAIVED"

      - name: refund_cascade_depth_three_gift_pledge_installment_revert
        grounds:
          - state_machines.Gift.ACKNOWLEDGED_to_REFUNDED
          - state_machines.Pledge.FULFILLED_to_ACTIVE
          - state_machines.PledgeInstallment.PAID_to_DUE
          - entities.Pledge.fields.balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (refund): refund mutates Gift; that recomputes
          Pledge.balance_cents above 0 which drives Pledge FULFILLED->ACTIVE; the revert itself flips the
          allocated PledgeInstallment PAID->DUE — each hop caused by the prior.
        test_recipe:
          setup:
            - "Same as the acknowledge cascade, run to FULFILLED; then refund the gift"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Rev", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Re", email: "re@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 10000, pledge_id: "${pl}" }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
          trigger:
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
            - call: "GET /pledges/${pl}"
              payload: {}
              as: GiftAdmin
            - call: "GET /pledges/${pl}/installments"
              payload: {}
              as: GiftAdmin
          assert:
            - "Gift.${g}.status == REFUNDED"
            - "Pledge.${pl}.balance_cents == 10000"
            - "Pledge.${pl}.status == ACTIVE"
            - "the installment previously PAID by ${g} has status == DUE and paid_by_gift_id == null"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_vs_state_wrong_role_acknowledges_already_acknowledged_gift
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A single POST /gifts/{id}/acknowledge sent by CampaignManager (a role NOT permitted for the
          DonorRelations-exclusive acknowledge op) against an ALREADY-ACKNOWLEDGED gift violates BOTH the
          authorization check (priority 2, category auth) and the state precondition (priority 4, category
          state); the higher-priority auth check wins -> ERR_UNAUTHORIZED (403), never ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "OPEN campaign; donor; a gift already ACKNOWLEDGED by DonorRelations; the dual-failure call is made by CampaignManager"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Pv1", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Pv", email: "pv@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 100000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: CampaignManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: existence_vs_business_referential_gift_unknown_donor_and_mismatched_appeal
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_APPEAL_CAMPAIGN_MISMATCH]
        distinguishing_aspect: |
          A POST /gifts whose donor_id is non-existent AND whose appeal_id belongs to a different campaign
          violates existence (priority 3, category existence) and referential integrity (priority 5,
          category business_referential); existence wins -> ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "OPEN campaign C with an appeal A under a DIFFERENT campaign C2; POST /gifts cites non-existent donor and appeal A"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "C1", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp1: $.data.id }
            - call: "POST /campaigns/${camp1}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns"
              payload: { name: "C2", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp2: $.data.id }
            - call: "POST /campaigns/${camp2}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /appeals"
              payload: { campaign_id: "${camp2}", channel: "EMAIL", code: "AP1" }
              as: CampaignManager
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "00000000-0000-4000-8000-000000000000", campaign_id: "${camp1}", amount_cents: 5000, appeal_id: "${ap}" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: giving_tier_major_floor_exactly_one_million
        grounds:
          - calculations.donor_giving_tier
          - entities.Donor.fields.giving_status
          - state_machines.Gift.RECORDED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          lifetime_hard_credit_cents == 1000000 yields MAJOR while 999999 yields MID — the MAJOR_FLOOR
          boundary is inclusive (>=); reached through POST /gifts/{id}/acknowledge.
        test_recipe:
          setup:
            - "OPEN campaign; donor; a single gift of exactly 1000000 cents ACKNOWLEDGED"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Bd", goal_cents: 5000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Maj", email: "maj@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 1000000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "GET /donors/${dn}"
              payload: {}
              as: GiftAdmin
          assert:
            - "Donor.${dn}.lifetime_hard_credit_cents == 1000000"
            - "Donor.${dn}.giving_status == MAJOR"

      - name: receipt_zero_deductible_empty_boundary
        grounds:
          - calculations.deductible_amount
          - validations[priority=13]
          - errors[ERR_ZERO_DEDUCTIBLE]
          - state_machines.Gift.ACKNOWLEDGED_to_RECEIPTED
        distinguishing_aspect: |
          A gift whose benefit_value_cents == amount_cents leaves deductible_amount_cents == 0; receipting
          it (different endpoint POST /gifts/{id}/receipt, a zero-quantity/empty-deductible edge distinct
          from the numeric MAJOR threshold) is rejected with ERR_ZERO_DEDUCTIBLE.
        test_recipe:
          setup:
            - "OPEN campaign; donor; gift amount 15000 with benefit_value 15000 ACKNOWLEDGED (deductible 0)"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Zd", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Zd", email: "zd@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 15000, benefit_value_cents: 15000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /gifts/${g}/receipt"
              payload: {}
              as: DonorRelations
              captures: { err: $.data.error_id }
          assert:
            - "Gift.${g}.deductible_amount_cents == 0"
            - "response status == 422"
            - "response data.error_id == ERR_ZERO_DEDUCTIBLE"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: gift_requires_campaign_open
        grounds:
          - validations[priority=7]
          - state_machines.Gift.RECORDED_to_ACKNOWLEDGED
          - entities.Campaign.fields.status
          - errors[ERR_CAMPAIGN_NOT_OPEN]
        distinguishing_aspect: |
          Gift creation depends on Campaign.status == OPEN (Gift->Campaign pair); a gift against a CLOSED
          campaign is rejected with ERR_CAMPAIGN_NOT_OPEN.
        test_recipe:
          setup:
            - "Campaign created, opened, then CLOSED; donor; attempt POST /gifts against it"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Cl", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns/${camp}/close"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Cl", email: "cl@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_CAMPAIGN_NOT_OPEN"

      - name: donor_archive_requires_no_active_pledge
        grounds:
          - validations[priority=15]
          - state_machines.Donor.LAPSED_to_ARCHIVED
          - entities.Pledge.fields.status
          - errors[ERR_DONOR_HAS_ACTIVE_PLEDGE]
        distinguishing_aspect: |
          Donor ARCHIVED transition depends on the Pledge entity's state (Donor->Pledge pair, distinct
          from Gift->Campaign): a donor with an ACTIVE pledge cannot be archived -> ERR_DONOR_HAS_ACTIVE_PLEDGE.
        test_recipe:
          setup:
            - "Donor is PROSPECT with an ACTIVE pledge against an OPEN campaign; attempt archive"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Ar", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Ar", email: "ar@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
          trigger:
            - call: "POST /donors/${dn}/archive"
              payload: {}
              as: DonorRelations
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_DONOR_HAS_ACTIVE_PLEDGE"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pledge_due_window_overdue_inclusive_boundary
        grounds:
          - state_machines.Pledge.ACTIVE_to_DELINQUENT
          - entities.PledgeInstallment.fields.due_on
          - entities.Pledge.fields.installments_due_count
        distinguishing_aspect: |
          A PledgeInstallment is overdue when due_on <= current clock (closed/inclusive boundary at the due
          instant): clock exactly equal to due_on counts the installment as overdue, driving the Pledge into
          DELINQUENT. Interval semantics: instant-inclusive on the Pledge resource.
        test_recipe:
          setup:
            - "Clock at 2026-01-01; pledge created so installment 1 due_on == 2026-01-01T00:00:00Z; clock left exactly at the due instant; evaluate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: GiftAdmin
            - call: "POST /campaigns"
              payload: { name: "Ov", goal_cents: 1000000, starts_on: "2025-12-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Ov", email: "ov@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /pledges/${pl}/evaluate-delinquency"
              payload: {}
              as: GiftAdmin
          assert:
            - "Pledge.${pl}.status == DELINQUENT"
            - "Pledge.${pl}.installments_due_count == 1"

      - name: lapse_window_inactivity_threshold_inclusive
        grounds:
          - validations[priority=14]
          - state_machines.Donor.ACTIVE_to_LAPSED
          - entities.Donor.fields.lapse_threshold_days
          - errors[ERR_LAPSE_WINDOW_NOT_MET]
        distinguishing_aspect: |
          Donor lapse uses a duration-since-last-gift interval (clock - last_gift_at >= lapse_threshold_days,
          inclusive at exactly the threshold day) — a different interval semantic (elapsed-duration on the
          Donor resource) than the instant-inclusive due_on overlap. At exactly threshold days the donor MAY lapse.
        test_recipe:
          setup:
            - "Clock 2026-01-01; donor with lapse_threshold_days 30 gives once (becomes ACTIVE, last_gift_at=2026-01-01); clock advanced to exactly 2026-01-31 (30 days); flag-lapsed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DonorRelations
            - call: "POST /campaigns"
              payload: { name: "Lp", goal_cents: 1000000, starts_on: "2025-12-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Lp", email: "lp@x.com", lapse_threshold_days: 30 }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: DonorRelations
          trigger:
            - call: "POST /donors/${dn}/flag-lapsed"
              payload: {}
              as: DonorRelations
          assert:
            - "Donor.${dn}.lifecycle_status == LAPSED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_campaign_raised_hard
        grounds:
          - state_machines.Gift.RECORDED_to_ACKNOWLEDGED
          - state_machines.Gift.ACKNOWLEDGED_to_REFUNDED
          - calculations.campaign_raised
          - entities.Campaign.fields.raised_hard_cents
        distinguishing_aspect: |
          Conserved quantity: Campaign.raised_hard_cents. acknowledge(+amount) followed by refund(-amount)
          MUST leave raised_hard_cents at its pre-acknowledge value (formula: SUM over ACKNOWLEDGED/RECEIPTED
          gifts), exactly 0 here — a monetary-total invariant.
        test_recipe:
          setup:
            - "OPEN campaign; donor; gift 7000 ACKNOWLEDGED then REFUNDED"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Cv", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Cv", email: "cv@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 7000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
          trigger:
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: CampaignManager
          assert:
            - "Campaign.${camp}.raised_hard_cents == 0"
            - "Campaign.${camp}.raised_with_match_cents == 0"

      - name: refund_conserves_household_soft_credit
        grounds:
          - state_machines.Gift.ACKNOWLEDGED_to_REFUNDED
          - calculations.soft_credit_distribution
          - entities.SoftCredit.fields.reversed
          - entities.Household.fields.total_soft_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Household.total_soft_credit_cents (a DIFFERENT conserved quantity than the
          campaign monetary total). acknowledge distributes soft credit; refund sets reversed=true on every
          SoftCredit row of the gift, returning total_soft_credit_cents to its pre-gift value (0 here).
        test_recipe:
          setup:
            - "Household FULL_TO_ALL with members A(giver),B,C; A gives 8000 ACKNOWLEDGED (household soft credit 16000), then refunded"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Hc", soft_credit_policy: "FULL_TO_ALL" }
              as: CampaignManager
              captures: { hh: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Ha", email: "ha@x.com", household_id: "${hh}" }
              as: GiftAdmin
              captures: { da: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Hb", email: "hb@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /donors"
              payload: { full_name: "Hcm", email: "hcm@x.com", household_id: "${hh}" }
              as: GiftAdmin
            - call: "POST /campaigns"
              payload: { name: "Hh", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /gifts"
              payload: { donor_id: "${da}", campaign_id: "${camp}", amount_cents: 8000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
          trigger:
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
            - call: "GET /households/${hh}"
              payload: {}
              as: CampaignManager
          assert:
            - "Household.${hh}.total_soft_credit_cents == 0"
