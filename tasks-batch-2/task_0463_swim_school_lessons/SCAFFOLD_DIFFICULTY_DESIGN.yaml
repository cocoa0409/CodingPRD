  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Instance 1: Instructor weekly calendar, closed interval + 15min buffer ---
      - name: instructor_schedule_conflict_within_buffer
        grounds:
          - calculations.instructor_schedule_overlap
          - state_machines.ClassSession.DRAFT_to_OPEN
          - errors[ERR_INSTRUCTOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Interval semantics A (closed interval + symmetric 15-min buffer) on the Instructor weekly calendar: opening a second same-instructor same-weekday session that starts 10 minutes after the first ends (gap 10 < 15 buffer) is rejected ERR_INSTRUCTOR_SCHEDULE_CONFLICT even though the raw intervals do not overlap."
        test_recipe:
          setup:
            - "Coach A has an OPEN Tuesday session 10:00-10:45 (600-645). A second Tuesday session 10:55-11:40 (655-700) for the same coach: gap=10min < 15 buffer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sessA_id: $.data.id }
            - call: "POST /class-sessions/${sessA_id}/open"
              payload: {}
              as: SchoolAdmin
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 2, day_of_week: 1, start_minute: 655, end_minute: 700 }
              as: SchoolAdmin
              captures: { sessB_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${sessB_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSTRUCTOR_SCHEDULE_CONFLICT"

      # --- Instance 2: Student day calendar, half-open interval, no buffer ---
      - name: makeup_same_day_half_open_no_buffer_conflict
        grounds:
          - calculations.makeup_same_day_overlap
          - state_machines.MakeupCredit.ISSUED_to_REDEEMED
          - errors[ERR_MAKEUP_TIME_CONFLICT]
        distinguishing_aspect: "Interval semantics B (half-open [start,end), NO buffer) on the Student day calendar: a second makeup booking for the same student on the same date whose interval overlaps the first by 5 minutes is rejected ERR_MAKEUP_TIME_CONFLICT, while a back-to-back booking (gap 0) would be allowed -- distinct geometry from instance 1's buffered closed interval."
        test_recipe:
          setup:
            - "One student with two SKIP credits. Target session S1 10:00-10:45 and S2 10:40-11:25 (overlap 5min) both have spare occurrence seats on 2026-06-09. Book S1 first, then attempt S2 same date."
