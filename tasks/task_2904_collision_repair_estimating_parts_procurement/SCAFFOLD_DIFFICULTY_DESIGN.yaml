              captures: { sa_repair_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "REPAIR" }
              as: Technician
              as_user_id: "tech-001"
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_paint_id}", stage: "REFINISH_CALIBRATION", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T15:00:00Z" }
              as: Technician
