  - rule_id: compensating_invariant
    instances:
      - name: owner_balance_conserved_on_invoice_void
        grounds:
          - state_machines.CostRecoveryInvoice.DRAFT_to_APPROVED
          - state_machines.CostRecoveryInvoice.APPROVED_to_VOID
          - calculations.owner_outstanding_balance
          - entities.PropertyOwner.fields.outstanding_balance_cents
          - endpoints[POST /vector-control/cost-recovery-invoices/{id}/void]
        distinguishing_aspect: |
          Conserved quantity number one is money in cents: the named invariant
          PropertyOwner.outstanding_balance_cents == sum of balance_due_cents over that
          owner's APPROVED and PARTIALLY_PAID invoices must read exactly 0 again after the
          approve/void pair, with no residue left on the invoice row.
        test_recipe:
          setup:
            - "A SEVERE-tier order on APN-1001 was served on 2026-05-05T10:00:00Z with deadline 2026-05-12T10:00:00Z and the owner never complied"
            - "On the deadline the city abated with 4 crew hours and 12000 cents of materials at escalation_level 0"
            - "PropertyOwner.outstanding_balance_cents is 0 before the approval"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St", hardship_certified: false }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/inspections/${visit_id}/assessments"
              payload: { harborage_score: 8, attractant_score: 7, sanitation_score: 6, burrow_count: 4 }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:45:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/complete"
              payload: { result: "VIOLATION_FOUND" }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "GET /vector-control/properties/${prop_id}"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { prop_v: $.data.version }
            - call: "POST /vector-control/abatement-orders"
              payload: { inspection_id: "${visit_id}", required_actions: ["REMOVE_HARBORAGE"], expected_property_version: "${prop_v}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /vector-control/abatement-orders/${order_id}/notices"
              payload: { notice_type: "ABATEMENT_ORDER", delivery_method: "CERTIFIED_MAIL" }
              as: IntakeClerk
              captures: { notice_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/notices/${notice_id}/service-result"
              payload: { service_outcome: "DELIVERED" }
              as: IntakeClerk
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/abatement-orders/${order_id}/city-abate"
              payload: { actual_labor_hours: 4, actual_materials_cents: 12000 }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /vector-control/abatement-orders/${order_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { order_v: $.data.version }
            - call: "POST /vector-control/cost-recovery-invoices"
              payload: { abatement_order_id: "${order_id}", expected_abatement_order_version: "${order_v}" }
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /vector-control/cost-recovery-invoices/${inv_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { total_after_approve: $.data.final_total_cents }
            - call: "GET /vector-control/property-owners/${owner_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { bal_mid: $.data.outstanding_balance_cents }
            - call: "POST /vector-control/cost-recovery-invoices/${inv_id}/void"
              payload: { void_reason: "Owner produced proof of prior abatement" }
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { bs_final: $.data.billing_status }
            - call: "GET /vector-control/property-owners/${owner_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { bal_after: $.data.outstanding_balance_cents }
          assert:
            - "AbatementOrder.${order_id}.status == CITY_ABATED with escalation_level == 0 (the SERVED fork was taken on the deadline)"
            - "CostRecoveryInvoice.${inv_id}.estimated_total_cents == 107180"
            - "After approval: CostRecoveryInvoice.${inv_id}.final_total_cents == 53015, penalty_line_cents == 0, balance_due_cents == 53015"
            - "After approval: PropertyOwner.${owner_id}.outstanding_balance_cents == 53015"
            - "After the void: CostRecoveryInvoice.${inv_id}.billing_status == VOID with balance_due_cents == 0"
            - "After the void: PropertyOwner.${owner_id}.outstanding_balance_cents == 0, exactly its pre-approval value"
            - "After the void: PropertyOwner.${owner_id}.lifetime_paid_cents == 0 and AbatementOrder.${order_id}.status is still CITY_ABATED"

      - name: zone_open_case_count_conserved_on_withdrawal
        grounds:
          - calculations.zone_open_case_count
          - calculations.zone_rodent_index
          - state_machines.Complaint.RECEIVED_to_CLOSED_WITHDRAWN
          - entities.Zone.fields.open_complaint_count
        distinguishing_aspect: |
          Conserved quantity number two is a case count rather than money: the invariant
          Zone.open_complaint_count == number of complaints in that zone outside the four
          CLOSED_* states must return to 0 after each intake is compensated by a withdrawal,
          and the rodent index computed from that same count must fall back to 0.00.
        test_recipe:
          setup:
            - "Zone Riverside holds two parcels, APN-1001 and APN-1002, and no bait stations at all"
            - "Two complaints, one per parcel, were taken on 2026-05-04T09:00:00Z and are both in RECEIVED"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop1_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "14 Elm St", parcel_number: "APN-1002", property_type: "RESIDENTIAL_SINGLE" }
              as: ProgramAdmin
              captures: { prop2_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop1_id}", complaint_type: "RODENT_SIGHTING", reporter_type: "RESIDENT", description: "Rats near the bins", reported_severity: "ROUTINE" }
              as: IntakeClerk
              captures: { comp1_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop2_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Woodpile against the fence", reported_severity: "ROUTINE" }
              as: IntakeClerk
              captures: { comp2_id: $.data.id }
            - call: "GET /vector-control/zones/${zone_id}"
              as: ProgramAdmin
              captures: { open_before: $.data.open_complaint_count, idx_before: $.data.rodent_index }
          trigger:
            - call: "POST /vector-control/complaints/${comp1_id}/close"
              payload: { closure_reason: "WITHDRAWN", note: "Reporter withdrew after private extermination" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/complaints/${comp2_id}/close"
              payload: { closure_reason: "WITHDRAWN", note: "Duplicate of a neighbour report, withdrawn" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /vector-control/zones/${zone_id}"
              as: ProgramAdmin
              captures: { open_after: $.data.open_complaint_count, idx_after: $.data.rodent_index }
          assert:
            - "Before the triggers: Zone.${zone_id}.open_complaint_count == 2 and Zone.${zone_id}.rodent_index == 8.00"
            - "After the first close: Zone.${zone_id}.open_complaint_count == 1 and Zone.${zone_id}.rodent_index == 4.00"
            - "After the second close: Zone.${zone_id}.open_complaint_count == 0 and Zone.${zone_id}.rodent_index == 0.00"
            - "Zone.${zone_id}.posture == NORMAL throughout"
            - "Complaint.${comp1_id}.status == CLOSED_WITHDRAWN with closure_reason == WITHDRAWN and closed_at == 2026-05-04T09:00:00.000Z"
            - "Complaint.${comp2_id}.status == CLOSED_WITHDRAWN"
