            - call: "POST /inventory-runouts"
              payload:
                artwork_asset_id: "${asset_id}"
                obsolete_version_id: "${v1_id}"
                on_hand_qty: 20000
                weekly_usage_qty: 4000
                runout_start_utc: "2026-08-03T00:00:00Z"
              as: PackagingCoordinator
