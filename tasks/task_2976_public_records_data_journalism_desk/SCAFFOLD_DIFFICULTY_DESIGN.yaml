  - rule_id: non_linear_state_machine
    instances:
      - name: records_request_clarification_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_CLARIFICATION_REQUESTED
          - state_machines.RecordsRequest.CLARIFICATION_REQUESTED_to_AWAITING_AGENCY_RESPONSE
          - calculations.statutory_deadline
          - validations[priority=118]
          - entities.RecordsRequest.fields.clarification_round_count
        distinguishing_aspect: |
          The RecordsRequest machine is CYCLIC: AWAITING_AGENCY_RESPONSE -> CLARIFICATION_REQUESTED ->
          AWAITING_AGENCY_RESPONSE returns to the SAME state it left, so state alone cannot tell round 1
          from round 3 - only clarification_round_count and the monotonically growing tolled_days_total
          can. The loop is bounded by MAX_CLARIFICATION_ROUNDS 3, so the fourth entry into the loop is
          refused with ERR_CLARIFICATION_LIMIT_REACHED while the request remains in the loop's rest state.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-03T09:00:00Z."
            - "One Desk, one Agency with tolling_allowed true and initial_response_days 10 on BUSINESS_DAYS."
            - "One RecordsRequest submitted 2026-08-03, then taken through THREE complete clarification rounds: 08-05T10:00Z..08-11T10:00Z (4 business days), 08-12T09:00Z..08-14T09:00Z (2), 08-17T09:00Z..08-19T09:00Z (2), leaving clarification_round_count 3 and tolled_days_total 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
