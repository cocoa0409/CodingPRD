  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: nesting_yield_exact_values
        claim_type: correct_result
        grounds: ["calculations.nesting_yield_calc"]
        distinguishing_aspect: "Nesting a 10x8 part on a 108x48 sheet with 0.25 in kerf yields exactly parts_per_sheet 52 (rotated orientation wins), utilization 80.25 pct, offcut 5.49 sqft."
        test_recipe:
          setup: ["Spec SUBMITTED (part 10x8); DIE cut program created"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
          trigger:
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer, captures: { pps: $.data.parts_per_sheet, util: $.data.sheet_utilization_pct, offcut: $.data.offcut_sqft_per_sheet, st: $.data.status } }
          assert:
            - "parts_per_sheet == 52 (rotated: 13 cols x 4 rows beats normal 10x5=50)"
            - "sheet_utilization_pct == 80.25 (round_half_up(100*52*80/5184, 2))"
            - "offcut_sqft_per_sheet == 5.49 (round_half_up((5184 - 4160 - 234)/144, 2))"
            - "status == NESTED"

      - name: scrap_credit_monthly_tier_boundary
        claim_type: constants_applied
        grounds: ["calculations.scrap_credit_calc", "entities.Customer.fields.credit_balance_cents"]
        distinguishing_aspect: "Cumulative monthly net weight tier: batches credited while cumulative_before < 500 lb earn 12 cents/lb; the batch starting exactly at cumulative_before == 500 earns the 1.25x bonus (15 cents/lb). Credits 3600, 2400, 1500; customer balance 7500."
        test_recipe:
          setup:
            - "Approved spec + LOCKED CNC program; one COMPLETED customer order qty 500"
            - "Three scrap batches on that order: gross 300/0 pct, gross 200/0 pct, gross 100/0 pct (net 300, 200, 100)"
            - "Logical clock at default 2026-08-01 (all credits land in the same UTC month)"
