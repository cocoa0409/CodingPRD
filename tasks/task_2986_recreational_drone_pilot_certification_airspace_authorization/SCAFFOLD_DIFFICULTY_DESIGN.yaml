  - rule_id: non_linear_state_machine
    instances:
      - name: pilot_certified_lapsed_recertified_cycle_revisits_certified
        grounds:
          - state_machines.Pilot
          - state_machines.Certification
          - calculations.pilot_currency_expiry
          - entities.Pilot.fields.knowledge_attempt_count
          - endpoints.POST_/drone-ops/pilots/{id}/currency-review
        distinguishing_aspect: |
          Pilot walks CERTIFIED -> LAPSED -> KNOWLEDGE_PENDING -> CERTIFIED, so CERTIFIED is
          occupied twice and the second occupancy carries a different currency_expires_at,
          a second Certification and knowledge_attempt_count 2, while the first certificate
          is demoted to SUPERSEDED without ever having EXPIRED.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-02-01T00:00:00Z."
            - "No flights at all, so the currency recency anchor is the certificate issuance instant."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Priya Anand", email: "priya.anand@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kt1: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${kt1}/grade"
              payload: { raw_score: 88 }
              as: ComplianceOfficer
            - call: "GET /drone-ops/certifications"
              payload: { pilot_id: "${pid}" }
              as: ComplianceOfficer
              captures: { cert1: "$.data[0].id" }
          trigger:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/currency-review"
              payload: {}
              as: ComplianceOfficer
              captures: { lapsed_status: $.data.status }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-05-03T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kt2: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${kt2}/grade"
              payload: { raw_score: 75 }
              as: ComplianceOfficer
              captures: { second_pass: $.data.passed }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_status: $.data.status, final_currency: $.data.currency_expires_at }
            - call: "GET /drone-ops/certifications/${cert1}"
              payload: {}
              as: ComplianceOfficer
              captures: { cert1_status: $.data.status }
          assert:
            - "at first certification, Pilot.${pid}.status == \"CERTIFIED\" and currency_expires_at == \"2026-05-02T00:00:00Z\" (min of 2028-02-01T00:00:00Z and issuance + 90 days)"
            - "${lapsed_status} == \"LAPSED\" - the currency review at 2026-05-03T00:00:00Z finds currency_expires_at already past"
            - "${cert1_status} == \"SUPERSEDED\", never \"EXPIRED\": Certification.${cert1}.expires_at == \"2028-02-01T00:00:00Z\" is still in the future, so only the issuance of a newer certificate demotes it"
            - "booking the second sitting moves Pilot.${pid}.status LAPSED -> KNOWLEDGE_PENDING (not UNCERTIFIED)"
            - "${second_pass} == true and ${final_status} == \"CERTIFIED\" - CERTIFIED is entered for the second time"
            - "${final_currency} == \"2026-08-01T00:00:00Z\" (min of 2028-05-03T00:00:00Z and 2026-05-03T00:00:00Z + 90 days), which differs from the first CERTIFIED occupancy"
            - "Pilot.${pid}.knowledge_attempt_count == 2 and exactly two Certification rows exist for the pilot, the newer one ACTIVE with supersedes_certification_id == \"${cert1}\""
            - "the pilot never passes through SUSPENDED or REVOKED on this path"

      - name: waiver_review_revision_cycle_revisits_under_review
        grounds:
          - state_machines.Waiver
          - state_machines.SafetyCase
          - calculations.waiver_validity_window
          - entities.Waiver.fields.revision_round
          - validations.priority_32
        distinguishing_aspect: |
          A different entity from the Pilot cycle: Waiver walks
          SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> CLEARED
          -> APPROVED, so UNDER_REVIEW and SUBMITTED are each occupied twice, revision_round
          advances to 1, and the child SafetyCase mirrors the loop PENDING -> REVISION_REQUESTED
          -> PENDING -> CLEARED without a new SafetyCase row ever being created.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot, CERTIFIED, with one REGISTERED 249 g aircraft."
