            - call: "GET /fleet/vehicles/${veh_rsk}/channel-recommendation"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rmk-a"
          assert:
            - "at odometer_km exactly 60000: eligible_channel_count == 1, recommended_channel_code == \"RETAIL_LOT\", projected_net_proceeds_cents == 1704401"
            - "that projection decomposes as gross 1883520 - fee 116506 - transport 6613 - recondition 56000, with the recondition line capped by min(90000, round_half_up(2800000 * 0.02))"
            - "excluded_channel_codes contains PROGRAM_REPURCHASE at both odometer readings, because program_type is RISK"
            - "at odometer_km 60001 the read returns HTTP 422 with error_id ERR_NO_ELIGIBLE_CHANNEL and no recommended_channel_id at all"
            - "the single kilometre changed the response shape from a 200 with a projection to a 422, so `>` and `>=` on the hard band are distinguishable"
