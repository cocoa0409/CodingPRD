# =============================================================================
# PRD Benchmark Scaffold — Chimney Sweep & Fireplace Service (Expert)
# =============================================================================

scenario: |
  Chimney Sweep & Fireplace Service: inspection level (1/2/3) & flue assessment,
  sweep & creosote-class log, cap/liner/damper repair, gas-log conversion, CO/safety
  check, recurring annual reminder, scheduling/route, warranty

domain_name: chimney-sweep
api_prefix: "/"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  # Peer top-level collections linked by foreign keys; assessment records
  # (SweepLog, SafetyCheck) hang off ServiceJob as append-only sub-resources.
  state_machine_shape: parallel
  # ServiceJob carries two independent dimensions (job_status x safety_posture);
  # RepairOrder is cyclic (IN_PROGRESS <-> BLOCKED).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # Dispatcher owns scheduling/customers, Technician owns field work,
  # BillingClerk owns money/warranty.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer full name" }
      - { name: service_address, type: string, source: input, description: "Street address where the chimney is serviced" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: email, type: string, source: input, description: "Contact email", default: null }

  - name: Chimney
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning homeowner" }
      - { name: chimney_type, type: enum, source: input, description: "Flue construction", constraints: "one of MASONRY | PREFAB_METAL | FACTORY_BUILT" }
      - { name: appliance_type, type: enum, source: input, description: "Connected appliance", constraints: "one of WOOD_STOVE | OPEN_FIREPLACE | GAS_INSERT | PELLET" }
      - { name: flue_count, type: integer, source: input, description: "Number of flues in this chimney", constraints: ">= 1" }
      - { name: cap_installed, type: boolean, source: input, description: "Whether a rain cap is currently installed", default: false }
      - { name: liner_type, type: enum, source: input, description: "Installed liner", default: "NONE", constraints: "one of NONE | CLAY | STAINLESS | ALUMINUM" }
      - { name: damper_type, type: enum, source: input, description: "Damper style", default: "THROAT", constraints: "one of THROAT | TOP_MOUNT | NONE" }
      - { name: last_service_date, type: datetime, source: computed, description: "Set to clock-now when a ServiceJob for this chimney completes; null until then", default: null }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician name" }
      - { name: cert_level, type: enum, source: input, description: "Certification tier", constraints: "one of CSIA_BASIC | CSIA_ADVANCED | MASTER" }

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the technician working this route day" }
      - { name: service_date, type: string, source: input, description: "Calendar date label (YYYY-MM-DD)" }
      - { name: window_start_ts, type: integer, source: input, description: "Unix seconds; earliest on-site instant of the day" }
      - { name: window_end_ts, type: integer, source: input, description: "Unix seconds; latest on-site instant of the day; must be > window_start_ts" }
      - { name: capacity_minutes, type: integer, source: input, description: "Maximum aggregate on-site minutes bookable for the day", constraints: ">= 0" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of on_site_minutes over Appointments whose status is not CANCELLED and not NO_SHOW; starts at 0", default: 0 }

  - name: ServiceJob
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: chimney_id, type: string, source: input, description: "FK -> Chimney.id" }
      - { name: inspection_level, type: integer, source: input, description: "CSIA inspection level", constraints: "one of 1 | 2 | 3" }
      - { name: expected_creosote_class, type: integer, source: input, description: "Creosote class assumed at booking for the provisional sweep quote", default: 1, constraints: "one of 1 | 2 | 3" }
      - { name: trip_zone, type: enum, source: input, description: "Travel zone driving the trip fee", default: "A", constraints: "one of A | B | C" }
      - { name: repair_authorization_cents, type: integer, source: input, description: "Homeowner-approved ceiling for a single repair order's quoted cost", default: 0, constraints: ">= 0" }
      - { name: job_status, type: enum, source: system, description: "Lifecycle dimension", default: "DRAFT", constraints: "one of DRAFT | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: safety_posture, type: enum, source: system, description: "Derived safety dimension, independent of job_status", default: "PENDING", constraints: "one of PENDING | SAFE | CONDITIONS | UNSAFE | CONDEMNED" }
      - { name: flue_assessment, type: enum, source: system, description: "Result of the flue inspection", default: "UNASSESSED", constraints: "one of UNASSESSED | PASS | DEFECTS | BLOCKED" }
      - { name: sweep_provisional_cost_cents, type: integer, source: computed, description: "Provisional sweep quote from inspection_level + expected_creosote_class + trip_zone, set at job creation" }
      - { name: sweep_final_cost_cents, type: integer, source: computed, description: "Final sweep cost from inspection_level + measured_creosote_class + glaze + trip_zone, set when the sweep is logged; null until then", default: null }
      - { name: committed_cost_cents, type: integer, source: computed, description: "sweep_provisional_cost_cents + sum of provisional_cost_cents over RepairOrders whose status is not REJECTED and not CANCELLED" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Finalized invoice, set at job completion; null until then", default: null }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id" }
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; must equal the route day's technician_id" }
      - { name: start_ts, type: integer, source: input, description: "Unix seconds; on-site start" }
      - { name: end_ts, type: integer, source: input, description: "Unix seconds; on-site end; must be > start_ts" }
      - { name: on_site_minutes, type: integer, source: computed, description: "(end_ts - start_ts) / 60" }
      - { name: status, type: enum, source: system, description: "Appointment lifecycle", default: "SCHEDULED", constraints: "one of SCHEDULED | EN_ROUTE | ON_SITE | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: no_show_reason, type: string, source: system, description: "Free text captured on NO_SHOW", default: null }

  - name: SweepLog
    parent: null
    common_fields: false
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id" }
      - { name: measured_creosote_class, type: integer, source: input, description: "Class observed during the sweep", constraints: "one of 1 | 2 | 3" }
      - { name: glaze_present, type: boolean, source: input, description: "Whether glazed (Class 3 style) deposits were present", default: false }
      - { name: billed_cost_cents, type: integer, source: computed, description: "Copy of the ServiceJob.sweep_final_cost_cents produced by this sweep" }

  - name: SafetyCheck
    parent: null
    common_fields: false
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id" }
      - { name: co_ppm, type: integer, source: input, description: "Ambient carbon-monoxide reading in ppm", constraints: ">= 0" }
      - { name: draft_ok, type: boolean, source: input, description: "Whether the draft/spillage test passed" }
      - { name: spillage_detected, type: boolean, source: input, description: "Whether combustion spillage was observed", default: false }
      - { name: outcome, type: enum, source: computed, description: "Derived from co_ppm + draft_ok + spillage_detected", constraints: "one of PASS | CONDITIONS | FAIL | CONDEMN" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id" }
      - { name: repair_type, type: enum, source: input, description: "Scope of the repair", constraints: "one of CAP | LINER | DAMPER | GAS_LOG_CONVERSION" }
      - { name: part_sku, type: string, source: input, description: "Catalog SKU for the part; required for CAP/LINER/DAMPER, omitted for GAS_LOG_CONVERSION. Catalog: CAP -> {CAP-STD, CAP-SS}; LINER -> {LNR-SS6, LNR-AL}; DAMPER -> {DMP-TOP, DMP-THR}. Any other value is ERR_UNKNOWN_PART.", default: null }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Estimated total cost at proposal time", constraints: ">= 0" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Snapshot of quoted_cost_cents taken at creation; drives committed_cost_cents" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Actual total cost, set at COMPLETE; null until then", default: null }
      - { name: labor_cents, type: integer, source: computed, description: "Labor portion of final_cost_cents, supplied at COMPLETE; null until then", default: null }
      - { name: parts_cents, type: integer, source: computed, description: "final_cost_cents - labor_cents, set at COMPLETE; null until then", default: null }
      - { name: status, type: enum, source: system, description: "Repair lifecycle (cyclic through BLOCKED)", default: "PROPOSED", constraints: "one of PROPOSED | APPROVED | IN_PROGRESS | BLOCKED | COMPLETED | REJECTED | CANCELLED" }

  - name: Warranty
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; the completed repair this warranty covers" }
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id" }
      - { name: coverage_type, type: enum, source: input, description: "What is covered", constraints: "one of LABOR_ONLY | PARTS_INCLUSIVE" }
      - { name: term_months, type: integer, source: input, description: "Coverage duration in whole months", constraints: ">= 1" }
      - { name: issued_at, type: datetime, source: system, description: "Clock-now captured at issuance" }
      - { name: covered_labor_cents, type: integer, source: computed, description: "Copy of the repair order's labor_cents at issuance" }
      - { name: covered_parts_cents, type: integer, source: computed, description: "Copy of the repair order's parts_cents at issuance" }
      - { name: status, type: enum, source: system, description: "Warranty lifecycle", default: "ISSUED", constraints: "one of ISSUED | CLAIMED | VOIDED" }
      - { name: claimed_repair_type, type: enum, source: system, description: "repair_type asserted on the claim; null until a claim is filed", default: null, constraints: "one of CAP | LINER | DAMPER | GAS_LOG_CONVERSION" }
      - { name: last_claim_credit_cents, type: integer, source: computed, description: "Credit computed on the most recent claim; null until a claim is filed", default: null }

  - name: ReminderSchedule
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: chimney_id, type: string, source: input, description: "FK -> Chimney.id; the chimney whose recurring service this reminds" }
      - { name: cadence_months, type: integer, source: input, description: "Months between reminders", default: 12, constraints: ">= 1" }
      - { name: next_due_date, type: datetime, source: system, description: "clock-now + cadence_months at creation; advanced by cadence_months on acknowledge and on covered-chimney job completion" }
      - { name: status, type: enum, source: system, description: "Reminder lifecycle", default: "ACTIVE", constraints: "one of ACTIVE | DEACTIVATED" }
      - { name: acknowledged_count, type: integer, source: computed, description: "Number of times this reminder has been acknowledged; starts at 0", default: 0 }
      - { name: is_due, type: boolean, source: computed, description: "True when logical clock-now >= next_due_date and status == ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- ServiceJob dimension 1: job_status (parallel dimension) ----
  - entity: ServiceJob
    field: job_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /appointments (booking an appointment for this job)"
        actor: system
        preconditions:
          - "ServiceJob.job_status == DRAFT"
        side_effects:
          - "Appointment created in SCHEDULED"
          - "RouteDay.booked_minutes += Appointment.on_site_minutes"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /appointments/{id}/transitions action=ARRIVE"
        actor: Technician
        preconditions:
          - "The arriving Appointment references this ServiceJob"
        side_effects:
          - "Appointment.status EN_ROUTE -> ON_SITE"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-jobs/{id}/complete"
        actor: BillingClerk
        preconditions:
          - "ServiceJob.job_status == IN_PROGRESS (ERR_JOB_NOT_IN_PROGRESS)"
          - "ServiceJob.safety_posture in {SAFE, CONDITIONS} (ERR_JOB_UNSAFE)"
          - "No RepairOrder on this job in a non-terminal status {PROPOSED, APPROVED, IN_PROGRESS, BLOCKED} (ERR_JOB_HAS_OPEN_REPAIRS)"
        side_effects:
          - "invoice_total_cents computed via invoice_total calculation and stored"
          - "Chimney.last_service_date set to clock-now"
          - "ACTIVE ReminderSchedule for this chimney: next_due_date = clock-now + cadence_months (reminder_next_due)"
      - from: [DRAFT, SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /service-jobs/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "ServiceJob.job_status not in {COMPLETED, CANCELLED} (ERR_JOB_TERMINAL)"
        side_effects:
          - "CASCADE L1: ServiceJob.job_status -> CANCELLED"
          - "CASCADE L2: every Appointment for this job whose status in {SCHEDULED, EN_ROUTE, ON_SITE} -> CANCELLED (caused by L1)"
          - "CASCADE L3: for each Appointment cancelled in L2, its RouteDay.booked_minutes -= that Appointment.on_site_minutes (caused by L2)"
          - "Fan-out: every RepairOrder on this job whose status not in {COMPLETED, REJECTED, CANCELLED} -> CANCELLED (committed_cost_cents recomputed)"
          - "Fan-out: every Warranty for this job whose status == ISSUED -> VOIDED"

  # ---- ServiceJob dimension 2: safety_posture (parallel dimension) ----
  - entity: ServiceJob
    field: safety_posture
    initial_state: PENDING
    terminal_states: [CONDEMNED]
    transitions:
      - from: [PENDING, PASS_ANY]
        to: CONDEMNED
        trigger: "POST /service-jobs/{id}/inspect flue_assessment=BLOCKED"
        actor: Technician
        preconditions: []
        note: "from PASS_ANY denotes any non-CONDEMNED posture"
        side_effects:
          - "flue_assessment set to BLOCKED"
      - from: [PENDING, SAFE, CONDITIONS, UNSAFE]
        to: SAFE
        trigger: "POST /service-jobs/{id}/safety-check with outcome PASS"
        actor: Technician
        preconditions:
          - "safety_posture != CONDEMNED"
        side_effects:
          - "SafetyCheck.outcome = PASS"
      - from: [PENDING, SAFE]
        to: CONDITIONS
        trigger: "POST /service-jobs/{id}/sweep measured_creosote_class=3, OR POST /service-jobs/{id}/safety-check with outcome CONDITIONS"
        actor: Technician
        preconditions:
          - "safety_posture not in {UNSAFE, CONDEMNED}"
        side_effects:
          - "For sweep trigger: SweepLog created and sweep_final_cost_cents set"
      - from: [PENDING, SAFE, CONDITIONS]
        to: UNSAFE
        trigger: "POST /service-jobs/{id}/safety-check with outcome FAIL (co_ppm >= 9 or spillage_detected)"
        actor: Technician
        preconditions:
          - "safety_posture != CONDEMNED"
        side_effects:
          - "SafetyCheck.outcome = FAIL"
      - from: [PENDING, SAFE, CONDITIONS, UNSAFE]
        to: CONDEMNED
        trigger: "POST /service-jobs/{id}/safety-check with outcome CONDEMN (co_ppm >= 70)"
        actor: Technician
        preconditions: []
        side_effects:
          - "SafetyCheck.outcome = CONDEMN"

  # ---- RepairOrder (cyclic: IN_PROGRESS <-> BLOCKED) ----
  - entity: RepairOrder
    field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /repair-orders/{id}/transitions action=APPROVE"
        actor: Dispatcher
        preconditions:
          - "RepairOrder.status == PROPOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /repair-orders/{id}/transitions action=REJECT"
        actor: Dispatcher
        preconditions:
          - "RepairOrder.status == PROPOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "ServiceJob.committed_cost_cents recomputed (this order drops out of the sum)"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/transitions action=START"
        actor: Technician
        preconditions:
          - "RepairOrder.status == APPROVED (ERR_INVALID_STATE_TRANSITION)"
          - "parent ServiceJob.safety_posture in {SAFE, CONDITIONS} (ERR_JOB_UNSAFE)"
        side_effects: []
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "POST /repair-orders/{id}/transitions action=BLOCK"
        actor: Technician
        preconditions:
          - "RepairOrder.status == IN_PROGRESS (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/transitions action=RESUME"
        actor: Technician
        preconditions:
          - "RepairOrder.status == BLOCKED (ERR_INVALID_STATE_TRANSITION)"
          - "parent ServiceJob.safety_posture in {SAFE, CONDITIONS} (ERR_JOB_UNSAFE)"
        side_effects: []
        note: "Cycle edge: BLOCKED -> IN_PROGRESS pairs with IN_PROGRESS -> BLOCKED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/transitions action=COMPLETE, final_cost_cents, labor_cents"
        actor: Technician
        preconditions:
          - "RepairOrder.status == IN_PROGRESS (ERR_INVALID_STATE_TRANSITION)"
          - "labor_cents <= final_cost_cents (ERR_VALIDATION)"
        side_effects:
          - "final_cost_cents set; labor_cents set; parts_cents = final_cost_cents - labor_cents"
      - from: [PROPOSED, APPROVED, IN_PROGRESS, BLOCKED]
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/transitions action=CANCEL"
        actor: Dispatcher
        preconditions:
          - "RepairOrder.status not in {COMPLETED, REJECTED, CANCELLED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "CASCADE L1: RepairOrder.status -> CANCELLED"
          - "CASCADE L2: parent ServiceJob.committed_cost_cents recomputed as sweep_provisional_cost_cents + sum of provisional_cost_cents over remaining non-REJECTED/non-CANCELLED orders (caused by L1)"

  # ---- Appointment ----
  - entity: Appointment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /appointments/{id}/transitions action=DEPART"
        actor: Technician
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /appointments/{id}/transitions action=ARRIVE"
        actor: Technician
        preconditions:
          - "Appointment.status == EN_ROUTE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "parent ServiceJob.job_status SCHEDULED -> IN_PROGRESS"
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /appointments/{id}/transitions action=COMPLETE"
        actor: Technician
        preconditions:
          - "Appointment.status == ON_SITE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: [SCHEDULED, EN_ROUTE]
        to: CANCELLED
        trigger: "POST /appointments/{id}/transitions action=CANCEL"
        actor: Dispatcher
        preconditions:
          - "Appointment.status in {SCHEDULED, EN_ROUTE} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "RouteDay.booked_minutes -= Appointment.on_site_minutes"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/transitions action=NO_SHOW, no_show_reason"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "no_show_reason stored"
          - "RouteDay.booked_minutes -= Appointment.on_site_minutes"

  # ---- Warranty ----
  - entity: Warranty
    field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: CLAIMED
        trigger: "POST /warranties/{id}/file-claim claimed_repair_type"
        actor: BillingClerk
        preconditions:
          - "Warranty.status == ISSUED (ERR_WARRANTY_NOT_CLAIMABLE)"
          - "clock-now <= issued_at + term_months (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "claimed_repair_type stored"
          - "last_claim_credit_cents computed via warranty_claim_credit calculation"
      - from: [ISSUED, CLAIMED]
        to: VOIDED
        trigger: "system (ServiceJob cancel cascade fan-out)"
        actor: system
        preconditions:
          - "parent ServiceJob transitioned to CANCELLED"
        side_effects: []

  # ---- ReminderSchedule ----
  - entity: ReminderSchedule
    field: status
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /reminder-schedules/{id}/acknowledge"
        actor: Dispatcher
        preconditions:
          - "ReminderSchedule.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "is_due == true, i.e. clock-now >= next_due_date (ERR_REMINDER_NOT_DUE)"
        side_effects:
          - "next_due_date += cadence_months"
          - "acknowledged_count += 1"
        note: "Self-loop: acknowledging a due reminder advances it to the next cycle and keeps it ACTIVE"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "system (a newer ReminderSchedule is created for the same chimney and supersedes this one)"
        actor: system
        preconditions:
          - "A newer ReminderSchedule for the same chimney_id is created"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reminder-supersede-stale-chimney
    parent_entity: Chimney
    write_endpoint: "POST /reminder-schedules"
    occ_field: "expected_chimney_version"
    description: |
      Creating a ReminderSchedule against a Chimney whose version has advanced
      since the client last observed it is rejected. At most one ACTIVE
      ReminderSchedule may exist per chimney: a successful create legitimately
      supersedes any prior ACTIVE schedule (deactivating it) and bumps the
      chimney's version. A create still carrying the pre-supersede version is
      therefore working from a stale view of which reminder is active and is
      rejected with a precondition failure.
    error_id: ERR_STALE_CHIMNEY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sweep_service_cost
    trigger: "provisional at POST /service-jobs; final at POST /service-jobs/{id}/sweep"
    algorithm: tiered_pricing
    formula: |
      base = SWEEP_BASE_CENTS[inspection_level]          # tier by level 1/2/3
      creosote = CREOSOTE_SURCHARGE_CENTS[class]          # tier by creosote class
      glaze = GLAZE_SURCHARGE_CENTS if glaze_present else 0
      trip = TRIP_FEE_CENTS[trip_zone]
      cost = base + creosote + glaze + trip
      # PROVISIONAL variant: class = ServiceJob.expected_creosote_class, glaze_present = false
      # FINAL variant:       class = SweepLog.measured_creosote_class,   glaze_present = SweepLog.glaze_present
    input_set: "ServiceJob (inspection_level, trip_zone) + either expected_creosote_class (provisional) or the SweepLog measurement (final)"
    constants:
      SWEEP_BASE_CENTS: { 1: 15000, 2: 24000, 3: 40000 }
      CREOSOTE_SURCHARGE_CENTS: { 1: 0, 2: 6000, 3: 18000 }
      GLAZE_SURCHARGE_CENTS: 5000
      TRIP_FEE_CENTS: { A: 0, B: 3500, C: 7000 }
    precision: "integer cents; no rounding (all terms are whole cents)"
    variants:
      - name: provisional
        when: "ServiceJob is created"
        difference: "uses expected_creosote_class and treats glaze_present as false"
      - name: final
        when: "the sweep is logged"
        difference: "uses the measured_creosote_class and the observed glaze_present flag"

  - name: invoice_total
    trigger: "POST /service-jobs/{id}/complete"
    algorithm: aggregation
    formula: |
      lines = [ sweep_final_cost_cents ]
              + [ ro.final_cost_cents for ro in RepairOrders where ro.status == COMPLETED ]
      total = 0
      for line in lines:                         # PINNED ORDER: round per line, then sum
        fee = round_half_up(line * DISPOSAL_FEE_RATE)
        total += line + fee
      invoice_total_cents = total
      # NOTE: the disposal fee is rounded to whole cents PER LINE ITEM and then summed.
      # Summing the raw line amounts first and rounding the fee once can differ by a cent;
      # the per-line order is authoritative.
    input_set: "sweep_final_cost_cents plus every RepairOrder on the job in COMPLETED status; CANCELLED/REJECTED/open orders excluded"
    constants:
      DISPOSAL_FEE_RATE: 0.045
    precision: "round_half_up to whole cents, applied per line item before summing"

  - name: warranty_claim_credit
    trigger: "POST /warranties/{id}/file-claim"
    algorithm: decay_function
    formula: |
      elapsed_months = whole calendar months from Warranty.issued_at to clock-now (floor)
      if coverage_type == LABOR_ONLY:
        credit = covered_labor_cents
      else:  # PARTS_INCLUSIVE
        remaining_fraction = (term_months - elapsed_months) / term_months
        credit = covered_labor_cents + round_half_up(covered_parts_cents * remaining_fraction)
      last_claim_credit_cents = credit
    input_set: "a single Warranty and the logical clock at claim time"
    constants: {}
    precision: "round_half_up to whole cents on the prorated parts term"
    variants:
      - name: labor_only
        when: "coverage_type == LABOR_ONLY"
        difference: "credits full covered labor, parts never covered (no proration)"
      - name: parts_inclusive
        when: "coverage_type == PARTS_INCLUSIVE"
        difference: "credits full labor plus parts prorated by remaining term fraction"

  - name: safety_posture_derivation
    trigger: "POST /service-jobs/{id}/safety-check and POST /service-jobs/{id}/inspect and POST /service-jobs/{id}/sweep"
    algorithm: threshold
    formula: |
      # SafetyCheck outcome:
      if co_ppm >= CO_CONDEMN_PPM:                 outcome = CONDEMN
      elif co_ppm >= CO_UNSAFE_PPM or spillage_detected: outcome = FAIL
      elif not draft_ok:                           outcome = CONDITIONS
      else:                                        outcome = PASS
      # posture mapping (unless already CONDEMNED, which is terminal):
      #   CONDEMN -> CONDEMNED ; FAIL -> UNSAFE ; CONDITIONS -> CONDITIONS ; PASS -> SAFE
      # inspect flue_assessment=BLOCKED -> CONDEMNED
      # sweep measured_creosote_class == 3 -> CONDITIONS (only if current posture in {PENDING, SAFE})
    input_set: "the triggering SafetyCheck / inspect flue_assessment / SweepLog against the ServiceJob's current posture"
    constants:
      CO_UNSAFE_PPM: 9
      CO_CONDEMN_PPM: 70
    precision: "exact integer comparison; co_ppm >= 9 is the UNSAFE boundary (8 passes, 9 fails)"

  - name: committed_cost
    trigger: "POST /repair-orders, POST /repair-orders/{id}/transitions (REJECT/CANCEL), POST /service-jobs/{id}/cancel"
    algorithm: aggregation
    formula: |
      committed_cost_cents = sweep_provisional_cost_cents
        + sum(ro.provisional_cost_cents for ro in RepairOrders
              where ro.service_job_id == job.id and ro.status not in {REJECTED, CANCELLED})
      # INVARIANT: after any forward action and its compensating CANCEL, committed_cost_cents
      # returns to exactly the value implied by the surviving orders.
    input_set: "the ServiceJob's sweep_provisional_cost_cents plus provisional_cost_cents of its RepairOrders excluding REJECTED and CANCELLED"
    constants: {}
    precision: "integer cents"

  - name: routeday_booked_minutes
    trigger: "POST /appointments, POST /appointments/{id}/transitions (CANCEL/NO_SHOW)"
    algorithm: aggregation
    formula: |
      booked_minutes = sum(appt.on_site_minutes for appt in Appointments
                           where appt.route_day_id == rd.id
                           and appt.status not in {CANCELLED, NO_SHOW})
      # INVARIANT: booking then cancelling the same appointment restores booked_minutes exactly.
    input_set: "Appointments on the RouteDay whose status is not CANCELLED and not NO_SHOW"
    constants: {}
    precision: "integer minutes; on_site_minutes = (end_ts - start_ts) / 60"

  - name: reminder_next_due
    trigger: "POST /reminder-schedules (creation), POST /reminder-schedules/{id}/acknowledge, ServiceJob completion"
    algorithm: decay_function
    formula: |
      creation:    next_due_date = clock-now + cadence_months
      acknowledge: next_due_date = next_due_date + cadence_months ; acknowledged_count += 1
      completion:  next_due_date = clock-now + cadence_months (for the ACTIVE reminder of the completed job's chimney)
      is_due = (status == ACTIVE) and (clock-now >= next_due_date)
    input_set: "the ReminderSchedule and the logical clock"
    constants:
      DEFAULT_CADENCE_MONTHS: 12
    precision: "calendar-month arithmetic on ISO 8601 datetimes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For Technician-owned appointment transitions, X-User-ID equals the Appointment.technician_id"
    error_id: ERR_TECH_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /appointments/{id}/transitions"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_SERVICE_JOB_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_REPAIR_ORDER_NOT_FOUND / ERR_WARRANTY_NOT_FOUND / ERR_REMINDER_NOT_FOUND / ERR_CHIMNEY_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_ROUTE_DAY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "Foreign-key ids in the request body reference existing resources"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_CHIMNEY_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_ROUTE_DAY_NOT_FOUND / ERR_SERVICE_JOB_NOT_FOUND / ERR_REPAIR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints carrying FK fields"

  - priority: 6
    category: business_constraint
    check: "Request field shapes and enum domains valid (inspection_level in 1/2/3, creosote class in 1/2/3, required fields present, labor_cents <= final_cost_cents)"
    error_id: "ERR_VALIDATION / ERR_INVALID_INSPECTION_LEVEL / ERR_INVALID_CREOSOTE_CLASS"
    http_status: 400
    applies_to: "all create and transition endpoints"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition/operation"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_JOB_NOT_IN_PROGRESS / ERR_JOB_HAS_OPEN_REPAIRS / ERR_JOB_TERMINAL / ERR_REPAIR_NOT_COMPLETED / ERR_WARRANTY_NOT_CLAIMABLE / ERR_REMINDER_NOT_DUE"
    http_status: 409
    applies_to: "state transition and completion endpoints"

  - priority: 8
    category: business_temporal
    check: "Temporal validity: appointment end_ts > start_ts (positive on-site minutes); appointment fully inside the RouteDay window; warranty claim within term"
    error_id: "ERR_INVALID_APPOINTMENT_WINDOW / ERR_APPOINTMENT_OUTSIDE_WINDOW / ERR_WARRANTY_EXPIRED"
    http_status: 422
    applies_to: "POST /appointments, POST /warranties/{id}/file-claim"

  - priority: 9
    category: business_safety
    check: "ServiceJob.safety_posture is in {SAFE, CONDITIONS} for repair start/resume, job completion, and warranty issuance"
    error_id: ERR_JOB_UNSAFE
    http_status: 403
    applies_to: "POST /repair-orders/{id}/transitions (START/RESUME), POST /service-jobs/{id}/complete, POST /warranties"

  - priority: 10
    category: business_referential
    check: "RepairOrder part_sku is present when required and belongs to the catalog for the repair_type; warranty repair_order belongs to the named service_job"
    error_id: "ERR_PART_REQUIRED / ERR_UNKNOWN_PART"
    http_status: 422
    applies_to: "POST /repair-orders, POST /warranties"

  - priority: 11
    category: business_constraint
    check: "Appointment does not overlap or fall within TRAVEL_BUFFER_MINUTES (=30) of another non-cancelled appointment for the same technician; appointment technician_id equals the RouteDay technician_id. Intervals are half-open [start_ts, end_ts); the required gap between consecutive appointments is >= 30 minutes."
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 12
    category: business_fiscal
    check: "RepairOrder quoted_cost_cents <= parent ServiceJob.repair_authorization_cents; RouteDay aggregate booked_minutes + new on_site_minutes <= capacity_minutes"
    error_id: "ERR_REPAIR_COST_EXCEEDS_AUTH / ERR_ROUTE_CAPACITY_EXCEEDED"
    http_status: 402
    applies_to: "POST /repair-orders, POST /appointments"

  - priority: 13
    category: business_constraint
    check: "Optimistic concurrency: expected_chimney_version equals the current Chimney.version"
    error_id: ERR_STALE_CHIMNEY_VERSION
    http_status: 412
    applies_to: "POST /reminder-schedules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [Dispatcher]
    code: 201
    input: [name, service_address, phone, "email?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Chimney ----
  - method: POST
    path: "/chimneys"
    description: "Create a chimney for a customer"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, chimney_type, appliance_type, flue_count, "cap_installed?", "liner_type?", "damper_type?"]
    output: Chimney
    side_effects: []
  - method: GET
    path: "/chimneys/{id}"
    description: "Get a chimney"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: Chimney
    side_effects: []
  - method: GET
    path: "/chimneys"
    description: "List chimneys, optionally filtered by customer"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: "Chimney[]"
    side_effects: []

  # ---- Technician ----
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [Dispatcher]
    code: 201
    input: [name, cert_level]
    output: Technician
    side_effects: []

  # ---- RouteDay ----
  - method: POST
    path: "/route-days"
    description: "Create a route day for a technician"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, service_date, window_start_ts, window_end_ts, capacity_minutes]
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/route-days/{id}"
    description: "Get a route day (includes booked_minutes)"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/route-days"
    description: "List route days, optionally filtered by technician"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["technician_id?", "limit?", "offset?"]
    output: "RouteDay[]"
    side_effects: []

  # ---- ServiceJob ----
  - method: POST
    path: "/service-jobs"
    description: "Create a service job; computes sweep_provisional_cost_cents and committed_cost_cents"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, chimney_id, inspection_level, "expected_creosote_class?", "trip_zone?", "repair_authorization_cents?"]
    output: ServiceJob
    side_effects:
      - "job_status=DRAFT, safety_posture=PENDING, flue_assessment=UNASSESSED"
      - "sweep_provisional_cost_cents computed (sweep_service_cost provisional variant)"
      - "committed_cost_cents = sweep_provisional_cost_cents"
  - method: GET
    path: "/service-jobs/{id}"
    description: "Get a service job with all computed fields"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: ServiceJob
    side_effects: []
  - method: GET
    path: "/service-jobs"
    description: "List service jobs, optionally filtered by customer, chimney, or status"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["customer_id?", "chimney_id?", "job_status?", "limit?", "offset?"]
    output: "ServiceJob[]"
    side_effects: []
  - method: POST
    path: "/service-jobs/{id}/inspect"
    description: "Record the flue inspection result"
    roles: [Technician]
    code: 200
    input: [flue_assessment]
    output: ServiceJob
    side_effects:
      - "flue_assessment set"
      - "flue_assessment=BLOCKED -> safety_posture=CONDEMNED (safety_posture_derivation)"
  - method: POST
    path: "/service-jobs/{id}/sweep"
    description: "Log the sweep and creosote class; sets the final sweep cost"
    roles: [Technician]
    code: 201
    input: [measured_creosote_class, "glaze_present?"]
    output: SweepLog
    side_effects:
      - "SweepLog created (append-only)"
      - "ServiceJob.sweep_final_cost_cents set (sweep_service_cost final variant); SweepLog.billed_cost_cents mirrors it"
      - "measured_creosote_class==3 and posture in {PENDING,SAFE} -> safety_posture=CONDITIONS"
  - method: POST
    path: "/service-jobs/{id}/safety-check"
    description: "Record the CO/draft/spillage safety check; derives outcome and posture"
    roles: [Technician]
    code: 201
    input: [co_ppm, draft_ok, "spillage_detected?"]
    output: SafetyCheck
    side_effects:
      - "SafetyCheck created with computed outcome"
      - "safety_posture updated per safety_posture_derivation (PASS->SAFE, CONDITIONS->CONDITIONS, FAIL->UNSAFE, CONDEMN->CONDEMNED)"
  - method: GET
    path: "/service-jobs/{id}/sweep-logs"
    description: "List sweep logs for a job (reverse lookup)"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SweepLog[]"
    side_effects: []
  - method: GET
    path: "/service-jobs/{id}/safety-checks"
    description: "List safety checks for a job (reverse lookup)"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "SafetyCheck[]"
    side_effects: []
  - method: POST
    path: "/service-jobs/{id}/complete"
    description: "Complete the job; finalizes the invoice and advances the reminder"
    roles: [BillingClerk]
    code: 200
    input: []
    output: ServiceJob
    side_effects:
      - "job_status IN_PROGRESS -> COMPLETED"
      - "invoice_total_cents computed (invoice_total)"
      - "Chimney.last_service_date = clock-now"
      - "ACTIVE ReminderSchedule for the chimney: next_due_date = clock-now + cadence_months"
  - method: POST
    path: "/service-jobs/{id}/cancel"
    description: "Cancel the job with cascade"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceJob
    side_effects:
      - "job_status -> CANCELLED"
      - "cascade: appointments -> CANCELLED, RouteDay.booked_minutes released, open RepairOrders -> CANCELLED, ISSUED Warranties -> VOIDED"

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment slot for a service job on a route day"
    roles: [Dispatcher]
    code: 201
    input: [route_day_id, service_job_id, technician_id, start_ts, end_ts]
    output: Appointment
    side_effects:
      - "on_site_minutes computed"
      - "RouteDay.booked_minutes += on_site_minutes (routeday_booked_minutes)"
      - "parent ServiceJob.job_status DRAFT -> SCHEDULED"
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments, optionally filtered by route day, service job, or technician"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["route_day_id?", "service_job_id?", "technician_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: POST
    path: "/appointments/{id}/transitions"
    description: "Drive an appointment through its lifecycle"
    roles: [Technician, Dispatcher]
    code: 200
    input: [action, "no_show_reason?"]
    output: Appointment
    side_effects:
      - "ARRIVE: parent ServiceJob.job_status SCHEDULED -> IN_PROGRESS"
      - "CANCEL/NO_SHOW: RouteDay.booked_minutes -= on_site_minutes"

  # ---- RepairOrder ----
  - method: POST
    path: "/repair-orders"
    description: "Propose a repair (cap/liner/damper) or gas-log conversion"
    roles: [Technician, Dispatcher]
    code: 201
    input: [service_job_id, repair_type, "part_sku?", quoted_cost_cents]
    output: RepairOrder
    side_effects:
      - "provisional_cost_cents = quoted_cost_cents"
      - "parent ServiceJob.committed_cost_cents recomputed (committed_cost)"
  - method: GET
    path: "/repair-orders/{id}"
    description: "Get a repair order"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/repair-orders"
    description: "List repair orders, optionally filtered by service job or status"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["service_job_id?", "status?", "limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/transitions"
    description: "Drive a repair order through its lifecycle (APPROVE/REJECT/START/BLOCK/RESUME/COMPLETE/CANCEL)"
    roles: [Technician, Dispatcher]
    code: 200
    input: [action, "final_cost_cents?", "labor_cents?"]
    output: RepairOrder
    side_effects:
      - "START/RESUME: guarded by parent ServiceJob.safety_posture in {SAFE, CONDITIONS}"
      - "COMPLETE: sets final_cost_cents, labor_cents, parts_cents"
      - "REJECT/CANCEL: parent ServiceJob.committed_cost_cents recomputed"

  # ---- Warranty ----
  - method: POST
    path: "/warranties"
    description: "Issue a warranty for a completed repair"
    roles: [BillingClerk]
    code: 201
    input: [repair_order_id, service_job_id, coverage_type, term_months]
    output: Warranty
    side_effects:
      - "issued_at = clock-now; covered_labor_cents/covered_parts_cents copied from the repair order"
  - method: GET
    path: "/warranties/{id}"
    description: "Get a warranty"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: Warranty
    side_effects: []
  - method: GET
    path: "/warranties"
    description: "List warranties, optionally filtered by repair order or service job"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["repair_order_id?", "service_job_id?", "limit?", "offset?"]
    output: "Warranty[]"
    side_effects: []
  - method: POST
    path: "/warranties/{id}/file-claim"
    description: "File a warranty claim; computes the claim credit"
    roles: [BillingClerk]
    code: 200
    input: [claimed_repair_type]
    output: Warranty
    side_effects:
      - "status ISSUED -> CLAIMED"
      - "last_claim_credit_cents computed (warranty_claim_credit)"

  # ---- ReminderSchedule ----
  - method: POST
    path: "/reminder-schedules"
    description: "Create the recurring annual reminder for a chimney (supersedes any prior ACTIVE one; OCC on chimney version)"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, chimney_id, "cadence_months?", expected_chimney_version]
    output: ReminderSchedule
    side_effects:
      - "next_due_date = clock-now + cadence_months"
      - "any prior ACTIVE ReminderSchedule for the chimney -> DEACTIVATED"
      - "increments Chimney.version by 1"
  - method: GET
    path: "/reminder-schedules/{id}"
    description: "Get a reminder schedule (includes computed is_due)"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: []
    output: ReminderSchedule
    side_effects: []
  - method: GET
    path: "/reminder-schedules"
    description: "List reminder schedules, optionally filtered by customer, chimney, or status"
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: ["customer_id?", "chimney_id?", "status?", "limit?", "offset?"]
    output: "ReminderSchedule[]"
    side_effects: []
  - method: POST
    path: "/reminder-schedules/{id}/acknowledge"
    description: "Acknowledge a due reminder; advances it to the next cycle"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ReminderSchedule
    side_effects:
      - "next_due_date += cadence_months; acknowledged_count += 1 (reminder_next_due)"

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Dispatcher, Technician, BillingClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock-now set to to_iso8601"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADERS, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_TECH_IDENTITY_MISMATCH, http: 403, condition: "Technician acting on an appointment whose technician_id differs from X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or malformed value (includes labor_cents > final_cost_cents)" }
  - { id: ERR_INVALID_INSPECTION_LEVEL, http: 400, condition: "inspection_level not in {1,2,3}" }
  - { id: ERR_INVALID_CREOSOTE_CLASS, http: 400, condition: "expected_creosote_class or measured_creosote_class not in {1,2,3}" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id not found (path or FK)" }
  - { id: ERR_CHIMNEY_NOT_FOUND, http: 404, condition: "Chimney id not found (path or FK)" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id not found (FK)" }
  - { id: ERR_ROUTE_DAY_NOT_FOUND, http: 404, condition: "RouteDay id not found (path or FK)" }
  - { id: ERR_SERVICE_JOB_NOT_FOUND, http: 404, condition: "ServiceJob id not found (path or FK)" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id not found" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "RepairOrder id not found (path or FK)" }
  - { id: ERR_WARRANTY_NOT_FOUND, http: 404, condition: "Warranty id not found" }
  - { id: ERR_REMINDER_NOT_FOUND, http: 404, condition: "ReminderSchedule id not found" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_JOB_NOT_IN_PROGRESS, http: 409, condition: "Completing a job that is not IN_PROGRESS" }
  - { id: ERR_JOB_HAS_OPEN_REPAIRS, http: 409, condition: "Completing a job that still has a non-terminal RepairOrder" }
  - { id: ERR_JOB_TERMINAL, http: 409, condition: "Operating on a COMPLETED or CANCELLED job" }
  - { id: ERR_REPAIR_NOT_COMPLETED, http: 409, condition: "Issuing a warranty for a repair order that is not COMPLETED" }
  - { id: ERR_WARRANTY_NOT_CLAIMABLE, http: 409, condition: "Filing a claim on a warranty whose status is not ISSUED" }
  - { id: ERR_REMINDER_NOT_DUE, http: 409, condition: "Acknowledging a reminder that is not yet due" }
  - { id: ERR_INVALID_APPOINTMENT_WINDOW, http: 422, condition: "Appointment end_ts <= start_ts (non-positive on-site minutes)" }
  - { id: ERR_APPOINTMENT_OUTSIDE_WINDOW, http: 422, condition: "Appointment [start_ts,end_ts] not fully inside the RouteDay window" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Filing a claim after issued_at + term_months" }
  - { id: ERR_JOB_UNSAFE, http: 403, condition: "Operation requires safety_posture in {SAFE, CONDITIONS} but posture is PENDING/UNSAFE/CONDEMNED" }
  - { id: ERR_PART_REQUIRED, http: 422, condition: "part_sku missing for a CAP/LINER/DAMPER repair" }
  - { id: ERR_UNKNOWN_PART, http: 422, condition: "part_sku not in the catalog for the repair_type" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Appointment overlaps or falls within TRAVEL_BUFFER_MINUTES of another live appointment for the technician, or technician_id != route day technician" }
  - { id: ERR_REPAIR_COST_EXCEEDS_AUTH, http: 402, condition: "quoted_cost_cents exceeds the job's repair_authorization_cents" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 402, condition: "booked_minutes + new on_site_minutes exceeds the RouteDay capacity_minutes" }
  - { id: ERR_STALE_CHIMNEY_VERSION, http: 412, condition: "expected_chimney_version does not match the current Chimney.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Front office: manages customers, chimneys, technicians, route days, service jobs, appointments, reminders, and repair approvals/cancellations"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /chimneys"
      - "POST /technicians"
      - "POST /route-days"
      - "POST /service-jobs"
      - "POST /service-jobs/{id}/cancel"
      - "POST /appointments"
      - "POST /reminder-schedules"
      - "POST /reminder-schedules/{id}/acknowledge"
    shared_operations:
      - "POST /appointments/{id}/transitions (CANCEL/NO_SHOW)"
      - "POST /repair-orders (propose)"
      - "POST /repair-orders/{id}/transitions (APPROVE/REJECT/CANCEL)"
      - "all GET endpoints"

  - name: Technician
    description: "Field staff: performs inspections, sweeps, safety checks, drives appointments, and executes repairs. Acts as a specific Technician entity."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /service-jobs/{id}/inspect"
      - "POST /service-jobs/{id}/sweep"
      - "POST /service-jobs/{id}/safety-check"
    shared_operations:
      - "POST /appointments/{id}/transitions (DEPART/ARRIVE/COMPLETE)"
      - "POST /repair-orders (propose)"
      - "POST /repair-orders/{id}/transitions (START/BLOCK/RESUME/COMPLETE)"
      - "all GET endpoints"

  - name: BillingClerk
    description: "Billing: completes jobs (finalizes invoices), issues warranties, and processes warranty claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-jobs/{id}/complete"
      - "POST /warranties"
      - "POST /warranties/{id}/file-claim"
    shared_operations:
      - "all GET endpoints"
