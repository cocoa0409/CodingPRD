      - name: patch_claim_assign_catastrophe_segregates_and_stales
        claim_type: cross_reference_link
        grounds:
          - entities.Claim.fields.catastrophe_event_id
          - entities.Claim.fields.is_segregated
          - entities.LossTriangle.fields.is_stale
        distinguishing_aspect: "Assigning a claim to a catastrophe event whose closed window contains the accident date succeeds, flips is_segregated, and — because layer membership changed — marks the aggregated triangle stale."
        test_recipe:
          setup: ["Segment with CAT event [2025-01-01, 2025-03-31]; claim accident 2025-02-10 with one 100000 payment; triangle @2025-Q1 already aggregated (fresh)"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Cat Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
