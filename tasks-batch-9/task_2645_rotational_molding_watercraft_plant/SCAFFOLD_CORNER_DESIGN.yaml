          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVE is size_class MID (warpage factor 1.000) and cooling bay CB-CVE is AMBIENT (factor 1.000), so the index equals its own base."
            - "One cycle at oven_temp_c 200.0 with arm_rpm 29.92 / 1.00 is DEMOLDED after 35 actual cooling minutes against min_cooling_minutes 30, so the cooling term is zero on both variants and the base is exactly 2.500."
            - "The hull is TRIMMED and OUTFITTED and has rework_count 0."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
