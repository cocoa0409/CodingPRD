            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Bad Window", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-12-20", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { err2: "$.data.error_id" } }
          assert:
            - "captured err1 == ERR_VALIDATION (term_end must be > term_start)"
            - "captured err2 == ERR_VALIDATION (submission_opens_at must be < submission_due_at)"

      - name: clock_must_move_strictly_forward
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "The logical clock rejects a backward jump and an equal re-set: after advancing to 2026-10-01, setting 2026-09-15 or 2026-10-01 again both fail with 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One institution; clock advanced once to 2026-10-01"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: ClearinghouseOps, captures: { err_back: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ClearinghouseOps, captures: { err_equal: "$.data.error_id" } }
          assert:
            - "captured err_back == ERR_VALIDATION (backward)"
            - "captured err_equal == ERR_VALIDATION (not strictly forward)"

