            - "StaffingPlan.${plan_id}.version == 2"

      - name: order_assembles_only_when_the_last_station_ticket_is_done
        claim_type: bubble_up
        grounds:
          - state_machines.Order.IN_PRODUCTION_to_ASSEMBLED
          - state_machines.KitchenTicket.IN_PROGRESS_to_DONE
          - calculations.station_queue_sequencing
        distinguishing_aspect: |
          The bubble-up fires on the LAST non-VOIDED ticket, not on the first: after the SANDWICH ticket is
          done the order must still read IN_PRODUCTION, and only completing the BEVERAGE ticket lifts it to
          ASSEMBLED and then straight to READY because the channel is TOUCHSCREEN. An implementation that
          bubbles on any completion assembles the order one call too early.
