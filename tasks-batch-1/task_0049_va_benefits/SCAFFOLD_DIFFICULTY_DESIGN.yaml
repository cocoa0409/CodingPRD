# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — VA Benefits
# Nine Difficulty Rules (§0.5), >= 2 instances each (>= 18 total).
# Every grounds[] resolves to SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint.
# Calculation literals were executed against §1.3 formulas+constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: combined_rating_provisional_vs_finalized
        grounds:
          - calculations.va_combined_rating
          - state_machines.Claim.RATED_to_GRANTED
          - state_machines.Claim.DEVELOPMENT_to_RATED
          - entities.Veteran.fields.provisional_combined_rating_pct
          - entities.Veteran.fields.combined_rating_pct
        distinguishing_aspect: |
          On the Veteran domain: the same condition set produces
          provisional_combined_rating_pct=70 on RATE (provisional variant, PROPOSED
          ratings included) while combined_rating_pct stays 0 until GRANT, then both
          become 70 — provisional and finalized diverge in time on one entity.
        test_recipe:
          setup:
            - "A Veteran with no service-connected conditions (combined_rating_pct=0)."
            - "A Claim with two conditions proposed at 50% and 30%, moved to RATED but not yet granted."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "A Vet", file_number: "FN-DVC1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-10T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "6260", proposed_rating_pct: 30 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
          assert:
            - "Before grant: Veteran.${vet_id}.provisional_combined_rating_pct == 70"
            - "Before grant: Veteran.${vet_id}.combined_rating_pct == 0"
            - "After grant: Veteran.${vet_id}.combined_rating_pct == 70"

      - name: housing_allowance_estimated_vs_finalized
        grounds:
          - calculations.housing_allowance
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - entities.Enrollment.fields.estimated_mha_cents
          - entities.Enrollment.fields.monthly_housing_allowance_cents
        distinguishing_aspect: |
          On the Enrollment domain: estimated_mha_cents is computed at submit from the
          veteran's tier-90 (150000 of full rate) but the finalized
          monthly_housing_allowance_cents at certify uses tier-100 after a service-time
          edit, yielding 200000 — estimate and final diverge on a different entity than
          the combined-rating dual variant.
        test_recipe:
          setup:
            - "A Veteran with total_active_duty_days=950 (GI Bill tier 90)."
            - "A School with monthly_housing_rate_cents=200000."
            - "A full-time SUBMITTED enrollment (rop=100) whose estimated_mha_cents=180000."
            - "Before certify, the veteran's service days are edited up to 1200 (tier 100)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "B Vet", file_number: "FN-DVC2", total_active_duty_days: 950 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id, vet_v: $.data.version }
            - call: "POST /schools"
              payload: { name: "State U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id }
            - call: "PATCH /veterans/${vet_id}"
              payload: { total_active_duty_days: 1200, expected_veteran_version: "${vet_v}" }
              as: ClaimsAdmin
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { enr_ver: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_ver}" }
              as: SchoolCertifyingOfficial
          assert:
            - "Enrollment.${enr_id}.estimated_mha_cents == 180000"
            - "Enrollment.${enr_id}.monthly_housing_allowance_cents == 200000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combined_rating_bilateral_nonlinear      # mode (a): >=3 inputs, non-linear nested
        grounds:
          - calculations.va_combined_rating
          - state_machines.Claim.RATED_to_GRANTED
          - entities.Condition.fields.is_extremity
          - entities.Condition.fields.body_side
        distinguishing_aspect: |
          Mode (a): the whole-person combine takes >=3 ratings and applies each to the
          REMAINING efficiency (non-linear nested product), not a sum — ratings
          [70,50,30] yield combined 90, not 150 capped to 100.
        test_recipe:
          setup:
            - "A Veteran with one granted claim carrying three conditions rated 70, 50, 30."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "C Vet", file_number: "FN-CF1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-05T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5237", proposed_rating_pct: 70 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "6260", proposed_rating_pct: 30 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
          assert:
            - "Veteran.${vet_id}.combined_rating_pct == 90"

      - name: housing_allowance_round_then_scale_order  # mode (b): nested rounding, order pinned
        grounds:
          - calculations.housing_allowance
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - entities.Enrollment.fields.rate_of_pursuit_pct
        distinguishing_aspect: |
          Mode (b): MHA pins the rounding order — round tier_basis = rhu(rate*tier/100)
          FIRST, then round again after rate-of-pursuit scaling. With rate=200000,
          tier=80, rop=75 the pinned order gives 120000; summing-then-rounding a
          different order would not change here but the order is explicitly fixed and
          tested distinct from mode (a)'s non-linear product.
        test_recipe:
          setup:
            - "A Veteran with total_active_duty_days=800 (tier 80)."
            - "A School with monthly_housing_rate_cents=200000."
            - "A SUBMITTED enrollment at 9 of 12 credit hours (rop=75)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "D Vet", file_number: "FN-CF2", total_active_duty_days: 800 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Tech U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 9, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: SchoolCertifyingOfficial
          assert:
            - "Enrollment.${enr_id}.rate_of_pursuit_pct == 75"
            - "Enrollment.${enr_id}.monthly_housing_allowance_cents == 120000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_appeal_cycle_rated_remand_development     # cyclic on Claim
        grounds:
          - state_machines.Claim.RATED_to_REMANDED
          - state_machines.Claim.REMANDED_to_DEVELOPMENT
          - state_machines.Claim.DEVELOPMENT_to_RATED
          - entities.Claim.fields.remand_count
        distinguishing_aspect: |
          Claim entity exhibits a CYCLE: RATED -> REMANDED -> DEVELOPMENT -> RATED,
          incrementing remand_count each loop — a non-linear shape (not an A->B->C
          pipeline) on the Claim entity.
        test_recipe:
          setup:
            - "A claim with one condition rated 40%, moved to RATED."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "E Vet", file_number: "FN-NLSM1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-02-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/remand"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "After remand: Claim.${claim_id}.remand_count == 1"
            - "After open-development: Claim.${claim_id}.status == DEVELOPMENT"

      - name: veteran_award_suspend_reactivate_cycle          # cyclic on Veteran (different entity)
        grounds:
          - state_machines.Veteran.ACTIVE_to_SUSPENDED
          - state_machines.Veteran.SUSPENDED_to_ACTIVE
          - entities.Veteran.fields.award_status
        distinguishing_aspect: |
          Veteran award lifecycle cycles ACTIVE -> SUSPENDED -> ACTIVE — a non-linear
          (cyclic) shape on a DIFFERENT entity (Veteran) than the Claim appeal loop.
        test_recipe:
          setup:
            - "A Veteran with combined_rating_pct=30 (one granted 30% condition), award activated."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "F Vet", file_number: "FN-NLSM2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-02-02T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 30 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { vet_v: $.data.version }
            - call: "POST /veterans/${vet_id}/activate-award"
              payload: { expected_veteran_version: "${vet_v}" }
              as: ClaimsAdmin
          trigger:
            - call: "POST /veterans/${vet_id}/suspend-award"
              payload: {}
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { vet_v2: $.data.version }
            - call: "POST /veterans/${vet_id}/activate-award"
              payload: { expected_veteran_version: "${vet_v2}" }
              as: ClaimsAdmin
          assert:
            - "After suspend: Veteran.${vet_id}.award_status == SUSPENDED"
            - "After reactivate: Veteran.${vet_id}.award_status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: grant_cascade_condition_rating_compensation      # depth >= 3
        grounds:
          - state_machines.Claim.RATED_to_GRANTED
          - calculations.va_combined_rating
          - calculations.monthly_compensation
          - entities.Condition.fields.service_connection
          - entities.Veteran.fields.combined_rating_pct
          - entities.Veteran.fields.monthly_compensation_cents
        distinguishing_aspect: |
          Depth-3 chain from Claim GRANT: (1) grant flips Condition.service_connection ->
          SERVICE_CONNECTED + final_rating_pct=70; (2) THAT condition change drives
          Veteran.combined_rating_pct recompute to 70; (3) THAT rating change drives
          Veteran.monthly_compensation_cents recompute to 182800 (with one spouse).
        test_recipe:
          setup:
            - "A Veteran with one ACTIVE spouse dependent and no granted conditions."
            - "A claim with two conditions proposed 50 and 30, in RATED state."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "G Vet", file_number: "FN-TC1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "SPOUSE" }
              as: ClaimsAdmin
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-15T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "6260", proposed_rating_pct: 30 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "GET /conditions?claim_id=${claim_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Every condition on the claim: service_connection == SERVICE_CONNECTED"
            - "Veteran.${vet_id}.combined_rating_pct == 70"
            - "Veteran.${vet_id}.monthly_compensation_cents == 182800"

      - name: dependent_add_cascade_compensation                # depth >= 2, different trigger
        grounds:
          - state_machines.Veteran.DRAFT_to_ACTIVE
          - calculations.monthly_compensation
          - entities.Dependent.fields.status
          - entities.Veteran.fields.monthly_compensation_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST dependents, not a claim grant):
          (1) adding an ACTIVE child dependent sets Dependent.status=ACTIVE; (2) THAT new
          dependent drives Veteran.monthly_compensation_cents recompute from 81200 to 84000
          at rating 40 — distinct propagation pattern from the grant cascade.
        test_recipe:
          setup:
            - "A Veteran with combined_rating_pct=40 (one granted 40% condition), spouse already added, monthly_compensation_cents=81200."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "H Vet", file_number: "FN-TC2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-20T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "SPOUSE" }
              as: ClaimsAdmin
          trigger:
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "CHILD", in_school_18_to_23: false }
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Before adding child: Veteran.${vet_id}.monthly_compensation_cents == 81200"
            - "After adding child: Veteran.${vet_id}.monthly_compensation_cents == 84000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_giib_eligibility_on_certify          # state (p6) vs business_referential (p11)
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Error-category pair {state vs business_referential}: an already-CERTIFIED
          enrollment whose veteran also has gi_bill_tier_pct=0 fails both p6 (ERR_INVALID_STATE)
          and p11 (ERR_NO_GI_BILL_ELIGIBILITY); the lower priority number (p6) wins ->
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A Veteran with total_active_duty_days=0 (tier 0)."
            - "A School and an enrollment that was forced to CERTIFIED earlier; certify it again."
            - "Because tier is 0, certify also violates GI Bill eligibility — but state check fires first."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "I Vet", file_number: "FN-PPV1A", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_elig_id: $.data.id, vet_elig_v: $.data.version }
            - call: "POST /schools"
              payload: { name: "Cert U", is_public: true, monthly_housing_rate_cents: 180000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_elig_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_elig_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: SchoolCertifyingOfficial
            - call: "PATCH /veterans/${vet_elig_id}"
              payload: { total_active_duty_days: 0, expected_veteran_version: "${vet_elig_v}" }
              as: ClaimsAdmin
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { enr_v2: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v2}" }
              as: SchoolCertifyingOfficial
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE  (p6 beats p11 ERR_NO_GI_BILL_ELIGIBILITY)"

      - name: vocrehab_ineligible_before_entitlement_exhausted   # business_referential (p14) vs business_fiscal (p15)
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - state_machines.VocRehabPlan.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair {business_referential vs business_fiscal}: a Voc Rehab approve
          for a veteran with combined_rating_pct=10 (below VOC_REHAB_MIN_RATING=20) AND
          planned_months=60 (above 48 entitlement) violates both p14 and p15; p14 wins ->
          ERR_VOC_REHAB_INELIGIBLE.
        test_recipe:
          setup:
            - "A Veteran with combined_rating_pct=10 (one granted 10% condition) and full 48 entitlement months."
            - "A PROPOSED VocRehabPlan with planned_months=60."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "J Vet", file_number: "FN-PPV2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-03-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 10 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "POST /voc-rehab-plans"
              payload: { veteran_id: "${vet_id}", planned_months: 60, track: "EMPLOYMENT_THROUGH_LONG_TERM" }
              as: ClaimsAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /voc-rehab-plans/${plan_id}/approve"
              payload: {}
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_VOC_REHAB_INELIGIBLE  (p14 beats p15 ERR_ENTITLEMENT_EXHAUSTED)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dependent_bump_threshold_at_rating_30             # numeric threshold (>=30) on compensation
        grounds:
          - calculations.monthly_compensation
          - entities.Veteran.fields.combined_rating_pct
          - state_machines.Claim.RATED_to_GRANTED
        distinguishing_aspect: |
          Numeric threshold boundary on combined_rating_pct: dependents are counted only at
          rating >= 30. At exactly 30 (granted single 30% condition) with one spouse,
          monthly_compensation_cents == 56600; at 20 the same spouse adds nothing (34600).
          Reached via POST /claims/{id}/grant.
        test_recipe:
          setup:
            - "A Veteran with one ACTIVE spouse, granted a single 30% condition (rating exactly at the 30 boundary)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "K Vet", file_number: "FN-BP1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "SPOUSE" }
              as: ClaimsAdmin
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-25T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 30 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Veteran.${vet_id}.combined_rating_pct == 30"
            - "Veteran.${vet_id}.monthly_compensation_cents == 56600"

      - name: rate_of_pursuit_floor_exactly_50_pays_zero        # different metric (rop), different endpoint (certify)
        grounds:
          - calculations.housing_allowance
          - entities.Enrollment.fields.rate_of_pursuit_pct
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Different boundary metric (rate_of_pursuit_pct) on a different endpoint
          (POST /enrollments/{id}/certify): MHA paid only when rop > 50 strictly. At
          rop == 50 exactly (6 of 12 hours), monthly_housing_allowance_cents == 0.
        test_recipe:
          setup:
            - "A tier-100 Veteran with a School (rate 200000) and a SUBMITTED enrollment at 6/12 credit hours (rop exactly 50)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "L Vet", file_number: "FN-BP2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Half U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 6, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: SchoolCertifyingOfficial
          assert:
            - "Enrollment.${enr_id}.rate_of_pursuit_pct == 50"
            - "Enrollment.${enr_id}.monthly_housing_allowance_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_certify_requires_veteran_gi_bill        # Enrollment depends on Veteran
        grounds:
          - validations[priority=11]
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - entities.Veteran.fields.gi_bill_tier_pct
        distinguishing_aspect: |
          Entity pair {Enrollment -> Veteran}: Enrollment's SUBMITTED->CERTIFIED transition
          is gated by the Veteran's gi_bill_tier_pct > 0; a tier-0 veteran's enrollment
          certify is rejected with ERR_NO_GI_BILL_ELIGIBILITY.
        test_recipe:
          setup:
            - "A Veteran with total_active_duty_days=30 (below 90 -> tier 0)."
            - "A School and a SUBMITTED full-time enrollment."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "M Vet", file_number: "FN-CESD1", total_active_duty_days: 30 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Gate U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: SchoolCertifyingOfficial
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_NO_GI_BILL_ELIGIBILITY"
            - "Enrollment.${enr_id}.status == SUBMITTED  (transition rejected)"

      - name: vocrehab_approve_requires_veteran_rating           # VocRehabPlan depends on Veteran (different pair)
        grounds:
          - validations[priority=14]
          - state_machines.VocRehabPlan.PROPOSED_to_APPROVED
          - entities.Veteran.fields.combined_rating_pct
        distinguishing_aspect: |
          Entity pair {VocRehabPlan -> Veteran} (different from Enrollment->Veteran):
          VocRehabPlan's PROPOSED->APPROVED transition is gated by Veteran.combined_rating_pct
          >= VOC_REHAB_MIN_RATING=20; a veteran with rating 10 yields ERR_VOC_REHAB_INELIGIBLE.
        test_recipe:
          setup:
            - "A Veteran with combined_rating_pct=10 (granted single 10% condition)."
            - "A PROPOSED VocRehabPlan with planned_months=12 (within entitlement)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "N Vet", file_number: "FN-CESD2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-03-05T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 10 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "POST /voc-rehab-plans"
              payload: { veteran_id: "${vet_id}", planned_months: 12, track: "REEMPLOYMENT" }
              as: ClaimsAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /voc-rehab-plans/${plan_id}/approve"
              payload: {}
              as: ClaimsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_VOC_REHAB_INELIGIBLE"
            - "VocRehabPlan.${plan_id}.status == PROPOSED  (transition rejected)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_overlap_strict_interior_overlap         # half-open interval overlap on Enrollment
        grounds:
          - validations[priority=12]
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - entities.Enrollment.fields.term_start
          - entities.Enrollment.fields.term_end
        distinguishing_aspect: |
          Half-open [term_start, term_end) overlap on Enrollment: a second enrollment whose
          interval strictly overlaps an existing CERTIFIED enrollment for the SAME veteran is
          rejected with ERR_ENROLLMENT_OVERLAP — interiors intersect.
        test_recipe:
          setup:
            - "A tier-100 Veteran, a School, and a CERTIFIED enrollment for term [2026-08-20, 2026-12-15)."
            - "A second SUBMITTED enrollment for [2026-10-01, 2027-02-01) which overlaps the interior."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "O Vet", file_number: "FN-RTO1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Overlap U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr1_id: $.data.id, enr1_v: $.data.version }
            - call: "POST /enrollments/${enr1_id}/certify"
              payload: { expected_enrollment_version: "${enr1_v}" }
              as: SchoolCertifyingOfficial
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-10-01T00:00:00Z", term_end: "2027-02-01T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr2_id: $.data.id, enr2_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr2_id}/certify"
              payload: { expected_enrollment_version: "${enr2_v}" }
              as: SchoolCertifyingOfficial
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ENROLLMENT_OVERLAP"

      - name: enrollment_touching_endpoints_no_overlap            # adjacency semantics (gap=0) on Enrollment
        grounds:
          - validations[priority=12]
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - entities.Enrollment.fields.term_start
          - entities.Enrollment.fields.term_end
        distinguishing_aspect: |
          DIFFERENT interval semantics on the same resource: adjacency where the first term's
          term_end equals the second term's term_start (touching endpoints, gap=0) does NOT
          overlap under half-open arithmetic — the second certify SUCCEEDS, contrasting with the
          strict-interior-overlap rejection.
        test_recipe:
          setup:
            - "A tier-100 Veteran, a School, and a CERTIFIED enrollment for [2026-01-10, 2026-05-10)."
            - "A second SUBMITTED enrollment for [2026-05-10, 2026-08-10) that touches but does not overlap."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "P Vet", file_number: "FN-RTO2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Adjacent U", is_public: true, monthly_housing_rate_cents: 200000 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-01-10T00:00:00Z", term_end: "2026-05-10T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr1_id: $.data.id, enr1_v: $.data.version }
            - call: "POST /enrollments/${enr1_id}/certify"
              payload: { expected_enrollment_version: "${enr1_v}" }
              as: SchoolCertifyingOfficial
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-05-10T00:00:00Z", term_end: "2026-08-10T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12 }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr2_id: $.data.id, enr2_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr2_id}/certify"
              payload: { expected_enrollment_version: "${enr2_v}" }
              as: SchoolCertifyingOfficial
          assert:
            - "Enrollment.${enr2_id}.status == CERTIFIED  (touching endpoints accepted)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: enrollment_cancel_restores_yellow_ribbon_slots     # conserved quantity: YR slot pool
        grounds:
          - state_machines.Enrollment.CERTIFIED_to_CANCELLED
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - calculations.yellow_ribbon_match
          - entities.School.fields.yellow_ribbon_slots_used
          - entities.Enrollment.fields.yellow_ribbon_match_cents
        distinguishing_aspect: |
          Conserved quantity = School Yellow Ribbon slot pool. Invariant pinned as
          School.yellow_ribbon_slots_used after (certify-with-YR then cancel) equals the
          value before certify (0). Cancel reverses slots_used -= 1 and zeroes
          yellow_ribbon_match_cents, leaving zero drift.
        test_recipe:
          setup:
            - "A tier-100 Veteran, a Yellow Ribbon School with slots_total=1, slots_used=0."
            - "An enrollment requesting Yellow Ribbon, certified (slots_used=1, match awarded)."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Q Vet", file_number: "FN-CI1", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "YR U", is_public: false, monthly_housing_rate_cents: 200000, yellow_ribbon_participant: true, yellow_ribbon_max_contribution_cents: 300000, yellow_ribbon_slots_total: 1 }
              as: ClaimsAdmin
              captures: { school_id: $.data.id }
            - call: "POST /enrollments"
              payload: { veteran_id: "${vet_id}", school_id: "${school_id}", term_start: "2026-08-20T00:00:00Z", term_end: "2026-12-15T00:00:00Z", credit_hours: 12, full_time_credit_hours: 12, tuition_charged_cents: 400000, requests_yellow_ribbon: true }
              as: Veteran
              as_user_id: "${vet_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: SchoolCertifyingOfficial
            - call: "GET /schools/${school_id}"
              payload: {}
              as: ClaimsAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: {}
              as: Veteran
              as_user_id: "${vet_id}"
            - call: "GET /schools/${school_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "After certify: School.${school_id}.yellow_ribbon_slots_used == 1"
            - "After certify: Enrollment.${enr_id}.yellow_ribbon_match_cents == 200000"
            - "After cancel: School.${school_id}.yellow_ribbon_slots_used == 0  (conserved: equals pre-certify value)"
            - "After cancel: Enrollment.${enr_id}.yellow_ribbon_match_cents == 0"

      - name: claim_deny_then_remand_restores_combined_rating    # conserved quantity: combined rating / compensation
        grounds:
          - state_machines.Claim.RATED_to_GRANTED
          - state_machines.Claim.RATED_to_DENIED
          - state_machines.Claim.DENIED_to_REMANDED
          - calculations.va_combined_rating
          - entities.Veteran.fields.combined_rating_pct
        distinguishing_aspect: |
          Conserved quantity = Veteran.combined_rating_pct (a DIFFERENT conserved quantity than
          the YR slot pool). With an already-granted 50% condition giving combined 50, a second
          claim that is DENIED then REMANDED must leave combined_rating_pct == 50 throughout —
          deny+remand of the second claim conserves the first claim's contribution (no drift).
        test_recipe:
          setup:
            - "A Veteran with claim A granted at 50% (combined_rating_pct=50)."
            - "A second claim B with one condition proposed 40%, taken to RATED then DENIED."
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "R Vet", file_number: "FN-CI2", total_active_duty_days: 1200 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-02T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claimA_id: $.data.id, claimA_v: $.data.version }
            - call: "POST /claims/${claimA_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claimA_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claimA_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claimA_id}/grant"
              payload: { expected_claim_version: "${claimA_v}" }
              as: ClaimsAdmin
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "SECONDARY", received_date: "2026-02-10T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claimB_id: $.data.id, claimB_v: $.data.version }
            - call: "POST /claims/${claimB_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "6260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claimB_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claimB_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claimB_id}/deny"
              payload: { expected_claim_version: "${claimB_v}" }
              as: ClaimsAdmin
          trigger:
            - call: "POST /claims/${claimB_id}/remand"
              payload: {}
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "After claim B deny: Veteran.${vet_id}.combined_rating_pct == 50"
            - "After claim B remand: Veteran.${vet_id}.combined_rating_pct == 50  (conserved: claim A contribution unchanged)"
