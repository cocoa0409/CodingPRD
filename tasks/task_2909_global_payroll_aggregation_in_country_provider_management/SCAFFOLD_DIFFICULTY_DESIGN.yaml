# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Global Payroll Aggregation & In-Country Provider Management
#
# 9 rule_ids x 2 instances = 18 instances. Every grounds entry resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every literal in `assert:` was computed by executing
# the referenced §1.3 formula. The logical clock sits at 2026-08-01T00:00:00Z
# unless a chain moves it with POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: variance_basis_headcount_normalized_masks_five_pct_absolute_move
        grounds:
          - calculations.gross_to_net_variance
          - entities.GrossToNetRun.fields.variance_basis
          - entities.GrossToNetRun.fields.variance_pct
          - entities.GrossToNetRun.fields.variance_material
          - entities.CountryProfile.fields.materiality_pct
          - state_machines.GrossToNetRun.SUBMITTED_to_CLEARED
        distinguishing_aspect: |
          This instance is dual-variant logic on the GrossToNetRun payroll-result domain:
          the same run (gross 10500000 over 210 employees against a baseline of 10000000
          over 200) reads 0.00 percent and immaterial under HEADCOUNT_NORMALIZED but 5.00
          percent and material under ABSOLUTE_TOTAL, so the two variants disagree on the
          outcome and not merely on the number.
        test_recipe:
          setup:
            - "CountryProfile DE with materiality_pct 5.00 and materiality_floor_minor 100000"
            - "Provider EuroPay GmbH and an ACTIVE Engagement for DE with MONTHLY frequency"
            - "PayrollCycle 2026-08 with an APPROVED GrossToNetRun of gross_minor 10000000 over 200 employees (the variance baseline)"
            - "PayrollCycle 2026-09 with prior_cycle_id pointing at 2026-08, inputs locked from a 210-record extract"
            - "logical clock untouched at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
            - call: "POST /payroll/input-files/${if1}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c1}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1_v: "$.data.version" }
            - call: "POST /payroll/gross-to-net-runs"
              payload: { cycle_id: "${c1}", input_file_id: "${if1}", gross_minor: 10000000, net_minor: 6500000, employer_cost_minor: 2000000, provider_fee_minor: 150000, employee_count: 200, expected_cycle_version: "${c1_v}" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /payroll/gross-to-net-runs/${r1}/review"
              payload: { decision: "APPROVE" }
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-09", period_start_date: "2026-09-01", period_end_date: "2026-10-01", pay_date: "2026-09-30", cutoff_lead_working_days: 3, prior_cycle_id: "${c1}" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c2: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c2}", source_system: "HRIS_CORE", record_count: 210, gross_declared_minor: 10500000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if2: "$.data.id" }
            - call: "POST /payroll/input-files/${if2}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c2}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c2_v: "$.data.version" }
          trigger:
            - call: "POST /payroll/gross-to-net-runs"
              payload: { cycle_id: "${c2}", input_file_id: "${if2}", gross_minor: 10500000, net_minor: 6800000, employer_cost_minor: 2100000, provider_fee_minor: 155000, employee_count: 210, expected_cycle_version: "${c2_v}" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
              captures: { r2: "$.data.id" }
          assert:
            - "GrossToNetRun.${r2}.headcount_drift_pct == 5.00"
            - "GrossToNetRun.${r2}.variance_basis == HEADCOUNT_NORMALIZED"
            - "GrossToNetRun.${r2}.variance_pct == 0.00"
            - "GrossToNetRun.${r2}.variance_material == false"
            - "GrossToNetRun.${r2}.status == CLEARED"
            - "PayrollCycle.${c2}.status == INPUTS_LOCKED"
            - "GET /payroll/sla-incidents?engagement_id=${eng_de} returns total_count 0 (no VARIANCE_ESCALATION incident was created)"

      - name: provider_score_variant_flips_to_rolling_window_on_first_cycle_close
        grounds:
          - calculations.provider_service_score
          - entities.Provider.fields.score_variant_applied
          - entities.Provider.fields.service_score
          - entities.Engagement.fields.closed_cycle_count
          - state_machines.PayrollCycle.FUNDED_to_CLOSED
        distinguishing_aspect: |
          This instance is dual-variant logic on the Provider service-level domain, a
          different entity domain and a different metric from the GrossToNetRun variance
          instance: one CONFIRMED SEV1 incident dated 2026-04-01 scores the provider 75.00
          under ENGAGEMENT_TO_DATE and 100.00 under ROLLING_WINDOW, and the variant switch
          is caused by Engagement.closed_cycle_count reaching 1, not by any incident change.
          The switch is a re-score of an unchanged incident set.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
            - "one SlaIncident of severity SEV1 with occurred_at 2026-04-01T00:00:00Z, CONFIRMED, so Provider.service_score is 75.00 with score_variant_applied ENGAGEMENT_TO_DATE and Provider.status ACTIVE"
            - "PayrollCycle 2026-08 driven all the way to FUNDED with both statutory filings CONFIRMED and all four global controls evidenced"
            - "Engagement.closed_cycle_count is still 0"
            - "logical clock at 2026-08-01T00:00:00Z, so the 90-day rolling window opens at 2026-05-03T00:00:00Z and excludes the incident"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/sla-incidents"
              payload: { engagement_id: "${eng_de}", incident_type: "DATA_INCIDENT", severity: "SEV1", occurred_at: "2026-04-01T00:00:00Z", note: "historic data incident before the rolling window" }
              as: PayrollController
              as_user_id: "ctrl-01"
              captures: { inc_old: "$.data.id" }
            - call: "POST /payroll/sla-incidents/${inc_old}/confirm"
              payload: {}
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
            - call: "POST /payroll/input-files/${if1}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c1}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1_v: "$.data.version" }
            - call: "POST /payroll/gross-to-net-runs"
              payload: { cycle_id: "${c1}", input_file_id: "${if1}", gross_minor: 10000000, net_minor: 6500000, employer_cost_minor: 2000000, provider_fee_minor: 150000, employee_count: 200, expected_cycle_version: "${c1_v}" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /payroll/gross-to-net-runs/${r1}/review"
              payload: { decision: "APPROVE" }
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/bank-accounts"
              payload: { engagement_id: "${eng_de}", account_ref: "DE-ACC-1", account_currency: "EUR", residency_region: "EU", daily_cap_minor: 20000000, settlement_window_hours: 24, buffer_hours: 12 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { ba1: "$.data.id" }
            - call: "POST /payroll/bank-accounts/${ba1}/verify"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /payroll/funding-instructions"
              payload: { cycle_id: "${c1}", bank_account_id: "${ba1}", value_date: "2026-08-10", funding_currency: "USD", fx_rate: 0.920000 }
              as: TreasuryOfficer
              as_user_id: "treas-01"
              captures: { fi1: "$.data.id" }
            - call: "POST /payroll/funding-instructions/${fi1}/approve"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "treas-01"
            - call: "POST /payroll/funding-instructions/${fi1}/release"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "treas-02"
            - call: "GET /payroll/filings"
              payload: { cycle_id: "${c1}" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { f1: "$.data[0].id", f2: "$.data[1].id" }
            - call: "POST /payroll/filings/${f1}/file"
              payload: { submission_ref: "DE-SUB-1" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
            - call: "POST /payroll/filings/${f1}/confirm"
              payload: { confirmation_ref: "DE-CONF-1" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
            - call: "POST /payroll/filings/${f2}/file"
              payload: { submission_ref: "DE-SUB-2" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
            - call: "POST /payroll/filings/${f2}/confirm"
              payload: { confirmation_ref: "DE-CONF-2" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
          trigger:
            - call: "POST /payroll/cycles/${c1}/close"
              payload: {}
              as: PayrollController
              as_user_id: "ctrl-01"
          assert:
            - "PayrollCycle.${c1}.status == CLOSED"
            - "Engagement.${eng_de}.closed_cycle_count == 1"
            - "Provider.${prov_p1}.score_variant_applied == ROLLING_WINDOW"
            - "Provider.${prov_p1}.service_score == 100.00 (was 75.00 under ENGAGEMENT_TO_DATE immediately before the close)"
            - "Provider.${prov_p1}.status == ACTIVE"
            - "SlaIncident.${inc_old}.status == CONFIRMED and SlaIncident.${inc_old}.weight_points == 25.00 (the incident set is unchanged; only the variant changed)"

  - rule_id: combinatorial_formula
    instances:
      - name: funding_conversion_rounds_each_component_before_summing
        grounds:
          - calculations.funding_requirement_conversion
          - entities.FundingInstruction.fields.component_source_minor
          - entities.FundingInstruction.fields.funded_source_minor
          - entities.FundingInstruction.fields.requested_local_minor
        distinguishing_aspect: |
          Mode (b) nested-rounding-order instance: the scaffold pins convert-then-round each
          of net, employer_cost and provider_fee and only then sum, which yields
          funded_source_minor 9543206, whereas summing 8650000 first and converting once
          yields 9543207. The two orders differ by exactly one minor unit on these inputs.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement, VERIFIED LocalBankAccount in EUR"
            - "PayrollCycle 2026-08 in RESULTS_APPROVED whose APPROVED run has net_minor 6500000, employer_cost_minor 2000000 and provider_fee_minor 150000"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
            - call: "POST /payroll/input-files/${if1}/validate"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
            - call: "POST /payroll/cycles/${c1}/lock-inputs"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1_v: "$.data.version" }
            - call: "POST /payroll/gross-to-net-runs"
              payload: { cycle_id: "${c1}", input_file_id: "${if1}", gross_minor: 10000000, net_minor: 6500000, employer_cost_minor: 2000000, provider_fee_minor: 150000, employee_count: 200, expected_cycle_version: "${c1_v}" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
              captures: { r1: "$.data.id" }
            - call: "POST /payroll/gross-to-net-runs/${r1}/review"
              payload: { decision: "APPROVE" }
              as: PayrollController
              as_user_id: "ctrl-01"
            - call: "POST /payroll/bank-accounts"
              payload: { engagement_id: "${eng_de}", account_ref: "DE-ACC-1", account_currency: "EUR", residency_region: "EU", daily_cap_minor: 20000000, settlement_window_hours: 24, buffer_hours: 12 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { ba1: "$.data.id" }
            - call: "POST /payroll/bank-accounts/${ba1}/verify"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /payroll/funding-instructions"
              payload: { cycle_id: "${c1}", bank_account_id: "${ba1}", value_date: "2026-08-10", funding_currency: "USD", fx_rate: 0.920000 }
              as: TreasuryOfficer
              as_user_id: "treas-01"
              captures: { fi1: "$.data.id" }
          assert:
            - "FundingInstruction.${fi1}.requested_local_minor == 8650000"
            - "FundingInstruction.${fi1}.component_source_minor.net == 7065217"
            - "FundingInstruction.${fi1}.component_source_minor.employer_cost == 2173913"
            - "FundingInstruction.${fi1}.component_source_minor.provider_fee == 163043"
            - "FundingInstruction.${fi1}.funded_source_minor == 9543206"
            - "FundingInstruction.${fi1}.funded_source_minor != 9543207 (the sum-then-convert order is rejected)"
            - "FundingInstruction.${fi1}.status == DRAFT"

      - name: penalty_tier_selected_from_uncapped_base_before_indemnity_cap
        grounds:
          - calculations.filing_penalty_allocation
          - entities.StatutoryFiling.fields.surcharge_minor
          - entities.StatutoryFiling.fields.provider_share_minor
          - entities.StatutoryFiling.fields.penalty_owner
          - entities.Provider.fields.indemnity_cap_pct
          - state_machines.StatutoryFiling.PENDING_to_LATE
        distinguishing_aspect: |
          Mode (c) evaluation-order instance, a different mode from the funding rounding
          instance: the surcharge tier is keyed on the uncapped base 70000 and therefore
          yields 7000, after which the 50000 indemnity cap clips only the provider's share.
          Selecting the tier from the capped 50000 would have yielded a 0 surcharge and a
          different total, so the order is observable in surcharge_minor.
        test_recipe:
          setup:
            - "CountryProfile FR with a single required filing type, statutory_filing_deadline_days 10 and penalty_daily_rate_minor 15000"
            - "Provider MicroPay SARL with annual_fee_minor 200000 and indemnity_cap_pct 25.00, so its indemnity cap is 50000 and open_penalty_minor is 0"
            - "ACTIVE Engagement for FR with filing_responsibility PROVIDER"
            - "PayrollCycle 2026-08 with pay_date 2026-08-31 in RESULTS_APPROVED, so its single PENDING filing is due 2026-09-10T23:59:59.999Z"
            - "logical clock advanced to 2026-09-13T12:00:00Z, which is 3 whole late days after the due instant"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "FR", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_fr: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "MicroPay SARL", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 200000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p2: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_fr}", provider_id: "${prov_p2}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_fr: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_fr}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-FR-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_fr}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { cf1: "$.data.id" }
