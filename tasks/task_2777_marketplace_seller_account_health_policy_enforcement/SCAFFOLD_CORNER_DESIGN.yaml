          the hold is created with the seller's OWN action id (the coherent counterpart of
          validation_hold_may_not_cite_another_sellers_action) and the enforcement_action_id filter on
          the list endpoint retrieves exactly that row. The action also supplies the hold posture —
          the seller is RESERVE_HELD because its enforcement dimension moved to WATCHLIST, with no
          investigation open at all.
        test_recipe:
