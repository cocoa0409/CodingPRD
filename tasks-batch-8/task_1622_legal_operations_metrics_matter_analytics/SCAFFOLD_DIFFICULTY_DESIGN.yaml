  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_conflict_on_invoice_pay
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_OVERRUN_EXCEEDED]
        distinguishing_aspect: |
          Pair (state, business_fiscal): a pay request where invoice is
          APPROVED->PAID precondition holds BUT the invoice would also overrun
          budget (overrun check). Inject an INVALID state by rejecting first
          (invoice moves to REJECTED — terminal) — now pay hits BOTH
          ERR_INVALID_STATE AND ERR_BUDGET_OVERRUN_EXCEEDED. Priority 4 (state)
          beats priority 13 (fiscal); ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Department default thresholds; FP OPEN; PA; MT; firm; counsel"
            - "Budget B allocated 1000000 (so invoice 1200000 would exceed 1.10 * alloc = 1100000)"
            - "Matter M ACTIVE; invoice INV amount 1200000 SUBMITTED then REJECTED (terminal)"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
