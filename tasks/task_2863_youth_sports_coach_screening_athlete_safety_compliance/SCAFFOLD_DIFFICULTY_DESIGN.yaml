  - rule_id: resource_temporal_overlap
    instances:
      - name: room_slot_half_open_adjacency_is_legal_one_minute_overlap_is_not
        grounds:
          - calculations.room_slot_overlap_check
          - validations[priority=15]
          - entities.RoomStay.fields.check_in
          - entities.RoomStay.fields.check_out
        distinguishing_aspect: |
          The room-slot resource uses HALF-OPEN intervals, so a minor-athlete stay whose check_in
          is exactly the adult stay's check_out shares the slot legally, while pulling the same
          check_in back by one minute makes the intervals intersect and trips the lodging-safety
          check. The two triggers differ only in the minute field of check_in, which isolates the
          `new.check_in < s.check_out` strict comparison.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' runs a minor-athlete program"
            - "member m_adj exists and has no InterimMeasure and is not DISQUALIFIED, so validations[priority=13] and [priority=14] pass for every room-stay write"
            - "slot (${club_a_id}, NATIONALS_2026, 301) holds exactly one BOOKED stay: occupant_kind ADULT_MEMBER over [2026-09-01T15:00:00Z, 2026-09-03T11:00:00Z)"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Nils Barrow", email: "nils.barrow@alpha.test", role_type: "CHAPERONE", has_minor_athlete_contact: true, date_of_birth: "1979-06-06", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_adj_id: $.data.id }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "ADULT_MEMBER", trip_label: "NATIONALS_2026", room_number: "301", check_in: "2026-09-01T15:00:00Z", check_out: "2026-09-03T11:00:00Z", member_id: "${m_adj_id}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_adult_id: $.data.id, rs_adult_status: $.data.status }
          trigger:
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "NATIONALS_2026", room_number: "301", check_in: "2026-09-03T11:00:00Z", check_out: "2026-09-05T11:00:00Z", minor_athlete_age: 15 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_touch_id: $.data.id, rs_touch_status: $.data.status, rs_touch_in: $.data.check_in }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "MINOR_ATHLETE", trip_label: "NATIONALS_2026", room_number: "301", check_in: "2026-09-03T10:59:00Z", check_out: "2026-09-03T11:00:00Z", minor_athlete_age: 16 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_overlap_error: $.data.error_id }
          assert:
            - "${rs_adult_status} == BOOKED"
            - "${rs_touch_status} == BOOKED"
            - "${rs_touch_in} == 2026-09-03T11:00:00.000Z"
            - "RoomStay.${rs_touch_id}.occupant_kind == MINOR_ATHLETE"
            - "${rs_overlap_error} == ERR_MINOR_ADULT_LODGING_PROHIBITED"
            - "RoomStay.${rs_adult_id}.status == BOOKED"
      - name: interim_measure_window_closed_buffer_end_is_still_a_conflict
        grounds:
          - calculations.measure_window_conflict_check
          - validations[priority=19]
          - entities.InterimMeasure.fields.effective_from
          - entities.InterimMeasure.fields.effective_to
        distinguishing_aspect: |
          The measure resource uses CLOSED intervals plus a 14-day trailing cooling buffer, the
          exact opposite convention from the room slot above: an existing ACTIVE measure ending
          2026-09-05 blocks through 2026-09-19 inclusive, so a new measure starting exactly on
          2026-09-19 conflicts while one starting 2026-09-20 is accepted. Same-kind matching is
          also exercised, since only NO_CONTACT_DIRECTIVE rows participate.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists and member m_mw exists on it"
            - "investigating body body_mw accepts PHYSICAL_ABUSE and case_mw for m_mw has been routed to it, so measures may be imposed"
            - "one ACTIVE InterimMeasure of kind NO_CONTACT_DIRECTIVE exists on m_mw over [2026-08-05T00:00:00Z, 2026-09-05T00:00:00Z], imposed by so_impose"
            - "MEASURE_COOLING_BUFFER_DAYS is 14, so the blocked window ends 2026-09-19T00:00:00Z inclusive"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Tess Okoro", email: "tess.okoro@alpha.test", role_type: "OFFICIAL", has_minor_athlete_contact: true, date_of_birth: "1984-07-07", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_mw_id: $.data.id, mv_mw_1: $.data.version }
            - call: "POST /safesport/investigating-bodies"
              payload: { name: "Center for SafeSport", scope_categories: ["PHYSICAL_ABUSE"], max_open_cases: 5, intake_status: "ACCEPTING" }
              as: NgbAdmin
              captures: { body_mw_id: $.data.id }
            - call: "POST /safesport/cases"
              payload: { club_id: "${club_a_id}", reported_member_id: "${m_mw_id}", allegation_category: "PHYSICAL_ABUSE", reporter_kind: "MANDATORY_REPORTER", narrative: "conduct reported during a travel meet", occurred_at: "2026-07-31T22:00:00Z" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
              captures: { case_mw_id: $.data.id }
            - call: "POST /safesport/cases/${case_mw_id}/route"
              payload: { investigating_body_id: "${body_mw_id}" }
              as: SafeSportOfficer
              as_user_id: "so_intake"
            - call: "POST /safesport/cases/${case_mw_id}/interim-measures"
              payload: { member_id: "${m_mw_id}", measure_kind: "NO_CONTACT_DIRECTIVE", effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-09-05T00:00:00Z", expected_member_version: "${mv_mw_1}" }
              as: SafeSportOfficer
              as_user_id: "so_impose"
              captures: { im_first_id: $.data.id, im_first_status: $.data.status, im_first_to: $.data.effective_to }
            - call: "GET /safesport/members/${m_mw_id}"
              payload: {}
              as: SafeSportOfficer
              captures: { mv_mw_2: $.data.version }
          trigger:
            - call: "POST /safesport/cases/${case_mw_id}/interim-measures"
              payload: { member_id: "${m_mw_id}", measure_kind: "NO_CONTACT_DIRECTIVE", effective_from: "2026-09-19T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_member_version: "${mv_mw_2}" }
              as: SafeSportOfficer
              as_user_id: "so_impose"
              captures: { im_conflict_error: $.data.error_id }
            - call: "GET /safesport/members/${m_mw_id}"
              payload: {}
              as: SafeSportOfficer
              captures: { mv_mw_3: $.data.version }
            - call: "POST /safesport/cases/${case_mw_id}/interim-measures"
              payload: { member_id: "${m_mw_id}", measure_kind: "NO_CONTACT_DIRECTIVE", effective_from: "2026-09-20T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_member_version: "${mv_mw_3}" }
              as: SafeSportOfficer
              as_user_id: "so_impose"
              captures: { im_second_id: $.data.id, im_second_status: $.data.status, im_second_from: $.data.effective_from }
          assert:
            - "${im_first_status} == ACTIVE"
            - "${im_first_to} == 2026-09-05T00:00:00.000Z"
            - "${mv_mw_2} == ${mv_mw_3}"
            - "${im_conflict_error} == ERR_MEASURE_WINDOW_CONFLICT"
            - "${im_second_status} == ACTIVE"
            - "${im_second_from} == 2026-09-20T00:00:00.000Z"
            - "InterimMeasure.${im_first_id}.status == ACTIVE"
            - "InterimMeasure.${im_second_id}.permanence == TEMPORARY"

  - rule_id: compensating_invariant
    instances:
      - name: escrow_conservation_across_screening_order_and_void
        grounds:
          - calculations.escrow_conservation_invariant
          - calculations.screening_order_charge
          - state_machines.ScreeningOrder.ORDERED_to_VOIDED
          - entities.Club.fields.escrow_balance_cents
          - entities.Club.fields.total_funded_cents
        distinguishing_aspect: |
          The conserved quantity is money: escrow_balance_cents plus the charged_cents of every
          non-VOIDED order must always equal total_funded_cents. Ordering an expedited TIER_3
          screen moves 14621 cents out of escrow and the compensating void moves exactly the same
          14621 back, while the order row KEEPS its charged_cents and only leaves the sum by way
          of its VOIDED status - so the identity holds at all three observation points and
          total_funded_cents never moves.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and total_funded_cents 500000 and no screening orders"
            - "member m_esc is a HEAD_COACH with minor-athlete contact and three jurisdictions, so risk_points 75 and required_tier TIER_3"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version, escrow_start: $.data.escrow_balance_cents, funded_start: $.data.total_funded_cents }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Ivo Sandoval", email: "ivo.sandoval@alpha.test", role_type: "HEAD_COACH", has_minor_athlete_contact: true, date_of_birth: "1983-08-08", jurisdiction_codes: ["CA", "NV", "OR"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_esc_id: $.data.id, esc_tier: $.data.required_tier }
          trigger:
            - call: "POST /safesport/members/${m_esc_id}/screening-orders"
              payload: { expedited: true, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_esc_id: $.data.id, esc_gross: $.data.gross_subtotal_cents, esc_disc: $.data.discount_cents, esc_exp: $.data.expedite_cents, esc_charged: $.data.charged_cents }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { escrow_after_order: $.data.escrow_balance_cents, funded_after_order: $.data.total_funded_cents }
            - call: "POST /safesport/screening-orders/${so_esc_id}/void"
              payload: { reason: "ordered against the wrong tier snapshot" }
              as: NgbAdmin
              captures: { void_status: $.data.status, void_charged: $.data.charged_cents }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { escrow_after_void: $.data.escrow_balance_cents, funded_after_void: $.data.total_funded_cents }
            - call: "GET /safesport/members/${m_esc_id}"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { esc_screen_after_void: $.data.screening_status }
          assert:
            - "${esc_tier} == TIER_3"
            - "${escrow_start} == 500000"
            - "${funded_start} == 500000"
            - "${esc_gross} == 11400"
            - "${esc_disc} == 570"
            - "${esc_exp} == 3791"
            - "${esc_charged} == 14621"
            - "${escrow_after_order} == 485379"
            - "${funded_after_order} == 500000"
            - "${void_status} == VOIDED"
            - "${void_charged} == 14621"
            - "${escrow_after_void} == 500000"
            - "${funded_after_void} == 500000"
            - "${esc_screen_after_void} == UNSCREENED"
            - "Club.${club_a_id}.escrow_balance_cents == 500000"
            - "ScreeningOrder.${so_esc_id}.charged_cents == 14621"
      - name: finding_partition_conserved_across_remediation_reject_cycle
        grounds:
          - calculations.finding_partition_invariant
          - state_machines.AuditFinding.OPEN_to_REMEDIATED
          - state_machines.AuditFinding.REMEDIATED_to_OPEN
          - validations[priority=26]
          - entities.ClubAudit.fields.open_finding_count
        distinguishing_aspect: |
          The conserved quantity here is set cardinality, not money, and the compensation is
          performed by a DIFFERENT role than the forward move: ClubAdministrator submits the
          remediation (OPEN -> REMEDIATED) and ComplianceAuditor rejects it (REMEDIATED -> OPEN),
          restoring open_finding_count and remediated_finding_count exactly. A third, terminal
          WAIVED move on a sibling finding proves the invariant still balances when one unit has
          left the compensable pair for good.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with roster_size_attested 3 exists and member m_fp is on it"
            - "audit audit_fp covers the club with score_variant SELF_ATTESTED and sampled_member_ids [m_fp]"
            - "audit_fp carries three OPEN findings f1 (MINOR), f2 (MAJOR) and f3 (MINOR, is_repeat true), none of them CRITICAL"
            - "audit_fp has been finalized, so its status is FINDINGS_ISSUED and decisions are permitted"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Lena Ostrow", email: "lena.ostrow@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1991-09-09", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_fp_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_fp_id}"] }
              as: ComplianceAuditor
              captures: { audit_fp_id: $.data.id, fp_total_0: $.data.finding_total_count, fp_open_0: $.data.open_finding_count }
            - call: "POST /safesport/club-audits/${audit_fp_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", member_id: "${m_fp_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f1_id: $.data.id, f1_status_0: $.data.status }
            - call: "POST /safesport/club-audits/${audit_fp_id}/findings"
              payload: { finding_code: "TRAINING_OVERDUE", severity: "MAJOR", member_id: "${m_fp_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f2_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_fp_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: true }
              as: ComplianceAuditor
              captures: { f3_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_fp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { fp_status: $.data.status, fp_total_1: $.data.finding_total_count, fp_open_1: $.data.open_finding_count, fp_rem_1: $.data.remediated_finding_count, fp_waived_1: $.data.waived_finding_count }
          trigger:
            - call: "POST /safesport/audit-findings/${f1_id}/decision"
              payload: { decision: "REMEDIATION_SUBMITTED", note: "screening records back-filled and attached" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { f1_after_submit: $.data.status }
            - call: "POST /safesport/audit-findings/${f1_id}/decision"
              payload: { decision: "REMEDIATION_REJECTED", note: "attachments do not cover the audit period" }
              as: ComplianceAuditor
              captures: { f1_after_reject: $.data.status }
            - call: "POST /safesport/audit-findings/${f2_id}/decision"
              payload: { decision: "WAIVED", note: "training gap already cured before the period closed" }
              as: ComplianceAuditor
              captures: { f2_after_waive: $.data.status }
          assert:
            - "${fp_total_0} == 0"
            - "${fp_open_0} == 0"
            - "${f1_status_0} == OPEN"
            - "${fp_status} == FINDINGS_ISSUED"
            - "${fp_total_1} == 3"
            - "${fp_open_1} == 3"
            - "${fp_rem_1} == 0"
            - "${fp_waived_1} == 0"
            - "${f1_after_submit} == REMEDIATED"
            - "${f1_after_reject} == OPEN"
            - "${f2_after_waive} == WAIVED"
            - "AuditFinding.${f3_id}.status == OPEN"
            - "ClubAudit.${audit_fp_id}.finding_total_count == 3"
            - "ClubAudit.${audit_fp_id}.open_finding_count == 2"
            - "ClubAudit.${audit_fp_id}.remediated_finding_count == 0"
            - "ClubAudit.${audit_fp_id}.waived_finding_count == 1"
