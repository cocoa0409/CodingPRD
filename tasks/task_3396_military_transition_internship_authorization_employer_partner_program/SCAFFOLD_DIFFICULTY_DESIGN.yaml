  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_match_create
        grounds:
          - validations[priority=10]
          - validations[priority=16]
        distinguishing_aspect: |
          Category pair state vs business_temporal: one request that violates
          both (application never decided AND duration exceeds the separation
          headroom) must surface the state error ERR_APPLICATION_NOT_APPROVED
          (priority 10), not ERR_DURATION_EXCEEDS_POLICY (priority 16).
