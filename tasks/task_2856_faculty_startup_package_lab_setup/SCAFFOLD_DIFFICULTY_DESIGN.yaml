  # =========================================================================
  # Rule 8 - resource/temporal overlap under two opposite interval conventions
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lab_space_share_over_half_open_occupancy_windows
        grounds:
          - calculations.space_share_utilization
          - validations.priority_25_ERR_SPACE_SHARE_EXCEEDED
          - entities.LabSpace.fields.allocated_share_pct
          - entities.SpaceAssignment.fields.effective_to
        distinguishing_aspect: |
          Resource: LabSpace, contended by SpaceAssignment rows under HALF-OPEN semantics
          [effective_from, effective_to) with null meaning +infinity. Two windows that merely touch
          at 2026-10-01 must NOT count as overlapping, so a room can be handed over on the day; a
          window nested inside an existing one must, and the overlapping-peer sum must accept
          exactly 100 while rejecting 110. The room's allocated_share_pct is instead the share held
          at the clock instant, so the same three coexisting rows totalling 160 percentage points
          leave the room reading exactly 60 at 2026-08-01T00:00:00Z - the two quantities must not
          be conflated.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, a college and a department funding unit, and one DRY room registered AVAILABLE with allocated_share_pct 0."
            - "Two faculty rows, both left CANDIDATE with no startup package at all, so no spend rule can interfere and only the interval algebra is under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col14_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col14_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept14_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${dept14_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac14_a: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Iris Novak", rank: "ASSOCIATE", funding_unit_id: "${dept14_id}", planned_start_date: "2026-10-01" }
              as: DeanOffice
              captures: { fac14_b: $.data.id }
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "220", net_sq_ft: 800, space_class: "DRY", power_kw_capacity: 90.00, chilled_water_available: false, fume_hood_count: 0, floor_load_psf: 200 }
              as: FacilitiesManager
              captures: { space14_id: $.data.id }
            - call: "GET /lab-spaces/${space14_id}"
              payload: {}
              as: DeanOffice
              captures: { sv14_1: $.data.version }
          trigger:
            - call: "POST /space-assignments"
              payload: { space_id: "${space14_id}", faculty_id: "${fac14_a}", share_pct: 60, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_space_version: "${sv14_1}" }
              as: DeanOffice
              expect: "201"
              captures: { asg14_1: $.data.id }
            - call: "GET /lab-spaces/${space14_id}"
              payload: {}
              as: DeanOffice
              captures: { sv14_2: $.data.version }
            - call: "POST /space-assignments"
              payload: { space_id: "${space14_id}", faculty_id: "${fac14_b}", share_pct: 60, effective_from: "2026-10-01T00:00:00Z", expected_space_version: "${sv14_2}" }
              as: DeanOffice
              expect: "201"
              captures: { asg14_2: $.data.id }
            - call: "GET /lab-spaces/${space14_id}"
              payload: {}
              as: DeanOffice
              captures: { sv14_3: $.data.version }
            - call: "POST /space-assignments"
              payload: { space_id: "${space14_id}", faculty_id: "${fac14_b}", share_pct: 50, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-15T00:00:00Z", expected_space_version: "${sv14_3}" }
              as: DeanOffice
              expect: "422 ERR_SPACE_SHARE_EXCEEDED"
            - call: "GET /lab-spaces/${space14_id}"
              payload: {}
              as: DeanOffice
              captures: { sv14_4: $.data.version }
            - call: "POST /space-assignments"
              payload: { space_id: "${space14_id}", faculty_id: "${fac14_b}", share_pct: 40, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-15T00:00:00Z", expected_space_version: "${sv14_4}" }
              as: DeanOffice
              expect: "201"
              captures: { asg14_3: $.data.id }
            - call: "POST /space-assignments/${asg14_1}/activate"
              payload: {}
              as: FacilitiesManager
              expect: "200"
          assert:
            - "touching windows do not overlap: the second create returns 201 because [2026-08-01, 2026-10-01) and [2026-10-01, +inf) share no instant, even though 60 + 60 == 120"
            - "a nested window does overlap: the 50 pct request over [2026-09-01, 2026-09-15) returns 422 ERR_SPACE_SHARE_EXCEEDED because its only peer is the 60 pct row and 110 > 100"
            - "the boundary sum is accepted: the identical window at 40 pct returns 201 because 60 + 40 == 100 exactly"
            - "PROPOSED rows hold share: all three surviving assignments are PROPOSED, yet the 50 pct request was still refused, so an implementation that only counts ACTIVE rows wrongly accepts it"
            - "LabSpace.${space14_id}.allocated_share_pct == 60 - the share held AT the clock 2026-08-01T00:00:00Z, which only the first window contains - not 160, the sum of the three shares, and not 100, the peak reached during [2026-09-01, 2026-09-15)"
            - "no SpaceAssignment row exists for the refused request and exactly three rows exist on the room"
            - "after activating the first assignment: SpaceAssignment.${asg14_1}.status == ACTIVE, LabSpace.${space14_id}.status == ASSIGNED and allocated_share_pct is still 60"
            - "the two observables must not be conflated: the 50 pct request was refused while allocated_share_pct read only 60, because the overlap test compares WINDOWS against the candidate and not the clock instant - an implementation that gates on allocated_share_pct wrongly accepts it"
            - "SpaceAssignment.${asg14_2}.effective_to == null is treated as +infinity, so any later request starting on or after 2026-10-01 must contend with its 60 pct"

      - name: renovation_phase_windows_as_closed_intervals_with_changeover_buffer
        grounds:
          - calculations.renovation_phase_sequencing
          - validations.priority_26_ERR_PHASE_WINDOW_OVERLAP
          - validations.priority_27_ERR_PHASE_BUFFER_VIOLATION
          - constants.PHASE_BUFFER_DAYS
        distinguishing_aspect: |
          The same task's OTHER interval convention on a different contended resource: a
          RenovationProject's construction sequence occupies the room in CLOSED intervals
          [planned_start, planned_end], the deliberate opposite of the space-assignment convention,
          and adds a PHASE_BUFFER_DAYS changeover gap on top. Consequently the date 2026-09-30 that
          would be a legal hand-over instant for an occupancy window is an overlap here, and even
          2026-10-01 - disjoint under any closed-interval test - is refused for a 1-day gap, while
          exactly 2 days is accepted. Two adjacent rejections with two different error_ids on the
          same pair of dates is what no single-convention implementation reproduces.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; college, department and dean-office units; an ACTIVE faculty member with a minimal ACTIVE package of 12_000_000 carried by a single RENOVATION tranche."
