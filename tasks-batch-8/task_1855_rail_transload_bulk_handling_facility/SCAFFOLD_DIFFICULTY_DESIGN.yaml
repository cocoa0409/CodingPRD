            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "40002", quantity_loaded_tons: 10.0 }, as: YardMaster, captures: { carB: $.data.id } }
            - { call: "POST /transload/railcars/${carA}/arrive", payload: {}, as: YardMaster, captures: { carA_v: $.data.version } }
            - { call: "POST /transload/railcars/${carB}/arrive", payload: {}, as: YardMaster, captures: { carB_v: $.data.version } }
            - { call: "POST /transload/railcars/${carA}/spot-orders", payload: { expected_railcar_version: "${carA_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: YardMaster, captures: { soA: $.data.id } }
            - { call: "POST /transload/spot-orders/${soA}/schedule", payload: {}, as: YardMaster, captures: { swA: $.data.switch_order_id } }
            - { call: "POST /transload/railcars/${carB}/spot-orders", payload: { expected_railcar_version: "${carB_v}", track_id: "${trk}", spot_number: 2, window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T13:00:00Z" }, as: YardMaster, captures: { soB: $.data.id } }
            - { call: "POST /transload/spot-orders/${soB}/schedule", payload: {}, as: YardMaster, captures: { swB: $.data.switch_order_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${soA}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${carA}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { toA: $.data.id } }
            - { call: "POST /transload/transfer-orders/${toA}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${toA}/weight-tickets", payload: { truck_reference: "TRK-1", gross_weight_tons: 24.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wtA: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wtA}/certify", payload: {}, as: TransferOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:30:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /transload/railcars/${carA}/release", payload: {}, as: YardMaster }
            - { call: "GET /transload/switch-orders/${swA}", payload: {}, as: YardMaster, captures: { swA_fee: $.data.fee_cents, swA_seq: $.data.sequence_number, swA_st: $.data.status } }
            - { call: "GET /transload/switch-orders/${swB}", payload: {}, as: YardMaster, captures: { swB_fee: $.data.fee_cents, swB_seq: $.data.sequence_number } }
            - { call: "GET /transload/switch-orders?railcar_id=${carA}", payload: {}, as: YardMaster, captures: { pull_fee: "$.data[1].fee_cents", pull_seq: "$.data[1].sequence_number", pull_type: "$.data[1].move_type" } }
          assert:
            - "SW(A spot) sequence_number == 1 and fee_cents == 0 (inside free allowance) and status == COMPLETED after execute"
            - "SW(B spot) sequence_number == 2 and fee_cents == 18500 (BASE_SPOT_FEE)"
            - "car A's PULL move: move_type == PULL, sequence_number == 3, fee_cents == 20500 (BASE_PULL_FEE); its window [2026-08-03T13:30Z, 2026-08-03T14:00Z) clears SW(B)'s buffer by exactly 30 minutes"
            - "evaluation order proof: the PULL move's own sequence (3) never counted toward its prior count (2 existing moves)"
      - name: demurrage_tiered_hazard_credit_straddle
        grounds:
          - calculations.demurrage_accrual
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: billable_days selects
          marginal tiers (3 days at 7500 + 2 days at 15000 = 52500) then branches
          on product hazard (x1.5) — a 5-day HAZARDOUS car released 168h after
          constructive placement yields 78750, distinct from both the flat-rate
          (5 x 15000 = 75000) and non-hazard (52500) readings.
        test_recipe:
          setup:
            - "Facility default; customer GOOD CONSTRUCTIVE; HAZARDOUS product (clean=false); lot; track cap 1; car (5.0 t) arrived 2026-08-03T00:00Z, spotted 2026-08-03T10:30Z, fully transferred, READY_FOR_RELEASE; clock 2026-08-10T00:00Z (elapsed exactly 168h = 10080 min -> billable 7200 min -> 5 days)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-TIER" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "G1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Benzene", hazard_class: "HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "50001", quantity_loaded_tons: 5.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 5.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-9", gross_weight_tons: 19.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wt}/certify", payload: {}, as: TransferOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /transload/railcars/${car}/release", payload: {}, as: YardMaster, captures: { rel_days: $.data.demurrage_billable_days, rel_cents: $.data.demurrage_accrued_cents } }
            - { call: "GET /transload/charges?railcar_id=${car}&charge_type=DEMURRAGE", payload: {}, as: BillingClerk, captures: { dem_amt: "$.data[0].amount_cents", dem_qty: "$.data[0].quantity" } }
          assert:
            - "Railcar.demurrage_billable_days == 5 and demurrage_accrued_cents == 78750 after release"
            - "DEMURRAGE ChargeEntry quantity == 5 and amount_cents == 78750 ((3*7500 + 2*15000) * 1.5 hazard * 1.0 credit)"
            - "straddle proof: days 1-3 priced at 7500 and days 4-5 at 15000 (marginal), not a flat tier rate"
  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: railcar_spot_transfer_cycle
        grounds:
          - state_machines.Railcar.SPOTTED_to_IN_TRANSFER
          - state_machines.Railcar.IN_TRANSFER_to_SPOTTED
          - state_machines.TransferOrder.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Railcar placement_status cycles SPOTTED -> IN_TRANSFER -> SPOTTED ->
          IN_TRANSFER as the transfer order activates, pauses, and re-activates —
          a true cycle (not a pipeline) on the Railcar entity.
        test_recipe:
          setup:
            - "Facility; customer; NON_HAZARDOUS clean=false product; lot; track cap 1; equipment; car (80.0 t) ARRIVED then SPOTTED via executed spot order; transfer order planned 40.0 t."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-CYC" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "60001", quantity_loaded_tons: 80.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 40.0 }, as: TransferOperator, captures: { to: $.data.id } }
          trigger:
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { st1: $.data.placement_status } }
            - { call: "POST /transload/transfer-orders/${to}/pause", payload: {}, as: TransferOperator }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { st2: $.data.placement_status } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator, captures: { to_st: $.data.status } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { st3: $.data.placement_status } }
          assert:
            - "after first activate: Railcar.placement_status == IN_TRANSFER and TransferOrder.status == ACTIVE"
            - "after pause: Railcar.placement_status == SPOTTED and TransferOrder.status == PAUSED and Equipment.status == AVAILABLE"
            - "after second activate: Railcar.placement_status == IN_TRANSFER and TransferOrder.status == ACTIVE (cycle completed)"
      - name: equipment_use_clean_cycle
        grounds:
          - state_machines.Equipment.AVAILABLE_to_IN_USE
          - state_machines.Equipment.IN_USE_to_AVAILABLE
          - state_machines.Equipment.AVAILABLE_to_CLEANING
          - state_machines.Equipment.CLEANING_to_AVAILABLE
        distinguishing_aspect: |
          Equipment (different entity than Railcar) cycles AVAILABLE -> IN_USE ->
          AVAILABLE -> CLEANING -> AVAILABLE, with last_product_id set to the
          lading product on use and cleared to null only by finish-cleaning.
        test_recipe:
          setup:
            - "Facility (STRICT_MATRIX); customer; product CHEM (clean=false); lot; track cap 1; equipment EQ; car (30.0 t) SPOTTED; transfer order planned 10.0 t."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-EQC" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Solvent", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "60002", quantity_loaded_tons: 30.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { to: $.data.id } }
          trigger:
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "GET /transload/equipment/${eq}", payload: {}, as: TransferOperator, captures: { eq_st1: $.data.status, eq_lp1: $.data.last_product_id } }
            - { call: "POST /transload/transfer-orders/${to}/pause", payload: {}, as: TransferOperator }
            - { call: "GET /transload/equipment/${eq}", payload: {}, as: TransferOperator, captures: { eq_st2: $.data.status, eq_lp2: $.data.last_product_id } }
            - { call: "POST /transload/equipment/${eq}/start-cleaning", payload: {}, as: TransferOperator, captures: { eq_st3: $.data.status } }
            - { call: "POST /transload/equipment/${eq}/finish-cleaning", payload: {}, as: TransferOperator, captures: { eq_st4: $.data.status, eq_lp4: $.data.last_product_id } }
          assert:
            - "after activate: Equipment.status == IN_USE and last_product_id == ${prod}"
            - "after pause: Equipment.status == AVAILABLE and last_product_id still == ${prod} (provenance persists)"
            - "after start-cleaning: Equipment.status == CLEANING"
            - "after finish-cleaning: Equipment.status == AVAILABLE and last_product_id == null (cycle closed, provenance cleared)"
  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_suspend_cascade_depth3
        grounds:
          - calculations.safety_posture
          - state_machines.TransferOrder.ACTIVE_to_SUSPENDED
          - state_machines.TransferOrder.SUSPENDED_to_ACTIVE
          - state_machines.SafetyIncident.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Trigger = incident creation (different from ticket certification):
          SafetyIncident create -> Facility.safety_posture recomputed to
          SUSPENDED (link 1) -> the posture change itself suspends the ACTIVE
          TransferOrder (link 2) -> that suspension releases Equipment to
          AVAILABLE and pauses the Railcar to SPOTTED (link 3); resolve walks
          the chain in reverse (resume cascade).
        test_recipe:
          setup:
            - "Facility; customer; clean=false product; lot; track cap 1; equipment EQ; car SPOTTED with an ACTIVE transfer order (equipment IN_USE, car IN_TRANSFER)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-CASC" }, as: FacilityAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "70001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 20.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
          trigger:
            - { call: "POST /transload/incidents", payload: { severity: "CRITICAL", description: "Derail on lead" }, as: SafetyOfficer, captures: { inc: $.data.id } }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { post1: $.data.safety_posture, open1: $.data.open_incident_count } }
            - { call: "GET /transload/transfer-orders/${to}", payload: {}, as: SafetyOfficer, captures: { to_st1: $.data.status } }
            - { call: "GET /transload/equipment/${eq}", payload: {}, as: SafetyOfficer, captures: { eq_st1: $.data.status } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: SafetyOfficer, captures: { car_st1: $.data.placement_status } }
            - { call: "POST /transload/incidents/${inc}/resolve", payload: {}, as: SafetyOfficer }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { post2: $.data.safety_posture } }
            - { call: "GET /transload/transfer-orders/${to}", payload: {}, as: SafetyOfficer, captures: { to_st2: $.data.status } }
            - { call: "GET /transload/equipment/${eq}", payload: {}, as: SafetyOfficer, captures: { eq_st2: $.data.status } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: SafetyOfficer, captures: { car_st2: $.data.placement_status } }
          assert:
            - "after CRITICAL incident: Facility.safety_posture == SUSPENDED and open_incident_count == 1"
            - "cascade: TransferOrder.status == SUSPENDED, Equipment.status == AVAILABLE, Railcar.placement_status == SPOTTED"
            - "after resolve: Facility.safety_posture == NORMAL; resume cascade: TransferOrder.status == ACTIVE, Equipment.status == IN_USE, Railcar.placement_status == IN_TRANSFER"
      - name: certify_autocomplete_cascade_depth3
        grounds:
          - state_machines.WeightTicket.DRAFT_to_CERTIFIED
          - state_machines.TransferOrder.ACTIVE_to_COMPLETED
          - state_machines.Railcar.IN_TRANSFER_to_EMPTY_AWAITING_CLEANING
          - state_machines.Railcar.EMPTY_AWAITING_CLEANING_to_READY_FOR_RELEASE
        distinguishing_aspect: |
          Trigger = ticket certification (different from incident creation):
          certify -> TransferOrder.quantity_completed_tons recompute crosses the
          planned threshold (link 1) -> the crossing itself auto-completes the
          order and releases Equipment (link 2) -> the completion empties the
          Railcar to EMPTY_AWAITING_CLEANING, which itself auto-advances to
          READY_FOR_RELEASE because requires_full_clean == false (link 3/4).
        test_recipe:
          setup:
            - "Facility; customer; NON_HAZARDOUS product with requires_full_clean=false; lot; track cap 1; equipment; car (20.0 t) SPOTTED; transfer order planned 20.0 t ACTIVE; DRAFT ticket net 20.000 (gross 34.000, tare 14.000, max 40.000)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-AUTO" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
