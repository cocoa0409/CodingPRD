      - name: each_origin_jurisdiction_converts_through_its_own_hour_length_and_category_map
        claim_type: constants_applied
        grounds:
          - calculations.reciprocity_credit_conversion
          - domain_constants.ORIGIN_HOUR_MINUTES
          - domain_constants.ORIGIN_CATEGORY_MAP
          - state_machines.ReciprocityClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: "A reciprocity hour is not 60 minutes everywhere: New York and Florida hours are 50 minutes, so 2.0 NY hours convert to floor(100/15)*15 = 90 minutes and 1.5 FL hours to 75, while 2.0 TX hours convert to a flat 120. The origin category is translated through ORIGIN_CATEGORY_MAP, so PROFESSIONALISM lands in ETHICS and DIVERSITY_INCLUSION in BIAS_ELIMINATION — categories the home board recognises but the origin name does not."
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One attorney whose principal office is in the home jurisdiction ST, with a non-prorated 2026-01-01 -> 2028-01-01 cycle and no in-state credit at all."
            - "Three sequential claims, each re-reading Attorney.version because every filing advances it."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2210", full_name: "Multi Jurisdiction Practitioner", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
