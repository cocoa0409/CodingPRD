  - rule_id: transitive_cascade
    instances:
      - name: appeal_denial_five_hop_litigation_cascade
        grounds:
          - state_machines.Appeal.FILED_to_DENIED
          - state_machines.RecordsRequest.APPEAL_FILED_to_LITIGATION_AUTHORIZED
          - calculations.desk_security_posture
          - state_machines.Investigation.to_HOLD_LEGAL_REVIEW
          - state_machines.EnclaveSession.BOOKED_to_CANCELLED
          - calculations.desk_fee_budget_ledger
        distinguishing_aspect: |
          A single appeal decision propagates across FIVE entity types that the request body never
          mentions: Appeal -> RecordsRequest -> Desk (litigation_exposure_count, then a recomputed
          security_posture) -> Investigation (reached only by joining Dataset.request_id to
          Dataset.investigation_id) -> EnclaveSession (reached only through that Investigation's
          Datasets). An implementation that stops at hop 3 leaves the Investigation in ANALYSIS and the
          session BOOKED with SecureEnclave.booked_session_count 1, which this instance detects.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk (fee_budget_total_cents 500000, retention_policy_days 1095), one Agency with appeal_venue OMBUDS and appeal_decision_days 20."
            - "One RecordsRequest submitted, fee-determined at net 5250, then RELEASED_PARTIAL (so 5250 has settled from committed to spent)."
            - "One Investigation in ANALYSIS whose single CLEAN_LOCKED Dataset is sourced from that request."
            - "One SecureEnclave with one BOOKED EnclaveSession on that dataset spanning [2026-08-20T09:00:00Z, 2026-08-20T11:00:00Z)."
            - "One Appeal FILED on the PARTIAL_RELEASE ground with filing_fee_cents 4500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
