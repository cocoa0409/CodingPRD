              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "EligibilityDetermination.${det1_id}.notice_status == MISSING and status == ELIGIBLE"
            - "the first approval responds 422 with data.error_id == ERR_UA_NOTICE_MISSING"
            - "EligibilityDetermination.${det2_id}.notice_status == CURRENT"
            - "the second approval responds 200 and ContributionElection.${el_id}.state == EFFECTIVE"

