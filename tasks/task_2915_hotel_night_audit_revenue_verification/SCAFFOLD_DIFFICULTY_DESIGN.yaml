  - rule_id: resource_temporal_overlap
    instances:

      - name: authorization_document_closed_interval_rejects_touching_endpoints
        grounds: "§1.4 priority 77 ERR_AUTHORIZATION_INTERVAL_OVERLAP ('because both endpoints are inclusive, two documents that merely touch ... DO overlap'); §1.1 AuthorizationDocument.valid_from_date and .valid_to_date."
        distinguishing_aspect: >-
          A CLOSED inclusive interval on whole calendar dates, scoped by the (folio_id, doc_type)
          pair, where adjacency is a conflict. PENDING as well as ACTIVE documents occupy the
          interval, so paperwork nobody has reviewed yet still blocks. This is the opposite
          adjacency semantics from the settlement-shift instance below.
        test_recipe:
          setup: "Standard property; business date 2026-08-01; one COMP folio; an ACTIVE COMP_ROOM document covering 2026-08-01 to 2026-08-03, filed by FrontDeskAgent u_fd_1 and reviewed APPROVE by RevenueManager u_rm_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-IVL1", guest_name: "Yun Kade", room_number: "1301", nights_count: 3, contracted_rate_amount: 200.00, rate_plan_code: "COMP", market_segment: "COMP", settlement_method: "CASH", scheduled_checkout_at: "2026-08-04T11:00:00.000Z", is_comp: true }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_ivl_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents"
              payload: { property_id: "${prop_id}", doc_type: "COMP_ROOM", authorized_by_name: "V. Holt, GM", document_reference: "COMP-A", valid_from_date: "2026-08-01", valid_to_date: "2026-08-03", folio_id: "${folio_ivl_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { doc_a_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents/${doc_a_id}/review"
              payload: { decision: "APPROVE" }
              as: RevenueManager
              as_user_id: "u_rm_1"
          trigger: "POST /night-audit/authorization-documents with the same property_id, doc_type COMP_ROOM and folio_id ${folio_ivl_id}, document_reference COMP-B, valid_from_date 2026-08-03 and valid_to_date 2026-08-05 as FrontDeskAgent (X-User-ID u_fd_1) - a document that merely touches the first one on 2026-08-03."
          assert:
            - "The trigger fails with HTTP 409 and error code ERR_AUTHORIZATION_INTERVAL_OVERLAP, because [2026-08-01, 2026-08-03] and [2026-08-03, 2026-08-05] share the single day 2026-08-03."
            - "GET /night-audit/authorization-documents?folio_id=${folio_ivl_id}&doc_type=COMP_ROOM returns exactly one row, ${doc_a_id}."
            - "A follow-up filing with valid_from_date 2026-08-04 and valid_to_date 2026-08-06 returns 201 - a one-day gap is disjoint - and the list query then returns two rows."
            - "A filing for the same folio with doc_type RATE_OVERRIDE, authorized_rate_amount 200.00, valid_from_date 2026-08-01 and valid_to_date 2026-08-03 also returns 201, because the overlap scope is the (folio_id, doc_type) pair."
            - "That RATE_OVERRIDE document is left PENDING, and a second RATE_OVERRIDE filing for 2026-08-03 to 2026-08-04 still fails 409 ERR_AUTHORIZATION_INTERVAL_OVERLAP - a PENDING document occupies the interval."
            - "A filing with valid_from_date 2026-08-09 and valid_to_date 2026-08-08 fails 422 ERR_SHIFT_WINDOW_INVALID (priority 75) before the overlap check is reached."
            - "An implementation using half-open date comparison accepts the trigger and fails."

      - name: settlement_shift_half_open_window_allows_adjacent_shifts
        grounds: "§1.4 priority 76 ERR_SHIFT_WINDOW_OVERLAP ('two adjacent shifts where one ends at exactly the instant the next begins do not overlap and are both accepted'); §1.3 calculation settlement_reconciliation window semantics."
        distinguishing_aspect: >-
          A HALF-OPEN instant window scoped by the (outlet_id, business_date_id, tender_type)
          triple, where adjacency is explicitly legal - the exact inverse of the closed-interval
          document rule above. The scope also includes tender_type, so a credit-card shift may sit
          on top of a cash shift, and RECOUNT_REQUESTED batches vacate their window entirely.
        test_recipe:
          setup: "Standard property; one ACTIVE outlet; business date 2026-08-01; one CASH batch already declared over [2026-08-01T14:00:00.000Z, 2026-08-01T22:00:00.000Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T22:30:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "ROOM-SVC", outlet_name: "Room Service", outlet_type: "REMOTE_POS", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { rsvc_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${rsvc_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 100.00 }
              as: OutletManager
              as_user_id: "${rsvc_id}"
              captures: { batch_day_id: "$.data.id" }
          trigger: "POST /night-audit/settlement-batches for the same outlet, date and tender_type CASH with shift_start_at 2026-08-01T22:00:00.000Z, shift_end_at 2026-08-02T06:00:00.000Z and declared_amount 50.00 as OutletManager (X-User-ID ${rsvc_id}) - the night shift starting at the exact instant the evening shift ends."
          assert:
            - "The trigger returns 201 with status == DECLARED: [14:00, 22:00) and [22:00, 06:00) are adjacent, not overlapping, because the end instant belongs to the next window."
            - "GET /night-audit/settlement-batches?business_date_id=${bd1_id}&outlet_id=${rsvc_id} returns two rows."
            - "A further filing with shift_start_at 2026-08-01T21:59:59.999Z and shift_end_at 2026-08-01T23:00:00.000Z fails 409 ERR_SHIFT_WINDOW_OVERLAP - one millisecond of overlap is enough."
            - "A filing with tender_type CREDIT_CARD over exactly [2026-08-01T14:00:00.000Z, 2026-08-01T22:00:00.000Z) returns 201, because tender_type is part of the overlap scope."
            - "A filing with shift_start_at 2026-08-01T22:00:00.000Z and shift_end_at 2026-08-01T22:00:00.000Z fails 422 ERR_SHIFT_WINDOW_INVALID (priority 75), since the start must be strictly before the end."
            - "An implementation using inclusive end comparison rejects the trigger and fails."

  - rule_id: compensating_invariant
    instances:

      - name: allowance_reversal_restores_net_money_but_not_gross_totals
        grounds: "§1.5 POST /night-audit/allowances/{id}/reverse side effects; §1.3 calculation folio_balance ('reversing rows participate as ordinary signed rows rather than deleting their originals'); §1.1 Allowance.reverses_allowance_id."
        distinguishing_aspect: >-
          A money-carrying reversal whose invariant is deliberately partial: Folio.balance_amount
          and every BusinessDate revenue aggregate return to their exact pre-approval values, but
          charges_total_amount and credits_total_amount both grow, so settlement_status stays
          PARTIALLY_SETTLED rather than reverting to UNSETTLED. Nothing is deleted - the original
          row and the original allowance both persist in terminal states.
        test_recipe:
          setup: "Standard property; business date 2026-08-01 with benchmarks 400.00 and 520.00 in ROOM_POSTING; one CASH folio at rate 200.00 that received a 200.00 ROOM line and a 17.75 OCCUPANCY_TAX line, so before any allowance the folio reads charges 217.75 / credits 0.00 / balance 217.75 / UNSETTLED and the date reads room_night 200.00, adr 200.00, revpar 2.08, total 217.75; a 60.00 GUEST_DISPUTE allowance requested by FrontDeskAgent u_fd_1 is submitted and approved by NightAuditor u_na_2, moving the folio to 157.75 and the date to room_night 140.00 / adr 140.00 / revpar 1.46 / total 157.75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4, benchmark_calendar_room_revenue_amount: 400.00, benchmark_weekday_room_revenue_amount: 520.00 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-REV1", guest_name: "Zev Lund", room_number: "1401", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_rv_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_rv_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_rv_id}", business_date_id: "${bd1_id}", requested_amount: 60.00, reason_code: "GUEST_DISPUTE", narrative: "Rate disputed at the desk." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { alw_rv_id: "$.data.id" }
            - call: "POST /night-audit/allowances/${alw_rv_id}/submit"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/allowances/${alw_rv_id}/approve"
              payload: { approved_amount: 60.00 }
              as: NightAuditor
              as_user_id: "u_na_2"
          trigger: "POST /night-audit/allowances/${alw_rv_id}/reverse as RevenueManager (X-User-ID u_rm_1)."
          assert:
            - "The NET invariant holds exactly: GET /night-audit/folios/${folio_rv_id} returns balance_amount == 217.75, the pre-approval value to the cent."
            - "GET /night-audit/business-dates/${bd1_id} returns room_night_revenue_amount == 200.00, allowance_credit_amount == 0.00, room_revenue_amount == 200.00, tax_revenue_amount == 17.75, total_revenue_amount == 217.75, adr_amount == 200.00 and revpar_amount == 2.08 (round(200.00 / 96, 2)) - every aggregate back to its pre-approval value."
            - "The GROSS figures do NOT revert: the same folio read returns charges_total_amount == 277.75 (217.75 + 60.00) and credits_total_amount == -60.00, so settlement_status is PARTIALLY_SETTLED rather than the pre-approval UNSETTLED."
            - "Nothing is deleted: GET /night-audit/journal-postings?folio_id=${folio_rv_id}&charge_type=ALLOWANCE returns exactly two rows, one of -60.00 with reverses_posting_id == null and one of +60.00 whose reverses_posting_id names the first."
            - "GET /night-audit/allowances/${alw_rv_id} returns status == REVERSED with approved_amount still 60.00."
            - "GET /night-audit/allowances?reverses_allowance_id=${alw_rv_id} returns exactly one compensating allowance with status == POSTED, requested_amount == 60.00, approved_amount == 60.00 and reason_code == GUEST_DISPUTE."
            - "Reversing ${alw_rv_id} again fails 409 ERR_ALLOWANCE_NOT_POSTED, and reversing the compensating allowance fails 409 ERR_ALREADY_A_REVERSAL."
            - "An implementation that deletes the original line, or that also rewinds charges_total_amount to 217.75, fails."

      - name: outlet_ticket_void_restores_a_count_quantity_exactly
        grounds: "§1.5 POST /night-audit/outlet-tickets/{id}/void side effects; §1.1 BusinessDate.closed_outlet_ticket_count and .outlet_revenue_amount; §1.3 calculation outlet_ticket_total."
        distinguishing_aspect: >-
          The restored quantity is an integer COUNT, not money, so a naive decrement-by-one is
          indistinguishable from a correct recomputation only until the same ticket is voided
          twice. It also spans two aggregates at once (the outlet-revenue money and the ticket
          count) and drives the folio to SETTLED rather than back to its pre-close UNSETTLED,
          which is the mirror image of the allowance instance's partial invariant.
        test_recipe:
          setup: "Standard property; one ACTIVE outlet with requires_shift_settlement false; business date 2026-08-01 left OPEN; one in-house CASH folio at rate 200.00 with no room posting yet; a ROOM_CHARGE ticket at gross 128.00 charged to that folio and closed, giving service_charge 23.04, taxable_base 151.04, tax 9.44, discount 0.00 and total 160.48."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T20:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "STEAK", outlet_name: "Harbor Steakhouse", outlet_type: "FB_OUTLET", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { steak_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-VOID1", guest_name: "Ann Mora", room_number: "1501", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_vd_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_vd_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${steak_id}", business_date_id: "${bd1_id}", ticket_number: "S-001", gross_amount: 128.00, settlement_type: "ROOM_CHARGE", opened_at: "2026-08-01T19:00:00.000Z", room_charge_folio_id: "${folio_vd_id}" }
              as: OutletManager
              as_user_id: "${steak_id}"
              captures: { tk_void_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets/${tk_void_id}/close"
              payload: { transmitted_at: "2026-08-01T20:00:00.000Z" }
              as: OutletManager
              as_user_id: "${steak_id}"
          trigger: "POST /night-audit/outlet-tickets/${tk_void_id}/void as OutletManager (X-User-ID ${steak_id})."
          assert:
            - "The trigger response returns status == VOID, total_amount == 0.00 and a non-null voided_at of 2026-08-01T20:00:00.000Z."
            - "The COUNT invariant holds exactly: GET /night-audit/business-dates/${bd1_id} returns closed_outlet_ticket_count == 0, back to its pre-close value."
            - "The same read returns outlet_revenue_amount == 0.00 and total_revenue_amount == 0.00, both back to their pre-close values."
            - "Nothing is deleted: GET /night-audit/journal-postings?outlet_ticket_id=${tk_void_id} returns exactly two OUTLET_TRANSFER rows, +160.48 with reverses_posting_id == null and -160.48 whose reverses_posting_id names the first, both with source_channel == OUTLET_POS."
            - "GET /night-audit/folios/${folio_vd_id} returns balance_amount == 0.00 - the exact pre-close net - with charges_total_amount == 160.48 and credits_total_amount == -160.48, so settlement_status is SETTLED rather than the pre-close UNSETTLED."
            - "Voiding ${tk_void_id} again fails 409 ERR_TICKET_NOT_CLOSED, and closed_outlet_ticket_count stays 0 rather than going to -1 - which is what a blind decrement would produce."
            - "An implementation that recomputes total_amount instead of zeroing it, or that decrements the count without re-deriving it, fails."

      - name: one_sided_ledger_transfer_reversal_returns_control_total_to_zero
        grounds: "§1.3 calculation ledger_control ('the total stays 0.00 unless a client posts one leg on its own'); §1.4 priorities 49, 51 and 90; §1.5 POST /night-audit/journal-postings/{id}/reverse ('the reversal of a one-sided LEDGER_TRANSFER returns ledger_control_amount to exactly 0.00, which is what unblocks the balance step')."
        distinguishing_aspect: >-
          A cross-aggregate reversal with no folio in the picture at all: the compensated quantity
          is the date's ledger control total plus a LedgerAccount balance, and the invariant is what
          re-opens a blocked state transition rather than what corrects a guest bill. It is also the
          only instance here that exercises the priority-31 reversal carve-out, since the correcting
          call happens after the date is sealed and verified.
        test_recipe:
          setup: "Standard property; a CITY_LEDGER ledger account opened at 0.00; business date 2026-08-01 with no folios; while the date is still OPEN, NightAuditor u_na_1 posts a deliberately one-sided LEDGER_TRANSFER of -125.00 against the city ledger with no folio_id; the date is then posted, sealed and verified into SETTLEMENT_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/ledger-accounts"
              payload: { property_id: "${prop_id}", ledger_type: "CITY_LEDGER", account_code: "CL-900", gl_account_code: "1230", opening_balance_amount: 0.00, credit_limit_amount: 100000.00 }
              as: Controller
              as_user_id: "u_ctl_1"
              captures: { gl_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "LEDGER_TRANSFER", amount: -125.00, ledger_account_id: "${gl_id}", memo: "Mis-keyed city ledger transfer, one leg only" }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { post_bad_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/journal-postings/${post_bad_id}/reverse as Controller (X-User-ID u_ctl_1) - permitted in SETTLEMENT_REVIEW by the priority-31 reversal carve-out."
          assert:
            - "Before the trigger, GET /night-audit/business-dates/${bd1_id} returns ledger_control_amount == -125.00 and POST /night-audit/business-dates/${bd1_id}/balance fails 409 ERR_LEDGERS_OUT_OF_BALANCE with the status still SETTLEMENT_REVIEW."
            - "The trigger returns 201 with amount == 125.00, charge_type == LEDGER_TRANSFER, ledger_account_id == ${gl_id}, folio_id == null and reverses_posting_id == ${post_bad_id}."
            - "The invariant holds exactly: GET /night-audit/business-dates/${bd1_id} returns ledger_control_amount == 0.00 and GET /night-audit/ledger-accounts/${gl_id} returns current_balance_amount == 0.00, its opening value."
            - "The original row is untouched: GET /night-audit/journal-postings/${post_bad_id} still returns amount == -125.00 with reverses_posting_id == null and posted_by_user_id == u_na_1."
            - "POST /night-audit/business-dates/${bd1_id}/balance now returns 200 with status == BALANCED."
            - "Reversing ${post_bad_id} a second time fails 409 ERR_POSTING_ALREADY_REVERSED (priority 49), so the control total cannot be pushed to +125.00."
            - "The same reversal attempted as NightAuditor u_na_1 - the poster - fails 403 ERR_SELF_REVERSAL_FORBIDDEN (priority 51), which is checked before the state carve-out is relevant."
            - "An implementation that mutates the original row instead of appending, or that omits the ledger_account_id on the compensating row, leaves current_balance_amount at -125.00 and fails."
