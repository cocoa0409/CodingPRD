          assert:
            - "while PAUSED: /send -> 409 ERR_AGENCY_NOT_ACTIVE and referral stays INITIATED"
            - "after resume: identical /send succeeds -> status SENT"
            - "ack_due_at == sent_at + 120h == 2026-08-06T00:00:00Z (sent at the 2026-08-01T00:00:00Z default clock)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: ShelterBed with half-open+buffer
  # semantics vs Client closed night-set intersection (different resources,
  # different interval semantics).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pet_friendly_bed_sanitation_buffer_blocks_turnover_day
        grounds:
          - calculations.shelter_stay_windows
          - entities.ShelterStay.fields.buffer_until_exclusive
          - errors[ERR_BED_NOT_AVAILABLE]
        distinguishing_aspect: |
          Resource = ShelterBed, semantics = half-open [check_in, buffer_until) EXTENDED by a
          1-day sanitation buffer only when the bed is PET_FRIENDLY: on a plain bed a
          back-to-back check-in on the prior stay's checkout day succeeds, while on a
          PET_FRIENDLY bed the identical request collides with the buffer and is rejected —
          adjacency treatment differs by resource attribute, and is stricter than the client
          rule (which allows same-day turnover).
        test_recipe:
          setup:
            - "ShelterCoordinator; two shelter-eligible ACTIVE clients (HOMELESS assessments)"
            - "Plain bed N1 and PET_FRIENDLY bed P1, both AVAILABLE"
            - "Existing stays: N1 [2026-08-10, +2n -> checkout 08-12]; P1 [2026-08-10, +2n -> checkout 08-12, buffer_until 08-13]"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "S Sh", email: "shelter@hub.test", staff_role: "SHELTER_COORDINATOR" }
              as: HubAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "jay", contact_channel: "NONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /clients/${c1_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 0, housing_status: "HOMELESS", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 6, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /clients/${c1_id}/assessments/${a1_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c1_id}/assessments/${a1_id}/verify"
              payload: { expected_client_version: "${c1_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "kai", contact_channel: "NONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /clients/${c2_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 5000, housing_status: "HOMELESS", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 5, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /clients/${c2_id}/assessments/${a2_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c2_id}/assessments/${a2_id}/verify"
              payload: { expected_client_version: "${c2_v}" }
