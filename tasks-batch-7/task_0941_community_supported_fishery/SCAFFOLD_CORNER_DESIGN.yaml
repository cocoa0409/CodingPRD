scaffold_corner_design:
  - section: entities
    instances:
      - name: season_creation_returns_all_declared_fields
        claim_type: Creation
        grounds: [entities.Season, endpoints.POST./csf/seasons]
        distinguishing_aspect: "A season created with every required field returns 201 with status PLANNING, shortfall_flag_count 0, true_up_run_at null, version 1 and a server-minted UUID id carrying no type prefix."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /csf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CsfAdmin
          trigger:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD", "SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Season.${season_id}.status == PLANNING"
            - "Season.${season_id}.shortfall_flag_count == 0"
            - "Season.${season_id}.true_up_run_at IS NULL"
            - "Season.${season_id}.version == 1"
            - "Season.${season_id}.total_weeks == 20"

      - name: season_landing_commit_lead_hours_default_applied
        claim_type: Defaults
        grounds: [entities.Season.fields.landing_commit_lead_hours]
        distinguishing_aspect: "Omitting landing_commit_lead_hours yields the declared default 72, and omitting ambient_band yields MILD."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /csf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CsfAdmin
          trigger:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-DEF", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, offered_species: ["COD"] }
              as: CsfAdmin
              captures: { season_id: $.data.id }
          assert:
            - "Season.${season_id}.landing_commit_lead_hours == 72"
            - "Season.${season_id}.ambient_band == MILD"

      - name: share_plan_computed_fields_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds: [entities.SharePlan.fields.price_per_delivery_cents, calculations.share_price_per_delivery]
        distinguishing_aspect: "price_per_delivery_cents, weight_units, target_pounds_per_delivery, min_floor_pounds and scheduled_delivery_count are all source computed; a SMALL x SHELLFISH x BIWEEKLY plan returns 4092, 1, 2.50, 1.00 and 10 no matter what the client sends."
        test_recipe:
          setup: ["one PLANNING season with total_weeks 20"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["LOBSTER"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "SML-SHELL-B", share_size: "SMALL", delivery_frequency: "BIWEEKLY", species_tier: "SHELLFISH" }
              as: CsfAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "SharePlan.${plan_id}.price_per_delivery_cents == 4092"
            - "SharePlan.${plan_id}.weight_units == 1"
            - "SharePlan.${plan_id}.target_pounds_per_delivery == 2.50"
            - "SharePlan.${plan_id}.min_floor_pounds == 1.00"
            - "SharePlan.${plan_id}.scheduled_delivery_count == 10"

      - name: cold_chain_event_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: [entities.ColdChainEvent]
        distinguishing_aspect: "ColdChainEvent declares common_fields false, so it exposes id and created_at only, with no version and no update endpoint anywhere in the endpoint table."
        test_recipe:
          setup:
            - "an OPEN season, a COMPLIANT vessel with a 500.00 lb SALMON entitlement and one landed 5.00 lb lot"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 5.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /csf/cold-chain-events"
              payload: { landing_lot_id: "${lot_id}", custody_leg: "DOCK_TO_HUB", minutes_above_threshold: 5, peak_temp_c: 3.0 }
              as: HubOperator
              as_user_id: "hub-op-1"
              captures: { ev_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ColdChainEvent.${ev_id} exposes id and created_at but no version field"
            - "ColdChainEvent.${ev_id}.recorded_by_user_id == hub-op-1"
            - "ColdChainEvent.${ev_id}.breach_type == NONE"
            - "LandingLot.${lot_id}.quality_status == CLEAR"

      - name: quota_ledger_remaining_pounds_is_derived_not_input
        claim_type: Computed Fields
        grounds: [entities.QuotaLedger.fields.remaining_pounds, "invariants[INV_QUOTA_LEDGER]"]
        distinguishing_aspect: "remaining_pounds is set to entitlement_pounds at creation and committed_pounds to 0.00, so entitlement_pounds == committed_pounds + remaining_pounds holds from the first moment."
        test_recipe:
          setup: ["a PLANNING season and one vessel"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 250.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
          assert:
            - "QuotaLedger.${ledger_id}.committed_pounds == 0.00"
            - "QuotaLedger.${ledger_id}.remaining_pounds == 250.00"
            - "QuotaLedger.${ledger_id}.status == OPEN"
            - "QuotaLedger.${ledger_id}.area_closed == false"
            - "QuotaLedger.${ledger_id}.area_sensitivity_penalty == 0"

      - name: season_missing_required_total_weeks_returns_validation_error
