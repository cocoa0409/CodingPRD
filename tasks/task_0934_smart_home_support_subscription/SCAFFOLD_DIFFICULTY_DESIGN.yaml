  - rule_id: boundary_precision_check
    instances:
      - name: slot_starting_exactly_one_travel_buffer_after_a_booked_slot_is_accepted
        grounds:
          - calculations.visit_buffer_overlap
          - validations[priority=43]
          - state_machines.VisitSlot.capacity.OPEN_to_BOOKED
          - entities.Technician.fields.booked_slot_count
        distinguishing_aspect: |
          Metric: the travel-buffer gap in minutes, on POST /visits. A booked slot
          ending 11:00 with TRAVEL_BUFFER_MINUTES 45 accepts a candidate starting at
          exactly 11:45 because the rule uses strict `<` (11:45 < 11:45 is false);
          one minute earlier would be rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan; a household in NWA with an OWNER and an ACTIVE subscription."
            - "A technician in NWA with two slots: 2026-05-05T09:00:00Z -> 11:00:00Z and 2026-05-05T11:45:00Z -> 13:00:00Z, exactly 45 minutes apart."
            - "Two account-level P1 tickets, each escalated by a HARDWARE_FAULT verdict so both are DISPATCH_PENDING with dispatch_status REQUIRED."
            - "The first ticket already occupies the 09:00 slot, which is therefore BOOKED."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
