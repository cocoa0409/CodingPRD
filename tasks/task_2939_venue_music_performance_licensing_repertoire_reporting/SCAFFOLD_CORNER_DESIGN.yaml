          trigger:
            - call: "POST /licensing/licenses/${lic_p1_id}/reinstate"
              payload: {}
              as: LicensingAdmin
              captures: { back_status: "$.data.coverage_status", back_reason: "$.data.suspension_reason" }
          assert:
            - "The captured ${sus_reason} was AUDIT_FINDINGS while Venue.${p1_id}.outstanding_balance_cents was 463761, far above REINSTATEMENT_BALANCE_LIMIT_CENTS"
            - "The reinstate returned HTTP 200, so the fiscal gate did not fire: ${back_status} is ACTIVE and ${back_reason} is null"
            - "FeeAssessment.${fa_p1_id} is untouched: status ISSUED, paid_amount_cents 0, amount_cents 463761"
            - "Venue.${p1_id}.outstanding_balance_cents is still 463761 after reinstatement, so reinstating does not forgive debt"
            - "Repeating the whole flow with suspension_reason OPERATOR_REQUEST also reinstates cleanly, so only NONPAYMENT is gated"

      - name: corner_validation_payment_over_remaining_balance_rejected
        claim_type: violation_error
        grounds:
          - validations.priority_23_ERR_PAYMENT_EXCEEDS_BALANCE
          - entities.FeeAssessment.fields.paid_amount_cents
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: "The ceiling is the unpaid remainder, not the original amount: after a 40000-cent part payment on a 90017-cent assessment, 50018 is refused while 50017 is accepted."
        test_recipe:
          setup:
            - "Venue V1's License L1 is ACTIVE with an INITIAL FeeAssessment of 90017 cents"
            - "40000 cents have already been paid against it"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_ver: "$.data.version", lic1_fee: "$.data.annual_fee_cents" }
            - call: "GET /licensing/fee-assessments"
              payload: { license_id: "${lic1_id}" }
              as: LicensingAdmin
              captures: { fa1_id: "$.data[0].id", fa1_amount: "$.data[0].amount_cents" }
            - call: "POST /licensing/fee-assessments/${fa1_id}/pay"
              payload: { amount_cents: 40000 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { fa1_paid: "$.data.paid_amount_cents", fa1_status: "$.data.status" }
          trigger:
            - call: "POST /licensing/fee-assessments/${fa1_id}/pay"
              payload: { amount_cents: 50018 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/fee-assessments/${fa1_id}/pay"
              payload: { amount_cents: 50017 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { fa1_final: "$.data.status" }
          assert:
            - "The captured ${fa1_amount} was 90017 and ${fa1_paid} was 40000 with ${fa1_status} == ISSUED after the part payment"
            - "50018 is one cent over the 50017 remainder: HTTP 409 with data.error_id == ERR_PAYMENT_EXCEEDS_BALANCE, and 90017 as a fresh payment would also be refused even though it equals amount_cents"
            - "The refused call left paid_amount_cents at 40000 and Venue.${v1_id}.outstanding_balance_cents at 50017"
            - "The 50017-cent payment returned HTTP 200 and ${fa1_final} is PAID with paid_amount_cents 90017 and paid_at set"
            - "Venue.${v1_id}: outstanding_balance_cents 0, settled_amount_cents 90017, lifetime_assessed_cents 90017; License.${lic1_id}.billing_status is PAID"
            - "A further payment of 1 cent on the PAID assessment fails with ERR_ASSESSMENT_NOT_ISSUED, not ERR_PAYMENT_EXCEEDS_BALANCE, because the state gate at priority 7 outranks the fiscal gate at 23"

      - name: corner_validation_priority_state_beats_temporal_on_report_submit
        claim_type: priority_ordering
        grounds:
          - validations.priority_7_state_gate
          - validations.priority_12_ERR_OVERLAPPING_REPORT_PERIOD
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_state_beats_temporal_on_report_submit
          rationale: "The doubly-violating submit that must surface the priority-7 state error rather than the priority-12 overlap error is the body of that §1.8 instance."

      - name: corner_validation_priority_safety_beats_fiscal_on_license_renew
        claim_type: priority_ordering
        grounds:
          - validations.priority_9_ERR_VENUE_UNDER_AUDIT_HOLD
          - validations.priority_20_ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_safety_beats_fiscal_on_license_renew
          rationale: "A renewal that violates both the audit-hold gate and the outstanding-balance gate, and must report the audit-hold error, is asserted there."

      - name: corner_validation_cross_entity_coverage_window_requires_active_license
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_7_state_gate
          - endpoints.POST_licensing_licenses_id_coverage_windows
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coverage_window_creation_requires_active_license
          rationale: "Both the PENDING_ACTIVATION rejection and the post-activation success are asserted by that §1.8 instance."

      - name: corner_validation_cross_entity_submit_blocked_by_venue_audit_hold
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_9_ERR_VENUE_UNDER_AUDIT_HOLD
          - entities.Venue.fields.audit_hold
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_submit_requires_venue_without_audit_hold
          rationale: "The audit-hold blockade of an unrelated application submit, and its release on settlement, are the body of that §1.8 instance."

      - name: corner_validation_uniqueness_duplicate_active_license_per_venue_society
        claim_type: aggregate_validation
        grounds:
          - validations.priority_17_ERR_DUPLICATE_ACTIVE_LICENSE
          - errors[ERR_DUPLICATE_ACTIVE_LICENSE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_license_terms_per_venue_and_society
          rationale: "The per-venue-per-society overlap scope, including the adjacent-term acceptance and the terminated-row exclusion, is asserted there."

      - name: corner_validation_revision_limit_declines_rather_than_erroring
        claim_type: conditional_validation
        grounds:
          - validations.priority_19_ERR_DISPUTE_LIMIT_REACHED
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DECLINED
          - endpoints.POST_licensing_license_applications_id_review
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_revision_cycle_bounded_at_three_rounds
          rationale: "The three-round revision loop and the fourth RETURN_FOR_REVISION arriving at DECLINED with decline_reason REVISION_LIMIT_EXCEEDED, rather than at an error, are the body of that §1.8 instance."

      - name: corner_validation_temporal_rider_window_overlap_scoped_by_kind
        claim_type: temporal_validation
        grounds:
          - validations.priority_13_window_bounds
          - validations.priority_12_ERR_OVERLAPPING_REPORT_PERIOD
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_rider_windows_scoped_by_window_kind_inside_the_term
          rationale: "Whether two windows conflict depends on window_kind and on containment in the licence term, which that §1.8 instance asserts in both directions."

  - section: endpoints
    instances:
      - name: corner_endpoint_venue_patch_bumps_version_and_resets_exemption
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_licensing_venues_id
          - entities.Venue.fields.bgm_exemption_status
          - entities.Venue.fields.version
        distinguishing_aspect: "A PATCH is not a plain field write: it invalidates the stored exemption verdict back to NOT_ANALYZED with a null reason and increments version, even when the patched field has nothing to do with the exemption test."
        test_recipe:
          setup:
            - "Venue W1 is a BACKGROUND_ONLY BAR_GRILL of 3000 square feet, 4 speakers, 2 per room, no cover charge, retransmission only, not using a licensed BGM service"
            - "Its exemption analysis has already been run, so it stands at EXEMPT / WITHIN_SIZE_AND_SPEAKER_LIMITS"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Quiet Corner Grill", venue_category: "BAR_GRILL", seating_capacity: 40, standing_capacity: 0, occupancy_limit: 60, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 3000, speaker_count: 4, max_speakers_per_room: 2, has_cover_charge: false, retransmission_only: true, uses_licensed_bgm_service: false }
              as: LicensingAdmin
              captures: { w1_id: "$.data.id", w1_v0: "$.data.version" }
            - call: "POST /licensing/venues/${w1_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { w1_status: "$.data.bgm_exemption_status", w1_reason: "$.data.bgm_exemption_reason", w1_v1: "$.data.version" }
          trigger:
            - call: "PATCH /licensing/venues/${w1_id}"
              payload: { annual_cover_revenue_cents: 250000 }
              as: LicensingAdmin
              captures: { w1_v2: "$.data.version", w1_status2: "$.data.bgm_exemption_status", w1_reason2: "$.data.bgm_exemption_reason" }
          assert:
            - "The captured ${w1_v0} was 1, ${w1_v1} was 2 and ${w1_v2} is 3, so both the analysis and the PATCH bump version by exactly 1"
            - "${w1_status} was EXEMPT with ${w1_reason} == WITHIN_SIZE_AND_SPEAKER_LIMITS before the PATCH"
            - "${w1_status2} is NOT_ANALYZED and ${w1_reason2} is null after the PATCH, even though annual_cover_revenue_cents is not an input of bgm_exemption_determination"
            - "annual_cover_revenue_cents is 250000 and every unmentioned field (seating_capacity 40, gross_square_feet 3000, speaker_count 4) is unchanged, so PATCH is a partial update"
            - "GET /licensing/venues/${w1_id} returns the same NOT_ANALYZED / null pair, so the reset was persisted rather than only rendered"

      - name: corner_endpoint_exemption_analysis_rerun_is_stable_but_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_licensing_venues_id_exemption_analysis
          - calculations.bgm_exemption_determination
        distinguishing_aspect: "The analysis endpoint is a write, not a query: re-running it on unchanged data returns the identical verdict yet increments version each time, and it never touches the venue's survey inputs."
        test_recipe:
          setup:
            - "Venue W2 is a BACKGROUND_ONLY HOTEL lobby of 2000 square feet, 6 speakers, 4 per room, no cover charge, retransmission only"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Lamplight Hotel", venue_category: "HOTEL", seating_capacity: 150, standing_capacity: 0, occupancy_limit: 180, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 2000, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true, uses_licensed_bgm_service: false }
              as: LicensingAdmin
              captures: { w2_id: "$.data.id", w2_v0: "$.data.version", w2_status0: "$.data.bgm_exemption_status" }
          trigger:
            - call: "POST /licensing/venues/${w2_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { w2_status1: "$.data.bgm_exemption_status", w2_reason1: "$.data.bgm_exemption_reason", w2_v1: "$.data.version" }
            - call: "POST /licensing/venues/${w2_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { w2_status2: "$.data.bgm_exemption_status", w2_reason2: "$.data.bgm_exemption_reason", w2_v2: "$.data.version" }
          assert:
            - "${w2_status0} was NOT_ANALYZED at creation with bgm_exemption_reason null, so the default is not a verdict"
            - "${w2_status1} and ${w2_status2} are both EXEMPT and ${w2_reason1} and ${w2_reason2} are both WITHIN_SIZE_AND_SPEAKER_LIMITS: 2000 square feet is exactly OTHER_ESTABLISHMENT_SQFT_LIMIT, 6 speakers exactly MAX_TOTAL_SPEAKERS and 4 per room exactly MAX_SPEAKERS_PER_ROOM, all three inclusive at once"
            - "${w2_v0} was 1, ${w2_v1} is 2 and ${w2_v2} is 3, so the idempotent verdict still costs a version"
            - "gross_square_feet is still 2000, speaker_count 6 and max_speakers_per_room 4 after both calls"
            - "The endpoint takes no body: the same call with an unexpected key is refused with ERR_INVALID_REQUEST rather than silently ignored"

      - name: corner_endpoint_nested_coverage_window_list_scoped_to_its_license
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_licensing_licenses_id_coverage_windows
          - endpoints.POST_licensing_licenses_id_coverage_windows
          - entities.CoverageWindow.fields.license_id
        distinguishing_aspect: "The nested list is the reverse-reachability path for CoverageWindow.license_id: it returns only the addressed license's windows, while the flat collection returns both licenses' windows."
        test_recipe:
          setup:
            - "Two ACTIVE licenses exist for two different venues, each with one ANNUAL_TERM window"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
