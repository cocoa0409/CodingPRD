# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2259_teaching_artist_roster_school_residencies
#
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every numeric literal in `assert:` was computed against the §1.3 formulas and
# their `constants:` with Decimal ROUND_HALF_UP before being written here.
# Logical clock default is 2026-08-01T00:00:00Z (§1.5 /_clock/set_current_utc).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: residency_cost_outlook_earned_versus_projected_completion
        grounds:
          - calculations.residency_cost_outlook
          - calculations.session_fee
          - entities.Residency.fields.earned_to_date_cents
          - entities.Residency.fields.projected_cost_cents
          - entities.Residency.fields.sessions_unscheduled_count
        distinguishing_aspect: |
          Both variants read the same residency after the same two deliveries, yet
          earned_to_date_cents = 31454 (chronological, delivered sessions only, at
          actual prorated fee plus reimbursements) while projected_cost_cents =
          143246 (forward-looking, adding 8 unscheduled allotment slots at the
          lead-artist full-length projection of 13974 each) — a fixed delta of
          111792 cents on the Residency money domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "School 'Riverbend Arts Academy' with concurrent_session_capacity 2, enrollment 600, frl 0.62, ell 0.28, iep 0.14."
            - "Artist Ana Reyes: DANCE primary, grade_bands [G3_5, G6_8], languages [en, es], roster_tier_assigned APPRENTICE, driven through the whole vetting axis to CLEARED (portfolio mean 3.59, demo 4.2, all three screenings CLEARED to 2027-06-30) so roster_status is ACTIVE."
            - "Residency 'Story in Motion': DANCE / G3_5 / instruction_language es, 10 contracted sessions of 60 minutes, budget 200000 cents, CO_TEACH, required_strands [CREATING, RESPONDING], term 2026-09-08..2026-12-18, 48 enrolled; lead artist Ana; status ACTIVE with one ALIGNED plan covering both strands."
            - "Two sessions scheduled, confirmed and delivered: 2026-09-15 (22 present, 60 min, 20.5 travel miles, 3000 cents materials) and 2026-09-22 (24 present, 60 min, 14.5 travel miles, 0 materials)."
            - "8 of the 10 contracted sessions therefore remain unscheduled and no make-up credits are outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
            - call: "POST /teaching-artists"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@arts.org", primary_discipline: "DANCE", secondary_disciplines: ["THEATER"], grade_bands: ["G3_5", "G6_8"], languages: ["en", "es"], roster_tier_assigned: "APPRENTICE" }
              as: RosterCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "PORTFOLIO_REVIEW" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-1", artistic_quality_score: 3.5, pedagogical_clarity_score: 4.0, cultural_responsiveness_score: 3.2 }
              as: CurriculumSpecialist
            - call: "POST /teaching-artists/${a1_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-2", artistic_quality_score: 4.0, pedagogical_clarity_score: 3.5, cultural_responsiveness_score: 3.0 }
              as: CurriculumSpecialist
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "DEMO_SCHEDULED" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "DEMO_PASSED", demo_rubric_score: 4.2 }
              as: RosterCoordinator
              as_user_id: "demo-evaluator-1"
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "SCREENING_PENDING" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/screenings"
              payload: { screening_type: "STATE_CRIMINAL", outcome: "CLEARED", effective_on: "2026-07-01", expires_on: "2027-06-30" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/screenings"
              payload: { screening_type: "FBI_FINGERPRINT", outcome: "CLEARED", effective_on: "2026-07-01", expires_on: "2027-06-30" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/screenings"
              payload: { screening_type: "CHILD_ABUSE_REGISTRY", outcome: "CLEARED", effective_on: "2026-07-01", expires_on: "2027-06-30" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "CLEARED" }
              as: RosterCoordinator
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Story in Motion", discipline: "DANCE", grade_band: "G3_5", instruction_language: "es", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, materials_stipend_cents: 5000, collaboration_expectation: "CO_TEACH", co_planning_hours_required: 4, required_strands: ["CREATING", "RESPONDING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { r1_id: $.data.id }
            - call: "POST /residencies/${r1_id}/lead-artist"
