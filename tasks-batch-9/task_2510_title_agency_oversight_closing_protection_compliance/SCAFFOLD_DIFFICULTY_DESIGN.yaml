            - "APPOINTED agency in CA with escrow account ESCROW-1 snapshotted as book 10000000, bank 10000000, outstanding 0, trial 9800000, so the SCHEDULED audit's variance is 200000, above the 100000 tolerance."
            - "That audit is SUBMITTED (raising one THREE_WAY_VARIANCE finding of exposure 200000, severity MEDIUM) and then UNDER_REVIEW."
