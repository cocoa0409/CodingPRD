              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-901", vin: "1FUJA6CK21L101901", weight_group_code: "W80", factory_price_amount: 158000.00, registration_year: 2027 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v9_id: $.data.id }
