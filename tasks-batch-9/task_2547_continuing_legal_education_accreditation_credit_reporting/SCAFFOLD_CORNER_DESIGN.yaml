            - "Fourth trigger -> HTTP 200 with CourseApplication.${app_id}.status == 'APPEALED' and appeal_filed_at == '2026-08-30T23:59:59Z'"
            - "Course.${crs_id}.status is 'DENIED' throughout (an appeal filing alone does not restore the course)"
            - "CourseApplication.${app_id}.denied_at is still '2026-08-01T00:00:00Z' (the clock rewind did not rewrite it)"

      - name: an_administrative_status_change_targeting_admin_suspended_is_refused
        claim_type: invalid_transitions
