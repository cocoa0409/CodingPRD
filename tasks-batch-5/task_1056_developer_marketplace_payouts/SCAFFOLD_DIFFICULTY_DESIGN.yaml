          - errors[ERR_BATCH_PERIOD_OVERLAP]
          - entities.PayoutBatch.fields.period_start
          - entities.PayoutBatch.fields.period_end
        distinguishing_aspect: |
          Interval semantics A - half-open [period_start, period_end) intersection on the
          PayoutBatch resource with NO buffer: a window starting exactly where the previous one
          ends is accepted, while a window straddling the previous one is rejected.
