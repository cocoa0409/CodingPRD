            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-15", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: false }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
