  - { method: POST, path: "/noise-program/noise-studies/{id}/parcels", description: "Add a land-use parcel to a study", roles: [StudyCoordinator], code: 201, input: [parcel_ref, land_use, dnl_db_measured, dnl_db_modeled, zone_code], output: LandUseParcel, side_effects: ["compute parcel_dnl_exposure (variant by study status)", "study.parcels_assessed_count += 1"] }
  - { method: GET, path: "/noise-program/noise-studies/{id}/parcels", description: "List parcels of a study", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?"], output: "LandUseParcel[]", side_effects: [] }
  - { method: GET, path: "/noise-program/land-use-parcels/{parcelId}", description: "Get a parcel", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: LandUseParcel, side_effects: [] }
  - { method: POST, path: "/noise-program/land-use-parcels/{parcelId}/reassess", description: "Recompute parcel DNL variant/band/compatibility from current study status", roles: [StudyCoordinator], code: 200, input: [], output: LandUseParcel, side_effects: ["reassessed_at=now", "increments LandUseParcel.version by 1"] }

  # --- InsulationFund / SoundInsulationApplication ---
  - { method: POST, path: "/noise-program/insulation-funds", description: "Create a fiscal-year fund (unique FY; single ACTIVE)", roles: [NoiseOfficeAdmin], code: 201, input: [fiscal_year, total_allocation_cents, intake_opens_at, intake_closes_at], output: InsulationFund, side_effects: ["status=ACTIVE; available=total, reserved=0, disbursed=0"] }
  - { method: GET, path: "/noise-program/insulation-funds", description: "List funds", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "status?"], output: "InsulationFund[]", side_effects: [] }
  - { method: GET, path: "/noise-program/insulation-funds/{fundId}", description: "Get a fund", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: InsulationFund, side_effects: [] }
  - { method: POST, path: "/noise-program/insulation-funds/{fundId}/allocate", description: "Run waterfall_allocation over UNFUNDED eligible applications", roles: [NoiseOfficeAdmin], code: 200, input: [], output: { offers_issued: integer, total_reserved_cents: integer, skipped_application_ids: array }, side_effects: ["issues OFFER_ISSUED per waterfall rule (full/partial/skip)", "fund.version += 1", "increments each touched application's version by 1"] }
  - { method: POST, path: "/noise-program/insulation-funds/{fundId}/close", description: "ACTIVE -> CLOSED (requires reserved_cents == 0)", roles: [NoiseOfficeAdmin], code: 200, input: [], output: InsulationFund, side_effects: ["increments InsulationFund.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications", description: "Create an application (parcel must be insulation_eligible; no other active application per parcel)", roles: [CommunityLiaison], code: 201, input: [parcel_id, "complainant_id?", dwelling_type, rooms_count, est_cost_cents], output: SoundInsulationApplication, side_effects: ["eligibility_status=NEW, funding_status=UNFUNDED"] }
  - { method: GET, path: "/noise-program/sound-insulation-applications", description: "List applications with filters", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "parcel_id?", "complainant_id?", "fund_id?", "eligibility_status?", "funding_status?"], output: "SoundInsulationApplication[]", side_effects: [] }
  - { method: GET, path: "/noise-program/sound-insulation-applications/{applicationId}", description: "Get an application", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: SoundInsulationApplication, side_effects: [] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/submit", description: "NEW -> SUBMITTED (intake window of ACTIVE fund must cover now)", roles: [CommunityLiaison], code: 200, input: [], output: SoundInsulationApplication, side_effects: ["submitted_at=now", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/begin-screening", description: "SUBMITTED|APPEALED -> SCREENING", roles: [StudyCoordinator], code: 200, input: [], output: SoundInsulationApplication, side_effects: ["increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/record-decision", description: "SCREENING -> ELIGIBLE_TIER1|ELIGIBLE_TIER2|INELIGIBLE", roles: [StudyCoordinator], code: 200, input: [decision], output: SoundInsulationApplication, side_effects: ["priority_score + tier_cap computed", "fund pipeline recompute", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/appeal", description: "INELIGIBLE -> APPEALED (max 2 appeals, within 30d)", roles: [CommunityLiaison], code: 200, input: [reason], output: SoundInsulationApplication, side_effects: ["appeal_count += 1", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/issue-offer", description: "UNFUNDED -> OFFER_ISSUED against ACTIVE fund (OCC on fund version)", roles: [NoiseOfficeAdmin], code: 200, input: [expected_fund_version], output: SoundInsulationApplication, side_effects: ["provisional grant_obligation_split", "fund available->reserved; increments InsulationFund.version by 1", "offer_expires_at = now + 45d", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/accept-offer", description: "OFFER_ISSUED -> GRANT_COMMITTED (before expiry)", roles: [CommunityLiaison], code: 200, input: [], output: SoundInsulationApplication, side_effects: ["increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/decline-offer", description: "OFFER_ISSUED -> OFFER_DECLINED -> UNFUNDED; releases reservation", roles: [CommunityLiaison], code: 200, input: [], output: SoundInsulationApplication, side_effects: ["compensation: fund reserved->available; increments InsulationFund.version by 1", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/disburse", description: "GRANT_COMMITTED -> REIMBURSED; FINAL split on actual_cost_cents; delta released", roles: [NoiseOfficeAdmin], code: 200, input: [actual_cost_cents], output: SoundInsulationApplication, side_effects: ["fund reserved->disbursed; surplus reserved->available; increments InsulationFund.version by 1", "increments SoundInsulationApplication.version by 1"] }
  - { method: POST, path: "/noise-program/sound-insulation-applications/{applicationId}/withdraw", description: "Any eligibility state -> WITHDRAWN; releases reservation", roles: [CommunityLiaison], code: 200, input: [], output: SoundInsulationApplication, side_effects: ["compensation: fund reserved->available if reserved", "increments SoundInsulationApplication.version by 1"] }

  # --- OutreachCase ---
  - { method: POST, path: "/noise-program/outreach-cases", description: "Manual outreach case (complainant standing must be REPEAT|RESTRICTED)", roles: [CommunityLiaison], code: 201, input: [complainant_id, trigger_reason], output: OutreachCase, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/noise-program/outreach-cases", description: "List outreach cases", roles: [CommunityLiaison, NoiseOfficeAdmin], code: 200, input: ["limit?", "offset?", "complainant_id?", "status?"], output: "OutreachCase[]", side_effects: [] }
  - { method: GET, path: "/noise-program/outreach-cases/{caseId}", description: "Get an outreach case", roles: [CommunityLiaison, NoiseOfficeAdmin], code: 200, input: [], output: OutreachCase, side_effects: [] }
  - { method: POST, path: "/noise-program/outreach-cases/{caseId}/log-contact", description: "OPEN|CONTACT_ATTEMPTED -> CONTACT_ATTEMPTED|ENGAGED by outcome", roles: [CommunityLiaison], code: 200, input: [outcome], output: OutreachCase, side_effects: ["contact_attempts += 1", "increments OutreachCase.version by 1"] }
  - { method: POST, path: "/noise-program/outreach-cases/{caseId}/resolve", description: "ENGAGED -> RESOLVED; resets complainant repeat baseline", roles: [CommunityLiaison], code: 200, input: [resolution_summary], output: OutreachCase, side_effects: ["complainant.repeat_baseline_at=now; complaints_90d + standing recompute", "increments OutreachCase.version by 1"] }
  - { method: POST, path: "/noise-program/outreach-cases/{caseId}/mark-dormant", description: "ENGAGED -> DORMANT", roles: [CommunityLiaison], code: 200, input: [], output: OutreachCase, side_effects: ["increments OutreachCase.version by 1"] }
  - { method: POST, path: "/noise-program/outreach-cases/{caseId}/reactivate", description: "DORMANT -> OPEN (cycle)", roles: [CommunityLiaison], code: 200, input: [], output: OutreachCase, side_effects: ["increments OutreachCase.version by 1"] }

  # --- QuarterlyReport / computed reads / clock ---
  - { method: POST, path: "/noise-program/quarterly-reports", description: "Create a DRAFT report; computes frozen quarterly_rollup snapshot", roles: [NoiseAnalyst], code: 201, input: [quarter_label, "notes?"], output: QuarterlyReport, side_effects: ["quarterly_rollup snapshot", "created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/noise-program/quarterly-reports", description: "List reports", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "status?"], output: "QuarterlyReport[]", side_effects: [] }
  - { method: GET, path: "/noise-program/quarterly-reports/{reportId}", description: "Get a report", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: QuarterlyReport, side_effects: [] }
  - { method: PATCH, path: "/noise-program/quarterly-reports/{reportId}", description: "Edit notes while DRAFT; OCC expected_report_version", roles: [NoiseAnalyst], code: 200, input: ["notes?", expected_report_version], output: QuarterlyReport, side_effects: ["increments QuarterlyReport.version by 1"] }
  - { method: POST, path: "/noise-program/quarterly-reports/{reportId}/submit-for-review", description: "DRAFT -> UNDER_REVIEW (period closed; no unclassified events in period)", roles: [NoiseAnalyst], code: 200, input: [], output: QuarterlyReport, side_effects: ["increments QuarterlyReport.version by 1"] }
  - { method: POST, path: "/noise-program/quarterly-reports/{reportId}/approve", description: "UNDER_REVIEW -> APPROVED (BoardMember; approver != creator)", roles: [BoardMember], code: 200, input: [], output: QuarterlyReport, side_effects: ["approved_by_user_id recorded", "increments QuarterlyReport.version by 1"] }
  - { method: POST, path: "/noise-program/quarterly-reports/{reportId}/return-for-revision", description: "UNDER_REVIEW -> DRAFT (revision cycle)", roles: [BoardMember], code: 200, input: [reason], output: QuarterlyReport, side_effects: ["revision_round_count += 1", "increments QuarterlyReport.version by 1"] }
  - { method: POST, path: "/noise-program/quarterly-reports/{reportId}/publish", description: "APPROVED -> PUBLISHED; locks the quarter for new complaints", roles: [NoiseOfficeAdmin], code: 200, input: [], output: QuarterlyReport, side_effects: ["published_at=now; quarter lock activates", "increments QuarterlyReport.version by 1"] }
  - { method: GET, path: "/noise-program/community-zones/{zoneCode}/annoyance-index", description: "Computed community_annoyance_index for a zone (tier keyed on base only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: { zone_code: string, base_index: number, tier: string, final_index: number }, side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Advances fire the notification overdue auto-sweep only; offer expiry is swept on READ of the application instead (see SoundInsulationApplication_Funding).", roles: [NoiseOfficeAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["auto-sweep: SENT|ACKNOWLEDGED notifications past due_at -> ESCALATED (cascade C)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request shape violation: missing required field, bad type/enum, malformed quarter_label, numeric range violation (end<=start, minutes out of 0-1439, rooms_count<1, est_cost_cents<1, duration_seconds<5, intake window inverted)" }
