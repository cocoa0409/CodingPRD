          - "entities.Inspection.fields.scheduled_start_period"
          - "state_machines.Inspection.SCHEDULED_to_ASSIGNED"
        distinguishing_aspect: "Inspector assignment uses HALF-OPEN windows expanded by INSPECTION_BUFFER_PERIODS (1) on the Inspector resource: assigning a [12,14) inspection to an inspector already holding an ASSIGNED [10,12) inspection is rejected because 12 < 12+1 (ERR_INSPECTOR_SCHEDULE_CONFLICT) — buffered half-open semantics on Inspector, distinct from the closed OOS rule on Device."
