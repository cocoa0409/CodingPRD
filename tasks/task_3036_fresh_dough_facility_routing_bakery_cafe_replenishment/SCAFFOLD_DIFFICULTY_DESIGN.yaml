              captures: { o_c1: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o_c1}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c3_id}", dough_type_id: "${bmt_id}", production_date: "2026-09-11", quantity: 50, expected_cafe_version: "${c3_v}" }
              as: CafeManager
              as_user_id: "${c3_id}"
              captures: { o_c3: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o_c3}/submit"
