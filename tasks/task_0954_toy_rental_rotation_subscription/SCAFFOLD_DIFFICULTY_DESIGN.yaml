              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGE_INCOMPATIBLE (HTTP 422): priority-6 BUSINESS_SAFETY beats priority-8 BUSINESS_CONSTRAINT even though the slot is also full (15 months < min_age_months 24)"
            - "RotationBox.${b_id} still holds exactly 1 item (the C2 slot); ToyCopy.${c1} remains AVAILABLE"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: age_min_boundary_inclusive
        grounds:
          - calculations.developmental_stage_assignment
          - validations[priority=6]
        distinguishing_aspect: |
          Metric: child age in whole months at the INCLUSIVE lower bound —
          age == min_age_months exactly passes the gate (>=, not >). Child born
          2025-05-01 at clock 2026-05-01 is exactly 12 calendar months and may
          rent a min_age_months 12 toy. Endpoint: POST /rotation-boxes/{id}/items.
        test_recipe:
          setup:
            - "Plan STD; member M; child born 2025-05-01 (exactly 12 calendar months at the default clock 2026-05-01); catalog item age window [12, 36]; NEW copy"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
