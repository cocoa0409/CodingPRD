# =============================================================================
# Task 0061 — Smart Water Pipeline Network Monitoring
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Every `grounds:` ref resolves to a declared element in SCAFFOLD.yaml's
# §1.1–§1.6. Every numeric assertion below was computed against the formulas
# and constants pinned in SCAFFOLD.yaml `calculations:`.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: alert_severity_baseline_dual_variant
        grounds:
          - calculations.alert_severity_classification
          - calculations.alert_severity_classification.variants.static_baseline
          - calculations.alert_severity_classification.variants.dynamic_baseline
          - entities.Device.fields.valid_range_min
          - entities.Device.fields.valid_range_max
          - entities.Alert.fields.baseline_used
        distinguishing_aspect: |
          Operates on the Alert/Device domain (sensor monitoring): for the same
          breach reading on the same Device, static_baseline (no history) uses
          midpoint(valid_range) whereas dynamic_baseline uses the 28-day mean
          of the (hour_of_day, day_of_week) bucket, producing different
          deviation_pct values and therefore different severity outcomes
          (INFO/WARNING/CRITICAL) from identical raw inputs.
        test_recipe:
          setup:
            - "Create Network N1 (clock_epoch_ms=0)."
            - "Create DMA D1 (status=OPEN)."
            - "Publish topology with one JUNCTION node J1 in D1."
            - "Create pressure Device DV1 mounted on J1, valid_range_min=200, valid_range_max=600, polling_interval_s=3600."
            - "Activate DV1 (no history yet → static_baseline applies)."
          trigger:
            - "POST /devices/DV1/readings observed_at=now, raw_value=519 (deviation = |519-400|/400*100 = 29.75% < 30% → WARNING)."
            - "Independently advance clock by 168h*3600s while feeding 168 hourly readings averaging 500 kPa into the same (hour_of_day, day_of_week) bucket so dynamic_baseline becomes 500."
            - "POST another reading raw_value=519 (deviation = |519-500|/500*100 = 3.8% → INFO under dynamic_baseline)."
          assert:
            - "First Alert.severity == 'WARNING' and Alert.baseline_used.kind == 'STATIC'."
            - "Second reading produces NO new Alert (INFO is below alert threshold) OR produces an Alert with severity='INFO' and baseline_used.kind == 'DYNAMIC' — both paths confirm divergent severity from the same raw_value=519."

      - name: water_balance_window_dual_variant
        grounds:
          - calculations.dma_water_balance
          - calculations.dma_water_balance.variants.daily_window
          - calculations.dma_water_balance.variants.weekly_window
          - entities.WaterBalanceReport.fields.real_loss_m3
          - entities.WaterBalanceReport.fields.nrw_pct
        distinguishing_aspect: |
          Operates on the DMA/WaterBalanceReport domain (financial accounting):
          for identical underlying Reading rows, the daily_window variant
          recomputes from raw readings whereas the weekly_window variant
          aggregates seven pre-rounded daily reports (sum-of-daily, no
          rounding propagation). The two algorithms produce numerically
          different real_loss_m3 totals when daily rounding shaves m^3 off
          each sub-window.
        test_recipe:
          setup:
            - "Create Network N1, DMA D1 with inlet device DV_INLET (FLOW, L/s) and meter device DV_METER (METER, m^3)."
            - "Ingest readings such that each day's input_volume_m3 rounds to a value that drops 0.001 m^3 vs the raw sum (e.g., 432.0005 m^3/day raw → 432.001 rounded; over 7 days, sum-of-raw = 3024.0035 → would round to 3024.004, sum-of-daily = 7 * 432.001 = 3024.007)."
          trigger:
            - "POST /dmas/D1/water-balance-reports with window length 86400s for each of 7 consecutive days."
            - "POST /dmas/D1/water-balance-reports with window length 604800s covering the same 7 days."
          assert:
            - "Weekly report input_volume_m3 == sum of the 7 daily reports' input_volume_m3 (sum-of-daily, per weekly_window variant)."
            - "Weekly report input_volume_m3 != recompute-from-raw value (i.e., the two variants yield different totals when the daily-rounding bias is non-zero)."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_nonlinear
        grounds:
          - calculations.work_order_priority
          - entities.WorkOrder.fields.priority
          - entities.WorkOrder.fields.origin
          - entities.Alert.fields.severity
          - entities.DMA.fields.open_critical_alert_count
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction:
          total_score = severity_score + dma_score + leak_score +
          downstream_customer_score, where each input is itself a tiered
          function of entity fields (severity_score branches on Alert.severity
          AND on origin enum; dma_score branches on open_critical_alert_count
          thresholds; downstream_customer_score uses ceil(N/50)). The four
          inputs interact non-linearly through their tier bucketing, and the
          final P1/P2/P3 bucket depends on a >=15 / >=8 cliff.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN."
            - "Publish topology where target segment S1 has 120 CUSTOMER_TAP descendants."
            - "Create Alert A1 (severity=CRITICAL) tied to D1; D1.open_critical_alert_count becomes 1 → after one more critical alert opens, count=2; after another, count=3."
            - "Open enough alerts so D1.open_critical_alert_count == 3."
            - "Create LeakInvestigation INV1 with water_balance_loss_lps=2.5 (>=1.0)."
          trigger:
            - "POST /investigations/INV1/dispatch (auto-creates a WorkOrder with origin=INVESTIGATION targeting S1)."
          assert:
            - "WorkOrder.priority == 'P1' (total_score = 10 + 5 + 8 + ceil(120/50) = 10 + 5 + 8 + 3 = 26 >= 15)."
            - "WorkOrder.origin == 'INVESTIGATION'."

      - name: water_balance_rounding_order_combinatorial
        grounds:
          - calculations.dma_water_balance
          - entities.WaterBalanceReport.fields.input_volume_m3
          - entities.WaterBalanceReport.fields.apparent_loss_m3
          - entities.WaterBalanceReport.fields.real_loss_m3
          - entities.WaterBalanceReport.fields.nrw_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins:
          (1) compute input_volume_m3 by integrating ACCEPTED readings then
          round to 3 decimals; (2) compute apparent_loss_m3 = round(input * 0.04, 3)
          AFTER step (1)'s rounding (NOT against the raw integral); (3) real_loss_m3 =
          max(0, round(input - billed - unbilled - apparent, 3)) — subtraction
          happens against the already-rounded operands; (4) nrw_pct rounded
          to 2 decimals AFTER the m^3 subtractions. "Round per-step then sum"
          (the pinned order) differs from "sum then round once" by the order
          of cents.
        test_recipe:
          setup:
            - "Network N1, DMA D1 with inlet FLOW device DV1 and METER device DV2."
            - "Ingest readings producing raw integrated input = 432.000 m^3 exactly over 86400s window (5 L/s constant)."
            - "DV2 readings give billed_consumption_m3 = 300.000."
            - "Mark unbilled_authorized_m3 = 50.000."
          trigger:
            - "POST /dmas/D1/water-balance-reports with window length 86400s covering the test interval."
          assert:
            - "WaterBalanceReport.input_volume_m3 == 432.000."
            - "WaterBalanceReport.apparent_loss_m3 == 17.280 (round(432.000 * 0.04, 3))."
            - "WaterBalanceReport.real_loss_m3 == 64.720 (432.000 - 300.000 - 50.000 - 17.280)."
            - "WaterBalanceReport.nrw_pct == 30.56 (round((432.000 - 300.000) / 432.000 * 100, 2))."

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: topology_version_cycle_rollback
        grounds:
          - state_machines.TopologyVersion
          - state_machines.TopologyVersion.SUPERSEDED_to_PUBLISHED
          - state_machines.TopologyVersion.PUBLISHED_to_SUPERSEDED
          - entities.TopologyVersion.fields.status
        distinguishing_aspect: |
          Belongs to TopologyVersion. The state machine is cyclic on
          (PUBLISHED, SUPERSEDED): a SUPERSEDED version can be revived to
          PUBLISHED via rollback, and the currently PUBLISHED version
          simultaneously transitions to SUPERSEDED — distinct from a one-way
          linear pipeline because the same version can occupy PUBLISHED more
          than once across its lifetime.
        test_recipe:
          setup:
            - "Create Network N1."
            - "Submit and approve TopologyVersion V1 (version_number=1) → PUBLISHED."
            - "Submit and approve TopologyVersion V2 → PUBLISHED; V1 auto-transitions to SUPERSEDED."
          trigger:
            - "POST /topology-versions/V1/rollback by an approver whose X-User-ID != V1.submitted_by."
          assert:
            - "TopologyVersion(V1).status == 'PUBLISHED' (revived)."
            - "TopologyVersion(V2).status == 'SUPERSEDED'."
            - "Network.active_topology_version_id == V1.id."

      - name: work_order_verification_cycle
        grounds:
          - state_machines.WorkOrder
          - state_machines.WorkOrder.AWAITING_VERIFICATION_to_IN_PROGRESS
          - state_machines.WorkOrder.IN_PROGRESS_to_AWAITING_VERIFICATION
          - entities.WorkOrder.fields.verification_failure_count
        distinguishing_aspect: |
          Belongs to WorkOrder (different entity from TopologyVersion). State
          machine contains a revert cycle IN_PROGRESS ↔ AWAITING_VERIFICATION
          driven by verify outcome=FAIL on the first attempt; second FAIL exits
          to CLOSED_REJECTED. Non-linear because the same WorkOrder revisits
          IN_PROGRESS after AWAITING_VERIFICATION.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN, published topology containing segment S1."
            - "WorkOrder W1 created with target_segment_code=S1; assigned to Technician T1; started; completed with repair_record.leak_class=LEAK_CONFIRMED (status=AWAITING_VERIFICATION)."
            - "Ingest an ACCEPTED reading from a Device on S1 after W1.completed_at to satisfy verification preconditions."
          trigger:
            - "POST /work-orders/W1/verify outcome=FAIL by MaintenanceSupervisor M1 (M1 != T1)."
            - "POST /work-orders/W1/start by T1 (re-entering IN_PROGRESS)."
            - "POST /work-orders/W1/complete with a repair_record."
            - "POST /work-orders/W1/verify outcome=PASS by M1."
          assert:
            - "After first FAIL: WorkOrder.status == 'IN_PROGRESS' and verification_failure_count == 1."
            - "After re-complete: WorkOrder.status == 'AWAITING_VERIFICATION'."
            - "After PASS: WorkOrder.status == 'CLOSED_VERIFIED' and verified_at is non-null."

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: topology_approval_three_hop_cascade
        grounds:
          - state_machines.TopologyVersion.UNDER_REVIEW_to_PUBLISHED
          - state_machines.TopologyVersion.PUBLISHED_to_SUPERSEDED
          - entities.Network.fields.active_topology_version_id
          - entities.Device.fields.status
          - entities.Device.fields.mounted_on_node_code
          - entities.Alert.fields.status
        distinguishing_aspect: |
          Originating trigger: POST /topology-versions/{id}/approve. Hop 1:
          approve mutates TopologyVersion(new).status → PUBLISHED and as a
          consequence (Hop 2) the previously-PUBLISHED TopologyVersion(old)
          transitions to SUPERSEDED. The mutation on the old version itself
          causes (Hop 3) any Device whose mounted_on_node_code no longer
          exists in the new active version to revert from ACTIVE to
          PROVISIONED; that Device mutation causes (Hop 4) any open Alert
          tied to a removed segment to transition to SUPPRESSED. Depth ≥ 3,
          each link caused by the previous link.
        test_recipe:
          setup:
            - "Network N1 with published TopologyVersion V1 containing node J1 and segment S1."
            - "Device DV1 ACTIVE, mounted_on_node_code=J1."
            - "Open Alert A1 with trigger_device_id=DV1 (still OPEN)."
            - "Draft TopologyVersion V2 that removes J1 and S1 (different node J2 only)."
            - "Submit V2 for review."
          trigger:
            - "POST /topology-versions/V2/approve (approver X-User-ID != submitter)."
          assert:
            - "TopologyVersion(V1).status == 'SUPERSEDED' (Hop 2)."
            - "Device(DV1).status == 'PROVISIONED' and mounted_on_node_code == null (Hop 3, caused by V1 going SUPERSEDED)."
            - "Alert(A1).status == 'SUPPRESSED' (Hop 4, caused by the segment removal that the version supersession exposed)."

      - name: critical_alert_dma_freeze_cascade
        grounds:
          - state_machines.Alert
          - entities.Alert.fields.severity
          - state_machines.DMA.OPEN_to_RESTRICTED
          - state_machines.DMA.RESTRICTED_to_FROZEN
          - entities.DMA.fields.open_critical_alert_count
          - state_machines.WorkOrder
        distinguishing_aspect: |
          Different triggering transition (Reading ingestion creates Alert)
          from instance 1 (topology approval). Hop 1: POST /devices/{id}/readings
          opens a new Alert (Alert.status=OPEN, severity=CRITICAL). Hop 2: the
          Alert insertion's side-effect recomputes DMA.open_critical_alert_count,
          and when the recomputed value crosses 0→1 the DMA itself transitions
          OPEN→RESTRICTED. Hop 3: the DMA mutation causes any non-terminal
          WorkOrder for that DMA in NEW status to remain creatable but be
          blocked from transitioning to ASSIGNED on subsequent attempts (the
          DMA mutation propagates as a precondition on WorkOrder.assign).
          Depth ≥ 2, each link caused by the previous link.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN (open_critical_alert_count=0)."
            - "Pressure Device DV1 mounted in D1 with valid_range_min=200, valid_range_max=600 and ACTIVE status."
            - "WorkOrder W1 status=NEW, dma_id=D1, target_segment_code valid."
          trigger:
            - "POST /devices/DV1/readings raw_value=520 (deviation = |520-400|/400*100 = 30.0% >= 30 → severity=CRITICAL, opens Alert A1)."
            - "POST /work-orders/W1/assign assigned_technician_id=T1."
          assert:
            - "Alert(A1).severity == 'CRITICAL' and Alert(A1).status == 'OPEN' (Hop 1)."
            - "DMA(D1).open_critical_alert_count == 1 and DMA(D1).status == 'RESTRICTED' (Hop 2, caused by Alert opening)."
            - "Assign returns 409 ERR_DMA_FROZEN or ERR_INVALID_STATE because DMA is RESTRICTED — i.e., the WorkOrder.NEW→ASSIGNED transition is blocked (Hop 3, caused by DMA posture mutation)."

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_conflict_on_approve
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.TopologyVersion.UNDER_REVIEW_to_PUBLISHED
        distinguishing_aspect: |
          Error-category pair = (state, business_safety). When a draft
          TopologyVersion (status=DRAFT, NOT under review) receives an
          approve request from the same X-User-ID who submitted it, both
          checks fail: state check (priority 4 → ERR_INVALID_STATE) and
          SoD check (priority 6 → ERR_SEGREGATION_OF_DUTIES). Per the
          pinned priority order, state precedes business_safety, so the
          response MUST be ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Network N1, TopologyVersion V1 in DRAFT status, submitted_by null."
          trigger:
            - "POST /topology-versions/V1/approve with X-User-Role=TopologyApprover, X-User-ID=U_same (same user that would otherwise be the submitter)."
          assert:
            - "Response HTTP 409 with data.error_id == 'ERR_INVALID_STATE' (state check wins because V1.status != UNDER_REVIEW)."

      - name: business_referential_vs_business_constraint_on_assign
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=4]
          - errors[ERR_WORK_ORDER_SEGMENT_MISSING]
          - errors[ERR_INVALID_STATE]
          - state_machines.WorkOrder.NEW_to_ASSIGNED
        distinguishing_aspect: |
          Different error-category pair (business_referential vs state). A
          WorkOrder in ASSIGNED status whose target_segment_code was removed
          from active topology fails both state check (priority 4 — the
          ASSIGNED→ASSIGNED transition is undefined) and referential check
          (priority 18 → ERR_WORK_ORDER_SEGMENT_MISSING). Per pinned order,
          state precedes business_referential, so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Network N1 with PUBLISHED topology V1 containing segment S1."
            - "WorkOrder W1 in ASSIGNED status with target_segment_code=S1."
            - "Submit and approve TopologyVersion V2 that removes S1 (W1.target_segment_code now references a non-existent segment AND W1.status==ASSIGNED, not NEW)."
          trigger:
            - "POST /work-orders/W1/assign (attempt to re-assign; both state and referential checks would fail)."
          assert:
            - "Response HTTP 409 with data.error_id == 'ERR_INVALID_STATE' (state precedes business_referential per priority ordering)."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: severity_critical_lower_edge_30_pct
        grounds:
          - calculations.alert_severity_classification
          - entities.Device.fields.valid_range_min
          - entities.Device.fields.valid_range_max
          - endpoints[POST /networks/{network_id}/devices/{id}/readings]
        distinguishing_aspect: |
          Metric: deviation_pct for pressure alerts. Boundary: >= 30 → CRITICAL.
          Endpoint: POST /devices/{id}/readings. At deviation_pct == 30.0
          exactly the alert MUST be CRITICAL (not WARNING) because the
          formula uses >=.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN, Device DV1 PRESSURE with valid_range_min=200, valid_range_max=600 (static baseline = 400)."
            - "DV1 ACTIVE; no historical readings (forces static_baseline)."
          trigger:
            - "POST /devices/DV1/readings observed_at=now, raw_value=520 (deviation_pct = |520-400|/400*100 = 30.0)."
            - "Independently, POST /devices/DV1/readings observed_at=now+60, raw_value=519 (deviation_pct = 29.75)."
          assert:
            - "First reading opens Alert with severity == 'CRITICAL' (deviation_pct == 30.0 is on the lower edge of CRITICAL)."
            - "Second reading aggregates into the SAME Alert (dedup window 900s) but the severity stays CRITICAL — downgrade is not allowed once classified; or, if first never existed, a fresh raw_value=519 produces an Alert with severity == 'WARNING' (29.75 < 30) — both branches validate the strict >= boundary."

      - name: water_balance_window_empty_dataset_zero_input
        grounds:
          - validations[priority=15]
          - errors[ERR_INSUFFICIENT_DATA]
          - calculations.dma_water_balance
          - endpoints[POST /networks/{network_id}/dmas/{dma_id}/water-balance-reports]
        distinguishing_aspect: |
          Different metric — empty-collection / zero-count edge. Endpoint
          POST /dmas/{dma_id}/water-balance-reports. When the inlet has zero
          ACCEPTED readings inside [window_start, window_end) the computed
          input_volume_m3 is exactly 0 and the formula's nrw_pct would
          divide by zero; the validation rejects with ERR_INSUFFICIENT_DATA
          rather than returning a report.
        test_recipe:
          setup:
            - "Network N1, DMA D1 with one inlet FLOW device DV1, status=ACTIVE."
            - "No Reading rows exist for DV1 (or all readings are ABNORMAL)."
          trigger:
            - "POST /dmas/D1/water-balance-reports window_start=T0, window_end=T0+86400 (valid window length, but empty dataset)."
          assert:
            - "Response HTTP 422 with data.error_id == 'ERR_INSUFFICIENT_DATA'."
            - "No WaterBalanceReport row is created (count of WaterBalanceReport for D1 remains 0)."

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: alert_resolution_requires_investigation_or_workorder_state
        grounds:
          - state_machines.Alert.INVESTIGATING_to_RESOLVED
          - entities.Alert.fields.status
          - entities.LeakInvestigation.fields.status
          - entities.WorkOrder.fields.status
        distinguishing_aspect: |
          Entity pair = (Alert, LeakInvestigation/WorkOrder). Alert can
          transition INVESTIGATING → RESOLVED only when the linked
          LeakInvestigation has reached a terminal state (CONFIRMED_LEAK or
          FALSE_POSITIVE) OR a CLOSED_VERIFIED WorkOrder references the same
          investigation. The valid set of Alert next-states depends on the
          state of a sibling entity, not on Alert's own state alone.
        test_recipe:
          setup:
            - "Network N1, Alert A1 in INVESTIGATING with LeakInvestigation INV1 in OPEN status."
          trigger:
            - "POST /alerts/A1/resolve resolution_note='early close'."
            - "Then dispatch INV1 → WorkOrder, technician completes, supervisor verifies PASS → INV1 → CONFIRMED_LEAK."
            - "Re-POST /alerts/A1/resolve."
          assert:
            - "First resolve attempt returns 409 ERR_INVALID_STATE because INV1.status is OPEN (precondition fails — Alert.next_state depends on INV1.status)."
            - "Second resolve attempt (after INV1 → CONFIRMED_LEAK) returns 200 and Alert(A1).status == 'RESOLVED'."

      - name: device_activation_requires_active_topology_node
        grounds:
          - state_machines.Device.PROVISIONED_to_ACTIVE
          - entities.Device.fields.mounted_on_node_code
          - entities.Network.fields.active_topology_version_id
          - entities.PipelineNode.fields.node_code
          - errors[ERR_DEVICE_UNMOUNTED]
        distinguishing_aspect: |
          Different entity pair (Device, Network/TopologyVersion). Device
          transitions PROVISIONED → ACTIVE only when mounted_on_node_code
          resolves to a PipelineNode under Network.active_topology_version_id.
          A Device referencing a node from a SUPERSEDED version fails because
          the active topology's node set is the gate.
        test_recipe:
          setup:
            - "Network N1 with PUBLISHED TopologyVersion V1 containing node J1; ACTIVE topology = V1."
            - "Device DV1 PROVISIONED, mounted_on_node_code=J1."
            - "Submit and approve V2 (without J1); V1 SUPERSEDED, V2 PUBLISHED, Network.active_topology_version_id=V2.id."
          trigger:
            - "POST /devices/DV1/activate."
          assert:
            - "Response 409 ERR_DEVICE_UNMOUNTED because J1 does not exist in active V2 (Device's valid next-state depends on the Network's active topology version)."
            - "Device(DV1).status == 'PROVISIONED' (unchanged) and mounted_on_node_code == null (because the V1→V2 cascade cleared it during V2 approval)."

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: alert_dedup_window_900s_inclusive
        grounds:
          - calculations.alert_aggregation_dedup
          - entities.Alert.fields.last_breach_at
          - entities.Alert.fields.occurrence_count
          - state_machines.Alert.OPEN_to_OPEN
        distinguishing_aspect: |
          Resource = Alert; interval semantics = inclusive-upper, fixed-width
          sliding window. Two consecutive breach readings on the same
          (trigger_device_id, alert_kind) within the 900-second sliding window
          (inclusive of equality) merge into one Alert; one second beyond,
          they produce a second Alert. Inclusivity on the upper edge is the
          pinned semantic.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN, Device DV1 PRESSURE valid_range 200..600, ACTIVE."
            - "Ingest reading at clock T=0 raw_value=520 (CRITICAL); Alert A1 opens with last_breach_at=ingested_at."
          trigger:
            - "Advance clock by exactly 900 seconds; POST another reading raw_value=520."
            - "Advance clock by another 1 second (now 901s after the first); POST another reading raw_value=520."
          assert:
            - "After the 900s-gap reading: Alert count for (DV1, PRESSURE_HIGH) == 1; A1.occurrence_count == 2 (inclusive boundary = merge)."
            - "After the 901s-gap reading: a NEW Alert A2 is created (count for the pair == 2); A2.occurrence_count == 1."

      - name: water_balance_window_half_open_exclusion
        grounds:
          - calculations.dma_water_balance
          - entities.WaterBalanceReport.fields.window_start
          - entities.WaterBalanceReport.fields.window_end
          - validations[priority=14]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: |
          Different resource (DMA/WaterBalanceReport vs Alert) and different
          interval semantics: half-open intervals [window_start, window_end)
          with fixed-length aggregate-capacity rule (length MUST be exactly
          one of {3600s, 86400s, 604800s}). A reading whose observed_at lies
          exactly at window_end is EXCLUDED. Buffer/aggregate semantics
          differ from the Alert sliding-window above.
        test_recipe:
          setup:
            - "Network N1, DMA D1, inlet FLOW DV1 ACTIVE."
            - "Ingest one reading at observed_at=T0 raw_value=5 L/s."
            - "Ingest one reading at observed_at=T0+86400 (exactly window_end) raw_value=10 L/s."
          trigger:
            - "POST /dmas/D1/water-balance-reports window_start=T0, window_end=T0+86400."
            - "Independently POST /dmas/D1/water-balance-reports window_start=T0, window_end=T0+7200 (length not in {3600,86400,604800})."
          assert:
            - "First report: only the T0 reading counts (input integrates the 5 L/s reading across full window) — the T0+86400 reading is excluded by the half-open upper edge."
            - "Second request returns 422 ERR_INVALID_WINDOW (length 7200 not in allowed set)."

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: topology_rollback_preserves_active_version_count
        grounds:
          - state_machines.TopologyVersion.SUPERSEDED_to_PUBLISHED
          - state_machines.TopologyVersion.PUBLISHED_to_SUPERSEDED
          - entities.TopologyVersion.fields.status
          - entities.Network.fields.active_topology_version_id
        distinguishing_aspect: |
          Conserved quantity: COUNT(TopologyVersion WHERE network_id=N1 AND
          status='PUBLISHED'). For any Network with at least one published
          version, this count MUST equal exactly 1 both before and after a
          rollback. The forward action (rollback target SUPERSEDED→PUBLISHED)
          paired with the compensating action (current PUBLISHED→SUPERSEDED)
          must leave the count invariant: +1 + (-1) = 0 net change. The
          formula is pinned over entity fields, not paraphrase.
        test_recipe:
          setup:
            - "Network N1 with TopologyVersion V1 PUBLISHED and V2 PUBLISHED (V1 auto-SUPERSEDED by approving V2)."
            - "Verify pre-condition: COUNT(status='PUBLISHED', network_id=N1) == 1 (only V2)."
          trigger:
            - "POST /topology-versions/V1/rollback."
          assert:
            - "POST-condition: COUNT(status='PUBLISHED', network_id=N1) == 1 (only V1 now)."
            - "Network.active_topology_version_id == V1.id and V2.status == 'SUPERSEDED' and V1.status == 'PUBLISHED'."

      - name: dma_critical_alert_counter_invariant_under_resolve_suppress
        grounds:
          - state_machines.Alert.INVESTIGATING_to_RESOLVED
          - state_machines.Alert.OPEN_to_SUPPRESSED
          - entities.DMA.fields.open_critical_alert_count
          - entities.Alert.fields.status
          - entities.Alert.fields.severity
        distinguishing_aspect: |
          Different conserved quantity: DMA.open_critical_alert_count MUST
          equal COUNT(Alert WHERE dma_id=this AND severity='CRITICAL' AND
          status IN {OPEN, ACKNOWLEDGED, INVESTIGATING}). The forward action
          (open Alert) increments by 1; either compensating action (resolve
          or suppress) decrements by 1. The pinned invariant: after any
          sequence of open/resolve/suppress, the counter equals the recomputed
          count over the entity table.
        test_recipe:
          setup:
            - "Network N1, DMA D1 OPEN, Device DV1 valid_range 200..600 ACTIVE."
            - "Pre-condition: D1.open_critical_alert_count == 0."
          trigger:
            - "POST a reading raw_value=520 → Alert A1 CRITICAL opens."
            - "POST another reading raw_value=520 ~3000s later → Alert A2 CRITICAL opens (separate Alert due to dedup window)."
            - "POST /alerts/A1/acknowledge then /alerts/A1/resolve resolution_note='ok'."
            - "POST /alerts/A2/suppress resolution_note='false positive'."
          assert:
            - "After A1 opens: D1.open_critical_alert_count == 1 (= COUNT over Alert rows)."
            - "After A2 opens: D1.open_critical_alert_count == 2 (= COUNT)."
            - "After A1 resolve: D1.open_critical_alert_count == 1 (compensating action restored invariant)."
            - "After A2 suppress: D1.open_critical_alert_count == 0 and DMA(D1).status == 'OPEN' (counter equals recomputed COUNT throughout)."
