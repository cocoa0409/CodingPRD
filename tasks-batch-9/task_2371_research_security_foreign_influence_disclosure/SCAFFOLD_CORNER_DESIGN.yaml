        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; two investigators, both with posture CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
