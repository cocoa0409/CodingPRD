              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_DUPLICATE_RMD_YEAR"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_close_then_reverse_preserves_employee_balance
        grounds:
          - state_machines.ContributionPeriod.OPEN_to_CLOSED
          - state_machines.ContributionPeriod.CLOSED_to_REVERSED
          - entities.Participant.fields.employee_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Participant.employee_balance_cents. Formal invariant:
          before_close == after_reverse for the same ContributionPeriod, ie.
          Participant.employee_balance_cents - (sum employee_contribution_cents
          of CLOSED ContributionPeriods on this participant) == 0 at all times.
          Different conserved quantity from instance 2 (outstanding loan).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan; ENROLLED participant; one OPEN ContributionPeriod."
