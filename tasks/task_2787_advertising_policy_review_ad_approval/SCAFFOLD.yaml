  # --- Test-driving endpoints (/_ namespace) --------------------------------
  - method: POST
    path: "/ad-policy/_clock/set_current_utc"
    description: "Set the server's logical clock to an ISO 8601 UTC instant. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. The clock never moves backwards (ERR_CLOCK_REWIND)."
    roles: [PolicyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["no entity is mutated; time-gated rules are re-evaluated only by the policy sweep"]

  - method: POST
    path: "/ad-policy/_policy-sweeps/run"
    description: "Run the deterministic policy sweep at the current logical clock: certification activation and expiry, appeal-window expiry, SLA expiry with replacement tasks, enforcement expiry and lifting, decay refresh, and release of SUSPENDED_HOLD creatives"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: "{ activated_certifications: integer, expired_certifications: integer, expired_notices: integer, expired_review_tasks: integer, requeued_review_tasks: integer, expired_enforcement_actions: integer, lifted_enforcement_actions: integer, released_hold_creatives: integer, decay_refreshed_advertisers: integer }"
    side_effects: ["sweep phases run in this fixed order: (1) certification activation, (2) certification expiry with creative re-routing, (3) appeal-window expiry, (4) review-task SLA expiry plus replacement task creation, (5) enforcement expiry, (6) decay refresh of violation_points_decayed and severity_index, (7) enforcement lifting, (8) release of SUSPENDED_HOLD creatives", "every affected entity's version increments by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or X-User-Role not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_ADVERTISER_SCOPE_VIOLATION
    http: 403
    condition: "An Advertiser acts on a creative, certification, notice or appeal belonging to a different advertiser_id, or a PolicyReviewer's X-User-ID is not an existing Reviewer.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewer adjudicating an appeal is the reviewer recorded on DisapprovalNotice.decided_by_reviewer_id"
  - id: ERR_REVIEWER_NOT_AUTHORIZED_COUNTRY
    http: 403
    condition: "A target country of the creative is absent from the claiming Reviewer.country_authorizations"
  - id: ERR_REVIEWER_QUEUE_MISMATCH
    http: 403
    condition: "The task's queue is absent from the claiming Reviewer.queue_specialties"

  # -- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, unknown field, missing required field, or a value violating its declared type, enum, length, decimal-precision or array constraint"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"

  # -- existence
  - id: ERR_ADVERTISER_NOT_FOUND
    http: 404
    condition: "advertiser_id in the path or body matches no Advertiser"
  - id: ERR_AD_CREATIVE_NOT_FOUND
    http: 404
    condition: "ad_creative_id in the path matches no AdCreative"
  - id: ERR_POLICY_RULE_NOT_FOUND
    http: 404
    condition: "policy_rule_id in the path or body, or a declared_category_codes / fetched_content_category value, matches no PolicyRule"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "reviewer_id in the path matches no Reviewer"
  - id: ERR_SCREENING_RUN_NOT_FOUND
    http: 404
    condition: "screening_run_id in the path matches no ScreeningRun"
  - id: ERR_REVIEW_TASK_NOT_FOUND
    http: 404
    condition: "review_task_id in the path matches no ReviewTask"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id in the path, or evidence_certification_id in the body, matches no Certification"
  - id: ERR_DISAPPROVAL_NOTICE_NOT_FOUND
    http: 404
    condition: "disapproval_notice_id in the path or body matches no DisapprovalNotice"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id in the path matches no Appeal"
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "enforcement_action_id in the path, or prior_action_id in the body, matches no EnforcementAction"

  # -- state preconditions
  - id: ERR_INVALID_CREATIVE_STATE
    http: 409
    condition: "The AdCreative's review_status or destination_status admits no such transition (e.g. submit on SCREENING, screening-run on DRAFT, PATCH on APPROVED_LIMITED, destination-check on WITHDRAWN)"
  - id: ERR_INVALID_TASK_STATE
    http: 409
    condition: "claim on a non-QUEUED task, release or decision on a non-CLAIMED task, or requeue on a non-ESCALATED task"
  - id: ERR_NOTICE_NOT_APPEALABLE
    http: 409
    condition: "The addressed DisapprovalNotice.status is not ISSUED"
  - id: ERR_APPEAL_NOT_PENDING
    http: 409
    condition: "The addressed Appeal.status is not SUBMITTED or its notice is not APPEALED"
  - id: ERR_INVALID_CERTIFICATION_STATE
    http: 409
    condition: "Revoking a Certification whose status is already EXPIRED or REVOKED"

  # -- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_CREATIVE_VERSION
    http: 412
    condition: "expected_ad_creative_version does not equal the current AdCreative.version"
  - id: ERR_STALE_ADVERTISER_VERSION
    http: 412
    condition: "expected_advertiser_version does not equal the current Advertiser.version"

  # -- safety and compliance
  - id: ERR_PROHIBITED_CATEGORY_BLOCKED
    http: 422
    condition: "Approving a creative that matched a PROHIBITED rule, or whose retained countries include one whose strictest disposition is BLOCKED"
  - id: ERR_ADVERTISER_SUSPENDED
    http: 409
    condition: "Creating, revising, submitting a creative or submitting a certification while the owning Advertiser.account_status is SUSPENDED"
  - id: ERR_POLITICAL_ELIGIBILITY_MISSING
    http: 422
    condition: "Approving a creative with political_flag true while Advertiser.political_eligibility_status is not ELIGIBLE"
  - id: ERR_POLITICAL_DISCLOSURE_MISSING
    http: 422
    condition: "Approving while disclaimer_text is null or empty and the creative is political or a matched rule / retained country demands a disclaimer"
  - id: ERR_ADVERTISER_RESTRICTED_CATEGORY
    http: 409
    condition: "A RESTRICTED advertiser creates a creative in a PROHIBITED or RESTRICTED category, or a political creative"

  # -- reviewer capacity and queue constraints
  - id: ERR_REVIEWER_OFFLINE
    http: 409
    condition: "The claiming Reviewer.status is OFFLINE"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 409
    condition: "Reviewer.claimed_task_count already equals Reviewer.max_concurrent_claims"

  # -- certification, interval and temporal constraints
  - id: ERR_CERTIFICATION_MISSING
    http: 422
    condition: "APPROVE_WITH_LIMITS with no ACTIVE covering Certification at the logical clock for a retained country that demands a license"
  - id: ERR_INVALID_LIMITED_COUNTRIES
    http: 422
    condition: "limited_country_codes empty, containing duplicates, or not a subset of the creative's target_country_codes"
  - id: ERR_INVALID_VALIDITY_WINDOW
    http: 422
    condition: "Certification valid_until is not strictly after valid_from"
  - id: ERR_CERTIFICATION_INTERVAL_OVERLAP
    http: 409
    condition: "A new certification interval intersects an existing SUBMITTED/ACTIVE interval for the same (advertiser_id, policy_rule_id, issuing_country_code); adjacency at an endpoint does not trigger it"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "The logical clock has reached or passed DisapprovalNotice.appeal_deadline_at"
  - id: ERR_ENFORCEMENT_COOLDOWN_CONFLICT
    http: 409
    condition: "A manual enforcement action would take effect inside an existing action's window extended by ENFORCEMENT_COOLDOWN_HOURS, inclusive at both ends"
  - id: ERR_CLOCK_REWIND
    http: 409
    condition: "to_iso8601 is earlier than the current logical clock, or is not a valid ISO 8601 UTC instant"

  # -- referential and duplicate constraints
  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "An Appeal already exists for the addressed disapproval_notice_id"
  - id: ERR_UNKNOWN_POLICY_CATEGORY
    http: 422
    condition: "fetched_content_category is neither the literal GENERAL nor an existing PolicyRule.code"
  - id: ERR_INVALID_REASON_CODE
    http: 422
    condition: "A DISAPPROVE reason_code contradicts current state (CLOAKING without CLOAKING_CONFIRMED, DESTINATION_MISMATCH without MISMATCH_FLAGGED, POLITICAL_DISCLOSURE on a non-political creative, CERT_MISSING with no certification-demanding matched rule, or AUTO_SCREENING on a reviewer decision)"
  - id: ERR_CERTIFICATION_OWNER_MISMATCH
    http: 422
    condition: "evidence_certification_id belongs to a different advertiser than the appealed notice's creative"
  - id: ERR_DUPLICATE_POLICY_CODE
    http: 409
    condition: "PolicyRule.code already exists, or a CountryPolicyOverride already exists for that (policy_rule_id, country_code)"
  - id: ERR_INVALID_THRESHOLD_ORDER
    http: 422
    condition: "confidence_auto_disapprove_threshold is not strictly greater than confidence_manual_threshold"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# Role model: segregation_of_duties. The reviewer who issues a disapproval may
# never adjudicate its appeal (validations[priority=58]), and no role can both
# ingest classifier evidence (PolicyAdmin) and record destination evidence
# (IntegrityAnalyst).
roles:
  - name: Advertiser
    description: "The advertising account itself: authors creatives, submits them, holds certifications and files appeals"
    identity: "entity_backed:Advertiser"
    exclusive_operations:
      - "POST /ad-policy/ad-creatives"
      - "PATCH /ad-policy/ad-creatives/{id}"
      - "POST /ad-policy/ad-creatives/{id}/submit"
      - "POST /ad-policy/ad-creatives/{id}/withdraw"
      - "POST /ad-policy/appeals"
    shared_operations:
      - "POST /ad-policy/certifications (shared with PolicyAdmin)"
      - "every GET endpoint, scoped to the acting advertiser's own resources for creatives, certifications, notices, appeals, archive entries and ledger entries"

  - name: PolicyReviewer
    description: "Human reviewer who claims queued tasks for restricted and regulated categories and adjudicates appeals"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /ad-policy/review-tasks/{id}/claim"
      - "POST /ad-policy/review-tasks/{id}/release"
      - "POST /ad-policy/review-tasks/{id}/decision"
      - "POST /ad-policy/appeals/{id}/decision"
    shared_operations:
      - "every GET endpoint"

  - name: IntegrityAnalyst
    description: "Operator who records landing-page and destination evidence, the only source of mismatch and cloaking findings"
    identity: "opaque"
    exclusive_operations:
      - "POST /ad-policy/ad-creatives/{id}/destination-checks"
    shared_operations:
      - "every GET endpoint"

  - name: PolicyAdmin
    description: "Platform policy operator: maintains the policy framework, onboards advertisers and reviewers, ingests classifier runs, revokes certifications, requeues escalations, mints manual enforcement, and drives the clock and sweep endpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /ad-policy/policy-rules"
      - "POST /ad-policy/policy-rules/{id}/country-overrides"
      - "POST /ad-policy/advertisers"
      - "POST /ad-policy/advertisers/{id}/verifications"
      - "POST /ad-policy/advertisers/{id}/enforcement-actions"
      - "POST /ad-policy/reviewers"
      - "PATCH /ad-policy/reviewers/{id}"
      - "POST /ad-policy/ad-creatives/{id}/screening-runs"
      - "POST /ad-policy/review-tasks/{id}/requeue"
      - "POST /ad-policy/certifications/{id}/revoke"
      - "POST /ad-policy/_clock/set_current_utc"
      - "POST /ad-policy/_policy-sweeps/run"
    shared_operations:
      - "POST /ad-policy/certifications (shared with Advertiser)"
      - "every GET endpoint, unscoped"
