          assert:
            - "before any change Unit.${u_po} reports licensed_placement_bed_count == 5, raw_available_bed_count == 5, posture == \"OPEN\", effective_available_bed_count == 5 (the SECLUSION bed is excluded from both counts)"
            - "after three beds go OUT_OF_SERVICE: licensed_placement_bed_count == 2, raw_available_bed_count == 2, restricted_threshold is max(1, floor(2*0.20)) == 1 so posture == \"OPEN\" and effective_available_bed_count == 2"
            - "after the fourth: licensed_placement_bed_count == 1, raw_available_bed_count == 1 <= 1 so posture == \"RESTRICTED\", safety_reserve_beds == 1 and effective_available_bed_count == 0 - a physically free bed exists yet ordinary placement is blocked"
            - "after the fifth: licensed_placement_bed_count == 0, raw_available_bed_count == 0 so posture == \"CLOSED\" and effective_available_bed_count == 0, even though Bed.${b_p6} is still AVAILABLE"
            - "Unit.${u_po}.version increased by exactly 1 per accepted PATCH (five increments in total) and each patched Bed.status == \"OUT_OF_SERVICE\" with its own version incremented by 1"
            - "no queued-admission promotion fires on any of these transitions because posture never leaves CLOSED"

