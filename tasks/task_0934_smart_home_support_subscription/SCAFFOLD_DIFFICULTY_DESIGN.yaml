  - rule_id: transitive_cascade
    instances:
      - name: third_failed_remote_session_cascades_five_hops_to_campaign_completion
        grounds:
          - state_machines.RemoteSession.lifecycle.IN_PROGRESS_to_COMPLETED
          - state_machines.Ticket.workflow.REMOTE_DIAG_to_DISPATCH_PENDING
          - state_machines.Device.lifecycle.ACTIVE_to_SERVICE_HOLD
          - state_machines.FirmwareRollout.lifecycle.PENDING_to_BLOCKED_BY_SERVICE
          - state_machines.FirmwareCampaign.lifecycle.RING_ACTIVE_to_COMPLETED
          - calculations.remote_escalation_threshold
          - calculations.ring_failure_rate_and_halt
        distinguishing_aspect: |
          One POST /remote-sessions/{id}/complete propagates through five causally
          chained hops — RemoteSession -> Ticket -> Device -> FirmwareRollout ->
          FirmwareCampaign — where each hop is caused by the previous hop's own
          mutation, not by the original request; the trigger is a remote-session
          verdict, distinct from the visit-completion trigger of the sibling instance.
