  - section: errors
    instances:
      - name: facility_create_with_extra_field_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Unknown request fields are rejected rather than ignored: the schema pass is closed, so a
          typo'd or speculative key fails the create with 422 and no facility is written.
        test_recipe:
          setup:
            - "Empty system at the default clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000, required_assurance_cents: 1 }
              as: PlatformAdmin
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /tsdf/facilities returns total_count == 0"

