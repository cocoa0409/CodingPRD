      - name: yard_slot_single_occupancy_aggregate_capacity
        grounds:
          - calculations.yard_slot_selector
          - errors[ERR_NO_YARD_SLOT_AVAILABLE]
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE capacity on a shared resource: a
          YardSlot accepts only ONE occupying container at a time
          (current_height = 1 hard cap); a second ground attempt to the same
          slot is not possible because the slot's status has flipped EMPTY ->
          OCCUPIED, removing it from the eligibility set. Distinct semantics
          from instance 1 (which is closed-interval time-membership). When ALL
          slots are occupied, selector returns empty -> ERR_NO_YARD_SLOT_AVAILABLE.
        test_recipe:
          setup:
            - "Terminal T1 with yard_slot_count=1 and a single YardSlot S1"
            - "Train TR1 ARRIVED"
            - "Containers C1 and C2 both INBOUND_TRAIN on TR1"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 1 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "C0000000001", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {c1: $.data.id}
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "C0000000002", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {c2: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v1: $.data.version}
            - call: "POST /terminals/${tid}/containers/${c1}/ground"
              payload: { expected_terminal_version: "${t_v1}" }
              as: YardPlanner
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v2: $.data.version}
          trigger:
            - call: "POST /terminals/${tid}/containers/${c2}/ground"
              payload: { expected_terminal_version: "${t_v2}" }
              as: YardPlanner
              captures: {err: $.data.error_id}
          assert:
            - "First ground succeeded; S1 now OCCUPIED"
            - "Second ground attempt returns $.data.error_id == ERR_TERMINAL_CLOSED OR ERR_NO_YARD_SLOT_AVAILABLE (posture flips to CLOSED when yard_slots_free==0; posture check at priority 11 fires before selector at priority 12)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: yard_slot_count_invariant_under_ground_and_void
        grounds:
          - entities.Terminal.fields.yard_slot_count
          - entities.Terminal.fields.yard_slots_in_use
          - entities.Terminal.fields.yard_slots_free
          - state_machines.Container
          - state_machines.YardSlot
        distinguishing_aspect: |
          Conserved quantity = yard_slot_count. Invariant: at every observable
          point, yard_slots_in_use + yard_slots_free == yard_slot_count. Forward
          action (ground container) decrements free and increments in_use;
          compensating action (void container) reverses both. After the
          forward+compensate pair, the equality holds exactly as before.
        test_recipe:
          setup:
            - "Terminal T1 with yard_slot_count=5"
            - "YardSlot S1; Train TR1 ARRIVED; Container C1 INBOUND_TRAIN"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 5 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_free_before: $.data.yard_slots_free, t_in_use_before: $.data.yard_slots_in_use, t_v: $.data.version}
          trigger:
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_free_after_ground: $.data.yard_slots_free, t_in_use_after_ground: $.data.yard_slots_in_use}
            - call: "POST /terminals/${tid}/containers/${cid}/void"
              payload: {}
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_free_after_void: $.data.yard_slots_free, t_in_use_after_void: $.data.yard_slots_in_use}
          assert:
            - "Before ground: yard_slots_in_use == 0, yard_slots_free == 5, sum == 5"
            - "After ground: yard_slots_in_use == 1, yard_slots_free == 4, sum == 5 (conserved)"
            - "After void: yard_slots_in_use == 0, yard_slots_free == 5, sum == 5 (compensated, invariant restored)"

      - name: carrier_outstanding_billing_invariant_under_apply_and_waive
        grounds:
          - entities.Carrier.fields.outstanding_billing_cents
          - entities.BillingLedgerEntry.fields.applied_cents
          - state_machines.BillingLedgerEntry
        distinguishing_aspect: |
          Conserved quantity = sum over all BillingLedgerEntry rows of
          (amount_cents - applied_cents) for status IN (OPEN, PARTIALLY_APPLIED)
          PLUS the carrier's outstanding_billing_cents reduction matches. After
          a forward (apply payment) + compensate (waive remainder), the carrier's
          outstanding_billing_cents returns to zero and all entries reach
          terminal states (APPLIED or WAIVED). Different conserved quantity
          from instance 1 (slot counts vs billing balance).
        test_recipe:
          setup:
            - "Terminal, Container grounded; clock advanced past free-time; run_ops produced a PER_DIEM BillingLedgerEntry (OPEN, amount_cents=45000)"
            - "Carrier CAR (the one that booked the ground... actually no — ledger entries from run_ops are billed to the carrier that owns the container; for simplicity, assume the container's carrier_id is set via the train's operator or via an explicit field we add)"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car}" }
              as: PoolAdministrator
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${cid}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-11T11:00:00Z" }
              as: GateSupervisor
              captures: {appt: $.data.id}
            - call: "POST /terminals/${tid}/appointments/${appt}/check_in"
              payload: { driver_id: "DRV-A" }
              as: GateClerk
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v: $.data.version}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/reserve"
              payload: { appointment_id: "${appt}", expected_pool_version: "${p_v}" }
              as: GateSupervisor
            - call: "POST /terminals/${tid}/transactions"
              payload: { appointment_id: "${appt}", driver_id: "DRV-A", gate_lane: "L1", chassis_id: "${ch1}" }
              as: GateClerk
              captures: {tx: $.data.id}
            - call: "POST /terminals/${tid}/transactions/${tx}/complete"
              payload: {}
              as: GateClerk
            - call: "GET /carriers/${car}"
              payload: {}
              as: BillingClerk
              captures: {car_outstanding_before: $.data.outstanding_billing_cents, car_v: $.data.version}
            - call: "GET /terminals/${tid}/ledger"
              payload: {}
              as: BillingClerk
              captures: {ledger_id: "$.data[0].id", ledger_amount: "$.data[0].amount_cents"}
          trigger:
            - call: "POST /terminals/${tid}/ledger/${ledger_id}/apply"
              payload: { apply_cents: 3000, expected_carrier_version: "${car_v}" }
              as: BillingClerk
            - call: "GET /carriers/${car}"
              payload: {}
              as: BillingClerk
              captures: {car_outstanding_mid: $.data.outstanding_billing_cents}
            - call: "POST /terminals/${tid}/ledger/${ledger_id}/waive"
              payload: {}
              as: TerminalManager
            - call: "GET /carriers/${car}"
              payload: {}
              as: BillingClerk
              captures: {car_outstanding_after: $.data.outstanding_billing_cents}
            - call: "GET /terminals/${tid}/ledger/${ledger_id}"
              payload: {}
              as: BillingClerk
              captures: {ledger_status: $.data.status}
          assert:
            - "Before apply: Carrier.outstanding_billing_cents == 5000 (flip fee from OUT completion)"
            - "After apply 3000: Carrier.outstanding_billing_cents == 2000"
            - "After waive: Carrier.outstanding_billing_cents == 0 (forward+compensate restore to zero)"
            - "BillingLedgerEntry.${ledger_id}.status == WAIVED"
