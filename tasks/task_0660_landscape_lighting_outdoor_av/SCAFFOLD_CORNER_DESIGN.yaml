        test_recipe:
          setup: ["Two projects; a transformer exists under project B; a zone is created under project A referencing project B's transformer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_v1@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
