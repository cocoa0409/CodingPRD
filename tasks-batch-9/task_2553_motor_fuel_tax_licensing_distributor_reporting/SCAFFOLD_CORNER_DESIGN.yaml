# SCAFFOLD_CORNER_DESIGN.yaml - Section 1.9, breadth probe.
# Companion to SCAFFOLD.yaml (Sections 1.0-1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml (Section 1.8).
# The walk below traverses references/claim-extraction-guide.md section by section against this
# scaffold's declared surface. Corners already asserted by a Section 1.8 instance carry an
# `excluded_because:` stub and no test_recipe. Unless a recipe sets the clock explicitly, the
# logical clock stands at its startup default 2026-08-01T00:00:00Z.

scaffold_corner_design:
  - section: entities
    instances:
      - name: licensee_creation_returns_201_with_system_fields_stamped
        claim_type: creation
        grounds:
          - entities.Licensee
          - endpoints[POST /mft/licensees]
          - response_envelope.success
        distinguishing_aspect: "A POST carrying only the four required inputs returns 201 with the envelope's meta/response_type/data shape, a server-minted id, created_at, updated_at and version == 1, and the licensee sitting in its declared initial status PENDING_BOND."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Cedar Bluff Fuel Supply LLC", fein: "41-2000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id }
          assert:
            - "HTTP 201; the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "data.id is a server-minted non-empty string; data.version == 1; data.created_at and data.updated_at are present and equal"
            - "data.legal_name == Cedar Bluff Fuel Supply LLC, data.fein == 41-2000001, data.license_type == SUPPLIER, data.mailing_state == MN"
            - "data.status == PENDING_BOND (the Licensee machine's initial_state)"
            - "GET /mft/licensees/${lic_id} returns the same id, status and version"

      - name: terminal_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Terminal
          - endpoints[POST /mft/terminals]
          - endpoints[GET /mft/terminals/{id}]
        distinguishing_aspect: "GET /mft/terminals/{id} echoes exactly the terminal_control_number, name and state_code that were stored, with response_type == object - no field renaming and no derived data."
        test_recipe:
          setup:
            - "One Terminal registered by the licensing desk."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41MN0001", name: "Rosemount Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "GET /mft/terminals/${term_id}"
              payload: {}
              as: ReturnsExaminer
          assert:
            - "HTTP 200; response_type == object; data.id == ${term_id}"
            - "data.terminal_control_number == T41MN0001, data.name == Rosemount Rack, data.state_code == MN"
            - "data.version == 1 (Terminal carries the common fields)"

      - name: licensee_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /mft/licensees]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three licensees stored, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false - total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Three Licensees created; no other rows."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Alpha Fuel Supply LLC", fein: "41-2100001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Bravo Distribution Inc", fein: "41-2100002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Charlie Retail Stops LLC", fein: "41-2100003", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
          trigger:
            - call: "GET /mft/licensees"
              payload: { limit: 2, offset: 0 }
              as: LicensingOfficer
            - call: "GET /mft/licensees"
              payload: { limit: 2, offset: 2 }
              as: LicensingOfficer
          assert:
            - "first call: HTTP 200, response_type == array, exactly 2 rows in data, total_count == 3, has_more == true"
            - "second call: exactly 1 row in data, total_count == 3, has_more == false"
            - "GET /mft/licensees with payload { license_type: DISTRIBUTOR } returns exactly 1 row with total_count == 1"
            - "no licensee id appears in both pages"

      - name: licensee_get_with_unused_uuid_returns_licensee_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /mft/licensees/{id}]
          - validations[priority=40]
          - errors[ERR_LICENSEE_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unused id on the licensee path resolves to ERR_LICENSEE_NOT_FOUND at priority 40 with HTTP 404 - not a 200 with a null body and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database; no licensee has been created, so no id can collide."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "GET /mft/licensees/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; response_type == error; data.error_id == ERR_LICENSEE_NOT_FOUND"
            - "no Licensee row is created as a side effect (GET /mft/licensees returns total_count == 0)"

      - name: licensee_create_missing_license_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Licensee.fields.license_type
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "license_type has source input and no default, so omitting it is a schema failure caught at priority 30 with HTTP 400 - the row must not be created with a guessed license_type."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Delta Fuel Supply LLC", fein: "41-2200001", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"
            - "GET /mft/licensees returns total_count == 0"

      - name: licensee_defaults_apply_when_election_and_channel_omitted
        claim_type: defaults
        grounds:
          - entities.Licensee.fields.gross_net_election
          - entities.Licensee.fields.retail_channel
          - entities.Licensee.fields.dyed_violation_count
          - entities.Licensee.fields.late_filing_count
        distinguishing_aspect: "Omitting the two optional inputs yields gross_net_election NET and retail_channel NOT_APPLICABLE, and the four compliance counters all start at 0 - defaults are materialised on the row, not left null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Echo Transport Lines LLC", fein: "41-2300001", license_type: "TRANSPORTER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id }
          assert:
            - "data.gross_net_election == NET and data.retail_channel == NOT_APPLICABLE"
            - "data.parent_licensee_id is null"
            - "data.dyed_violation_count == 0, data.late_filing_count == 0, data.open_audit_count == 0, data.open_discrepancy_count == 0"
            - "data.balance_cents == 0 and data.effective_taxable_gallons_ytd == 0.00"
            - "data.required_bond_cents == 750000 (500000 assumed liability * 3 months * TRANSPORTER multiplier 0.5 = 750000, already a multiple of BOND_ROUNDING_CENTS)"

      - name: licensee_bond_computed_fields_rederived_after_bond_post
        claim_type: computed_fields
        grounds:
          - entities.Licensee.fields.posted_bond_cents
          - entities.Licensee.fields.bond_deficiency_cents
          - calculations.licensee_bond_requirement
          - endpoints[GET /mft/licensees/{id}/bond-status]
        distinguishing_aspect: "posted_bond_cents and bond_deficiency_cents are recomputed by the bond post itself, and the computed-read endpoint reports the same numbers as the entity row - a partial 900000 bond leaves a 600000 deficiency rather than being rounded up or accepted as sufficient."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR with no returns, so required_bond_cents is 1500000 from the assumed-liability path."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Foxtrot Distribution Inc", fein: "41-2400001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
          trigger:
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 900000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${lic_v0}" }
              as: LicensingOfficer
              captures: { bond_id: $.data.id }
          assert:
            - "HTTP 201; data.status == ACTIVE and data.release_reason is null"
            - "GET /mft/licensees/${lic_id} reports posted_bond_cents == 900000, required_bond_cents == 1500000, bond_deficiency_cents == 600000"
            - "GET /mft/licensees/${lic_id}/bond-status reports the identical four numbers plus basis_return_count == 0"
            - "the licensee's version advanced past ${lic_v0} (the bond post bumps the parent)"

      - name: licensee_create_cannot_set_status_or_balance_system_fields
        claim_type: system_fields
        grounds:
          - entities.Licensee.fields.status
          - entities.Licensee.fields.balance_cents
          - endpoints[POST /mft/licensees].input
          - validations[priority=30]
        distinguishing_aspect: "status is source system and balance_cents is source computed, and neither appears in the endpoint's input list, so a body that tries to seed them is refused at priority 30 rather than silently honoured or silently dropped."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Golf Fuel Supply LLC", fein: "41-2500001", license_type: "SUPPLIER", mailing_state: "MN", status: "ACTIVE", balance_cents: -50000 }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST (unknown body fields are not accepted)"
            - "GET /mft/licensees returns total_count == 0, so no ACTIVE licensee was created with a client-supplied status"

      - name: rack_removal_net_above_gross_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.RackRemoval.fields.net_gallons
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "net_gallons <= gross_gallons is a declared numeric constraint, so 5010.00 net against 5000.00 gross is a 400 at priority 30 - it must fail before the imposition calculation gets to pick a basis."
        test_recipe:
          setup:
            - "One Terminal, one ACTIVE SUPPLIER position holder (bond 1500000 posted) and one ACTIVE RETAILER purchaser (bond 400000 posted)."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41MN0002", name: "Alexandria Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Hotel Fuel Supply LLC", fein: "41-2600001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "India Retail Stops LLC", fein: "41-2600002", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id, ret_v0: $.data.version }
            - call: "POST /mft/licensees/${ret_id}/bonds"
              payload: { amount_cents: 400000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${ret_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${ret_id}/activate"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${ret_id}", product_code: "GASOLINE", gross_gallons: 5000.00, net_gallons: 5010.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-BAD-0001" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"
            - "GET /mft/rack-removals with payload { terminal_id: ${term_id} } returns total_count == 0"

      - name: licensee_create_unknown_license_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Licensee.fields.license_type.constraints
          - validations[priority=30]
        distinguishing_aspect: "license_type is a closed five-member enum; a plausible-but-undeclared member (TERMINAL_OPERATOR) is refused at priority 30 rather than stored as free text."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Juliet Terminal Services LLC", fein: "41-2700001", license_type: "TERMINAL_OPERATOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"
            - "GET /mft/licensees returns total_count == 0"

      - name: rack_removal_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.RackRemoval
          - entities.RackRemoval.common_fields
          - calculations.rack_removal_tax_imposition
        distinguishing_aspect: "RackRemoval declares common_fields false: the created row exposes no version and no updated_at, Section 1.5 declares no update or delete verb for it, and its computed tax fields are frozen at creation."
        test_recipe:
          setup:
            - "One Terminal, one ACTIVE NET-electing SUPPLIER position holder and one ACTIVE RETAILER purchaser, both fully bonded."
            - "One in-state GASOLINE removal of 5000.00 gross / 4975.00 net gallons to the RETAILER, so branch 2f imposes the tax at the rack on the NET basis."
          setup_api_calls:
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41MN0003", name: "Duluth Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Kilo Fuel Supply LLC", fein: "41-2800001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Lima Retail Stops LLC", fein: "41-2800002", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id, ret_v0: $.data.version }
            - call: "POST /mft/licensees/${ret_id}/bonds"
              payload: { amount_cents: 400000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${ret_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${ret_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${ret_id}", product_code: "GASOLINE", gross_gallons: 5000.00, net_gallons: 4975.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-IMM-0001" }
              as: ReturnsExaminer
              captures: { rr_id: $.data.id }
          trigger:
            - call: "GET /mft/rack-removals/${rr_id}"
              payload: {}
              as: ReturnsExaminer
          assert:
            - "HTTP 200; data.id == ${rr_id}; data has no version field and no updated_at field (created_at only)"
            - "data.basis_used == NET, data.taxable_gallons == 4975.00, data.imposition_point == TERMINAL_RACK, data.tax_imposed == true"
            - "data.tax_amount_cents == 142285 (round_half_up(4975.00 * 28.6)) and data.deferred_tax_cents == 0"
            - "Section 1.5 declares no PUT, PATCH or DELETE on /mft/rack-removals/{id}, so the row has no mutation path"

      - name: schedule_line_create_under_unused_schedule_id_returns_schedule_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ScheduleLine.parent
          - validations[priority=46]
          - errors[ERR_SCHEDULE_NOT_FOUND]
        distinguishing_aspect: "ScheduleLine's parent is ReturnSchedule and the parent id lives in the path, so an unused schedule id is ERR_SCHEDULE_NOT_FOUND at priority 46 - before any counterparty-type or duplicate-BOL business check on the body."
        test_recipe:
          setup:
            - "One DISTRIBUTOR licensee exists so the body's counterparty id resolves; no ReturnSchedule has been created."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Mike Fuel Supply LLC", fein: "41-2900001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /mft/schedules/00000000-0000-4000-8000-000000000777/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-07-10", bill_of_lading_number: "BOL-ORPHAN-0001" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_SCHEDULE_NOT_FOUND"
            - "GET /mft/schedule-lines with payload { counterparty_licensee_id: ${sup_id} } returns total_count == 0"

      - name: exemption_certificate_for_unused_purchaser_id_returns_licensee_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ExemptionCertificate.fields.purchaser_licensee_id
          - validations[priority=55]
          - errors[ERR_LICENSEE_NOT_FOUND]
        distinguishing_aspect: "purchaser_licensee_id is a body FK, so it is resolved by the priority-55 band (body-FK 404s) rather than the priority-40 path band, and the certificate must not be created dangling."
        test_recipe:
          setup:
            - "Empty database; no licensee exists to own the certificate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "00000000-0000-4000-8000-000000000555", exemption_type: "GOVERNMENT", document_number: "CERT-ORPHAN-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_LICENSEE_NOT_FOUND"
            - "GET /mft/exemption-certificates returns total_count == 0"

      - name: schedule_line_is_reverse_reachable_from_its_counterparty_licensee
        claim_type: listing
        grounds:
          - entities.ScheduleLine.fields.counterparty_licensee_id
          - endpoints[GET /mft/schedule-lines]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The graph topology's many-to-many edge between two Licensees runs through ScheduleLine.counterparty_licensee_id, and the filtered-list GET makes that edge reachable from the counterparty side - the side that does not own the parent return."
        test_recipe:
          setup:
            - "One SUPPLIER and one DISTRIBUTOR; the distributor holds a DRAFT 2026-07 return with a SCH_1 UNDYED_DIESEL schedule carrying one 100.00 gallon line naming the supplier."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "November Fuel Supply LLC", fein: "41-3000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Oscar Distribution Inc", fein: "41-3000002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-07" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-07-09", bill_of_lading_number: "BOL-GRAPH-0001" }
              as: ReturnsExaminer
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /mft/schedule-lines"
              payload: { counterparty_licensee_id: "${sup_id}" }
              as: ReturnsExaminer
          assert:
            - "HTTP 200; response_type == array; total_count == 1 and the single row's id == ${line_id}"
            - "the row reports schedule_id == ${sch_id}, gallons == 100.00 and transaction_type == PURCHASE"
            - "GET /mft/schedules/${sch_id}/lines returns the same single row from the owning side, and GET /mft/schedules/${sch_id} reports line_count == 1"
            - "GET /mft/schedule-lines with payload { counterparty_licensee_id: ${dist_id} } returns total_count == 0 (the edge is directional)"

  - section: state_machines
    instances:
      - name: licensee_activate_moves_pending_bond_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.Licensee.PENDING_BOND_to_ACTIVE
          - endpoints[POST /mft/licensees/{id}/activate]
        distinguishing_aspect: "A fully bonded PENDING_BOND licensee activates: status becomes ACTIVE, required_bond_cents is recomputed with suspension multiplier 1.0 (still 1500000) and the licensee's version advances."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR carrying a single ACTIVE 1500000-cent bond, so bond_deficiency_cents is 0."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Papa Distribution Inc", fein: "41-3100001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${lic_v0}" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees/${lic_id}/activate"
              payload: {}
              as: LicensingOfficer
          assert:
            - "HTTP 200; data.status == ACTIVE"
            - "data.required_bond_cents == 1500000, data.posted_bond_cents == 1500000, data.bond_deficiency_cents == 0"
            - "data.version is greater than ${lic_v0} (the bond post and the activate each bumped the licensee)"
            - "GET /mft/licensees with payload { status: ACTIVE } returns total_count == 1"

      - name: activate_while_underbonded_returns_bond_deficiency_blocks_activation
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Licensee.PENDING_BOND_to_ACTIVE.preconditions
          - validations[priority=502]
          - errors[ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION]
        distinguishing_aspect: "The PENDING_BOND -> ACTIVE edge is guarded by bond_deficiency_cents == 0; a 900000-cent bond against a 1500000-cent requirement is refused with ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION (422) and the status stays PENDING_BOND."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR whose only ACTIVE bond is 900000 cents against a 1500000-cent requirement."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Quebec Distribution Inc", fein: "41-3200001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 900000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${lic_v0}" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees/${lic_id}/activate"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION"
            - "GET /mft/licensees/${lic_id} still reports status == PENDING_BOND and bond_deficiency_cents == 600000"

      - name: new_bond_post_supersedes_the_prior_active_bond
        claim_type: side_effect_execution
        grounds:
          - state_machines.BondInstrument.ACTIVE_to_RELEASED
          - endpoints[POST /mft/licensees/{id}/bonds].side_effects
          - calculations.licensee_bond_requirement
        distinguishing_aspect: "Posting a second bond releases the first with release_reason SUPERSEDED_BY_NEW_BOND, so posted_bond_cents becomes the new bond's 1500000 alone and never the 2400000 sum of both."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR carrying one ACTIVE 900000-cent bond; the licensee's current version is re-read before the second post because the first post bumped it."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Romeo Distribution Inc", fein: "41-3300001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 900000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${lic_v0}" }
              as: LicensingOfficer
              captures: { bond_a: $.data.id }
            - call: "GET /mft/licensees/${lic_id}"
              payload: {}
              as: LicensingOfficer
              captures: { lic_v1: $.data.version }
          trigger:
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Iron Range Surety Co", effective_date: "2026-07-15", expected_licensee_version: "${lic_v1}" }
              as: LicensingOfficer
              captures: { bond_b: $.data.id }
          assert:
            - "HTTP 201; the new BondInstrument ${bond_b} has status == ACTIVE and release_reason == null"
            - "GET /mft/licensees/${lic_id}/bonds with payload { status: ACTIVE } returns total_count == 1 and the single row's id == ${bond_b}"
            - "GET /mft/licensees/${lic_id}/bonds with payload { status: RELEASED } returns total_count == 1, that row's id == ${bond_a} and its release_reason == SUPERSEDED_BY_NEW_BOND"
            - "GET /mft/licensees/${lic_id} reports posted_bond_cents == 1500000 (not 2400000) and bond_deficiency_cents == 0"

      - name: suspend_from_pending_bond_returns_licensee_state_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Licensee.transitions
          - validations[priority=71]
          - errors[ERR_LICENSEE_STATE_INVALID]
        distinguishing_aspect: "The machine declares suspend only from ACTIVE; a suspend against a PENDING_BOND licensee is ERR_LICENSEE_STATE_INVALID (409), and no bond-doubling side effect fires."
        test_recipe:
          setup:
            - "One PENDING_BOND DISTRIBUTOR with no bond posted, required_bond_cents 1500000."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Sierra Distribution Inc", fein: "41-3400001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /mft/licensees/${lic_id}/suspend"
              payload: { reason: "Desk error - the licensee is not yet in force" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_LICENSEE_STATE_INVALID"
            - "GET /mft/licensees/${lic_id} still reports status == PENDING_BOND and required_bond_cents == 1500000 (the 2.0 suspension multiplier never ran)"

      - name: refund_claim_initial_state_is_submitted
        claim_type: initial_state
        grounds:
          - state_machines.RefundClaim.initial_state
          - calculations.refund_allowable_gallons
          - validations[priority=304]
        distinguishing_aspect: "A newly filed claim lands in SUBMITTED with the money already computed (100.00 allowable gallons -> 3090 cents) and every downstream workflow field still null - reviewer_user_id, decider_user_id, hold_reason and status_before_hold."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant; the clock is at 2026-09-05T00:00:00Z."
            - "The claimant has a FILED 2026-08 return whose only schedule is SCH_1 UNDYED_DIESEL 100.00 gallons, so tax_due_cents is 0 and the period's tax-paid pool is 100.00 gallons."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Tango Fuel Supply LLC", fein: "41-3500001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Uniform Distribution Inc", fein: "41-3500002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-14", bill_of_lading_number: "BOL-POOL-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "U. Uniform" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 100.00 }
              as: LicenseeAgent
              as_user_id: "${dist_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "HTTP 201; data.status == SUBMITTED (the machine's initial_state)"
            - "data.allowable_gallons == 100.00 and data.refund_amount_cents == 3090 (round_half_up(100.00 * 30.9))"
            - "data.reviewer_user_id, data.decider_user_id, data.hold_reason, data.status_before_hold, data.recommendation and data.payment_reference are all null"
            - "GET /mft/returns/${ret_id} reports filing_status == FILED, tax_due_cents == 0 and days_late == 0 (filed before the 2026-09-20 due instant)"

      - name: revoked_licensee_cannot_be_reactivated
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Licensee.terminal_states
          - validations[priority=70]
          - errors[ERR_LICENSEE_REVOKED]
        distinguishing_aspect: "REVOKED is the Licensee machine's only terminal state, and the priority-70 revoked gate fires ahead of the priority-71 transition-legality gate, so the reactivation attempt returns ERR_LICENSEE_REVOKED (409) rather than ERR_LICENSEE_STATE_INVALID."
        test_recipe:
          setup:
            - "One licensee revoked directly out of PENDING_BOND (the machine declares that edge for a denied application)."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Victor Distribution Inc", fein: "41-3600001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /mft/licensees/${lic_id}/revoke"
              payload: { reason: "Application withdrawn and licence denied" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees/${lic_id}/activate"
              payload: {}
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_LICENSEE_REVOKED"
            - "GET /mft/licensees/${lic_id} still reports status == REVOKED"
            - "POST /mft/licensees/${lic_id}/suspend also returns ERR_LICENSEE_REVOKED, so no edge leaves the terminal state"

      - name: second_file_on_a_filed_return_returns_return_already_filed
        claim_type: idempotency
        grounds:
          - state_machines.MonthlyReturn.DRAFT_to_FILED
          - validations[priority=74]
          - errors[ERR_RETURN_ALREADY_FILED]
        distinguishing_aspect: "Filing is not idempotent by design: the second file attempt on the same row is ERR_RETURN_ALREADY_FILED (409), so the ledger cannot be double-posted and late_filing_count cannot be double-counted."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR filer; the clock is at its startup default 2026-08-01T00:00:00Z."
            - "The filer's 2026-07 return carries one SCH_1 UNDYED_DIESEL schedule of 50.00 gallons and has been filed once, before its 2026-08-20 due instant."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Whiskey Fuel Supply LLC", fein: "41-3700001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Xray Distribution Inc", fein: "41-3700002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-07" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 50.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 50.00, document_date: "2026-07-12", bill_of_lading_number: "BOL-IDEM-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "X. Xray" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "X. Xray" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_RETURN_ALREADY_FILED"
            - "GET /mft/returns/${ret_id} reports filing_status == FILED exactly once, tax_due_cents == 0 and days_late == 0"
            - "GET /mft/licensees/${dist_id}/ledger-entries returns total_count == 0 (a zero-tax filing posts no ledger row and the refused retry posts none either)"
            - "GET /mft/licensees/${dist_id} reports late_filing_count == 0"

      - name: dismiss_on_a_negative_inspection_returns_inspection_not_dismissible
        claim_type: invalid_transition
        grounds:
          - state_machines.RoadsideInspection.PENALTY_ASSESSED_to_DISMISSED
          - validations[priority=78]
          - errors[ERR_INSPECTION_NOT_DISMISSIBLE]
        distinguishing_aspect: "DISMISSED is reachable only from PENALTY_ASSESSED; a NEGATIVE dye test leaves the row in RECORDED with penalty_cents 0, so the dismissal is ERR_INSPECTION_NOT_DISMISSIBLE (409) - there is nothing to reverse."
        test_recipe:
          setup:
            - "One RETAILER licensee and one RoadsideInspection with dye_test_result NEGATIVE dated 2026-07-20, inside the clock's default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Yankee Retail Stops LLC", fein: "41-3800001", license_type: "RETAILER", mailing_state: "MN", retail_channel: "HIGHWAY" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${ret_id}", inspection_date: "2026-07-20", dye_test_result: "NEGATIVE", gallons_in_tank: 80.00, vehicle_identifier: "MN-TRK-4417", location_description: "US-10 westbound scale" }
              as: FieldInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /mft/roadside-inspections/${insp_id}/dismiss"
              payload: { dismissal_reason: "Operator produced a clean retest" }
              as: TaxSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INSPECTION_NOT_DISMISSIBLE"
            - "GET /mft/roadside-inspections/${insp_id} still reports status == RECORDED, penalty_cents == 0 and prior_positive_count == 0"
            - "GET /mft/licensees/${ret_id} reports dyed_violation_count == 0 and balance_cents == 0"

      - name: licensee_revoke_cascades_certificates_and_forfeits_bonds
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExemptionCertificate.ACTIVE_to_REVOKED
          - state_machines.BondInstrument.ACTIVE_to_FORFEITED
          - endpoints[POST /mft/licensees/{id}/revoke]
        distinguishing_aspect: "One revoke drives two different child machines in one request: the ACTIVE bond becomes FORFEITED with release_reason LICENSE_REVOKED (so posted_bond_cents drops to 0) while the purchaser's ACTIVE exemption certificate becomes REVOKED."
        test_recipe:
          setup:
            - "One ACTIVE DISTRIBUTOR with a single ACTIVE 1500000-cent bond and one ACTIVE GOVERNMENT exemption certificate naming it as purchaser."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Zulu Distribution Inc", fein: "41-3900001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /mft/licensees/${lic_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${lic_v0}" }
              as: LicensingOfficer
              captures: { bond_id: $.data.id }
            - call: "POST /mft/licensees/${lic_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${lic_id}", exemption_type: "GOVERNMENT", document_number: "CERT-REV-0001", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: LicensingOfficer
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /mft/licensees/${lic_id}/revoke"
              payload: { reason: "Repeated failure to remit; licence revoked by order" }
              as: LicensingOfficer
          assert:
            - "HTTP 200; data.status == REVOKED"
            - "GET /mft/licensees/${lic_id}/bonds with payload { status: ACTIVE } returns total_count == 0"
            - "GET /mft/licensees/${lic_id}/bonds with payload { status: FORFEITED } returns total_count == 1, that row's id == ${bond_id} and its release_reason == LICENSE_REVOKED"
            - "GET /mft/exemption-certificates/${cert_id} reports status == REVOKED"
            - "GET /mft/licensees/${lic_id} reports posted_bond_cents == 0 (the FORFEITED bond stops counting)"

      - name: discrepancy_resolve_explained_bubbles_both_returns_to_match_resolved
        claim_type: side_effect_execution
        grounds:
          - state_machines.MatchDiscrepancy.OPEN_to_RESOLVED_EXPLAINED
          - state_machines.MonthlyReturn.MATCH_VARIANCE_to_MATCH_RESOLVED
          - endpoints[POST /mft/discrepancies/{id}/resolve].side_effects
        distinguishing_aspect: "Resolving the run's only discrepancy as EXPLAINED bubbles BOTH named returns from MATCH_VARIANCE to MATCH_RESOLVED and drops the purchaser's open_discrepancy_count to 0, while the run's gallons counters are deliberately left untouched at 100.00."
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER and one ACTIVE DISTRIBUTOR, both fully bonded; clock at 2026-09-05T00:00:00Z."
            - "The supplier's FILED 2026-08 return reports SCH_5 GASOLINE 1000.00 gallons delivered to the distributor; the distributor's FILED 2026-08 return reports only SCH_1 GASOLINE 900.00 gallons received."
            - "A 2026-08 cross-match run therefore creates exactly one OPEN discrepancy of 100.00 gallons, direction UNREPORTED_BY_PURCHASER, and both returns sit at MATCH_VARIANCE."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-4000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-4000002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret_id: $.data.id }
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { s_sch_id: $.data.id }
            - call: "POST /mft/schedules/${s_sch_id}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 1000.00, document_date: "2026-08-06", bill_of_lading_number: "BOL-XM-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/file"
              payload: { attest_name: "S. Northline" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "GASOLINE", total_gallons: 900.00 }
              as: ReturnsExaminer
              captures: { d_sch_id: $.data.id }
            - call: "POST /mft/schedules/${d_sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 900.00, document_date: "2026-08-06", bill_of_lading_number: "BOL-XM-0002" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
            - call: "GET /mft/discrepancies"
              payload: { run_id: "${run_id}" }
              as: ReturnsExaminer
              captures: { disc_id: "$.data[0].id" }
          trigger:
            - call: "POST /mft/discrepancies/${disc_id}/resolve"
              payload: { resolution: "EXPLAINED" }
              as: ReturnsExaminer
          assert:
            - "HTTP 200; data.status == RESOLVED_EXPLAINED and data.variance_gallons == 100.00"
            - "GET /mft/returns/${d_ret_id} reports match_status == MATCH_RESOLVED and GET /mft/returns/${s_ret_id} also reports match_status == MATCH_RESOLVED"
            - "GET /mft/licensees/${dist_id} reports open_discrepancy_count == 0 and unreported_gallons_total == 0.00 (an EXPLAINED row leaves the risk-score input set)"
            - "GET /mft/cross-match-runs/${run_id} still reports discrepancy_count == 1, gross_unreported_gallons_total == 100.00, unreported_gallons_total == 100.00 and written_off_gallons_total == 0.00"

      - name: fourth_inquiry_on_one_discrepancy_returns_inquiry_round_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MatchDiscrepancy.RESPONSE_RECEIVED_to_INQUIRY_SENT
          - validations[priority=406]
          - errors[ERR_INQUIRY_ROUND_LIMIT]
        distinguishing_aspect: "The RESPONSE_RECEIVED -> INQUIRY_SENT loop is bounded at MAX_INQUIRY_ROUNDS 3: rounds 1, 2 and 3 are accepted and the fourth is ERR_INQUIRY_ROUND_LIMIT (422), leaving the discrepancy in RESPONSE_RECEIVED with inquiry_round frozen at 3."
