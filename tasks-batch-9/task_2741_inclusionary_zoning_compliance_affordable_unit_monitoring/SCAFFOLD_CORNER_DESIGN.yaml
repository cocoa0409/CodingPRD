# =============================================================================
# §1.9 Scaffold Corner Design — Inclusionary Zoning Compliance & Affordable Unit
# Monitoring (task 2741). Breadth probe over the claim-extraction-guide's nine
# sections, complementing the nine depth rules in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Conventions shared by every test_recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z and is set explicitly as
#     the first setup call of every instance.
#   * Canonical ordinance IZ-2024-01 (effective 2024-01-01, min 10 units,
#     R-2 1000 / R-4 1500 / C-2 2000 bps, gap level 5000 -> 24000000 cents,
#     surcharge 350 bps capped at 5000000, tiers 0/0 - 20000000/150 -
#     100000000/400, fee_due_days 45, alternative paths IN_LIEU_FEE + OFFSITE).
#   * Canonical AmiSchedule 2026 (size 1..5 medians 9868000 / 11278000 /
#     12669800 / 14082000 / 15214000; utility allowances 8500 / 11000 / 14500 /
#     18000 by bedrooms 0..3). Derived literals used repeatedly:
#       income_limit(size 3, 5000 bps) = 6334900
#       income_limit(size 2, 5000 bps) = 5639000
#       max_allowed_rent(2br, 5000 bps) = 143872
#       max_allowed_rent(1br, 5000 bps) = 129975
#       recert ceiling (size 3, 5000 bps, 140%) = 8868860
#   * Developer actors are X-User-ID "dev-1" / "dev-2"; compliance officers are
#     "hco-1" (creator / approver) and "hco-2" (the second pair of eyes required
#     by the segregation-of-duties rule); the fund auditor is "aud-1".
#   * Every negative trigger captures the error envelope so the expected
#     error_id is asserted explicitly.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (Table 1 rows)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_declared_defaults
        claim_type: creation
        grounds:
          - endpoints.POST_/iz-compliance/projects
          - entities.Project
        distinguishing_aspect: |
          A POST carrying exactly the four declared input fields returns 201 and a
          Project whose every non-input field holds its declared default: state DRAFT,
          applicability PENDING, compliance_posture PENDING, required_affordable_units 0,
          fractional_obligation_bps 0, onsite_unit_equivalents_bps 0,
          fee_covered_equivalents_bps 0, total_obligation_bps 0, screen_count 0,
          screened_at null, ordinance_id null, compliance_path null. Nothing is screened
          at creation time, so no ordinance is pinned yet.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published. No project exists yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects", payload: { name: "Creation Row", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
          assert:
            - "HTTP 201 and the envelope has response_type object with meta.api_request_id and meta.api_request_timestamp present"
            - "Project.${p_id}.name == Creation Row, zoning_district == R-2, total_units == 10, approval_date == 2026-01-15"
            - "Project.${p_id}.state == DRAFT, applicability == PENDING, compliance_posture == PENDING"
            - "Project.${p_id}.required_affordable_units == 0, fractional_obligation_bps == 0, total_obligation_bps == 0"
            - "Project.${p_id}.onsite_unit_equivalents_bps == 0 and fee_covered_equivalents_bps == 0"
            - "Project.${p_id}.ordinance_id is null and compliance_path is null — the ordinance is pinned at screening, not at creation"
            - "Project.${p_id}.screen_count == 0 and screened_at is null"
            - "Project.${p_id}.id, created_at, updated_at are present and version == 1"

      - name: create_project_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Each of the four Project inputs has source input and no default, so omitting any
          one of them is rejected at priority 4 with ERR_INVALID_REQUEST (400) and no row
          is created. The same rule rejects a required field on a nested action payload
          (withdraw without reason), proving the check is not limited to create endpoints.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects", payload: { name: "No District", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { err_district: $.data.error_id } }
            - { call: "POST /iz-compliance/projects", payload: { zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { err_name: $.data.error_id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "No Units", zoning_district: "R-2", approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { err_units: $.data.error_id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "No Date", zoning_district: "R-2", total_units: 10 }, as: Developer, as_user_id: "dev-1", captures: { err_date: $.data.error_id } }
          assert:
            - "each of the four attempts returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the error envelope has response_type error and data.message is a non-empty string"
            - "GET /iz-compliance/projects returns total_count 0 — no partial row was written by any rejected attempt"

      - name: out_of_domain_enum_and_range_values_return_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_4
          - entities.Project.fields.zoning_district
          - entities.Ordinance.fields.discount_tiers
        distinguishing_aspect: |
          Priority 4 polices three distinct shape families and all of them surface the same
          ERR_INVALID_REQUEST: an enum outside its declared domain (zoning_district R-9),
          an integer outside its declared range (total_units 0 against the >= 1
          constraint), and a structural constraint on a nested array
          (Ordinance.discount_tiers whose first element does not have
          min_pre_discount_cents == 0). None of them reaches a business rule.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects", payload: { name: "Bad District", zoning_district: "R-9", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { err_enum: $.data.error_id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Zero Units", zoning_district: "R-2", total_units: 0, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { err_range: $.data.error_id } }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-BAD-TIERS", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000 }, gap_basis_cents_by_level: { "5000": 24000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 500, discount_bps: 100 } ], fee_due_days: 45, alternative_paths_allowed: [] }, as: ProgramAdministrator, captures: { err_tiers: $.data.error_id } }
          assert:
            - "the zoning_district R-9 attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the total_units 0 attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the discount_tiers attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST because the leading tier's min_pre_discount_cents is 500, not 0"
            - "GET /iz-compliance/ordinances returns total_count 1 — only the canonical IZ-2024-01 row exists"
            - "GET /iz-compliance/projects returns total_count 0"

      - name: household_optional_input_falls_back_to_declared_default
        claim_type: defaults
        grounds:
          - entities.Household.fields.preference_claims
          - entities.Household.fields.state
        distinguishing_aspect: |
          preference_claims is the only entity field in this scaffold with source input AND
          a declared default. Omitting it yields the empty array rather than null, and the
          derived preference_score defaults to 0 while rank_position stays null until a
          draw ranks the household. The MarketingPlan optional field behaves the same way.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Default Dora", household_size: 3, gross_annual_income_cents: 6000000 }, as: ProgramAdministrator, captures: { h_id: $.data.id } }
          assert:
            - "HTTP 201 and Household.${h_id}.preference_claims == [] (the declared default, not null)"
            - "Household.${h_id}.state == REGISTERED, preference_score == 0, rank_position is null"
            - "Household.${h_id}.lottery_event_id is null — it is only set by apply"
            - "Household.${h_id}.applicant_name == Default Dora, household_size == 3, gross_annual_income_cents == 6000000"

      - name: certification_computed_fields_are_derived_from_the_active_schedule
        claim_type: computed_fields
        grounds:
          - calculations.income_limit
          - calculations.max_allowed_rent
          - entities.IncomeCertification.fields.ami_pct_bps
          - entities.IncomeCertification.fields.expires_at
        distinguishing_aspect: |
          Five IncomeCertification fields have source computed and none of them appears in
          the endpoint's input list, so their values can only come from the calculation
          chain: ami_schedule_year 2026 pinned from the ACTIVE schedule, income_limit_cents
          6334900 for household size 3 at 5000 bps, max_rent_cents 143872 for a 2-bedroom
          unit, ami_pct_bps 4736 from the certified income, and expires_at 2027-08-01 for a
          RENTAL term. The unit's own max_allowed_rent_cents is refreshed to the same 143872.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT, ONSITE elected, agreement recorded, one RENTAL 2-bedroom unit at 5000 bps."
            - "Household H1 (size 3, gross income 6000000) registered."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Computed Court", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-CC-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "CC-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c_id: $.data.id } }
          assert:
            - "HTTP 201 and IncomeCertification.${c_id}.ami_schedule_year == 2026"
            - "IncomeCertification.${c_id}.income_limit_cents == 6334900"
            - "IncomeCertification.${c_id}.max_rent_cents == 143872"
            - "IncomeCertification.${c_id}.ami_pct_bps == 4736"
            - "IncomeCertification.${c_id}.expires_at == 2027-08-01 and state == CERTIFIED and is_recertification == false"
            - "IncomeCertification.${c_id}.certified_by_user_id == hco-1"
            - "AffordableUnit.${u_id}.max_allowed_rent_cents == 143872 and current_rent_cents == 140000 and occupant_household_id == ${h_id}"

      - name: project_system_fields_come_from_the_server_not_the_payload
        claim_type: system_fields
        grounds:
          - entities.Project.fields.developer_user_id
          - entities.Project.fields.screened_at
          - endpoints.POST_/iz-compliance/projects/{project_id}/screen
        distinguishing_aspect: |
          developer_user_id has source system and is not in the POST input list, so it is
          taken from the acting X-User-ID header and becomes the ownership key the
          priority-7 rule later enforces. screened_at and screen_count are likewise
          server-written: they stay null / 0 through creation and are stamped from the
          logical clock at screening, which is why screened_at reads exactly
          2026-08-01T00:00:00Z rather than a wall-clock instant.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "System Fields", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: ProgramAdministrator, captures: { p_v: $.data.version } }
          assert:
            - "Project.${p_id}.developer_user_id == dev-1 — copied from the creating X-User-ID, never from the payload"
            - "before the screen: screened_at is null and screen_count == 0"
            - "after the screen: Project.${p_id}.screened_at == 2026-08-01T00:00:00Z (the logical clock, not wall time) and screen_count == 1"
            - "Project.${p_id}.state == SCREENED_SUBJECT, applicability == SUBJECT, required_affordable_units == 8, fractional_obligation_bps == 0, total_obligation_bps == 80000"
            - "Project.${p_id}.ordinance_id == ${ord_id} and compliance_posture == DEFICIENT (no unit and no assessment yet)"
            - "Project.${p_id}.version == ${p_v} and ${p_v} == 2 — creation set version 1 and the screen bumped it once"

      - name: get_affordable_unit_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/iz-compliance/affordable-units/{unit_id}
          - entities.AffordableUnit
        distinguishing_aspect: |
          The single-row GET echoes exactly what the create stored, including the four
          system-defaulted state dimensions (occupancy_status PLANNED, compliance_status
          COMPLIANT, restriction_state NOT_RECORDED) and the zero-valued money fields, with
          no recomputation: max_allowed_rent_cents is still 0 because no certification has
          run yet even though the unit's affordability level is known.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT, ONSITE elected, agreement recorded, one RENTAL 2-bedroom unit created."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
