# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or type mismatch" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum-valued field carries a value outside its declared set" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "A time window has end <= start" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "property_id does not resolve" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaint id/complaint_id does not resolve" }
  - { id: ERR_VARIANCE_NOT_FOUND, http: 404, condition: "variance-permit id does not resolve" }
  - { id: ERR_ENFORCEMENT_NOT_FOUND, http: 404, condition: "enforcement id/enforcement_id does not resolve" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing id does not resolve" }
  - { id: ERR_ABATEMENT_NOT_FOUND, http: 404, condition: "abatement-order id does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referral id does not resolve" }
  - { id: ERR_DUPLICATE_POLICY, http: 409, condition: "A NoiseLimitPolicy already exists for the zoning_type" }
  - { id: ERR_POLICY_NOT_CONFIGURED, http: 409, condition: "No NoiseLimitPolicy configured for the Property's zoning_type when recording an inspection" }
  - { id: ERR_ENFORCEMENT_PROPERTY_MISMATCH, http: 409, condition: "Manual abatement enforcement_id belongs to a different property_id" }
  - { id: ERR_COMPLAINT_NOT_UNDER_REVIEW, http: 409, condition: "substantiate/dismiss require complaint status UNDER_REVIEW" }
  - { id: ERR_ENFORCEMENT_NOT_CITATION, http: 409, condition: "contest requires tier == CITATION (a WARNING cannot be appealed)" }
  - { id: ERR_ENFORCEMENT_NOT_CONTESTED, http: 409, condition: "scheduling a hearing requires enforcement status CONTESTED" }
  - { id: ERR_HEARING_NOT_PENDING, http: 409, condition: "decide requires hearing outcome PENDING" }
  - { id: ERR_VARIANCE_NOT_UNDER_REVIEW, http: 409, condition: "issue/deny require variance status UNDER_REVIEW" }
  - { id: ERR_VARIANCE_NOT_ISSUED, http: 409, condition: "revoke requires variance status ISSUED" }
  - { id: ERR_PROPERTY_NOT_UNDER_ABATEMENT, http: 409, condition: "comply requires Property.abatement_status == UNDER_ABATEMENT" }
  - { id: ERR_REFERRAL_INVALID_STATE, http: 409, condition: "referral transition invalid from current status" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic invalid state transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_VARIANCE_COVERS_COMPLAINT, http: 409, condition: "An ISSUED variance covers the complaint's time/decibel; cannot substantiate" }
  - { id: ERR_VARIANCE_WINDOW_OVERLAP, http: 409, condition: "Issuing would overlap another ISSUED variance window on the same Property (half-open)" }
  - { id: ERR_HEARING_SLOT_CONFLICT, http: 409, condition: "The officer already has a hearing slot within HEARING_BUFFER_MINUTES" }
  - { id: ERR_ABATEMENT_DEADLINE_NOT_REACHED, http: 409, condition: "escalate called before compliance_deadline" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Hearing decider equals the citation issuer (X-User-ID)" }
  - { id: ERR_NO_INSPECTION_ON_RECORD, http: 422, condition: "substantiate with no inspection recorded" }
  - { id: ERR_NOISE_WITHIN_LIMIT, http: 422, condition: "substantiate when the latest inspection did not exceed the limit" }
  - { id: ERR_VARIANCE_DB_EXCEEDS_CAP, http: 422, condition: "permitted_max_db exceeds VARIANCE_ABSOLUTE_MAX_DB" }
  - { id: ERR_REDUCTION_PCT_INVALID, http: 422, condition: "REDUCED outcome with reduction_pct outside [0,1)" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 402, condition: "Payment amount_cents exceeds current amount_outstanding_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CodeOfficer
    description: "Code-enforcement officer: reviews/inspects/substantiates/dismisses complaints, issues enforcements, opens manual abatement orders, routes referrals."
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/review"
      - "POST /complaints/{id}/inspections"
      - "POST /complaints/{id}/substantiate"
      - "POST /complaints/{id}/dismiss"
      - "POST /referrals, /referrals/{id}/acknowledge, /referrals/{id}/close"
      - "POST /abatement-orders, /abatement-orders/{id}/comply, /abatement-orders/{id}/escalate"
    shared_operations:
      - "POST /properties (with SystemAdmin)"
      - "POST /complaints (with Resident)"
      - "GET reads"
  - name: HearingOfficer
    description: "Presides over appeal hearings. Schedules and decides. Segregation of duties: cannot decide a hearing for a citation they themselves issued."
    identity: opaque
    exclusive_operations:
      - "POST /enforcements/{id}/hearings"
      - "POST /hearings/{id}/decide"
    shared_operations:
      - "GET reads"
  - name: PermitClerk
    description: "Processes variance permits: create, issue, deny, revoke."
    identity: opaque
    exclusive_operations:
      - "POST /variance-permits/{id}/issue"
      - "POST /variance-permits/{id}/deny"
      - "POST /variance-permits/{id}/revoke"
    shared_operations:
      - "POST /variance-permits (with Resident)"
      - "GET reads"
  - name: Resident
    description: "Member of the public: files complaints, applies for variances, contests citations, and records payments."
    identity: opaque
    exclusive_operations:
      - "POST /enforcements/{id}/contest"
      - "POST /enforcements/{id}/payments"
    shared_operations:
      - "POST /complaints (with CodeOfficer)"
      - "POST /variance-permits (with PermitClerk)"
      - "GET reads"
  - name: SystemAdmin
    description: "Operational admin: configures noise-limit policies and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /noise-policies"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /properties (with CodeOfficer)"
      - "GET reads"

# =============================================================================
# Undeclared-constant guard — every constant referenced above is defined here or
# in a calculations[].constants block. Enumerated for downstream generators.
# =============================================================================
constants_index:
  BASE_FINE_CENTS: 10000
  MAX_FINE_CENTS: 500000
  CHRONIC_FINE_MULTIPLIER: 1.5
  CHRONIC_WINDOW_DAYS: 365
  CHRONIC_WATCH_THRESHOLD: 2
  CHRONIC_DESIGNATED_THRESHOLD: 3
  ZONING_FINE_FACTOR: { RESIDENTIAL: 1.0, COMMERCIAL: 1.5, INDUSTRIAL: 0.75, MIXED: 1.25 }
  PAYMENT_DUE_DAYS: 30
  LATE_PENALTY_DAILY_PCT: 0.015
  CONSTRUCTION_BASE_FEE_CENTS: 5000
  CONSTRUCTION_PER_DAY_CENTS: 2500
  EVENT_BASE_FEE_CENTS: 10000
  EVENT_PER_ATTENDEE_CENTS: 50
  VARIANCE_ABSOLUTE_MAX_DB: 95
  HEARING_BUFFER_MINUTES: 60
  ABATEMENT_COMPLIANCE_DAYS: 30
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
