scenario: "Probation & Parole Case Management: supervision level/risk assessment (LSI-R), condition tracking, check-in/drug-test schedule, violation/sanction matrix, restitution/fee balance, court reporting, interstate compact transfer, early termination"
domain_name: probation-parole-case-management
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation       # restitution payoff (forward-looking projected vs chronological ledger) + LSI-R risk scoring two scoring conventions
    - cascading_side_effects         # violation -> sanction -> supervision-level escalation -> condition activation
    - rate_threshold_triggers        # cumulative violation points cross sanction-matrix breakpoints; risk-score bands
    - optimistic_concurrency         # OCC on Supervisee.version for case-superseding writes (new risk assessment supersedes prior level)

  entity_topology: hybrid
  # Supervisee is the aggregate root (hierarchical children: conditions, check-ins, violations,
  # obligations, court reports). Cross-cutting flat references: Officer (assigned), InterstateTransfer
  # (Supervisee <-> receiving-state), Sanction (FK to Violation), Payment (FK to FinancialObligation).

  state_machine_shape: posture_driven
  # Supervisee carries a derived supervision_level posture (ADMINISTRATIVE/MINIMUM/MEDIUM/MAXIMUM)
  # plus a lifecycle status; the supervision_level gates which condition/check-in operations are
  # permitted. Violation has a branching fork-join (FILED -> {SUSTAINED, DISMISSED} -> resolved).
  # Supervisee lifecycle includes a revocation cycle (ABSCONDED -> ACTIVE rebound).

  relationship_patterns:
    - one_to_many        # Supervisee -> Conditions/CheckIns/Violations/Obligations/CourtReports
    - cross_aggregate    # Sanction references Violation; Payment references FinancialObligation; CheckIn references DrugTest
    - self_referential   # FinancialObligation may have parent_obligation_id (restitution split into installments references the master)

  role_model: segregation_of_duties
  # Officer files & sustains violations and conducts check-ins; SupervisingJudge sustains/dismisses
  # and rules on early termination & revocation; CompactAdministrator approves interstate transfers;
  # an Officer who FILED a violation cannot also be the actor who SUSTAINS it as a judicial finding.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ===========================================================================
entities:
  - name: Officer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: officer's display name
      - name: badge_number
        type: string
        source: input
        description: agency badge identifier
        constraints: unique across Officers
      - name: role_type
        type: enum
        source: input
        description: which supervision function this officer performs
        constraints: one of {PROBATION, PAROLE}
      - name: active
        type: boolean
        source: input
        description: whether the officer may be assigned new cases
        default: true

  - name: Supervisee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: supervisee's display name
      - name: docket_number
        type: string
        source: input
        description: court docket identifier
        constraints: unique across Supervisees
      - name: supervision_type
        type: enum
        source: input
        description: probation vs parole track
        constraints: one of {PROBATION, PAROLE}
      - name: assigned_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; the supervising officer; Officer.role_type must equal supervision_type"
      - name: sentence_state_code
        type: string
        source: input
        description: two-letter sending-state code where the sentence originates
        constraints: two uppercase letters
      - name: ordered_term_months
        type: integer
        source: input
        description: total court-ordered supervision term in months
        constraints: ">= 1"
      - name: supervision_start_date
        type: datetime
        source: input
        description: ISO date supervision began; basis for term and early-termination eligibility math
      - name: status
        type: enum
        source: system
        description: lifecycle state
        default: INTAKE
        constraints: one of {INTAKE, ACTIVE, ABSCONDED, REVOCATION_PENDING, REVOKED, TERMINATED_EARLY, COMPLETED, TRANSFERRED_OUT}
      - name: supervision_level
        type: enum
        source: computed
        description: derived risk posture from the latest ADOPTED RiskAssessment; gates condition/check-in operations
        default: MINIMUM
        constraints: one of {ADMINISTRATIVE, MINIMUM, MEDIUM, MAXIMUM}
      - name: cumulative_violation_points
        type: integer
        source: computed
        description: running sum of points across all SUSTAINED Violations; drives the sanction matrix tier
        default: 0
      - name: restitution_balance_cents
        type: integer
        source: computed
        description: chronological ledger balance of all RESTITUTION obligations minus applied payments (in cents)
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: chronological ledger balance of all FEE obligations minus applied payments (in cents)
        default: 0

  - name: RiskAssessment
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the assessed supervisee"
      - name: instrument
        type: enum
        source: input
        description: assessment instrument
        default: LSI_R
        constraints: one of {LSI_R}
      - name: domain_scores
        type: object
        source: input
        description: map of the ten LSI-R domain names to raw integer sub-scores; each 0..N for that domain
        constraints: must contain all ten LSI-R domains; each value >= 0
      - name: total_score
        type: integer
        source: computed
        description: summed LSI-R total used for band lookup (0..54)
        constraints: 0..54
      - name: derived_level
        type: enum
        source: computed
        description: supervision level band looked up from total_score per LSI-R band table
        constraints: one of {ADMINISTRATIVE, MINIMUM, MEDIUM, MAXIMUM}
      - name: assessment_status
        type: enum
        source: system
        description: lifecycle of this assessment
        default: DRAFT
        constraints: one of {DRAFT, ADOPTED, SUPERSEDED}
      - name: override_level
        type: enum
        source: input
        description: optional officer override of the derived band (professional discretion)
        constraints: one of {ADMINISTRATIVE, MINIMUM, MEDIUM, MAXIMUM} or null; may only raise, never lower below derived_level
      - name: override_reason
        type: string
        source: input
        description: required justification when override_level is supplied

  - name: SupervisionCondition
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee this condition binds"
      - name: condition_type
        type: enum
        source: input
        description: category of court-ordered condition
        constraints: one of {DRUG_TESTING, CURFEW, NO_CONTACT, EMPLOYMENT, TREATMENT, ELECTRONIC_MONITORING, TRAVEL_RESTRICTION}
      - name: minimum_level_required
        type: enum
        source: input
        description: lowest supervision_level at which this condition is enforceable; condition cannot be ACTIVE while Supervisee.supervision_level is below it
        constraints: one of {ADMINISTRATIVE, MINIMUM, MEDIUM, MAXIMUM}
        default: MINIMUM
      - name: status
        type: enum
        source: system
        description: condition lifecycle
        default: PROPOSED
        constraints: one of {PROPOSED, ACTIVE, SATISFIED, WAIVED, SUSPENDED}
      - name: description
        type: string
        source: input
        description: free-text specifics of the condition

  - name: CheckIn
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee who must report"
      - name: scheduled_for
        type: datetime
        source: input
        description: ISO timestamp the check-in is due (start of the appointment window)
      - name: window_minutes
        type: integer
        source: input
        description: length of the on-time window in minutes after scheduled_for; arrivals after the window close are LATE
        default: 60
        constraints: ">= 1"
      - name: requires_drug_test
        type: boolean
        source: input
        description: whether a DrugTest must accompany this check-in
        default: false
      - name: status
        type: enum
        source: system
        description: check-in lifecycle
        default: SCHEDULED
        constraints: one of {SCHEDULED, ATTENDED, MISSED, EXCUSED}
      - name: attended_at
        type: datetime
        source: input
        description: ISO timestamp the supervisee actually appeared; set on attend
      - name: punctuality
        type: enum
        source: computed
        description: derived on-time/late classification from attended_at vs scheduled_for + window_minutes
        constraints: one of {ON_TIME, LATE} or null until attended

  - name: DrugTest
    parent: CheckIn
    common_fields: true
    fields:
      - name: check_in_id
        type: string
        source: input
        description: "FK -> CheckIn.id; the check-in this specimen was collected at"
      - name: panel
        type: enum
        source: input
        description: test panel scope
        default: FIVE_PANEL
        constraints: one of {FIVE_PANEL, TEN_PANEL}
      - name: result
        type: enum
        source: input
        description: laboratory result
        constraints: one of {NEGATIVE, POSITIVE, DILUTE, REFUSED}
      - name: substances
        type: array
        source: input
        description: list of detected substance codes when result is POSITIVE; empty otherwise

  - name: Violation
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee charged"
      - name: filed_by_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; the officer who filed the violation report"
      - name: violation_class
        type: enum
        source: input
        description: severity class driving the sanction matrix
        constraints: one of {TECHNICAL, MISDEMEANOR, FELONY, ABSCOND}
      - name: source_drug_test_id
        type: string
        source: input
        description: "FK -> DrugTest.id; optional originating positive/refused drug test; null for non-test violations"
      - name: points
        type: integer
        source: computed
        description: sanction-matrix points assigned when SUSTAINED, by violation_class
        default: 0
      - name: status
        type: enum
        source: system
        description: violation adjudication lifecycle (branching fork-join)
        default: FILED
        constraints: one of {FILED, SUSTAINED, DISMISSED, APPEALED}
      - name: sustained_by_actor_id
        type: string
        source: system
        description: id of the judicial actor who sustained it; must differ from filed_by_officer_id

  - name: Sanction
    parent: Violation
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: input
        description: "FK -> Violation.id; the sustained violation this sanction answers"
      - name: sanction_type
        type: enum
        source: computed
        description: sanction selected from the matrix by (violation_class, resulting cumulative tier)
        constraints: one of {VERBAL_WARNING, INCREASED_REPORTING, CURFEW_IMPOSITION, JAIL_SHOCK, REVOCATION_REFERRAL}
      - name: imposed_days
        type: integer
        source: computed
        description: number of jail-shock days when sanction_type is JAIL_SHOCK; 0 otherwise
        default: 0
      - name: status
        type: enum
        source: system
        description: sanction lifecycle
        default: IMPOSED
        constraints: one of {IMPOSED, COMPLETED, VACATED}

  - name: FinancialObligation
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee who owes this obligation"
      - name: parent_obligation_id
        type: string
        source: input
        description: "FK -> FinancialObligation.id; optional master obligation when this row is one installment of a split restitution order; null for standalone obligations"
      - name: obligation_type
        type: enum
        source: input
        description: ledger bucket
        constraints: one of {RESTITUTION, FEE}
      - name: principal_cents
        type: integer
        source: input
        description: original amount owed in cents
        constraints: ">= 1"
      - name: monthly_accrual_cents
        type: integer
        source: input
        description: monthly supervision-fee accrual in cents; only meaningful for FEE obligations with recurring=true
        default: 0
      - name: recurring
        type: boolean
        source: input
        description: whether this FEE accrues monthly_accrual_cents per elapsed whole month since created_at
        default: false
      - name: paid_cents
        type: integer
        source: computed
        description: sum of applied Payment.amount_cents posted to this obligation
        default: 0
      - name: status
        type: enum
        source: system
        description: obligation lifecycle
        default: OPEN
        constraints: one of {OPEN, PARTIALLY_PAID, PAID, DISCHARGED}

  - name: Payment
    parent: FinancialObligation
    common_fields: false
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; whose payment this is"
      - name: amount_cents
        type: integer
        source: input
        description: tendered amount in cents to allocate across the supervisee's obligations
        constraints: ">= 1"
      - name: allocation_policy
        type: enum
        source: input
        description: which waterfall ordering to use when distributing this payment
        default: RESTITUTION_FIRST
        constraints: one of {RESTITUTION_FIRST, OLDEST_FIRST}
      - name: applied_breakdown
        type: object
        source: computed
        description: map of obligation_id -> cents applied, produced by the waterfall allocation
      - name: posted_at
        type: datetime
        source: system
        description: server timestamp the payment posted; allocation tie-break basis

  - name: CourtReport
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the subject of the report"
      - name: report_type
        type: enum
        source: input
        description: kind of court report
        constraints: one of {PROGRESS, VIOLATION_SUMMARY, EARLY_TERMINATION, REVOCATION}
      - name: as_of_date
        type: datetime
        source: input
        description: ISO date the report snapshots compliance figures
      - name: snapshot
        type: object
        source: computed
        description: frozen snapshot {restitution_balance_cents, fee_balance_cents, cumulative_violation_points, supervision_level, compliance_rate} captured at filing
      - name: status
        type: enum
        source: system
        description: report lifecycle
        default: DRAFT
        constraints: one of {DRAFT, FILED}

  - name: InterstateTransfer
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee proposed for transfer"
      - name: receiving_state_code
        type: string
        source: input
        description: two-letter destination state code under the Interstate Compact
        constraints: two uppercase letters; must differ from Supervisee.sentence_state_code
      - name: expected_supervisee_version
        type: integer
        source: input
        description: OCC token; the Supervisee.version the requester last observed
      - name: status
        type: enum
        source: system
        description: compact transfer lifecycle
        default: REQUESTED
        constraints: one of {REQUESTED, ACCEPTED, REJECTED, WITHDRAWN}
      - name: decided_at
        type: datetime
        source: input
        description: ISO timestamp the receiving state decided

  - name: EarlyTermination
    parent: Supervisee
    common_fields: true
    fields:
      - name: supervisee_id
        type: string
        source: input
        description: "FK -> Supervisee.id; the supervisee requesting early termination"
      - name: requested_on
        type: datetime
        source: input
        description: ISO date the petition was filed
      - name: months_served
        type: integer
        source: computed
        description: whole months elapsed from Supervisee.supervision_start_date to requested_on
      - name: eligibility
        type: object
        source: computed
        description: frozen eligibility evaluation {percent_served, balances_clear, no_open_violations, eligible}
      - name: status
        type: enum
        source: system
        description: petition lifecycle
        default: SUBMITTED
        constraints: one of {SUBMITTED, GRANTED, DENIED}

# ===========================================================================
# §1.2 STATE MACHINE TABLE
# ===========================================================================
state_machines:
  # -------------------------------------------------------------------------
  # Supervisee lifecycle — posture-driven root with revocation cycle
  # -------------------------------------------------------------------------
  - entity: Supervisee
    initial_state: INTAKE
    terminal_states: [REVOKED, TERMINATED_EARLY, COMPLETED, TRANSFERRED_OUT]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /supervisees/{id}/activate"
        actor: Officer
        preconditions:
          - "Supervisee.status == INTAKE"
          - "at least one RiskAssessment for this supervisee is ADOPTED (so supervision_level is established, not the default)"
        side_effects:
          - "no balance change; activation only opens the case"
          - "increments Supervisee.version by 1"
      - from: ACTIVE
        to: ABSCONDED
        trigger: "POST /supervisees/{id}/abscond"
        actor: Officer
        preconditions:
          - "Supervisee.status == ACTIVE"
        side_effects:
          - "auto-creates a Violation with violation_class=ABSCOND, filed_by_officer_id = acting Officer, status=FILED (depth-1 link of the abscond cascade)"
          - "increments Supervisee.version by 1"
      - from: ABSCONDED
        to: ACTIVE
        trigger: "POST /supervisees/{id}/return-to-supervision"
        actor: Officer
        preconditions:
          - "Supervisee.status == ABSCONDED"
        side_effects:
          - "cycle rebound; does NOT dismiss the abscond Violation (it is adjudicated separately)"
          - "increments Supervisee.version by 1"
      - from: ACTIVE
        to: REVOCATION_PENDING
        trigger: "POST /supervisees/{id}/refer-revocation"
        actor: Officer
        preconditions:
          - "Supervisee.status == ACTIVE"
          - "Supervisee.cumulative_violation_points >= REVOCATION_REFERRAL_THRESHOLD (12)"
        side_effects:
          - "increments Supervisee.version by 1"
      - from: ABSCONDED
        to: REVOCATION_PENDING
        trigger: "POST /supervisees/{id}/refer-revocation"
        actor: Officer
        preconditions:
          - "Supervisee.status == ABSCONDED"
        side_effects:
          - "absconders may be referred for revocation regardless of point total"
          - "increments Supervisee.version by 1"
      - from: REVOCATION_PENDING
        to: REVOKED
        trigger: "POST /supervisees/{id}/revoke"
        actor: SupervisingJudge
        preconditions:
          - "Supervisee.status == REVOCATION_PENDING"
        side_effects:
          - "terminal; freezes ledger; all PROPOSED/ACTIVE SupervisionConditions transition to SUSPENDED (cascade down)"
          - "increments Supervisee.version by 1"
      - from: REVOCATION_PENDING
        to: ACTIVE
        trigger: "POST /supervisees/{id}/reinstate"
        actor: SupervisingJudge
        preconditions:
          - "Supervisee.status == REVOCATION_PENDING"
        side_effects:
          - "judge declines revocation; case returns to supervision"
          - "increments Supervisee.version by 1"
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /supervisees/{id}/early-terminations/{etid}/grant"
        actor: SupervisingJudge
        preconditions:
          - "Supervisee.status == ACTIVE"
          - "the referenced EarlyTermination.eligibility.eligible == true"
          - "EarlyTermination.status == SUBMITTED"
        side_effects:
          - "terminal; sets EarlyTermination.status=GRANTED; all ACTIVE SupervisionConditions -> SATISFIED (cascade down)"
          - "increments Supervisee.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /supervisees/{id}/complete"
        actor: SupervisingJudge
        preconditions:
          - "Supervisee.status == ACTIVE"
          - "Supervisee.restitution_balance_cents == 0 AND Supervisee.fee_balance_cents == 0"
          - "no Violation in FILED or APPEALED status"
        side_effects:
          - "terminal; all ACTIVE SupervisionConditions -> SATISFIED (cascade down)"
          - "increments Supervisee.version by 1"
      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "system: InterstateTransfer.status -> ACCEPTED"
        actor: system
        preconditions:
          - "Supervisee.status == ACTIVE"
          - "an InterstateTransfer for this supervisee just transitioned to ACCEPTED"
        side_effects:
          - "terminal; bubbles up from the accepted transfer (see InterstateTransfer machine)"
          - "increments Supervisee.version by 1"

  # -------------------------------------------------------------------------
  # RiskAssessment — adoption supersedes prior, drives supervision_level posture
  # -------------------------------------------------------------------------
  - entity: RiskAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /supervisees/{sid}/risk-assessments/{id}/adopt"
        actor: Officer
        preconditions:
          - "RiskAssessment.assessment_status == DRAFT"
          - "Supervisee.status IN {INTAKE, ACTIVE, ABSCONDED}"
        side_effects:
          - "recomputes total_score and derived_level (calc lsi_r_scoring) at adoption"
          - "supersede cascade: any other ADOPTED RiskAssessment for the same supervisee -> SUPERSEDED (depth-1)"
          - "that supersede recomputes Supervisee.supervision_level from THIS assessment's effective level (override_level if set, else derived_level) (depth-2 — bubble up to root posture)"
          - "the new supervision_level may force-suspend SupervisionConditions whose minimum_level_required now exceeds it: those ACTIVE conditions -> SUSPENDED (depth-3 cascade)"
          - "increments Supervisee.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: a newer RiskAssessment for the same supervisee is ADOPTED"
        actor: system
        preconditions:
          - "RiskAssessment.assessment_status == ADOPTED"
        side_effects:
          - "terminal for this assessment; no further adoption possible"

  # -------------------------------------------------------------------------
  # SupervisionCondition — activation gated by Supervisee.supervision_level (cross-entity)
  # -------------------------------------------------------------------------
  - entity: SupervisionCondition
    initial_state: PROPOSED
    terminal_states: [SATISFIED, WAIVED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /supervisees/{sid}/conditions/{id}/activate"
        actor: Officer
        preconditions:
          - "SupervisionCondition.status == PROPOSED"
          - "Supervisee.status == ACTIVE"
          - "Supervisee.supervision_level >= SupervisionCondition.minimum_level_required (ordering ADMINISTRATIVE<MINIMUM<MEDIUM<MAXIMUM)"
        side_effects:
          - "increments SupervisionCondition.version by 1"
      - from: ACTIVE
        to: SATISFIED
        trigger: "POST /supervisees/{sid}/conditions/{id}/satisfy"
        actor: Officer
        preconditions:
          - "SupervisionCondition.status == ACTIVE"
        side_effects:
          - "terminal; increments SupervisionCondition.version by 1"
      - from: PROPOSED
        to: WAIVED
        trigger: "POST /supervisees/{sid}/conditions/{id}/waive"
        actor: SupervisingJudge
        preconditions:
          - "SupervisionCondition.status == PROPOSED"
        side_effects:
          - "terminal; increments SupervisionCondition.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: supervision_level dropped below minimum_level_required OR Supervisee revoked"
        actor: system
        preconditions:
          - "SupervisionCondition.status == ACTIVE"
        side_effects:
          - "increments SupervisionCondition.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /supervisees/{sid}/conditions/{id}/activate"
        actor: Officer
        preconditions:
          - "SupervisionCondition.status == SUSPENDED"
          - "Supervisee.status == ACTIVE"
          - "Supervisee.supervision_level >= SupervisionCondition.minimum_level_required"
        side_effects:
          - "re-activation after posture recovery; increments SupervisionCondition.version by 1"

  # -------------------------------------------------------------------------
  # CheckIn — attendance with punctuality derivation
  # -------------------------------------------------------------------------
  - entity: CheckIn
    initial_state: SCHEDULED
    terminal_states: [ATTENDED, MISSED, EXCUSED]
    transitions:
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /supervisees/{sid}/check-ins/{id}/attend"
        actor: Officer
        preconditions:
          - "CheckIn.status == SCHEDULED"
          - "if CheckIn.requires_drug_test then a DrugTest with result already exists for this check-in"
        side_effects:
          - "sets attended_at; derives punctuality (calc checkin_punctuality)"
          - "increments CheckIn.version by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /supervisees/{sid}/check-ins/{id}/mark-missed"
        actor: Officer
        preconditions:
          - "CheckIn.status == SCHEDULED"
          - "current clock time > CheckIn.scheduled_for + CheckIn.window_minutes"
        side_effects:
          - "auto-creates a Violation with violation_class=TECHNICAL, filed_by_officer_id = acting Officer, status=FILED (cross-entity)"
          - "increments CheckIn.version by 1"
      - from: SCHEDULED
        to: EXCUSED
        trigger: "POST /supervisees/{sid}/check-ins/{id}/excuse"
        actor: Officer
        preconditions:
          - "CheckIn.status == SCHEDULED"
        side_effects:
          - "terminal; no violation; increments CheckIn.version by 1"

  # -------------------------------------------------------------------------
  # Violation — branching fork-join with segregation-of-duties on SUSTAINED
  # -------------------------------------------------------------------------
  - entity: Violation
    initial_state: FILED
    terminal_states: [DISMISSED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /supervisees/{sid}/violations/{id}/sustain"
        actor: SupervisingJudge
        preconditions:
          - "Violation.status == FILED"
          - "acting actor X-User-ID != Violation.filed_by_officer_id (segregation of duties)"
        side_effects:
          - "assigns Violation.points from VIOLATION_POINTS by violation_class (calc violation_points)"
          - "recomputes Supervisee.cumulative_violation_points += points (depth-1, ledger sync / bubble up)"
          - "the new cumulative tier selects and auto-creates a Sanction via the sanction matrix (depth-2 calc sanction_matrix)"
          - "if the selected sanction_type == REVOCATION_REFERRAL, the Sanction creation itself flips Supervisee.status ACTIVE->REVOCATION_PENDING when status was ACTIVE (depth-3 cross-entity cascade)"
          - "sets sustained_by_actor_id; increments Violation.version and Supervisee.version each by 1"
      - from: FILED
        to: DISMISSED
        trigger: "POST /supervisees/{sid}/violations/{id}/dismiss"
        actor: SupervisingJudge
        preconditions:
          - "Violation.status == FILED"
        side_effects:
          - "terminal; no points assigned; no cumulative change"
          - "increments Violation.version by 1"
      - from: SUSTAINED
        to: APPEALED
        trigger: "POST /supervisees/{sid}/violations/{id}/appeal"
        actor: Officer
        preconditions:
          - "Violation.status == SUSTAINED"
        side_effects:
          - "compensation: subtracts Violation.points from Supervisee.cumulative_violation_points (restores conserved point total, depth-1)"
          - "any Sanction tied to this Violation -> VACATED; if that sanction had flipped status to REVOCATION_PENDING and status is still REVOCATION_PENDING with cumulative now below threshold, reverts Supervisee.status -> ACTIVE (depth-2 compensation)"
          - "increments Violation.version and Supervisee.version each by 1"

  # -------------------------------------------------------------------------
  # FinancialObligation — payment-driven status
  # -------------------------------------------------------------------------
  - entity: FinancialObligation
    initial_state: OPEN
    terminal_states: [PAID, DISCHARGED]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "system: a Payment applies cents < outstanding to this obligation"
        actor: system
        preconditions:
          - "FinancialObligation.status == OPEN"
        side_effects:
          - "updates paid_cents; recomputes Supervisee restitution/fee balance (ledger sync)"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system: cumulative paid_cents reaches the obligation's outstanding-with-accrual total"
        actor: system
        preconditions:
          - "FinancialObligation.status IN {OPEN, PARTIALLY_PAID}"
        side_effects:
          - "marks PAID; recomputes Supervisee balance (ledger sync)"
      - from: OPEN
        to: PAID
        trigger: "system: a single Payment fully covers an OPEN obligation"
        actor: system
        preconditions:
          - "FinancialObligation.status == OPEN"
        side_effects:
          - "marks PAID; recomputes Supervisee balance (ledger sync)"
      - from: OPEN
        to: DISCHARGED
        trigger: "POST /supervisees/{sid}/obligations/{id}/discharge"
        actor: SupervisingJudge
        preconditions:
          - "FinancialObligation.status IN {OPEN, PARTIALLY_PAID}"
        side_effects:
          - "judge waives remaining balance; recomputes Supervisee balance to exclude this obligation's outstanding (ledger sync)"
          - "increments FinancialObligation.version by 1"

  # -------------------------------------------------------------------------
  # InterstateTransfer — compact approval, bubbles to Supervisee
  # -------------------------------------------------------------------------
  - entity: InterstateTransfer
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /supervisees/{sid}/transfers/{id}/accept"
        actor: CompactAdministrator
        preconditions:
          - "InterstateTransfer.status == REQUESTED"
          - "Supervisee.status == ACTIVE"
          - "Supervisee.cumulative_violation_points < REVOCATION_REFERRAL_THRESHOLD (12)"
        side_effects:
          - "bubbles up: Supervisee.status ACTIVE -> TRANSFERRED_OUT (cross-entity, terminal on root)"
          - "all ACTIVE SupervisionConditions -> SATISFIED on the sending side (cascade down)"
          - "increments InterstateTransfer.version and Supervisee.version each by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /supervisees/{sid}/transfers/{id}/reject"
        actor: CompactAdministrator
        preconditions:
          - "InterstateTransfer.status == REQUESTED"
        side_effects:
          - "no change to Supervisee; increments InterstateTransfer.version by 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /supervisees/{sid}/transfers/{id}/withdraw"
        actor: Officer
        preconditions:
          - "InterstateTransfer.status == REQUESTED"
        side_effects:
          - "originating officer withdraws; increments InterstateTransfer.version by 1"

  # -------------------------------------------------------------------------
  # EarlyTermination — petition decision
  # -------------------------------------------------------------------------
  - entity: EarlyTermination
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /supervisees/{sid}/early-terminations/{id}/grant"
        actor: SupervisingJudge
        preconditions:
          - "EarlyTermination.status == SUBMITTED"
          - "EarlyTermination.eligibility.eligible == true"
          - "Supervisee.status == ACTIVE"
        side_effects:
          - "drives Supervisee ACTIVE -> TERMINATED_EARLY (cross-entity); see Supervisee machine"
          - "increments EarlyTermination.version and Supervisee.version each by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /supervisees/{sid}/early-terminations/{id}/deny"
        actor: SupervisingJudge
        preconditions:
          - "EarlyTermination.status == SUBMITTED"
        side_effects:
          - "no change to Supervisee; increments EarlyTermination.version by 1"

# ===========================================================================
# §1.2.1 CONCURRENCY RULES (OCC on parent version — true CREATE-with-supersede races only)
# ===========================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-supervisee
    parent_entity: Supervisee
    write_endpoint: "POST /supervisees/{sid}/transfers"
    occ_field: "expected_supervisee_version"
    description: |
      Creating an InterstateTransfer against a Supervisee whose version has
      advanced since the requester last observed it is rejected with a stale
      version error. A new transfer request legitimately reflects the
      supervisee's current eligibility posture (status, cumulative points);
      if another writer has already mutated the supervisee (e.g. adopted a
      new risk assessment that suspended conditions, or sustained a violation
      that bumped points toward the revocation threshold), the requester's
      view is stale and the create is refused so transfer eligibility is
      always evaluated against a fresh supervisee snapshot.
    error_id: ERR_STALE_SUPERVISEE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 CALCULATION RULES TABLE
# ===========================================================================
calculations:
  # ---- DUAL-VARIANT #1 (entity domain: RiskAssessment) -------------------
  - name: lsi_r_scoring
    trigger: "POST /supervisees/{sid}/risk-assessments/{id}/adopt"
    algorithm: weighted_scoring
    formula: |
      # LSI-R total = sum of the ten domain sub-scores, then band lookup.
      total_score = sum(domain_scores[d] for d in LSI_R_DOMAINS)   # 10 domains
      # Band lookup (base variant — "actuarial bands"):
      if total_score <= 13:  derived_level = ADMINISTRATIVE
      elif total_score <= 23: derived_level = MINIMUM
      elif total_score <= 33: derived_level = MEDIUM
      else:                    derived_level = MAXIMUM    # 34..54
      # effective level applied to Supervisee.supervision_level on adoption:
      effective = max(derived_level, override_level) using ordering
                  ADMINISTRATIVE<MINIMUM<MEDIUM<MAXIMUM    # override may only RAISE
    input_set: "exactly the ten LSI_R_DOMAINS keys in domain_scores; all ten required"
    constants:
      LSI_R_DOMAINS: ["criminal_history","education_employment","financial","family_marital","accommodation","leisure_recreation","companions","alcohol_drug","emotional_personal","attitudes_orientation"]
      ADMIN_MAX: 13
      MINIMUM_MAX: 23
      MEDIUM_MAX: 33
      LEVEL_ORDER: { ADMINISTRATIVE: 0, MINIMUM: 1, MEDIUM: 2, MAXIMUM: 3 }
    precision: "integer; no rounding"
    variants:
      - name: actuarial_band
        when: "override_level is null"
        difference: "supervision_level = derived_level straight from the band table"
      - name: clinical_override
        when: "override_level is supplied and >= derived_level (ordering)"
        difference: "supervision_level = override_level (the higher of the two); a different effective posture than the actuarial band for identical domain_scores — same inputs, two valid levels"

  # ---- DUAL-VARIANT #2 (entity domain: FinancialObligation / Supervisee ledger) ----
  - name: restitution_payoff_quote
    trigger: "GET /supervisees/{sid}/payoff-quote (computed read; as_of query param)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING projected payoff: includes future accrual to the as_of date
      # for recurring FEE obligations, on top of current outstanding principal.
      for ob in obligations where ob.status IN {OPEN, PARTIALLY_PAID}:
        outstanding = ob.principal_cents - ob.paid_cents
        if ob.obligation_type == FEE and ob.recurring:
          whole_months = floor(months_between(ob.created_at, as_of))   # >=0
          accrued = whole_months * ob.monthly_accrual_cents
          outstanding += accrued
        bucket[ob.obligation_type] += max(outstanding, 0)
      projected_restitution = bucket[RESTITUTION]
      projected_fee = bucket[FEE]
      projected_total = projected_restitution + projected_fee
    input_set: "obligations of the supervisee in {OPEN, PARTIALLY_PAID}; DISCHARGED/PAID excluded"
    constants: {}
    precision: "integer cents; floor on whole_months (no partial-month accrual)"
    variants:
      - name: forward_looking_projected
        when: "GET payoff-quote (this calc) — used for quotes and EarlyTermination what-if"
        difference: "adds projected future monthly accrual through as_of; produces a LARGER figure than the chronological ledger for the same obligations when recurring fees exist"
      - name: chronological_ledger
        when: "Supervisee.restitution_balance_cents / fee_balance_cents (the posted balances)"
        difference: "sums only currently-posted outstanding (principal - paid + already-accrued-to-now), NO future projection; same obligations, smaller number — the divergence is the dual variant"

  # ---- COMBINATORIAL #1 — mode (a): >=3 inputs, non-linear tiered selection ----
  - name: sanction_matrix
    trigger: "POST /supervisees/{sid}/violations/{id}/sustain"
    algorithm: tiered_pricing
    formula: |
      # Inputs (>=3): violation_class, new cumulative tier, prior sanction history.
      points = VIOLATION_POINTS[violation_class]
      new_cumulative = supervisee.cumulative_violation_points + points   # after this sustain
      tier = TIER1 if new_cumulative <= 4
             else TIER2 if new_cumulative <= 8
             else TIER3 if new_cumulative <= 11
             else TIER4                                # new_cumulative >= 12
      # Matrix select — non-linear interaction of class x tier:
      if violation_class == ABSCOND or tier == TIER4:
        sanction_type = REVOCATION_REFERRAL; imposed_days = 0
      elif tier == TIER3:
        sanction_type = JAIL_SHOCK
        imposed_days = JAIL_BASE_DAYS + (new_cumulative - 9) * JAIL_STEP_DAYS  # 9->2,10->4,11->6
      elif tier == TIER2:
        sanction_type = CURFEW_IMPOSITION if violation_class in {MISDEMEANOR,FELONY} else INCREASED_REPORTING
        imposed_days = 0
      else:  # TIER1
        sanction_type = VERBAL_WARNING; imposed_days = 0
    input_set: "the violation being sustained + supervisee.cumulative_violation_points snapshot before this sustain"
    constants:
      VIOLATION_POINTS: { TECHNICAL: 2, MISDEMEANOR: 4, FELONY: 6, ABSCOND: 12 }
      TIER1_MAX: 4
      TIER2_MAX: 8
      TIER3_MAX: 11
      REVOCATION_REFERRAL_THRESHOLD: 12
      JAIL_BASE_DAYS: 0
      JAIL_STEP_DAYS: 2
    precision: "integer points and days; no rounding"

  # ---- COMBINATORIAL #2 — mode (b): nested rounding, order pinned ----
  - name: compliance_rate
    trigger: "POST /supervisees/{sid}/court-reports (snapshot at filing) and GET /supervisees/{sid}/compliance"
    algorithm: aggregation
    formula: |
      # Compliance rate over terminal check-ins, expressed as a percentage with
      # ROUNDING ORDER PINNED: compute the exact ratio first, multiply by 100,
      # THEN round half-up to 1 decimal place. (Pinned: ratio -> *100 -> round,
      # NOT round(ratio,3) -> *100, which would drift on repeating decimals.)
      terminal = count(check_ins where status IN {ATTENDED, MISSED, EXCUSED})
      attended_on_time = count(check_ins where status == ATTENDED and punctuality == ON_TIME)
      if terminal == 0:
        compliance_rate = 100.0      # vacuously compliant, boundary: empty set
      else:
        ratio = attended_on_time / terminal           # exact rational
        compliance_rate = round_half_up(ratio * 100, 1)   # *100 THEN round to 1 dp
    input_set: "check-ins of the supervisee in terminal states {ATTENDED, MISSED, EXCUSED}; SCHEDULED excluded"
    constants:
      ON_TIME_NUMERATOR_STATUSES: ["ATTENDED"]
      DECIMAL_PLACES: 1
    precision: "1 decimal place, round_half_up; ratio*100 computed before rounding (order pinned)"

  # ---- Supporting calc: check-in punctuality (boundary precision metric) ----
  - name: checkin_punctuality
    trigger: "POST /supervisees/{sid}/check-ins/{id}/attend"
    algorithm: threshold
    formula: |
      window_close = scheduled_for + (window_minutes minutes)
      # Boundary pinned with <= : arriving exactly at window_close is ON_TIME.
      if attended_at <= window_close: punctuality = ON_TIME
      else: punctuality = LATE
    input_set: "the single CheckIn being attended"
    constants:
      INCLUSIVE_BOUNDARY: "attended_at <= window_close is ON_TIME"
    precision: "second-resolution datetime comparison; boundary inclusive (<=)"

  # ---- Supporting calc: violation points (assigned at sustain) ----
  - name: violation_points
    trigger: "POST /supervisees/{sid}/violations/{id}/sustain"
    algorithm: aggregation
    formula: |
      points = VIOLATION_POINTS[violation_class]   # assigned to Violation.points
      supervisee.cumulative_violation_points = sum(v.points for v in violations
                                                   where v.status == SUSTAINED)
    input_set: "all SUSTAINED violations of the supervisee (full recompute, not incremental, to stay exact under appeal compensation)"
    constants:
      VIOLATION_POINTS: { TECHNICAL: 2, MISDEMEANOR: 4, FELONY: 6, ABSCOND: 12 }
    precision: "integer; no rounding"

  # ---- Payment waterfall allocation (ordering + remainder pinned) ----
  - name: payment_waterfall
    trigger: "POST /supervisees/{sid}/payments"
    algorithm: waterfall_allocation
    formula: |
      # Distribute amount_cents across the supervisee's OPEN/PARTIALLY_PAID obligations.
      # Ordering pinned per allocation_policy:
      if allocation_policy == RESTITUTION_FIRST:
        ordered = obligations sorted by (type_rank, created_at ASC, parent_obligation_id ASC)
                  where type_rank(RESTITUTION)=0, type_rank(FEE)=1
      else:  # OLDEST_FIRST
        ordered = obligations sorted by (created_at ASC, type_rank, parent_obligation_id ASC)
      remaining = amount_cents
      for ob in ordered (status IN {OPEN, PARTIALLY_PAID}):
        outstanding = (ob.principal_cents + accrued_to_now(ob)) - ob.paid_cents
        take = min(remaining, max(outstanding, 0))
        applied_breakdown[ob.id] = take
        ob.paid_cents += take; remaining -= take
        if remaining == 0: break
      # Overpayment: if remaining > 0 after all obligations filled, reject the
      # whole payment (no partial post) — see validation ERR_PAYMENT_EXCEEDS_BALANCE.
    input_set: "obligations in {OPEN, PARTIALLY_PAID}; ordered deterministically; created_at ASC tie-break (NEVER id)"
    constants:
      TYPE_RANK: { RESTITUTION: 0, FEE: 1 }
    precision: "integer cents; created_at ASC as the sole tie-break, id never used"

  # ---- Early-termination eligibility (combinatorial gate over balances+points+time) ----
  - name: early_termination_eligibility
    trigger: "POST /supervisees/{sid}/early-terminations"
    algorithm: threshold
    formula: |
      months_served = floor(months_between(supervision_start_date, requested_on))
      percent_served = floor( (months_served * 100) / ordered_term_months )   # integer floor pct
      balances_clear = (restitution_balance_cents == 0)        # FEES may remain; restitution must be clear
      no_open_violations = (count(violations where status IN {FILED, APPEALED}) == 0)
      # Boundary pinned with >= : exactly 50% served qualifies on the time axis.
      eligible = (percent_served >= EARLY_TERM_MIN_PERCENT) and balances_clear and no_open_violations
    input_set: "supervisee snapshot at petition time: start date, term, restitution balance, FILED/APPEALED violation count"
    constants:
      EARLY_TERM_MIN_PERCENT: 50
    precision: "integer floor on months and percent; >= boundary on percent_served"

# ===========================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority — lowest number wins)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource id in the path exists, validated left-to-right (supervisee before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "every FK in the request body references an existing resource (assigned_officer_id, supervisee_id, parent_obligation_id, source_drug_test_id, violation_id, check_in_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed; enum values are members of the declared set; integer cents/months >= declared minimum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints with body"

  - priority: 6
    category: business_constraint
    check: "RiskAssessment.domain_scores contains exactly the ten LSI_R_DOMAINS keys, each value >= 0"
    error_id: ERR_INCOMPLETE_LSIR_DOMAINS
    http_status: 422
    applies_to: "POST /supervisees/{sid}/risk-assessments"

  - priority: 7
    category: business_constraint
    check: "RiskAssessment.override_level, when supplied, is >= derived_level by LEVEL_ORDER (override may only raise) and override_reason is non-empty"
    error_id: ERR_INVALID_OVERRIDE
    http_status: 422
    applies_to: "POST /supervisees/{sid}/risk-assessments, .../adopt"

  - priority: 8
    category: business_referential
    check: "Supervisee.assigned_officer_id refers to an Officer whose role_type equals the supervisee's supervision_type and active==true"
    error_id: ERR_OFFICER_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /supervisees"

  - priority: 9
    category: business_referential
    check: "docket_number unique across Supervisees; badge_number unique across Officers"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /supervisees, POST /officers"

  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"

  - priority: 11
    category: business_safety
    check: "segregation of duties — on sustain, X-User-ID (the SupervisingJudge) must differ from Violation.filed_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /supervisees/{sid}/violations/{id}/sustain"

  - priority: 12
    category: business_referential
    check: "a SupervisionCondition cannot be activated while Supervisee.supervision_level < minimum_level_required (cross-entity posture gate)"
    error_id: ERR_LEVEL_TOO_LOW_FOR_CONDITION
    http_status: 409
    applies_to: "POST /supervisees/{sid}/conditions/{id}/activate"

  - priority: 13
    category: business_temporal
    check: "a CheckIn may be marked MISSED only after current clock time > scheduled_for + window_minutes; before the window closes it is still SCHEDULED"
    error_id: ERR_WINDOW_NOT_CLOSED
    http_status: 409
    applies_to: "POST /supervisees/{sid}/check-ins/{id}/mark-missed"

  - priority: 14
    category: business_temporal
    check: "two CheckIns for the same supervisee may not have overlapping [scheduled_for, scheduled_for + window_minutes) appointment windows; adjacency (next starts exactly at prior close) is allowed (half-open intervals)"
    error_id: ERR_CHECKIN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /supervisees/{sid}/check-ins"

  - priority: 15
    category: business_temporal
    check: "an InterstateTransfer interval [requested decision .. ] cannot be opened while another REQUESTED or ACCEPTED transfer exists for the same supervisee; a transfer's exclusive supervision claim must not overlap an existing one (single live compact claim)"
    error_id: ERR_TRANSFER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /supervisees/{sid}/transfers"

  - priority: 16
    category: business_safety
    check: "a Violation may be sustained only when its parent Supervisee is NOT in a terminal status {REVOKED, TERMINATED_EARLY, COMPLETED, TRANSFERRED_OUT}"
    error_id: ERR_SUPERVISEE_CLOSED
    http_status: 409
    applies_to: "POST /supervisees/{sid}/violations, .../sustain, .../conditions, .../check-ins, .../payments"

  - priority: 17
    category: business_constraint
    check: "early termination requires eligibility.eligible==true (>=50% term served, restitution_balance_cents==0, zero FILED/APPEALED violations)"
    error_id: ERR_NOT_ELIGIBLE_FOR_TERMINATION
    http_status: 409
    applies_to: "POST /supervisees/{sid}/early-terminations/{id}/grant"

  - priority: 18
    category: business_fiscal
    check: "a Payment's amount_cents must not exceed the supervisee's total currently-outstanding balance across OPEN/PARTIALLY_PAID obligations (chronological, no future accrual); overpayment is rejected whole (no partial post)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /supervisees/{sid}/payments"

  - priority: 19
    category: business_fiscal
    check: "case COMPLETED requires restitution_balance_cents==0 AND fee_balance_cents==0 (both clear) — distinct from early termination which only requires restitution clear"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /supervisees/{id}/complete"

  - priority: 20
    category: business_constraint
    check: "interstate transfer acceptance requires cumulative_violation_points < REVOCATION_REFERRAL_THRESHOLD (12); high-risk absconding-prone cases cannot be exported"
    error_id: ERR_TRANSFER_BLOCKED_HIGH_RISK
    http_status: 409
    applies_to: "POST /supervisees/{sid}/transfers/{id}/accept"

  - priority: 21
    category: business_constraint
    check: "OCC: expected_supervisee_version must equal current Supervisee.version on transfer create"
    error_id: ERR_STALE_SUPERVISEE_VERSION
    http_status: 412
    applies_to: "POST /supervisees/{sid}/transfers"

# ===========================================================================
# §1.5 API ENDPOINT TABLE
# ===========================================================================
endpoints:
  # ---- Officers ----------------------------------------------------------
  - method: POST
    path: "/officers"
    description: "register a probation/parole officer"
    roles: [CompactAdministrator]
    code: 201
    input: [full_name, badge_number, role_type, "active?"]
    output: Officer
    side_effects: ["mints Officer"]
  - method: GET
    path: "/officers/{id}"
    description: "fetch one officer"
    roles: [CompactAdministrator, Officer, SupervisingJudge]
    code: 200
    input: []
    output: Officer
    side_effects: []
  - method: GET
    path: "/officers"
    description: "list officers"
    roles: [CompactAdministrator, Officer, SupervisingJudge]
    code: 200
    input: ["role_type?", "limit?", "offset?"]
    output: Officer[]
    side_effects: []

  # ---- Supervisees -------------------------------------------------------
  - method: POST
    path: "/supervisees"
