    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: ["discipline?", "grade_band?", "language?", "vetting_status?", "roster_status?", "limit?", "offset?"]
    output: TeachingArtist[]
    side_effects: []

  - method: POST
    path: "/teaching-artists/{id}/vetting"
