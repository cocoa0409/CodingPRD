# =============================================================================
# §1.8 Scaffold Difficulty Design — Campus Recreation & Intramural Leagues
# 20 instances across the 9 Difficulty Rules. All times use the logical clock
# (default 2026-08-01T00:00:00Z). Facility windows in fixtures: Mon-Sat
# (day_of_week 0..5) 17:00-22:00 unless stated otherwise.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: membership_full_vs_prorated_term_fee
        grounds:
          - calculations.membership_fee_cents
          - entities.Membership.fields.pricing_variant
          - endpoints."POST /v1/members/{member_id}/memberships"
        distinguishing_aspect: |
          Membership-COMMERCE domain dual variant: identical affiliation+term purchased on day 7 vs day 8 of the term
          selects FULL (flat 20000) vs PRORATED (weekly_rate 1250 rounded FIRST, x 15 whole weeks = 18750) — two valid
          fee interpretations of the same term produce different cents; sibling instance lives in the officials-pay domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-24 (FALL_2026 day 1); faculty member A purchases FALL_2026 (day 1 -> FULL)"
            - "Logical clock advanced to 2026-08-31 (day 8); faculty member B purchases FALL_2026 (PRORATED: days_remaining=103, weeks=15)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "fa@x.edu", full_name: "Fac A", affiliation: "FACULTY" }, as: RecAdmin, captures: { fa_id: "$.data.id", fa_v: "$.data.version" } }
            - { call: "POST /v1/members/${fa_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${fa_v}" }, as: Member, as_user_id: "${fa_id}", captures: { fa_fee: "$.data.fee_cents", fa_variant: "$.data.pricing_variant" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "fb@x.edu", full_name: "Fac B", affiliation: "FACULTY" }, as: RecAdmin, captures: { fb_id: "$.data.id", fb_v: "$.data.version" } }
            - { call: "POST /v1/members/${fb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${fb_v}" }, as: Member, as_user_id: "${fb_id}", captures: { fb_fee: "$.data.fee_cents", fb_variant: "$.data.pricing_variant" } }
          trigger: []
          assert:
            - "membership A fee_cents == 20000 and pricing_variant == FULL (boundary: day 1..7 inclusive)"
            - "membership B fee_cents == 18750 and pricing_variant == PRORATED (weekly 1250 = round_half_up(20000/16) computed FIRST, weeks_remaining = ceil(103/7) = 15 multiplied SECOND)"
            - "20000 != 18750: the two variants legitimately disagree on identical term+affiliation"
      - name: official_provisional_vs_final_pay
        grounds:
          - calculations.official_pay_provisional
          - calculations.official_pay_final
          - state_machines.OfficiatingAssignment.WORKED_to_PAID
        distinguishing_aspect: |
          Officials-LABOR domain dual variant (different entity domain from membership fees): same assignment settles a
          FORFEITED game at the flat 1-hour base (2000, NO cert multiplier) while its provisional estimate used scheduled
          duration x cert multiplier (90min x 2000 x 1.25 / 60 = 3750) — provisional != final for identical assignment data.
        test_recipe:
          setup:
            - "2-team BASKETBALL league IN_SEASON (division A), facility with Mon-Sat 17:00-22:00 windows, game Tue 2026-09-08 18:00-19:30"
            - "L2 official (rate 2000) assigned and ACCEPTED; logical clock moved to 2026-09-08T19:45:00Z (after start)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Court 1", kind: "COURT", operating_windows: [ { day_of_week: 0, open_minute: 1020, close_minute: 1320 }, { day_of_week: 1, open_minute: 1020, close_minute: 1320 }, { day_of_week: 2, open_minute: 1020, close_minute: 1320 }, { day_of_week: 3, open_minute: 1020, close_minute: 1320 }, { day_of_week: 4, open_minute: 1020, close_minute: 1320 }, { day_of_week: 5, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", payload: {}, as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/members", payload: { email: "cb@x.edu", full_name: "Cap B", affiliation: "STUDENT" }, as: RecAdmin, captures: { cb_id: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${cb_id}", captures: { cb_v2: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${cb_v2}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Beta", captain_member_id: "${cb_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { tb_id: "$.data.id" } }
            - { call: "POST /v1/teams/${tb_id}/roster-entries", payload: { member_id: "${cb_id}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/leagues/${lg_id}/close-registration", payload: {}, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${ta_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${tb_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/leagues/${lg_id}/start-season", payload: {}, as: LeagueCoordinator }
            - { call: "GET /v1/leagues/${lg_id}", payload: {}, as: LeagueCoordinator, captures: { lg_v: "$.data.version" } }
            - { call: "POST /v1/leagues/${lg_id}/games", payload: { home_team_id: "${ta_id}", away_team_id: "${tb_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:30:00Z", expected_league_version: "${lg_v}" }, as: LeagueCoordinator, captures: { g_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Ref O", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000, certification_level: 2 }, as: RecAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/games/${g_id}/officiating-assignments", payload: { staff_id: "${o_id}" }, as: LeagueCoordinator, captures: { asg_id: "$.data.id", asg_prov: "$.data.provisional_pay_cents" } }
            - { call: "POST /v1/officiating-assignments/${asg_id}/respond", payload: { response: "ACCEPT" }, as: Staff, as_user_id: "${o_id}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T19:45:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/games/${g_id}/declare-forfeit", payload: { forfeiting_team_id: "${tb_id}" }, as: LeagueCoordinator }
            - { call: "POST /v1/officiating-assignments/${asg_id}/settle", payload: {}, as: LeagueCoordinator, captures: { asg_final: "$.data.final_pay_cents" } }
            - { call: "GET /v1/staff/${o_id}", payload: {}, as: LeagueCoordinator, captures: { o_pending: "$.data.payroll_pending_cents", o_paid: "$.data.payroll_paid_cents" } }
          assert:
            - "assignment provisional_pay_cents == 3750 (90 * 2000 * 1.25 / 60, round_half_up)"
            - "after declare-forfeit: Game.status == FORFEITED and assignment status == WORKED (manual forfeit keeps ACCEPTED officials WORKED)"
            - "settle: final_pay_cents == 2000 (flat 1-hour base, NO 1.25 multiplier) — 2000 != 3750 provisional"
            - "Staff.payroll_pending_cents == 0 and payroll_paid_cents == 2000 (delta -1750 vs provisional absorbed at settle)"
            - "Team Beta: forfeit_count == 1, sportsmanship_points_total == 1, sportsmanship_rating_count == 1 (automatic 1)"
      - name: instructor_estimate_vs_final_class_pay
        grounds:
          - calculations.instructor_session_pay
          - entities.FitnessClass.fields.instructor_pay_estimate_cents
          - entities.FitnessClass.fields.instructor_pay_cents
        distinguishing_aspect: |
          Instructor-payroll domain (third entity domain): the creation-time estimate (3000, no bonus) and the
          completion-time final (attendance 3/5 = 0.60 -> +10% tier -> 3300) diverge for the same class because the
          variant input (attendance) only exists at completion.
        test_recipe:
          setup:
            - "Instructor (rate 3000, certified [YOGA]); YOGA class Tue 2026-09-08 18:00-19:00 capacity 5 at a ROOM facility"
            - "Four fully eligible members registered (all REGISTERED); clock moved past class end"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Studio", kind: "ROOM", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr I", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certified_class_types: ["YOGA"] }, as: RecAdmin, captures: { i_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Yoga PM", class_type: "YOGA", instructor_staff_id: "${i_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:00:00Z", capacity: 5 }, as: RecAdmin, captures: { c_id: "$.data.id", c_est: "$.data.instructor_pay_estimate_cents" } }
            - { call: "POST /v1/members", payload: { email: "y1@x.edu", full_name: "Y One", affiliation: "STUDENT" }, as: RecAdmin, captures: { m1_id: "$.data.id", m1_v: "$.data.version" } }
            - { call: "POST /v1/members/${m1_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${m1_id}", captures: { m1_v2: "$.data.version" } }
            - { call: "POST /v1/members/${m1_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${m1_v2}" }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${m1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "y2@x.edu", full_name: "Y Two", affiliation: "STUDENT" }, as: RecAdmin, captures: { m2_id: "$.data.id", m2_v: "$.data.version" } }
            - { call: "POST /v1/members/${m2_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${m2_id}", captures: { m2_v2: "$.data.version" } }
            - { call: "POST /v1/members/${m2_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${m2_v2}" }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${m2_id}" }, as: Member, as_user_id: "${m2_id}", captures: { r2_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "y3@x.edu", full_name: "Y Three", affiliation: "STUDENT" }, as: RecAdmin, captures: { m3_id: "$.data.id", m3_v: "$.data.version" } }
            - { call: "POST /v1/members/${m3_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${m3_id}", captures: { m3_v2: "$.data.version" } }
            - { call: "POST /v1/members/${m3_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${m3_v2}" }, as: Member, as_user_id: "${m3_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${m3_id}" }, as: Member, as_user_id: "${m3_id}", captures: { r3_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "y4@x.edu", full_name: "Y Four", affiliation: "STUDENT" }, as: RecAdmin, captures: { m4_id: "$.data.id", m4_v: "$.data.version" } }
            - { call: "POST /v1/members/${m4_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${m4_id}", captures: { m4_v2: "$.data.version" } }
            - { call: "POST /v1/members/${m4_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${m4_v2}" }, as: Member, as_user_id: "${m4_id}" }
            - { call: "POST /v1/fitness-classes/${c_id}/registrations", payload: { member_id: "${m4_id}" }, as: Member, as_user_id: "${m4_id}", captures: { r4_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T19:01:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/fitness-classes/${c_id}/complete", payload: { no_show_registration_ids: ["${r4_id}"] }, as: Staff, as_user_id: "${i_id}", captures: { c_pay: "$.data.instructor_pay_cents", c_att: "$.data.attendance_count" } }
            - { call: "GET /v1/staff/${i_id}", payload: {}, as: RecAdmin, captures: { i_paid: "$.data.payroll_paid_cents" } }
          assert:
            - "estimate at creation == 3000 (60 * 3000 / 60, no bonus)"
            - "final instructor_pay_cents == 3300 (attendance 3, fill 3/5 = 0.60 >= 0.50 -> +10%: round_half_up(60 * 3000 * 1.1 / 60))"
            - "attendance_count == 3; registration r4 status == NO_SHOW; Member y4 no_show_count == 1"
            - "Staff.payroll_paid_cents == 3300 (instructor rail credits paid directly; payroll_pending_cents stays 0)"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: official_pay_multi_input_branching
        grounds:
          - calculations.official_pay_final
          - calculations.official_pay_provisional
        distinguishing_aspect: |
          Mode (a) combinatorial: final pay is a 3+ input non-linear composition — outcome branch (FINAL vs FORFEITED),
          certification multiplier (L3 = 1.5), and actual-duration override (85 != scheduled 90): 85 * 2000 * 1.5 / 60 = 4250,
          distinct from both the provisional 4500 and the forfeit-flat 2000 the same inputs would yield on other branches.
        test_recipe:
          setup:
            - "Same 2-team league shape as official_provisional_vs_final_pay; L3 official (rate 2000); game 90min; captains file MISMATCHED reports (2-1 vs 2-2) -> DISPUTED; RecAdmin finalizes 2-1 with actual_duration_minutes 85"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Court 1", kind: "COURT", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", payload: {}, as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/members", payload: { email: "cb@x.edu", full_name: "Cap B", affiliation: "STUDENT" }, as: RecAdmin, captures: { cb_id: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${cb_id}", captures: { cb_v2: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${cb_v2}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Beta", captain_member_id: "${cb_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { tb_id: "$.data.id" } }
            - { call: "POST /v1/teams/${tb_id}/roster-entries", payload: { member_id: "${cb_id}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/leagues/${lg_id}/close-registration", payload: {}, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${ta_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${tb_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/leagues/${lg_id}/start-season", payload: {}, as: LeagueCoordinator }
            - { call: "GET /v1/leagues/${lg_id}", payload: {}, as: LeagueCoordinator, captures: { lg_v: "$.data.version" } }
            - { call: "POST /v1/leagues/${lg_id}/games", payload: { home_team_id: "${ta_id}", away_team_id: "${tb_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:30:00Z", expected_league_version: "${lg_v}" }, as: LeagueCoordinator, captures: { g_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Ref O", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000, certification_level: 3 }, as: RecAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/games/${g_id}/officiating-assignments", payload: { staff_id: "${o_id}" }, as: LeagueCoordinator, captures: { asg_id: "$.data.id", asg_prov: "$.data.provisional_pay_cents" } }
            - { call: "POST /v1/officiating-assignments/${asg_id}/respond", payload: { response: "ACCEPT" }, as: Staff, as_user_id: "${o_id}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T19:45:00Z" }, as: RecAdmin }
            - { call: "POST /v1/games/${g_id}/score-reports", payload: { side: "HOME", home_score: 2, away_score: 1, opponent_sportsmanship: 4 }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/games/${g_id}/score-reports", payload: { side: "AWAY", home_score: 2, away_score: 2, opponent_sportsmanship: 5 }, as: Member, as_user_id: "${cb_id}" }
          trigger:
            - { call: "POST /v1/games/${g_id}/finalize", payload: { home_score: 2, away_score: 1, home_sportsmanship: 4, away_sportsmanship: 5, actual_duration_minutes: 85 }, as: RecAdmin }
            - { call: "POST /v1/officiating-assignments/${asg_id}/settle", payload: {}, as: LeagueCoordinator, captures: { asg_final: "$.data.final_pay_cents" } }
          assert:
            - "game reached DISPUTED on the mismatching second report, then FINAL on finalize with final scores 2-1"
            - "provisional_pay_cents == 4500 (90 * 2000 * 1.5 / 60)"
            - "final_pay_cents == 4250 (actual 85 min overrides scheduled 90; 85 * 2000 * 1.5 / 60 = 4250)"
            - "the same assignment would have paid 2000 on the FORFEITED branch — three branches, three amounts from one formula family"
      - name: instructor_payroll_round_per_session_sum
        grounds:
          - calculations.instructor_session_pay
          - entities.Staff.fields.payroll_paid_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-session pay is round_half_up'd BEFORE summing into the term total. Two 50-minute
          sessions at 3333/hr raw 2777.5 each: pinned order yields 2778 + 2778 = 5556; the alternative sum-then-round
          yields round_half_up(5555.0) = 5555 — the two orders provably diverge on these fixtures.
        test_recipe:
          setup:
            - "Instructor rate 3333 certified [HIIT, SPIN]; two 50-min classes (Tue 2026-09-08 HIIT, Wed 2026-09-09 SPIN) capacity 4, one attendee each (fill 0.25 -> +0% bonus)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Studio", kind: "ROOM", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 }, { day_of_week: 2, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr I", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3333, certified_class_types: ["HIIT", "SPIN"] }, as: RecAdmin, captures: { i_id: "$.data.id" } }
