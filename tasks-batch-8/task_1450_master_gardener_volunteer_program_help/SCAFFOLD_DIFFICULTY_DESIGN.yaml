        grounds:
          - validations[priority=10]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair (business_constraint, business_referential) — a different pair
          than (state, temporal): explicit referral to a specialist who is BOTH
          at capacity (1/1) AND specialty-mismatched must return
          ERR_SPECIALIST_AT_CAPACITY, proving constraint runs before referential.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE staffed on shift 2026-08-05 09:00-12:00; clock inside window"
            - "Specialist S1 specialty SOIL capacity 1, already holding one OPEN referral (SOIL inquiry)"
            - "Second inquiry TRIAGED with category PEST"
          setup_api_calls:
