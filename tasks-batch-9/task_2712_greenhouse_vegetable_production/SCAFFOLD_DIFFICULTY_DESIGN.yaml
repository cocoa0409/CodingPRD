  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: labor_productivity_ratio_exactly_at_bonus_threshold_pays_the_bonus
        grounds:
          - calculations.labor_standard_cost
          - calculations.labor_standard_cost.variants.actual
          - state_machines.LaborTask.IN_PROGRESS_to_COMPLETED
          - entities.LaborTask.fields.productivity_ratio
          - entities.LaborTask.fields.bonus_usd
        distinguishing_aspect: |
          Metric is productivity_ratio at exactly BONUS_RATIO_THRESHOLD 1.1 on the endpoint
          POST /labor-tasks/{id}/transitions. 4400 units in exactly 8.0 hours against a 500 units/hour
          standard quantizes to 1.1000, which is >= the threshold, so the bonus pays; the 8.0 hours also
          sit exactly on OT_THRESHOLD_HOURS so no overtime multiplier applies.
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone with a 20000.00 USD labor budget, one crop cycle in TRANSPLANTED."
            - "One ACTIVE HARVEST worker at 19.50 USD/h with productivity_index exactly 1.00 so planned_hours is a clean 8.00."
            - "One SCHEDULED HARVEST task for 4000 planned units at a 500 units/hour standard, then moved to IN_PROGRESS once the clock reaches window_start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Petra Lund", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_flat: $.data.id }
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", worker_id: "${w_flat}", task_type: "HARVEST", window_start: "2026-08-06T07:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 4000, standard_units_per_hour: 500 }
              as: GrowerManager
              captures: { task_b: $.data.id, planned_hours_b: $.data.planned_hours, planned_cost_b: $.data.planned_cost_usd }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T07:00:00Z" }
              as: GrowerManager
            - call: "POST /labor-tasks/${task_b}/transitions"
              payload: { to_status: "IN_PROGRESS" }
              as: HarvestSupervisor
              as_user_id: "${w_flat}"
          trigger:
            - call: "POST /labor-tasks/${task_b}/transitions"
              payload: { to_status: "COMPLETED", actual_hours: 8.0, actual_units: 4400 }
              as: HarvestSupervisor
              as_user_id: "${w_flat}"
          assert:
            - "${planned_hours_b} == 8.00"
            - "${planned_cost_b} == 156.00"
            - "LaborTask.${task_b}.status == COMPLETED"
            - "LaborTask.${task_b}.productivity_ratio == 1.1000"
            - "LaborTask.${task_b}.bonus_usd == 88.00"
            - "LaborTask.${task_b}.actual_cost_usd == 244.00"
            - "Zone.${zone_a}.labor_budget_committed_usd == 244.00"
            - "Zone.${zone_a}.labor_budget_remaining_usd == 19756.00"
            - "Worker.${w_flat}.committed_hours == 0.00"

      - name: allocation_run_upper_bound_is_half_open_so_the_seventh_day_lot_is_not_eligible
        grounds:
          - calculations.commitment_waterfall_allocation
          - validations[priority=40]
          - errors[ERR_NO_ELIGIBLE_LOTS]
          - endpoints[POST /allocation-runs]
          - entities.CommitmentWeek.fields.fill_rate_pct
        distinguishing_aspect: |
          Different metric and a different endpoint from the labor instance: the candidate-lot date filter
          week_start_date <= harvest_date < week_start_date + LOT_ELIGIBILITY_WINDOW_DAYS on
          POST /allocation-runs. A lot harvested exactly on 2026-08-31 sits on the excluded upper bound of
          the 2026-08-24 week and on the included lower bound of the 2026-08-31 week, so the first run is
          refused with ERR_NO_ELIGIBLE_LOTS and the identical second run fills its week to 100.00 percent.
