            - { call: "GET /hotline/scripts/${s1}", as: Counselor, as_user_id: "${wk}", captures: { s1_status: $.data.status, s1_until: $.data.effective_until } }
            - { call: "GET /hotline/self-help-resources/${r1}", as: Counselor, as_user_id: "${wk}", captures: { r1_status: $.data.status } }
            - { call: "GET /hotline/referrals/${ref}", as: Counselor, as_user_id: "${wk}", captures: { ref_status: $.data.status, ref_reason: $.data.cancel_reason } }
          assert:
            - "Link 1: Script.${s1}.status == SUPERSEDED and effective_until == 2026-08-01T01:00:00Z == Script.${s2}.effective_from; Script.${s2}.status == PUBLISHED"
            - "Link 2: SelfHelpResource.${r1}.status == OUTDATED (caused by the supersession, not by any direct call on R1)"
            - "Link 3: Referral.${ref}.status == CANCELLED with cancel_reason == SCRIPT_OUTDATED (caused by the resource going OUTDATED)"
            - "Case.${case}.status remains IN_PROGRESS (already-counseling cases are grandfathered under the pinned/superseded information)"

      - name: consent_revoke_cascade
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.Referral.DISPATCHED_to_CANCELLED
          - calculations.org_weekly_capacity
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (consent revocation, not
          script publish): revoking LEGAL_AID_RELEASE cancels the DISPATCHED
          LEGAL_AID referral (link 1); that cancellation releases the org's
          weekly slot (link 2, caused by link 1): current_week_reserved drops
          1 -> 0 with no direct call on the org.
        test_recipe:
          setup:
            - "Clock default; CA; EVICTION script published; trained counselor; identified caller with version 1; org covering CA/EVICTION with weekly_capacity 3; case STANDARD (score 0) IN_PROGRESS"
            - "LEGAL_AID_RELEASE consent GRANTED; LEGAL_AID referral PROPOSED then DISPATCHED (org reserved 1)"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id, cal_v0: $.data.version } }
            - { call: "POST /hotline/legal-aid-orgs", payload: { name: "LegalAid X", covered_jurisdiction_codes: ["CA"], accepted_categories: ["EVICTION"], weekly_capacity: 3 }, as: AgencyAdmin, captures: { org: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
            - { call: "POST /hotline/cases/${case}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}", captures: { case_v: $.data.version } }
            - { call: "POST /hotline/callers/${cal}/consents", payload: { consent_type: "LEGAL_AID_RELEASE", expected_caller_version: "${cal_v0}" }, as: Caller, as_user_id: "${cal}", captures: { cons: $.data.id } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { ref: $.data.id } }
            - { call: "POST /hotline/referrals/${ref}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { reserved_before: $.data.current_week_reserved } }
          trigger:
            - { call: "POST /hotline/consents/${cons}/revoke", payload: {}, as: Caller, as_user_id: "${cal}" }
            - { call: "GET /hotline/referrals/${ref}", as: Counselor, as_user_id: "${wk}", captures: { ref_status: $.data.status, ref_reason: $.data.cancel_reason } }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { reserved_after: $.data.current_week_reserved } }
          assert:
            - "Before revoke: current_week_reserved == 1 (DISPATCHED holds the slot)"
            - "Link 1: Referral.${ref}.status == CANCELLED with cancel_reason == CONSENT_REVOKED (revocation also cancels DISPATCHED, unlike expiry)"
            - "Link 2: LegalAidOrg.${org}.current_week_reserved == 0 — released by the cancellation, with no direct call on the org"
            - "ConsentRecord.${cons}.status == REVOKED and revoked_at set; Caller.${cal}.version advanced by the revoke"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_cancelled_referral_after_sla
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - state_machines.Referral.PROPOSED_to_DISPATCHED
          - state_machines.Referral.PROPOSED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SLA_BREACHED]
        distinguishing_aspect: |
          Error-category pair (state vs business_temporal): one dispatch call
          violates both — the referral is already CANCELLED (state, priority 7)
          and the clock is past sla_dispatch_by (temporal, priority 10). State
          wins: the response must be ERR_INVALID_STATE, not ERR_SLA_BREACHED.
          Different category pair than the safety-vs-constraint instance.
        test_recipe:
          setup:
            - "CA; EVICTION script published; trained counselor; verified CRITICAL case IN_PROGRESS; org covering CA/EVICTION; LEGAL_AID_RELEASE consent granted; LEGAL_AID referral PROPOSED with sla_dispatch_by == 2026-08-02T00:00:00Z (CRITICAL 24h)"
            - "Clock advanced to 2026-08-02T01:00:00Z (past SLA); referral then CANCELLED by the counselor"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id, cal_v0: $.data.version } }
            - { call: "POST /hotline/legal-aid-orgs", payload: { name: "LegalAid X", covered_jurisdiction_codes: ["CA"], accepted_categories: ["EVICTION"], weekly_capacity: 3 }, as: AgencyAdmin, captures: { org: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION", eviction_notice_date: "2026-08-05", habitability_reported_at: "2026-07-15T00:00:00Z", deposit_amount_cents: 200000, monthly_rent_cents: 150000 }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
            - { call: "POST /hotline/cases/${case}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases/${case}/verify", payload: {}, as: Counselor, as_user_id: "${rev}", captures: { case_v: $.data.version } }
            - { call: "POST /hotline/callers/${cal}/consents", payload: { consent_type: "LEGAL_AID_RELEASE", expected_caller_version: "${cal_v0}" }, as: Caller, as_user_id: "${cal}", captures: { cons: $.data.id } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { ref: $.data.id, sla: $.data.sla_dispatch_by } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /hotline/referrals/${ref}/state", payload: { to_status: "CANCELLED" }, as: Counselor, as_user_id: "${wk}" }
          trigger:
            - { call: "POST /hotline/referrals/${ref}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 — the referral is CANCELLED (state violation, priority 7)"
            - "NOT ERR_SLA_BREACHED even though now (2026-08-02T01:00:00Z) > sla_dispatch_by (${sla} == 2026-08-02T00:00:00Z) — temporal violation at priority 10 loses to the state violation"

      - name: interpreter_language_mismatch_beats_overlap
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - calculations.interpreter_window_conflict
          - errors[ERR_INTERPRETER_LANGUAGE_MISMATCH]
          - errors[ERR_INTERPRETER_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_constraint): one
          interpretation REQUEST violates both — interpreter language (fr)
          mismatches the caller's preferred language (es) (safety, priority 9)
          AND the requested window overlaps the interpreter's existing buffered
          booking (constraint, priority 12). Safety wins: the response must be
          ERR_INTERPRETER_LANGUAGE_MISMATCH, not ERR_INTERPRETER_OVERLAP.
          Different category pair than state-vs-temporal.
        test_recipe:
          setup:
            - "CA; interpreter I language fr; callerA (fr) with session S1 QUEUED and interpretation REQUESTED for I on window 2026-08-02T10:00:00Z..11:00:00Z"
            - "callerB (es) with session S2 QUEUED"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
