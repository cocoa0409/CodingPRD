          Mode (b): nested rounding where order matters — the pinned order rounds each
          per-registration line first (round_half_up(1250 * 3333 / 10000) = 417 per line, two lines
          sum to 834); the alternative sum-then-round order would yield 833 (round_half_up(2500 *
          3333 / 10000)). Settlement MUST equal 834.
