              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches"
              payload: { batch_reference: "B1", received_at: "2026-08-01T10:00:00Z", declared_item_count: 1, declared_total_cents: 1000 }
              as: LockboxOperator
              captures: { ba_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/begin_capture"
