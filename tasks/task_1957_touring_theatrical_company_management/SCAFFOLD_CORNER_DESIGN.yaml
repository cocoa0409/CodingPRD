# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Task 1957 (§1.9 Coverage Index)
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: tour_create_defaults_and_roundtrip
        claim_type: creation
        grounds: [entities.Tour, "endpoints[POST /tours]", "endpoints[GET /tours/{tour_id}]"]
        distinguishing_aspect: "A new tour starts PLANNING with all computed counters 0, recouped false, version 1; GET returns the same document."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, status0: $.data.status, v0: $.data.version }
          trigger:
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { committed: $.data.budget_committed_cents, spent: $.data.budget_spent_cents, available: $.data.budget_available_cents, recouped: $.data.recouped }
          assert:
            - "Tour.status == PLANNING and version == 1 at creation"
            - "Tour.budget_committed_cents == 0, budget_spent_cents == 0, budget_available_cents == 50000000, recouped == false"
            - "GET round-trip returns identical field values"

      - name: tour_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Tour.fields.royalty_tier_threshold_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required royalty_tier_threshold_cents is rejected at priority 4 with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { name: "Tour X", budget_total_cents: 1000, capitalization_cents: 1000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000 }
              as: Producer
              captures: { err: $.data.error_id }
          assert:
            - "POST /tours without royalty_tier_threshold_cents -> 400 ERR_INVALID_REQUEST"

      - name: tour_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Tour.fields.per_diem_policy, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "per_diem_policy is a closed enum; 'WEEKLY' is not a member and is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { name: "Tour X", budget_total_cents: 1000, capitalization_cents: 1000, per_diem_policy: WEEKLY, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { err: $.data.error_id }
          assert:
            - "POST /tours with per_diem_policy=WEEKLY -> 400 ERR_INVALID_REQUEST"

      - name: tour_create_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Tour.fields.budget_committed_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Computed field budget_committed_cents is server-owned; sending it in the create body is an unknown-field rejection, never an override."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { name: "Tour X", budget_total_cents: 1000, capitalization_cents: 1000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000, budget_committed_cents: 999 }
              as: Producer
              captures: { err: $.data.error_id }
          assert:
            - "POST /tours carrying budget_committed_cents -> 400 ERR_INVALID_REQUEST (unknown field)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Unknown path ids resolve to ERR_NOT_FOUND on both read and write endpoints."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /stops/00000000-0000-0000-0000-000000000000"
              as: Producer
              captures: { err1: $.data.error_id }
            - call: "PUT /tech-checks/00000000-0000-0000-0000-000000000000"
              payload: { actual_value: 5 }
              as: TourManager
              captures: { err2: $.data.error_id }
          assert:
            - "GET unknown stop -> 404 ERR_NOT_FOUND"
            - "PUT unknown tech-check -> 404 ERR_NOT_FOUND"

      - name: stop_create_body_fk_not_found_returns_404
        claim_type: parent_relationships
        grounds: [entities.Stop.fields.venue_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body-referenced FK venue_id is validated at existence priority 3, before any routing-window business rule."
        test_recipe:
          setup: ["Tour exists"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "00000000-0000-0000-0000-000000000000", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "Stop create with unresolved venue_id -> 404 ERR_NOT_FOUND (existence before business rules)"

      - name: stop_create_initial_state
        claim_type: initial_state
        grounds: [state_machines.Stop.booking_status, state_machines.Stop.compliance_status, entities.Stop.fields.booking_status]
        distinguishing_aspect: "A new stop begins TENTATIVE with compliance PENDING and version 1."
        test_recipe:
          setup: ["Tour and venue exist"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { bk: $.data.booking_status, cp: $.data.compliance_status, v: $.data.version }
          assert:
            - "Stop.booking_status == TENTATIVE, compliance_status == PENDING, version == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: stop_wrapped_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Stop.booking_status, "errors[ERR_STOP_INVALID_STATE]"]
        distinguishing_aspect: "WRAPPED is terminal; a cancel attempt on a wrapped stop is rejected and no budget counters move."
        test_recipe:
          setup:
            - "Stop fully wrapped: closed after one PLAYED performance, settlement approved and paid, wrap executed (S1 figures: audited 6,000,000 / taxes 300,000 / levies 200,000; guarantee 4,000,000)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf: $.data.id }
            - call: "PUT /performances/${perf}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: PAID }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /stops/${stop_id}"
              payload: { status: WRAPPED }
              as: Producer
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { spent_pre: $.data.budget_spent_cents }
          trigger:
            - call: "PUT /stops/${stop_id}"
              payload: { status: CANCELLED }
              as: Producer
              captures: { err: $.data.error_id }
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { spent_post: $.data.budget_spent_cents }
          assert:
            - "Cancel on WRAPPED stop -> 409 ERR_STOP_INVALID_STATE (terminal lockdown)"
            - "Tour budget_spent_cents unchanged by the rejected call (no drift)"

      - name: stop_cancel_from_playing_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Stop.booking_status, "errors[ERR_STOP_INVALID_STATE]"]
        distinguishing_aspect: "Cancellation is only offered from TENTATIVE..READY; a PLAYING stop (one performance played, another still scheduled) rejects cancel."
        test_recipe:
          setup: ["READY stop with two SCHEDULED performances; first marked PLAYED so the stop is PLAYING"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf1: $.data.id }
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-09", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
            - call: "PUT /performances/${perf1}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
          trigger:
            - call: "PUT /stops/${stop_id}"
              payload: { status: CANCELLED }
              as: Producer
              captures: { err: $.data.error_id }
          assert:
            - "Cancel on PLAYING stop -> 409 ERR_STOP_INVALID_STATE"

      - name: performance_double_play_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Performance, "errors[ERR_PERFORMANCE_INVALID_STATE]"]
        distinguishing_aspect: "PLAYED is terminal; a second PLAYED call (idempotency probe) fails with ERR_PERFORMANCE_INVALID_STATE and does not double-count gross."
        test_recipe:
          setup: ["READY stop with one PLAYED performance (gross 750,000) and one still SCHEDULED so the stop stays PLAYING"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf1: $.data.id }
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-09", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
            - call: "PUT /performances/${perf1}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
          trigger:
            - call: "PUT /performances/${perf1}"
              payload: { status: PLAYED, gross_cents: 999999 }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "Second PLAYED on terminal performance -> 409 ERR_PERFORMANCE_INVALID_STATE; stored gross stays 750000"

      - name: settlement_void_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.Settlement, "errors[ERR_SETTLEMENT_INVALID_STATE]"]
        distinguishing_aspect: "VOID (reachable only from DISPUTED) is terminal; resubmission after void fails."
        test_recipe:
          setup: ["Closed stop; settlement submitted by trs-1, disputed by prod-1, then voided"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf: $.data.id }
            - call: "PUT /performances/${perf}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: DISPUTED, dispute_reason: "audit query" }
              as: Producer
              as_user_id: prod-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: VOID }
              as: Producer
              as_user_id: prod-1
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
              captures: { err: $.data.error_id }
          assert:
            - "Submit on VOID settlement -> 409 ERR_SETTLEMENT_INVALID_STATE (VOID is terminal)"

      - name: perdiem_double_pay_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PerDiemStatement, "errors[ERR_PER_DIEM_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal for a per-diem statement; a second pay is rejected."
        test_recipe:
          setup: ["READY stop; CONTRACTED cast member; one ISSUED per-diem statement, paid once"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "Pat P", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { cm: $.data.id }
            - call: "PUT /cast/${cm}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /stops/${stop_id}/per-diems"
              payload: { cast_member_id: "${cm}", days_present: 7, travel_days: 0 }
              as: CompanyManager
              captures: { pd: $.data.id }
            - call: "PUT /per-diems/${pd}"
              payload: { status: PAID }
              as: CompanyManager
          trigger:
            - call: "PUT /per-diems/${pd}"
              payload: { status: PAID }
              as: CompanyManager
              captures: { err: $.data.error_id }
          assert:
            - "Second pay -> 409 ERR_PER_DIEM_INVALID_STATE"

      - name: crew_settle_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CrewCall, "errors[ERR_CREW_INVALID_STATE]"]
        distinguishing_aspect: "SETTLED is terminal; re-settling is rejected and total_pay_cents does not change."
        test_recipe:
          setup: ["ADVANCED stop with one POSTED crew call, settled once (line carpenter 2000/h x 8h = 16,000)"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
