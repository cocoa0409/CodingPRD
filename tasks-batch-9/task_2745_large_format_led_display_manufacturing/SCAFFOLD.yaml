# =============================================================================
# PRD Benchmark Seed Tables — task_2745_large_format_led_display_manufacturing
# Difficulty band: EXPERT+ (deliberately above the §0.4 Expert band)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2745. Large-Format LED Display Manufacturing (electronic display manufacturer): display specification by pixel pitch, brightness, viewing distance and environmental rating, module and cabinet manufacturing with pixel testing and color calibration at the module level, custom sizing and structural design for stadium, roadside and retail installations with engineering drawings, control system, content player and network configuration with redundancy design, factory calibration and burn-in testing with defect pixel thresholds, installation support, commissioning and on-site calibration after structural mounting, service contracts with spare module inventory and response time commitments, brightness degradation warranty and module replacement color matching

domain_name: "led-display-manufacturing"
api_prefix: "/"   # flat topology: every entity is a top-level collection, no shared path prefix

complexity_profile:
  difficulty_level: expert_plus          # 11 entities / 51 endpoints / 54 errors / 15 calculations / 9 state machines / 54 ordered validations
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency             # OCC on Cabinet.version and ServiceContract.version (§1.2.1)
    - cascading_side_effects             # 4-hop chains from burn-in failure and from warranty fulfilment
    - dual_variant_calculation           # cabinet uniformity (AS_BUILT vs QA_BASELINE); warranty credit (PRO_RATA vs SHORTFALL)
    - rate_threshold_triggers            # dead-pixel ppm, rework-cycle scrap limit, SLA breach count, discount tiers

  entity_topology: flat
  # Every entity is its own top-level collection; children carry FK fields in the
  # request body (Cabinet.project_id, Module.cabinet_id, ...). No nested ownership
  # paths except action sub-resources (/cabinets/{id}/modules).

  state_machine_shape: cyclic
  # Module runs a bounded rework cycle (PIXEL_TESTED -> REWORK -> PIXEL_TESTED),
  # DisplayProject carries two INDEPENDENT state dimensions (engineering_state x
  # production_state) and engineering_state itself cycles
  # (UNDER_REVIEW -> REJECTED -> UNDER_REVIEW), Cabinet cycles through
  # QUARANTINED -> IN_ASSEMBLY, ServiceCase forks RESPONDED -> {APPROVED, DENIED}
  # with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # DisplayProject -> Cabinet -> Module
    - self_referential     # Module.replaces_module_id -> Module.id (replacement chain)
    - cross_aggregate      # ServiceCase mutates Cabinet + Module + ServiceContract + DisplayProject
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # A DrawingRevision may not be reviewed by the user who submitted it, and a
  # Cabinet may not be QA-approved by the user who calibrated any of its
  # installed modules.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: DisplayModel
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Catalogue name of the LED product family, e.g. 'FP25-OUT'."
        constraints: "1..80 chars"
      - name: pixel_pitch_mm
        type: number
        source: input
        description: "Centre-to-centre LED spacing in millimetres."
        constraints: "> 0, at most 2 decimal places"
      - name: rated_brightness_nits
        type: integer
        source: input
        description: "Nameplate peak brightness in cd/m2 used as the 100% warranty baseline."
        constraints: ">= 500"
      - name: environmental_rating
        type: enum
        source: input
        description: "Ingress protection class of the finished cabinet."
        constraints: "one of IP65_FRONT_IP54_REAR | IP65_FULL | IP43_INDOOR"
      - name: module_width_mm
        type: integer
        source: input
        description: "Physical width of one LED module."
        constraints: "> 0"
      - name: module_height_mm
        type: integer
        source: input
        description: "Physical height of one LED module."
        constraints: "> 0"
      - name: module_pixel_cols
        type: integer
        source: input
        description: "Pixel columns on one module."
        constraints: "> 0"
      - name: module_pixel_rows
        type: integer
        source: input
        description: "Pixel rows on one module."
        constraints: "> 0"
      - name: cabinet_width_mm
        type: integer
        source: input
        description: "Physical width of one cabinet."
        constraints: "> 0, must be an exact multiple of module_width_mm"
      - name: cabinet_height_mm
        type: integer
        source: input
        description: "Physical height of one cabinet."
        constraints: "> 0, must be an exact multiple of module_height_mm"
      - name: modules_per_cabinet
        type: integer
        source: input
        description: "Declared module slot count per cabinet; slot indexes run 1..modules_per_cabinet."
        constraints: "must equal (cabinet_width_mm / module_width_mm) * (cabinet_height_mm / module_height_mm)"
      - name: cabinet_weight_kg
        type: number
        source: input
        description: "Dry weight of one fully populated cabinet."
        constraints: "> 0"
      - name: price_per_sqm_cents
        type: integer
        source: input
        description: "List price per square metre of active display area, in cents."
        constraints: ">= 1"
      - name: dead_pixel_ppm_limit
        type: number
        source: input
        description: "Maximum cabinet-level dead-pixel density in parts per million accepted at burn-in; compared with <= after rounding to 2 decimals."
        constraints: ">= 0, at most 2 decimal places"
      - name: module_dead_pixel_max
        type: integer
        source: input
        description: "Maximum dead pixels tolerated on a single module at pixel test."
        default: 3
        constraints: ">= 0"
      - name: module_cluster_max
        type: integer
        source: input
        description: "Maximum adjacent-dead-pixel cluster size tolerated on a single module at pixel test."
        default: 1
        constraints: ">= 0"
      - name: reference_color_x
        type: number
        source: input
        description: "Target CIE 1931 x coordinate for factory colour calibration."
        constraints: "0 < value < 1, 4 decimal places"
      - name: reference_color_y
        type: number
        source: input
        description: "Target CIE 1931 y coordinate for factory colour calibration."
        constraints: "0 < value < 1, 4 decimal places"
      - name: burn_in_hours_required
        type: integer
        source: input
        description: "Minimum burn-in soak duration in whole hours for this model."
        constraints: ">= 1"
      - name: max_drive_pct
        type: integer
        source: input
        description: "Maximum safe drive level during burn-in, as a percentage of full drive."
        constraints: "1..100"
      - name: module_area_sqm
        type: number
        source: computed
        description: "Active area of one module: module_width_mm * module_height_mm / 1000000, rounded to 4 decimals."
      - name: cabinet_area_sqm
        type: number
        source: computed
        description: "Active area of one cabinet: cabinet_width_mm * cabinet_height_mm / 1000000, rounded to 4 decimals."
      - name: module_pixel_count
        type: integer
        source: computed
        description: "module_pixel_cols * module_pixel_rows."
      - name: cabinet_pixel_count
        type: integer
        source: computed
        description: "modules_per_cabinet * module_pixel_count."
      - name: recommended_min_viewing_distance_m
        type: number
        source: computed
        description: "pixel_pitch_mm * VIEWING_DISTANCE_FACTOR_M_PER_MM, rounded to 1 decimal."
      - name: required_load_kg_per_sqm
        type: number
        source: computed
        description: "cabinet_weight_kg / cabinet_area_sqm, rounded to 2 decimals; the structural floor every DrawingRevision must meet."

  - name: BurnInChamber
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Chamber identifier on the factory floor."
        constraints: "1..60 chars"
      - name: slot_capacity
        type: integer
        source: input
        description: "Number of cabinet slots the chamber can energise at one instant."
        constraints: ">= 1"
      - name: turnaround_minutes
        type: integer
        source: input
        description: "Mandatory cool-down/turnaround appended to every run's window before the slots free up."
        constraints: ">= 0"
      - name: certified_max_drive_pct
        type: integer
        source: input
        description: "Highest drive level this chamber is certified to sustain."
        constraints: "1..100"
      - name: reserved_slot_total
        type: integer
        source: computed
        description: "Sum of slots_required over BurnInRun rows for this chamber whose run_state == SCHEDULED."
      - name: scheduled_run_count
        type: integer
        source: computed
        description: "Count of BurnInRun rows for this chamber whose run_state == SCHEDULED."

  - name: CommissioningCrew
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Crew label; also the identity a FieldEngineer authenticates as."
        constraints: "1..60 chars"
      - name: region_code
        type: string
        source: input
        description: "Region the crew is licensed to work in; must equal DisplayProject.site_region_code to be bookable."
        constraints: "2..8 uppercase chars"
      - name: certification_level
        type: enum
        source: input
        description: "Crew certification level."
        constraints: "one of L1 | L2 | L3"
      - name: scheduled_visit_count
        type: integer
        source: computed
        description: "Count of CommissioningVisit rows for this crew whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED}."

  - name: DisplayProject
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: customer_name
        type: string
        source: input
        description: "End customer for the installation."
        constraints: "1..120 chars"
      - name: install_environment
        type: enum
        source: input
        description: "Installation class driving surcharge, wind-load floor, and viewing-distance factor."
        constraints: "one of STADIUM | ROADSIDE | RETAIL"
      - name: site_region_code
        type: string
        source: input
        description: "Region of the installation site; a CommissioningCrew is bookable only when its region_code equals this value."
        constraints: "2..8 uppercase chars"
      - name: display_model_id
        type: string
        source: input
        description: "FK -> DisplayModel.id; pins geometry, price, and every quality threshold for this project."
      - name: cabinet_grid_cols
        type: integer
        source: input
        description: "Cabinets across."
        constraints: "1..40"
      - name: cabinet_grid_rows
        type: integer
        source: input
        description: "Cabinets high."
        constraints: "1..40"
      - name: min_viewing_distance_m
        type: number
        source: input
        description: "Closest distance at which the audience will stand, as surveyed on site."
        constraints: "> 0, 1 decimal place"
      - name: target_brightness_nits
        type: integer
        source: input
        description: "Brightness the customer contracted for; on-site calibration is measured against it."
        constraints: ">= 100"
      - name: redundancy_mode
        type: enum
        source: input
        description: "Control-system redundancy design; sets the capacity derate factor and a price surcharge."
        constraints: "one of NONE | HOT_BACKUP | DUAL_LINK | RING"
      - name: output_port_count
        type: integer
        source: input
        description: "Video output ports on the processor feeding the wall."
        constraints: "1..64"
      - name: port_bandwidth_mbps
        type: integer
        source: input
        description: "Usable bandwidth of one output port in Mbps."
        constraints: ">= 1"
      - name: color_depth_bits
        type: integer
        source: input
        description: "Bits per colour channel driven by the processor."
        constraints: "one of 8 | 10 | 12"
      - name: refresh_rate_hz
        type: integer
        source: input
        description: "Content refresh rate in Hz."
        constraints: "24..240"
      - name: player_count
        type: integer
        source: input
        description: "Content players feeding the processor; each contributes PLAYER_THROUGHPUT_MBPS."
        constraints: "1..16"
      - name: cabinet_count
        type: integer
        source: computed
        description: "cabinet_grid_cols * cabinet_grid_rows."
      - name: module_count
        type: integer
        source: computed
        description: "cabinet_count * DisplayModel.modules_per_cabinet."
      - name: total_area_sqm
        type: number
        source: computed
        description: "cabinet_count * DisplayModel.cabinet_area_sqm, rounded to 4 decimals."
      - name: contract_amount_cents
        type: integer
        source: computed
        description: "Hardware contract value; see calculations.project_contract_amount_cents (round each cabinet line first, then sum)."
      - name: required_data_mbps
        type: integer
        source: computed
        description: "Bandwidth the wall demands; see calculations.project_data_load_pct."
      - name: effective_capacity_mbps
        type: integer
        source: computed
        description: "min(port capacity after redundancy derate, player capacity); see calculations.project_data_load_pct."
      - name: data_load_pct
        type: number
        source: computed
        description: "required_data_mbps / effective_capacity_mbps * 100, rounded to 2 decimals."
      - name: engineering_state
        type: enum
        source: computed
        description: "Engineering dimension of the project (independent of production_state)."
        default: DRAFT
        constraints: "one of DRAFT | UNDER_REVIEW | REJECTED | APPROVED"
      - name: production_state
        type: enum
        source: computed
        description: "Production dimension of the project (independent of engineering_state)."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED | IN_ASSEMBLY | QA_COMPLETE | INSTALLED | COMMISSIONED | BLOCKED"
      - name: approved_revision_number
        type: integer
        source: computed
        description: "revision_number of the DrawingRevision that reached APPROVED; null while engineering_state != APPROVED."
      - name: qa_passed_cabinet_count
        type: integer
        source: computed
        description: "Count of Cabinet rows of this project whose cabinet_state IN {QA_PASSED, MOUNTED}."
      - name: mounted_cabinet_count
        type: integer
        source: computed
        description: "Count of Cabinet rows of this project whose cabinet_state == MOUNTED."
      - name: quarantined_cabinet_count
        type: integer
        source: computed
        description: "Count of Cabinet rows of this project whose cabinet_state == QUARANTINED."
      - name: service_posture
        type: enum
        source: computed
        description: "NORMAL while no ServiceContract of this project is SUSPENDED; AT_RISK as soon as one is."
        default: NORMAL
        constraints: "one of NORMAL | AT_RISK"

  - name: DrawingRevision
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DisplayProject.id; the project this structural revision belongs to."
      - name: revision_number
        type: integer
        source: computed
        description: "count(DrawingRevision rows already existing for project_id) + 1 at submit time."
      - name: structural_load_kg_per_sqm
        type: number
        source: input
        description: "Load-bearing capacity the drawing certifies for the mounting structure."
        constraints: "> 0, 2 decimal places"
      - name: wind_load_kph
        type: integer
        source: input
        description: "Wind speed the structure is rated for."
        constraints: ">= 0"
      - name: mounting_type
        type: enum
        source: input
        description: "Structural mounting design."
        constraints: "one of WALL | FREESTANDING | ROOF | GANTRY"
      - name: service_access_side
        type: enum
        source: input
        description: "Side from which modules can be serviced after mounting."
        constraints: "one of FRONT | REAR"
      - name: required_load_kg_per_sqm
        type: number
        source: computed
        description: "Snapshot of DisplayModel.required_load_kg_per_sqm taken at submit time."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DesignEngineer who submitted the revision (opaque operator id)."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StructuralReviewer who decided the revision; null while SUBMITTED."
      - name: rejection_reason
        type: string
        source: computed
        description: "Reviewer note carried from the review request when the decision is REJECT; null otherwise."
      - name: revision_state
        type: enum
        source: computed
        description: "Lifecycle of this revision."
        default: SUBMITTED
        constraints: "one of SUBMITTED | APPROVED | REJECTED"

  - name: Cabinet
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DisplayProject.id; the wall this cabinet belongs to."
      - name: grid_row
        type: integer
        source: input
        description: "1-based row position in the wall grid."
        constraints: "1..DisplayProject.cabinet_grid_rows; (project_id, grid_row, grid_col) is unique"
      - name: grid_col
        type: integer
        source: input
        description: "1-based column position in the wall grid."
        constraints: "1..DisplayProject.cabinet_grid_cols; (project_id, grid_row, grid_col) is unique"
      - name: cabinet_state
        type: enum
        source: computed
        description: "Manufacturing/field lifecycle of this cabinet."
        default: PLANNED
        constraints: "one of PLANNED | IN_ASSEMBLY | POPULATED | BURN_IN | BURN_IN_PASSED | QA_PASSED | MOUNTED | QUARANTINED"
      - name: installed_module_count
        type: integer
        source: computed
        description: "Count of Module rows whose cabinet_id == this id AND module_state == INSTALLED."
      - name: occupied_slot_indexes
        type: array
        source: computed
        description: "Sorted ascending list of slot_index values held by modules whose module_state == INSTALLED in this cabinet."
      - name: total_dead_pixel_count
        type: integer
        source: computed
        description: "Sum of Module.dead_pixel_count over modules whose module_state == INSTALLED in this cabinet, plus the new_dead_pixel_count of the latest BurnInRun of this cabinet whose run_state IN {PASSED, FAILED}; 0 when no such run exists."
      - name: dead_pixel_ppm
        type: number
        source: computed
        description: "total_dead_pixel_count / DisplayModel.cabinet_pixel_count * 1000000, rounded to 2 decimals."
      - name: as_built_uniformity_score
        type: number
        source: computed
        description: "Colour/brightness uniformity of the modules currently INSTALLED; see calculations.cabinet_uniformity_score variant AS_BUILT. Null until installed_module_count >= 2."
      - name: baseline_uniformity_score
        type: number
        source: computed
        description: "Uniformity frozen at the instant the cabinet's BurnInRun reached PASSED; see calculations.cabinet_uniformity_score variant QA_BASELINE. Null before that."
      - name: baseline_module_ids
        type: array
        source: computed
        description: "Module ids (ascending by Module.created_at) that were INSTALLED when baseline_uniformity_score was frozen; empty list before burn-in pass."
      - name: qa_approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QAEngineer who QA-approved the cabinet; null before QA_PASSED."

  - name: Module
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: display_model_id
        type: string
        source: input
        description: "FK -> DisplayModel.id; the product family this module belongs to."
      - name: serial_no
        type: string
        source: input
        description: "Factory serial; unique across all Module rows."
        constraints: "1..40 chars, globally unique"
      - name: cabinet_id
        type: string
        source: computed
        description: "FK -> Cabinet.id; set on install, cleared on removal, retained on RETURNED modules for traceability."
      - name: slot_index
        type: integer
        source: computed
        description: "Cabinet slot this module occupies while INSTALLED; cleared on removal."
      - name: replaces_module_id
        type: string
        source: computed
        description: "FK -> Module.id; self-referential link written on the incoming module when it replaces an outgoing one during ServiceCase fulfilment."
      - name: reserved_service_contract_id
        type: string
        source: computed
        description: "FK -> ServiceContract.id; non-null while this CALIBRATED module is held as a contracted spare."
      - name: dead_pixel_count
        type: integer
        source: computed
        description: "Dead pixels recorded by the most recent pixel test; null before the first test."
      - name: max_cluster_size
        type: integer
        source: computed
        description: "Largest adjacent dead-pixel cluster recorded by the most recent pixel test; null before the first test."
      - name: measured_brightness_nits
        type: integer
        source: computed
        description: "Brightness recorded by the most recent calibration attempt."
      - name: measured_color_x
        type: number
        source: computed
        description: "CIE 1931 x recorded by the most recent calibration attempt."
      - name: measured_color_y
        type: number
        source: computed
        description: "CIE 1931 y recorded by the most recent calibration attempt."
      - name: color_bin
        type: enum
        source: computed
        description: "Colour/brightness bin assigned when the module reached CALIBRATED; see calculations.module_color_bin_assignment."
        constraints: "one of A1 | A2 | B1 | B2, or null before CALIBRATED"
      - name: color_bin_rank
        type: integer
        source: computed
        description: "Ordinal of color_bin used for replacement matching: A1=0, A2=1, B1=2, B2=3; null before CALIBRATED."
      - name: rework_cycles
        type: integer
        source: computed
        description: "Number of times this module has failed pixel test or calibration."
        default: 0
      - name: calibrated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProductionOperator whose calibration call moved the module to CALIBRATED; drives the QA segregation-of-duties check."
      - name: module_state
        type: enum
        source: computed
        description: "Module lifecycle."
        default: MANUFACTURED
        constraints: "one of MANUFACTURED | PIXEL_TESTED | CALIBRATED | REWORK | INSTALLED | RETURNED | SCRAPPED"

  - name: BurnInRun
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: cabinet_id
        type: string
        source: input
        description: "FK -> Cabinet.id; the cabinet being soaked."
      - name: burn_in_chamber_id
        type: string
        source: input
        description: "FK -> BurnInChamber.id; the chamber whose slots this run occupies."
      - name: window_start
        type: datetime
        source: input
        description: "Soak start, ISO 8601 UTC with three fractional digits."
      - name: window_end
        type: datetime
        source: input
        description: "Soak end, ISO 8601 UTC with three fractional digits; must be > window_start."
      - name: slots_required
        type: integer
        source: input
        description: "Chamber slots this run consumes for its whole occupied interval."
        constraints: ">= 1"
      - name: drive_pct
        type: integer
        source: input
        description: "Drive level used during the soak."
        constraints: "1..100"
      - name: ambient_c
        type: number
        source: input
        description: "Chamber ambient temperature in Celsius during the soak."
        constraints: "-20..70"
      - name: occupied_until
        type: datetime
        source: computed
        description: "window_end + BurnInChamber.turnaround_minutes; the closed end of this run's chamber occupancy."
      - name: new_dead_pixel_count
        type: integer
        source: computed
        description: "Additional dead pixels found at completion; null until completion."
      - name: measured_brightness_nits
        type: integer
        source: computed
        description: "Cabinet brightness measured at completion; null until completion."
      - name: measured_uniformity_pct
        type: number
        source: computed
        description: "Chamber-measured uniformity percentage at completion; null until completion."
      - name: cabinet_dead_pixel_ppm
        type: number
        source: computed
        description: "Cabinet.dead_pixel_ppm evaluated at completion, rounded to 2 decimals; the value compared with DisplayModel.dead_pixel_ppm_limit."
      - name: run_state
        type: enum
        source: computed
        description: "Run lifecycle."
        default: SCHEDULED
        constraints: "one of SCHEDULED | PASSED | FAILED | ABORTED"
      - name: abort_reason
        type: string
        source: computed
        description: "Reason carried from the abort request; null otherwise."
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QAEngineer who completed or aborted the run."

  - name: CommissioningVisit
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DisplayProject.id; the installation being commissioned."
      - name: commissioning_crew_id
        type: string
        source: input
        description: "FK -> CommissioningCrew.id; the crew booked for the window and the only identity allowed to act on the visit."
      - name: window_start
        type: datetime
        source: input
        description: "Half-open window start, ISO 8601 UTC with three fractional digits."
      - name: window_end
        type: datetime
        source: input
        description: "Half-open window end (exclusive), ISO 8601 UTC with three fractional digits; must be > window_start."
      - name: visit_state
        type: enum
        source: computed
        description: "Visit lifecycle."
        default: SCHEDULED
        constraints: "one of SCHEDULED | ON_SITE | CALIBRATED | SIGNED_OFF | ABORTED"
      - name: measured_uniformity_pct
        type: number
        source: computed
        description: "On-site uniformity measured during calibration; null before."
      - name: measured_brightness_nits
        type: integer
        source: computed
        description: "On-site brightness measured during calibration; null before."
      - name: arrived_at
        type: datetime
        source: computed
        description: "Logical clock reading when the crew went ON_SITE; null before."
      - name: signed_off_at
        type: datetime
        source: computed
        description: "Logical clock reading at sign-off; also becomes ServiceContract.warranty_start_at."
      - name: abort_reason
        type: string
        source: computed
        description: "Set to 'PROJECT_BLOCKED' when the visit is aborted by the cabinet-quarantine cascade; null otherwise."

  - name: ServiceContract
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DisplayProject.id; at most one ServiceContract per project."
      - name: tier
        type: enum
        source: input
        description: "Service tier fixing the per-sqm rate, the response-hours commitment, and the minimum spare percentage."
        constraints: "one of BRONZE | SILVER | GOLD"
      - name: spare_pct_bp
        type: integer
        source: input
        description: "Contracted spare-module holding, in basis points of DisplayProject.module_count."
        constraints: "0..5000"
      - name: term_months
        type: integer
        source: input
        description: "Contract term in whole months."
        constraints: "12..120"
      - name: response_hours
        type: integer
        source: computed
        description: "On-site response commitment implied by tier: BRONZE 48, SILVER 24, GOLD 8."
      - name: spare_required_count
        type: integer
        source: computed
        description: "ceil(DisplayProject.module_count * spare_pct_bp / 10000)."
      - name: spare_reserved_count
        type: integer
        source: computed
        description: "Count of Module rows whose reserved_service_contract_id == this id AND module_state == CALIBRATED."
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Area component of the annual fee before spares and discount; see calculations.service_contract_annual_fee_cents."
      - name: subtotal_fee_cents
        type: integer
        source: computed
        description: "gross_fee_cents + spare carrying fee; the ONLY value the volume-discount tier is selected from."
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Discount fraction chosen from subtotal_fee_cents, evaluated exactly once."
      - name: annual_fee_cents
        type: integer
        source: computed
        description: "subtotal_fee_cents minus the rounded discount; see calculations.service_contract_annual_fee_cents."
      - name: sla_breach_count
        type: integer
        source: computed
        description: "Number of ServiceCase rows of this contract whose response_breached == true."
        default: 0
      - name: warranty_start_at
        type: datetime
        source: computed
        description: "Logical clock reading at commissioning sign-off; the zero point of the brightness-degradation warranty. Null while PENDING."
      - name: contract_state
        type: enum
        source: computed
        description: "Contract lifecycle."
        default: PENDING
        constraints: "one of PENDING | ACTIVE | SUSPENDED"

  - name: ServiceCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: service_contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; the contract the case is raised under."
      - name: cabinet_id
        type: string
        source: input
        description: "FK -> Cabinet.id; the affected cabinet, which must belong to the contract's project."
      - name: faulty_module_id
        type: string
        source: input
        description: "FK -> Module.id; caller-nominated failed module. Required when case_type == MODULE_FAULT, must be omitted when case_type == BRIGHTNESS_DEGRADATION."
      - name: case_type
        type: enum
        source: input
        description: "Nature of the case; drives which measurements are required and which credit formula runs."
        constraints: "one of MODULE_FAULT | BRIGHTNESS_DEGRADATION"
      - name: severity
        type: enum
        source: input
        description: "Severity multiplier applied to the contracted response hours."
        constraints: "one of CRITICAL | MAJOR | MINOR"
      - name: symptom
        type: string
        source: input
        description: "Free-text field report."
        constraints: "0..240 chars"
      - name: measured_brightness_nits
        type: integer
        source: input
        description: "Field brightness measurement; required when case_type == BRIGHTNESS_DEGRADATION, must be omitted otherwise."
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical clock reading when the case was created."
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "reported_at + ServiceContract.response_hours * SEVERITY_RESPONSE_MULTIPLIER[severity] hours."
      - name: responded_at
        type: datetime
        source: computed
        description: "Logical clock reading when the case was responded to; null while OPEN."
      - name: response_breached
        type: boolean
        source: computed
        description: "True only when responded_at > response_deadline_at (strictly later); equality is on time."
        default: false
      - name: elapsed_warranty_months
        type: integer
        source: computed
        description: "floor(floor((reported_at - ServiceContract.warranty_start_at) in seconds / 86400) / 30); null for MODULE_FAULT cases."
      - name: allowed_degradation_pct
        type: number
        source: computed
        description: "GUARANTEED_DEGRADATION_PCT * elapsed_warranty_months / WARRANTY_TERM_MONTHS, rounded to 2 decimals; null for MODULE_FAULT cases."
      - name: degradation_pct
        type: number
        source: computed
        description: "(DisplayModel.rated_brightness_nits - measured_brightness_nits) / DisplayModel.rated_brightness_nits * 100, rounded to 2 decimals; null for MODULE_FAULT cases."
      - name: shortfall_pct
        type: number
        source: computed
        description: "max(0.00, degradation_pct - allowed_degradation_pct), rounded to 2 decimals; null for MODULE_FAULT cases."
      - name: assessment_basis
        type: enum
        source: computed
        description: "Credit algorithm the assessor selected; null until assessment."
        constraints: "one of PRO_RATA_REMAINING_TERM | SHORTFALL_SEVERITY, or null"
      - name: credit_cents
        type: integer
        source: computed
        description: "Warranty credit granted at assessment; 0 for DENIED cases and for MODULE_FAULT cases."
      - name: denial_reason
        type: string
        source: computed
        description: "Assessor note carried from a DENY decision; null otherwise."
      - name: resolved_faulty_module_id
        type: string
        source: computed
        description: "FK -> Module.id; the module the server locked in at assessment — faulty_module_id for MODULE_FAULT, else the selector's pick per calculations.faulty_module_selector."
      - name: replacement_module_id
        type: string
        source: computed
        description: "FK -> Module.id; the spare installed at fulfilment."
      - name: case_state
        type: enum
        source: computed
        description: "Case lifecycle."
        default: OPEN
        constraints: "one of OPEN | RESPONDED | APPROVED | DENIED | FULFILLED"

# =============================================================================
# §1.2 State Machine Table
#
# Nine machines. DisplayProject carries TWO independent dimensions
# (engineering_state x production_state) on the same row — the `state_field:`
# key names which column each machine drives.
# =============================================================================
state_machines:

  - entity: DisplayProject
    state_field: engineering_state
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /drawing-revisions"
        actor: DesignEngineer
        preconditions:
          - "project.engineering_state IN {DRAFT, REJECTED}"
          - "no DrawingRevision of this project has revision_state == SUBMITTED (else ERR_OPEN_REVISION_EXISTS)"
          - "revision.wind_load_kph >= MIN_WIND_LOAD_KPH[project.install_environment] (else ERR_WIND_LOAD_INSUFFICIENT)"
          - "revision.structural_load_kg_per_sqm >= DisplayModel.required_load_kg_per_sqm (else ERR_STRUCTURAL_CAPACITY_INSUFFICIENT)"
        side_effects:
          - "creates DrawingRevision with revision_state = SUBMITTED and revision_number = count(existing revisions of project) + 1"
          - "snapshots DrawingRevision.required_load_kg_per_sqm = DisplayModel.required_load_kg_per_sqm"
          - "sets DisplayProject.engineering_state = UNDER_REVIEW"
          - "increments DisplayProject.version by 1 and refreshes DisplayProject.updated_at"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /drawing-revisions/{drawing_revision_id}/review with decision = APPROVE"
        actor: StructuralReviewer
        preconditions:
          - "revision.revision_state == SUBMITTED (else ERR_INVALID_REVISION_STATE)"
          - "X-User-ID != revision.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "project.engineering_state == UNDER_REVIEW"
        side_effects:
          - "sets DrawingRevision.revision_state = APPROVED and DrawingRevision.reviewed_by_user_id = X-User-ID"
          - "sets DisplayProject.engineering_state = APPROVED"
          - "sets DisplayProject.approved_revision_number = DrawingRevision.revision_number"
          - "increments DisplayProject.version by 1"
        note: "APPROVED is terminal for the engineering dimension: later revision submissions are rejected with ERR_ENGINEERING_ALREADY_APPROVED."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /drawing-revisions/{drawing_revision_id}/review with decision = REJECT"
        actor: StructuralReviewer
        preconditions:
          - "revision.revision_state == SUBMITTED (else ERR_INVALID_REVISION_STATE)"
          - "X-User-ID != revision.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets DrawingRevision.revision_state = REJECTED, DrawingRevision.reviewed_by_user_id = X-User-ID, DrawingRevision.rejection_reason = request.reason"
          - "sets DisplayProject.engineering_state = REJECTED"
          - "leaves DisplayProject.approved_revision_number null"
          - "increments DisplayProject.version by 1"
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /drawing-revisions (a further revision on the same project)"
        actor: DesignEngineer
        preconditions:
          - "project.engineering_state == REJECTED"
          - "no DrawingRevision of this project has revision_state == SUBMITTED"
        side_effects:
          - "creates the next DrawingRevision with revision_number = previous max + 1"
          - "sets DisplayProject.engineering_state = UNDER_REVIEW"
        note: "This is the cycle: REJECTED -> UNDER_REVIEW -> REJECTED may repeat without bound; revision_number is the loop counter."

  - entity: DisplayProject
    state_field: production_state
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/modules (the first module installed on any cabinet of the project)"
        actor: ProductionOperator
        preconditions:
          - "project.engineering_state == APPROVED (else ERR_ENGINEERING_NOT_APPROVED)"
          - "project.production_state == NOT_STARTED"
        side_effects:
          - "sets DisplayProject.production_state = IN_ASSEMBLY"
          - "increments DisplayProject.version by 1"
      - from: IN_ASSEMBLY
        to: QA_COMPLETE
        trigger: "POST /cabinets/{cabinet_id}/qa-approve (the approval that makes qa_passed_cabinet_count == cabinet_count)"
        actor: system
        preconditions:
          - "after the cabinet transition, DisplayProject.qa_passed_cabinet_count == DisplayProject.cabinet_count"
          - "DisplayProject.quarantined_cabinet_count == 0"
        side_effects:
          - "recomputes DisplayProject.qa_passed_cabinet_count"
          - "sets DisplayProject.production_state = QA_COMPLETE"
          - "increments DisplayProject.version by 1"
        note: "Bubble-up: the parent dimension is derived from the aggregate cabinet states."
      - from: QA_COMPLETE
        to: INSTALLED
        trigger: "POST /cabinets/{cabinet_id}/mount (the mount that makes mounted_cabinet_count == cabinet_count)"
        actor: system
        preconditions:
          - "after the cabinet transition, DisplayProject.mounted_cabinet_count == DisplayProject.cabinet_count"
        side_effects:
          - "recomputes DisplayProject.mounted_cabinet_count"
          - "sets DisplayProject.production_state = INSTALLED"
          - "increments DisplayProject.version by 1"
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /commissioning-visits/{commissioning_visit_id}/sign-off"
        actor: system
        preconditions:
          - "visit.visit_state == CALIBRATED"
          - "project.production_state == INSTALLED"
        side_effects:
          - "sets DisplayProject.production_state = COMMISSIONED"
          - "cascade hop 2: every ServiceContract of this project whose contract_state == PENDING becomes ACTIVE with warranty_start_at = current logical clock"
          - "increments DisplayProject.version by 1"
      - from: IN_ASSEMBLY
        to: BLOCKED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete with a failing result (cascade via Cabinet -> QUARANTINED)"
        actor: system
        preconditions:
          - "DisplayProject.quarantined_cabinet_count >= 1 after the cabinet transition"
        side_effects:
          - "sets DisplayProject.production_state = BLOCKED"
          - "cascade hop 4: every CommissioningVisit of this project whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED} becomes ABORTED with abort_reason = 'PROJECT_BLOCKED', releasing the crew window"
          - "increments DisplayProject.version by 1"
      - from: QA_COMPLETE
        to: BLOCKED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete with a failing result (cascade via Cabinet -> QUARANTINED)"
        actor: system
        preconditions:
          - "DisplayProject.quarantined_cabinet_count >= 1 after the cabinet transition"
        side_effects:
          - "sets DisplayProject.production_state = BLOCKED"
          - "aborts every CommissioningVisit of this project whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED} with abort_reason = 'PROJECT_BLOCKED'"
          - "increments DisplayProject.version by 1"
      - from: INSTALLED
        to: BLOCKED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete with a failing result (cascade via Cabinet -> QUARANTINED)"
        actor: system
        preconditions:
          - "DisplayProject.quarantined_cabinet_count >= 1 after the cabinet transition"
        side_effects:
          - "sets DisplayProject.production_state = BLOCKED"
          - "aborts every CommissioningVisit of this project whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED} with abort_reason = 'PROJECT_BLOCKED'"
          - "increments DisplayProject.version by 1"
      - from: COMMISSIONED
        to: BLOCKED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete with a failing result (cascade via Cabinet -> QUARANTINED)"
        actor: system
        preconditions:
          - "DisplayProject.quarantined_cabinet_count >= 1 after the cabinet transition"
        side_effects:
          - "sets DisplayProject.production_state = BLOCKED"
          - "increments DisplayProject.version by 1"
      - from: BLOCKED
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/module-removals (the removal that returns quarantined_cabinet_count to 0)"
        actor: ProductionOperator
        preconditions:
          - "DisplayProject.quarantined_cabinet_count == 0 after the cabinet transition"
        side_effects:
          - "sets DisplayProject.production_state = IN_ASSEMBLY"
          - "increments DisplayProject.version by 1"
        note: "Recovery cycle: BLOCKED -> IN_ASSEMBLY re-walks the QA_COMPLETE / INSTALLED / COMMISSIONED ladder from scratch. Aborted CommissioningVisit rows are NOT resurrected — a new visit must be booked."

  - entity: DrawingRevision
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /drawing-revisions/{drawing_revision_id}/review with decision = APPROVE"
        actor: StructuralReviewer
        preconditions:
          - "revision.revision_state == SUBMITTED (else ERR_INVALID_REVISION_STATE)"
          - "X-User-ID != revision.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets reviewed_by_user_id = X-User-ID"
          - "sets DisplayProject.engineering_state = APPROVED and DisplayProject.approved_revision_number = this revision_number"
          - "increments DrawingRevision.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /drawing-revisions/{drawing_revision_id}/review with decision = REJECT"
        actor: StructuralReviewer
        preconditions:
          - "revision.revision_state == SUBMITTED (else ERR_INVALID_REVISION_STATE)"
          - "X-User-ID != revision.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "request.reason is present and 1..240 chars (else ERR_VALIDATION_FAILED)"
        side_effects:
          - "sets reviewed_by_user_id = X-User-ID and rejection_reason = request.reason"
          - "sets DisplayProject.engineering_state = REJECTED"
          - "leaves DisplayProject.approved_revision_number untouched (null)"
          - "increments DrawingRevision.version by 1"
        note: "Branching fork with divergent side-effect sets: the APPROVE branch writes approved_revision_number, the REJECT branch writes rejection_reason and re-opens the submission cycle."

  - entity: Module
    initial_state: MANUFACTURED
    terminal_states: [SCRAPPED, RETURNED]
    transitions:
      - from: MANUFACTURED
        to: PIXEL_TESTED
        trigger: "POST /modules/{module_id}/pixel-test"
        actor: ProductionOperator
        preconditions:
          - "module.module_state IN {MANUFACTURED, REWORK} (else ERR_INVALID_MODULE_STATE)"
          - "request.dead_pixel_count <= DisplayModel.module_dead_pixel_max"
          - "request.max_cluster_size <= DisplayModel.module_cluster_max"
        side_effects:
          - "stores dead_pixel_count and max_cluster_size"
          - "sets module_state = PIXEL_TESTED"
          - "increments Module.version by 1"
      - from: MANUFACTURED
        to: REWORK
        trigger: "POST /modules/{module_id}/pixel-test with a failing count"
        actor: ProductionOperator
        preconditions:
          - "request.dead_pixel_count > DisplayModel.module_dead_pixel_max OR request.max_cluster_size > DisplayModel.module_cluster_max"
          - "module.rework_cycles + 1 <= MAX_REWORK_CYCLES"
        side_effects:
          - "stores dead_pixel_count and max_cluster_size"
          - "increments Module.rework_cycles by 1"
          - "sets module_state = REWORK"
          - "increments Module.version by 1"
      - from: MANUFACTURED
        to: SCRAPPED
        trigger: "POST /modules/{module_id}/pixel-test with a failing count that exhausts the rework allowance"
        actor: ProductionOperator
        preconditions:
          - "request.dead_pixel_count > DisplayModel.module_dead_pixel_max OR request.max_cluster_size > DisplayModel.module_cluster_max"
          - "module.rework_cycles + 1 > MAX_REWORK_CYCLES"
        side_effects:
          - "increments Module.rework_cycles by 1"
          - "sets module_state = SCRAPPED"
          - "increments Module.version by 1"
      - from: REWORK
        to: PIXEL_TESTED
        trigger: "POST /modules/{module_id}/pixel-test (retest after rework)"
        actor: ProductionOperator
        preconditions:
          - "request.dead_pixel_count <= DisplayModel.module_dead_pixel_max AND request.max_cluster_size <= DisplayModel.module_cluster_max"
        side_effects:
          - "sets module_state = PIXEL_TESTED without touching rework_cycles"
          - "increments Module.version by 1"
      - from: REWORK
        to: REWORK
        trigger: "POST /modules/{module_id}/pixel-test (failing retest still inside the allowance)"
        actor: ProductionOperator
        preconditions:
          - "request.dead_pixel_count > DisplayModel.module_dead_pixel_max OR request.max_cluster_size > DisplayModel.module_cluster_max"
          - "module.rework_cycles + 1 <= MAX_REWORK_CYCLES"
        side_effects:
          - "increments Module.rework_cycles by 1"
          - "keeps module_state = REWORK"
          - "increments Module.version by 1"
        note: "Self-loop bounded by MAX_REWORK_CYCLES = 2; the third failure lands on SCRAPPED instead."
      - from: REWORK
        to: SCRAPPED
        trigger: "POST /modules/{module_id}/pixel-test or /calibrate (failure that exceeds the allowance)"
        actor: ProductionOperator
        preconditions:
          - "module.rework_cycles + 1 > MAX_REWORK_CYCLES"
        side_effects:
          - "increments Module.rework_cycles by 1"
          - "sets module_state = SCRAPPED"
          - "increments Module.version by 1"
      - from: PIXEL_TESTED
        to: CALIBRATED
        trigger: "POST /modules/{module_id}/calibrate"
        actor: ProductionOperator
        preconditions:
          - "module.module_state IN {PIXEL_TESTED, REWORK} (else ERR_INVALID_MODULE_STATE)"
          - "max(|measured_color_x - DisplayModel.reference_color_x|, |measured_color_y - DisplayModel.reference_color_y|) <= CHROMA_CALIBRATED_TOLERANCE"
        side_effects:
          - "stores measured_brightness_nits, measured_color_x, measured_color_y"
          - "computes color_bin and color_bin_rank per calculations.module_color_bin_assignment"
          - "sets calibrated_by_user_id = X-User-ID"
          - "sets module_state = CALIBRATED"
          - "increments Module.version by 1"
      - from: PIXEL_TESTED
        to: REWORK
        trigger: "POST /modules/{module_id}/calibrate with a chroma error in the rework band"
        actor: ProductionOperator
        preconditions:
          - "CHROMA_CALIBRATED_TOLERANCE < chroma_error <= CHROMA_REWORK_TOLERANCE"
          - "module.rework_cycles + 1 <= MAX_REWORK_CYCLES"
        side_effects:
          - "stores the measurements but leaves color_bin null"
          - "increments Module.rework_cycles by 1"
          - "sets module_state = REWORK"
          - "increments Module.version by 1"
        note: "chroma_error > CHROMA_REWORK_TOLERANCE is not a transition at all — the request is rejected with ERR_CHROMA_OUT_OF_TOLERANCE and no state changes."
      - from: PIXEL_TESTED
        to: SCRAPPED
        trigger: "POST /modules/{module_id}/calibrate with a chroma error in the rework band that exhausts the allowance"
        actor: ProductionOperator
        preconditions:
          - "CHROMA_CALIBRATED_TOLERANCE < chroma_error <= CHROMA_REWORK_TOLERANCE"
          - "module.rework_cycles + 1 > MAX_REWORK_CYCLES"
        side_effects:
          - "increments Module.rework_cycles by 1"
          - "sets module_state = SCRAPPED"
          - "increments Module.version by 1"
      - from: CALIBRATED
        to: INSTALLED
        trigger: "POST /cabinets/{cabinet_id}/modules"
        actor: ProductionOperator
        preconditions:
          - "module.module_state == CALIBRATED (else ERR_INVALID_MODULE_STATE)"
          - "module.display_model_id == Cabinet's DisplayProject.display_model_id (else ERR_MODULE_MODEL_MISMATCH)"
          - "module.reserved_service_contract_id is null (else ERR_MODULE_RESERVED_AS_SPARE)"
          - "request.slot_index NOT IN cabinet.occupied_slot_indexes (else ERR_CABINET_SLOT_OCCUPIED)"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "sets cabinet_id, slot_index, module_state = INSTALLED"
          - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
          - "increments Cabinet.version by 1 and Module.version by 1"
      - from: INSTALLED
        to: CALIBRATED
        trigger: "POST /cabinets/{cabinet_id}/module-removals"
        actor: ProductionOperator
        preconditions:
          - "module.module_state == INSTALLED and module.cabinet_id == path cabinet_id (else ERR_INVALID_MODULE_STATE)"
          - "cabinet.cabinet_state IN {IN_ASSEMBLY, POPULATED, QUARANTINED} (else ERR_INVALID_CABINET_STATE)"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "clears cabinet_id and slot_index, sets module_state = CALIBRATED"
          - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
          - "increments Cabinet.version by 1 and Module.version by 1"
        note: "Compensating action for the install transition: the pair (install, remove) must leave Cabinet.installed_module_count and Cabinet.occupied_slot_indexes exactly as they were."
      - from: INSTALLED
        to: RETURNED
        trigger: "POST /service-cases/{service_case_id}/fulfil"
        actor: ServiceManager
        preconditions:
          - "case.case_state == APPROVED (else ERR_INVALID_CASE_STATE)"
          - "module.id == case.resolved_faulty_module_id"
        side_effects:
          - "sets module_state = RETURNED, clears slot_index, retains cabinet_id for traceability"
          - "the replacement module moves CALIBRATED -> INSTALLED into the vacated slot_index with replaces_module_id = this module id"
          - "increments Module.version by 1"

  - entity: Cabinet
    initial_state: PLANNED
    terminal_states: [MOUNTED]
    transitions:
      - from: PLANNED
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/modules (first module)"
        actor: ProductionOperator
        preconditions:
          - "DisplayProject.engineering_state == APPROVED (else ERR_ENGINEERING_NOT_APPROVED)"
          - "cabinet.cabinet_state == PLANNED"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "sets cabinet_state = IN_ASSEMBLY"
          - "cascade: DisplayProject.production_state NOT_STARTED -> IN_ASSEMBLY"
          - "increments Cabinet.version by 1"
      - from: IN_ASSEMBLY
        to: POPULATED
        trigger: "POST /cabinets/{cabinet_id}/modules (the install that fills the last slot)"
        actor: ProductionOperator
        preconditions:
          - "installed_module_count after the install == DisplayModel.modules_per_cabinet"
        side_effects:
          - "sets cabinet_state = POPULATED"
          - "recomputes as_built_uniformity_score over all installed modules"
          - "increments Cabinet.version by 1"
      - from: POPULATED
        to: BURN_IN
        trigger: "POST /burn-in-runs"
        actor: QAEngineer
        preconditions:
          - "cabinet.cabinet_state == POPULATED (else ERR_INVALID_CABINET_STATE)"
          - "window_end - window_start >= DisplayModel.burn_in_hours_required hours (else ERR_BURN_IN_DURATION_TOO_SHORT)"
          - "drive_pct <= min(DisplayModel.max_drive_pct, BurnInChamber.certified_max_drive_pct) (else ERR_DRIVE_LEVEL_UNSAFE)"
          - "chamber has slots free over [window_start, window_end + turnaround_minutes] (else ERR_CHAMBER_CAPACITY_EXCEEDED)"
        side_effects:
          - "creates BurnInRun with run_state = SCHEDULED and occupied_until = window_end + turnaround_minutes"
          - "sets cabinet_state = BURN_IN"
          - "increments BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
          - "increments Cabinet.version by 1"
      - from: BURN_IN
        to: BURN_IN_PASSED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete (passing result)"
        actor: QAEngineer
        preconditions:
          - "logical clock >= run.window_end (else ERR_BURN_IN_WINDOW_NOT_ELAPSED)"
          - "cabinet.dead_pixel_ppm after adding new_dead_pixel_count <= DisplayModel.dead_pixel_ppm_limit"
          - "measured_brightness_nits >= BURN_IN_MIN_BRIGHTNESS_NITS"
          - "measured_uniformity_pct >= BURN_IN_MIN_UNIFORMITY_PCT"
        side_effects:
          - "sets run_state = PASSED and stores the measurements"
          - "freezes Cabinet.baseline_uniformity_score (variant QA_BASELINE) and Cabinet.baseline_module_ids"
          - "sets cabinet_state = BURN_IN_PASSED"
          - "decrements BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
          - "increments Cabinet.version by 1"
      - from: BURN_IN
        to: QUARANTINED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete (failing result)"
        actor: QAEngineer
        preconditions:
          - "logical clock >= run.window_end"
          - "cabinet.dead_pixel_ppm > DisplayModel.dead_pixel_ppm_limit OR measured_brightness_nits < BURN_IN_MIN_BRIGHTNESS_NITS OR measured_uniformity_pct < BURN_IN_MIN_UNIFORMITY_PCT"
        side_effects:
          - "cascade hop 1: sets run_state = FAILED and stores the measurements"
          - "cascade hop 2: sets cabinet_state = QUARANTINED and leaves baseline_uniformity_score null"
          - "cascade hop 3: increments DisplayProject.quarantined_cabinet_count, which sets DisplayProject.production_state = BLOCKED"
          - "cascade hop 4: BLOCKED aborts every CommissioningVisit of the project whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED} with abort_reason = 'PROJECT_BLOCKED', releasing the crew window"
          - "decrements BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
          - "increments Cabinet.version by 1"
      - from: BURN_IN
        to: POPULATED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/abort"
        actor: QAEngineer
        preconditions:
          - "run.run_state == SCHEDULED (else ERR_INVALID_RUN_STATE)"
        side_effects:
          - "sets run_state = ABORTED and abort_reason = request.reason"
          - "sets cabinet_state back to POPULATED"
          - "decrements BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
          - "increments Cabinet.version by 1"
        note: "Compensating action for the POPULATED -> BURN_IN transition: BurnInChamber.reserved_slot_total must return to its pre-schedule value."
      - from: BURN_IN_PASSED
        to: QA_PASSED
        trigger: "POST /cabinets/{cabinet_id}/qa-approve"
        actor: QAEngineer
        preconditions:
          - "cabinet.cabinet_state == BURN_IN_PASSED (else ERR_INVALID_CABINET_STATE)"
          - "X-User-ID is not the calibrated_by_user_id of ANY module whose module_state == INSTALLED in this cabinet (else ERR_SEGREGATION_OF_DUTIES)"
          - "cabinet.as_built_uniformity_score == cabinet.baseline_uniformity_score is NOT required; both are reported"
        side_effects:
          - "sets qa_approved_by_user_id = X-User-ID and cabinet_state = QA_PASSED"
          - "recomputes DisplayProject.qa_passed_cabinet_count; when it equals cabinet_count the project's production_state becomes QA_COMPLETE"
          - "increments Cabinet.version by 1"
      - from: QA_PASSED
        to: MOUNTED
        trigger: "POST /cabinets/{cabinet_id}/mount"
        actor: FieldEngineer
        preconditions:
          - "cabinet.cabinet_state == QA_PASSED (else ERR_INVALID_CABINET_STATE)"
          - "DisplayProject.engineering_state == APPROVED"
        side_effects:
          - "sets cabinet_state = MOUNTED"
          - "recomputes DisplayProject.mounted_cabinet_count; when it equals cabinet_count the project's production_state becomes INSTALLED"
          - "increments Cabinet.version by 1"
      - from: QUARANTINED
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/module-removals"
        actor: ProductionOperator
        preconditions:
          - "cabinet.cabinet_state == QUARANTINED"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "the removed module returns to CALIBRATED and the slot frees"
          - "sets cabinet_state = IN_ASSEMBLY"
          - "recomputes DisplayProject.quarantined_cabinet_count; when it reaches 0 the project's production_state returns to IN_ASSEMBLY"
          - "increments Cabinet.version by 1"
        note: "Cycle: PLANNED -> IN_ASSEMBLY -> POPULATED -> BURN_IN -> QUARANTINED -> IN_ASSEMBLY may repeat."
      - from: POPULATED
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/module-removals"
        actor: ProductionOperator
        preconditions:
          - "cabinet.cabinet_state == POPULATED (else ERR_INVALID_CABINET_STATE)"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "the removed module returns to CALIBRATED and its slot frees"
          - "sets cabinet_state = IN_ASSEMBLY because installed_module_count is now < DisplayModel.modules_per_cabinet"
          - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
          - "increments Cabinet.version by 1"
        note: "POPULATED means every slot is filled, so a removal MUST walk the cabinet back to IN_ASSEMBLY; it is the compensating edge for IN_ASSEMBLY -> POPULATED."
      - from: IN_ASSEMBLY
        to: IN_ASSEMBLY
        trigger: "POST /cabinets/{cabinet_id}/module-removals (a partly built cabinet gives a module back)"
        actor: ProductionOperator
        preconditions:
          - "cabinet.cabinet_state == IN_ASSEMBLY"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
        side_effects:
          - "the removed module returns to CALIBRATED and its slot frees"
          - "keeps cabinet_state = IN_ASSEMBLY even when installed_module_count reaches 0; the cabinet never returns to PLANNED"
          - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
          - "increments Cabinet.version by 1"

  - entity: BurnInRun
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete"
        actor: QAEngineer
        preconditions:
          - "run.run_state == SCHEDULED (else ERR_INVALID_RUN_STATE)"
          - "logical clock >= run.window_end (else ERR_BURN_IN_WINDOW_NOT_ELAPSED)"
          - "cabinet_dead_pixel_ppm <= DisplayModel.dead_pixel_ppm_limit"
          - "request.measured_brightness_nits >= BURN_IN_MIN_BRIGHTNESS_NITS"
          - "request.measured_uniformity_pct >= BURN_IN_MIN_UNIFORMITY_PCT"
        side_effects:
          - "stores new_dead_pixel_count, measured_brightness_nits, measured_uniformity_pct, cabinet_dead_pixel_ppm"
          - "sets completed_by_user_id = X-User-ID"
          - "cascade: Cabinet BURN_IN -> BURN_IN_PASSED with a frozen QA_BASELINE uniformity score"
          - "releases the chamber slots"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/complete"
        actor: QAEngineer
        preconditions:
          - "run.run_state == SCHEDULED"
          - "logical clock >= run.window_end"
          - "cabinet_dead_pixel_ppm > DisplayModel.dead_pixel_ppm_limit OR measured_brightness_nits < BURN_IN_MIN_BRIGHTNESS_NITS OR measured_uniformity_pct < BURN_IN_MIN_UNIFORMITY_PCT"
        side_effects:
          - "stores the measurements and cabinet_dead_pixel_ppm"
          - "cascade: Cabinet BURN_IN -> QUARANTINED -> DisplayProject BLOCKED -> CommissioningVisit ABORTED"
          - "releases the chamber slots"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /burn-in-runs/{burn_in_run_id}/abort"
        actor: QAEngineer
        preconditions:
          - "run.run_state == SCHEDULED (else ERR_INVALID_RUN_STATE)"
        side_effects:
          - "sets abort_reason = request.reason and completed_by_user_id = X-User-ID"
          - "cascade: Cabinet BURN_IN -> POPULATED"
          - "releases the chamber slots, restoring BurnInChamber.reserved_slot_total to its pre-schedule value"

  - entity: CommissioningVisit
    initial_state: SCHEDULED
    terminal_states: [SIGNED_OFF, ABORTED]
    transitions:
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /commissioning-visits/{commissioning_visit_id}/arrive"
        actor: FieldEngineer
        preconditions:
          - "visit.visit_state == SCHEDULED (else ERR_INVALID_VISIT_STATE)"
          - "X-User-ID == visit.commissioning_crew_id (else ERR_CREW_NOT_ASSIGNED)"
          - "window_start <= logical clock < window_end (else ERR_VISIT_WINDOW_NOT_CURRENT)"
          - "DisplayProject.production_state == INSTALLED (else ERR_CABINETS_NOT_MOUNTED)"
        side_effects:
          - "sets arrived_at = logical clock and visit_state = ON_SITE"
          - "increments CommissioningVisit.version by 1"
      - from: ON_SITE
        to: CALIBRATED
        trigger: "POST /commissioning-visits/{commissioning_visit_id}/calibrate"
        actor: FieldEngineer
        preconditions:
          - "visit.visit_state == ON_SITE (else ERR_INVALID_VISIT_STATE)"
          - "X-User-ID == visit.commissioning_crew_id (else ERR_CREW_NOT_ASSIGNED)"
          - "request.measured_brightness_nits >= ceil(DisplayProject.target_brightness_nits * ON_SITE_BRIGHTNESS_FLOOR_FRACTION)"
          - "request.measured_uniformity_pct >= ON_SITE_MIN_UNIFORMITY_PCT"
        side_effects:
          - "stores measured_brightness_nits and measured_uniformity_pct"
          - "sets visit_state = CALIBRATED"
          - "increments CommissioningVisit.version by 1"
      - from: CALIBRATED
        to: SIGNED_OFF
        trigger: "POST /commissioning-visits/{commissioning_visit_id}/sign-off"
        actor: FieldEngineer
        preconditions:
          - "visit.visit_state == CALIBRATED (else ERR_INVALID_VISIT_STATE)"
          - "X-User-ID == visit.commissioning_crew_id (else ERR_CREW_NOT_ASSIGNED)"
          - "DisplayProject.production_state == INSTALLED"
        side_effects:
          - "cascade hop 1: sets signed_off_at = logical clock and visit_state = SIGNED_OFF"
          - "cascade hop 2: sets DisplayProject.production_state = COMMISSIONED"
          - "cascade hop 3: every ServiceContract of the project whose contract_state == PENDING becomes ACTIVE with warranty_start_at = signed_off_at"
          - "decrements CommissioningCrew.scheduled_visit_count by 1"
          - "increments CommissioningVisit.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system cascade from DisplayProject.production_state -> BLOCKED"
        actor: system
        preconditions:
          - "DisplayProject.production_state becomes BLOCKED"
        side_effects:
          - "sets visit_state = ABORTED and abort_reason = 'PROJECT_BLOCKED'"
          - "decrements CommissioningCrew.scheduled_visit_count by 1, freeing the crew's window for a new booking"
      - from: ON_SITE
        to: ABORTED
        trigger: "system cascade from DisplayProject.production_state -> BLOCKED"
        actor: system
        preconditions:
          - "DisplayProject.production_state becomes BLOCKED"
        side_effects:
          - "sets visit_state = ABORTED and abort_reason = 'PROJECT_BLOCKED'"
          - "decrements CommissioningCrew.scheduled_visit_count by 1"
      - from: CALIBRATED
        to: ABORTED
        trigger: "system cascade from DisplayProject.production_state -> BLOCKED"
        actor: system
        preconditions:
          - "DisplayProject.production_state becomes BLOCKED"
        side_effects:
          - "sets visit_state = ABORTED and abort_reason = 'PROJECT_BLOCKED'"
          - "decrements CommissioningCrew.scheduled_visit_count by 1"

  - entity: ServiceContract
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /commissioning-visits/{commissioning_visit_id}/sign-off (system cascade)"
        actor: system
        preconditions:
          - "contract.contract_state == PENDING"
          - "contract.project_id == the signed-off visit's project_id"
        side_effects:
          - "sets warranty_start_at = visit.signed_off_at and contract_state = ACTIVE"
          - "increments ServiceContract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-cases/{service_case_id}/fulfil or POST /service-contracts/{service_contract_id}/spare-releases (system cascade) or POST /service-cases/{service_case_id}/respond after the deadline"
        actor: system
        preconditions:
          - "after the write, contract.spare_reserved_count < contract.spare_required_count OR contract.sla_breach_count >= MAX_SLA_BREACHES"
        side_effects:
          - "sets contract_state = SUSPENDED"
          - "sets DisplayProject.service_posture = AT_RISK"
          - "increments ServiceContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-contracts/{service_contract_id}/spare-reservations (system cascade)"
        actor: system
        preconditions:
          - "after the reservation, contract.spare_reserved_count >= contract.spare_required_count"
          - "contract.sla_breach_count < MAX_SLA_BREACHES"
        side_effects:
          - "sets contract_state = ACTIVE"
          - "sets DisplayProject.service_posture = NORMAL when no other ServiceContract of the project is SUSPENDED"
          - "increments ServiceContract.version by 1"
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE: the spare pool can be depleted and refilled without bound, but sla_breach_count only grows, so two breaches pin the contract in SUSPENDED permanently."

  - entity: ServiceCase
    initial_state: OPEN
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /service-cases/{service_case_id}/respond"
        actor: ServiceManager
        preconditions:
          - "case.case_state == OPEN (else ERR_INVALID_CASE_STATE)"
          - "contract.contract_state == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "sets responded_at = logical clock and case_state = RESPONDED"
          - "sets response_breached = (responded_at > response_deadline_at)"
          - "when response_breached: increments ServiceContract.sla_breach_count by 1, and if it reaches MAX_SLA_BREACHES the contract moves ACTIVE -> SUSPENDED and DisplayProject.service_posture becomes AT_RISK"
          - "increments ServiceCase.version by 1"
      - from: RESPONDED
        to: APPROVED
        trigger: "POST /service-cases/{service_case_id}/assess with decision = APPROVE"
        actor: ServiceManager
        preconditions:
          - "case.case_state == RESPONDED (else ERR_INVALID_CASE_STATE)"
          - "for case_type == BRIGHTNESS_DEGRADATION: shortfall_pct > 0.00 (else ERR_DEGRADATION_WITHIN_ALLOWANCE)"
          - "a replaceable module exists in the cabinet (else ERR_NO_REPLACEABLE_MODULE)"
        side_effects:
          - "computes elapsed_warranty_months, allowed_degradation_pct, degradation_pct, shortfall_pct for BRIGHTNESS_DEGRADATION cases"
          - "sets assessment_basis = request.assessment_basis and credit_cents per calculations.case_warranty_credit_cents"
          - "pins resolved_faulty_module_id: case.faulty_module_id for MODULE_FAULT, else the pick from calculations.faulty_module_selector"
          - "sets case_state = APPROVED"
          - "increments ServiceCase.version by 1"
      - from: RESPONDED
        to: DENIED
        trigger: "POST /service-cases/{service_case_id}/assess with decision = DENY"
        actor: ServiceManager
        preconditions:
          - "case.case_state == RESPONDED (else ERR_INVALID_CASE_STATE)"
          - "request.denial_reason is present and 1..240 chars"
        side_effects:
          - "sets denial_reason = request.denial_reason, credit_cents = 0, assessment_basis = null"
          - "leaves resolved_faulty_module_id and replacement_module_id null"
          - "sets case_state = DENIED"
          - "increments ServiceCase.version by 1"
        note: "Branching fork with divergent side-effect sets: APPROVE computes a credit and pins a module, DENY writes a reason and pins nothing."
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /service-cases/{service_case_id}/fulfil"
        actor: ServiceManager
        preconditions:
          - "case.case_state == APPROVED (else ERR_INVALID_CASE_STATE)"
          - "request.expected_cabinet_version == cabinet.version (else ERR_STALE_CABINET_VERSION)"
          - "the nominated replacement module has reserved_service_contract_id == case.service_contract_id (else ERR_SPARE_NOT_RESERVED)"
          - "the replacement module's |color_bin_rank - outgoing module's color_bin_rank| <= COLOR_BIN_RANK_TOLERANCE (else ERR_COLOR_BIN_MISMATCH)"
        side_effects:
          - "cascade hop 1: sets replacement_module_id and case_state = FULFILLED"
          - "cascade hop 2: the resolved faulty Module moves INSTALLED -> RETURNED and the replacement Module moves CALIBRATED -> INSTALLED into the freed slot_index with replaces_module_id set, and its reserved_service_contract_id is cleared"
          - "cascade hop 3: ServiceContract.spare_reserved_count drops by 1; when it falls below spare_required_count the contract moves ACTIVE -> SUSPENDED"
          - "cascade hop 4: DisplayProject.service_posture becomes AT_RISK"
          - "recomputes Cabinet.total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
          - "increments Cabinet.version by 1 and ServiceCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: cabinet-module-install-stale
    parent_entity: Cabinet
    write_endpoint: "POST /cabinets/{cabinet_id}/modules"
    occ_field: "expected_cabinet_version"
    description: |
      Installing a module into a cabinet whose version has advanced since the
      client last read it is rejected. Slot assignment legitimately supersedes:
      a writer holding a stale view of occupied_slot_indexes would otherwise
      hand out a slot another writer already filled, so the stale-version check
      is what keeps slot allocation well-defined.
    error_id: ERR_STALE_CABINET_VERSION
    http_status: 412

  - rule_id: spare-reservation-stale
    parent_entity: ServiceContract
    write_endpoint: "POST /service-contracts/{service_contract_id}/spare-reservations"
    occ_field: "expected_service_contract_version"
    description: |
      Reserving a spare module against a contract whose version has advanced
      since the client last read it is rejected. A reservation legitimately
      supersedes the prior spare pool composition, so a writer acting on a
      stale spare_reserved_count would over- or under-reserve against the
      contracted spare_required_count.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: case-fulfil-stale-cabinet
    parent_entity: Cabinet
    write_endpoint: "POST /service-cases/{service_case_id}/fulfil"
    occ_field: "expected_cabinet_version"
    description: |
      Fulfilling a warranty case against a cabinet whose version has advanced
      since the client last read it is rejected. The swap writes a module into
      the slot vacated by the outgoing module; a stale view of the cabinet's
      occupied_slot_indexes or dead-pixel totals would place the replacement
      against superseded geometry.
    error_id: ERR_STALE_CABINET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global precision convention: every rounding in this scaffold is
# round_half_up. Where a formula rounds more than once, the ORDER is pinned
# explicitly in the formula text — it is never left to the implementer.
# =============================================================================
calculations:

  - name: model_geometry_derivation
    trigger: "POST /display-models"
    algorithm: aggregation
    formula: |
      module_area_sqm    = round_half_up(module_width_mm * module_height_mm / 1000000, 4)
      cabinet_area_sqm   = round_half_up(cabinet_width_mm * cabinet_height_mm / 1000000, 4)
      module_pixel_count = module_pixel_cols * module_pixel_rows
      cabinet_pixel_count = modules_per_cabinet * module_pixel_count
      recommended_min_viewing_distance_m =
          round_half_up(pixel_pitch_mm * VIEWING_DISTANCE_FACTOR_M_PER_MM, 1)
      required_load_kg_per_sqm =
          round_half_up(cabinet_weight_kg / cabinet_area_sqm, 2)
      # geometry consistency is validated, not repaired:
      #   modules_per_cabinet MUST equal
      #     (cabinet_width_mm / module_width_mm) * (cabinet_height_mm / module_height_mm)
      #   and both divisions MUST be exact, else ERR_VALIDATION_FAILED
    input_set: "The single DisplayModel row being created; no other entity participates."
    constants:
      VIEWING_DISTANCE_FACTOR_M_PER_MM: 1.0
      # Structural wind rating floor by install environment, consumed by
      # validations priority 27 (ERR_WIND_LOAD_INSUFFICIENT) on POST /drawing-revisions.
      MIN_WIND_LOAD_KPH:
        STADIUM: 160
        ROADSIDE: 200
        RETAIL: 100
    precision: "areas 4 decimals, viewing distance 1 decimal, load 2 decimals, all round_half_up"

  - name: project_contract_amount_cents
    trigger: "POST /projects"
    algorithm: tiered_pricing
    formula: |
      cabinet_list_cents_exact = DisplayModel.cabinet_area_sqm * DisplayModel.price_per_sqm_cents
      surcharge_multiplier     = 1
                               + ENV_SURCHARGE_PCT[install_environment]
                               + REDUNDANCY_SURCHARGE_PCT[redundancy_mode]
      # ROUNDING ORDER IS PINNED: round the PER-CABINET line to whole cents FIRST,
      # then multiply by cabinet_count. Summing the exact per-cabinet amounts and
      # rounding once at the end is a DIFFERENT (and wrong) number.
      cabinet_line_cents  = round_half_up(cabinet_list_cents_exact * surcharge_multiplier, 0)
      contract_amount_cents = cabinet_line_cents * cabinet_count
    input_set: "The DisplayProject being created and its pinned DisplayModel row."
    constants:
      ENV_SURCHARGE_PCT: { STADIUM: 0.12, ROADSIDE: 0.18, RETAIL: 0.05 }
      REDUNDANCY_SURCHARGE_PCT: { NONE: 0.00, HOT_BACKUP: 0.06, DUAL_LINK: 0.09, RING: 0.14 }
    precision: "whole cents, round_half_up, applied per cabinet line BEFORE summation"

  - name: project_data_load_pct
    trigger: "POST /projects"
    algorithm: constraint_propagation
    formula: |
      total_pixel_count     = cabinet_count * DisplayModel.cabinet_pixel_count
      required_data_mbps    = ceil(total_pixel_count * color_depth_bits * 3 * refresh_rate_hz / 1000000)
      port_capacity_mbps    = floor(output_port_count * port_bandwidth_mbps
                                    * REDUNDANCY_DERATE_FACTOR[redundancy_mode])
      player_capacity_mbps  = player_count * PLAYER_THROUGHPUT_MBPS
      effective_capacity_mbps = min(port_capacity_mbps, player_capacity_mbps)
      data_load_pct = round_half_up(required_data_mbps / effective_capacity_mbps * 100, 2)
      # gate: data_load_pct > 100.00 -> ERR_DATA_LOAD_EXCEEDS_CAPACITY.
      # EXACTLY 100.00 is accepted (>= vs > boundary).
    input_set: "The DisplayProject being created and its pinned DisplayModel row."
    constants:
      REDUNDANCY_DERATE_FACTOR: { NONE: 1.0, HOT_BACKUP: 0.5, DUAL_LINK: 0.5, RING: 0.75 }
      PLAYER_THROUGHPUT_MBPS: 2500
      MAX_DATA_LOAD_PCT: 100.00
    precision: "required_data_mbps ceil to whole Mbps, port capacity floor to whole Mbps, pct 2 decimals round_half_up"
    note: >
      Mode (a) combinatorial: four inputs interact non-linearly — a ceil on demand,
      a floor on a derated port product, a nested min against player throughput, and
      a percentage compare at an exact boundary. Changing the ceil/floor direction or
      the min order moves the verdict across the 100.00 line.

  - name: module_color_bin_assignment
    trigger: "POST /modules/{module_id}/calibrate"
    algorithm: threshold
    formula: |
      chroma_error = max( abs(measured_color_x - DisplayModel.reference_color_x),
                          abs(measured_color_y - DisplayModel.reference_color_y) )   # 4 decimals in, compared exactly
      if chroma_error > CHROMA_REWORK_TOLERANCE:
          reject with ERR_CHROMA_OUT_OF_TOLERANCE   # no state change, no measurements stored
      if chroma_error > CHROMA_CALIBRATED_TOLERANCE:
          module goes to REWORK (or SCRAPPED once rework_cycles + 1 > MAX_REWORK_CYCLES);
          color_bin stays null
      else:
          letter = "A" if chroma_error <= CHROMA_A_BIN_TOLERANCE else "B"
          digit  = "1" if measured_brightness_nits
                          >= ceil(DisplayModel.rated_brightness_nits * BRIGHTNESS_BIN_1_FRACTION)
                        else "2"
          color_bin = letter + digit
          color_bin_rank = { A1: 0, A2: 1, B1: 2, B2: 3 }[color_bin]
    input_set: "The single Module being calibrated plus its DisplayModel reference coordinates."
    constants:
      CHROMA_A_BIN_TOLERANCE: 0.003
      CHROMA_CALIBRATED_TOLERANCE: 0.008
      CHROMA_REWORK_TOLERANCE: 0.020
      BRIGHTNESS_BIN_1_FRACTION: 0.96
    precision: "chroma compared at 4 decimals as declared; brightness floor uses ceil to whole nits"
    note: >
      Three-band tolerance ladder: <= 0.008 calibrates, (0.008, 0.020] reworks,
      > 0.020 is a hard rejection. The bin LETTER uses a stricter inner threshold
      (0.003) than the calibrate/rework split, so a module can calibrate and still
      land in the B letter band.

  - name: cabinet_dead_pixel_ppm
    trigger: "POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /burn-in-runs/{burn_in_run_id}/complete, POST /service-cases/{service_case_id}/fulfil"
    algorithm: aggregation
    formula: |
      total_dead_pixel_count =
          sum( Module.dead_pixel_count
               for Module where Module.cabinet_id == cabinet.id
                            AND Module.module_state == INSTALLED )
        + ( latest BurnInRun of this cabinet with run_state IN {PASSED, FAILED}
            ordered by created_at ASC, take the last one ).new_dead_pixel_count
            or 0 when no such run exists
      dead_pixel_ppm = round_half_up(
          total_dead_pixel_count / DisplayModel.cabinet_pixel_count * 1000000, 2)
      # gate at burn-in completion: dead_pixel_ppm <= DisplayModel.dead_pixel_ppm_limit passes.
    input_set: "Modules of this cabinet with module_state == INSTALLED (RETURNED and SCRAPPED modules are excluded), plus the newest terminal-but-not-aborted BurnInRun of this cabinet by created_at ASC."
    constants:
      # Plant-wide burn-in / commissioning acceptance floors. They sit here
      # because they are evaluated together with dead_pixel_ppm_limit in the
      # single pass/fail gate of POST /burn-in-runs/{id}/complete and
      # POST /commissioning-visits/{id}/calibrate.
      BURN_IN_MIN_BRIGHTNESS_NITS: 4800
      BURN_IN_MIN_UNIFORMITY_PCT: 92.00
      # On-site (post-mounting) commissioning floors, consumed by
      # CommissioningVisit ON_SITE -> CALIBRATED.
      ON_SITE_BRIGHTNESS_FLOOR_FRACTION: 0.95
      ON_SITE_MIN_UNIFORMITY_PCT: 90.00
    precision: "2 decimals, round_half_up; compared with <= against dead_pixel_ppm_limit"

  - name: cabinet_uniformity_score
    trigger: "POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /burn-in-runs/{burn_in_run_id}/complete (pass), POST /service-cases/{service_case_id}/fulfil"
    algorithm: weighted_scoring
    formula: |
      # over the module set selected by the variant:
      mean_brightness       = sum(measured_brightness_nits) / count            # exact rational, not rounded
      brightness_spread_pct = round_half_up(
            (max(measured_brightness_nits) - min(measured_brightness_nits))
            / mean_brightness * 100, 4)
      chroma_spread         = round_half_up(
            (max(measured_color_x) - min(measured_color_x))
          + (max(measured_color_y) - min(measured_color_y)), 6)
      score = round_half_up(100
                            - UNIFORMITY_BRIGHTNESS_WEIGHT * brightness_spread_pct
                            - UNIFORMITY_CHROMA_WEIGHT * chroma_spread, 2)
      score = max(score, 0.00)
      # requires count >= 2; with fewer than 2 modules the score is null.
    input_set: "Depends on the variant — see variants below. Modules are ordered by created_at ASC wherever an order is observable."
    constants:
      UNIFORMITY_BRIGHTNESS_WEIGHT: 1.5
      UNIFORMITY_CHROMA_WEIGHT: 2000
      MIN_MODULES_FOR_SCORE: 2
    precision: "brightness_spread_pct 4 decimals, chroma_spread 6 decimals, score 2 decimals, all round_half_up, floored at 0.00"
    variants:
      - name: AS_BUILT
        when: "Recomputed on every module install, module removal, and warranty module swap; written to Cabinet.as_built_uniformity_score."
        difference: "Input set is the modules CURRENTLY holding module_state == INSTALLED in the cabinet, so a warranty replacement changes the score."
      - name: QA_BASELINE
        when: "Computed exactly once, at the instant the cabinet's BurnInRun reaches PASSED; written to Cabinet.baseline_uniformity_score together with Cabinet.baseline_module_ids."
        difference: "Input set is FROZEN to the module ids captured in Cabinet.baseline_module_ids and their measurements as at burn-in pass; later installs, removals, and swaps never move it."
    note: >
      Dual variant on the Cabinet domain: after a warranty swap the two fields
      diverge for identical stored data, and the delta
      (baseline_uniformity_score - as_built_uniformity_score) is the observable
      degradation the QA report cites.

  - name: service_contract_spare_requirement
    trigger: "POST /service-contracts"
    algorithm: threshold
    formula: |
      spare_required_count = ceil(DisplayProject.module_count * spare_pct_bp / 10000)
      # gate: spare_pct_bp >= TIER_MIN_SPARE_PCT_BP[tier], else ERR_SPARE_PCT_BELOW_MINIMUM
    input_set: "The DisplayProject's computed module_count at contract creation time; later cabinet changes do NOT re-derive it."
    constants:
      TIER_MIN_SPARE_PCT_BP: { BRONZE: 100, SILVER: 200, GOLD: 300 }
    precision: "ceil to a whole module count"

  - name: service_contract_annual_fee_cents
    trigger: "POST /service-contracts"
    algorithm: tiered_pricing
    formula: |
      gross_fee_cents    = round_half_up(DisplayProject.total_area_sqm
                                          * TIER_RATE_CENTS_PER_SQM[tier], 0)
      spare_carry_cents  = spare_required_count * SPARE_CARRY_FEE_CENTS
      subtotal_fee_cents = gross_fee_cents + spare_carry_cents
      # EVALUATION ORDER IS PINNED. The discount tier is selected from
      # subtotal_fee_cents ONCE and is NEVER re-evaluated against the
      # post-discount fee, even when the discount pushes the fee back below the
      # tier boundary it just crossed.
      volume_discount_pct = 0.00  if subtotal_fee_cents <  2000000
                            0.04  if subtotal_fee_cents <  5000000
                            0.07  if subtotal_fee_cents < 10000000
                            0.10  otherwise
      discount_cents   = round_half_up(subtotal_fee_cents * volume_discount_pct, 0)
      annual_fee_cents = subtotal_fee_cents - discount_cents
    input_set: "The DisplayProject's total_area_sqm and module_count, plus the contract's own tier and spare_pct_bp."
    constants:
      TIER_RATE_CENTS_PER_SQM: { BRONZE: 120000, SILVER: 190000, GOLD: 268000 }
      SPARE_CARRY_FEE_CENTS: 4500
      DISCOUNT_BREAK_1_CENTS: 2000000
      DISCOUNT_BREAK_2_CENTS: 5000000
      DISCOUNT_BREAK_3_CENTS: 10000000
    precision: "whole cents, round_half_up on gross and on the discount, in that order"
    note: >
      Mode (c) combinatorial: the fee depends on a discount that is keyed on a
      tier of the fee's own subtotal. The pinned order (subtotal -> tier -> discount
      -> fee) makes the value well-defined; re-checking the tier against the
      post-discount fee yields a different, non-convergent answer.

  - name: case_response_deadline
    trigger: "POST /service-cases, POST /service-cases/{service_case_id}/respond"
    algorithm: chronological
    formula: |
      response_deadline_at = reported_at
          + ServiceContract.response_hours
            * SEVERITY_RESPONSE_MULTIPLIER[severity] hours
      # at respond time:
      response_breached = (responded_at > response_deadline_at)   # STRICTLY later
      # responded_at exactly equal to response_deadline_at is ON TIME.
      if response_breached:
          ServiceContract.sla_breach_count += 1
          if ServiceContract.sla_breach_count >= MAX_SLA_BREACHES:
              ServiceContract.contract_state = SUSPENDED
    input_set: "The ServiceCase's own reported_at and severity, plus the contract's tier-derived response_hours."
    constants:
      TIER_RESPONSE_HOURS: { BRONZE: 48, SILVER: 24, GOLD: 8 }
      SEVERITY_RESPONSE_MULTIPLIER: { CRITICAL: 0.5, MAJOR: 1.0, MINOR: 2.0 }
      MAX_SLA_BREACHES: 2
    precision: "deadlines are exact instants at millisecond resolution; the comparison is strict >"

  - name: case_warranty_credit_cents
    trigger: "POST /service-cases/{service_case_id}/assess with decision = APPROVE"
    algorithm: decay_function
    formula: |
      cabinet_value_cents = round_half_up(DisplayModel.cabinet_area_sqm
                                          * DisplayModel.price_per_sqm_cents, 0)
      elapsed_warranty_months = floor( floor( (reported_at - ServiceContract.warranty_start_at)
                                              in whole seconds / 86400 ) / 30 )
      allowed_degradation_pct = round_half_up(
            GUARANTEED_DEGRADATION_PCT * elapsed_warranty_months / WARRANTY_TERM_MONTHS, 2)
      degradation_pct = round_half_up(
            (DisplayModel.rated_brightness_nits - measured_brightness_nits)
            / DisplayModel.rated_brightness_nits * 100, 2)
      shortfall_pct   = max(0.00, round_half_up(degradation_pct - allowed_degradation_pct, 2))
      # shortfall_pct == 0.00 -> ERR_DEGRADATION_WITHIN_ALLOWANCE, no credit, no approval
      credit_cents = per variant below
    input_set: "The ServiceCase's measurements, its ServiceContract's warranty_start_at and term_months, and the DisplayModel's rated brightness / geometry / price. MODULE_FAULT cases skip this calculation entirely and carry credit_cents = 0."
    constants:
      WARRANTY_TERM_MONTHS: 60
      GUARANTEED_DEGRADATION_PCT: 50
      SEVERITY_CREDIT_MULTIPLIER: 2.5
      MAX_CREDIT_FRACTION: 0.6
      DAYS_PER_WARRANTY_MONTH: 30
    precision: "percentages 2 decimals round_half_up; credit rounded to whole cents round_half_up as the LAST step"
    variants:
      - name: PRO_RATA_REMAINING_TERM
        when: "assessment_basis = PRO_RATA_REMAINING_TERM on the assess call."
        difference: |
          credit_cents = round_half_up(cabinet_value_cents
                                       * (WARRANTY_TERM_MONTHS - elapsed_warranty_months)
                                       / WARRANTY_TERM_MONTHS, 0)
          Ignores the size of the shortfall entirely — only how much warranty life is left.
      - name: SHORTFALL_SEVERITY
        when: "assessment_basis = SHORTFALL_SEVERITY on the assess call."
        difference: |
          credit_cents = round_half_up(cabinet_value_cents
                                       * min(shortfall_pct / 100 * SEVERITY_CREDIT_MULTIPLIER,
                                             MAX_CREDIT_FRACTION), 0)
          Ignores remaining term entirely — only how far below the guaranteed curve the
          panel has fallen, capped at 60% of cabinet value.
    note: >
      Dual variant on the ServiceCase/warranty domain (distinct from
      cabinet_uniformity_score, which is a Cabinet-quality metric): identical stored
      data yields materially different credits, and early-life low-severity cases
      invert the ordering relative to late-life high-severity cases.

  - name: chamber_slot_occupancy
    trigger: "POST /burn-in-runs"
    algorithm: interval_merge
    formula: |
      candidate_interval = [ window_start , window_end + turnaround_minutes ]   # CLOSED at both ends
      for each existing BurnInRun r of the same chamber with r.run_state == SCHEDULED:
          existing_interval = [ r.window_start , r.occupied_until ]             # CLOSED at both ends
          overlap if candidate_interval.start <= existing_interval.end
                 AND existing_interval.start <= candidate_interval.end
      # AGGREGATE capacity, not pairwise exclusivity: overlapping runs are allowed
      # while the slots fit.
      concurrent_slots = slots_required
                       + sum( r.slots_required for overlapping r )
      if concurrent_slots > BurnInChamber.slot_capacity:
          reject with ERR_CHAMBER_CAPACITY_EXCEEDED (409)
    input_set: "BurnInRun rows of the same burn_in_chamber_id with run_state == SCHEDULED; PASSED, FAILED, and ABORTED runs have released their slots and are excluded."
    constants: {}
    precision: "instants compared at millisecond resolution; both interval ends inclusive"
    note: >
      Interval semantics A: CLOSED-CLOSED intervals extended by a per-chamber
      turnaround buffer, resolved as an AGGREGATE slot budget. Back-to-back runs
      touching at a single instant DO collide here, and two runs may legally overlap
      as long as their slot sum fits.

  - name: crew_window_occupancy
    trigger: "POST /commissioning-visits"
    algorithm: interval_merge
    formula: |
      candidate_interval = [ window_start , window_end )                        # HALF-OPEN
      for each existing CommissioningVisit v of the same crew with
          v.visit_state IN {SCHEDULED, ON_SITE, CALIBRATED}:
          existing_interval = [ v.window_start , v.window_end )                 # HALF-OPEN
          overlap if candidate_interval.start < existing_interval.end
                 AND existing_interval.start < candidate_interval.end
      # EXCLUSIVE occupancy: a single overlapping visit is enough to reject.
      if any overlap:
          reject with ERR_CREW_DOUBLE_BOOKED (409)
    input_set: "CommissioningVisit rows of the same commissioning_crew_id whose visit_state IN {SCHEDULED, ON_SITE, CALIBRATED}; SIGNED_OFF and ABORTED visits have released the crew."
    constants: {}
    precision: "instants compared at millisecond resolution; window_end exclusive"
    note: >
      Interval semantics B, deliberately different from chamber_slot_occupancy:
      HALF-OPEN intervals, no buffer, and EXCLUSIVE (capacity-1) occupancy. A visit
      starting at exactly the previous visit's window_end is legal; one starting one
      millisecond earlier is rejected.

  - name: spare_module_selector
    trigger: "POST /service-contracts/{service_contract_id}/spare-reservations when module_id is omitted; POST /service-cases/{service_case_id}/fulfil when replacement_module_id is omitted"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = Module rows where
            module_state == CALIBRATED
        AND display_model_id == DisplayProject.display_model_id of the contract's project
        AND ( for spare-reservations: reserved_service_contract_id IS NULL
              for fulfil:             reserved_service_contract_id == case.service_contract_id )
        AND ( for fulfil: abs(color_bin_rank - outgoing_module.color_bin_rank)
                          <= COLOR_BIN_RANK_TOLERANCE )
      # (b) ranking expression, applied in order
      #     for fulfil (an outgoing module exists):
      #       1. abs(color_bin_rank - outgoing_module.color_bin_rank) ASC
      #       2. measured_brightness_nits DESC
      #     for spare-reservations (no outgoing module):
      #       1. color_bin_rank DESC   (reserve the weaker bins first, holding A1
      #                                 stock back for production installs)
      #       2. measured_brightness_nits ASC
      # (c) tie-break when both ranking keys tie: created_at ASC
      # (d) empty candidate set:
      #     spare-reservations -> ERR_NO_ELIGIBLE_SPARE_MODULE (409)
      #     fulfil             -> ERR_NO_ELIGIBLE_SPARE_MODULE (409)
    input_set: "Module rows with module_state == CALIBRATED only; MANUFACTURED, PIXEL_TESTED, REWORK, INSTALLED, RETURNED, and SCRAPPED modules are never candidates."
    constants:
      COLOR_BIN_RANK_TOLERANCE: 1
    precision: "integer ranks and nits; created_at compared at millisecond resolution"

  - name: faulty_module_selector
    trigger: "POST /service-cases/{service_case_id}/assess with decision = APPROVE on a BRIGHTNESS_DEGRADATION case"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = Module rows where cabinet_id == case.cabinet_id
                                 AND module_state == INSTALLED
      # (b) ranking expression: measured_brightness_nits ASC (the dimmest panel is
      #     the one the degradation claim is about)
      # (c) tie-break: created_at ASC
      # (d) empty candidate set -> ERR_NO_REPLACEABLE_MODULE (409)
      resolved_faulty_module_id = first candidate
      # MODULE_FAULT cases bypass this selector: resolved_faulty_module_id is the
      # caller-supplied case.faulty_module_id.
    input_set: "Modules of the case's cabinet with module_state == INSTALLED; RETURNED modules from earlier swaps are excluded even though they retain cabinet_id."
    constants: {}
    precision: "integer nits; created_at compared at millisecond resolution"

  - name: module_rework_cycle_accounting
    trigger: "POST /modules/{module_id}/pixel-test (failing), POST /modules/{module_id}/calibrate (chroma in the rework band)"
    algorithm: threshold
    formula: |
      candidate_cycles = module.rework_cycles + 1
      module.rework_cycles = candidate_cycles          # ALWAYS incremented on a failure
      if candidate_cycles > MAX_REWORK_CYCLES:
          module_state = SCRAPPED                      # terminal
      else:
          module_state = REWORK
      # Passing a retest does NOT decrement rework_cycles: the counter is monotonic,
      # so a module that reworked twice and then passed is still one failure away
      # from scrap for the rest of its life.
    input_set: "The single Module under test."
    constants:
      MAX_REWORK_CYCLES: 2
    precision: "integer counter; the comparison is strict > against MAX_REWORK_CYCLES"

# =============================================================================
# §1.4 Validation Rules Table (evaluated STRICTLY in ascending priority order;
# the first violated rule decides the response and NOTHING is persisted)
#
# Domain ordering rationale: authentication -> authorization -> request shape ->
# existence -> ownership -> optimistic concurrency -> state preconditions ->
# segregation of duties -> structural SAFETY -> TEMPORAL/resource conflicts ->
# REFERENTIAL coherence -> BUSINESS CONSTRAINTS -> FISCAL. Safety outranks
# scheduling because a structurally unsound wall must be rejected before the
# factory argues about chamber slots.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The authenticated role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body/query shape: required fields present, JSON types correct, enum members recognised, numeric ranges honoured, window_end > window_start, limit in 1..100, offset >= 0"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-templated id resolves, checked left to right; the first unresolved id decides. For non-entity-specific parents (display_model_id, burn_in_chamber_id, commissioning_crew_id) ERR_REFERENCE_NOT_FOUND is returned"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /projects, POST /modules, POST /burn-in-runs, POST /commissioning-visits, GET /display-models/{display_model_id}, GET /burn-in-chambers/{burn_in_chamber_id}, GET /commissioning-crews/{commissioning_crew_id}"

  - priority: 5
    category: existence
    check: "project_id in the path or body resolves to a DisplayProject"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "GET /projects/{project_id}, POST /drawing-revisions, POST /cabinets, POST /commissioning-visits, POST /service-contracts"

  - priority: 6
    category: existence
    check: "drawing_revision_id in the path resolves to a DrawingRevision"
    error_id: ERR_REVISION_NOT_FOUND
    http_status: 404
    applies_to: "GET /drawing-revisions/{drawing_revision_id}, POST /drawing-revisions/{drawing_revision_id}/review"

  - priority: 7
    category: existence
    check: "cabinet_id in the path or body resolves to a Cabinet"
    error_id: ERR_CABINET_NOT_FOUND
    http_status: 404
    applies_to: "GET /cabinets/{cabinet_id}, POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /cabinets/{cabinet_id}/qa-approve, POST /cabinets/{cabinet_id}/mount, POST /burn-in-runs, POST /service-cases"

  - priority: 8
    category: existence
    check: "module_id in the path or body resolves to a Module. On POST /cabinets/{cabinet_id}/modules the path cabinet is resolved first, then the body module"
    error_id: ERR_MODULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /modules/{module_id}, POST /modules/{module_id}/pixel-test, POST /modules/{module_id}/calibrate, POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /service-contracts/{service_contract_id}/spare-reservations, POST /service-contracts/{service_contract_id}/spare-releases, POST /service-cases, POST /service-cases/{service_case_id}/fulfil"

  - priority: 9
    category: existence
    check: "burn_in_run_id in the path resolves to a BurnInRun"
    error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /burn-in-runs/{burn_in_run_id}, POST /burn-in-runs/{burn_in_run_id}/complete, POST /burn-in-runs/{burn_in_run_id}/abort"

  - priority: 10
    category: existence
    check: "commissioning_visit_id in the path resolves to a CommissioningVisit"
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /commissioning-visits/{commissioning_visit_id}, POST /commissioning-visits/{commissioning_visit_id}/arrive, POST /commissioning-visits/{commissioning_visit_id}/calibrate, POST /commissioning-visits/{commissioning_visit_id}/sign-off"

  - priority: 11
    category: existence
    check: "service_contract_id in the path or body resolves to a ServiceContract"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-contracts/{service_contract_id}, POST /service-contracts/{service_contract_id}/spare-reservations, POST /service-contracts/{service_contract_id}/spare-releases, POST /service-cases"

  - priority: 12
    category: existence
    check: "service_case_id in the path resolves to a ServiceCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-cases/{service_case_id}, POST /service-cases/{service_case_id}/respond, POST /service-cases/{service_case_id}/assess, POST /service-cases/{service_case_id}/fulfil"

  - priority: 13
    category: auth
    check: "For the FieldEngineer role acting on a CommissioningVisit, X-User-ID equals visit.commissioning_crew_id"
    error_id: ERR_CREW_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /commissioning-visits/{commissioning_visit_id}/arrive, POST /commissioning-visits/{commissioning_visit_id}/calibrate, POST /commissioning-visits/{commissioning_visit_id}/sign-off"

  - priority: 14
    category: state
    check: "expected_cabinet_version equals cabinet.version"
    error_id: ERR_STALE_CABINET_VERSION
    http_status: 412
    applies_to: "POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /service-cases/{service_case_id}/fulfil"

  - priority: 15
    category: state
    check: "expected_service_contract_version equals service_contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /service-contracts/{service_contract_id}/spare-reservations, POST /service-contracts/{service_contract_id}/spare-releases"

  - priority: 16
    category: state
    check: "revision.revision_state == SUBMITTED"
    error_id: ERR_INVALID_REVISION_STATE
    http_status: 409
    applies_to: "POST /drawing-revisions/{drawing_revision_id}/review"

  - priority: 17
    category: state
    check: "project.engineering_state != APPROVED when submitting a further DrawingRevision"
    error_id: ERR_ENGINEERING_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /drawing-revisions"

  - priority: 18
    category: state
    check: "project.engineering_state == APPROVED before any module may be installed or any cabinet mounted"
    error_id: ERR_ENGINEERING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/mount"

  - priority: 19
    category: state
    check: "module.module_state is in the set the operation permits: {MANUFACTURED, REWORK} for pixel-test, {PIXEL_TESTED, REWORK} for calibrate, CALIBRATED for install and spare reservation, INSTALLED for removal"
    error_id: ERR_INVALID_MODULE_STATE
    http_status: 409
    applies_to: "POST /modules/{module_id}/pixel-test, POST /modules/{module_id}/calibrate, POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /service-contracts/{service_contract_id}/spare-reservations"

  - priority: 20
    category: state
    check: "cabinet.cabinet_state is in the set the operation permits: PLANNED or IN_ASSEMBLY for install, {IN_ASSEMBLY, POPULATED, QUARANTINED} for removal, POPULATED for burn-in scheduling, BURN_IN_PASSED for qa-approve, QA_PASSED for mount"
    error_id: ERR_INVALID_CABINET_STATE
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/modules, POST /cabinets/{cabinet_id}/module-removals, POST /burn-in-runs, POST /cabinets/{cabinet_id}/qa-approve, POST /cabinets/{cabinet_id}/mount"

  - priority: 21
    category: state
    check: "run.run_state == SCHEDULED"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    applies_to: "POST /burn-in-runs/{burn_in_run_id}/complete, POST /burn-in-runs/{burn_in_run_id}/abort"

  - priority: 22
    category: state
    check: "visit.visit_state is in the set the operation permits: SCHEDULED for arrive, ON_SITE for calibrate, CALIBRATED for sign-off"
    error_id: ERR_INVALID_VISIT_STATE
    http_status: 409
    applies_to: "POST /commissioning-visits/{commissioning_visit_id}/arrive, POST /commissioning-visits/{commissioning_visit_id}/calibrate, POST /commissioning-visits/{commissioning_visit_id}/sign-off"

  - priority: 23
    category: state
    check: "case.case_state is in the set the operation permits: OPEN for respond, RESPONDED for assess, APPROVED for fulfil"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /service-cases/{service_case_id}/respond, POST /service-cases/{service_case_id}/assess, POST /service-cases/{service_case_id}/fulfil"

  - priority: 24
    category: state
    check: "contract.contract_state == ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /service-cases, POST /service-cases/{service_case_id}/respond, POST /service-cases/{service_case_id}/assess, POST /service-cases/{service_case_id}/fulfil"

  - priority: 25
    category: state
    check: "project.production_state == INSTALLED (every cabinet of the project has cabinet_state == MOUNTED) before a crew may go on site or sign off"
    error_id: ERR_CABINETS_NOT_MOUNTED
    http_status: 409
    applies_to: "POST /commissioning-visits/{commissioning_visit_id}/arrive, POST /commissioning-visits/{commissioning_visit_id}/sign-off"

  - priority: 26
    category: business_safety
    check: "The reviewing X-User-ID differs from revision.submitted_by_user_id; the QA-approving X-User-ID is not the calibrated_by_user_id of any module INSTALLED in the cabinet"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /drawing-revisions/{drawing_revision_id}/review, POST /cabinets/{cabinet_id}/qa-approve"

  - priority: 27
    category: business_safety
    check: "revision.wind_load_kph >= MIN_WIND_LOAD_KPH[project.install_environment] (STADIUM 160, ROADSIDE 200, RETAIL 100)"
    error_id: ERR_WIND_LOAD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /drawing-revisions"

  - priority: 28
    category: business_safety
    check: "revision.structural_load_kg_per_sqm >= DisplayModel.required_load_kg_per_sqm, compared at 2 decimals with >="
    error_id: ERR_STRUCTURAL_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /drawing-revisions"

  - priority: 29
    category: business_safety
    check: "project.min_viewing_distance_m >= DisplayModel.recommended_min_viewing_distance_m, compared at 1 decimal with >=; exact equality passes"
    error_id: ERR_VIEWING_DISTANCE_TOO_SHORT
    http_status: 422
    applies_to: "POST /projects"

  - priority: 30
    category: business_safety
    check: "install_environment == ROADSIDE requires redundancy_mode != NONE"
    error_id: ERR_REDUNDANCY_REQUIRED_FOR_ROADSIDE
    http_status: 422
    applies_to: "POST /projects"

  - priority: 31
    category: business_safety
    check: "drive_pct <= min(DisplayModel.max_drive_pct, BurnInChamber.certified_max_drive_pct)"
    error_id: ERR_DRIVE_LEVEL_UNSAFE
    http_status: 422
    applies_to: "POST /burn-in-runs"

  - priority: 32
    category: business_temporal
    check: "window_end - window_start >= DisplayModel.burn_in_hours_required whole hours; exactly equal passes"
    error_id: ERR_BURN_IN_DURATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /burn-in-runs"

  - priority: 33
    category: business_temporal
    check: "The logical clock is at or after run.window_end; exact equality passes"
    error_id: ERR_BURN_IN_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /burn-in-runs/{burn_in_run_id}/complete"

  - priority: 34
    category: business_temporal
    check: "visit.window_start <= logical clock < visit.window_end (half-open; the instant equal to window_end is outside the window)"
    error_id: ERR_VISIT_WINDOW_NOT_CURRENT
    http_status: 409
    applies_to: "POST /commissioning-visits/{commissioning_visit_id}/arrive"

  - priority: 35
    category: business_temporal
    check: "Aggregate chamber slots over the candidate CLOSED interval [window_start, window_end + turnaround_minutes] do not exceed BurnInChamber.slot_capacity; see calculations.chamber_slot_occupancy"
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /burn-in-runs"

  - priority: 36
    category: business_temporal
    check: "The crew has no visit whose HALF-OPEN window [window_start, window_end) overlaps the candidate window; see calculations.crew_window_occupancy"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /commissioning-visits"

  - priority: 37
    category: business_referential
    check: "CommissioningCrew.region_code == DisplayProject.site_region_code"
    error_id: ERR_CREW_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /commissioning-visits"

  - priority: 38
    category: business_referential
    check: "Module.display_model_id == the cabinet's DisplayProject.display_model_id"
    error_id: ERR_MODULE_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /cabinets/{cabinet_id}/modules"

  - priority: 39
    category: business_referential
    check: "The Cabinet named in the body belongs to the ServiceContract's project; the faulty module named in the body belongs to that Cabinet"
    error_id: ERR_MODULE_GRID_MISMATCH
    http_status: 422
    applies_to: "POST /service-cases"

  - priority: 40
    category: business_referential
    check: "No DrawingRevision of the project currently has revision_state == SUBMITTED"
    error_id: ERR_OPEN_REVISION_EXISTS
    http_status: 409
    applies_to: "POST /drawing-revisions"

  - priority: 41
    category: business_referential
    check: "The project has no existing ServiceContract"
    error_id: ERR_CONTRACT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /service-contracts"

  - priority: 42
    category: business_constraint
    check: "(project_id, grid_row, grid_col) is not already taken, and grid_row <= cabinet_grid_rows and grid_col <= cabinet_grid_cols"
    error_id: ERR_CABINET_POSITION_TAKEN
    http_status: 409
    applies_to: "POST /cabinets"

  - priority: 43
    category: business_constraint
    check: "Module.serial_no is not already used by another Module"
    error_id: ERR_MODULE_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /modules"

  - priority: 44
    category: business_constraint
    check: "slot_index is in 1..DisplayModel.modules_per_cabinet and is not in cabinet.occupied_slot_indexes"
    error_id: ERR_CABINET_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/modules"

  - priority: 45
    category: business_constraint
    check: "The module is not held as a contracted spare (reserved_service_contract_id IS NULL) when installing it into production"
    error_id: ERR_MODULE_RESERVED_AS_SPARE
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/modules"

  - priority: 46
    category: business_constraint
    check: "The chroma error at calibration is <= CHROMA_REWORK_TOLERANCE (0.020); beyond it the module is not reworkable and nothing is stored"
    error_id: ERR_CHROMA_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /modules/{module_id}/calibrate"

  - priority: 47
    category: business_constraint
    check: "measured_brightness_nits is present for case_type == BRIGHTNESS_DEGRADATION and faulty_module_id is present for case_type == MODULE_FAULT"
    error_id: ERR_MEASUREMENT_REQUIRED
    http_status: 422
    applies_to: "POST /service-cases"

  - priority: 48
    category: business_constraint
    check: "shortfall_pct > 0.00 before a BRIGHTNESS_DEGRADATION case may be APPROVED; exactly 0.00 is inside the guaranteed curve and is not compensable"
    error_id: ERR_DEGRADATION_WITHIN_ALLOWANCE
    http_status: 422
    applies_to: "POST /service-cases/{service_case_id}/assess"

  - priority: 49
    category: business_constraint
    check: "At least one Module with module_state == INSTALLED exists in the case's cabinet; see calculations.faulty_module_selector empty-set fallback"
    error_id: ERR_NO_REPLACEABLE_MODULE
    http_status: 409
    applies_to: "POST /service-cases/{service_case_id}/assess"

  - priority: 50
    category: business_constraint
    check: "The nominated replacement module has reserved_service_contract_id == case.service_contract_id"
    error_id: ERR_SPARE_NOT_RESERVED
    http_status: 409
    applies_to: "POST /service-cases/{service_case_id}/fulfil, POST /service-contracts/{service_contract_id}/spare-releases"

  - priority: 51
    category: business_constraint
    check: "abs(replacement.color_bin_rank - outgoing.color_bin_rank) <= COLOR_BIN_RANK_TOLERANCE (1)"
    error_id: ERR_COLOR_BIN_MISMATCH
    http_status: 422
    applies_to: "POST /service-cases/{service_case_id}/fulfil"

  - priority: 52
    category: business_constraint
    check: "The eligibility-filtered spare pool is non-empty; see calculations.spare_module_selector empty-set fallback"
    error_id: ERR_NO_ELIGIBLE_SPARE_MODULE
    http_status: 409
    applies_to: "POST /service-contracts/{service_contract_id}/spare-reservations, POST /service-cases/{service_case_id}/fulfil"

  - priority: 53
    category: business_fiscal
    check: "data_load_pct <= 100.00 after the redundancy derate and the player-throughput min; exactly 100.00 passes"
    error_id: ERR_DATA_LOAD_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /projects"

  - priority: 54
    category: business_fiscal
    check: "spare_pct_bp >= TIER_MIN_SPARE_PCT_BP[tier] (BRONZE 100, SILVER 200, GOLD 300)"
    error_id: ERR_SPARE_PCT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /service-contracts"

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat topology: every entity is a top-level collection under api_prefix "/".
# Nested paths appear only as ACTION sub-resources. `?` marks an optional input.
# Every GET list endpoint accepts `limit?` and `offset?` per §1.0 pagination.
# =============================================================================
endpoints:

  # --- catalogue / configuration -------------------------------------------
  - method: POST
    path: "/display-models"
    description: "Register an LED product family: pixel pitch, brightness, geometry, quality thresholds."
    roles: [PlantAdmin]
    code: 201
    input: [name, pixel_pitch_mm, rated_brightness_nits, environmental_rating, module_width_mm, module_height_mm, module_pixel_cols, module_pixel_rows, cabinet_width_mm, cabinet_height_mm, modules_per_cabinet, cabinet_weight_kg, price_per_sqm_cents, dead_pixel_ppm_limit, "module_dead_pixel_max?", "module_cluster_max?", reference_color_x, reference_color_y, burn_in_hours_required, max_drive_pct]
    output: DisplayModel
    side_effects:
      - "runs calculations.model_geometry_derivation to fill module_area_sqm, cabinet_area_sqm, module_pixel_count, cabinet_pixel_count, recommended_min_viewing_distance_m, required_load_kg_per_sqm"
      - "rejects a geometry whose modules_per_cabinet contradicts the cabinet/module dimensions with ERR_VALIDATION_FAILED"

  - method: GET
    path: "/display-models/{display_model_id}"
    description: "Read one display model with its derived geometry."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: DisplayModel
    side_effects: []

  - method: GET
    path: "/display-models"
    description: "List display models."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["environmental_rating?", "limit?", "offset?"]
    output: DisplayModel[]
    side_effects: []

  - method: POST
    path: "/burn-in-chambers"
    description: "Register a burn-in chamber with its slot capacity, turnaround buffer, and certified drive level."
    roles: [PlantAdmin]
    code: 201
    input: [name, slot_capacity, turnaround_minutes, certified_max_drive_pct]
    output: BurnInChamber
    side_effects:
      - "initialises reserved_slot_total = 0 and scheduled_run_count = 0"

  - method: GET
    path: "/burn-in-chambers/{burn_in_chamber_id}"
    description: "Read one chamber with its live slot reservation totals."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: BurnInChamber
    side_effects: []

  - method: GET
    path: "/burn-in-chambers"
    description: "List burn-in chambers."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: BurnInChamber[]
    side_effects: []

  - method: POST
    path: "/commissioning-crews"
    description: "Register a commissioning crew. The returned id is the X-User-ID a FieldEngineer authenticates with."
    roles: [PlantAdmin]
    code: 201
    input: [name, region_code, certification_level]
    output: CommissioningCrew
    side_effects:
      - "initialises scheduled_visit_count = 0"

  - method: GET
    path: "/commissioning-crews/{commissioning_crew_id}"
    description: "Read one crew with its live booking count."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: CommissioningCrew
    side_effects: []

  - method: GET
    path: "/commissioning-crews"
    description: "List commissioning crews."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["region_code?", "certification_level?", "limit?", "offset?"]
    output: CommissioningCrew[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock to an absolute instant. The clock's STARTUP DEFAULT is 2026-08-01T00:00:00Z — before any call to this endpoint the logical clock reads exactly that value and never falls back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "sets the logical clock used by reported_at, arrived_at, signed_off_at, warranty_start_at, and every window/deadline comparison"

  # --- projects and engineering --------------------------------------------
  - method: POST
    path: "/projects"
    description: "Create a display project: grid sizing, environment, redundancy design, control-system capacity."
    roles: [DesignEngineer]
    code: 201
    input: [customer_name, install_environment, site_region_code, display_model_id, cabinet_grid_cols, cabinet_grid_rows, min_viewing_distance_m, target_brightness_nits, redundancy_mode, output_port_count, port_bandwidth_mbps, color_depth_bits, refresh_rate_hz, player_count]
    output: DisplayProject
    side_effects:
      - "computes cabinet_count, module_count, total_area_sqm"
      - "runs calculations.project_contract_amount_cents to fill contract_amount_cents"
      - "runs calculations.project_data_load_pct to fill required_data_mbps, effective_capacity_mbps, data_load_pct; rejects data_load_pct > 100.00 with ERR_DATA_LOAD_EXCEEDS_CAPACITY"
      - "initialises engineering_state = DRAFT, production_state = NOT_STARTED, service_posture = NORMAL"

  - method: GET
    path: "/projects/{project_id}"
    description: "Read one project with both state dimensions and every derived counter."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: DisplayProject
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects, filterable by model and by either state dimension."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["display_model_id?", "install_environment?", "engineering_state?", "production_state?", "limit?", "offset?"]
    output: DisplayProject[]
    side_effects: []

  - method: POST
    path: "/drawing-revisions"
    description: "Submit a structural engineering drawing revision for a project."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, structural_load_kg_per_sqm, wind_load_kph, mounting_type, service_access_side]
    output: DrawingRevision
    side_effects:
      - "assigns revision_number = count(existing revisions of the project) + 1"
      - "snapshots required_load_kg_per_sqm from the project's DisplayModel"
      - "sets submitted_by_user_id = X-User-ID and revision_state = SUBMITTED"
      - "moves DisplayProject.engineering_state DRAFT|REJECTED -> UNDER_REVIEW and increments DisplayProject.version by 1"

  - method: POST
    path: "/drawing-revisions/{drawing_revision_id}/review"
    description: "Approve or reject a submitted drawing revision. The reviewer may not be the submitter."
    roles: [StructuralReviewer]
    code: 200
    input: [decision, "reason?"]
    output: DrawingRevision
    side_effects:
      - "decision = APPROVE: revision_state = APPROVED, DisplayProject.engineering_state = APPROVED, DisplayProject.approved_revision_number = revision_number"
      - "decision = REJECT: revision_state = REJECTED, rejection_reason = reason, DisplayProject.engineering_state = REJECTED"
      - "sets reviewed_by_user_id = X-User-ID"
      - "increments DrawingRevision.version by 1 and DisplayProject.version by 1"

  - method: GET
    path: "/drawing-revisions/{drawing_revision_id}"
    description: "Read one drawing revision."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: DrawingRevision
    side_effects: []

  - method: GET
    path: "/drawing-revisions"
    description: "List drawing revisions, filterable by project and state."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["project_id?", "revision_state?", "limit?", "offset?"]
    output: DrawingRevision[]
    side_effects: []

  # --- modules --------------------------------------------------------------
  - method: POST
    path: "/modules"
    description: "Register a manufactured LED module against a display model."
    roles: [ProductionOperator]
    code: 201
    input: [display_model_id, serial_no]
    output: Module
    side_effects:
      - "initialises module_state = MANUFACTURED and rework_cycles = 0"
      - "rejects a duplicate serial_no with ERR_MODULE_SERIAL_DUPLICATE"

  - method: POST
    path: "/modules/{module_id}/pixel-test"
    description: "Record a module-level dead-pixel test. Passing advances to PIXEL_TESTED; failing consumes a rework cycle or scraps the module."
    roles: [ProductionOperator]
    code: 200
    input: [dead_pixel_count, max_cluster_size]
    output: Module
    side_effects:
      - "stores dead_pixel_count and max_cluster_size"
      - "runs calculations.module_rework_cycle_accounting on a failing result"
      - "sets module_state to PIXEL_TESTED, REWORK, or SCRAPPED"
      - "increments Module.version by 1"

  - method: POST
    path: "/modules/{module_id}/calibrate"
    description: "Record factory colour calibration. Assigns the colour bin, or reworks/scraps/rejects depending on the chroma band."
    roles: [ProductionOperator]
    code: 200
    input: [measured_brightness_nits, measured_color_x, measured_color_y]
    output: Module
    side_effects:
      - "runs calculations.module_color_bin_assignment to fill color_bin and color_bin_rank"
      - "sets calibrated_by_user_id = X-User-ID on success (feeding the QA segregation-of-duties check)"
      - "runs calculations.module_rework_cycle_accounting when the chroma error lands in the rework band"
      - "rejects chroma error > 0.020 with ERR_CHROMA_OUT_OF_TOLERANCE and stores nothing"
      - "increments Module.version by 1"

  - method: GET
    path: "/modules/{module_id}"
    description: "Read one module with its test results, colour bin, and placement."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: Module
    side_effects: []

  - method: GET
    path: "/modules"
    description: "List modules. The filters are the reverse-reachability channel for every Module foreign key, including the self-referential replacement link."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["display_model_id?", "cabinet_id?", "replaces_module_id?", "reserved_service_contract_id?", "module_state?", "color_bin?", "limit?", "offset?"]
    output: Module[]
    side_effects: []

  # --- cabinets -------------------------------------------------------------
  - method: POST
    path: "/cabinets"
    description: "Plan a cabinet at a grid position of a project's wall."
    roles: [ProductionOperator]
    code: 201
    input: [project_id, grid_row, grid_col]
    output: Cabinet
    side_effects:
      - "initialises cabinet_state = PLANNED, installed_module_count = 0, occupied_slot_indexes = [], total_dead_pixel_count = 0, dead_pixel_ppm = 0.00, baseline_module_ids = []"
      - "rejects a duplicate (project_id, grid_row, grid_col) with ERR_CABINET_POSITION_TAKEN"

  - method: POST
    path: "/cabinets/{cabinet_id}/modules"
    description: "Install a CALIBRATED module into a cabinet slot. Guarded by OCC on the cabinet's version."
    roles: [ProductionOperator]
    code: 201
    input: [module_id, slot_index, expected_cabinet_version]
    output: Module
    side_effects:
      - "sets Module.cabinet_id, Module.slot_index, Module.module_state = INSTALLED"
      - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm (calculations.cabinet_dead_pixel_ppm), as_built_uniformity_score (calculations.cabinet_uniformity_score variant AS_BUILT)"
      - "moves Cabinet PLANNED -> IN_ASSEMBLY on the first module and IN_ASSEMBLY -> POPULATED on the last slot"
      - "moves DisplayProject.production_state NOT_STARTED -> IN_ASSEMBLY on the project's first install"
      - "increments Cabinet.version by 1 and Module.version by 1"

  - method: POST
    path: "/cabinets/{cabinet_id}/module-removals"
    description: "Remove an installed module from a cabinet, returning it to CALIBRATED. The compensating action for an install; guarded by OCC on the cabinet's version."
    roles: [ProductionOperator]
    code: 201
    input: [module_id, expected_cabinet_version]
    output: Module
    side_effects:
      - "clears Module.cabinet_id and Module.slot_index, sets Module.module_state = CALIBRATED"
      - "recomputes Cabinet.installed_module_count, occupied_slot_indexes, total_dead_pixel_count, dead_pixel_ppm, as_built_uniformity_score"
      - "moves Cabinet QUARANTINED -> IN_ASSEMBLY, and DisplayProject BLOCKED -> IN_ASSEMBLY once quarantined_cabinet_count reaches 0"
      - "increments Cabinet.version by 1 and Module.version by 1"

  - method: POST
    path: "/cabinets/{cabinet_id}/qa-approve"
    description: "QA-sign a burn-in-passed cabinet. The approver may not have calibrated any module installed in it."
    roles: [QAEngineer]
    code: 200
    input: []
    output: Cabinet
    side_effects:
      - "sets qa_approved_by_user_id = X-User-ID and cabinet_state = QA_PASSED"
      - "recomputes DisplayProject.qa_passed_cabinet_count and lifts production_state to QA_COMPLETE when it equals cabinet_count"
      - "increments Cabinet.version by 1 and DisplayProject.version by 1"

  - method: POST
    path: "/cabinets/{cabinet_id}/mount"
    description: "Record structural mounting of a QA-passed cabinet on site."
    roles: [FieldEngineer]
    code: 200
    input: []
    output: Cabinet
    side_effects:
      - "sets cabinet_state = MOUNTED"
      - "recomputes DisplayProject.mounted_cabinet_count and lifts production_state to INSTALLED when it equals cabinet_count"
      - "increments Cabinet.version by 1 and DisplayProject.version by 1"

  - method: GET
    path: "/cabinets/{cabinet_id}"
    description: "Read one cabinet with both uniformity scores and its dead-pixel density."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: Cabinet
    side_effects: []

  - method: GET
    path: "/cabinets"
    description: "List cabinets, filterable by project and state."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["project_id?", "cabinet_state?", "limit?", "offset?"]
    output: Cabinet[]
    side_effects: []

  # --- burn-in --------------------------------------------------------------
  - method: POST
    path: "/burn-in-runs"
    description: "Schedule a burn-in soak for a populated cabinet in a chamber."
    roles: [QAEngineer]
    code: 201
    input: [cabinet_id, burn_in_chamber_id, window_start, window_end, slots_required, drive_pct, ambient_c]
    output: BurnInRun
    side_effects:
      - "computes occupied_until = window_end + BurnInChamber.turnaround_minutes"
      - "runs calculations.chamber_slot_occupancy; rejects an aggregate slot overflow with ERR_CHAMBER_CAPACITY_EXCEEDED"
      - "increments BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
      - "moves Cabinet POPULATED -> BURN_IN and increments Cabinet.version by 1"

  - method: POST
    path: "/burn-in-runs/{burn_in_run_id}/complete"
    description: "Record the burn-in result after the soak window has elapsed. Passing freezes the QA baseline; failing quarantines the cabinet and blocks the project."
    roles: [QAEngineer]
    code: 200
    input: [new_dead_pixel_count, measured_brightness_nits, measured_uniformity_pct]
    output: BurnInRun
    side_effects:
      - "stores the measurements, sets completed_by_user_id = X-User-ID, and recomputes cabinet_dead_pixel_ppm per calculations.cabinet_dead_pixel_ppm"
      - "PASS: Cabinet BURN_IN -> BURN_IN_PASSED, freezing baseline_uniformity_score (variant QA_BASELINE) and baseline_module_ids"
      - "FAIL: Cabinet BURN_IN -> QUARANTINED -> DisplayProject.production_state = BLOCKED -> every CommissioningVisit of the project in {SCHEDULED, ON_SITE, CALIBRATED} becomes ABORTED with abort_reason = PROJECT_BLOCKED, decrementing CommissioningCrew.scheduled_visit_count"
      - "decrements BurnInChamber.reserved_slot_total by slots_required and scheduled_run_count by 1"
      - "increments Cabinet.version by 1"

  - method: POST
    path: "/burn-in-runs/{burn_in_run_id}/abort"
    description: "Abort a scheduled burn-in run, releasing the chamber slots and returning the cabinet to POPULATED."
    roles: [QAEngineer]
    code: 200
    input: [reason]
    output: BurnInRun
    side_effects:
      - "sets run_state = ABORTED, abort_reason = reason, completed_by_user_id = X-User-ID"
      - "restores BurnInChamber.reserved_slot_total to its pre-schedule value and decrements scheduled_run_count by 1"
      - "moves Cabinet BURN_IN -> POPULATED and increments Cabinet.version by 1"

  - method: GET
    path: "/burn-in-runs/{burn_in_run_id}"
    description: "Read one burn-in run."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: BurnInRun
    side_effects: []

  - method: GET
    path: "/burn-in-runs"
    description: "List burn-in runs, filterable by cabinet, chamber, and state."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["cabinet_id?", "burn_in_chamber_id?", "run_state?", "limit?", "offset?"]
    output: BurnInRun[]
    side_effects: []

  # --- commissioning --------------------------------------------------------
  - method: POST
    path: "/commissioning-visits"
    description: "Book a commissioning crew into a half-open on-site window for a project."
    roles: [PlantAdmin, FieldEngineer]
    code: 201
    input: [project_id, commissioning_crew_id, window_start, window_end]
    output: CommissioningVisit
    side_effects:
      - "rejects a crew whose region_code differs from the project's site_region_code with ERR_CREW_REGION_MISMATCH"
      - "runs calculations.crew_window_occupancy; rejects any half-open overlap with ERR_CREW_DOUBLE_BOOKED"
      - "initialises visit_state = SCHEDULED and increments CommissioningCrew.scheduled_visit_count by 1"

  - method: POST
    path: "/commissioning-visits/{commissioning_visit_id}/arrive"
    description: "Crew records arrival on site inside the booked window. Requires every cabinet mounted."
    roles: [FieldEngineer]
    code: 200
    input: []
    output: CommissioningVisit
    side_effects:
      - "sets arrived_at = logical clock and visit_state = ON_SITE"
      - "increments CommissioningVisit.version by 1"

  - method: POST
    path: "/commissioning-visits/{commissioning_visit_id}/calibrate"
    description: "Crew records on-site calibration measurements after structural mounting."
    roles: [FieldEngineer]
    code: 200
    input: [measured_brightness_nits, measured_uniformity_pct]
    output: CommissioningVisit
    side_effects:
      - "stores measured_brightness_nits and measured_uniformity_pct"
      - "sets visit_state = CALIBRATED"
      - "increments CommissioningVisit.version by 1"

  - method: POST
    path: "/commissioning-visits/{commissioning_visit_id}/sign-off"
    description: "Crew signs the installation over to the customer, commissioning the project and starting the warranty clock."
    roles: [FieldEngineer]
    code: 200
    input: []
    output: CommissioningVisit
    side_effects:
      - "sets signed_off_at = logical clock and visit_state = SIGNED_OFF"
      - "sets DisplayProject.production_state = COMMISSIONED and increments DisplayProject.version by 1"
      - "every ServiceContract of the project with contract_state == PENDING becomes ACTIVE with warranty_start_at = signed_off_at, incrementing ServiceContract.version by 1"
      - "decrements CommissioningCrew.scheduled_visit_count by 1"

  - method: GET
    path: "/commissioning-visits/{commissioning_visit_id}"
    description: "Read one commissioning visit."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: CommissioningVisit
    side_effects: []

  - method: GET
    path: "/commissioning-visits"
    description: "List commissioning visits, filterable by project, crew, and state."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["project_id?", "commissioning_crew_id?", "visit_state?", "limit?", "offset?"]
    output: CommissioningVisit[]
    side_effects: []

  # --- service contracts and warranty --------------------------------------
  - method: POST
    path: "/service-contracts"
    description: "Sell a service contract against a project: tier, spare holding, term."
    roles: [ServiceManager]
    code: 201
    input: [project_id, tier, spare_pct_bp, term_months]
    output: ServiceContract
    side_effects:
      - "derives response_hours from tier and runs calculations.service_contract_spare_requirement for spare_required_count"
      - "runs calculations.service_contract_annual_fee_cents to fill gross_fee_cents, subtotal_fee_cents, volume_discount_pct, annual_fee_cents"
      - "initialises contract_state = PENDING, spare_reserved_count = 0, sla_breach_count = 0, warranty_start_at = null"
      - "rejects a second contract on the same project with ERR_CONTRACT_ALREADY_EXISTS"

  - method: GET
    path: "/service-contracts/{service_contract_id}"
    description: "Read one service contract with its spare position and SLA breach count."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/service-contracts"
    description: "List service contracts, filterable by project and state."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["project_id?", "contract_state?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/service-contracts/{service_contract_id}/spare-reservations"
    description: "Reserve a CALIBRATED module as a contracted spare. Omit module_id to let the server pick per calculations.spare_module_selector. Guarded by OCC on the contract's version."
    roles: [ServiceManager]
    code: 201
    input: ["module_id?", expected_service_contract_version]
    output: Module
    side_effects:
      - "sets Module.reserved_service_contract_id = the contract id"
      - "increments ServiceContract.spare_reserved_count by 1"
      - "moves ServiceContract SUSPENDED -> ACTIVE when spare_reserved_count reaches spare_required_count and sla_breach_count < 2, clearing DisplayProject.service_posture back to NORMAL"
      - "increments ServiceContract.version by 1 and Module.version by 1"
      - "rejects an empty eligible pool with ERR_NO_ELIGIBLE_SPARE_MODULE"

  - method: POST
    path: "/service-contracts/{service_contract_id}/spare-releases"
    description: "Release a reserved spare back to free stock. The compensating action for a reservation; guarded by OCC on the contract's version."
    roles: [ServiceManager]
    code: 201
    input: [module_id, expected_service_contract_version]
    output: Module
    side_effects:
      - "clears Module.reserved_service_contract_id"
      - "decrements ServiceContract.spare_reserved_count by 1"
      - "moves ServiceContract ACTIVE -> SUSPENDED when spare_reserved_count falls below spare_required_count, setting DisplayProject.service_posture = AT_RISK"
      - "increments ServiceContract.version by 1 and Module.version by 1"
      - "rejects a module not reserved to this contract with ERR_SPARE_NOT_RESERVED"

  - method: POST
    path: "/service-cases"
    description: "Open a service case against an active contract: a module fault or a brightness-degradation warranty claim."
    roles: [ServiceManager]
    code: 201
    input: [service_contract_id, cabinet_id, case_type, severity, symptom, "faulty_module_id?", "measured_brightness_nits?"]
    output: ServiceCase
    side_effects:
      - "sets reported_at = logical clock and case_state = OPEN"
      - "runs calculations.case_response_deadline to fill response_deadline_at"
      - "requires faulty_module_id for MODULE_FAULT and measured_brightness_nits for BRIGHTNESS_DEGRADATION, else ERR_MEASUREMENT_REQUIRED"

  - method: POST
    path: "/service-cases/{service_case_id}/respond"
    description: "Record the on-site response. Late responses breach the SLA and can suspend the contract."
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceCase
    side_effects:
      - "sets responded_at = logical clock, case_state = RESPONDED, and response_breached = (responded_at > response_deadline_at)"
      - "on a breach: increments ServiceContract.sla_breach_count by 1, and at 2 breaches moves the contract ACTIVE -> SUSPENDED and sets DisplayProject.service_posture = AT_RISK"
      - "increments ServiceCase.version by 1"

  - method: POST
    path: "/service-cases/{service_case_id}/assess"
    description: "Approve or deny the case. Approval computes the warranty credit under the chosen basis and pins the module to be replaced."
    roles: [ServiceManager]
    code: 200
    input: [decision, "assessment_basis?", "denial_reason?"]
    output: ServiceCase
    side_effects:
      - "APPROVE: computes elapsed_warranty_months, allowed_degradation_pct, degradation_pct, shortfall_pct and credit_cents per calculations.case_warranty_credit_cents under the requested assessment_basis"
      - "APPROVE: pins resolved_faulty_module_id (case.faulty_module_id for MODULE_FAULT, else calculations.faulty_module_selector)"
      - "DENY: sets denial_reason, credit_cents = 0, assessment_basis = null, and leaves resolved_faulty_module_id null"
      - "rejects shortfall_pct == 0.00 on a BRIGHTNESS_DEGRADATION approval with ERR_DEGRADATION_WITHIN_ALLOWANCE"
      - "increments ServiceCase.version by 1"

  - method: POST
    path: "/service-cases/{service_case_id}/fulfil"
    description: "Swap the faulty module for a colour-matched contracted spare. Omit replacement_module_id to let the server pick per calculations.spare_module_selector. Guarded by OCC on the cabinet's version."
    roles: [ServiceManager]
    code: 200
    input: ["replacement_module_id?", expected_cabinet_version]
    output: ServiceCase
    side_effects:
      - "sets replacement_module_id and case_state = FULFILLED"
      - "the resolved faulty Module moves INSTALLED -> RETURNED and releases its slot_index"
      - "the replacement Module moves CALIBRATED -> INSTALLED into that slot_index with replaces_module_id set and reserved_service_contract_id cleared"
      - "decrements ServiceContract.spare_reserved_count by 1; when it falls below spare_required_count the contract moves ACTIVE -> SUSPENDED and DisplayProject.service_posture becomes AT_RISK"
      - "recomputes Cabinet.total_dead_pixel_count, dead_pixel_ppm, and as_built_uniformity_score (variant AS_BUILT), leaving baseline_uniformity_score untouched"
      - "rejects a colour-bin rank gap > 1 with ERR_COLOR_BIN_MISMATCH and an unreserved spare with ERR_SPARE_NOT_RESERVED"
      - "increments Cabinet.version by 1, ServiceCase.version by 1, and Module.version by 1 on both modules"

  - method: GET
    path: "/service-cases/{service_case_id}"
    description: "Read one service case with its deadline, breach flag, credit, and module links."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: []
    output: ServiceCase
    side_effects: []

  - method: GET
    path: "/service-cases"
    description: "List service cases. The filters are the reverse-reachability channel for every ServiceCase foreign key, including the two server-pinned module links."
    roles: [PlantAdmin, DesignEngineer, StructuralReviewer, ProductionOperator, QAEngineer, FieldEngineer, ServiceManager]
    code: 200
    input: ["service_contract_id?", "cabinet_id?", "faulty_module_id?", "resolved_faulty_module_id?", "replacement_module_id?", "case_type?", "case_state?", "limit?", "offset?"]
    output: ServiceCase[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog — 54 codes, every one triggerable through §1.5
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The authenticated role is not listed in the target endpoint's roles"
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Malformed request: missing required field, wrong JSON type, unknown enum member, out-of-range number, window_end <= window_start, limit outside 1..100, negative offset, or a DisplayModel geometry whose modules_per_cabinet contradicts its dimensions"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A referenced DisplayModel, BurnInChamber, or CommissioningCrew id does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "A referenced DisplayProject id does not exist"
  - id: ERR_REVISION_NOT_FOUND
    http: 404
    condition: "A referenced DrawingRevision id does not exist"
  - id: ERR_CABINET_NOT_FOUND
    http: 404
    condition: "A referenced Cabinet id does not exist"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "A referenced Module id does not exist"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "A referenced BurnInRun id does not exist"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "A referenced CommissioningVisit id does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "A referenced ServiceContract id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "A referenced ServiceCase id does not exist"
  - id: ERR_CREW_NOT_ASSIGNED
    http: 403
    condition: "A FieldEngineer's X-User-ID is not the visit's commissioning_crew_id"
  - id: ERR_STALE_CABINET_VERSION
    http: 412
    condition: "expected_cabinet_version does not equal the cabinet's current version"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_service_contract_version does not equal the contract's current version"
  - id: ERR_INVALID_REVISION_STATE
    http: 409
    condition: "Reviewing a DrawingRevision whose revision_state is not SUBMITTED"
  - id: ERR_ENGINEERING_ALREADY_APPROVED
    http: 409
    condition: "Submitting a further DrawingRevision on a project whose engineering_state is already APPROVED"
  - id: ERR_ENGINEERING_NOT_APPROVED
    http: 409
    condition: "Installing a module or mounting a cabinet while the project's engineering_state is not APPROVED"
  - id: ERR_INVALID_MODULE_STATE
    http: 409
    condition: "The module's module_state does not permit the requested operation"
  - id: ERR_INVALID_CABINET_STATE
    http: 409
    condition: "The cabinet's cabinet_state does not permit the requested operation"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "Completing or aborting a BurnInRun whose run_state is not SCHEDULED"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "The visit's visit_state does not permit arrive / calibrate / sign-off"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "The case's case_state does not permit respond / assess / fulfil"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Acting on a ServiceCase while its ServiceContract is PENDING or SUSPENDED"
  - id: ERR_CABINETS_NOT_MOUNTED
    http: 409
    condition: "Arriving on site or signing off while the project's production_state is not INSTALLED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The drawing reviewer is the submitter, or the QA approver calibrated a module installed in the cabinet"
  - id: ERR_WIND_LOAD_INSUFFICIENT
    http: 422
    condition: "The drawing's wind_load_kph is below the environment minimum (STADIUM 160, ROADSIDE 200, RETAIL 100)"
  - id: ERR_STRUCTURAL_CAPACITY_INSUFFICIENT
    http: 422
    condition: "The drawing's structural_load_kg_per_sqm is below DisplayModel.required_load_kg_per_sqm"
  - id: ERR_VIEWING_DISTANCE_TOO_SHORT
    http: 422
    condition: "The project's min_viewing_distance_m is below the model's recommended_min_viewing_distance_m"
  - id: ERR_REDUNDANCY_REQUIRED_FOR_ROADSIDE
    http: 422
    condition: "A ROADSIDE project declares redundancy_mode = NONE"
  - id: ERR_DRIVE_LEVEL_UNSAFE
    http: 422
    condition: "The run's drive_pct exceeds the model's max_drive_pct or the chamber's certified_max_drive_pct"
  - id: ERR_BURN_IN_DURATION_TOO_SHORT
    http: 422
    condition: "The soak window is shorter than DisplayModel.burn_in_hours_required"
  - id: ERR_BURN_IN_WINDOW_NOT_ELAPSED
    http: 409
    condition: "Completing a run while the logical clock is still before its window_end"
  - id: ERR_VISIT_WINDOW_NOT_CURRENT
    http: 409
    condition: "Arriving while the logical clock is outside the half-open window [window_start, window_end)"
  - id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate slots of overlapping SCHEDULED runs plus this run exceed the chamber's slot_capacity over the closed, turnaround-extended interval"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "The crew already holds a live visit whose half-open window overlaps the requested one"
  - id: ERR_CREW_REGION_MISMATCH
    http: 422
    condition: "The crew's region_code differs from the project's site_region_code"
  - id: ERR_MODULE_MODEL_MISMATCH
    http: 422
    condition: "The module's display_model_id differs from the cabinet's project display_model_id"
  - id: ERR_MODULE_GRID_MISMATCH
    http: 422
    condition: "The cabinet does not belong to the contract's project, or the nominated faulty module is not installed in that cabinet"
  - id: ERR_OPEN_REVISION_EXISTS
    http: 409
    condition: "A DrawingRevision of the project is still SUBMITTED"
  - id: ERR_CONTRACT_ALREADY_EXISTS
    http: 409
    condition: "The project already has a ServiceContract"
  - id: ERR_CABINET_POSITION_TAKEN
    http: 409
    condition: "The (project_id, grid_row, grid_col) position is already occupied, or the position lies outside the declared grid"
  - id: ERR_MODULE_SERIAL_DUPLICATE
    http: 409
    condition: "Another Module already carries the requested serial_no"
  - id: ERR_CABINET_SLOT_OCCUPIED
    http: 409
    condition: "The requested slot_index is already in the cabinet's occupied_slot_indexes, or is outside 1..modules_per_cabinet"
  - id: ERR_MODULE_RESERVED_AS_SPARE
    http: 409
    condition: "Installing a module that is held as a contracted spare (reserved_service_contract_id is set)"
  - id: ERR_CHROMA_OUT_OF_TOLERANCE
    http: 422
    condition: "The calibration chroma error exceeds CHROMA_REWORK_TOLERANCE (0.020); the module is not reworkable and nothing is stored"
  - id: ERR_MEASUREMENT_REQUIRED
    http: 422
    condition: "A BRIGHTNESS_DEGRADATION case omits measured_brightness_nits, or a MODULE_FAULT case omits faulty_module_id"
  - id: ERR_DEGRADATION_WITHIN_ALLOWANCE
    http: 422
    condition: "Approving a BRIGHTNESS_DEGRADATION case whose shortfall_pct is exactly 0.00 — the panel is still inside the guaranteed curve"
  - id: ERR_NO_REPLACEABLE_MODULE
    http: 409
    condition: "The case's cabinet holds no Module with module_state == INSTALLED"
  - id: ERR_SPARE_NOT_RESERVED
    http: 409
    condition: "The nominated module is not reserved to this ServiceContract"
  - id: ERR_COLOR_BIN_MISMATCH
    http: 422
    condition: "The replacement module's colour-bin rank differs from the outgoing module's by more than COLOR_BIN_RANK_TOLERANCE (1)"
  - id: ERR_NO_ELIGIBLE_SPARE_MODULE
    http: 409
    condition: "The eligibility-filtered spare pool is empty for a reservation or a warranty swap"
  - id: ERR_DATA_LOAD_EXCEEDS_CAPACITY
    http: 422
    condition: "The project's data_load_pct exceeds 100.00 after the redundancy derate and the player-throughput min"
  - id: ERR_SPARE_PCT_BELOW_MINIMUM
    http: 422
    condition: "The contract's spare_pct_bp is below the tier minimum (BRONZE 100, SILVER 200, GOLD 300)"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant systems administrator: seeds the catalogue (display models, chambers, crews) and drives the logical clock. Cannot touch engineering, production, QA, or service workflows."
    identity: "opaque"
    exclusive_operations:
      - "POST /display-models"
      - "POST /burn-in-chambers"
      - "POST /commissioning-crews"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /commissioning-visits (shared with FieldEngineer)"
      - "every GET read endpoint"

  - name: DesignEngineer
    description: "Specifies the display and submits structural drawing revisions. May never review its own submission."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects"
      - "POST /drawing-revisions"
    shared_operations:
      - "every GET read endpoint"

  - name: StructuralReviewer
    description: "Independent structural reviewer who approves or rejects drawing revisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /drawing-revisions/{drawing_revision_id}/review"
    shared_operations:
      - "every GET read endpoint"

  - name: ProductionOperator
    description: "Manufactures, pixel-tests, and colour-calibrates modules, plans cabinets, and installs or removes modules. The calibrating operator's id is recorded and blocks that same id from QA-approving the cabinet."
    identity: "opaque"
    exclusive_operations:
      - "POST /modules"
      - "POST /modules/{module_id}/pixel-test"
      - "POST /modules/{module_id}/calibrate"
      - "POST /cabinets"
      - "POST /cabinets/{cabinet_id}/modules"
      - "POST /cabinets/{cabinet_id}/module-removals"
    shared_operations:
      - "every GET read endpoint"

  - name: QAEngineer
    description: "Schedules and adjudicates burn-in runs and QA-signs cabinets. May not QA-approve a cabinet containing a module it calibrated as a ProductionOperator id."
    identity: "opaque"
    exclusive_operations:
      - "POST /burn-in-runs"
      - "POST /burn-in-runs/{burn_in_run_id}/complete"
      - "POST /burn-in-runs/{burn_in_run_id}/abort"
      - "POST /cabinets/{cabinet_id}/qa-approve"
    shared_operations:
      - "every GET read endpoint"

  - name: FieldEngineer
    description: "Acts as a specific commissioning crew on site: mounts cabinets, arrives, calibrates, and signs off. X-User-ID MUST equal the CommissioningCrew id, and for visit actions it must equal the visit's commissioning_crew_id."
    identity: "entity_backed:CommissioningCrew"
    exclusive_operations:
      - "POST /cabinets/{cabinet_id}/mount"
      - "POST /commissioning-visits/{commissioning_visit_id}/arrive"
      - "POST /commissioning-visits/{commissioning_visit_id}/calibrate"
      - "POST /commissioning-visits/{commissioning_visit_id}/sign-off"
    shared_operations:
      - "POST /commissioning-visits (shared with PlantAdmin)"
      - "every GET read endpoint"

  - name: ServiceManager
    description: "Sells service contracts, manages the spare module pool, and runs warranty cases end to end."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-contracts"
      - "POST /service-contracts/{service_contract_id}/spare-reservations"
      - "POST /service-contracts/{service_contract_id}/spare-releases"
      - "POST /service-cases"
      - "POST /service-cases/{service_case_id}/respond"
      - "POST /service-cases/{service_case_id}/assess"
      - "POST /service-cases/{service_case_id}/fulfil"
    shared_operations:
      - "every GET read endpoint"
