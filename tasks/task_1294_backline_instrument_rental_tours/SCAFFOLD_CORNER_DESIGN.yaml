scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation/retrieval/default/computed/not-found claims
  # ===========================================================================
  - section: entities
    instances:
      - name: artist_creation_defaults_and_retrieval
        claim_type: creation_defaults
        grounds:
          - entities.Artist.fields.tier
          - entities.Artist.fields.deposit_waived
          - entities.Artist.fields.deposit_credit_cents
        distinguishing_aspect: "Omitting tier and deposit_waived yields STANDARD/false; computed deposit_credit_cents starts 0 and risk_score starts 0; input-supplied computed fields are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Defaults Band" }
              as: OpsManager
              captures: { da: $.data.id }
          trigger:
            - call: "GET /backline/artists/${da}"
              as: OpsManager
          assert:
            - "Artist.${da}.tier == STANDARD"
            - "Artist.${da}.deposit_waived == false"
            - "Artist.${da}.deposit_credit_cents == 0"
            - "Artist.${da}.risk_score == 0"
            - "Artist.${da}.version == 1"

      - name: gear_unit_computed_flight_case_flag
        claim_type: computed_field
        grounds:
          - entities.GearUnit.fields.flight_case_required
          - entities.GearModel.fields.weight_class
        distinguishing_aspect: "flight_case_required derives from model weight_class: HEAVY/OVERSIZE -> true; HAND_CARRY/STANDARD -> false; client-supplied value ignored."
        test_recipe:
          setup: ["two models, one HEAVY one HAND_CARRY"]
          setup_api_calls:
            - call: "POST /backline/gear-models"
              payload: { sku: "EN-HV-1", category: "PA", daily_rate_cents: 50000, replacement_value_cents: 500000, weight_class: "HEAVY" }
              as: OpsManager
              captures: { hm: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "EN-HC-1", category: "GUITAR", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { hm2: $.data.id }
          trigger:
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${hm}", serial_number: "EN-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { hu: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${hm2}", serial_number: "EN-U2", home_city_code: "LAX" }
              as: OpsManager
              captures: { hu2: $.data.id }
          assert:
            - "GearUnit.${hu}.flight_case_required == true"
            - "GearUnit.${hu2}.flight_case_required == false"
            - "GearUnit.${hu}.condition_score == 100 and rental_days_since_service == 0"

      - name: tour_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent UUID yields ERR_NOT_FOUND 404 with error envelope shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /backline/tours/00000000-0000-0000-0000-000000000000"
              as: TourManager
              captures: { nf_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: gear_model_sku_uniqueness
        claim_type: type_constraint
        grounds:
          - entities.GearModel.fields.sku
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second model with same sku rejected ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one model with sku UNQ-1 exists"]
          setup_api_calls:
            - call: "POST /backline/gear-models"
              payload: { sku: "UNQ-1", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 5000, weight_class: "STANDARD" }
              as: OpsManager
          trigger:
            - call: "POST /backline/gear-models"
              payload: { sku: "UNQ-1", category: "AMP", daily_rate_cents: 2000, replacement_value_cents: 6000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { dup_err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE, http 409"

      - name: tour_stop_count_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.Tour.fields.stop_count]
        distinguishing_aspect: "stop_count increments on each stop create: 0 -> 1 -> 2 observable on parent Tour read."
        test_recipe:
          setup: ["tour DRAFT"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Count Act" }
              as: OpsManager
              captures: { cnta: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${cnta}", name: "Count Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { cntt: $.data.id }
          trigger:
            - call: "POST /backline/tours/${cntt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
            - call: "POST /backline/tours/${cntt}/stops"
              payload: { city_code: "NYC", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
            - call: "GET /backline/tours/${cntt}"
              as: TourManager
              captures: { cnt: $.data.stop_count }
          assert:
            - "Tour.${cntt}.stop_count == 2"

  # ===========================================================================
  # Section: state_machines — valid/invalid/terminal/precondition claims
  # ===========================================================================
  - section: state_machines
    instances:
      - name: tour_complete_blocked_by_open_claim
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Tour.ACTIVE_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Tour cannot complete while any DamageClaim on its reservations is FILED/ASSESSED/DISPUTED — terminal lockdown of completion gate."
        test_recipe:
          setup:
            - "ACTIVE tour, stop LOADED_OUT... simplified: reservation INSPECTED but claim still ASSESSED (not charged/waived)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Block Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { ba: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "BK-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { bm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${bm}", serial_number: "BK-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { bu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ba}", name: "Block Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { bt: $.data.id }
            - call: "POST /backline/tours/${bt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-06T00:00:00Z", load_in_ts: "2026-08-06T10:00:00Z" }
              as: TourManager
              captures: { bs: $.data.id }
            - call: "POST /backline/tour-stops/${bs}/rider-lines"
              payload: { gear_model_id: "${bm}", quantity: 1 }
              as: TourManager
              captures: { brl: $.data.id }
            - call: "POST /backline/rider-lines/${brl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { br: $.data.id }
            - call: "GET /backline/tours/${bt}"
              as: TourManager
              captures: { bt_v: $.data.version }
            - call: "POST /backline/tours/${bt}/activate"
              payload: { expected_tour_version: "${bt_v}" }
              as: TourManager
            - call: "POST /backline/shipments"
              payload: { tour_id: "${bt}", from_city_code: "LAX", to_city_code: "LAX", ship_date: "2026-08-05T00:00:00Z", capacity_kg: 100 }
              as: LogisticsCoordinator
              captures: { bsh: $.data.id }
            - call: "POST /backline/shipments/${bsh}/lines"
              payload: { gear_unit_id: "${bu}", weight_kg: 5, labor_minutes: 5 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${br}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${br}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${br}/check-in"
              payload: { checked_in_at: "2026-08-07T09:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${br}/inspect"
              payload: { damage_present: true, assessed_severity: "COSMETIC", repair_estimate_cents: 1000 }
              as: WarehouseTech
            - call: "GET /backline/damage-claims"
              payload: { reservation_line_id: "${br}" }
              as: OpsManager
              captures: { bdc: "$.data[0].id" }
            - call: "POST /backline/damage-claims/${bdc}/assess"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /backline/tours/${bt}/complete"
              payload: {}
              as: TourManager
              captures: { comp_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (open ASSESSED claim blocks completion)"

      - name: terminal_state_lockdown_retired_unit
        claim_type: terminal_lockdown
        grounds:
          - state_machines.GearUnit.AVAILABLE_to_RETIRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RETIRED is terminal: any further transition attempt (e.g. sourcing against it) fails; unit never leaves RETIRED."
        test_recipe:
          setup: ["unit retired"]
          setup_api_calls:
            - call: "POST /backline/gear-models"
              payload: { sku: "TL-GTR-1", category: "GUITAR", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { tm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${tm}", serial_number: "TL-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { tu: $.data.id }
            - call: "POST /backline/gear-units/${tu}/retire"
              payload: {}
              as: OpsManager
            - call: "POST /backline/artists"
              payload: { legal_name: "Terminal Act" }
              as: OpsManager
              captures: { ta: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ta}", name: "Terminal Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { tt: $.data.id }
            - call: "POST /backline/tours/${tt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { ts: $.data.id }
            - call: "POST /backline/tour-stops/${ts}/rider-lines"
              payload: { gear_model_id: "${tm}", quantity: 1 }
              as: TourManager
              captures: { trl: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${trl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term_err: $.data.error_id }
          assert:
            - "error_id == ERR_GEAR_UNAVAILABLE (RETIRED unit excluded from candidate set; with no other unit, empty-pool fallback)"

      - name: rider_line_invalid_transition_requested_to_fulfilled
        claim_type: invalid_transition
        grounds: [state_machines.RiderLine]
        distinguishing_aspect: "REQUESTED -> FULFILLED is not a declared transition; must fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["rider line in REQUESTED"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "IT Act" }
              as: OpsManager
              captures: { ia: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "IT-BASS-1", category: "BASS", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { im: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ia}", name: "IT Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { it: $.data.id }
            - call: "POST /backline/tours/${it}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { is1: $.data.id }
            - call: "POST /backline/tour-stops/${is1}/rider-lines"
              payload: { gear_model_id: "${im}", quantity: 1 }
              as: TourManager
              captures: { irl: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${irl}/mark-fulfilled"
              payload: {}
              as: WarehouseTech
              captures: { it_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: shipment_line_capacity_enforced_at_load
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=11]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Loading a line whose weight would push booked_weight_kg over capacity_kg fails ERR_CAPACITY_EXCEEDED; equal-to-capacity is permitted (<= pinned)."
        test_recipe:
          setup: ["shipment capacity 50kg; two lines booked: 40kg and 11kg; shipment LOADING"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Cap Act" }
              as: OpsManager
              captures: { ca: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "CP-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { cm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm}", serial_number: "CP-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { cu1: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm}", serial_number: "CP-U2", home_city_code: "LAX" }
              as: OpsManager
              captures: { cu2: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ca}", name: "Cap Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { ct: $.data.id }
            - call: "POST /backline/shipments"
              payload: { tour_id: "${ct}", from_city_code: "LAX", to_city_code: "NYC", ship_date: "2026-08-09T00:00:00Z", capacity_kg: 50 }
              as: LogisticsCoordinator
              captures: { csh: $.data.id }
            - call: "POST /backline/shipments/${csh}/lines"
              payload: { gear_unit_id: "${cu1}", weight_kg: 40, labor_minutes: 10 }
              as: LogisticsCoordinator
              captures: { csl1: $.data.id }
            - call: "POST /backline/shipments/${csh}/lines"
              payload: { gear_unit_id: "${cu2}", weight_kg: 11, labor_minutes: 10 }
              as: LogisticsCoordinator
              captures: { csl2: $.data.id }
            - call: "POST /backline/shipments/${csh}/begin-loading"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/shipment-lines/${csl1}/load"
              payload: {}
              as: WarehouseTech
          trigger:
            - call: "POST /backline/shipment-lines/${csl2}/load"
              payload: {}
              as: WarehouseTech
              captures: { cap_err: $.data.error_id }
          assert:
            - "error_id == ERR_CAPACITY_EXCEEDED (40 + 11 > 50; boundary: 40 + 10 would be allowed)"

  # ===========================================================================
  # Section: calculations — correct result / boundary / input-set filtering
  # ===========================================================================
  - section: calculations
    instances:
      - name: fee_calculation_correct_result_excluded
        claim_type: correct_result
        grounds: [calculations.rental_fee_quote]
        excluded_because:
          difficulty_instance: rental_fee_quote_multi_input_nonlinear
          rationale: "Quoted-fee correctness asserted with literal 625000 in the named §1.8 instance."

      - name: deposit_tier_boundaries
        claim_type: constants_applied
        grounds: [calculations.deposit_hold_rule]
        distinguishing_aspect: "Tier boundary exactness: rv == 200000 -> 40000 (tier1 only); rv == 500000 -> 85000 (tier1+tier2); rv == 500001 -> 85000 + 0.10 (round 85000.1 -> 85000)."
        test_recipe:
          setup: ["three models with rv 200000, 500000, 500001; source one reservation per model"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Tier Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ta: $.data.id }
            - call: "POST /backline/artists/${ta}/deposit-topups"
              payload: { amount_cents: 210000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "TR-A", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 200000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { tmA: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "TR-B", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 500000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { tmB: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "TR-C", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 500001, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { tmC: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${tmA}", serial_number: "TR-UA", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${tmB}", serial_number: "TR-UB", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${tmC}", serial_number: "TR-UC", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${ta}", name: "Tier Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-T" }
              as: TourManager
              captures: { tt: $.data.id }
            - call: "POST /backline/tours/${tt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { ts: $.data.id }
            - call: "POST /backline/tour-stops/${ts}/rider-lines"
              payload: { gear_model_id: "${tmA}", quantity: 1 }
              as: TourManager
              captures: { trlA: $.data.id }
            - call: "POST /backline/tour-stops/${ts}/rider-lines"
              payload: { gear_model_id: "${tmB}", quantity: 1 }
              as: TourManager
              captures: { trlB: $.data.id }
            - call: "POST /backline/tour-stops/${ts}/rider-lines"
              payload: { gear_model_id: "${tmC}", quantity: 1 }
              as: TourManager
              captures: { trlC: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${trlA}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { trA: $.data.id, heldA: $.data.deposit_held_cents }
            - call: "POST /backline/rider-lines/${trlB}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { trB: $.data.id, heldB: $.data.deposit_held_cents }
            - call: "POST /backline/rider-lines/${trlC}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { trC: $.data.id, heldC: $.data.deposit_held_cents }
          assert:
            - "ReservationLine.${trA}.deposit_held_cents == 40000"
            - "ReservationLine.${trB}.deposit_held_cents == 85000"
            - "ReservationLine.${trC}.deposit_held_cents == 85000 (0.10 * 1 cent rounds down under round_half_up: 85000.1 -> 85000)"

      - name: risk_score_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.artist_risk_score]
        distinguishing_aspect: "Only claims in {ASSESSED, CHARGED, DISPUTED, PAID} within trailing 365 days count; a WAIVED claim contributes 0 — risk_score unchanged after waiving an assessed MAJOR claim? No: WAIVED claims exit the input set, so risk recomputes down from 24 to 0."
        test_recipe:
          setup:
            - "Artist with one MAJOR claim assessed (risk 24); OpsManager then waives it"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Filter Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { fa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "FL-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { fm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${fm}", serial_number: "FL-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { fu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${fa}", name: "Filter Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { ft: $.data.id }
            - call: "POST /backline/tours/${ft}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-06T00:00:00Z", load_in_ts: "2026-08-06T10:00:00Z" }
              as: TourManager
              captures: { fs: $.data.id }
            - call: "POST /backline/tour-stops/${fs}/rider-lines"
              payload: { gear_model_id: "${fm}", quantity: 1 }
              as: TourManager
              captures: { frl: $.data.id }
            - call: "POST /backline/rider-lines/${frl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { fr: $.data.id }
            - call: "GET /backline/tours/${ft}"
              as: TourManager
              captures: { ft_v: $.data.version }
            - call: "POST /backline/tours/${ft}/activate"
