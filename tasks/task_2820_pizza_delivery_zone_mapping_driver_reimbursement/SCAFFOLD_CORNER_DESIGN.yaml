        assert: ['HTTP 409 with ${err_id} == ''ERR_NO_ACTIVE_ZONE_VERSION''', 'ZoneVersion.${zv1_id}.status is still ''DRAFT''', 'GET /store-ops/service-addresses?store_id=${store_id} reports total_count 0', 'after POST /store-ops/zone-versions/${zv1_id}/activate the identical request succeeds with zone_state ''IN_ZONE''']
    - name: clearing_an_out_of_area_order_is_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_18, errors.ERR_ADDRESS_OUT_OF_AREA, state_machines.Order.fulfillment_status.PLACED_to_ZONE_CLEARED]
      distinguishing_aspect: 'An order to an address 26.67 grid miles north of the ring is accepted and priced at creation but cannot pass the zone gate: CLEAR fails with ERR_ADDRESS_OUT_OF_AREA (422) and the order stays PLACED, so the store must HOLD, DECLINE or redirect it instead.'
