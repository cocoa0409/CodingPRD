            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_comm_id}", imaging_study_id: "${k_img_comm_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_comm_v2}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_enc_c1_id: $.data.id, k_enc_c1_pa: $.data.prior_authorization_id }
            - call: "POST /injection-encounters/${k_enc_c1_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 16 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
