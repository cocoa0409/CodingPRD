          ForecastDay must be PUBLISHED before any ShiftRoster may reference it, so the byte-identical
          create request flips from ERR_FORECAST_NOT_PUBLISHED to HTTP 201 purely because the parent
          forecast moved DRAFT -> PUBLISHED.
