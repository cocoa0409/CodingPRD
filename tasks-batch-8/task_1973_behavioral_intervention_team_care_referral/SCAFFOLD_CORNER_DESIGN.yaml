          assert:
            - "error_id == ERR_STALE_CASE_VERSION (HTTP 412): ${cv2} predates the assign-manager version bump"

      - name: grant_expiry_sweep_blocks_read
        claim_type: scheduled_action_sweep
        grounds:
          - "state_machines.DisclosureGrant.APPROVED_to_EXPIRED"
          - "validations[priority=6]"
        distinguishing_aspect: "An APPROVED grant lapses exactly at expires_at (EXPIRED when now >= expires_at); a read that was authorized before the boundary is denied after it."
        test_recipe:
          setup: ["staff chair/cm/rep/po; student s1; case c1 INTAKE; FULL_RECORD grant to FACULTY_AFFAIRS [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) APPROVED"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Privacy One", office: PRIVACY_OFFICE }, as: SystemAdmin, captures: { po: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0037", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: FACULTY_AFFAIRS, scope: FULL_RECORD, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-08-03T00:00:00Z", purpose: "faculty briefing" }, as: CaseManager, as_user_id: "${cm}", captures: { g1: $.data.id } }
            - { call: "POST /bit/disclosure-grants/${g1}/approve", as: PrivacyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "GET /bit/care-cases/${c1}", as: Reporter, as_user_id: "${rep}", captures: { v_mgr: $.data.assigned_case_manager_id } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /bit/disclosure-grants/${g1}", as: PrivacyOfficer, as_user_id: "${po}", captures: { g1_status: $.data.status } }
            - { call: "GET /bit/care-cases/${c1}", as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "before expiry: 200 full view — data.assigned_case_manager_id == ${cm} (FULL_RECORD scope)"
            - "at now == expires_at exactly: DisclosureGrant.${g1}.status == EXPIRED (boundary is >=, half-open)"
            - "after expiry: Reporter read denied with error_id == ERR_PRIVACY_SCOPE_INSUFFICIENT (HTTP 403)"

  # ============================================================ consistency model
  - section: consistency_model
