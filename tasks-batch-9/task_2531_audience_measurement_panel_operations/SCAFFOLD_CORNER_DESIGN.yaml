          assert:
            - "Setup call 4: HTTP 200 - the RECRUITED -> RETIRED edge exists and needs no install or enumeration"
            - "Trigger call 1: HTTP 409 with ${e23a} == ERR_HOUSEHOLD_ALREADY_RETIRED (validation priority 66)"
            - "Trigger call 2: HTTP 409 with ${e23b} == ERR_HOUSEHOLD_NOT_ACCEPTING_METERS (priority 14) and serial MT-002024 is NOT consumed - a later meter may still claim it"
            - "Trigger call 3: HTTP 409 with ${e23c} == ERR_HOUSEHOLD_NOT_ENUMERABLE (priority 20), which outranks the missing-tuner check at priority 21"
            - "Trigger call 4: HTTP 409 with ${e23d} == ERR_HOUSEHOLD_NOT_ACTIVE (priority 64)"
            - "GET /households/${h23_id} still reports status RETIRED, enumeration_count 0 and incentive_accrued_cents 0"

      - name: enumeration_after_tuner_removal_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority 21]
          - endpoints[POST /meters/{meter_id}/removals]
          - state_machines.Household.transitions.INSTALL_SCHEDULED_to_ENUM_PENDING
        distinguishing_aspect: "The household is in an enumerable status (ENUM_PENDING) yet owns no INSTALLED TV_TUNER, because the tuner was removed while the household was still out of tab - the only state in which priority 21 can be reached ahead of priority 20."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-624, RANK 124, T 2, B 1000, BUDGET 500000; one household whose TV_TUNER MT-002025 is install-confirmed (household ENUM_PENDING) and then removed."
