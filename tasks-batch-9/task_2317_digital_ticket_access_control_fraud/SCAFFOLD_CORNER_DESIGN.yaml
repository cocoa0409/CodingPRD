            - "ScanSession.${s1_id}.closed_at is still 2026-09-12T18:12:00Z after the refused replay, and its version did not change"

      - name: transfer_request_decline_is_terminal_so_a_later_accept_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[TransferRequest].terminal_states
