scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: completeness_provisional_vs_final_on_property
    grounds:
    - calculations.weighted_completeness_score
    - state_machines.Property.RESEARCHING_to_VERIFIED
    - entities.Property.fields.completeness_pct
    distinguishing_aspect: For the same three verified PropertyAttribute rows, the provisional variant returns 73.13 and the final variant returns 33.13 — a 40.00 point divergence caused by the two stale-sourced attributes being valued at 0.6 provisionally and 0.0 once published.
    test_recipe:
      setup:
      - Logical clock at 2026-03-01T00:00:00Z. A DATA_PROVIDER organization with one RESEARCH_ANALYST assigned to TX-DALLAS.
      - 'Property 1400 Ross Ave (OFFICE, CLASS_A, 120000 sqft, TX-DALLAS) holding three SourceDocuments: a DEED obtained 2026-02-20 (9 days old, fresh), a DIRECT_CONTACT obtained 2025-07-01 (243 days old, stale) and a REGISTRY_LISTING obtained 2025-07-15 (229 days old, stale).'
      - 'Three PropertyAttribute rows on that property, all VERIFIED: tenant_name sourced from the fresh DEED, occupancy_pct sourced from the stale DIRECT_CONTACT and enumeration_pct sourced from the stale REGISTRY_LISTING. Property.stale_source_count == 2.'
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-03-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /data-research/organizations
        payload:
          legal_name: Tarrant Field Research LLC
          org_type: DATA_PROVIDER
          home_market: TX-DALLAS
          service_tier: ENTERPRISE
        as: PlatformAdmin
        captures:
          org_dp: $.data.id
      - call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: dana.reyes@tarrantresearch.example
          full_name: Dana Reyes
          role: RESEARCH_ANALYST
          assigned_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          analyst_tx: $.data.id
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_A
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_ross: $.data.id
      - call: POST /data-research/properties/${prop_ross}/source-documents
        payload:
          source_type: DEED
          source_name: Dallas County Clerk
          contact_method: RECORDS_REQUEST
          obtained_at: '2026-02-20T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_fresh: $.data.id
      - call: POST /data-research/properties/${prop_ross}/source-documents
        payload:
          source_type: DIRECT_CONTACT
          source_name: Building engineer walk-through
          contact_method: SITE_VISIT
          obtained_at: '2025-07-01T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_stale: $.data.id
      - call: POST /data-research/properties/${prop_ross}/attributes
        payload:
          source_document_id: ${sd_fresh}
          field_name: tenant_name
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_tenant: $.data.id
      - call: GET /data-research/properties/${prop_ross}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_ross_v1: $.data.version
      - call: POST /data-research/properties/${prop_ross}/attributes/${att_tenant}/proposals
        payload:
          value: Harborline Logistics Inc
          expected_property_version: ${prop_ross_v1}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_tenant}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties/${prop_ross}/attributes
        payload:
          source_document_id: ${sd_stale}
          field_name: occupancy_pct
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_occ: $.data.id
      - call: POST /data-research/properties/${prop_ross}/source-documents
        payload:
          source_type: REGISTRY_LISTING
          source_name: Dallas County Registry digest
          contact_method: RECORDS_REQUEST
          obtained_at: '2025-07-15T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_stale2: $.data.id
      - call: POST /data-research/properties/${prop_ross}/attributes
        payload:
          source_document_id: ${sd_stale2}
          field_name: enumeration_pct
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_enum: $.data.id
      - call: GET /data-research/properties/${prop_ross}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_ross_v2: $.data.version
      - call: POST /data-research/properties/${prop_ross}/attributes/${att_occ}/proposals
        payload:
          value: '92'
          expected_property_version: ${prop_ross_v2}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_occ}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: GET /data-research/properties/${prop_ross}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_ross_v3: $.data.version
      - call: POST /data-research/properties/${prop_ross}/attributes/${att_enum}/proposals
        payload:
          value: '2024'
          expected_property_version: ${prop_ross_v3}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_enum}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: GET /data-research/properties/${prop_ross}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          provisional_completeness: $.data.completeness_pct
          stale_count: $.data.stale_source_count
      trigger:
      - call: POST /data-research/properties/${prop_ross}/finalize
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          final_completeness: $.data.completeness_pct
      assert:
      - the same Property's provisional completeness_pct read immediately before finalize == 73.13
      - Property.${prop_ross}.completeness_pct on the finalize response == 33.13
      - the provisional and final values differ by exactly 40.00 on identical PropertyAttribute rows
      - Property.${prop_ross}.stale_source_count == 2 and the two stale-sourced verified attributes are the only source of the divergence
      - Property.${prop_ross}.research_status == VERIFIED and attribute_verified_count == 3
  - name: seat_owner_share_weekly_vs_monthly_window
    grounds:
    - calculations.seat_owner_attribution
    - entities.LicenseSeat.fields.owner_share_pct
    - entities.LicenseSeat.fields.billed_owner_share_pct
    - state_machines.LicensingContract.ACTIVE_to_RENEWED
    distinguishing_aspect: On one LicenseSeat with the same eight UsageEvents, the weekly_snapshot window returns owner_share_pct 12.50 while the monthly_cycle window returns 6.67 — the variant alone changes the percentage by 5.83 points on identical rows.
    test_recipe:
      setup:
      - Logical clock at 2026-04-01T00:00:00Z. Subscriber org Meridian Advisory Partners (SUBSCRIBER, TX-DALLAS) with a CORE_MARKET_DATA contract, one seat, and four users.
      - Seat last_usage_cycle starts 2026-04-01T00:00:00Z. Eight usage events fall on the first seven days of that window on four distinct IP addresses; user mer-u3 (account-address owner) supplies the earliest event on the busiest IP 203.0.113.7.
      setup_api_calls:
      - *id001
      - call: POST /data-research/organizations
        payload:
          legal_name: Meridian Advisory Partners
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
          service_tier: MID_MARKET
        as: PlatformAdmin
        captures:
          org_sub: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: priya.nair@meridianadvisory.example
          full_name: Priya Nair
          role: LICENSING_ADMIN
        as: PlatformAdmin
        captures:
          admin_sub: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: mer-u1@meridianadvisory.example
          full_name: Meridian User One
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          su1: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: mer-u2@meridianadvisory.example
          full_name: Meridian User Two
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          su2: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: mer-u3@meridianadvisory.example
          full_name: Meridian User Three
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          su3: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: mer-u4@meridianadvisory.example
          full_name: Meridian User Four
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          su4: $.data.id
      - call: POST /data-research/licensing-contracts
        payload:
          subscriber_organization_id: ${org_sub}
          product: CORE_MARKET_DATA
          licensed_markets:
          - TX-DALLAS
          seat_count: 10
          annual_fee_cents: 100000
          auto_renew: true
          renewal_notice_days: 30
          term_start: '2026-04-01T00:00:00Z'
          term_end: '2027-04-01T00:00:00Z'
          audit_intensity: STANDARD
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          contract_a: $.data.id
          contract_a_v0: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_a}/seats
        payload:
          market: TX-DALLAS
          index_tier: TIER_2
          last_usage_cycle: '2026-04-01T00:00:00Z'
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          seat_a: $.data.id
      - call: POST /data-research/licensing-contracts/${contract_a}/seats/${seat_a}/assignment
        payload:
          occupant_user_id: ${su1}
          expected_contract_version: ${contract_a_v0}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
      - call: GET /data-research/licensing-contracts/${contract_a}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          contract_a_v1: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_a}/activate
        payload:
          expected_contract_version: ${contract_a_v1}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: DATASET_DOWNLOAD
          record_count: 40
          distinguishing_ip: 203.0.113.7
          occurred_at: '2026-04-01T09:00:00Z'
        as: SeatUser
        as_user_id: ${su3}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: API_QUERY
          record_count: 12
          distinguishing_ip: 203.0.113.7
          occurred_at: '2026-04-01T11:00:00Z'
        as: SeatUser
        as_user_id: ${su1}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: REPORT_EXPORT
          record_count: 8
          distinguishing_ip: 203.0.113.9
          occurred_at: '2026-04-01T15:00:00Z'
        as: SeatUser
        as_user_id: ${su2}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: API_QUERY
          record_count: 5
          distinguishing_ip: 198.51.100.4
          occurred_at: '2026-04-02T10:00:00Z'
        as: SeatUser
        as_user_id: ${su1}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: DATASET_DOWNLOAD
          record_count: 22
          distinguishing_ip: 198.51.100.7
          occurred_at: '2026-04-02T14:00:00Z'
        as: SeatUser
        as_user_id: ${su4}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: BULK_LOOKUP
          record_count: 60
          distinguishing_ip: 203.0.113.7
          occurred_at: '2026-04-03T09:30:00Z'
        as: SeatUser
        as_user_id: ${su3}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: API_QUERY
          record_count: 3
          distinguishing_ip: 203.0.113.9
          occurred_at: '2026-04-05T12:00:00Z'
        as: SeatUser
        as_user_id: ${su2}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: REPORT_EXPORT
          record_count: 15
          distinguishing_ip: 198.51.100.4
          occurred_at: '2026-04-07T08:00:00Z'
        as: SeatUser
        as_user_id: ${su4}
      - call: GET /data-research/seats/${seat_a}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          weekly_share: $.data.owner_share_pct
          weekly_owner: $.data.owner_user_id
      trigger:
      - call: POST /data-research/run_research_cycle
        payload: {}
        as: PlatformAdmin
      - call: GET /data-research/seats/${seat_a}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          monthly_share: $.data.billed_owner_share_pct
      assert:
      - LicenseSeat.${seat_a}.owner_share_pct == 12.50 on the seven-day weekly_snapshot window
      - LicenseSeat.${seat_a}.billed_owner_share_pct == 6.67 on the thirty-day monthly_cycle window
      - the two percentages differ by exactly 5.83 on identical UsageEvent rows
      - LicenseSeat.${seat_a}.owner_user_id == ${su3} — the account-address owner resolved by earliest occurred_at on the busiest IP
      - LicenseSeat.${seat_a}.distinctive_ip_count == 4
- rule_id: combinatorial_formula
  instances:
  - name: market_addition_fee_nested_product_and_tier_branching
    grounds:
    - calculations.market_addition_fee
    - state_machines.LicensingContract.ACTIVE_to_ACTIVE
    - entities.LicensingContract.fields.annual_fee_cents
    distinguishing_aspect: 'Mode (a): the fee formula has three inputs (annual_fee_cents, product, Organization.service_tier) interacting through a nested product_factor then tier_factor branch, so the identical market addition costs 8640 cents on an ENTERPRISE CORE_MARKET_DATA contract and 12420 cents on an SMB one.'
    test_recipe:
      setup:
      - 'Logical clock at 2026-02-01T00:00:00Z. Two subscriber organizations differ only in service_tier: Enterprise Subscriber (ENTERPRISE) and Smb Subscriber (SMB).'
      - Each holds one ACTIVE CORE_MARKET_DATA contract licensed for TX-DALLAS with annual_fee_cents 100000, one TIER_2 seat and one LICENSING_ADMIN.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-02-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /data-research/organizations
        payload:
          legal_name: Enterprise Subscriber Inc
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
          service_tier: ENTERPRISE
        as: PlatformAdmin
        captures:
          org_ent: $.data.id
      - call: POST /data-research/organizations
        payload:
          legal_name: Smb Subscriber LLC
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
          service_tier: SMB
        as: PlatformAdmin
        captures:
          org_smb: $.data.id
      - call: POST /data-research/organizations/${org_ent}/users
        payload:
          email: nia.okafor@enterprisesub.example
          full_name: Nia Okafor
          role: LICENSING_ADMIN
        as: PlatformAdmin
        captures:
          admin_ent: $.data.id
      - call: POST /data-research/organizations/${org_smb}/users
        payload:
          email: thomas.bell@smbsub.example
          full_name: Thomas Bell
          role: LICENSING_ADMIN
        as: PlatformAdmin
        captures:
          admin_smb: $.data.id
      - call: POST /data-research/organizations/${org_ent}/users
        payload:
          email: ent-seat1@enterprisesub.example
          full_name: Enterprise Seat One
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          ent_seat_user: $.data.id
      - call: POST /data-research/organizations/${org_smb}/users
        payload:
          email: smb-seat1@smbsub.example
          full_name: Smb Seat One
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          smb_seat_user: $.data.id
      - call: POST /data-research/licensing-contracts
        payload:
          subscriber_organization_id: ${org_ent}
          product: CORE_MARKET_DATA
          licensed_markets:
          - TX-DALLAS
          seat_count: 5
          annual_fee_cents: 100000
          auto_renew: true
          renewal_notice_days: 30
          term_start: '2026-02-01T00:00:00Z'
          term_end: '2027-02-01T00:00:00Z'
          audit_intensity: ENHANCED
        as: LicensingAdmin
        as_user_id: ${admin_ent}
        captures:
          contract_ent: $.data.id
          contract_ent_v0: $.data.version
      - call: POST /data-research/licensing-contracts
        payload:
          subscriber_organization_id: ${org_smb}
          product: CORE_MARKET_DATA
          licensed_markets:
          - TX-DALLAS
          seat_count: 5
          annual_fee_cents: 100000
          auto_renew: true
          renewal_notice_days: 30
          term_start: '2026-02-01T00:00:00Z'
          term_end: '2027-02-01T00:00:00Z'
          audit_intensity: STANDARD
        as: LicensingAdmin
        as_user_id: ${admin_smb}
        captures:
          contract_smb: $.data.id
          contract_smb_v0: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_ent}/seats
        payload:
          market: TX-DALLAS
          index_tier: TIER_2
          last_usage_cycle: '2026-02-01T00:00:00Z'
        as: LicensingAdmin
        as_user_id: ${admin_ent}
        captures:
          seat_ent: $.data.id
      - call: POST /data-research/licensing-contracts/${contract_ent}/seats/${seat_ent}/assignment
        payload:
          occupant_user_id: ${ent_seat_user}
          expected_contract_version: ${contract_ent_v0}
        as: LicensingAdmin
        as_user_id: ${admin_ent}
      - call: GET /data-research/licensing-contracts/${contract_ent}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_ent}
        captures:
          contract_ent_v1: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_ent}/activate
        payload:
          expected_contract_version: ${contract_ent_v1}
        as: LicensingAdmin
        as_user_id: ${admin_ent}
      - call: POST /data-research/licensing-contracts/${contract_smb}/seats
        payload:
          market: TX-DALLAS
          index_tier: TIER_2
          last_usage_cycle: '2026-02-01T00:00:00Z'
        as: LicensingAdmin
        as_user_id: ${admin_smb}
        captures:
          seat_smb: $.data.id
      - call: POST /data-research/licensing-contracts/${contract_smb}/seats/${seat_smb}/assignment
        payload:
          occupant_user_id: ${smb_seat_user}
          expected_contract_version: ${contract_smb_v0}
        as: LicensingAdmin
        as_user_id: ${admin_smb}
      - call: GET /data-research/licensing-contracts/${contract_smb}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_smb}
        captures:
          contract_smb_v1: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_smb}/activate
        payload:
          expected_contract_version: ${contract_smb_v1}
        as: LicensingAdmin
        as_user_id: ${admin_smb}
      trigger:
      - call: POST /data-research/licensing-contracts/${contract_ent}/markets
        payload:
          market: TX-HOUSTON
          expected_contract_version: ${contract_ent_v1}
        as: LicensingAdmin
        as_user_id: ${admin_ent}
        captures:
          ent_fee: $.data.annual_fee_cents
      - call: POST /data-research/licensing-contracts/${contract_smb}/markets
        payload:
          market: TX-HOUSTON
          expected_contract_version: ${contract_ent_v1}
        as: LicensingAdmin
        as_user_id: ${admin_smb}
        captures:
          smb_fee: $.data.annual_fee_cents
      assert:
      - LicensingContract.${contract_ent}.annual_fee_cents == 114000 after adding TX-HOUSTON (market_addition_fee == 14000)
      - LicensingContract.${contract_smb}.annual_fee_cents == 120200 after adding the same market (market_addition_fee == 20200)
      - the two additions differ by exactly 6200 cents on contracts whose only differing input is Organization.service_tier
      - 'the market addition is rejected when the submitted expected_contract_version is an earlier capture than the contract''s current version: resubmitting with ${contract_ent_v0} returns 412 ERR_STALE_VERSION'
      - resubmitting the same licensed market returns 409 ERR_MARKET_ALREADY_LICENSED
  - name: cap_rate_round_per_line_then_sum_vs_sum_then_round
    grounds:
    - calculations.cap_rate_bps
    - entities.Property.fields.verified_sale_value_cents
    - state_machines.SaleTransaction.PENDING_to_SUBORDINATED
    distinguishing_aspect: 'Mode (b): the cap-rate figure is rounded per transaction before summing, so three identical 5,000,000,000-cent transactions give a summed per-line total of 1800 basis points whereas rounding the summed ratio once would give 600 — the pinned order is per-line then sum.'
    test_recipe:
      setup:
      - Logical clock at 2026-05-01T00:00:00Z. An OFFICE property in TX-DALLAS carrying one VERIFIED in_place_income_annual_cents attribute of 300000100 cents.
      - Three SaleTransactions on that property, each with gross_sale_price_cents 5000000000 and subordination_status PENDING.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-05-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /data-research/organizations
        payload:
          legal_name: Tarrant Field Research LLC
          org_type: DATA_PROVIDER
          home_market: TX-DALLAS
          service_tier: ENTERPRISE
        as: PlatformAdmin
        captures:
          org_dp: $.data.id
      - call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: dana.reyes@tarrantresearch.example
          full_name: Dana Reyes
          role: RESEARCH_ANALYST
          assigned_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          analyst_tx: $.data.id
      - call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: hugo.lindqvist@tarrantresearch.example
          full_name: Hugo Lindqvist
          role: ENFORCEMENT_OFFICER
        as: PlatformAdmin
        captures:
          officer_dp: $.data.id
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 5000 Maple Ave
          property_type: OFFICE
          rentable_sqft: 90000
          classification: CLASS_B
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
