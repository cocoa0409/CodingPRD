              as: ProgramDirector
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id, sp_v: $.data.version }
          trigger:
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "TRAINEE_WAGES", classification: "SHARED", amount_cents: 19800, expected_subsidy_period_version: "${sp_v}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "SUPERVISION", classification: "SHARED", amount_cents: 300000, expected_subsidy_period_version: "${sp_v}" }
              as: ProgramDirector
              captures: { ce_id: $.data.id }
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: FunderAnalyst
          assert:
            - "TRAINEE_WAGES: HTTP 422 with data.error_id == \"ERR_CATEGORY_NOT_MANUALLY_POSTABLE\"; no CostEntry row is created and the period version is NOT consumed (the same ${sp_v} still works on the next call)"
            - "SUPERVISION: HTTP 201 with data.status == \"POSTED\", data.classification == \"SHARED\", data.amount_cents == 300000"
            - "the posted entry allocates allocated_mission_cents == 0 and allocated_business_cents == 300000 (mission_share 0.0000 because trainee_hours 0.000 / (0.000 + 40.0))"
            - "the period read reports mission_cost_cents == 0, business_operating_cost_cents == 300000, total_cost_cents == 300000 and version == ${sp_v} + 1"
            - "both true-cost ratios are null on that read -- zero trainee hours, not a division by zero"

      - name: subsidy_cap_suspension_cascade_covered_by_difficulty
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /subsidy-periods/{subsidyPeriodId}/close]
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / period_close_suspends_line_cancels_shift_releases_seat"
          rationale: |
            §1.8 drives the whole four-hop cascade off one close (draw pushes cumulative_subsidy_cents
            past subsidy_cap_cents -> LAUNCHED becomes SUSPENDED -> future SCHEDULED shifts CANCELLED
            -> their ASSIGNED seats RELEASED with released_reason SHIFT_CANCELLED), including the
            ordering assertions. Re-testing the endpoint's side-effect list here would duplicate it.

      - name: wage_verification_dimension_covered_by_difficulty
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /placements/{placementId}/wage-verification]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / placement_parallel_dimensions_move_independently"
          rationale: |
            §1.8 moves the wage-verification dimension (UNVERIFIED -> VERIFIED -> DISPUTED -> VERIFIED,
            with wage_progression_pct recomputed and reset to null on DISPUTE) independently of the
            employment dimension, covering both actions of this endpoint.

      - name: checkpoint_confirmation_cascade_covered_by_difficulty
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /retention-checkpoints/{retentionCheckpointId}/confirm]
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / checkpoint_180_confirm_retains_placement_and_alumni"
          rationale: |
            §1.8 asserts the 180-day confirmation cascade end to end (checkpoint CONFIRMED ->
            Placement.retention_outcome RETAINED_180 -> Employer reliability recomputed -> Participant
            PLACED becomes ALUMNI_RETAINED), which is the full side-effect list of this endpoint.

  # ===========================================================================
  # Error-catalog coverage map for the codes NOT re-tested in this section:
  #   ERR_UNAUTHENTICATED / ERR_ROLE_NOT_PERMITTED / ERR_BUSINESS_LINE_NOT_FOUND
  #     -> validations.missing_x_user_role_header_returns_unauthenticated,
  #        validations.unpermitted_role_on_unknown_business_line_returns_forbidden
  #   ERR_NOT_RESOURCE_OWNER -> validations.referral_partner_reading_another_partners_referral_is_forbidden
  #   ERR_INVALID_REQUEST -> entities.create_participant_missing_required_wage_returns_invalid_request,
  #        entities.create_support_activity_with_invalid_category_rejected
  #   ERR_WORK_SHIFT_NOT_FOUND -> entities.get_work_shift_with_unknown_id_returns_not_found
  #   ERR_PARTICIPANT_NOT_FOUND / ERR_EMPLOYER_NOT_FOUND -> entities.create_placement_with_unknown_ids_returns_not_found_in_declared_order
  #   ERR_SUBSIDY_PERIOD_NOT_FOUND -> entities.create_cost_entry_with_unknown_subsidy_period_returns_not_found
  #   ERR_INVALID_STATE_TRANSITION -> state_machines.review_of_approved_business_line_cannot_repeat (+2 more)
  #   ERR_SEGREGATION_OF_DUTIES -> state_machines.graduate_by_certifying_coach_rejected_by_segregation
  #   ERR_GRADUATION_CRITERIA_NOT_MET -> state_machines.certify_readiness_with_one_coaching_session_rejected
  #   ERR_RE_ENTRY_LIMIT_REACHED -> state_machines.participant_re_entry_limit_bounds_the_cycle
  #   ERR_EMPLOYER_NOT_ACTIVE -> state_machines.employer_probation_threshold_flags_and_blocks_new_placements
  #   ERR_ELIGIBILITY_SCORE_BELOW_FLOOR -> calculations.eligibility_score_floor_boundary_50_00_vs_49_00
  #   ERR_NO_OPEN_SUBSIDY_PERIOD -> calculations.completion_selects_open_period_by_shift_start_not_now
  #   ERR_SUBSIDY_PERIOD_OVERLAP -> validations.subsidy_period_overlap_rejected_on_closed_interval_boundary
  #   ERR_DUPLICATE_CANDIDATE_REFERENCE -> validations.duplicate_candidate_reference_rejected_per_partner
  #   ERR_OPEN_ASSIGNMENTS_BLOCK_CLOSE -> validations.open_assignment_blocks_period_close_until_released
  #   ERR_REVENUE_NOT_AVAILABLE -> endpoints.true_cost_analysis_what_if_basis_never_persists
  #   ERR_CATEGORY_NOT_MANUALLY_POSTABLE -> endpoints.manual_cost_entry_with_system_only_category_rejected
  #   ERR_STALE_SUBSIDY_PERIOD_VERSION -> cross_cutting_complexity_layers.stale_subsidy_period_version_on_second_cost_entry_returns_412
  #   ERR_STALE_BUSINESS_LINE_VERSION / ERR_INTAKE_CLOSED / ERR_SHIFT_NOT_STARTED /
  #   ERR_ACTUAL_HOURS_EXCEED_SHIFT / ERR_WEEKLY_HOURS_CAP_EXCEEDED /
  #   ERR_PARTICIPANT_REST_BUFFER_CONFLICT / ERR_SUPERVISION_CAPACITY_EXCEEDED
  #     -> the §1.8 stubs in the validations section above
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_the_entity_specific_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REFERRAL_PARTNER_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_SHIFT_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SUPPORT_ACTIVITY_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_RETENTION_CHECKPOINT_NOT_FOUND]
          - errors[ERR_COST_ENTRY_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: |
          Priority 3 must resolve to the code of the entity the id BELONGS to, not to a generic 404,
          and it must do so on an empty database for every remaining collection -- including
          RetentionCheckpoint, which has no single-resource GET and is therefore probed through its
          confirm action.
        test_recipe:
          setup:
            - "Empty database. Each ${unknown_*_id} below is a well-formed id that matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /referral-partners/${unknown_rp_id}"
              payload: {}
              as: ProgramDirector
              captures: { e1: $.data.error_id }
            - call: "GET /referrals/${unknown_ref_id}"
              payload: {}
              as: IntakeSpecialist
              captures: { e2: $.data.error_id }
            - call: "GET /shift-assignments/${unknown_sa_id}"
              payload: {}
              as: CaseManager
              captures: { e3: $.data.error_id }
            - call: "GET /support-activities/${unknown_act_id}"
              payload: {}
              as: JobCoach
              captures: { e4: $.data.error_id }
            - call: "GET /placements/${unknown_pl_id}"
              payload: {}
              as: CaseManager
              captures: { e5: $.data.error_id }
            - call: "GET /cost-entries/${unknown_ce_id}"
              payload: {}
              as: FunderAnalyst
              captures: { e6: $.data.error_id }
            - call: "POST /retention-checkpoints/${unknown_rc_id}/confirm"
              payload: { still_employed: true, verified_wage_cents_per_hour: 1900 }
              as: EmployerPartner
              as_user_id: "employer-unknown"
              captures: { e7: $.data.error_id }
          assert:
            - "all seven responses are HTTP 404 with data.message present"
            - "the codes are, in order: ERR_REFERRAL_PARTNER_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_SHIFT_ASSIGNMENT_NOT_FOUND, ERR_SUPPORT_ACTIVITY_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_COST_ENTRY_NOT_FOUND, ERR_RETENTION_CHECKPOINT_NOT_FOUND"
            - "the checkpoint probe returns 404 rather than 403: priority 3 (existence) precedes priority 4 (ownership), so the unknown X-User-ID never matters"

      - name: shift_assignment_duplicate_full_and_closed_shift_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_SHIFT_ASSIGNMENT]
          - errors[ERR_SHIFT_CAPACITY_FULL]
          - errors[ERR_SHIFT_NOT_SCHEDULED]
          - validations[priority 26]
          - validations[priority 29]
          - validations[priority 7]
        distinguishing_aspect: |
          Three seat-level rules fire on the same one-seat shift in strict priority order: the same
          participant twice is a duplicate (26) even though the shift is also full, a different
          participant hits capacity (29), and once the shift auto-CLOSES after completion every
          further create is refused by the shift-state gate (7), which outranks both.
        test_recipe:
          setup:
            - "Launched line with supervisor_capacity 4 (so priority 28 never interferes) and an OPEN September period."
            - "Two enrolled participants p1 and p2 at wage 1650."
            - "One shift ws1 on 2026-09-07T08:00-20:00Z with trainee_capacity 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 4, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-002", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals/${ref2_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "GET /business-lines/${bl_id}"
              payload: {}
              as: ProgramDirector
              captures: { bl_v2: $.data.version }
            - call: "POST /participants"
              payload: { referral_id: "${ref2_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v2}" }
              as: IntakeSpecialist
              captures: { p2_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 1, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { e_dup: $.data.error_id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p2_id}" }
              as: CaseManager
              captures: { e_full: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T20:00:00Z" }
              as: ProgramDirector
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 12.000 }
              as: CaseManager
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p2_id}" }
              as: CaseManager
              captures: { e_closed: $.data.error_id }
          assert:
            - "p1 again: HTTP 409 with data.error_id == \"ERR_DUPLICATE_SHIFT_ASSIGNMENT\" (priority 26 wins over the equally-true capacity violation at 29)"
            - "p2 while SCHEDULED and full: HTTP 409 with data.error_id == \"ERR_SHIFT_CAPACITY_FULL\""
            - "the completion returns HTTP 200 with wage_cost_cents == 19800 and closes ws1 (billable_labor_cost_cents == 19800)"
            - "p2 after the close: HTTP 409 with data.error_id == \"ERR_SHIFT_NOT_SCHEDULED\" (priority 7 pre-empts 26/29)"
            - "GET /shift-assignments?work_shift_id=${ws1_id} reports total_count == 1 -- none of the three refusals created a row"

      - name: period_close_before_end_and_manual_post_after_close_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PERIOD_NOT_ENDED]
          - errors[ERR_PERIOD_CLOSED]
          - validations[priority 15]
          - validations[priority 8]
        distinguishing_aspect: |
          The two temporal guards on a period sit on opposite sides of the close: before period_end
          the close itself is refused (priority 15, strict >), and after the close every ledger
          movement is refused (priority 8) even when the OCC version supplied is perfectly current --
          proving priority 8 is evaluated before priority 9.
        test_recipe:
          setup:
            - "Launched line with one OPEN period 2026-09-01..2026-09-30 and an empty ledger."
            - "Logical clock at 2026-09-07, i.e. inside the period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /subsidy-periods/${sp_id}/close"
              payload: { allocation_basis: "HOURS", revenue_cents: 500000 }
              as: ProgramDirector
              captures: { e_not_ended: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /subsidy-periods/${sp_id}/close"
              payload: { allocation_basis: "HOURS", revenue_cents: 500000 }
              as: ProgramDirector
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: ProgramDirector
              captures: { sp_v_after: $.data.version }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "MATERIALS", classification: "BUSINESS", amount_cents: 40000, expected_subsidy_period_version: "${sp_v_after}" }
              as: ProgramDirector
              captures: { e_closed: $.data.error_id }
          assert:
            - "close inside the interval: HTTP 409 with data.error_id == \"ERR_PERIOD_NOT_ENDED\" (the check is strictly now > period_end, so even 2026-09-30 itself would fail)"
            - "close on 2026-10-01: HTTP 200 with data.status == \"CLOSED\" and data.revenue_cents == 500000"
            - "post-close cost entry with the CURRENT version: HTTP 409 with data.error_id == \"ERR_PERIOD_CLOSED\" -- not 412, because priority 8 precedes priority 9"
            - "GET /cost-entries?subsidy_period_id=${sp_id} reports total_count == 0 and the period version is unchanged at ${sp_v_after}"

      - name: trainee_wage_outside_program_band_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRAINEE_WAGE_OUT_OF_RANGE]
          - validations[priority 35]
        distinguishing_aspect: |
          The program band is inclusive on both ends: 1400 and 2300 are refused while 1500 is
          accepted, and because a refusal never mutates the business line, the SAME
          expected_business_line_version still satisfies the OCC guard on the accepted attempt.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, one ELIGIBLE referral, no participants yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
          trigger:
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1400, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { e_low: $.data.error_id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 2300, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { e_high: $.data.error_id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1500, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
          assert:
            - "1400: HTTP 422 with data.error_id == \"ERR_TRAINEE_WAGE_OUT_OF_RANGE\""
            - "2300: HTTP 422 with the same code"
            - "1500: HTTP 201 with data.status == \"TRANSITIONAL_EMPLOYED\" and data.wage_cents_per_hour == 1500 (PROGRAM_MIN is inclusive)"
            - "the accepted call reuses ${bl_v} unchanged, proving neither refusal bumped BusinessLine.version"
            - "GET /business-lines/${bl_id} afterwards reports training_slots_filled == 1 and version == ${bl_v} + 1"

      - name: referral_from_lapsed_partner_and_over_quota_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PARTNER_MOU_LAPSED]
          - errors[ERR_PARTNER_QUOTA_EXCEEDED]
          - validations[priority 18]
          - validations[priority 39]
        distinguishing_aspect: |
          The two partner-level gates are independent: a LAPSED MOU blocks submission outright at
          priority 18, while an ACTIVE partner is blocked only once its rolling 30-day count reaches
          referral_quota_per_period (priority 39) -- and the refused submission does not itself count
          toward the quota.
        test_recipe:
          setup:
            - "Partner rpL created directly with mou_status LAPSED and quota 5."
            - "Partner rpQ created ACTIVE with referral_quota_per_period 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Lapsed Partner", mou_tier: "TIER_1", referral_quota_per_period: 5, mou_status: "LAPSED" }
              as: ProgramDirector
              captures: { rpL_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { organization_name: "Quota One Partner", mou_tier: "TIER_1", referral_quota_per_period: 1 }
              as: ProgramDirector
              captures: { rpQ_id: $.data.id }
