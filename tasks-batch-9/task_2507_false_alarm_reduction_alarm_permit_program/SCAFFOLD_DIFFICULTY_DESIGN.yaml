            - "first trigger -> HTTP 422 with error_id == 'ERR_ECV_REQUIREMENT_NOT_MET'; DispatchRequest.${dr_one}.status stays 'SUBMITTED' and validated_at stays null"
            - "DispatchRequest.${dr_two}.distinct_ecv_contact_count == 2 and ecv_sufficient == true"
            - "second trigger -> HTTP 200 and DispatchRequest.${dr_two}.status == 'VALIDATED' with validated_at == '2026-05-06T00:00:00Z'"

      - name: collections_referral_needs_day_ninety_exactly_not_day_eighty_nine
        grounds:
          - calculations.delinquency_escalation
          - state_machines.PenaltyInvoice.FINAL_NOTICE_to_REFERRED
          - "validations[priority=53]"
        distinguishing_aspect: >-
          An invoice sitting at outstanding_cents exactly 25000 (== collections_referral_threshold_cents)
          must still be refused referral at days_delinquent 89 and accepted at exactly 90, where the
          referral total is 25000 + the flat 2000-cent LOW-band fee (interim_total <= 25000 is the
          inclusive band edge) = 27000, while outstanding_cents remains 25000.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with permit_issue_fee_cents 21645, admin_fee_pct 0.05, invoice_due_days 30, late_penalty_pct 0.10, delinquency_days 90, collections_referral_threshold_cents 25000."
            - "One RESIDENTIAL AlarmSite with two ACTIVE ECV-callable contacts and one system approved on 2026-01-01, producing a PERMIT_ISSUE_FEE invoice of 21645 + 1082 admin = 22727 cents due on 2026-01-31."
            - "The nightly run on 2026-02-01 (days_delinquent 1) moves the invoice CURRENT -> NOTICE and adds the one-time late penalty round_half_up(22727 * 0.10) = 2273, so assessed_cents and outstanding_cents both become 25000."
            - "The nightly run on 2026-03-05 (days_delinquent 33) moves NOTICE -> FINAL_NOTICE with no further penalty."
            - "The nightly run on 2026-04-30 leaves days_delinquent at 89 - one day short of delinquency_days."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-REFEQ"
                effective_from: "2026-01-01T00:00:00Z"
                permit_issue_fee_cents: 21645
                invoice_due_days: 30
                delinquency_days: 90
                collections_referral_threshold_cents: 25000
              as: ProgramAdministrator
