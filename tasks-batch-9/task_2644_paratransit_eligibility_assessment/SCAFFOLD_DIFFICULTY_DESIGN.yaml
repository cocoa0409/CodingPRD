              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T09:30:00Z", pickup_window_end: "2026-08-05T10:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { safety_err: $.data.error_id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T09:30:00Z", pickup_window_end: "2026-08-05T10:00:00Z", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { late_err: $.data.error_id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { ok_booking_id: $.data.id }
          assert:
            - "call 1 returns HTTP 422 with data.error_id == \"ERR_VEHICLE_NOT_ACCESSIBLE\""
            - "call 1 does NOT return ERR_VEHICLE_WINDOW_CONFLICT (409) and does NOT return ERR_PICKUP_WINDOW_LATE"
            - "call 2 returns HTTP 422 with data.error_id == \"ERR_PICKUP_WINDOW_LATE\" (the ambulatory lane has capacity 1 so rule 60 is satisfied)"
            - "call 3 returns HTTP 201 with data.status == \"RESERVED\""
            - "after call 3 Vehicle.${veh_id}.open_ambulatory_reservations == 1 and open_wheelchair_reservations == 0"
            - "GET /transportation-bookings?vehicle_id=${veh_id} returns total_count == 1 (the two rejected calls created nothing)"

  - rule_id: boundary_precision_check
    instances:
      - name: presumptive_eligibility_grants_at_exactly_twenty_one_days_not_twenty
        grounds:
          - calculations.application_pending_days
          - endpoints.POST_/_ops/day-close.step_4
          - entities.Application.fields.days_pending_statutory
          - entities.Application.fields.presumptive_granted_at
          - entities.Applicant.fields.current_eligibility_status
        distinguishing_aspect: |
          The metric under test is days_pending_statutory against DETERMINATION_WINDOW_DAYS == 21 on the
          POST /_ops/day-close endpoint: at clock 2026-08-21 the value is exactly 20 and step 4 grants
          nothing; at 2026-08-22 it is exactly 21 and step 4 grants presumptive eligibility. The
          comparison is >= 21, so an implementation using > 21 (grant on 2026-08-23) or >= 20 (grant on
          2026-08-21) fails one of the two probes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Applicant with one NEW Application submitted at exactly 2026-08-01T00:00:00Z, so completeness_established_at == 2026-08-01T00:00:00.000Z and determination_due_date == 2026-08-22"
            - "no verification, no assessment and no Determination exist, so the packet stays undetermined"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Hilde Novak", date_of_birth: "1952-07-30", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: true, max_walk_distance_meters: 400, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
              captures: { est: $.data.completeness_established_at, due: $.data.determination_due_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { d20: $.data.days_pending_statutory }
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { granted_at_20: $.data.presumptive_granted_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { d21: $.data.days_pending_statutory }
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { granted_at_21: $.data.presumptive_granted_count }
          assert:
            - "Application.${appn_id}.completeness_established_at == \"2026-08-01T00:00:00.000Z\" and determination_due_date == \"2026-08-22\""
            - "at clock 2026-08-21T00:00:00Z Application.${appn_id}.days_pending_statutory == 20"
            - "the day-close at 2026-08-21 returns presumptive_granted_count == 0"
            - "after that day-close Application.${appn_id}.presumptive_granted_at == null and Applicant.${rider_id}.current_eligibility_status == \"NONE\""
            - "at clock 2026-08-22T00:00:00Z Application.${appn_id}.days_pending_statutory == 21"
            - "the day-close at 2026-08-22 returns presumptive_granted_count == 1"
            - "after that day-close Application.${appn_id}.presumptive_granted_at == \"2026-08-22T00:00:00.000Z\""
            - "after that day-close Applicant.${rider_id}.current_eligibility_status == \"PRESUMPTIVE\" and eligibility_category == null"
            - "a third day-close at clock 2026-08-22T00:00:00Z returns presumptive_granted_count == 0 (grant is once-only)"

      - name: conduct_window_start_boundary_excludes_event_one_day_early
        grounds:
          - calculations.no_show_points_balance
          - calculations.no_show_ratio_pct
          - entities.Applicant.fields.chargeable_miss_count_90d
          - entities.Applicant.fields.scheduled_trip_count_90d
          - entities.Applicant.fields.no_show_ratio_pct
          - entities.TripEvent.fields.trip_date
        distinguishing_aspect: |
          A different metric (90-day conduct-window membership and the empty-denominator ratio) on a
          different endpoint (POST /trip-events): at clock 2026-08-01 the inclusive window is
          2026-05-04..2026-08-01, so a trip_date of 2026-05-03 is exactly one day outside and must not
          enter either the numerator or the denominator. scheduled_trip_count_90d stays 0 and
          no_show_ratio_pct must read the EMPTY_WINDOW_RATIO 0.0 rather than a division-by-zero or null,
          while the report-basis variant still counts the same event because recorded_at is inside.
        test_recipe:
          setup:
            - "logical clock initially 2026-01-15T00:00:00Z, then moved to 2026-08-01T00:00:00Z"
            - "one Applicant with three TripEvents ingested on 2026-01-15 (trip_dates 2026-01-10 NO_SHOW, 2026-01-11 NO_SHOW, 2026-01-12 LATE_CANCEL), all far outside every later window on both bases"
            - "no SuspensionProceeding exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Roland Beck", date_of_birth: "1971-02-08", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-01-10", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-01-11", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-01-12", event_type: "LATE_CANCEL" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-05-03", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { edge_event_id: $.data.id, edge_points: $.data.points_assessed }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { pts_event: $.data.no_show_points_event_basis, pts_report: $.data.no_show_points_report_basis, ratio: $.data.no_show_ratio_pct }
          assert:
            - "TripEvent.${edge_event_id}.points_assessed == 2 and recorded_at == \"2026-08-01T00:00:00.000Z\""
            - "Applicant.${rider_id}.no_show_points_event_basis == 0 (trip_date 2026-05-03 is one day before the window start 2026-05-04)"
            - "Applicant.${rider_id}.chargeable_miss_count_90d == 0"
            - "Applicant.${rider_id}.scheduled_trip_count_90d == 0"
            - "Applicant.${rider_id}.no_show_ratio_pct == 0.0 (EMPTY_WINDOW_RATIO, not null and not an error)"
            - "Applicant.${rider_id}.no_show_points_report_basis == 2 (the same event is inside the report-basis window because recorded_at is 2026-08-01)"
            - "GET /applicants/${rider_id}/suspension-proceedings returns total_count == 0 (no auto-proposal on a zero-point window)"
            - "a follow-up POST /trip-events with trip_date 2026-05-04 and event_type NO_SHOW moves no_show_points_event_basis to 2, chargeable_miss_count_90d to 1, scheduled_trip_count_90d to 1 and no_show_ratio_pct to 100.0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: suspension_decide_blocked_by_recomputed_applicant_conduct_mirrors
        grounds:
          - validations.priority_48.ERR_SUSPENSION_UNSUPPORTED
          - state_machines.SuspensionProceeding.RIDER_RESPONDED_to_UPHELD_PENDING
          - entities.Applicant.fields.no_show_points_event_basis
          - entities.Applicant.fields.chargeable_miss_count_90d
          - entities.Applicant.fields.no_show_ratio_pct
          - endpoints.POST_/trip-events/{id}/excuse
          - calculations.no_show_ratio_pct
        distinguishing_aspect: |
          The entity pair is (SuspensionProceeding, Applicant): whether SuspensionProceeding may leave
          RIDER_RESPONDED for UPHELD_PENDING depends on live fields of a DIFFERENT entity recomputed at
          decision time, not on the points_at_proposal snapshot the proceeding itself carries. Excusing
          one TripEvent after the proposal drops the applicant's points from 6 to 4 and misses from 3 to
          2 while points_at_proposal stays 6, so the decide call must fail; an implementation that reads
          its own snapshot upholds the suspension and diverges.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z (conduct window 2026-05-04..2026-08-01)"
            - "one Applicant with three unexcused NO_SHOW TripEvents on 2026-06-01, 2026-06-15 and 2026-07-01"
            - "the third ingestion auto-proposed a SuspensionProceeding (origin AUTO_THRESHOLD, proposed_by_user_id null, points_at_proposal 6)"
            - "notice sent by co-1 on 2026-08-01 (response_deadline_date 2026-08-15) and the rider has responded, so the proceeding is RIDER_RESPONDED"
            - "one of the three NO_SHOWs is then excused, dropping the live mirrors below every threshold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Delia Kwon", date_of_birth: "1963-12-05", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-06-01", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-06-15", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-01", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ev3_id: $.data.id }
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: {}
              as: ConductOfficer
              captures: { prc_id: "$.data[0].id", prc_origin: "$.data[0].origin", prc_points: "$.data[0].points_at_proposal" }
            - call: "POST /suspension-proceedings/${prc_id}/send-notice"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { deadline: $.data.response_deadline_date }
            - call: "POST /suspension-proceedings/${prc_id}/respond"
              payload: { rider_response_note: "Two of the missed trips were dialysis transport errors" }
              as: Applicant
              as_user_id: "${rider_id}"
            - call: "POST /trip-events/${ev1_id}/excuse"
              payload: { excuse_reason: "Provider cancelled the dialysis appointment" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { pts_after_excuse: $.data.points_assessed }
          trigger:
            - call: "POST /suspension-proceedings/${prc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { blocked_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${prc_id}/decide"
              payload: { decision: "RESCINDED" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { final_status: $.data.status }
          assert:
            - "before the trigger SuspensionProceeding.${prc_id}.origin == \"AUTO_THRESHOLD\", proposed_by_user_id == null and points_at_proposal == 6"
            - "before the trigger SuspensionProceeding.${prc_id}.status == \"RIDER_RESPONDED\" and response_deadline_date == \"2026-08-15\""
            - "after the excuse TripEvent.${ev1_id}.excused == true and points_assessed == 0"
            - "after the excuse Applicant.${rider_id}.no_show_points_event_basis == 4, chargeable_miss_count_90d == 2, scheduled_trip_count_90d == 3, no_show_ratio_pct == 66.7"
            - "the UPHELD decide returns HTTP 422 with data.error_id == \"ERR_SUSPENSION_UNSUPPORTED\" (points 4 < 6 and misses 2 < 3, even though points_at_proposal is still 6)"
            - "the UPHELD decide does NOT return ERR_DUE_PROCESS_INCOMPLETE (notice_sent_at is set and the status is RIDER_RESPONDED, so rule 47 is satisfied)"
            - "after the failed decide SuspensionProceeding.${prc_id}.status == \"RIDER_RESPONDED\", duration_days == 0, suspension_start_date == null and decided_by_user_id == null"
            - "after the failed decide Applicant.${rider_id}.prior_upheld_suspension_count == 0, suspension_days_ledger_total == 0 and service_status == \"ACTIVE\""
            - "the RESCINDED decide returns HTTP 200 with data.status == \"RESCINDED\", duration_days == 0, days_served == 0 and days_forgiven == 0"
            - "after the RESCINDED decide Applicant.${rider_id}.prior_upheld_suspension_count == 0 (a rescinded first offence never escalates the ladder)"

      - name: travel_training_referral_requires_trainable_determination_category
        grounds:
          - validations.priority_52.ERR_CATEGORY_NOT_TRAINABLE
          - endpoints.POST_/applicants/{id}/travel-training-referrals
          - entities.Determination.fields.category
          - entities.Determination.fields.status
          - calculations.recommended_eligibility_category
        distinguishing_aspect: |
          A different entity pair, (TravelTrainingReferral, Determination): whether a referral may be
          created at all depends on the category AND status of the applicant's governing Determination.
          An UNCONDITIONAL rider is unconditionally eligible for paratransit and has nothing to be
          trained onto, so the create is refused; the same call succeeds for a CONDITIONAL rider. The
          UNCONDITIONAL branch also proves the issue side effect does not create the auto referral.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:30:00Z during setup"
            - "one Applicant whose assessment scored board_alight 0 / wayfinding 4 / distance 900 / heat false, so recommended_category is UNCONDITIONAL via branch 2 (min(0, 4) <= 1)"
            - "an ISSUED UNCONDITIONAL Determination with effective_date 2026-08-06, term_days 1825, expires_at 2031-08-05 and trip_condition_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
