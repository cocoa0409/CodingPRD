  - rule_id: non_linear_state_machine
    instances:
      - name: wash_order_cycle_and_billing_dimension
        grounds:
          - state_machines.WashOrder.SCHEDULED_to_WEATHER_HELD
          - state_machines.WashOrder.WEATHER_HELD_to_SCHEDULED
          - state_machines.WashOrder.ASSIGNED_to_SCHEDULED
          - state_machines.WashOrder.INVOICED_to_PAID
        distinguishing_aspect: |
          WashOrder is non-linear twice: a weather cycle (SCHEDULED -> WEATHER_HELD ->
          SCHEDULED, then ASSIGNED -> SCHEDULED revert on stop removal) plus an
          independent billing dimension on the same row that advances
          UNBILLED -> INVOICED -> PAID while the lifecycle sits at COMPLETED.
          Different entity than the Subscription and DamageClaim instances.
        test_recipe:
          setup:
            - "FLEET customer with ACTIVE contract; site (non-reclaim); 1 SEDAN"
            - "Order window 2026-08-10T13:00:00Z-14:00:00Z, CONFIRMED, then freeze-held by weather evaluation, then rescheduled to 2026-08-12T13:00:00Z"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Fleet N", email: "fn@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "LOT", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "N01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 200000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${contract_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-10T13:00:00Z", scheduled_window_end: "2026-08-10T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { o_v2: $.data.version } }
            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-10", forecast_low_f: 30, precip_probability_pct: 10 }, as: Dispatcher, captures: { held_ids: $.data.held_order_ids } }
            - { call: "GET /fleet-wash/wash-orders/${order_id}", payload: {}, as: Dispatcher, captures: { o_v3: $.data.version, o_held: $.data.status } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/reschedule", payload: { scheduled_window_start: "2026-08-12T13:00:00Z", scheduled_window_end: "2026-08-12T14:00:00Z", expected_wash_order_version: "${o_v3}" }, as: Dispatcher, captures: { o_v4: $.data.version, o_status4: $.data.status } }
