          - entities.Claim.fields.reported_date
        distinguishing_aspect: |
          CLAIMS_MADE interval semantics: an inclusive one-sided floor (occurrence_date >=
          retroactive_date, unbounded above) ANDed with a half-open reported window [eff, exp).
          A claim with occurrence_date 2025-06-01 (BEFORE retro 2025-07-01) is rejected with
          ERR_CLAIM_BEFORE_RETRO_DATE even though reported_date 2026-06-01 lies inside the window.
        test_recipe:
          setup:
            - "IN_FORCE CLAIMS_MADE policy, retroactive_date 2025-07-01; clock 2026-06-01."
            - "A claim with occurrence_date 2025-06-01 (pre-retro) and reported_date 2026-06-01 (in window)."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-0014", coverage_trigger: "CLAIMS_MADE", retroactive_date: "2025-07-01T00:00:00.000Z", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "PreRetro G", loss_type: "BODILY_INJURY", occurrence_date: "2025-06-01T00:00:00.000Z", reported_date: "2026-06-01T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 5000000 }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_CLAIM_BEFORE_RETRO_DATE"
            - "Claim.${claim_id}.status == OPEN (unchanged)"

      - name: ai_endorsement_effective_date_half_open_policy_window
        grounds:
          - validations[priority=13]
          - entities.AdditionalInsuredEndorsement.fields.ai_effective_date
          - entities.Policy.fields.effective_date
          - entities.Policy.fields.expiration_date
        distinguishing_aspect: |
          AdditionalInsuredEndorsement interval semantics differ: simple half-open membership
          ai_effective_date in [effective_date, expiration_date) on a different entity (Endorsement,
          not Claim). ai_effective_date == expiration_date 2027-01-01 (the exclusive upper bound)
          is rejected with ERR_AI_DATE_OUTSIDE_PERIOD.
        test_recipe:
          setup:
            - "IN_FORCE OCCURRENCE policy, period [2026-01-01, 2027-01-01); a CertificateHolder."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
