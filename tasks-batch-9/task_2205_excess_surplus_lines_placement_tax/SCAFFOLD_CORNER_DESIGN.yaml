              as_user_id: "co-anders"
              captures: { s_t1: $.data.score }
            - call: "POST /carriers/${c_t1m_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { r_t1m_id: $.data.id }
            - call: "POST /market-security-reviews/${r_t1m_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { s_t1m: $.data.score }
            - call: "POST /carriers/${c_t2_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { r_t2_id: $.data.id }
            - call: "POST /market-security-reviews/${r_t2_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { s_t2: $.data.score }
            - call: "POST /carriers/${c_t2m_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { r_t2m_id: $.data.id }
            - call: "POST /market-security-reviews/${r_t2m_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
