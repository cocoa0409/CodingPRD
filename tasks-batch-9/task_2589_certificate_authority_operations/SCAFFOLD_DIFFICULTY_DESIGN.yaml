      - name: crl_overlap_exactly_thirty_minutes_is_accepted
        grounds:
          - calculations.crl_window_coverage
          - validations[priority=93]
          - entities.CertificateProfile.fields.last_crl_next_update
          - concurrency_rules[crl-publish-stale-profile]
        distinguishing_aspect: |
          Metric: MINUTES OF INTERVAL OVERLAP between two half-open CRL windows, on
          POST /ca/certificate-profiles/{id}/crl-publications - not a count and not a
          deadline. One second short of the mandatory 30-minute overlap is rejected as a
          coverage gap; an overlap of exactly 30 minutes is accepted, so the guard is
          inclusive at the boundary.
        test_recipe:
          setup:
            - "An ACTIVE DV profile with max_crl_validity_hours 24 and no revoked certificates (empty drains keep the test focused on window geometry)."
            - "CRL number 1 published over [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "dv-crl-1", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 8000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "GET /ca/certificate-profiles/${prof_id}"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { pv1: $.data.version }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-01T12:00:00Z", expected_profile_version: "${pv1}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
            - call: "GET /ca/certificate-profiles/${prof_id}"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T11:30:01Z", next_update: "2026-08-01T23:00:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err1: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T11:30:00Z", next_update: "2026-08-01T23:30:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
          assert:
            - "29 minutes 59 seconds of overlap: HTTP 409 with error_id ERR_CRL_COVERAGE_GAP"
            - "exactly 30 minutes of overlap (this_update == last_crl_next_update - 30 minutes): HTTP 201, crl_number == 2"
            - "the rejected attempt left CertificateProfile.${prof_id}.version unchanged, so the SAME expected_profile_version ${pv2} still succeeds on the accepted attempt"
            - "CertificateProfile.${prof_id}.last_crl_number == 2, last_crl_this_update == 2026-08-01T11:30:00Z, last_crl_next_update == 2026-08-01T23:30:00Z"
            - "the accepted publication reports entry_count == 0 and revoked_serials == [] (an empty drain is legal and still advances crl_number)"
            - "CertificateProfile.${prof_id}.total_crl_entries_published == 0 and pending_crl_entry_count == 0"
      - name: disclosure_exactly_at_deadline_is_still_on_time
        grounds:
          - calculations.incident_disclosure_deadline
          - entities.MisissuanceIncident.fields.disclosure_breached
          - entities.RootProgramCommunication.fields.within_deadline
          - state_machines.MisissuanceIncident.OPEN_to_DISCLOSED
        distinguishing_aspect: |
          Metric: WHOLE SECONDS AGAINST A DEADLINE INSTANT, on
          POST /ca/misissuance-incidents/{id}/disclose. Two boundary conventions meet here
          and are deliberately different: the clock sweep marks a breach only when the new
          clock is STRICTLY AFTER disclosure_due_at, while within_deadline on the
          communication is INCLUSIVE (sent_at <= due). A disclosure landing exactly on the
          deadline is therefore on time; one second later is a breach.
        test_recipe:
          setup:
            - "An ACTIVE DV profile and one subscriber."
            - "Two OPEN incidents i1 and i2, both discovered 2026-08-01T00:00:00Z, both with disclosure_due_at 2026-08-02T00:00:00Z."
