            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/refresh-measures"
              payload: { expected_hospital_version: "${p1_v2}" }
              as: RatingEngine
              captures: { p1_v3: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/score-runs"
              payload: { methodology_version_id: "${meth_main_id}", release_cycle_id: "${rc_main_id}", expected_hospital_version: "${p1_v3}" }
              as: RatingEngine
              captures: { run_p1b_id: $.data.id, p1_v4: $.data.version }
            - call: "GET /hospital-safety-rating/hospitals/${p1_id}/grades"
              payload: { release_cycle_id: "${rc_main_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { grade_p1_status: "$.data[0].status", grade_p1_comp: "$.data[0].composite_score", grade_p1_letter: "$.data[0].letter_grade" }
          assert:
            - "hop 1: the SurveyMeasure for cpoe_order_entry_value now carries measure_status PUBLIC_SOURCE_SUBSTITUTED"
            - "hop 2: HospitalMeasureSet.${ms1_id}.readiness_state == INCOMPLETE"
            - "hop 3: after the refresh and the fresh score run, Grade.composite_score == 65.12 and Grade.letter_grade == B, because reliability_weight is 1.0000 so no downgrade applies"
            - "hop 4: ReleaseCycle.${rc_main_id}.state == OPEN_REVIEW once every grade in it is resolved"
            - "ReanalysisRequest.${rq1_id}.status == GRANTED, adjusted_delta == 4.74 and reference_stale == false"

      - name: verification_discrepancy_three_hop_cascade_to_disclosure
        grounds:
          - state_machines.Survey.SUBMITTED_to_DISCREPANCY_OPEN
          - state_machines.SurveyMeasure.REPORTED_to_REPORTED
          - state_machines.HospitalMeasureSet.READY_to_INCOMPLETE
          - entities.Hospital.fields.disclosure_status
        distinguishing_aspect: |
          Depth 3: a DISCREPANCY_REQUEST re-flags each submitted SurveyMeasure
          in place, whose own mutation returns the HospitalMeasureSet to
          INCOMPLETE, whose own change flips Hospital.disclosure_status to
          UNVERIFIED — a different triggering transition from the GRANT
          cascade the first instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P2 has one submitted measure with a null source program and no prior verification."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - &k_hp2b
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P2 Regional Medical Center", ccn: "260003", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p2@example.org" }
              as: RatingAdmin
              captures: { p2_id: $.data.id, p2_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p2_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p2_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "ATTESTATION" }
              as: HospitalRespondent
              as_user_id: "${p2_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p2_id}/survey-measures"
              payload: { survey_id: "${s2_id}", measure_code: "o1", raw_value: 70.0 }
              as: HospitalRespondent
              as_user_id: "${p2_id}"
              captures: { m_p2_id: $.data.id }
            - call: "POST /hospital-safety-rating/surveys/${s2_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p2_id}"
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${s2_id}/verify"
              payload: { verification_response: "DISCREPANCY_REQUEST" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { s2_cycle: $.data.verification_cycle, s2_status: $.data.af_status }
            - call: "GET /hospital-safety-rating/hospitals/${p2_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { p2_disclosure: $.data.disclosure_status }
          assert:
            - "hop 1: Survey.${s2_id}.af_status == DISCREPANCY_OPEN and verification_cycle == 1"
            - "hop 2: SurveyMeasure.${m_p2_id}.flag_hold == true and derived_value recomputed from the current raw_value"
            - "hop 3: the hospital's HospitalMeasureSet.readiness_state == INCOMPLETE"
            - "hop 4: Hospital.${p2_id}.disclosure_status == UNVERIFIED"
            - "a second verify on the same survey returns ERR_SURVEY_VERIFICATION_ALREADY_OPEN, confirming the cascade came from the first verify"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_tier_precedes_business_tiers_on_score_run
        grounds:
          - validations[priority=4]
          - validations[priority=3]
          - validations[priority=14]
          - validations[priority=17]
          - errors.ERR_HOSPITAL_NOT_ACTIVE
          - errors.ERR_MEASURE_SET_NOT_READY
        distinguishing_aspect: |
          state vs business_fiscal: with a SUSPENDED hospital, an
          unmaterialised measure set and a stale OCC version all failing at
          once, the answer is ERR_HOSPITAL_NOT_ACTIVE (409) from the state
          tier rather than ERR_MEASURE_SET_NOT_READY or ERR_STALE_VERSION — a
          different error-category pair from the
          business_referential-vs-business_temporal conflict in the second
          instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P4 is pinned but SUSPENDED, its measure set was never refreshed, and the caller holds a stale version."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/release-cycles"
              payload: { label: "Baseline Grades", methodology_version_id: "${meth_b0_id}", preliminary_release_date: "2026-06-01T00:00:00Z", correction_window_ends_at: "2026-06-30T00:00:00Z", publication_date: "2026-07-15T00:00:00Z" }
              as: RatingAdmin
              captures: { rc_b0_id: $.data.id }
            - &k_hp4
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P4 Regional Medical Center", ccn: "260005", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p4@example.org" }
              as: RatingAdmin
              captures: { p4_id: $.data.id, p4_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p4_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "PUT /hospital-safety-rating/hospitals/${p4_id}"
              payload: { status: "SUSPENDED" }
              as: RatingAdmin
              captures: { p4_v1: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p4_id}/score-runs"
              payload: { methodology_version_id: "${meth_b0_id}", release_cycle_id: "${rc_b0_id}", expected_hospital_version: "${p4_v0}" }
              as: RatingEngine
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409 and err_state == ERR_HOSPITAL_NOT_ACTIVE"
            - "err_state != ERR_MEASURE_SET_NOT_READY, even though the measure set was never refreshed"
            - "err_state != ERR_STALE_VERSION, even though expected_hospital_version is one behind"
            - "the state tier answered first, so no run was persisted under either of the two lower-tier verdicts"

      - name: referential_tier_precedes_temporal_tier_on_network_listing
        grounds:
          - validations[priority=7]
          - validations[priority=9.5]
          - validations[priority=18]
          - errors.ERR_HOSPITAL_NOT_FOUND
          - errors.ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT
        distinguishing_aspect: |
          business_referential vs business_temporal: with a network listing
          whose window strictly contains another purchaser's window AND whose
          hospital id list carries an unknown id, the answer is
          ERR_HOSPITAL_NOT_FOUND (404) from the referential tier rather than
          ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT — a different error-category
          pair from the state-vs-business conflict in the first instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Employer E1 holds a benefit window 2026-01-01 to 2026-12-31; the incoming listing carries one real and one unknown hospital id."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/employers"
              payload: { name: "E1 Benefits Trust", purchaser_type: "SELF_INSURED_EMPLOYER", minimum_acceptable_letter: "B", benefit_window_from: "2026-01-01T00:00:00Z", benefit_window_to: "2026-12-31T00:00:00Z", network_hospital_ids: ["${p0_id}"] }
              as: PurchaserAdmin
              as_user_id: "emp-e1"
              captures: { emp1_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/employers/${emp1_id}/network-listings"
              payload: { network_hospital_ids: ["${p0_id}", "00000000-0000-4000-8000-000000000099"], minimum_acceptable_letter: "B", benefit_window_from: "2026-03-01T00:00:00Z", benefit_window_to: "2026-09-30T00:00:00Z" }
              as: PurchaserAdmin
              as_user_id: "emp-e1"
              captures: { err_ref: $.data.error_id }
            - call: "POST /hospital-safety-rating/employers/${emp1_id}/network-listings"
              payload: { network_hospital_ids: ["${p0_id}"], minimum_acceptable_letter: "B", benefit_window_from: "2026-03-01T00:00:00Z", benefit_window_to: "2026-09-30T00:00:00Z" }
              as: PurchaserAdmin
              as_user_id: "emp-e1"
              captures: { err_temporal: $.data.error_id }
          assert:
            - "the response status is 404 and err_ref == ERR_HOSPITAL_NOT_FOUND"
            - "err_ref != ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT, even though the submitted window strictly contains the incumbent window"
            - "Employer.${emp1_id}.network_hospital_count == 1, so the rejected call did not mutate the listing"
            - "the corrected call returns 409 and err_temporal == ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT, proving the temporal tier is reachable once every id resolves"
  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: reliability_weight_exactly_at_cap_threshold
        grounds:
          - calculations.survey_certification_reliability
          - calculations.grade_assignment
          - validations[priority=14]
          - state_machines.Grade.SCORED_to_SCORED
        distinguishing_aspect: |
          A numeric threshold crossing compared with >= rather than >: a survey
          whose reliability_weight lands exactly on 0.6000 keeps its base
          letter, while 0.5999 forces a one-letter downgrade — a different
          metric from the empty-pending-correction edge the second instance
          carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P5 is pinned to M_MG and has a VERIFIED survey at sample_rate 0.3000 with 400 started responses out of a 500 scale, so reliability_weight is 0.5400 and the grade cap bites."
          setup_api_calls:
