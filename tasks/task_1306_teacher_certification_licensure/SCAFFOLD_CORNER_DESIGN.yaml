  - section: endpoints
    instances:
      - name: applications_list_filter_by_applicant
        claim_type: listing
        grounds: ["endpoints.GET /licensure/applications", entities.CredentialApplication.fields.applicant_id]
        distinguishing_aspect: "Filtered list: with two applicants holding one application each, GET /licensure/applications?applicant_id=<A> returns exactly A's application and total_count 1."
        test_recipe:
          setup: ["two applicants, one RECIPROCITY application each"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Dee Da", email: "deed@x.com", date_of_birth: "1988-01-01T00:00:00Z", ssn_last4: "3001", moral_character_attestation: true }, as: Anonymous, captures: { ap1: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap1}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap1}", captures: { app1: $.data.id } }
            - { call: "POST /licensure/applicants", payload: { full_name: "Earl Ea", email: "earl@x.com", date_of_birth: "1989-02-02T00:00:00Z", ssn_last4: "3002", moral_character_attestation: true }, as: Anonymous, captures: { ap2: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap2}", pathway: "RECIPROCITY", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap2}", captures: { app2: $.data.id } }
          trigger:
            - { call: "GET /licensure/applications?applicant_id=${ap1}", payload: {}, as: CredentialEvaluator }
          assert:
            - "response contains exactly 1 row and it is ${app1}"
            - "total_count == 1"

      - name: fee_payment_success_then_double_pay_rejected
        claim_type: valid_transition
        grounds: ["endpoints.POST /licensure/applications/{applicationId}/fee-payment", "errors[ERR_FEE_ALREADY_PAID]", entities.CredentialApplication.fields.fee_status]
        distinguishing_aspect: "Action endpoint: first payment flips fee_status UNPAID -> PAID and bumps version; second payment fails ERR_FEE_ALREADY_PAID."
        test_recipe:
          setup: ["Applicant with SUBMITTED application (version 1)"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Fox Fo", email: "fox@x.com", date_of_birth: "1990-03-03T00:00:00Z", ssn_last4: "3003", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "ELEMENTARY", grade_band: "PK_6" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}", captures: { fee_st: $.data.fee_status, app_v2: $.data.version } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_2" }, as: Applicant, as_user_id: "${ap}", captures: { err: $.data.error_id } }
          assert:
            - "first payment: fee_status == 'PAID', version == 2"
            - "second payment error_id == 'ERR_FEE_ALREADY_PAID'"

  # ==================================================================
  # Section: rbac
  # ==================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role / X-User-ID headers fails ERR_UNAUTHENTICATED (401) before role, existence, or state checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /licensure/applications/00000000-0000-4000-8000-000000000000", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_UNAUTHENTICATED'"
            - "http status == 401"

      - name: applicant_cannot_verify_transcript_forbidden
        claim_type: violation_to_error
        grounds: [roles.CredentialEvaluator, "errors[ERR_FORBIDDEN]", "endpoints.POST /licensure/transcripts/{transcriptId}/verify"]
        distinguishing_aspect: "Peer-role isolation: the Applicant role (even the owning applicant) cannot verify a transcript; verify is exclusive to CredentialEvaluator -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["Applicant with SUBMITTED application and one UNVERIFIED transcript"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Gia Gi", email: "gia@x.com", date_of_birth: "1991-04-04T00:00:00Z", ssn_last4: "3004", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: Applicant, as_user_id: "${ap}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_FORBIDDEN'"
            - "Transcript.${tr}.verification_status == 'UNVERIFIED'"

      - name: applicant_cannot_pay_others_fee_forbidden
        claim_type: violation_to_error
        grounds: [roles.Applicant, "errors[ERR_FORBIDDEN]", "validations[priority=2]"]
        distinguishing_aspect: "Ownership enforcement for the entity_backed Applicant role: applicant B paying applicant A's application fee fails ERR_FORBIDDEN."
        test_recipe:
          setup: ["applicants A and B; A has a SUBMITTED application"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Hal Ha2", email: "hal2@x.com", date_of_birth: "1992-05-05T00:00:00Z", ssn_last4: "3005", moral_character_attestation: true }, as: Anonymous, captures: { apA: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${apA}", pathway: "ALTERNATIVE", subject_area: "ELEMENTARY", grade_band: "PK_6" }, as: Applicant, as_user_id: "${apA}", captures: { appA: $.data.id } }
            - { call: "POST /licensure/applicants", payload: { full_name: "Ire Ir", email: "ire@x.com", date_of_birth: "1993-06-06T00:00:00Z", ssn_last4: "3006", moral_character_attestation: true }, as: Anonymous, captures: { apB: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications/${appA}/fee-payment", payload: { payment_token: "tok_x" }, as: Applicant, as_user_id: "${apB}", captures: { err: $.data.error_id } }
          assert:
