        distinguishing_aspect: "After a successful capacity patch bumps SessionSlot.version, replaying the pre-patch version yields 412."
        test_recipe:
          setup: ["slot created at version 1; one successful patch to capacity 12"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id, s_ver: $.data.version } }
