        claim_type: triggerable_error
        grounds: [errors.ERR_MISSING_AUTH_HEADERS, validations.priority_1]
        distinguishing_aspect: "A request declaring the Patient role but omitting X-User-ID is 401 ERR_MISSING_AUTH_HEADERS -- the identity header is mandatory for entity-backed roles even on a pure read."
        test_recipe:
          setup:
            - "One registered patient."
