            - "the immediately following period read shows reserved_cents 0, spent_cents 1787 and available_cents 48213 with no intermediate state visible"
            - "the program read shows program_spent_cents 1787, program_reserved_cents 0 and mtd_employer_captured_cents 1787 in the same request cycle"
            - "the imputed-income listing already contains the lazily created 2026-08 record with gross_employer_paid_cents 1787 and taxable_cents 0"
