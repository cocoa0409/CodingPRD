  # =========================================================================
  # Calculations (§1.3) — correct result, tier boundaries, chronological
  # accumulator, waterfall overflow, threshold cliff, input-set filtering
  # =========================================================================
  - section: calculations
    instances:
      - name: corner_deferral_match_cross_tier_straddle
        claim_type: tiered_pricing
        grounds:
          - calculations.deferral_match_per_period
          - entities.ContributionRecord.fields.deferral_match_cents
          - entities.ContributionRecord.fields.qslp_space_tier1_cents
          - entities.ContributionRecord.fields.qslp_space_tier2_cents
        distinguishing_aspect: "A 45000-cent deferral on 1000000 cents of counted compensation straddles both tiers: tier 1 is filled to its 30000-cent cap at 100% and only the 15000-cent excess is matched at 50%, giving deferral_match_cents 37500 with tier-1 QSLP space exhausted (0) and 5000 cents of tier-2 space left."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN at default tiers (3% at 100%, next 2% at 50%)."
            - "One Employee and one OPEN PayrollPeriod."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-STRADDLE", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
          trigger:
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 45000 }
              as: PayrollOperator
              captures: { cr_id: $.data.id, counted: $.data.counted_compensation_cents, match: $.data.deferral_match_cents, s1: $.data.qslp_space_tier1_cents, s2: $.data.qslp_space_tier2_cents }
          assert:
            - "counted == 1000000"
            - "match == 37500"
            - "s1 == 0"
            - "s2 == 5000"
            - "PayrollPeriod.${pp1_id}.total_deferral_match_cents == 37500"
            - "PlanYear.${py_id}.total_deferral_match_funded_cents == 37500"
            - "Employee.${emp_id}.ytd_deferral_match_cents == 37500"

      - name: corner_compensation_cap_accumulator_across_periods
        claim_type: chronological
        grounds:
          - calculations.deferral_match_per_period
          - entities.PlanYear.fields.compensation_cap_cents
          - entities.ContributionRecord.fields.counted_compensation_cents
        distinguishing_aspect: "The annual compensation cap is a chronological accumulator over period_number ASC: with the cap at 34500000 and two periods of 20000000 cents each, period 1 counts the full 20000000 and period 2 counts only the remaining 14500000, so ytd_eligible_compensation_cents lands exactly on the cap."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with compensation_cap_cents at its default 34500000."
            - "One Employee and two OPEN PayrollPeriods numbered 1 and 2."
            - "Payroll lines are posted in period_number order with zero elective deferral so the match stays 0 and only the cap accumulator is observed."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-CAP", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z", pay_date: "2026-07-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 2, start_date: "2026-07-01T00:00:00Z", end_date: "2026-12-31T23:59:59Z", pay_date: "2027-01-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp2_id: $.data.id }
          trigger:
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 20000000, elective_deferral_cents: 0 }
              as: PayrollOperator
              captures: { c1: $.data.counted_compensation_cents, m1: $.data.deferral_match_cents, t1a: $.data.qslp_space_tier1_cents }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp2_id}", eligible_compensation_cents: 20000000, elective_deferral_cents: 0 }
              as: PayrollOperator
              captures: { c2: $.data.counted_compensation_cents, m2: $.data.deferral_match_cents, t1b: $.data.qslp_space_tier1_cents }
          assert:
            - "c1 == 20000000"
            - "m1 == 0"
            - "t1a == 600000  # 3% of the 20000000 counted in period 1, entirely unused by deferrals"
            - "c2 == 14500000  # 34500000 cap minus 20000000 already counted"
            - "m2 == 0"
            - "t1b == 435000  # 3% of the capped 14500000, not of the raw 20000000"
            - "Employee.${emp_id}.ytd_eligible_compensation_cents == 34500000"
            - "PlanYear.${py_id}.total_deferral_match_funded_cents == 0"

      - name: corner_mirror_waterfall_spills_into_second_period
        claim_type: waterfall_allocation
        grounds:
          - calculations.qslp_mirror_allocation
          - calculations.qslp_eligible_amount
          - entities.MatchAllocation.fields.tier1_applied_cents
