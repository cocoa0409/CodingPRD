          assert:
            - "First call: HTTP 200 and the response body itself reports entry_status == CONFIRMED, armband_number == 1 and entry_fee_cents == 4663 - no re-read is needed to see either value"
            - "First call: Entry.levy_cents == 263, Entry.net_fee_cents == 4663 and Entry.fee_basis == PROVISIONAL"
            - "Second call: HTTP 200 and every field equals the first response, including version == 2"
            - "Third call: HTTP 200 and ShowClass.entry_count == 1 with present_count == 0 - the class rollup is already current on the first read after the write"
            - "Fourth call: HTTP 200, Show.confirmed_entry_count == 1, Show.armband_high_water == 1, Show.fee_charged_cents == 4663 and Show.levy_total_cents == 263"
          notes: |
            Every counter asserted here lives on a different row from the Entry that was written, which is exactly what an immediate model has to guarantee: one round trip, not eventual convergence.
      - name: class_completion_fan_out_is_visible_on_the_first_read_of_every_touched_row
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.championship_points_award
          - entities.Entry.fields.points_awarded
          - entities.Dog.fields.championship_points_total
          - entities.Show.fields.points_awarded_total
          - state_machines.Entry.CHECKED_IN_to_JUDGED
          - endpoints[POST /dog-shows/classes/{id}/complete]
          - endpoints[GET /dog-shows/dogs/{id}]
          - endpoints[GET /dog-shows/shows/{id}]
        distinguishing_aspect: "Completion is the widest single write in the scaffold - it moves every checked-in entry, writes placements and points, and re-sums two rollups on rows the request never named. Under an immediate model all of that has to be observable on the first read of each row, and the class response must already carry counted_dog_count and base_points."
