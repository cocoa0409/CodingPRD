  # ------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_paused_requisition_beats_budget_error
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_REQUISITION_NOT_OPEN]
          - errors[ERR_REQUISITION_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (p6) vs business_fiscal (p12): the submit request
          violates BOTH (requisition PAUSED and fully_loaded 26000000 >
          remaining budget 20000000); the state error ERR_REQUISITION_NOT_OPEN
          must win over ERR_REQUISITION_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Requisition (budget 20000000, standard range, headcount 1) OPEN, then PAUSED"
            - "Offer base 20000000 pct 0 (fully_loaded 26000000) created while OPEN"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Tight Budget", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 20000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand N", email: "cand.n@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/hold"
              payload: { action: PAUSE }
              as: HiringManager
              as_user_id: hm-1
          trigger:
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REQUISITION_NOT_OPEN (state category p6 outranks business_fiscal p12 even though the budget gate would also fail)"
            - "Offer.${offer_id}.status remains DRAFT"
            - "Requisition.${req_id}.committed_budget_cents == 0"

