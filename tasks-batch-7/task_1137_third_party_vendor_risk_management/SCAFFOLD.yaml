scenario: |
  1137. Third-Party & Vendor Risk Management (financial institution): vendor
  inventory & criticality tiering, due diligence package & financial/security
  review, contract requirement (right to audit/SLA/exit), ongoing monitoring
  cadence by tier, fourth-party/subcontractor identification, issue/incident
  tracking & remediation, concentration & business continuity assessment,
  board reporting & regulatory expectation.

domain_name: third-party-vendor-risk-management
api_prefix: /tprm

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
    - soft_delete

  entity_topology: hybrid
  # Hybrid: Vendor → VendorEngagement → {DueDiligencePackage, Contract, FourthParty,
  # Incident → RemediationPlan} is a strict tree for the vendor-management core,
  # while MonitoringCycle / ConcentrationAssessment / BusinessContinuityTest /
  # AuditExercise / BoardReport cut cross-aggregate references back into Vendor
  # and VendorEngagement.

  state_machine_shape: compound
  # VendorEngagement.status is compound (gated on child DD package + contract
  # clauses + fourth-party acknowledgements); Vendor.tier_posture is derived
  # from open Incidents and overdue MonitoringCycles; parallel dimensions on
  # VendorEngagement (lifecycle_status × risk_attention_state).

  relationship_patterns:
    - one_to_many         # Vendor → VendorEngagement; Engagement → DD/Contract/Incident/…
    - many_to_many        # FourthParty ↔ Engagement (a subcontractor can serve many engagements)
    - self_referential    # FourthParty.parent_fourth_party_id (a sub-sub-contractor chain)
    - cross_aggregate     # MonitoringCycle/BCPTest/AuditExercise reference Vendor+Engagement

  role_model: segregation_of_duties
  # VendorRelationshipManager onboards but cannot approve own due-diligence package.
  # RiskOfficer approves DD and tier changes but cannot remediate own reported incident.
  # InternalAuditor exercises right-to-audit and is excluded from day-to-day ops.
  # BusinessUnitOwner accepts remediation outcome but cannot close an incident they raised.
  # ComplianceDirector publishes board reports; nobody else can.
  # PlatformAdmin is the operational superuser for clock/injection endpoints only.

  consistency_model: immediate
  # All side effects (tier recompute, posture recompute, monitoring schedule
  # rebalance, ledger sync) are atomic within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name,          type: string,   source: input,    description: "Registered legal name of the vendor; unique across non-archived vendors." }
      - { name: headquarters_region, type: enum,     source: input,    description: "NA | EMEA | APAC | LATAM — used for concentration assessment.", constraints: "enum" }
      - { name: service_category,    type: enum,     source: input,    description: "CLOUD_INFRA | PAYMENTS | KYC_AML | DATA_ANALYTICS | CUSTODIAL | BPO | LEGAL | OTHER.", constraints: "enum" }
      - { name: criticality_tier,    type: enum,     source: system,   default: "TIER_3", description: "TIER_1_CRITICAL | TIER_2_HIGH | TIER_3_STANDARD | TIER_4_LOW. Initial value TIER_3; transitions only via RiskOfficer tier-change action.", constraints: "enum" }
      - { name: status,              type: enum,     source: system,   default: "ONBOARDING", description: "ONBOARDING | ACTIVE | SUSPENDED | EXITED.", constraints: "enum" }
      - { name: tier_posture,        type: enum,     source: computed, default: "CLEAN", description: "CLEAN | WATCH | ESCALATED | BREACH. Derived from open incidents + overdue monitoring cycles + failed BCP tests.", constraints: "enum" }
      - { name: composite_risk_score, type: number,  source: computed, default: 0, description: "0..100 weighted score; see calculation composite_risk_score." }
      - { name: onboarded_by_user_id, type: string,  source: system,   description: "X-User-ID of the VendorRelationshipManager who created the vendor. Used for segregation-of-duties checks." }
      - { name: archived_at,         type: datetime, source: system,   description: "NULL while active; set when vendor is soft-archived after EXITED." }
      - { name: next_monitoring_due_at, type: datetime, source: computed, description: "Next scheduled MonitoringCycle due instant, derived from tier cadence. NULL when status != ACTIVE." }

  - name: VendorEngagement
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id,           type: string,   source: system,   description: "FK -> Vendor.id; owning vendor." }
      - { name: engagement_code,     type: string,   source: input,    description: "Business identifier unique within the vendor (e.g. 'CARD-PROC-2026-01')." }
      - { name: service_summary,     type: string,   source: input,    description: "Free-text description of the outsourced service." }
      - { name: annual_spend_cents,  type: integer,  source: input,    description: "Contracted annual spend; feeds concentration assessment. Must be >= 0." }
      - { name: data_sensitivity,    type: enum,     source: input,    description: "PUBLIC | INTERNAL | CONFIDENTIAL | REGULATED.", constraints: "enum" }
      - { name: lifecycle_status,    type: enum,     source: system,   default: "DRAFT", description: "DRAFT | DD_IN_PROGRESS | DD_APPROVED | CONTRACTING | ACTIVE | EXITING | EXITED | TERMINATED_FOR_CAUSE.", constraints: "enum" }
      - { name: risk_attention_state, type: enum,    source: system,   default: "NORMAL", description: "NORMAL | UNDER_REVIEW | REMEDIATION_REQUIRED. Parallel dimension to lifecycle_status; driven by open incidents and audit findings.", constraints: "enum" }
      - { name: started_by_user_id,  type: string,   source: system,   description: "X-User-ID of creator. Used to enforce SoD (creator cannot approve own DD)." }
      - { name: exit_readiness_score, type: number,  source: computed, description: "0..100 computed at EXITING entry; see calculation exit_readiness_score." }

  - name: DueDiligencePackage
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: financial_review_score, type: integer, source: input,  description: "0..100 from financial review analyst.", constraints: "0..100 integer" }
      - { name: security_review_score,  type: integer, source: input,  description: "0..100 from security review analyst.", constraints: "0..100 integer" }
      - { name: compliance_review_score,type: integer, source: input,  description: "0..100 from compliance review analyst.", constraints: "0..100 integer" }
      - { name: financial_reviewer_id,  type: string, source: input,   description: "X-User-ID of the financial analyst. Must differ from submitter." }
      - { name: security_reviewer_id,   type: string, source: input,   description: "X-User-ID of the security analyst. Must differ from submitter." }
      - { name: compliance_reviewer_id, type: string, source: input,   description: "X-User-ID of the compliance analyst. Must differ from submitter." }
      - { name: aggregate_dd_score,  type: number,   source: computed, description: "Weighted 0..100; see calculation dd_aggregate_score." }
      - { name: dd_outcome,          type: enum,     source: computed, description: "PENDING | PASS | CONDITIONAL_PASS | FAIL; derived from aggregate_dd_score vs tier thresholds.", constraints: "enum" }
      - { name: status,              type: enum,     source: system,   default: "DRAFT", description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUPERSEDED.", constraints: "enum" }
      - { name: submitted_by_user_id, type: string,  source: system,   description: "X-User-ID captured at SUBMITTED transition; cannot equal any of the three reviewer ids (SoD)." }
      - { name: approver_user_id,    type: string,   source: system,   description: "X-User-ID of RiskOfficer who approved; NULL until APPROVED." }
      - { name: review_round,        type: integer,  source: system,   default: 1, description: "Increments each time package returns from REJECTED to SUBMITTED." }

  - name: Contract
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: contract_reference,  type: string,   source: input,    description: "External contract number; unique per vendor." }
      - { name: effective_date,      type: datetime, source: input,    description: "Contract effective date (UTC)." }
      - { name: expiry_date,         type: datetime, source: input,    description: "Contract expiry; must be > effective_date." }
      - { name: has_right_to_audit_clause,   type: boolean, source: input, description: "Mandatory for TIER_1/TIER_2 engagements; regulatory expectation." }
      - { name: has_sla_terms,               type: boolean, source: input, description: "Mandatory for all tiers." }
      - { name: has_exit_plan_section,       type: boolean, source: input, description: "Mandatory for TIER_1 engagements." }
      - { name: sla_uptime_pct,      type: number,   source: input,    description: "Committed uptime percentage; used by Incident SLA breach classification. 90.000..100.000." }
      - { name: breach_cure_window_days, type: integer, source: input, description: "Days vendor has to cure an SLA breach before escalation. >= 1." }
      - { name: renewal_notice_days, type: integer,  source: input,    description: "Days before expiry by which renewal intent must be logged. >= 0." }
      - { name: status,              type: enum,     source: system,   default: "DRAFT", description: "DRAFT | EXECUTED | EXPIRED | TERMINATED.", constraints: "enum" }
      - { name: version_pin_dd_package_id, type: string, source: system, description: "FK -> DueDiligencePackage.id; pinned at EXECUTED transition. Subsequent DD package modifications do not revalidate the contract — only a new EXECUTE does.", constraints: "nullable until EXECUTED" }

  - name: FourthParty
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: name,                type: string,   source: input,    description: "Subcontractor legal name." }
      - { name: service_provided,    type: string,   source: input,    description: "What the subcontractor does for this engagement." }
      - { name: parent_fourth_party_id, type: string, source: input,   description: "FK -> FourthParty.id; NULL if direct subcontractor; non-NULL = sub-sub-contractor chain (self-referential).", constraints: "nullable" }
      - { name: data_access_level,   type: enum,     source: input,    description: "NONE | METADATA | PII | REGULATED_PII.", constraints: "enum" }
      - { name: acknowledgement_status, type: enum,  source: system,   default: "PENDING", description: "PENDING | ACKNOWLEDGED | REJECTED. Engagement cannot enter ACTIVE while any PENDING.", constraints: "enum" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "RiskOfficer who acknowledged; NULL until ACKNOWLEDGED." }

  - name: MonitoringCycle
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id,           type: string,   source: system,   description: "FK -> Vendor.id." }
      - { name: cycle_index,         type: integer,  source: system,   description: "Monotonic per vendor: 1, 2, 3, ..." }
      - { name: due_at,              type: datetime, source: system,   description: "Set at creation from tier cadence; see calculation next_monitoring_due." }
      - { name: cadence_days,        type: integer,  source: system,   description: "Snapshot of the cadence in force at scheduling time (tier-driven)." }
      - { name: status,              type: enum,     source: system,   default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED_ON_TIME | COMPLETED_LATE | OVERDUE | WAIVED.", constraints: "enum" }
      - { name: completed_at,        type: datetime, source: system,   description: "NULL until COMPLETED_* transition." }
      - { name: findings_summary,    type: string,   source: input,    description: "Optional free-text on completion.", constraints: "nullable" }
      - { name: waived_by_user_id,   type: string,   source: system,   description: "ComplianceDirector who waived; NULL unless WAIVED. Waive is only permitted for TIER_4_LOW vendors." }

  - name: Incident
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: incident_type,       type: enum,     source: input,    description: "DATA_BREACH | SLA_BREACH | OUTAGE | FINANCIAL_DISTRESS | REGULATORY_FINDING | FOURTH_PARTY_EVENT.", constraints: "enum" }
      - { name: severity,            type: enum,     source: input,    description: "SEV_1 | SEV_2 | SEV_3 | SEV_4.", constraints: "enum" }
      - { name: detected_at,         type: datetime, source: input,    description: "When the incident occurred / was detected (UTC)." }
      - { name: reported_by_user_id, type: string,   source: system,   description: "X-User-ID of BusinessUnitOwner who filed." }
      - { name: status,              type: enum,     source: system,   default: "OPEN", description: "OPEN | TRIAGED | REMEDIATION_PLANNED | REMEDIATION_IN_PROGRESS | AWAITING_VERIFICATION | CLOSED | REOPENED.", constraints: "enum" }
      - { name: remediation_due_at,  type: datetime, source: computed, description: "Set at TRIAGED; severity-driven deadline. See calculation remediation_deadline." }
      - { name: closed_at,           type: datetime, source: system,   description: "NULL until CLOSED." }
      - { name: reopen_count,        type: integer,  source: system,   default: 0, description: "Increments each CLOSED -> REOPENED transition." }

  - name: RemediationPlan
    parent: Incident
    common_fields: true
    fields:
      - { name: incident_id,         type: string,   source: system,   description: "FK -> Incident.id." }
      - { name: plan_summary,        type: string,   source: input,    description: "What will be done to remediate." }
      - { name: committed_completion_date, type: datetime, source: input, description: "Vendor-committed fix date. Must be <= incident.remediation_due_at." }
      - { name: owner_user_id,       type: string,   source: system,   description: "X-User-ID of RiskOfficer drafting plan. Must differ from incident.reported_by_user_id (SoD)." }
      - { name: verification_evidence_uri, type: string, source: input, description: "URI of evidence attached at verification time.", constraints: "nullable until submit-verification" }
      - { name: status,              type: enum,     source: system,   default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | IN_EXECUTION | VERIFICATION_SUBMITTED | VERIFIED | REJECTED.", constraints: "enum" }
      - { name: approved_by_user_id, type: string,   source: system,   description: "RiskOfficer approver. Must differ from owner_user_id AND from incident.reported_by_user_id." }

  - name: ConcentrationAssessment
    parent: null
    common_fields: true
    fields:
      - { name: assessment_window_start, type: datetime, source: input, description: "Inclusive start of the aggregation window (UTC)." }
      - { name: assessment_window_end,   type: datetime, source: input, description: "Exclusive end of the aggregation window (UTC). Must be > start." }
      - { name: grouping_dimension,      type: enum,     source: input, description: "REGION | SERVICE_CATEGORY.", constraints: "enum" }
      - { name: status,                  type: enum,     source: system, default: "COMPUTING", description: "COMPUTING | PUBLISHED | SUPERSEDED.", constraints: "enum" }
      - { name: computed_at,             type: datetime, source: system, description: "Server-stamped at PUBLISHED." }
      - { name: published_by_user_id,    type: string,   source: system, description: "ComplianceDirector publisher." }
      - { name: breach_bucket_keys,      type: array,    source: computed, description: "List of bucket keys (region or category) whose share exceeded threshold." }

  - name: ConcentrationBucket
    parent: ConcentrationAssessment
    common_fields: false
    fields:
      - { name: assessment_id,       type: string,   source: system,   description: "FK -> ConcentrationAssessment.id." }
      - { name: bucket_key,          type: string,   source: system,   description: "Region code (e.g. 'EMEA') or service_category code." }
      - { name: total_spend_cents,   type: integer,  source: computed, description: "Sum of VendorEngagement.annual_spend_cents for ACTIVE engagements whose vendor falls in the bucket." }
      - { name: share_pct,           type: number,   source: computed, description: "Bucket spend / grand total spend * 100; 2dp round_half_up." }
      - { name: is_breach,           type: boolean,  source: computed, description: "share_pct >= threshold in force (default 25.00%)." }

  - name: BusinessContinuityTest
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: scheduled_for,       type: datetime, source: input,    description: "Planned BCP test execution instant (UTC). Must be in the future at create." }
      - { name: scenario,            type: enum,     source: input,    description: "FULL_FAILOVER | PARTIAL_DEGRADATION | CYBER_INCIDENT | DATA_RESTORE.", constraints: "enum" }
      - { name: rto_target_minutes,  type: integer,  source: input,    description: "Recovery Time Objective in minutes. >= 1." }
      - { name: rpo_target_minutes,  type: integer,  source: input,    description: "Recovery Point Objective in minutes. >= 0." }
      - { name: actual_rto_minutes,  type: integer,  source: input,    description: "Measured at result-submission. >= 0.", constraints: "nullable until result submitted" }
      - { name: actual_rpo_minutes,  type: integer,  source: input,    description: "Measured at result-submission. >= 0.", constraints: "nullable until result submitted" }
      - { name: status,              type: enum,     source: system,   default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | CANCELLED.", constraints: "enum" }
      - { name: outcome,             type: enum,     source: computed, description: "PASS | FAIL; NULL until result submitted. FAIL when actual_rto_minutes > rto_target_minutes OR actual_rpo_minutes > rpo_target_minutes.", constraints: "enum" }

  - name: AuditExercise
    parent: VendorEngagement
    common_fields: true
    fields:
      - { name: engagement_id,       type: string,   source: system,   description: "FK -> VendorEngagement.id." }
      - { name: scope,               type: enum,     source: input,    description: "SECURITY | FINANCIAL | OPERATIONAL | REGULATORY | FULL.", constraints: "enum" }
      - { name: exercised_by_user_id, type: string,  source: system,   description: "InternalAuditor exercising the right-to-audit. Must differ from engagement.started_by_user_id (SoD)." }
      - { name: initiated_at,        type: datetime, source: system,   description: "Server-stamped at creation." }
      - { name: findings_count,      type: integer,  source: computed, default: 0, description: "Number of findings attached." }
      - { name: status,              type: enum,     source: system,   default: "INITIATED", description: "INITIATED | FIELDWORK | FINDINGS_ISSUED | CLOSED.", constraints: "enum" }
      - { name: closed_at,           type: datetime, source: system,   description: "NULL until CLOSED." }

  - name: AuditFinding
    parent: AuditExercise
    common_fields: false
    fields:
      - { name: audit_exercise_id,   type: string,   source: system,   description: "FK -> AuditExercise.id." }
      - { name: severity,            type: enum,     source: input,    description: "SEV_1 | SEV_2 | SEV_3 | SEV_4.", constraints: "enum" }
      - { name: description,         type: string,   source: input,    description: "Finding narrative." }
      - { name: raised_incident_id,  type: string,   source: system,   description: "FK -> Incident.id; if severity is SEV_1 or SEV_2 the system auto-raises an Incident on the same engagement.", constraints: "nullable" }

  - name: BoardReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start,        type: datetime, source: input,    description: "Inclusive reporting period start (UTC)." }
      - { name: period_end,          type: datetime, source: input,    description: "Exclusive reporting period end (UTC)." }
      - { name: status,              type: enum,     source: system,   default: "DRAFT", description: "DRAFT | PUBLISHED. PUBLISHED is immutable.", constraints: "enum" }
      - { name: snapshot_payload,    type: object,   source: computed, description: "Aggregated KPIs computed at PUBLISH time; see calculation board_report_snapshot." }
      - { name: published_at,        type: datetime, source: system,   description: "Server-stamped at PUBLISHED." }
      - { name: published_by_user_id, type: string,  source: system,   description: "ComplianceDirector publisher." }

  - name: RiskTierChangeLog
    parent: Vendor
    common_fields: false
    fields:
      - { name: vendor_id,           type: string,   source: system,   description: "FK -> Vendor.id." }
      - { name: from_tier,           type: enum,     source: system,   description: "Tier before change.", constraints: "enum" }
      - { name: to_tier,             type: enum,     source: system,   description: "Tier after change.", constraints: "enum" }
      - { name: reason,              type: string,   source: input,    description: "Why the RiskOfficer changed the tier." }
      - { name: changed_by_user_id,  type: string,   source: system,   description: "RiskOfficer." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Vendor
    initial_state: ONBOARDING
    terminal_states: [EXITED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /tprm/vendors/{id}/activate"
        actor: RiskOfficer
        preconditions:
          - "vendor.status == ONBOARDING (ERR_VENDOR_NOT_ONBOARDING)"
          - "at least one VendorEngagement with lifecycle_status == ACTIVE exists for this vendor (ERR_NO_ACTIVE_ENGAGEMENT)"
          - "no OPEN/REOPENED Incident with severity == SEV_1 on any engagement of this vendor (ERR_OPEN_SEV1_INCIDENT)"
        side_effects:
          - "recompute vendor.composite_risk_score"
          - "create MonitoringCycle #1 with due_at per tier cadence (see calculation next_monitoring_due)"
          - "set vendor.next_monitoring_due_at = MonitoringCycle[1].due_at"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tprm/vendors/{id}/suspend"
        actor: RiskOfficer
        preconditions:
          - "vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "at least one triggering condition: (a) OPEN/REOPENED SEV_1 incident, (b) any MonitoringCycle OVERDUE by > 30 days, (c) FAILED BusinessContinuityTest on a TIER_1 engagement"
        side_effects:
          - "all ACTIVE VendorEngagement for vendor -> risk_attention_state = UNDER_REVIEW"
          - "vendor.next_monitoring_due_at := NULL (no new cycles while suspended)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tprm/vendors/{id}/reinstate"
        actor: RiskOfficer
        preconditions:
          - "vendor.status == SUSPENDED (ERR_VENDOR_NOT_SUSPENDED)"
          - "no OPEN/REOPENED SEV_1 incidents on any engagement"
          - "no MonitoringCycle in OVERDUE status"
        side_effects:
          - "recompute vendor.composite_risk_score"
          - "schedule next MonitoringCycle from now per tier cadence"

      - from: ACTIVE
        to: EXITED
        trigger: "POST /tprm/vendors/{id}/exit"
        actor: RiskOfficer
        preconditions:
          - "vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "every VendorEngagement.lifecycle_status IN {EXITED, TERMINATED_FOR_CAUSE} (ERR_ENGAGEMENTS_NOT_EXITED)"
          - "no OPEN/REOPENED incidents on any engagement (ERR_OPEN_INCIDENTS_REMAIN)"
        side_effects:
          - "set vendor.archived_at := now (soft archive)"
          - "vendor.next_monitoring_due_at := NULL"

  - entity: VendorEngagement
    initial_state: DRAFT
    terminal_states: [EXITED, TERMINATED_FOR_CAUSE]
    transitions:
      - from: DRAFT
        to: DD_IN_PROGRESS
        trigger: "POST /tprm/engagements/{id}/due-diligence-packages  (creation of first DD package)"
        actor: VendorRelationshipManager
        preconditions:
          - "engagement.lifecycle_status == DRAFT (ERR_ENGAGEMENT_NOT_DRAFT)"
        side_effects:
          - "engagement.lifecycle_status := DD_IN_PROGRESS"

      - from: DD_IN_PROGRESS
        to: DD_APPROVED
        trigger: "system — fires when latest DueDiligencePackage reaches APPROVED"
        actor: system
        preconditions:
          - "most recent DueDiligencePackage.status == APPROVED"
          - "most recent DueDiligencePackage.dd_outcome IN {PASS, CONDITIONAL_PASS} (ERR_DD_OUTCOME_FAIL)"
        side_effects:
          - "engagement.lifecycle_status := DD_APPROVED"

      - from: DD_APPROVED
        to: CONTRACTING
        trigger: "POST /tprm/engagements/{id}/contracts (creation of Contract)"
        actor: VendorRelationshipManager
        preconditions:
          - "engagement.lifecycle_status == DD_APPROVED (ERR_DD_NOT_APPROVED)"
        side_effects:
          - "engagement.lifecycle_status := CONTRACTING"

      - from: CONTRACTING
        to: ACTIVE
        trigger: "POST /tprm/contracts/{id}/execute"
        actor: RiskOfficer
        preconditions:
          - "contract.status == DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "contract.has_sla_terms == true (ERR_MISSING_SLA_TERMS)"
          - "if vendor.criticality_tier IN {TIER_1_CRITICAL, TIER_2_HIGH}: contract.has_right_to_audit_clause == true (ERR_MISSING_AUDIT_CLAUSE)"
          - "if vendor.criticality_tier == TIER_1_CRITICAL: contract.has_exit_plan_section == true (ERR_MISSING_EXIT_PLAN)"
          - "all FourthParty rows on this engagement have acknowledgement_status == ACKNOWLEDGED (ERR_FOURTH_PARTY_PENDING)"
        side_effects:
          - "contract.status := EXECUTED"
          - "contract.version_pin_dd_package_id := most recent APPROVED DueDiligencePackage.id (pinned)"
          - "engagement.lifecycle_status := ACTIVE"
          - "vendor.composite_risk_score recompute"
          - "if vendor.status == ONBOARDING: vendor remains ONBOARDING (activation is a separate RiskOfficer step)"

      - from: ACTIVE
        to: EXITING
        trigger: "POST /tprm/engagements/{id}/initiate-exit"
        actor: VendorRelationshipManager
        preconditions:
          - "engagement.lifecycle_status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "no OPEN/REOPENED incidents with severity IN {SEV_1, SEV_2} (ERR_BLOCKING_INCIDENTS_OPEN)"
        side_effects:
          - "engagement.lifecycle_status := EXITING"
          - "compute engagement.exit_readiness_score per calculation exit_readiness_score"

      - from: EXITING
        to: EXITED
        trigger: "POST /tprm/engagements/{id}/finalize-exit"
        actor: RiskOfficer
        preconditions:
          - "engagement.lifecycle_status == EXITING (ERR_ENGAGEMENT_NOT_EXITING)"
          - "engagement.exit_readiness_score >= 80.00 (ERR_EXIT_READINESS_TOO_LOW)"
          - "no OPEN/REOPENED incidents (ERR_OPEN_INCIDENTS_REMAIN)"
        side_effects:
          - "engagement.lifecycle_status := EXITED"
          - "engagement.risk_attention_state := NORMAL"

      - from: ACTIVE
        to: TERMINATED_FOR_CAUSE
        trigger: "POST /tprm/engagements/{id}/terminate-for-cause"
        actor: RiskOfficer
        preconditions:
          - "engagement.lifecycle_status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "at least one OPEN/REOPENED SEV_1 incident (ERR_NO_SEV1_INCIDENT)"
        side_effects:
          - "engagement.lifecycle_status := TERMINATED_FOR_CAUSE"
          - "engagement.risk_attention_state := REMEDIATION_REQUIRED"
          - "contract.status := TERMINATED"

  - entity: DueDiligencePackage
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tprm/due-diligence-packages/{id}/submit"
        actor: VendorRelationshipManager
        preconditions:
          - "package.status == DRAFT (ERR_DD_NOT_DRAFT)"
          - "all three review scores present (financial, security, compliance)"
        side_effects:
          - "package.submitted_by_user_id := X-User-ID"
          - "compute package.aggregate_dd_score per calculation dd_aggregate_score"
          - "compute package.dd_outcome"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /tprm/due-diligence-packages/{id}/begin-review"
        actor: RiskOfficer
        preconditions:
          - "package.status == SUBMITTED (ERR_DD_NOT_SUBMITTED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tprm/due-diligence-packages/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "package.status == UNDER_REVIEW (ERR_DD_NOT_UNDER_REVIEW)"
          - "X-User-ID != package.submitted_by_user_id (ERR_SOD_DD_SELF_APPROVE)"
          - "package.dd_outcome IN {PASS, CONDITIONAL_PASS} (ERR_DD_OUTCOME_FAIL)"
        side_effects:
          - "package.approver_user_id := X-User-ID"
          - "engagement.lifecycle_status := DD_APPROVED (if currently DD_IN_PROGRESS)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /tprm/due-diligence-packages/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "package.status == UNDER_REVIEW (ERR_DD_NOT_UNDER_REVIEW)"
          - "X-User-ID != package.submitted_by_user_id (ERR_SOD_DD_SELF_APPROVE)"
        side_effects: []

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /tprm/due-diligence-packages/{id}/resubmit"
        actor: VendorRelationshipManager
        preconditions:
          - "package.status == REJECTED (ERR_DD_NOT_REJECTED)"
          - "package.review_round < 3 (ERR_DD_REVIEW_ROUND_EXHAUSTED)"
        side_effects:
          - "package.review_round += 1"
          - "recompute aggregate_dd_score and dd_outcome from (possibly edited) review scores"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — fires when a NEWER DueDiligencePackage on the same engagement reaches APPROVED"
        actor: system
        preconditions:
          - "exists another DueDiligencePackage on same engagement with status == APPROVED and created_at > this.created_at"
        side_effects:
          - "this.status := SUPERSEDED"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /tprm/contracts/{id}/execute"
        actor: RiskOfficer
        preconditions:
          - "see VendorEngagement.CONTRACTING->ACTIVE preconditions"
        side_effects:
          - "see VendorEngagement.CONTRACTING->ACTIVE side_effects"

      - from: EXECUTED
        to: EXPIRED
        trigger: "system — when logical clock advances past contract.expiry_date AND engagement.lifecycle_status != ACTIVE"
        actor: system
        preconditions:
          - "now >= contract.expiry_date"
          - "engagement.lifecycle_status IN {EXITING, EXITED, TERMINATED_FOR_CAUSE}"
        side_effects:
          - "contract.status := EXPIRED"

      - from: EXECUTED
        to: TERMINATED
        trigger: "system — fires from VendorEngagement.ACTIVE->TERMINATED_FOR_CAUSE"
        actor: system
        preconditions:
          - "engagement terminated for cause"
        side_effects:
          - "contract.status := TERMINATED"

  - entity: FourthParty
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, REJECTED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /tprm/fourth-parties/{id}/acknowledge"
        actor: RiskOfficer
        preconditions:
          - "fourth_party.acknowledgement_status == PENDING (ERR_FP_NOT_PENDING)"
          - "if fourth_party.data_access_level == REGULATED_PII: vendor.criticality_tier IN {TIER_1_CRITICAL, TIER_2_HIGH} (ERR_FP_PII_TIER_TOO_LOW)"
        side_effects:
          - "fourth_party.acknowledged_by_user_id := X-User-ID"

      - from: PENDING
        to: REJECTED
        trigger: "POST /tprm/fourth-parties/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "fourth_party.acknowledgement_status == PENDING (ERR_FP_NOT_PENDING)"
        side_effects:
          - "engagement.risk_attention_state := UNDER_REVIEW"

  - entity: MonitoringCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_ON_TIME, COMPLETED_LATE, WAIVED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /tprm/monitoring-cycles/{id}/begin"
        actor: RiskOfficer
        preconditions:
          - "cycle.status == SCHEDULED (ERR_CYCLE_NOT_SCHEDULED)"
          - "vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED_ON_TIME
        trigger: "POST /tprm/monitoring-cycles/{id}/complete"
        actor: RiskOfficer
        preconditions:
          - "cycle.status == IN_PROGRESS (ERR_CYCLE_NOT_IN_PROGRESS)"
          - "now <= cycle.due_at (ERR_CYCLE_OVERDUE_FOR_ON_TIME — system maps to COMPLETED_LATE otherwise)"
        side_effects:
          - "cycle.completed_at := now"
          - "schedule next MonitoringCycle for vendor per tier cadence"
          - "vendor.next_monitoring_due_at := next_cycle.due_at"

      - from: IN_PROGRESS
        to: COMPLETED_LATE
        trigger: "POST /tprm/monitoring-cycles/{id}/complete (when now > cycle.due_at)"
        actor: RiskOfficer
        preconditions:
          - "cycle.status == IN_PROGRESS"
          - "now > cycle.due_at"
        side_effects:
          - "cycle.completed_at := now"
          - "vendor.tier_posture recompute (likely WATCH or ESCALATED)"
          - "schedule next MonitoringCycle"

      - from: SCHEDULED
        to: OVERDUE
        trigger: "system — logical clock advances past cycle.due_at while cycle still SCHEDULED or IN_PROGRESS"
        actor: system
        preconditions:
          - "now > cycle.due_at AND cycle.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "cycle.status := OVERDUE"
          - "vendor.tier_posture recompute"

      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /tprm/monitoring-cycles/{id}/waive"
        actor: ComplianceDirector
        preconditions:
          - "cycle.status == SCHEDULED (ERR_CYCLE_NOT_SCHEDULED)"
          - "vendor.criticality_tier == TIER_4_LOW (ERR_WAIVE_TIER_FORBIDDEN)"
        side_effects:
          - "cycle.waived_by_user_id := X-User-ID"
          - "schedule next MonitoringCycle per tier cadence"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /tprm/incidents/{id}/triage"
        actor: RiskOfficer
        preconditions:
          - "incident.status == OPEN (ERR_INCIDENT_NOT_OPEN)"
        side_effects:
          - "compute incident.remediation_due_at per calculation remediation_deadline"
          - "engagement.risk_attention_state := UNDER_REVIEW (if currently NORMAL)"
          - "vendor.tier_posture recompute"

      - from: TRIAGED
        to: REMEDIATION_PLANNED
        trigger: "POST /tprm/incidents/{id}/remediation-plans (creation of first plan)"
        actor: RiskOfficer
        preconditions:
          - "incident.status == TRIAGED (ERR_INCIDENT_NOT_TRIAGED)"
          - "X-User-ID != incident.reported_by_user_id (ERR_SOD_INCIDENT_SELF_REMEDIATE)"
        side_effects:
          - "incident.status := REMEDIATION_PLANNED"

      - from: REMEDIATION_PLANNED
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /tprm/remediation-plans/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "plan.status == SUBMITTED"
          - "X-User-ID != plan.owner_user_id AND X-User-ID != incident.reported_by_user_id (ERR_SOD_PLAN_SELF_APPROVE)"
        side_effects:
          - "plan.status := APPROVED then IN_EXECUTION (atomic two-step within the request)"
          - "incident.status := REMEDIATION_IN_PROGRESS"

      - from: REMEDIATION_IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "POST /tprm/remediation-plans/{id}/submit-verification"
        actor: RiskOfficer
        preconditions:
          - "plan.status == IN_EXECUTION (ERR_PLAN_NOT_IN_EXECUTION)"
          - "plan.verification_evidence_uri IS NOT NULL (ERR_EVIDENCE_REQUIRED)"
        side_effects:
          - "plan.status := VERIFICATION_SUBMITTED"
          - "incident.status := AWAITING_VERIFICATION"

      - from: AWAITING_VERIFICATION
        to: CLOSED
        trigger: "POST /tprm/remediation-plans/{id}/verify"
        actor: BusinessUnitOwner
        preconditions:
          - "plan.status == VERIFICATION_SUBMITTED (ERR_PLAN_NOT_VERIFICATION_SUBMITTED)"
          - "X-User-ID == incident.reported_by_user_id (ERR_SOD_VERIFY_NOT_REPORTER)"
        side_effects:
          - "plan.status := VERIFIED"
          - "incident.status := CLOSED"
          - "incident.closed_at := now"
          - "engagement.risk_attention_state := NORMAL if no other OPEN/REOPENED incidents on engagement"
          - "vendor.tier_posture recompute"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /tprm/incidents/{id}/reopen"
        actor: BusinessUnitOwner
        preconditions:
          - "incident.status == CLOSED (ERR_INCIDENT_NOT_CLOSED)"
          - "X-User-ID == incident.reported_by_user_id (ERR_SOD_REOPEN_NOT_REPORTER)"
          - "incident.reopen_count < 2 (ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "incident.reopen_count += 1"
          - "incident.closed_at := NULL"
          - "engagement.risk_attention_state := UNDER_REVIEW"
          - "vendor.tier_posture recompute"

  - entity: RemediationPlan
    initial_state: DRAFT
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tprm/remediation-plans/{id}/submit"
        actor: RiskOfficer
        preconditions:
          - "plan.status == DRAFT (ERR_PLAN_NOT_DRAFT)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tprm/remediation-plans/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "see Incident.REMEDIATION_PLANNED->REMEDIATION_IN_PROGRESS preconditions"
        side_effects:
          - "see Incident.REMEDIATION_PLANNED->REMEDIATION_IN_PROGRESS side_effects"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tprm/remediation-plans/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "X-User-ID != plan.owner_user_id (ERR_SOD_PLAN_SELF_APPROVE)"
        side_effects:
          - "incident.status := TRIAGED (revert)"

      - from: APPROVED
        to: IN_EXECUTION
        trigger: "system — atomic follow-on of approve transition"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_EXECUTION
        to: VERIFICATION_SUBMITTED
        trigger: "POST /tprm/remediation-plans/{id}/submit-verification"
        actor: RiskOfficer
        preconditions:
          - "see Incident.REMEDIATION_IN_PROGRESS->AWAITING_VERIFICATION preconditions"
        side_effects:
          - "see Incident.REMEDIATION_IN_PROGRESS->AWAITING_VERIFICATION side_effects"

      - from: VERIFICATION_SUBMITTED
        to: VERIFIED
        trigger: "POST /tprm/remediation-plans/{id}/verify"
        actor: BusinessUnitOwner
        preconditions:
          - "see Incident.AWAITING_VERIFICATION->CLOSED preconditions"
        side_effects:
          - "see Incident.AWAITING_VERIFICATION->CLOSED side_effects"

  - entity: ConcentrationAssessment
    initial_state: COMPUTING
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: COMPUTING
        to: PUBLISHED
        trigger: "POST /tprm/concentration-assessments/{id}/publish"
        actor: ComplianceDirector
        preconditions:
          - "assessment.status == COMPUTING (ERR_ASSESSMENT_NOT_COMPUTING)"
        side_effects:
          - "compute all ConcentrationBucket rows per calculation concentration_share"
          - "assessment.breach_bucket_keys := [bucket_key where is_breach == true]"
          - "assessment.computed_at := now"
          - "assessment.published_by_user_id := X-User-ID"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a newer ConcentrationAssessment on same grouping_dimension reaches PUBLISHED"
        actor: system
        preconditions:
          - "exists another ConcentrationAssessment on same grouping_dimension with status == PUBLISHED and published_at > this.published_at"
        side_effects:
          - "this.status := SUPERSEDED"

  - entity: BusinessContinuityTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /tprm/bcp-tests/{id}/begin"
        actor: RiskOfficer
        preconditions:
          - "bcp.status == SCHEDULED (ERR_BCP_NOT_SCHEDULED)"
          - "engagement.lifecycle_status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
        side_effects: []

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /tprm/bcp-tests/{id}/submit-result"
        actor: RiskOfficer
        preconditions:
          - "bcp.status == IN_PROGRESS (ERR_BCP_NOT_IN_PROGRESS)"
          - "actual_rto_minutes <= rto_target_minutes AND actual_rpo_minutes <= rpo_target_minutes"
        side_effects:
          - "bcp.outcome := PASS"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /tprm/bcp-tests/{id}/submit-result"
        actor: RiskOfficer
        preconditions:
          - "bcp.status == IN_PROGRESS"
          - "actual_rto_minutes > rto_target_minutes OR actual_rpo_minutes > rpo_target_minutes"
        side_effects:
          - "bcp.outcome := FAIL"
          - "if engagement.vendor.criticality_tier == TIER_1_CRITICAL: auto-create Incident (type=OUTAGE, severity=SEV_2) on the engagement"
          - "vendor.tier_posture recompute"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tprm/bcp-tests/{id}/cancel"
        actor: RiskOfficer
        preconditions:
          - "bcp.status == SCHEDULED (ERR_BCP_NOT_SCHEDULED)"
        side_effects: []

  - entity: AuditExercise
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: FIELDWORK
        trigger: "POST /tprm/audits/{id}/begin-fieldwork"
        actor: InternalAuditor
        preconditions:
          - "audit.status == INITIATED (ERR_AUDIT_NOT_INITIATED)"
        side_effects: []

      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /tprm/audits/{id}/issue-findings"
        actor: InternalAuditor
        preconditions:
          - "audit.status == FIELDWORK (ERR_AUDIT_NOT_FIELDWORK)"
          - "audit.findings_count >= 0 (any number, including zero — a clean audit is a valid outcome)"
        side_effects:
          - "for each AuditFinding with severity IN {SEV_1, SEV_2}: auto-create Incident (type=REGULATORY_FINDING, same severity) on the engagement and set finding.raised_incident_id"

      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /tprm/audits/{id}/close"
        actor: InternalAuditor
        preconditions:
          - "audit.status == FINDINGS_ISSUED (ERR_AUDIT_NOT_FINDINGS_ISSUED)"
          - "no OPEN/REOPENED Incident with raised_incident_id IN (this audit's findings) (ERR_AUDIT_FINDINGS_UNRESOLVED)"
        side_effects:
          - "audit.closed_at := now"

  - entity: BoardReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /tprm/board-reports/{id}/publish"
        actor: ComplianceDirector
        preconditions:
          - "report.status == DRAFT (ERR_REPORT_NOT_DRAFT)"
        side_effects:
          - "compute snapshot_payload per calculation board_report_snapshot"
          - "report.published_at := now"
          - "report.published_by_user_id := X-User-ID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: dd-approve-stale-engagement
    parent_entity: VendorEngagement
    write_endpoint: "POST /tprm/due-diligence-packages/{id}/approve"
    occ_field: "expected_engagement_version"
    description: |
      Approving a DueDiligencePackage against a VendorEngagement whose
      version has advanced since the RiskOfficer last observed it is
      rejected. Captures the case where another writer has just approved
      a different DD package on the same engagement (which legitimately
      supersedes the prior APPROVED package per the SUPERSEDED transition)
      and the current officer's view of the engagement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-execute-stale-engagement
    parent_entity: VendorEngagement
    write_endpoint: "POST /tprm/contracts/{id}/execute"
    occ_field: "expected_engagement_version"
    description: |
      Executing a Contract against a VendorEngagement whose version has
      advanced since the executing RiskOfficer last observed it is
      rejected. Captures the case where a tier change or DD supersession
      has bumped engagement.version between the moment the contract was
      drafted and the moment execution is attempted — the officer's
      snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tier-change-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /tprm/vendors/{id}/tier-change"
    occ_field: "expected_vendor_version"
    description: |
      Changing a Vendor's criticality tier against a Vendor whose version
      has advanced since the RiskOfficer last observed it is rejected.
      Captures the case where a concurrent tier-posture recompute (driven
      by a MonitoringCycle transition or Incident side-effect) has bumped
      vendor.version between observation and write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: dd_aggregate_score
    trigger: "DueDiligencePackage DRAFT->SUBMITTED and REJECTED->SUBMITTED transitions"
    algorithm: weighted_scoring
    formula: |
      # Two valid variants; the SCAFFOLD pins one as canonical.
      # Weights are tier-dependent, which produces different scores for the
      # same raw review triple depending on vendor.criticality_tier at submit time.
      tier = engagement.vendor.criticality_tier
      if tier == TIER_1_CRITICAL:
          w_fin, w_sec, w_comp = 0.25, 0.45, 0.30
      elif tier == TIER_2_HIGH:
          w_fin, w_sec, w_comp = 0.30, 0.40, 0.30
      elif tier == TIER_3_STANDARD:
          w_fin, w_sec, w_comp = 0.40, 0.35, 0.25
      else:  # TIER_4_LOW
          w_fin, w_sec, w_comp = 0.50, 0.25, 0.25
      raw = (financial_review_score * w_fin
             + security_review_score * w_sec
             + compliance_review_score * w_comp)
      aggregate_dd_score = round_half_up(raw, 2)
    input_set: "The three review scores on the package and the vendor's criticality_tier at submission time. If tier changes after submission, the score is NOT recomputed (variant: snapshot semantics)."
    constants:
      TIER_1_W: [0.25, 0.45, 0.30]
      TIER_2_W: [0.30, 0.40, 0.30]
      TIER_3_W: [0.40, 0.35, 0.25]
      TIER_4_W: [0.50, 0.25, 0.25]
      PASS_THRESHOLD: 75.00
      CONDITIONAL_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: snapshot_at_submit
        when: "default — weights are the tier weights in force at submit time; score is frozen thereafter"
        difference: "Subsequent tier changes do NOT re-derive the score; an approved package remains valid for its engagement even if the vendor is later re-tiered."
      - name: live_recompute
        when: "NOT USED — rejected alternative"
        difference: "Would re-derive score on every read; rejected because it invalidates signed-off packages retroactively."

  - name: composite_risk_score
    trigger: "Vendor activation, tier change, incident OPEN/CLOSED/REOPENED transitions, monitoring-cycle OVERDUE transition, BCP FAILED transition"
    algorithm: weighted_scoring
    formula: |
      # Weighted additive score with floor/ceiling clamp and tier multiplier.
      base = 0
      # Incident contribution (per OPEN/REOPENED incident on any engagement of this vendor)
      for each incident on vendor's engagements where status IN {OPEN, TRIAGED, REMEDIATION_PLANNED, REMEDIATION_IN_PROGRESS, AWAITING_VERIFICATION, REOPENED}:
          if severity == SEV_1: base += 40
          elif severity == SEV_2: base += 20
          elif severity == SEV_3: base += 8
          else: base += 3
      # Monitoring contribution
      overdue_cycles = count of MonitoringCycle on vendor with status == OVERDUE
      base += overdue_cycles * 10
      # BCP contribution
      failed_bcps = count of BusinessContinuityTest on vendor's engagements with status == FAILED
      base += failed_bcps * 15
      # Tier multiplier
      tier_mult = {TIER_1_CRITICAL: 1.5, TIER_2_HIGH: 1.2, TIER_3_STANDARD: 1.0, TIER_4_LOW: 0.8}[vendor.criticality_tier]
      composite_risk_score = clamp(round_half_up(base * tier_mult, 2), 0, 100)
    input_set: "All engagements of the vendor (regardless of engagement.lifecycle_status); only incidents in non-terminal states; only OVERDUE cycles; only FAILED BCPs."
    constants:
      SEV_W: { SEV_1: 40, SEV_2: 20, SEV_3: 8, SEV_4: 3 }
      OVERDUE_CYCLE_W: 10
      FAILED_BCP_W: 15
      TIER_MULT: { TIER_1_CRITICAL: 1.5, TIER_2_HIGH: 1.2, TIER_3_STANDARD: 1.0, TIER_4_LOW: 0.8 }
      CAP: 100
    precision: "2 decimal places, round_half_up, clamped to [0,100]"
    variants:
      - name: including_closed_incidents
        when: "NOT USED — rejected alternative"
        difference: "Would include CLOSED incidents at half weight; rejected because closure already resets the risk signal."
      - name: non_terminal_only
        when: "default — only non-terminal incident statuses contribute"
        difference: "CLOSED incidents contribute zero; reopening an incident immediately re-contributes."

  - name: tier_posture_derivation
    trigger: "composite_risk_score recompute"
    algorithm: threshold
    formula: |
      if composite_risk_score >= 70: tier_posture = BREACH
      elif composite_risk_score >= 40: tier_posture = ESCALATED
      elif composite_risk_score >= 15: tier_posture = WATCH
      else: tier_posture = CLEAN
    input_set: "vendor.composite_risk_score"
    constants:
      BREACH_THRESHOLD: 70
      ESCALATED_THRESHOLD: 40
      WATCH_THRESHOLD: 15
    precision: "boundary uses >= (score of exactly 15.00 is WATCH, 14.99 is CLEAN)"

  - name: next_monitoring_due
    trigger: "MonitoringCycle scheduling (on vendor activation, on completion of a cycle, on waive)"
    algorithm: forward_looking
    formula: |
      cadence_days = {TIER_1_CRITICAL: 90, TIER_2_HIGH: 180, TIER_3_STANDARD: 365, TIER_4_LOW: 730}[vendor.criticality_tier]
      next_due_at = anchor_at + cadence_days
      # anchor_at is: vendor activation time for cycle 1; previous cycle's completed_at otherwise.
      # For waived cycles, anchor_at is the waived cycle's due_at (NOT the waive time).
    input_set: "vendor.criticality_tier, anchor_at"
    constants:
      TIER_CADENCE_DAYS: { TIER_1_CRITICAL: 90, TIER_2_HIGH: 180, TIER_3_STANDARD: 365, TIER_4_LOW: 730 }
    precision: "datetime, second precision, UTC"

  - name: remediation_deadline
    trigger: "Incident OPEN->TRIAGED"
    algorithm: forward_looking
    formula: |
      severity_window = {SEV_1: 7, SEV_2: 30, SEV_3: 90, SEV_4: 180}[incident.severity]
      # Cure-window interplay: contractual breach_cure_window_days (on the
      # engagement's EXECUTED contract, if any) NARROWS the window when shorter.
      contract_window = engagement.contract.breach_cure_window_days if contract exists and status == EXECUTED else +inf
      effective_days = min(severity_window, contract_window)
      remediation_due_at = triaged_at + effective_days days
    input_set: "incident.severity, contract.breach_cure_window_days if present"
    constants:
      SEVERITY_WINDOW_DAYS: { SEV_1: 7, SEV_2: 30, SEV_3: 90, SEV_4: 180 }
    precision: "datetime, second precision, UTC"

  - name: concentration_share
    trigger: "ConcentrationAssessment COMPUTING->PUBLISHED"
    algorithm: aggregation
    formula: |
      # Aggregate by grouping_dimension over ACTIVE engagements only.
      active_engagements = all VendorEngagement where lifecycle_status == ACTIVE
        AND vendor.archived_at IS NULL
      if grouping_dimension == REGION:
          bucket_key(eng) = eng.vendor.headquarters_region
      else:
          bucket_key(eng) = eng.vendor.service_category
      grand_total = sum(eng.annual_spend_cents for eng in active_engagements)
      for each bucket b in group_by(active_engagements, bucket_key):
          b.total_spend_cents = sum(eng.annual_spend_cents for eng in b)
          b.share_pct = round_half_up(b.total_spend_cents * 100 / grand_total, 2) if grand_total > 0 else 0.00
          b.is_breach = (b.share_pct >= 25.00)
      assessment.breach_bucket_keys = [b.bucket_key for b in buckets if b.is_breach]
      # Deterministic ordering for any downstream iteration:
      # sort buckets by share_pct DESC, then by bucket_key ASC (string sort).
    input_set: "ACTIVE VendorEngagements whose vendor is not archived; assessment.grouping_dimension; grouping key pinned above; per-bucket tie-break on bucket_key ASC"
    constants:
      BREACH_THRESHOLD_PCT: 25.00
    precision: "share_pct to 2 decimal places, round_half_up; boundary uses >= (share of exactly 25.00 is a breach, 24.99 is not)"
    variants:
      - name: per_bucket_then_total
        when: "default — each bucket's share_pct is rounded to 2dp, then breach flag computed"
        difference: "rounding happens BEFORE comparison; a true share of 24.996 becomes 25.00 (round_half_up) and therefore IS a breach."
      - name: compare_unrounded
        when: "NOT USED — rejected alternative"
        difference: "Would compare the unrounded fraction; rejected because external reporting uses the rounded value, so the comparison must use it too."

  - name: exit_readiness_score
    trigger: "VendorEngagement ACTIVE->EXITING"
    algorithm: weighted_scoring
    formula: |
      score = 100
      # Deduct for incomplete sub-conditions
      if any Incident on engagement in non-terminal state: score -= 50
      if any RemediationPlan on engagement's incidents with status IN {DRAFT, SUBMITTED, APPROVED, IN_EXECUTION, VERIFICATION_SUBMITTED}: score -= 20
      if contract.has_exit_plan_section == false AND vendor.criticality_tier == TIER_1_CRITICAL: score -= 30
      if any FourthParty on engagement with acknowledgement_status == PENDING: score -= 15
      if any MonitoringCycle on vendor with status == OVERDUE: score -= 10
      exit_readiness_score = clamp(score, 0, 100)
    input_set: "incidents on this engagement; plans on those incidents; contract row; fourth parties; vendor's monitoring cycles"
    constants:
      OPEN_INCIDENT_PENALTY: 50
      OPEN_PLAN_PENALTY: 20
      MISSING_EXIT_PLAN_PENALTY: 30
      PENDING_FP_PENALTY: 15
      OVERDUE_CYCLE_PENALTY: 10
      PASS_THRESHOLD: 80.00
    precision: "2 decimal places (though deductions are integers, the score is stored as number)"

  - name: board_report_snapshot
    trigger: "BoardReport DRAFT->PUBLISHED"
    algorithm: aggregation
    formula: |
      window = [report.period_start, report.period_end)  # half-open
      snapshot = {
        "vendor_count_by_tier": count vendors (archived_at IS NULL) grouped by criticality_tier,
        "vendor_count_by_posture": count vendors grouped by tier_posture,
        "engagement_count_by_lifecycle": count engagements grouped by lifecycle_status,
        "incidents_opened_in_window": count incidents with detected_at IN window,
        "incidents_closed_in_window": count incidents with closed_at IN window AND closed_at IS NOT NULL,
        "overdue_monitoring_cycles_at_publish": count cycles with status == OVERDUE at publish instant,
        "concentration_breaches_active": latest PUBLISHED ConcentrationAssessment per grouping_dimension, count of breach buckets (0 if none published),
        "bcp_failures_in_window": count BCP tests with status == FAILED AND completed/updated_at IN window,
        "composite_risk_score_distribution": histogram of vendor.composite_risk_score in buckets [0,15), [15,40), [40,70), [70,100]
      }
      # Boundary rule: incidents detected exactly at period_start are included;
      # exactly at period_end are NOT (half-open).
    input_set: "window half-open [period_start, period_end); only non-archived vendors; latest PUBLISHED ConcentrationAssessment per dimension (superseded excluded)"
    constants:
      RISK_HISTOGRAM_BUCKETS: [[0, 15], [15, 40], [40, 70], [70, 100]]
    precision: "integer counts; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids resolve, left-to-right (vendor -> engagement -> child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource in the from-state required by the transition (see each state machine's preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation-of-duties: actor is not the same user who performed the prior step (submitter != approver; reporter != remediator; engagement creator != auditor)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to:
      - "POST /tprm/due-diligence-packages/{id}/approve"
      - "POST /tprm/due-diligence-packages/{id}/reject"
      - "POST /tprm/incidents/{id}/remediation-plans"
      - "POST /tprm/remediation-plans/{id}/approve"
      - "POST /tprm/remediation-plans/{id}/reject"
      - "POST /tprm/remediation-plans/{id}/verify"
      - "POST /tprm/audits"

  - priority: 6
    category: business_safety
    check: "Blocking open incidents: SEV_1 blocks vendor activation/engagement terminate-for-cause absence check, OPEN/REOPENED SEV_1|SEV_2 block engagement initiate-exit, any OPEN/REOPENED blocks vendor exit / engagement finalize-exit"
    error_id: ERR_BLOCKING_INCIDENTS_OPEN
    http_status: 422
    applies_to:
      - "POST /tprm/vendors/{id}/activate"
      - "POST /tprm/vendors/{id}/exit"
      - "POST /tprm/engagements/{id}/initiate-exit"
      - "POST /tprm/engagements/{id}/finalize-exit"

  - priority: 7
    category: business_constraint
    check: "Contract clause completeness at execute: SLA terms always required; right-to-audit required for TIER_1/TIER_2; exit plan required for TIER_1"
    error_id: ERR_CONTRACT_CLAUSES_INCOMPLETE
    http_status: 422
    applies_to: "POST /tprm/contracts/{id}/execute"

  - priority: 8
    category: business_constraint
    check: "All FourthParty rows acknowledged before contract execute"
    error_id: ERR_FOURTH_PARTY_PENDING
    http_status: 422
    applies_to: "POST /tprm/contracts/{id}/execute"

  - priority: 9
    category: business_constraint
    check: "DD outcome permits approval (dd_outcome IN {PASS, CONDITIONAL_PASS})"
    error_id: ERR_DD_OUTCOME_FAIL
    http_status: 422
    applies_to: "POST /tprm/due-diligence-packages/{id}/approve"

  - priority: 10
    category: business_temporal
    check: "Temporal ordering: contract.expiry_date > contract.effective_date; assessment_window_end > assessment_window_start; report.period_end > report.period_start; bcp.scheduled_for in future at create; remediation plan committed_completion_date <= incident.remediation_due_at"
    error_id: ERR_TEMPORAL_ORDER
    http_status: 422
    applies_to:
      - "POST /tprm/engagements/{id}/contracts"
      - "POST /tprm/concentration-assessments"
      - "POST /tprm/board-reports"
      - "POST /tprm/engagements/{id}/bcp-tests"
      - "POST /tprm/incidents/{id}/remediation-plans"

  - priority: 11
    category: business_fiscal
    check: "Exit readiness floor: engagement.exit_readiness_score >= 80.00 at finalize-exit"
    error_id: ERR_EXIT_READINESS_TOO_LOW
    http_status: 422
    applies_to: "POST /tprm/engagements/{id}/finalize-exit"

  - priority: 12
    category: business_constraint
    check: "Waive monitoring cycle only when vendor.criticality_tier == TIER_4_LOW"
    error_id: ERR_WAIVE_TIER_FORBIDDEN
    http_status: 422
    applies_to: "POST /tprm/monitoring-cycles/{id}/waive"

  - priority: 13
    category: business_constraint
    check: "FourthParty data_access_level == REGULATED_PII requires vendor.criticality_tier IN {TIER_1_CRITICAL, TIER_2_HIGH}"
    error_id: ERR_FP_PII_TIER_TOO_LOW
    http_status: 422
    applies_to: "POST /tprm/fourth-parties/{id}/acknowledge"

  - priority: 14
    category: business_referential
    check: "FourthParty.parent_fourth_party_id (when non-NULL) references an existing FourthParty on the SAME engagement; cycle-free (a fourth-party cannot be its own ancestor)"
    error_id: ERR_FP_PARENT_INVALID
    http_status: 422
    applies_to: "POST /tprm/engagements/{id}/fourth-parties"

  - priority: 15
    category: business_constraint
    check: "Review round cap: DD package review_round < 3 at resubmit"
    error_id: ERR_DD_REVIEW_ROUND_EXHAUSTED
    http_status: 422
    applies_to: "POST /tprm/due-diligence-packages/{id}/resubmit"

  - priority: 16
    category: business_constraint
    check: "Incident reopen cap: reopen_count < 2"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /tprm/incidents/{id}/reopen"

  - priority: 16.5
    category: business_constraint
    check: "MonitoringCycle half-open window capacity: at most one MonitoringCycle per vendor with status IN {SCHEDULED, IN_PROGRESS} at any instant; a new cycle's [anchor_at, anchor_at + cadence_days) window must not overlap any prior non-WAIVED cycle's window on the same vendor. Adjacent (gap=0) is permitted."
    error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "system (enforced inside MonitoringCycle creation transitions — on vendor activate, on cycle complete, on cycle waive)"

  - priority: 16.6
    category: business_constraint
    check: "AuditExercise aggregate capacity: at most one AuditExercise per engagement with status IN {INITIATED, FIELDWORK, FINDINGS_ISSUED} at any instant. Closed audits do not count toward capacity."
    error_id: ERR_AUDIT_ALREADY_ACTIVE
    http_status: 422
    applies_to: "POST /tprm/engagements/{id}/audits"

  - priority: 16.7
    category: business_temporal
    check: "BoardReport window conflict: a new BoardReport DRAFT's [period_start, period_end) must not overlap any PUBLISHED BoardReport's window. Overlap is measured on half-open intervals; touching at a boundary (this.period_start == other.period_end) is permitted."
    error_id: ERR_REPORT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /tprm/board-reports"

  - priority: 17
    category: business_constraint
    check: "OCC expected_*_version matches the current parent entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to:
      - "POST /tprm/due-diligence-packages/{id}/approve"
      - "POST /tprm/contracts/{id}/execute"
      - "POST /tprm/vendors/{id}/tier-change"

  - priority: 18
    category: business_constraint
    check: "Uniqueness: Vendor.legal_name unique across non-archived vendors; VendorEngagement.engagement_code unique within a vendor; Contract.contract_reference unique within a vendor"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to:
      - "POST /tprm/vendors"
      - "POST /tprm/vendors/{id}/engagements"
      - "POST /tprm/engagements/{id}/contracts"

  - priority: 19
    category: business_constraint
    check: "Required-field presence and type/enum correctness on input payloads"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Vendor inventory ---
  - method: POST
    path: "/tprm/vendors"
    description: "Create a vendor in ONBOARDING state with initial tier TIER_3_STANDARD. Optional client-supplied fields for computed/system fields (composite_risk_score, tier_posture, id, version) are accepted-but-ignored — the server always recomputes/mints its own values."
    roles: [VendorRelationshipManager]
    code: 201
    input: [legal_name, headquarters_region, service_category, "composite_risk_score?", "tier_posture?", "id?", "version?", "created_at?", "updated_at?"]
    output: Vendor
    side_effects:
      - "set onboarded_by_user_id from X-User-ID"
      - "composite_risk_score := 0; tier_posture := CLEAN; status := ONBOARDING (input values for these fields are ignored)"

  - method: GET
    path: "/tprm/vendors"
    description: "List vendors with optional filters."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: ["status?", "criticality_tier?", "tier_posture?", "headquarters_region?", "service_category?", "include_archived?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/tprm/vendors/{id}"
    description: "Fetch a single vendor."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/tprm/vendors/{id}/activate"
    description: "ONBOARDING -> ACTIVE."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "see state machine Vendor.ONBOARDING->ACTIVE"

  - method: POST
    path: "/tprm/vendors/{id}/suspend"
    description: "ACTIVE -> SUSPENDED."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "see state machine Vendor.ACTIVE->SUSPENDED"

  - method: POST
    path: "/tprm/vendors/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "see state machine Vendor.SUSPENDED->ACTIVE"

  - method: POST
    path: "/tprm/vendors/{id}/exit"
    description: "ACTIVE -> EXITED (soft-archive)."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "see state machine Vendor.ACTIVE->EXITED"

  - method: POST
    path: "/tprm/vendors/{id}/tier-change"
    description: "RiskOfficer-initiated criticality tier change. Writes RiskTierChangeLog row. OCC-guarded on vendor.version."
    roles: [RiskOfficer]
    code: 200
    input: [to_tier, reason, expected_vendor_version]
    output: Vendor
    side_effects:
      - "vendor.criticality_tier := to_tier"
      - "create RiskTierChangeLog row (from_tier, to_tier, reason, changed_by_user_id)"
      - "recompute vendor.composite_risk_score (tier multiplier changed)"
      - "vendor.next_monitoring_due_at := recompute from new cadence anchored to most recent cycle completed_at (or vendor activation if no cycles)"
      - "increments Vendor.version by 1"

  - method: GET
    path: "/tprm/vendors/{id}/tier-change-log"
    description: "Audit-trail read of RiskTierChangeLog rows for a vendor."
    roles: [RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: RiskTierChangeLog[]
    side_effects: []

  # --- Vendor engagements ---
  - method: POST
    path: "/tprm/vendors/{id}/engagements"
    description: "Create an engagement on a vendor."
    roles: [VendorRelationshipManager]
    code: 201
    input: [engagement_code, service_summary, annual_spend_cents, data_sensitivity]
    output: VendorEngagement
    side_effects:
      - "lifecycle_status := DRAFT; risk_attention_state := NORMAL"
      - "started_by_user_id := X-User-ID"

  - method: GET
    path: "/tprm/vendors/{id}/engagements"
    description: "List engagements for a vendor."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: ["lifecycle_status?", "risk_attention_state?", "limit?", "offset?"]
    output: VendorEngagement[]
    side_effects: []

  - method: GET
    path: "/tprm/engagements/{id}"
    description: "Fetch a single engagement."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []

  - method: POST
    path: "/tprm/engagements/{id}/initiate-exit"
    description: "ACTIVE -> EXITING; computes exit_readiness_score."
    roles: [VendorRelationshipManager]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "see state machine VendorEngagement.ACTIVE->EXITING"

  - method: POST
    path: "/tprm/engagements/{id}/finalize-exit"
    description: "EXITING -> EXITED."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "see state machine VendorEngagement.EXITING->EXITED"

  - method: POST
    path: "/tprm/engagements/{id}/terminate-for-cause"
    description: "ACTIVE -> TERMINATED_FOR_CAUSE."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "see state machine VendorEngagement.ACTIVE->TERMINATED_FOR_CAUSE"

  # --- Due diligence packages ---
  - method: POST
    path: "/tprm/engagements/{id}/due-diligence-packages"
    description: "Create DD package; transitions engagement DRAFT->DD_IN_PROGRESS."
    roles: [VendorRelationshipManager]
    code: 201
    input: [financial_review_score, security_review_score, compliance_review_score, financial_reviewer_id, security_reviewer_id, compliance_reviewer_id]
    output: DueDiligencePackage
    side_effects:
      - "engagement.lifecycle_status DRAFT -> DD_IN_PROGRESS"
      - "package.status := DRAFT; review_round := 1"

  - method: GET
    path: "/tprm/engagements/{id}/due-diligence-packages"
    description: "List DD packages on an engagement."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DueDiligencePackage[]
    side_effects: []

  - method: GET
    path: "/tprm/due-diligence-packages/{id}"
    description: "Fetch a DD package."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor]
    code: 200
    input: []
    output: DueDiligencePackage
    side_effects: []

  - method: POST
    path: "/tprm/due-diligence-packages/{id}/submit"
    description: "DRAFT -> SUBMITTED; computes aggregate_dd_score and dd_outcome."
    roles: [VendorRelationshipManager]
    code: 200
    input: []
    output: DueDiligencePackage
    side_effects:
      - "see state machine DueDiligencePackage.DRAFT->SUBMITTED"

  - method: POST
    path: "/tprm/due-diligence-packages/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DueDiligencePackage
    side_effects: []

  - method: POST
    path: "/tprm/due-diligence-packages/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED. SoD + outcome-gated. OCC-guarded on engagement.version."
    roles: [RiskOfficer]
    code: 200
    input: [expected_engagement_version]
    output: DueDiligencePackage
    side_effects:
      - "see state machine DueDiligencePackage.UNDER_REVIEW->APPROVED"
      - "any previously APPROVED package on same engagement -> SUPERSEDED"
      - "increments VendorEngagement.version by 1"

  - method: POST
    path: "/tprm/due-diligence-packages/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DueDiligencePackage
    side_effects:
      - "see state machine DueDiligencePackage.UNDER_REVIEW->REJECTED"

  - method: POST
    path: "/tprm/due-diligence-packages/{id}/resubmit"
    description: "REJECTED -> SUBMITTED (review_round cap 3)."
    roles: [VendorRelationshipManager]
    code: 200
    input: ["financial_review_score?", "security_review_score?", "compliance_review_score?"]
    output: DueDiligencePackage
    side_effects:
      - "review_round += 1"
      - "recompute aggregate_dd_score and dd_outcome"

  # --- Contracts ---
  - method: POST
    path: "/tprm/engagements/{id}/contracts"
