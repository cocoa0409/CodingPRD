      - name: carrier_on_probation_cannot_have_a_request_approved
        claim_type: Violation → Error
        grounds: ["errors[ERR_CARRIER_ON_PROBATION]", "validations[priority=15]", "calculations.audit_penalty_action", "state_machines.UtilizationFiling.transitions.UNDER_AUDIT_to_REJECTED"]
        distinguishing_aspect: "Probation is earned through the audit program rather than through strikes here, and priority 13 lets a PROBATION carrier through on purpose, so the APPROVE must fail at priority 15 with the probation code rather than the eligibility code - and the request is left untouched rather than denied."
