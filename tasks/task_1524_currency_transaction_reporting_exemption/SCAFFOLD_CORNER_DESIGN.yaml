            - "e1 == 'ERR_INVALID_STATE_TRANSITION'"
            - "e2 == 'ERR_INVALID_STATE_TRANSITION'"
            - "ref_cnt == 1 (referral side effect on Customer)"

      - name: alert_dismiss_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.StructuringAlert.DISMISSED_to_UNDER_REVIEW]
        distinguishing_aspect: "The cyclic edge DISMISSED -> UNDER_REVIEW (reopen) is reachable and restores review state; note field is updated by each disposition."
        test_recipe:
          setup: ["branch, customer; manual alert OPEN -> UNDER_REVIEW -> DISMISSED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Reopen Rita", tin: "81-8181818", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-07-27", window_end_date: "2026-07-31", note: "tip" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { al1: $.data.id }
            - { call: "POST /structuring-alerts/${al1}/begin-review", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /structuring-alerts/${al1}/dismiss", payload: { disposition_note: "benign" }, as: BSAOfficer, as_user_id: "officer-z" }
          trigger:
            - call: "POST /structuring-alerts/${al1}/reopen"
              payload: { note: "new information received" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { st: $.data.status, nt: $.data.note }
          assert:
            - "st == 'UNDER_REVIEW'"
            - "nt == 'new information received'"

      - name: exemption_deny_and_denied_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExemptionDesignation.PENDING_REVIEW_to_DENIED]
        distinguishing_aspect: "deny moves PENDING_REVIEW -> DENIED (terminal); a later approve attempt returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["customer GOVERNMENT_AGENCY; designation PENDING_REVIEW requested by officer-a"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /customers"
              payload: { legal_name: "Denied City", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_I" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
            - { call: "POST /exemption-designations/${ex1}/deny", payload: { reason: "insufficient documentation" }, as: BSAOfficer, as_user_id: "officer-b" }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b", captures: { e1: $.data.error_id } }
          assert:
            - "e1 == 'ERR_INVALID_STATE_TRANSITION'"
            - "ExemptionDesignation.${ex1}.status == 'DENIED'"

      - name: customer_closed_terminal_and_close_guard
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Customer, "validations[priority=6]"]
        distinguishing_aspect: "Close with a live DRAFT CTR fails with ERR_CUSTOMER_HAS_OPEN_ITEMS; after the CTR is removed (void cascade), close succeeds and CLOSED is terminal (suspend rejected)."
        test_recipe:
          setup: ["branch; customer with deposit 1100000 (DRAFT CTR live); clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Closing Carla", tin: "90-9090908", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }
              as: Teller
              captures: { txn1: $.data.id }
          trigger:
            - { call: "POST /customers/${c1}/close", as: BranchManager, captures: { e1: $.data.error_id } }
            - { call: "POST /cash-transactions/${txn1}/void", payload: { void_reason: "rescinded" }, as: BranchManager }
            - call: "POST /customers/${c1}/close"
              as: BranchManager
              captures: { st: $.data.status }
            - { call: "POST /customers/${c1}/suspend", as: BranchManager, captures: { e2: $.data.error_id } }
          assert:
            - "e1 == 'ERR_CUSTOMER_HAS_OPEN_ITEMS' (live DRAFT CTR blocks close)"
            - "st == 'CLOSED' (after the void cascade auto-VOIDED the CTR)"
            - "e2 == 'ERR_INVALID_STATE_TRANSITION' (CLOSED is terminal)"

      - name: branch_inactive_blocks_posting
        claim_type: precondition_enforcement
        grounds: [state_machines.Branch, "validations[priority=6]"]
        distinguishing_aspect: "Posting to an INACTIVE branch fails with ERR_BRANCH_INACTIVE; reactivation restores posting. Branch cycle ACTIVE -> INACTIVE -> ACTIVE exercised."
        test_recipe:
          setup: ["branch BR1 deactivated; customer active; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Inactive Ivy", tin: "91-9191919", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /branches/${br1}/deactivate", as: SystemAdmin }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller, captures: { e1: $.data.error_id } }
            - { call: "POST /branches/${br1}/reactivate", as: SystemAdmin }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T08:05:00Z" }
              as: Teller
              captures: { st: $.data.status }
          assert:
            - "e1 == 'ERR_BRANCH_INACTIVE'"
            - "st == 'POSTED' after reactivation"

      - name: exam_case_reopen_fieldwork_cycle_and_close_guard
        claim_type: invalid_transition
        grounds: [state_machines.ExaminationCase]
        distinguishing_aspect: "close from FIELDWORK (not FINDINGS_ISSUED) is rejected; the FINDINGS_ISSUED -> FIELDWORK reopen edge cycles back and issue-findings works a second time."
        test_recipe:
          setup: ["case FINCEN CASE-300 OPEN -> FIELDWORK -> FINDINGS_ISSUED"]
          setup_api_calls:
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "CASE-300", scope_start_date: "2025-01-01", scope_end_date: "2026-01-01" }
              as: Examiner
              captures: { k1: $.data.id, st0: $.data.status }
            - { call: "POST /examination-cases/${k1}/begin-fieldwork", as: Examiner }
          trigger:
            - { call: "POST /examination-cases/${k1}/close", as: Examiner, captures: { e1: $.data.error_id } }
            - { call: "POST /examination-cases/${k1}/issue-findings", as: Examiner }
            - call: "POST /examination-cases/${k1}/reopen-fieldwork"
              as: Examiner
              captures: { st1: $.data.status }
            - call: "POST /examination-cases/${k1}/issue-findings"
              as: Examiner
              captures: { st2: $.data.status }
          assert:
            - "st0 == 'OPEN' (initial state)"
            - "e1 == 'ERR_INVALID_STATE_TRANSITION' (close requires FINDINGS_ISSUED)"
            - "st1 == 'FIELDWORK' (cycle edge)"
            - "st2 == 'FINDINGS_ISSUED'"


  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: instrument_sale_void_recomputes_totals_and_fees
        claim_type: input_set_filtering
        grounds: [calculations.daily_cash_aggregation, calculations.instrument_fee_calc]
        distinguishing_aspect: "Voided sales drop out of the input set: after voiding one of two sales, aggregation cash-in, instrument_sale_count, and instrument_fee_total_cents reflect only the RECORDED sale (fee 2500)."
        test_recipe:
          setup: ["branch, customer; two cashier's check sales on 2026-08-01: 500000 (fee 2500) and 200000 (fee 1000); clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
