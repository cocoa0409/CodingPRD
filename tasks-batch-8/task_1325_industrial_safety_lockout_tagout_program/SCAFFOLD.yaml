# =============================================================================
# SCAFFOLD — Industrial Safety & Lockout/Tagout (LOTO) Program
# Manufacturer EHS department: energy-source surveys, machine-specific
# procedures, lock/tag issuance & group lockout, annual audits, contractor
# coordination, incident linkage, machine-modification revision, training &
# competency, minor-servicing exception determination.
# =============================================================================

scenario: |
  Industrial Safety & Lockout/Tagout Program (manufacturer EHS department):
  energy-source survey & machine-specific procedure, lock/tag issuance & group
  lockout, annual procedure audit & authorized-employee verification, contractor
  lockout coordination, near-miss & incident linkage, procedure change on
  machine modification, training assignment & competency, exception (minor
  servicing) determination

domain_name: industrial-safety-loto
api_prefix: ""            # flat topology: peer collections at root (/machines, /lockout-sessions, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Machine.version for modification registration
    - cascading_side_effects        # modification / incident-link / audit-fail cascades
    - rate_threshold_triggers       # audit-due 365-day gate, risk-tier thresholds, audit sample minimum
    - version_pinning_on_approval   # LockoutSession pins procedure revision & lock-point capacity at creation
  entity_topology: flat             # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic       # LockoutProcedure revision loop + EnergySurvey reject/resubmit loop; other machines linear-with-branches
  relationship_patterns:
    - one_to_many                   # Machine -> sessions/procedures/incidents/...
    - cross_aggregate               # IncidentReport -> LockoutSession; LockoutSession -> LockoutProcedure
    - many_to_many                  # LockoutSession <-> Employee via EmployeeLock junction (group lockout)
  role_model: segregation_of_duties # survey approver != surveyor; auditor not a period user; exception determiner != requester; force-remover != lock owner
  consistency_model: immediate      # all mutations and cascades visible in the same request/response

# =============================================================================
# §1.0 Response Envelope (FIXED — do not modify)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Machine
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: asset_tag, type: string, source: input, description: "Unique plant asset tag", constraints: "unique across all machines; required" }
      - { name: name, type: string, source: input, description: "Machine display name", constraints: "required, non-empty" }
      - { name: area, type: string, source: input, description: "Plant area / line", constraints: "required, non-empty" }
      - { name: risk_window_policy, type: enum, source: input, description: "Which machine_risk_score variant applies to this machine", constraints: "ROLLING_12MO | SINCE_PROCEDURE_ACTIVATION" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | OUT_OF_SERVICE — no terminal state" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Weighted score over LINKED IncidentReports per calculations.machine_risk_score" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "LOW | MEDIUM | HIGH — derived from risk_score thresholds" }
      - { name: open_session_count, type: integer, source: computed, default: 0, description: "COUNT of LockoutSession with machine_id = this machine AND status IN {SETUP, LOCKED, CLEARED}" }

  - name: MachineModification
    parent: Machine
    common_fields: false  # append-only log: id + created_at only
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; modified machine (path parameter)" }
      - { name: description, type: string, source: input, description: "What changed on the machine (hardware, guards, energy sources)", constraints: "required, non-empty" }
      - { name: review_status, type: enum, source: system, default: UNREVIEWED, description: "UNREVIEWED -> REVIEWED when a LockoutProcedure (re)activates for the machine" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_no, type: string, source: input, description: "Unique HR employee number", constraints: "unique across all employees; required" }
      - { name: full_name, type: string, source: input, description: "Employee full name", constraints: "required, non-empty" }
      - { name: qualification, type: enum, source: input, description: "LOTO qualification level", constraints: "AFFECTED | AUTHORIZED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Employment status; always ACTIVE in this benchmark's API surface" }
      - { name: is_currently_qualified, type: boolean, source: computed, description: "qualification == AUTHORIZED AND exists TrainingRecord for this employee with course_code IN {LOTO_AUTHORIZED_INITIAL, LOTO_AUTHORIZED_REFRESH}, status COMPLETED, expires_at > current clock" }
      - { name: outstanding_lock_count, type: integer, source: computed, default: 0, description: "COUNT of EmployeeLock with employee_id = this employee AND status IN {ISSUED, APPLIED}" }

  - name: EnergySurvey
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; surveyed machine", constraints: "required" }
      - { name: surveyed_by_employee_id, type: string, source: system, description: "FK -> Employee.id; set from X-User-ID of the AuthorizedEmployee creator" }
      - { name: energy_sources, type: array, source: input, description: "Array of {source_type, magnitude, isolation_point, dissipation_method}", constraints: "required, min length 1" }
      - { name: isolation_point_count, type: integer, source: computed, description: "= length(energy_sources)" }
      - { name: note, type: string, source: input, description: "Free-text survey notes", constraints: "optional" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED ; REJECTED -> SUBMITTED (resubmit)" }

  - name: LockoutProcedure
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; governed machine", constraints: "required" }
      - { name: survey_id, type: string, source: input, description: "FK -> EnergySurvey.id; supporting survey (must belong to same machine)", constraints: "required" }
      - { name: steps, type: array, source: input, description: "Ordered lockout steps [{step_no, action, isolation_point}]", constraints: "required, min length 1" }
      - { name: revision_no, type: integer, source: computed, description: "1 + count of prior LockoutProcedure rows for the same machine" }
      - { name: isolation_point_count, type: integer, source: computed, description: "Snapshot of survey.isolation_point_count at procedure creation (never re-read later)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> UNDER_REVISION -> ACTIVE (cycle) | SUPERSEDED | RETIRED" }
      - { name: activated_at, type: datetime, source: system, description: "Set once at first DRAFT->ACTIVE; unchanged on UNDER_REVISION->ACTIVE re-activation" }
      - { name: last_completed_audit_at, type: datetime, source: system, description: "Clock time of latest COMPLETED ProcedureAudit; null until first audit completes" }
      - { name: audit_due_at, type: datetime, source: computed, description: "= (last_completed_audit_at ?? activated_at) + 365 days" }

  - name: TrainingRecord
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; trainee", constraints: "required" }
      - { name: course_code, type: enum, source: input, description: "Course assigned", constraints: "LOTO_AUTHORIZED_INITIAL | LOTO_AUTHORIZED_REFRESH | LOTO_AFFECTED" }
      - { name: delivery_mode, type: enum, source: input, description: "Selects training_expiry variant", constraints: "IN_PERSON | ONLINE" }
      - { name: assigned_at, type: datetime, source: system, description: "Clock at assignment" }
      - { name: due_at, type: datetime, source: computed, description: "= assigned_at + 30 days" }
      - { name: completed_at, type: datetime, source: system, description: "Clock at completion (set by complete endpoint)" }
      - { name: expires_at, type: datetime, source: computed, description: "Per calculations.training_expiry variant selected by delivery_mode" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED -> COMPLETED" }

  - name: LockoutSession
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; machine being locked out", constraints: "required" }
      - { name: procedure_id, type: string, source: input, description: "FK -> LockoutProcedure.id; governing procedure (must belong to same machine)", constraints: "required" }
      - { name: procedure_revision_no, type: integer, source: system, description: "Pinned copy of procedure.revision_no at session creation (version pinning)" }
      - { name: max_locks, type: integer, source: system, description: "Pinned copy of procedure.isolation_point_count at session creation; capacity checks NEVER re-read the procedure" }
      - { name: session_type, type: enum, source: input, description: "INDIVIDUAL | GROUP | CONTRACTOR", constraints: "required" }
      - { name: primary_employee_id, type: string, source: system, description: "FK -> Employee.id; authorized employee in charge, set from X-User-ID of creator" }
      - { name: zero_energy_verified, type: boolean, source: system, default: false, description: "Set true by the lock transition payload" }
      - { name: applied_lock_count, type: integer, source: computed, default: 0, description: "COUNT of EmployeeLock with session_id = this session AND status == APPLIED" }
      - { name: started_at, type: datetime, source: system, description: "Clock at SETUP->LOCKED" }
      - { name: ended_at, type: datetime, source: system, description: "Clock at CLEARED->RELEASED (or FORCE path); null while open" }
      - { name: status, type: enum, source: system, default: SETUP, description: "SETUP -> LOCKED -> CLEARED -> RELEASED ; SETUP -> CANCELLED (manual or cascade)" }

  - name: EmployeeLock
    parent: LockoutSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> LockoutSession.id; session this lock joins", constraints: "required" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; lock owner, set from X-User-ID of issuer" }
      - { name: lock_no, type: string, source: input, description: "Physical lock number", constraints: "required; unique among EmployeeLocks with status IN {ISSUED, APPLIED}" }
      - { name: tag_no, type: string, source: input, description: "Tag number attached to the lock", constraints: "required, non-empty" }
      - { name: applied_at, type: datetime, source: system, description: "Clock at ISSUED->APPLIED" }
      - { name: removed_at, type: datetime, source: system, description: "Clock at APPLIED->REMOVED / FORCE_REMOVED" }
      - { name: removal_reason, type: string, source: system, description: "Reason recorded on force removal; null otherwise" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> APPLIED -> REMOVED | FORCE_REMOVED ; ISSUED -> VOIDED (session-cancel cascade)" }

  - name: ProcedureAudit
    parent: LockoutProcedure
    common_fields: true
    fields:
      - { name: procedure_id, type: string, source: input, description: "FK -> LockoutProcedure.id; audited procedure", constraints: "required" }
      - { name: auditor_employee_id, type: string, source: system, description: "FK -> Employee.id; set from X-User-ID of the EHSAuditor creator" }
      - { name: scheduled_start, type: datetime, source: input, description: "Audit window start (inclusive)", constraints: "required; < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Audit window end (inclusive)", constraints: "required; > scheduled_start" }
      - { name: period_start, type: datetime, source: computed, description: "= procedure.last_completed_audit_at ?? procedure.activated_at (at creation time)" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL (set by complete)" }
      - { name: employees_sampled, type: array, source: input, description: "Employee ids verified at completion; must be a subset of period lock-appliers with size >= audit_sample_minimum", constraints: "required on complete" }
      - { name: completed_at, type: datetime, source: system, description: "Clock at SCHEDULED->COMPLETED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED (terminal)" }

  - name: IncidentReport
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; involved machine", constraints: "required" }
      - { name: session_id, type: string, source: input, description: "FK -> LockoutSession.id; related session, optional; must belong to the same machine when present", constraints: "optional" }
      - { name: kind, type: enum, source: input, description: "Incident classification", constraints: "NEAR_MISS | FIRST_AID | INJURY | PROPERTY_DAMAGE" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred", constraints: "required" }
      - { name: severity, type: integer, source: input, description: "Severity 1 (least) to 5 (worst)", constraints: "1 <= severity <= 5" }
      - { name: description, type: string, source: input, description: "Free-text narrative", constraints: "optional" }
      - { name: linked_at, type: datetime, source: system, description: "Clock at REPORTED->LINKED" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED -> LINKED | DISMISSED (both terminal)" }

  - name: ContractorPermit
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; machine the contractor will service", constraints: "required" }
      - { name: company_name, type: string, source: input, description: "Contractor company", constraints: "required, non-empty" }
      - { name: coordinator_employee_id, type: string, source: system, description: "FK -> Employee.id; host authorized-employee coordinator, set from X-User-ID of creator" }
      - { name: insurance_valid_until, type: datetime, source: input, description: "Contractor insurance expiry; must be > clock at approval", constraints: "required" }
      - { name: coordination_meeting_at, type: datetime, source: input, description: "When the host/contractor coordination meeting happened; must be <= clock at approval", constraints: "required on approve" }
      - { name: session_id, type: string, source: input, description: "FK -> LockoutSession.id; bound CONTRACTOR session at activation", constraints: "required on activate" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED -> ACTIVE -> CLOSED ; REQUESTED -> REJECTED" }

  - name: MinorServicingException
    parent: Machine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; machine the exception applies to", constraints: "required" }
      - { name: requested_by_employee_id, type: string, source: system, description: "FK -> Employee.id; requester, set from X-User-ID of creator" }
      - { name: task_description, type: string, source: input, description: "Minor servicing task (e.g., clearing a jam)", constraints: "required, non-empty" }
      - { name: routine_repetitive, type: boolean, source: input, description: "Task is routine, repetitive, and integral", constraints: "required" }
      - { name: integral_to_production, type: boolean, source: input, description: "Task is integral to the production process", constraints: "required" }
      - { name: alternative_measures_effective, type: boolean, source: input, description: "Alternative measures provide effective protection", constraints: "required" }
      - { name: estimated_duration_min, type: integer, source: input, description: "Expected task duration in minutes", constraints: "required, >= 1" }
      - { name: valid_from, type: datetime, source: input, description: "Exception window start (inclusive)", constraints: "required; < valid_until" }
      - { name: valid_until, type: datetime, source: input, description: "Exception window end (inclusive)", constraints: "required; > valid_from" }
      - { name: determination, type: enum, source: system, description: "ELIGIBLE | NOT_ELIGIBLE — output of calculations.minor_servicing_eligibility (null until determined)" }
      - { name: determined_by_employee_id, type: string, source: system, description: "FK -> Employee.id; EHSManager who ran determination (X-User-ID)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> DETERMINED -> REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Machine
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /machines/{id}/out-of-service"
        actor: EHSManager
        preconditions:
          - "No LockoutSession for this machine in status LOCKED (ERR_MACHINE_HAS_OPEN_SESSIONS)"
        side_effects:
          - "Cascade: every LockoutSession of this machine in status SETUP -> CANCELLED"
          - "Cascade (per cancelled session): its EmployeeLocks in status ISSUED -> VOIDED"
          - "open_session_count recomputed"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (automatic when machine_risk_tier transitions into HIGH after an IncidentReport is LINKED)"
        actor: system
        preconditions:
          - "risk_tier crosses into HIGH (risk_score >= 10)"
        side_effects:
          - "Cascade: every LockoutSession of this machine in status SETUP -> CANCELLED (LOCKED sessions are work-in-progress and are NOT cancelled)"
          - "Cascade (per cancelled session): its EmployeeLocks in status ISSUED -> VOIDED"
          - "open_session_count recomputed"
        note: "Conditional cascade — fires only on crossing INTO HIGH, not when already HIGH"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /machines/{id}/return-to-service"
        actor: EHSManager
        preconditions:
          - "open_session_count == 0 (ERR_MACHINE_HAS_OPEN_SESSIONS)"
          - "Machine has a LockoutProcedure with status ACTIVE (ERR_PROCEDURE_NOT_ACTIVE)"
          - "That ACTIVE procedure's audit_due_at >= current clock (ERR_AUDIT_OVERDUE)"
        side_effects: []

  - entity: EnergySurvey
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /energy-surveys/{id}/submit"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == surveyed_by_employee_id (ERR_FORBIDDEN)"
          - "energy_sources length >= 1 (guaranteed by creation validation)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /energy-surveys/{id}/submit (resubmission)"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == surveyed_by_employee_id (ERR_FORBIDDEN)"
        side_effects: []
        note: "Resubmit cycle — REJECTED is not terminal"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /energy-surveys/{id}/approve"
        actor: EHSManager
        preconditions:
          - "X-User-ID != surveyed_by_employee_id (segregation of duties, ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /energy-surveys/{id}/reject"
        actor: EHSManager
        preconditions:
          - "X-User-ID != surveyed_by_employee_id (segregation of duties, ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: []

  - entity: LockoutProcedure
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /lockout-procedures/{id}/activate"
        actor: EHSManager
        preconditions:
          - "survey_id's EnergySurvey.status == APPROVED (ERR_SURVEY_NOT_APPROVED)"
        side_effects:
          - "activated_at = clock; audit_due_at = activated_at + 365 days"
          - "Any sibling procedure of the same machine in status UNDER_REVISION -> SUPERSEDED"
          - "All MachineModifications of the machine with review_status UNREVIEWED -> REVIEWED"
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /lockout-procedures/{id}/activate (re-activation after modification review)"
        actor: EHSManager
        preconditions:
          - "survey_id's EnergySurvey.status == APPROVED (ERR_SURVEY_NOT_APPROVED)"
          - "revalidation_note present in payload (ERR_VALIDATION)"
        side_effects:
          - "activated_at UNCHANGED; audit_due_at unchanged (still keyed on last_completed_audit_at ?? activated_at)"
          - "All MachineModifications of the machine with review_status UNREVIEWED -> REVIEWED"
        note: "Closes the revision cycle without creating a new revision row"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "system (automatic when a MachineModification is registered on the machine)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: LockoutSessions referencing this procedure in status SETUP -> CANCELLED"
          - "Cascade (per cancelled session): its EmployeeLocks in status ISSUED -> VOIDED"
          - "Machine.open_session_count recomputed"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "system (automatic when a ProcedureAudit of this procedure completes with result FAIL)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Audit-FAIL does NOT cancel SETUP sessions (contrast with modification cascade); those sessions are blocked at the lock transition until the procedure is ACTIVE again"
      - from: UNDER_REVISION
        to: SUPERSEDED
        trigger: "system (automatic when a different LockoutProcedure of the same machine transitions DRAFT -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /lockout-procedures/{id}/retire"
        actor: EHSManager
        preconditions:
          - "No LockoutSession referencing this procedure with status IN {SETUP, LOCKED, CLEARED} (ERR_PROCEDURE_IN_USE)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /lockout-procedures/{id}/retire"
        actor: EHSManager
        preconditions:
          - "No LockoutSession referencing this procedure with status IN {SETUP, LOCKED, CLEARED} (ERR_PROCEDURE_IN_USE)"
        side_effects: []
      - from: UNDER_REVISION
        to: RETIRED
        trigger: "POST /lockout-procedures/{id}/retire"
        actor: EHSManager
        preconditions:
          - "No LockoutSession referencing this procedure with status IN {SETUP, LOCKED, CLEARED} (ERR_PROCEDURE_IN_USE)"
        side_effects: []

  - entity: TrainingRecord
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /training-records/{id}/complete"
        actor: EHSManager
        preconditions: []
        side_effects:
          - "completed_at = clock; expires_at computed per calculations.training_expiry (variant selected by delivery_mode)"
          - "Employee.is_currently_qualified recomputed for the trainee"

  - entity: LockoutSession
    initial_state: SETUP
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SETUP
        to: LOCKED
        trigger: "POST /lockout-sessions/{id}/lock"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == primary_employee_id (ERR_FORBIDDEN)"
          - "LockoutProcedure referenced by procedure_id has status == ACTIVE (ERR_PROCEDURE_NOT_ACTIVE)"
          - "Machine referenced by machine_id has status == IN_SERVICE (ERR_MACHINE_NOT_IN_SERVICE)"
          - "applied_lock_count >= 1 (ERR_NO_LOCKS_APPLIED)"
          - "payload zero_energy_verified == true (ERR_ZERO_ENERGY_NOT_VERIFIED)"
        side_effects:
          - "started_at = clock; zero_energy_verified = true"
      - from: LOCKED
        to: CLEARED
        trigger: "POST /lockout-sessions/{id}/clear"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == primary_employee_id (ERR_FORBIDDEN)"
          - "applied_lock_count == 0 — every lock REMOVED or FORCE_REMOVED (ERR_LOCKS_STILL_APPLIED)"
        side_effects: []
      - from: CLEARED
        to: RELEASED
        trigger: "POST /lockout-sessions/{id}/release"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == primary_employee_id (ERR_FORBIDDEN)"
        side_effects:
          - "ended_at = clock; Machine.open_session_count recomputed"
          - "Cascade: any ContractorPermit with session_id = this session in status ACTIVE -> CLOSED"
      - from: SETUP
        to: CANCELLED
        trigger: "POST /lockout-sessions/{id}/cancel"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == primary_employee_id (ERR_FORBIDDEN)"
        side_effects:
          - "Its EmployeeLocks in status ISSUED -> VOIDED"
          - "Machine.open_session_count recomputed"
      - from: SETUP
        to: CANCELLED
        trigger: "system (cascade from machine out-of-service, incident-driven HIGH risk, or procedure-under-revision-on-modification)"
        actor: system
        preconditions: []
        side_effects:
          - "Its EmployeeLocks in status ISSUED -> VOIDED"
          - "Machine.open_session_count recomputed"

  - entity: EmployeeLock
    initial_state: ISSUED
    terminal_states: [REMOVED, FORCE_REMOVED, VOIDED]
    transitions:
      - from: ISSUED
        to: APPLIED
        trigger: "POST /employee-locks/{id}/apply"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == employee_id (lock owner only, ERR_FORBIDDEN)"
          - "Owning LockoutSession.status IN {SETUP, LOCKED} (ERR_INVALID_STATE)"
        side_effects:
          - "applied_at = clock; session.applied_lock_count recomputed"
      - from: APPLIED
        to: REMOVED
        trigger: "POST /employee-locks/{id}/remove"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == employee_id (lock owner only, ERR_FORBIDDEN)"
          - "Owning LockoutSession.status == LOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "removed_at = clock; session.applied_lock_count recomputed; Employee.outstanding_lock_count recomputed"
      - from: APPLIED
        to: FORCE_REMOVED
        trigger: "POST /employee-locks/{id}/force-remove"
        actor: EHSManager
        preconditions:
          - "X-User-ID != employee_id (segregation of duties — owner may not force-remove own lock, ERR_SELF_APPROVAL_FORBIDDEN)"
          - "Owning LockoutSession.status == LOCKED (ERR_INVALID_STATE)"
          - "payload reason present (ERR_VALIDATION)"
        side_effects:
          - "removed_at = clock; removal_reason recorded; session.applied_lock_count recomputed; Employee.outstanding_lock_count recomputed"
      - from: ISSUED
        to: VOIDED
        trigger: "system (cascade when owning session transitions SETUP -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Employee.outstanding_lock_count recomputed"

  - entity: ProcedureAudit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /procedure-audits/{id}/complete"
        actor: EHSAuditor
        preconditions:
          - "X-User-ID == auditor_employee_id (ERR_FORBIDDEN)"
          - "employees_sampled is a subset of the distinct lock-appliers of this procedure within [period_start, clock] (ERR_SAMPLE_TOO_SMALL)"
          - "length(employees_sampled) >= calculations.audit_sample_minimum (ERR_SAMPLE_TOO_SMALL)"
        side_effects:
          - "completed_at = clock; result recorded"
          - "procedure.last_completed_audit_at = clock; procedure.audit_due_at recomputed (= clock + 365 days)"
          - "If result == FAIL: procedure (ACTIVE) -> UNDER_REVISION (see LockoutProcedure machine)"

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [LINKED, DISMISSED]
    transitions:
      - from: REPORTED
        to: LINKED
        trigger: "POST /incident-reports/{id}/link"
        actor: EHSManager
        preconditions: []
        side_effects:
          - "linked_at = clock"
          - "Machine.risk_score recomputed per calculations.machine_risk_score (variant per machine.risk_window_policy); Machine.risk_tier re-derived"
          - "Conditional cascade: if risk_tier crosses INTO HIGH -> Machine IN_SERVICE -> OUT_OF_SERVICE (see Machine machine, including its session/lock cascades)"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /incident-reports/{id}/dismiss"
        actor: EHSManager
        preconditions: []
        side_effects: []
        note: "DISMISSED reports never contribute to risk_score"

  - entity: ContractorPermit
    initial_state: REQUESTED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /contractor-permits/{id}/approve"
        actor: EHSManager
        preconditions:
          - "Machine.status == IN_SERVICE (ERR_MACHINE_NOT_IN_SERVICE)"
          - "insurance_valid_until > clock (ERR_INSURANCE_EXPIRED)"
          - "coordination_meeting_at present and <= clock (ERR_VALIDATION)"
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /contractor-permits/{id}/reject"
        actor: EHSManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /contractor-permits/{id}/activate"
        actor: AuthorizedEmployee
        preconditions:
          - "X-User-ID == coordinator_employee_id (ERR_FORBIDDEN)"
          - "session_id references a LockoutSession with status == LOCKED, session_type == CONTRACTOR, machine_id == permit.machine_id, primary_employee_id == coordinator_employee_id (ERR_PERMIT_SESSION_MISMATCH)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (automatic when the bound LockoutSession transitions CLEARED -> RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MinorServicingException
    initial_state: PENDING
    terminal_states: [REVOKED, DETERMINED]
    transitions:
      - from: PENDING
        to: DETERMINED
        trigger: "POST /minor-servicing-exceptions/{id}/determine"
        actor: EHSManager
        preconditions:
          - "X-User-ID != requested_by_employee_id (segregation of duties, ERR_SELF_APPROVAL_FORBIDDEN)"
          - "If computed determination == ELIGIBLE: no other MinorServicingException for the same machine with status DETERMINED, determination ELIGIBLE, and a closed-interval-overlapping [valid_from, valid_until] window (ERR_EXCEPTION_WINDOW_CONFLICT)"
        side_effects:
          - "determination computed per calculations.minor_servicing_eligibility using machine.risk_tier at determination time"
          - "determined_by_employee_id = X-User-ID"
      - from: DETERMINED
        to: REVOKED
        trigger: "POST /minor-servicing-exceptions/{id}/revoke"
        actor: EHSManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: machine-modification-stale-version
    parent_entity: Machine
    write_endpoint: "POST /machines/{id}/modifications"
    occ_field: "expected_machine_version"
    description: |
      Registering a MachineModification against a Machine whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just registered a modification (which
      legitimately superseded the client's view of the machine's configuration
      baseline) and the current writer's observed version is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: machine_risk_score
    trigger: "an IncidentReport transitions REPORTED -> LINKED"
    algorithm: aggregation
    formula: |
      inputs = IncidentReports with machine_id = machine AND status == LINKED
      per the selected variant's window:
        ROLLING_12MO:               occurred_at >= clock - 365 days
        SINCE_PROCEDURE_ACTIVATION: occurred_at >= (activated_at of the machine's
                                    current procedure — the non-SUPERSEDED,
                                    non-RETIRED revision with the greatest
                                    revision_no; if none exists, score = 0)
      weight(kind): NEAR_MISS=1, FIRST_AID=2, PROPERTY_DAMAGE=3, INJURY=5
      risk_score = sum(weight(kind) for each included incident)
      risk_tier: risk_score < 5 -> LOW ; 5 <= risk_score < 10 -> MEDIUM ; risk_score >= 10 -> HIGH
      DISMISSED reports never contribute.
    input_set: "IncidentReports of the machine with status LINKED, filtered by the variant window"
    constants:
      W_NEAR_MISS: 1
      W_FIRST_AID: 2
      W_PROPERTY_DAMAGE: 3
      W_INJURY: 5
      TIER_MEDIUM_MIN: 5
      TIER_HIGH_MIN: 10
      WINDOW_DAYS: 365
    precision: "integer arithmetic, no rounding"
    variants:
      - name: ROLLING_12MO
        when: "machine.risk_window_policy == ROLLING_12MO"
        difference: "window = trailing 365 days before current clock; incidents older than 365 days drop out even if they postdate procedure activation"
      - name: SINCE_PROCEDURE_ACTIVATION
        when: "machine.risk_window_policy == SINCE_PROCEDURE_ACTIVATION"
        difference: "window = [current procedure's activated_at, clock]; incidents before activation drop out even when they fall inside the trailing 365 days"

  - name: training_expiry
    trigger: "TrainingRecord transitions ASSIGNED -> COMPLETED"
    algorithm: threshold
    formula: |
      ANNIVERSARY variant (delivery_mode == IN_PERSON):
        expires_at = completed_at + 365 days (to the second)
      CALENDAR variant (delivery_mode == ONLINE):
        expires_at = end of the calendar year following the year of completed_at
                     = Dec 31 of year(completed_at)+1 at 23:59:59Z
      Employee.is_currently_qualified =
        qualification == AUTHORIZED AND
        EXISTS TrainingRecord with employee_id = employee,
               course_code IN {LOTO_AUTHORIZED_INITIAL, LOTO_AUTHORIZED_REFRESH},
               status == COMPLETED, expires_at > clock
      due_at (assignment deadline) = assigned_at + 30 days.
    input_set: "the completing TrainingRecord; per-employee recomputation scans all of the employee's COMPLETED records"
    constants:
      VALIDITY_DAYS: 365
      ASSIGNMENT_DUE_DAYS: 30
    precision: "second precision on datetimes; strict > comparison for expiry"
    variants:
      - name: ANNIVERSARY
        when: "delivery_mode == IN_PERSON"
        difference: "expiry is anchored to the completion instant (rolling 365-day validity)"
      - name: CALENDAR
        when: "delivery_mode == ONLINE"
        difference: "expiry is anchored to calendar-year end of the following year — a course completed 2026-01-10 expires 2027-12-31T23:59:59Z, NOT 2027-01-10"

  - name: minor_servicing_eligibility
    trigger: "POST /minor-servicing-exceptions/{id}/determine"
    algorithm: threshold
    formula: |
      # mode (a): >=3 inputs with non-linear conditional interaction
      duration_cap(risk_tier): LOW -> 480 ; MEDIUM -> 120 ; HIGH -> 0
      if NOT (routine_repetitive AND integral_to_production AND alternative_measures_effective):
        determination = NOT_ELIGIBLE
      else if estimated_duration_min > duration_cap(machine.risk_tier at determination time):
        determination = NOT_ELIGIBLE
      else:
        determination = ELIGIBLE
      # machine.risk_tier is read once, at determination time; later tier changes
      # do NOT retroactively change a DETERMINED exception.
    input_set: "the exception's boolean criteria + estimated_duration_min + machine.risk_tier at determination time"
    constants:
      CAP_LOW_MIN: 480
      CAP_MEDIUM_MIN: 120
      CAP_HIGH_MIN: 0
    precision: "integer minutes; eligibility boundary is inclusive (duration == cap is ELIGIBLE)"

  - name: session_lock_capacity
    trigger: "POST /employee-locks (issuing/joining a lock on a session)"
    algorithm: threshold
    formula: |
      # mode (c): circular-looking dependency, evaluation order pinned
      # Evaluation order (mandatory):
      #   1. Read session.max_locks — the value PINNED from
      #      procedure.isolation_point_count at session creation.
      #      NEVER re-read the procedure: the procedure may since have gone
      #      UNDER_REVISION or been SUPERSEDED by a revision with a different
      #      isolation_point_count, which must not affect in-flight sessions.
      #   2. Count non_terminal_locks = EmployeeLocks with session_id = session
      #      AND status IN {ISSUED, APPLIED}.
      #   3. If non_terminal_locks >= session.max_locks -> reject ERR_LOCK_POINT_CAPACITY
      #      (boundary: count == max_locks rejects; count == max_locks - 1 allows).
    input_set: "EmployeeLocks of the session with status IN {ISSUED, APPLIED}; session.max_locks (pinned)"
    precision: "integer count; >= comparison"

  - name: audit_sample_minimum
    trigger: "POST /procedure-audits/{id}/complete"
    algorithm: aggregation
    formula: |
      appliers = DISTINCT employee_id over EmployeeLocks whose session's
                 procedure_id = audit.procedure_id AND
                 status IN {APPLIED, REMOVED, FORCE_REMOVED} AND
                 period_start <= applied_at <= clock
      if |appliers| == 0: minimum = 0
      else:               minimum = max(1, ceil(0.25 * |appliers|))
      complete requires: employees_sampled subset of appliers AND
                         length(employees_sampled) >= minimum
    input_set: "EmployeeLocks reaching APPLIED under the audited procedure within [period_start, clock] (closed bounds)"
    constants:
      SAMPLE_FRACTION: 0.25
      SAMPLE_MIN: 1
    precision: "ceil rounding to whole employees; no fractional persons"

  - name: audit_due_at
    trigger: "LockoutProcedure DRAFT -> ACTIVE ; ProcedureAudit SCHEDULED -> COMPLETED"
    algorithm: aggregation
    formula: |
      audit_due_at = (last_completed_audit_at ?? activated_at) + 365 days
      Overdue predicate (evaluated at session creation and machine return-to-service):
        clock > audit_due_at  -> overdue (ERR_AUDIT_OVERDUE)
        clock == audit_due_at -> NOT overdue (boundary: due instant itself still passes)
    input_set: "the procedure's own activated_at / last_completed_audit_at"
    constants:
      AUDIT_PERIOD_DAYS: 365
    precision: "second precision; strict > for overdue"

  - name: open_session_count
    trigger: "LockoutSession create; any transition into/out of {SETUP, LOCKED, CLEARED}"
    algorithm: aggregation
    formula: |
      Machine.open_session_count = COUNT(LockoutSession s WHERE
        s.machine_id = machine AND s.status IN {SETUP, LOCKED, CLEARED})
    input_set: "all LockoutSessions of the machine"
    precision: "integer count"

  - name: outstanding_lock_count
    trigger: "EmployeeLock create; any EmployeeLock transition"
    algorithm: aggregation
    formula: |
      Employee.outstanding_lock_count = COUNT(EmployeeLock l WHERE
        l.employee_id = employee AND l.status IN {ISSUED, APPLIED})
    input_set: "all EmployeeLocks of the employee"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, enum members valid, array min-lengths honored, integer ranges honored (severity 1..5, estimated_duration_min >= 1), window start < end"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids and body foreign keys exist; cross-references belong to the same scope (procedure.machine_id == session.machine_id; survey.machine_id == procedure.machine_id; incident.session_id's machine == incident.machine_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 5
    category: auth
    check: "Ownership: lock apply/remove by lock owner; session lock/clear/release/cancel by primary_employee; audit complete by assigned auditor; permit activate by coordinator; survey submit by surveyed_by"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "ownership-scoped action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_machine_version equals Machine.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /machines/{id}/modifications"
  - priority: 7
    category: state
    check: "Target entity is in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: survey approver/rejecter != surveyed_by; exception determiner != requested_by; force-remover != lock owner"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 409
    applies_to: "POST /energy-surveys/{id}/approve, reject; POST /minor-servicing-exceptions/{id}/determine; POST /employee-locks/{id}/force-remove"
  - priority: 9
    category: business_safety
    check: "Machine posture: machine must be IN_SERVICE for session create, session lock, permit approve"
    error_id: ERR_MACHINE_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /lockout-sessions, POST /lockout-sessions/{id}/lock, POST /contractor-permits/{id}/approve"
  - priority: 10
    category: business_safety
    check: "Procedure currency: procedure status == ACTIVE for session create and lock; audit not overdue (clock <= audit_due_at) for session create and machine return-to-service; an ACTIVE procedure exists for return-to-service"
    error_id: "ERR_PROCEDURE_NOT_ACTIVE / ERR_AUDIT_OVERDUE"
    http_status: 409
    applies_to: "POST /lockout-sessions, POST /lockout-sessions/{id}/lock, POST /machines/{id}/return-to-service"
  - priority: 11
    category: business_safety
    check: "Survey approval: procedure activation requires survey status == APPROVED"
    error_id: ERR_SURVEY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /lockout-procedures/{id}/activate"
  - priority: 12
    category: business_safety
    check: "Competency: session creator, lock issuer, and audit creator must be currently qualified authorized employees (is_currently_qualified == true)"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /lockout-sessions, POST /employee-locks, POST /procedure-audits"
  - priority: 13
    category: business_safety
    check: "Zero-energy / lock lifecycle safety: lock transition requires zero_energy_verified == true and applied_lock_count >= 1; clear requires applied_lock_count == 0"
    error_id: "ERR_ZERO_ENERGY_NOT_VERIFIED / ERR_NO_LOCKS_APPLIED / ERR_LOCKS_STILL_APPLIED"
    http_status: 409
    applies_to: "POST /lockout-sessions/{id}/lock, POST /lockout-sessions/{id}/clear"
  - priority: 14
    category: business_safety
    check: "Auditor independence: audit creator must not be among the procedure's lock-appliers in the audit period"
    error_id: ERR_AUDITOR_CONFLICT
    http_status: 409
    applies_to: "POST /procedure-audits"
  - priority: 15
    category: business_temporal
    check: "Machine occupation: no other LockoutSession for the machine with status IN {SETUP, LOCKED, CLEARED} (half-open occupation [created_at, ended_at): a session whose predecessor released at exactly this clock instant does not conflict)"
    error_id: ERR_MACHINE_SESSION_CONFLICT
    http_status: 409
    applies_to: "POST /lockout-sessions"
  - priority: 16
    category: business_temporal
    check: "Auditor double-booking: no other SCHEDULED ProcedureAudit for the same auditor with closed-interval-overlapping [scheduled_start, scheduled_end] (touching endpoints DO conflict — back-to-back audits rejected)"
    error_id: ERR_AUDITOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /procedure-audits"
  - priority: 17
    category: business_temporal
    check: "Exception window exclusivity: an ELIGIBLE determination requires no other DETERMINED+ELIGIBLE exception for the machine with closed-interval-overlapping [valid_from, valid_until] (touching endpoints DO conflict)"
    error_id: ERR_EXCEPTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /minor-servicing-exceptions/{id}/determine"
  - priority: 18
    category: business_temporal
    check: "Contractor insurance validity: insurance_valid_until > clock at approval"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 409
    applies_to: "POST /contractor-permits/{id}/approve"
  - priority: 19
    category: business_constraint
    check: "Group lockout capacity: non-terminal lock count < session.max_locks (pinned)"
    error_id: ERR_LOCK_POINT_CAPACITY
    http_status: 409
    applies_to: "POST /employee-locks"
  - priority: 20
    category: business_constraint
    check: "Uniqueness: lock_no unique among locks with status IN {ISSUED, APPLIED}; employee may not hold a second non-terminal lock on the same session; machine has at most one LockoutProcedure in status DRAFT or ACTIVE (a second DRAFT is allowed only when the current procedure is UNDER_REVISION); asset_tag / employee_no unique"
    error_id: "ERR_DUPLICATE_LOCK_NO / ERR_ALREADY_ON_SESSION / ERR_PROCEDURE_CONFLICT / ERR_VALIDATION"
    http_status: 409
    applies_to: "POST /employee-locks, POST /lockout-procedures, POST /machines, POST /employees"
  - priority: 21
    category: business_constraint
    check: "Audit sample adequacy: employees_sampled subset of period appliers and size >= audit_sample_minimum"
    error_id: ERR_SAMPLE_TOO_SMALL
    http_status: 422
    applies_to: "POST /procedure-audits/{id}/complete"
  - priority: 22
    category: business_referential
    check: "Work-in-progress guards: out-of-service / procedure retire blocked by open sessions; CONTRACTOR session requires an APPROVED permit for the machine; permit activate requires matching LOCKED CONTRACTOR session"
    error_id: "ERR_MACHINE_HAS_OPEN_SESSIONS / ERR_PROCEDURE_IN_USE / ERR_PERMIT_REQUIRED / ERR_PERMIT_SESSION_MISMATCH"
    http_status: 409
    applies_to: "POST /machines/{id}/out-of-service, POST /lockout-procedures/{id}/retire, POST /lockout-sessions, POST /contractor-permits/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call): 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time."
    roles: [EHSManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced/set to to_iso8601"]

  # --- Machine ---
  - method: POST
    path: "/machines"
    description: "Register a machine"
    roles: [EHSManager]
    code: 201
    input: [asset_tag, name, area, risk_window_policy]
    output: Machine
    side_effects: ["status=IN_SERVICE, risk_tier=LOW, risk_score=0, open_session_count=0, version=1"]
  - method: GET
    path: "/machines"
    description: "List machines"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["status?", "risk_tier?", "limit?", "offset?"]
    output: Machine[]
    side_effects: []
  - method: GET
    path: "/machines/{id}"
    description: "Get a machine"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: Machine
    side_effects: []
  - method: POST
    path: "/machines/{id}/modifications"
    description: "Register a machine modification (OCC-guarded; cascades procedure UNDER_REVISION)"
    roles: [EHSManager]
    code: 201
    input: [description, expected_machine_version]
    output: MachineModification
    side_effects:
      - "increments Machine.version by 1"
      - "MachineModification created with review_status UNREVIEWED"
      - "Machine's ACTIVE LockoutProcedure -> UNDER_REVISION, with its SETUP-session/ISSUED-lock cascades (see §1.2)"
  - method: GET
    path: "/machines/{id}/modifications"
    description: "List modifications of a machine"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["limit?", "offset?"]
    output: MachineModification[]
    side_effects: []
  - method: POST
    path: "/machines/{id}/out-of-service"
    description: "Take machine out of service"
    roles: [EHSManager]
    code: 200
    input: []
    output: Machine
    side_effects: ["status -> OUT_OF_SERVICE", "SETUP sessions -> CANCELLED", "their ISSUED locks -> VOIDED"]
  - method: POST
    path: "/machines/{id}/return-to-service"
    description: "Return machine to service"
    roles: [EHSManager]
    code: 200
    input: []
    output: Machine
    side_effects: ["status -> IN_SERVICE"]

  # --- EnergySurvey ---
  - method: POST
    path: "/energy-surveys"
    description: "Create an energy-source survey for a machine (surveyor = caller)"
    roles: [AuthorizedEmployee]
    code: 201
    input: [machine_id, energy_sources, "note?"]
    output: EnergySurvey
    side_effects: ["status=DRAFT", "surveyed_by_employee_id = X-User-ID", "isolation_point_count = len(energy_sources)"]
  - method: GET
    path: "/energy-surveys"
    description: "List energy surveys"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "surveyed_by_employee_id?", "status?", "limit?", "offset?"]
    output: EnergySurvey[]
    side_effects: []
  - method: GET
    path: "/energy-surveys/{id}"
    description: "Get an energy survey"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: EnergySurvey
    side_effects: []
  - method: POST
    path: "/energy-surveys/{id}/submit"
    description: "Submit (or resubmit after rejection) a survey"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: EnergySurvey
    side_effects: ["status DRAFT|REJECTED -> SUBMITTED"]
  - method: POST
    path: "/energy-surveys/{id}/approve"
    description: "Approve a submitted survey (approver != surveyor)"
    roles: [EHSManager]
    code: 200
    input: []
    output: EnergySurvey
    side_effects: ["status SUBMITTED -> APPROVED"]
  - method: POST
    path: "/energy-surveys/{id}/reject"
    description: "Reject a submitted survey (rejecter != surveyor)"
    roles: [EHSManager]
    code: 200
    input: ["reason?"]
    output: EnergySurvey
    side_effects: ["status SUBMITTED -> REJECTED"]

  # --- LockoutProcedure ---
  - method: POST
    path: "/lockout-procedures"
    description: "Create a machine-specific lockout procedure (first revision, or successor while current is UNDER_REVISION)"
    roles: [EHSManager]
    code: 201
    input: [machine_id, survey_id, steps]
    output: LockoutProcedure
    side_effects: ["status=DRAFT", "revision_no assigned", "isolation_point_count snapshotted from survey"]
  - method: GET
    path: "/lockout-procedures"
    description: "List procedures"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "survey_id?", "status?", "limit?", "offset?"]
    output: LockoutProcedure[]
    side_effects: []
  - method: GET
    path: "/lockout-procedures/{id}"
    description: "Get a procedure"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: LockoutProcedure
    side_effects: []
  - method: POST
    path: "/lockout-procedures/{id}/activate"
    description: "Activate a procedure (DRAFT->ACTIVE; UNDER_REVISION->ACTIVE requires revalidation_note)"
    roles: [EHSManager]
    code: 200
    input: ["revalidation_note?"]
    output: LockoutProcedure
    side_effects: ["status -> ACTIVE", "activated_at/audit_due_at set on first activation", "UNDER_REVISION sibling -> SUPERSEDED", "UNREVIEWED modifications -> REVIEWED"]
  - method: POST
    path: "/lockout-procedures/{id}/retire"
    description: "Retire a procedure not in use"
    roles: [EHSManager]
    code: 200
    input: []
    output: LockoutProcedure
    side_effects: ["status -> RETIRED"]

  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Register an employee"
    roles: [EHSManager]
    code: 201
    input: [employee_no, full_name, qualification]
    output: Employee
    side_effects: ["status=ACTIVE, is_currently_qualified=false, outstanding_lock_count=0"]
  - method: GET
    path: "/employees/{id}"
    description: "Get an employee (includes computed qualification/lock counters)"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # --- TrainingRecord ---
  - method: POST
    path: "/training-records"
    description: "Assign a LOTO course to an employee"
    roles: [EHSManager]
    code: 201
    input: [employee_id, course_code, delivery_mode]
    output: TrainingRecord
    side_effects: ["status=ASSIGNED", "assigned_at=clock", "due_at=clock+30d"]
  - method: GET
    path: "/training-records"
    description: "List training records"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["employee_id?", "course_code?", "status?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: "/training-records/{id}"
    description: "Get a training record"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: POST
    path: "/training-records/{id}/complete"
    description: "Record course completion; computes expires_at per delivery-mode variant"
    roles: [EHSManager]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["status ASSIGNED -> COMPLETED", "completed_at=clock", "expires_at computed", "Employee.is_currently_qualified recomputed"]

  # --- LockoutSession ---
  - method: POST
    path: "/lockout-sessions"
    description: "Plan a lockout session (creator becomes primary authorized employee)"
    roles: [AuthorizedEmployee]
    code: 201
    input: [machine_id, procedure_id, session_type]
    output: LockoutSession
    side_effects: ["status=SETUP", "primary_employee_id = X-User-ID", "procedure_revision_no + max_locks pinned", "Machine.open_session_count recomputed"]
  - method: GET
    path: "/lockout-sessions"
    description: "List lockout sessions"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "procedure_id?", "primary_employee_id?", "status?", "limit?", "offset?"]
    output: LockoutSession[]
    side_effects: []
  - method: GET
    path: "/lockout-sessions/{id}"
    description: "Get a lockout session"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: LockoutSession
    side_effects: []
  - method: POST
    path: "/lockout-sessions/{id}/lock"
    description: "Complete energy isolation (SETUP -> LOCKED)"
    roles: [AuthorizedEmployee]
    code: 200
    input: [zero_energy_verified]
    output: LockoutSession
    side_effects: ["status -> LOCKED", "started_at=clock", "zero_energy_verified recorded"]
  - method: POST
    path: "/lockout-sessions/{id}/clear"
    description: "Work complete and all locks off (LOCKED -> CLEARED)"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: LockoutSession
    side_effects: ["status -> CLEARED"]
  - method: POST
    path: "/lockout-sessions/{id}/release"
    description: "Restore energy (CLEARED -> RELEASED); closes any bound contractor permit"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: LockoutSession
    side_effects: ["status -> RELEASED", "ended_at=clock", "Machine.open_session_count recomputed", "bound ContractorPermit ACTIVE -> CLOSED"]
  - method: POST
    path: "/lockout-sessions/{id}/cancel"
    description: "Cancel a session still in SETUP"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: LockoutSession
    side_effects: ["status -> CANCELLED", "ISSUED locks -> VOIDED", "Machine.open_session_count recomputed"]

  # --- EmployeeLock ---
  - method: POST
    path: "/employee-locks"
    description: "Issue a lock/tag and join a session (owner = caller); group lockout = many locks, one session"
    roles: [AuthorizedEmployee]
    code: 201
    input: [session_id, lock_no, tag_no]
    output: EmployeeLock
    side_effects: ["status=ISSUED", "employee_id = X-User-ID", "Employee.outstanding_lock_count recomputed"]
  - method: GET
    path: "/employee-locks"
    description: "List employee locks"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["session_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: EmployeeLock[]
    side_effects: []
  - method: GET
    path: "/employee-locks/{id}"
    description: "Get an employee lock"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: EmployeeLock
    side_effects: []
  - method: POST
    path: "/employee-locks/{id}/apply"
    description: "Attach the lock to an isolation point (ISSUED -> APPLIED)"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: EmployeeLock
    side_effects: ["status -> APPLIED", "applied_at=clock", "session.applied_lock_count recomputed"]
  - method: POST
    path: "/employee-locks/{id}/remove"
    description: "Owner removes own lock (APPLIED -> REMOVED)"
    roles: [AuthorizedEmployee]
    code: 200
    input: []
    output: EmployeeLock
    side_effects: ["status -> REMOVED", "removed_at=clock", "session.applied_lock_count + Employee.outstanding_lock_count recomputed"]
  - method: POST
    path: "/employee-locks/{id}/force-remove"
    description: "Emergency removal by EHS manager (must not be the lock owner)"
    roles: [EHSManager]
    code: 200
    input: [reason]
    output: EmployeeLock
    side_effects: ["status APPLIED -> FORCE_REMOVED", "removed_at=clock, removal_reason recorded", "session.applied_lock_count + Employee.outstanding_lock_count recomputed"]

  # --- ProcedureAudit ---
  - method: POST
    path: "/procedure-audits"
    description: "Schedule the annual procedure audit (auditor = caller; independence + double-booking enforced)"
    roles: [EHSAuditor]
    code: 201
    input: [procedure_id, scheduled_start, scheduled_end]
    output: ProcedureAudit
    side_effects: ["status=SCHEDULED", "auditor_employee_id = X-User-ID", "period_start snapshot computed"]
  - method: GET
    path: "/procedure-audits"
    description: "List procedure audits"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["procedure_id?", "auditor_employee_id?", "status?", "limit?", "offset?"]
    output: ProcedureAudit[]
    side_effects: []
  - method: GET
    path: "/procedure-audits/{id}"
    description: "Get a procedure audit"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: ProcedureAudit
    side_effects: []
  - method: POST
    path: "/procedure-audits/{id}/complete"
    description: "Complete the audit with PASS/FAIL and the authorized-employee verification sample"
    roles: [EHSAuditor]
    code: 200
    input: [result, employees_sampled]
    output: ProcedureAudit
    side_effects: ["status -> COMPLETED", "completed_at=clock", "procedure.last_completed_audit_at=clock; audit_due_at += window", "FAIL: procedure ACTIVE -> UNDER_REVISION"]

  # --- IncidentReport ---
  - method: POST
    path: "/incident-reports"
    description: "Report a near-miss or incident on a machine"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 201
    input: [machine_id, kind, occurred_at, severity, "session_id?", "description?"]
    output: IncidentReport
    side_effects: ["status=REPORTED"]
  - method: GET
    path: "/incident-reports"
    description: "List incident reports"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "session_id?", "kind?", "status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: GET
    path: "/incident-reports/{id}"
    description: "Get an incident report"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/incident-reports/{id}/link"
    description: "Link a report to the machine record; recomputes risk and may force OUT_OF_SERVICE"
    roles: [EHSManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> LINKED", "linked_at=clock", "Machine.risk_score/risk_tier recomputed", "tier crossing into HIGH -> Machine OUT_OF_SERVICE cascade"]
  - method: POST
    path: "/incident-reports/{id}/dismiss"
    description: "Dismiss a report (never contributes to risk)"
    roles: [EHSManager]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> DISMISSED"]

  # --- ContractorPermit ---
  - method: POST
    path: "/contractor-permits"
    description: "Request a contractor lockout permit (coordinator = caller)"
    roles: [AuthorizedEmployee]
    code: 201
    input: [machine_id, company_name, insurance_valid_until]
    output: ContractorPermit
    side_effects: ["status=REQUESTED", "coordinator_employee_id = X-User-ID"]
  - method: GET
    path: "/contractor-permits"
    description: "List contractor permits"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "coordinator_employee_id?", "session_id?", "status?", "limit?", "offset?"]
    output: ContractorPermit[]
    side_effects: []
  - method: GET
    path: "/contractor-permits/{id}"
    description: "Get a contractor permit"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: ContractorPermit
    side_effects: []
  - method: POST
    path: "/contractor-permits/{id}/approve"
    description: "Approve a permit after the coordination meeting"
    roles: [EHSManager]
    code: 200
    input: [coordination_meeting_at]
    output: ContractorPermit
    side_effects: ["status REQUESTED -> APPROVED"]
  - method: POST
    path: "/contractor-permits/{id}/reject"
    description: "Reject a permit request"
    roles: [EHSManager]
    code: 200
    input: []
    output: ContractorPermit
    side_effects: ["status REQUESTED -> REJECTED"]
  - method: POST
    path: "/contractor-permits/{id}/activate"
    description: "Bind an in-progress CONTRACTOR session to the permit (coordinator only)"
    roles: [AuthorizedEmployee]
    code: 200
    input: [session_id]
    output: ContractorPermit
    side_effects: ["status APPROVED -> ACTIVE"]

  # --- MinorServicingException ---
  - method: POST
    path: "/minor-servicing-exceptions"
    description: "Request a minor-servicing exception determination (requester = caller)"
    roles: [AuthorizedEmployee]
    code: 201
    input: [machine_id, task_description, routine_repetitive, integral_to_production, alternative_measures_effective, estimated_duration_min, valid_from, valid_until]
    output: MinorServicingException
    side_effects: ["status=PENDING", "requested_by_employee_id = X-User-ID"]
  - method: GET
    path: "/minor-servicing-exceptions"
    description: "List minor-servicing exceptions"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: ["machine_id?", "requested_by_employee_id?", "determined_by_employee_id?", "status?", "limit?", "offset?"]
    output: MinorServicingException[]
    side_effects: []
  - method: GET
    path: "/minor-servicing-exceptions/{id}"
    description: "Get a minor-servicing exception"
    roles: [EHSManager, EHSAuditor, AuthorizedEmployee]
    code: 200
    input: []
    output: MinorServicingException
    side_effects: []
  - method: POST
    path: "/minor-servicing-exceptions/{id}/determine"
    description: "Run the eligibility determination (determiner != requester)"
    roles: [EHSManager]
    code: 200
    input: []
    output: MinorServicingException
    side_effects: ["status PENDING -> DETERMINED", "determination computed (ELIGIBLE | NOT_ELIGIBLE)", "determined_by_employee_id = X-User-ID"]
  - method: POST
    path: "/minor-servicing-exceptions/{id}/revoke"
    description: "Revoke a determined exception"
    roles: [EHSManager]
    code: 200
    input: []
    output: MinorServicingException
    side_effects: ["status DETERMINED -> REVOKED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership check failed (lock owner, session primary, auditor, coordinator, surveyor)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum member, empty required array, out-of-range integer, window start >= end, coordination_meeting_at in the future, missing revalidation_note on UNDER_REVISION activation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not exist, or cross-reference belongs to a different scope (procedure/survey/session machine mismatch)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_machine_version != Machine.version on modification registration (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition does not exist from the entity's current state" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 409, condition: "Segregation of duties violated: survey approver/rejecter is the surveyor; exception determiner is the requester; force-remover is the lock owner" }
  - { id: ERR_SURVEY_NOT_APPROVED, http: 409, condition: "Procedure activation while its EnergySurvey is not APPROVED" }
  - { id: ERR_PROCEDURE_CONFLICT, http: 409, condition: "Creating a procedure while the machine already has one in status DRAFT or ACTIVE (successor DRAFT allowed only when current is UNDER_REVISION)" }
  - { id: ERR_PROCEDURE_NOT_ACTIVE, http: 409, condition: "Session create/lock with procedure not ACTIVE; return-to-service without an ACTIVE procedure" }
  - { id: ERR_AUDIT_OVERDUE, http: 409, condition: "Session create or return-to-service when clock > procedure.audit_due_at (clock == audit_due_at still passes)" }
  - { id: ERR_AUDITOR_CONFLICT, http: 409, condition: "Auditor is among the procedure's lock-appliers in the audit period (segregation of duties)" }
  - { id: ERR_AUDITOR_DOUBLE_BOOKED, http: 409, condition: "Auditor already has a SCHEDULED audit whose closed window [scheduled_start, scheduled_end] overlaps the new one (touching endpoints conflict)" }
  - { id: ERR_SAMPLE_TOO_SMALL, http: 422, condition: "employees_sampled not a subset of period lock-appliers, or size below audit_sample_minimum" }
  - { id: ERR_TRAINING_NOT_CURRENT, http: 409, condition: "Actor's authorized-employee training missing or expired (is_currently_qualified == false)" }
  - { id: ERR_MACHINE_NOT_IN_SERVICE, http: 409, condition: "Machine not IN_SERVICE for session create/lock or permit approve" }
  - { id: ERR_MACHINE_SESSION_CONFLICT, http: 409, condition: "Machine already has a LockoutSession with status IN {SETUP, LOCKED, CLEARED}" }
  - { id: ERR_LOCK_POINT_CAPACITY, http: 409, condition: "Non-terminal locks on session == session.max_locks (pinned isolation-point capacity)" }
  - { id: ERR_DUPLICATE_LOCK_NO, http: 409, condition: "lock_no already in use by a lock with status IN {ISSUED, APPLIED}" }
  - { id: ERR_ALREADY_ON_SESSION, http: 409, condition: "Employee already holds a non-terminal lock on this session" }
  - { id: ERR_ZERO_ENERGY_NOT_VERIFIED, http: 409, condition: "Lock transition with zero_energy_verified != true" }
  - { id: ERR_NO_LOCKS_APPLIED, http: 409, condition: "Lock transition with applied_lock_count == 0" }
  - { id: ERR_LOCKS_STILL_APPLIED, http: 409, condition: "Clear transition with applied_lock_count > 0" }
  - { id: ERR_MACHINE_HAS_OPEN_SESSIONS, http: 409, condition: "Out-of-service with a LOCKED session, or return-to-service with open_session_count > 0" }
  - { id: ERR_PROCEDURE_IN_USE, http: 409, condition: "Retire while a referencing session has status IN {SETUP, LOCKED, CLEARED}" }
  - { id: ERR_INSURANCE_EXPIRED, http: 409, condition: "Permit approval with insurance_valid_until <= clock" }
  - { id: ERR_PERMIT_REQUIRED, http: 409, condition: "Creating a CONTRACTOR session without an APPROVED permit for the machine" }
  - { id: ERR_PERMIT_SESSION_MISMATCH, http: 409, condition: "Permit activate with a session that is not LOCKED / not CONTRACTOR / wrong machine / wrong primary" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EHSManager
    description: "EHS department manager: owns machines, approvals, determinations, incident linkage, training records, and the logical clock"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /machines; POST /machines/{id}/modifications; POST /machines/{id}/out-of-service; POST /machines/{id}/return-to-service"
      - "POST /energy-surveys/{id}/approve; POST /energy-surveys/{id}/reject"
      - "POST /lockout-procedures; POST /lockout-procedures/{id}/activate; POST /lockout-procedures/{id}/retire"
      - "POST /employees; POST /training-records; POST /training-records/{id}/complete"
      - "POST /employee-locks/{id}/force-remove"
      - "POST /incident-reports/{id}/link; POST /incident-reports/{id}/dismiss"
      - "POST /contractor-permits/{id}/approve; POST /contractor-permits/{id}/reject"
      - "POST /minor-servicing-exceptions/{id}/determine; POST /minor-servicing-exceptions/{id}/revoke"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /incident-reports"
  - name: EHSAuditor
    description: "Independent authorized employee who schedules and completes annual procedure audits; must not have used the audited procedure in the audit period"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /procedure-audits; POST /procedure-audits/{id}/complete"
    shared_operations:
      - "All GET endpoints"
      - "POST /incident-reports"
  - name: AuthorizedEmployee
    description: "LOTO-authorized employee: surveys machines, plans and runs lockout sessions, owns personal locks, coordinates contractors, requests minor-servicing exceptions"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /energy-surveys; POST /energy-surveys/{id}/submit"
      - "POST /lockout-sessions; POST /lockout-sessions/{id}/lock, clear, release, cancel"
      - "POST /employee-locks; POST /employee-locks/{id}/apply; POST /employee-locks/{id}/remove"
      - "POST /contractor-permits; POST /contractor-permits/{id}/activate"
      - "POST /minor-servicing-exceptions"
    shared_operations:
      - "All GET endpoints"
      - "POST /incident-reports"
