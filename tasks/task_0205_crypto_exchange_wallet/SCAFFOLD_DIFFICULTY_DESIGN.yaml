  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: staking_claim_zero_rewards_boundary
        grounds:
          - validations[priority=19]
          - state_machines.StakingPosition.ACTIVE_to_ACTIVE
          - calculations.staking_reward_accrual
          - errors[ERR_NOTHING_TO_CLAIM]
        distinguishing_aspect: |
          Claiming at the exact instant of staking (elapsed_seconds == 0 -> accrued_rewards == 0)
          is rejected with ERR_NOTHING_TO_CLAIM; one second later (>0) it succeeds. Boundary sits
          on accrued_rewards == 0 at POST /staking-positions/{id}/claim.
        test_recipe:
          setup:
            - "ETH asset (spot 2000); account TIER_1 holds 100 ETH; one ACTIVE StakingPosition of 100 ETH @ 500 bps just opened at clock T"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "ETH", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.001, network_fee: 0.001, spot_price_usd: 2000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "stk1@x.com", full_name: "Stk1", residence_country: "US" }
              as: Anonymous
              captures: { acc_sk: $.data.id }
            - call: "POST /accounts/${acc_sk}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_sk}"
            - call: "POST /accounts/${acc_sk}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_sk}", asset: "ETH", amount: 100, unit_cost_usd: 1800 }
              as: Operator
              captures: { dep_sk: $.data.id }
            - call: "POST /deposits/${dep_sk}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "POST /staking-positions"
              payload: { account_id: "${acc_sk}", asset: "ETH", principal_amount: 100, apr_bps: 500 }
              as: Trader
              as_user_id: "${acc_sk}"
              captures: { pos_sk: $.data.id }
          trigger:
            - call: "POST /staking-positions/${pos_sk}/claim"
              payload: {}
              as: Trader
              as_user_id: "${acc_sk}"
          assert:
            - "Response status 409 and data.error_id == ERR_NOTHING_TO_CLAIM (elapsed 0 => accrued_rewards == 0 at the exact stake instant)"

      - name: deposit_confirmations_exact_required_credits
        grounds:
          - validations[priority=5]
          - state_machines.Deposit.CONFIRMING_to_CREDITED
          - entities.AssetConfig.fields.required_confirmations
          - entities.Balance.fields.available_amount
        distinguishing_aspect: |
          With required_confirmations == 3, a deposit at confirmations == 2 stays CONFIRMING
          (held, not available); reaching exactly 3 (>=) flips it CREDITED and moves funds to
          available. Boundary is the confirmations >= required edge on POST
          /deposits/{id}/confirmations — a different metric/endpoint than the staking-zero edge.
        test_recipe:
          setup:
            - "BTC asset with required_confirmations == 3; one DETECTED->CONFIRMING deposit at 2 confirmations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 3, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "cf1@x.com", full_name: "CF1", residence_country: "US" }
              as: Anonymous
              captures: { acc_cf: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acc_cf}", asset: "BTC", amount: 0.5, unit_cost_usd: 39000 }
              as: Operator
              captures: { dep_cf: $.data.id }
            - call: "POST /deposits/${dep_cf}/confirmations"
              payload: { delta: 2 }
              as: Operator
          trigger:
            - call: "GET /deposits/${dep_cf}"
              payload: {}
              as: Operator
            - call: "POST /deposits/${dep_cf}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "GET /balances"
              payload: { account_id: "${acc_cf}", asset: "BTC" }
              as: Operator
          assert:
            - "At 2 confirmations: Deposit ${dep_cf}.status == CONFIRMING and BTC available_amount == 0, held_amount == 0.5"
            - "At exactly 3 (>= required): Deposit ${dep_cf}.status == CREDITED and BTC available_amount == 0.5, held_amount == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: withdrawal_requires_address_active
        grounds:
          - validations[priority=7]
          - state_machines.WithdrawalAddress.PENDING_HOLD_to_ACTIVE
          - entities.WithdrawalAddress.fields.status
          - errors[ERR_ADDRESS_NOT_ACTIVE]
        distinguishing_aspect: |
          A Withdrawal can be SUBMITTED only if its target WithdrawalAddress is ACTIVE (and past
          its 24h hold); against a still-PENDING_HOLD address the submit fails with
          ERR_ADDRESS_NOT_ACTIVE. Cross-entity pair: Withdrawal -> WithdrawalAddress.
        test_recipe:
