# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Property Tax Assessment & Appeal — EXPERT
# Breadth probe across the claim-extraction-guide's nine sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_parcel_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Parcel, endpoints]
        distinguishing_aspect: "POST /parcels with owner_id, apn, situs_address returns 201 and a Parcel with system id, status ACTIVE, last_certified_capped_base 0."
        test_recipe:
          setup: ["An Owner O exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "P Owner", email: "pc@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-C1", situs_address: "1 Cre", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
          assert:
            - "Parcel.${parcel_id}.status == ACTIVE"
            - "Parcel.${parcel_id}.last_certified_capped_base == 0"
            - "response code == 201; data.id is a UUID"

      - name: get_parcel_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Parcel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /parcels/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No parcel with the probed id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_tax_roll_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.TaxRoll, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tax-rolls omitting required mill_rate returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: owner_default_is_veteran_false
        claim_type: Defaults
        grounds: [entities.Owner.fields.is_veteran]
        distinguishing_aspect: "POST /owners omitting is_veteran defaults it to false; disability_pct defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "Def Owner", email: "dof@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
          assert:
            - "Owner.${owner_id}.is_veteran == false"
            - "Owner.${owner_id}.disability_pct == 0"

      - name: assessment_system_fields_ignore_client_input
        claim_type: System Fields
        grounds: [entities.Assessment.fields.status, entities.Assessment.fields.assessed_value]
        distinguishing_aspect: "On POST /assessments the status is system-set to DRAFT and assessed_value is computed; client cannot set them (not in input)."
        test_recipe:
          setup: ["Owner, OPEN roll, ACTIVE parcel exist."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Sys Owner", email: "sys@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-SYS", situs_address: "2 Sys", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
          assert:
            - "Assessment.${asmt_id}.status == DRAFT"
            - "Assessment.${asmt_id}.assessed_value == 90000 (market_rebase since prior_base 0)"
            - "Assessment.${asmt_id}.version == 1"

      - name: create_assessment_bad_enum_reassessment_event_rejected
        claim_type: Type Constraints
        grounds: [entities.Assessment.fields.reassessment_event, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /assessments with reassessment_event='REMODEL' (not in NONE|SALE|NEW_CONSTRUCTION) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Owner, OPEN roll, ACTIVE parcel exist."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "En Owner", email: "en@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-EN", situs_address: "3 En", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "REMODEL" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: deferral_payment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DeferralPayment]
        distinguishing_aspect: "DeferralPayment has common_fields:false — its create response carries id and created_at but no version (no update endpoint exists)."
        test_recipe:
          setup: ["ACTIVE deferral D with outstanding 210000 (principal 200000 + accrued 10000)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Imm Owner", email: "imm@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-IMM", situs_address: "4 Imm", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 200000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/issue-bill"
              payload: {}
              as: Assessor
              captures: { bill_id: $.data.id }
            - call: "POST /deferrals"
              payload: { parcel_id: "${parcel_id}", owner_id: "${owner_id}", annual_interest_rate: 0.05 }
              as: Assessor
              captures: { def_id: $.data.id }
            - call: "POST /deferrals/${def_id}/enroll-bill"
              payload: { tax_bill_id: "${bill_id}" }
              as: Assessor
            - call: "POST /deferrals/${def_id}/accrue-interest"
              payload: {}
              as: Assessor
              captures: { def_v2: $.data.version }
          trigger:
            - call: "POST /deferrals/${def_id}/payments"
              payload: { amount_cents: 5000, expected_deferral_version: "${def_v2}" }
              as: Assessor
              captures: { pay_id: $.data.id }
          assert:
            - "DeferralPayment.${pay_id} response has created_at and no version field"
            - "DeferralPayment.${pay_id}.applied_to_interest_cents == 5000"

      - name: parent_relationship_assessment_wrong_parcel_not_found
        claim_type: Parent Relationships
        grounds: [entities.Assessment.fields.parcel_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /assessments with a non-existent parcel_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An OPEN roll exists; no parcel with the probed id."]
          setup_api_calls:
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "00000000-0000-4000-8000-000000000009", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "NONE" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: notice_already_noticed_assessment_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Assessment.DRAFT_to_NOTICED]
        distinguishing_aspect: "Noticing an assessment already in NOTICED (not DRAFT) returns ERR_INVALID_STATE (409); no recompute fires."
        test_recipe:
          setup: ["Assessment A in NOTICED state."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "St Owner", email: "st@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-ST", situs_address: "5 St", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: finalize_terminal_assessment_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Assessment.NOTICED_to_FINAL]
        distinguishing_aspect: "A FINAL assessment is terminal: a second finalize returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Assessment A in FINAL state (no exemptions, no appeal)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Tm Owner", email: "tm@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-TM", situs_address: "6 Tm", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Assessment.${asmt_id}.status == FINAL"

      - name: new_assessment_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.Assessment, entities.Assessment.fields.status]
        distinguishing_aspect: "A freshly created Assessment is in initial_state DRAFT."
        test_recipe:
          setup: ["Owner, OPEN roll, ACTIVE parcel."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "In Owner", email: "in@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-IN", situs_address: "7 In", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 90000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
          assert:
            - "Assessment.${asmt_id}.status == DRAFT"

      - name: certify_roll_copies_capped_base_to_parcel
        claim_type: Side Effect Execution
        grounds: [state_machines.TaxRoll.OPEN_to_CERTIFIED, entities.Parcel.fields.last_certified_capped_base]
        distinguishing_aspect: "Certifying a roll copies each assessment.capped_base_value (102000? no — first roll rebases to market 100000) into Parcel.last_certified_capped_base."
        test_recipe:
          setup: ["OPEN roll R with one FINAL assessment A (market_rebase 100000) on parcel P."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Cf Owner", email: "cf@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-CF", situs_address: "8 Cf", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /tax-rolls/${roll_id}/certify"
              payload: {}
              as: Assessor
          assert:
            - "TaxRoll.${roll_id}.status == CERTIFIED"
            - "Parcel.${parcel_id}.last_certified_capped_base == 100000"

      - name: open_roll_prior_not_certified_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TaxRoll.DRAFT_to_OPEN, "errors[ERR_PRIOR_ROLL_NOT_CERTIFIED]"]
        distinguishing_aspect: "Opening a roll whose prior_roll_id points to a DRAFT (not CERTIFIED) roll returns ERR_PRIOR_ROLL_NOT_CERTIFIED (409)."
        test_recipe:
          setup: ["A DRAFT roll R1 (never certified) and a DRAFT roll R2 with prior_roll_id=R1."]
          setup_api_calls:
            - call: "POST /tax-rolls"
              payload: { tax_year: 2025, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll1_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02, prior_roll_id: "${roll1_id}" }
              as: Assessor
              captures: { roll2_id: $.data.id }
          trigger:
            - call: "POST /tax-rolls/${roll2_id}/open"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRIOR_ROLL_NOT_CERTIFIED (409)"

      - name: notice_with_pending_exemption_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Assessment.DRAFT_to_NOTICED, "errors[ERR_EXEMPTIONS_PENDING]"]
        distinguishing_aspect: "Noticing a DRAFT assessment that still has a CLAIMED (not yet adjudicated) exemption returns ERR_EXEMPTIONS_PENDING (409)."
        test_recipe:
          setup: ["DRAFT assessment A with a CLAIMED HOMESTEAD exemption."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Pe Owner", email: "pe@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-PE", situs_address: "9 Pe", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /exemptions"
              payload: { assessment_id: "${asmt_id}", exemption_type: "HOMESTEAD" }
              as: Assessor
              captures: { exm_id: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EXEMPTIONS_PENDING (409)"

      - name: appeal_settle_assessment_bubbles_under_appeal_to_noticed
        claim_type: Side Effect Execution
        grounds: [state_machines.Appeal.UNDER_REVIEW_to_SETTLED, state_machines.Assessment.UNDER_APPEAL_to_NOTICED]
        distinguishing_aspect: "Settling an appeal at 90000 (within [requested 80000, taxable 100000]) sets assessment.appealed_value=90000 and final_taxable_value=90000, returning the assessment to NOTICED."
        test_recipe:
          setup: ["Appeal in UNDER_REVIEW, requested 80000, parent assessment taxable_value 100000."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Se Owner", email: "se@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-SE", situs_address: "10 Se", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              captures: { asmt_v1: $.data.version }
            - call: "POST /appeals"
              payload: { assessment_id: "${asmt_id}", filed_by_owner_id: "${owner_id}", requested_taxable_value: 80000, expected_assessment_version: "${asmt_v1}" }
              as: Taxpayer
              as_user_id: "${owner_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/accept"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-SE"
          trigger:
            - call: "POST /appeals/${appeal_id}/settle"
              payload: { settled_value: 90000 }
              as: HearingOfficer
              as_user_id: "ho-SE"
          assert:
            - "Appeal.${appeal_id}.status == SETTLED; determined_taxable_value == 90000"
            - "Assessment.${asmt_id}.appealed_value == 90000; final_taxable_value == 90000; status == NOTICED"

      - name: cancel_scheduled_hearing_frees_slot
        claim_type: Conditional cascade
        grounds: [state_machines.Hearing.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED hearing frees the panel slot so a previously-conflicting slot can be scheduled."
        test_recipe:
          setup: ["Panel with SCHEDULED hearing 10:00-11:00 for appeal-1 (UNDER_REVIEW)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Hc Owner", email: "hc@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-HC", situs_address: "11 Hc", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "SALE" }
              as: Assessor
