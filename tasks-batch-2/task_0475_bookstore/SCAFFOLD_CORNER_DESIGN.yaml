  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_reserve_correct_version_succeeds_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-stale-order]", "state_machines.SalesOrder.OPEN_to_RESERVED", "entities.SalesOrder.fields.version"]
        distinguishing_aspect: "Reserve with the live expected_sales_order_version succeeds and bumps SalesOrder.version by 1."
        test_recipe:
          setup: ["Member M, Title T (1 AVAILABLE), Order O line q1 (OPEN)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "occ@x.com", full_name: "OCC" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000199990", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 1 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /sales-orders/${o_id}"
              payload: {}
              as: Bookseller
              captures: { v_cur: $.data.version }
          trigger:
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v_cur}" }
              as: Bookseller
              captures: { v_after: $.data.version }
          assert:
            - "SalesOrder.${o_id}.fulfillment_status == RESERVED"
            - "SalesOrder.${o_id}.version == ${v_cur} + 1"

      - name: occ_submit_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[submit-stale-return]", "state_machines.PublisherReturn.DRAFT_to_SUBMITTED", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Submitting a PublisherReturn with an expected_publisher_return_version one less than live (stale) returns ERR_STALE_VERSION (412) and reserves nothing."
        test_recipe:
          setup: ["Returnable Title T (5 AVAILABLE), DRAFT return R q1; client holds rv0 then R.version advances via a credit-bumping no-op? Use the version captured at create, then bump by submitting+rejecting once to advance version, leaving DRAFT again."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9780000200001", name: "T", list_price_cents: 1000, returnable: true }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 5 }
              as: InventoryManager
            - call: "POST /publisher-returns"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: InventoryManager
              captures: { r_id: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /publisher-returns/${r_id}/submit"
              payload: { expected_publisher_return_version: "${rv0} - 1" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

