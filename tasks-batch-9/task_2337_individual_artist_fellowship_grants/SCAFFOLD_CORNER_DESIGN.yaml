            - "The second call returns 200 with status \"BOARD_STRUCK\", struck_reason_code \"BUDGET_CONSTRAINT\" and board_action_by \"board-1\" — the version from before the refusal is still current"
            - "The award list shows total_count == 0"
            - "The application reads status \"NOT_RECOMMENDED\" with notified_at \"2026-10-16T00:00:00.000Z\", and the cycle's funded_total_cents is still 0"

