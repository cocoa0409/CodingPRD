  - section: cross-cutting complexity layers
    instances:
      - name: stale_rate_center_version_on_allocation_request_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-request-create-stale-rate-center]", "errors[ERR_STALE_RATE_CENTER_VERSION]", "validations[priority=8]", "endpoints[POST /numbering/allocation-requests]"]
        distinguishing_aspect: "The OCC guard on the allocation-request write, exercised with a version that went stale through a completely unrelated administrative action (BEGIN_POOLING) rather than through a competing allocation request - and asserted to fire at priority 8, ahead of the utilization-filing gate at priority 29 that this GROWTH request would otherwise trip, so the 412 cannot be confused with a 422."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS exists with no blocks and no utilization filing at all. The rate center's version is captured, then BEGIN_POOLING advances it by one, leaving the captured value one behind."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { rc_v: "$.data.version" }
            - call: "POST /numbering/rate-centers/${rc_id}/pooling-transitions"
              payload: { action: "BEGIN_POOLING" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "growth on a rate center that moved under us", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412, response_type == \"error\", data.error_id == \"ERR_STALE_RATE_CENTER_VERSION\""
            - "not ERR_UTILIZATION_FILING_REQUIRED - the carrier has filed nothing for COLUMBUS, but priority 8 runs ahead of priority 29"
            - "GET /numbering/rate-centers/${rc_id} reads pending_request_count == 0 - the refused write left no request behind"
            - "GET /numbering/allocation-requests reads total_count == 0"

      - name: fresh_rate_center_version_is_accepted_then_immediately_goes_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-request-create-stale-rate-center]", "endpoints[POST /numbering/allocation-requests]", "errors[ERR_STALE_RATE_CENTER_VERSION]", "entities.RateCenter.fields.pending_request_count"]
        distinguishing_aspect: "The positive half of the same OCC guard plus the self-invalidation property that the negative instance cannot show: the accepted write itself bumps RateCenter.version (through pending_request_count), so replaying the very same expected_rate_center_version one call later must now fail. An implementation that stores the version but forgets to increment it on request creation passes the stale test and fails this one."
        test_recipe:
          setup: ["Carrier A licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS holds two unassigned blocks 614-554-0 and 614-554-1. Carrier A has submitted a 2026-H1 utilization filing claiming 65.00 utilization, so a GROWTH request is admissible. The rate center version is read after that submission."]
