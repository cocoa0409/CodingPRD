          assert:
            - "captured first == 'pg2'"
            - "captured second == 'pg3' (envelope carries total_count=3, has_more=false at the response_envelope level)"

      - name: derived_field_reconciliation_on_hand_after_line_delete
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.sku_on_hand_recompute"
          - "entities.SKU.fields.on_hand_cached"
        distinguishing_aspect: "Deleting a line from DRAFT order does NOT restore lot qty (since not yet submitted); on_hand_cached unchanged."
        test_recipe:
          setup: ["SKU qty=10; DRAFT order with line qty=3 (not submitted)"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
