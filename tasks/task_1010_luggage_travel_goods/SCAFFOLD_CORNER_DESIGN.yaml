          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-30", name: "RbacB", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner24@x.com", full_name: "Corner TwentyFour" }
