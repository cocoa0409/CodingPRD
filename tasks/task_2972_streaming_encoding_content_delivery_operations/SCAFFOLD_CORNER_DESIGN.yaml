            - "after the first attempt: DrmPackage.${pk_id}.state == STALE and Title.${t_id}.packaging_state == STALE"
            - "second repackage: HTTP status == 200 and DrmPackage.${pk_id}.state == PACKAGED"
            - "second repackage: DrmPackage.${pk_id}.ladder_id == ${l_two} and stale_reason == NONE and hdcp_floor == NONE"
            - "second repackage: Title.${t_id}.packaging_state == PACKAGED"

      - name: response_envelope_shape_on_object_list_and_error
        claim_type: standard_crud
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_fields
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp: a single read is response_type \"object\", a collection read is response_type \"array\" with page/page_size/total_count/has_more, and a 404 is response_type \"error\" whose data holds only error_id and message."
        test_recipe:
          setup:
            - "One Title so that both a single read and a list read return content."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-ENVELOPE", title_name: "Envelope Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
            - call: "GET /titles"
              payload: {}
              as: ContentOps
            - call: "GET /titles/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ContentOps
          assert:
            - "single read: HTTP status == 200 and response_type == object and meta.api_request_id is present and meta.api_request_timestamp is present"
            - "list read: HTTP status == 200 and response_type == array and page == 1 and page_size == 20 and total_count == 1 and has_more == false"
            - "error read: HTTP status == 404 and response_type == error"
            - "error read: data.error_id == ERR_TITLE_NOT_FOUND and data.message is a non-empty string"

  # ===========================================================================
  # SECTION 6 — From Table 6 (Errors)
  # Table 6 states a single obligation ("verify every error code is
  # triggerable") and therefore contributes exactly one claim_type: triggerable.
  #
  # Coverage bookkeeping for the 58 codes of §1.6. Codes already triggered by an
  # instance in ANOTHER §1.9 section are not repeated here; the covering
  # instance is named so an auditor can walk the whole catalog:
  #   ERR_UNAUTHENTICATED          -> validations / auth_check_beats_payload_schema_returns_unauthenticated
  #   ERR_ROLE_NOT_PERMITTED       -> validations / role_check_beats_path_existence_returns_forbidden
  #   ERR_INVALID_REQUEST          -> validations / payload_schema_beats_body_fk_lookup_returns_invalid_request
  #   ERR_TITLE_NOT_FOUND          -> endpoints / response_envelope_shape_on_object_list_and_error
  #   ERR_LADDER_NOT_BINDABLE      -> validations / body_fk_lookup_beats_ladder_bindability_returns_not_found
  #   ERR_STALE_TITLE_VERSION      -> cross_cutting_complexity_layers / stale_expected_title_version_*
  #   ERR_RUNG_SHAPE_INVALID       -> validations / stale_title_version_beats_rung_shape_check
  #   ERR_NO_PASSED_ASSET          -> validations / own_state_gate_beats_cross_entity_guard_on_lock
  #   ERR_METRIC_WINDOW_IN_FUTURE  -> validations / metric_window_ending_at_the_clock_accepted_and_one_second_later_rejected
  #   ERR_REPROCESS_NO_SOURCE_ASSET-> validations / reprocess_source_checks_cascade_from_asset_pool_to_ladder_state
  #   ERR_LADDER_NOT_LOCKED        -> validations / reprocess_source_checks_cascade_… and endpoints / stale_package_repackage_without_a_rebind_is_rejected
  #   ERR_LADDER_TITLE_MISMATCH    -> validations / package_bound_to_another_titles_ladder_is_rejected
  #   ERR_OFFLINE_NOT_LICENSED     -> validations / offline_rule_on_a_non_persistent_package_is_rejected
  #   ERR_ENCODE_BUDGET_EXCEEDED   -> validations / encode_budget_debit_rejected_one_cent_short_then_accepted_at_equality
  #   ERR_CONCURRENCY_LIMIT_EXCEEDED-> calculations / requested_streams_at_the_limit_is_allowed_and_one_more_is_rejected
  #   ERR_NO_PACKAGED_DRM          -> calculations / entitlement_rules_on_a_pending_package_never_participate
  #   ERR_VENDOR_IDENTITY_UNKNOWN  -> rbac / vendor_operator_with_an_unknown_identity_is_forbidden
  #   ERR_VENDOR_SCOPE_VIOLATION   -> rbac / vendor_operator_cannot_read_another_vendors_row_or_unfiltered_lists
  # Eight further codes are owned by §1.8 and appear below as excluded_because
  # stubs. Everything else gets a real instance in this section.
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_path_id_returns_not_found_for_every_entity_family
        claim_type: triggerable
        grounds:
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_PACKAGE_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_JOB_NOT_FOUND]
          - errors[ERR_METRIC_WINDOW_NOT_FOUND]
          - errors[ERR_LADDER_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns a distinct 404 code, so a well-formed but unknown path id on nine different resources returns nine different error_ids rather than one generic not-found — including AvailabilityWindow, whose only path-addressed operation is the cancel action."
        test_recipe:
          setup:
            - "Empty database; every id below is a syntactically valid UUID that was never issued."
          setup_api_calls: []
          trigger:
            - call: "GET /mezzanine-assets/aaaaaaaa-0000-4000-8000-000000000001"
              payload: {}
              as: ContentOps
            - call: "GET /encoding-ladders/aaaaaaaa-0000-4000-8000-000000000002"
              payload: {}
              as: EncodingEngineer
            - call: "GET /drm-packages/aaaaaaaa-0000-4000-8000-000000000003"
              payload: {}
              as: DrmOperator
            - call: "GET /cdn-vendors/aaaaaaaa-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
            - call: "GET /routing-policies/aaaaaaaa-0000-4000-8000-000000000005"
              payload: {}
              as: DeliveryEngineer
            - call: "GET /live-reservations/aaaaaaaa-0000-4000-8000-000000000006"
              payload: {}
              as: DeliveryEngineer
            - call: "GET /reprocess-jobs/aaaaaaaa-0000-4000-8000-000000000007"
              payload: {}
              as: EncodingEngineer
            - call: "GET /playback-metrics/aaaaaaaa-0000-4000-8000-000000000008"
              payload: {}
              as: DeliveryEngineer
            - call: "POST /availability-windows/aaaaaaaa-0000-4000-8000-000000000009/cancel"
              payload: {}
              as: ContentOps
          assert:
            - "every call returns HTTP status 404 with response_type == error"
            - "asset read: error_id == ERR_ASSET_NOT_FOUND"
            - "ladder read: error_id == ERR_LADDER_NOT_FOUND"
            - "package read: error_id == ERR_PACKAGE_NOT_FOUND"
            - "vendor read: error_id == ERR_VENDOR_NOT_FOUND"
            - "policy read: error_id == ERR_POLICY_NOT_FOUND"
            - "reservation read: error_id == ERR_RESERVATION_NOT_FOUND"
            - "job read: error_id == ERR_JOB_NOT_FOUND"
            - "metric read: error_id == ERR_METRIC_WINDOW_NOT_FOUND"
            - "window cancel: error_id == ERR_WINDOW_NOT_FOUND"

      - name: unknown_body_foreign_key_returns_not_found_naming_the_missing_parent
        claim_type: triggerable
        grounds:
          - errors[ERR_DEVICE_PROFILE_NOT_FOUND]
          - errors[ERR_TITLE_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "The priority-6 body-FK check reports the specific parent that is missing: with only one bad FK per call, POST /playback-metrics returns ERR_DEVICE_PROFILE_NOT_FOUND for an unknown device_profile_id and ERR_VENDOR_NOT_FOUND for an unknown vendor_id, while POST /mezzanine-assets returns ERR_TITLE_NOT_FOUND."
        test_recipe:
          setup:
            - "One Title, one ACTIVE DeviceProfile and one US-serving CdnVendor, so that in each trigger exactly one foreign key is unresolvable."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-BODY-FK", title_name: "Body FK Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "FKCDN", regions: ["US"], committed_gbps: 50.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets"
              payload: { title_id: "bbbbbbbb-0000-4000-8000-000000000001", source_uri: "s3://mez/ghost.mxf", duration_seconds: 600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, audio_language: "en" }
              as: ContentOps
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "bbbbbbbb-0000-4000-8000-000000000002", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-07-01T01:00:00Z", play_attempts: 100, rebuffer_events: 1, startup_ms_p95: 1500, error_count: 0 }
              as: DeliveryEngineer
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "bbbbbbbb-0000-4000-8000-000000000003", region_code: "US", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-07-01T01:00:00Z", play_attempts: 100, rebuffer_events: 1, startup_ms_p95: 1500, error_count: 0 }
              as: DeliveryEngineer
          assert:
            - "asset create: HTTP status == 404 and error_id == ERR_TITLE_NOT_FOUND"
            - "first metric ingest: HTTP status == 404 and error_id == ERR_DEVICE_PROFILE_NOT_FOUND"
            - "second metric ingest: HTTP status == 404 and error_id == ERR_VENDOR_NOT_FOUND"
            - "no PlaybackMetricWindow and no MezzanineAsset was persisted by any of the three calls"
            - "CdnVendor.${v_id}.health_score_rolling == 100.00 and breach_window_count == 0"

      - name: duplicate_natural_keys_are_rejected_including_a_retired_device_class
        claim_type: triggerable
        grounds:
          - errors[ERR_DUPLICATE_EXTERNAL_REF]
          - errors[ERR_DUPLICATE_VENDOR_CODE]
          - errors[ERR_DUPLICATE_DEVICE_CLASS]
        distinguishing_aspect: "The three uniqueness codes are distinct, and device_class uniqueness spans RETIRED rows: a RETIRED SET_TOP_LEGACY profile — which the compatibility matrix ignores entirely — still blocks the creation of an ACTIVE profile for that class."
        test_recipe:
          setup:
            - "One Title, one CdnVendor and one deliberately RETIRED DeviceProfile."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-UNIQUE-01", title_name: "Unique Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "UNIQCDN", regions: ["US"], committed_gbps: 50.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 720, supported_codecs: ["H264"], min_bitrate_kbps: 300, max_bitrate_kbps: 4000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 5.00, quality_normalization_factor: 0.70, state: "RETIRED" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /titles"
              payload: { external_ref: "TTL-UNIQUE-01", title_name: "Unique Cut Again", content_type: "EPISODE", studio_code: "LUMEN" }
              as: ContentOps
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "UNIQCDN", regions: ["CA"], committed_gbps: 10.00, cost_per_gb_usd: 0.0500 }
              as: PlatformAdmin
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 500, max_bitrate_kbps: 9000, hdcp_required: true, required_drm_system: "WIDEVINE", market_share_pct: 8.00, quality_normalization_factor: 0.80 }
              as: PlatformAdmin
          assert:
            - "title create: HTTP status == 409 and error_id == ERR_DUPLICATE_EXTERNAL_REF"
            - "vendor create: HTTP status == 409 and error_id == ERR_DUPLICATE_VENDOR_CODE"
            - "device create: HTTP status == 409 and error_id == ERR_DUPLICATE_DEVICE_CLASS"
            - "exactly 1 Title, 1 CdnVendor and 1 DeviceProfile exist afterwards"
            - "DeviceProfile.${d_id}.state == RETIRED and CdnVendor.${v_id}.vendor_code == UNIQCDN"

      - name: window_bounds_past_start_and_legal_takedown_are_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_WINDOW_BOUNDS_INVALID]
          - errors[ERR_WINDOW_IN_PAST]
          - errors[ERR_TITLE_LEGALLY_BLOCKED]
          - endpoints.POST_/titles/{id}/takedown
        distinguishing_aspect: "Window creation has three independent rejections: a zero-length interval (start equal to end) is ERR_WINDOW_BOUNDS_INVALID, an interval starting before the logical clock is ERR_WINDOW_IN_PAST, and a perfectly valid future interval is still ERR_TITLE_LEGALLY_BLOCKED once the Title carries a MANUAL_LEGAL takedown."
        test_recipe:
          setup:
            - "One Title, clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-WIN-REJECT", title_name: "Window Reject Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-07-15T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "POST /titles/${t_id}/takedown"
              payload: { takedown_reason: "MANUAL_LEGAL" }
              as: ContentOps
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
          assert:
            - "zero-length interval: HTTP status == 422 and error_id == ERR_WINDOW_BOUNDS_INVALID"
            - "past interval: HTTP status == 422 and error_id == ERR_WINDOW_IN_PAST"
            - "takedown: HTTP status == 200 and Title.${t_id}.availability_state == TAKEN_DOWN and takedown_reason == MANUAL_LEGAL"
            - "post-takedown window create: HTTP status == 409 and error_id == ERR_TITLE_LEGALLY_BLOCKED"
            - "GET /titles/${t_id}/availability-windows returns exactly 0 windows"

      - name: repeat_terminal_actions_on_window_and_package_are_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_WINDOW_STATE_INVALID]
          - errors[ERR_PACKAGE_STATE_INVALID]
          - state_machines.AvailabilityWindow.terminal_states
          - state_machines.DrmPackage.terminal_states
        distinguishing_aspect: "Both terminal states are truly locked down and each reports its own code: cancelling an already CANCELLED window is ERR_WINDOW_STATE_INVALID, revoking an already REVOKED package is ERR_PACKAGE_STATE_INVALID, and the first revoke drops packaging_state back to UNPACKAGED because a REVOKED package is invisible to the derivation."
        test_recipe:
          setup:
            - "One Title with one SCHEDULED window and one PENDING DrmPackage bound to a DRAFT ladder."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-TERMINAL", title_name: "Terminal Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
              captures: { w_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
