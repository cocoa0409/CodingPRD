      - name: endorsement_score_weights_the_stakeholder_groups
        claim_type: weighted_scoring
        grounds:
          - calculations.trial_endorsement_score
        excluded_because:
          difficulty_instance: boundary_precision_check / trial_final_score_exactly_at_endorsement_threshold_endorses
          rationale: "The weighted average, the quorum-group count and the endorsement outcome are all asserted as literals there."
      - name: member_price_walks_the_tier_bands
        claim_type: tiered_pricing
        grounds:
          - calculations.member_tier_price_cents
          - entities.Product.fields.tier_bands
        excluded_because:
          difficulty_instance: combinatorial_formula / member_price_nested_clamp_selects_ceiling_for_one_member_and_floor_for_another
          rationale: "Band selection together with both clamp arms is asserted there across two differently sized members."
      - name: invoice_allocation_fills_lines_then_the_residual
        claim_type: waterfall_allocation
        grounds:
          - calculations.consortium_invoice_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_allocation_rounds_each_line_then_assigns_residual_by_member_created_at
          rationale: "Per-line rounding, the residual and its created_at tie-break are asserted there."
      - name: renewal_offer_propagates_cap_then_credits
        claim_type: constraint_propagation
        grounds:
          - calculations.renewal_offer_price
        excluded_because:
          difficulty_instance: combinatorial_formula / renewal_offer_band_keyed_on_prior_term_price_not_on_the_offer_being_computed
          rationale: "The full nine-step propagation, including which price the band is keyed on, is asserted there."
      - name: cost_per_use_aggregates_the_window
        claim_type: aggregation
        grounds:
          - calculations.cost_per_use_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / cost_per_use_with_zero_usage_in_window_returns_null_and_no_use_band
          rationale: "The window filter and the empty-aggregate edge are asserted there."
      - name: access_health_score_decays_and_recovers
        claim_type: decay_function
        grounds:
          - calculations.access_health_score
        excluded_because:
          difficulty_instance: boundary_precision_check / access_health_score_exactly_at_degrade_threshold_restores_configured
          rationale: "The penalty accumulation and the recovery boundary are asserted there."
      - name: endorsement_score_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.trial_endorsement_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / trial_provisional_and_final_scores_diverge_on_post_close_feedback
          rationale: "Both variants are computed on the same trial and the delta is asserted there."
      - name: commitment_price_variant_selected_by_context
        claim_type: variant_selection
        grounds:
          - calculations.member_tier_price_cents.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / commitment_projected_price_diverges_from_settled_price_at_signing
          rationale: "committed_projection at pledge time and settled_invoice at signing time are both asserted there."
      - name: settled_price_reconciles_into_the_member_ledger
        claim_type: reconciliation
        grounds:
          - calculations.member_tier_price_cents.variants
          - entities.Member.fields.annual_committed_cents
        excluded_because:
          difficulty_instance: transitive_cascade / signing_cascade_confirms_pledge_then_overcommits_member_then_withdraws_draft_trial
          rationale: "The projected-to-settled delta landing in the member ledger is asserted as hop 3 of that cascade."
