          One APPROVE request violates BOTH the `business_safety` rule at priority
          19 (benchmark_percentile 90.03 exceeds FMV_SAFE_HARBOR_PERCENTILE with
          fmv_justification_on_file false) and the `business_temporal` rule at
          priority 30 (the pinned FMV opinion expired on 2027-08-01 while the clock
          reads 2027-08-02). The safety error must win — the pairing is
          business_safety/business_temporal, not the state/business_fiscal pairing
          of the other instance.
        test_recipe:
