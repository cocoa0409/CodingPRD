  - rule_id: combinatorial_formula
    instances:

      - name: quote_pricing_five_factor_combination
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.monthly_recurring_cents
          - entities.Jobsite.fields.site_condition
          - state_machines.Quote.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          monthly_recurring_cents 47171 for the 500 ft MESH_70 CONSTRUCTION term-12
          quote is only reachable by combining all five factors in the declared
          order: linear-foot tier 54 (flat on total footage), screen factor 1.15,
          per-foot screen adder 12, add-on unit rates for GATE-12 x2 and WB-6 x4,
          then the 0.14 term discount. Holding four factors fixed and changing only
          site_condition SOIL->ASPHALT moves install_labor_cents 62500->85000 while
          leaving monthly_recurring_cents at 47171, and changing only term 12->6
