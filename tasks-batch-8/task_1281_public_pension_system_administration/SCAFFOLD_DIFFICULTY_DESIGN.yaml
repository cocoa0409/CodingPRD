  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: member_death_cascade_terminates_benefit_and_refunds_purchase
        grounds:
          - state_machines.Member.RETIRED_to_DECEASED
          - state_machines.ServicePurchase.PLAN_ACTIVE_to_CANCELLED
          - state_machines.PurchasePayment.APPLIED_to_REFUNDED
          - state_machines.Benefit.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Depth-3 chain: PATCH deceased_at -> Member DECEASED (link 1) ->
          ServicePurchase PLAN_ACTIVE -> CANCELLED (link 2, caused by member
          mutation) -> PurchasePayment APPLIED -> REFUNDED (link 3, caused by
          the purchase cancellation), with the Benefit TERMINATED branch in the
          same hop-2 fan. Companion instance
          line_review_bubble_up_reconciles_variance_report triggers from a line
          review (different trigger).
        test_recipe:
          setup:
            - "Member retired: approved SERVICE benefit (monthly 46,750, ACTIVE); member then made INACTIVE->... no — member is RETIRED with an additional PLAN_ACTIVE purchase is impossible (approve blocks it); instead: member RETIRED via disability, and the purchase was opened and paid (2 installments APPLIED) BEFORE the disability application was approved? Approve cancels purchases. So: purchase opened AFTER disability approval is impossible (member RETIRED blocks purchase create? purchase create requires member ACTIVE? Not declared — purchase create on RETIRED member is allowed by scaffold only if member not DECEASED. Declared constraint: ERR_MEMBER_DECEASED only. So a RETIRED member opens a purchase, gets QUOTED, accepts, pays 2 installments)."
            - "Member status RETIRED (disability approval), one ServicePurchase PLAN_ACTIVE with quoted 2,640,000 (ACTUARIAL: 6,000,000 x 2.0 x 0.22, member age 60 at quote -> 0 years to 60), 12 installments of 220,000 each, payments 1 and 2 APPLIED (440,000 total), payments 3-12 PENDING"
            - "Benefit ACTIVE monthly 275,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
