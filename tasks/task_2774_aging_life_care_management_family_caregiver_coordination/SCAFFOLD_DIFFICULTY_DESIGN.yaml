              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "ACTIVE" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "POST /care/crisis-episodes"
              payload: { client_id: "${cli}", trigger_type: "HOSPITAL_ADMISSION", hospital_name: "Mercy General" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { crisis: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CRISIS_RESPONSE", start_at: "2026-08-05T19:00:00Z", end_at: "2026-08-05T20:35:00Z", service_location_id: "HOSPITAL_A", crisis_episode_id: "${crisis}" }
              as: CareManager
