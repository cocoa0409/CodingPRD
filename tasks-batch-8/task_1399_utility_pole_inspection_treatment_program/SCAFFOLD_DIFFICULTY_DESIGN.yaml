scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: strength_variants_diverge_on_same_readings
        grounds:
          - calculations.remaining_strength_pct
          - calculations.pole_serviceability_classification
          - entities.InspectionTask.fields.rs_conservative_pct
          - entities.InspectionTask.fields.rs_statistical_pct
        distinguishing_aspect: |
          Same four decay readings yield rs_conservative_pct == 54.00 (classification MONITOR)
          and rs_statistical_pct == 73.40 (classification SERVICEABLE) on the Pole/InspectionTask
          domain — a different entity domain than the ContractorCrew quality-score instance.
        test_recipe:
          setup:
            - "Pole P-DV1: SOUTHERN_PINE, class 3, installed 1990-01-01, tag URBAN"
            - "Cycle 2026 CONSERVATIVE policy, sample_pct 0, OPEN at default clock 2026-08-01T00:00:00Z"
            - "Task on the pole with due window [2026-08-10, 2026-08-20]"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DV1", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 1.50
                sound_wood_pct: 80
                decay_pocket_depth_in: 1.2
                moisture_pct: 25
                hazard_flag: false
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g1.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t1.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
              captures: { rs_c: $.data.rs_conservative_pct, rs_s: $.data.rs_statistical_pct, eff: $.data.effective_rs_pct, cls: $.data.classification }
          assert:
            - "InspectionTask.${t_id}.rs_conservative_pct == 54.00"
            - "InspectionTask.${t_id}.rs_statistical_pct == 73.40"
            - "InspectionTask.${t_id}.effective_rs_pct == 54.00 (CONSERVATIVE policy selected)"
            - "InspectionTask.${t_id}.classification == MONITOR"
            - "Pole.${p_id}.current_classification == NONE (submit alone does not touch the pole)"

      - name: crew_quality_rolling_vs_lifetime_diverge
        grounds:
          - calculations.contractor_quality_score
          - entities.ContractorCrew.fields.quality_score_lifetime
          - entities.ContractorCrew.fields.quality_score_rolling
        distinguishing_aspect: |
          Same QA event log (P,P,P,F,P,F) yields quality_score_lifetime == 66.67 over all six
          events but quality_score_rolling == 60.00 over the last five — a dual variant on the
          ContractorCrew domain, distinct from the Pole/InspectionTask strength instance.
        test_recipe:
          setup:
            - "Crew CR-Q with five decided treatment orders: PASS, PASS, PASS, FAIL, PASS (chronological)"
            - "Sixth order APPLIED awaiting its QA decision; rolling after 5 events == 80.00 (still ACTIVE)"
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-Q", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-Q", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o1}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o1}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o1}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o2}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o2}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o2}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o3: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o3}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o3}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o3}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o4: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o4}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o4}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o4}/qa-review"
              payload: { decision: FAIL }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o5: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o5}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o5}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o5}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o6: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o6}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o6}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o6}/qa-review"
              payload: { decision: FAIL }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "GET /pole-program/contractor-crews/${cr_id}"
              payload: {}
              as: ProgramManager
              captures: { lq: $.data.quality_score_lifetime, rq: $.data.quality_score_rolling, st: $.data.status }
          assert:
            - "ContractorCrew.${cr_id}.quality_score_lifetime == 66.67 (4 passes / 6 events)"
            - "ContractorCrew.${cr_id}.quality_score_rolling == 60.00 (last 5 events P,P,F,P,F => 3/5)"
            - "ContractorCrew.${cr_id}.status == SUSPENDED (rolling < 70.00 after a FAIL)"
            - "ContractorCrew.${cr_id}.qa_pass_count == 4 and qa_fail_count == 2"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nonlinear_floor_and_cap
        grounds:
          - calculations.replacement_priority_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — a FEEDER_CRITICAL pole whose raw
          score is 46 (deficiency 46 + no deferral/joint/age terms) is floored to exactly 80 by
          the criticality branch; the assert fails if the floor or the sum->floor->cap order is wrong.
        test_recipe:
          setup:
            - "Pole P-CRIT with gis_tag FEEDER_CRITICAL, install 1990-01-01 (no age term), joint_use false"
            - "Accepted inspection under CONSERVATIVE policy fixing current_remaining_strength_pct == 54.00"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-CRIT", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "FEEDER_CRITICAL", height_ft: 40, joint_use: false }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 1.50
                sound_wood_pct: 80
                decay_pocket_depth_in: 1.2
                moisture_pct: 25
                hazard_flag: false
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: QAReviewer
              as_user_id: "qa-1"
          trigger:
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 150000 }
              as: ProgramManager
              captures: { o_id: $.data.id, score: $.data.priority_score }
          assert:
            - "ReplacementWorkOrder.${o_id}.priority_score == 80 (raw 46 floored by FEEDER_CRITICAL)"
            - "Pole.${p_id}.status == MONITOR and current_remaining_strength_pct == 54.00"

      - name: production_billing_per_line_rounding
        grounds:
          - calculations.production_billing_amount
        distinguishing_aspect: |
          Mode (b): nested rounding order — mobilization is rounded per line (3 x round(40000/3)
          = 39999) before summation, so the pinned per-line order yields 99434 where sum-then-round
          would yield 99435; a one-cent divergence the assert pins to the per-line contract.
        test_recipe:
          setup:
            - "Budget fiscal_year 2026 total 10000000; cycle 2026 OPEN with zero tasks"
            - "Crew CR-B with three VERIFIED orders: (CCA_WRAP x SOUTHERN_PINE), (PENTA_GEL x DOUGLAS_FIR), (COPPER_NAPHTHENATE x WESTERN_RED_CEDAR), all applied at 2026-08-01 (inside season), zero fails, lifetime 100.00"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 10000000 }
              as: ProgramManager
              captures: { b_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-B", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-B1", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-B2", species: DOUGLAS_FIR, original_class: "3", install_date: "1990-01-01", gis_lat: 45.1, gis_lon: -122.1, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-B3", species: WESTERN_RED_CEDAR, original_class: "3", install_date: "1990-01-01", gis_lat: 45.2, gis_lon: -122.2, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p3: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p1}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o1}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o1}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o1}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p2}", product_code: PENTA_GEL, cost_cents: 21000 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o2}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-12", work_end_date: "2026-08-15" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o2}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o2}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p3}", product_code: COPPER_NAPHTHENATE, cost_cents: 14500 }
              as: ProgramManager
              captures: { o3: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o3}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-15", work_end_date: "2026-08-18" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o3}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o3}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
          trigger:
            - call: "POST /pole-program/inspection-cycles/${c_id}/reconcile"
              payload: { budget_id: "${b_id}" }
              as: ProgramManager
            - call: "GET /pole-program/contractor-crews/${cr_id}"
              payload: {}
              as: ProgramManager
              captures: { billing: $.data.current_cycle_billing_cents }
          assert:
            - "ContractorCrew.${cr_id}.current_cycle_billing_cents == 99434"
            - "subtotal components: lines 30833 + 37483 + 26383 == 94699; bonus round_half_up(94699*0.05) == 4735; penalty 0"

      - name: waterfall_pinned_eval_order_exact_fit
        grounds:
          - calculations.budget_waterfall_funding
          - entities.BacklogSnapshot.fields.funded_count
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (the funded set depends on available funds, which
          depends on the funded set) is pinned by snapshotting available first, ranking
          priority_score DESC/created_at ASC, and skipping — not stopping at — the first unaffordable
          order; O2 at exactly the remaining 200000 cents is funded (<= semantics).
        test_recipe:
          setup:
            - "Budget 500000 total; cycle OPEN with zero tasks"
            - "O1 on FEEDER_CRITICAL joint-use pole installed 1965 (priority 80), cost 300000"
            - "O2 on joint-use pole installed 1965 (priority 65), cost 200000"
            - "O3 on plain pole installed 1990 (priority 50), cost 100000"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 500000 }
              as: ProgramManager
              captures: { b_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-W1", species: SOUTHERN_PINE, original_class: "3", install_date: "1965-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "FEEDER_CRITICAL", height_ft: 40, joint_use: true, attachment_count_declared: 1 }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-W2", species: SOUTHERN_PINE, original_class: "3", install_date: "1965-01-01", gis_lat: 45.1, gis_lon: -122.1, gis_tag: "URBAN", height_ft: 40, joint_use: true, attachment_count_declared: 1 }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-W3", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.2, gis_lon: -122.2, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p3: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p1}", estimated_cost_cents: 300000 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p2}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p3}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-cycles/${c_id}/reconcile"
              payload: { budget_id: "${b_id}" }
              as: ProgramManager
            - call: "GET /pole-program/replacement-work-orders/${o1}"
              payload: {}
              as: ProgramManager
              captures: { s1: $.data.status }
            - call: "GET /pole-program/replacement-work-orders/${o2}"
              payload: {}
              as: ProgramManager
              captures: { s2: $.data.status }
            - call: "GET /pole-program/replacement-work-orders/${o3}"
              payload: {}
              as: ProgramManager
              captures: { s3: $.data.status }
            - call: "GET /pole-program/budgets/${b_id}"
              payload: {}
              as: ProgramManager
              captures: { avail: $.data.available_cents, comm: $.data.committed_cents }
            - call: "GET /pole-program/backlog-snapshots"
              payload: { cycle_id: "${c_id}" }
              as: ProgramManager
              captures: { fc: "$.data[0].funded_count", qc: "$.data[0].queued_count", qcost: "$.data[0].queued_escalated_cost_cents" }
          assert:
            - "ReplacementWorkOrder.${o1}.status == FUNDED (priority 80 first)"
            - "ReplacementWorkOrder.${o2}.status == FUNDED (cost 200000 == remaining 200000, inclusive boundary)"
            - "ReplacementWorkOrder.${o3}.status == QUEUED (unaffordable, skipped)"
            - "ProgramBudget.${b_id}.committed_cents == 500000 and available_cents == 0"
            - "BacklogSnapshot funded_count == 2, queued_count == 1, queued_escalated_cost_cents == 100000"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: task_rework_cycle_then_accept
        grounds:
          - state_machines.InspectionTask.SUBMITTED_to_REJECTED
          - state_machines.InspectionTask.REJECTED_to_OPEN
          - state_machines.InspectionTask.OPEN_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on InspectionTask: OPEN -> SUBMITTED -> REJECTED -> (system) OPEN ->
          SUBMITTED -> ACCEPTED; the loop back to OPEN clears the readings and bumps rework_count,
          which a purely linear pipeline cannot express.
        test_recipe:
          setup:
            - "Pole P-RW (SOUTHERN_PINE class 3), cycle CONSERVATIVE OPEN with sample_pct 0, one manual task"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-RW", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.50
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                hazard_flag: false
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: REJECT, notes: "redo boring" }
              as: QAReviewer
              as_user_id: "qa-1"
              captures: { st_after_reject: $.data.status, rc: $.data.rework_count }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.50
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                hazard_flag: false
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g2.jpg", taken_at: "2026-08-12T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t2.jpg", taken_at: "2026-08-12T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "GET /pole-program/poles/${p_id}"
              payload: {}
              as: ProgramManager
              captures: { pcls: $.data.current_classification, pins: $.data.last_inspection_date }
          assert:
            - "after REJECT: InspectionTask.${t_id}.status == OPEN (auto loop) and rework_count == 1"
            - "after REJECT: rs_conservative_pct / rs_statistical_pct / classification reset to null"
            - "second submit succeeds from OPEN (cycle membership and pole unchanged)"
            - "final: InspectionTask.${t_id}.status == ACCEPTED"
            - "Pole.${p_id}.current_classification == SERVICEABLE and last_inspection_date == 2026-08-01T00:00:00Z"

      - name: audit_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.AttachmentAudit.SUBMITTED_to_ADJUDICATED
          - state_machines.AttachmentAudit.NOTIFIED_to_CURED
          - entities.AttachmentAudit.fields.audit_status
          - entities.AttachmentAudit.fields.violation_status
        distinguishing_aspect: |
          Parallel state dimensions on AttachmentAudit: adjudicate advances audit_status
          SUBMITTED -> ADJUDICATED while walking violation_status NONE -> DETECTED -> NOTIFIED;
          mark-cured then moves only violation_status NOTIFIED -> CURED leaving audit_status
          ADJUDICATED untouched — a different entity and shape than the InspectionTask cycle.
        test_recipe:
          setup:
            - "Joint-use pole P-JU with attachment_count_declared 2; cycle OPEN; task submitted with found_attachment_count 5 (audit auto-created, unauthorized_count == 3)"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-JU", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40, joint_use: true, attachment_count_declared: 2 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.50
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                hazard_flag: false
                found_attachment_count: 5
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /pole-program/attachment-audits"
              payload: { inspection_task_id: "${t_id}" }
              as: ProgramManager
              captures: { a_id: "$.data[0].id" }
          trigger:
            - call: "POST /pole-program/attachment-audits/${a_id}/adjudicate"
              payload: {}
              as: ProgramManager
              captures: { av: $.data.violation_status, dl: $.data.cure_deadline, un: $.data.unauthorized_count }
            - call: "POST /pole-program/attachment-audits/${a_id}/mark-cured"
              payload: {}
              as: AttacherRep
              as_user_id: "att-9"
              captures: { av2: $.data.violation_status, as2: $.data.audit_status, cu: $.data.cured_at }
          assert:
            - "after adjudicate: audit_status == ADJUDICATED, violation_status == NOTIFIED, unauthorized_count == 3"
            - "cure_deadline == 2026-09-15T00:00:00Z (adjudicated_at 2026-08-01 + 45 days)"
            - "after mark-cured: violation_status == CURED while audit_status stays ADJUDICATED"
            - "cured_at == 2026-08-01T00:00:00Z (logical clock unchanged)"

      - name: replacement_defer_requeue_cycle
        grounds:
          - state_machines.ReplacementWorkOrder.QUEUED_to_DEFERRED
          - state_machines.ReplacementWorkOrder.DEFERRED_to_QUEUED
          - calculations.escalated_cost
        distinguishing_aspect: |
          Cyclic machine on ReplacementWorkOrder: QUEUED -> DEFERRED -> (reconcile auto-requeue)
          QUEUED with deferral_count retained at 1, escalated_cost_cents recomputed to 216000 and
          priority_score recomputed from 50 to 55 — a third non-linear machine on a third entity.
        test_recipe:
          setup:
            - "Budget 2026 total 100 cents (too small to fund); cycle OPEN with zero tasks; plain pole; manual order cost 200000 (priority 50 from null strength)"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 100 }
              as: ProgramManager
              captures: { b_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DF", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
