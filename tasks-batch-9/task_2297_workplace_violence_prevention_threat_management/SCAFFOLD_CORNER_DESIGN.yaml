            - call: "POST /_ops/daily-run"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_ops/daily-run"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The first ops run returns HTTP 200 with $.data.training_expired_count == 0 and $.data.plans_review_due_count == 0"
            - "After the first ops run TrainingAssignment.${ta1_id}.status is still COMPLETED, Employee.${w1_id}.training_current is still true, PreventionPlan.${plan_id}.status is still ACTIVE and inspection_readiness_score is still 79.90 with inspection_ready true"
            - "The second ops run returns $.data.training_expired_count == 1, $.data.plans_review_due_count == 1 and $.data.plans_rescored_count == 1"
            - "TrainingAssignment.${ta1_id}.status == EXPIRED even though expires_at equals the clock exactly - the comparison is expires_at <= clock"
            - "Employee.${w1_id}.training_current == false and PreventionPlan.${plan_id}.training_compliance_pct == 0.00"
            - "PreventionPlan.${plan_id}.status == REVIEW_DUE with compliance_posture RESTRICTED"
            - "PreventionPlan.${plan_id}.readiness_subtotal == 60.00, readiness_penalty_band == WEAK, readiness_penalty_points == 7.20 and inspection_readiness_score == 52.80 with inspection_ready false"
      - name: one_decide_drives_four_dependent_rows
