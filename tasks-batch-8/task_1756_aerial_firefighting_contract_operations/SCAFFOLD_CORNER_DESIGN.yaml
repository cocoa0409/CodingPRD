            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p2}", planned_start: "2026-08-04T10:00:00Z", planned_end: "2026-08-04T12:00:00Z", expected_dispatch_order_version: "${do_v2}" }, as: CarrierOps, captures: { a2: $.data.id } }
          assert:
            - "create with the stale pre-first-assignment version fails with ERR_STALE_VERSION (412) even though capacity remains (filled_count 1 < 2)"
            - "retry with the freshly observed version succeeds; order reaches FILLED (filled_count == 2)"

      - name: derived_field_season_hours_reconciliation
        claim_type: derived_field_reconciliation
        grounds: ["entities.Contract.fields.season_flight_hours_tenths", "calculations.flight_sortie_billing"]
        distinguishing_aspect: "Derived cross-entity counter: contract.season_flight_hours_tenths equals the sum of flight_hours_tenths over logs of its dispatch orders' assignments — 11 + 7 == 18 after two sorties, refreshed on the same request that writes each log."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft+pilot; order qty 1 ACCEPTED; assignment ON_INCIDENT"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 100.0, hobbs_stop: 101.05 }, as: Pilot, as_user_id: "${p_id}" }
            - { call: "GET /contracts/${c_id}", as: CarrierOps, captures: { h1: $.data.season_flight_hours_tenths } }
            - { call: "POST /assignments/${a_id}/flight-logs", payload: { logged_date: "2026-08-02", hobbs_start: 200.0, hobbs_stop: 200.65 }, as: Pilot, as_user_id: "${p_id}" }
            - { call: "GET /contracts/${c_id}", as: CarrierOps, captures: { h2: $.data.season_flight_hours_tenths } }
          assert:
            - "after the 1.05 h sortie: season_flight_hours_tenths == 11"
            - "after the 0.65 h sortie: season_flight_hours_tenths == 18 (incremental recompute matches full recompute)"

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds: ["state_machines.Aircraft.CARDED_to_SUSPENDED", "state_machines.CrewMember.AVAILABLE_to_FATIGUE_HOLD"]
        excluded_because:
          difficulty_instance: inspection_fail_three_link_cascade
          rationale: "Both cascade chains (inspection depth-3, fatigue depth-4) are asserted link-by-link in §1.8 instances inspection_fail_three_link_cascade and flight_log_fatigue_four_link_cascade."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: ["calculations.reconciliation_billing", "calculations.crew_duty_projection"]
        excluded_because:
          difficulty_instance: invoice_reconciliation_carrier_vs_agency_basis
          rationale: "Both dual-variant pairs are asserted with literal cent/tenth values in §1.8 instances invoice_reconciliation_carrier_vs_agency_basis and crew_duty_projection_vs_chronological_actuals."

  - section: consistency_model
    instances:
      - name: immediate_consistency_write_then_read
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "entities.DispatchOrder.fields.filled_count"]
        distinguishing_aspect: "Immediate consistency: the very next read after a write reflects all side effects — assignment creation is visible in the order's filled_count, and a retardant load completion is visible in the assignment's reload average, with no delay or rebuild step."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft+pilot; order qty 2 ACCEPTED; assignment A1 created; A1 ON_INCIDENT with one load dropped (11:00) and a second load requested"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 2 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/retardant-loads", payload: { gallons: 700, requested_at: "2026-08-02T10:00:00Z" }, as: CarrierOps, captures: { l1: $.data.id } }
            - { call: "POST /retardant-loads/${l1}/load", payload: { loaded_at: "2026-08-02T10:20:00Z" }, as: CarrierOps }
            - { call: "POST /retardant-loads/${l1}/drop", payload: { dropped_at: "2026-08-02T11:00:00Z" }, as: CarrierOps }
            - { call: "POST /assignments/${a_id}/retardant-loads", payload: { gallons: 700, requested_at: "2026-08-02T11:10:00Z" }, as: CarrierOps, captures: { l2: $.data.id } }
          trigger:
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { fc: $.data.filled_count, st: $.data.status } }
            - { call: "POST /retardant-loads/${l2}/load", payload: { loaded_at: "2026-08-02T11:45:00Z" }, as: CarrierOps }
            - { call: "GET /assignments/${a_id}", as: CarrierOps, captures: { avg: $.data.reload_turn_avg_minutes, breach: $.data.reload_sla_breach } }
          assert:
            - "order read immediately after assignment creation: filled_count == 1 and status == PARTIALLY_FILLED"
            - "assignment read immediately after the second load completes: reload_turn_avg_minutes == 45.0 (single turn 45) and reload_sla_breach == true — no stale cache"
