            - call: "POST /grandstand/offers/${of_v7}/counter"
              payload: { proposed_guarantee_cents: 14000000, proposed_backend_split_pct: 0.90, note: "Ask" }
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/offers/${of_v7}"
              payload: {}
              as: TalentBuyer
              captures: { ofv_v7_fresh: "$.data.version" }
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "POST /grandstand/offers/${of_v7}/revise"
              payload: { expected_offer_version: "${ofv_v7_stale}", offered_guarantee_cents: 13000000, backend_split_pct: 0.87, backend_breakeven_cents: 6000000, note: "Meeting in the middle" }
              as: TalentBuyer
              captures: { err_v7a: "$.data.error_id" }
            - call: "GET /grandstand/offers/${of_v7}"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of_v7}/revise"
              payload: { expected_offer_version: "${ofv_v7_fresh}", offered_guarantee_cents: 13000000, backend_split_pct: 0.87, backend_breakeven_cents: 6000000, note: "Retry with the right version" }
              as: TalentBuyer
              captures: { err_v7b: "$.data.error_id" }
            - call: "GET /grandstand/offers/${of_v7}/rounds"
              payload: {}
              as: TalentBuyer
            - call: "GET /grandstand/stages/${st_v7}"
              payload: {}
              as: TalentBuyer
          assert:
            - "The first revise returns HTTP 409 with ${err_v7a} == ERR_OFFER_EXPIRED and ${err_v7a} != ERR_STALE_OFFER_VERSION, even though both preconditions fail: expiry (priority 18) is evaluated before OCC (priority 24)."
            - "The follow-up read shows the offer auto-transitioned to status 'EXPIRED': the refusal still performed the lapse."
            - "The second revise, carrying the CORRECT expected_offer_version, returns HTTP 409 with ${err_v7b} == ERR_INVALID_OFFER_STATE -- the terminal state now outranks everything, which is the cascade's fingerprint."
            - "The rounds list still holds exactly two rows (the BUYER send and the AGENT counter) with total_count == 2: neither refused revise appended a round."
            - "The stage's held_show_count has dropped back to 0 and booking_posture is 'OPEN': expiry releases the hold."

      - name: curfew_is_evaluated_before_stage_slot_conflict
        claim_type: priority_ordering
        grounds:
          - validations.priority_30
          - validations.priority_39
        distinguishing_aspect: "A send that violates the curfew and the buffered stage-slot rule at once must report the curfew code, because public-safety compliance is checked first."
        excluded_because:
          difficulty_instance: curfew_safety_outranks_stage_slot_conflict
          rationale: |
            The §1.8 priority-pair instance already builds one send that violates the
            curfew rule and the buffered stage-slot rule simultaneously, asserts
            ERR_CURFEW_VIOLATION / 422, then repairs only the curfew and shows the
            same request falling through to ERR_STAGE_SLOT_CONFLICT / 409. A §1.9
            ordering recipe would be the same two calls.

      - name: genre_adjacency_is_evaluated_before_talent_budget
        claim_type: priority_conflict
        grounds:
          - validations.priority_41
          - validations.priority_46
        distinguishing_aspect: "A send that trips both genre adjacency and the talent-budget cap must report the adjacency code, because fiscal capacity is checked last."
        excluded_because:
          difficulty_instance: genre_adjacency_constraint_outranks_talent_budget
          rationale: |
            The §1.8 instance already stages a send that trips both the 1-day
            genre-adjacency rule and the talent-budget cap, asserts
            ERR_GENRE_ADJACENCY_CONFLICT / 422 rather than
            ERR_TALENT_BUDGET_EXCEEDED / 422, and then moves the date so the fiscal
            rule surfaces -- the harder direction, since both share the 422 status.

  # ===========================================================================
  # SECTION 5 - From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: sponsor_surface_is_create_and_read_only
        claim_type: standard_crud
        grounds:
          - endpoints.POST_sponsors
          - endpoints.GET_sponsors_by_id
          - entities.Sponsor
          - response_envelope.success
        distinguishing_aspect: |
          Sponsor is the one entity whose declared surface is exactly two verbs: create
          and read one. There is no list endpoint, no update and no delete, so a
          registered sponsor is only ever enumerable through the activation reverse
          lookup ?sponsor_id -- and the read must round-trip every declared field
          including the four common fields, with no computed field at all.
        test_recipe:
          setup:
            - "No fixture is needed beyond the sponsor itself: Sponsor has no parent FK and no computed fields."
            - "Two sponsors are registered so that the read is proven to select by id rather than returning the only row."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/sponsors"
              payload: { name: "Ridgeline Motors", category: "AUTOMOTIVE", exclusivity_tier: "PRESENTING" }
              as: SponsorshipDirector
              captures: { sp_e1a: "$.data.id" }
            - call: "POST /grandstand/sponsors"
              payload: { name: "Prairie Cola", category: "BEVERAGE", exclusivity_tier: "SUPPORTING" }
              as: SponsorshipDirector
              captures: { sp_e1b: "$.data.id" }
          trigger:
            - call: "GET /grandstand/sponsors/${sp_e1a}"
              payload: {}
              as: SponsorshipDirector
            - call: "GET /grandstand/sponsors/${sp_e1b}"
              payload: {}
              as: SettlementController
            - call: "GET /grandstand/sponsorship-activations"
              payload: { sponsor_id: "${sp_e1a}" }
              as: SponsorshipDirector
          assert:
            - "Both creates return 201 under the declared success envelope { data: <object> } with no top-level list wrapper."
            - "The first read returns name 'Ridgeline Motors', category 'AUTOMOTIVE', exclusivity_tier 'PRESENTING' plus id, created_at, updated_at and version == 1 -- every declared field and nothing computed."
            - "The second read returns the OTHER sponsor's fields, so the path id is honoured."
            - "created_at and updated_at are both 2026-08-01T00:00:00.000Z, the logical clock, and are equal because nothing has updated the row."
            - "The activation list filtered by ?sponsor_id returns an empty data array with total_count == 0: this reverse lookup is the only enumeration path a sponsor has, and it is empty before any rights are sold."

      - name: reschedule_moves_coordinates_without_moving_the_hold_ledger
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_show_bookings_reschedule
          - state_machines.ShowBooking.DATE_HELD_to_DATE_HELD
          - calculations.stage_hold_ledger
        distinguishing_aspect: |
          Reschedule is a self-loop action: it rewrites show_date, load_in_start_utc and
          load_out_end_utc and bumps version, but Stage.held_show_count stays 1 and
          FairEdition.open_stage_count is untouched because the slot moves within the
          same stage. It also leaves the originating Offer's own target_show_date at the
          old value -- the booking owns its coordinates once it exists.
        test_recipe:
          setup:
            - "Canonical edition and Grandstand stage (slot_soft_cap 4, changeover_buffer_minutes 120)."
            - "One offer for 2026-08-22, radius_days_before and radius_days_after both 0, sent and accepted, so a DATE_HELD booking exists and held_show_count is 1."
            - "The new date 2026-08-24 is inside the run, two days from the old date so genre adjacency (1 day) cannot fire, on the same stage with no other hold, and its load_out_end_utc of 23:00 is inside the 23:30 curfew."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_e2: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_e2}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_e2: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_e2: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_e2}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_e2: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_e2}", artist_id: "${ar_e2}", target_stage_id: "${st_e2}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", radius_miles: 0, radius_days_before: 0, radius_days_after: 0, response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_e2: "$.data.id" }
            - call: "POST /grandstand/offers/${of_e2}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of_e2}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of_e2}" }
              as: TalentBuyer
              captures: { bk_e2: "$.data[0].id" }
            - call: "GET /grandstand/stages/${st_e2}"
              payload: {}
              as: FairOperationsDirector
          trigger:
            - call: "POST /grandstand/show-bookings/${bk_e2}/reschedule"
              payload: { new_show_date: "2026-08-24", new_load_in_start_utc: "2026-08-24T14:00:00.000Z", new_load_out_end_utc: "2026-08-24T23:00:00.000Z" }
              as: FairOperationsDirector
            - call: "GET /grandstand/show-bookings/${bk_e2}"
              payload: {}
              as: FairOperationsDirector
            - call: "GET /grandstand/stages/${st_e2}"
              payload: {}
              as: FairOperationsDirector
            - call: "GET /grandstand/fair-editions/${ed_e2}"
              payload: {}
              as: FairOperationsDirector
            - call: "GET /grandstand/offers/${of_e2}"
              payload: {}
              as: TalentBuyer
          assert:
            - "The reschedule returns 200 (not 201: nothing is created) and the response body is the updated ShowBooking."
            - "show_date == '2026-08-24', load_in_start_utc == '2026-08-24T14:00:00.000Z', load_out_end_utc == '2026-08-24T23:00:00.000Z'."
            - "booking_status is still 'DATE_HELD' and ticketing_status is still 'SCALED_PENDING': the self-loop changes no state label."
            - "ShowBooking.version has incremented by exactly 1 relative to the pre-reschedule read."
            - "Stage.held_show_count is still 1 and booking_posture is still 'OPEN'; FairEdition.open_stage_count is unchanged -- the slot moved inside the stage, it was not released and re-taken."
            - "The originating Offer still reports target_show_date '2026-08-22' and status 'ACCEPTED': reschedule does not rewrite the contract's stated date."

