  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_beats_approved_exceeds_requested
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.CreditApplication.transitions.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Category pair business_safety (priority 7, ERR_SEGREGATION_OF_DUTIES) vs business_constraint
          (priority 8, ERR_APPROVED_EXCEEDS_REQUESTED): an approve by the original submitter AND with
          approved_amount_cents > requested_amount_cents must return ERR_SEGREGATION_OF_DUTIES (the
          lower-numbered, higher-priority check), not the over-approval error.
        test_recipe:
          setup:
            - "A SUBMITTED application (requested 500000) whose submitter is analyst-1"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "India Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 500000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 900000 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"

