  - rule_id: compensating_invariant
    instances:
      - name: travel_commitment_restored_exactly_on_grant_cancellation
        grounds:
          - state_machines.TravelGrant.REQUESTED_to_APPROVED
          - state_machines.TravelGrant.APPROVED_to_CANCELLED
          - entities.InductionCycle.fields.travel_committed_cents
          - entities.InductionCycle.fields.austerity_tier
          - calculations.induction_ceremony_readiness
        distinguishing_aspect: |
          Conserved quantity: MONEY. travel_committed_cents moves 0 -> 516659 on approval and back
          to exactly 0 on cancellation, restoring the pre-approval value to the cent with no drift;
          the derived austerity_tier follows REDUCED -> FULL and ceremony_ready_count follows
          1 -> 0, while the grant's frozen award_cents stays 516659 because cancellation compensates
          the ledger without recomputing the award.
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, MODERN) with election_threshold_pct 0.75."
            - "VoterBloc WRITERS with three credentialed electors and min_participation_pct 0.50."
            - "A single-slot ballot (max_votes_per_elector 1) on which all three electors select slot1, so threshold_votes_final == ceil(3 * 0.75) == 3 is met exactly and the slot is ELECTED."
            - "The cycle is CERTIFIED with induction_count 1 and its ceremony is planned for 2026-11-15T18:00:00Z with travel_budget_cents 1000000."
            - "The induction's artifact intake is EXEMPT, so ceremony_ready depends only on travel_status."
            - "One REQUESTED grant of 23 nights with airfare at the 95000 cap, priced at tier FULL: round_half_up(18333 * 23) + 95000 == 421659 + 95000 == 516659."
          setup_api_calls:
