      - name: airflow_deviation_signs_and_zero_case_round_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.airflow_balance_deviation
          - entities.AirflowReading.fields.deviation_pct
          - entities.AirflowReading.fields.within_tolerance
        distinguishing_aspect: "deviation_pct is signed and keeps its sign through the 2-decimal round_half_up, while within_tolerance compares the ABSOLUTE value: -10.00% is within a 10.00% tolerance, 0.00% is the exact-match case, and -12.50% is outside."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one comfort complaint DIAGNOSED with tolerance_pct 10.00"
