              as: PlatformAdmin
              captures: { cfg: $.data.id }
            - call: "POST /api/accounts/${acct}/readiness-reviews"
              payload: { site_code: "PH-1", operating_room_length_cm: 900, operating_room_width_cm: 800, table_throw_radius_cm: 400, ceiling_clearance_cm: 300, has_dedicated_power_circuit: true, has_dark_fiber_run: true, evaluated_configuration_id: "${cfg}" }
              as: ClinicalOperationsLead
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /api/account-readiness-reviews/${rev}/submit-verdict"
              payload: { verdict: "PASSED", expected_review_version: "${rev_v}" }
              as: ClinicalOperationsLead
            - call: "POST /api/accounts/${acct}/training-records"
