            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-102", erection_sequence_no: 20, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { pc2_id: $.data.id }
            - call: "POST /pieces/${pc1_id}/assign-run"
              payload: { bed_run_id: "${run_id}" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /pieces/${pc2_id}/assign-run"
