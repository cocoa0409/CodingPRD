            - "The allocate response itself carries allocation_lines with one line for ${run_id} of 4.000 bbl and state ALLOCATED"
            - "GET /packaging-runs/${run_id} immediately after allocate: allocated_bbl 4.000, available_bbl 1.000, shipped_bbl 0.000"
