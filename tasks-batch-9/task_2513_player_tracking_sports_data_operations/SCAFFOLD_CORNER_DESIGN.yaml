  - section: complexity_layers
    instances:
      - name: stale_expected_game_version_is_refused_and_every_write_bumps_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[event-tag-create-stale-game]
          - validations[priority=35]
          - entities.EventTag.fields.game_version_at_tag
          - errors[ERR_STALE_GAME_VERSION]
        distinguishing_aspect: |
          The declared concurrency rule guards POST /event-tags with expected_game_version, and the guarded
          value moves on every write to the game: the version captured at open-collection (2) is already
          stale after the first tag pushes the game to 3, so replaying it must return 412
          ERR_STALE_GAME_VERSION and persist nothing, while re-reading the game and using the fresh value
          succeeds and lands game_version_at_tag == 4 on the new tag.
        test_recipe:
          setup:
            - "Harbor Arena CERTIFIED; game LIVE (version 2 after open-collection); player Ada Ruiz on the home club"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
