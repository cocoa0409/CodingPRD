            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "TEMPORARY_DISQUALIFICATION" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "8821", line_items: *basket_simple, snap_benefit_available_cents: 1000, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { sale2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &case_finalize
              call: "POST /sanction-cases/${case_id}/finalize"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "8821", line_items: *basket_simple, snap_benefit_available_cents: 1000, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { blocked_sale_error_id: $.data.error_id }
          assert:
            - "PosTransaction.${sale1_id}.status == AUTHORIZED"
            - "PosTransaction.${sale1_id}.ebt_tender_cents == 758"
            - "PosTransaction.${sale1_id}.split_tender_applied == false"
            - "after the TIP investigation and before finalize: Store.${store_id}.authorization_status == AUTHORIZED with sanction_status walking UNDER_INVESTIGATION then CHARGED"
            - "TerminalDeployment.${dep_id}.status == ACTIVE after the investigation opened (only RESERVED deployments are released)"
            - "PosTransaction.${sale2_id}.status == AUTHORIZED even though the case is already DETERMINED"
            - "SanctionCase.${case_id}.disqualification_months == 3"
            - "SanctionCase.${case_id}.final_decision_at == 2026-08-12T00:00:00Z"
            - "SanctionCase.${case_id}.effective_date == 2026-09-11T00:00:00Z"
            - "Store.${store_id}.authorization_status == SUSPENDED"
            - "Store.${store_id}.sanction_status == SANCTION_FINAL"
            - "Store.${store_id}.active_terminal_count == 1 (suspension does not recall hardware before the effective date)"
            - "the third sale returns 403 with ${blocked_sale_error_id} == ERR_STORE_NOT_AUTHORIZED and no PosTransaction row is created"

  - rule_id: transitive_cascade
    instances:

      - name: enforcement_cascade_case_store_deployment_terminal_depot_owner_five_levels
        grounds:
          - state_machines.SanctionCase.SANCTION_FINAL_to_ENFORCED
          - state_machines.Store.SUSPENDED_to_DISQUALIFIED
          - state_machines.TerminalDeployment.ACTIVE_to_RECALL_PENDING
          - calculations.depot_unit_ledger
          - calculations.owner_sanction_rollup
          - entities.EquipmentDepot.fields.units_pending_return
          - entities.Owner.fields.permanent_disqualification_count
        distinguishing_aspect: |
          One enforce call propagates five levels deep along a chain that crosses four
          entities and two aggregates: SanctionCase -> Store (DISQUALIFIED,
          permanently_disqualified) -> TerminalDeployment (RECALL_PENDING with
          close_reason_code AUTHORIZATION_LOST) -> EbtTerminal (PENDING_RETURN) ->
          EquipmentDepot counters, plus a sideways roll-up onto Owner
          (permanent_disqualification_count and sanction_flag). Nothing else in the
          scenario touches the depot counters from a sanction endpoint.
        test_recipe:
          setup:
            - "The shared authorized store with one ACTIVE deployment of terminal EBT-0001 from a 5-unit TX depot."
            - "A substantiated TRAFFICKING investigation (fresh undercover buy plus EBT-only pattern, score 60) and a TRAFFICKING case charged 2026-08-01, replied to, determined PERMANENT_DISQUALIFICATION and finalized at 2026-08-12 with an effective date of 2026-09-11."
            - "The clock is advanced to exactly the effective date before enforcement."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - *b_deploy
            - *b_activate
            - *inv_open_tip
            - *ev_undercover
            - *ev_ebt_only
            - *conclude_trafficking
            - *case_trafficking
            - *charge_letter
            - *case_reply
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "PERMANENT_DISQUALIFICATION" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *case_finalize
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "SanctionCase.${case_id}.status == ENFORCED"
            - "SanctionCase.${case_id}.effective_date == 2026-09-11T00:00:00Z"
            - "SanctionCase.${case_id}.enforced_at == 2026-09-11T00:00:00Z"
            - "Store.${store_id}.authorization_status == DISQUALIFIED"
            - "Store.${store_id}.permanently_disqualified == true"
            - "Store.${store_id}.disqualified_until == null"
            - "Store.${store_id}.active_terminal_count == 0"
            - "TerminalDeployment.${dep_id}.status == RECALL_PENDING"
            - "TerminalDeployment.${dep_id}.close_reason_code == AUTHORIZATION_LOST"
            - "EbtTerminal.${term_id}.status == PENDING_RETURN"
            - "EquipmentDepot.${depot_id}.units_deployed == 0"
            - "EquipmentDepot.${depot_id}.units_pending_return == 1"
            - "EquipmentDepot.${depot_id}.units_in_stock == 4"
            - "EquipmentDepot.${depot_id}.units_in_stock + units_reserved + units_deployed + units_pending_return + units_retired == 5"
            - "Owner.${owner_id}.permanent_disqualification_count == 1"
            - "Owner.${owner_id}.sanction_flag == PERMANENTLY_DISQUALIFIED"
            - "Owner.${owner_id}.status == ACTIVE (BARRED needs a second permanent disqualification)"

      - name: period_close_cascade_flag_investigation_sanction_status_and_reserved_release
        grounds:
          - state_machines.RedemptionPeriod.OPEN_to_CLOSED
          - state_machines.Store.sanction_status.NONE_to_UNDER_INVESTIGATION
          - state_machines.TerminalDeployment.RESERVED_to_RELEASED
          - calculations.redemption_anomaly_score
          - calculations.store_redemption_flag_level
          - calculations.depot_unit_ledger
          - entities.Investigation.fields.trigger_period_id
        distinguishing_aspect: |
          A different four-level chain fired from a different root (a monitoring close,
          not an enforcement action): RedemptionPeriod flag_level FLAG_L3 -> a
          system-opened Investigation carrying trigger_period_id -> Store.sanction_status
          UNDER_INVESTIGATION -> release of the store's RESERVED deployment ->
          EbtTerminal back to IN_STOCK and the depot counters re-derived. The deployment
          here is RESERVED (never activated), which is exactly the branch the
          enforcement cascade never touches.
        test_recipe:
          setup:
            - "The shared authorized store, plus a RESERVED (not yet activated) deployment of terminal EBT-0001 from the 5-unit TX depot."
            - "One OPEN 2026-06 period whose settlement import gives it the FLAG_L3 profile 4,375,000c / 25 txns / 2,625,000c large / 6 even-dollar."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - *b_deploy
            - *pj_create
            - call: "POST /redemption-periods/${pj_id}/settlement-import"
              payload: { imported_total_cents: 4375000, imported_transaction_count: 25, imported_large_transaction_cents: 2625000, imported_even_dollar_transaction_count: 6 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          trigger:
            - call: "POST /redemption-periods/${pj_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          assert:
            - "RedemptionPeriod.${pj_id}.status == CLOSED"
            - "RedemptionPeriod.${pj_id}.anomaly_score == 92"
            - "RedemptionPeriod.${pj_id}.flag_level == FLAG_L3"
            - "Store.${store_id}.redemption_flag_level == FLAG_L3"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"
            - "Store.${store_id}.authorization_status == AUTHORIZED (the monitoring cascade never touches dimension 1)"
            - "GET /investigations?store_id=${store_id} returns exactly 1 row with opened_reason == ANOMALY_FLAG_L3, trigger_period_id == ${pj_id}, status == OPEN and trafficking_confidence_score == 0"
            - "TerminalDeployment.${dep_id}.status == RELEASED"
            - "TerminalDeployment.${dep_id}.closed_at == 2026-08-01T00:00:00Z"
            - "EbtTerminal.${term_id}.status == IN_STOCK"
            - "EquipmentDepot.${depot_id}.units_reserved == 0"
            - "EquipmentDepot.${depot_id}.units_in_stock == 5"
            - "Store.${store_id}.active_terminal_count == 0"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: pos_authorization_gate_priority_10_beats_tender_feasibility_priority_19
        grounds:
          - validations.priority_10_store_not_authorized
          - validations.priority_19_pos_tender_feasibility
          - errors.ERR_STORE_NOT_AUTHORIZED
          - errors.ERR_SPLIT_TENDER_SHORTFALL
          - calculations.pos_eligibility_split_tender
        distinguishing_aspect: |
          Pairs the eligibility/authorization gate (priority 10, 403) against the money
          feasibility gate (priority 19, 422) on a single request that violates both: the
          store has just been suspended by a finalized temporary disqualification AND the
          basket offers 0c of other tender against a 3,107c requirement. The 403 must win;
          returning ERR_SPLIT_TENDER_SHORTFALL would leak the fact that the arithmetic ran
          at all on a suspended store.
        test_recipe:
          setup:
            - "The shared authorized store with one ACTIVE deployment."
            - "An INELIGIBLE_ITEMS_HARDSHIP case charged 2026-08-01, replied to, determined TEMPORARY_DISQUALIFICATION, and finalized at 2026-08-12 so authorization_status is SUSPENDED."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - *b_deploy
            - *b_activate
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - *charge_letter
            - *case_reply
            - &det_temp
              call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "TEMPORARY_DISQUALIFICATION" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &clock_0812
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *case_finalize
          trigger:
            - call: "POST /pos-transactions"
              payload:
                store_id: "${store_id}"
                terminal_deployment_id: "${dep_id}"
                household_ebt_card_last4: "8821"
                line_items: &basket_split
                  - { sku: "MILK-1G", item_class: "STAPLE_FOOD", unit_price_cents: 379, qty: 2 }
                  - { sku: "BREAD-WW", item_class: "STAPLE_FOOD", unit_price_cents: 289, qty: 1 }
                  - { sku: "SEEDS-TOM", item_class: "SEED_PLANT", unit_price_cents: 249, qty: 1 }
                  - { sku: "BEER-6PK", item_class: "ALCOHOL", unit_price_cents: 999, qty: 1 }
                  - { sku: "HOTDELI", item_class: "HOT_PREPARED", unit_price_cents: 599, qty: 1 }
                  - { sku: "PAPERTWL", item_class: "NONFOOD", unit_price_cents: 333, qty: 3 }
                snap_benefit_available_cents: 1000
                other_tender_offered_cents: 0
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { pos_conflict_error_id: $.data.error_id }
          assert:
            - "the request returns 403 and ${pos_conflict_error_id} == ERR_STORE_NOT_AUTHORIZED"
            - "the response is NOT 422 / ERR_SPLIT_TENDER_SHORTFALL even though the offered tender is 0c against a 3107c requirement"
            - "no PosTransaction row is created for the store: GET /pos-transactions?store_id=${store_id} returns 0 rows"
            - "Store.${store_id}.authorization_status == SUSPENDED and sanction_status == SANCTION_FINAL"

      - name: admin_review_state_gate_priority_9_beats_deadline_gate_priority_12
        grounds:
          - validations.priority_9_declared_transition
          - validations.priority_12_deadline_gates
          - errors.ERR_INVALID_STATE
          - errors.ERR_ADMIN_REVIEW_WINDOW_CLOSED
          - state_machines.SanctionCase.DETERMINED_to_ADMIN_REVIEW_REQUESTED
        distinguishing_aspect: |
          A different pair on a different endpoint: the declared-transition gate (priority
          9, 409) against the same deadline family (priority 12, 409) — both would answer
          409, so only the error_id distinguishes them. The case is already SANCTION_FINAL
          (no ADMIN_REVIEW_REQUESTED transition is declared from there) and the clock sits
          nine days past admin_review_due_at, so state must be reported before lateness.
        test_recipe:
          setup:
            - "The shared authorized store with a hardship case charged 2026-08-01, replied to and determined TEMPORARY_DISQUALIFICATION (admin_review_due_at 2026-08-11)."
            - "The case is finalized at 2026-08-12 and the clock is then advanced to 2026-08-20."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - *charge_letter
            - *case_reply
            - *det_temp
            - *clock_0812
            - *case_finalize
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_id}/administrative-review"
              payload: { grounds_text: "The determination misread the household interview evidence." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { review_conflict_error_id: $.data.error_id }
          assert:
            - "the request returns 409 and ${review_conflict_error_id} == ERR_INVALID_STATE"
            - "the response is NOT ERR_ADMIN_REVIEW_WINDOW_CLOSED even though the clock is 9 days past admin_review_due_at"
            - "SanctionCase.${case_id}.status == SANCTION_FINAL and admin_review_requested_at == null"
            - "SanctionCase.${case_id}.admin_review_due_at == 2026-08-11T00:00:00Z"
            - "Store.${store_id}.sanction_status == SANCTION_FINAL"

      - name: cmp_election_deadline_priority_12_beats_hardship_gate_priority_18
        grounds:
          - validations.priority_12_deadline_gates
          - validations.priority_18_cmp_gates
          - errors.ERR_CMP_ELECTION_WINDOW_CLOSED
          - errors.ERR_CMP_NOT_AVAILABLE
          - calculations.cmp_in_lieu_eligibility
          - entities.Store.fields.hardship_designated
        distinguishing_aspect: |
          A third, non-overlapping pair (12 vs 18) reached through the OCC-guarded
          election endpoint: hardship designation has been switched off AND the election
          is filed four days after cmp_election_due_at. The temporal gate outranks the
          substantive CMP gate, so ERR_CMP_ELECTION_WINDOW_CLOSED must come back even
          though the election could never have been honoured on a non-hardship store.
        test_recipe:
          setup:
            - "The shared authorized store, then hardship_designated flipped to false via PATCH using the store version read back after authorization."
            - "A hardship case charged at 2026-08-01T00:00:00Z, so cmp_election_due_at is 2026-08-11T00:00:00Z."
            - "The clock is advanced to 2026-08-15T00:00:00Z before the election is filed."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - call: "GET /stores/${store_id}"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_v2: $.data.version }
            - call: "PATCH /stores/${store_id}"
              payload: { expected_store_version: "${store_v2}", hardship_designated: false }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - *charge_letter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_id}/cmp-elections"
              payload: { expected_sanction_case_version: "${case_v}" }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { election_conflict_error_id: $.data.error_id }
          assert:
            - "the request returns 409 and ${election_conflict_error_id} == ERR_CMP_ELECTION_WINDOW_CLOSED"
            - "the response is NOT ERR_CMP_NOT_AVAILABLE and NOT ERR_STALE_SANCTION_CASE_VERSION (the supplied version is current)"
            - "SanctionCase.${case_id}.cmp_election_due_at == 2026-08-11T00:00:00Z"
            - "GET /sanction-cases/${case_id}/cmp-elections returns 0 rows"
            - "Store.${store_id}.hardship_designated == false"

  - rule_id: boundary_precision_check
    instances:

      - name: anomaly_flag_l3_boundary_sixty_nine_versus_exactly_seventy
        grounds:
          - calculations.redemption_anomaly_score
          - calculations.store_redemption_flag_level
          - entities.RedemptionPeriod.fields.flag_level
          - state_machines.RedemptionPeriod.OPEN_to_CLOSED
          - errors.ERR_TRIGGER_PERIOD_NOT_FLAGGED
        distinguishing_aspect: |
          Straddles the FLAG_L3 constant (>= 70) by one point using two periods that
          differ only in the even-dollar count: 13 of 100 transactions scores exactly 69.0
          (FLAG_L2, no investigation) and 3 of 20 scores exactly 70.0 (FLAG_L3, automatic
          investigation). Both land on integers with no rounding slack, so an
          off-by-one comparison (> 70 instead of >= 70) or per-term rounding flips the
          cascade.
        test_recipe:
          setup:
            - "The shared authorized CONVENIENCE store (size expectation 1,250,000c)."
            - "Two consecutive OPEN periods: 2026-05 imported as 4,375,000c / 100 txns / 1,093,750c large / 13 even-dollar, and 2026-06 imported as 4,375,000c / 20 txns / 1,093,750c large / 3 even-dollar."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 1, period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { pl2_id: $.data.id }
            - call: "POST /redemption-periods/${pl2_id}/settlement-import"
              payload: { imported_total_cents: 4375000, imported_transaction_count: 100, imported_large_transaction_cents: 1093750, imported_even_dollar_transaction_count: 13 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 2, period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { pl3_id: $.data.id }
            - call: "POST /redemption-periods/${pl3_id}/settlement-import"
              payload: { imported_total_cents: 4375000, imported_transaction_count: 20, imported_large_transaction_cents: 1093750, imported_even_dollar_transaction_count: 3 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          trigger:
            - call: "POST /redemption-periods/${pl2_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - call: "POST /redemption-periods/${pl3_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          assert:
            - "RedemptionPeriod.${pl2_id}.anomaly_score == 69"
            - "RedemptionPeriod.${pl2_id}.flag_level == FLAG_L2"
            - "after the first close: Store.${store_id}.redemption_flag_level == FLAG_L2 and sanction_status == NONE with 0 investigations"
            - "RedemptionPeriod.${pl3_id}.anomaly_score == 70"
            - "RedemptionPeriod.${pl3_id}.flag_level == FLAG_L3"
            - "Store.${store_id}.redemption_flag_level == FLAG_L3"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"
            - "GET /investigations?store_id=${store_id} returns exactly 1 row whose trigger_period_id == ${pl3_id}"
            - "both periods share identical redemption_total_cents and large_transaction_cents, so the single-point gap comes only from the even-dollar component"

      - name: criterion_b_strict_boundary_at_exactly_five_thousand_bps
        grounds:
          - calculations.criterion_b_staple_sales_share
          - validations.priority_16_staple_and_sales_eligibility
          - errors.ERR_CRITERION_B_NOT_MET
          - entities.Store.fields.staple_sales_bps
          - entities.Store.fields.criterion_b_pass
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Tests strictness rather than a level: the CRITERION_B_MIN_BPS constant is 5000
          and the comparison is strictly greater, so a store at exactly 5000 bps
          (18,000,000c of 36,000,000c) is refused while 5001 bps (18,003,600c) is accepted.
          The rejected value is the arithmetically exact midpoint, so any >= reading, any
          percentage rounding, or any floor/ceil slip in the bps derivation flips it.
        test_recipe:
          setup:
            - "One owner with two identical GROCERY stores in TX, differing only in annual_staple_sales_cents: 18,000,000c (exactly 50.00%) and 18,003,600c (50.01%)."
            - "One CRITERION_B application in DRAFT against each store."
          setup_api_calls:
            - *a_owner
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Grocery Even", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 3, staple_shelf_linear_feet: 60, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 18000000, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_even_id: $.data.id, store_even_v: $.data.version }
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Grocery Over", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 3, staple_shelf_linear_feet: 60, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 18003600, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_over_id: $.data.id, store_over_v: $.data.version }
            - call: "POST /applications"
              payload: { store_id: "${store_even_id}", expected_store_version: "${store_even_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_B", reported_inventory_lines: *inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_even_id: $.data.id }
            - call: "POST /applications"
              payload: { store_id: "${store_over_id}", expected_store_version: "${store_over_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_B", reported_inventory_lines: *inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_over_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_even_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { criterion_b_error_id: $.data.error_id }
            - call: "POST /applications/${app_over_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
          assert:
            - "Store.${store_even_id}.staple_sales_bps == 5000"
            - "Store.${store_even_id}.criterion_b_pass == false"
            - "the first submit returns 422 and ${criterion_b_error_id} == ERR_CRITERION_B_NOT_MET"
            - "Application.${app_even_id}.status == DRAFT and submitted_at == null"
            - "Store.${store_over_id}.staple_sales_bps == 5001"
            - "Store.${store_over_id}.criterion_b_pass == true"
            - "the second submit returns 200 and Application.${app_over_id}.status == SUBMITTED"
            - "Application.${app_over_id}.submitted_at == 2026-08-01T00:00:00Z"

      - name: pos_ineligible_tax_summed_before_rate_applied_once
        grounds:
          - calculations.pos_eligibility_split_tender
          - entities.PosTransaction.fields.tax_cents
          - entities.PosTransaction.fields.other_tender_cents
          - entities.PosTransaction.fields.flagged_line_skus
          - entities.PosTransaction.fields.split_tender_applied
        distinguishing_aspect: |
          Precision on a mixed basket whose ineligible subtotal (2,597c at 825 bps) taxes
          to 214.2525c: summing first and rounding once gives 214c, while taxing each of
          the three ineligible lines and summing the rounded results gives 213c. The 1c
          gap propagates into other_tender_cents (3,107c vs 3,106c), so the split-tender
          arithmetic exposes the rounding order rather than hiding it, and the eligible
          shortfall of 296c is settled in other tender rather than being declined.
        test_recipe:
          setup:
            - "The shared authorized store with tax_rate_bps 825 and one ACTIVE deployment."
            - "A basket of three eligible lines (1,296c) and three ineligible lines (2,597c) with 1,000c of SNAP benefits and 5,000c of other tender offered."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - *b_deploy
            - *b_activate
          trigger:
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "8821", line_items: *basket_split, snap_benefit_available_cents: 1000, other_tender_offered_cents: 5000 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { sale_split_id: $.data.id }
          assert:
            - "PosTransaction.${sale_split_id}.eligible_subtotal_cents == 1296"
            - "PosTransaction.${sale_split_id}.ineligible_subtotal_cents == 2597"
            - "PosTransaction.${sale_split_id}.tax_cents == 214"
            - "PosTransaction.${sale_split_id}.tax_cents != 213 (per-line taxing then summing is the wrong order)"
            - "PosTransaction.${sale_split_id}.ebt_tender_cents == 1000"
            - "PosTransaction.${sale_split_id}.other_tender_cents == 3107"
            - "PosTransaction.${sale_split_id}.split_tender_applied == true"
            - "PosTransaction.${sale_split_id}.status == AUTHORIZED"
            - "PosTransaction.${sale_split_id}.flagged_line_skus == [BEER-6PK, HOTDELI, PAPERTWL]"
            - "PosTransaction.${sale_split_id}.decline_reason_code == null"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: pos_sale_requires_authorized_store_and_active_deployment_together
        grounds:
          - validations.priority_9_declared_transition
          - errors.ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE
          - state_machines.TerminalDeployment.RESERVED_to_ACTIVE
          - entities.PosTransaction.parent_TerminalDeployment
          - entities.Store.fields.active_terminal_count
        distinguishing_aspect: |
          The gate lives on a THIRD entity: the store is fully AUTHORIZED and the basket
          is fine, yet the sale is refused because the named TerminalDeployment is still
          RESERVED. Activating the very same deployment (no change to store, basket or
          benefits) turns the identical request into a 201, so the dependency is on the
          deployment's state alone.
        test_recipe:
          setup:
            - "The shared authorized store with a RESERVED (not activated) deployment of terminal EBT-0001 from the 5-unit TX depot."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *b_depot
            - *b_term
            - *b_deploy
          trigger:
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "8821", line_items: *basket_simple, snap_benefit_available_cents: 1000, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { inactive_terminal_error_id: $.data.error_id }
            - *b_activate
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "8821", line_items: *basket_simple, snap_benefit_available_cents: 1000, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { sale_after_activate_id: $.data.id }
          assert:
            - "the first sale returns 409 and ${inactive_terminal_error_id} == ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE"
            - "Store.${store_id}.authorization_status == AUTHORIZED throughout (the store was never the problem)"
            - "Store.${store_id}.active_terminal_count == 0 before activation and 1 after"
            - "EbtTerminal.${term_id}.status == RESERVED before activation and DEPLOYED after"
            - "PosTransaction.${sale_after_activate_id}.status == AUTHORIZED"
            - "PosTransaction.${sale_after_activate_id}.ebt_tender_cents == 758"
            - "GET /pos-transactions?store_id=${store_id} returns exactly 1 row (the refused attempt was never persisted)"

      - name: reauthorization_approval_blocked_by_predecessor_owner_cmp_debt
        grounds:
          - validations.priority_20_transfer_integrity
          - errors.ERR_TRANSFER_CMP_OUTSTANDING
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
          - calculations.owner_sanction_rollup
          - entities.Store.fields.predecessor_store_id
          - entities.Owner.fields.cmp_outstanding_cents
        distinguishing_aspect: |
          The blocking state sits two entities away and on a DIFFERENT owner: the
          successor store, its new owner and its application are all in perfect order,
          but approval is refused because the predecessor store's owner still carries
          423,456c of CMP debt. Nothing about the successor's own inventory, visit or
          hardship status could reveal the failure.
        test_recipe:
          setup:
            - "The shared owner/store authorized and then hit with a CMP_IN_LIEU determination of 423,456c (four closed periods, charge letter 2026-08-01)."
            - "A second owner takes over the location: a new Store row with predecessor_store_id pointing at the original store."
            - "A REAUTHORIZATION_OWNERSHIP_CHANGE application on the successor store, submitted, visited 04:00-06:00 on 2026-08-01 with passing findings, so it sits in UNDER_REVIEW."
