        payload:
          deployment_start: '2026-06-01'
          deployment_end: '2026-09-01'
          orders_reference: ORD-2
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          dep24b: $.data.id
      - call: POST /va-loans/veterans/${v24}/deployment-exceptions
        payload:
          deployment_start: '2026-05-31'
          deployment_end: '2026-08-01'
          orders_reference: ORD-3
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          err24: $.data.error_id
      assert:
      - 'adjacent window: status 201 (end == start allowed under half-open semantics)'
      - 'overlapping window: status 409, error_id == ERR_DEPLOYMENT_WINDOW_OVERLAP'
      - GET deployment-exceptions for ${v24} returns exactly 2 entries
