              payload: { partner_id: "${pa_id}", custody_account_id: "${res_a_id}", entry_type: "RESERVE_FUND", amount_cents: 312500, effective_at: "2026-08-05T00:00:00Z", expected_custody_account_version: "${res_a_v}", memo: "initial reserve top-up" }
              as: ProgramOfficer
