      - name: snapshot_publish_blocked_by_unacknowledged_notification
        claim_type: cross_entity_validation
        grounds: [state_machines.ISOSnapshot.DRAFT_to_PUBLISHED, "errors[ERR_UNACKNOWLEDGED_NOTIFICATIONS]"]
        distinguishing_aspect: "ISO publish is gated on the program having zero unacknowledged fire-department notifications — a compliance gate crossing ISOSnapshot and HydrantOutage."
        test_recipe:
          setup: ["Program with hydrant H tagged OUT_OF_SERVICE; notification PENDING (never acknowledged); snapshot S created"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "MUNICIPAL_ONLY" }, as: ProgramAdmin, captures: { snap_id: $.data.id } }
          trigger:
            - { call: "POST /iso-snapshots/${snap_id}/publish", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNACKNOWLEDGED_NOTIFICATIONS with http 409; snapshot remains DRAFT"

      - name: snapshot_publish_empty_program_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ISOSnapshot.DRAFT_to_PUBLISHED, "errors[ERR_NO_HYDRANTS_IN_SCOPE]"]
        distinguishing_aspect: "Publishing a snapshot for a program with zero non-decommissioned hydrants fails with ERR_NO_HYDRANTS_IN_SCOPE (422)."
        test_recipe:
          setup: ["Program with no hydrants; snapshot S created"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "MUNICIPAL_ONLY" }, as: ProgramAdmin, captures: { snap_id: $.data.id } }
          trigger:
            - { call: "POST /iso-snapshots/${snap_id}/publish", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_HYDRANTS_IN_SCOPE with http 422"

      - name: snapshot_republish_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ISOSnapshot.DRAFT_to_PUBLISHED, "errors[ERR_SNAPSHOT_NOT_DRAFT]"]
        distinguishing_aspect: "A second publish on an already-PUBLISHED snapshot fails with ERR_SNAPSHOT_NOT_DRAFT — publish is one-shot per snapshot."
        test_recipe:
          setup: ["Program with hydrant H; snapshot S already PUBLISHED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "MUNICIPAL_ONLY" }, as: ProgramAdmin, captures: { snap_id: $.data.id } }
            - { call: "POST /iso-snapshots/${snap_id}/publish", as: ProgramAdmin }
          trigger:
            - { call: "POST /iso-snapshots/${snap_id}/publish", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SNAPSHOT_NOT_DRAFT with http 409"

      - name: step_execution_out_of_order_rejected
        claim_type: violation_to_error
        grounds: [state_machines.FlushSequence.IN_PROGRESS_to_IN_PROGRESS, "errors[ERR_STEP_OUT_OF_SEQUENCE]"]
        distinguishing_aspect: "Valve operations are strictly sequential: executing step 2 while step 1 is still PENDING fails with ERR_STEP_OUT_OF_SEQUENCE."
        test_recipe:
          setup: ["Hydrant H; sequence S IN_PROGRESS with 2 steps, none executed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }, { step_index: 2, valve_tag: "V-B", action: "CLOSE" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 1.0 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 2, flow_gpm: 400, duration_minutes: 5 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STEP_OUT_OF_SEQUENCE with http 409; both steps remain PENDING"

      - name: notification_double_acknowledge_rejected
        claim_type: idempotency
        grounds: [state_machines.HydrantOutage.ACTIVE_to_ACTIVE, "errors[ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED]"]
        distinguishing_aspect: "Acknowledging an already-acknowledged notification fails with ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED; the program counter is not decremented twice."
        test_recipe:
          setup: ["Hydrant H tagged out; notification already acknowledged by fd_1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
          trigger:
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1", captures: { err: $.data.error_id } }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
          assert:
            - "error_id == ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED with http 409"
            - "FlushingProgram.${prog_id}.unacknowledged_notification_count == 0 (single decrement only)"

      - name: complaint_close_paths_guarded
        claim_type: invalid_transition
        grounds: [state_machines.WaterQualityComplaint, "errors[ERR_LINKED_SEQUENCE_NOT_COMPLETED]", "errors[ERR_COMPLAINT_NOT_CLOSABLE]"]
        distinguishing_aspect: "Close outcomes are state-guarded: RESOLVED while the linked sequence is still PLANNED fails ERR_LINKED_SEQUENCE_NOT_COMPLETED; DISMISSED from LINKED fails ERR_COMPLAINT_NOT_CLOSABLE."
        test_recipe:
          setup: ["Hydrant H; PLANNED sequence S; complaint C (ODOR) LINKED to S"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "ODOR" }, as: FieldOperator, as_user_id: "op_1", captures: { c_id: $.data.id } }
            - { call: "POST /complaints/${c_id}/link", payload: { flush_sequence_id: "${seq_id}" }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /complaints/${c_id}/close", payload: { outcome: "RESOLVED" }, as: UtilitySupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
            - { call: "POST /complaints/${c_id}/close", payload: { outcome: "DISMISSED" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "RESOLVED attempt: error_id == ERR_LINKED_SEQUENCE_NOT_COMPLETED with http 409"
            - "DISMISSED attempt from LINKED: error_id == ERR_COMPLAINT_NOT_CLOSABLE with http 409"
            - "WaterQualityComplaint.${c_id}.status remains LINKED"

      - name: program_closed_gates_new_flow_test
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PROGRAM_NOT_OPEN]"]
        distinguishing_aspect: "Operations under a CLOSED program are rejected: creating a flow test for a hydrant of a closed program fails ERR_PROGRAM_NOT_OPEN."
        test_recipe:
          setup: ["Program P CLOSED; zone; hydrant H in P"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
