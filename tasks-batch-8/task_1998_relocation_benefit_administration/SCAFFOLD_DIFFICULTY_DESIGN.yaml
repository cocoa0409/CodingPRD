            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /vendors"
              payload: { name: "Cascade Carriers", service_regions: ["IL"] }
              as: MobilityCoordinator
              captures: { vendor_id: $.data.id }
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma_id: $.data.id }
            - call: "POST /move-assignments/${ma_id}/schedule-survey"
              payload: { survey_at: "2026-08-10T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/submit-estimate"
              payload: { estimated_cents: 80000 }
