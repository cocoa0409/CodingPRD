              as: SystemAdmin
              captures: { firm_d_id: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { reviewer_firm_name: "Sennet Peer Review PC", license_state: "CA", qualified_categories: [], max_concurrent_reviews: 3, experience_hours: 5000 }
              as: PeerReviewCommittee
              captures: { rv1_id: $.data.id }
            - call: "POST /firms/${firm_a_id}/peer-reviews"
