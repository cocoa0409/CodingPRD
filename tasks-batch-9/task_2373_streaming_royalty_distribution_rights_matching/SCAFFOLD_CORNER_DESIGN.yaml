              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${wc}", claimant_id: "${pub}", right_type: "MECHANICAL", routing: "COLLECTIVE", collective_id: "${lbl}", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${wcv}" }
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /royalties/rights-registrations"
