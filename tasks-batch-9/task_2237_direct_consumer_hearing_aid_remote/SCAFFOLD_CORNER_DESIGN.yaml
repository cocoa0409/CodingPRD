        distinguishing_aspect: "confirm-fit must apply all three declared side effects at once -- pool on_hand 5 -> 4 with reserved 0 -> 1, an IN_STOCK Device flipped to ASSIGNED with device_order_id set, and DeviceOrder.version incremented -- while the inventory conservation identity still totals 5."
