# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# College Admissions Consulting — Expert (FLAT topology)
# Clock default before any set_current_utc: 2026-04-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_student_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Student.fields.full_name]
        distinguishing_aspect: "POST /students with all required fields returns 201; id/created_at/version system-minted, intake_status=PROSPECT, profile_strength=0, list_locked=false, version=1."
        test_recipe:
          setup: ["Counselor cc1 exists"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC1", email: "cc1@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { counselor_id: "${cc1}", full_name: "New S", email: "ns@x.com", grad_year: 2027, gpa: 3.4, sat_total: 1280 }
              as: Counselor
              as_user_id: "${cc1}"
              captures: { ns: $.data.id, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Student.${ns}.intake_status == PROSPECT"
            - "Student.${ns}.list_locked == false"
            - "Student.${ns}.version == 1"

      - name: get_student_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Student, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /students/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Counselor cc2 exists"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC2", email: "cc2@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc2: $.data.id }
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Counselor
              as_user_id: "${cc2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_student_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.Student.fields.grad_year, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /students omitting required grad_year returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Counselor cc3 exists"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC3", email: "cc3@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc3: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { counselor_id: "${cc3}", full_name: "No Grad", email: "ng@x.com", gpa: 3.4 }
              as: Counselor
              as_user_id: "${cc3}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_student_sat_total_default_zero
        claim_type: Defaults
        grounds: [entities.Student.fields.sat_total]
        distinguishing_aspect: "Omitting sat_total applies the declared default 0."
        test_recipe:
          setup: ["Counselor cc4 exists"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC4", email: "cc4@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc4: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { counselor_id: "${cc4}", full_name: "Default S", email: "ds@x.com", grad_year: 2027, gpa: 3.4 }
              as: Counselor
              as_user_id: "${cc4}"
              captures: { ds: $.data.id, sat: $.data.sat_total }
          assert:
            - "Student.${ds}.sat_total == 0"

      - name: create_student_bad_gpa_range_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Student.fields.gpa, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "gpa=5.0 violates the 0.0-4.0 range -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Counselor cc5 exists"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC5", email: "cc5@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc5: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { counselor_id: "${cc5}", full_name: "Bad GPA", email: "bg@x.com", grad_year: 2027, gpa: 5.0, sat_total: 1200 }
              as: Counselor
              as_user_id: "${cc5}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: essayversion_immutable_version_no_one
        claim_type: Immutability
        grounds: [entities.EssayVersion, entities.EssayVersion.fields.version_no]
        distinguishing_aspect: "EssayVersion (common_fields:false) is append-only; the first submitted version has version_no 1 and is discoverable only via the filtered-list GET."
        test_recipe:
          setup: ["Student es1 of cc6 with one submitted essay version"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC6", email: "cc6@x.com", hourly_rate_cents: 18000, weekly_review_capacity: 10 }
              as: PlatformAdmin
              captures: { cc6: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc6}", full_name: "ES1", email: "es1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc6}"
              captures: { es1: $.data.id }
            - call: "POST /essays"
              payload: { student_id: "${es1}", prompt: "P", word_limit: 650 }
              as: Student
              as_user_id: "${es1}"
              captures: { es1e: $.data.id }
            - call: "POST /essays/${es1e}/submit-version"
              payload: { word_count: 500, body: "draft" }
              as: Student
              as_user_id: "${es1}"
          trigger:
            - call: "GET /essay-versions?essay_id=${es1e}"
              payload: {}
              as: Counselor
              as_user_id: "${cc6}"
              captures: { vno: "$.data[0].version_no" }
          assert:
            - "response.status == 200"
            - "EssayVersion[0].version_no == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_void_from_active_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.EngagementContract.DRAFT_to_VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "void is only defined from DRAFT; voiding an ACTIVE contract returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Student vc1 of cc7 with an ACTIVE contract (no longer DRAFT)"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC7", email: "cc7@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { cc7: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc7}", full_name: "VC1", email: "vc1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc7}"
              captures: { vc1: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${vc1}", title: "A", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${cc7}"
            - call: "POST /students/${vc1}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${cc7}"
              captures: { vc1_v: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${vc1}", billing_model: "HOURLY", hourly_rate_cents: 20000, retainer_deposit_cents: 100000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${cc7}"
              captures: { vk1: $.data.id }
            - call: "POST /contracts/${vk1}/activate"
              payload: { expected_student_version: "${vc1_v}" }
              as: Counselor
              as_user_id: "${cc7}"
          trigger:
            - call: "POST /contracts/${vk1}/void"
              payload: {}
              as: Counselor
              as_user_id: "${cc7}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: essay_approve_without_revision_round_returns_revision_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.Essay.IN_REVIEW_to_APPROVED, "validations[priority=15.5]", "errors[ERR_REVISION_REQUIRED]"]
        distinguishing_aspect: "Approving an essay still at revision_round 0 (no completed review cycle) is rejected with ERR_REVISION_REQUIRED."
        test_recipe:
          setup: ["Student ea1 of cc8 with an essay IN_REVIEW after first submit (revision_round still 0)"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC8", email: "cc8@x.com", hourly_rate_cents: 18000, weekly_review_capacity: 10 }
              as: PlatformAdmin
              captures: { cc8: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc8}", full_name: "EA1", email: "ea1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc8}"
              captures: { ea1: $.data.id }
            - call: "POST /essays"
              payload: { student_id: "${ea1}", prompt: "P", word_limit: 650 }
              as: Student
              as_user_id: "${ea1}"
              captures: { ea1e: $.data.id }
            - call: "POST /essays/${ea1e}/submit-version"
              payload: { word_count: 500, body: "v1" }
              as: Student
              as_user_id: "${ea1}"
          trigger:
            - call: "POST /essays/${ea1e}/approve"
              payload: {}
              as: Counselor
              as_user_id: "${cc8}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REVISION_REQUIRED"

      - name: recommendation_invalid_transition_requested_to_submitted
        claim_type: Invalid Transitions
        grounds: [state_machines.RecommendationRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RecommendationRequest in REQUESTED cannot jump straight to SUBMITTED (must be ACCEPTED first) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Student rr1 of cc9 with a REQUESTED recommendation"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC9", email: "cc9@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc9: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc9}", full_name: "RR1", email: "rr1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc9}"
              captures: { rr1: $.data.id }
            - call: "POST /recommendations"
              payload: { student_id: "${rr1}", recommender_name: "Mr T", recommender_email: "t@x.com", rec_type: "TEACHER" }
              as: Student
              as_user_id: "${rr1}"
              captures: { rec1: $.data.id }
          trigger:
            - call: "POST /recommendations/${rec1}/transition"
              payload: { to_status: "SUBMITTED" }
              as: Counselor
              as_user_id: "${cc9}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: appointment_terminal_lockdown_cancel_after_cancel
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Appointment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED appointment is terminal; a second cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Student ap1 of cc10 with a CANCELLED appointment"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC10", email: "cc10@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc10: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc10}", full_name: "AP1", email: "ap1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc10}"
              captures: { ap1: $.data.id }
            - call: "POST /appointments"
              payload: { student_id: "${ap1}", start_utc: "2026-05-02T09:00:00Z", end_utc: "2026-05-02T10:00:00Z", meeting_type: "CHECK_IN" }
              as: Counselor
              as_user_id: "${cc10}"
              captures: { appt1: $.data.id }
            - call: "POST /appointments/${appt1}/cancel"
              payload: {}
              as: Counselor
              as_user_id: "${cc10}"
          trigger:
            - call: "POST /appointments/${appt1}/cancel"
              payload: {}
              as: Counselor
              as_user_id: "${cc10}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: appointment_complete_billing_hourly_ledger_sync
        claim_type: Side Effect Execution
        grounds: [state_machines.Appointment.BOOKED_to_COMPLETED, calculations.appointment_billed_amount, calculations.retainer_ledger]
        distinguishing_aspect: "Completing a 90-min appointment under an ACTIVE HOURLY contract (rate 20000/hr) posts a 30000-cent CHARGE; retainer_balance falls 200000 -> 170000; billed_minutes==90."
        test_recipe:
          setup: ["Student ac1 of cc11 with ACTIVE HOURLY contract (rate 20000, deposit 200000) and a BOOKED 90-min appointment; clock past start"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC11", email: "cc11@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc11}", full_name: "AC1", email: "ac1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc11}"
              captures: { ac1: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${ac1}", title: "A", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${cc11}"
            - call: "POST /students/${ac1}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${cc11}"
              captures: { ac1_v: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${ac1}", billing_model: "HOURLY", hourly_rate_cents: 20000, retainer_deposit_cents: 200000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${cc11}"
              captures: { ack: $.data.id }
            - call: "POST /contracts/${ack}/activate"
              payload: { expected_student_version: "${ac1_v}" }
              as: Counselor
              as_user_id: "${cc11}"
            - call: "POST /appointments"
              payload: { student_id: "${ac1}", start_utc: "2026-05-03T09:00:00Z", end_utc: "2026-05-03T10:30:00Z", meeting_type: "STRATEGY" }
              as: Counselor
              as_user_id: "${cc11}"
              captures: { acappt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appointments/${acappt}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cc11}"
              captures: { bm: $.data.billed_minutes }
          assert:
            - "Appointment.${acappt}.billed_minutes == 90"
            - "EngagementContract.${ack}.charged_cents == 30000"
            - "EngagementContract.${ack}.retainer_balance_cents == 170000"

      - name: appointment_complete_before_start_not_started
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.BOOKED_to_COMPLETED, "validations[priority=9]", "errors[ERR_APPOINTMENT_NOT_STARTED]"]
        distinguishing_aspect: "Completing a BOOKED appointment while the logical clock (default 2026-04-01) is before start_utc returns ERR_APPOINTMENT_NOT_STARTED."
        test_recipe:
          setup: ["Student an1 of cc12 with a BOOKED future appointment; clock left at default 2026-04-01"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC12", email: "cc12@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { cc12: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc12}", full_name: "AN1", email: "an1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc12}"
              captures: { an1: $.data.id }
            - call: "POST /appointments"
              payload: { student_id: "${an1}", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", meeting_type: "CHECK_IN" }
              as: Counselor
              as_user_id: "${cc12}"
              captures: { anappt: $.data.id }
          trigger:
            - call: "POST /appointments/${anappt}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cc12}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_STARTED"

      - name: essay_revision_demotes_ready_application_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Essay.IN_REVIEW_to_REVISION_REQUESTED, state_machines.Application.READY_to_IN_PROGRESS, entities.Application.fields.prep_status]
        distinguishing_aspect: "request-revision on an essay linked to a READY application demotes that application READY -> IN_PROGRESS (cross-entity cascade)."
        test_recipe:
          setup: ["Student er1 of cc13: Application made READY (no blocking tasks), then a NEW essay linked to it submitted and IN_REVIEW"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC13", email: "cc13@x.com", hourly_rate_cents: 18000, weekly_review_capacity: 10 }
              as: PlatformAdmin
              captures: { cc13: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc13}", full_name: "ER1", email: "er1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc13}"
              captures: { er1: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${er1}", title: "A", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${cc13}"
            - call: "POST /students/${er1}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${cc13}"
              captures: { er1_v: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${er1}", school_name: "Cas U", admit_rate: 0.50, median_sat: 1250, round: "RD" }
              as: Counselor
              as_user_id: "${cc13}"
              captures: { ersli: $.data.id }
            - call: "POST /school-list-items/${ersli}/select"
              payload: { expected_student_version: "${er1_v}" }
              as: Counselor
              as_user_id: "${cc13}"
            - call: "POST /applications"
              payload: { student_id: "${er1}", school_list_item_id: "${ersli}", round: "RD", deadline_utc: "2027-01-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${cc13}"
              captures: { erapp: $.data.id }
            - call: "POST /applications/${erapp}/start-prep"
              payload: {}
              as: Counselor
              as_user_id: "${cc13}"
            - call: "POST /applications/${erapp}/mark-ready"
              payload: {}
              as: Counselor
              as_user_id: "${cc13}"
            - call: "POST /essays"
              payload: { student_id: "${er1}", prompt: "P", word_limit: 650, application_id: "${erapp}" }
              as: Student
              as_user_id: "${er1}"
              captures: { eressay: $.data.id }
            - call: "POST /essays/${eressay}/submit-version"
              payload: { word_count: 500, body: "v1" }
              as: Student
              as_user_id: "${er1}"
          trigger:
            - call: "POST /essays/${eressay}/request-revision"
              payload: {}
              as: Counselor
              as_user_id: "${cc13}"
          assert:
            - "Application.${erapp}.prep_status == IN_PROGRESS"
            - "Essay.${eressay}.status == REVISION_REQUESTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: appointment_billed_amount_rounding_10min
        claim_type: Precision
        grounds: [calculations.appointment_billed_amount, entities.BillingEntry.fields.amount_cents]
        distinguishing_aspect: "A 10-minute appointment at 10000/hr bills round_half_up(10/60*10000)=1667 cents (single end-rounding), not 1666."
        test_recipe:
          setup: ["Student ab1 of cc14 with ACTIVE HOURLY contract rate 10000, deposit 5000; a BOOKED 10-min appointment; clock past start"]
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "CC14", email: "cc14@x.com", hourly_rate_cents: 10000 }
              as: PlatformAdmin
              captures: { cc14: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${cc14}", full_name: "AB1", email: "ab1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${cc14}"
              captures: { ab1: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${ab1}", title: "A", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${cc14}"
            - call: "POST /students/${ab1}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${cc14}"
              captures: { ab1_v: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${ab1}", billing_model: "HOURLY", hourly_rate_cents: 10000, retainer_deposit_cents: 5000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${cc14}"
              captures: { abk: $.data.id }
            - call: "POST /contracts/${abk}/activate"
              payload: { expected_student_version: "${ab1_v}" }
              as: Counselor
              as_user_id: "${cc14}"
            - call: "POST /appointments"
              payload: { student_id: "${ab1}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T09:10:00Z", meeting_type: "CHECK_IN" }
              as: Counselor
              as_user_id: "${cc14}"
              captures: { abappt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appointments/${abappt}/complete"
              payload: {}
