              captures: { rc_v: "$.data.version" }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "One growth block against a 75 percent utilization filing", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { req_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/allocation-requests/${req_id}/reviews"
              payload: { action: "APPROVE" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
          assert:
            - "HTTP 200, AllocationRequest.status == \"APPROVED\", granted_block_count == 1, assigned_block_ids == [${clean_id}]"
            - "GET /numbering/blocks/${clean_id} reads allocation_status == \"RESERVED\" and holder_carrier_id == ${a_id}"
            - "GET /numbering/blocks/${mid_id} and GET /numbering/blocks/${dirty_id} both still read allocation_status == \"POOL_AVAILABLE\" with holder_carrier_id null"
            - "GET /numbering/rate-centers/${rc_id} reads pooling_status == \"POOLED\", available_block_count == 2, assigned_block_count == 1"

      - name: aggregate_utilization_pools_numerators_before_rounding
        claim_type: aggregation
        grounds: ["calculations.rate_center_aggregate_utilization_pct.formula", "entities.RateCenter.fields.aggregate_utilization_pct"]
        excluded_because:
          difficulty_instance: combinatorial_formula / pooled_aggregate_utilization_sum_then_round
          rationale: "The named §1.8 instance already contrasts the pooled 58.09 against the forbidden average-of-rounded 39.20 for two holders in one rate center."

      - name: donation_rate_is_pinned_to_pre_donation_utilization
        claim_type: tiered_pricing
        grounds: ["calculations.pooling_donation_obligation.formula", "state_machines.RateCenter.transitions.TRANSITIONAL_to_POOLED"]
        excluded_because:
          difficulty_instance: combinatorial_formula / pooling_donation_obligation_pre_donation_tier_pinned
          rationale: "The named §1.8 instance already pins the 0.25 rate to the pre-donation 68.89 figure and asserts exactly one block moves where a fixed-point implementation donates none."

      - name: comment_tally_counts_oppose_both_without_weighting_it
        claim_type: weighted_scoring
        grounds: ["calculations.comment_tally_weighted.formula", "calculations.comment_tally_weighted.constants"]
        distinguishing_aspect: "Six comments produce support_overlay_weight 3.50 (1.0 + 1.0 + 1.5) against support_split_weight 3.00 (2.0 + 1.0) with comment_count 6: the GOVERNMENT comment at OPPOSE_BOTH raises the count by one but adds its weight of 3.00 to neither side, which would otherwise flip the recommendation."
        test_recipe:
          setup: ["NPA 614 was declared in jeopardy and its ReliefPlan opened a 30-day comment window at 2026-08-01T00:00:00Z, closing 2026-08-31T00:00:00Z. Six comments were filed inside the window: CONSUMER/SUPPORT_OVERLAY, CONSUMER/SUPPORT_OVERLAY, BUSINESS/SUPPORT_OVERLAY, CARRIER/SUPPORT_SPLIT, CONSUMER/SUPPORT_SPLIT and GOVERNMENT/OPPOSE_BOTH. The clock then reached the close instant."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "Exhaust projected inside four quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: "$.data.id" }
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "CONSUMER", position: "SUPPORT_OVERLAY", body: "Keep my number as it is" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "CONSUMER", position: "SUPPORT_OVERLAY", body: "An overlay avoids reprinting everything" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "BUSINESS", position: "SUPPORT_OVERLAY", body: "Signage and fleet livery costs favour an overlay" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "CARRIER", position: "SUPPORT_SPLIT", body: "A split keeps ten-digit dialing off our legacy switches" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "CONSUMER", position: "SUPPORT_SPLIT", body: "Seven-digit dialing should be preserved" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "GOVERNMENT", position: "OPPOSE_BOTH", body: "Neither option addresses our PSAP routing concerns" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "CLOSE_AND_RECOMMEND" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP 200, ReliefPlan.status == \"OVERLAY_RECOMMENDED\", recommended_relief_type == \"ALL_SERVICES_OVERLAY\""
            - "ReliefPlan.support_overlay_weight == 3.50, support_split_weight == 3.00, comment_count == 6"
            - "ReliefPlan.recommender_user_id == \"admin-1\""

      - name: audit_delta_of_exactly_five_points_is_probation
        claim_type: threshold
        grounds: ["calculations.audit_penalty_action.formula", "calculations.audit_penalty_action.constants.AUDIT_DELTA_PROBATION_PCT"]
        distinguishing_aspect: "The probation threshold is inclusive: a filing claiming 80.00 (1600/2000) audited to a strict 75.00 (1500/2000) is a delta of exactly 5.00, which must yield PROBATION rather than the NONE an exclusive comparison would return - and still not RECLAMATION_REFERRAL."
        test_recipe:
          setup: ["Carrier A holds a GRANTED licence. Its 2026-H1 filing for COLUMBUS is SUBMITTED with blocks_held 2, assigned 1400, intermediate 200 and no reserved, administrative or aging numbers, so claimed_utilization_pct is 80.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1400, numbers_intermediate: 200, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 2, forecast_quarters: [500, 500, 500, 500] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /numbering/utilization-filings/${f_id}/audit-findings"
              payload: { finding_type: "OVERSTATED_UTILIZATION", adjusted_numbers_assigned: 1500, adjusted_numbers_administrative: 0, disposition_note: "Intermediate numbers are not assigned inventory" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
          assert:
            - "HTTP 201, AuditFinding.adjusted_utilization_pct == 75.00 and penalty_action == \"PROBATION\""
            - "AuditFinding.status == \"OPEN\", auditor_user_id == \"admin-1\", disposed_by_user_id is null"
            - "GET /numbering/utilization-filings/${f_id} reads status == \"UNDER_AUDIT\", claimed_utilization_pct == 80.00 and strict_utilization_pct == 70.00 (1400/2000), stamped when the audit opened"
            - "GET /numbering/carriers/${a_id} still reads eligibility_status == \"ELIGIBLE\" - the penalty only lands on disposition"

      - name: sweep_reclaims_strictly_after_the_activation_deadline
        claim_type: interval_merge
        grounds: ["calculations.activation_and_aging_schedule.formula", "calculations.activation_and_aging_schedule.note"]
        distinguishing_aspect: "The reclamation pass uses a strict comparison: a sweep run at exactly the block's activation_due_at 2027-01-28T00:00:00Z issues zero orders, and the very next day's sweep issues one - so the boundary instant belongs to the carrier."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED and block 614-554-0 was loaded to it without mark_activated at 2026-08-01T00:00:00Z, so it is RESERVED with activation_due_at 2027-01-28T00:00:00Z and activated_at null. A first sweep was run at exactly 2027-01-28T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, holder_carrier_id: "${a_id}" }
              as: NumberingAdministrator
              captures: { blk_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-28T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/reclamation-sweeps"
              payload: { rate_center_id: "${rc_id}" }
              as: NumberingAdministrator
              captures: { boundary_orders: "$.data.orders_issued" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-29T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/reclamation-sweeps"
              payload: { rate_center_id: "${rc_id}" }
              as: NumberingAdministrator
              captures: { orders_issued: "$.data.orders_issued" }
          assert:
            - "${boundary_orders} == 0 and the block was still RESERVED after the 2027-01-28T00:00:00Z sweep"
            - "HTTP 200 and ${orders_issued} == 1, blocks_released == 0, routing_activated == 0, swept_at == \"2027-01-29T00:00:00Z\""
            - "GET /numbering/blocks/${blk_id} reads allocation_status == \"RECLAMATION_PENDING\" with routing_status still \"UNROUTED\""
            - "GET /numbering/reclamation-orders with number_block_id == ${blk_id} returns one row with reason == \"ACTIVATION_DEADLINE_MISSED\" and response_due_at == \"2027-02-28T00:00:00Z\""
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated_before_payload_checks
        claim_type: Priority Ordering
        grounds: ["validations[priority=1]", "validations[priority=3]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID AND a payload missing the required ocn returns the priority-1 ERR_UNAUTHENTICATED (401), never the priority-3 ERR_INVALID_REQUEST - authentication is decided before the body is inspected."
        test_recipe:
          setup: ["The logical clock is set. No headers are sent on the trigger call."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { legal_name: "Nameless Telecom LLC", carrier_type: "CLEC", home_state_code: "OH" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\""
            - "No Carrier row was created: a follow-up GET /numbering/carriers as NumberingAdministrator returns total_count == 0 with an empty data array"

      - name: public_commenter_creating_a_carrier_is_role_not_permitted
        claim_type: Priority Ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "endpoints[POST /numbering/carriers]"]
        distinguishing_aspect: "PublicCommenter is not on the roles list for carrier creation, so even a payload with an invalid carrier_type enum returns the priority-2 ERR_ROLE_NOT_PERMITTED (403) rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["The logical clock is set. The acting role is PublicCommenter with X-User-ID commenter-1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "MOBILE_VIRTUAL", home_state_code: "OH" }
              as: PublicCommenter
              as_user_id: "commenter-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\", not ERR_INVALID_REQUEST"

      - name: unknown_carrier_id_is_reported_before_unknown_rate_center_id
        claim_type: Priority Ordering
        grounds: ["validations[priority=5]", "errors[ERR_CARRIER_NOT_FOUND]", "endpoints[POST /numbering/allocation-requests]"]
        distinguishing_aspect: "Body foreign keys are resolved in payload declaration order, so a request naming BOTH an unknown carrier_id and an unknown rate_center_id returns ERR_CARRIER_NOT_FOUND - carrier_id is declared first - and never ERR_RATE_CENTER_NOT_FOUND."
        test_recipe:
          setup: ["A real rate center COLUMBUS exists under NPA 614 so that a live version number can be captured for the optimistic-concurrency field, but the request under test names two ids that do not exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_v: "$.data.version" }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "00000000-0000-4000-8000-000000000000", rate_center_id: "00000000-0000-4000-8000-000000000001", request_type: "GROWTH", requested_block_count: 1, justification: "Request naming two unknown foreign keys", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_CARRIER_NOT_FOUND\""
            - "No AllocationRequest row exists: GET /numbering/allocation-requests returns total_count == 0"

      - name: eligibility_check_outranks_the_utilization_threshold_check
        claim_type: Priority conflict
        grounds: ["validations[priority=13]", "validations[priority=30]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / carrier_eligibility_beats_utilization_threshold_on_approval
          rationale: "The named §1.8 instance already violates priority 13 and priority 30 on the same APPROVE call and asserts ERR_CARRIER_NOT_ELIGIBLE wins."

      - name: number_outside_block_outranks_the_routing_readiness_check
        claim_type: Priority conflict
        grounds: ["validations[priority=17]", "validations[priority=18]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / number_outside_block_beats_port_block_not_routed
          rationale: "The named §1.8 instance already files a port request that violates both rules at once and asserts ERR_NUMBER_OUTSIDE_BLOCK is returned."

      - name: initial_request_from_an_out_of_state_carrier_is_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=16]", "errors[ERR_JURISDICTION_MISMATCH]"]
        distinguishing_aspect: "The jurisdiction rule reaches across three entities on an INITIAL request only: a Michigan-domiciled carrier applying into an Ohio rate center under an Ohio NPA is rejected with ERR_JURISDICTION_MISMATCH (422) even though carrier, rate center and NPA are each individually valid and the carrier is fully ELIGIBLE."
        test_recipe:
          setup: ["Carrier E (ocn 7777, home_state_code MI) is licensed and VERIFIED, so eligibility_status is ELIGIBLE. NPA 614 is an Ohio code and its rate center COLUMBUS is state_code OH with no blocks loaded, so it still accepts INITIAL requests."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "7777", legal_name: "Great Lakes Telecom LLC", carrier_type: "CLEC", home_state_code: "MI", months_in_operation: 4 }
              as: NumberingAdministrator
              captures: { e_id: "$.data.id" }
            - call: "POST /numbering/carriers/${e_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${e_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "DTRTMI01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${e_id}"
            - call: "POST /numbering/carriers/${e_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id", rc_v: "$.data.version" }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${e_id}", rate_center_id: "${rc_id}", request_type: "INITIAL", requested_block_count: 1, justification: "Expansion into the Columbus market", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${e_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_JURISDICTION_MISMATCH\""
            - "GET /numbering/rate-centers/${rc_id} still reads pending_request_count == 0 and its version is unchanged"

      - name: rate_center_state_must_match_its_parent_npa_state
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "endpoints[POST /numbering/rate-centers]"]
        distinguishing_aspect: "The same jurisdiction rule also guards rate center creation: a rate center declared state_code MI under the Ohio NPA 614 is rejected with ERR_JURISDICTION_MISMATCH before any row is written."
        test_recipe:
          setup: ["NPA 614 exists with state_code OH and no rate centers."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "DETROIT", state_code: "MI", lata_code: "340" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_JURISDICTION_MISMATCH\""
            - "GET /numbering/npas/${npa_id}/rate-centers returns total_count == 0"

      - name: comment_filed_at_the_close_instant_is_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=21]", "errors[ERR_COMMENT_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / comment_at_window_close_instant_rejected_and_zero_comments_recommends_overlay
          rationale: "The named §1.8 instance already files a comment at exactly comment_window_close_at, asserts ERR_COMMENT_WINDOW_CLOSED, and closes the plan with zero comments."

      - name: routing_record_starting_before_the_open_record_is_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=19]", "errors[ERR_ROUTING_INTERVAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / routing_record_equal_start_allowed_earlier_start_rejected
          rationale: "The named §1.8 instance already asserts that an equal effective_at is adjacent and allowed while an earlier one returns ERR_ROUTING_INTERVAL_OVERLAP."

      - name: relief_plan_inside_the_ninety_day_buffer_is_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=20]", "errors[ERR_RELIEF_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / relief_plan_effective_date_must_clear_previous_window_by_ninety_days
          rationale: "The named §1.8 instance already files a second plan whose effective_at sits inside RELIEF_WINDOW_BUFFER_DAYS of the previous plan's window_end_at and asserts ERR_RELIEF_WINDOW_OVERLAP."

      - name: safety_valve_request_for_two_blocks_exceeds_the_limit
        claim_type: Aggregate validation
        grounds: ["validations[priority=32]", "calculations.growth_grant_size.constants.SAFETY_VALVE_MAX_BLOCKS"]
        distinguishing_aspect: "The safety-valve ceiling is checked at request time, not only at approval: a SAFETY_VALVE request asking for 2 blocks is a legal requested_block_count (1..10) yet violates SAFETY_VALVE_MAX_BLOCKS and returns ERR_SAFETY_VALVE_LIMIT_EXCEEDED (422) after the filing requirement at priority 29 has already been satisfied."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED with an effective SUBMITTED 2026-H1 filing for COLUMBUS, so the priority-29 filing requirement passes. safety_valve_grant_count is still 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 3000, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 4, forecast_quarters: [1500, 1500, 1500, 1500] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { rc_v: "$.data.version" }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "SAFETY_VALVE", requested_block_count: 2, justification: "Emergency numbering for a hospital campus cutover", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_SAFETY_VALVE_LIMIT_EXCEEDED\""
            - "GET /numbering/carriers/${a_id} reads safety_valve_grant_count == 0 and GET /numbering/rate-centers/${rc_id} reads pending_request_count == 0"

      - name: growth_request_without_an_effective_filing_is_rejected
