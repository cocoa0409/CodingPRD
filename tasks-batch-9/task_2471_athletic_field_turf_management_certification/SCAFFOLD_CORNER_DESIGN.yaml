      - name: condition_index_with_no_gmax_data_uses_the_no_data_safety_component
        claim_type: input_set_filtering
        grounds:
          - calculations.field_condition_index
          - entities.Field
        distinguishing_aspect: "A field that has never been impact-tested has latest_gmax_mean_value == null, so the safety component is the sentinel NO_DATA_SAFETY_COMPONENT = 50.00 rather than an absent term. Treating null as 0.00 yields 56.17; dropping the safety term and renormalising the remaining weights to 1.00 yields 80.24; only the sentinel yields 71.17."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: ${s_dir}
              captures: { f_ng: $.data.id }
          trigger:
            - call: "GET /turf/fields/${f_ng}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { ci: $.data.condition_index_agronomic, gmax: $.data.latest_gmax_mean_value }
          assert:
            - "the trigger returns data.latest_gmax_mean_value == null"
            - "the trigger returns data.condition_index_agronomic == 71.17 (wear_component 100.00 x 0.50 + age_component 30.83 x 0.20 + safety_component 50.00 x 0.30 = 71.166 rounded half-up)"
            - "the trigger returns data.age_years == 8.30 and data.cumulative_wear_units == 0.00, confirming the wear and age components are 100.00 and 30.83"
            - "GET /turf/safety-assessments?field_id=${f_ng} returns meta.total_count == 0"

      - name: certification_completeness_scores_full_when_every_component_is_satisfied
        claim_type: weighted_scoring
        grounds:
          - calculations.certification_document_completeness_score
          - calculations.field_condition_index
          - state_machines.CertificationPacket
        distinguishing_aspect: "Every one of the six weighted components is satisfied - two of them (agronomic program, remediation closure) only by the vacuous-compliance rule, since the field has zero planned tasks and zero opened orders in the 180-day window. The score must therefore be exactly 100.00. An implementation that scores an empty denominator as 0.00 instead of 1.00 reports 70.00. The spec component is driven by infill_depth_mm 51.0 / REQUIRED_INFILL_DEPTH_MM 51.0 = 1.00 exactly."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
