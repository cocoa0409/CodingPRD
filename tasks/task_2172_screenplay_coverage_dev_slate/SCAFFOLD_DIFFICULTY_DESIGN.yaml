          A boundary on a DIFFERENT metric (weighted approval percentage) reached through a
          DIFFERENT endpoint (POST /greenlight-reviews/{id}/close): 6000 approve over a decisive
          9000 rounds to exactly 66.67, which must PASS because GREENLIGHT_APPROVAL_PCT is an
