  # ===========================================================================
  # RULE 6 — boundary_precision_check on DIFFERENT metrics AND DIFFERENT
  #          endpoints.
  #   6a: metric renewal_score at RENEW_FLOOR (inclusive `>=`) observed through
  #       GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary.
  #   6b: metric archived_access_expires_at at the expiry instant (strict `<`)
  #       observed through GET /rostering/sections/{section_id}.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: renewal_score_exactly_at_renew_floor
        grounds:
          - calculations.renewal_recommendation_score
          - endpoints[GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary]
          - entities.VendorApp.fields.renewal_score
          - entities.VendorApp.fields.renewal_recommendation
          - entities.AppAccount.fields.active_minutes_total
        distinguishing_aspect: "The metric is renewal_score landing EXACTLY on RENEW_FLOOR = 70: with total_seats 5, four consumed and PROVISIONED seats, committed_charge_cents 4000 and exactly two accounts at exactly ENGAGEMENT_MINUTES_FLOOR = 120 minutes, raw = 0.50*0.8 + 0.30*0.5 + 0.20*0.75 = 0.70 and the score is 70.00. Because the tier test is `>=` and not `>`, 70.00 is RENEW; the one-engaged case scores 55.00 and is RENEGOTIATE, so the boundary is probed from below and exactly at, and 120 minutes itself is also an inclusive floor."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z and never advanced, so every activity_date of 2026-08-01 is inside the FINAL_RENEWAL USAGE_WINDOW_DAYS = 30 recency window and recency_ok holds for all accounts."
            - "One ACTIVE ELEMENTARY building with four ENROLLED students; Term Fall 2026 ACTIVE."
            - "An ACTIVE PER_STUDENT licence with total_seats 5 and price_per_seat_cents 1000, so utilization will be 4/5 = 0.8 exactly and committed_charge_cents will be 4000."
            - "Four AppAccounts, one per student, every one password-set so identity_status == PROVISIONED and the engagement denominator (consumed = 4) is fully populated."
