              payload: { emergency_event_id: "${ev}", reviewer_id: "${md1 }", hospital_reviewer_name: "Dr Z", device_data_retrieved: true, outcome_code: "DECEASED", notes: "second while already CASE_REVIEW" }
              as: MedicalDirector
              as_user_id: "${md1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE (state priority 5 wins over business_safety priority 6 even though reviewer is also the campus medical director)"

      - name: business_temporal_vs_business_referential_inspection_window
        grounds:
          - validations.priority_9_business_temporal
          - validations.priority_10_business_referential
          - errors.ERR_TEMPORAL_WINDOW_VIOLATION
          - errors.ERR_INCOMPATIBLE_REFERENCE
        distinguishing_aspect: |
          Pair (business_temporal, business_referential): inspection submitted
          outside its [scheduled_for, +7d] window AND with inspector_id referencing
          a non-existent Responder. Existence (priority 3) catches the bad FK
          first; to isolate temporal-vs-referential we use an inspector that
          exists but is on a DIFFERENT campus (referential mismatch), and a
          submit at scheduled_for+8d (temporal violation). Temporal (priority 9)
          beats referential (priority 10).
        test_recipe:
          setup:
            - "Two campuses C-A, C-B. Device on C-A. Inspector on C-B. Inspection scheduled for 2026-09-01; submit attempted at 2026-09-09 (>7 days)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M10", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C-A", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-010", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { ca: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C-B", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-011", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { cb: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${ca}", device_model_id: "${dm }", serial_number: "SN-010" }
              as: ProgramManager
              captures: { dev: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${cb}", full_name: "Insp B", badge_number: "IN-B", responder_role: "INSPECTOR" }
              as: ProgramManager
              captures: { insp_b: $.data.id }
            - call: "POST /api/inspections"
              payload: { device_id: "${dev}", inspector_id: "${insp_b }", scheduled_for: "2026-09-01T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_b}"
              captures: { insp: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/inspections/${insp}/submit"
              payload: { checklist_items: [{item_code: "PADS_OK", result: "PASS"}] }
              as: Inspector
              as_user_id: "${insp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_TEMPORAL_WINDOW_VIOLATION (priority 9 beats referential priority 10)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: response_time_target_equality_boundary
        grounds:
          - calculations.response_time_estimate_seconds
          - calculations.coverage_score_percent
          - validations.priority_9_business_temporal
        distinguishing_aspect: |
          Boundary on coverage: a zone is covered when PESSIMISTIC response_time
          <= target (inclusive). Pinned at exactly equals: a cabinet whose
          pessimistic walk == target_seconds is COVERED; one second slower is
          NOT COVERED. Endpoint: GET /campuses/{id}/coverage-report.
        test_recipe:
          setup:
            - "Campus target=9s. Zone with avg_walk_speed_mps=1.5, no elevator. Cabinet A at (x,y) so manhattan*1.3/1.5 rounds to 9; Cabinet B so it rounds to 10."
            - "Cabinet A: manhattan = 10m → 10*1.3/1.5 = 8.667 → round_half_up = 9s."
            - "Cabinet B: manhattan = 12m → 12*1.3/1.5 = 10.4 → round_half_up = 10s."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C11", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-012", medical_director_id: "md-tbd", response_time_target_seconds: 9 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "ZA", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { za: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "ZB", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zb: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${za}", location_label: "LA", centroid_x_m: 10.0, centroid_y_m: 0.0 }
              as: ProgramManager
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zb}", location_label: "LB", centroid_x_m: 12.0, centroid_y_m: 0.0 }
              as: ProgramManager
          trigger:
            - call: "GET /api/campuses/${campus_id}/coverage-report"
              payload: {}
              as: ProgramManager
          assert:
            - "per_zone[ZA].covered == 1 (pessimistic 9s <= 9s target — inclusive boundary)"
            - "per_zone[ZB].covered == 0 (pessimistic 10s > 9s)"
            - "coverage_pct == 50 (1 of 2 zones covered)"

      - name: training_session_capacity_zero_remaining_boundary
        grounds:
          - validations.priority_11_business_constraint
          - errors.ERR_TRAINING_FULL
          - entities.TrainingSession.fields.capacity
        distinguishing_aspect: |
          Boundary on TrainingSession.capacity: enroll is allowed while
          enrolled_count < capacity; the enroll that brings enrolled_count ==
          capacity succeeds; the NEXT enroll fails ERR_TRAINING_FULL. Distinct
          metric (collection count vs zero), distinct endpoint
          (POST /training-sessions/{id}/enroll).
        test_recipe:
          setup:
            - "TrainingSession with capacity=1. One enrolled responder."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C12", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-013", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "MD", badge_number: "MD-12", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "R1", badge_number: "R-12a", responder_role: "LAY_RESPONDER" }
              as: ProgramManager
              captures: { r1: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "R2", badge_number: "R-12b", responder_role: "LAY_RESPONDER" }
              as: ProgramManager
              captures: { r2: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${campus_id}", instructor_id: "${md }", starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-10-01T04:00:00Z", capacity: 1, certification_months_granted: 24 }
              as: ProgramManager
              captures: { ts: $.data.id }
            - call: "POST /api/training-sessions/${ts}/enroll"
              payload: { responder_id: "${r1}" }
              as: ProgramManager
