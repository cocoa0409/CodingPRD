      - name: each_addressed_path_id_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PRESCRIPTION_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_PRESCRIBER_NOT_FOUND]
