            - "trigger call 5: HTTP 422 with error_id ERR_INSUFFICIENT_NOTICE - zero hours have elapsed; attempt_count 1 also breaches gate 180, but priority 170 answers first"
            - "trigger call 7: HTTP 422 with error_id ERR_INSUFFICIENT_ATTEMPTS - at exactly 72 hours the notice gate is satisfied inclusively, which is the only reason gate 180 becomes reachable"
            - "trigger call 8: HTTP 200; attempt_count 2, status still \"NOTICE_SENT\", notice_sent_at and response_deadline_at UNCHANGED by the second attempt, documented_attempts has two entries with channels EMAIL then PHONE"
            - "trigger call 10: HTTP 200; Investigation.status == \"PUBLISHED\", published_at == \"2026-08-06T10:00:00Z\", applicable_risk_variant == \"NONE\", disclosure_risk_score == 0, release_dataset_id == null"
            - "trigger call 10: the publication SYSTEM PRE-STEP moved the SubjectResponseRequest from NOTICE_SENT to \"NO_RESPONSE\" because response_deadline_at 2026-08-06T09:00:00Z is now strictly past, and publication still succeeds because the notice and attempt gates are both satisfied - NO_RESPONSE is not itself a blocking state"
            - "none of the four refusals bumped Investigation.version: the version after trigger call 10 is exactly one greater than the version after trigger call 2"

  - section: endpoints
    instances:
      - name: enclave_closure_reconciles_the_document_count_and_then_frees_the_window
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /records-desk/enclave-sessions/{id}/closure]
          - calculations.enclave_occupancy_span
          - state_machines.EnclaveSession.BOOKED_to_CLOSED
        distinguishing_aspect: |
          The closure endpoint is three things at once: an arithmetic reconciliation (documents_returned_count
          must equal document_count, else 400), a one-way state transition (a second closure is 409, not an
          idempotent replay), and an occupancy release. The release is the interesting part: a booking that
          is refused for overlapping the buffered span of the BOOKED session must succeed, byte-identical,
          once that session is CLOSED - the buffer follows the live booking, not the calendar slot.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. Desk, Agency, one RELEASED RecordsRequest, one Investigation, one CLEAN_LOCKED Dataset."
            - "SecureEnclave reading-room: max_documents 5, sanitization_buffer_minutes 30."
            - "One BOOKED EnclaveSession over [2026-09-10T09:00:00Z, 2026-09-10T11:00:00Z) with document_count 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Sealed Records Office", jurisdiction_code: "CA-SEAL", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 15, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Sealed intake logs", requested_format: "PDF_SCAN", estimated_page_count: 40, waiver_requested: false, public_interest_score: 50, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "RELEASED_FULL" }
              as: RecordsCoordinator
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Sealed intake logs probe", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "sealed-intake-logs", negotiated_format: "PDF_SCAN", expected_field_count: 1, sensitivity_tier: "CONFIDENTIAL" }
              as: DataReporter
              captures: { ds_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/delivery"
              payload: { delivered_format: "PDF_SCAN", record_count: 120 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "intake_id", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 2, is_source_identifying: false }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/cleaning-lock"
              payload: { cleaning_notes: "Pages indexed and hashed." }
              as: DataReporter
            - call: "POST /records-desk/secure-enclaves"
              payload: { name: "Reading Room A", max_documents: 5, sanitization_buffer_minutes: 30 }
              as: LegalCounsel
              captures: { enclave_id: $.data.id }
            - call: "POST /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", dataset_id: "${ds_id}", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T11:00:00Z", document_count: 4, purpose: "First read of the intake logs." }
              as: LegalCounsel
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /records-desk/enclave-sessions/${session_id}/closure"
              payload: { documents_returned_count: 3 }
              as: LegalCounsel
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", dataset_id: "${ds_id}", start_at: "2026-09-10T11:15:00Z", end_at: "2026-09-10T12:00:00Z", document_count: 2, purpose: "Second read, inside the sanitization buffer." }
              as: DataReporter
              captures: { e2: $.data.error_id }
            - call: "POST /records-desk/enclave-sessions/${session_id}/closure"
              payload: { documents_returned_count: 4 }
              as: LegalCounsel
            - call: "POST /records-desk/enclave-sessions/${session_id}/closure"
              payload: { documents_returned_count: 4 }
              as: LegalCounsel
              captures: { e3: $.data.error_id }
            - call: "POST /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", dataset_id: "${ds_id}", start_at: "2026-09-10T11:15:00Z", end_at: "2026-09-10T12:00:00Z", document_count: 2, purpose: "Second read, now that the room is released." }
              as: DataReporter
              captures: { session2_id: $.data.id }
            - call: "GET /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", limit: 10, offset: 0 }
              as: LegalCounsel
          assert:
            - "trigger call 1: HTTP 400 with error_id ERR_INVALID_REQUEST - 3 returned against document_count 4 is a reconciliation failure, and the session must still be \"BOOKED\" with its version unchanged"
            - "trigger call 2: HTTP 409 with error_id ERR_ENCLAVE_SESSION_OVERLAP - 11:15 falls inside the 30-minute sanitization buffer that extends the BOOKED session's occupancy to 11:30"
            - "trigger call 3: HTTP 200; status == \"CLOSED\" and documents_returned_count == 4"
            - "trigger call 4: HTTP 409 with error_id ERR_INVALID_SESSION_STATE - closure runs only from BOOKED, so the second call is a refusal and not an idempotent replay; documents_returned_count is still 4 and version did not move again"
            - "trigger call 5: HTTP 201 on the byte-identical payload that was refused in call 2 - closing the earlier session released its buffered occupancy"
            - "trigger call 6: total_count == 2, one CLOSED and one BOOKED, and the refused bookings from calls 1, 2 and 4 left no rows behind"

      - name: fee_determination_commits_once_and_the_second_call_is_refused
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /records-desk/records-requests/{id}/fee-determination]
          - calculations.desk_fee_budget_ledger
          - entities.RecordsRequest.fields.fee_determined_at
        distinguishing_aspect: |
          The determination endpoint both computes and COMMITS, so a re-run would double-commit desk
          money. The guard is a stamped timestamp rather than a status, which means a request that is
          still in the same state must nevertheless refuse the second call, and it must refuse it before
          recomputing anything: the second payload names larger numbers, and neither the request's fee
          fields nor the desk ledger may move by a single cent.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. Desk with fee_budget_total_cents 500000."
            - "Agency: search_fee_cents_per_hour 3500, page_fee_cents 25, max_waiver_cents 10000."
            - "One RecordsRequest with waiver_requested false, submitted and in AWAITING_AGENCY_RESPONSE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 15, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Single-shot fee probe", requested_format: "CSV", estimated_page_count: 100, waiver_requested: false, public_interest_score: 0, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
          trigger:
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 1.0, billed_page_count: 100 }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 9.0, billed_page_count: 900 }
              as: RecordsCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /records-desk/records-requests/${req_id}"
              as: RecordsCoordinator
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
          assert:
            - "trigger call 1: HTTP 200; search_fee_cents == 3500, duplication_fee_cents == 2500, gross_fee_cents == 6000, waiver_pct == 0.0, waiver_amount_cents == 0, net_fee_cents == 6000, fee_committed_cents == 6000, fee_determined_at == \"2026-08-03T09:00:00Z\""
            - "trigger call 2: HTTP 409 with error_id ERR_FEE_ALREADY_DETERMINED"
            - "trigger call 3: every fee field still holds the call-1 values - gross_fee_cents == 6000 and net_fee_cents == 6000, NOT the 54000 the second payload would have produced - and RecordsRequest.version is unchanged"
            - "trigger call 4: fee_budget_committed_cents == 6000 (not 12000), fee_budget_available_cents == 494000, fee_budget_spent_cents == 0 and total == available + committed + spent == 500000"
            - "trigger call 4: Desk.version is unchanged from the value after trigger call 1, so the refused determination performed no ledger write at all"

      - name: disclosure_risk_preview_is_a_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /records-desk/investigations/{id}/disclosure-risk-preview]
        excluded_because:
          difficulty_instance: disclosure_risk_aggregate_max_versus_composite_weighted
          rationale: |
            That instance calls the preview endpoint as its sole trigger and asserts both variant scores,
            the selected variant, the blocking reason and that the investigation row is unchanged
            afterwards - which is exactly the computed-read claim: derived data matching the calculation
            with no persistence.

      - name: review_assignment_links_a_reviewer_to_a_finding
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /records-desk/review-assignments]
        excluded_because:
          difficulty_instance: reviewer_closed_window_aggregate_capacity_at_the_touching_endpoint
          rationale: |
            Three assignments are created there against one reviewer and distinct findings, with the
            reviewer's active_assignment_count and the per-window capacity asserted after each link, so
            both halves of the cross-reference claim (both entities must exist, the association is
            recorded on both sides) are already driven.

  - section: errors
    instances:
