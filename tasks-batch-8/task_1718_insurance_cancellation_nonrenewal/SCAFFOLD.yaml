    side_effects: ["status -> WITHDRAWN"]
  - method: POST
    path: "/carrier/cancellation-cases/{caseId}/rescind"
    description: "Rescind an APPROVED or NOTICE_SENT cancellation before effectiveness"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: CancellationCase
    side_effects:
      - "status -> RESCINDED; Policy.status -> ACTIVE"
      - "RegulatoryReport rescinded_count += 1"
      - "increments Policy.version by 1"
  - method: POST
    path: "/carrier/cancellation-cases/{caseId}/dispatch-notices"
    description: "Dispatch the full statutory notice set for an APPROVED case"
    roles: [Underwriter]
    code: 200
    input: [notices]
    output: "NoticeRecord[]"
    side_effects:
      - "CancellationCase.status -> NOTICE_SENT"
      - "Create one NoticeRecord (status MAILED) per payload entry"

  # --- Nonrenewal cases ---
  - method: POST
    path: "/carrier/nonrenewal-cases"
    description: "Open a NonrenewalCase (PENDING_APPROVAL)"
    roles: [Underwriter]
    code: 201
    input: [policy_id, reason_code, reason_text, content_codes_present]
    output: NonrenewalCase
    side_effects:
      - "status -> PENDING_APPROVAL"
      - "Compute notice_deadline_date"
  - method: GET
    path: "/carrier/nonrenewal-cases/{caseId}"
    description: "Get a NonrenewalCase"
    roles: [ComplianceOfficer, Underwriter, Policyholder]
    code: 200
    input: []
    output: NonrenewalCase
    side_effects: []
  - method: GET
    path: "/carrier/nonrenewal-cases"
    description: "List NonrenewalCases"
    roles: [ComplianceOfficer, Underwriter, Policyholder]
    code: 200
    input: ["policy_id?", "status?"]
    output: "NonrenewalCase[]"
    side_effects: []
  - method: POST
    path: "/carrier/nonrenewal-cases/{caseId}/approve"
    description: "Approve a PENDING_APPROVAL nonrenewal"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: NonrenewalCase
    side_effects:
      - "status -> APPROVED; decided_on_date = current clock date; Policy.status -> NONRENEWAL_PENDING"
      - "increments Policy.version by 1"
  - method: POST
    path: "/carrier/nonrenewal-cases/{caseId}/rescind"
    description: "Rescind an APPROVED nonrenewal"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: NonrenewalCase
    side_effects:
      - "status -> RESCINDED; Policy.status -> ACTIVE"
      - "RegulatoryReport rescinded_count += 1"
      - "increments Policy.version by 1"
  - method: POST
    path: "/carrier/nonrenewal-cases/{caseId}/dispatch-notices"
    description: "Dispatch statutory nonrenewal notices"
    roles: [Underwriter]
    code: 200
    input: [notices]
    output: "NoticeRecord[]"
    side_effects:
      - "NonrenewalCase.status -> NOTICE_SENT"
