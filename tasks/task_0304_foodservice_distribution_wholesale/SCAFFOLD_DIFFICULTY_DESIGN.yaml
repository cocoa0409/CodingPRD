  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_delivery_gap_buffer_conflict
        grounds:
          - validations[priority=11]
          - errors[ERR_DELIVERY_GAP_CONFLICT]
          - entities.Route.fields.min_delivery_gap_days
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Buffer/adjacency interval semantics on the Route resource: with min_delivery_gap_days=10, a second order whose
          delivery (2026-06-24, the next Wednesday) is only 7 days from an existing active order's delivery (2026-06-17)
          is rejected ERR_DELIVERY_GAP_CONFLICT because abs(7) < 10 — the two delivery dates' buffer windows overlap.
        test_recipe:
          setup:
            - "Route R delivery_dow=2 (Wed), min_delivery_gap_days=10."
            - "Order A delivery 2026-06-17 (Wed) submitted (active)."
            - "Order B delivery 2026-06-24 (next Wed, 7 days later) submit must conflict since 7 < 10."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 10 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { oa: $.data.id }
            - call: "POST /orders/${oa}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { oa_line: $.data.id }
            - call: "POST /orders/${oa}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /customers/${cust}"
              payload: {}
              as: SalesRep
              captures: { cust_v2: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-24T00:00:00Z" }
              as: SalesRep
              captures: { ob: $.data.id }
            - call: "POST /orders/${ob}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { ob_line: $.data.id }
          trigger:
            - call: "POST /orders/${ob}/submit"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DELIVERY_GAP_CONFLICT"

      - name: lot_freshness_window_containment_conflict
        grounds:
          - validations[priority=13]
          - errors[ERR_LOT_EXPIRES_BEFORE_DELIVERY]
          - entities.InventoryLot.fields.expires_on
          - state_machines.Order.SUBMITTED_to_SUBMITTED
        distinguishing_aspect: |
          Containment (half-open [received, expires_on)) interval semantics on the InventoryLot resource: a perishable
          line's only lot expires 2026-06-16 while delivery is 2026-06-17, so the delivery instant is NOT contained in
          the lot's freshness window and approve-credit is rejected ERR_LOT_EXPIRES_BEFORE_DELIVERY. Different geometry
          (containment) and resource (InventoryLot) than the Route buffer instance.
        test_recipe:
          setup:
            - "Perishable Product P, no substitute. One lot expires_on 2026-06-16T00:00:00Z (on/before delivery)."
            - "Order O delivery 2026-06-17, one CASE line of P, submitted; approve-credit must reject."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Milk", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: true, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", expires_on: "2026-06-16T00:00:00Z", on_hand_splits: 24 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_LOT_EXPIRES_BEFORE_DELIVERY"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_approved_order_restores_ar_balance_invariant
        grounds:
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - state_machines.Order.SUBMITTED_to_SUBMITTED
          - entities.Customer.fields.ar_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.ar_balance_cents. approve-credit debits ar_balance by order_total; cancelling the
          approved-but-unpicked order credits it back by the same order_total, so ar_balance returns to its pre-approval
          value (0). Invariant: ar_balance_after_cancel == ar_balance_before_approve == 0.
        test_recipe:
          setup:
            - "Customer C ar_balance 0. Order O 2 cases (24 splits, total 4800) submitted then approved (ar_balance 4800)."
            - "Order is cancelled while still SUBMITTED+APPROVED (before pick)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          trigger:
            - call: "POST /orders/${order}/cancel"
              payload: {}
              as: SalesRep
          assert:
            - "Order.${order}.fulfillment_status == CANCELLED"
            - "Customer.${cust}.ar_balance_cents == 0"
            - "InventoryLot.${lot}.reserved_splits == 0"

      - name: cancel_approved_order_restores_lot_reservation_invariant
        grounds:
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - state_machines.Order.SUBMITTED_to_SUBMITTED
          - entities.InventoryLot.fields.reserved_splits
          - entities.InventoryLot.fields.on_hand_splits
        distinguishing_aspect: |
          Conserved quantity = lot available capacity (on_hand_splits - reserved_splits). approve-credit reserves 24
          splits (available 24->0); cancel releases them (available 0->24). Invariant: lot.on_hand_splits - lot.reserved_splits
          returns to its pre-approval value (24). Different conserved quantity (inventory capacity vs AR money) than the AR instance.
        test_recipe:
          setup:
            - "Customer C; one lot of 24 splits (available 24). Order O 2 cases (24 splits) approved -> available 0."
            - "Order cancelled -> reservation released -> available back to 24."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
