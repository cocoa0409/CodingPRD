# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1139: Contingent Labor Rate Card & SOW Management
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is directly
# transcribable into a pytest fixture from empty-DB.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: timesheet_provisional_vs_final_billing
        grounds:
          - calculations.timesheet_billing
          - state_machines.Timesheet.DRAFT_to_SUBMITTED
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Two valid billing variants on the SAME Timesheet inputs diverge:
          PROVISIONAL uses submitted_hours × unclamped bill rate (37.5 × 9500 =
          356250) while FINAL uses approved_hours × ceiling-clamped rate
          (35.0 × min(9500, 12000) = 332500); only FINAL is ledgered. Entity
          domain: Timesheet billing — distinct from conversion_fee's
          ConversionRequest domain.
        test_recipe:
          setup:
            - "ACTIVE rate card SWE/JAVA/US-CA, ceiling 12000, floor 5000, max_markup 0.25, window [2026-01-01, 2027-01-01)"
            - "Supplier S1 PREFERRED ACTIVE"
            - "REQUISITION engagement E1 ACTIVE with awarded supplier S1, budget 1000000"
            - "Worker W1 (supplier S1) with ACTIVE assignment A1: bill 9500, pay 8000, [2026-05-01, 2026-08-31]"
            - "Timesheet T1 SUBMITTED with submitted_hours 37.5 for period [2026-05-04, 2026-05-10]"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Alpha Staffing", supplier_code: "SUP-A1", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Backend buildout", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 6, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 37.5 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t1_id: "$.data.id" }
            - { call: "POST /v1/timesheets/${t1_id}/submit", payload: {}, as: Worker, as_user_id: "${w1_id}" }
          trigger:
            - call: "POST /v1/timesheets/${t1_id}/approve"
              payload: { approved_hours: 35.0 }
              as: HiringManager
              captures: { fin_amt: "$.data.final_amount_cents" }
            - call: "GET /v1/spend-ledger-entries"
              payload: { timesheet_id: "${t1_id}" }
              as: FinanceAnalyst
              captures: { led_delta: "$.data[0].delta_cents" }
          assert:
            - "Timesheet.${t1_id}.provisional_amount_cents == 356250 (37.5 x 9500, PROVISIONAL variant at submit)"
            - "Timesheet.${t1_id}.final_amount_cents == 332500 (35.0 x min(9500,12000), FINAL variant at approve) — the two variants diverge on identical assignment/rate data"
            - "SpendLedgerEntry delta == 332500 — only the FINAL variant is ledgered; the provisional 356250 never touches the ledger"
            - "Timesheet.${t1_id}.status == APPROVED and approved_hours == 35.0"

      - name: conversion_fee_schedule_vs_prorata
        grounds:
          - calculations.conversion_fee
          - calculations.tenure_accumulation
          - state_machines.ConversionRequest
        distinguishing_aspect: |
          Identical tenure (62 days) yields two different fees by variant:
          SCHEDULE band <180 -> 2,500,000 vs PRORATA round_half_up(2,500,000 x
          (1 - 62/730)) = 2,287,671. Variant selection is pinned:
          PRORATA iff engagement.prorata_conversion AND supplier.tier ==
          PREFERRED. Entity domain: ConversionRequest fees — distinct from
          timesheet_provisional_vs_final_billing's Timesheet domain.
        test_recipe:
          setup:
            - "Rate card ACTIVE, window [2026-01-01, 2027-01-01)"
            - "Supplier SP PREFERRED; supplier SB APPROVED"
            - "Engagement EA (prorata_conversion true) staffed by SP's worker WA; engagement EB (prorata_conversion true) staffed by SB's worker WB"
            - "Both assignments ACTIVE with start_date 2026-03-01; logical clock 2026-05-01 -> tenure 62 days for both workers"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Preferred Staffing", supplier_code: "SUP-P", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /v1/suppliers"
              payload: { name: "Budget Staffing", supplier_code: "SUP-B", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { sb_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Prorata engagement", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 12, budget_cents: 5000000, prorata_conversion: true }
              as: HiringManager
              captures: { ea_id: "$.data.id" }
            - { call: "POST /v1/engagements/${ea_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${ea_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${ea_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { oa_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${oa_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${sp_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${sp_id}", full_name: "Worker A", email: "wa@example.com" }
              as: SupplierCoordinator
              as_user_id: "${sp_id}"
              captures: { wa_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${wa_id}", engagement_id: "${ea_id}", offer_id: "${oa_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-03-01", end_date: "2026-12-31" }
              as: ProgramAdmin
              captures: { aa_id: "$.data.id" }
            - { call: "POST /v1/assignments/${aa_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/engagements"
              payload: { title: "Schedule engagement", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 12, budget_cents: 5000000, prorata_conversion: true }
              as: HiringManager
              captures: { eb_id: "$.data.id" }
            - { call: "POST /v1/engagements/${eb_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${eb_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${eb_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { ob_id: "$.data[1].id" }
            - { call: "POST /v1/distribution-offers/${ob_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${sb_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${sb_id}", full_name: "Worker B", email: "wb@example.com" }
              as: SupplierCoordinator
              as_user_id: "${sb_id}"
              captures: { wb_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${wb_id}", engagement_id: "${eb_id}", offer_id: "${ob_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-03-01", end_date: "2026-12-31" }
              as: ProgramAdmin
              captures: { ab_id: "$.data.id" }
            - { call: "POST /v1/assignments/${ab_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - call: "POST /v1/conversion-requests"
              payload: { worker_id: "${wa_id}", assignment_id: "${aa_id}" }
              as: HiringManager
              captures: { ra_id: "$.data.id", fee_a: "$.data.fee_cents", var_a: "$.data.fee_variant", ten_a: "$.data.tenure_days_at_request" }
            - call: "POST /v1/conversion-requests"
              payload: { worker_id: "${wb_id}", assignment_id: "${ab_id}" }
              as: HiringManager
              captures: { rb_id: "$.data.id", fee_b: "$.data.fee_cents", var_b: "$.data.fee_variant", ten_b: "$.data.tenure_days_at_request" }
          assert:
            - "ConversionRequest.${ra_id}.tenure_days_at_request == 62 and fee_variant == PRORATA (prorata flag true AND supplier PREFERRED)"
            - "ConversionRequest.${ra_id}.fee_cents == 2287671 (round_half_up(2500000 x (1 - 62/730)))"
            - "ConversionRequest.${rb_id}.tenure_days_at_request == 62 and fee_variant == SCHEDULE (tier gate fails for APPROVED supplier despite prorata flag)"
            - "ConversionRequest.${rb_id}.fee_cents == 2500000 (band < 180 days -> 100% of base)"
            - "fee_a != fee_b on identical tenure — dual-variant divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: supplier_tier_score_weighted_with_branch
        grounds:
          - calculations.supplier_tier_score
          - calculations.markup_transparency_check
          - state_machines.Supplier
        distinguishing_aspect: |
          Mode (a) combinatorial: 4 inputs (offers_filled 4, offers_made 4,
          completed 4, open_violations 1) with nested min/max clamps and an
          insufficient-data conditional branch; result lands exactly on the
          APPROVED band boundary: round_half_up(100 x (0.4x1.0 + 0.4x0.75 +
          0.2x0)) = 70 -> APPROVED (>= rule). Distinct mode from
          invoice_per_line_rounding_then_sum (mode b) and
          invoice_fee_tiered_on_prefee_subtotal (mode c).
        test_recipe:
          setup:
            - "Supplier S1 created PREFERRED; 4 REQUISITION engagements each distributed to S1 (only supplier in DB), offer accepted, worker booked, assignment completed -> offers_made 4, offers_filled 4, completed 4"
            - "Rate card revised with max_markup 0.10 effective 2026-06-01; clock at 2026-06-15; audit run on one assignment (markup 0.1875 > min(0.10, 0.25)) -> exactly 1 OPEN MARKUP_EXCEEDED finding"
