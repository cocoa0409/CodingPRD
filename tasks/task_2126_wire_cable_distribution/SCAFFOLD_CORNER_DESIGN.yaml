              as_user_id: "${br_id}"
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /allocations/${a1_id}/pick"
              as: BranchOps
              as_user_id: "${br_id}"
          trigger:
            - call: "POST /delivery-runs"
              payload: { sales_order_id: "${so_id}", truck_id: "${tr_id}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z", jobsite_address: "9 Ship Channel", jobsite_has_forklift: true }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { run_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
