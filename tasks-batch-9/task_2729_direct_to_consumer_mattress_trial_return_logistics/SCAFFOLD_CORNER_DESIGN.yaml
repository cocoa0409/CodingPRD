            - "trigger call 3: response code == 200 with status == APPROVED and replacement_order_id == ${order2}"
            - "TrialOrder.${order_id}.fulfillment_status == REPLACED and trial_status == EXCHANGED"
            - "TrialOrder.${order2}.exchanged_from_order_id == ${order_id} and exchange_chain_depth == 1"

