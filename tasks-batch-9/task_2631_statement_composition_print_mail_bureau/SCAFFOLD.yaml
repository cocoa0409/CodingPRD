scenario: |
  Generate task harder than expert level!

  2631. Statement Composition & Print-Mail Bureau (customer communications outsourcing bureau): client data file receipt with format validation, record counts and control totals before processing, document composition with template management, variable content rules and regulatory-required inserts, address hygiene, presort processing and postage optimization across mail classes, print production scheduling across duplex, color and inserting equipment with capacity balancing, mail piece integrity verification with barcode scanning at each stage to confirm one-to-one integrity, electronic delivery alternatives with suppression files and paperless enrollment synchronization, undeliverable mail return processing with address update feedback to the client, service level tracking on job turnaround with penalty exposure and disaster recovery site readiness

domain_name: statement-composition-print-mail-bureau
api_prefix: "/bureau"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  # MailPiece is a three-way junction (CompositionJob x StatementRecord x PresortBatch) and is
  # additionally self-referential through reprint_of_piece_id; PrintRun joins CompositionJob to
  # PressLine; PresortBatch joins CompositionJob to EntryFacility. No single ownership tree exists.

  state_machine_shape: parallel
  # MailPiece carries two independent state dimensions (piece_status x integrity_status) that
  # evolve on the same row. DataFile is cyclic (HELD_VARIANCE -> RECEIVED), CompositionJob is
  # cyclic (PRINTING -> PRESORTED on abort, INTEGRITY_HELD -> PRINTED on reprint),
  # UndeliverableReturn is fork-join, PaperlessEnrollment is cyclic (REVOKED -> PENDING).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The PostageController who sealed a PresortBatch may not manifest it (postage liability
  # separation). ClientLiaison is entity-backed and scoped to its own Client.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: client_code
        type: string
        source: input
        description: Bureau-assigned client identifier, unique across all Clients.
        constraints: "uppercase A-Z and 0-9 only, length 3..10; unique globally"
      - name: name
        type: string
        source: input
        description: Legal name of the issuing client.
        constraints: "length 1..120"
      - name: sla_turnaround_hours
        type: integer
        source: input
        description: Contracted turnaround from DataFile acceptance to job close.
        default: 48
        constraints: ">= 1 and <= 336"
      - name: sla_penalty_rate_cents_per_hour
        type: integer
        source: input
        description: Penalty accrual per whole overdue hour used by sla_penalty calculation.
        default: 2500
        constraints: ">= 0"
      - name: sla_penalty_cap_cents
        type: integer
        source: input
        description: Upper clamp applied to both penalty variants.
        default: 500000
        constraints: ">= 0"
      - name: dr_readiness_required
        type: boolean
        source: input
        description: When true, scheduling a PrintRun requires the DrSite to be READY.
        default: true
      - name: control_total_tolerance_bp
        type: integer
        source: input
        description: Control-total tolerance in basis points used by data_file_control_reconciliation.
        default: 5
        constraints: ">= 0 and <= 10000"
      - name: status
        type: enum
        source: input
        description: Commercial standing of the client; SUSPENDED clients cannot lodge DataFiles.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED (settable at creation only)"
      - name: postage_deposited_cents
        type: integer
        source: system
        description: Cumulative postage funding received; incremented only by postage-deposits.
        default: 0
      - name: postage_committed_cents
        type: integer
        source: system
        description: Postage currently committed to SEALED/MANIFESTED PresortBatches.
        default: 0
      - name: postage_escrow_available_cents
        type: integer
        source: system
        description: Unspent postage escrow; equals postage_deposited_cents - postage_committed_cents.
        default: 0
      - name: paperless_sync_epoch
        type: integer
        source: system
        description: Monotonic suppression-file epoch; incremented by each paperless-sync run.
        default: 0
      - name: pending_address_feedback_count
        type: integer
        source: system
        description: Count of classified UndeliverableReturns awaiting an address-feedback release.
        default: 0
      - name: address_feedback_batch_count
        type: integer
        source: system
        description: Number of address-feedback releases issued to this client.
        default: 0

  - name: CompositionTemplate
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose statements this template composes"
      - name: template_code
        type: string
        source: input
        description: Client-scoped template family code.
        constraints: "length 1..30; (client_id, template_code, version_no) unique"
      - name: version_no
        type: integer
        source: input
        description: Version within the template family; only one version may be ACTIVE.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of this template version.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RETIRED"
      - name: duplex_required
        type: boolean
        source: input
        description: When true the job may only be scheduled on a press line with DUPLEX capability.
      - name: sheets_per_document
        type: integer
        source: input
        description: Base physical sheet count per composed document before variable content rules.
        constraints: ">= 1 and <= 200"
      - name: color_pages_per_document
        type: integer
        source: input
        description: Requested color side count per document; capped by variable_content_sheet_composition.
        default: 0
        constraints: ">= 0"
      - name: mail_class_preference
        type: enum
        source: input
        description: Preferred mail class for pieces composed from this template.
        default: FIRST_CLASS
        constraints: "FIRST_CLASS | MARKETING"
      - name: required_insert_codes
        type: array
        source: input
        description: Unconditional regulatory insert codes; each must resolve to an effective InsertStock.
        default: []
        constraints: "array of insert_code strings; duplicates rejected"
      - name: variable_content_rules
        type: array
        source: input
        description: Ordered-by-rule_code conditional content rules applied per StatementRecord.
        default: []
        constraints: "array of { rule_code: string, threshold_amount_cents: integer >= 0, add_sheets: integer >= 0, required_insert_code: string|null }; rule_code unique within the array"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which this version became ACTIVE; null while DRAFT.
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant at which a higher version superseded this one.

  - name: InsertStock
    parent: null
    common_fields: true
    fields:
      - name: insert_code
        type: string
        source: input
        description: Regulatory insert code referenced by templates and variable content rules.
        constraints: "length 1..30; unique globally"
      - name: description
        type: string
        source: input
        description: Human-readable insert title.
      - name: jurisdiction_code
        type: string
        source: input
        description: Regulator jurisdiction the insert satisfies.
      - name: effective_from
        type: datetime
        source: input
        description: First instant at which this insert may be composed into a piece.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive last instant of effectivity; null means open-ended.
      - name: sheets_per_insert
        type: integer
        source: input
        description: Physical sheets contributed by one copy of this insert.
        default: 1
        constraints: ">= 1"
      - name: received_count
        type: integer
        source: input
        description: Physical copies received into the bureau warehouse for this insert.
        constraints: ">= 0"
      - name: on_hand_count
        type: integer
        source: system
        description: Unreserved copies remaining; initialised to received_count, debited at composition.
      - name: reserved_count
        type: integer
        source: system
        description: Copies reserved by COMPOSED-or-later CompositionJobs but not yet consumed.
        default: 0
      - name: consumed_count
        type: integer
        source: system
        description: Copies consumed when the owning CompositionJob reached MANIFESTED.
        default: 0
      - name: status
        type: enum
        source: input
        description: Whether the insert may still be composed.
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN (settable at creation only)"

  - name: DataFile
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client that lodged this file"
      - name: file_name
        type: string
        source: input
        description: Transmitted file name as received.
        constraints: "length 1..120"
      - name: format_spec_code
        type: enum
        source: input
        description: Declared physical layout, selects the per-record format predicate.
        constraints: "FIXED_WIDTH | DELIMITED | XML"
      - name: declared_record_count
        type: integer
        source: input
        description: Record count asserted by the client in the file trailer.
        constraints: ">= 0"
      - name: declared_control_total_cents
        type: integer
        source: input
        description: Sum of statement amounts asserted by the client in the file trailer.
        constraints: ">= 0"
      - name: actual_record_count
        type: integer
        source: computed
        description: Count of StatementRecords attached to this file.
        default: 0
      - name: actual_control_total_cents
        type: integer
        source: computed
        description: Sum of StatementRecord.statement_amount_cents attached to this file.
        default: 0
      - name: record_count_variance
        type: integer
        source: computed
        description: actual_record_count - declared_record_count.
        default: 0
      - name: control_total_variance_cents
        type: integer
        source: computed
        description: actual_control_total_cents - declared_control_total_cents.
        default: 0
      - name: control_total_variance_bp
        type: integer
        source: computed
        description: Absolute control-total variance expressed in basis points of the declared total.
        default: 0
      - name: format_error_count
        type: integer
        source: computed
        description: Count of attached StatementRecords whose format_valid is false.
        default: 0
      - name: amendment_count
        type: integer
        source: computed
        description: Number of accepted control-total amendments on this file.
        default: 0
      - name: status
        type: enum
        source: system
        description: Receipt-and-control lifecycle state.
        default: RECEIVED
        constraints: "RECEIVED | FORMAT_VALIDATED | HELD_VARIANCE | ACCEPTED | CONSUMED"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of file receipt.
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant the file reached ACCEPTED; the SLA clock origin.

  - name: StatementRecord
    parent: DataFile
    common_fields: true
    fields:
      - name: data_file_id
        type: string
        source: input
        description: "FK -> DataFile.id; the file this record arrived in"
      - name: account_ref
        type: string
        source: input
        description: Client-side account reference; joins to PaperlessEnrollment.account_ref.
        constraints: "length 1..40; (data_file_id, account_ref) unique"
      - name: sequence_no
        type: integer
        source: input
        description: Position of the record inside the file; the canonical processing order key.
        constraints: ">= 1; (data_file_id, sequence_no) unique"
      - name: statement_amount_cents
        type: integer
        source: input
        description: Statement balance driving variable content rule thresholds and control totals.
      - name: address_line1
        type: string
        source: input
        description: Primary delivery address line.
      - name: city
        type: string
        source: input
        description: Delivery city.
      - name: region_code
        type: string
        source: input
        description: Delivery state/region code; only a length-2 code earns the hygiene region bonus.
      - name: postal_code
        type: string
        source: input
        description: Five-digit delivery postal code; drives 5-digit and 3-digit presort grouping.
      - name: postal_code_plus4
        type: string
        source: input
        description: Optional four-digit add-on; presence is the largest single hygiene bonus.
      - name: format_valid
        type: boolean
        source: computed
        description: Result of data_file_format_validation under the file's format_spec_code.
        default: false
      - name: hygiene_status
        type: enum
        source: system
        description: Address hygiene disposition; STALE is written only by an UNRESOLVED return.
        default: PENDING
        constraints: "PENDING | DELIVERABLE | CORRECTED | UNDELIVERABLE_AS_ADDRESSED | STALE"
      - name: hygiene_confidence
        type: number
        source: computed
        description: Hygiene confidence in [0.00, 1.00], two decimals, computed at composition.
      - name: delivery_channel
        type: enum
        source: computed
        description: Channel resolved at composition from the client's suppression file.
        default: PENDING
        constraints: "PENDING | PRINT | ELECTRONIC"
      - name: computed_sheet_count
        type: integer
        source: computed
        description: Sheets composed for this record including inserts; mirrored onto MailPiece.sheet_count.
      - name: computed_insert_codes
        type: array
        source: computed
        description: Ascending-sorted insert codes composed into this record's piece.
        default: []
      - name: address_update_pending
        type: boolean
        source: computed
        description: True once a classified UndeliverableReturn awaits release to the client.
        default: false

  - name: PaperlessEnrollment
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose suppression file this row belongs to"
      - name: account_ref
        type: string
        source: input
        description: Account reference matched against StatementRecord.account_ref at composition.
        constraints: "length 1..40; (client_id, account_ref) unique"
      - name: channel
        type: enum
        source: input
        description: Electronic delivery channel.
        constraints: "EMAIL | PORTAL"
      - name: status
        type: enum
        source: system
        description: Enrollment state; only ENROLLED suppresses print.
        default: PENDING
        constraints: "PENDING | ENROLLED | REVOKED"
      - name: enrolled_epoch
        type: integer
        source: system
        description: Client paperless_sync_epoch at which this row became ENROLLED; null while PENDING.
      - name: revoked_epoch
        type: integer
        source: system
        description: Client paperless_sync_epoch observed when this row was revoked.
      - name: suppression_effective
        type: boolean
        source: computed
        description: True iff status == ENROLLED and enrolled_epoch is not null.
        default: false
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the paperless-sync run that confirmed this row.
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of revocation.

  - name: CompositionJob
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from DataFile.client_id at composition"
      - name: data_file_id
        type: string
        source: input
        description: "FK -> DataFile.id; must be in status ACCEPTED at composition"
      - name: template_id
        type: string
        source: input
        description: "FK -> CompositionTemplate.id; must be ACTIVE and owned by the same client"
      - name: composed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CompositionOperator that composed the job (audit only).
      - name: composition_epoch
        type: integer
        source: computed
        description: Client paperless_sync_epoch snapshotted at composition; gates suppression.
      - name: rush_requested
        type: boolean
        source: input
        description: Rush flag; raises the SLA severity multiplier and adds the expedite fee.
        default: false
      - name: status
        type: enum
        source: system
        description: Production lifecycle state.
        default: COMPOSED
        constraints: "COMPOSED | PRESORTED | SCHEDULED | PRINTING | PRINTED | INTEGRITY_HELD | VERIFIED | MANIFESTED | CLOSED"
      - name: integrity_status
        type: enum
        source: computed
        description: One-to-one integrity rollup written by reconcile-integrity.
        default: PENDING
        constraints: "PENDING | MATCHED | BREACHED"
      - name: expected_piece_count
        type: integer
        source: computed
        description: Number of StatementRecords composed into pieces; equals DataFile.actual_record_count.
        default: 0
      - name: accountable_piece_count
        type: integer
        source: computed
        description: Count of this job's MailPieces whose piece_status != VOID (one-to-one invariant).
        default: 0
      - name: print_piece_count
        type: integer
        source: computed
        description: Count of MailPieces whose piece_status not in {SUPPRESSED, VOID}.
        default: 0
      - name: electronic_piece_count
        type: integer
        source: computed
        description: Count of MailPieces whose piece_status == SUPPRESSED.
        default: 0
      - name: void_piece_count
        type: integer
        source: computed
        description: Count of MailPieces voided by reprint requests.
        default: 0
      - name: reprint_piece_count
        type: integer
        source: computed
        description: Count of MailPieces whose reprint_of_piece_id is not null.
        default: 0
      - name: matched_piece_count
        type: integer
        source: computed
        description: Count of printable MailPieces whose integrity_status == RECONCILED, written by calculations.one_to_one_integrity_reconciliation and refreshed by a reprint.
        default: 0
      - name: missing_scan_count
        type: integer
        source: computed
        description: Count of printable MailPieces whose integrity_status == SCAN_MISSING.
        default: 0
      - name: duplicate_scan_count
        type: integer
        source: computed
        description: Count of printable MailPieces whose integrity_status == DUPLICATE_SCAN.
        default: 0
      - name: reprint_chain_depth
        type: integer
        source: computed
        description: Longest reprint_of_piece_id chain among this job's MailPieces; 0 when no piece has been reprinted.
        default: 0
      - name: total_sheet_count
        type: integer
        source: computed
        description: Billing sheet basis; sum of MailPiece.sheet_count where billable is true.
        default: 0
      - name: print_sheet_count
        type: integer
        source: computed
        description: Press sheet basis; sum of MailPiece.sheet_count where piece_status not in {SUPPRESSED, VOID}.
        default: 0
      - name: insert_sheet_total
        type: integer
        source: computed
        description: Sum of MailPiece.insert_sheet_count where billable is true.
        default: 0
      - name: color_page_count
        type: integer
        source: computed
        description: Sum of MailPiece.color_page_count where billable is true.
        default: 0
      - name: sla_due_at
        type: datetime
        source: computed
        description: DataFile.accepted_at plus Client.sla_turnaround_hours.
      - name: sla_completed_at
        type: datetime
        source: system
        description: Logical-clock instant recorded by the close transition.
      - name: sla_hold_minutes
        type: integer
        source: computed
        description: Cumulative minutes this job spent in INTEGRITY_HELD; excused from assessed penalty.
        default: 0
      - name: integrity_held_since
        type: datetime
        source: system
        description: Logical-clock instant of the most recent entry into INTEGRITY_HELD; null otherwise.
      - name: projected_completion_at
        type: datetime
        source: computed
        description: PrintRun.window_end plus FULFILMENT_LAG_MINUTES, written at scheduling.
      - name: projected_penalty_cents
        type: integer
        source: computed
        description: Forward-looking SLA penalty variant written at scheduling.
        default: 0
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: Chronological SLA penalty variant written at close; null before close.
      - name: composition_charge_cents
        type: integer
        source: computed
        description: Step 1 of job_billing_total; null before close.
      - name: insert_charge_cents
        type: integer
        source: computed
        description: Step 2 of job_billing_total; null before close.
      - name: pre_discount_subtotal_cents
        type: integer
        source: computed
        description: Step 3 of job_billing_total; the sole key for the volume discount tier.
      - name: volume_discount_cents
        type: integer
        source: computed
        description: Step 5 of job_billing_total.
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: Step 7 of job_billing_total; percentage of the post-discount subtotal.
      - name: billing_total_cents
        type: integer
        source: computed
        description: Step 8 of job_billing_total; null before close.

  - name: MailPiece
    parent: CompositionJob
    common_fields: true
    fields:
      - name: composition_job_id
        type: string
        source: computed
        description: "FK -> CompositionJob.id; the job that composed this piece"
      - name: statement_record_id
        type: string
        source: computed
        description: "FK -> StatementRecord.id; the single record this piece renders (one-to-one)"
      - name: presort_batch_id
        type: string
        source: computed
        description: "FK -> PresortBatch.id; assigned by presort; null until the job is PRESORTED"
      - name: reprint_of_piece_id
        type: string
        source: computed
        description: "FK -> MailPiece.id; set on a replacement piece created by a reprint request"
      - name: imb_barcode
        type: string
        source: system
        description: "Deterministic intelligent mail barcode: <client_code>-<data_file.received_at compact>-<piece_seq zero padded to 6>, suffixed -R<reprint_index> on replacements"
      - name: piece_seq
        type: integer
        source: computed
        description: Copied from StatementRecord.sequence_no; the canonical piece ordering key.
      - name: sheet_count
        type: integer
        source: computed
        description: Document sheets plus insert sheets for this piece.
      - name: insert_sheet_count
        type: integer
        source: computed
        description: Sheets contributed by regulatory inserts on this piece.
        default: 0
      - name: color_page_count
        type: integer
        source: computed
        description: Color sides on this piece, capped at sheet-side capacity.
        default: 0
      - name: insert_codes
        type: array
        source: computed
        description: Ascending-sorted insert codes composed into this piece.
        default: []
      - name: billable
        type: boolean
        source: computed
        description: True iff reprint_of_piece_id is null; reprints are bureau rework and never billed.
        default: true
      - name: mail_class
        type: enum
        source: computed
        description: Mail class resolved at composition; SUPPRESSED pieces carry NONE_ELECTRONIC.
        default: NONE_ELECTRONIC
        constraints: "FIRST_CLASS | MARKETING | NONE_ELECTRONIC"
      - name: presort_bucket
        type: enum
        source: computed
        description: Presort qualification bucket assigned by the waterfall.
        default: PENDING
        constraints: "PENDING | FIVE_DIGIT | THREE_DIGIT | AADC | MIXED_AADC | NONMACHINABLE"
      - name: piece_status
        type: enum
        source: system
        description: Physical-progress state dimension advanced by accepted barcode scans.
        default: COMPOSED
        constraints: "COMPOSED | PRINTED | INSERTED | INDUCTED | SUPPRESSED | VOID"
      - name: integrity_status
        type: enum
        source: system
        description: Integrity state dimension, independent of piece_status.
        default: UNVERIFIED
        constraints: "UNVERIFIED | SCAN_MATCHED | SCAN_MISSING | DUPLICATE_SCAN | RECONCILED"
      - name: last_scan_stage
        type: enum
        source: computed
        description: Stage of the most recent accepted ScanEvent on this piece.
        default: NONE
        constraints: "NONE | PRINT | INSERT | INDUCT"
      - name: accepted_scan_count
        type: integer
        source: computed
        description: Count of ScanEvents on this piece whose accepted is true.
        default: 0
      - name: undeliverable_flag
        type: boolean
        source: computed
        description: True once an UndeliverableReturn on this piece has been classified.
        default: false

  - name: ScanEvent
    parent: MailPiece
    common_fields: false
    fields:
      - name: mail_piece_id
        type: string
        source: input
        description: "FK -> MailPiece.id; the piece whose barcode was read"
      - name: stage
        type: enum
        source: input
        description: Production stage at which the barcode was read.
        constraints: "PRINT | INSERT | INDUCT"
      - name: scanned_barcode
        type: string
        source: input
        description: Barcode string read off the physical piece; compared to MailPiece.imb_barcode.
      - name: device_code
        type: string
        source: input
        description: Scanner identifier, recorded for audit only.
      - name: accepted
        type: boolean
        source: computed
        description: True iff the scan passed barcode, sequence and duplicate checks.
      - name: rejection_reason
        type: enum
        source: computed
        description: Reason an unaccepted scan was refused.
        default: NONE
        constraints: "NONE | UNKNOWN_BARCODE | DUPLICATE_STAGE | OUT_OF_SEQUENCE"
      - name: scanned_at
        type: datetime
        source: system
        description: Logical-clock instant of the read.

  - name: PressLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: Equipment identifier, unique across the plant.
        constraints: "length 1..20; unique globally"
      - name: capabilities
        type: array
        source: input
        description: Capability tags the eligibility filter matches against the job's requirements.
        constraints: "non-empty array with members from {DUPLEX, COLOR, INSERT}; no duplicates"
      - name: sheets_per_hour
        type: integer
        source: input
        description: Throughput used for run-window sizing and the speed component of the score.
        constraints: ">= 1"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Mandatory make-ready gap enforced on both sides of every scheduled run window.
        default: 30
        constraints: ">= 0 and <= 480"
      - name: daily_sheet_capacity
        type: integer
        source: input
        description: Hard sheet ceiling across all PLANNED and RUNNING runs on this line.
        constraints: ">= 1"
      - name: committed_sheet_count
        type: integer
        source: computed
        description: Sum of PrintRun.planned_sheet_count over runs on this line in status PLANNED or RUNNING.
        default: 0
      - name: utilization_bp
        type: integer
        source: computed
        description: committed_sheet_count as basis points of daily_sheet_capacity.
        default: 0
      - name: status
        type: enum
        source: input
        description: Availability for scheduling.
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE (settable at creation only)"

  - name: PrintRun
    parent: null
    common_fields: true
    fields:
      - name: composition_job_id
        type: string
        source: computed
        description: "FK -> CompositionJob.id; the job this run prints"
      - name: press_line_id
        type: string
        source: computed
        description: "FK -> PressLine.id; the line selected explicitly or by press_line_selection"
      - name: window_start
        type: datetime
        source: input
        description: Requested occupancy start; closed-interval left endpoint.
      - name: window_end
        type: datetime
        source: computed
        description: window_start plus run_minutes; closed-interval right endpoint.
      - name: planned_sheet_count
        type: integer
        source: computed
        description: Snapshot of CompositionJob.print_sheet_count taken at scheduling.
      - name: run_minutes
        type: integer
        source: computed
        description: max(MIN_RUN_MINUTES, ceil(planned_sheet_count * 60 / press_line.sheets_per_hour)).
      - name: selection_score
        type: number
        source: computed
        description: press_line_selection score of the chosen line, two decimals.
      - name: selection_mode
        type: enum
        source: computed
        description: Whether the line was named in the request or chosen by the selector.
        constraints: "EXPLICIT | SELECTED"
      - name: status
        type: enum
        source: system
        description: Run lifecycle state.
        default: PLANNED
        constraints: "PLANNED | RUNNING | COMPLETED | ABORTED"
      - name: started_at
        type: datetime
        source: system
        description: Logical-clock instant the run started.
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the run completed or aborted.
      - name: printed_piece_count
        type: integer
        source: computed
        description: Pieces of the job in piece_status PRINTED, INSERTED or INDUCTED at completion.
        default: 0
      - name: abort_reason
        type: enum
        source: system
        description: Reason recorded by the abort transition.
        default: NONE
        constraints: "NONE | EQUIPMENT_FAULT | INTEGRITY_BREACH | DR_FAILOVER"

  - name: EntryFacility
    parent: null
    common_fields: true
    fields:
      - name: facility_code
        type: string
        source: input
        description: Postal entry facility identifier.
        constraints: "length 1..20; unique globally"
      - name: facility_type
        type: enum
        source: input
        description: Postal facility tier.
        constraints: "SCF | NDC | DDU"
      - name: tray_capacity_per_window
        type: integer
        source: input
        description: Aggregate tray ceiling summed over all MANIFESTED batches whose induction windows intersect.
        constraints: ">= 1"
      - name: discount_bp_first_class
        type: integer
        source: input
        description: Basis-point discount applied per piece to FIRST_CLASS base rates at manifest.
        constraints: ">= 0 and <= 10000"
      - name: discount_bp_marketing
        type: integer
        source: input
        description: Basis-point discount applied per piece to MARKETING base rates at manifest.
        constraints: ">= 0 and <= 10000"
      - name: committed_tray_count
        type: integer
        source: computed
        description: Sum of tray_count over MANIFESTED PresortBatches inducted at this facility.
        default: 0
      - name: status
        type: enum
        source: input
        description: Whether the facility accepts inductions.
        default: OPEN
        constraints: "OPEN | CLOSED (settable at creation only)"

  - name: PresortBatch
    parent: null
    common_fields: true
    fields:
      - name: composition_job_id
        type: string
        source: computed
        description: "FK -> CompositionJob.id; the job whose pieces this batch trays"
      - name: entry_facility_id
        type: string
        source: input
        description: "FK -> EntryFacility.id; supplied at manifest, null while OPEN or SEALED"
      - name: mail_class
        type: enum
        source: computed
        description: Mail class shared by every piece in this batch.
        constraints: "FIRST_CLASS | MARKETING"
      - name: presort_bucket
        type: enum
        source: computed
        description: Presort bucket shared by every piece in this batch.
        constraints: "FIVE_DIGIT | THREE_DIGIT | AADC | MIXED_AADC | NONMACHINABLE"
      - name: piece_count
        type: integer
        source: computed
        description: Count of MailPieces whose presort_batch_id is this batch and piece_status != VOID.
        default: 0
      - name: tray_count
        type: integer
        source: computed
        description: ceil(piece_count / TRAY_CAPACITY_PIECES).
        default: 0
      - name: reserved_insert_sheets
        type: integer
        source: computed
        description: Sum of insert_sheet_count over the batch's non-VOID pieces.
        default: 0
      - name: estimated_postage_cents
        type: integer
        source: computed
        description: Seal-time postage variant, no facility discount, all non-VOID pieces.
      - name: manifested_postage_cents
        type: integer
        source: computed
        description: Manifest-time postage variant, facility discount, scan-verified pieces only.
      - name: postage_variance_cents
        type: integer
        source: computed
        description: manifested_postage_cents - estimated_postage_cents; null before manifest.
      - name: induction_window_start
        type: datetime
        source: input
        description: Half-open induction window left endpoint, supplied at manifest.
      - name: induction_window_end
        type: datetime
        source: input
        description: Half-open induction window right endpoint (exclusive), supplied at manifest.
      - name: status
        type: enum
        source: system
        description: Postage lifecycle state.
        default: OPEN
        constraints: "OPEN | SEALED | MANIFESTED"
      - name: sealed_by_user_id
        type: string
        source: system
        description: X-User-ID of the sealing PostageController; the segregation-of-duties comparand.
      - name: manifested_by_user_id
        type: string
        source: system
        description: X-User-ID of the manifesting PostageController; must differ from sealed_by_user_id.

  - name: UndeliverableReturn
    parent: null
    common_fields: true
    fields:
      - name: mail_piece_id
        type: string
        source: input
        description: "FK -> MailPiece.id; the returned piece; resolves the owning client through MailPiece.composition_job_id -> CompositionJob.client_id"
      - name: reason_code
        type: enum
        source: input
        description: Postal endorsement reason; DECEASED always forces the UNRESOLVED branch.
        constraints: "MOVED_NO_FORWARD | INSUFFICIENT_ADDRESS | VACANT | REFUSED | DECEASED"
      - name: corrected_address_line1
        type: string
        source: input
        description: Forwarding address line supplied at classification; null when unknown.
      - name: corrected_postal_code
        type: string
        source: input
        description: Forwarding five-digit postal code supplied at classification; null when unknown.
      - name: disposition
        type: enum
        source: system
        description: Return-processing state; the fork target is decided by classify.
        default: SCANNED
        constraints: "SCANNED | ADDRESS_UPDATED | UNRESOLVED | FEEDBACK_SENT"
      - name: returned_at
        type: datetime
        source: system
        description: Logical-clock instant the return was scanned into the bureau.
      - name: classified_at
        type: datetime
        source: system
        description: Logical-clock instant of classification.
      - name: feedback_sent_at
        type: datetime
        source: system
        description: Logical-clock instant the address-feedback release included this return.
      - name: feedback_batch_seq
        type: integer
        source: system
        description: Client-scoped release sequence number this return was included in.

  - name: DrSite
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: Disaster-recovery plant identifier; exactly one DrSite may exist.
        constraints: "length 1..20"
      - name: replication_lag_minutes
        type: integer
        source: input
        description: Observed composition-store replication lag; above MAX_REPLICATION_LAG_MINUTES readiness is STALE.
        constraints: ">= 0"
      - name: last_drill_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent recorded failover drill.
      - name: last_drill_result
        type: enum
        source: system
        description: Outcome of the most recent drill.
        default: NONE
        constraints: "NONE | PASS | FAIL"
      - name: drill_count
        type: integer
        source: computed
        description: Number of drills recorded against this site.
        default: 0
      - name: readiness_status
        type: enum
        source: computed
        description: Readiness derived from drill result, drill age against the logical clock, and replication lag.
        default: UNTESTED
        constraints: "UNTESTED | READY | STALE | FAILED"
      - name: readiness_valid_until
        type: datetime
        source: computed
        description: last_drill_at plus DR_DRILL_VALIDITY_HOURS; null when no drill has been recorded.

state_machines:
  - entity: DataFile
    state_field: status
    initial_state: RECEIVED
    terminal_states: [CONSUMED]
    shape: "cyclic + branching (control-check forks on variance; HELD_VARIANCE loops back to RECEIVED)"
    transitions:
      - from: RECEIVED
        to: FORMAT_VALIDATED
        trigger: "POST /bureau/data-files/{id}/validate-format"
        actor: CompositionOperator
        preconditions:
          - "DataFile.status == RECEIVED"
          - "DataFile.actual_record_count >= 1 (else ERR_FILE_EMPTY, 422)"
          - "every attached StatementRecord passes data_file_format_validation, i.e. format_error_count == 0 (else ERR_FILE_FORMAT_ERRORS, 422 and the file stays RECEIVED)"
        side_effects:
          - "run calculations.data_file_format_validation over StatementRecords ordered by sequence_no ASC; write StatementRecord.format_valid on each"
          - "write DataFile.format_error_count"
          - "increment DataFile.version by 1"
      - from: FORMAT_VALIDATED
        to: ACCEPTED
        trigger: "POST /bureau/data-files/{id}/control-check (variance within tolerance branch)"
        actor: CompositionOperator
        preconditions:
          - "DataFile.status == FORMAT_VALIDATED"
          - "calculations.data_file_control_reconciliation yields within_tolerance == true"
        side_effects:
          - "write actual_record_count, actual_control_total_cents, record_count_variance, control_total_variance_cents, control_total_variance_bp"
          - "set DataFile.accepted_at = logical clock (the SLA clock origin for every job composed from this file)"
          - "increment DataFile.version by 1"
        note: "Branch A of a two-way fork on one trigger; the divergent branch is FORMAT_VALIDATED -> HELD_VARIANCE."
      - from: FORMAT_VALIDATED
        to: HELD_VARIANCE
        trigger: "POST /bureau/data-files/{id}/control-check (variance beyond tolerance branch)"
        actor: CompositionOperator
        preconditions:
          - "DataFile.status == FORMAT_VALIDATED"
          - "calculations.data_file_control_reconciliation yields within_tolerance == false"
        side_effects:
          - "write actual_record_count, actual_control_total_cents, record_count_variance, control_total_variance_cents, control_total_variance_bp"
          - "leave DataFile.accepted_at null"
          - "increment DataFile.version by 1"
        note: "Branch B: divergent side-effect set (no accepted_at stamp), same trigger as branch A."
      - from: HELD_VARIANCE
        to: RECEIVED
        trigger: "POST /bureau/data-files/{id}/amend-control-totals"
        actor: ClientLiaison
        preconditions:
          - "DataFile.status == HELD_VARIANCE"
          - "acting ClientLiaison X-User-ID == DataFile.client_id"
        side_effects:
          - "overwrite declared_record_count and declared_control_total_cents with the amended values"
          - "increment DataFile.amendment_count by 1"
          - "reset format_error_count to 0 and every StatementRecord.format_valid to false (the file must be re-validated from scratch)"
          - "recompute record_count_variance, control_total_variance_cents, control_total_variance_bp against the amended declarations"
          - "increment DataFile.version by 1"
        note: "The revision loop: a held file re-enters RECEIVED and must traverse validate-format and control-check again."
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system, cascaded by POST /bureau/composition-jobs"
        actor: system
        preconditions:
          - "DataFile.status == ACCEPTED"
        side_effects:
          - "increment DataFile.version by 1"
        note: "One accepted file yields exactly one CompositionJob; a second compose attempt fails ERR_FILE_INVALID_STATE."

  - entity: CompositionTemplate
    state_field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: "linear with sibling-retiring cascade"
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bureau/composition-templates/{id}/activate"
        actor: BureauAdmin
        preconditions:
          - "CompositionTemplate.status == DRAFT"
          - "no sibling CompositionTemplate with the same (client_id, template_code) has status == ACTIVE and version_no > this.version_no (else ERR_TEMPLATE_INVALID_STATE, 409)"
        side_effects:
          - "set activated_at = logical clock; increment version by 1"
          - "cascade: every sibling with the same (client_id, template_code), status == ACTIVE and version_no < this.version_no transitions ACTIVE -> RETIRED (see the next row)"
      - from: ACTIVE
        to: RETIRED
        trigger: "system, cascaded by activation of a higher version_no in the same (client_id, template_code) family"
        actor: system
        preconditions:
          - "CompositionTemplate.status == ACTIVE"
          - "a sibling in the same (client_id, template_code) family just reached ACTIVE with a strictly higher version_no"
        side_effects:
          - "set retired_at = logical clock; increment version by 1"
        note: "RETIRED templates remain referenced by already-composed jobs but can no longer start new ones."

  - entity: PaperlessEnrollment
    state_field: status
    initial_state: PENDING
    terminal_states: []
    shape: "cyclic (REVOKED -> PENDING via re-enrollment)"
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "system, cascaded by POST /bureau/clients/{id}/paperless-sync when account_ref appears in confirm_pending_account_refs"
        actor: system
        preconditions:
          - "PaperlessEnrollment.status == PENDING"
          - "PaperlessEnrollment.client_id == the synced Client.id"
        side_effects:
          - "set enrolled_epoch = the Client's post-increment paperless_sync_epoch"
          - "set confirmed_at = logical clock; set suppression_effective = true"
          - "increment PaperlessEnrollment.version by 1"
      - from: ENROLLED
        to: REVOKED
        trigger: "POST /bureau/paperless-enrollments/{id}/revoke"
        actor: ClientLiaison
        preconditions:
          - "PaperlessEnrollment.status == ENROLLED"
          - "acting ClientLiaison X-User-ID == PaperlessEnrollment.client_id"
        side_effects:
          - "set revoked_epoch = Client.paperless_sync_epoch (unchanged), revoked_at = logical clock"
          - "set suppression_effective = false; increment version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "POST /bureau/paperless-enrollments/{id}/revoke"
        actor: ClientLiaison
        preconditions:
          - "PaperlessEnrollment.status == PENDING"
          - "acting ClientLiaison X-User-ID == PaperlessEnrollment.client_id"
        side_effects:
          - "set revoked_epoch = Client.paperless_sync_epoch, revoked_at = logical clock; increment version by 1"
      - from: REVOKED
        to: PENDING
        trigger: "POST /bureau/paperless-enrollments (re-enrollment on an existing (client_id, account_ref))"
        actor: ClientLiaison
        preconditions:
          - "an existing PaperlessEnrollment with the same (client_id, account_ref) has status == REVOKED"
        side_effects:
          - "reinstate the existing row in place: status -> PENDING, channel <- request channel, enrolled_epoch -> null, revoked_epoch -> null, revoked_at -> null, suppression_effective -> false"
          - "increment PaperlessEnrollment.version by 1"
        note: "The create endpoint reinstates rather than duplicating; no new row is minted. A create against a PENDING or ENROLLED row is ERR_DUPLICATE_CODE."

  - entity: CompositionJob
    state_field: status
    initial_state: COMPOSED
    terminal_states: [CLOSED]
    shape: "cyclic (PRINTING -> PRESORTED on abort; INTEGRITY_HELD -> PRINTED on reprint) with a compound bubble-up into MANIFESTED"
    transitions:
      - from: COMPOSED
        to: PRESORTED
        trigger: "POST /bureau/composition-jobs/{id}/presort"
        actor: CompositionOperator
        preconditions:
          - "CompositionJob.status == COMPOSED"
          - "at least one MailPiece of the job has piece_status == COMPOSED (else ERR_JOB_INVALID_STATE, 409)"
        side_effects:
          - "run calculations.presort_qualification_waterfall; write MailPiece.presort_bucket on every candidate piece"
          - "create one PresortBatch per (mail_class, presort_bucket) group holding at least one candidate piece, in the pinned bucket order FIVE_DIGIT, THREE_DIGIT, AADC, MIXED_AADC, NONMACHINABLE and, within a bucket, FIRST_CLASS before MARKETING"
          - "write MailPiece.presort_batch_id on every candidate piece; write PresortBatch.piece_count, tray_count, reserved_insert_sheets"
          - "increment CompositionJob.version by 1"
      - from: PRESORTED
        to: SCHEDULED
        trigger: "POST /bureau/composition-jobs/{id}/schedule"
        actor: ProductionScheduler
        preconditions:
          - "CompositionJob.status == PRESORTED"
          - "when Client.dr_readiness_required is true, the single DrSite exists and its readiness_status == READY (else ERR_DR_SITE_NOT_READY, 409)"
          - "the chosen PressLine passes calculations.press_line_selection eligibility, including the buffered window check against its PLANNED/RUNNING runs"
        side_effects:
          - "create a PrintRun in status PLANNED with planned_sheet_count = job.print_sheet_count, run_minutes and window_end per calculations.print_run_window_sizing, selection_score and selection_mode"
          - "cascade: PressLine.committed_sheet_count += PrintRun.planned_sheet_count; recompute PressLine.utilization_bp; increment PressLine.version by 1"
          - "write CompositionJob.projected_completion_at and projected_penalty_cents per calculations.sla_penalty variant projected_penalty"
          - "increment CompositionJob.version by 1"
      - from: SCHEDULED
        to: PRINTING
        trigger: "POST /bureau/print-runs/{id}/start"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == PLANNED and PrintRun.composition_job_id == this job"
          - "CompositionJob.status == SCHEDULED"
          - "PressLine.status == AVAILABLE"
        side_effects:
          - "PrintRun.status PLANNED -> RUNNING, started_at = logical clock; increment PrintRun.version by 1"
          - "increment CompositionJob.version by 1"
      - from: PRINTING
        to: PRINTED
        trigger: "POST /bureau/print-runs/{id}/complete"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == RUNNING and PrintRun.composition_job_id == this job"
          - "CompositionJob.status == PRINTING"
        side_effects:
          - "PrintRun.status RUNNING -> COMPLETED, completed_at = logical clock, printed_piece_count = count of the job's MailPieces with piece_status IN {PRINTED, INSERTED, INDUCTED}"
          - "cascade: PressLine.committed_sheet_count -= PrintRun.planned_sheet_count (the run leaves the PLANNED/RUNNING set); recompute utilization_bp; increment PressLine.version by 1"
          - "increment CompositionJob.version by 1"
      - from: PRINTING
        to: PRESORTED
        trigger: "POST /bureau/print-runs/{id}/abort"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == RUNNING and PrintRun.composition_job_id == this job"
          - "CompositionJob.status == PRINTING"
        side_effects:
          - "link 1: PrintRun.status RUNNING -> ABORTED, completed_at = logical clock, abort_reason = request abort_reason; increment PrintRun.version by 1"
          - "link 2, caused by the run leaving the PLANNED/RUNNING set: PressLine.committed_sheet_count -= PrintRun.planned_sheet_count, utilization_bp recomputed, PressLine.version += 1 — restoring the pre-schedule value exactly (compensating invariant press_sheet_capacity_conservation)"
          - "link 3, caused by the press-line reservation being released in link 2 (the job no longer owns press capacity, so nothing it printed on that run may stand): every MailPiece of the job with piece_status == PRINTED and last_scan_stage == PRINT reverts piece_status -> COMPOSED, integrity_status -> UNVERIFIED, accepted_scan_count and last_scan_stage recomputed to NONE; the append-only ScanEvent rows are retained untouched; each affected MailPiece.version += 1"
          - "link 4, caused by pieces reverting to COMPOSED: CompositionJob.print_sheet_count recomputed, projected_completion_at and projected_penalty_cents reset to null and 0, status -> PRESORTED, version += 1"
        note: "Compensation cascade of depth 4 originating from the abort trigger; the job may be re-scheduled afterwards."
      - from: PRINTED
        to: VERIFIED
        trigger: "POST /bureau/composition-jobs/{id}/reconcile-integrity (all pieces matched branch)"
        actor: IntegrityAuditor
        preconditions:
          - "CompositionJob.status == PRINTED"
          - "calculations.one_to_one_integrity_reconciliation yields integrity_status == MATCHED"
        side_effects:
          - "every piece in the reconciliation input set moves integrity_status SCAN_MATCHED -> RECONCILED; each MailPiece.version += 1"
          - "write CompositionJob.integrity_status = MATCHED; increment version by 1"
      - from: PRINTED
        to: INTEGRITY_HELD
        trigger: "POST /bureau/composition-jobs/{id}/reconcile-integrity (breach branch)"
        actor: IntegrityAuditor
        preconditions:
          - "CompositionJob.status == PRINTED"
          - "calculations.one_to_one_integrity_reconciliation yields integrity_status == BREACHED"
        side_effects:
          - "pieces in the input set with integrity_status == SCAN_MATCHED move to RECONCILED; pieces with integrity_status IN {UNVERIFIED} move to SCAN_MISSING; pieces with DUPLICATE_SCAN stay DUPLICATE_SCAN; each affected MailPiece.version += 1"
          - "write CompositionJob.integrity_status = BREACHED, integrity_held_since = logical clock; increment version by 1"
        note: "Divergent branch of the same trigger as PRINTED -> VERIFIED, with a strictly larger side-effect set."
      - from: INTEGRITY_HELD
        to: PRINTED
        trigger: "POST /bureau/mail-pieces/{id}/reprints"
        actor: IntegrityAuditor
        preconditions:
          - "CompositionJob.status == INTEGRITY_HELD"
          - "the target MailPiece belongs to this job and has integrity_status IN {SCAN_MISSING, DUPLICATE_SCAN}"
          - "request expected_composition_job_version == CompositionJob.version (else ERR_STALE_COMPOSITION_JOB_VERSION, 412)"
        side_effects:
          - "target MailPiece.piece_status -> VOID (integrity_status retained for audit); MailPiece.version += 1"
          - "mint a replacement MailPiece: same composition_job_id, statement_record_id, presort_batch_id, piece_seq, sheet_count, insert_sheet_count, insert_codes, color_page_count, mail_class, presort_bucket; reprint_of_piece_id = target.id; billable = false; imb_barcode = target.imb_barcode + '-R' + reprint_index; piece_status = COMPOSED; integrity_status = UNVERIFIED"
          - "recompute CompositionJob.void_piece_count, reprint_piece_count, accountable_piece_count, print_piece_count, print_sheet_count and reprint_chain_depth, and reset matched_piece_count, missing_scan_count and duplicate_scan_count to 0; total_sheet_count is unchanged because replacements are not billable"
          - "InsertStock movement: the voided piece's reserved copies return to on_hand_count and the replacement immediately reserves the same number again, so on_hand_count and reserved_count are unchanged on net and received_count == on_hand_count + reserved_count + consumed_count still holds; InsertStock.version += 1 on each touched row"
          - "add the minutes elapsed since integrity_held_since into CompositionJob.sla_hold_minutes; clear integrity_held_since"
          - "reset CompositionJob.integrity_status -> PENDING and status -> PRINTED so the replacement can be re-scanned"
          - "recompute PresortBatch.piece_count, tray_count and reserved_insert_sheets for the affected batch; PresortBatch.version += 1"
          - "increment CompositionJob.version by 1"
        note: "The revision loop of the production pipeline. accountable_piece_count is unchanged by construction (one VOID out, one COMPOSED in)."
      - from: VERIFIED
        to: MANIFESTED
        trigger: "system, bubbled up when the last PresortBatch of the job reaches MANIFESTED"
        actor: system
        preconditions:
          - "CompositionJob.status == VERIFIED"
          - "every PresortBatch whose composition_job_id == this job has status == MANIFESTED"
        side_effects:
          - "cascade: for every distinct insert_code reserved by this job, InsertStock.reserved_count -= reserved copies and consumed_count += the same amount (on_hand_count untouched); InsertStock.version += 1"
          - "increment CompositionJob.version by 1"
        note: "Link 2 and link 3 of the manifest cascade chain; see PresortBatch SEALED -> MANIFESTED."
      - from: MANIFESTED
        to: CLOSED
        trigger: "POST /bureau/composition-jobs/{id}/close"
        actor: BureauAdmin
        preconditions:
          - "CompositionJob.status == MANIFESTED (else ERR_JOB_INVALID_STATE, 409); MANIFESTED is reachable only from VERIFIED with every PresortBatch MANIFESTED, so integrity_status == MATCHED and the absence of open batches are structurally implied and need no separate check"
        side_effects:
          - "set sla_completed_at = logical clock"
          - "run calculations.sla_penalty variant assessed_penalty; write assessed_penalty_cents"
          - "run calculations.job_billing_total; write composition_charge_cents, insert_charge_cents, pre_discount_subtotal_cents, volume_discount_cents, expedite_fee_cents, billing_total_cents"
          - "increment CompositionJob.version by 1"

  - entity: MailPiece
    state_field: piece_status
    initial_state: COMPOSED
    terminal_states: [INDUCTED, SUPPRESSED, VOID]
    shape: "parallel dimension 1 of 2 on MailPiece; advances only on accepted barcode scans, reverts on run abort, exits to VOID on reprint"
    transitions:
      - from: COMPOSED
        to: SUPPRESSED
        trigger: "system, decided at mint time by POST /bureau/composition-jobs"
        actor: system
        preconditions:
          - "a PaperlessEnrollment exists with client_id == job.client_id and account_ref == record.account_ref"
          - "that enrollment has status == ENROLLED and enrolled_epoch <= CompositionJob.composition_epoch"
        side_effects:
          - "set MailPiece.mail_class = NONE_ELECTRONIC and StatementRecord.delivery_channel = ELECTRONIC"
          - "the piece is excluded from the presort candidate set and from one_to_one_integrity_reconciliation, but still counts in CompositionJob.accountable_piece_count"
        note: "A PENDING (unsynchronised) or REVOKED enrollment does not suppress: the piece stays COMPOSED with delivery_channel PRINT."
      - from: COMPOSED
        to: PRINTED
        trigger: "POST /bureau/mail-pieces/{id}/scans with stage PRINT (accepted)"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == COMPOSED"
          - "CompositionJob.status IN {PRINTING, PRINTED, INTEGRITY_HELD}"
          - "request scanned_barcode == MailPiece.imb_barcode"
          - "no prior accepted ScanEvent on this piece with stage PRINT"
        side_effects:
          - "append a ScanEvent with accepted true, rejection_reason NONE, scanned_at = logical clock"
          - "set last_scan_stage = PRINT; accepted_scan_count += 1; increment MailPiece.version by 1"
      - from: PRINTED
        to: INSERTED
        trigger: "POST /bureau/mail-pieces/{id}/scans with stage INSERT (accepted)"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == PRINTED"
          - "CompositionJob.status IN {PRINTING, PRINTED, INTEGRITY_HELD}"
          - "request scanned_barcode == MailPiece.imb_barcode"
          - "no prior accepted ScanEvent on this piece with stage INSERT"
        side_effects:
          - "append a ScanEvent with accepted true; set last_scan_stage = INSERT; accepted_scan_count += 1; version += 1"
      - from: INSERTED
        to: INDUCTED
        trigger: "POST /bureau/mail-pieces/{id}/scans with stage INDUCT (accepted)"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == INSERTED"
          - "CompositionJob.status IN {PRINTING, PRINTED, INTEGRITY_HELD}"
          - "request scanned_barcode == MailPiece.imb_barcode"
          - "no prior accepted ScanEvent on this piece with stage INDUCT"
        side_effects:
          - "append a ScanEvent with accepted true; set last_scan_stage = INDUCT; accepted_scan_count += 1; version += 1"
          - "cross-dimension: because all three of PRINT, INSERT and INDUCT now have accepted ScanEvents, integrity_status moves UNVERIFIED -> SCAN_MATCHED in the same request"
      - from: PRINTED
        to: COMPOSED
        trigger: "system, cascaded by POST /bureau/print-runs/{id}/abort"
        actor: system
        preconditions:
          - "MailPiece.piece_status == PRINTED and last_scan_stage == PRINT"
          - "the aborting PrintRun.composition_job_id == MailPiece.composition_job_id"
        side_effects:
          - "reset last_scan_stage -> NONE and accepted_scan_count -> 0 while the ScanEvent log is retained; integrity_status -> UNVERIFIED; version += 1"
      - from: COMPOSED
        to: VOID
        trigger: "POST /bureau/mail-pieces/{id}/reprints"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == COMPOSED"
          - "MailPiece.integrity_status IN {SCAN_MISSING, DUPLICATE_SCAN}"
        side_effects:
          - "a replacement MailPiece is minted with reprint_of_piece_id = this piece; see CompositionJob INTEGRITY_HELD -> PRINTED"
      - from: PRINTED
        to: VOID
        trigger: "POST /bureau/mail-pieces/{id}/reprints"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == PRINTED"
          - "MailPiece.integrity_status IN {SCAN_MISSING, DUPLICATE_SCAN}"
        side_effects:
          - "a replacement MailPiece is minted with reprint_of_piece_id = this piece; see CompositionJob INTEGRITY_HELD -> PRINTED"
      - from: INSERTED
        to: VOID
        trigger: "POST /bureau/mail-pieces/{id}/reprints"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.piece_status == INSERTED"
          - "MailPiece.integrity_status IN {SCAN_MISSING, DUPLICATE_SCAN}"
        side_effects:
          - "a replacement MailPiece is minted with reprint_of_piece_id = this piece; see CompositionJob INTEGRITY_HELD -> PRINTED"

  - entity: MailPiece
    state_field: integrity_status
    initial_state: UNVERIFIED
    terminal_states: [RECONCILED]
    shape: "parallel dimension 2 of 2 on MailPiece; evolves independently of piece_status and loops UNVERIFIED -> SCAN_MISSING -> (reprint replacement) -> UNVERIFIED"
    transitions:
      - from: UNVERIFIED
        to: SCAN_MATCHED
        trigger: "POST /bureau/mail-pieces/{id}/scans with stage INDUCT (accepted, completing the three-stage set)"
        actor: IntegrityAuditor
        preconditions:
          - "accepted ScanEvents now exist for all three of PRINT, INSERT, INDUCT on this piece"
        side_effects:
          - "no further mutation beyond the shared version increment for the request"
      - from: UNVERIFIED
        to: DUPLICATE_SCAN
        trigger: "POST /bureau/mail-pieces/{id}/scans that is refused with rejection_reason DUPLICATE_STAGE"
        actor: IntegrityAuditor
        preconditions:
          - "an accepted ScanEvent already exists on this piece for the requested stage"
        side_effects:
          - "append a ScanEvent with accepted false and rejection_reason DUPLICATE_STAGE"
          - "set MailPiece.integrity_status = DUPLICATE_SCAN, leaving piece_status untouched; version += 1"
        note: "This is the one-to-one integrity breach: the same barcode was read twice at one stage, so two physical pieces may carry the same barcode."
      - from: SCAN_MATCHED
        to: DUPLICATE_SCAN
        trigger: "POST /bureau/mail-pieces/{id}/scans that is refused with rejection_reason DUPLICATE_STAGE"
        actor: IntegrityAuditor
        preconditions:
          - "an accepted ScanEvent already exists on this piece for the requested stage"
        side_effects:
          - "append a ScanEvent with accepted false and rejection_reason DUPLICATE_STAGE; set integrity_status = DUPLICATE_SCAN; version += 1"
      - from: SCAN_MATCHED
        to: RECONCILED
        trigger: "POST /bureau/composition-jobs/{id}/reconcile-integrity"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.integrity_status == SCAN_MATCHED"
          - "MailPiece.piece_status NOT IN {VOID, SUPPRESSED}"
        side_effects:
          - "increment MailPiece.version by 1"
      - from: UNVERIFIED
        to: SCAN_MISSING
        trigger: "POST /bureau/composition-jobs/{id}/reconcile-integrity"
        actor: IntegrityAuditor
        preconditions:
          - "MailPiece.integrity_status == UNVERIFIED"
          - "MailPiece.piece_status NOT IN {VOID, SUPPRESSED}"
        side_effects:
          - "increment MailPiece.version by 1; the piece becomes reprint-eligible"
      - from: SCAN_MISSING
        to: UNVERIFIED
        trigger: "system, on the replacement piece minted by POST /bureau/mail-pieces/{id}/reprints"
        actor: system
        preconditions:
          - "the voided predecessor had integrity_status == SCAN_MISSING"
        side_effects:
          - "the replacement piece starts the integrity dimension again at UNVERIFIED while the predecessor keeps SCAN_MISSING for audit"
        note: "Closes the integrity revision loop on the (statement_record_id) identity even though the row identity changes."

  - entity: PrintRun
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    shape: "branching (RUNNING forks to COMPLETED or ABORTED with divergent cascades)"
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /bureau/print-runs/{id}/start"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == PLANNED"
          - "CompositionJob.status == SCHEDULED"
          - "PressLine.status == AVAILABLE (else ERR_PRESS_LINE_UNAVAILABLE, 409)"
        side_effects:
          - "set started_at = logical clock; increment version by 1"
          - "cascade: CompositionJob.status SCHEDULED -> PRINTING"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /bureau/print-runs/{id}/complete"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == RUNNING"
        side_effects:
          - "set completed_at = logical clock and printed_piece_count; increment version by 1"
          - "cascade: PressLine.committed_sheet_count -= planned_sheet_count, utilization_bp recomputed, PressLine.version += 1"
          - "cascade: CompositionJob.status PRINTING -> PRINTED"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /bureau/print-runs/{id}/abort"
        actor: ProductionScheduler
        preconditions:
          - "PrintRun.status == RUNNING"
        side_effects:
          - "set completed_at = logical clock, abort_reason = request abort_reason; increment version by 1"
          - "cascade chain of depth 4 described at CompositionJob PRINTING -> PRESORTED"

  - entity: PresortBatch
    state_field: status
    initial_state: OPEN
    terminal_states: [MANIFESTED]
    shape: "branching with revert (OPEN <-> SEALED, then SEALED -> MANIFESTED)"
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /bureau/presort-batches/{id}/seal"
        actor: PostageController
        preconditions:
          - "PresortBatch.status == OPEN (else ERR_BATCH_NOT_OPEN, 409)"
          - "CompositionJob.status == VERIFIED (else ERR_JOB_INVALID_STATE, 409)"
          - "request expected_client_version == Client.version (else ERR_STALE_CLIENT_VERSION, 412)"
          - "Client.postage_escrow_available_cents >= the computed estimated_postage_cents (else ERR_POSTAGE_ESCROW_INSUFFICIENT, 402)"
        side_effects:
          - "run calculations.postage_cost variant estimated_postage; write estimated_postage_cents"
          - "set sealed_by_user_id = acting X-User-ID; increment PresortBatch.version by 1"
          - "cascade: Client.postage_committed_cents += estimated_postage_cents and Client.postage_escrow_available_cents -= estimated_postage_cents; Client.version += 1"
      - from: SEALED
        to: OPEN
        trigger: "POST /bureau/presort-batches/{id}/unseal"
        actor: PostageController
        preconditions:
          - "PresortBatch.status == SEALED (else ERR_BATCH_NOT_SEALED, 409)"
        side_effects:
          - "cascade: Client.postage_committed_cents -= estimated_postage_cents and Client.postage_escrow_available_cents += estimated_postage_cents, restoring both to their pre-seal values exactly (compensating invariant postage_escrow_conservation); Client.version += 1"
          - "clear estimated_postage_cents to null and sealed_by_user_id to null; increment PresortBatch.version by 1"
      - from: SEALED
        to: MANIFESTED
        trigger: "POST /bureau/presort-batches/{id}/manifest"
        actor: PostageController
        preconditions:
          - "PresortBatch.status == SEALED (else ERR_BATCH_NOT_SEALED, 409)"
          - "acting X-User-ID != PresortBatch.sealed_by_user_id (else ERR_SEGREGATION_OF_DUTIES, 403)"
          - "EntryFacility.status == OPEN (else ERR_ENTRY_FACILITY_CLOSED, 409)"
          - "induction_window_start < induction_window_end and the window spans at most 1440 minutes (else ERR_INVALID_INDUCTION_WINDOW, 422)"
          - "the facility's aggregate tray occupancy over intersecting half-open windows admits this batch's tray_count (else ERR_INDUCTION_CAPACITY_EXCEEDED, 409)"
        side_effects:
          - "link 1: run calculations.postage_cost variant manifested_postage; write manifested_postage_cents and postage_variance_cents; write entry_facility_id, induction_window_start, induction_window_end, manifested_by_user_id; increment PresortBatch.version by 1"
          - "link 1: cascade EntryFacility.committed_tray_count += tray_count; EntryFacility.version += 1"
          - "link 1: cascade Client.postage_committed_cents += postage_variance_cents and Client.postage_escrow_available_cents -= postage_variance_cents; Client.version += 1"
          - "link 2, caused by this batch reaching MANIFESTED: if every PresortBatch of the job is now MANIFESTED, CompositionJob.status VERIFIED -> MANIFESTED and CompositionJob.version += 1"
          - "link 3, caused by the job reaching MANIFESTED: for every insert_code the job reserved, InsertStock.reserved_count -= reserved copies and consumed_count += the same amount; InsertStock.version += 1"

  - entity: UndeliverableReturn
    state_field: disposition
    initial_state: SCANNED
    terminal_states: [FEEDBACK_SENT]
    shape: "fork-join (SCANNED forks to ADDRESS_UPDATED or UNRESOLVED with divergent side-effect sets, both joining at FEEDBACK_SENT)"
    transitions:
      - from: SCANNED
        to: ADDRESS_UPDATED
        trigger: "POST /bureau/undeliverable-returns/{id}/classify (forwarding address supplied and reason_code != DECEASED)"
        actor: IntegrityAuditor
        preconditions:
          - "UndeliverableReturn.disposition == SCANNED (else ERR_RETURN_INVALID_STATE, 409)"
          - "both corrected_address_line1 and corrected_postal_code are present in the request"
          - "UndeliverableReturn.reason_code != DECEASED"
        side_effects:
          - "link 1: set disposition = ADDRESS_UPDATED, classified_at = logical clock, persist the corrected address fields; version += 1"
          - "link 2, caused by the return reaching ADDRESS_UPDATED: the StatementRecord behind MailPiece.statement_record_id has address_line1 and postal_code overwritten with the corrected values, hygiene_status -> CORRECTED and address_update_pending -> true; StatementRecord.version += 1; MailPiece.undeliverable_flag -> true and MailPiece.version += 1"
          - "link 3, caused by StatementRecord.address_update_pending flipping to true: Client.pending_address_feedback_count += 1 and Client.version += 1"
      - from: SCANNED
        to: UNRESOLVED
        trigger: "POST /bureau/undeliverable-returns/{id}/classify (no forwarding address, or reason_code == DECEASED)"
        actor: IntegrityAuditor
        preconditions:
          - "UndeliverableReturn.disposition == SCANNED (else ERR_RETURN_INVALID_STATE, 409)"
          - "either corrected_address_line1 or corrected_postal_code is absent, or reason_code == DECEASED"
        side_effects:
          - "link 1: set disposition = UNRESOLVED, classified_at = logical clock; any supplied corrected fields are discarded (persisted as null); version += 1"
          - "link 2, caused by the return reaching UNRESOLVED: the StatementRecord behind MailPiece.statement_record_id keeps its address but gets hygiene_status -> STALE and address_update_pending -> true; StatementRecord.version += 1; MailPiece.undeliverable_flag -> true and MailPiece.version += 1"
          - "link 3, caused by StatementRecord.address_update_pending flipping to true: Client.pending_address_feedback_count += 1 and Client.version += 1"
        note: "Divergent from the ADDRESS_UPDATED branch: the address is NOT overwritten and hygiene_status becomes STALE rather than CORRECTED."
      - from: ADDRESS_UPDATED
        to: FEEDBACK_SENT
        trigger: "system, cascaded by POST /bureau/clients/{id}/address-feedback"
        actor: system
        preconditions:
          - "UndeliverableReturn.disposition == ADDRESS_UPDATED"
          - "the return's owning client (MailPiece.composition_job_id -> CompositionJob.client_id) is the path client"
        side_effects:
          - "set feedback_sent_at = logical clock and feedback_batch_seq = Client.address_feedback_batch_count + 1; version += 1"
          - "the referenced StatementRecord.address_update_pending -> false; StatementRecord.version += 1"
      - from: UNRESOLVED
        to: FEEDBACK_SENT
        trigger: "system, cascaded by POST /bureau/clients/{id}/address-feedback"
        actor: system
        preconditions:
          - "UndeliverableReturn.disposition == UNRESOLVED"
          - "the return's owning client (MailPiece.composition_job_id -> CompositionJob.client_id) is the path client"
        side_effects:
          - "set feedback_sent_at = logical clock and feedback_batch_seq = Client.address_feedback_batch_count + 1; version += 1"
          - "the referenced StatementRecord.address_update_pending -> false; StatementRecord.version += 1"
        note: "The join: both fork branches converge on the same terminal disposition through one release call."

concurrency_rules:
  - rule_id: reprint-create-stale-job
    parent_entity: CompositionJob
    write_endpoint: "POST /bureau/mail-pieces/{id}/reprints"
    occ_field: "expected_composition_job_version"
    description: |
      Minting a replacement MailPiece against a CompositionJob whose version has
      advanced since the auditor last observed it is rejected. Reprints legitimately
      supersede one another - queuing a replacement for piece B is a valid operation
      in its own right and no state field on piece B has changed - so the stale view
      cannot be caught by any state precondition; only the parent job's version can
      detect that the auditor's picture of the job (its void, reprint, accountable
      and print-sheet counters, and its sla_hold_minutes) is out of date.
    error_id: ERR_STALE_COMPOSITION_JOB_VERSION
    http_status: 412
  - rule_id: batch-seal-stale-client-escrow
    parent_entity: Client
    write_endpoint: "POST /bureau/presort-batches/{id}/seal"
    occ_field: "expected_client_version"
    description: |
      Sealing a PresortBatch debits the Client's postage escrow, so the seal must be
      issued against a fresh view of the Client. Sealing batch B2 is legitimately
      valid on its own terms - B2 is OPEN and its job is VERIFIED - yet the escrow
      the controller believes is available may already have been committed by the
      seal of a sibling batch B1. A stale expected_client_version is rejected before
      the escrow sufficiency check runs.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

calculations:
  - name: data_file_format_validation
    trigger: "POST /bureau/data-files/{id}/validate-format"
    algorithm: aggregation
    formula: |
      # per-record predicate, selected by DataFile.format_spec_code
      for each record in StatementRecord where data_file_id == file.id, ordered by sequence_no ASC:
          base_ok = record.account_ref matches ^[A-Z]{3}[0-9]{4}$
                    AND record.statement_amount_cents >= 0
                    AND record.address_line1 is non-empty
          if file.format_spec_code == FIXED_WIDTH:
              record.format_valid = base_ok AND len(record.account_ref) == 7
                                    AND len(record.postal_code) == 5
          if file.format_spec_code == DELIMITED:
              record.format_valid = base_ok AND record.postal_code matches ^[0-9]{5}$
          if file.format_spec_code == XML:
              record.format_valid = base_ok AND record.region_code is non-empty
      file.format_error_count = count(records where format_valid == false)
      # branch: format_error_count > 0 leaves the file in RECEIVED and raises
      # ERR_FILE_FORMAT_ERRORS (422); zero errors advances RECEIVED -> FORMAT_VALIDATED
    input_set: "All StatementRecords attached to the DataFile, regardless of hygiene or delivery channel; processed in sequence_no ASC order."
    constants:
      ACCOUNT_REF_PATTERN: "^[A-Z]{3}[0-9]{4}$"
      POSTAL_CODE_PATTERN: "^[0-9]{5}$"
    precision: "integer counts; no rounding"

  - name: data_file_control_reconciliation
    trigger: "POST /bureau/data-files/{id}/control-check"
    algorithm: threshold
    formula: |
      actual_record_count        = count(records where data_file_id == file.id)
      actual_control_total_cents = sum(record.statement_amount_cents for those records)
      record_count_variance         = actual_record_count - file.declared_record_count
      control_total_variance_cents  = actual_control_total_cents - file.declared_control_total_cents
      if file.declared_control_total_cents == 0:
          control_total_variance_bp = (control_total_variance_cents == 0) ? 0 : 10000
      else:
          control_total_variance_bp = round_half_up(
              abs(control_total_variance_cents) * 10000 / file.declared_control_total_cents )
      tolerance = client.control_total_tolerance_bp        # per-client, NOT a global constant
      if record_count_variance == 0 AND control_total_variance_bp <= tolerance:
          FORMAT_VALIDATED -> ACCEPTED, accepted_at = logical clock
      else:
          FORMAT_VALIDATED -> HELD_VARIANCE
      # record_count_variance != 0 is fatal on its own: no count tolerance exists.
    input_set: "All StatementRecords attached to the DataFile. Rows are never excluded by format_valid; a file with format errors cannot reach FORMAT_VALIDATED at all."
    constants:
      COUNT_TOLERANCE: 0
      ZERO_DECLARED_TOTAL_VARIANCE_BP: 10000
    precision: "control_total_variance_bp is an integer, round_half_up on the basis-point quotient; comparison against tolerance is inclusive (<=)"

  - name: address_hygiene_confidence
    trigger: "POST /bureau/composition-jobs (per StatementRecord, at composition)"
    algorithm: weighted_scoring
    formula: |
      awarded_bp = 0
      if len(record.address_line1) >= 5:                awarded_bp += W_ADDRESS_LINE1
      if record.city is non-empty:                      awarded_bp += W_CITY
      if len(record.region_code) == 2:                  awarded_bp += W_REGION
      if record.postal_code matches ^[0-9]{5}$:         awarded_bp += W_POSTAL5
      if record.postal_code_plus4 matches ^[0-9]{4}$:   awarded_bp += W_PLUS4
      record.hygiene_confidence = round_half_up(awarded_bp / 10000, 2)
      if record.hygiene_confidence >= DELIVERABLE_THRESHOLD:      hygiene_status = DELIVERABLE
      elif record.hygiene_confidence >= CORRECTED_THRESHOLD:      hygiene_status = CORRECTED
      else:                                                       hygiene_status = UNDELIVERABLE_AS_ADDRESSED
      # Thresholds are inclusive on the lower edge (>=). The weights sum to
      # exactly 10000, so a fully-populated address scores exactly 1.00.
    input_set: "Every StatementRecord of the job's DataFile, including records that suppression will route to ELECTRONIC; hygiene is computed before the suppression join so an electronic record still carries a confidence."
    constants:
      W_ADDRESS_LINE1: 2500
      W_CITY: 1000
      W_REGION: 1500
      W_POSTAL5: 2200
      W_PLUS4: 2800
      DELIVERABLE_THRESHOLD: 0.90
      CORRECTED_THRESHOLD: 0.65
    precision: "two decimal places, round_half_up; comparisons use the rounded two-decimal value, not awarded_bp"

  - name: paperless_suppression_resolution
    trigger: "POST /bureau/composition-jobs (per StatementRecord, at composition)"
    algorithm: projection
    formula: |
      job.composition_epoch = client.paperless_sync_epoch    # snapshot taken once, at composition
      for each record ordered by sequence_no ASC:
          e = the PaperlessEnrollment with client_id == job.client_id
                                    AND account_ref == record.account_ref
              (the pair is unique; at most one row exists)
          suppressed = e is not null
                       AND e.status == ENROLLED
                       AND e.enrolled_epoch is not null
                       AND e.enrolled_epoch <= job.composition_epoch
          record.delivery_channel = suppressed ? ELECTRONIC : PRINT
          piece.piece_status      = suppressed ? SUPPRESSED : COMPOSED
          piece.mail_class        = suppressed ? NONE_ELECTRONIC : template.mail_class_preference
      job.electronic_piece_count = count(pieces where piece_status == SUPPRESSED)
      job.print_piece_count      = count(pieces where piece_status not in {SUPPRESSED, VOID})
      # POST /bureau/clients/{id}/paperless-sync first increments
      # client.paperless_sync_epoch to N, then stamps enrolled_epoch = N on every
      # PENDING row named in confirm_pending_account_refs. A job composed while the
      # client sat at epoch N-1 therefore does NOT see that enrollment, even though
      # the enrollment row already reads ENROLLED.
    input_set: "PaperlessEnrollments of the job's client only. PENDING rows never suppress (enrolled_epoch is null); REVOKED rows never suppress even when revoked_epoch > job.composition_epoch."
    constants:
      INITIAL_SYNC_EPOCH: 0
    precision: "integer epoch comparison; the epoch guard is inclusive (<=)"

  - name: variable_content_sheet_composition
    trigger: "POST /bureau/composition-jobs (per StatementRecord, at composition)"
    algorithm: threshold
    formula: |
      insert_codes = copy of template.required_insert_codes
      add_sheets   = 0
      for rule in template.variable_content_rules ordered by rule_code ASC:
          if record.statement_amount_cents >= rule.threshold_amount_cents:
              add_sheets += rule.add_sheets
              if rule.required_insert_code is not null:
                  insert_codes += rule.required_insert_code
      insert_codes = sort_ascending(deduplicate(insert_codes))
      insert_sheet_count = sum(InsertStock[c].sheets_per_insert for c in insert_codes)
      piece.sheet_count        = template.sheets_per_document + add_sheets + insert_sheet_count
      piece.insert_sheet_count = insert_sheet_count
      piece.color_page_count   = min(template.color_pages_per_document,
                                     piece.sheet_count * SIDES_PER_SHEET)
      piece.insert_codes       = insert_codes
      # Threshold comparison is inclusive: an amount exactly equal to
      # threshold_amount_cents fires the rule.
      job.total_sheet_count   = sum(piece.sheet_count        where piece.billable)
      job.insert_sheet_total  = sum(piece.insert_sheet_count where piece.billable)
      job.color_page_count    = sum(piece.color_page_count   where piece.billable)
      job.print_sheet_count   = sum(piece.sheet_count        where piece.piece_status not in {SUPPRESSED, VOID})
    input_set: "Rules are applied per record in rule_code ASC order; every rule whose threshold is met contributes, so contributions accumulate rather than selecting a single band."
    constants:
      SIDES_PER_SHEET: 2
    precision: "integer sheets; no rounding"

  - name: presort_qualification_waterfall
    trigger: "POST /bureau/composition-jobs/{id}/presort"
    algorithm: waterfall_allocation
    formula: |
      candidates = pieces of the job where piece_status not in {SUPPRESSED, VOID}
      # Tier 0 - machinability screen, evaluated first and unconditionally
      for p in candidates:
          if record(p).hygiene_status in {UNDELIVERABLE_AS_ADDRESSED, STALE}
             or p.sheet_count > MAX_MACHINABLE_SHEETS:
              p.presort_bucket = NONMACHINABLE
      residue = candidates with presort_bucket still PENDING
      # Tier 1 - five-digit
      for each group of residue keyed by record.postal_code, keys ascending:
          if size(group) >= MIN_FIVE_DIGIT_PIECES: bucket := FIVE_DIGIT for the group
      residue = residue still PENDING
      # Tier 2 - three-digit
      for each group of residue keyed by record.postal_code[0:3], keys ascending:
          if size(group) >= MIN_THREE_DIGIT_PIECES: bucket := THREE_DIGIT for the group
      residue = residue still PENDING
      # Tier 3 - AADC zone
      for each group of residue keyed by record.postal_code[0:1], keys ascending:
          if size(group) >= MIN_AADC_PIECES: bucket := AADC for the group
      # Tier 4 - everything left over
      for p in residue still PENDING: p.presort_bucket = MIXED_AADC
      # Batch materialisation: one PresortBatch per (mail_class, presort_bucket)
      # pair that has at least one piece, created in the pinned order
      # mail_class FIRST_CLASS then MARKETING, and within a class in bucket order
      # FIVE_DIGIT, THREE_DIGIT, AADC, MIXED_AADC, NONMACHINABLE.
      batch.piece_count = count(pieces assigned to the batch where piece_status != VOID)
      batch.tray_count  = ceil(batch.piece_count / TRAY_CAPACITY_PIECES)
      batch.reserved_insert_sheets = sum(insert_sheet_count over those pieces)
      # A group that fails its tier does NOT stay unqualified - it falls to the
      # next coarser tier and may there combine with pieces from other groups.
    input_set: "Print-channel, non-void pieces only. SUPPRESSED (electronic) pieces are excluded from every tier, so suppressing one account can shrink a five-digit group below MIN_FIVE_DIGIT_PIECES and demote its surviving siblings to THREE_DIGIT."
    constants:
      MAX_MACHINABLE_SHEETS: 12
      MIN_FIVE_DIGIT_PIECES: 3
      MIN_THREE_DIGIT_PIECES: 2
      MIN_AADC_PIECES: 2
      TRAY_CAPACITY_PIECES: 4
    precision: "integer counts; tray_count uses ceiling division"

  - name: postage_cost
    trigger: "POST /bureau/presort-batches/{id}/seal (estimated_postage) and POST /bureau/presort-batches/{id}/manifest (manifested_postage)"
    algorithm: tiered_pricing
    formula: |
      base_rate(mail_class, bucket) = BASE_RATE_TABLE[mail_class][bucket]
      surcharge(piece) = max(0, piece.sheet_count - FREE_SHEETS_PER_PIECE)
                         * SHEET_SURCHARGE_CENTS
      gross(piece)     = base_rate(batch.mail_class, batch.presort_bucket) + surcharge(piece)
      # variant estimated_postage
      estimated_postage_cents = sum over pieces of the batch with piece_status != VOID
                                of gross(piece)
      # variant manifested_postage
      discount_bp = (batch.mail_class == FIRST_CLASS)
                    ? facility.discount_bp_first_class
                    : facility.discount_bp_marketing
      net(piece)  = round_half_up(gross(piece) * (10000 - discount_bp) / 10000)
      manifested_postage_cents = sum over pieces of the batch with piece_status == INDUCTED
                                 of net(piece)
      postage_variance_cents = manifested_postage_cents - estimated_postage_cents
      # MANDATORY ORDER: the discount is applied and rounded PER PIECE, then the
      # per-piece results are summed. Summing the gross amounts first and rounding
      # the batch total once is a different, wrong number.
    input_set: "estimated_postage counts every non-void piece assigned to the batch and applies no facility discount (no entry facility is chosen yet at seal time). manifested_postage counts only pieces that reached INDUCTED and applies the facility's per-class discount."
    constants:
      FREE_SHEETS_PER_PIECE: 3
      SHEET_SURCHARGE_CENTS: 3
      BASE_RATE_TABLE:
        FIRST_CLASS: { FIVE_DIGIT: 53, THREE_DIGIT: 56, AADC: 58, MIXED_AADC: 62, NONMACHINABLE: 88 }
        MARKETING:   { FIVE_DIGIT: 27, THREE_DIGIT: 30, AADC: 33, MIXED_AADC: 37, NONMACHINABLE: 55 }
    precision: "integer cents; round_half_up applied once per piece in the manifested variant, never to the batch subtotal"
    variants:
      - name: estimated_postage
        when: "PresortBatch OPEN -> SEALED; the escrow commitment is taken against this figure"
        difference: "No entry facility and therefore no discount; input set is every non-void piece in the batch; no per-piece rounding occurs because gross amounts are already integers"
      - name: manifested_postage
        when: "PresortBatch SEALED -> MANIFESTED, once an EntryFacility is named"
        difference: "Applies the facility's per-class discount_bp with round_half_up per piece and restricts the input set to INDUCTED pieces; the difference from the estimate is booked as postage_variance_cents against the client's escrow"

  - name: press_line_selection
    trigger: "POST /bureau/composition-jobs/{id}/schedule when press_line_id is omitted"
    algorithm: weighted_scoring
    formula: |
      required = {}
      if template.duplex_required:        required += DUPLEX
      if job.color_page_count > 0:        required += COLOR
      if job.insert_sheet_total > 0:      required += INSERT
      eligible = press lines where status == AVAILABLE
                 AND set(capabilities) contains required
                 AND (daily_sheet_capacity - committed_sheet_count) >= job.print_sheet_count
                 AND no window conflict per print_run_window_sizing
      for line in eligible:
          headroom = line.daily_sheet_capacity - line.committed_sheet_count
          surplus  = count(line.capabilities not in required)
          score    = round_half_up(
                       headroom * HEADROOM_WEIGHT_BP / 10000
                     + line.sheets_per_hour * SPEED_WEIGHT_BP / 10000
                     - surplus * SURPLUS_PENALTY_POINTS, 2)
      winner = eligible ordered by score DESC, then sheets_per_hour DESC,
               then line_code ASC  -> first row
      run.press_line_id   = winner.id
      run.selection_score = winner score
      run.selection_mode  = SELECTED
      # When press_line_id IS supplied the selector does not run: selection_mode
      # is EXPLICIT, selection_score is still computed for the named line, and
      # every eligibility predicate is enforced as a validation instead.
    input_set: "PressLines in status AVAILABLE only; MAINTENANCE lines are invisible to the selector and rejected outright when named explicitly."
    constants:
      HEADROOM_WEIGHT_BP: 6000
      SPEED_WEIGHT_BP: 4000
      SURPLUS_PENALTY_POINTS: 500
    precision: "two decimal places, round_half_up; ranking compares the rounded scores"

  - name: print_run_window_sizing
    trigger: "POST /bureau/composition-jobs/{id}/schedule"
    algorithm: interval_merge
    formula: |
      run.planned_sheet_count = job.print_sheet_count            # snapshot
      run.run_minutes = max(MIN_RUN_MINUTES,
                            ceil(run.planned_sheet_count * 60 / line.sheets_per_hour))
      run.window_end  = run.window_start + run.run_minutes minutes
      buffer = line.changeover_buffer_minutes
      conflict(existing) =    run.window_start <= existing.window_end + buffer
                          AND existing.window_start <= run.window_end + buffer
      # CLOSED comparisons on both sides: a requested start exactly equal to
      # existing.window_end + buffer CONFLICTS; start = existing.window_end +
      # buffer + 1 minute does not.
      if any existing PrintRun on the same press line with status in {PLANNED, RUNNING}
         satisfies conflict(existing):  reject ERR_PRESS_WINDOW_CONFLICT (409)
    input_set: "PrintRuns on the same PressLine in status PLANNED or RUNNING. COMPLETED and ABORTED runs release their window and never conflict."
    constants:
      MIN_RUN_MINUTES: 60
    precision: "integer minutes; ceiling division on the sheet quotient, then the MIN_RUN_MINUTES floor"

  - name: one_to_one_integrity_reconciliation
    trigger: "POST /bureau/composition-jobs/{id}/reconcile-integrity"
    algorithm: aggregation
    formula: |
      accountable = pieces of the job where piece_status != VOID
      printable   = pieces of the job where piece_status not in {SUPPRESSED, VOID}
      job.accountable_piece_count = count(accountable)
      job.print_piece_count       = count(printable)
      for p in printable ordered by piece_seq ASC, created_at ASC:
          if p.integrity_status == SCAN_MATCHED:  p.integrity_status = RECONCILED
          elif p.integrity_status == UNVERIFIED:  p.integrity_status = SCAN_MISSING
          # DUPLICATE_SCAN is left untouched: it is evidence, not a pending state
      matched_count   = count(printable where integrity_status == RECONCILED)
      missing_count   = count(printable where integrity_status == SCAN_MISSING)
      duplicate_count = count(printable where integrity_status == DUPLICATE_SCAN)
      job.matched_piece_count  = matched_count
      job.missing_scan_count   = missing_count
      job.duplicate_scan_count = duplicate_count
      job.reprint_chain_depth  = longest reprint_of_piece_id chain among the job's pieces (0 when none)
      if missing_count == 0 AND duplicate_count == 0
         AND matched_count == job.print_piece_count:
          job.integrity_status = MATCHED  ; PRINTED -> VERIFIED
      else:
          job.integrity_status = BREACHED ; PRINTED -> INTEGRITY_HELD
      # Standing invariant, asserted on every reconcile:
      #   job.accountable_piece_count == job.expected_piece_count
      #                              == data_file.actual_record_count
    input_set: "Pieces of this job only. SUPPRESSED pieces are never scanned and are excluded from matched/missing/duplicate counts; VOID pieces are excluded from every count including accountable."
    constants:
      REQUIRED_STAGES: [PRINT, INSERT, INDUCT]
    precision: "integer counts; no rounding"

  - name: job_billing_total
    trigger: "POST /bureau/composition-jobs/{id}/close"
    algorithm: tiered_pricing
    formula: |
      # PINNED EIGHT-STEP ORDER - every step consumes only earlier steps
      step 1: composition_charge_cents = job.total_sheet_count * COMPOSITION_RATE_CENTS_PER_SHEET
      step 2: insert_charge_cents      = job.insert_sheet_total * INSERT_RATE_CENTS_PER_SHEET
      step 3: pre_discount_subtotal_cents = composition_charge_cents + insert_charge_cents
      step 4: discount_bp = tier lookup keyed on pre_discount_subtotal_cents:
                  pre_discount_subtotal_cents >= 400 -> 1200
                  pre_discount_subtotal_cents >= 230 ->  800
                  pre_discount_subtotal_cents >= 200 ->  400
                  otherwise                          ->    0
      step 5: volume_discount_cents = round_half_up(pre_discount_subtotal_cents * discount_bp / 10000)
      step 6: post_discount_subtotal = pre_discount_subtotal_cents - volume_discount_cents
      step 7: expedite_fee_cents = job.rush_requested
                  ? round_half_up(post_discount_subtotal * RUSH_FEE_BP / 10000)
                  : 0
      step 8: billing_total_cents = post_discount_subtotal + expedite_fee_cents
      # The two order traps:
      #  (a) the discount TIER is keyed on the step-3 pre-discount subtotal, never
      #      on the post-discount subtotal;
      #  (b) the expedite fee is a percentage of the step-6 POST-discount subtotal,
      #      never of the pre-discount subtotal.
    input_set: "Billable pieces only (MailPiece.billable is true, i.e. reprint_of_piece_id is null). Reprint replacements are bureau rework and contribute no sheets; the voided original it replaced remains billable, so a reprint never changes the invoice."
    constants:
      COMPOSITION_RATE_CENTS_PER_SHEET: 9
      INSERT_RATE_CENTS_PER_SHEET: 4
      RUSH_FEE_BP: 1500
      DISCOUNT_TIER_1_FLOOR_CENTS: 200
      DISCOUNT_TIER_1_BP: 400
      DISCOUNT_TIER_2_FLOOR_CENTS: 230
      DISCOUNT_TIER_2_BP: 800
      DISCOUNT_TIER_3_FLOOR_CENTS: 400
      DISCOUNT_TIER_3_BP: 1200
    precision: "integer cents; round_half_up applied independently at step 5 and step 7; tier floors are inclusive (>=)"

  - name: sla_penalty
    trigger: "POST /bureau/composition-jobs/{id}/schedule (projected_penalty) and POST /bureau/composition-jobs/{id}/close (assessed_penalty)"
    algorithm: threshold
    formula: |
      job.sla_due_at = data_file.accepted_at + client.sla_turnaround_hours hours
      severity_bp = job.rush_requested ? RUSH_SEVERITY_BP : BASE_SEVERITY_BP
      # variant projected_penalty
      job.projected_completion_at = run.window_end + FULFILMENT_LAG_MINUTES minutes
      late_minutes = max(0, minutes_between(job.sla_due_at, job.projected_completion_at))
      # variant assessed_penalty
      job.sla_completed_at = logical clock at close
      late_minutes = max(0, minutes_between(job.sla_due_at, job.sla_completed_at)
                            - job.sla_hold_minutes)
      # shared tail
      late_hours = ceil(late_minutes / 60)
      penalty    = min(client.sla_penalty_cap_cents,
                       round_half_up(late_hours * client.sla_penalty_rate_cents_per_hour
                                     * severity_bp / 10000))
      # sla_hold_minutes accrues only in the assessed variant: each exit from
      # INTEGRITY_HELD adds minutes_between(integrity_held_since, logical clock).
      # The projected variant knows nothing about holds, so the two variants
      # diverge whenever a reprint occurred.
    input_set: "A single CompositionJob and its Client's contract terms. The projected variant reads the scheduled PrintRun window; the assessed variant reads the recorded completion instant and the accumulated integrity hold."
    constants:
      FULFILMENT_LAG_MINUTES: 120
      BASE_SEVERITY_BP: 10000
      RUSH_SEVERITY_BP: 15000
    precision: "integer cents; lateness is ceiled to whole hours before multiplication; the cap clamp is applied last"
    variants:
      - name: projected_penalty
        when: "written at PRESORTED -> SCHEDULED, from the planned run window plus the fulfilment lag"
        difference: "Forward-looking: uses window_end + FULFILMENT_LAG_MINUTES, ignores sla_hold_minutes entirely, and is never recomputed after scheduling"
      - name: assessed_penalty
        when: "written at MANIFESTED -> CLOSED, from the actual completion instant"
        difference: "Chronological: uses the real sla_completed_at and subtracts the accumulated sla_hold_minutes before ceiling to whole hours, so a job held for integrity is credited for the hold"

  - name: dr_site_readiness
    trigger: "POST /bureau/dr-sites/{id}/drills, PATCH /bureau/dr-sites/{id}, GET /bureau/dr-sites/{id}, and as a guard inside POST /bureau/composition-jobs/{id}/schedule"
    algorithm: decay_function
    formula: |
      if site.last_drill_at is null:
          readiness_status = UNTESTED ; readiness_valid_until = null
      else:
          readiness_valid_until = site.last_drill_at + DR_DRILL_VALIDITY_HOURS hours
          if site.last_drill_result == FAIL:                       readiness_status = FAILED
          elif logical_clock > readiness_valid_until:               readiness_status = STALE
          elif site.replication_lag_minutes > MAX_REPLICATION_LAG_MINUTES:
                                                                    readiness_status = STALE
          else:                                                     readiness_status = READY
      # Step decay, not continuous: readiness is fully valid up to and including
      # readiness_valid_until and worthless one minute later.
      # Guard: when client.dr_readiness_required is true, scheduling requires the
      # single DrSite to read READY, else ERR_DR_SITE_NOT_READY (409).
    input_set: "The single DrSite row, evaluated against the logical clock at read time; readiness_status is recomputed on every read rather than stored stale."
    constants:
      DR_DRILL_VALIDITY_HOURS: 720
      MAX_REPLICATION_LAG_MINUTES: 15
    precision: "integer minutes and hours; the validity comparison is exclusive (a clock exactly equal to readiness_valid_until is still READY) and the lag comparison is exclusive (lag exactly equal to MAX_REPLICATION_LAG_MINUTES is still READY)"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role names one of the six declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Request shape: every required input field is present, enums are members of their declared value set, integers respect their declared bounds, datetimes are ISO 8601 UTC, and pagination limit is within [1, 100] with offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 10
    category: existence
    check: "Every id appearing in the path resolves, validated left to right; each entity has its own not-found error (ERR_CLIENT_NOT_FOUND, ERR_TEMPLATE_NOT_FOUND, ERR_INSERT_STOCK_NOT_FOUND, ERR_DATA_FILE_NOT_FOUND, ERR_RECORD_NOT_FOUND, ERR_JOB_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_MAIL_PIECE_NOT_FOUND, ERR_PRESS_LINE_NOT_FOUND, ERR_PRINT_RUN_NOT_FOUND, ERR_ENTRY_FACILITY_NOT_FOUND, ERR_PRESORT_BATCH_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_DR_SITE_NOT_FOUND)"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 12
    category: business_referential
    check: "Every id supplied in a request body resolves to an existing row of the expected entity (client_id, data_file_id, template_id, mail_piece_id, press_line_id, entry_facility_id) and reuses that entity's not-found error"
    error_id: ERR_DATA_FILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /bureau/composition-templates, POST /bureau/data-files, POST /bureau/statement-records, POST /bureau/paperless-enrollments, POST /bureau/composition-jobs, POST /bureau/composition-jobs/{id}/schedule, POST /bureau/undeliverable-returns, POST /bureau/presort-batches/{id}/manifest"
  - priority: 13
    category: business_referential
    check: "Cross-aggregate ownership: the named CompositionTemplate belongs to the same Client as the named DataFile, the scanned MailPiece belongs to the job in the path, and every UndeliverableReturn released by an address-feedback call belongs to the path Client"
    error_id: ERR_CLIENT_MISMATCH
    http_status: 422
    applies_to: "POST /bureau/composition-jobs, POST /bureau/clients/{id}/address-feedback"
  - priority: 14
    category: business_constraint
    check: "Uniqueness on creation: Client.client_code globally; (client_id, template_code, version_no) for CompositionTemplate; InsertStock.insert_code globally; (data_file_id, sequence_no) for StatementRecord; (client_id, account_ref) for a PaperlessEnrollment that is not REVOKED; PressLine.line_code and EntryFacility.facility_code globally"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /bureau/clients, POST /bureau/composition-templates, POST /bureau/insert-stocks, POST /bureau/statement-records, POST /bureau/paperless-enrollments, POST /bureau/press-lines, POST /bureau/entry-facilities"
  - priority: 15
    category: business_constraint
    check: "At most one DrSite may exist in the system; a second creation attempt is refused"
    error_id: ERR_DR_SITE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /bureau/dr-sites"
  - priority: 16
    category: business_constraint
    check: "At most one UndeliverableReturn may exist per MailPiece"
    error_id: ERR_RETURN_DUPLICATE
    http_status: 409
    applies_to: "POST /bureau/undeliverable-returns"
  - priority: 20
    category: state
    check: "The Client is in status ACTIVE; a SUSPENDED client may not lodge DataFiles, receive records, compose jobs or take postage deposits"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /bureau/data-files, POST /bureau/statement-records, POST /bureau/composition-jobs, POST /bureau/clients/{id}/postage-deposits"
  - priority: 21
    category: state
    check: "The DataFile is in the status the operation requires: RECEIVED for validate-format and for attaching StatementRecords, FORMAT_VALIDATED for control-check, HELD_VARIANCE for amend-control-totals, ACCEPTED for composition"
    error_id: ERR_FILE_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/statement-records, POST /bureau/data-files/{id}/validate-format, POST /bureau/data-files/{id}/control-check, POST /bureau/data-files/{id}/amend-control-totals, POST /bureau/composition-jobs"
  - priority: 22
    category: state
    check: "The named CompositionTemplate is in status ACTIVE; a DRAFT or RETIRED version may not compose a job"
    error_id: ERR_TEMPLATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bureau/composition-jobs"
  - priority: 23
    category: state
    check: "The CompositionJob is in the status the operation requires: COMPOSED for presort, PRESORTED for schedule, PRINTED for reconcile-integrity, INTEGRITY_HELD for a reprint, MANIFESTED for close, and one of PRINTING / PRINTED / INTEGRITY_HELD for a barcode scan"
    error_id: ERR_JOB_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/presort, POST /bureau/composition-jobs/{id}/schedule, POST /bureau/composition-jobs/{id}/reconcile-integrity, POST /bureau/composition-jobs/{id}/close, POST /bureau/mail-pieces/{id}/scans, POST /bureau/mail-pieces/{id}/reprints, POST /bureau/presort-batches/{id}/seal"
  - priority: 24
    category: state
    check: "The PrintRun is in the status the operation requires: PLANNED for start, RUNNING for complete and abort"
    error_id: ERR_RUN_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/print-runs/{id}/start, POST /bureau/print-runs/{id}/complete, POST /bureau/print-runs/{id}/abort"
  - priority: 25
    category: state
    check: "The PresortBatch is OPEN for seal; a batch that is already SEALED or MANIFESTED cannot be sealed again"
    error_id: ERR_BATCH_NOT_OPEN
    http_status: 409
    applies_to: "POST /bureau/presort-batches/{id}/seal"
  - priority: 26
    category: state
    check: "The PresortBatch is SEALED for unseal and for manifest"
    error_id: ERR_BATCH_NOT_SEALED
    http_status: 409
    applies_to: "POST /bureau/presort-batches/{id}/unseal, POST /bureau/presort-batches/{id}/manifest"
  - priority: 27
    category: state
    check: "The MailPiece is scannable: piece_status is not SUPPRESSED and not VOID"
    error_id: ERR_PIECE_NOT_SCANNABLE
    http_status: 409
    applies_to: "POST /bureau/mail-pieces/{id}/scans, POST /bureau/undeliverable-returns"
  - priority: 28
    category: state
    check: "The MailPiece is reprint-eligible: integrity_status is SCAN_MISSING or DUPLICATE_SCAN and piece_status is not VOID"
    error_id: ERR_PIECE_NOT_REPRINT_ELIGIBLE
    http_status: 409
    applies_to: "POST /bureau/mail-pieces/{id}/reprints"
  - priority: 29
    category: state
    check: "The UndeliverableReturn is in status SCANNED for classify; a return that is already classified or released cannot be reclassified"
    error_id: ERR_RETURN_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/undeliverable-returns/{id}/classify"
  - priority: 30
    category: state
    check: "The PaperlessEnrollment is in status PENDING or ENROLLED for revoke; a REVOKED row cannot be revoked again"
    error_id: ERR_ENROLLMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/paperless-enrollments/{id}/revoke"
  - priority: 31
    category: state
    check: "The CompositionTemplate is in status DRAFT for activation, and no sibling template sharing (client_id, template_code) is already ACTIVE with a higher version_no"
    error_id: ERR_TEMPLATE_INVALID_STATE
    http_status: 409
    applies_to: "POST /bureau/composition-templates/{id}/activate"
  - priority: 32
    category: state
    check: "The named PressLine is in status AVAILABLE; a MAINTENANCE line can neither be selected nor named explicitly"
    error_id: ERR_PRESS_LINE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/schedule, POST /bureau/print-runs/{id}/start"
  - priority: 33
    category: state
    check: "The named EntryFacility is in status OPEN"
    error_id: ERR_ENTRY_FACILITY_CLOSED
    http_status: 409
    applies_to: "POST /bureau/presort-batches/{id}/manifest"
  - priority: 40
    category: business_constraint
    check: "expected_composition_job_version in the request equals the current CompositionJob.version (§1.2.1 rule reprint-create-stale-job)"
    error_id: ERR_STALE_COMPOSITION_JOB_VERSION
    http_status: 412
    applies_to: "POST /bureau/mail-pieces/{id}/reprints"
  - priority: 41
    category: business_constraint
    check: "expected_client_version in the request equals the current Client.version (§1.2.1 rule batch-seal-stale-client-escrow)"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /bureau/presort-batches/{id}/seal"
  - priority: 42
    category: auth
    check: "Segregation of duties: the acting X-User-ID must differ from PresortBatch.sealed_by_user_id when manifesting, and from CompositionJob.composed_by_user_id when closing the job"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bureau/presort-batches/{id}/manifest, POST /bureau/composition-jobs/{id}/close"
  - priority: 50
    category: business_safety
    check: "Every insert code the template requires - unconditional and rule-triggered - resolves to an InsertStock with status ACTIVE whose effective window contains the composition instant (effective_from <= clock and (effective_to is null or clock < effective_to))"
    error_id: ERR_INSERT_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /bureau/composition-jobs"
  - priority: 51
    category: business_safety
    check: "Every insert code named by a template or a variable content rule exists in InsertStock"
    error_id: ERR_INSERT_CODE_UNKNOWN
    http_status: 422
    applies_to: "POST /bureau/composition-templates, POST /bureau/composition-jobs"
  - priority: 52
    category: business_safety
    check: "The DataFile has zero format errors; validate-format refuses to advance a file whose format_error_count is greater than zero"
    error_id: ERR_FILE_FORMAT_ERRORS
    http_status: 422
    applies_to: "POST /bureau/data-files/{id}/validate-format"
  - priority: 53
    category: business_safety
    check: "An amendment must actually move a declared control figure: at least one of declared_record_count or declared_control_total_cents differs from the stored value"
    error_id: ERR_AMENDMENT_NO_CHANGE
    http_status: 422
    applies_to: "POST /bureau/data-files/{id}/amend-control-totals"
  - priority: 54
    category: business_safety
    check: "A DataFile must carry at least one StatementRecord before it can be format-validated"
    error_id: ERR_FILE_EMPTY
    http_status: 422
    applies_to: "POST /bureau/data-files/{id}/validate-format"
  - priority: 55
    category: business_safety
    check: "When Client.dr_readiness_required is true the single DrSite must read readiness_status READY at scheduling time"
    error_id: ERR_DR_SITE_NOT_READY
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 60
    category: business_temporal
    check: "The requested PrintRun window_start is not earlier than the current logical clock"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 61
    category: business_temporal
    check: "The induction window is well formed: induction_window_start is strictly before induction_window_end and the span does not exceed 1440 minutes"
    error_id: ERR_INVALID_INDUCTION_WINDOW
    http_status: 422
    applies_to: "POST /bureau/presort-batches/{id}/manifest"
  - priority: 62
    category: business_constraint
    check: "The named PressLine carries every capability the job requires (DUPLEX when the template demands duplex, COLOR when color_page_count > 0, INSERT when insert_sheet_total > 0)"
    error_id: ERR_PRESS_LINE_CAPABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 63
    category: business_temporal
    check: "The requested run window does not conflict with any PLANNED or RUNNING PrintRun on the same PressLine under the closed-interval changeover-buffer test"
    error_id: ERR_PRESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 64
    category: business_constraint
    check: "When press_line_id is omitted at least one PressLine survives every eligibility predicate of press_line_selection"
    error_id: ERR_NO_ELIGIBLE_PRESS_LINE
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 65
    category: business_constraint
    check: "An address-feedback release requires at least one UndeliverableReturn of the client in disposition ADDRESS_UPDATED or UNRESOLVED"
    error_id: ERR_NO_PENDING_FEEDBACK
    http_status: 409
    applies_to: "POST /bureau/clients/{id}/address-feedback"
  - priority: 70
    category: business_constraint
    check: "The PressLine has sheet headroom: committed_sheet_count + planned_sheet_count does not exceed daily_sheet_capacity"
    error_id: ERR_PRESS_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bureau/composition-jobs/{id}/schedule"
  - priority: 71
    category: business_constraint
    check: "Aggregate induction capacity: the manifesting batch's tray_count plus the tray_count of every already-MANIFESTED batch at that facility whose half-open induction window intersects the requested one does not exceed tray_capacity_per_window"
    error_id: ERR_INDUCTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bureau/presort-batches/{id}/manifest"
  - priority: 72
    category: business_constraint
    check: "InsertStock has enough unreserved copies: on_hand_count covers every copy the job needs for that insert code, one copy per non-SUPPRESSED piece carrying the code"
    error_id: ERR_INSERT_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /bureau/composition-jobs, POST /bureau/mail-pieces/{id}/reprints"
  - priority: 80
    category: business_fiscal
    check: "Postage escrow covers the commitment: at seal, postage_escrow_available_cents >= estimated_postage_cents; at manifest, a positive postage_variance_cents is covered by the remaining postage_escrow_available_cents"
    error_id: ERR_POSTAGE_ESCROW_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bureau/presort-batches/{id}/seal, POST /bureau/presort-batches/{id}/manifest"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, effectivity window, induction window, drill validity and SLA computation reads this clock."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["sets the logical clock used by every timestamp, effectivity, window and readiness computation"]

  - method: POST
    path: "/bureau/clients"
    description: "Register an issuing client with its contracted SLA terms, control-total tolerance and DR requirement."
    roles: [BureauAdmin]
    code: 201
    input: ["client_code", "name", "sla_turnaround_hours?", "sla_penalty_rate_cents_per_hour?", "sla_penalty_cap_cents?", "dr_readiness_required?", "control_total_tolerance_bp?", "status?"]
    output: Client
    side_effects: ["initialises postage_deposited_cents, postage_committed_cents, postage_escrow_available_cents, paperless_sync_epoch, pending_address_feedback_count and address_feedback_batch_count to 0"]
  - method: GET
    path: "/bureau/clients/{id}"
    description: "Read a client including its live postage escrow ledger and paperless sync epoch."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/bureau/clients"
    description: "Paginated client list, ordered by client_code ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Client[]"
    side_effects: []
  - method: PATCH
    path: "/bureau/clients/{id}"
    description: "Amend commercial terms: SLA turnaround, penalty rate and cap, control-total tolerance, DR requirement, commercial standing."
    roles: [BureauAdmin]
    code: 200
    input: ["name?", "sla_turnaround_hours?", "sla_penalty_rate_cents_per_hour?", "sla_penalty_cap_cents?", "dr_readiness_required?", "control_total_tolerance_bp?", "status?"]
    output: Client
    side_effects: ["increments Client.version by 1", "does not retroactively change sla_due_at on jobs already composed"]
  - method: POST
    path: "/bureau/clients/{id}/postage-deposits"
    description: "Fund the client's postage escrow."
    roles: [PostageController]
    code: 200
    input: ["amount_cents", "reference?"]
    output: Client
    side_effects: ["postage_deposited_cents += amount_cents", "postage_escrow_available_cents += amount_cents", "increments Client.version by 1", "preserves the invariant postage_deposited_cents == postage_escrow_available_cents + postage_committed_cents"]
  - method: POST
    path: "/bureau/clients/{id}/paperless-sync"
    description: "Run a suppression-file synchronisation: advance the client's paperless_sync_epoch, then confirm the named PENDING enrollments at the new epoch."
    roles: [ClientLiaison]
    code: 200
    input: ["confirm_pending_account_refs"]
    output: Client
    side_effects: ["paperless_sync_epoch += 1", "every PaperlessEnrollment of this client in status PENDING whose account_ref appears in confirm_pending_account_refs moves PENDING -> ENROLLED with enrolled_epoch = the new epoch, confirmed_at = logical clock, suppression_effective = true and version += 1", "account_refs that resolve to no PENDING row are ignored silently", "increments Client.version by 1"]
  - method: POST
    path: "/bureau/clients/{id}/address-feedback"
    description: "Release an address-update feedback batch to the client, closing out every classified undeliverable return."
    roles: [ClientLiaison]
    code: 200
    input: ["note?"]
    output: Client
    side_effects: ["address_feedback_batch_count += 1", "every UndeliverableReturn of this client in disposition ADDRESS_UPDATED or UNRESOLVED moves to FEEDBACK_SENT with feedback_sent_at = logical clock and feedback_batch_seq = the new batch number", "each referenced StatementRecord.address_update_pending -> false with version += 1", "pending_address_feedback_count -> 0", "increments Client.version by 1"]
  - method: GET
    path: "/bureau/clients/{id}/composition-templates"
    description: "Every template version defined for this client, ordered by template_code ASC then version_no ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CompositionTemplate[]"
    side_effects: []
  - method: GET
    path: "/bureau/clients/{id}/data-files"
    description: "Every data file lodged by this client, ordered by created_at ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DataFile[]"
    side_effects: []
  - method: GET
    path: "/bureau/clients/{id}/paperless-enrollments"
    description: "The client's suppression file, ordered by account_ref ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PaperlessEnrollment[]"
    side_effects: []

  - method: POST
    path: "/bureau/composition-templates"
    description: "Create a DRAFT template version with its regulatory inserts and variable content rules."
    roles: [BureauAdmin]
    code: 201
    input: ["client_id", "template_code", "version_no", "duplex_required", "sheets_per_document", "color_pages_per_document?", "mail_class_preference?", "required_insert_codes?", "variable_content_rules?"]
    output: CompositionTemplate
    side_effects: ["validates every named insert_code against InsertStock", "starts in status DRAFT with activated_at and retired_at null"]
  - method: GET
    path: "/bureau/composition-templates/{id}"
    description: "Read one template version."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: CompositionTemplate
    side_effects: []
  - method: POST
    path: "/bureau/composition-templates/{id}/activate"
    description: "Activate a DRAFT template version, retiring any lower ACTIVE version in the same (client_id, template_code) family."
    roles: [BureauAdmin]
    code: 200
    input: []
    output: CompositionTemplate
    side_effects: ["DRAFT -> ACTIVE with activated_at = logical clock", "cascade: the previously ACTIVE version of the same family moves ACTIVE -> RETIRED with retired_at = logical clock and version += 1", "increments CompositionTemplate.version by 1"]

  - method: POST
    path: "/bureau/insert-stocks"
    description: "Receive a regulatory insert into the bureau warehouse with its effectivity window."
    roles: [BureauAdmin]
    code: 201
    input: ["insert_code", "description", "jurisdiction_code", "effective_from", "effective_to?", "sheets_per_insert?", "received_count", "status?"]
    output: InsertStock
    side_effects: ["on_hand_count initialised to received_count; reserved_count and consumed_count to 0", "establishes the invariant received_count == on_hand_count + reserved_count + consumed_count"]
  - method: GET
    path: "/bureau/insert-stocks/{id}"
    description: "Read one insert stock row including its reservation ledger."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: InsertStock
    side_effects: []
  - method: GET
    path: "/bureau/insert-stocks"
    description: "Paginated insert stock list, ordered by insert_code ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "jurisdiction_code?", "limit?", "offset?"]
    output: "InsertStock[]"
    side_effects: []

  - method: POST
    path: "/bureau/data-files"
    description: "Lodge a client data file with its declared trailer counts and control total."
    roles: [ClientLiaison]
    code: 201
    input: ["client_id", "file_name", "format_spec_code", "declared_record_count", "declared_control_total_cents"]
    output: DataFile
    side_effects: ["status RECEIVED, received_at = logical clock", "all actual and variance counters initialised to 0"]
  - method: GET
    path: "/bureau/data-files/{id}"
    description: "Read a data file with its live actual counts and variance figures."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: DataFile
    side_effects: []
  - method: POST
    path: "/bureau/data-files/{id}/validate-format"
    description: "Run the per-record format predicate selected by format_spec_code."
    roles: [CompositionOperator]
    code: 200
    input: []
    output: DataFile
    side_effects: ["runs calculations.data_file_format_validation over records in sequence_no ASC order", "writes StatementRecord.format_valid on every record and DataFile.format_error_count", "on zero errors RECEIVED -> FORMAT_VALIDATED", "increments DataFile.version by 1"]
  - method: POST
    path: "/bureau/data-files/{id}/control-check"
    description: "Reconcile record counts and control totals against the declared trailer, branching on the client's tolerance."
    roles: [CompositionOperator]
    code: 200
    input: []
    output: DataFile
    side_effects: ["runs calculations.data_file_control_reconciliation", "writes actual_record_count, actual_control_total_cents, record_count_variance, control_total_variance_cents and control_total_variance_bp", "branches FORMAT_VALIDATED -> ACCEPTED (accepted_at = logical clock, the SLA clock origin) or FORMAT_VALIDATED -> HELD_VARIANCE", "increments DataFile.version by 1"]
  - method: POST
    path: "/bureau/data-files/{id}/amend-control-totals"
    description: "Client-side amendment of the declared trailer figures on a variance-held file, sending it back for re-validation."
    roles: [ClientLiaison]
    code: 200
    input: ["declared_record_count?", "declared_control_total_cents?"]
    output: DataFile
    side_effects: ["overwrites the supplied declared figures", "amendment_count += 1", "HELD_VARIANCE -> RECEIVED, clearing format_error_count and every variance counter to 0", "increments DataFile.version by 1"]
  - method: GET
    path: "/bureau/data-files/{id}/statement-records"
    description: "Every record attached to this file, ordered by sequence_no ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["hygiene_status?", "delivery_channel?", "limit?", "offset?"]
    output: "StatementRecord[]"
    side_effects: []

  - method: POST
    path: "/bureau/statement-records"
    description: "Attach one statement record to a RECEIVED data file."
    roles: [ClientLiaison]
    code: 201
    input: ["data_file_id", "account_ref", "sequence_no", "statement_amount_cents", "address_line1", "city", "region_code", "postal_code", "postal_code_plus4?"]
    output: StatementRecord
    side_effects: ["hygiene_status PENDING, delivery_channel PENDING, format_valid false until validate-format runs", "DataFile.actual_record_count and actual_control_total_cents are NOT recomputed here - only control-check writes them"]
  - method: GET
    path: "/bureau/statement-records/{id}"
    description: "Read one statement record including its hygiene confidence and resolved delivery channel."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: StatementRecord
    side_effects: []

  - method: POST
    path: "/bureau/paperless-enrollments"
    description: "Enroll an account for electronic delivery, or re-open a previously REVOKED enrollment for the same (client_id, account_ref)."
    roles: [ClientLiaison]
    code: 201
    input: ["client_id", "account_ref", "channel"]
    output: PaperlessEnrollment
    side_effects: ["a new row starts in PENDING with enrolled_epoch null and suppression_effective false", "an existing REVOKED row for the same (client_id, account_ref) is reactivated REVOKED -> PENDING with enrolled_epoch, revoked_epoch, confirmed_at and revoked_at cleared and version += 1", "PENDING never suppresses print - only a paperless-sync confirmation does"]
  - method: GET
    path: "/bureau/paperless-enrollments/{id}"
    description: "Read one enrollment including its suppression epoch."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: PaperlessEnrollment
    side_effects: []
  - method: POST
    path: "/bureau/paperless-enrollments/{id}/revoke"
    description: "Revoke an enrollment so future jobs print for that account again."
    roles: [ClientLiaison]
    code: 200
    input: []
    output: PaperlessEnrollment
    side_effects: ["PENDING or ENROLLED -> REVOKED with revoked_at = logical clock and revoked_epoch = the client's current paperless_sync_epoch", "suppression_effective -> false", "increments PaperlessEnrollment.version by 1", "jobs already composed keep the suppression decision snapshotted at their composition_epoch"]

  - method: POST
    path: "/bureau/composition-jobs"
    description: "Compose a job from an ACCEPTED data file and an ACTIVE template: mint one MailPiece per record, score address hygiene, resolve the suppression file, apply variable content rules and reserve regulatory inserts."
    roles: [CompositionOperator]
    code: 201
    input: ["data_file_id", "template_id", "rush_requested?"]
    output: CompositionJob
    side_effects: ["copies client_id from the DataFile and snapshots composition_epoch = Client.paperless_sync_epoch", "runs calculations.address_hygiene_confidence per record, writing hygiene_confidence and hygiene_status", "runs calculations.paperless_suppression_resolution, writing StatementRecord.delivery_channel and minting each MailPiece as COMPOSED or SUPPRESSED", "runs calculations.variable_content_sheet_composition, writing per-piece sheet_count, insert_sheet_count, color_page_count and insert_codes plus the job's total_sheet_count, print_sheet_count, insert_sheet_total and color_page_count", "mints one MailPiece per StatementRecord in sequence_no ASC order with a deterministic imb_barcode, piece_status COMPOSED or SUPPRESSED and integrity_status UNVERIFIED", "reserves insert copies: for every insert code appearing in any composed piece, copies = the number of non-SUPPRESSED pieces whose insert_codes contain that code (exactly one copy per piece), and InsertStock.on_hand_count -= copies, reserved_count += copies, version += 1", "writes expected_piece_count, accountable_piece_count, print_piece_count and electronic_piece_count", "writes sla_due_at = DataFile.accepted_at + Client.sla_turnaround_hours", "records composed_by_user_id from X-User-ID", "cascade: DataFile ACCEPTED -> CONSUMED with version += 1"]
  - method: GET
    path: "/bureau/composition-jobs/{id}"
    description: "Read a job with its live piece counters, integrity rollup, SLA figures and billing figures."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: CompositionJob
    side_effects: []
  - method: GET
    path: "/bureau/composition-jobs"
    description: "Filtered, paginated job list ordered by created_at ASC; the reverse-reachability channel for CompositionJob.client_id, CompositionJob.data_file_id and CompositionJob.template_id."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["client_id?", "data_file_id?", "template_id?", "status?", "integrity_status?", "limit?", "offset?"]
    output: "CompositionJob[]"
    side_effects: []
  - method: POST
    path: "/bureau/composition-jobs/{id}/presort"
    description: "Run the presort waterfall over the job's print-channel pieces and materialise one PresortBatch per (mail_class, presort_bucket) pair."
    roles: [CompositionOperator]
    code: 200
    input: []
    output: CompositionJob
    side_effects: ["runs calculations.presort_qualification_waterfall, writing MailPiece.presort_bucket and presort_batch_id on every non-suppressed, non-void piece", "creates PresortBatch rows in the pinned order FIRST_CLASS then MARKETING and within a class FIVE_DIGIT, THREE_DIGIT, AADC, MIXED_AADC, NONMACHINABLE, each starting in status OPEN with piece_count, tray_count and reserved_insert_sheets written", "COMPOSED -> PRESORTED", "increments CompositionJob.version by 1"]
  - method: POST
    path: "/bureau/composition-jobs/{id}/schedule"
    description: "Schedule the job onto a press line, either explicitly or by running the press_line_selection selector, and create the PrintRun."
    roles: [ProductionScheduler]
    code: 201
    input: ["window_start", "press_line_id?"]
    output: PrintRun
    side_effects: ["runs calculations.press_line_selection when press_line_id is omitted, writing selection_score and selection_mode SELECTED; a named line yields selection_mode EXPLICIT with the same score formula", "runs calculations.print_run_window_sizing, writing planned_sheet_count, run_minutes and window_end", "creates the PrintRun in status PLANNED", "cascade: PressLine.committed_sheet_count += planned_sheet_count, utilization_bp recomputed as committed_sheet_count * 10000 / daily_sheet_capacity, PressLine.version += 1", "runs calculations.sla_penalty variant projected_penalty, writing projected_completion_at and projected_penalty_cents on the job", "enforces calculations.dr_site_readiness when Client.dr_readiness_required is true", "PRESORTED -> SCHEDULED", "increments CompositionJob.version by 1"]
  - method: POST
    path: "/bureau/composition-jobs/{id}/reconcile-integrity"
    description: "Reconcile one-to-one mail piece integrity across the three scan stages and branch the job to VERIFIED or INTEGRITY_HELD."
    roles: [IntegrityAuditor]
    code: 200
    input: []
    output: CompositionJob
    side_effects: ["runs calculations.one_to_one_integrity_reconciliation over pieces in piece_seq ASC, created_at ASC order", "each printable piece moves SCAN_MATCHED -> RECONCILED or UNVERIFIED -> SCAN_MISSING with version += 1; DUPLICATE_SCAN is preserved", "writes job.integrity_status MATCHED or BREACHED and refreshes accountable_piece_count and print_piece_count", "branches PRINTED -> VERIFIED or PRINTED -> INTEGRITY_HELD, setting integrity_held_since = logical clock on the breach branch", "increments CompositionJob.version by 1"]
  - method: POST
    path: "/bureau/composition-jobs/{id}/close"
    description: "Close a fully manifested job, assessing the SLA penalty and computing the invoice."
    roles: [BureauAdmin]
    code: 200
    input: []
    output: CompositionJob
    side_effects: ["sets sla_completed_at = logical clock", "runs calculations.sla_penalty variant assessed_penalty, writing assessed_penalty_cents", "runs calculations.job_billing_total, writing composition_charge_cents, insert_charge_cents, pre_discount_subtotal_cents, volume_discount_cents, expedite_fee_cents and billing_total_cents", "MANIFESTED -> CLOSED", "increments CompositionJob.version by 1"]
  - method: GET
    path: "/bureau/composition-jobs/{id}/integrity-summary"
    description: "Computed read: the job's one-to-one integrity picture (accountable_piece_count, print_piece_count, matched_piece_count, missing_scan_count, duplicate_scan_count and reprint_chain_depth as last written by reconcile-integrity or a reprint) plus integrity_status, without mutating anything or bumping version."
    roles: [BureauAdmin, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: CompositionJob
    side_effects: []

  - method: GET
    path: "/bureau/mail-pieces/{id}"
    description: "Read one mail piece with both state dimensions, its barcode, its presort bucket and its scan tally."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: MailPiece
    side_effects: []
  - method: GET
    path: "/bureau/mail-pieces"
    description: "Filtered, paginated mail piece list ordered by piece_seq ASC then created_at ASC; the reverse-reachability channel for MailPiece.composition_job_id, MailPiece.statement_record_id, MailPiece.presort_batch_id and the self-referential MailPiece.reprint_of_piece_id."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["composition_job_id?", "statement_record_id?", "presort_batch_id?", "reprint_of_piece_id?", "piece_status?", "integrity_status?", "presort_bucket?", "limit?", "offset?"]
    output: "MailPiece[]"
    side_effects: []
  - method: POST
    path: "/bureau/mail-pieces/{id}/scans"
    description: "Record a barcode read at a production stage. Refusals are recorded as unaccepted ScanEvents rather than rejected requests, so the audit log keeps every read."
    roles: [IntegrityAuditor]
    code: 201
    input: ["stage", "scanned_barcode", "device_code"]
    output: ScanEvent
    side_effects: ["appends an immutable ScanEvent with scanned_at = logical clock", "accepted when scanned_barcode == MailPiece.imb_barcode, the stage has no prior accepted read, and the stage follows piece_status (PRINT from COMPOSED, INSERT from PRINTED, INDUCT from INSERTED)", "on acceptance advances MailPiece.piece_status one step, sets last_scan_stage, increments accepted_scan_count and version", "an INDUCT acceptance that completes all three stages also moves MailPiece.integrity_status UNVERIFIED -> SCAN_MATCHED", "a read whose stage already has an accepted event is recorded with rejection_reason DUPLICATE_STAGE and drives MailPiece.integrity_status to DUPLICATE_SCAN with version += 1", "a read that does not match imb_barcode is recorded with rejection_reason UNKNOWN_BARCODE and changes no MailPiece field", "a read whose stage does not follow piece_status is recorded with rejection_reason OUT_OF_SEQUENCE and changes no MailPiece field"]
  - method: POST
    path: "/bureau/mail-pieces/{id}/reprints"
    description: "Void a piece that failed one-to-one integrity and mint its replacement, releasing the job from integrity hold."
    roles: [IntegrityAuditor]
    code: 201
    input: ["expected_composition_job_version", "reprint_reason?"]
    output: MailPiece
    side_effects: ["rejects a stale expected_composition_job_version with ERR_STALE_COMPOSITION_JOB_VERSION (412) once the piece-level state gates have passed, at validation priority 40 (§1.2.1 rule reprint-create-stale-job)", "the named piece moves piece_status -> VOID with version += 1, retaining its ScanEvent log and its SCAN_MISSING or DUPLICATE_SCAN integrity_status for audit", "mints a replacement MailPiece with reprint_of_piece_id set, billable false, piece_status COMPOSED, integrity_status UNVERIFIED, last_scan_stage NONE, accepted_scan_count 0, and the predecessor's statement_record_id, piece_seq, presort_batch_id, presort_bucket, mail_class, sheet_count, insert_sheet_count, color_page_count and insert_codes inherited unchanged", "the replacement's imb_barcode is the predecessor's barcode suffixed -R<reprint_index>", "InsertStock movement: the voided piece's reserved copies return to on_hand_count and the replacement reserves the same number again, so received_count == on_hand_count + reserved_count + consumed_count still holds; version += 1 on each touched row", "job counters refresh: void_piece_count, reprint_piece_count, accountable_piece_count, print_sheet_count and reprint_chain_depth, with matched_piece_count, missing_scan_count and duplicate_scan_count reset to 0", "job sla_hold_minutes += minutes_between(integrity_held_since, logical clock) and integrity_held_since -> null", "cascade: CompositionJob INTEGRITY_HELD -> PRINTED", "increments CompositionJob.version by 1"]
  - method: GET
    path: "/bureau/mail-pieces/{id}/scan-events"
    description: "The immutable scan log for this piece, ordered by scanned_at ASC then created_at ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["stage?", "accepted?", "limit?", "offset?"]
    output: "ScanEvent[]"
    side_effects: []
  - method: GET
    path: "/bureau/mail-pieces/{id}/undeliverable-returns"
    description: "Undeliverable returns recorded against this piece; at most one exists, so the array is length 0 or 1."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["disposition?", "limit?", "offset?"]
    output: "UndeliverableReturn[]"
    side_effects: []

  - method: POST
    path: "/bureau/press-lines"
    description: "Commission a press line with its capability tags, throughput, changeover buffer and daily sheet capacity."
    roles: [BureauAdmin]
    code: 201
    input: ["line_code", "capabilities", "sheets_per_hour", "daily_sheet_capacity", "changeover_buffer_minutes?", "status?"]
    output: PressLine
    side_effects: ["committed_sheet_count and utilization_bp initialised to 0"]
  - method: GET
    path: "/bureau/press-lines/{id}"
    description: "Read a press line with its live committed sheet ledger and utilization."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: PressLine
    side_effects: []
  - method: GET
    path: "/bureau/press-lines"
    description: "Paginated press line list ordered by line_code ASC."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PressLine[]"
    side_effects: []

  - method: GET
    path: "/bureau/print-runs/{id}"
    description: "Read a print run with its window, sizing, selection score and outcome counters."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: PrintRun
    side_effects: []
  - method: GET
    path: "/bureau/print-runs"
    description: "Filtered, paginated print run list ordered by window_start ASC then created_at ASC; the reverse-reachability channel for PrintRun.composition_job_id and PrintRun.press_line_id."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["composition_job_id?", "press_line_id?", "status?", "limit?", "offset?"]
    output: "PrintRun[]"
    side_effects: []
  - method: POST
    path: "/bureau/print-runs/{id}/start"
    description: "Start a planned run, putting the job into production."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: PrintRun
    side_effects: ["PLANNED -> RUNNING with started_at = logical clock", "cascade: CompositionJob SCHEDULED -> PRINTING with version += 1", "increments PrintRun.version by 1"]
  - method: POST
    path: "/bureau/print-runs/{id}/complete"
    description: "Complete a running print run, releasing its press capacity."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: PrintRun
    side_effects: ["RUNNING -> COMPLETED with completed_at = logical clock and printed_piece_count written", "cascade: PressLine.committed_sheet_count -= planned_sheet_count, utilization_bp recomputed, PressLine.version += 1", "cascade: CompositionJob PRINTING -> PRINTED with version += 1", "increments PrintRun.version by 1"]
  - method: POST
    path: "/bureau/print-runs/{id}/abort"
    description: "Abort a running print run and unwind every downstream effect back to the presorted state."
    roles: [ProductionScheduler]
    code: 200
    input: ["abort_reason"]
    output: PrintRun
    side_effects: ["link 1: RUNNING -> ABORTED with completed_at = logical clock and abort_reason recorded; version += 1", "link 2: PressLine.committed_sheet_count -= planned_sheet_count restoring the pre-schedule value exactly, utilization_bp recomputed, PressLine.version += 1", "link 3: every MailPiece of the job in piece_status PRINTED reverts to COMPOSED with last_scan_stage NONE, accepted_scan_count 0, integrity_status UNVERIFIED and version += 1, while its ScanEvent log is retained", "link 4: CompositionJob PRINTING -> PRESORTED, projected_completion_at and projected_penalty_cents cleared, version += 1"]

  - method: POST
    path: "/bureau/entry-facilities"
    description: "Register a postal entry facility with its tray capacity per window and per-class dropship discounts."
    roles: [BureauAdmin]
    code: 201
    input: ["facility_code", "facility_type", "tray_capacity_per_window", "discount_bp_first_class", "discount_bp_marketing", "status?"]
    output: EntryFacility
    side_effects: ["committed_tray_count initialised to 0"]
  - method: GET
    path: "/bureau/entry-facilities/{id}"
    description: "Read an entry facility with its committed tray ledger."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: EntryFacility
    side_effects: []

  - method: GET
    path: "/bureau/presort-batches/{id}"
    description: "Read a presort batch with its tray count, both postage variants and its induction window."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: PresortBatch
    side_effects: []
  - method: GET
    path: "/bureau/presort-batches"
    description: "Filtered, paginated presort batch list ordered by created_at ASC; the reverse-reachability channel for PresortBatch.composition_job_id and PresortBatch.entry_facility_id."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: ["composition_job_id?", "entry_facility_id?", "status?", "presort_bucket?", "limit?", "offset?"]
    output: "PresortBatch[]"
    side_effects: []
  - method: POST
    path: "/bureau/presort-batches/{id}/seal"
    description: "Seal a presort batch, committing the estimated postage against the client's escrow."
    roles: [PostageController]
    code: 200
    input: ["expected_client_version"]
    output: PresortBatch
    side_effects: ["rejects a stale expected_client_version with ERR_STALE_CLIENT_VERSION (412) before the escrow sufficiency check (§1.2.1 rule batch-seal-stale-client-escrow)", "runs calculations.postage_cost variant estimated_postage, writing estimated_postage_cents", "records sealed_by_user_id from X-User-ID", "OPEN -> SEALED", "cascade: Client.postage_committed_cents += estimated_postage_cents, postage_escrow_available_cents -= estimated_postage_cents, increments Client.version by 1", "increments PresortBatch.version by 1"]
  - method: POST
    path: "/bureau/presort-batches/{id}/unseal"
    description: "Unseal a batch, releasing its postage commitment back to the client's escrow with no drift."
    roles: [PostageController]
    code: 200
    input: []
    output: PresortBatch
    side_effects: ["SEALED -> OPEN, clearing estimated_postage_cents and sealed_by_user_id to null", "cascade: Client.postage_committed_cents -= the released estimate and postage_escrow_available_cents += the same amount, restoring both to their exact pre-seal values, increments Client.version by 1", "increments PresortBatch.version by 1"]
  - method: POST
    path: "/bureau/presort-batches/{id}/manifest"
    description: "Manifest a sealed batch into an entry facility induction window, booking the postage variance and bubbling the job up to MANIFESTED once every batch is inducted."
    roles: [PostageController]
    code: 200
    input: ["entry_facility_id", "induction_window_start", "induction_window_end"]
    output: PresortBatch
    side_effects: ["enforces segregation of duties: X-User-ID must differ from sealed_by_user_id", "runs calculations.postage_cost variant manifested_postage, writing manifested_postage_cents and postage_variance_cents", "SEALED -> MANIFESTED, persisting entry_facility_id, the induction window and manifested_by_user_id", "cascade: EntryFacility.committed_tray_count += tray_count, EntryFacility.version += 1", "cascade: Client.postage_committed_cents += postage_variance_cents and postage_escrow_available_cents -= postage_variance_cents, increments Client.version by 1", "bubble-up: when every PresortBatch of the job is MANIFESTED, CompositionJob VERIFIED -> MANIFESTED with version += 1", "cascade on that bubble-up: for every insert code the job reserved, InsertStock.reserved_count -= copies and consumed_count += copies with version += 1", "increments PresortBatch.version by 1"]

  - method: POST
    path: "/bureau/undeliverable-returns"
    description: "Scan a returned mail piece into the bureau's undeliverable queue."
    roles: [IntegrityAuditor]
    code: 201
    input: ["mail_piece_id", "reason_code"]
    output: UndeliverableReturn
    side_effects: ["starts in disposition SCANNED with returned_at = logical clock"]
  - method: GET
    path: "/bureau/undeliverable-returns/{id}"
    description: "Read one undeliverable return with its disposition and feedback batch sequence."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: UndeliverableReturn
    side_effects: []
  - method: POST
    path: "/bureau/undeliverable-returns/{id}/classify"
    description: "Classify a scanned return into the address-updated or unresolved branch, feeding the correction back onto the statement record."
    roles: [IntegrityAuditor]
    code: 200
    input: ["corrected_address_line1?", "corrected_postal_code?"]
    output: UndeliverableReturn
    side_effects: ["forks SCANNED -> ADDRESS_UPDATED when both corrected fields are present and reason_code != DECEASED, otherwise SCANNED -> UNRESOLVED with any supplied corrections discarded", "sets classified_at = logical clock and increments UndeliverableReturn.version by 1", "ADDRESS_UPDATED branch: the StatementRecord behind the piece has address_line1 and postal_code overwritten, hygiene_status -> CORRECTED, address_update_pending -> true, version += 1", "UNRESOLVED branch: the StatementRecord keeps its address, hygiene_status -> STALE, address_update_pending -> true, version += 1", "both branches: MailPiece.undeliverable_flag -> true with version += 1 and Client.pending_address_feedback_count += 1 with Client.version += 1"]

  - method: POST
    path: "/bureau/dr-sites"
    description: "Register the single disaster-recovery site with its observed replication lag."
    roles: [BureauAdmin]
    code: 201
    input: ["site_code", "replication_lag_minutes"]
    output: DrSite
    side_effects: ["readiness_status initialised to UNTESTED with last_drill_at, last_drill_result NONE, drill_count 0 and readiness_valid_until null", "a second DrSite creation is refused with ERR_DR_SITE_ALREADY_EXISTS"]
  - method: GET
    path: "/bureau/dr-sites/{id}"
    description: "Read the DR site; readiness_status and readiness_valid_until are recomputed against the logical clock on every read."
    roles: [BureauAdmin, ClientLiaison, CompositionOperator, ProductionScheduler, PostageController, IntegrityAuditor]
    code: 200
    input: []
    output: DrSite
    side_effects: ["runs calculations.dr_site_readiness as a pure read-time derivation"]
  - method: POST
    path: "/bureau/dr-sites/{id}/drills"
    description: "Record a failover drill outcome, restarting the readiness validity curve."
    roles: [BureauAdmin]
    code: 200
    input: ["result"]
    output: DrSite
    side_effects: ["last_drill_at = logical clock, last_drill_result = result, drill_count += 1", "readiness_valid_until = last_drill_at + DR_DRILL_VALIDITY_HOURS", "re-derives readiness_status via calculations.dr_site_readiness", "increments DrSite.version by 1"]
  - method: PATCH
    path: "/bureau/dr-sites/{id}"
    description: "Report the observed composition-store replication lag."
    roles: [BureauAdmin]
    code: 200
    input: ["replication_lag_minutes"]
    output: DrSite
    side_effects: ["re-derives readiness_status via calculations.dr_site_readiness without touching the drill history", "increments DrSite.version by 1"]

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, unknown enum member, out-of-range integer, malformed datetime, malformed variable_content_rules entry, or pagination limit outside [1, 100]"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client matches the path or body client_id"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "No CompositionTemplate matches the path or body template_id"
  - id: ERR_INSERT_STOCK_NOT_FOUND
    http: 404
    condition: "No InsertStock matches the path id"
  - id: ERR_DATA_FILE_NOT_FOUND
    http: 404
    condition: "No DataFile matches the path or body data_file_id"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "No StatementRecord matches the path id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No PaperlessEnrollment matches the path id"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "No CompositionJob matches the path id"
  - id: ERR_MAIL_PIECE_NOT_FOUND
    http: 404
    condition: "No MailPiece matches the path or body mail_piece_id"
  - id: ERR_PRESS_LINE_NOT_FOUND
    http: 404
    condition: "No PressLine matches the path or body press_line_id"
  - id: ERR_PRINT_RUN_NOT_FOUND
    http: 404
    condition: "No PrintRun matches the path id"
  - id: ERR_ENTRY_FACILITY_NOT_FOUND
    http: 404
    condition: "No EntryFacility matches the path or body entry_facility_id"
  - id: ERR_PRESORT_BATCH_NOT_FOUND
    http: 404
    condition: "No PresortBatch matches the path id"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "No UndeliverableReturn matches the path id"
  - id: ERR_DR_SITE_NOT_FOUND
    http: 404
    condition: "No DrSite matches the path id"
  - id: ERR_CLIENT_MISMATCH
    http: 422
    condition: "Cross-aggregate ownership violated: the named template belongs to a different Client than the named data file, or a released undeliverable return does not belong to the path client"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Uniqueness violated on client_code, (client_id, template_code, version_no), insert_code, (data_file_id, sequence_no), a non-revoked (client_id, account_ref) enrollment, line_code or facility_code"
  - id: ERR_DR_SITE_ALREADY_EXISTS
    http: 409
    condition: "A second DrSite creation attempt while one already exists"
  - id: ERR_RETURN_DUPLICATE
    http: 409
    condition: "A second UndeliverableReturn is scanned against a MailPiece that already has one"
  - id: ERR_CLIENT_SUSPENDED
    http: 409
    condition: "The Client is in status SUSPENDED and the operation lodges a file, attaches a record, composes a job or takes a postage deposit"
  - id: ERR_FILE_INVALID_STATE
    http: 409
    condition: "The DataFile is not in the status the operation requires (RECEIVED to attach records or validate format, FORMAT_VALIDATED to control-check, HELD_VARIANCE to amend, ACCEPTED to compose)"
  - id: ERR_TEMPLATE_NOT_ACTIVE
    http: 409
    condition: "The named CompositionTemplate is DRAFT or RETIRED at composition time"
  - id: ERR_TEMPLATE_INVALID_STATE
    http: 409
    condition: "Activation attempted on a template version that is not DRAFT"
  - id: ERR_JOB_INVALID_STATE
    http: 409
    condition: "The CompositionJob is not in the status the operation requires (COMPOSED to presort, PRESORTED to schedule, PRINTED to reconcile, INTEGRITY_HELD to reprint, MANIFESTED to close, PRINTING/PRINTED/INTEGRITY_HELD to scan, VERIFIED to seal a batch)"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "The PrintRun is not PLANNED for start or not RUNNING for complete or abort"
  - id: ERR_BATCH_NOT_OPEN
    http: 409
    condition: "Seal attempted on a PresortBatch that is already SEALED or MANIFESTED"
  - id: ERR_BATCH_NOT_SEALED
    http: 409
    condition: "Unseal or manifest attempted on a PresortBatch that is OPEN or already MANIFESTED"
  - id: ERR_PIECE_NOT_SCANNABLE
    http: 409
    condition: "A barcode scan or undeliverable return targets a MailPiece whose piece_status is SUPPRESSED or VOID"
  - id: ERR_PIECE_NOT_REPRINT_ELIGIBLE
    http: 409
    condition: "A reprint targets a MailPiece whose integrity_status is neither SCAN_MISSING nor DUPLICATE_SCAN, or which is already VOID"
  - id: ERR_RETURN_INVALID_STATE
    http: 409
    condition: "Classify attempted on an UndeliverableReturn that is not in disposition SCANNED"
  - id: ERR_ENROLLMENT_INVALID_STATE
    http: 409
    condition: "Revoke attempted on a PaperlessEnrollment that is already REVOKED"
  - id: ERR_PRESS_LINE_UNAVAILABLE
    http: 409
    condition: "The named PressLine is in status MAINTENANCE at scheduling or run start"
  - id: ERR_ENTRY_FACILITY_CLOSED
    http: 409
    condition: "The named EntryFacility is in status CLOSED at manifest"
  - id: ERR_STALE_COMPOSITION_JOB_VERSION
    http: 412
    condition: "expected_composition_job_version on a reprint does not equal the current CompositionJob.version (§1.2.1 rule reprint-create-stale-job)"
  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version on a batch seal does not equal the current Client.version (§1.2.1 rule batch-seal-stale-client-escrow)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The manifesting X-User-ID equals PresortBatch.sealed_by_user_id, or the closing X-User-ID equals CompositionJob.composed_by_user_id"
  - id: ERR_INSERT_NOT_EFFECTIVE
    http: 422
    condition: "A required insert code resolves to an InsertStock that is WITHDRAWN or whose effectivity window does not contain the composition instant"
  - id: ERR_INSERT_CODE_UNKNOWN
    http: 422
    condition: "A template or variable content rule names an insert_code that has no InsertStock row"
  - id: ERR_FILE_FORMAT_ERRORS
    http: 422
    condition: "validate-format found at least one record failing the format predicate; format_error_count is greater than zero and the file stays in RECEIVED"
  - id: ERR_FILE_EMPTY
    http: 422
    condition: "validate-format called on a DataFile with no attached StatementRecords"
  - id: ERR_AMENDMENT_NO_CHANGE
    http: 422
    condition: "amend-control-totals supplies no declared figure that differs from the stored value"
  - id: ERR_DR_SITE_NOT_READY
    http: 409
    condition: "Client.dr_readiness_required is true and the DrSite reads UNTESTED, FAILED or STALE at scheduling time"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "The requested PrintRun window_start is earlier than the current logical clock"
  - id: ERR_INVALID_INDUCTION_WINDOW
    http: 422
    condition: "induction_window_start is not strictly before induction_window_end, or the span exceeds 1440 minutes"
  - id: ERR_PRESS_LINE_CAPABILITY_MISMATCH
    http: 422
    condition: "The explicitly named PressLine lacks a capability the job requires (DUPLEX, COLOR or INSERT)"
  - id: ERR_PRESS_WINDOW_CONFLICT
    http: 409
    condition: "The requested run window conflicts with a PLANNED or RUNNING run on the same press line under the closed-interval changeover-buffer test"
  - id: ERR_NO_ELIGIBLE_PRESS_LINE
    http: 409
    condition: "press_line_id was omitted and no PressLine survives every eligibility predicate of press_line_selection"
  - id: ERR_NO_PENDING_FEEDBACK
    http: 409
    condition: "An address-feedback release found no UndeliverableReturn of the client in disposition ADDRESS_UPDATED or UNRESOLVED"
  - id: ERR_PRESS_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_sheet_count + planned_sheet_count would exceed the press line's daily_sheet_capacity"
  - id: ERR_INDUCTION_CAPACITY_EXCEEDED
    http: 409
    condition: "The manifesting batch's tray_count plus the trays of intersecting MANIFESTED windows at that facility would exceed tray_capacity_per_window"
  - id: ERR_INSERT_STOCK_INSUFFICIENT
    http: 409
    condition: "InsertStock.on_hand_count cannot cover the copies a composition or reprint requires"
  - id: ERR_POSTAGE_ESCROW_INSUFFICIENT
    http: 402
    condition: "postage_escrow_available_cents cannot cover the estimated postage at seal, or a positive postage variance at manifest"

roles:
  - name: BureauAdmin
    description: "Bureau operations management: reference data, equipment, DR posture and commercial closure of jobs."
    identity: opaque
    exclusive_operations:
      - "POST /bureau/clients"
      - "PATCH /bureau/clients/{id}"
      - "POST /bureau/composition-templates"
      - "POST /bureau/composition-templates/{id}/activate"
      - "POST /bureau/insert-stocks"
      - "POST /bureau/press-lines"
      - "POST /bureau/entry-facilities"
      - "POST /bureau/dr-sites"
      - "POST /bureau/dr-sites/{id}/drills"
      - "PATCH /bureau/dr-sites/{id}"
      - "POST /bureau/composition-jobs/{id}/close"
    shared_operations:
      - "every GET endpoint"
