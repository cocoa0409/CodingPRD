      - name: layers_consent_revocation_cascade_depth
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / consent_revocation_four_hop_cascade
          rationale: |
            The cascading_side_effects layer is exercised end-to-end there over four hops (consent ->
            move gate -> open utility orders -> credit handoffs) including the ordering sensitivity
            that a naive implementation gets wrong; a corner instance would re-run the same trigger
            while asserting fewer hops.

      - name: layers_readiness_variant_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.move_readiness_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_pre_vs_post_verification_divergence
          rationale: |
            The dual_variant_calculation layer's delta-on-switch claim is that instance's subject: one
            snapshot of children scored under both variants, with the renormalizing divisor making the
            pre_verification number larger than the post_verification one.

  - section: consistency_model
