            - "${s1} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 - ProjectManager is a legal deciding role, so only the fab-01 identity can be the reason"
            - "${s2} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 - the same identity under the other deciding role fails identically, proving the check reads the user id and not the role"
            - "${pst2} == PROTOTYPE_APPROVED with ${pidx} == 87.58 - con-01 != fab-01, so the decision lands and the verified index is computed"
