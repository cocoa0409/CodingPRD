      - name: patching_a_territory_only_cascades_when_the_status_field_is_present
        claim_type: Conditional action
        grounds:
          - endpoints.PATCH_/blinds/territories/{id}
          - validations.priority_13_ERR_TERRITORY_NOT_ACTIVE
          - entities.Territory.fields.status
        distinguishing_aspect: "The same PATCH endpoint is inert or draconian depending on which key the body carries. A commercial-terms patch re-states one field and leaves the other three and the status alone; a status patch to PROBATION closes the franchise to NEW work while leaving rows already in flight exactly where they are - and restoring ACTIVE reopens it, so the gate is read live rather than stamped on the child rows."
        test_recipe:
          setup:
            - "One ACTIVE territory created with all four optional fields defaulted, one designer, and one lead with a SCHEDULED consultation already in flight."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id, v0: $.data.version }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Bo Chen", postal_code: "30301", source: "REFERRAL", requested_at: "2026-08-01T09:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l2: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "PATCH /blinds/territories/${t1}"
              payload: { status: "PROBATION" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_role: $.data.error_id }
            - call: "PATCH /blinds/territories/${t1}"
              payload: { royalty_rate_pct: 0.0700 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { rate: $.data.royalty_rate_pct, status_after_terms: $.data.status, cap: $.data.lead_capacity_per_week, limit: $.data.credit_limit_cents, window: $.data.liability_window, v1: $.data.version }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-04T14:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c2: $.data.id }
            - call: "PATCH /blinds/territories/${t1}"
              payload: { status: "PROBATION" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { probation: $.data.status, v2: $.data.version }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T14:00:00.000Z", scheduled_end_at: "2026-08-05T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_not_active: $.data.error_id }
            - call: "PATCH /blinds/territories/${t1}"
              payload: { status: "ACTIVE" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { reopened: $.data.status }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d1}", scheduled_start_at: "2026-08-05T14:00:00.000Z", scheduled_end_at: "2026-08-05T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c3: $.data.id }
          assert:
            - "the captured ${err_role} == ERR_ROLE_NOT_PERMITTED (403): a franchisee cannot re-state its own standing, however much it would like to"
            - "the commercial patch is surgical: the captured ${rate} == 0.0700 while ${status_after_terms} == ACTIVE, ${cap} == 5, ${limit} == 2000000 and ${window} == ROLLING_180D all keep the values they defaulted to, and ${v1} == ${v0} + 1"
            - "with the territory still ACTIVE the consultation ${c2} is created normally, proving the fixture was workable before the status patch"
            - "the captured ${probation} == PROBATION with ${v2} == ${v1} + 1, and it did NOT touch the children: Consultation.${c1}.status and Consultation.${c2}.status are both still SCHEDULED, Designer.${d1}.status is still ACTIVE and Lead.${l1}.status is still ROUTED"
            - "the captured ${err_not_active} == ERR_TERRITORY_NOT_ACTIVE (409): new work is refused at the grandparent, and the refusal wrote nothing"
            - "the captured ${reopened} == ACTIVE and the identical request then succeeds as ${c3}, so the gate was read live from the territory rather than copied onto the child rows"
            - "the accrued money is untouched by a rate change: Territory.${t1}.royalty_accrued_cents == 0 and GET /blinds/territories/${t1}/ledger-entries returns total_count 0 - the new rate applies to future acceptances only"

