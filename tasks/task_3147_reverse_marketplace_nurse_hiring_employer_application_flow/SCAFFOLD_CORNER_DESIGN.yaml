      - name: interview_complete_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Interview.SCHEDULED_to_COMPLETED
          - errors.ERR_DEADLINE_PASSED
        distinguishing_aspect: "Completing an interview whose ends_at is still in the future is rejected — the clock must reach ends_at first; a complete at ends_at - 1 minute fails while a complete at ends_at succeeds."
        test_recipe:
          setup:
            - "Application INTERVIEWING with interview SCHEDULED 2026-09-02T10:00-11:00Z; clock at 2026-09-02T10:59:00Z."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
