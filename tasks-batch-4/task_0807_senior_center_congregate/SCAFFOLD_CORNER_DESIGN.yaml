              payload: { full_name: "Rb1", birth_date: "1948-05-05T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
