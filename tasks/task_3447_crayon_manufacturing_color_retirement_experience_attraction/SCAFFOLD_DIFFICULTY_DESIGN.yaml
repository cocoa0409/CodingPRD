            - "LicensedLine.${ln_id}.pinned_formula_version == 4 while Formula.${frm_id}.version == 5 (supersede bumped it)"
            - "the REINSTATE attempt returns 409 and reinstate_err == ERR_STALE_PIN"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: batch_decision_terminal_state_beats_sod
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_BATCH_TERMINAL
          - errors.ERR_SOD_VIOLATION
        distinguishing_aspect: "Error-category pair state-vs-business_safety: the deciding officer qa-1 is also the batch creator (SoD violation, priority 7) AND the batch is already REJECTED (state violation, priority 6) — the response must be ERR_BATCH_TERMINAL, proving state is checked before safety."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Batch registered by QualityAssurance user qa-1, then REJECTED by qa-2."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Cadmium Red", supplier_name: "PigmentCo", hazard_class: RESTRICTED, received_quantity_kg: 120, certification_mark: ACMI_AP }
              as: QualityAssurance
              as_user_id: "qa-1"
              captures: { bat_id: $.data.id }
            - call: "POST /crayon-works/pigment-batches/${bat_id}/certification-decision"
              payload: { decision: REJECT, reason: "cadmium above limit" }
              as: QualityAssurance
              as_user_id: "qa-2"
          trigger:
            - call: "POST /crayon-works/pigment-batches/${bat_id}/certification-decision"
              payload: { decision: CERTIFY }
              as: QualityAssurance
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_BATCH_TERMINAL"
            - "err != ERR_SOD_VIOLATION — the priority-6 state check fires before the priority-7 segregation-of-duties check"

      - name: campaign_date_order_beats_window_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_DATE_ORDER
          - errors.ERR_CAMPAIGN_WINDOW_CONFLICT
        distinguishing_aspect: "Error-category pair business_temporal-vs-business_constraint: the new campaign both has closes_on before opens_on (temporal, priority 8) AND overlaps the color's earlier campaign window (constraint, priority 9) — the response must be ERR_DATE_ORDER."
        test_recipe:
          setup:
            - "Color Faded Denim back in PROPOSED after its first introduction campaign k1 [2026-09-05, 2026-09-20] failed (20 KIDS no). Clock at 2026-09-21."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Faded Denim", hex_code: "#7B9CC4" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { k1_id: $.data.id }
            - *d_clock_open
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k1_id}", voter_segment: KIDS, choice: "NO", count: 20 }
              as: Consumer
            - *d_clock_close
            - *d_epoch
          trigger:
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-10T00:00:00Z", closes_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_DATE_ORDER"
            - "err != ERR_CAMPAIGN_WINDOW_CONFLICT — temporal ordering (priority 8) is checked before window overlap (priority 9)"

      - name: ticket_checkin_state_beats_session_closed
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_TICKET_STATE
          - errors.ERR_SESSION_CLOSED
        distinguishing_aspect: "Error-category pair state-vs-business_referential: the ticket is already REFUNDED (state violation, priority 6) AND its session is CLOSED (cross-entity referential violation, priority 10) — check-in must fail with ERR_TICKET_STATE."
        test_recipe:
          setup:
            - "Session Hall A on 2026-10-17 (start 600, duration 120, capacity 10). Ticket T was CONFIRMED, then REFUNDED while the clock was still 2026-09-01. Clock advanced to 2026-10-18 and an epoch closed the session."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 10, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { t_id: $.data.id }
            - call: "POST /crayon-works/tickets/${t_id}/decision"
              payload: { action: REFUND }
              as: BoxOffice
              as_user_id: "bo-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-18T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
          trigger:
            - call: "POST /crayon-works/tickets/${t_id}/decision"
              payload: { action: CHECK_IN }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_TICKET_STATE"
            - "err != ERR_SESSION_CLOSED — the ticket's own state (priority 6) is evaluated before the session's referential state (priority 10)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tally_ratio_exactly_at_threshold_passes
        grounds:
          - calculations.vote_tally
          - errors.ERR_CAMPAIGN_NOT_OPEN
        distinguishing_aspect: "Boundary metric: the weighted YES ratio. 11 KIDS yes vs 9 KIDS no gives exactly 11/20 == 0.55 — the INTRODUCTION threshold comparison is inclusive (>=), so the campaign PASSES precisely at the threshold; one fewer yes vote (10/20 == 0.50) would fail."
        test_recipe:
          setup:
            - "Color Boundary Blue PROPOSED with an OPEN introduction campaign."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Boundary Blue", hex_code: "#0F7B8A" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { k_id: $.data.id }
            - *d_clock_open
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k_id}", voter_segment: KIDS, choice: "YES", count: 11 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k_id}", voter_segment: KIDS, choice: "NO", count: 9 }
              as: Consumer
            - *d_clock_close
          trigger:
            - *d_epoch
          assert:
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].outcome == PASSED (0.55 >= 0.55, inclusive)"
            - "data[0].votes_yes_weighted == 11.0 and data[0].votes_total_weighted == 20.0 and data[0].turnout_count == 20 (quorum met)"
            - "Color.${c_id}.status == ACTIVE and introduced_on == 2026-09-20T23:59:59Z"

      - name: session_booked_exactly_at_capacity_accepts_last_and_rejects_next
        grounds:
          - calculations.session_booked_units
          - errors.ERR_SESSION_FULL
          - endpoints.POST_/crayon-works/tickets
        distinguishing_aspect: "Boundary metric: the integer booked-units count on a distinct endpoint (POST /tickets). booked 30 + group of 20 lands exactly on capacity 50 and is CONFIRMED; the very next individual ticket (51st unit) is rejected ERR_SESSION_FULL; a group of 10 instead WAITLISTS."
        test_recipe:
          setup:
            - "Session Hall D on Monday 2026-10-19, capacity 50, base 2000."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall D", session_date: "2026-10-19T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 30, school_name: "Lincoln Elementary" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 20, school_name: "Roosevelt Middle" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g2_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 10, school_name: "Jefferson High" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g3_id: $.data.id }
          assert:
            - "Ticket.${g2_id}.status == CONFIRMED (booked 30 + 20 == capacity 50 — equality fits)"
            - "AttractionSession.${ses_id}.booked_units == 50"
            - "the individual ticket returns 409 and err == ERR_SESSION_FULL (51st unit exceeds)"
            - "Ticket.${g3_id}.status == WAITLISTED (oversized groups waitlist instead of erroring)"

      - name: packing_variance_at_tolerance_completes_above_it_holds
        grounds:
          - calculations.packing_penalty
          - state_machines.ProductionRun.PACKING_to_COMPLETED
          - state_machines.ProductionRun.PACKING_to_ON_HOLD
        distinguishing_aspect: "Boundary metric: packing_variance_units against TOLERANCE_UNITS 5 on the run transition endpoint. Run A at exactly 5 over-completes (penalty 141); run B at 6 diverts to ON_HOLD (penalty 169, no lot) — one unit of variance flips the branch."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; spec {Cerulean:8}; batch CERTIFIED; formula APPROVED. Runs A and B both planned for 125 boxes (expected 1000 units) and advanced to PACKING."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - *d_spec
            - *d_batch
            - *d_certify
            - *d_formula
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - *d_run1
            - *d_run1_adv1
            - *d_run1_adv2
            - *d_run1_adv3
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { rb_id: $.data.id }
            - call: "POST /crayon-works/production-runs/${rb_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rb_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rb_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
          trigger:
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1005 }] }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rb_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1006 }] }
              as: PlatformAdmin
          assert:
            - "ProductionRun.${r1_id}.stage == COMPLETED with packing_variance_units == 5 (== TOLERANCE_UNITS is within tolerance) and packing_penalty_cents == 141 (round_half_up(5 * 18.75 * 1.5))"
            - "ProductionRun.${rb_id}.stage == ON_HOLD with packing_variance_units == 6 and packing_penalty_cents == 169 (round_half_up(6 * 18.75 * 1.5))"
            - "GET /crayon-works/production-runs/${r1_id}/inventory-lots returns 1 AVAILABLE lot of 125 boxes; the same GET for ${rb_id} returns 0 rows"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: formula_approval_requires_latest_safety_test_passed
        grounds:
          - state_machines.Formula.SUBMITTED_to_APPROVED
          - state_machines.SafetyTest
          - errors.ERR_FORMULA_NOT_APPROVABLE
        distinguishing_aspect: "Entity pair Formula <- SafetyTest: APPROVE is gated on the LATEST SafetyTest (by created_at) being PASSED. While the newest test is FAILED the approve is rejected; a resubmission spawns a fresh test, and only after that one PASSED does the identical approve call succeed."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE. Formula created and SUBMITTED by f-1; its first safety test recorded FAIL."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - *d_formula
            - *d_submit
            - *d_get_tests
            - call: "POST /crayon-works/safety-tests/${test_id}/record-result"
              payload: { outcome: FAIL, result_notes: "heavy metal trace" }
              as: LabTechnician
              as_user_id: "lab-1"
          trigger:
            - call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: REQUEST_REVISION, reason: "remediate and resubmit" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
            - call: "GET /crayon-works/formulas/${frm_id}/safety-tests"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { test2_id: "$.data[1].id" }
            - call: "POST /crayon-works/safety-tests/${test2_id}/record-result"
              payload: { outcome: PASS, result_notes: "remediated" }
              as: LabTechnician
              as_user_id: "lab-1"
            - call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "the first APPROVE returned 409 with err == ERR_FORMULA_NOT_APPROVABLE (latest test was FAILED)"
            - "after resubmission spawned a second test and it PASSED, the identical APPROVE succeeds and Formula.${frm_id}.status == APPROVED"
            - "GET /crayon-works/formulas/${frm_id}/safety-tests returns 2 rows: data[0].status == FAILED, data[1].status == PASSED"

      - name: production_run_requires_approved_formulas_certified_batch_active_spec
        grounds:
          - endpoints.POST_/crayon-works/production-runs
          - validations[priority=10]
          - errors.ERR_FORMULA_NOT_APPROVABLE
          - errors.ERR_BATCH_NOT_CERTIFIED
        distinguishing_aspect: "Entity pair ProductionRun <- Formula/PigmentBatch/AssortmentSpec (a different pair set than Formula <- SafetyTest): run creation re-checks linked-entity state in the pinned intra-category order — formula approval first, then batch certification — and only passes when every linked entity is in the required state."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; spec {Cerulean:8} ACTIVE; batch registered but still QUARANTINE; formula still DRAFT (never submitted)."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - *d_spec
            - *d_batch
            - *d_formula
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - *d_certify
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
          assert:
            - "first create returned 409 err1 == ERR_FORMULA_NOT_APPROVABLE (formula referential check precedes the batch check)"
            - "second create returned 409 err2 == ERR_BATCH_NOT_CERTIFIED (formula now APPROVED; batch still QUARANTINE)"
            - "third create returns 201 and ProductionRun.${run_id}.stage == PLANNED once both linked entities qualify"

      - name: ticket_booking_requires_session_still_scheduled
        grounds:
          - state_machines.AttractionSession.SCHEDULED_to_CLOSED
          - errors.ERR_SESSION_CLOSED
          - endpoints.POST_/crayon-works/tickets
        distinguishing_aspect: "Entity pair Ticket <- AttractionSession (distinct from the two pairs above): once the epoch closes a session, new bookings against it are rejected ERR_SESSION_CLOSED even though the booking payload itself is perfectly well-formed."
        test_recipe:
          setup:
            - "Session Hall A on 2026-10-17 (start 600, duration 120, capacity 10). Clock advanced to 2026-10-18 and an epoch ran, closing the session."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 10, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-18T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
          trigger:
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_SESSION_CLOSED"
            - "GET /crayon-works/attraction-sessions/${ses_id}/tickets returns 0 rows"
            - "AttractionSession.${ses_id}.status == CLOSED and booked_units == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: session_overlap_half_open_with_buffer
        grounds:
          - endpoints.POST_/crayon-works/attraction-sessions
          - errors.ERR_SESSION_WINDOW_CONFLICT
          - validations[priority=9]
        distinguishing_aspect: "Interval semantics: half-open occupation with a 30-minute cleanup buffer — a session occupies [start_minute, start_minute + duration + 30) on its venue and date. A successor starting at exactly 750 (600 + 120 + 30) is legal adjacency; starting at 749 collides; a different venue never collides."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Session A occupies Hall A on 2026-10-17 from minute 600 for 120 minutes."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 100, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 750, duration_minutes: 60, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 749, duration_minutes: 60, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall B", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { sd_id: $.data.id }
          assert:
            - "the 750-start session is created (201) — AttractionSession.${sb_id} exists SCHEDULED; a gap of exactly 30 minutes satisfies the buffer"
            - "the 749-start session returns 409 and err == ERR_SESSION_WINDOW_CONFLICT (one minute inside the buffer)"
            - "the Hall B session at the same minute is created (201) — the resource is the (venue, date) pair, not the date"

      - name: campaign_windows_closed_interval_overlap
        grounds:
          - endpoints.POST_/crayon-works/colors/{id}/vote-campaigns
          - errors.ERR_CAMPAIGN_WINDOW_CONFLICT
          - validations[priority=9]
        distinguishing_aspect: "Different interval semantics on a different resource: campaign windows on a color are CLOSED intervals [opens_on, closes_on] — back-to-back windows are legal (k2 opens the instant after k1 closes) but sharing any single instant (k3 opens during k1's closing afternoon) is a conflict."
        test_recipe:
          setup:
            - "Color Faded Denim PROPOSED again after its first campaign k1 [2026-09-05T00:00:00Z, 2026-09-20T23:59:59Z] failed; a second campaign k2 [2026-09-21T00:00:00Z, 2026-09-30T23:59:59Z] was then created and also failed; color is PROPOSED at clock 2026-10-01."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Faded Denim", hex_code: "#7B9CC4" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { k1_id: $.data.id }
            - *d_clock_open
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k1_id}", voter_segment: KIDS, choice: "NO", count: 20 }
              as: Consumer
            - *d_clock_close
            - *d_epoch
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-21T00:00:00Z", closes_on: "2026-09-30T23:59:59Z" }
              as: PlatformAdmin
              captures: { k2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k2_id}", voter_segment: KIDS, choice: "NO", count: 20 }
              as: Consumer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
          trigger:
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-20T12:00:00Z", closes_on: "2026-09-20T23:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "k2 was created successfully — its opens_on 2026-09-21T00:00:00Z is strictly after k1's closes_on 2026-09-20T23:59:59Z, so the closed intervals do not touch"
            - "the k3 attempt returns 409 and err == ERR_CAMPAIGN_WINDOW_CONFLICT (its [2026-09-20T12:00, 2026-09-20T23:00] sits inside k1's window)"
            - "Color.${c_id}.status remains PROPOSED and exactly 2 campaigns exist for it"

      - name: licensed_run_dates_must_be_contained_in_term
        grounds:
          - errors.ERR_LICENSE_TERM_WINDOW
          - validations[priority=8]
          - endpoints.POST_/crayon-works/production-runs
        distinguishing_aspect: "Third interval semantics — full containment on the licensed-line resource: a run on a LICENSED spec is legal only if [planned_start_date, planned_end_date] is entirely contained in the line's [term_start, term_end]; partial overlap with the term is not enough."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; formula APPROVED; batch CERTIFIED; LICENSED spec {Cerulean:8} at 2000 cents/box; licensed line APPROVED with term [2026-09-01T00:00:00Z, 2028-08-31T23:59:59Z]."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - *d_batch
            - *d_certify
            - *d_formula
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "SpaceMovie 8-box", kind: LICENSED, entries: [{ color_id: "${c_id}", count: 8 }], wholesale_price_cents: 2000 }
              as: PlatformAdmin
              captures: { spec_l: $.data.id }
            - call: "GET /crayon-works/formulas/${frm_id}"
              payload: {}
              as: BrandManager
              as_user_id: "bm-1"
              captures: { frm_v: $.data.version }
            - call: "POST /crayon-works/licensed-lines"
              payload: { name: "SpaceMovie Box", licensor_user_id: "lic-1", formula_id: "${frm_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2028-08-31T23:59:59Z", royalty_rate: 0.08, royalty_base: GROSS }
              as: BrandManager
              as_user_id: "bm-1"
              captures: { ln_id: $.data.id }
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: SUBMIT, expected_formula_version: "${frm_v}" }
              as: BrandManager
              as_user_id: "bm-1"
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: LICENSOR_APPROVE, expected_formula_version: "${frm_v}" }
              as: Licensor
              as_user_id: "lic-1"
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: BRAND_APPROVE, expected_formula_version: "${frm_v}" }
              as: BrandManager
              as_user_id: "bm-2"
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_l}", pigment_batch_id: "${bat_id}", planned_boxes: 40, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { r_ok: $.data.id }
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_l}", pigment_batch_id: "${bat_id}", planned_boxes: 40, planned_start_date: "2028-08-01T00:00:00Z", planned_end_date: "2028-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the in-term run is created (201) — ProductionRun.${r_ok}.stage == PLANNED"
            - "the run ending 2028-09-05 (past term_end 2028-08-31T23:59:59Z) returns 422 and err == ERR_LICENSE_TERM_WINDOW"
            - "err != ERR_LICENSE_REQUIRED — the line exists and is APPROVED; only the containment fails"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: session_booked_units_refund_rebook_conservation
        grounds:
          - calculations.session_booked_units
          - state_machines.Ticket.CONFIRMED_to_REFUNDED
          - state_machines.Ticket.WAITLISTED_to_CONFIRMED
        distinguishing_aspect: "Conserved quantity: a session's booked_units always equals the sum of units over CONFIRMED/CHECKED_IN tickets. Refunding a 20-unit group and promoting a 10-unit waitlisted group lands booked_units at exactly 40 == 30 + 10 — the compensate-and-rebook pair leaves the invariant provably intact, and the promoted group's price is computed at the ratio live at promotion time."
        test_recipe:
          setup:
            - "Session Hall E on Monday 2026-10-19, capacity 50, base 2000. G1 (30) and G2 (20) CONFIRMED (booked 50); G3 (10) WAITLISTED."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall E", session_date: "2026-10-19T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 50, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 30, school_name: "Lincoln Elementary" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g1_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 20, school_name: "Roosevelt Middle" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g2_id: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 10, school_name: "Jefferson High" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g3_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/tickets/${g2_id}/decision"
              payload: { action: REFUND }
              as: BoxOffice
              as_user_id: "bo-1"
          assert:
            - "Ticket.${g2_id}.status == REFUNDED"
            - "Ticket.${g3_id}.status == CONFIRMED (promoted: 10 units fit the 20 freed) with price_cents == 20000 (ratio 30/50 == 0.6 -> tier 1.0; group of 10 -> 1.0; Monday -> 1.0)"
            - "AttractionSession.${ses_id}.booked_units == 40, exactly the sum of CONFIRMED units (30 + 10) — the invariant holds after the compensate/promote pair"
            - "GET /crayon-works/attraction-sessions/${ses_id}/tickets shows 1 REFUNDED, 2 CONFIRMED, 0 WAITLISTED"

      - name: lot_boxes_commit_release_mass_balance
        grounds:
          - state_machines.RetailAllocation
          - entities.InventoryLot
          - calculations.spec_boxes_reconciliation
        distinguishing_aspect: "Conserved quantity: per-lot mass balance boxes_on_hand + boxes_committed + boxes_shipped == boxes_received. COMMIT (100 of 125), RELEASE (return 100), COMMIT (60), FULFILL (ship 60) are walked through the lot and the invariant is asserted after every step — a drift of even one box fails the test."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; spec {Cerulean:8} at 1600 cents/box; batch CERTIFIED; formula APPROVED; run R1 COMPLETED with 125 boxes (lot AVAILABLE, 125 on hand)."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - *d_spec
            - *d_batch
            - *d_certify
            - *d_formula
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - *d_run1
            - *d_run1_adv1
            - *d_run1_adv2
            - *d_run1_adv3
            - *d_run1_complete
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 100, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a1_id: $.data.id }
            - call: "POST /crayon-works/retail-allocations/${a1_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "GET /crayon-works/production-runs/${r1_id}/inventory-lots"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { onhand_1: "$.data[0].boxes_on_hand", committed_1: "$.data[0].boxes_committed", shipped_1: "$.data[0].boxes_shipped" }
          trigger:
            - call: "POST /crayon-works/retail-allocations/${a1_id}/decision"
              payload: { action: RELEASE }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v2: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "ValueShop", priority_tier: GOLD, requested_boxes: 60, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v2}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a2_id: $.data.id }
            - call: "POST /crayon-works/retail-allocations/${a2_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "POST /crayon-works/retail-allocations/${a2_id}/decision"
              payload: { action: FULFILL }
              as: AllocationPlanner
              as_user_id: "ap-1"
          assert:
            - "after COMMIT 100: captured on-hand 25, committed 100, shipped 0 — 25 + 100 + 0 == 125 == boxes_received"
            - "after RELEASE: lot reads boxes_on_hand 125, boxes_committed 0, boxes_shipped 0 — the compensating action restored the pre-commit state exactly"
            - "after COMMIT 60 then FULFILL: lot reads boxes_on_hand 65, boxes_committed 0, boxes_shipped 60 — 65 + 0 + 60 == 125"
            - "GET /crayon-works/assortment-specs/${spec_id} shows boxes_available == 65 and boxes_reserved == 0 (A2 is FULFILLED, A1 RELEASED)"

      - name: run_packing_mass_balance_boxes_waste
        grounds:
          - calculations.run_production_mass_balance
          - entities.ProductionRun.fields.boxes_produced
          - entities.ProductionRun.fields.waste_units
        distinguishing_aspect: "Conserved quantity: crayon-unit mass balance across the packing evaluation — sum(packed_counts) == boxes_produced * box_size + waste_units. With packed 78 + 78 against a 16-count box, 9 boxes are produced and 12 units recorded as waste, and 156 == 144 + 12 exactly."
        test_recipe:
          setup:
            - "Colors Cerulean and Denim ACTIVE with APPROVED formulas; RETAIL spec {Cerulean:8, Denim:8} (box_size 16); batch CERTIFIED; run planned for 10 boxes advanced to PACKING."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - call: "POST /crayon-works/colors"
              payload: { name: "Denim", hex_code: "#1560BD" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /crayon-works/colors/${c2_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-25T00:00:00Z", closes_on: "2026-10-10T23:59:59Z" }
              as: PlatformAdmin
              captures: { camp2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp2_id}", voter_segment: KIDS, choice: "YES", count: 20 }
              as: Consumer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "Duo 16-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 8 }, { color_id: "${c2_id}", count: 8 }], wholesale_price_cents: 3200 }
              as: PlatformAdmin
              captures: { spec2_id: $.data.id }
            - *d_batch
            - *d_certify
            - *d_formula
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - call: "POST /crayon-works/formulas"
              payload: { color_id: "${c2_id}", intended_use: CRAYON, pigment_recipe: [{ pigment_name: "Prussian Blue", parts: 2 }] }
              as: Formulator
              as_user_id: "f-1"
              captures: { frm2_id: $.data.id }
            - call: "POST /crayon-works/formulas/${frm2_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
            - call: "GET /crayon-works/formulas/${frm2_id}/safety-tests"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { test2_id: "$.data[0].id" }
            - call: "POST /crayon-works/safety-tests/${test2_id}/record-result"
              payload: { outcome: PASS }
              as: LabTechnician
              as_user_id: "lab-1"
            - call: "POST /crayon-works/formulas/${frm2_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec2_id}", pigment_batch_id: "${bat_id}", planned_boxes: 10, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /crayon-works/production-runs/${run_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${run_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${run_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
          trigger:
            - call: "POST /crayon-works/production-runs/${run_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 78 }, { color_id: "${c2_id}", count: 78 }] }
              as: PlatformAdmin
          assert:
            - "ProductionRun.${run_id}.boxes_produced == 9 (min(floor(78/8), floor(78/8)))"
            - "ProductionRun.${run_id}.waste_units == 12 (156 - 9 * 16)"
            - "mass balance: 78 + 78 == 9 * 16 + 12 (156 == 156 — the conserved quantity is exact)"
            - "GET /crayon-works/production-runs/${run_id}/inventory-lots shows 1 lot with boxes_received == 9"
