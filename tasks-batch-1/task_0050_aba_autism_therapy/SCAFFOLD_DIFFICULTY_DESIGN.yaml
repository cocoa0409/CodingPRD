    instances:
      - name: provider_double_booked_halfopen_adjacent_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
          - entities.TherapySession.fields.scheduled_start
          - entities.TherapySession.fields.scheduled_end
        distinguishing_aspect: |
          Resource = Provider, interval semantics = half-open [start,end): a second
          session for the same provider overlapping 10:00-11:00 with an existing
          09:00-11:00 is rejected, but an adjacent 11:00-12:00 (touching at the
          boundary) is ACCEPTED because intervals are half-open.
