    condition: "Assignment reservation insufficient to cover payout cash portion"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform administrator; manages tenants"
    exclusive_operations:
      - "POST /tenants — Create tenant"
      - "PUT /tenants/{id} — Update tenant credit limit"
      - "POST .../suspend — Suspend tenant"
      - "POST .../reinstate — Reinstate tenant"

  - name: TenantManager
    description: "Tenant manager; manages listings, workers, operations"
    exclusive_operations:
      - "POST .../listings — Create listing"
      - "PUT .../listings/{id} — Update listing"
      - "POST .../listings/{id}/publish — Publish"
      - "POST .../listings/{id}/pause — Pause"
      - "POST .../listings/{id}/resume — Resume"
      - "POST .../listings/{id}/archive — Archive"
      - "POST .../workers — Create worker"
      - "PUT .../workers/{id} — Update worker"
      - "POST .../workers/{id}/suspend — Suspend worker"
      - "POST .../workers/{id}/risk-hold/clear — Clear risk hold"
      - "POST .../workers/{id}/reinstate — Reinstate worker"
      - "POST .../assignments/{id}/release-surplus — Release surplus"
      - "POST .../ratings/{id}/moderate — Moderate rating"

  - name: Dispatcher
    description: "Dispatch operations; creates orders and assignments"
    exclusive_operations:
      - "POST .../orders — Create order"
      - "POST .../orders/{id}/cancel — Cancel order"
      - "POST .../assignments — Create assignment"

  - name: WorkerApp
    description: "Worker mobile app; accepts and executes assignments"
    exclusive_operations:
      - "POST .../assignments/{id}/accept — Accept"
      - "POST .../assignments/{id}/start — Start"
      - "POST .../assignments/{id}/complete — Complete"
      - "POST .../assignments/{id}/cancel — Cancel (worker)"
      - "POST .../orders/{id}/mark-completed — Mark order completed"

  - name: FinanceOfficer
    description: "Finance; manages payouts"
    exclusive_operations:
      - "POST .../payouts — Request payout"
      - "POST .../payouts/{id}/approve — Approve"
      - "POST .../payouts/{id}/send — Send"
      - "POST .../payouts/{id}/confirm-cleared — Confirm cleared"
      - "POST .../payouts/{id}/fail — Mark failed"
      - "POST .../payouts/{id}/cancel — Cancel"

  - name: CustomerSupport
    description: "Support; handles disputes and ratings"
    exclusive_operations:
      - "POST .../disputes — File dispute"
      - "POST .../disputes/{id}/start-review — Start review"
      - "POST .../disputes/{id}/resolve-customer — Resolve for customer"
      - "POST .../disputes/{id}/resolve-worker — Resolve for worker"
      - "POST .../disputes/{id}/withdraw — Withdraw"

  - name: Any
    description: "Shared read access across all roles"
    shared_operations:
      - "GET /tenants — List tenants (PlatformAdmin only)"
      - "GET /tenants/{id} — Get tenant"
      - "GET .../listings — List listings"
      - "GET .../listings/{id} — Get listing"
      - "GET .../orders — List orders"
      - "GET .../orders/{id} — Get order"
      - "GET .../workers — List workers"
      - "GET .../workers/{id} — Get worker"
      - "GET .../assignments — List assignments"
      - "GET .../disputes — List disputes"
      - "GET .../ratings — List ratings"
