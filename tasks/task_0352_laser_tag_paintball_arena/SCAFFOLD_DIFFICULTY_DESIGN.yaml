# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Laser Tag & Paintball Arena — Expert tier
# 9 rule_ids x >= 2 instances each (>= 18 total). Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: addon_quote_vs_settled_diverge_on_addonorder
        grounds:
          - calculations.add_on_total_cents
          - entities.AddOnOrder.fields.quote_total_cents
          - entities.AddOnOrder.fields.settled_total_cents
          - state_machines.Booking.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Same AddOnOrder (ammo=2200, co2=2) yields quote_total_cents=19600 at creation
          (no package allowance/discount) but settled_total_cents=15000 at booking
          completion (200-ball allowance consumed + 20% discount on metered ammo) — the
          dual variant lives on the AddOnOrder pricing domain.
        test_recipe:
          setup:
            - "Arena OPEN with clock at 2026-06-15T09:00:00Z; LASER_TAG field capacity 12 turnaround 0"
            - "PartyPackage: base_fee 9000, included_players 10, extra 500, included_ammo 200, discount_pct 0.20, active"
            - "Booking WALK_IN party_size 10 on the field with that package, CONFIRMED then CHECKED_IN"
            - "One AddOnOrder ammo_balls 2200 co2_tanks 2 on the booking, QUOTED"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A1", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F1", game_mode: "LASER_TAG", capacity_max: 12, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /party-packages"
              payload: { arena_id: "${arena_id}", name: "Blitz", included_players: 10, extra_player_fee_cents: 500, base_fee_cents: 9000, included_ammo_balls: 200, discount_pct: 0.20, active: true }
              as: ArenaManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 10, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /add-on-orders"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", ammo_balls: 2200, co2_tanks: 2, misc_cents: 0 }
              as: FrontDesk
              captures: { addon_id: $.data.id, addon_quote: $.data.quote_total_cents }
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { checked_in_count: 10 }
              as: FieldMarshal
          trigger:
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: FieldMarshal
          assert:
            - "AddOnOrder.${addon_id}.quote_total_cents == 19600"
            - "AddOnOrder.${addon_id}.settled_total_cents == 15000"
            - "AddOnOrder.${addon_id}.status == SETTLED"
            - "AddOnOrder.${addon_id}.quote_total_cents != AddOnOrder.${addon_id}.settled_total_cents"

      - name: deposit_hold_vs_final_diverge_on_rental
        grounds:
          - calculations.deposit_settlement_cents
          - entities.Rental.fields.deposit_hold_cents
          - entities.Rental.fields.deposit_refund_cents
          - entities.Rental.fields.deposit_forfeit_cents
          - state_machines.Rental.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: |
          Same Rental holds deposit_hold_cents=5000 at reserve (hold variant), then at return
          with damage_fee_cents=1200 the final variant splits it into deposit_forfeit_cents=1200
          and deposit_refund_cents=3800 — the dual variant lives on the Rental deposit domain,
          a different entity domain from add-on pricing.
        test_recipe:
          setup:
            - "Arena OPEN clock 2026-06-15T09:00:00Z; one MARKER unit deposit 5000; PAINTBALL field capacity 6"
            - "WALK_IN booking party_size 6 CONFIRMED; rental of the marker HELD; booking CHECKED_IN -> rental CHECKED_OUT"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A2", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "PB", game_mode: "PAINTBALL", capacity_max: 6, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-1", deposit_cents: 5000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /referees"
              payload: { arena_id: "${arena_id}", name: "Ref1", certified_paintball: true }
              as: ArenaManager
              captures: { ref_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 6, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /referee-assignments"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", referee_id: "${ref_id}" }
              as: FieldMarshal
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_id: $.data.id, hold: $.data.deposit_hold_cents }
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { checked_in_count: 6 }
              as: FieldMarshal
          trigger:
            - call: "POST /rentals/${rental_id}/return"
              payload: { damage_fee_cents: 1200 }
              as: FieldMarshal
          assert:
            - "Rental.${rental_id}.deposit_hold_cents == 5000"
            - "Rental.${rental_id}.deposit_forfeit_cents == 1200"
            - "Rental.${rental_id}.deposit_refund_cents == 3800"
            - "Rental.${rental_id}.deposit_refund_cents + Rental.${rental_id}.deposit_forfeit_cents == 5000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: addon_tiered_ammo_min_max_nonlinear
        grounds:
          - calculations.add_on_total_cents
          - entities.AddOnOrder.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (ammo_balls, co2_tanks, misc_cents) with non-linear tiered-rate
          selection via nested min/max across three ball tiers; ammo=2200 -> 500*10 + 1500*8 +
          200*6 = 18200 cents plus 2 CO2*700 = quote 19600. Not a flat per-unit rate.
        test_recipe:
          setup:
            - "Arena OPEN; any field; a HELD booking on it (no package needed for quote)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A3", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F3", game_mode: "LASER_TAG", capacity_max: 20, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 5, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /add-on-orders"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", ammo_balls: 2200, co2_tanks: 2, misc_cents: 0 }
              as: FrontDesk
              captures: { addon_id: $.data.id }
          assert:
            - "AddOnOrder.${addon_id}.quote_total_cents == 19600"

      - name: invoice_round_per_line_then_sum_pins_order
        grounds:
          - calculations.booking_invoice_cents
          - entities.Booking.fields.invoice_total_cents
          - calculations.field_fee_cents
          - calculations.deposit_settlement_cents
          - state_machines.Booking.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. invoice taxes each line independently
          (field 9000, addon 15000, forfeit 1200) then sums -> 9743+16238+1299 = 27280, whereas
          sum-then-tax would give 27279. The scaffold pins round-per-line-then-sum; the two orders
          differ by one cent, falsifying any sum-then-round implementation.
        test_recipe:
          setup:
            - "Arena OPEN clock 2026-06-15T09:00:00Z; PAINTBALL field capacity 10 turnaround 0; one MARKER deposit 5000; one PAINTBALL-certified referee"
            - "Package base 9000, included_players 10, included_ammo 200, discount_pct 0.20"
            - "WALK_IN booking party_size 10 with package CONFIRMED, referee assigned, marker rented, AddOnOrder ammo 2200 co2 2, CHECKED_IN, rental returned damage 1200"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A4", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "PB2", game_mode: "PAINTBALL", capacity_max: 10, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /party-packages"
              payload: { arena_id: "${arena_id}", name: "Pkg10", included_players: 10, extra_player_fee_cents: 500, base_fee_cents: 9000, included_ammo_balls: 200, discount_pct: 0.20, active: true }
              as: ArenaManager
              captures: { pkg_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-4", deposit_cents: 5000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /referees"
              payload: { arena_id: "${arena_id}", name: "RefPB", certified_paintball: true }
              as: ArenaManager
              captures: { ref_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 10, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /referee-assignments"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", referee_id: "${ref_id}" }
              as: FieldMarshal
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_id: $.data.id }
            - call: "POST /add-on-orders"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", ammo_balls: 2200, co2_tanks: 2, misc_cents: 0 }
              as: FrontDesk
              captures: { addon_id: $.data.id }
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { checked_in_count: 10 }
              as: FieldMarshal
            - call: "POST /rentals/${rental_id}/return"
              payload: { damage_fee_cents: 1200 }
              as: FieldMarshal
          trigger:
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: FieldMarshal
          assert:
            - "Booking.${booking_id}.field_fee_cents == 9000"
            - "AddOnOrder.${addon_id}.settled_total_cents == 15000"
            - "Rental.${rental_id}.deposit_forfeit_cents == 1200"
            - "Booking.${booking_id}.invoice_total_cents == 27280"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_branch_checkin_vs_noshow
        grounds:
          - state_machines.Booking.CONFIRMED_to_CHECKED_IN
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Booking is branching: from CONFIRMED it forks to CHECKED_IN (players arrive) OR
          NO_SHOW (clock past window_end) with divergent side-effect sets — one checks out
          rentals, the other releases them. This instance drives the NO_SHOW branch and asserts
          the divergent release side effect.
        test_recipe:
          setup:
            - "Arena OPEN; LASER_TAG field capacity 8; WALK_IN booking party_size 4 CONFIRMED; clock advanced past window_end"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A5", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F5", game_mode: "LASER_TAG", capacity_max: 8, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T10:30:00Z" }
              as: ArenaManager
          trigger:
            - call: "POST /bookings/${booking_id}/no-show"
              payload: {}
              as: FieldMarshal
          assert:
            - "Booking.${booking_id}.status == NO_SHOW"
            - "Field.${field_id}.reserved_headcount == 0"

      - name: league_cyclic_open_lock_advance
        grounds:
          - state_machines.League.OPEN_to_ROUND_LOCKED
          - state_machines.League.ROUND_LOCKED_to_OPEN
          - entities.League.fields.current_round
          - entities.League.fields.status
        distinguishing_aspect: |
          League is cyclic on a different entity: OPEN -> ROUND_LOCKED -> OPEN repeats per round
          (current_round increments) before FINALIZED, unlike Booking's branching shape. This
          instance drives one full cycle and asserts the round advanced and the league is OPEN again.
        test_recipe:
          setup:
            - "Arena OPEN; League total_rounds 2 OPEN at round 1; round 1 locked"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A6", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /leagues"
              payload: { arena_id: "${arena_id}", name: "L6", total_rounds: 2, win_points: 3, draw_points: 1 }
              as: LeagueDirector
              captures: { league_id: $.data.id }
            - call: "POST /leagues/${league_id}/open"
              payload: {}
              as: LeagueDirector
              captures: { lv_open: $.data.version }
            - call: "POST /leagues/${league_id}/lock-round"
              payload: { expected_league_version: "${lv_open}" }
              as: LeagueDirector
              captures: { lv_locked: $.data.version }
          trigger:
            - call: "POST /leagues/${league_id}/advance-round"
              payload: { expected_league_version: "${lv_locked}" }
              as: LeagueDirector
              captures: { lv_adv: $.data.version }
          assert:
            - "League.${league_id}.status == OPEN"
            - "League.${league_id}.current_round == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_booking_three_hop_rental_equipment_deposit
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Rental.HELD_to_RELEASED
          - state_machines.EquipmentUnit.RESERVED_to_AVAILABLE
          - entities.Arena.fields.deposit_held_cents
          - entities.EquipmentUnit.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from Booking cancel: cancel mutates Rental (->RELEASED, hop1); that
          release mutates its EquipmentUnit (->AVAILABLE, hop2); that release credits
          Arena.deposit_held_cents back down (hop3). Each hop is caused by the prior hop, not the
          original cancel. Originating transition: Booking CONFIRMED->CANCELLED.
        test_recipe:
          setup:
            - "Arena OPEN clock set; field; one VEST deposit 4000; WALK_IN booking CONFIRMED with one HELD vest rental (deposit_held=4000)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A7", marker_pool_total: 0, vest_pool_total: 1 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F7", game_mode: "LASER_TAG", capacity_max: 8, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "VEST", asset_tag: "V-7", deposit_cents: 4000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Rental.${rental_id}.status == RELEASED"
            - "EquipmentUnit.${unit_id}.status == AVAILABLE"
            - "Arena.${arena_id}.deposit_held_cents == 0"

      - name: return_damaged_two_hop_equipment_maintenance_ledger
        grounds:
          - state_machines.Rental.CHECKED_OUT_to_RETURNED
          - state_machines.EquipmentUnit.CHECKED_OUT_to_MAINTENANCE
          - entities.Arena.fields.deposit_forfeited_cents
          - entities.EquipmentUnit.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Rental CHECKED_OUT->RETURNED with damage):
          the return mutates the EquipmentUnit (->MAINTENANCE, hop1, because damage>0); that
          settlement credits Arena.deposit_forfeited_cents (hop2). Different originating transition
          and a different propagation pattern (maintenance + forfeit ledger) than the cancel cascade.
        test_recipe:
          setup:
            - "Arena OPEN clock set; PAINTBALL field; PAINTBALL-certified referee; one MARKER deposit 6000; WALK_IN booking CONFIRMED, referee assigned, marker rented, CHECKED_IN (rental CHECKED_OUT)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A8", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "PB8", game_mode: "PAINTBALL", capacity_max: 6, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-8", deposit_cents: 6000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /referees"
              payload: { arena_id: "${arena_id}", name: "Ref8", certified_paintball: true }
              as: ArenaManager
              captures: { ref_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 6, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
            - call: "POST /referee-assignments"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", referee_id: "${ref_id}" }
              as: FieldMarshal
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_id: $.data.id }
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { checked_in_count: 6 }
              as: FieldMarshal
          trigger:
            - call: "POST /rentals/${rental_id}/return"
              payload: { damage_fee_cents: 1500 }
              as: FieldMarshal
          assert:
            - "Rental.${rental_id}.status == RETURNED"
            - "EquipmentUnit.${unit_id}.status == MAINTENANCE"
            - "Arena.${arena_id}.deposit_forfeited_cents == 1500"
            - "Arena.${arena_id}.deposit_refunded_cents == 4500"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_minor_waiver_on_checkin
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_BOOKING_INVALID_STATE]
          - errors[ERR_MINOR_WAIVER_REQUIRED]
        distinguishing_aspect: |
          Error-category pair {state (priority 5) vs business_safety (priority 7)}: a check-in on a
          HELD (not CONFIRMED) booking that ALSO has an unsigned minor returns the higher-priority
          state error ERR_BOOKING_INVALID_STATE, not ERR_MINOR_WAIVER_REQUIRED.
        test_recipe:
          setup:
            - "Arena OPEN clock inside window; field; WALK_IN booking still HELD (not confirmed); a DRAFT minor waiver attached"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A9", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:30:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F9", game_mode: "LASER_TAG", capacity_max: 8, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:30:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
