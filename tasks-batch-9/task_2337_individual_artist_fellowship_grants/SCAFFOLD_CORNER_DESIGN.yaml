          rationale: "That §1.8 instance asserts 7.28 provisional against 7.30 final on the same five counted reviews."

      - name: tax_basis_variant_selection_on_one_installment_ledger
        claim_type: variant_selection
        grounds:
          - calculations.award_tax_reportable_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / tax_report_cash_basis_vs_accrual_basis_on_one_ledger
          rationale: "The named §1.8 instance reads all four basis/year combinations off one ledger."

  # ===========================================================================
  # SECTION: validations
  # ===========================================================================
  - section: validations
    instances:

      - name: flagged_sample_breach_blocks_review_submission_until_redaction
        claim_type: violation_error
        grounds:
          - validations[error_id=ERR_ANONYMITY_BREACH_UNRESOLVED]
          - endpoints[POST /grants/work-samples/{work_sample_id}/screen]
          - endpoints[POST /grants/work-samples/{work_sample_id}/redact]
        distinguishing_aspect: |
          The P75 anonymity gate fires on review submission even though the
          panelist, the round and the panel state are all correct — nothing else
          is wrong. It must also lift on redaction: after the sample is redacted
          the same submission succeeds. An implementation that checks anonymity
          only at charter time accepts the first submission, and one that treats
          BREACHED as permanent refuses the second.
        test_recipe:
          setup:
            - "CornerMain panel in SCORING with a DRAFT review by the chair on the only application"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
          trigger:
            - { call: "POST /grants/work-samples/${ws1}/screen", payload: { disposition: FLAGGED_IDENTIFYING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/reviews/${rv1}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
            - { call: "POST /grants/work-samples/${ws1}/redact", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/reviews/${rv1}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
          assert:
            - "The screen returns 200 with status \"FLAGGED\" and screened_by \"officer-1\""
            - "After the screen the application reads anonymity_status \"BREACHED\" and the cycle reads unresolved_breach_count == 1 with posture \"FROZEN\""
            - "The first submit returns 409 ERR_ANONYMITY_BREACH_UNRESOLVED and the review stays \"DRAFT\" with submitted_at null"
            - "The redact returns 200 with status \"REDACTED\", contains_identifying_metadata false, and the application's anonymity_status becomes \"REDACTED\""
            - "The cycle read shows unresolved_breach_count == 0 and posture back to \"OPEN\""
            - "The second submit returns 200 with status \"SUBMITTED\" and weighted_score == 8.00; the application reads valid_review_count == 1 and provisional_composite_score == 8.00"

      - name: mandatory_block_conflict_resists_waiver_at_both_gates
        claim_type: conditional_validation
        grounds:
          - validations[error_id=ERR_MANDATORY_CONFLICT_NOT_WAIVABLE]
          - validations[error_id=ERR_DUPLICATE_CONFLICT]
          - entities.ConflictDeclaration.fields.severity
        distinguishing_aspect: |
          severity is derived from relationship_type, so IMMEDIATE_FAMILY is
          MANDATORY_BLOCK and neither the WAIVED disposition at screening nor the
          later waive-override may be honoured, while a DISCRETIONARY conflict
          can take both. An implementation that stores severity from the request
          body or that only guards the screening gate lets the override through.
          The duplicate declaration proves the (panelist_id, application_id)
          uniqueness at P85 rather than a 201 with a second row.
        test_recipe:
          setup:
            - "CornerMain panel in SCORING; the CENTRAL panelist declares an immediate-family relationship"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - { call: "POST /grants/conflicts", payload: { panelist_id: "${pl2}", application_id: "${app}", relationship_type: IMMEDIATE_FAMILY, disclosure_note: "The applicant is my sibling." }, as: Panelist, as_user_id: "${pl2}", captures: { cf1: "$.data.id" } }
          trigger:
            - { call: "POST /grants/conflicts", payload: { panelist_id: "${pl2}", application_id: "${app}", relationship_type: CO_AUTHOR, disclosure_note: "Second disclosure for the same pair." }, as: Panelist, as_user_id: "${pl2}" }
            - { call: "POST /grants/conflicts/${cf1}/screen", payload: { disposition: WAIVED, override_justification: "The relationship is remote enough to disregard." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts/${cf1}/screen", payload: { disposition: BLOCKING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts/${cf1}/waive-override", payload: { override_justification: "On reflection the relationship is immaterial to scoring." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/${pl2}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The declaration created in setup reads severity \"MANDATORY_BLOCK\" and status \"DECLARED\""
            - "The second declaration for the same (panelist_id, application_id) pair returns 409 ERR_DUPLICATE_CONFLICT"
            - "The WAIVED screening returns 409 ERR_MANDATORY_CONFLICT_NOT_WAIVABLE and the conflict stays \"DECLARED\" with screened_by null"
            - "The BLOCKING screening returns 200 with status \"BLOCKING\""
            - "The waive-override returns 409 ERR_MANDATORY_CONFLICT_NOT_WAIVABLE and the conflict stays \"BLOCKING\" with override_justification null"
            - "The panelist read shows status \"RECUSED\" and the panel's blocking_conflict_count == 1"

      - name: submission_before_the_open_instant_is_refused_on_an_open_cycle
        claim_type: temporal_validation
        grounds:
          - validations[error_id=ERR_APPLICATION_WINDOW_NOT_OPEN]
          - validations[error_id=ERR_APPLICATION_DEADLINE_PASSED]
        distinguishing_aspect: |
          The cycle status is OPEN the whole time, so only the clock separates the
          three outcomes: 2026-08-01 is refused with ERR_APPLICATION_WINDOW_NOT_OPEN,
          the open instant 2026-08-15T00:00:00Z itself is accepted (inclusive lower
          bound), and 2026-10-16 is refused with ERR_APPLICATION_DEADLINE_PASSED.
          An implementation that only guards the deadline accepts the first call,
          and one using a strict > on application_open_at rejects the second.
        test_recipe:
          setup:
            - "A cycle opening 2026-08-15 with a 2026-10-15T23:59:59Z deadline, OPEN while the clock still reads 2026-08-01"
            - "One artist with a complete two-sample DRAFT application"
