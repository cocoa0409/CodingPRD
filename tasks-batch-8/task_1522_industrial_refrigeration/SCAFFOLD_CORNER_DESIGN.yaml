              as: FacilityAdmin
              captures: { fac_b: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac_a}", full_name: "A One" }
              as: FacilityAdmin
              captures: { emp_a1: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac_a}", full_name: "A Two" }
              as: FacilityAdmin
              captures: { emp_a2: $.data.id }
            - call: "POST /psm/employees"
