# =============================================================================
# Task 1924: Legal Aid Intake & Case Assignment — §1.8 Test Targeting Index
# 2+ instances per Difficulty Rule (§0.5); 20 instances total.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: income_screen_variants_diverge_on_same_client
        grounds:
          - calculations.poverty_percentage_screen
          - entities.IntakeApplication.fields.gross_poverty_percentage
          - entities.IntakeApplication.fields.countable_poverty_percentage
        distinguishing_aspect: |
          Entity domain = IntakeApplication income screening. One screen call on one client stores BOTH
          variant results: standard_screen (gross 2,000,000 -> 132.80, fails cap 125.00) and grant_screen
          (countable 1,500,000 -> 99.60, would pass a grant cap of 150.00) — identical inputs, different
          numbers AND different verdicts; the caseload instance exercises a different entity domain (StaffMember).
        test_recipe:
          setup:
            - "VenueRule (CountyA, EVICTION_DEFENSE) exists; intake worker and client (h=1, gross 2,000,000, countable 1,500,000, no benefits) registered; application SUBMITTED"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Variant", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 2000000, annual_countable_income_cents: 1500000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { gross_pct: "$.data.gross_poverty_percentage", count_pct: "$.data.countable_poverty_percentage", det: "$.data.eligibility_determination" } }
          assert:
            - "IntakeApplication.${app_id}.gross_poverty_percentage == 132.80"
            - "IntakeApplication.${app_id}.countable_poverty_percentage == 99.60"
            - "IntakeApplication.${app_id}.eligibility_determination == INELIGIBLE (standard variant fails) even though grant_screen at cap 150.00 would pass"

      - name: caseload_raw_count_vs_weighted_load
        grounds:
          - calculations.caseload_load
          - entities.StaffMember.fields.weighted_open_units
          - entities.StaffMember.fields.open_case_count
        distinguishing_aspect: |
          Entity domain = StaffMember caseload. For the identical assigned case set (1 EXTENDED + 2 ADVICE_ONLY),
          the raw_count variant yields 3 while the weighted_load variant yields 9 — two valid measures, different
          numbers; the income-screen instance exercises a different entity domain (IntakeApplication).
        test_recipe:
          setup:
            - "Venue rules for EVICTION_DEFENSE/BENEFITS_APPEAL/CONSUMER_DEBT in CountyA; intake worker, supervisor, and attorney (max_units 40) exist; client with three screened-eligible applications; three cases opened (EVICTION EXTENDED, others ADVICE_ONLY)"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "BENEFITS_APPEAL", venue: "ADMIN_TRIBUNAL", priority_base_weight: 40, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 4 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE", "BENEFITS_APPEAL", "CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Load", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app1_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app1_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case1_id: "$.data.id", case1_v: "$.data.version" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "BENEFITS_APPEAL", opposing_party_name: "Benefits Agency", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app2_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app2_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case2_id: "$.data.id", case2_v: "$.data.version" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector Inc", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app3_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app3_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app3_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app3_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app3_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case3_id: "$.data.id", case3_v: "$.data.version" } }
          trigger:
            - { call: "POST /cases/${case1_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case1_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /cases/${case2_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case2_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /cases/${case3_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case3_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "GET /staff-members/${att_id}/caseload", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { raw: "$.data.open_case_count", weighted: "$.data.weighted_open_units", avail: "$.data.available_units" } }
          assert:
            - "caseload.open_case_count == 3 (raw_count variant)"
            - "caseload.weighted_open_units == 9 (weighted_load variant: 5 + 2 + 2 for the SAME case set)"
            - "caseload.available_units == 31 (max_units 40 - 9)"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_nonlinear
        grounds:
          - calculations.priority_score
          - entities.IntakeApplication.fields.priority_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — base weight x capped vulnerability multiplier
          (min(1+0.15n, 1.75)) + tiered urgency bonus, then a 100.00 cap. base 50, n=2 (mult 1.30), urgency 20
          yields exactly 85.00; the rounding-order and evaluation-order instances exercise modes (b) and (c).
        test_recipe:
          setup:
            - "VenueRule (CountyA, EVICTION_DEFENSE, base 50); client with 2 vulnerability factors; application SUBMITTED"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Prio", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["ELDERLY", "DISABLED"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { prio: "$.data.priority_score" } }
          assert:
            - "IntakeApplication.${app_id}.priority_score == 85.00  (50 * 1.30 + 20, exactly)"

      - name: grant_reservation_rounding_order_per_case
        grounds:
          - calculations.grant_reservation_drawdown
          - entities.Case.fields.reserved_cents
          - entities.GrantProgram.fields.reserved_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold PINS round-per-case-then-sum. Rate 33,333
          with three advice cases: per-case round(33,333*2/5)=13,333, summed 39,999; the forbidden sum-then-round
          order would give round(39,999.6)=40,000. Asserting 39,999 (not 40,000) is the falsifiable divergence;
          the other instances exercise modes (a) and (c).
        test_recipe:
          setup:
            - "Grant (rate 33,333, budget 100,000, cap 150.00, covers BENEFITS_APPEAL/CONSUMER_DEBT/EXPUNGEMENT in CountyA); two advice cases already opened on the grant"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "BENEFITS_APPEAL", venue: "ADMIN_TRIBUNAL", priority_base_weight: 40, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EXPUNGEMENT", venue: "SUPERIOR_COURT", priority_base_weight: 25, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["BENEFITS_APPEAL"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["BENEFITS_APPEAL"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /grant-programs", payload: { name: "LSC General", funder: "LSC", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["BENEFITS_APPEAL", "CONSUMER_DEBT", "EXPUNGEMENT"], allowed_counties: ["CountyA"], income_cap_percentage: 150.00, per_case_rate_cents: 33333, total_budget_cents: 100000 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Round", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "BENEFITS_APPEAL", opposing_party_name: "Agency", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app1_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app1_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/open-case", payload: { service_level: "ADVICE_ONLY", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app2_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app2_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/open-case", payload: { service_level: "ADVICE_ONLY", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EXPUNGEMENT", opposing_party_name: "State", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app3_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app3_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app3_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app3_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app3_id}/open-case", payload: { service_level: "ADVICE_ONLY", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case3_id: "$.data.id", case3_reserved: "$.data.reserved_cents" } }
            - { call: "GET /grant-programs/${grant_id}", payload: {}, as: ProgramDirector, captures: { g_reserved: "$.data.reserved_cents", g_available: "$.data.available_cents", g_spent: "$.data.spent_cents" } }
          assert:
            - "Case.${case3_id}.reserved_cents == 13333 (round_half_up(33333 * 2 / 5) = round(13333.2) = 13333)"
            - "GrantProgram.${grant_id}.reserved_cents == 39999 (3 x 13,333; sum-then-round 40,000 is FORBIDDEN)"
            - "GrantProgram.${grant_id}.available_cents == 60001"
            - "GrantProgram.${grant_id}.spent_cents == 0"

      - name: service_level_gate_pinned_evaluation_order
        grounds:
          - calculations.service_level_gate
          - state_machines.IntakeApplication.ELIGIBLE_to_OPENED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the capacity pool depends on attorney load, load depends on case
          weights, and the new case's weight depends on the service level being decided. The scaffold PINS the
          order (stored priority -> eligibility gates -> PRE-OPENING pool -> decide). Proof: with pool capacity 0,
          EXTENDED is rejected by step (3) yet ADVICE_ONLY on the same application succeeds — impossible if the
          case under decision were counted into the pool first.
        test_recipe:
          setup:
            - "Attorney (max_units 5) fully loaded with one EXTENDED case; supervisor max_units 4 (below EXTENDED weight); second client screened ELIGIBLE with priority 70.00 and CLEAR conflict"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 4 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att Full", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 5 }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli One", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client1_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client1_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord A", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app1_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app1_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case1_id: "$.data.id", case1_v: "$.data.version" } }
            - { call: "POST /cases/${case1_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case1_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /clients", payload: { full_name: "Cli Two", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client2_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client2_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord B", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app2_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app2_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app2_id}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /intake-applications/${app2_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case2_id: "$.data.id", case2_level: "$.data.service_level" } }
          assert:
            - "EXTENDED attempt: error_id == ERR_NO_EXTENDED_CAPACITY (priority 70.00 passes gates (1)-(2); pre-opening pool has no ACTIVE attorney with available_units >= 5)"
            - "IntakeApplication.${app2_id} remains ELIGIBLE after the failed EXTENDED open (no transition on validation failure)"
            - "ADVICE_ONLY retry on the SAME application succeeds: Case.${case2_id}.service_level == ADVICE_ONLY — proving the pool check is scoped to EXTENDED and evaluated pre-opening"

  - rule_id: non_linear_state_machine
    instances:
      - name: intake_application_documentation_loop_cycle
        grounds:
          - state_machines.IntakeApplication.SUBMITTED_to_DOCS_REQUESTED
          - state_machines.IntakeApplication.DOCS_REQUESTED_to_SUBMITTED
          - state_machines.IntakeApplication.SUBMITTED_to_SCREENED
        distinguishing_aspect: |
          Entity = IntakeApplication, shape = cycle A->B->A: SUBMITTED -> DOCS_REQUESTED -> SUBMITTED, then the
          loop exits forward into SCREENED with computations intact. The Case instance uses parallel dimensions
          and the GrantProgram instance a suspend/resume cycle — three different non-linear shapes, three entities.
        test_recipe:
          setup:
            - "VenueRule (CountyA, EVICTION_DEFENSE); intake worker; client (income 1,000,000); application SUBMITTED"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Loop", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications/${app_id}/request-documents", payload: { request_note: "pay stubs" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { s1: "$.data.status" } }
            - { call: "POST /intake-applications/${app_id}/submit-documents", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { s2: "$.data.status" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { s3: "$.data.status", pct: "$.data.gross_poverty_percentage" } }
          assert:
            - "After request-documents: status == DOCS_REQUESTED"
            - "After submit-documents: status == SUBMITTED (cycle closes)"
            - "After screen: status == SCREENED and gross_poverty_percentage == 66.40 (loop returns to a workable state)"

      - name: case_parallel_status_funding_axes_evolve_independently
        grounds:
          - state_machines.Case.GRANT_RESERVED_to_GRANT_FROZEN
          - state_machines.Case.GRANT_FROZEN_to_GRANT_RESERVED
          - state_machines.Case.OPEN_to_ON_HOLD
          - entities.Case.fields.status
          - entities.Case.fields.funding_status
        distinguishing_aspect: |
          Entity = Case, shape = parallel dimensions: status and funding_status are independent axes on one row.
          Grant resume restores funding_status (GRANT_FROZEN -> GRANT_RESERVED) while status STAYS ON_HOLD —
          the falsifiable proof of axis independence; the other instances use cyclic shapes on different entities.
        test_recipe:
          setup:
            - "Grant (rate 33,333, budget 100,000, FAMILY_DV/CountyA, cap 150.00); funded EXTENDED case OPEN and assigned"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "FAMILY_DV", venue: "FAMILY_COURT", priority_base_weight: 60, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 4 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 40 }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /grant-programs", payload: { name: "DV Fund", funder: "DOJ", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["FAMILY_DV"], allowed_counties: ["CountyA"], income_cap_percentage: 150.00, per_case_rate_cents: 33333, total_budget_cents: 100000 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Par", residence_county: "CountyA", household_size: 2, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["DV_SURVIVOR"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "FAMILY_DV", opposing_party_name: "Abuser", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "EXTENDED", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /cases/${case_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /grant-programs/${grant_id}/suspend", payload: {}, as: ProgramDirector }
            - { call: "GET /cases/${case_id}", payload: {}, as: ProgramDirector, captures: { st1: "$.data.status", fs1: "$.data.funding_status" } }
            - { call: "POST /grant-programs/${grant_id}/resume", payload: {}, as: ProgramDirector }
            - { call: "GET /cases/${case_id}", payload: {}, as: ProgramDirector, captures: { st2: "$.data.status", fs2: "$.data.funding_status" } }
            - { call: "POST /cases/${case_id}/resume", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { st3: "$.data.status", fs3: "$.data.funding_status" } }
            - { call: "POST /cases/${case_id}/close", payload: { outcome_code: "FULL_WIN", closure_reason: "prevailed" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { st4: "$.data.status", fs4: "$.data.funding_status" } }
          assert:
            - "After grant suspend: status == ON_HOLD AND funding_status == GRANT_FROZEN"
            - "After grant resume: funding_status == GRANT_RESERVED but status STILL == ON_HOLD (axes independent; case resume is a separate manual step with capacity re-check)"
            - "After case resume: status == OPEN AND funding_status == GRANT_RESERVED"
            - "After billable close: status == CLOSED AND funding_status == GRANT_SPENT"

      - name: grant_program_suspend_resume_cycle
        grounds:
          - state_machines.GrantProgram.ACTIVE_to_SUSPENDED
          - state_machines.GrantProgram.SUSPENDED_to_ACTIVE
          - state_machines.GrantProgram.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Entity = GrantProgram, shape = cycle ACTIVE -> SUSPENDED -> ACTIVE before terminal CLOSED — a third
          non-linear shape on a third entity (vs IntakeApplication documentation cycle and Case parallel axes).
        test_recipe:
          setup:
            - "Empty grant program (no reservations) exists, ACTIVE"
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "Cyc", funder: "STATE_BAR", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["CONSUMER_DEBT"], allowed_counties: ["CountyA"], income_cap_percentage: 150.00, per_case_rate_cents: 33333, total_budget_cents: 50000 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
          trigger:
            - { call: "POST /grant-programs/${grant_id}/suspend", payload: {}, as: ProgramDirector, captures: { g1: "$.data.status" } }
            - { call: "POST /grant-programs/${grant_id}/resume", payload: {}, as: ProgramDirector, captures: { g2: "$.data.status" } }
            - { call: "POST /grant-programs/${grant_id}/close", payload: {}, as: ProgramDirector, captures: { g3: "$.data.status" } }
          assert:
            - "ACTIVE -> SUSPENDED -> ACTIVE -> CLOSED all succeed in sequence"
            - "Final status CLOSED is terminal: reserved_cents == 0 precondition held throughout"

  - rule_id: transitive_cascade
    instances:
      - name: grant_suspend_depth3_transitive_cascade
        grounds:
          - state_machines.GrantProgram.ACTIVE_to_SUSPENDED
          - state_machines.Case.GRANT_RESERVED_to_GRANT_FROZEN
          - state_machines.Case.OPEN_to_ON_HOLD
          - calculations.caseload_load
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (POST /grant-programs/{id}/suspend): link1 Case.funding_status
          GRANT_RESERVED -> GRANT_FROZEN; link2 the freeze ITSELF forces status OPEN -> ON_HOLD; link3 each forced
          hold ITSELF releases attorney load (weighted_open_units 5 -> 0). Each link is caused by the previous
          link, not by the suspend call; the other cascade (depth 2) originates from PATCH /clients/{id}.
        test_recipe:
          setup:
            - "Grant-funded EXTENDED case OPEN, assigned to attorney (weighted_open_units == 5); grant reserved_cents == 33333"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "FAMILY_DV", venue: "FAMILY_COURT", priority_base_weight: 60, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 4 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 40 }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /grant-programs", payload: { name: "DV Fund", funder: "DOJ", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["FAMILY_DV"], allowed_counties: ["CountyA"], income_cap_percentage: 150.00, per_case_rate_cents: 33333, total_budget_cents: 100000 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Cas", residence_county: "CountyA", household_size: 2, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["DV_SURVIVOR"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "FAMILY_DV", opposing_party_name: "Abuser", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "EXTENDED", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /cases/${case_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /grant-programs/${grant_id}/suspend", payload: {}, as: ProgramDirector }
            - { call: "GET /cases/${case_id}", payload: {}, as: ProgramDirector, captures: { c_status: "$.data.status", c_funding: "$.data.funding_status" } }
            - { call: "GET /staff-members/${att_id}/caseload", payload: {}, as: ProgramDirector, captures: { att_load: "$.data.weighted_open_units" } }
            - { call: "GET /grant-programs/${grant_id}", payload: {}, as: ProgramDirector, captures: { g_reserved: "$.data.reserved_cents" } }
          assert:
            - "Link 1: Case.${case_id}.funding_status == GRANT_FROZEN"
            - "Link 2 (caused by link 1): Case.${case_id}.status == ON_HOLD"
            - "Link 3 (caused by link 2): StaffMember.${att_id}.weighted_open_units == 0 (was 5)"
            - "GrantProgram.${grant_id}.reserved_cents == 33333 (freeze preserves the reservation; nothing is released)"

      - name: client_financial_patch_depth2_waitlist_cascade
        grounds:
          - state_machines.IntakeApplication.WAITLISTED_to_SUBMITTED
          - entities.WaitlistEntry.fields.application_id
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (PATCH /clients/{id}): link 1 the financial-field change forces
          the WAITLISTED application back to SUBMITTED; link 2 leaving WAITLISTED ITSELF deletes the WaitlistEntry
          (the entry's existence is conditioned on the status the link-1 mutation destroyed). Not a fan-out: the
          patch never touches the entry directly.
        test_recipe:
          setup:
            - "Client with ELIGIBLE application (CONSUMER_DEBT, priority 30.00) that has been enqueued: status WAITLISTED, WaitlistEntry exists"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli WL", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector Inc", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/enqueue-waitlist", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "PATCH /clients/${client_id}", payload: { annual_gross_income_cents: 1200000 }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "GET /intake-applications/${app_id}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_status: "$.data.status" } }
            - { call: "GET /waitlist-entries?application_id=${app_id}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          assert:
            - "Link 1: IntakeApplication.${app_id}.status == SUBMITTED (stale financials force re-screen)"
            - "Link 2 (caused by link 1): GET /waitlist-entries?application_id=${app_id} returns 0 entries — entry deleted because the status it depended on is gone"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: open_case_state_error_beats_grant_fiscal_error
        grounds:
          - validations[priority=7]
          - validations[priority=32]
          - errors[ERR_INVALID_APPLICATION_STATE]
          - errors[ERR_GRANT_BUDGET_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair = state (priority 7) vs business_fiscal (priority 32): the application is INELIGIBLE
          AND the grant budget (1 cent) cannot cover any reservation — the state error MUST win. The sibling
          instance exercises a different pair (business_safety vs business_constraint).
        test_recipe:
          setup:
            - "Client over income (gross 2,000,000) screened and decided INELIGIBLE; grant with total_budget_cents == 1 (exhausted for any reservation)"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /grant-programs", payload: { name: "Tiny", funder: "LSC", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["EVICTION_DEFENSE"], allowed_counties: ["CountyA"], income_cap_percentage: 200.00, per_case_rate_cents: 33333, total_budget_cents: 1 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Rich", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 2000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "INELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_APPLICATION_STATE (state tier fires before the exhausted-budget fiscal check is ever evaluated)"
            - "No Case is created; GrantProgram.${grant_id}.reserved_cents stays 0"

      - name: open_case_safety_error_beats_duplicate_constraint_error
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors[ERR_CONFLICT_UNRESOLVED]
          - errors[ERR_DUPLICATE_OPEN_CASE]
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 11) vs business_constraint (priority 15): an unresolved
          POTENTIAL_CONFLICT on the application AND an existing PENDING_ASSIGNMENT case for the same client +
          case_type are BOTH violated — the conflict-safety error MUST win. Different pair from the sibling
          instance (state vs business_fiscal).
        test_recipe:
          setup:
