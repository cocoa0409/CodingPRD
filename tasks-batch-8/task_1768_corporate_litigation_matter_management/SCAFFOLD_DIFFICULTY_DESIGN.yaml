scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: exposure_tier_base_vs_conservative_classification
    grounds:
    - calculations.exposure_tier_classification
    - entities.Matter.fields.exposure_tier
    distinguishing_aspect: 'Same exposure triplet (low=1,000,000, high=101,000,000, prob=100) classifies a

      COMMERCIAL matter (base/midpoint variant) as TIER_2 but a CLASS_ACTION matter

      (conservative/high-end variant) as TIER_3 — two variants of one calculation on

      the Matter entity domain produce different exposure_tier values for identical inputs.

      '
    test_recipe:
      setup:
      - 'two staff users: a LitigationCounsel (owner) and a LegalOperationsAnalyst'
      - logical clock at default 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: Commercial dispute
          matter_type: COMMERCIAL
          adverse_party: Acme Corp
          jurisdiction: N.D. Cal.
          filing_date: '2026-07-15'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 1000000
          exposure_high_cents: 101000000
          probability_of_loss_pct: 100
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          commercial_matter_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: Class action
          matter_type: CLASS_ACTION
          adverse_party: Class Plaintiffs
          jurisdiction: S.D.N.Y.
          filing_date: '2026-07-15'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 1000000
          exposure_high_cents: 101000000
          probability_of_loss_pct: 100
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          class_matter_id: $.data.id
      trigger:
      - call: GET /litigation/matters/${commercial_matter_id}
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          commercial_tier: $.data.exposure_tier
      - call: GET /litigation/matters/${class_matter_id}
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          class_tier: $.data.exposure_tier
      assert:
      - Matter.${commercial_matter_id}.exposure_tier == TIER_2
      - Matter.${class_matter_id}.exposure_tier == TIER_3
      - commercial_tier != class_tier despite identical exposure_low_cents/exposure_high_cents/probability_of_loss_pct
  - name: work_order_cost_provisional_vs_final_variant
    grounds:
    - calculations.work_order_cost
    - entities.VendorWorkOrder.fields.estimated_cost_cents
    distinguishing_aspect: 'A work order created with estimated_gb=600 yields provisional estimated_cost_cents=480000;

      completing it with actual_gb=450 re-derives the cost under the final variant (actual volume)

      giving 380000 — two variants of the work_order_cost calculation on the VendorWorkOrder

      entity domain produce different results, distinct from the Matter-domain tier calculation.

      '
    test_recipe:
      setup:
      - an ACTIVE matter with an APPROVED budget, an ACTIVE engagement, an ISSUED hold, and a registered RESTRICTED vendor with capacity_gb >= 600
      - logical clock at default 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Dana Deputy
          email: dana@corp.example
          job_family: EXECUTIVE
        as: LegalOperationsAnalyst
        captures:
          dgc_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Fin Finance
          email: fin@corp.example
          job_family: FINANCE
        as: LegalOperationsAnalyst
        captures:
          fin_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Gena Counsel
          email: gena@corp.example
          job_family: EXECUTIVE
        as: LegalOperationsAnalyst
        captures:
          gc_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: Employment suit
          matter_type: EMPLOYMENT
          adverse_party: Ex-Employee
          jurisdiction: Cal. Super.
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 1000000
          exposure_high_cents: 5000000
          probability_of_loss_pct: 40
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          matter_id: $.data.id
      - call: POST /litigation/matters/${matter_id}/submit-assessment
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/deadlines
        payload:
          deadline_type: INTERNAL_REVIEW
          title: Initial review
          due_at: '2026-09-01T00:00:00Z'
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/advance-to-staffing
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: GET /litigation/matters/${matter_id}
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          matter_v: $.data.version
      - call: POST /litigation/matters/${matter_id}/budgets
        payload:
          fiscal_year: 2026
          lifecycle_budget_cents: 1000000000
          fy_budget_cents: 500000000
          expected_matter_version: ${matter_v}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          budget_id: $.data.id
      - call: POST /litigation/budgets/${budget_id}/submit
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/budgets/${budget_id}/approve
        payload: {}
        as: FinanceBusinessPartner
        as_user_id: ${fin_id}
      - call: POST /litigation/counsel-firms
        payload:
          firm_name: Outside LLP
          blended_rate_cap_cents: 90000
        as: LegalOperationsAnalyst
        captures:
          firm_id: $.data.id
      - call: POST /litigation/counsel-firms/${firm_id}/conflict-check
        payload:
          result: CLEARED
        as: LegalOperationsAnalyst
      - call: POST /litigation/counsel-firms/${firm_id}/approve-panel
        payload: {}
        as: GeneralCounsel
        as_user_id: ${gc_id}
      - call: POST /litigation/matters/${matter_id}/engagements
        payload:
          firm_id: ${firm_id}
          role_type: LEAD_COUNSEL
          fee_arrangement: HOURLY
          proposed_rate_cents: 80000
          engagement_letter_executed: true
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          eng_id: $.data.id
      - call: POST /litigation/engagements/${eng_id}/approve
        payload: {}
        as: DeputyGeneralCounsel
        as_user_id: ${dgc_id}
      - call: POST /litigation/engagements/${eng_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/holds
        payload:
          scope_description: All custodian email
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          hold_id: $.data.id
      - call: POST /litigation/holds/${hold_id}/custodians
        payload:
          staff_user_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/holds/${hold_id}/issue
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/discovery-vendors
        payload:
          vendor_name: DiscCo
          security_clearance_level: RESTRICTED
          capacity_gb: 1000
        as: LegalOperationsAnalyst
        captures:
          vendor_id: $.data.id
      - call: POST /litigation/matters/${matter_id}/work-orders
        payload:
          vendor_id: ${vendor_id}
          hold_id: ${hold_id}
          service_type: COLLECTION
          estimated_gb: 600
          rate_per_gb_cents: 1000
          scheduled_start: '2026-08-10T00:00:00Z'
          scheduled_end: '2026-08-20T00:00:00Z'
        as: LegalOperationsAnalyst
        captures:
          wo_id: $.data.id
          wo_provisional_cost: $.data.estimated_cost_cents
      - call: POST /litigation/work-orders/${wo_id}/authorize
        payload: {}
        as: LegalOperationsAnalyst
      - call: POST /litigation/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: LegalOperationsAnalyst
      - call: POST /litigation/work-orders/${wo_id}/start
        payload: {}
        as: LegalOperationsAnalyst
      trigger:
      - call: POST /litigation/work-orders/${wo_id}/complete
        payload:
          actual_gb: 450
        as: LegalOperationsAnalyst
        captures:
          wo_final_cost: $.data.estimated_cost_cents
      assert:
      - 'wo_provisional_cost == 480000 (600 GB @ 1000 cents: 100*1000 + 400*800 + 100*600)'
      - 'wo_final_cost == 380000 (final variant on actual_gb=450: 100*1000 + 350*800)'
      - wo_final_cost != wo_provisional_cost

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes: (b) rounding order, (c) eval order)
  # =====================================================================
- rule_id: combinatorial_formula
  instances:
    - name: work_order_cost_per_tier_floor_rounding_order
      grounds:
        - calculations.work_order_cost
        - entities.VendorWorkOrder.fields.estimated_cost_cents
      distinguishing_aspect: |
        Mode (b) nested rounding: at estimated_gb=102, rate_per_gb_cents=1013, the pinned
        round-per-tier-then-sum order yields tier A 100*1013=101300 plus tier B
        floor(2*1013*80/100)=1620 for a total of 102920; a round-half-up-per-tier
        implementation yields 102921 — the scaffold pins floor-per-tier.
      test_recipe:
        setup:
          - "an ACTIVE matter with APPROVED budget, ACTIVE engagement, ISSUED hold, and a RESTRICTED vendor (capacity >= 200)"
          - "logical clock at default"
        setup_api_calls:
          - call: "POST /litigation/staff-users"
            payload: { full_name: "Casey Counsel", email: "casey@corp.example", job_family: "LEGAL" }
