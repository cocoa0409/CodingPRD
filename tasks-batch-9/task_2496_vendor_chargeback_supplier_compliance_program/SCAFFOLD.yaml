scenario: |
  Generate task harder than expert level!

  2496. Vendor Chargeback & Supplier Compliance Program (retailer supplier compliance office): routing guide publication with shipment, labeling, packaging and documentation requirements, compliance violation detection at the distribution center with evidence capture, chargeback schedule by violation type with fixed fee and cost-recovery calculations, vendor dispute submission with evidence review and reversal criteria, on-time in-full scorecard measurement with tolerance windows and fill rate calculation, corrective action plans for repeat offenders with escalation to buying decisions, deduction posting against payables with cash application complexity, chargeback revenue governance and vendor relationship impact review

domain_name: vendor-chargeback-supplier-compliance
api_prefix: "/compliance"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # RecoveryAllocation is a true junction (Chargeback x Deduction, many-to-many);
  # EvidenceItem is polymorphic (VIOLATION | DISPUTE subject); RoutingGuide and
  # CorrectiveActionPlan are self-referential (supersedes_guide_id, predecessor_cap_id).

  state_machine_shape: parallel
  # Chargeback carries two independent state dimensions on the same row
  # (dispute_status x settlement_status). VendorDispute and CorrectiveActionPlan
  # are cyclic; ComplianceViolation is branching (fork to VOIDED | CHARGED with
  # divergent side-effect sets); PurchaseOrder is compound (derived from Shipments).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer who adjudicates a VendorDispute MUST NOT be the operator
  # whose X-User-ID is recorded as ComplianceViolation.detected_by_user_id, and the
  # buying-decision escalation is reserved to CategoryBuyer (never ComplianceOfficer).

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 54 endpoints / 60 error codes / 6 calculations / 11 state-machine
  # entries over 10 distinct entities (Chargeback carries two dimensions) /
  # 33 priority-ordered validations / 5 roles / 2 optimistic-concurrency rules.
  # Every band figure exceeds §0.4 Expert (10-15 entities, 20-32 endpoints,
  # 18-30 errors, 3+ calculation variants, 4+ state machines).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_code
        type: string
        source: input
        description: Retailer-assigned supplier code, unique across all Vendors.
        constraints: "1-16 chars, uppercase alphanumeric; uniqueness enforced -> ERR_VENDOR_CODE_TAKEN"
      - name: legal_name
        type: string
        source: input
        description: Legal entity name of the supplier.
        constraints: "1-160 chars"
      - name: payment_terms_days
        type: integer
        source: input
        description: Net payment terms in days used when a Deduction is posted against payables.
        constraints: "1..120"
      - name: status
        type: enum
        source: system
        description: Sourcing posture of the vendor; gates PurchaseOrder creation.
        default: ACTIVE
        constraints: "status IN {ACTIVE, PROBATION, SOURCING_HOLD}"
      - name: otif_score
        type: number
        source: computed
        description: composite_score of this vendor's most recently FINALIZED Scorecard, selected by period_end DESC then created_at DESC; 0.00 when the vendor has no FINALIZED Scorecard.
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: open_chargeback_cents
        type: integer
        source: computed
        description: "Named conserved quantity: sum over Chargeback where vendor_id == this Vendor.id AND settlement_status IN {ASSESSED, POSTED, PARTIALLY_RECOVERED} of (gross_assessed_cents - reversal_cents - recovered_cents). See calculations.vendor_exposure_reconciliation."
        default: 0
      - name: recovered_lifetime_cents
        type: integer
        source: computed
        description: "Sum over RecoveryAllocation where chargeback.vendor_id == this Vendor.id AND effective_status == EFFECTIVE of allocated_cents."
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: "Over-recovery owed back to the vendor: sum over Chargeback where vendor_id == this Vendor.id of max(0, recovered_cents - (gross_assessed_cents - reversal_cents))."
        default: 0
      - name: open_violation_count
        type: integer
        source: computed
        description: "Count of ComplianceViolation rows whose shipment's purchase order belongs to this Vendor AND status IN {DETECTED, EVIDENCE_COMPLETE}."
        default: 0
      - name: open_cap_count
        type: integer
        source: computed
        description: "Count of CorrectiveActionPlan where vendor_id == this Vendor.id AND status IN {ISSUED, VENDOR_SUBMITTED, REJECTED, ACCEPTED, ESCALATED}."
        default: 0
      - name: repeat_offender_flag
        type: boolean
        source: computed
        description: Repeat-offender determination written by calculations.repeat_offender_escalation on Scorecard finalize.
        default: false
      - name: exposure_alert_flag
        type: boolean
        source: computed
        description: "True when open_chargeback_cents >= VENDOR_EXPOSURE_ALERT_CENTS (500000); recomputed on every mutation of open_chargeback_cents."
        default: false

  - name: RoutingGuide
    parent: null
    common_fields: true
    fields:
      - name: guide_code
        type: string
        source: input
        description: Human-readable identifier of the routing guide edition.
        constraints: "1-32 chars"
      - name: title
        type: string
        source: input
        description: Title of the published routing guide.
        constraints: "1-160 chars"
      - name: scope_code
        type: enum
        source: input
        description: Requirement family this guide governs; guides sharing a scope_code form one effectivity timeline, and scope_code == ALL collides with every other scope_code.
        constraints: "scope_code IN {ALL, SHIPMENT, LABELING, PACKAGING, DOCUMENTATION}"
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which this guide's requirements govern arriving Shipments (inclusive lower bound of the half-open effectivity interval).
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: effective_until
        type: datetime
        source: computed
        description: Exclusive upper bound of the effectivity interval; null while status IN {DRAFT, PUBLISHED}, stamped with the superseding guide's effective_from when status becomes SUPERSEDED.
        default: null
      - name: supersedes_guide_id
        type: string
        source: input
        description: "FK -> RoutingGuide.id; the PUBLISHED guide this edition replaces. Null for the first guide in a scope_code chain. Self-referential."
        default: null
      - name: status
        type: enum
        source: system
        description: Publication lifecycle state.
        default: DRAFT
        constraints: "status IN {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: requirement_count
        type: integer
        source: computed
        description: Count of RoutingRequirement rows whose guide_id == this RoutingGuide.id.
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant at which publish succeeded; null while DRAFT.
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who published this guide; null while DRAFT.
        default: null

  - name: RoutingRequirement
    parent: RoutingGuide
    common_fields: true
    fields:
      - name: guide_id
        type: string
        source: system
        description: "FK -> RoutingGuide.id; owning guide edition, taken from the path."
      - name: requirement_code
        type: string
        source: input
        description: Violation type code (e.g. ASN_LATE, GS1_LABEL_MISSING); unique within one guide_id.
        constraints: "1-32 chars; uniqueness per guide_id -> ERR_REQUIREMENT_CODE_TAKEN"
      - name: domain
        type: enum
        source: input
        description: Routing-guide domain the requirement belongs to.
        constraints: "domain IN {SHIPMENT, LABELING, PACKAGING, DOCUMENTATION}"
      - name: severity_tier
        type: enum
        source: input
        description: Severity tier selecting the cost-recovery branch in calculations.chargeback_assessment.
        constraints: "severity_tier IN {TIER_1, TIER_2, TIER_3}"
      - name: min_evidence_count
        type: integer
        source: input
        description: Number of EvidenceItem rows required before a ComplianceViolation may be assessed; 0 means evidence is optional and the violation is EVIDENCE_COMPLETE at creation.
        constraints: "0..5"
      - name: fixed_fee_cents
        type: integer
        source: input
        description: Flat administrative fee charged per violation of this requirement.
        constraints: ">= 0"
      - name: per_unit_recovery_cents
        type: integer
        source: input
        description: Cost-recovery rate applied to ComplianceViolation.affected_units.
        constraints: ">= 0"
      - name: handling_pct
        type: number
        source: input
        description: Percentage of Shipment.invoice_value_cents recoverable as handling cost.
        constraints: "0.00..25.00, 2 decimal places"
      - name: min_fee_cents
        type: integer
        source: input
        description: Floor applied to the assessed amount before the cap.
        constraints: ">= 0"
      - name: cap_cents
        type: integer
        source: input
        description: Ceiling applied to the assessed amount after the floor.
        constraints: ">= 1 AND >= min_fee_cents"
      - name: effective_until
        type: datetime
        source: computed
        description: Copied from the owning guide's effective_until when that guide becomes SUPERSEDED; null while the owning guide is DRAFT or PUBLISHED.
        default: null

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the supplier that owes this order."
      - name: po_number
        type: string
        source: input
        description: Retailer purchase-order number.
        constraints: "1-32 chars"
      - name: ordered_units
        type: integer
        source: input
        description: Units ordered; denominator of the fill-rate calculation.
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Landed cost per unit; multiplied by Shipment.received_units to derive invoice_value_cents.
        constraints: ">= 1"
      - name: ship_window_start
        type: datetime
        source: input
        description: Inclusive start of the vendor's permitted ship window.
      - name: ship_window_end
        type: datetime
        source: input
        description: Exclusive end of the vendor's permitted ship window.
        constraints: "ship_window_end > ship_window_start"
      - name: must_arrive_by
        type: datetime
        source: input
        description: Contractual arrival deadline; centre of the on-time tolerance window in calculations.otif_scorecard_measurement.
        constraints: "must_arrive_by >= ship_window_end"
      - name: status
        type: enum
        source: system
        description: Receipt posture derived from child Shipments (compound state machine).
        default: OPEN
        constraints: "status IN {OPEN, PARTIALLY_RECEIVED, RECEIVED}"
      - name: received_units
        type: integer
        source: computed
        description: "Sum of Shipment.received_units over Shipments where po_id == this PurchaseOrder.id AND status == RECEIVED."
        default: 0
      - name: first_receipt_at
        type: datetime
        source: computed
        description: "Earliest Shipment.arrived_at over Shipments where po_id == this PurchaseOrder.id AND status == RECEIVED; null when none are RECEIVED."
        default: null

  - name: Shipment
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: po_id
        type: string
        source: system
        description: "FK -> PurchaseOrder.id; owning purchase order, taken from the path."
      - name: asn_number
        type: string
        source: input
        description: Advance shipping notice number supplied by the vendor.
        constraints: "1-32 chars"
      - name: shipped_units
        type: integer
        source: input
        description: Units the vendor claims to have shipped.
        constraints: ">= 1"
      - name: carton_count
        type: integer
        source: input
        description: Carton count declared on the ASN; denominator for carton-scoped violations.
        constraints: ">= 1"
      - name: received_units
        type: integer
        source: system
        description: Units counted at the distribution center door; null while IN_TRANSIT.
        default: null
        constraints: ">= 0 AND <= shipped_units"
      - name: arrived_at
        type: datetime
        source: system
        description: Logical-clock instant at which receive succeeded; null while IN_TRANSIT.
        default: null
      - name: invoice_value_cents
        type: integer
        source: computed
        description: "received_units * purchase_order.unit_cost_cents; 0 while IN_TRANSIT."
        default: 0
      - name: status
        type: enum
        source: system
        description: Receipt state of the shipment.
        default: IN_TRANSIT
        constraints: "status IN {IN_TRANSIT, RECEIVED}"
      - name: open_violation_count
        type: integer
        source: computed
        description: "Named conserved quantity: count of ComplianceViolation where shipment_id == this Shipment.id AND status IN {DETECTED, EVIDENCE_COMPLETE}."
        default: 0
      - name: evidence_capture_count
        type: integer
        source: computed
        description: "Monotonic audit counter: count of EvidenceItem where subject_type == VIOLATION AND the violation's shipment_id == this Shipment.id. Never decremented, including when a violation is VOIDED."
        default: 0
  - name: ComplianceViolation
    parent: Shipment
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: system
        description: "FK -> Shipment.id; the inspected shipment, taken from the path."
      - name: requirement_id
        type: string
        source: input
        description: "FK -> RoutingRequirement.id; the requirement breached. Version-pinned: the requirement's owning guide must be effective at shipment.arrived_at."
      - name: affected_units
        type: integer
        source: input
        description: Units affected by the breach; multiplier for per-unit cost recovery.
        constraints: ">= 0 AND <= shipment.received_units"
      - name: affected_cartons
        type: integer
        source: input
        description: Cartons affected by the breach; recorded for evidence review.
        constraints: ">= 0 AND <= shipment.carton_count"
      - name: narrative
        type: string
        source: input
        description: Inspector's free-text description of the breach.
        constraints: "1-500 chars"
      - name: detected_by_user_id
        type: string
        source: system
        description: X-User-ID of the DCInspector who filed the violation; drives the segregation-of-duties check on dispute adjudication.
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant at which the violation was filed.
      - name: status
        type: enum
        source: system
        description: Branching lifecycle; forks from EVIDENCE_COMPLETE to either VOIDED or CHARGED with divergent side-effect sets.
        default: DETECTED
        constraints: "status IN {DETECTED, EVIDENCE_COMPLETE, VOIDED, CHARGED}"
      - name: evidence_count
        type: integer
        source: computed
        description: "Count of EvidenceItem where violation_id == this ComplianceViolation.id."
        default: 0
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the violation is voided; null otherwise.
        default: null

  - name: EvidenceItem
    parent: null
    common_fields: false
    fields:
      - name: violation_id
        type: string
        source: system
        description: "FK -> ComplianceViolation.id; null when subject_type == DISPUTE."
        default: null
      - name: dispute_id
        type: string
        source: system
        description: "FK -> VendorDispute.id; null when subject_type == VIOLATION."
        default: null
      - name: subject_type
        type: enum
        source: system
        description: Polymorphic subject discriminator derived from the creating endpoint's path.
        constraints: "subject_type IN {VIOLATION, DISPUTE}"
      - name: kind
        type: enum
        source: input
        description: Evidence medium captured at the distribution center or supplied by the vendor.
        constraints: "kind IN {PHOTO, SCAN, MEASUREMENT, DOCUMENT}"
      - name: reference_uri
        type: string
        source: input
        description: Immutable pointer to the stored artifact.
        constraints: "1-300 chars"
      - name: note
        type: string
        source: input
        description: Optional annotation.
        default: null
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who captured the evidence.
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock instant of capture. Append-only entity - no update endpoint, no version field.

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: system
        description: "FK -> ComplianceViolation.id; the assessed violation (1:1)."
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; denormalized from shipment.purchase_order.vendor_id at assessment."
      - name: requirement_id
        type: string
        source: system
        description: "FK -> RoutingRequirement.id; version-pinned copy of the violation's requirement, frozen at assessment so later guide supersession cannot re-price this chargeback."
      - name: assessment_variant
        type: enum
        source: computed
        description: Which variant of calculations.chargeback_assessment produced the amounts.
        constraints: "assessment_variant IN {STANDARD, GRACE_FIRST_OCCURRENCE}"
      - name: fixed_fee_cents
        type: integer
        source: computed
        description: Flat fee component copied from the pinned requirement's fixed_fee_cents.
      - name: cost_recovery_cents
        type: integer
        source: computed
        description: Cost-recovery component produced by the severity-tier branch of calculations.chargeback_assessment.
      - name: gross_assessed_cents
        type: integer
        source: computed
        description: Floored-and-capped total assessed against the vendor.
      - name: reversal_cents
        type: integer
        source: computed
        description: Cumulative reversal granted through dispute adjudication.
        default: 0
      - name: recovered_cents
        type: integer
        source: computed
        description: "Sum of RecoveryAllocation.allocated_cents where chargeback_id == this Chargeback.id AND effective_status == EFFECTIVE."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "max(0, gross_assessed_cents - reversal_cents - recovered_cents)."
      - name: evidence_at_assessment_count
        type: integer
        source: system
        description: Snapshot of violation.evidence_count at the instant of assessment; input to the EVIDENCE_INSUFFICIENT reversal ceiling.
      - name: dispute_status
        type: enum
        source: system
        description: First independent state dimension; evolves through dispute adjudication only.
        default: NONE
        constraints: "dispute_status IN {NONE, OPEN, UPHELD, REVERSED, PARTIALLY_REVERSED}"
      - name: deduction_posted
        type: boolean
        source: computed
        description: "True when at least one RecoveryAllocation with chargeback_id == this Chargeback.id AND source_type == DEDUCTION belongs to a Deduction with status == POSTED. Independent of settlement_status."
        default: false
      - name: settlement_status
        type: enum
        source: system
        description: Second independent state dimension; evolves through deduction posting, deduction reversal and cash application only.
        default: ASSESSED
        constraints: "settlement_status IN {ASSESSED, PARTIALLY_RECOVERED, RECOVERED, WRITTEN_OFF}"
      - name: assessed_at
        type: datetime
        source: system
        description: Logical-clock instant of assessment; start of the vendor dispute window.

  - name: VendorDispute
    parent: null
    common_fields: true
    fields:
      - name: chargeback_id
        type: string
        source: system
        description: "FK -> Chargeback.id; the disputed chargeback, taken from the path."
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; denormalized from the chargeback."
      - name: reason_code
        type: enum
        source: input
        description: Dispute ground selecting the reversal ceiling in calculations.dispute_reversal_determination.
        constraints: "reason_code IN {NOT_OUR_LABEL, CARRIER_CAUSED, DUPLICATE_ASSESSMENT, EVIDENCE_INSUFFICIENT, FEE_MISCALCULATED}"
      - name: claimed_reversal_cents
        type: integer
        source: input
        description: Amount the vendor asks to be reversed.
        constraints: ">= 1"
      - name: narrative
        type: string
        source: input
        description: Vendor's written argument for the current round.
        constraints: "1-1000 chars"
      - name: status
        type: enum
        source: system
        description: Cyclic lifecycle; SUBMITTED -> INFO_REQUESTED -> SUBMITTED is the revision loop.
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, INFO_REQUESTED, APPROVED_FULL, APPROVED_PARTIAL, DENIED}"
      - name: round_count
        type: integer
        source: computed
        description: Number of times the vendor has presented the case; 1 at creation, incremented by each resubmit. Bounded by DISPUTE_MAX_ROUNDS.
        default: 1
      - name: reason_ceiling_pct
        type: number
        source: computed
        description: Reversal ceiling percentage resolved at decision time by step S2 of calculations.dispute_reversal_determination; null before decision.
        default: null
      - name: approved_reversal_cents
        type: integer
        source: computed
        description: Final reversal granted, including any goodwill uplift.
        default: 0
      - name: goodwill_cents
        type: integer
        source: computed
        description: Goodwill uplift component of approved_reversal_cents, granted only when the pre-goodwill outcome classifies as PARTIAL.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the first submission.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of adjudication; null before decision.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the adjudicating ComplianceOfficer; must differ from the violation's detected_by_user_id.
        default: null
      - name: information_request_note
        type: string
        source: system
        description: Most recent information request text from the compliance office; null when never requested.
        default: null
      - name: review_note
        type: string
        source: system
        description: Adjudicator's evidence-review note; null before decision.
        default: null

  - name: Scorecard
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the measured supplier."
      - name: period_code
        type: string
        source: input
        description: Measurement period label (e.g. 2026-M08); unique per vendor_id.
        constraints: "1-16 chars"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the measurement period (closed lower bound).
      - name: period_end
        type: datetime
        source: input
        description: Inclusive end of the measurement period (closed upper bound); overlap detection treats both endpoints as occupied and additionally requires SCORECARD_PERIOD_GAP_DAYS of clearance.
        constraints: "period_end > period_start"
      - name: tolerance_early_days
        type: integer
        source: input
        description: Days before must_arrive_by that still count as on time.
        default: 2
        constraints: "0..14"
      - name: tolerance_late_days
        type: integer
        source: input
        description: Days after must_arrive_by that still count as on time.
        default: 0
        constraints: "0..14"
      - name: fill_tolerance_pct
        type: number
        source: input
        description: Shortfall percentage tolerated before an order fails in-full.
        default: 2.00
        constraints: "0.00..10.00, 2 decimal places"
      - name: measurement_variant
        type: enum
        source: system
        description: Variant of calculations.otif_scorecard_measurement used by the most recent measure call; null before first measurement.
        default: null
        constraints: "measurement_variant IN {ORDER_WEIGHTED, UNIT_WEIGHTED}"
      - name: status
        type: enum
        source: system
        description: Measurement lifecycle; MEASURED -> MEASURED re-measurement is permitted until FINALIZED.
        default: OPEN
        constraints: "status IN {OPEN, MEASURED, FINALIZED}"
      - name: measured_po_count
        type: integer
        source: computed
        description: Count of PurchaseOrders in the measurement input set.
        default: 0
      - name: on_time_count
        type: integer
        source: computed
        description: Count of in-scope PurchaseOrders satisfying the on-time tolerance window.
        default: 0
      - name: in_full_count
        type: integer
        source: computed
        description: Count of in-scope PurchaseOrders satisfying the fill tolerance.
        default: 0
      - name: otif_count
        type: integer
        source: computed
        description: Count of in-scope PurchaseOrders satisfying both on-time and in-full.
        default: 0
      - name: on_time_pct
        type: number
        source: computed
        description: "round_half_up(100 * on_time_count / measured_po_count, 2)."
        default: 0.00
      - name: fill_rate_pct
        type: number
        source: computed
        description: Fill rate; the rounding order differs between the two measurement variants.
        default: 0.00
      - name: otif_pct
        type: number
        source: computed
        description: "round_half_up(100 * otif_count / measured_po_count, 2)."
        default: 0.00
      - name: composite_score
        type: number
        source: computed
        description: "round_half_up(OTIF_WEIGHT * otif_pct + FILL_WEIGHT * fill_rate_pct, 2)."
        default: 0.00
      - name: cap_required
        type: boolean
        source: computed
        description: Whether finalization must issue a CorrectiveActionPlan; written by calculations.repeat_offender_escalation at measure time.
        default: false
      - name: measured_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent measurement; null while OPEN.
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant of finalization; null before FINALIZED.
        default: null

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; the supplier under corrective action."
      - name: trigger_scorecard_id
        type: string
        source: system
        description: "FK -> Scorecard.id; the FINALIZED scorecard whose cap_required flag issued this plan."
      - name: predecessor_cap_id
        type: string
        source: system
        description: "FK -> CorrectiveActionPlan.id; the vendor's most recent CLOSED_UNREMEDIATED plan selected by closed_at DESC then created_at DESC, or null when none exists. Self-referential repeat-offender chain."
        default: null
      - name: status
        type: enum
        source: system
        description: Cyclic lifecycle; VENDOR_SUBMITTED -> REJECTED -> VENDOR_SUBMITTED is the rework loop.
        default: ISSUED
        constraints: "status IN {ISSUED, VENDOR_SUBMITTED, REJECTED, ACCEPTED, ESCALATED, CLOSED_SUCCESS, CLOSED_UNREMEDIATED}"
      - name: escalation_level
        type: integer
        source: computed
        description: Severity level from calculations.repeat_offender_escalation, capped at 3; drives due_at and which buying decisions are permitted.
        constraints: "1..3"
      - name: repeat_count
        type: integer
        source: computed
        description: Count of CHARGED-and-not-fully-reversed violations counted inside the repeat lookback window at issuance.
      - name: milestone_text
        type: string
        source: system
        description: Vendor's committed remediation milestones from the most recent submission; null while ISSUED.
        default: null
      - name: committed_completion_at
        type: datetime
        source: system
        description: Vendor's committed completion instant from the most recent submission; null while ISSUED.
        default: null
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at + CAP_DUE_DAYS_BY_LEVEL[escalation_level] days (level 1 -> 30, level 2 -> 21, level 3 -> 14)."
      - name: buying_decision
        type: enum
        source: system
        description: Buying-organisation consequence recorded at escalation.
        default: NONE
        constraints: "buying_decision IN {NONE, RANGE_REVIEW, SOURCING_HOLD}"
      - name: submission_round
        type: integer
        source: computed
        description: Number of vendor submissions presented so far; 0 at issuance, incremented by each submit. Bounded by CAP_MAX_SUBMISSIONS.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the plan was issued by the scorecard finalize cascade.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent accept/reject decision; null before the first decision.
        default: null
      - name: escalated_at
        type: datetime
        source: system
        description: Logical-clock instant of escalation; null unless escalated.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of closure; null unless closed.
        default: null
      - name: review_note
        type: string
        source: system
        description: Compliance officer's decision note; null before the first decision.
        default: null
      - name: escalation_note
        type: string
        source: system
        description: Category buyer's escalation rationale; null unless escalated.
        default: null
      - name: closure_note
        type: string
        source: system
        description: Closure rationale; null unless closed.
        default: null

  - name: Deduction
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the payable the deduction is taken against."
      - name: invoice_reference
        type: string
        source: input
        description: Payables invoice the deduction is netted against.
        constraints: "1-32 chars"
      - name: status
        type: enum
        source: system
        description: Posting lifecycle; REVERSED is the compensating terminal state.
        default: DRAFT
        constraints: "status IN {DRAFT, POSTED, REVERSED}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Sum of RecoveryAllocation.allocated_cents where deduction_id == this Deduction.id AND effective_status != REVERSED."
        default: 0
      - name: allocation_count
        type: integer
        source: computed
        description: "Count of RecoveryAllocation where deduction_id == this Deduction.id."
        default: 0
      - name: over_allocated_cents
        type: integer
        source: computed
        description: "Sum over this deduction's allocations with effective_status == EFFECTIVE of max(0, allocated_cents - (chargeback.gross_assessed_cents - chargeback.reversal_cents)); recomputed whenever a dispute reversal shrinks an allocated chargeback."
        default: 0
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant of posting; null while DRAFT.
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the APAccountant who posted the deduction; null while DRAFT.
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Logical-clock instant of reversal; null unless REVERSED.
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded at reversal; null unless REVERSED.
        default: null

  - name: RecoveryAllocation
    parent: null
    common_fields: true
    fields:
      - name: chargeback_id
        type: string
        source: system
        description: "FK -> Chargeback.id; the chargeback this recovery is applied to."
      - name: deduction_id
        type: string
        source: system
        description: "FK -> Deduction.id; the posting document; null when source_type == CASH."
        default: null
      - name: source_type
        type: enum
        source: system
        description: Recovery channel; DEDUCTION rows are created under a draft deduction, CASH rows are created directly against a chargeback from a vendor remittance.
        constraints: "source_type IN {DEDUCTION, CASH}"
      - name: allocated_cents
        type: integer
        source: input
        description: Amount of the chargeback this allocation recovers. Supplied as `allocated_cents` on POST /compliance/deductions/{id}/allocations and as `amount_cents` on POST /compliance/chargebacks/{id}/cash-applications; both write this single field.
        constraints: ">= 1"
      - name: remittance_reference
        type: string
        source: system
        description: Vendor remittance advice reference; null when source_type == DEDUCTION.
        default: null
      - name: effective_status
        type: enum
        source: computed
        description: "PENDING when source_type == DEDUCTION AND deduction.status == DRAFT; EFFECTIVE when source_type == CASH, or when source_type == DEDUCTION AND deduction.status == POSTED; REVERSED when source_type == DEDUCTION AND deduction.status == REVERSED."
        constraints: "effective_status IN {PENDING, EFFECTIVE, REVERSED}"
      - name: applied_by_user_id
        type: string
        source: system
        description: X-User-ID of the APAccountant who created the allocation.
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant at which the allocation became EFFECTIVE - creation time for CASH rows, posting time for DEDUCTION rows; null while PENDING.
        default: null
state_machines:
  - entity: Vendor
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /compliance/scorecards/{id}/finalize (cascade link 4 of the finalize chain)"
        actor: system
        preconditions:
          - "scorecard.status == MEASURED"
          - "scorecard.cap_required == true"
          - "vendor.status == ACTIVE"
        side_effects:
          - "vendor.status := PROBATION"
          - "vendor.open_cap_count recomputed (the newly ISSUED CorrectiveActionPlan enters the set {ISSUED, VENDOR_SUBMITTED, REJECTED, ACCEPTED, ESCALATED})"
          - "increments Vendor.version by 1"
        note: "Caused by cascade link 3 (CorrectiveActionPlan creation), not directly by the finalize call."
      - from: PROBATION
        to: SOURCING_HOLD
        trigger: "POST /compliance/corrective-action-plans/{id}/escalate"
        actor: CategoryBuyer
        preconditions:
          - "cap.status == REJECTED"
          - "buying_decision == SOURCING_HOLD"
          - "vendor.status == PROBATION"
        side_effects:
          - "vendor.status := SOURCING_HOLD"
          - "increments Vendor.version by 1"
          - "subsequent POST /compliance/purchase-orders for this vendor are rejected with ERR_VENDOR_SOURCING_HOLD"
      - from: SOURCING_HOLD
        to: PROBATION
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome SUCCESS"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status == ESCALATED"
          - "cap.buying_decision == SOURCING_HOLD"
        side_effects:
          - "vendor.status := PROBATION"
          - "vendor.open_cap_count recomputed (the closed plan leaves the open set)"
          - "increments Vendor.version by 1"
        note: "Completes the PROBATION -> SOURCING_HOLD -> PROBATION cycle; a later scorecard can re-enter the cycle."
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome SUCCESS"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status == ACCEPTED"
          - "vendor.open_cap_count == 1 (this plan is the only one in {ISSUED, VENDOR_SUBMITTED, REJECTED, ACCEPTED, ESCALATED})"
        side_effects:
          - "vendor.status := ACTIVE"
          - "vendor.open_cap_count := 0"
          - "increments Vendor.version by 1"

  - entity: RoutingGuide
    shape: linear_with_self_referential_cascade
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /compliance/routing-guides/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "guide.status == DRAFT"
          - "guide.requirement_count >= 1"
          - "guide.effective_from > logical clock now"
          - "no RoutingGuide with status == PUBLISHED whose scope_code collides (same scope_code, or either side scope_code == ALL) has effective_from >= this guide.effective_from"
          - "when supersedes_guide_id is non-null: that guide exists, has status == PUBLISHED, and its scope_code collides with this guide's scope_code"
        side_effects:
          - "guide.status := PUBLISHED; published_at := clock now; published_by_user_id := X-User-ID"
          - "CASCADE LINK 2 (caused by link 1): when supersedes_guide_id is non-null, that guide transitions PUBLISHED -> SUPERSEDED and its effective_until := this guide.effective_from"
          - "CASCADE LINK 3 (caused by link 2): every RoutingRequirement whose guide_id == the superseded guide's id copies effective_until from its guide"
          - "increments RoutingGuide.version by 1 on both guides"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: cascade link 2 of POST /compliance/routing-guides/{id}/publish on a successor guide"
        actor: system
        preconditions:
          - "guide.status == PUBLISHED"
          - "successor_guide.supersedes_guide_id == guide.id"
        side_effects:
          - "guide.effective_until := successor_guide.effective_from"
          - "propagates effective_until to all child RoutingRequirement rows (cascade link 3)"
          - "increments RoutingGuide.version by 1"

  - entity: PurchaseOrder
    shape: compound
    initial_state: OPEN
    terminal_states: [RECEIVED]
    transitions:
      - from: OPEN
        to: PARTIALLY_RECEIVED
        trigger: "system: bubble-up from POST /compliance/shipments/{id}/receive"
        actor: system
        preconditions:
          - "po.received_units >= 1"
          - "po.received_units < po.ordered_units"
        side_effects:
          - "po.received_units and po.first_receipt_at recomputed from child Shipments with status == RECEIVED"
          - "increments PurchaseOrder.version by 1"
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "system: bubble-up from POST /compliance/shipments/{id}/receive"
        actor: system
        preconditions:
          - "po.received_units >= po.ordered_units"
        side_effects:
          - "po.received_units and po.first_receipt_at recomputed"
          - "increments PurchaseOrder.version by 1"
      - from: OPEN
        to: RECEIVED
        trigger: "system: bubble-up from POST /compliance/shipments/{id}/receive"
        actor: system
        preconditions:
          - "po.received_units >= po.ordered_units after the first receipt"
        side_effects:
          - "po.received_units and po.first_receipt_at recomputed"
          - "increments PurchaseOrder.version by 1"
        note: "A single shipment can satisfy the whole order, skipping PARTIALLY_RECEIVED."

  - entity: Shipment
    shape: linear
    initial_state: IN_TRANSIT
    terminal_states: [RECEIVED]
    transitions:
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /compliance/shipments/{id}/receive"
        actor: DCInspector
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "received_units <= shipment.shipped_units"
        side_effects:
          - "shipment.received_units := input received_units; arrived_at := clock now; status := RECEIVED"
          - "shipment.invoice_value_cents := received_units * purchase_order.unit_cost_cents"
          - "bubbles up to the owning PurchaseOrder (see PurchaseOrder transitions) which recomputes received_units, first_receipt_at and status"
          - "increments Shipment.version by 1"

  - entity: ComplianceViolation
    shape: branching
    initial_state: DETECTED
    terminal_states: [VOIDED, CHARGED]
    transitions:
      - from: DETECTED
        to: EVIDENCE_COMPLETE
        trigger: "system: auto-transition evaluated after POST /compliance/violations/{id}/evidence"
        actor: system
        preconditions:
          - "violation.evidence_count >= requirement.min_evidence_count"
        side_effects:
          - "violation.status := EVIDENCE_COMPLETE"
          - "shipment.evidence_capture_count incremented by 1 (monotonic; never decremented)"
          - "increments ComplianceViolation.version by 1"
        note: "When requirement.min_evidence_count == 0 the violation is created directly in EVIDENCE_COMPLETE - the empty-evidence-set boundary."
      - from: DETECTED
        to: VOIDED
        trigger: "POST /compliance/violations/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "violation.status IN {DETECTED, EVIDENCE_COMPLETE}"
        side_effects:
          - "violation.status := VOIDED; void_reason := input void_reason"
          - "shipment.open_violation_count decremented by 1 (restores the pre-creation value)"
          - "vendor.open_violation_count decremented by 1"
          - "shipment.evidence_capture_count is NOT decremented - evidence is append-only audit history"
          - "increments ComplianceViolation.version by 1"
      - from: EVIDENCE_COMPLETE
        to: VOIDED
        trigger: "POST /compliance/violations/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "violation.status IN {DETECTED, EVIDENCE_COMPLETE}"
        side_effects:
          - "same side-effect set as the DETECTED -> VOIDED branch"
      - from: EVIDENCE_COMPLETE
        to: CHARGED
        trigger: "POST /compliance/violations/{id}/assess"
        actor: ComplianceOfficer
        preconditions:
          - "violation.status == EVIDENCE_COMPLETE"
          - "shipment.status == RECEIVED"
          - "the pinned requirement's guide has status IN {PUBLISHED, SUPERSEDED} and effective_from <= shipment.arrived_at < coalesce(effective_until, +infinity)"
        side_effects:
          - "CASCADE LINK 1: violation.status := CHARGED; shipment.open_violation_count and vendor.open_violation_count decremented by 1"
          - "CASCADE LINK 2 (caused by link 1): a Chargeback row is created with dispute_status == NONE, settlement_status == ASSESSED, requirement_id pinned, evidence_at_assessment_count := violation.evidence_count, and amounts from calculations.chargeback_assessment"
          - "CASCADE LINK 3 (caused by link 2): vendor.open_chargeback_cents recomputed by calculations.vendor_exposure_reconciliation"
          - "CASCADE LINK 4 (caused by link 3): vendor.exposure_alert_flag := (vendor.open_chargeback_cents >= VENDOR_EXPOSURE_ALERT_CENTS); increments Vendor.version by 1"
        note: "Divergent from the VOIDED branch: only this branch mints a Chargeback and touches vendor money fields. Attempting this trigger from DETECTED is refused by validation priority 10 with ERR_EVIDENCE_INSUFFICIENT (422), not by priority 8; from VOIDED or CHARGED it is refused with ERR_VIOLATION_NOT_OPEN (409)."

  - entity: Chargeback
    dimension: dispute_status
    shape: parallel_dimension
    initial_state: NONE
    terminal_states: [UPHELD, REVERSED, PARTIALLY_REVERSED]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "POST /compliance/chargebacks/{id}/disputes"
        actor: Vendor
        preconditions:
          - "chargeback.dispute_status == NONE"
          - "clock now < chargeback.assessed_at + DISPUTE_WINDOW_DAYS days"
          - "chargeback.settlement_status != WRITTEN_OFF"
        side_effects:
          - "chargeback.dispute_status := OPEN"
          - "a VendorDispute row is created with status == SUBMITTED and round_count == 1"
          - "increments Chargeback.version by 1"
        note: "This dimension is independent of settlement_status: a chargeback already PARTIALLY_RECOVERED or RECOVERED can still move NONE -> OPEN here without any settlement_status change."
      - from: OPEN
        to: UPHELD
        trigger: "POST /compliance/disputes/{id}/decide with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "dispute.decided_by_user_id candidate != violation.detected_by_user_id"
        side_effects:
          - "chargeback.dispute_status := UPHELD; reversal_cents unchanged"
          - "increments Chargeback.version by 1"
      - from: OPEN
        to: REVERSED
        trigger: "POST /compliance/disputes/{id}/decide with decision APPROVE resolving to APPROVED_FULL"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "calculations.dispute_reversal_determination yields approved_reversal_cents == eligible_cap_cents"
        side_effects:
          - "chargeback.reversal_cents += approved_reversal_cents; dispute_status := REVERSED"
          - "settlement_status recomputed by calculations.chargeback_settlement_reconciliation"
          - "cascade links 3 and 4 of the dispute-decide chain fire (Deduction.over_allocated_cents, then Vendor.refund_due_cents / open_chargeback_cents / exposure_alert_flag)"
          - "increments Chargeback.version by 1"
      - from: OPEN
        to: PARTIALLY_REVERSED
        trigger: "POST /compliance/disputes/{id}/decide with decision APPROVE resolving to APPROVED_PARTIAL"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "calculations.dispute_reversal_determination yields 0 < approved_reversal_cents < eligible_cap_cents"
        side_effects:
          - "chargeback.reversal_cents += approved_reversal_cents; dispute_status := PARTIALLY_REVERSED"
          - "settlement_status recomputed; cascade links 3 and 4 fire as above"
          - "increments Chargeback.version by 1"

  - entity: Chargeback
    dimension: settlement_status
    shape: parallel_dimension_cyclic
    initial_state: ASSESSED
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: ASSESSED
        to: PARTIALLY_RECOVERED
        trigger: "POST /compliance/deductions/{id}/post or POST /compliance/chargebacks/{id}/cash-applications"
        actor: APAccountant
        preconditions:
          - "chargeback.settlement_status IN {ASSESSED, PARTIALLY_RECOVERED}"
          - "for the deduction path: chargeback.dispute_status IN {NONE, UPHELD, PARTIALLY_REVERSED}"
          - "after the write, 0 < recovered_cents < (gross_assessed_cents - reversal_cents)"
        side_effects:
          - "for the deduction path: every child allocation of the deduction flips effective_status PENDING -> EFFECTIVE and chargeback.deduction_posted := true"
          - "settlement_status := PARTIALLY_RECOVERED; recovered_cents and outstanding_cents recomputed"
          - "vendor.open_chargeback_cents and recovered_lifetime_cents recomputed"
          - "increments Chargeback.version by 1"
        note: "This dimension is independent of dispute_status: a chargeback whose dispute_status is OPEN still cannot be deducted (business rule), but a chargeback whose dispute_status is UPHELD moves here with no dispute_status change."
      - from: ASSESSED
        to: RECOVERED
        trigger: "POST /compliance/deductions/{id}/post or POST /compliance/chargebacks/{id}/cash-applications"
        actor: APAccountant
        preconditions:
          - "chargeback.settlement_status == ASSESSED"
          - "after the write, recovered_cents >= (gross_assessed_cents - reversal_cents) AND (gross_assessed_cents - reversal_cents) > 0"
        side_effects:
          - "settlement_status := RECOVERED; outstanding_cents := 0"
          - "chargeback.deduction_posted := true on the deduction path"
          - "vendor.open_chargeback_cents recomputed (this chargeback leaves the exposure set); recovered_lifetime_cents recomputed"
          - "increments Chargeback.version by 1"
      - from: PARTIALLY_RECOVERED
        to: RECOVERED
        trigger: "POST /compliance/chargebacks/{id}/cash-applications or POST /compliance/deductions/{id}/post"
        actor: APAccountant
        preconditions:
          - "after the write, recovered_cents >= (gross_assessed_cents - reversal_cents)"
        side_effects:
          - "settlement_status := RECOVERED; outstanding_cents := 0"
          - "vendor.open_chargeback_cents and recovered_lifetime_cents recomputed"
          - "increments Chargeback.version by 1"
      - from: PARTIALLY_RECOVERED
        to: ASSESSED
        trigger: "POST /compliance/deductions/{id}/reverse"
        actor: APAccountant
        preconditions:
          - "deduction.status == POSTED"
          - "after the reversal, recovered_cents == 0"
        side_effects:
          - "every child allocation of the deduction flips effective_status EFFECTIVE -> REVERSED; chargeback.deduction_posted := false"
          - "settlement_status := ASSESSED; recovered_cents := 0; outstanding_cents restored to (gross_assessed_cents - reversal_cents)"
          - "vendor.open_chargeback_cents and recovered_lifetime_cents restored to their pre-post values"
          - "increments Chargeback.version by 1"
        note: "Compensating edge; makes this dimension cyclic (ASSESSED -> PARTIALLY_RECOVERED -> ASSESSED)."
      - from: RECOVERED
        to: ASSESSED
        trigger: "POST /compliance/deductions/{id}/reverse"
        actor: APAccountant
        preconditions:
          - "deduction.status == POSTED"
          - "after the reversal, recovered_cents == 0"
        side_effects:
          - "same side-effect set as the PARTIALLY_RECOVERED -> ASSESSED transition"
      - from: ASSESSED
        to: WRITTEN_OFF
        trigger: "system: cascade link 2 of POST /compliance/disputes/{id}/decide"
        actor: system
        preconditions:
          - "chargeback.reversal_cents >= chargeback.gross_assessed_cents"
        side_effects:
          - "settlement_status := WRITTEN_OFF; outstanding_cents := 0"
          - "vendor.open_chargeback_cents recomputed"
          - "increments Chargeback.version by 1"
      - from: PARTIALLY_RECOVERED
        to: WRITTEN_OFF
        trigger: "system: cascade link 2 of POST /compliance/disputes/{id}/decide"
        actor: system
        preconditions:
          - "chargeback.reversal_cents >= chargeback.gross_assessed_cents"
          - "chargeback.recovered_cents > 0"
        side_effects:
          - "settlement_status := WRITTEN_OFF; outstanding_cents := 0"
          - "every EFFECTIVE allocation on this chargeback contributes to its Deduction.over_allocated_cents (cascade link 3)"
          - "vendor.refund_due_cents recomputed to the full recovered_cents amount (cascade link 4)"
          - "increments Chargeback.version by 1"

  - entity: VendorDispute
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [APPROVED_FULL, APPROVED_PARTIAL, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /compliance/disputes/{id}/request-info"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == SUBMITTED"
          - "dispute.round_count < DISPUTE_MAX_ROUNDS"
        side_effects:
          - "dispute.status := INFO_REQUESTED; information_request_note := input"
          - "increments VendorDispute.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /compliance/disputes/{id}/resubmit"
        actor: Vendor
        preconditions:
          - "dispute.status == INFO_REQUESTED"
          - "dispute.round_count < DISPUTE_MAX_ROUNDS"
          - "claimed_reversal_cents <= chargeback.gross_assessed_cents - chargeback.reversal_cents"
        side_effects:
          - "dispute.status := SUBMITTED; round_count += 1; claimed_reversal_cents and narrative replaced with the new round's values"
          - "increments VendorDispute.version by 1"
        note: "Closes the revision loop SUBMITTED -> INFO_REQUESTED -> SUBMITTED. A third round is rejected with ERR_DISPUTE_ROUND_LIMIT_EXCEEDED."
      - from: SUBMITTED
        to: APPROVED_FULL
        trigger: "POST /compliance/disputes/{id}/decide with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "X-User-ID != violation.detected_by_user_id"
          - "calculations.dispute_reversal_determination step S7 classifies APPROVED_FULL"
        side_effects:
          - "CASCADE LINK 1: dispute.status := APPROVED_FULL; reason_ceiling_pct, goodwill_cents, approved_reversal_cents written; decided_at, decided_by_user_id, review_note stamped"
          - "CASCADE LINK 2 (caused by link 1): chargeback.reversal_cents += approved_reversal_cents, dispute_status := REVERSED, settlement_status recomputed"
          - "CASCADE LINK 3 (caused by link 2): every Deduction holding an EFFECTIVE allocation on that chargeback recomputes over_allocated_cents"
          - "CASCADE LINK 4 (caused by link 3): vendor.refund_due_cents, open_chargeback_cents and exposure_alert_flag recomputed; increments Vendor.version by 1"
      - from: INFO_REQUESTED
        to: APPROVED_PARTIAL
        trigger: "POST /compliance/disputes/{id}/decide with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "X-User-ID != violation.detected_by_user_id"
          - "calculations.dispute_reversal_determination step S7 classifies APPROVED_PARTIAL"
        side_effects:
          - "same four cascade links as APPROVED_FULL, except chargeback.dispute_status := PARTIALLY_REVERSED"
      - from: SUBMITTED
        to: APPROVED_PARTIAL
        trigger: "POST /compliance/disputes/{id}/decide with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "X-User-ID != violation.detected_by_user_id"
          - "calculations.dispute_reversal_determination step S7 classifies APPROVED_PARTIAL"
        side_effects:
          - "same four cascade links as APPROVED_FULL, except chargeback.dispute_status := PARTIALLY_REVERSED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /compliance/disputes/{id}/decide with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "X-User-ID != violation.detected_by_user_id"
        side_effects:
          - "dispute.status := DENIED; approved_reversal_cents := 0; goodwill_cents := 0"
          - "chargeback.dispute_status := UPHELD; chargeback.reversal_cents unchanged"
          - "no vendor money field changes"
          - "increments VendorDispute.version by 1"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /compliance/disputes/{id}/decide with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, INFO_REQUESTED}"
          - "X-User-ID != violation.detected_by_user_id"
        side_effects:
          - "same side-effect set as the SUBMITTED -> DENIED transition"

  - entity: CorrectiveActionPlan
    shape: cyclic
    initial_state: ISSUED
    terminal_states: [CLOSED_SUCCESS, CLOSED_UNREMEDIATED]
    transitions:
      - from: ISSUED
        to: VENDOR_SUBMITTED
        trigger: "POST /compliance/corrective-action-plans/{id}/submit"
        actor: Vendor
        preconditions:
          - "cap.status IN {ISSUED, REJECTED}"
          - "cap.submission_round < CAP_MAX_SUBMISSIONS"
          - "committed_completion_at <= cap.due_at"
        side_effects:
          - "cap.status := VENDOR_SUBMITTED; submission_round += 1; milestone_text and committed_completion_at written"
          - "increments CorrectiveActionPlan.version by 1"
      - from: VENDOR_SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/corrective-action-plans/{id}/decide with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status == VENDOR_SUBMITTED"
        side_effects:
          - "cap.status := REJECTED; decided_at and review_note stamped"
          - "increments CorrectiveActionPlan.version by 1"
      - from: REJECTED
        to: VENDOR_SUBMITTED
        trigger: "POST /compliance/corrective-action-plans/{id}/submit"
        actor: Vendor
        preconditions:
          - "cap.status IN {ISSUED, REJECTED}"
          - "cap.submission_round < CAP_MAX_SUBMISSIONS"
          - "committed_completion_at <= cap.due_at"
        side_effects:
          - "cap.status := VENDOR_SUBMITTED; submission_round += 1"
          - "increments CorrectiveActionPlan.version by 1"
        note: "Closes the rework loop VENDOR_SUBMITTED -> REJECTED -> VENDOR_SUBMITTED; a third submission is rejected with ERR_CAP_SUBMISSION_LIMIT_EXCEEDED."
      - from: VENDOR_SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance/corrective-action-plans/{id}/decide with decision ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status == VENDOR_SUBMITTED"
        side_effects:
          - "cap.status := ACCEPTED; decided_at and review_note stamped"
          - "increments CorrectiveActionPlan.version by 1"
      - from: REJECTED
        to: ESCALATED
        trigger: "POST /compliance/corrective-action-plans/{id}/escalate"
        actor: CategoryBuyer
        preconditions:
          - "cap.status == REJECTED"
          - "buying_decision == SOURCING_HOLD requires cap.escalation_level >= 2; buying_decision == RANGE_REVIEW is permitted at any escalation_level"
        side_effects:
          - "cap.status := ESCALATED; buying_decision := input; escalated_at and escalation_note stamped"
          - "when buying_decision == SOURCING_HOLD: vendor.status PROBATION -> SOURCING_HOLD"
          - "increments CorrectiveActionPlan.version by 1"
      - from: ACCEPTED
        to: CLOSED_SUCCESS
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome SUCCESS"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status IN {ACCEPTED, ESCALATED}"
        side_effects:
          - "cap.status := CLOSED_SUCCESS; closed_at and closure_note stamped"
          - "vendor.open_cap_count recomputed; when it reaches 0 the vendor returns to ACTIVE"
          - "increments CorrectiveActionPlan.version by 1"
      - from: ESCALATED
        to: CLOSED_SUCCESS
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome SUCCESS"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status IN {ACCEPTED, ESCALATED}"
        side_effects:
          - "cap.status := CLOSED_SUCCESS; closed_at and closure_note stamped"
          - "when cap.buying_decision == SOURCING_HOLD: vendor.status SOURCING_HOLD -> PROBATION (compensating restoration)"
          - "vendor.open_cap_count recomputed"
          - "increments CorrectiveActionPlan.version by 1"
      - from: ACCEPTED
        to: CLOSED_UNREMEDIATED
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status IN {ACCEPTED, ESCALATED}"
        side_effects:
          - "cap.status := CLOSED_UNREMEDIATED; closed_at and closure_note stamped"
          - "vendor.open_cap_count recomputed; vendor.status is NOT restored (remains PROBATION or SOURCING_HOLD)"
          - "this plan becomes eligible as predecessor_cap_id for the next CorrectiveActionPlan, raising its escalation_level"
          - "increments CorrectiveActionPlan.version by 1"
      - from: ESCALATED
        to: CLOSED_UNREMEDIATED
        trigger: "POST /compliance/corrective-action-plans/{id}/close with outcome FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "cap.status IN {ACCEPTED, ESCALATED}"
        side_effects:
          - "same side-effect set as the ACCEPTED -> CLOSED_UNREMEDIATED transition"

  - entity: Scorecard
    shape: cyclic
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: MEASURED
        trigger: "POST /compliance/scorecards/{id}/measure"
        actor: ComplianceOfficer
        preconditions:
          - "scorecard.status IN {OPEN, MEASURED}"
          - "the measurement input set is non-empty (measured_po_count >= 1)"
        side_effects:
          - "all measurement counters and percentages written by calculations.otif_scorecard_measurement"
          - "cap_required written by calculations.repeat_offender_escalation"
          - "measurement_variant := input; measured_at := clock now"
          - "increments Scorecard.version by 1"
      - from: MEASURED
        to: MEASURED
        trigger: "POST /compliance/scorecards/{id}/measure with a different measurement_variant"
        actor: ComplianceOfficer
        preconditions:
          - "scorecard.status IN {OPEN, MEASURED}"
        side_effects:
          - "counters recomputed from scratch; measured_po_count, on_time_count, in_full_count and otif_count are variant-invariant while fill_rate_pct and composite_score change"
          - "increments Scorecard.version by 1"
        note: "Self-loop; re-measurement is the vehicle for the dual-variant divergence test."
      - from: MEASURED
        to: FINALIZED
        trigger: "POST /compliance/scorecards/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "scorecard.status == MEASURED"
        side_effects:
          - "CASCADE LINK 1: scorecard.status := FINALIZED; finalized_at := clock now"
          - "CASCADE LINK 2 (caused by link 1): vendor.otif_score := scorecard.composite_score; vendor.repeat_offender_flag := calculations.repeat_offender_escalation.repeat_offender_flag"
          - "CASCADE LINK 3 (caused by link 2): when scorecard.cap_required == true a CorrectiveActionPlan is created with status ISSUED, escalation_level, repeat_count, predecessor_cap_id and due_at; vendor.open_cap_count recomputed"
          - "CASCADE LINK 4 (caused by link 3): vendor.status ACTIVE -> PROBATION"
          - "increments Vendor.version by 1"

  - entity: Deduction
    shape: linear_with_compensation
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /compliance/deductions/{id}/post"
        actor: APAccountant
        preconditions:
          - "deduction.status == DRAFT"
          - "deduction.allocation_count >= 1"
          - "every allocated chargeback has dispute_status IN {NONE, UPHELD, PARTIALLY_REVERSED}"
          - "deduction.amount_cents <= vendor.open_chargeback_cents"
        side_effects:
          - "deduction.status := POSTED; posted_at and posted_by_user_id stamped"
          - "every child RecoveryAllocation flips effective_status PENDING -> EFFECTIVE"
          - "each allocated Chargeback recomputes recovered_cents, outstanding_cents and settlement_status"
          - "vendor.open_chargeback_cents and recovered_lifetime_cents recomputed"
          - "increments Deduction.version by 1"
      - from: POSTED
        to: REVERSED
        trigger: "POST /compliance/deductions/{id}/reverse"
        actor: APAccountant
        preconditions:
          - "deduction.status == POSTED"
        side_effects:
          - "deduction.status := REVERSED; reversed_at and reversal_reason stamped"
          - "every child RecoveryAllocation flips effective_status EFFECTIVE -> REVERSED"
          - "each allocated Chargeback recomputes recovered_cents, outstanding_cents and settlement_status, returning to the pre-post values"
          - "vendor.open_chargeback_cents and recovered_lifetime_cents restored to their pre-post values (compensating invariant)"
          - "increments Deduction.version by 1"

concurrency_rules:
  - rule_id: deduction-create-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /compliance/deductions"
    occ_field: "expected_vendor_version"
    description: |
      Creating a Deduction against a Vendor whose version has advanced since the
      client last observed it is rejected. Deductions legitimately stack against
      one payable, so a second draft is valid product behaviour; the OCC check
      exists because every deduction draft re-reads the vendor's open exposure,
      and a stale view of that exposure would let an accountant net more than the
      vendor actually owes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cash-application-stale-chargeback
    parent_entity: Chargeback
    write_endpoint: "POST /compliance/chargebacks/{id}/cash-applications"
    occ_field: "expected_chargeback_version"
    description: |
      Applying vendor cash to a Chargeback whose version has advanced since the
      client last observed it is rejected. Partial cash applications legitimately
      stack on one chargeback, so a second application is valid product behaviour;
      the OCC check exists because the over-application ceiling is computed from
      outstanding_cents, and a stale view of that field would let cash exceed the
      amount actually owed.
    error_id: ERR_STALE_VERSION
    http_status: 412
calculations:
  - name: chargeback_assessment
    trigger: "POST /compliance/violations/{id}/assess — cascade link 2 writes Chargeback.fixed_fee_cents, cost_recovery_cents, gross_assessed_cents, assessment_variant"
    algorithm: tiered_pricing
    formula: |
      # r = the RoutingRequirement pinned onto the Chargeback (requirement_id)
      # v = the ComplianceViolation being assessed
      # s = v's Shipment
      fixed_fee_cents = r.fixed_fee_cents
      unit_recovery_cents = r.per_unit_recovery_cents * v.affected_units
      handling_recovery_cents = round_half_up(s.invoice_value_cents * r.handling_pct / 100)

      # severity-tier branch (non-linear: nested max, tier selection, and a zero branch)
      if r.severity_tier == "TIER_1":
          cost_recovery_cents = unit_recovery_cents + handling_recovery_cents
      elif r.severity_tier == "TIER_2":
          cost_recovery_cents = max(unit_recovery_cents, handling_recovery_cents)
      else:  # TIER_3
          cost_recovery_cents = 0

      # variant hook (see variants: below) may zero cost_recovery_cents
      raw_cents = fixed_fee_cents + cost_recovery_cents
      gross_assessed_cents = min(max(raw_cents, r.min_fee_cents), r.cap_cents)
      outstanding_cents = gross_assessed_cents   # reversal_cents and recovered_cents are 0 at creation
    input_set: |
      Exactly one ComplianceViolation with status == EVIDENCE_COMPLETE, its Shipment
      (status == RECEIVED, so invoice_value_cents is already final), and the single
      RoutingRequirement named by violation.requirement_id. No other violation on the
      same shipment participates. The requirement is copied onto the Chargeback so a
      later guide supersession cannot re-price an existing Chargeback.
    constants:
      GRACE_LOOKBACK_DAYS: 180
    precision: "cents, integer; handling_recovery_cents rounded to whole cents with round_half_up before entering the tier branch"
    variants:
      - name: STANDARD
        when: "The vendor has at least one other Chargeback whose pinned requirement.requirement_code equals this requirement_code and whose assessed_at is within GRACE_LOOKBACK_DAYS before the current logical clock, OR requirement.severity_tier == TIER_1."
        difference: "cost_recovery_cents keeps the severity-tier branch value; the min_fee floor and cap ceiling both apply to fixed_fee_cents + cost_recovery_cents."
      - name: GRACE_FIRST_OCCURRENCE
        when: "requirement.severity_tier IN {TIER_2, TIER_3} AND the vendor has zero other Chargeback rows whose pinned requirement_code equals this requirement_code with assessed_at within GRACE_LOOKBACK_DAYS before the current logical clock."
        difference: "cost_recovery_cents is forced to 0 and the min_fee_cents floor is NOT applied, so gross_assessed_cents = min(fixed_fee_cents, cap_cents). Identical violation data therefore yields a different gross_assessed_cents than STANDARD."

  - name: otif_scorecard_measurement
    trigger: "POST /compliance/scorecards/{id}/measure — writes Scorecard.measured_po_count, on_time_count, in_full_count, otif_count, on_time_pct, fill_rate_pct, otif_pct, composite_score, measurement_variant"
    algorithm: aggregation
    formula: |
      # Input set is walked in a pinned order: must_arrive_by ASC, then created_at ASC.
      scope = [po for po in PurchaseOrder
               if po.vendor_id == sc.vendor_id
               and sc.period_start <= po.must_arrive_by <= sc.period_end
               and po.status IN {OPEN, PARTIALLY_RECEIVED, RECEIVED}]
      measured_po_count = len(scope)
      if measured_po_count == 0: reject with ERR_SCORECARD_NO_MEASURABLE_ORDERS

      for po in scope:                       # ordered by must_arrive_by ASC, created_at ASC
          first_receipt_at = po.first_receipt_at        # earliest arrived_at among RECEIVED shipments
          on_time[po] = (first_receipt_at is not None
                         and first_receipt_at >= po.must_arrive_by - sc.tolerance_early_days days
                         and first_receipt_at <= po.must_arrive_by + sc.tolerance_late_days days)
          po_fill_pct[po] = round_half_up(100 * po.received_units / po.ordered_units, 2)
          in_full[po] = po_fill_pct[po] >= (100.00 - sc.fill_tolerance_pct)     # >= , not >
          otif[po]    = on_time[po] and in_full[po]

      on_time_count = count(on_time is True)
      in_full_count = count(in_full is True)
      otif_count    = count(otif is True)
      on_time_pct   = round_half_up(100 * on_time_count / measured_po_count, 2)
      otif_pct      = round_half_up(100 * otif_count / measured_po_count, 2)
      fill_rate_pct = <variant-specific, see variants:>
      composite_score = round_half_up(OTIF_WEIGHT * otif_pct + FILL_WEIGHT * fill_rate_pct, 2)
    input_set: |
      PurchaseOrders of scorecard.vendor_id whose must_arrive_by falls in the CLOSED
      interval [period_start, period_end] and whose status IN {OPEN, PARTIALLY_RECEIVED,
      RECEIVED}. Only Shipments with status == RECEIVED contribute received_units and
      arrived_at (IN_TRANSIT shipments are excluded entirely). Walk order is
      must_arrive_by ASC, then created_at ASC; the walk order does not change any
      aggregate but is pinned so the two variants agree on membership.
    constants:
      OTIF_WEIGHT: 0.60
      FILL_WEIGHT: 0.40
    precision: "percentages to 2 decimal places, round_half_up; the ROUNDING ORDER is variant-specific and pinned per variant below"
    variants:
      - name: ORDER_WEIGHTED
        when: "measurement_variant == ORDER_WEIGHTED"
        difference: "ROUND-THEN-AGGREGATE. Each order's po_fill_pct is rounded to 2 decimals FIRST, then those rounded per-order values are averaged and the average is rounded again: fill_rate_pct = round_half_up(sum(po_fill_pct[po] for po in scope) / measured_po_count, 2). Every order carries equal weight regardless of its size."
      - name: UNIT_WEIGHTED
        when: "measurement_variant == UNIT_WEIGHTED"
        difference: "AGGREGATE-THEN-ROUND. Units are summed across the whole scope before any rounding: fill_rate_pct = round_half_up(100 * sum(po.received_units for po in scope) / sum(po.ordered_units for po in scope), 2). Large orders dominate. For identical data the two variants yield different fill_rate_pct and therefore different composite_score."

  - name: dispute_reversal_determination
    trigger: "POST /compliance/disputes/{id}/decide — cascade link 1 writes VendorDispute.reason_ceiling_pct, goodwill_cents, approved_reversal_cents and the resulting status"
    algorithm: constraint_propagation
    formula: |
      # Steps run EXACTLY ONCE each, in this pinned order S1..S7. The dependency
      # looks circular (the goodwill uplift is granted only when the outcome is
      # PARTIAL, yet the outcome is classified from the amount that the uplift
      # changes); the pinned order resolves it: goodwill is decided against the
      # PRE-goodwill classification, and the post-goodwill amount then re-classifies
      # the outcome WITHOUT withdrawing the uplift.
      if decision == "DENY":
          reason_ceiling_pct = 0.00; goodwill_cents = 0; approved_reversal_cents = 0
          status = DENIED; stop

      S1  eligible_cap_cents = cb.gross_assessed_cents - cb.reversal_cents
      S2  reason_ceiling_pct =
              100.00  if reason_code IN {NOT_OUR_LABEL, DUPLICATE_ASSESSMENT, FEE_MISCALCULATED}
              100.00  if reason_code == EVIDENCE_INSUFFICIENT and cb.evidence_at_assessment_count < r.min_evidence_count
              50.00   if reason_code == EVIDENCE_INSUFFICIENT and cb.evidence_at_assessment_count >= r.min_evidence_count
              60.00   if reason_code == CARRIER_CAUSED
      S3  reason_ceiling_cents = round_half_up(eligible_cap_cents * reason_ceiling_pct / 100)
      S4  requested_cents = min(d.claimed_reversal_cents, reason_ceiling_cents)
      S5  pre_goodwill_outcome = "FULL" if requested_cents >= eligible_cap_cents else "PARTIAL"
          goodwill_cents =
              round_half_up((eligible_cap_cents - requested_cents) * GOODWILL_PCT / 100)
              if (pre_goodwill_outcome == "PARTIAL"
                  and vendor.otif_score >= GOODWILL_OTIF_THRESHOLD
                  and d.round_count == 1)
              else 0
      S6  approved_reversal_cents = min(requested_cents + goodwill_cents, eligible_cap_cents)
      S7  status = DENIED           if approved_reversal_cents == 0
                   APPROVED_FULL    if approved_reversal_cents == eligible_cap_cents
                   APPROVED_PARTIAL otherwise
    input_set: |
      Exactly one VendorDispute with status IN {SUBMITTED, INFO_REQUESTED}, its
      Chargeback cb, the Chargeback's pinned RoutingRequirement r, and the Vendor's
      otif_score as of the decision instant. Prior reversals on the same chargeback
      are excluded from eligible_cap_cents by construction (S1 subtracts them).
    constants:
      GOODWILL_PCT: 25
      GOODWILL_OTIF_THRESHOLD: 95.00
    precision: "cents, integer; round_half_up applied independently at S3 and at S5, never to an intermediate sum"

  - name: vendor_exposure_reconciliation
    trigger: "Cascade link 3/4 of POST /compliance/violations/{id}/assess; cascade link 4 of POST /compliance/disputes/{id}/decide; side effects of POST /compliance/deductions/{id}/post, POST /compliance/deductions/{id}/reverse and POST /compliance/chargebacks/{id}/cash-applications — writes Vendor.open_chargeback_cents, recovered_lifetime_cents, refund_due_cents, exposure_alert_flag"
    algorithm: aggregation
    formula: |
      CB = [cb for cb in Chargeback if cb.vendor_id == vendor.id]

      open_chargeback_cents = sum(
          cb.gross_assessed_cents - cb.reversal_cents - cb.recovered_cents
          for cb in CB
          if cb.settlement_status IN {ASSESSED, PARTIALLY_RECOVERED})

      recovered_lifetime_cents = sum(
          a.allocated_cents
          for a in RecoveryAllocation
          if a.chargeback_id IN {cb.id for cb in CB} and a.effective_status == "EFFECTIVE")

      refund_due_cents = sum(
          max(0, cb.recovered_cents - (cb.gross_assessed_cents - cb.reversal_cents))
          for cb in CB)

      exposure_alert_flag = (open_chargeback_cents >= VENDOR_EXPOSURE_ALERT_CENTS)
    input_set: |
      All Chargeback rows of the vendor. open_chargeback_cents includes ONLY
      settlement_status IN {ASSESSED, PARTIALLY_RECOVERED} — RECOVERED and
      WRITTEN_OFF rows are excluded. recovered_lifetime_cents and refund_due_cents
      range over ALL settlement_status values with no status filter, so a
      WRITTEN_OFF chargeback that still holds cash contributes to refund_due_cents.
      Full recompute from source rows on every trigger; no incremental delta.
    constants:
      VENDOR_EXPOSURE_ALERT_CENTS: 500000
    precision: "cents, integer; no rounding — every term is already integral"

  - name: repeat_offender_escalation
    trigger: "POST /compliance/scorecards/{id}/measure writes Scorecard.cap_required; POST /compliance/scorecards/{id}/finalize cascade links 2-3 write Vendor.repeat_offender_flag, CorrectiveActionPlan.escalation_level, repeat_count, predecessor_cap_id and due_at"
    algorithm: threshold
    formula: |
      window_start = sc.period_end - REPEAT_LOOKBACK_DAYS days
      # window is half-open [window_start, sc.period_end)
      charged = [cb for cb in Chargeback
                 if cb.vendor_id == sc.vendor_id
                 and window_start <= cb.assessed_at < sc.period_end
                 and cb.dispute_status != "REVERSED"]
      charged_violation_count = len(charged)
      tier1_count = len([cb for cb in charged
                         if pinned_requirement(cb).severity_tier == "TIER_1"])
      prior_failed_caps = len([c for c in CorrectiveActionPlan
                               if c.vendor_id == sc.vendor_id
                               and c.status == "CLOSED_UNREMEDIATED"
                               and window_start <= c.closed_at < sc.period_end])

      repeat_offender_flag = (charged_violation_count >= REPEAT_VIOLATION_THRESHOLD) \
                             or (tier1_count >= 1 and sc.composite_score < REPEAT_TIER1_SCORE)
      cap_required = repeat_offender_flag and sc.composite_score < CAP_TRIGGER_SCORE
      escalation_level = min(3, 1 + prior_failed_caps
                                + (1 if sc.composite_score < CRITICAL_SCORE else 0))
      repeat_count = charged_violation_count
      # predecessor selection is explicit, never by id:
      predecessor_cap_id = the vendor's CorrectiveActionPlan with status == CLOSED_UNREMEDIATED
                           ranked by closed_at DESC, tie-broken by created_at DESC;
                           null when the vendor has none
      due_at = cap.issued_at + CAP_DUE_DAYS_BY_LEVEL[escalation_level] days
    input_set: |
      Chargebacks of the vendor whose assessed_at lies in the HALF-OPEN window
      [period_end - 180 days, period_end) and whose dispute_status != REVERSED
      (PARTIALLY_REVERSED rows still count). CLOSED_UNREMEDIATED CorrectiveActionPlans of
      the vendor whose closed_at lies in the same half-open window. Voided
      ComplianceViolations never appear because they mint no Chargeback.
    constants:
      REPEAT_LOOKBACK_DAYS: 180
      REPEAT_VIOLATION_THRESHOLD: 3
      REPEAT_TIER1_SCORE: 90.00
      CAP_TRIGGER_SCORE: 92.00
      CRITICAL_SCORE: 80.00
      CAP_DUE_DAYS_BY_LEVEL: { 1: 30, 2: 21, 3: 14 }
    precision: "integers for all counts; composite_score compared at 2 decimal places with a strict `<`"

  - name: chargeback_settlement_reconciliation
    trigger: "Side effects of POST /compliance/deductions/{id}/post, POST /compliance/deductions/{id}/reverse, POST /compliance/chargebacks/{id}/cash-applications, and cascade link 2 of POST /compliance/disputes/{id}/decide — writes Chargeback.recovered_cents, outstanding_cents, deduction_posted, settlement_status and Deduction.amount_cents, allocation_count, over_allocated_cents"
    algorithm: waterfall_allocation
    formula: |
      A = [a for a in RecoveryAllocation if a.chargeback_id == cb.id]
      recovered_cents = sum(a.allocated_cents for a in A if a.effective_status == "EFFECTIVE")
      net_assessed_cents = cb.gross_assessed_cents - cb.reversal_cents
      outstanding_cents = max(0, net_assessed_cents - recovered_cents)
      deduction_posted = any(a.source_type == "DEDUCTION"
                             and deduction(a).status == "POSTED" for a in A)

      # settlement_status branches evaluated in this pinned order (first match wins):
      1. net_assessed_cents <= 0                                  -> WRITTEN_OFF
      2. recovered_cents >= net_assessed_cents                     -> RECOVERED
      3. recovered_cents > 0                                      -> PARTIALLY_RECOVERED
      4. otherwise                                                -> ASSESSED

      # allocation ceilings enforced BEFORE any row is written:
      #   deduction allocation: allocated_cents <= cb.outstanding_cents
      #        else ERR_ALLOCATION_EXCEEDS_OUTSTANDING
      #   cash application:    amount_cents <= cb.outstanding_cents   (equality allowed)
      #        else ERR_OVER_APPLICATION
      Deduction.amount_cents      = sum(a.allocated_cents for a in this deduction's
                                        allocations if a.effective_status != "REVERSED")
      Deduction.allocation_count  = count(this deduction's allocations)
      Deduction.over_allocated_cents = sum(max(0, a.allocated_cents -
                                        (chargeback(a).gross_assessed_cents -
                                         chargeback(a).reversal_cents))
                                        for a in this deduction's allocations
                                        if a.effective_status == "EFFECTIVE")
    input_set: |
      All RecoveryAllocation rows of the chargeback, partitioned by effective_status.
      PENDING rows (allocations under a DRAFT Deduction) and REVERSED rows
      (allocations under a REVERSED Deduction) contribute 0 to recovered_cents.
      Branch 2 uses `>=`, not `>`, so an exact-payoff cash application lands on
      RECOVERED rather than PARTIALLY_RECOVERED.
    constants: {}
    precision: "cents, integer; no rounding"
program_constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00.000Z"
  VIOLATION_FILING_WINDOW_HOURS: 72
  DISPUTE_WINDOW_DAYS: 30
  DISPUTE_MAX_ROUNDS: 2
  CAP_MAX_SUBMISSIONS: 2
  SCORECARD_PERIOD_GAP_DAYS: 1
  VENDOR_EXPOSURE_ALERT_CENTS: 500000

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum members valid, numeric ranges honored (allocated_cents >= 1, amount_cents >= 1, claimed_reversal_cents >= 1, ordered_units >= 1, handling_pct in 0.00..25.00, min_evidence_count in 0..5, cap_cents >= min_fee_cents, ship_window_end > ship_window_start, must_arrive_by >= ship_window_end, period_end > period_start)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "Every path id resolves, validated left-to-right in the path."
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_ROUTING_GUIDE_NOT_FOUND | ERR_PURCHASE_ORDER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_CAP_NOT_FOUND | ERR_DEDUCTION_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves (vendor_id, requirement_id, chargeback_id)."
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND"
    http_status: 404
    applies_to: "POST /compliance/purchase-orders, POST /compliance/shipments/{id}/violations, POST /compliance/scorecards, POST /compliance/deductions, POST /compliance/deductions/{id}/allocations"
  - priority: 6
    category: business_referential
    check: "When X-User-Role == Vendor, X-User-ID must equal the Vendor.id that owns the targeted resource: purchase_order.vendor_id for shipment creation, chargeback.vendor_id for dispute creation, dispute.vendor_id for dispute evidence and resubmit, cap.vendor_id for CAP submission."
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /compliance/purchase-orders/{id}/shipments, POST /compliance/chargebacks/{id}/disputes, POST /compliance/disputes/{id}/evidence, POST /compliance/disputes/{id}/resubmit, POST /compliance/corrective-action-plans/{id}/submit"
  - priority: 7
    category: state
    check: "The supplied expected_<parent>_version equals the current parent version (Vendor.version for deduction creation, Chargeback.version for cash application)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /compliance/deductions, POST /compliance/chargebacks/{id}/cash-applications"
  - priority: 8
    category: state
    check: "The target resource is in a state from which the requested transition exists, per the §1.2 state machines. Carve-out for assessment: only the terminal violation states {VOIDED, CHARGED} are refused here as ERR_VIOLATION_NOT_OPEN; a still-DETECTED violation passes this rung and is refused by priority 10 as ERR_EVIDENCE_INSUFFICIENT (422), because DETECTED is by construction the under-evidenced state."
    error_id: "ERR_GUIDE_NOT_DRAFT | ERR_SHIPMENT_ALREADY_RECEIVED | ERR_SHIPMENT_NOT_RECEIVED | ERR_VIOLATION_NOT_OPEN | ERR_CHARGEBACK_WRITTEN_OFF | ERR_DISPUTE_NOT_AWAITING_DECISION | ERR_DISPUTE_NOT_INFO_REQUESTED | ERR_SCORECARD_NOT_MEASURED | ERR_SCORECARD_ALREADY_FINALIZED | ERR_CAP_NOT_AWAITING_SUBMISSION | ERR_CAP_NOT_DECIDABLE | ERR_CAP_NOT_ESCALATABLE | ERR_CAP_NOT_CLOSABLE | ERR_DEDUCTION_NOT_DRAFT | ERR_DEDUCTION_ALREADY_POSTED | ERR_DEDUCTION_NOT_POSTED"
    http_status: 409
    applies_to: "all state-transition POST endpoints"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: on dispute adjudication the acting ComplianceOfficer's X-User-ID must differ from the detected_by_user_id of the ComplianceViolation behind the disputed Chargeback."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance/disputes/{id}/decide"
  - priority: 10
    category: business_safety
    check: "Evidence sufficiency: violation.evidence_count >= pinned requirement.min_evidence_count before a violation may be assessed. This is the rung that refuses assessment of a DETECTED violation (priority 8 deliberately lets DETECTED through); when min_evidence_count == 0 the violation is born EVIDENCE_COMPLETE and this rung passes on an empty evidence set."
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /compliance/violations/{id}/assess"
  - priority: 11
    category: business_referential
    check: "Guide effectivity: the RoutingRequirement pinned by the violation belongs to a RoutingGuide with status IN {PUBLISHED, SUPERSEDED} whose effective_from <= shipment.arrived_at < coalesce(effective_until, +infinity)."
    error_id: ERR_GUIDE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /compliance/shipments/{id}/violations, POST /compliance/violations/{id}/assess"
  - priority: 12
    category: business_temporal
    check: "Filing window: logical clock now < shipment.arrived_at + VIOLATION_FILING_WINDOW_HOURS (72) hours. Exactly 72 hours after arrival is CLOSED (strict `<`)."
    error_id: ERR_VIOLATION_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /compliance/shipments/{id}/violations"
  - priority: 13
    category: business_temporal
    check: "Dispute window: logical clock now < chargeback.assessed_at + DISPUTE_WINDOW_DAYS (30) days. Exactly 30 days after assessment is CLOSED (strict `<`)."
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /compliance/chargebacks/{id}/disputes"
  - priority: 14
    category: business_temporal
    check: "Guide effectivity overlap on the scope_code resource. Two guides COLLIDE when they share a scope_code, or when either one's scope_code == ALL. Interval semantics: HALF-OPEN [effective_from, effective_until); adjacency at a shared instant is ALLOWED (a successor may begin at exactly the instant the predecessor's window ends). Publishing is rejected when any colliding RoutingGuide with status == PUBLISHED has effective_from >= the candidate's effective_from."
    error_id: ERR_GUIDE_EFFECTIVE_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/routing-guides/{id}/publish"
  - priority: 15
    category: business_temporal
    check: "Scorecard period overlap on the Vendor resource. Interval semantics: CLOSED [period_start, period_end] on both ends PLUS a mandatory clearance of SCORECARD_PERIOD_GAP_DAYS (1) day, so touching endpoints and even 1-day-apart endpoints collide. Rejected when any Scorecard of the same vendor with status IN {OPEN, MEASURED, FINALIZED} satisfies candidate.period_start <= existing.period_end + 1 day AND existing.period_start <= candidate.period_end + 1 day."
    error_id: ERR_SCORECARD_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/scorecards"
  - priority: 16
    category: business_constraint
    check: "One dispute per chargeback: chargeback.dispute_status must be NONE (equivalently, no VendorDispute row references this chargeback)."
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /compliance/chargebacks/{id}/disputes"
  - priority: 17
    category: business_constraint
    check: "Dispute round bound: dispute.round_count < DISPUTE_MAX_ROUNDS (2)."
    error_id: ERR_DISPUTE_ROUND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance/disputes/{id}/request-info, POST /compliance/disputes/{id}/resubmit"
  - priority: 18
    category: business_constraint
    check: "CAP submission bound: cap.submission_round < CAP_MAX_SUBMISSIONS (2)."
    error_id: ERR_CAP_SUBMISSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance/corrective-action-plans/{id}/submit"
  - priority: 19
    category: business_constraint
    check: "Duplicate violation: no other ComplianceViolation with the same shipment_id and the same pinned requirement_code exists with status IN {DETECTED, EVIDENCE_COMPLETE, CHARGED}. VOIDED rows do not block a re-file."
    error_id: ERR_DUPLICATE_VIOLATION
    http_status: 409
    applies_to: "POST /compliance/shipments/{id}/violations"
  - priority: 20
    category: business_constraint
    check: "received_units <= shipment.shipped_units."
    error_id: ERR_RECEIPT_EXCEEDS_SHIPPED
    http_status: 422
    applies_to: "POST /compliance/shipments/{id}/receive"
  - priority: 21
    category: business_constraint
    check: "affected_units <= shipment.received_units AND affected_cartons <= shipment.carton_count."
    error_id: ERR_AFFECTED_UNITS_EXCEED_RECEIPT
    http_status: 422
    applies_to: "POST /compliance/shipments/{id}/violations"
  - priority: 22
    category: business_constraint
    check: "vendor_code is unique across all Vendors."
    error_id: ERR_VENDOR_CODE_TAKEN
    http_status: 409
    applies_to: "POST /compliance/vendors"
  - priority: 23
    category: business_constraint
    check: "requirement_code is unique within the owning guide_id."
    error_id: ERR_REQUIREMENT_CODE_TAKEN
    http_status: 409
    applies_to: "POST /compliance/routing-guides/{id}/requirements"
  - priority: 24
    category: business_constraint
    check: "A guide must own at least one RoutingRequirement before it can be published (requirement_count >= 1)."
    error_id: ERR_GUIDE_HAS_NO_REQUIREMENTS
    http_status: 422
    applies_to: "POST /compliance/routing-guides/{id}/publish"
  - priority: 25
    category: business_constraint
    check: "Measurement input set is non-empty: measured_po_count >= 1 for the scorecard's vendor and closed period window."
    error_id: ERR_SCORECARD_NO_MEASURABLE_ORDERS
    http_status: 422
    applies_to: "POST /compliance/scorecards/{id}/measure"
  - priority: 26
    category: business_constraint
    check: "committed_completion_at <= cap.due_at."
    error_id: ERR_CAP_COMMITMENT_PAST_DUE
    http_status: 422
    applies_to: "POST /compliance/corrective-action-plans/{id}/submit"
  - priority: 27
    category: business_constraint
    check: "buying_decision == SOURCING_HOLD requires cap.escalation_level >= 2; buying_decision == NONE is never accepted at escalation."
    error_id: ERR_CAP_ESCALATION_LEVEL_TOO_LOW
    http_status: 422
    applies_to: "POST /compliance/corrective-action-plans/{id}/escalate"
  - priority: 28
    category: business_referential
    check: "PurchaseOrder creation is blocked while vendor.status == SOURCING_HOLD."
    error_id: ERR_VENDOR_SOURCING_HOLD
    http_status: 409
    applies_to: "POST /compliance/purchase-orders"
  - priority: 29
    category: business_referential
    check: "Deduction posting is blocked when any allocated Chargeback has dispute_status == OPEN."
    error_id: ERR_CHARGEBACK_DISPUTE_OPEN
    http_status: 409
    applies_to: "POST /compliance/deductions/{id}/post"
  - priority: 30
    category: business_fiscal
    check: "claimed_reversal_cents <= chargeback.gross_assessed_cents - chargeback.reversal_cents."
    error_id: ERR_CLAIM_EXCEEDS_ASSESSMENT
    http_status: 422
    applies_to: "POST /compliance/chargebacks/{id}/disputes, POST /compliance/disputes/{id}/resubmit"
  - priority: 31
    category: business_fiscal
    check: "A deduction allocation may not exceed the chargeback's outstanding_cents: allocated_cents <= chargeback.outstanding_cents (equality allowed)."
    error_id: ERR_ALLOCATION_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /compliance/deductions/{id}/allocations"
  - priority: 32
    category: business_fiscal
    check: "A cash application may not exceed the chargeback's outstanding_cents: amount_cents <= chargeback.outstanding_cents. Exact equality is accepted and drives settlement_status to RECOVERED; amount_cents == outstanding_cents + 1 is rejected."
    error_id: ERR_OVER_APPLICATION
    http_status: 422
    applies_to: "POST /compliance/chargebacks/{id}/cash-applications"
  - priority: 33
    category: business_fiscal
    check: "Deduction posting may not net more than the vendor currently owes: deduction.amount_cents <= vendor.open_chargeback_cents (equality allowed)."
    error_id: ERR_DEDUCTION_EXCEEDS_EXPOSURE
    http_status: 422
    applies_to: "POST /compliance/deductions/{id}/post"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not listed in the target endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, invalid enum member, or out-of-range numeric value."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "Vendor id in path or body does not resolve."
  - id: ERR_ROUTING_GUIDE_NOT_FOUND
    http: 404
    condition: "RoutingGuide id in path, or supersedes_guide_id in body, does not resolve."
  - id: ERR_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "requirement_id in body does not resolve to a RoutingRequirement."
  - id: ERR_PURCHASE_ORDER_NOT_FOUND
    http: 404
    condition: "PurchaseOrder id in path does not resolve."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "Shipment id in path does not resolve."
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "ComplianceViolation id in path does not resolve."
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "Chargeback id in path or body does not resolve."
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "VendorDispute id in path does not resolve."
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "Scorecard id in path does not resolve."
  - id: ERR_CAP_NOT_FOUND
    http: 404
    condition: "CorrectiveActionPlan id in path does not resolve."
  - id: ERR_DEDUCTION_NOT_FOUND
    http: 404
    condition: "Deduction id in path does not resolve."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "RecoveryAllocation id in path does not resolve."
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "Acting Vendor's X-User-ID differs from the vendor_id that owns the targeted resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The adjudicating ComplianceOfficer's X-User-ID equals the ComplianceViolation.detected_by_user_id behind the disputed Chargeback."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_vendor_version or expected_chargeback_version does not match the parent's current version."
  - id: ERR_GUIDE_NOT_DRAFT
    http: 409
    condition: "Publish or requirement creation attempted on a RoutingGuide whose status is not DRAFT."
  - id: ERR_GUIDE_HAS_NO_REQUIREMENTS
    http: 422
    condition: "Publish attempted on a RoutingGuide whose requirement_count == 0."
  - id: ERR_GUIDE_EFFECTIVE_OVERLAP
    http: 409
    condition: "A colliding PUBLISHED guide (same scope_code, or either side scope_code == ALL) has effective_from >= the candidate's effective_from."
  - id: ERR_GUIDE_NOT_EFFECTIVE
    http: 422
    condition: "The pinned requirement's guide is DRAFT, or its half-open effectivity window does not contain shipment.arrived_at."
  - id: ERR_GUIDE_EFFECTIVE_FROM_IN_PAST
    http: 422
    condition: "Publish attempted on a guide whose effective_from is not strictly after the current logical clock."
  - id: ERR_REQUIREMENT_CODE_TAKEN
    http: 409
    condition: "requirement_code already exists within the same guide_id."
  - id: ERR_VENDOR_CODE_TAKEN
    http: 409
    condition: "vendor_code already exists on another Vendor."
  - id: ERR_VENDOR_SOURCING_HOLD
    http: 409
    condition: "PurchaseOrder creation attempted while vendor.status == SOURCING_HOLD."
  - id: ERR_SHIPMENT_ALREADY_RECEIVED
    http: 409
    condition: "Receive attempted on a Shipment whose status is already RECEIVED."
  - id: ERR_SHIPMENT_NOT_RECEIVED
    http: 409
    condition: "Violation filing attempted on a Shipment whose status is IN_TRANSIT."
  - id: ERR_RECEIPT_EXCEEDS_SHIPPED
    http: 422
    condition: "received_units > shipment.shipped_units."
  - id: ERR_AFFECTED_UNITS_EXCEED_RECEIPT
    http: 422
    condition: "affected_units > shipment.received_units or affected_cartons > shipment.carton_count."
  - id: ERR_VIOLATION_FILING_WINDOW_CLOSED
    http: 422
    condition: "Logical clock now >= shipment.arrived_at + 72 hours at violation filing."
  - id: ERR_DUPLICATE_VIOLATION
    http: 409
    condition: "Another non-VOIDED ComplianceViolation on the same shipment already cites the same requirement_code."
  - id: ERR_VIOLATION_NOT_OPEN
    http: 409
    condition: "Evidence capture, assessment or void attempted on a ComplianceViolation whose status IN {VOIDED, CHARGED}. Assessment of a still-DETECTED violation is NOT this error - it is caught one rung lower by validation priority 10 as ERR_EVIDENCE_INSUFFICIENT."
  - id: ERR_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "violation.evidence_count < pinned requirement.min_evidence_count at assessment."
  - id: ERR_CHARGEBACK_WRITTEN_OFF
    http: 409
    condition: "Dispute creation or cash application attempted on a Chargeback whose settlement_status == WRITTEN_OFF."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "Logical clock now >= chargeback.assessed_at + 30 days at dispute creation."
  - id: ERR_DISPUTE_ALREADY_EXISTS
    http: 409
    condition: "chargeback.dispute_status != NONE at dispute creation."
  - id: ERR_DISPUTE_NOT_AWAITING_DECISION
    http: 409
    condition: "Decide or request-info attempted on a VendorDispute whose status IN {APPROVED_FULL, APPROVED_PARTIAL, DENIED}, or request-info attempted while status == INFO_REQUESTED."
  - id: ERR_DISPUTE_NOT_INFO_REQUESTED
    http: 409
    condition: "Resubmit attempted on a VendorDispute whose status is not INFO_REQUESTED."
  - id: ERR_DISPUTE_ROUND_LIMIT_EXCEEDED
    http: 422
    condition: "dispute.round_count >= 2 at request-info or resubmit."
  - id: ERR_CLAIM_EXCEEDS_ASSESSMENT
    http: 422
    condition: "claimed_reversal_cents > chargeback.gross_assessed_cents - chargeback.reversal_cents."
  - id: ERR_SCORECARD_PERIOD_OVERLAP
    http: 409
    condition: "The candidate period collides with an existing Scorecard period of the same vendor under closed-interval plus 1-day-clearance semantics."
  - id: ERR_SCORECARD_NO_MEASURABLE_ORDERS
    http: 422
    condition: "measured_po_count == 0 for the scorecard's vendor and period."
  - id: ERR_SCORECARD_NOT_MEASURED
    http: 409
    condition: "Finalize attempted on a Scorecard whose status == OPEN."
  - id: ERR_SCORECARD_ALREADY_FINALIZED
    http: 409
    condition: "Measure or finalize attempted on a Scorecard whose status == FINALIZED."
  - id: ERR_CAP_NOT_AWAITING_SUBMISSION
    http: 409
    condition: "Submit attempted on a CorrectiveActionPlan whose status is not in {ISSUED, REJECTED}."
  - id: ERR_CAP_SUBMISSION_LIMIT_EXCEEDED
    http: 422
    condition: "cap.submission_round >= 2 at submit."
  - id: ERR_CAP_COMMITMENT_PAST_DUE
    http: 422
    condition: "committed_completion_at > cap.due_at."
  - id: ERR_CAP_NOT_DECIDABLE
    http: 409
    condition: "Decide attempted on a CorrectiveActionPlan whose status is not VENDOR_SUBMITTED."
  - id: ERR_CAP_NOT_ESCALATABLE
    http: 409
    condition: "Escalate attempted on a CorrectiveActionPlan whose status is not REJECTED."
  - id: ERR_CAP_ESCALATION_LEVEL_TOO_LOW
    http: 422
    condition: "buying_decision == SOURCING_HOLD while cap.escalation_level < 2, or buying_decision == NONE supplied at escalation."
  - id: ERR_CAP_NOT_CLOSABLE
    http: 409
    condition: "Close attempted on a CorrectiveActionPlan whose status is not in {ACCEPTED, ESCALATED}."
  - id: ERR_DEDUCTION_NOT_DRAFT
    http: 409
    condition: "Allocation creation attempted on a Deduction whose status is not DRAFT."
  - id: ERR_DEDUCTION_ALREADY_POSTED
    http: 409
    condition: "Post attempted on a Deduction whose status IN {POSTED, REVERSED}."
  - id: ERR_DEDUCTION_NOT_POSTED
    http: 409
    condition: "Reverse attempted on a Deduction whose status is not POSTED."
  - id: ERR_DEDUCTION_NO_ALLOCATIONS
    http: 422
    condition: "Post attempted on a Deduction whose allocation_count == 0."
  - id: ERR_ALLOCATION_EXCEEDS_OUTSTANDING
    http: 422
    condition: "allocated_cents > chargeback.outstanding_cents at deduction allocation."
  - id: ERR_OVER_APPLICATION
    http: 422
    condition: "amount_cents > chargeback.outstanding_cents at cash application."
  - id: ERR_DEDUCTION_EXCEEDS_EXPOSURE
    http: 422
    condition: "deduction.amount_cents > vendor.open_chargeback_cents at posting."
  - id: ERR_CHARGEBACK_DISPUTE_OPEN
    http: 409
    condition: "Deduction posting attempted while an allocated Chargeback has dispute_status == OPEN."

roles:
  - name: ComplianceOfficer
    description: "Retailer supplier-compliance office operator. Publishes routing guides, assesses and voids violations, adjudicates vendor disputes, runs scorecard measurement and finalization, and decides and closes corrective action plans."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/vendors"
      - "POST /compliance/routing-guides"
      - "POST /compliance/routing-guides/{id}/requirements"
      - "POST /compliance/routing-guides/{id}/publish"
      - "POST /compliance/violations/{id}/assess"
      - "POST /compliance/violations/{id}/void"
      - "POST /compliance/disputes/{id}/request-info"
      - "POST /compliance/disputes/{id}/decide"
      - "POST /compliance/scorecards"
      - "POST /compliance/scorecards/{id}/measure"
      - "POST /compliance/scorecards/{id}/finalize"
      - "POST /compliance/corrective-action-plans/{id}/decide"
      - "POST /compliance/corrective-action-plans/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints under /compliance"
  - name: DCInspector
    description: "Distribution-center inspector who receives shipments, files compliance violations and captures evidence at the door."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/shipments/{id}/receive"
      - "POST /compliance/shipments/{id}/violations"
      - "POST /compliance/violations/{id}/evidence"
    shared_operations:
      - "all GET endpoints under /compliance"
  - name: Vendor
    description: "Supplier acting on its own records: ships against purchase orders, submits and resubmits chargeback disputes with supporting evidence, and submits corrective action plans."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /compliance/purchase-orders/{id}/shipments"
      - "POST /compliance/chargebacks/{id}/disputes"
      - "POST /compliance/disputes/{id}/evidence"
      - "POST /compliance/disputes/{id}/resubmit"
      - "POST /compliance/corrective-action-plans/{id}/submit"
    shared_operations:
      - "all GET endpoints under /compliance"
  - name: APAccountant
    description: "Accounts-payable accountant who drafts and posts deductions against vendor payables, reverses posted deductions, and applies vendor remittance cash to chargebacks."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/deductions"
      - "POST /compliance/deductions/{id}/allocations"
      - "POST /compliance/deductions/{id}/post"
      - "POST /compliance/deductions/{id}/reverse"
      - "POST /compliance/chargebacks/{id}/cash-applications"
    shared_operations:
      - "all GET endpoints under /compliance"
  - name: CategoryBuyer
    description: "Merchandising category buyer who raises purchase orders and owns the buying-decision escalation on repeat-offender corrective action plans. Never adjudicates disputes (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/purchase-orders"
      - "POST /compliance/corrective-action-plans/{id}/escalate"
    shared_operations:
      - "all GET endpoints under /compliance"
endpoints:
  # ---- single-resource reads (establish collection segments) ----
  - method: GET
    path: "/compliance/vendors/{id}"
    input: []
    output: Vendor
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one Vendor including the reconciled exposure fields open_chargeback_cents, recovered_lifetime_cents, refund_due_cents, otif_score, repeat_offender_flag and exposure_alert_flag."
  - method: GET
    path: "/compliance/routing-guides/{id}"
    input: []
    output: RoutingGuide
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one RoutingGuide including status, half-open effectivity window and requirement_count."
  - method: GET
    path: "/compliance/purchase-orders/{id}"
    input: []
    output: PurchaseOrder
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one PurchaseOrder including its compound receipt status and received_units roll-up."
  - method: GET
    path: "/compliance/shipments/{id}"
    input: []
    output: Shipment
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one Shipment including arrived_at, open_violation_count and the monotonic evidence_capture_count."
  - method: GET
    path: "/compliance/violations/{id}"
    input: []
    output: ComplianceViolation
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one ComplianceViolation including status, evidence_count and detected_by_user_id."
  - method: GET
    path: "/compliance/chargebacks/{id}"
    input: []
    output: Chargeback
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one Chargeback including both independent state dimensions (dispute_status, settlement_status), the money columns and deduction_posted."
  - method: GET
    path: "/compliance/disputes/{id}"
    input: []
    output: VendorDispute
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one VendorDispute including round_count, reason_ceiling_pct, approved_reversal_cents and goodwill_cents."
  - method: GET
    path: "/compliance/scorecards/{id}"
    input: []
    output: Scorecard
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one Scorecard including tolerance windows, on_time_pct, fill_rate_pct, otif_pct, composite_score and cap_required."
  - method: GET
    path: "/compliance/corrective-action-plans/{id}"
    input: []
    output: CorrectiveActionPlan
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one CorrectiveActionPlan including escalation_level, repeat_count, submission_round, due_at and buying_decision."
  - method: GET
    path: "/compliance/deductions/{id}"
    input: []
    output: Deduction
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one Deduction including amount_cents, allocation_count and over_allocated_cents."
  - method: GET
    path: "/compliance/recovery-allocations/{id}"
    input: []
    output: RecoveryAllocation
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "Read one RecoveryAllocation including source_type, allocated_cents and effective_status."
  # ---- sub-resource and filtered list reads ----
  - method: GET
    path: "/compliance/vendors"
    input: ["status?", "repeat_offender_flag?", "exposure_alert_flag?", "limit?", "offset?"]
    output: "Vendor[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List Vendors, newest first by created_at, with optional status and governance-flag filters and offset pagination."
  - method: GET
    path: "/compliance/routing-guides"
    input: ["status?", "scope_code?", "supersedes_guide_id?", "limit?", "offset?"]
    output: "RoutingGuide[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List RoutingGuides ordered by effective_from then created_at, filterable by status, scope_code and supersedes_guide_id."
  - method: GET
    path: "/compliance/routing-guides/{id}/requirements"
    input: ["domain?", "severity_tier?", "limit?", "offset?"]
    output: "RoutingRequirement[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List the RoutingRequirements owned by one RoutingGuide, ordered by requirement_code, with the per-violation-type chargeback fee schedule columns."
  - method: GET
    path: "/compliance/purchase-orders"
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List PurchaseOrders ordered by created_at descending, filterable by vendor_id and compound receipt status."
  - method: GET
    path: "/compliance/purchase-orders/{id}/shipments"
    input: ["status?", "limit?", "offset?"]
    output: "Shipment[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List the Shipments raised against one PurchaseOrder, ordered by created_at ascending."
  - method: GET
    path: "/compliance/violations"
    input: ["shipment_id?", "requirement_id?", "status?", "limit?", "offset?"]
    output: "ComplianceViolation[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List ComplianceViolations ordered by detected_at then created_at, filterable by shipment_id, requirement_id and status."
  - method: GET
    path: "/compliance/violations/{id}/evidence"
    input: ["kind?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List the EvidenceItems captured against one ComplianceViolation (subject_type == VIOLATION), ordered by captured_at ascending."
  - method: GET
    path: "/compliance/disputes/{id}/evidence"
    input: ["kind?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List the EvidenceItems attached to one VendorDispute (subject_type == DISPUTE), ordered by captured_at ascending."
  - method: GET
    path: "/compliance/chargebacks"
    input: ["vendor_id?", "violation_id?", "requirement_id?", "dispute_status?", "settlement_status?", "limit?", "offset?"]
    output: "Chargeback[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List Chargebacks ordered by assessed_at then created_at, filterable independently on either state dimension plus vendor_id, violation_id and requirement_id."
  - method: GET
    path: "/compliance/disputes"
    input: ["vendor_id?", "chargeback_id?", "status?", "limit?", "offset?"]
    output: "VendorDispute[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List VendorDisputes ordered by submitted_at then created_at, filterable by vendor_id, chargeback_id and status."
  - method: GET
    path: "/compliance/scorecards"
    input: ["vendor_id?", "period_code?", "status?", "limit?", "offset?"]
    output: "Scorecard[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List Scorecards ordered by period_start ascending then created_at, filterable by vendor_id, period_code and status."
  - method: GET
    path: "/compliance/corrective-action-plans"
    input: ["vendor_id?", "trigger_scorecard_id?", "predecessor_cap_id?", "status?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List CorrectiveActionPlans ordered by issued_at then created_at, filterable by vendor_id, trigger_scorecard_id, predecessor_cap_id and status."
  - method: GET
    path: "/compliance/deductions"
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: "Deduction[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List Deductions ordered by created_at descending, filterable by vendor_id and status."
  - method: GET
    path: "/compliance/recovery-allocations"
    input: ["chargeback_id?", "deduction_id?", "source_type?", "effective_status?", "limit?", "offset?"]
    output: "RecoveryAllocation[]"
    roles: [ComplianceOfficer, DCInspector, Vendor, APAccountant, CategoryBuyer]
    side_effects: []
    description: "List RecoveryAllocations ordered by applied_at then created_at, filterable by chargeback_id, deduction_id, source_type and effective_status. This is the junction read that reconciles the many-to-many Chargeback x Deduction recovery graph."
  # ---- routing guide publication ----
  - method: POST
    path: "/compliance/vendors"
    input: ["vendor_code", "legal_name", "payment_terms_days"]
    output: Vendor
    roles: [ComplianceOfficer]
    side_effects:
      - "Creates a Vendor with status ACTIVE, otif_score null, and all exposure counters (open_chargeback_cents, recovered_lifetime_cents, refund_due_cents, open_violation_count, open_cap_count) zeroed and both governance flags false."
    description: "Register a supplier in the compliance program. vendor_code is unique program-wide (ERR_VENDOR_CODE_TAKEN)."
  - method: POST
    path: "/compliance/routing-guides"
    input: ["guide_code", "title", "scope_code", "effective_from", "supersedes_guide_id?"]
    output: RoutingGuide
    roles: [ComplianceOfficer]
    side_effects:
      - "Creates a RoutingGuide in status DRAFT with requirement_count 0 and effective_until null."
    description: "Draft a routing guide version for a scope (scope_code ALL collides with every scope for effectivity purposes). Supplying supersedes_guide_id declares the self-referential predecessor that will be retired at publication."
  - method: POST
    path: "/compliance/routing-guides/{id}/requirements"
    input: ["requirement_code", "domain", "severity_tier", "min_evidence_count", "fixed_fee_cents", "per_unit_recovery_cents", "handling_pct", "min_fee_cents", "cap_cents"]
    output: RoutingRequirement
    roles: [ComplianceOfficer]
    side_effects:
      - "Creates a RoutingRequirement under the guide with effective_until null."
      - "Increments RoutingGuide.requirement_count by 1."
    description: "Add one shipment / labeling / packaging / documentation requirement plus its chargeback schedule row (fixed fee, per-unit cost recovery, handling percentage, floor and cap) to a DRAFT guide. Requires guide.status == DRAFT (ERR_GUIDE_NOT_DRAFT)."
  - method: POST
    path: "/compliance/routing-guides/{id}/publish"
    input: []
    output: RoutingGuide
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets RoutingGuide.status to PUBLISHED, published_at to the current logical clock and published_by_user_id to the acting X-User-ID."
      - "CASCADE LINK 2 (caused by link 1): when supersedes_guide_id is set, the predecessor RoutingGuide moves to SUPERSEDED and its effective_until is set to this guide's effective_from."
      - "CASCADE LINK 3 (caused by link 2): every RoutingRequirement owned by the superseded predecessor has its effective_until set to the predecessor's new effective_until, retiring the old fee schedule without deleting it."
    description: "Publish a DRAFT guide. Enforces the half-open effectivity timeline on the scope resource (adjacency allowed) and requires at least one requirement."
  # ---- purchase orders, shipments, detection and evidence ----
  - method: POST
    path: "/compliance/purchase-orders"
    input: ["vendor_id", "po_number", "ordered_units", "unit_cost_cents", "ship_window_start", "ship_window_end", "must_arrive_by"]
    output: PurchaseOrder
    roles: [CategoryBuyer]
    side_effects:
      - "Creates a PurchaseOrder with status OPEN, received_units 0 and first_receipt_at null."
    description: "Raise a purchase order with its ship window and must-arrive-by date, the reference points for on-time measurement. Blocked while the vendor is on SOURCING_HOLD."
  - method: POST
    path: "/compliance/purchase-orders/{id}/shipments"
    input: ["asn_number", "shipped_units", "carton_count"]
    output: Shipment
    roles: [Vendor]
    side_effects:
      - "Creates a Shipment with status IN_TRANSIT, received_units null, arrived_at null, invoice_value_cents 0, open_violation_count 0 and evidence_capture_count 0 (invoice_value_cents is only computed at receipt, from received_units)."
    description: "Vendor advises a shipment against its own purchase order. Requires X-User-ID == purchase_order.vendor_id."
  - method: POST
    path: "/compliance/shipments/{id}/receive"
    input: ["received_units"]
    output: Shipment
    roles: [DCInspector]
    side_effects:
      - "Sets Shipment.status to RECEIVED, received_units to the posted quantity, invoice_value_cents to received_units * purchase_order.unit_cost_cents, and arrived_at to the current logical clock, opening the 72-hour violation filing window."
      - "CASCADE LINK 2 (caused by link 1): adds received_units to PurchaseOrder.received_units and stamps PurchaseOrder.first_receipt_at on the first receipt only."
      - "CASCADE LINK 3 (caused by link 2): re-derives the compound PurchaseOrder.status - RECEIVED when received_units >= ordered_units, otherwise PARTIALLY_RECEIVED."
    description: "Distribution centre receives a shipment at the door. received_units may not exceed shipped_units."
  - method: POST
    path: "/compliance/shipments/{id}/violations"
    input: ["requirement_id", "affected_units", "affected_cartons", "narrative"]
    output: ComplianceViolation
    roles: [DCInspector]
    side_effects:
      - "Creates a ComplianceViolation pinned to the supplied RoutingRequirement, with detected_at set to the current logical clock and detected_by_user_id set to the acting X-User-ID."
      - "Sets the initial status to EVIDENCE_COMPLETE when the pinned requirement.min_evidence_count == 0, otherwise DETECTED."
      - "Increments Shipment.open_violation_count and Vendor.open_violation_count by 1."
    description: "Detect a routing-guide violation at the distribution centre. Requires shipment.status == RECEIVED, an effective guide, the filing window still open, no duplicate live violation for the same requirement_code, and affected quantities within what was received."
  - method: POST
    path: "/compliance/violations/{id}/evidence"
    input: ["kind", "reference_uri", "note?"]
    output: EvidenceItem
    roles: [DCInspector]
    side_effects:
      - "Creates an immutable EvidenceItem with subject_type VIOLATION, dispute_id null, captured_at set to the current logical clock and captured_by_user_id set to the acting X-User-ID."
      - "Increments ComplianceViolation.evidence_count by 1 and Shipment.evidence_capture_count by 1 (the shipment counter is monotonic and is never decremented, even when the violation is voided)."
      - "Promotes ComplianceViolation.status from DETECTED to EVIDENCE_COMPLETE once evidence_count >= the pinned requirement.min_evidence_count."
    description: "Capture photo, weight-ticket, packing-slip or label-scan evidence against an open violation."
  - method: POST
    path: "/compliance/violations/{id}/assess"
    input: ["assessment_note?"]
    output: Chargeback
    roles: [ComplianceOfficer]
    side_effects:
      - "CASCADE LINK 1: moves ComplianceViolation.status to CHARGED and freezes evidence_at_assessment_count."
      - "CASCADE LINK 2 (caused by link 1): mints a Chargeback from the chargeback_assessment calculation, selecting the GRACE_FIRST_OCCURRENCE variant when the vendor has no prior CHARGED violation citing the same requirement_code within GRACE_LOOKBACK_DAYS, otherwise STANDARD; sets dispute_status NONE, settlement_status ASSESSED, deduction_posted false, recovered_cents 0, reversal_cents 0 and outstanding_cents == gross_assessed_cents."
      - "CASCADE LINK 3 (caused by link 2): adds the new chargeback's outstanding_cents to Vendor.open_chargeback_cents and decrements Vendor.open_violation_count and Shipment.open_violation_count by 1."
      - "CASCADE LINK 4 (caused by link 3): re-derives Vendor.exposure_alert_flag as open_chargeback_cents >= VENDOR_EXPOSURE_ALERT_CENTS."
    description: "Compliance officer assesses a chargeback against an evidenced violation. Requires violation.status == EVIDENCE_COMPLETE: a DETECTED violation is refused with ERR_EVIDENCE_INSUFFICIENT (422) while a VOIDED or CHARGED one is refused with ERR_VIOLATION_NOT_OPEN (409)."
  - method: POST
    path: "/compliance/violations/{id}/void"
    input: ["void_reason"]
    output: ComplianceViolation
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets ComplianceViolation.status to VOIDED and records void_reason."
      - "Decrements Shipment.open_violation_count and Vendor.open_violation_count by 1, restoring both counters to their pre-detection values, while Shipment.evidence_capture_count is deliberately left untouched."
    description: "Withdraw a detection before assessment (compensating action for the cardinality invariant). Requires violation.status IN {DETECTED, EVIDENCE_COMPLETE}."
  # ---- vendor disputes ----
  - method: POST
    path: "/compliance/chargebacks/{id}/disputes"
    input: ["reason_code", "claimed_reversal_cents", "narrative"]
    output: VendorDispute
    roles: [Vendor]
    side_effects:
      - "Creates a VendorDispute in status SUBMITTED with round_count 1, submitted_at set to the current logical clock, and reason_ceiling_pct resolved from reason_code."
      - "Sets Chargeback.dispute_status to OPEN, freezing the chargeback against deduction posting."
    description: "Vendor disputes its own chargeback within 30 days of assessment. Exactly one dispute per chargeback."
  - method: POST
    path: "/compliance/disputes/{id}/evidence"
    input: ["kind", "reference_uri", "note?"]
    output: EvidenceItem
    roles: [Vendor]
    side_effects:
      - "Creates an immutable EvidenceItem with subject_type DISPUTE, violation_id null, captured_at set to the current logical clock and captured_by_user_id set to the acting X-User-ID."
    description: "Vendor attaches supporting evidence to its own live dispute. Requires dispute.status IN {SUBMITTED, INFO_REQUESTED}."
  - method: POST
    path: "/compliance/disputes/{id}/request-info"
    input: ["information_request_note"]
    output: VendorDispute
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets VendorDispute.status to INFO_REQUESTED and records information_request_note."
    description: "Reviewer bounces a dispute back for more evidence. Requires status == SUBMITTED and round_count < DISPUTE_MAX_ROUNDS."
  - method: POST
    path: "/compliance/disputes/{id}/resubmit"
    input: ["claimed_reversal_cents", "narrative"]
    output: VendorDispute
    roles: [Vendor]
    side_effects:
      - "Returns VendorDispute.status to SUBMITTED, overwrites claimed_reversal_cents and narrative, increments round_count by 1 and clears information_request_note."
    description: "Vendor answers an information request, closing the review cycle. Requires status == INFO_REQUESTED and round_count < DISPUTE_MAX_ROUNDS."
  - method: POST
    path: "/compliance/disputes/{id}/decide"
    input: ["decision", "review_note"]
    output: VendorDispute
    roles: [ComplianceOfficer]
    side_effects:
      - "CASCADE LINK 1: runs dispute_reversal_determination and moves VendorDispute to APPROVED_FULL, APPROVED_PARTIAL or DENIED, setting approved_reversal_cents, goodwill_cents, decided_at and decided_by_user_id."
      - "CASCADE LINK 2 (caused by link 1): adds approved_reversal_cents to Chargeback.reversal_cents, sets Chargeback.dispute_status to UPHELD, REVERSED or PARTIALLY_REVERSED, re-derives outstanding_cents and re-runs chargeback_settlement_reconciliation on settlement_status."
      - "CASCADE LINK 3 (caused by link 2): for every EFFECTIVE RecoveryAllocation whose allocated_cents now exceeds the chargeback's post-reversal balance, re-derives Deduction.over_allocated_cents."
      - "CASCADE LINK 4 (caused by link 3): re-runs vendor_exposure_reconciliation, updating Vendor.open_chargeback_cents, Vendor.refund_due_cents and Vendor.exposure_alert_flag."
    description: "Adjudicate a dispute against the reversal criteria. Segregation of duties: the adjudicator may not be the inspector who detected the underlying violation."
  # ---- OTIF scorecards and corrective action plans ----
  - method: POST
    path: "/compliance/scorecards"
    input: ["vendor_id", "period_code", "period_start", "period_end", "tolerance_early_days?", "tolerance_late_days?", "fill_tolerance_pct?"]
    output: Scorecard
    roles: [ComplianceOfficer]
    side_effects:
      - "Creates a Scorecard in status OPEN with all measurement outputs null, cap_required false, and the tolerance window defaults applied when omitted."
    description: "Open an OTIF measurement period for a vendor. Periods are closed intervals and must clear each other by SCORECARD_PERIOD_GAP_DAYS."
  - method: POST
    path: "/compliance/scorecards/{id}/measure"
    input: ["measurement_variant"]
    output: Scorecard
    roles: [ComplianceOfficer]
    side_effects:
      - "Runs otif_scorecard_measurement under the requested variant and writes measured_po_count, on_time_count, in_full_count, otif_count, on_time_pct, fill_rate_pct, otif_pct and composite_score, stamping measured_at and measurement_variant."
      - "Sets Scorecard.status to MEASURED (re-measurement from MEASURED is a permitted self-loop that fully overwrites the previous figures)."
      - "Re-derives cap_required from repeat_offender_escalation without yet creating any plan."
    description: "Measure on-time in-full performance across the period using the tolerance windows and the fill-rate calculation. Rejected when the period contains no measurable orders."
  - method: POST
    path: "/compliance/scorecards/{id}/finalize"
    input: []
    output: Scorecard
    roles: [ComplianceOfficer]
    side_effects:
      - "CASCADE LINK 1: sets Scorecard.status to FINALIZED and stamps finalized_at, locking the figures."
      - "CASCADE LINK 2 (caused by link 1): copies composite_score into Vendor.otif_score and re-derives Vendor.repeat_offender_flag from the violation count in the trailing REPEAT_LOOKBACK_DAYS window."
      - "CASCADE LINK 3 (caused by link 2): when cap_required is true, issues a CorrectiveActionPlan in status ISSUED with escalation_level and due_at derived from repeat_offender_escalation and predecessor_cap_id pointing at the vendor's most recent unclosed plan, then increments Vendor.open_cap_count."
      - "CASCADE LINK 4 (caused by link 3): when the newly issued plan's escalation_level >= 2, moves Vendor.status from ACTIVE to PROBATION."
    description: "Finalize a measured scorecard, publishing the score into the vendor relationship record and triggering the repeat-offender corrective action pipeline."
  - method: POST
    path: "/compliance/corrective-action-plans/{id}/submit"
    input: ["milestone_text", "committed_completion_at"]
    output: CorrectiveActionPlan
    roles: [Vendor]
    side_effects:
      - "Sets CorrectiveActionPlan.status to VENDOR_SUBMITTED, records milestone_text and committed_completion_at and increments submission_round by 1."
    description: "Vendor submits or re-submits its remediation plan. Requires status IN {ISSUED, REJECTED}, submission_round < CAP_MAX_SUBMISSIONS, and a commitment no later than due_at."
  - method: POST
    path: "/compliance/corrective-action-plans/{id}/decide"
    input: ["decision", "review_note"]
    output: CorrectiveActionPlan
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets CorrectiveActionPlan.status to ACCEPTED or REJECTED, records review_note and stamps decided_at."
    description: "Accept or reject a submitted plan. Rejection returns the plan to the vendor for one further attempt, closing the review cycle."
  - method: POST
    path: "/compliance/corrective-action-plans/{id}/escalate"
    input: ["buying_decision", "escalation_note"]
    output: CorrectiveActionPlan
    roles: [CategoryBuyer]
    side_effects:
      - "Sets CorrectiveActionPlan.status to ESCALATED, records buying_decision and escalation_note and stamps escalated_at."
      - "Sets Vendor.status to SOURCING_HOLD when buying_decision == SOURCING_HOLD, blocking further purchase orders; buying_decision == RANGE_REVIEW leaves Vendor.status untouched."
    description: "Escalate a rejected plan into a buying decision (buying_decision IN {RANGE_REVIEW, SOURCING_HOLD}). SOURCING_HOLD requires escalation_level >= 2."
  - method: POST
    path: "/compliance/corrective-action-plans/{id}/close"
    input: ["outcome", "closure_note"]
    output: CorrectiveActionPlan
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets CorrectiveActionPlan.status to CLOSED_SUCCESS when outcome == SUCCESS and to CLOSED_UNREMEDIATED when outcome == FAILED, records closure_note and stamps closed_at."
      - "Decrements Vendor.open_cap_count by 1; when the vendor has no remaining open plans and the outcome is SUCCESS, returns Vendor.status to ACTIVE (and lifts a SOURCING_HOLD back to PROBATION first)."
    description: "Close out a corrective action plan (outcome IN {SUCCESS, FAILED}) and, on successful remediation, restore the vendor relationship status. Requires cap.status IN {ACCEPTED, ESCALATED}."
  # ---- deductions against payables and cash application ----
  - method: POST
    path: "/compliance/deductions"
    input: ["vendor_id", "invoice_reference", "expected_vendor_version"]
    output: Deduction
    roles: [APAccountant]
    side_effects:
      - "Creates a Deduction in status DRAFT with amount_cents 0, allocation_count 0 and over_allocated_cents 0."
      - "Increments Vendor.version by 1."
    description: "Open a draft deduction against a vendor payable invoice. expected_vendor_version must match Vendor.version or the request is rejected with ERR_STALE_VERSION (412)."
  - method: POST
    path: "/compliance/deductions/{id}/allocations"
    input: ["chargeback_id", "allocated_cents"]
    output: RecoveryAllocation
    roles: [APAccountant]
    side_effects:
      - "Creates a RecoveryAllocation with source_type DEDUCTION, effective_status PENDING, remittance_reference null and applied_at null."
      - "Adds allocated_cents to Deduction.amount_cents and increments Deduction.allocation_count by 1."
    description: "Earmark part of a draft deduction against one chargeback. Requires deduction.status == DRAFT, the chargeback to belong to the same vendor, and allocated_cents <= chargeback.outstanding_cents."
  - method: POST
    path: "/compliance/deductions/{id}/post"
    input: []
    output: Deduction
    roles: [APAccountant]
    side_effects:
      - "CASCADE LINK 1: sets Deduction.status to POSTED, stamps posted_at and posted_by_user_id."
      - "CASCADE LINK 2 (caused by link 1): flips every child RecoveryAllocation from PENDING to EFFECTIVE and stamps applied_at."
      - "CASCADE LINK 3 (caused by link 2): for each allocated Chargeback, adds the allocation to recovered_cents, sets deduction_posted true, re-derives outstanding_cents and re-runs chargeback_settlement_reconciliation on settlement_status."
      - "CASCADE LINK 4 (caused by link 3): re-runs vendor_exposure_reconciliation, reducing Vendor.open_chargeback_cents and raising Vendor.recovered_lifetime_cents, then re-deriving Vendor.exposure_alert_flag."
    description: "Post the deduction against payables. Requires at least one allocation, no allocated chargeback under an open dispute, and a total within the vendor's current open exposure."
  - method: POST
    path: "/compliance/deductions/{id}/reverse"
    input: ["reversal_reason"]
    output: Deduction
    roles: [APAccountant]
    side_effects:
      - "Sets Deduction.status to REVERSED, records reversal_reason and stamps reversed_at."
      - "Flips every child RecoveryAllocation from EFFECTIVE to REVERSED and resets Deduction.over_allocated_cents to 0."
      - "Subtracts each reversed allocation from the affected Chargeback.recovered_cents, sets deduction_posted false when no EFFECTIVE deduction-sourced allocation remains, re-derives outstanding_cents and re-runs chargeback_settlement_reconciliation."
      - "Re-runs vendor_exposure_reconciliation so that Vendor.open_chargeback_cents and Vendor.recovered_lifetime_cents return exactly to their pre-posting values (compensating invariant, no drift)."
    description: "Reverse a posted deduction, unwinding every side effect of posting. Requires deduction.status == POSTED."
  - method: POST
    path: "/compliance/chargebacks/{id}/cash-applications"
    input: ["remittance_reference", "amount_cents", "expected_chargeback_version"]
    output: RecoveryAllocation
    roles: [APAccountant]
    side_effects:
      - "Creates a RecoveryAllocation with source_type CASH, deduction_id null, effective_status EFFECTIVE and applied_at set to the current logical clock."
      - "Adds amount_cents to Chargeback.recovered_cents, re-derives outstanding_cents and re-runs chargeback_settlement_reconciliation on settlement_status."
      - "Re-runs vendor_exposure_reconciliation on the owning Vendor."
      - "Increments Chargeback.version by 1."
    description: "Apply vendor remittance cash directly to a chargeback instead of netting it off payables. expected_chargeback_version must match Chargeback.version or the request is rejected with ERR_STALE_VERSION (412). amount_cents may equal but never exceed outstanding_cents."
  # ---- test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    roles: [ComplianceOfficer]
    side_effects:
      - "Sets the service-wide logical clock used by every created_at, updated_at, detected_at, arrived_at, assessed_at, submitted_at, posted_at and window comparison."
    description: "Test-driving endpoint (last resort per the §1.5 priority ladder) that moves the logical clock so that the 72-hour violation filing window, the 30-day dispute window, guide effectivity windows and scorecard periods are all reachable. The logical clock defaults to 2026-08-01T00:00:00Z at service start and never advances on its own."
