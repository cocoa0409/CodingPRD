              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Cedar Ridge High", school_code: "CR-01", max_concurrent_seats: 60 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G9-12", subject: "ELA", grade_band: "G9_12", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-T4", quantity_shipped: 10, seal_range_start: 5800, seal_range_end: 5809 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "OPEN" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /proctors"
              payload: { school_id: "${s_id}", full_name: "Ada Proctor", email: "ada@ng.gov" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /proctors/${p1_id}/training-completions"
              payload: { module_version: "2026.1", quiz_score_pct: 92.0 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_v: $.data.version }
            - call: "POST /security-affidavits"
              payload: { proctor_id: "${p1_id}", window_id: "${w_id}", affidavit_version: "2026.1", expected_proctor_version: "${p1_v}" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 20, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /sessions/${sess_id}/proctor-assignments"
              payload: { proctor_id: "${p1_id}", expected_session_version: "${sess_v}" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", student_state_id: "S00000001", grade: 10, guardian_email: "g1@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/accommodation-codings"
              payload: { accommodation_codes: ["SMALL_GROUP"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /sessions/${sess_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/transitions"
              payload: { to_status: "CANCELLED", reason: "Room flooded." }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { seats_in_response: $.data.seats_consumed, ss_in_response: $.data.separate_setting_count }
            - call: "GET /registrations/${r1_id}"
              payload: {}
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { att: $.data.attendance_status }
          assert:
            - "seats_in_response == 0"
            - "ss_in_response == 0"
            - "the first trigger call's own response already carries data.status == CANCELLED"
            - "att == WITHDRAWN"
            - "Registration.${r1_id}.accommodation_status == APPROVED"
            - "Registration.${r1_id}.seats_required == 3"
            - "Session.${sess_id}.effective_seat_capacity == 20"
