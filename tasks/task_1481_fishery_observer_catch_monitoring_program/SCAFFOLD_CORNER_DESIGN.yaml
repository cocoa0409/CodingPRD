  # ===========================================================================
  # Section 5 — Endpoints (Table 5): response envelope, action endpoints,
  # computed reads, conditional actions, bulk-style generate semantics.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: |
          The fixed envelope wraps every response: success carries
          meta.api_request_id + meta.api_request_timestamp, response_type
          object|array, and data; errors carry response_type "error" and
          data.error_id + data.message.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-ENV", name: "Envelope Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /observer-program/fisheries/${f_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { got_id: $.data.id }
            - call: "GET /observer-program/fisheries/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "success response: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.id == ${f_id}"
            - "list response (GET /observer-program/fisheries): response_type == array"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present (non-empty string)"

