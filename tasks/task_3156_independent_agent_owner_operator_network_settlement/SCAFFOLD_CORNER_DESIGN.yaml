# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3156_independent_agent_owner_operator_network_settlement
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# Every setup chain is fully expanded (no YAML anchors) so each instance is
# readable and executable on its own. Each runs against an empty database
# (per-test server isolation), so identical fixture codes are safe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: agent_create_returns_declared_fields_and_starts_pending
        claim_type: Creation
        grounds:
          - entities.Agent
          - endpoints.POST_/network/agents
        distinguishing_aspect: "An agent created with only the six declared inputs comes back 201 carrying status PENDING_ENROLLMENT, version 1, server-minted id and timestamps, settlement_hold true, and the two computed counters at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-COR-01", legal_name: "Corner Case Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id }
          trigger:
          assert:
            - "the response status is 201 and response_type is object"
            - "Agent.${agent_id}.status == PENDING_ENROLLMENT and version == 1"
            - "Agent.${agent_id}.settlement_hold == true because status is not ACTIVE"
            - "Agent.${agent_id}.active_customer_count == 0 and awarded_load_count == 0"
            - "Agent.${agent_id}.territory_codes == [\"TX\", \"OK\"] and home_state == \"TX\""
            - "the envelope carries meta.api_request_id and meta.api_request_timestamp"

      - name: load_get_returns_stored_revenue_mix_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Load
          - endpoints.GET_/network/loads/{id}
        distinguishing_aspect: "Every revenue field round-trips through GET exactly as promoted, including the optional fuel surcharge and accessorial fields, and the derived board_required flag reports true for an ACTIVE, unheld agent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a TX/OK territory and one customer account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C01", legal_name: "Corner C01 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C01", shipper_name: "Corner C01 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C01", origin_state: "TX", destination_state: "OK", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id }
          assert:
            - "the response status is 201 and Load.${load_id}.status == POSTED"
            - "Load.${load_id}.linehaul_revenue_cents == 180000 and fuel_surcharge_cents == 32400 and accessorial_revenue_cents == 12000"
            - "Load.${load_id}.dispatched_miles == 1240 and origin_state == \"TX\" and destination_state == \"OK\""
            - "Load.${load_id}.board_required == true"
            - "GET /network/loads/${load_id} returns byte-identical revenue fields to the create response"

      - name: settlement_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/network/settlements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "An empty settlement ledger still answers with the full pagination contract: total_count 0 and has_more false at the default limit of 10, and a settlement_method filter narrows the set without changing the envelope shape."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent and no settlement rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C03", legal_name: "Corner C03 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
          trigger:
            - call: "GET /network/settlements"
              payload: { limit: 10, offset: 0 }
              as: SettlementOperator
            - call: "GET /network/settlements"
              payload: { settlement_method: "FINAL", limit: 10, offset: 0 }
              as: SettlementOperator
          assert:
            - "the response status is 200 and response_type is array"
            - "total_count == 0 and has_more == false"
            - "the envelope carries all four pagination fields: limit, offset, total_count, has_more"
            - "an offset beyond the end of the set returns an empty array with total_count unchanged"

      - name: capacity_owner_get_with_unknown_id_returns_capacity_owner_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/network/capacity-owners/{id}
          - errors.ERR_CAPACITY_OWNER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the path produces the entity-specific 404 ERR_CAPACITY_OWNER_NOT_FOUND rather than a generic ERR_NOT_FOUND or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No business capacity owner exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
          trigger:
            - call: "GET /network/capacity-owners/00000000-0000-4000-8000-000000000000"
              payload: {  }
              as: NetworkAdministrator
              captures: { err_404: $.data.error_id }
          assert:
            - "the response status is 404 and err_404 == ERR_CAPACITY_OWNER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "err_404 != ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: load_create_missing_linehaul_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Load.fields.linehaul_revenue_cents
          - validations[priority=9]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "linehaul_revenue_cents is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check, distinct from the 422 the same endpoint raises when the origin falls outside the agent's territory."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a customer account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C05", legal_name: "Corner C05 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C05", shipper_name: "Corner C05 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C05", origin_state: "TX", destination_state: "OK", dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the response status is 400 and err_missing == ERR_INVALID_REQUEST"
            - "GET /network/loads?agent_id=${agent_id} returns 0 rows, so nothing was persisted"

      - name: capacity_owner_create_omitting_optionals_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.CapacityOwner.fields.oa_enrolled
          - entities.CapacityOwner.fields.liability_insurance_deductible_cents
          - entities.Agent.fields.customer_ownership_days
        distinguishing_aspect: "Omitting oa_enrolled and liability_insurance_deductible_cents on the BCO stores the declared defaults false and 250000 rather than null, and the derived balances start at 0 rather than absent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
          trigger:
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-COR-DEF", legal_name: "Default Case Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68 }
              as: NetworkAdministrator
              captures: { bco_def: $.data.id }
          assert:
            - "the response status is 201"
            - "CapacityOwner.${bco_def}.oa_enrolled == false"
            - "CapacityOwner.${bco_def}.liability_insurance_deductible_cents == 250000"
            - "CapacityOwner.${bco_def}.safety_score == 100 and escrow_balance_cents == 0 and maintenance_balance_cents == 0"

      - name: equipment_inspection_and_document_status_recomputed_on_read
        claim_type: Computed Fields
        grounds:
          - entities.Equipment.fields.inspection_status
          - entities.Equipment.fields.inspection_passed_at
          - calculations.equipment_inspection_due_boundary
        distinguishing_aspect: "Equipment.inspection_status and ComplianceDocument.status are derived from the logical clock and recomputed on read with no write in between: the same rows read DUE and VALID at 2026-09-01, EXPIRING_SOON inside the 30-day band, and OVERDUE once the clock reaches the deadline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO with a fleet unit due 2026-10-01T00:00:00Z and a CDL expiring 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C07", legal_name: "Corner C07 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C07", legal_name: "Corner C07 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/equipment"
              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-1902", equipment_type: "TRACTOR", model_year: 2021, inspection_due_at: "2026-10-01T00:00:00Z" }
              as: SafetyReviewer
              captures: { eq_id: $.data.id }
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "CDL", document_number: "TX-CDL-79002", issued_at: "2025-09-15T00:00:00Z", expires_at: "2026-09-15T00:00:00Z" }
              as: SafetyReviewer
              captures: { doc_soon_id: $.data.id }
          trigger:
            - call: "GET /network/equipment/${eq_id}"
              payload: {  }
              as: SafetyReviewer
              captures: { st_at_open: $.data.inspection_status }
            - call: "GET /network/compliance-documents/${doc_soon_id}"
              payload: {  }
              as: SafetyReviewer
              captures: { doc_at_open: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: NetworkAdministrator
            - call: "GET /network/compliance-documents/${doc_soon_id}"
              payload: {  }
              as: SafetyReviewer
              captures: { doc_in_band: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "GET /network/equipment/${eq_id}"
              payload: {  }
              as: SafetyReviewer
              captures: { st_overdue: $.data.inspection_status }
          assert:
            - "the first read reports inspection_status DUE and inspection_passed_at is null"
            - "at 2026-09-01 the CDL reads status VALID, and at 2026-09-10 it reads EXPIRING_SOON because the deadline is inside the 30-day band"
            - "the last read reports inspection_status OVERDUE at exactly 2026-10-01T00:00:00Z"
            - "Equipment.${eq_id}.version is 1 across both of its reads, so nothing was written"

      - name: load_offer_client_supplied_status_input_ignored
        claim_type: System Fields
        grounds:
          - entities.LoadOffer.fields.status
          - entities.LoadOffer.fields.selected_rank
          - endpoints.POST_/network/load-offers
        distinguishing_aspect: "LoadOffer.status and selected_rank are source: system. A client that sends status ACCEPTED and a rank is ignored: the board row is created OPEN with version 1 and a rank re-derived from the policy rather than from the supplied number."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a POSTED load and one enrolled BCO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C08", legal_name: "Corner C08 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C08", shipper_name: "Corner C08 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C08", origin_state: "TX", destination_state: "OK", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C08", legal_name: "Corner C08 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
          trigger:
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T01:00:00Z", expected_network_load_version: "${load_v0}", status: "ACCEPTED", selected_rank: 99, version: 42 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { offer_id: $.data.id }
          assert:
            - "the response status is 201"
            - "LoadOffer.${offer_id}.status == OPEN, not ACCEPTED"
            - "LoadOffer.${offer_id}.version == 1, not 42"
            - "LoadOffer.${offer_id}.selected_rank == 1, derived from the policy rather than from the supplied 99"

      - name: equipment_model_year_lower_bound_is_inclusive
        claim_type: Type Constraints
        grounds:
          - entities.Equipment.fields.model_year
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "model_year declares a closed 1980-2030 range, so model_year 1979 is a 400 ERR_INVALID_REQUEST while an otherwise identical unit at 1980 is accepted: the inclusive lower edge is the discriminator."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C09", legal_name: "Corner C09 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
          trigger:
            - call: "POST /network/equipment"
              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-1903", equipment_type: "TRACTOR", model_year: 1979, inspection_due_at: "2027-01-01T00:00:00Z" }
              as: SafetyReviewer
              captures: { err_year: $.data.error_id }
            - call: "POST /network/equipment"
              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-1903", equipment_type: "TRACTOR", model_year: 1980, inspection_due_at: "2027-01-01T00:00:00Z" }
              as: SafetyReviewer
              captures: { eq_edge: $.data.id }
          assert:
            - "the first call returns 400 and err_year == ERR_INVALID_REQUEST"
            - "the second call returns 201 and Equipment.${eq_edge}.model_year == 1980, so the lower bound is inclusive"
            - "GET /network/capacity-owners/${bco_id}/equipment returns exactly 1 row"

      - name: escrow_ledger_has_no_update_or_delete_surface
        claim_type: Immutability
        grounds:
          - entities.EscrowTransaction
          - entities.EscrowTransaction.fields.status
          - endpoints.POST_/network/escrow-transactions/{id}/reverse
        distinguishing_aspect: "Ledger entries are append-only: there is no PUT or DELETE endpoint on the escrow ledger, and the only way to undo an entry is the declared compensating POST, which leaves the original row in place with status REVERSED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO with a single 250000 escrow deposit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C10", legal_name: "Corner C10 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
          trigger:
            - call: "GET /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT" }
              as: SettlementOperator
              captures: { dep_id_from_list: "$.data[0].id" }
          assert:
            - "the deposit row reports status POSTED and amount_cents == 250000"
            - "PUT /network/escrow-transactions/${dep_id_from_list} is not a declared endpoint, so the row cannot be edited in place"
            - "DELETE /network/escrow-transactions/${dep_id_from_list} is not a declared endpoint either"
            - "after POST /network/escrow-transactions/${dep_id_from_list}/reverse the original row still exists and reports status REVERSED"

      - name: trip_create_body_foreign_keys_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - errors.ERR_LOAD_NOT_FOUND
          - errors.ERR_CAPACITY_OWNER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology places three foreign keys in the request body and priority 3 checks them in the order the input list declares (load_id, then capacity_owner_id, then equipment_id), so with all three unknown the answer is ERR_LOAD_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
          trigger:
            - call: "POST /network/trips"
              payload: { load_id: "00000000-0000-4000-8000-000000000001", capacity_owner_id: "00000000-0000-4000-8000-000000000002", equipment_id: "00000000-0000-4000-8000-000000000003", departed_at: "2026-09-01T03:00:00Z", deadline_at: "2026-09-02T03:00:00Z" }
              as: CapacityOwnerOperator
              captures: { err_first: $.data.error_id }
          assert:
            - "the call returns 404 and err_first == ERR_LOAD_NOT_FOUND"
            - "err_first != ERR_CAPACITY_OWNER_NOT_FOUND, because load_id is checked first"
            - "GET /network/trips returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: offer_accept_from_declined_offer_returns_offer_not_open
        claim_type: Invalid Transition
        grounds:
          - state_machines.LoadOffer.transitions.OPEN_to_ACCEPTED
          - errors.ERR_OFFER_NOT_OPEN
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_bco_net_pay
          rationale: "The INVALID_TRANSITION corner of declining then accepting was already realised as the failure path of the named §1.8 instance; no separate corner test is needed."

      - name: new_load_status_input_ignored_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Load.initial_state
          - entities.Load.fields.status
          - entities.Load.fields.board_required
        distinguishing_aspect: "A load promoted with status SETTLED in the body still lands in POSTED, the declared initial state, with awarded_capacity_owner_id null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a customer account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C12", legal_name: "Corner C12 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
