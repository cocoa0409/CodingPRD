            - "captured ${e_order} == ERR_ORDER_NOT_FOUND"
            - "captured ${e_opening} == ERR_OPENING_NOT_FOUND"
            - "captured ${e_drawing} == ERR_DRAWING_NOT_FOUND"
            - "captured ${e_program} == ERR_PROGRAM_NOT_FOUND"
            - "captured ${e_machine} == ERR_MACHINE_NOT_FOUND"
            - "captured ${e_slot} == ERR_SLOT_NOT_FOUND"
            - "captured ${e_booth} == ERR_BOOTH_NOT_FOUND"
            - "captured ${e_batch} == ERR_BATCH_NOT_FOUND"
            - "captured ${e_roll} == ERR_ROLL_NOT_FOUND"
            - "captured ${e_alloc} == ERR_ALLOCATION_NOT_FOUND"
            - "captured ${e_trip} == ERR_TRIP_NOT_FOUND"
            - "captured ${e_punch} == ERR_PUNCH_NOT_FOUND"
            - "captured ${e_template} == ERR_TEMPLATE_NOT_FOUND"
      - name: label_issue_unrated_opening_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPENING_NOT_RATED]"]
        distinguishing_aspect: "Label issue on a fire_rating==NONE opening fails ERR_OPENING_NOT_RATED (pinned to fire before the FINISHED gate, so even a QUEUED unrated opening reports the rating violation)."
        test_recipe:
          setup: ["Unrated order with one QUEUED opening; UL_20MIN roll."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CR-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-R1", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
