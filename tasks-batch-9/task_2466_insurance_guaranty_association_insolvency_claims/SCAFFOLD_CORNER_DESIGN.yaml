scaffold_corner_design:
  - section: entities
    instances:
      - name: insolvency_create_returns_the_declared_row_with_derived_deadlines
        claim_type: creation
        grounds:
          - entities.Insolvency
          - endpoints[POST /insolvencies]
          - response_envelope
        distinguishing_aspect: "POST /insolvencies with the four required fields returns 201 inside the success envelope, in status DECLARED at version 1, with coverage_termination_date 2026-03-31 and proof_of_claim_deadline_utc 2027-03-01T00:00:00Z derived from the 2026-03-01 order date."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
          assert:
            - "response HTTP status == 201 with success true and error null"
            - "Insolvency.${ins_id}.status == DECLARED"
            - "Insolvency.${ins_id}.version == 1"
            - "Insolvency.${ins_id}.coverage_termination_date == 2026-03-31"
            - "Insolvency.${ins_id}.proof_of_claim_deadline_utc == 2027-03-01T00:00:00Z"
            - "Insolvency.${ins_id}.triggered_at_utc == null"
            - "Insolvency.${ins_id}.policy_count == 0"
            - "Insolvency.${ins_id}.estate_remitted_cents == 0"

      - name: insolvency_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /insolvencies/{id}]
          - entities.Insolvency
        distinguishing_aspect: "GET /insolvencies/{id} returns exactly the row created by the prior POST, including the same naic_code and the derived deadline fields, with no state change."
        test_recipe:
          setup:
            - "One Insolvency in DECLARED for Great Lakes Mutual Casualty with naic_code 10001."
          setup_api_calls:
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "GET /insolvencies/${ins_id}"
              payload: {}
              as: AssociationAdmin
              captures: { naic: $.data.naic_code, ver: $.data.version }
          assert:
            - "response HTTP status == 200"
            - "${naic} == 10001"
            - "${ver} == 1"
            - "Insolvency.${ins_id}.status == DECLARED"

      - name: policies_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /policies]
          - response_envelope
        distinguishing_aspect: "With three imported policies, GET /policies?limit=2 returns 2 rows with total_count 3 and has_more true, and the same query at offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One Insolvency in DECLARED with three TransferredPolicy rows PA-1001, PA-1002 and PA-1003, all in IMPORTED."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1002", line_of_business: "PERSONAL_AUTO", policyholder_name: "Boris Ilic", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 365000 }
              as: ReceiverLiaison
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1003", line_of_business: "PERSONAL_AUTO", policyholder_name: "Cora Diaz", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 900000 }
              as: ReceiverLiaison
          trigger:
            - call: "GET /policies"
              payload: { insolvency_id: "${ins_id}", limit: 2, offset: 0 }
              as: ReceiverLiaison
            - call: "GET /policies"
              payload: { insolvency_id: "${ins_id}", limit: 2, offset: 2 }
              as: ReceiverLiaison
          assert:
            - "the first response returns 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "the second response returns 1 row with total_count 3, limit 2, offset 2 and has_more false"
            - "Insolvency.${ins_id}.policy_count == 3"

      - name: claim_get_with_unknown_id_returns_claim_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "GET /claims/{id} for a well-formed UUID that was never minted returns ERR_CLAIM_NOT_FOUND with HTTP 404, not an empty success envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CoverageAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLAIM_NOT_FOUND"
            - "response HTTP status == 404 with success false"

      - name: policy_create_without_policy_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /policies]
        distinguishing_aspect: "Omitting the required policy_number from POST /policies returns ERR_INVALID_REQUEST with HTTP 400 and creates no TransferredPolicy row."
        test_recipe:
          setup:
            - "One Insolvency in DECLARED and a PERSONAL_AUTO CoverageProfile."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"
            - "Insolvency.${ins_id}.policy_count == 0"

      - name: coverage_profile_omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CoverageProfile.fields.statutory_deductible_cents
          - entities.CoverageProfile.fields.cap_order_mode
          - endpoints[POST /coverage-profiles]
        distinguishing_aspect: "A profile created with only the five required fields comes back with statutory_deductible_cents 10000, net_worth_exclusion_threshold_cents 2500000000, covers_punitive_damages false and cap_order_mode OFFSET_THEN_CAP."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "HOMEOWNERS", per_claim_cap_cents: 30000000, per_policy_aggregate_cap_cents: 30000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
              captures: { cp_id: $.data.id, ded: $.data.statutory_deductible_cents, mode: $.data.cap_order_mode }
          assert:
            - "${ded} == 10000"
            - "${mode} == OFFSET_THEN_CAP"
            - "CoverageProfile.${cp_id}.net_worth_exclusion_threshold_cents == 2500000000"
            - "CoverageProfile.${cp_id}.covers_punitive_damages == false"

      - name: policy_unexpired_days_is_computed_by_the_liquidation_order
        claim_type: computed_fields
        grounds:
          - entities.TransferredPolicy.fields.unexpired_days
          - entities.TransferredPolicy.fields.cancellation_date
          - state_machines.TransferredPolicy.IMPORTED_to_CANCELLED_BY_ORDER
        distinguishing_aspect: "cancellation_date and unexpired_days are never supplied by the receiver: the order cascade sets them to 2026-03-31 and 184 from coverage_termination_date and the policy's own expiration_date."
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile and an Insolvency in DECLARED with liquidation_order_date 2026-03-01."
            - "TransferredPolicy PA-1001 in IMPORTED for the term 2025-10-01 to 2026-10-01 with cancellation_date null and unexpired_days 0."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ReceiverLiaison
              captures: { cd: $.data.cancellation_date, ud: $.data.unexpired_days }
          assert:
            - "${cd} == 2026-03-31"
            - "${ud} == 184"
            - "TransferredPolicy.${pol_id}.status == CANCELLED_BY_ORDER"
            - "TransferredPolicy.${pol_id}.up_refund_filed == false"

      - name: claim_filed_at_utc_is_stamped_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.CoveredClaim.fields.filed_at_utc
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "filed_at_utc is server-stamped from the logical clock, so a claim created after the clock is moved to 2026-09-10T12:00:00Z carries exactly that instant rather than wall-clock time."
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and policy PA-1001 in CANCELLED_BY_ORDER."
            - "The logical clock has been moved to 2026-09-10T12:00:00Z, still before the 2027-03-01T00:00:00Z deadline."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id, filed: $.data.filed_at_utc }
          assert:
            - "${filed} == 2026-09-10T12:00:00Z"
            - "CoveredClaim.${clm_id}.status == RECEIVED"
            - "CoveredClaim.${clm_id}.version == 1"

      - name: member_insurer_cap_rate_above_the_declared_range_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.MemberInsurer.fields.annual_cap_rate_bps
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "annual_cap_rate_bps is declared in the range 0 to 200, so a registration at 250 bps is refused with ERR_INVALID_REQUEST and no MemberInsurer row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000, annual_cap_rate_bps: 250 }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: coverage_profile_carries_no_version_field_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.CoverageProfile
          - endpoints[GET /coverage-profiles]
        distinguishing_aspect: "CoverageProfile is declared common_fields false, so each listed row exposes only id and created_at beside its business fields - no updated_at, no version - and §1.5 declares no PATCH, PUT or DELETE on /coverage-profiles."
        test_recipe:
          setup:
            - "Two CoverageProfile rows, one PERSONAL_AUTO and one WORKERS_COMPENSATION."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "WORKERS_COMPENSATION", per_claim_cap_cents: 10000000, per_policy_aggregate_cap_cents: 10000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 1, statutory_deductible_cents: 0 }
              as: AssociationAdmin
          trigger:
            - call: "GET /coverage-profiles"
              payload: {}
              as: AssociationAdmin
          assert:
            - "the response returns 2 rows with total_count 2"
            - "each row exposes id and created_at and exposes neither updated_at nor version"
            - "no PATCH, PUT or DELETE route on /coverage-profiles exists in the API surface"

      - name: claim_create_with_unknown_policy_id_returns_referenced_row_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=13]
          - errors[ERR_REFERENCED_ROW_NOT_FOUND]
          - entities.CoveredClaim.fields.policy_id
        distinguishing_aspect: "A claim body whose policy_id names no TransferredPolicy is refused with ERR_REFERENCED_ROW_NOT_FOUND (404) even though the insolvency_id resolves and the insolvency is TRIGGERED."
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and one cancelled policy PA-1001."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
          trigger:
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "3f2b9d55-77aa-4c11-8e0d-91b5c2ad4e60", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_REFERENCED_ROW_NOT_FOUND"
            - "response HTTP status == 404"
            - "GET /claims with insolvency_id == ${ins_id} returns 0 rows"

      - name: assessment_create_with_unknown_insolvency_returns_referenced_row_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=13]
          - entities.Assessment.fields.insolvency_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology validates every body-borne foreign key: an Assessment naming a non-existent insolvency_id is refused with ERR_REFERENCED_ROW_NOT_FOUND before any premium base is read."
        test_recipe:
          setup:
            - "One ACTIVE MemberInsurer exists for PERSONAL_AUTO base_year 2025, so the premium base is not the reason for failure."
          setup_api_calls:
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000 }
              as: AssociationAdmin
          trigger:
            - call: "POST /assessments"
              payload: { insolvency_id: "6c1d4e88-0b12-4f33-9a77-5d2e8f0a3b41", assessable_line: "PERSONAL_AUTO", base_year: 2025, needed_amount_cents: 150000 }
              as: AssessmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_REFERENCED_ROW_NOT_FOUND"
            - "response HTTP status == 404"

  - section: state_machines
    instances:
      - name: poc_transfer_conversion_materialises_policies_and_claims
        claim_type: valid_transition
        grounds:
          - state_machines.ProofOfClaimTransfer.RECEIVED_to_CONVERTED
          - endpoints[POST /poc-transfers/{id}/convert]
          - entities.TransferredPolicy.fields.source_transfer_id
        distinguishing_aspect: "A two-record batch whose POLICY and CLAIM rows both pass conversion moves the transfer RECEIVED to CONVERTED, mints one TransferredPolicy and one CoveredClaim carrying source_transfer_id, and leaves rejected_count 0 with an empty rejection_reasons."
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile is registered."
            - "Insolvency in DECLARED with liquidation_order_date 2026-03-01."
            - "One ProofOfClaimTransfer in RECEIVED holding a POLICY record for PA-2001 and a CLAIM record pointing at PA-2001."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/poc-transfers"
              payload:
                receiver_batch_ref: "RB-001"
                records:
                  - { record_type: "POLICY", policy_number: "PA-2001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", policyholder_net_worth_cents: 50000000, effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
                  - { record_type: "CLAIM", policy_number: "PA-2001", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: ReceiverLiaison
              captures: { tr_id: $.data.id, rc: $.data.record_count }
          trigger:
            - call: "POST /poc-transfers/${tr_id}/convert"
              payload: {}
              as: ReceiverLiaison
              captures: { conv: $.data.converted_count, rej: $.data.rejected_count }
          assert:
            - "${rc} == 2"
            - "${conv} == 2"
            - "${rej} == 0"
            - "ProofOfClaimTransfer.${tr_id}.status == CONVERTED"
            - "ProofOfClaimTransfer.${tr_id}.rejection_reasons == []"
            - "GET /policies with source_transfer_id == ${tr_id} returns exactly 1 row in IMPORTED"
            - "GET /claims with source_transfer_id == ${tr_id} returns exactly 1 row in RECEIVED"
            - "Insolvency.${ins_id}.policy_count == 1"

      - name: converting_a_poc_transfer_twice_returns_transfer_invalid_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=20]
          - state_machines.ProofOfClaimTransfer.RECEIVED_to_CONVERTED
          - errors[ERR_TRANSFER_INVALID_STATE]
        distinguishing_aspect: "CONVERTED is terminal for ProofOfClaimTransfer, so a second convert call returns ERR_TRANSFER_INVALID_STATE (409) and does not duplicate the already materialised policy row."
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile and an Insolvency in DECLARED."
            - "One ProofOfClaimTransfer already in CONVERTED after a single POLICY record was materialised."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/poc-transfers"
              payload:
                receiver_batch_ref: "RB-001"
                records:
                  - { record_type: "POLICY", policy_number: "PA-2001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", policyholder_net_worth_cents: 50000000, effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { tr_id: $.data.id }
            - call: "POST /poc-transfers/${tr_id}/convert"
              payload: {}
              as: ReceiverLiaison
          trigger:
            - call: "POST /poc-transfers/${tr_id}/convert"
              payload: {}
              as: ReceiverLiaison
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TRANSFER_INVALID_STATE"
            - "response HTTP status == 409"
