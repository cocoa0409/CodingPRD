      - the second trigger call fails with error_id ERR_QUOTE_NOT_FOUND and HTTP 404
      - the second error_id is not ERR_INDEX_CODE_MISMATCH even though the index code is wrong for the package
      - both error envelopes carry a non-blank message and meta.api_request_id
      - MaterialPackage.${pkg_id}.status == IDENTIFIED and open_quote_count == 0
  - name: errors_triggerable_an_unknown_agreement_id_is_a_404_before_the_occ_token_is_read
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_AGREEMENT_NOT_FOUND]
    - validations[priority=35]
    - validations[priority=50]
    distinguishing_aspect: The existence sweep at priority 35 runs ahead of the priority-50 OCC check, so a commitment quoting an unknown escalation_agreement_id together with a deliberately stale expected_project_version returns ERR_AGREEMENT_NOT_FOUND (404), never ERR_STALE_PROJECT_VERSION.
    test_recipe:
      setup:
      - A steel package and a misc-metals package, each with one OPEN quote
      - The client captured Project.version == 1 into ${pv1}, then a PO against the misc-metals package took the project to version 2, so ${pv1} is now stale
      - The failing commitment request therefore carries BOTH a stale OCC token and an unknown clause id
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
