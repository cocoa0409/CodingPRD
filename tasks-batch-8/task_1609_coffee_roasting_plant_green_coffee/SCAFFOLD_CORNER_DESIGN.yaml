  # ===========================================================================
  # Section: validations — violation → error per rule
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1"
        distinguishing_aspect: "Request without X-User-Role header → ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /roastery/counterparties"
              as: Anonymous
              captures: { unauth_err: $.data.error_id }
          assert:
            - "unauth_err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: forbidden_role_denied
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3"
        distinguishing_aspect: "WarehouseClerk attempts Trader-exclusive POST /roastery/counterparties → ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-FRB", legal_name: "Forbidden", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000 }
              as: WarehouseClerk
              captures: { frb_err: $.data.error_id }
          assert:
            - "frb_err == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: invalid_delivery_window_end_before_start
        claim_type: violation_to_error
        grounds:
          - "validations[priority=20"
        distinguishing_aspect: "Contract with delivery_window_end <= delivery_window_start → ERR_INVALID_DELIVERY_WINDOW (422)."
        test_recipe:
          setup: ["Supplier exists."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-IDW", legal_name: "BadWindow", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_idw: $.data.id }
          trigger:
            - call: "POST /roastery/counterparties/${sup_idw}/contracts"
              payload: { contract_ref: "C-IDW", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-09-30T00:00:00Z", delivery_window_end: "2026-09-01T00:00:00Z" }
              as: Trader
              captures: { idw_err: $.data.error_id }
          assert:
            - "idw_err == ERR_INVALID_DELIVERY_WINDOW"
            - "HTTP status == 422"

      - name: over_fix_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13"
        distinguishing_aspect: "Cumulative fix_lbs exceeding total_lbs → ERR_OVER_FIX (422)."
        test_recipe:
          setup: ["PTBF contract total 1000 lbs; one prior fix of 800 lbs."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-OF", legal_name: "OverFix", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_of: $.data.id }
            - call: "POST /roastery/counterparties/${sup_of}/contracts"
              payload: { contract_ref: "C-OF", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 1000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_of: $.data.id, c_of_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_of}/price-fixes"
              payload: { fix_lbs: 800, futures_price_usd_per_lb: 1.80, expected_contract_version: "${c_of_v0}" }
              as: Trader
            - call: "GET /roastery/contracts/${c_of}"
              as: Trader
              captures: { c_of_v1: $.data.version }
          trigger:
            - call: "POST /roastery/contracts/${c_of}/price-fixes"
              payload: { fix_lbs: 201, futures_price_usd_per_lb: 1.80, expected_contract_version: "${c_of_v1}" }
              as: Trader
              captures: { of_err: $.data.error_id }
          assert:
            - "of_err == ERR_OVER_FIX (800 + 201 = 1001 > 1000)"
            - "HTTP status == 422"

      - name: invalid_fix_quantity_zero
        claim_type: violation_to_error
        grounds:
          - "validations[priority=26"
        distinguishing_aspect: "fix_lbs = 0 → ERR_INVALID_FIX_QUANTITY (422)."
        test_recipe:
          setup: ["PTBF contract exists."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
