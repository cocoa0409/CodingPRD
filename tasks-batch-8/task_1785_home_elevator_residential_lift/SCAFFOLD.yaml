  - { id: ERR_NO_VISITS_REMAINING, http: 409, condition: "Contract visits_consumed == included_visits for the current contract year" }
  # --- Business: temporal ---
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end <= start on any scheduled window, or other invalid date ordering" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 422, condition: "Logical clock outside the program's [application_open_date, application_close_date] inclusive window" }
  - { id: ERR_PERMIT_EXPIRED_FOR_INSTALL, http: 409, condition: "Install scheduling requires an APPROVED permit with valid_through >= logical clock; an EXPIRED permit blocks scheduling (re-permit allowed)" }
  - { id: ERR_INSTALL_WINDOW_NOT_STARTED, http: 409, condition: "complete-installation before install_start_date" }
  - { id: ERR_INSPECTION_NOT_STARTED, http: 409, condition: "record-result before scheduled_start" }
  - { id: ERR_RENEWAL_GRACE_EXPIRED, http: 422, condition: "Renewal attempted more than 90 days past expiration; new initial registration required" }
  - { id: ERR_DEFICIENCY_CODES_REQUIRED, http: 422, condition: "FAILED inspection result requires a non-empty deficiency_codes array" }
  # --- Business: referential gates ---
  - { id: ERR_ACCEPTANCE_NOT_PASSED, http: 409, condition: "Certificate application requires latest ACCEPTANCE/MODERNIZATION_ACCEPTANCE inspection on the unit to be PASSED" }
  - { id: ERR_ANNUAL_INSPECTION_REQUIRED, http: 409, condition: "Renewal requires the unit's latest ANNUAL inspection to be PASSED" }
  - { id: ERR_REINSPECTION_REQUIRED, http: 409, condition: "Reinstatement from REVOKED requires the unit's latest REINSPECTION to be PASSED" }
  - { id: ERR_REINSPECTION_NOT_APPLICABLE, http: 409, condition: "Scheduling a REINSPECTION requires the unit's latest terminal inspection to be FAILED" }
  - { id: ERR_UNIT_NOT_IN_SERVICE, http: 409, condition: "Operation requires unit equipment_status == IN_SERVICE" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Program not OPEN (PAUSED/EXHAUSTED/CLOSED) for submission or approval" }
  # --- Business: fiscal ---
  - { id: ERR_INCOME_ABOVE_CAP, http: 402, condition: "household_income exceeds program income_cap at submission" }
  - { id: ERR_VERIFIED_INCOME_INELIGIBLE, http: 402, condition: "verified_income exceeds income_cap at approval" }
  - { id: ERR_GRANT_POOL_EXHAUSTED, http: 402, condition: "Program remaining_pool is 0 (or program EXHAUSTED) at approval" }
  - { id: ERR_PROJECT_TYPE_INELIGIBLE, http: 422, condition: "project_type not in program.eligible_project_types" }
  # --- Concurrency ---
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version != current Project.version (OCC)" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != current ServiceContract.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix (9 roles)
# =============================================================================
roles:
  - name: DealerAdmin
    description: "Dealer back-office administrator: catalog, people, grant programs, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/product-models, POST /api/product-models/{id}/discontinue"
      - "POST /api/technicians, POST /api/technicians/{id}/deactivate"
      - "POST /api/contractors, POST /api/contractors/{id}/suspend"
      - "POST /api/grant-programs, .../pause, .../resume, .../close"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: ProjectCoordinator
    description: "Dealer project coordinator: properties, surveys, projects, permits, work orders, inspections scheduling, certificates, contracts, dispatch"
    identity: opaque
    exclusive_operations:
      - "POST /api/properties"
      - "POST /api/surveys, POST /api/surveys/{id}/cancel"
      - "POST /api/projects, PATCH /api/projects/{id}, schedule-installation, cancel, close"
      - "POST /api/permits, POST /api/permits/{id}/resubmit"
      - "POST /api/work-orders, release, verify, reject-verification"
      - "POST /api/inspections, POST /api/inspections/{id}/cancel"
      - "POST /api/registration-certificates, renew"
      - "POST /api/service-contracts, PATCH, activate, suspend, resume, terminate"
      - "POST /api/service-calls/{id}/dispatch"
      - "POST /api/change-orders"
    shared_operations: ["All GET endpoints", "POST /api/service-calls/{id}/cancel"]
  - name: Surveyor
    description: "Field surveyor (a Technician); completes assigned surveys"
    identity: "entity_backed:Technician"
    exclusive_operations: ["POST /api/surveys/{id}/complete"]
    shared_operations: ["All GET endpoints"]
  - name: Installer
    description: "Installation technician (a Technician holding CET); completes installations and works service calls"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /api/projects/{id}/complete-installation"
      - "POST /api/service-calls/{id}/arrive, resolve"
    shared_operations: ["All GET endpoints"]
  - name: Inspector
    description: "QEI-certified inspector (a Technician); records inspection results; must be independent of the lead installer"
    identity: "entity_backed:Technician"
    exclusive_operations: ["POST /api/inspections/{id}/record-result"]
    shared_operations: ["All GET endpoints"]
  - name: Contractor
    description: "External general contractor; reports structural work complete"
    identity: "entity_backed:Contractor"
    exclusive_operations: ["POST /api/work-orders/{id}/complete-work"]
    shared_operations: ["All GET endpoints"]
  - name: Homeowner
    description: "Property owner (opaque id stored on Property.owner_user_id); opens service calls, applies for grants, decides change orders"
    identity: opaque
    exclusive_operations:
      - "POST /api/service-calls"
      - "POST /api/grant-applications, POST /api/grant-applications/{id}/withdraw"
      - "POST /api/change-orders/{id}/approve, reject"
    shared_operations: ["All GET endpoints", "POST /api/service-calls/{id}/cancel"]
  - name: GrantOfficer
    description: "Grant program officer; approves or denies applications"
    identity: opaque
    exclusive_operations: ["POST /api/grant-applications/{id}/approve, deny"]
    shared_operations: ["All GET endpoints"]
  - name: Regulator
    description: "Government side (AHJ permit reviewer + state elevator bureau); permit review, certificate issuance"
    identity: opaque
    exclusive_operations:
      - "POST /api/permits/{id}/request-corrections, approve, deny"
      - "POST /api/registration-certificates/{id}/issue"
    shared_operations: ["All GET endpoints"]
