# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_cogs_standard_vs_actual
        grounds:
          - calculations.order_cogs
          - entities.OrderLine.fields.standard_cogs_cents
          - entities.OrderLine.fields.actual_cogs_cents
          - entities.Order.fields.actual_cogs_cents
          - calculations.fifo_batch_allocation
        distinguishing_aspect: |
          On the Order domain: a single 180 ml DOUBLE-vanilla line yields
          standard_cogs_cents=324 (180*1.80) but actual_cogs_cents=270
          (90*1.00 from the earlier-expiry batch + 90*2.00 from the later one).
        test_recipe:
          setup:
            - "Vanilla flavor, standard_cost_cents_per_ml=1.80, par 500"
            - "DOUBLE size (2 scoops)"
            - "Batch A: 90 ml @1.00/ml, expiry 2026-05-10 (FIFO first); Batch B: 500 ml @2.00/ml, expiry 2026-05-20; both AVAILABLE"
            - "OPEN drawer and OPEN order with one DOUBLE-vanilla line reserving 90 from A + 90 from B"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", allergens: ["MILK","EGG"], standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 90, unit_cost_cents_per_ml: 1.00, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-10T00:00:00Z" }
              as: Baker
              captures: { bA: $.data.id }
            - call: "POST /batches/${bA}/release"
              payload: {}
              as: Baker
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 2.00, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { bB: $.data.id }
            - call: "POST /batches/${bB}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          assert:
            - "OrderLine.${ln}.standard_cogs_cents == 324"
            - "OrderLine.${ln}.actual_cogs_cents == 270"
            - "Order.${ord}.standard_cogs_cents == 324"
            - "Order.${ord}.actual_cogs_cents == 270"

      - name: batch_shrink_allowance_vs_measured
        grounds:
          - calculations.batch_shrink
          - entities.Batch.fields.expected_shrink_ml
          - entities.Batch.fields.actual_shrink_ml
          - entities.Batch.fields.shrink_variance_ml
        distinguishing_aspect: |
          On the Batch domain (distinct entity from order_cogs): a 1000 ml batch
          has expected_shrink_ml=50 (5% allowance) but actual_shrink_ml=70
          (MELT 30 + SPILLAGE 40), so shrink_variance_ml=20.
        test_recipe:
          setup:
            - "Vanilla flavor, par 500"
            - "Batch: 1000 ml @1.50/ml, AVAILABLE"
            - "Two waste events on the batch: MELT 30 ml, SPILLAGE 40 ml"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.50, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 1000, unit_cost_cents_per_ml: 1.50, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-30T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /waste-events"
              payload: { batch_id: "${b}", waste_type: "MELT", volume_ml: 30 }
              as: Baker
            - call: "POST /waste-events"
              payload: { batch_id: "${b}", waste_type: "SPILLAGE", volume_ml: 40 }
              as: Baker
          trigger:
            - call: "GET /batches/${b}"
              payload: {}
              as: Baker
          assert:
            - "Batch.${b}.wasted_volume_ml == 70"
            - "Batch.${b}.remaining_volume_ml == 930"
            - "Batch.${b}.expected_shrink_ml == 50"
            - "Batch.${b}.actual_shrink_ml == 70"
            - "Batch.${b}.shrink_variance_ml == 20"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_price_premium_topping_size_nonlinear
        grounds:
          - calculations.order_line_price
          - entities.OrderLine.fields.line_price_cents
          - entities.Flavor.fields.premium_surcharge_cents_per_scoop
        distinguishing_aspect: |
          Mode (a): >=3 inputs with a conditional branch. DOUBLE (base 550) of a
          premium Pistachio (60/scoop -> 120 for 2 scoops) plus a 100-cent
          Hot Fudge topping = line_price_cents 770; the premium branch only fires
          because flavor.is_premium is true.
        test_recipe:
          setup:
            - "Pistachio flavor, is_premium=true, premium_surcharge_cents_per_scoop=60, par 300"
            - "DOUBLE size (2 scoops, base 550)"
            - "Hot Fudge topping, price 100"
            - "Batch pistachio 500 ml AVAILABLE; OPEN drawer + OPEN order"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Pistachio", allergens: ["MILK","NUTS","PISTACHIO"], is_premium: true, premium_surcharge_cents_per_scoop: 60, standard_cost_cents_per_ml: 2.20, par_level_ml: 300 }
              as: Manager
              captures: { pis: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /toppings"
              payload: { name: "Hot Fudge", price_cents: 100, allergens: ["MILK","SOY"] }
              as: Manager
              captures: { fudge: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${pis}", initial_volume_ml: 500, unit_cost_cents_per_ml: 2.20, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${pis}", topping_ids: ["${fudge}"] }
              as: Scooper
              captures: { ln: $.data.id }
          assert:
            - "OrderLine.${ln}.line_price_cents == 770"
            - "OrderLine.${ln}.line_tax_cents == 67"
            - "OrderLine.${ln}.scoops == 2"

      - name: order_tax_round_per_line_then_sum
        grounds:
          - calculations.order_totals
          - entities.Order.fields.tax_cents
          - entities.Order.fields.total_cents
          - entities.OrderLine.fields.line_tax_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters. Two SINGLE-vanilla lines each priced
          350 give per-line tax 31+31=62 (round-per-line-THEN-sum, PINNED), so
          tax_cents=62 and total_cents=762; sum-then-round would give 61/761.
        test_recipe:
          setup:
            - "Vanilla flavor, par 500; SINGLE size (base 350)"
            - "Batch vanilla 500 ml AVAILABLE; OPEN drawer + OPEN order"
            - "First SINGLE-vanilla line already added (price 350)"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln1: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln2: $.data.id }
          assert:
            - "Order.${ord}.subtotal_cents == 700"
            - "Order.${ord}.tax_cents == 62"
            - "Order.${ord}.total_cents == 762"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_void_branch_releases_reservation_only
        grounds:
          - state_machines.Order.OPEN_to_VOID
          - state_machines.Order.OPEN_to_PAID
          - entities.Batch.fields.reserved_volume_ml
          - entities.Batch.fields.remaining_volume_ml
        distinguishing_aspect: |
          Order has a branching fork from OPEN with divergent side-effect sets:
          the VOID branch releases the soft reservation (reserved 180->0) leaving
          remaining_volume_ml=500 and drawer expected_cash unchanged, whereas the
          PAID branch would have committed volume and moved cash.
        test_recipe:
          setup:
            - "Vanilla flavor par 500; DOUBLE size; Batch vanilla 500 ml AVAILABLE"
            - "OPEN drawer (float 10000); OPEN order with one DOUBLE line reserving 180 ml"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/void"
              payload: {}
              as: ShiftLead
          assert:
            - "Order.${ord}.status == VOID"
            - "OrderLine.${ln}.status == REMOVED"
            - "Batch.${b}.reserved_volume_ml == 0"
            - "Batch.${b}.remaining_volume_ml == 500"
            - "CashDrawerSession.${dr}.expected_cash_cents == 10000"

      - name: preorder_revision_cycle_back_edge
        grounds:
          - state_machines.PreOrder.IN_PRODUCTION_to_CONFIRMED
          - state_machines.PreOrder.CONFIRMED_to_IN_PRODUCTION
          - entities.PreOrder.fields.status
        distinguishing_aspect: |
          PreOrder is cyclic: request-revision drives the back-edge
          IN_PRODUCTION->CONFIRMED, returning status to CONFIRMED so production
          can restart — a loop no linear pipeline permits, on a different entity
          than the Order branch.
        test_recipe:
          setup:
            - "Vanilla flavor active, in-stock via a released batch; DecoratingStation"
            - "PreOrder QUOTED -> CONFIRMED (confirm) -> IN_PRODUCTION (start-production)"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id }
            - call: "POST /pre-orders/${po}/confirm"
              payload: {}
              as: Scooper
            - call: "POST /pre-orders/${po}/start-production"
              payload: {}
              as: Baker
          trigger:
            - call: "POST /pre-orders/${po}/request-revision"
              payload: {}
              as: Baker
          assert:
            - "PreOrder.${po}.status == CONFIRMED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pay_deplete_cascade_depth3
        grounds:
          - state_machines.Order.OPEN_to_PAID
          - state_machines.Batch.AVAILABLE_to_DEPLETED
          - calculations.flavor_stock_status
          - entities.Flavor.fields.stock_status
        distinguishing_aspect: |
          Pay triggers a 3-hop chain: commit drops Batch.remaining_volume_ml to 0
          (hop 1) -> that zero auto-transitions the batch AVAILABLE->DEPLETED
          (hop 2) -> the DEPLETED batch drops Flavor.total_available_ml to 0,
          flipping stock_status to OUT_OF_STOCK (hop 3).
        test_recipe:
          setup:
            - "Vanilla flavor par 500; DOUBLE size"
            - "Single vanilla Batch: initial 180, remaining 180, AVAILABLE (flavor BELOW_PAR)"
            - "OPEN drawer; OPEN order with one DOUBLE line reserving all 180 ml"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 180, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          assert:
            - "Batch.${b}.remaining_volume_ml == 0"
            - "Batch.${b}.status == DEPLETED"
            - "Flavor.${van}.total_available_ml == 0"
            - "Flavor.${van}.stock_status == OUT_OF_STOCK"

      - name: refund_restore_cascade_depth3
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - state_machines.Batch.DEPLETED_to_AVAILABLE
          - calculations.flavor_stock_status
          - entities.Flavor.fields.stock_status
        distinguishing_aspect: |
          Refund (a different trigger than pay) runs the inverse 3-hop chain:
          uncommit restores Batch.remaining_volume_ml to 180 (hop 1) -> the batch
          auto-transitions DEPLETED->AVAILABLE (hop 2) -> Flavor.total_available_ml
          rises to 180, flipping stock_status OUT_OF_STOCK->BELOW_PAR (hop 3).
        test_recipe:
          setup:
            - "Same as pay_deplete_cascade_depth3 through the pay step, so the batch is DEPLETED and flavor OUT_OF_STOCK"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 180, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/refund"
              payload: {}
              as: ShiftLead
          assert:
            - "Batch.${b}.remaining_volume_ml == 180"
            - "Batch.${b}.status == AVAILABLE"
            - "Flavor.${van}.total_available_ml == 180"
            - "Flavor.${van}.stock_status == BELOW_PAR"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_paid_order_line
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Order.OPEN_to_PAID
        distinguishing_aspect: |
          Category pair state(5) vs business_temporal(7): adding an out-of-season
          Pumpkin line to an already-PAID order returns ERR_ORDER_NOT_OPEN
          (state), never ERR_FLAVOR_OUT_OF_SEASON, even though both violations
          hold.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01 (Pumpkin season Sep-Dec => out of season)"
            - "Vanilla + Pumpkin flavors; SINGLE size; vanilla batch AVAILABLE; pumpkin batch AVAILABLE"
            - "OPEN drawer; order with a vanilla line PAID (now status PAID)"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /flavors"
              payload: { name: "Pumpkin", is_seasonal: true, seasonal_start_utc: "2026-09-01T00:00:00Z", seasonal_end_utc: "2026-12-01T00:00:00Z", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { pmp: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { bv: $.data.id }
            - call: "POST /batches/${bv}/release"
              payload: {}
              as: Baker
            - call: "POST /batches"
              payload: { flavor_id: "${pmp}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { bp: $.data.id }
            - call: "POST /batches/${bp}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${pmp}" }
              as: Scooper
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_OPEN"

      - name: safety_beats_constraint_on_line_add
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - entities.OrderLine.fields.allergen_label
          - entities.LoyaltyAccount.fields.allergen_restrictions
        distinguishing_aspect: |
          Category pair business_safety(6) vs business_constraint(10): a
          PEANUT-restricted member's DOUBLE line on a peanut flavor whose batch
          also lacks headroom (90<180) returns ERR_ALLERGEN_RESTRICTION_CONFLICT,
          never ERR_INSUFFICIENT_BATCH_VOLUME.
        test_recipe:
          setup:
            - "PB flavor allergens [MILK,PEANUT], par 300; DOUBLE size"
            - "PB batch remaining 90 ml AVAILABLE (headroom < 180 needed)"
            - "LoyaltyAccount with allergen_restrictions [PEANUT]; OPEN drawer; OPEN order carrying that account"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "PB Swirl", allergens: ["MILK","PEANUT"], standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { pb: $.data.id }
            - call: "POST /size-options"
