  - rule_id: combinatorial_formula
    instances:
      - name: cf_headroom_min_exponent_tier_bid_ranking
        grounds:
          - calculations.relevance_adjusted_bid_ranking
          - calculations.relevance_score_composition
          - calculations.line_item_priority_tier
          - calculations.second_price_clearing
          - calculations.budget_plan_available
          - entities.PlacementSlot.fields.relevance_weight
          - entities.PlacementSlot.fields.floor_cpc_cents
          - entities.LineItem.fields.daily_budget_cents
          - entities.LineItem.fields.priority_tier
          - entities.AuctionBid.fields.quality_adjusted_score
          - entities.AuctionBid.fields.rank
          - entities.AuctionEvent.fields.clearing_price_cents
          - state_machines.AuctionEvent.OPEN_to_RANKED
          - state_machines.AuctionEvent.RANKED_to_AWARDED
          - validations[priority=53]
          - concurrency_rules[line-item-create-stale-campaign]
        distinguishing_aspect: |
          Mode (a) — four independent inputs interact non-linearly in one score: the nested min of the headroom triple then min(bid_cents, headroom) clamps LI-HI to effective_bid_cents 700 out of a bid of 3000, relevance_score is raised to the slot exponent relevance_weight == 2.0, and the threshold-derived TIER_1 multiplier 1.10 scales the product, so LI-HI wins with quality_adjusted_score 505.1970 over LI-LO's 413.9520 even though LI-LO's effective bid is larger — an implementation that multiplies by relevance_score linearly instead of exponentiating produces 623.7000 vs 739.2000 and awards the auction to the wrong line item.
        test_recipe:
          setup:
            - "Advertiser RANKCO is ACTIVE and MANAGED (service_model == MANAGED so the SELF_SERVE branch of the headroom min is not taken)."
            - "One ACTIVE BudgetPlan for 2026-Q3, committed_total_cents == 40000000, trade_fund_share_cents == 0; the single campaign reserves 5000000 so available_cents == 35000000 and remaining_ratio == 0.875 >= 0.50, pinning both line items to TIER_1 (multiplier 1.10)."
            - "One ONSITE SEARCH_RESULTS PlacementSlot RANK-SLOT-1 with floor_cpc_cents == 300, relevance_weight == 2.0, max_concurrent_line_items == 3 and no exclusivity_category_code, so both line items may occupy it concurrently and neither is filtered BELOW_FLOOR."
            - "One DELIVERING ONSITE_ONLY campaign with daily_cap_cents == 400000, so the campaign term of the headroom min never binds."
            - "LI-HI: bid_cents == 3000 but daily_budget_cents == 700, keyword_match_terms == [\"coffee\"], one ACTIVE hero assignment to a 0.20-margin product."
            - "LI-LO: bid_cents == 1200 with daily_budget_cents == 100000, keyword_match_terms == [\"coffee\", \"tea\"], one ACTIVE hero assignment to a 0.40-margin product."
            - "No auction has settled yet, so spend_today is 0 for the line items, the campaign and the advertiser."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Rank Co Retail Media LLC", brand_code: "RANKCO", service_model: "MANAGED", credit_limit_cents: 100000000, account_manager_user_id: "am-7", managed_service_fee_pct: 0.05 }
