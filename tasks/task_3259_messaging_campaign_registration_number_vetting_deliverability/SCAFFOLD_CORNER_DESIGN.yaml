scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed fields, enums, not-found
  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_applies_defaults_and_enum_validation
        claim_type: creation_defaults
        grounds:
          - entities.Account.fields.status
          - entities.Account.fields.plan_tier
        distinguishing_aspect: "POST /messaging/accounts with plan_tier STANDARD yields status ACTIVE; an invalid plan_tier enum is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "GET /messaging/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.plan_tier == STANDARD"
            - "Account.${acct}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET on a random UUID account id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /messaging/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "http status == 404"

      - name: brand_computed_identity_score_ignores_client_input
        claim_type: computed_field
        grounds:
          - entities.Brand.fields.identity_score
          - calculations.identity_scoring
        distinguishing_aspect: "identity_score starts 0 at create and is only set by submit; the computed value for the full NON_PROFIT profile is exactly 90 (50 base + 10 website + 5 NON_PROFIT + 10 tax + 10 postal + 5 POINT_OF_SALE)."
        test_recipe:
          setup: ["account exists; brand created with NON_PROFIT + valid tax + valid postal + website + POINT_OF_SALE"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "C", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Charity", tax_id: "98-7654321", business_type: "NON_PROFIT", address_line1: "2 Oak", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://c.example", opt_in_mechanism: "POINT_OF_SALE" }
              as: BrandManager
              captures: { brand: $.data.id, score_pre: $.data.identity_score }
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
          assert:
            - "score_pre == 0"
            - "Brand.${brand}.identity_score == 90"
            - "Brand.${brand}.status == PENDING_VERIFICATION"

      - name: brand_country_mismatch_rejected
        claim_type: validation_constraint
        grounds:
          - entities.Brand.fields.country_code
          - state_machines.Brand.DRAFT_to_PENDING_VERIFICATION
        distinguishing_aspect: "Brand whose country_code differs from the account's country fails submit with ERR_VALIDATION."
        test_recipe:
          setup: ["US account; brand created with country_code GB (mismatch only surfaces at submit)"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PRIVATE_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "GB", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "http status == 400"
            - "Brand.${brand}.status == DRAFT"

      - name: consent_record_retention_computed
        claim_type: computed_field
        grounds:
          - entities.ConsentRecord.fields.retention_expires_at
        distinguishing_aspect: "retention_expires_at = captured_at + 1460 days exactly: captured 2026-09-01 yields 2030-08-31T00:00:00Z."
        test_recipe:
          setup: ["account + brand (DRAFT) exist"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PRIVATE_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
          trigger:
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000900", evidence_url: "https://e/900", evidence_text: "web", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
              captures: { consent: $.data.id }
          assert:
            - "ConsentRecord.${consent}.retention_expires_at == 2030-08-31T00:00:00Z (2026-09-01 + 1460 days)"
            - "ConsentRecord.${consent}.status == ACTIVE"

      - name: list_accounts_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Account
        distinguishing_aspect: "List endpoint honors limit/offset and returns pagination_fields total_count and has_more."
        test_recipe:
          setup: ["two accounts exist"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A1", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "A2", plan_tier: "PREMIUM", country_code: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "GET /messaging/accounts"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response contains total_count == 2"
            - "response contains has_more == true"
            - "data array length == 1"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # ===========================================================================
  - section: state_machines
    instances:
      - name: brand_verify_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Brand
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "verify on a DRAFT brand (never submitted) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["account + DRAFT brand exist"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PRIVATE_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "http status == 409"
            - "Brand.${brand}.status == DRAFT"

      - name: closed_account_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Account
          - errors[ERR_ACCOUNT_CLOSED]
        distinguishing_aspect: "After close, mutating endpoints on the account are rejected with ERR_ACCOUNT_CLOSED and no transition leaves CLOSED."
        test_recipe:
          setup: ["account suspended then closed"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/suspend"
              payload: { reason: "r" }
              as: ComplianceOfficer
            - call: "POST /messaging/accounts/${acct}/close"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PRIVATE_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_CLOSED"
            - "http status == 409"
            - "Account.${acct}.status == CLOSED"

      - name: campaign_deactivate_blocked_by_active_number
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.APPROVED_to_DEACTIVATED
          - errors[ERR_CAMPAIGN_NOT_DEACTIVATABLE]
        distinguishing_aspect: "Deactivate on an APPROVED campaign with an ACTIVE attached number fails; after releasing the number it succeeds."
        test_recipe:
          setup: ["APPROVED TEN_DLC campaign with attached ACTIVE number"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/deactivate"
              payload: {}
              as: CampaignManager
              captures: { err: $.data.error_id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/release"
              payload: {}
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/deactivate"
              payload: {}
              as: CampaignManager
          assert:
            - "err == ERR_CAMPAIGN_NOT_DEACTIVATABLE"
            - "After number release, second deactivate returns 200"
            - "Campaign.${camp}.status == DEACTIVATED"

      - name: porting_number_cannot_use_activate
        claim_type: invalid_transition
        grounds:
          - state_machines.SenderNumber
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A PORT_IN number lands in PORTING; the plain activate endpoint rejects it (must use complete_port)."
        test_recipe:
          setup: ["PORT_IN number created (auto-PORTING)"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551230000", number_type: "TEN_DLC", country_code: "US", port_phone_number: "+15551230000", port_letter_of_agency: "loa-ref-1", port_losing_carrier: "OldCarrier" }
              as: NumberProvisioner
              captures: { num: $.data.id, st: $.data.status }
          trigger:
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
              captures: { err: $.data.error_id }
          assert:
            - "st == PORTING (auto-transition on create)"
            - "err == ERR_INVALID_STATE"
            - "http status == 409"

      - name: brand_revoke_cascades_to_campaign_and_number
        claim_type: side_effect_execution
        grounds:
          - state_machines.Brand.VERIFIED_to_REVOKED
          - calculations.cascade_suspend_campaign
        distinguishing_aspect: "Revoking a VERIFIED brand suspends its APPROVED campaign, which in turn suspends the attached ACTIVE number (bubble-down cascade across three entities)."
        test_recipe:
          setup: ["VERIFIED brand; APPROVED campaign; attached ACTIVE number"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/revoke"
              payload: { reason: "fraud" }
              as: ComplianceOfficer
          assert:
            - "Brand.${brand}.status == REVOKED"
            - "Campaign.${camp}.status == SUSPENDED"
            - "SenderNumber.${num}.status == SUSPENDED"
            - "SenderNumber.${num}.suspended_reason == 'CAMPAIGN_SUSPENDED'"

      - name: message_retry_rechecks_consent
        claim_type: guarded_transition
        grounds:
          - state_machines.Message.FAILED_to_ACCEPTED
          - validations[priority=6]
          - errors[ERR_NO_CONSENT]
        distinguishing_aspect: "Retry of a retryable FAILED message is rejected with ERR_NO_CONSENT when the recipient's consent was revoked after the original send."
        test_recipe:
          setup: ["message FAILED with E30034 (retryable); consent since revoked"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000901", evidence_url: "https://e/901", evidence_text: "web", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
              captures: { consent: $.data.id }
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000901", body: "hi", carrier_code: "VZW" }
              as: CampaignManager
              captures: { msg: $.data.id }
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /messaging/accounts/${acct}/messages/${msg}/delivery_outcome"
              payload: { outcome: "FAILED", error_code: "E30034" }
              as: SystemDriver
            - call: "POST /messaging/accounts/${acct}/consent_records/${consent}/revoke"
              payload: {}
              as: BrandManager
          trigger:
            - call: "POST /messaging/accounts/${acct}/messages/${msg}/retry"
              payload: {}
              as: CampaignManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_CONSENT"
            - "http status == 409"
            - "Message.${msg}.status == FAILED (unchanged)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: ucs2_body_segment_count
        claim_type: correct_result
        grounds:
          - calculations.segments_and_fee
          - entities.Message.fields.segments
        distinguishing_aspect: "A 71-char UCS-2 body (any non-GSM-7 char) yields segments 2 at acceptance, before any drain."
        test_recipe:
          setup: ["APPROVED campaign with attached number; consent for recipient"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "X", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "94101", country_code: "US", website_url: "https://x.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000902", evidence_url: "https://e/902", evidence_text: "web", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
          trigger:
            - call: "POST /messaging/accounts/${acct}/messages"
