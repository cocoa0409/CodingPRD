            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
