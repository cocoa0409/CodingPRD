              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-02-01", term_end_date: "2026-11-30" }
              as: StormwaterProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${ta_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 20 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${ta_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 9.00, priority_tier: "LOW", baseline_concentration_mg_per_l: 0.10, design_runoff_kl: 5000 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${ta_id}", parcel_id: "P-1000", owner_name: "A Owner Again", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
