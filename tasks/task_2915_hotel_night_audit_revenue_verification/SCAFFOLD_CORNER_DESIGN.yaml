          trigger: "POST /night-audit/authorization-documents with property_id ${prop_id}, doc_type COMP_ROOM, authorized_by_name S. Adeyemi, document_reference CR-9001, valid_from_date 2026-08-01, valid_to_date 2026-08-04 and allowance_id ${allowance_id} but no folio_id, as FrontDeskAgent (X-User-ID u_fd_1)."
          assert:
            - "HTTP 422 with data.error_id == \"ERR_DOCUMENT_TARGET_MISMATCH\" - COMP_ROOM requires folio_id and forbids allowance_id."
            - "The same body with folio_id ${folio_id} and no allowance_id returns 201 with status == \"PENDING\", folio_id == ${folio_id} and allowance_id == null."
            - "doc_type ALLOWANCE_APPROVAL with folio_id ${folio_id} and no allowance_id fails 422 ERR_DOCUMENT_TARGET_MISMATCH, while the mirror body with allowance_id ${allowance_id} and no folio_id returns 201."
            - "doc_type RATE_OVERRIDE with folio_id ${folio_id} but no authorized_rate_amount fails 422 ERR_DOCUMENT_TARGET_MISMATCH, because that type carries the extra field requirement."
            - "doc_type COMP_ROOM with folio_id 00000000-0000-4000-8000-000000000000 fails 404 ERR_FOLIO_NOT_FOUND - the body-FK check at priority 22 runs before the shape rule at priority 72."
            - "GET /night-audit/authorization-documents?folio_id=${folio_id} returns exactly the folio-linked documents and GET /night-audit/authorization-documents?allowance_id=${allowance_id} returns exactly the allowance-linked one, so the association is navigable from both sides."

      - name: endpoint_computed_read_a_revenue_report_is_a_frozen_snapshot
        claim_type: computed_read
        grounds: ["endpoints[POST /night-audit/revenue-reports]", "entities.RevenueReport", "calculations.occupancy_statistics", "state_machines.RevenueReport.status"]
        distinguishing_aspect: "Every numeric field on the report is copied out of the BusinessDate at creation time, so a later reversal that moves the date's aggregates must leave the report's numbers untouched and only flip its status to SUPERSEDED - the report is a snapshot, not a live view."
