          - entities.MediaPlan.fields.approved_budget_cents
          - entities.MediaPlan.fields.uncommitted_cents
        distinguishing_aspect: |
          Conserved quantity #2 is a DIFFERENT kind of quantity — MEDIA PLAN BUDGET, not client cash —
          pinned as MediaPlan.approved_budget_cents == uncommitted_cents + SUM(InsertionOrder.gross_cents
