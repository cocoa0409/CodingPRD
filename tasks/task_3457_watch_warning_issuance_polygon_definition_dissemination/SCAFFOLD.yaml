# =============================================================================
# SCAFFOLD.yaml — Watch & Warning Issuance, Polygon Definition & Dissemination
# §1.0–§1.7 (difficulty and corner designs live in sibling files)
# =============================================================================

scenario: |
  Watch and Warning Issuance, Polygon Definition & Dissemination (National Weather Service): forecast office responsibility areas with county warning area boundaries and coordination between neighboring offices, product hierarchy across outlooks, watches, advisories and warnings with issuance criteria per hazard, storm-based warning polygons defined by threat area rather than political boundaries with expiration times, dissemination through emergency alert systems, wireless alerts, weather radio and data feeds with message formatting standards, false alarm ratio and lead time verification statistics used for performance review, impact-based warning wording with tags that drive automatic alert behavior on phones, upgrade, cancellation and continuation logic as a storm evolves, coordination with emergency management for evacuation and shelter decisions

domain_name: watch-warning-issuance
api_prefix: /alerts

complexity_profile:
  primary_archetype: temporal_windowing        # product effective/expiration windows, adjacency, overlap
  secondary_archetype: event_sourcing          # verification statistics replay confirmed events against issued products
  complexity_layers:
    - rate_threshold_triggers                  # per-hazard issuance criteria, impact-tag tiers, performance bands
    - cascading_side_effects                   # issue -> records -> dispatch; decline -> revert -> sibling cancel
    - derived_field_reconciliation             # verified_event_count, window_end, resolved_zone_ids, performance_band
    - optimistic_concurrency                   # OCC on Product.version at issue and on StormEvent.version at update
  entity_topology: flat                        # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic                  # Product coordination-revert loop; DisseminationRecord retry loop
  relationship_patterns:
    - many_to_many                             # NeighborAgreement joins two ForecastOffice rows
    - self_referential                         # Product.supersedes_product_id -> Product.id (upgrade/continuation/correction chains)
    - cross_aggregate                          # VerificationEvent -> Product matching; EmergencyAction -> Product gating
  role_model: hierarchical_override            # MeteorologistInCharge is a Forecaster superset with coordination override
  consistency_model: immediate                 # every mutation (including cascades) is atomic in the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ForecastOffice
    parent: null
    common_fields: true
    fields:
      - { name: office_code, type: string, source: input, description: "Unique 2-4 letter office identifier, e.g. KAKQ" }
      - { name: name, type: string, source: input, description: "Office display name" }
      - { name: region, type: string, source: input, description: "Region label, e.g. SOUTHERN_PLAINS" }
      - { name: area_method, type: enum, source: input, default: PLANAR, description: "PLANAR | GEODETIC — polygon/overlap area algorithm selector (calculations.polygon_area_sq_km)" }
      - { name: performance_band, type: enum, source: computed, default: SATISFACTORY, description: "SATISFACTORY | REVIEW_REQUIRED — derived from the office's latest VerificationStatistic (calculations.performance_band_derivation)" }
      - { name: last_statistic_at, type: datetime, source: computed, description: "Logical timestamp of the office's most recent VerificationStatistic; null until one is computed" }

  - name: CountyZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique public zone code, e.g. TXC001" }
      - { name: name, type: string, source: input, description: "County/zone display name" }
      - { name: office_id, type: string, source: input, description: "FK -> ForecastOffice.id; the office whose county warning area contains this zone" }
      - { name: lat_min, type: number, source: input, description: "Southern boundary, decimal degrees; zone boundary is an axis-aligned rectangle" }
      - { name: lat_max, type: number, source: input, description: "Northern boundary; must be > lat_min" }
      - { name: lon_min, type: number, source: input, description: "Western boundary, decimal degrees" }
      - { name: lon_max, type: number, source: input, description: "Eastern boundary; must be > lon_min" }
      - { name: surveyed_area_sq_km, type: number, source: input, description: "Official surveyed zone area in sq km; denominator of overlap_pct (calculations.zone_overlap_resolution)" }
      - { name: population_tier, type: enum, source: input, description: "LOW | MEDIUM | HIGH | URBAN — gates impact-based tag escalation (calculations.impact_tier_scoring)" }
      - { name: coastal, type: boolean, source: input, default: false, description: "Coastal zone flag" }

  - name: NeighborAgreement
    parent: null
    common_fields: true
    fields:
      - { name: office_a_id, type: string, source: input, description: "FK -> ForecastOffice.id; first party of the coordination agreement" }
      - { name: office_b_id, type: string, source: input, description: "FK -> ForecastOffice.id; second party" }
      - { name: hazard_types, type: array, source: input, description: "Hazard enum values this agreement covers; coordination across the pair is only possible for listed hazards" }
      - { name: coordination_timeout_minutes, type: integer, source: input, default: 15, description: "Minutes a CoordinationRequest stays REQUESTED before clock-driven expiry" }

  - name: AlertChannel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unique channel name, e.g. WEA-PRIMARY" }
      - { name: channel_type, type: enum, source: input, description: "EAS | WEA | NOAA_WEATHER_RADIO | DATA_FEED" }
      - { name: supports_levels, type: array, source: input, description: "Product levels this channel carries: subset of OUTLOOK, WATCH, ADVISORY, WARNING" }
      - { name: max_message_chars, type: integer, source: input, description: "Channel message budget; for WEA channels must be <= 360 (WEA_ABSOLUTE_MAX_CHARS)" }
      - { name: requires_confirmation, type: boolean, source: input, default: false, description: "True when the carrier/peer must confirm receipt (WEA); false channels auto-confirm at dispatch" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED — only ACTIVE channels receive DisseminationRecords at issue time" }

  - name: Forecaster
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> ForecastOffice.id; the office this forecaster may act for (office scope)" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: employee_code, type: string, source: input, description: "Unique employee code" }
      - { name: level, type: enum, source: input, description: "JOURNEYMAN | SENIOR | MIC — MIC unlocks coordination-override issuance" }

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> ForecastOffice.id; office tracking this storm" }
      - { name: hazard_type, type: enum, source: input, description: "TORNADO | SEVERE_THUNDERSTORM | FLASH_FLOOD | HURRICANE | WINTER_STORM" }
      - { name: max_wind_mph, type: integer, source: input, default: 0, description: "Peak observed/expected wind gust mph; updatable via PUT" }
      - { name: max_hail_inches, type: number, source: input, default: 0, description: "Peak hail size inches" }
      - { name: rainfall_rate_in_hr, type: number, source: input, default: 0, description: "Peak rainfall rate inches/hour" }
      - { name: rotation_couplet, type: boolean, source: input, default: false, description: "Radar rotation couplet detected (tornado criterion)" }
      - { name: debris_signature, type: boolean, source: input, default: false, description: "Tornado debris signature confirmed (gates CATASTROPHIC tag)" }
      - { name: motion_degrees, type: integer, source: input, default: 0, description: "Storm motion direction degrees" }
      - { name: speed_kt, type: integer, source: input, default: 0, description: "Storm motion speed knots" }
      - { name: detected_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: status, type: enum, source: system, description: "DETECTED -> TRACKING -> DISSIPATED" }
      - { name: dissipated_at, type: datetime, source: system, description: "Set on dissipate; null otherwise" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_level, type: enum, source: input, description: "OUTLOOK | WATCH | ADVISORY | WARNING" }
      - { name: hazard_type, type: enum, source: input, description: "Same hazard enum as StormEvent" }
      - { name: issuing_office_id, type: string, source: input, description: "FK -> ForecastOffice.id; office issuing this product" }
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; required for WARNING and polygon ADVISORY; null for OUTLOOK and zone-based WATCH" }
      - { name: zone_ids, type: array, source: input, description: "CountyZone id list (county-based products); required non-empty for OUTLOOK/WATCH and for zone-based ADVISORY; forbidden when polygon is supplied" }
      - { name: polygon, type: object, source: input, description: "{ vertices: [{lat, lon}, ...] } storm-based threat area; 3..12 vertices, must be convex; required for WARNING; forbidden for OUTLOOK/WATCH" }
      - { name: resolved_zone_ids, type: array, source: computed, description: "CountyZone ids whose overlap_pct >= 0.10 with the polygon (polygon products) or a copy of zone_ids (zone-based products); frozen at creation" }
      - { name: polygon_area_sq_km, type: number, source: computed, description: "Polygon area per office.area_method (calculations.polygon_area_sq_km); null for zone-based products" }
      - { name: damage_threat, type: enum, source: computed, description: "NONE | CONSIDERABLE | CATASTROPHIC — impact tag from calculations.impact_tier_scoring; client input is ignored" }
      - { name: wea_360, type: boolean, source: computed, description: "True iff damage_threat != NONE; drives WEA 360-char alert behavior" }
      - { name: effective_from, type: datetime, source: input, description: "Window start; for WARNING/ADVISORY the server overwrites with issued_at at issue; for OUTLOOK/WATCH a future onset is allowed" }
      - { name: expires_at, type: datetime, source: input, description: "Window end (exclusive at the instant itself: the product is active on [issued_at, window_end))" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issue; null until ISSUED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical clock at cancel; null otherwise" }
      - { name: superseded_at, type: datetime, source: system, description: "Logical clock when a superseding product issued; null otherwise" }
      - { name: expired_at, type: datetime, source: system, description: "Set to expires_at on clock-driven expiry; null otherwise" }
      - { name: window_end, type: datetime, source: computed, description: "Earliest non-null of (cancelled_at, superseded_at, expires_at); verification active window is [issued_at, window_end)" }
      - { name: supersedes_product_id, type: string, source: input, description: "FK -> Product.id; the product this one replaces (upgrade/continuation/correction chain); null for fresh issuances" }
      - { name: supersede_reason, type: enum, source: input, description: "UPGRADE | CONTINUATION | CORRECTION; required iff supersedes_product_id is present" }
      - { name: coordination_required, type: boolean, source: computed, description: "True when geometry or hazard criterion forces neighbor coordination (calculations.coordination_requirement)" }
      - { name: verified_event_count, type: integer, source: computed, default: 0, description: "CONFIRMED VerificationEvents matched to this product (POLYGON_STRICT rule) at adjudication time" }
      - { name: verification_status, type: enum, source: computed, default: UNVERIFIED, description: "UNVERIFIED | VERIFIED — flips when verified_event_count goes 0 -> >=1" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_COORDINATION -> ISSUED -> EXPIRED | CANCELLED | SUPERSEDED" }

  - name: CoordinationRequest
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product awaiting coordination" }
      - { name: from_office_id, type: string, source: system, description: "FK -> ForecastOffice.id; issuing office" }
      - { name: to_office_id, type: string, source: system, description: "FK -> ForecastOffice.id; neighbor office that must respond" }
      - { name: hazard_type, type: enum, source: system, description: "Copied from the product at submit time" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ACKNOWLEDGED | DECLINED | EXPIRED | CANCELLED | OVERRIDDEN" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock at submit-coordination" }
      - { name: deadline_at, type: datetime, source: system, description: "requested_at + agreement.coordination_timeout_minutes" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock at respond; null while REQUESTED/EXPIRED/CANCELLED/OVERRIDDEN" }

  - name: DisseminationRecord
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product being disseminated" }
      - { name: channel_id, type: string, source: system, description: "FK -> AlertChannel.id; destination channel as eligible at issue time" }
      - { name: channel_type, type: enum, source: system, description: "Copied from AlertChannel at record creation" }
      - { name: status, type: enum, source: system, description: "QUEUED -> SENT -> CONFIRMED | FAILED -> QUEUED (retry) | DEAD; QUEUED -> WITHDRAWN" }
      - { name: rendered_message, type: string, source: system, description: "Channel-formatted message after zone truncation (calculations.wea_message_rendering)" }
      - { name: included_zone_ids, type: array, source: system, description: "Zone ids surviving WEA truncation, in rendered order" }
      - { name: retry_count, type: integer, source: system, default: 0, description: "Increments on each FAILED settle; at MAX_RETRIES (3) the record goes DEAD" }
      - { name: queued_at, type: datetime, source: system, description: "Logical clock when the record (re)entered QUEUED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock of last dispatch; null until first SENT" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock of confirmation; null until CONFIRMED" }

  - name: VerificationEvent
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> CountyZone.id; zone where the hazard was observed" }
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; optional link to a tracked storm (nullable)" }
      - { name: hazard_type, type: enum, source: input, description: "Observed hazard" }
      - { name: observed_at, type: datetime, source: input, description: "When the hazard actually occurred" }
      - { name: location_lat, type: number, source: input, description: "Observation latitude" }
      - { name: location_lon, type: number, source: input, description: "Observation longitude" }
      - { name: magnitude, type: string, source: input, description: "Free-form magnitude, e.g. EF2 or 60mph" }
      - { name: status, type: enum, source: system, description: "REPORTED -> CONFIRMED | REJECTED" }
      - { name: matched_product_ids, type: array, source: computed, description: "Product ids this event verified under POLYGON_STRICT at CONFIRM time (hazard match, point in polygon, observed_at in [issued_at, window_end)); empty array when none" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical clock at adjudication; null while REPORTED" }

  - name: VerificationStatistic
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> ForecastOffice.id; office under review" }
      - { name: hazard_type, type: enum, source: input, description: "Hazard filter for the snapshot" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive period end" }
      - { name: matching_variant, type: enum, source: input, description: "POLYGON_STRICT | COUNTY_FALLBACK — selects calculations.verification_matching variant" }
      - { name: total_warnings, type: integer, source: computed, description: "WARNING products of the office+hazard with issued_at in [period_start, period_end)" }
      - { name: events_total, type: integer, source: computed, description: "CONFIRMED VerificationEvents of the office's zones+hazard with observed_at in [period_start, period_end)" }
      - { name: events_warned, type: integer, source: computed, description: "Events matched by at least one in-scope warning under the chosen variant" }
      - { name: events_unwarned, type: integer, source: computed, description: "events_total - events_warned" }
      - { name: false_alarms, type: integer, source: computed, description: "In-scope warnings matching zero events" }
      - { name: pod, type: number, source: computed, description: "Probability of detection = events_warned / events_total, 3 decimals round_half_up; null when events_total == 0" }
      - { name: far, type: number, source: computed, description: "False alarm ratio = false_alarms / total_warnings, 3 decimals round_half_up; null when total_warnings == 0" }
      - { name: avg_lead_time_minutes, type: number, source: computed, description: "Mean over warned events of floor((observed_at - earliest matching warning.issued_at) in whole minutes), 1 decimal round_half_up; null when events_warned == 0" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock at compute time" }

  - name: EmergencyAction
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> CountyZone.id; zone the action covers" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the warning driving this action" }
      - { name: action_type, type: enum, source: input, description: "EVACUATION | SHELTER_IN_PLACE | SHELTER_OPEN" }
      - { name: effective_from, type: datetime, source: input, description: "Planned action window start" }
      - { name: effective_until, type: datetime, source: input, description: "Planned action window end; must be > effective_from" }
      - { name: status, type: enum, source: system, description: "RECOMMENDED -> ORDERED -> LIFTED; RECOMMENDED -> WITHDRAWN" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the EmergencyManager who created the action" }
      - { name: ordered_at, type: datetime, source: system, description: "Logical clock at ORDER; null until ORDERED" }
      - { name: lifted_at, type: datetime, source: system, description: "Logical clock at LIFT; null until LIFTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_COORDINATION
        trigger: "POST /alerts/products/{id}/submit-coordination"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions:
          - "coordination_required == true (else ERR_INVALID_PRODUCT_STATE: coordination not required)"
          - "every cross-CWA zone/polygon office has a NeighborAgreement covering hazard_type (else ERR_ZONE_OUTSIDE_CWA / ERR_POLYGON_OUTSIDE_CWA)"
        side_effects:
          - "creates one CoordinationRequest (status REQUESTED) per required neighbor office, requested_at = now, deadline_at = now + agreement.coordination_timeout_minutes"
      - from: PENDING_COORDINATION
        to: ISSUED
        trigger: "POST /alerts/products/{id}/issue"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions:
          - "expected_product_version matches Product.version (else ERR_STALE_VERSION)"
          - "all linked CoordinationRequests are ACKNOWLEDGED (else ERR_COORDINATION_NOT_ACKED), unless coordination_override=true by a MIC (then non-terminal requests become OVERRIDDEN)"
          - "all issue-time validations pass (criteria, window, duration, overlap, geometry, supersede chain)"
        side_effects:
          - "issued_at = now; for WARNING/ADVISORY effective_from is overwritten with issued_at"
          - "damage_threat and wea_360 recomputed from the linked StormEvent's current readings"
          - "if supersedes_product_id set: the prior Product transitions ISSUED -> SUPERSEDED (superseded_at = now, version +1)"
          - "creates one DisseminationRecord per eligible ACTIVE AlertChannel (status QUEUED, queued_at = now); on WEA channels the message is truncated per calculations.wea_message_rendering"
          - "increments Product.version by 1"
      - from: DRAFT
        to: ISSUED
        trigger: "POST /alerts/products/{id}/issue"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions:
          - "expected_product_version matches Product.version (else ERR_STALE_VERSION)"
          - "coordination_required == false; if required and every required office is satisfiable (agreement exists) but coordination was never submitted: ERR_COORDINATION_NOT_ACKED; if any required office is unsatisfiable (no covering NeighborAgreement): the referential error ERR_ZONE_OUTSIDE_CWA / ERR_POLYGON_OUTSIDE_CWA at priority 11, never ERR_COORDINATION_NOT_ACKED"
          - "all issue-time validations pass"
        side_effects:
          - "same issue side effects as PENDING_COORDINATION -> ISSUED"
      - from: PENDING_COORDINATION
        to: DRAFT
        trigger: "system (a linked CoordinationRequest is DECLINED, or clock advance expires the last REQUESTED request with not all requests ACKNOWLEDGED)"
        actor: system
        preconditions: []
        side_effects:
          - "every still-REQUESTED sibling CoordinationRequest transitions to CANCELLED (this mutation is caused by the product's reversion, not by the original decline)"
        note: "coordination-revert loop: the product may be re-submitted from DRAFT"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /alerts/products/{id}/cancel"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions: []
        side_effects:
          - "cancelled_at = now; window_end recomputes"
          - "linked DisseminationRecords in QUEUED transition to WITHDRAWN (SENT/CONFIRMED/FAILED/DEAD records are unaffected)"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a Product whose supersedes_product_id names this product successfully issues)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_at = now (== the superseding product's issued_at); window_end recomputes"
          - "this Product's QUEUED DisseminationRecords transition to WITHDRAWN (mutation caused by the supersession)"
          - "this Product's still-REQUESTED CoordinationRequests transition to CANCELLED (mutation caused by the supersession)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc advances the logical clock to >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "expired_at = expires_at; window_end recomputes"
          - "QUEUED DisseminationRecords transition to WITHDRAWN during the same clock advance"

  - entity: CoordinationRequest
    initial_state: REQUESTED
    terminal_states: [ACKNOWLEDGED, DECLINED, EXPIRED, CANCELLED, OVERRIDDEN]
    transitions:
      - from: REQUESTED
        to: ACKNOWLEDGED
        trigger: "POST /alerts/coordination-requests/{id}/respond with outcome=ACKNOWLEDGED"
        actor: "Forecaster | MeteorologistInCharge (office scope: to_office_id)"
        preconditions: []
        side_effects: ["responded_at = now"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /alerts/coordination-requests/{id}/respond with outcome=DECLINED"
        actor: "Forecaster | MeteorologistInCharge (office scope: to_office_id)"
        preconditions: []
        side_effects:
          - "responded_at = now"
          - "the linked Product transitions PENDING_COORDINATION -> DRAFT (caused by this decline)"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (clock advance to >= deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "if the linked Product is PENDING_COORDINATION and no REQUESTED requests remain and not all are ACKNOWLEDGED: the Product reverts to DRAFT"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (cascade: the linked Product left PENDING_COORDINATION via decline-revert, expiry-revert, or supersession)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: OVERRIDDEN
        trigger: "system (a MIC issued the linked Product with coordination_override=true)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DisseminationRecord
    initial_state: QUEUED
    terminal_states: [CONFIRMED, WITHDRAWN, DEAD]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "system (clock advance dispatches QUEUED records whose product is ISSUED)"
        actor: system
        preconditions: ["linked Product.status == ISSUED"]
        side_effects:
          - "sent_at = now"
          - "if the channel's requires_confirmation == false: immediately transitions SENT -> CONFIRMED with confirmed_at = now in the same advance"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "system (clock dispatch finds product no longer ISSUED, or the product was CANCELLED/SUPERSEDED while the record was QUEUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: CONFIRMED
        trigger: "POST /_dissemination/settle with outcome=CONFIRMED (or automatic at dispatch when requires_confirmation == false)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["confirmed_at = now"]
      - from: SENT
        to: FAILED
        trigger: "POST /_dissemination/settle with outcome=FAILED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "retry_count += 1"
          - "if retry_count < MAX_RETRIES (3): immediately transitions FAILED -> QUEUED with queued_at = now (retry cycle)"
          - "if retry_count == MAX_RETRIES (3): transitions to DEAD instead"

  - entity: StormEvent
    initial_state: DETECTED
    terminal_states: [DISSIPATED]
    transitions:
      - from: DETECTED
        to: TRACKING
        trigger: "system (first successful PUT /alerts/storm-events/{id})"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions: []
        side_effects: []
      - from: TRACKING
        to: TRACKING
        trigger: "PUT /alerts/storm-events/{id} (subsequent reading updates)"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions: ["expected_storm_event_version matches StormEvent.version (else ERR_STALE_VERSION)"]
        side_effects: ["increments StormEvent.version by 1"]
      - from: DETECTED
        to: DISSIPATED
        trigger: "POST /alerts/storm-events/{id}/dissipate"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions: []
        side_effects: ["dissipated_at = now"]
      - from: TRACKING
        to: DISSIPATED
        trigger: "POST /alerts/storm-events/{id}/dissipate"
        actor: "Forecaster | MeteorologistInCharge"
        preconditions: []
        side_effects: ["dissipated_at = now"]

  - entity: VerificationEvent
    initial_state: REPORTED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /alerts/verification-events/{id}/adjudicate with outcome=CONFIRMED"
        actor: VerificationAnalyst
        preconditions: []
        side_effects:
          - "adjudicated_at = now; matched_product_ids computed (POLYGON_STRICT over all offices' products)"
          - "for each matched Product: verified_event_count += 1 (this mutation flips verification_status to VERIFIED when the count leaves 0)"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /alerts/verification-events/{id}/adjudicate with outcome=REJECTED"
        actor: VerificationAnalyst
        preconditions: []
        side_effects: ["adjudicated_at = now; matched_product_ids stays empty; no Product is touched"]

  - entity: EmergencyAction
    initial_state: RECOMMENDED
    terminal_states: [LIFTED, WITHDRAWN]
    transitions:
      - from: RECOMMENDED
        to: ORDERED
        trigger: "POST /alerts/emergency-actions/{id}/order"
        actor: EmergencyManager
        preconditions:
          - "linked Product.status == ISSUED (else ERR_INVALID_PRODUCT_STATE)"
          - "zone_id is in the linked Product's resolved_zone_ids (else ERR_ZONE_NOT_COVERED_BY_PRODUCT)"
          - "EVACUATION re-entry buffer: for every same-zone EVACUATION action in ORDERED or LIFTED, effective_from >= coalesce(lifted_at, effective_until) + 60 minutes (equality allowed; else ERR_EVACUATION_WINDOW_CONFLICT)"
        side_effects: ["ordered_at = now"]
      - from: ORDERED
        to: LIFTED
        trigger: "POST /alerts/emergency-actions/{id}/lift"
        actor: EmergencyManager
        preconditions: []
        side_effects: ["lifted_at = now"]
      - from: RECOMMENDED
        to: WITHDRAWN
        trigger: "POST /alerts/emergency-actions/{id}/lift (from RECOMMENDED the same endpoint withdraws the recommendation)"
        actor: EmergencyManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: product-issue-stale-version
    parent_entity: Product
    write_endpoint: "POST /alerts/products/{id}/issue"
    occ_field: "expected_product_version"
    description: |
      Issuing a Product whose version has advanced since the client last
      observed it (e.g. a coordination-revert bumped the version after the
      client captured it) is rejected as a stale view. The client must re-read
      the product and re-issue with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: storm-event-update-stale-version
    parent_entity: StormEvent
    write_endpoint: "PUT /alerts/storm-events/{id}"
    occ_field: "expected_storm_event_version"
    description: |
      Updating a StormEvent's readings against a version that no longer
      matches the stored version is rejected as a stale view, so a second
      writer cannot silently overwrite another writer's newer readings.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: polygon_area_sq_km
    trigger: "Product creation with a polygon (and overlap evaluation wherever overlap area is needed)"
    algorithm: weighted_scoring
    formula: |
      KM_PER_DEG = 111.0
      cos_factor = 1.0                        when office.area_method == PLANAR
      cos_factor = cos(polygon centroid lat)  when office.area_method == GEODETIC
      Convert each vertex: x_km = lon * KM_PER_DEG * cos_factor, y_km = lat * KM_PER_DEG.
      area = abs(sum over edges of (x_i * y_{i+1} - x_{i+1} * y_i)) / 2
      polygon_area_sq_km = round_half_up(area, 2)
    input_set: "Product.polygon.vertices; ForecastOffice.area_method"
    constants:
      KM_PER_DEG: 111.0
    precision: "2 decimal places, round_half_up, applied once to the final shoelace sum"
    variants:
      - name: PLANAR
        when: "office.area_method == PLANAR"
        difference: "cos_factor = 1.0 at all latitudes"
      - name: GEODETIC
        when: "office.area_method == GEODETIC"
        difference: "cos_factor = cos(centroid latitude); at 60 degrees latitude the x extent is halved, so the same vertices yield a different polygon_area_sq_km"

  - name: zone_overlap_resolution
    trigger: "Product creation with a polygon (frozen into resolved_zone_ids)"
    algorithm: aggregation
    formula: |
      For every CountyZone (any office), clip the convex polygon to the zone's
      axis-aligned rectangle (Sutherland-Hodgman in km space using the issuing
      office's area_method), then:
        overlap_sq_km = round_half_up(shoelace_area(clipped), 2)
        overlap_pct   = round_half_up(overlap_sq_km / zone.surveyed_area_sq_km, 3)
      The zone is included in resolved_zone_ids iff overlap_pct >= 0.10.
      The per-zone overlap is rounded to 2 decimals BEFORE the percentage
      division; dividing the unrounded area and rounding afterwards is the
      forbidden alternative order.
      resolved_zone_ids are sorted by zone_code ascending.
      Point/edge contact (overlap_sq_km == 0) never includes a zone.
    input_set: "all CountyZone rows; Product.polygon; issuing office area_method"
    constants:
      ZONE_INCLUSION_MIN_PCT: 0.10
    precision: "overlap_sq_km 2 decimals then overlap_pct 3 decimals, both round_half_up, in that order"

  - name: impact_tier_scoring
    trigger: "Product creation and again at issue (damage_threat, wea_360)"
    algorithm: threshold
    formula: |
      readings = linked StormEvent current readings (zero/false when no storm linked)
      catastrophic_qualified = (max_wind_mph >= 80) OR (max_hail_inches >= 2.75) OR (debris_signature == true)
      considerable_qualified = (max_wind_mph >= 70) OR (max_hail_inches >= 1.75)
      resolved population tiers = population_tier of each zone in resolved_zone_ids
      if catastrophic_qualified AND any resolved tier in {HIGH, URBAN}: damage_threat = CATASTROPHIC
      elif considerable_qualified AND any resolved tier in {MEDIUM, HIGH, URBAN}: damage_threat = CONSIDERABLE
      elif catastrophic_qualified AND any resolved tier in {MEDIUM}: damage_threat = CONSIDERABLE
      else: damage_threat = NONE
      wea_360 = (damage_threat != NONE)
    input_set: "StormEvent readings; resolved CountyZone population_tiers"
    constants:
      CATASTROPHIC_WIND_MPH: 80
      CATASTROPHIC_HAIL_INCHES: 2.75
      CONSIDERABLE_WIND_MPH: 70
      CONSIDERABLE_HAIL_INCHES: 1.75
    precision: "integer/decimal comparisons, >= is inclusive"

  - name: issuance_criteria_evaluation
    trigger: "POST /alerts/products/{id}/issue (evaluated against the linked StormEvent's CURRENT readings)"
    algorithm: threshold
    formula: |
      WARNING is issuable iff ANY warning threshold for the hazard is met:
        SEVERE_THUNDERSTORM: max_wind_mph >= 58 OR max_hail_inches >= 1.00
        TORNADO:             rotation_couplet == true OR debris_signature == true
        FLASH_FLOOD:         rainfall_rate_in_hr >= 2.0
        HURRICANE:           max_wind_mph >= 74
        WINTER_STORM:        max_wind_mph >= 35
      ADVISORY is issuable iff ANY advisory floor is met (warning-level readings also permit ADVISORY):
        SEVERE_THUNDERSTORM: max_wind_mph >= 40 OR max_hail_inches >= 0.75
        TORNADO:             rotation_couplet == true
        FLASH_FLOOD:         rainfall_rate_in_hr >= 1.0
        HURRICANE:           max_wind_mph >= 39
        WINTER_STORM:        max_wind_mph >= 25
      WATCH and OUTLOOK have no reading-based criterion.
      Failure -> ERR_ISSUANCE_CRITERIA_NOT_MET.
      Duration check (WARNING/ADVISORY only): min_duration_minutes <= (expires_at - effective_from) minutes <= max_duration_minutes, else ERR_DURATION_OUT_OF_RANGE:
        SEVERE_THUNDERSTORM 15..120, TORNADO 15..90, FLASH_FLOOD 30..180, HURRICANE 60..720, WINTER_STORM 60..720.
    input_set: "StormEvent current readings; Product.product_level and hazard_type"
    constants:
      SEVERE_WARNING_WIND_MPH: 58
      SEVERE_WARNING_HAIL_IN: 1.00
      SEVERE_ADVISORY_WIND_MPH: 40
      SEVERE_ADVISORY_HAIL_IN: 0.75
      FLOOD_WARNING_RAIN_IN_HR: 2.0
      FLOOD_ADVISORY_RAIN_IN_HR: 1.0
      HURRICANE_WARNING_WIND_MPH: 74
      HURRICANE_ADVISORY_WIND_MPH: 39
      WINTER_WARNING_WIND_MPH: 35
      WINTER_ADVISORY_WIND_MPH: 25
    precision: ">= is inclusive at every threshold"

  - name: wea_message_rendering
    trigger: "DisseminationRecord creation on a WEA channel; GET /alerts/products/{id}/wea-preview"
    algorithm: constraint_propagation
    formula: |
      message = "WEA " + hazard_type + " " + damage_threat + " " + zone_codes_csv + " " + HHmm(expires_at) + "Z"
      zone_codes_csv = resolved zone_codes sorted ascending, joined by ","
      budget = min(360, channel.max_message_chars)
      Evaluation order is pinned to break the message-length <-> zone-set circle:
        (1) compute the included set with overlap_pct >= 0.10 exactly once;
        (2) render the message;
        (3) while len(message) > budget AND more than one zone remains:
              remove the zone with the SMALLEST overlap_pct (ties: the lexicographically GREATEST zone_code), re-render;
        (4) the 0.10 inclusion threshold is NEVER recomputed after drops;
        (5) if one zone remains and len(message) > budget: issue fails with ERR_MESSAGE_FORMAT_OVERFLOW (preview reports would_overflow = true).
      dropped zones are recorded in drop order.
    input_set: "Product resolved zones and their overlap_pct; AlertChannel.max_message_chars"
    constants:
      WEA_ABSOLUTE_MAX_CHARS: 360
    precision: "character counts are exact string lengths"

  - name: verification_matching
    trigger: "VerificationEvent CONFIRM adjudication (matching Product mutation); VerificationStatistic compute (set membership)"
    algorithm: projection
    formula: |
      An event E matches a product P iff:
        E.status == CONFIRMED AND E.hazard_type == P.hazard_type AND
        P.product_level == WARNING AND P.issued_at <= E.observed_at < P.window_end AND
        containment (variant-dependent, see variants).
      Polygon boundary points count as inside (inclusive).
      A product cancelled/superseded before E.observed_at does not match (window_end closed the window).
    input_set: "CONFIRMED VerificationEvents; Products with product_level == WARNING"
    precision: "datetime comparisons to the second; >= inclusive at issued_at, exclusive at window_end"
    variants:
      - name: POLYGON_STRICT
        when: "adjudication-time Product mutation, and VerificationStatistic when matching_variant == POLYGON_STRICT"
        difference: "containment = the event's (location_lat, location_lon) lies inside P.polygon; polygon-less warnings match nothing"
      - name: COUNTY_FALLBACK
        when: "VerificationStatistic when matching_variant == COUNTY_FALLBACK"
        difference: "containment = E.zone_id is in P.resolved_zone_ids; an event in a covered county but outside the drawn polygon still counts as warned, raising pod and lowering far relative to POLYGON_STRICT"

  - name: verification_statistics_aggregation
    trigger: "POST /alerts/verification-statistics"
    algorithm: aggregation
    formula: |
      warnings = Products with issuing_office_id == office_id, hazard_type match,
                 product_level == WARNING, issued_at in [period_start, period_end)
      events   = CONFIRMED VerificationEvents whose zone's office_id == office_id,
                 hazard_type match, observed_at in [period_start, period_end)
      Matching uses the requested calculations.verification_matching variant.
      An event matched by several warnings counts ONCE as warned.
      per_event_lead_minutes = floor((E.observed_at - earliest_matching_warning.issued_at) in seconds / 60)
      avg_lead_time_minutes = round_half_up(mean(per_event_lead_minutes over warned events), 1); null if none warned.
      Rounding order is pinned: per-event leads are floored to whole minutes FIRST,
      then the mean is computed and rounded — averaging raw seconds then converting
      is the forbidden alternative order.
      pod = round_half_up(events_warned / events_total, 3); null when events_total == 0
      far = round_half_up(false_alarms / total_warnings, 3); null when total_warnings == 0
    input_set: "office-scoped WARNING products and CONFIRMED events inside the half-open period"
    precision: "per-event floor to whole minutes; mean round_half_up 1 decimal; pod/far round_half_up 3 decimals"

  - name: performance_band_derivation
    trigger: "successful POST /alerts/verification-statistics (office mutation cascades from the statistic creation)"
    algorithm: threshold
    formula: |
      band-source = the newly created VerificationStatistic
      if band-source.far != null AND band-source.far > 0.70: performance_band = REVIEW_REQUIRED
      elif band-source.pod != null AND band-source.pod < 0.50: performance_band = REVIEW_REQUIRED
      else: performance_band = SATISFACTORY
      office.last_statistic_at = statistic.computed_at; office.version increments.
    input_set: "the newly created VerificationStatistic"
    constants:
      FAR_REVIEW_THRESHOLD: 0.70
      POD_REVIEW_THRESHOLD: 0.50
    precision: "strict > for far, strict < for pod; a pod of exactly 0.500 stays SATISFACTORY"

  - name: coordination_requirement
    trigger: "Product creation (sets coordination_required); submit-coordination and issue enforce it"
    algorithm: aggregation
    formula: |
      geometry_offices = offices owning any zone_id in zone_ids, plus offices owning any
                         CountyZone with overlap_pct > 0 against the polygon
      required_offices = (geometry_offices - {issuing_office})
                         UNION (all NeighborAgreement partners of the issuing office, when the hazard is HURRICANE)
      A required office is satisfiable iff a NeighborAgreement exists between it and the
      issuing office covering the hazard.
      coordination_required = (required_offices is non-empty)
      submit-coordination creates one REQUESTED CoordinationRequest per required office;
      an unsatisfiable required office rejects the submit (ERR_ZONE_OUTSIDE_CWA for a
      zone-listed office, ERR_POLYGON_OUTSIDE_CWA for a polygon-overlap office).
      issue from DRAFT with coordination_required == true fails ERR_COORDINATION_NOT_ACKED.
    input_set: "Product geometry; CountyZone ownership; NeighborAgreement coverage"
    precision: "set semantics; polygon contact with overlap_pct == 0 does not add an office"

  - name: product_window_overlap
    trigger: "POST /alerts/products/{id}/issue"
    algorithm: interval_merge
    formula: |
      Reject ERR_PRODUCT_OVERLAP_CONFLICT when another Product P exists with:
        P.issuing_office_id == this.issuing_office_id AND P.hazard_type == this.hazard_type AND
        P.product_level == this.product_level AND P.status == ISSUED AND
        P.id != this.supersedes_product_id AND
        half-open window intersection: this.effective_from < P.expires_at AND P.effective_from < this.expires_at AND
        scope intersection: resolved_zone_ids share at least one zone.
      Adjacency (this.effective_from == P.expires_at) is allowed: zero-length intersection is not a conflict.
    input_set: "ISSUED products of the same office, hazard and level"
    precision: "strict < on both window comparisons; equality at the touching instant is allowed"

  - name: evacuation_reentry_buffer
    trigger: "POST /alerts/emergency-actions/{id}/order"
    algorithm: interval_merge
    formula: |
      For EVACUATION actions only, for every other EmergencyAction A with
      A.zone_id == this.zone_id, A.action_type == EVACUATION, A.status in {ORDERED, LIFTED}:
        prior_end = coalesce(A.lifted_at, A.effective_until)
        require this.effective_from >= prior_end + 60 minutes  (equality allowed)
      Violation -> ERR_EVACUATION_WINDOW_CONFLICT.
      Unlike product_window_overlap this is a closed-interval buffer rule:
      even non-overlapping windows conflict when the gap is under 60 minutes.
    input_set: "same-zone EVACUATION EmergencyActions in ORDERED or LIFTED"
    constants:
      EVAC_REENTRY_BUFFER_MINUTES: 60
    precision: ">= comparison; a gap of exactly 60 minutes passes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present; for entity_backed roles X-User-ID must resolve to an existing Forecaster row", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "coordination_override=true requires the caller's Forecaster.level == MIC; Forecaster/MIC office scope: forecaster.office_id must equal the product's/storm's owning office, or the CoordinationRequest.to_office_id", error_id: "ERR_MIC_REQUIRED | ERR_OFFICE_SCOPE_VIOLATION", http_status: 403, applies_to: "issue with coordination_override; product/storm/coordination writes" }
  - { priority: 4, category: existence, check: "Request schema: required fields present, enums valid, polygon has 3..12 vertices; unknown fields ignored", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 5, category: existence, check: "Path ids exist (left-to-right), then body FK ids exist (office/zone/storm/product/channel/record)", error_id: "ERR_PRODUCT_NOT_FOUND | ERR_STORM_EVENT_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_OFFICE_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_COORDINATION_REQUEST_NOT_FOUND | ERR_VERIFICATION_EVENT_NOT_FOUND | ERR_EMERGENCY_ACTION_NOT_FOUND | ERR_DISSEMINATION_RECORD_NOT_FOUND", http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 6, category: state, check: "expected_*_version matches the stored version of the guarded entity", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /alerts/storm-events/{id}; POST /alerts/products/{id}/issue" }
  - { priority: 7, category: state, check: "State machine precondition for the invoked transition (from-state valid; supersede target ISSUED; coordination ACKED; storm not DISSIPATED for WARNING/ADVISORY issue)", error_id: "ERR_INVALID_PRODUCT_STATE | ERR_INVALID_COORDINATION_STATE | ERR_INVALID_EVENT_STATE | ERR_INVALID_EM_ACTION_STATE | ERR_INVALID_STORM_STATE | ERR_RECORD_NOT_SETTLABLE | ERR_COORDINATION_NOT_ACKED", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8, category: business_safety, check: "Issuance criteria for the requested level met by current storm readings; polygon convex and non-degenerate", error_id: "ERR_ISSUANCE_CRITERIA_NOT_MET | ERR_POLYGON_INVALID", http_status: 422, applies_to: "POST /alerts/products; POST /alerts/products/{id}/issue" }
  - { priority: 9, category: business_temporal, check: "expires_at > effective_from; WARNING/ADVISORY duration within criterion range; OUTLOOK/WATCH effective_from >= now", error_id: "ERR_WINDOW_INVALID | ERR_DURATION_OUT_OF_RANGE | ERR_EFFECTIVE_IN_PAST", http_status: 422, applies_to: "POST /alerts/products; POST /alerts/products/{id}/issue; POST /alerts/emergency-actions" }
  - { priority: 10, category: business_constraint, check: "Supersede chain shape (UPGRADE: WATCH->WARNING same hazard; CONTINUATION/CORRECTION: same level+hazard; prior not past expires_at); product window overlap; evacuation re-entry buffer; duplicate neighbor agreement; WEA message fits budget", error_id: "ERR_INVALID_SUPERSEDE_CHAIN | ERR_PRODUCT_OVERLAP_CONFLICT | ERR_EVACUATION_WINDOW_CONFLICT | ERR_DUPLICATE_AGREEMENT | ERR_MESSAGE_FORMAT_OVERFLOW", http_status: 422, applies_to: "issue, order, agreement create" }
  - { priority: 11, category: business_referential, check: "Cross-CWA geometry has a covering NeighborAgreement; emergency action zone is covered by the linked product", error_id: "ERR_ZONE_OUTSIDE_CWA | ERR_POLYGON_OUTSIDE_CWA | ERR_ZONE_NOT_COVERED_BY_PRODUCT", http_status: 422, applies_to: "submit-coordination, issue, order" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- ForecastOffice (config) ---
  - { method: POST, path: "/alerts/offices", description: "Create a forecast office", roles: [PlatformAdmin], code: 201, input: [office_code, name, region, "area_method?"], output: ForecastOffice, side_effects: ["performance_band=SATISFACTORY, last_statistic_at=null"] }
  - { method: GET, path: "/alerts/offices/{id}", description: "Get one office (reads performance_band)", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: ForecastOffice, side_effects: [] }
  - { method: GET, path: "/alerts/offices/{id}/zones", description: "List zones owned by an office", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["limit?", "offset?"], output: "CountyZone[]", side_effects: [] }
  - { method: GET, path: "/alerts/offices/{id}/forecasters", description: "List forecasters of an office", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["limit?", "offset?"], output: "Forecaster[]", side_effects: [] }
  - { method: GET, path: "/alerts/offices/{id}/neighbor-agreements", description: "List agreements where the office is party A or B", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["limit?", "offset?"], output: "NeighborAgreement[]", side_effects: [] }
  - { method: GET, path: "/alerts/offices/{id}/storm-events", description: "List storm events tracked by an office", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["status?", "limit?", "offset?"], output: "StormEvent[]", side_effects: [] }
  - { method: GET, path: "/alerts/offices/{id}/verification-statistics", description: "List computed statistics snapshots of an office", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["hazard_type?", "limit?", "offset?"], output: "VerificationStatistic[]", side_effects: [] }

  # --- CountyZone (config) ---
  - { method: POST, path: "/alerts/zones", description: "Create a county zone (axis-aligned rectangle) inside an office CWA", roles: [PlatformAdmin], code: 201, input: [zone_code, name, office_id, lat_min, lat_max, lon_min, lon_max, surveyed_area_sq_km, population_tier, "coastal?"], output: CountyZone, side_effects: [] }

  # --- NeighborAgreement (config) ---
  - { method: POST, path: "/alerts/neighbor-agreements", description: "Create a coordination agreement between two offices; duplicate unordered office pair is rejected", roles: [PlatformAdmin], code: 201, input: [office_a_id, office_b_id, hazard_types, "coordination_timeout_minutes?"], output: NeighborAgreement, side_effects: [] }

  # --- AlertChannel (config) ---
  - { method: POST, path: "/alerts/alert-channels", description: "Create a dissemination channel; WEA channels must declare max_message_chars <= 360", roles: [PlatformAdmin], code: 201, input: [name, channel_type, supports_levels, max_message_chars, "requires_confirmation?", "status?"], output: AlertChannel, side_effects: [] }

  # --- Forecaster (identity) ---
  - { method: POST, path: "/alerts/forecasters", description: "Register a forecaster (identity for Forecaster and MeteorologistInCharge roles)", roles: [PlatformAdmin], code: 201, input: [office_id, full_name, employee_code, level], output: Forecaster, side_effects: [] }

  # --- StormEvent ---
  - { method: POST, path: "/alerts/storm-events", description: "Open a storm event for tracking (caller office scope)", roles: [Forecaster, MeteorologistInCharge], code: 201, input: [office_id, hazard_type, "max_wind_mph?", "max_hail_inches?", "rainfall_rate_in_hr?", "rotation_couplet?", "debris_signature?", "motion_degrees?", "speed_kt?"], output: StormEvent, side_effects: ["status=DETECTED, detected_at=now"] }
  - { method: GET, path: "/alerts/storm-events/{id}", description: "Get one storm event", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: StormEvent, side_effects: [] }
  - { method: PUT, path: "/alerts/storm-events/{id}", description: "Update storm readings under OCC; first update flips DETECTED -> TRACKING", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [expected_storm_event_version, "max_wind_mph?", "max_hail_inches?", "rainfall_rate_in_hr?", "rotation_couplet?", "debris_signature?", "motion_degrees?", "speed_kt?"], output: StormEvent, side_effects: ["increments StormEvent.version by 1"] }
  - { method: POST, path: "/alerts/storm-events/{id}/dissipate", description: "Mark the storm dissipated; linked DRAFT products can no longer issue as WARNING/ADVISORY", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [], output: StormEvent, side_effects: ["status -> DISSIPATED, dissipated_at=now"] }

  # --- Product ---
  - { method: POST, path: "/alerts/products", description: "Create a DRAFT product. WARNING requires polygon + storm_event_id; OUTLOOK/WATCH require zone_ids and forbid polygon; ADVISORY takes exactly one of polygon/zone_ids. supersedes_product_id requires supersede_reason.", roles: [Forecaster, MeteorologistInCharge], code: 201, input: [product_level, hazard_type, issuing_office_id, expires_at, "storm_event_id?", "zone_ids?", "polygon?", "effective_from?", "supersedes_product_id?", "supersede_reason?"], output: Product, side_effects: ["resolved_zone_ids, polygon_area_sq_km, damage_threat, wea_360, coordination_required computed and frozen; status=DRAFT"] }
  - { method: GET, path: "/alerts/products/{id}", description: "Get one product", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/alerts/products", description: "List products with filters", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["issuing_office_id?", "storm_event_id?", "supersedes_product_id?", "status?", "hazard_type?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: POST, path: "/alerts/products/{id}/submit-coordination", description: "DRAFT -> PENDING_COORDINATION; spawns one REQUESTED CoordinationRequest per required neighbor office", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [], output: Product, side_effects: ["creates CoordinationRequests with per-agreement deadline_at"] }
  - { method: POST, path: "/alerts/products/{id}/issue", description: "Issue a product. expected_product_version is the issuing product's own last-observed version (OCC). coordination_override=true is MIC-only and turns non-terminal requests OVERRIDDEN.", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [expected_product_version, "coordination_override?"], output: Product, side_effects: ["issued_at=now; supersede target -> SUPERSEDED; creates DisseminationRecords per eligible channel; increments Product.version by 1"] }
  - { method: POST, path: "/alerts/products/{id}/cancel", description: "ISSUED -> CANCELLED; withdraws its QUEUED dissemination records", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [], output: Product, side_effects: ["cancelled_at=now; QUEUED DisseminationRecords -> WITHDRAWN"] }
  - { method: GET, path: "/alerts/products/{id}/wea-preview", description: "Preview the WEA render: message, surviving/dropped zones, char_count, overflow flag; 400 for polygon-less products", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [channel_id], output: "{ message: string, included_zone_ids: string[], dropped_zone_ids: string[], char_count: integer, would_overflow: boolean }", side_effects: [] }

  # --- CoordinationRequest ---
  - { method: GET, path: "/alerts/coordination-requests/{id}", description: "Get one coordination request", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: CoordinationRequest, side_effects: [] }
  - { method: GET, path: "/alerts/coordination-requests", description: "List coordination requests with filters", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["product_id?", "from_office_id?", "to_office_id?", "status?", "limit?", "offset?"], output: "CoordinationRequest[]", side_effects: [] }
  - { method: POST, path: "/alerts/coordination-requests/{id}/respond", description: "Neighbor office responds; DECLINED reverts the product to DRAFT and cancels sibling REQUESTED requests", roles: [Forecaster, MeteorologistInCharge], code: 200, input: [outcome], output: CoordinationRequest, side_effects: ["responded_at=now; on DECLINED: product PENDING_COORDINATION -> DRAFT, sibling REQUESTED -> CANCELLED"] }

  # --- DisseminationRecord ---
  - { method: GET, path: "/alerts/dissemination-records/{id}", description: "Get one dissemination record", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: DisseminationRecord, side_effects: [] }
  - { method: GET, path: "/alerts/dissemination-records", description: "List dissemination records with filters", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["product_id?", "channel_id?", "status?", "limit?", "offset?"], output: "DisseminationRecord[]", side_effects: [] }

  # --- VerificationEvent ---
  - { method: POST, path: "/alerts/verification-events", description: "Report an observed hazard event", roles: [VerificationAnalyst], code: 201, input: [zone_id, hazard_type, observed_at, location_lat, location_lon, magnitude, "storm_event_id?"], output: VerificationEvent, side_effects: ["status=REPORTED"] }
  - { method: GET, path: "/alerts/verification-events/{id}", description: "Get one verification event", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: VerificationEvent, side_effects: [] }
  - { method: GET, path: "/alerts/verification-events", description: "List verification events with filters", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["zone_id?", "storm_event_id?", "status?", "limit?", "offset?"], output: "VerificationEvent[]", side_effects: [] }
  - { method: POST, path: "/alerts/verification-events/{id}/adjudicate", description: "CONFIRM matches products (POLYGON_STRICT) and bumps their verified_event_count; REJECT touches nothing", roles: [VerificationAnalyst], code: 200, input: [outcome], output: VerificationEvent, side_effects: ["on CONFIRMED: matched Products verified_event_count += 1, verification_status -> VERIFIED when count leaves 0"] }

  # --- VerificationStatistic ---
  - { method: POST, path: "/alerts/verification-statistics", description: "Compute a verification snapshot for an office/hazard/period under a matching variant; cascades performance_band onto the office", roles: [VerificationAnalyst], code: 201, input: [office_id, hazard_type, period_start, period_end, matching_variant], output: VerificationStatistic, side_effects: ["office.performance_band recomputed from this statistic; office.last_statistic_at = computed_at; office.version +1"] }

  # --- EmergencyAction ---
  - { method: POST, path: "/alerts/emergency-actions", description: "Recommend an evacuation/shelter action for a zone driven by a warning", roles: [EmergencyManager], code: 201, input: [zone_id, product_id, action_type, effective_from, effective_until], output: EmergencyAction, side_effects: ["status=RECOMMENDED, decided_by=X-User-ID"] }
  - { method: GET, path: "/alerts/emergency-actions/{id}", description: "Get one emergency action", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: [], output: EmergencyAction, side_effects: [] }
  - { method: GET, path: "/alerts/emergency-actions", description: "List emergency actions with filters", roles: [PlatformAdmin, Forecaster, MeteorologistInCharge, VerificationAnalyst, EmergencyManager], code: 200, input: ["zone_id?", "product_id?", "status?", "limit?", "offset?"], output: "EmergencyAction[]", side_effects: [] }
  - { method: POST, path: "/alerts/emergency-actions/{id}/order", description: "RECOMMENDED -> ORDERED; requires the linked product ISSUED, zone coverage, and the evacuation re-entry buffer", roles: [EmergencyManager], code: 200, input: [], output: EmergencyAction, side_effects: ["ordered_at=now"] }
  - { method: POST, path: "/alerts/emergency-actions/{id}/lift", description: "ORDERED -> LIFTED (sets lifted_at); from RECOMMENDED withdraws the action", roles: [EmergencyManager], code: 200, input: [], output: EmergencyAction, side_effects: ["lifted_at=now"] }

  # --- Test-driving (logical clock + dissemination settle) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Advancing the clock expires ISSUED products past expires_at, expires REQUESTED coordination requests past deadline_at (reverting their products), and dispatches QUEUED dissemination records (SENT, auto-CONFIRMED when the channel needs no confirmation; WITHDRAWN when the product is no longer ISSUED).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["product expiry, coordination expiry + revert, record dispatch, in that order"] }
  - { method: POST, path: "/_dissemination/settle", description: "Settle a SENT record: outcome CONFIRMED -> CONFIRMED; outcome FAILED -> retry_count+1 then QUEUED (retry_count < 3) or DEAD (== 3). Rejects non-SENT records.", roles: [PlatformAdmin], code: 200, input: [record_id, outcome], output: DisseminationRecord, side_effects: ["DisseminationRecord status transition per retry rule"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, missing X-User-ID, or entity-backed X-User-ID does not resolve" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_MIC_REQUIRED, http: 403, condition: "coordination_override attempted by a caller whose Forecaster.level is not MIC" }
  - { id: ERR_OFFICE_SCOPE_VIOLATION, http: 403, condition: "Forecaster/MIC acting on a product, storm, or coordination request outside their office" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed polygon shape (vertex count outside 3..12), or forbidden field combination (polygon on OUTLOOK/WATCH)" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_STORM_EVENT_NOT_FOUND, http: 404, condition: "StormEvent id does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "CountyZone id does not exist (path or zone_ids/zone_id reference)" }
  - { id: ERR_OFFICE_NOT_FOUND, http: 404, condition: "ForecastOffice id does not exist" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "AlertChannel id does not exist" }
  - { id: ERR_COORDINATION_REQUEST_NOT_FOUND, http: 404, condition: "CoordinationRequest id does not exist" }
  - { id: ERR_VERIFICATION_EVENT_NOT_FOUND, http: 404, condition: "VerificationEvent id does not exist" }
  - { id: ERR_EMERGENCY_ACTION_NOT_FOUND, http: 404, condition: "EmergencyAction id does not exist" }
  - { id: ERR_DISSEMINATION_RECORD_NOT_FOUND, http: 404, condition: "DisseminationRecord id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the stored version (OCC)" }
  - { id: ERR_INVALID_PRODUCT_STATE, http: 409, condition: "Product not in a from-state for the requested transition; also: submit-coordination when coordination is not required; issue of a supersede product whose target is no longer ISSUED" }
  - { id: ERR_INVALID_COORDINATION_STATE, http: 409, condition: "CoordinationRequest not REQUESTED when respond is called" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "VerificationEvent not REPORTED when adjudicate is called" }
  - { id: ERR_INVALID_EM_ACTION_STATE, http: 409, condition: "EmergencyAction not in a from-state for order/lift" }
  - { id: ERR_INVALID_STORM_STATE, http: 409, condition: "WARNING/ADVISORY issue attempted against a DISSIPATED storm, or missing storm when required" }
  - { id: ERR_RECORD_NOT_SETTLABLE, http: 409, condition: "_dissemination/settle called on a record that is not SENT" }
  - { id: ERR_COORDINATION_NOT_ACKED, http: 409, condition: "Issue attempted while required coordination is incomplete and no valid MIC override" }
  - { id: ERR_ISSUANCE_CRITERIA_NOT_MET, http: 422, condition: "Current storm readings do not meet the requested product level's thresholds for the hazard" }
  - { id: ERR_POLYGON_INVALID, http: 422, condition: "Polygon is concave, self-intersecting, or degenerate (zero area)" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "expires_at <= effective_from (or, for WARNING/ADVISORY at issue, expires_at <= now)" }
  - { id: ERR_DURATION_OUT_OF_RANGE, http: 422, condition: "WARNING/ADVISORY (expires_at - effective_from) outside the hazard criterion's min..max duration" }
  - { id: ERR_EFFECTIVE_IN_PAST, http: 422, condition: "OUTLOOK/WATCH effective_from earlier than the logical clock" }
  - { id: ERR_PRODUCT_OVERLAP_CONFLICT, http: 409, condition: "Another ISSUED product of same office+hazard+level has overlapping half-open window and shared resolved zone" }
  - { id: ERR_EVACUATION_WINDOW_CONFLICT, http: 409, condition: "EVACUATION order violates the 60-minute re-entry buffer against a same-zone ORDERED/LIFTED evacuation" }
  - { id: ERR_DUPLICATE_AGREEMENT, http: 409, condition: "A NeighborAgreement already exists for the unordered office pair" }
  - { id: ERR_INVALID_SUPERSEDE_CHAIN, http: 422, condition: "Supersede shape invalid: UPGRADE requires WATCH->WARNING same hazard; CONTINUATION/CORRECTION require same level and hazard; prior already past expires_at" }
  - { id: ERR_MESSAGE_FORMAT_OVERFLOW, http: 422, condition: "WEA message exceeds the channel budget even after truncating to a single zone" }
  - { id: ERR_ZONE_OUTSIDE_CWA, http: 422, condition: "A listed zone belongs to another office's CWA and no covering NeighborAgreement exists for the hazard" }
  - { id: ERR_POLYGON_OUTSIDE_CWA, http: 422, condition: "Polygon overlaps another office's CWA and no covering NeighborAgreement exists for the hazard" }
  - { id: ERR_ZONE_NOT_COVERED_BY_PRODUCT, http: 422, condition: "Emergency action zone is not in the linked product's resolved_zone_ids" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; owns configuration entities, the logical clock, and dissemination settling"
    identity: opaque
    exclusive_operations:
      - "POST /alerts/offices, /alerts/zones, /alerts/neighbor-agreements, /alerts/alert-channels, /alerts/forecasters"
      - "POST /_clock/set_current_utc"
      - "POST /_dissemination/settle"
    shared_operations:
      - "All GET endpoints"

  - name: Forecaster
    description: "Journeyman/senior forecaster; drafts, coordinates, issues and cancels products for their own office; tracks storms"
    identity: "entity_backed:Forecaster"
    exclusive_operations:
      - "POST /alerts/storm-events, PUT /alerts/storm-events/{id}, POST /alerts/storm-events/{id}/dissipate (own office)"
      - "POST /alerts/products, /submit-coordination, /issue (without coordination_override), /cancel (own office)"
      - "POST /alerts/coordination-requests/{id}/respond (requests addressed to own office)"
    shared_operations:
      - "All GET endpoints"

  - name: MeteorologistInCharge
    description: "MIC: Forecaster superset; the only role allowed coordination_override=true on issue; caller's Forecaster row must have level == MIC"
    identity: "entity_backed:Forecaster"
    exclusive_operations:
      - "POST /alerts/products/{id}/issue with coordination_override=true"
    shared_operations:
      - "All Forecaster operations"
      - "All GET endpoints"

  - name: VerificationAnalyst
    description: "Performance/verification analyst; reports observed events, adjudicates them, computes verification statistics"
    identity: opaque
    exclusive_operations:
      - "POST /alerts/verification-events"
      - "POST /alerts/verification-events/{id}/adjudicate"
      - "POST /alerts/verification-statistics"
    shared_operations:
      - "All GET endpoints"

  - name: EmergencyManager
    description: "County emergency manager; recommends, orders and lifts evacuation/shelter actions"
    identity: opaque
    exclusive_operations:
      - "POST /alerts/emergency-actions"
      - "POST /alerts/emergency-actions/{id}/order"
      - "POST /alerts/emergency-actions/{id}/lift"
    shared_operations:
      - "All GET endpoints"
