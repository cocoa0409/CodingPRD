            - { call: "POST /api/comparator-groups", payload: { study_id: "${sk}", name: "GK", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { gk: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${k_m1}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${k_m2}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${k_m3}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${k_f1}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${k_f2}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${k_f3}", payload: { comparator_group_id: "${gk}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sk}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gk}/lock", payload: {}, as: CompAnalyst, captures: { gvk: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gk}", methodology: COHORT_MEDIAN, expected_group_version: "${gvk}" }, as: CompAnalyst, captures: { run_k: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_k}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sk}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${sk}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${sk}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${sk}", total_budget_cents: 2700000 }, as: CompAnalyst, captures: { plan_k: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${sk}" }, as: CompAnalyst, captures: { fk: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fk}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_k}", gap_finding_id: "${fk}", employee_snapshot_id: "${k_f1}", proposed_increase_cents: 100000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { adj_k: "$.data.id" } }
            - { call: "POST /api/remediation-plans/${plan_k}/submit", payload: {}, as: CompAnalyst }
            - { call: "GET /api/remediation-plans/${plan_k}", payload: {}, as: RemediationApprover, captures: { pv_k1: "$.data.version" } }
          trigger:
            - { call: "POST /api/adjustments/${adj_k}/decision", payload: { decision: APPROVE, expected_plan_version: "${pv_k1}" }, as: RemediationApprover, as_user_id: "user-approver-1", captures: { err: "$.data.error_id" } }
