    code: 200
    input: ["status?", "station_type?", "limit?", "offset?"]
    output: "PrepItem[]"
    side_effects: []
  - method: GET
    path: "/api/prep-items/{id}"
    description: "Get a prep item"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: PrepItem
    side_effects: []
  - method: POST
    path: "/api/prep-items/{id}/retire"
    description: "Manually retire a prep item (same cascade as menu-publish retirement)"
    roles: [MenuAdmin]
    code: 200
    input: []
    output: PrepItem
    side_effects: ["referencing ACTIVE pars -> SUSPENDED", "PLANNED batches of suspended pars -> CANCELLED"]

  # --- Station ---
  - method: POST
    path: "/api/stations"
    description: "Create a station"
    roles: [KitchenManager]
    code: 201
    input: [restaurant_id, name, station_type, rack_slot_capacity, "mise_en_place_layout?"]
    output: Station
    side_effects: ["layout items must be ACTIVE prep items (ERR_PREP_ITEM_NOT_ACTIVE)"]
  - method: GET
    path: "/api/stations"
    description: "List stations"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "station_type?", "limit?", "offset?"]
    output: "Station[]"
    side_effects: []
  - method: GET
    path: "/api/stations/{id}"
    description: "Get a station"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/api/stations/{id}/throughput-summary"
    description: "Computed read: station load score, waste ratio, over-prep penalty, par health, rack load"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: { station_id: string, load_score: number, waste_ratio: number, overprep_penalty_points: integer, par_health: string, rack_load: integer }
    side_effects: ["runs station_load_score, overprep_waste_penalty, station_par_health"]

  # --- StationPar ---
  - method: POST
    path: "/api/station-pars"
    description: "Create a station par (station and prep item must share station_type)"
    roles: [KitchenManager]
    code: 201
    input: [station_id, prep_item_id, par_quantity]
    output: StationPar
    side_effects: ["station par_health recomputed"]
  - method: GET
    path: "/api/station-pars"
    description: "List station pars"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["station_id?", "prep_item_id?", "requested_by_cook_id?", "status?", "limit?", "offset?"]
    output: "StationPar[]"
    side_effects: []
  - method: GET
    path: "/api/station-pars/{id}"
    description: "Get a station par"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: StationPar
    side_effects: []
  - method: POST
    path: "/api/station-pars/{id}/propose-adjustment"
    description: "Propose a new par level (OCC-guarded)"
    roles: [LineCook, PrepCook, KitchenManager]
    code: 200
    input: [proposed_par_quantity, expected_station_par_version]
    output: StationPar
    side_effects: ["adjustment_status -> PENDING", "requested_by_cook_id := X-User-ID", "increments StationPar.version by 1"]
  - method: POST
    path: "/api/station-pars/{id}/approve-adjustment"
    description: "Approve a pending adjustment (segregation of duties enforced)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: StationPar
    side_effects: ["par_quantity := proposed_par_quantity", "proposed_par_quantity := null", "approved_by_cook_id := X-User-ID"]
  - method: POST
    path: "/api/station-pars/{id}/reject-adjustment"
    description: "Reject a pending adjustment"
    roles: [KitchenManager]
    code: 200
    input: []
    output: StationPar
    side_effects: ["proposed_par_quantity := null", "adjustment_status -> REJECTED"]

  # --- Cook ---
  - method: POST
    path: "/api/cooks"
    description: "Create a cook"
    roles: [KitchenManager]
    code: 201
    input: [restaurant_id, name, certified_station_types]
    output: Cook
    side_effects: []
  - method: GET
    path: "/api/cooks"
    description: "List cooks"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "status?", "limit?", "offset?"]
    output: "Cook[]"
    side_effects: []
  - method: GET
    path: "/api/cooks/{id}"
    description: "Get a cook"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: Cook
    side_effects: []
  - method: POST
    path: "/api/cooks/{id}/complete-retraining"
    description: "Recertify a RETRAINING_REQUIRED cook on the latest PUBLISHED revision"
    roles: [KitchenManager]
    code: 200
    input: [menu_revision_id]
    output: Cook
    side_effects: ["certification_menu_revision_id := menu_revision_id", "status -> ACTIVE"]

  # --- DemandForecast ---
  - method: POST
    path: "/api/demand-forecasts"
    description: "Create a demand forecast in DRAFT"
    roles: [KitchenManager]
    code: 201
    input: [restaurant_id, service_date, expected_covers, item_mix]
    output: DemandForecast
    side_effects: []
  - method: GET
    path: "/api/demand-forecasts"
    description: "List demand forecasts"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "status?", "limit?", "offset?"]
    output: "DemandForecast[]"
    side_effects: []
  - method: GET
    path: "/api/demand-forecasts/{id}"
    description: "Get a demand forecast"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []
  - method: POST
    path: "/api/demand-forecasts/{id}/submit"
    description: "DRAFT -> SUBMITTED (service_date must be in the future)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []
  - method: POST
    path: "/api/demand-forecasts/{id}/finalize"
    description: "SUBMITTED -> FINALIZED"
    roles: [KitchenManager]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []
  - method: POST
    path: "/api/demand-forecasts/{id}/amend"
    description: "SUBMITTED -> DRAFT (amendment loop)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []

  # --- PrepList ---
  - method: POST
    path: "/api/prep-lists"
    description: "Create a prep list in DRAFT for a forecast"
    roles: [KitchenManager]
    code: 201
    input: [restaurant_id, demand_forecast_id]
    output: PrepList
    side_effects: []
  - method: GET
    path: "/api/prep-lists"
    description: "List prep lists"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "demand_forecast_id?", "status?", "limit?", "offset?"]
    output: "PrepList[]"
    side_effects: []
  - method: GET
    path: "/api/prep-lists/{id}"
    description: "Get a prep list (includes computed lines)"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: PrepList
    side_effects: []
  - method: POST
    path: "/api/prep-lists/{id}/generate"
    description: "DRAFT -> GENERATED; runs forecast_prep_quantity with the chosen variant"
    roles: [KitchenManager]
    code: 200
    input: [generation_variant]
    output: PrepList
    side_effects: ["lines and total_rounded_quantity computed", "generation_variant recorded"]
  - method: POST
    path: "/api/prep-lists/{id}/regenerate"
    description: "Regenerate lines from GENERATED or LOCKED (OCC-guarded); cancels PLANNED child batches"
    roles: [KitchenManager]
    code: 200
    input: [generation_variant, expected_prep_list_version]
    output: PrepList
    side_effects: ["PLANNED child batches -> CANCELLED", "lines recomputed", "increments PrepList.version by 1"]
  - method: POST
    path: "/api/prep-lists/{id}/lock"
    description: "GENERATED -> LOCKED"
    roles: [KitchenManager]
    code: 200
    input: []
    output: PrepList
    side_effects: []

  # --- PrepBatch ---
  - method: POST
    path: "/api/prep-batches"
    description: "Plan a batch under a LOCKED or IN_PROGRESS prep list (occupies rack capacity)"
    roles: [PrepCook, KitchenManager]
    code: 201
    input: [prep_list_id, prep_item_id, station_id, quantity]
    output: PrepBatch
    side_effects: ["rack capacity check (ERR_RACK_CAPACITY_EXCEEDED)", "station par_health recomputed"]
  - method: GET
    path: "/api/prep-batches"
    description: "List prep batches"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["prep_list_id?", "prep_item_id?", "station_id?", "status?", "limit?", "offset?"]
    output: "PrepBatch[]"
    side_effects: []
  - method: GET
    path: "/api/prep-batches/{id}"
    description: "Get a prep batch"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: PrepBatch
    side_effects: []
  - method: POST
    path: "/api/prep-batches/{id}/mark-prepped"
    description: "PLANNED -> PREPPED; stamps produced_at and expires_at from the logical clock"
    roles: [PrepCook]
    code: 200
    input: []
    output: PrepBatch
    side_effects: ["produced_at/expires_at set", "parent PrepList LOCKED -> IN_PROGRESS on first prepped batch"]
  - method: POST
    path: "/api/prep-batches/{id}/record-consumption"
    description: "Record consumption against a PREPPED batch (rejected at/after expiry)"
    roles: [LineCook, PrepCook]
    code: 200
    input: [quantity]
    output: PrepBatch
    side_effects: ["consumed_quantity += quantity", "batch -> DEPLETED at zero remaining", "station par_health recomputed"]
  - method: POST
    path: "/api/prep-batches/{id}/expire"
    description: "Expire a batch whose expires_at has been reached; auto-creates an EXPIRED WasteEntry for the remainder"
    roles: [KitchenManager]
    code: 200
    input: []
    output: PrepBatch
    side_effects: ["batch -> EXPIRED", "auto WasteEntry reason=EXPIRED for remaining quantity", "station par_health recomputed"]

  # --- ShiftAssignment ---
  - method: POST
    path: "/api/shift-assignments"
    description: "Create a shift assignment (certification + half-open overlap checks)"
    roles: [KitchenManager]
    code: 201
    input: [cook_id, station_id, shift_start, shift_end]
    output: ShiftAssignment
    side_effects: []
  - method: GET
    path: "/api/shift-assignments"
    description: "List shift assignments"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["cook_id?", "station_id?", "status?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []
  - method: GET
    path: "/api/shift-assignments/{id}"
    description: "Get a shift assignment"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []
  - method: POST
    path: "/api/shift-assignments/{id}/confirm"
    description: "SCHEDULED -> CONFIRMED (cook must be ACTIVE); debits weekly_scheduled_minutes"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["Cook.weekly_scheduled_minutes += shift minutes"]
  - method: POST
    path: "/api/shift-assignments/{id}/complete"
    description: "CONFIRMED -> COMPLETED"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []
  - method: POST
    path: "/api/shift-assignments/{id}/cancel"
    description: "SCHEDULED/CONFIRMED -> CANCELLED (compensates minutes when CONFIRMED)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["Cook.weekly_scheduled_minutes -= shift minutes iff was CONFIRMED"]
  - method: POST
    path: "/api/shift-assignments/{id}/mark-no-show"
    description: "CONFIRMED -> NO_SHOW (compensates minutes)"
    roles: [KitchenManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["Cook.weekly_scheduled_minutes -= shift minutes"]

  # --- BakeryOrder ---
  - method: POST
    path: "/api/bakery-orders"
    description: "Create a bakery order in DRAFT"
    roles: [PastryChef]
    code: 201
    input: [restaurant_id, cheesecake_type, whole_cakes_ordered]
    output: BakeryOrder
    side_effects: []
  - method: GET
    path: "/api/bakery-orders"
    description: "List bakery orders"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "status?", "limit?", "offset?"]
    output: "BakeryOrder[]"
    side_effects: []
  - method: GET
    path: "/api/bakery-orders/{id}"
    description: "Get a bakery order"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: BakeryOrder
    side_effects: []
  - method: POST
    path: "/api/bakery-orders/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [PastryChef]
    code: 200
    input: []
    output: BakeryOrder
    side_effects: []
  - method: POST
    path: "/api/bakery-orders/{id}/confirm"
    description: "SUBMITTED -> CONFIRMED with budget reservation"
    roles: [InventoryController]
    code: 200
    input: []
    output: BakeryOrder
    side_effects: ["Restaurant.weekly_bakery_budget_spent_cents += whole_cakes_ordered * 2500"]
  - method: POST
    path: "/api/bakery-orders/{id}/receive"
    description: "CONFIRMED -> RECEIVED or PARTIALLY_RECEIVED; computes provisional_slices"
    roles: [PastryChef]
    code: 200
    input: [whole_cakes_received]
    output: BakeryOrder
    side_effects: ["provisional_slices = whole_cakes_received * 14"]
  - method: POST
    path: "/api/bakery-orders/{id}/reconcile-yield"
    description: "RECEIVED/PARTIALLY_RECEIVED -> RECONCILED; records final slice count and variance"
    roles: [PastryChef]
    code: 200
    input: [final_slice_count]
    output: BakeryOrder
    side_effects: ["yield_variance = final_slice_count - provisional_slices"]
  - method: POST
    path: "/api/bakery-orders/{id}/cancel"
    description: "DRAFT/SUBMITTED/CONFIRMED -> CANCELLED; releases budget reservation iff CONFIRMED"
    roles: [PastryChef, InventoryController]
    code: 200
    input: []
    output: BakeryOrder
    side_effects: ["Restaurant.weekly_bakery_budget_spent_cents -= whole_cakes_ordered * 2500 iff was CONFIRMED"]

  # --- WasteEntry ---
