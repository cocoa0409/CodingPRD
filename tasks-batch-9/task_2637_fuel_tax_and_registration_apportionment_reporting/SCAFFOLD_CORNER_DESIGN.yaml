scaffold_corner_design:

  # =====================================================================
  # SECTION 1 — ENTITIES (claim types from claim-extraction-guide Table 1)
  # =====================================================================
  - section: entities
    instances:

      - name: carrier_creation_returns_the_envelope_plus_every_declared_default
        claim_type: creation
        grounds:
          - response_envelope.success
          - entities.Carrier
          - entities.Carrier.fields.bond_ceiling_amount
          - endpoints[POST /apportionment/carriers]
        distinguishing_aspect: "A minimal Carrier create omitting bond_ceiling_amount returns 201 with version 1, bond_ceiling_amount 5000.00, both status dimensions ACTIVE, tax_paid_gallons_ytd 0.000, unsubstantiated_mileage_ratio 0.0000, audit_flag false, latest_prepared_fleet_mpg null and suspension_count 0 — every §1.1 default asserted in one response."
        test_recipe:
          setup:
            - "Empty database. Only the base jurisdiction row is needed so base_jurisdiction_code resolves."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          assert:
            - "HTTP 201; body.response_type == 'object'; body.meta.api_request_id and body.meta.api_request_timestamp are both present and non-empty"
            - "Carrier.${c1_id}.version == 1"
            - "Carrier.${c1_id}.bond_ceiling_amount == 5000.00"
            - "Carrier.${c1_id}.ifta_license_status == ACTIVE and Carrier.${c1_id}.irp_account_status == ACTIVE"
            - "Carrier.${c1_id}.tax_paid_gallons_ytd == 0.000 and Carrier.${c1_id}.unsubstantiated_mileage_ratio == 0.0000"
            - "Carrier.${c1_id}.audit_flag == false and Carrier.${c1_id}.suspension_count == 0"
            - "Carrier.${c1_id}.latest_prepared_fleet_mpg == null"
            - "Carrier.${c1_id}.created_at and Carrier.${c1_id}.updated_at are present and equal"

      - name: surcharge_flag_is_computed_from_the_rate_and_the_client_supplied_flag_is_ignored
        claim_type: computed_fields
        grounds:
          - entities.Jurisdiction.fields.is_surcharge_jurisdiction
          - entities.Jurisdiction.fields.surcharge_rate_per_gallon
          - endpoints[POST /apportionment/jurisdictions]
        distinguishing_aspect: "is_surcharge_jurisdiction is derived from surcharge_rate_per_gallon > 0.0000, so KY declared with surcharge 0.0440 and an explicit is_surcharge_jurisdiction false still stores true, while IL with the rate omitted defaults to 0.0000 and false."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { jur_il_id: $.data.id }
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { jur_in_id: $.data.id }
          trigger:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { jur_ky_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_ky_id}.is_surcharge_jurisdiction == true — the supplied false is ignored because the field is computed"
            - "Jurisdiction.${jur_ky_id}.surcharge_rate_per_gallon == 0.0440"
            - "Jurisdiction.${jur_il_id}.surcharge_rate_per_gallon == 0.0000 and Jurisdiction.${jur_il_id}.is_surcharge_jurisdiction == false"
            - "Jurisdiction.${jur_in_id}.is_surcharge_jurisdiction == true"

      - name: reference_rows_expose_no_version_and_have_no_write_surface_after_creation
        claim_type: immutability
        grounds:
          - entities.Jurisdiction
          - entities.WeightGroupFee
          - endpoints[GET /apportionment/jurisdictions/{id}]
          - endpoints[GET /apportionment/weight-group-fees/{id}]
        distinguishing_aspect: "Jurisdiction and WeightGroupFee are declared common_fields: false, so their reads carry id and created_at but no version and no updated_at, and §1.5 declares no PUT/PATCH/DELETE for either path."
        test_recipe:
          setup:
            - "One jurisdiction and one weight-group fee row exist."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { jur_il_id: $.data.id }
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IL", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 2790.00 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { wgf_il_id: $.data.id }
          trigger:
            - call: "GET /apportionment/jurisdictions/${jur_il_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "GET /apportionment/weight-group-fees/${wgf_il_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
          assert:
            - "HTTP 200 on both reads; each body.data contains id and created_at"
            - "body.data has no 'version' key and no 'updated_at' key for either row"
            - "Jurisdiction.${jur_il_id}.fuel_tax_rate_per_gallon == 0.6270 and WeightGroupFee.${wgf_il_id}.annual_fee_amount == 2790.00"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint under /apportionment/jurisdictions or /apportionment/weight-group-fees"

      - name: vehicle_retrieval_returns_the_stored_row_with_its_system_dimensions
        claim_type: retrieval
        grounds:
          - entities.Vehicle
          - endpoints[GET /apportionment/vehicles/{id}]
          - state_machines.Vehicle.state_dimensions.vehicle_status.initial_state
        distinguishing_aspect: "GET /vehicles/{id} echoes the six input fields verbatim and reports vehicle_status PENDING, credential_status NONE, replaced_vehicle_id null and activated_on_date null before any registration action."
        test_recipe:
          setup:
            - "One carrier with one vehicle, no registration application yet."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /apportionment/vehicles/${v1_id}"
              payload: {}
              as: MileageAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 200; Vehicle.${v1_id}.carrier_id == ${c1_id}"
            - "Vehicle.${v1_id}.unit_number == 'U-101' and Vehicle.${v1_id}.vin == '1FUJA6CK21L101101'"
            - "Vehicle.${v1_id}.weight_group_code == 'W80' and Vehicle.${v1_id}.factory_price_amount == 145000.00 and Vehicle.${v1_id}.registration_year == 2026"
            - "Vehicle.${v1_id}.vehicle_status == PENDING and Vehicle.${v1_id}.credential_status == NONE"
            - "Vehicle.${v1_id}.replaced_vehicle_id == null and Vehicle.${v1_id}.activated_on_date == null"

      - name: trip_record_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /apportionment/trip-records]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three trips for one carrier: limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; the trip_status filter narrows the same list to the single GAP_FLAGGED row."
        test_recipe:
          setup:
            - "One carrier, one vehicle, three trips: two clean (CAPTURED) and one with a 100.0-mile odometer gap (GAP_FLAGGED)."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-05-10T06:00:00Z", trip_end_utc: "2026-05-10T18:00:00Z", start_odometer: 1400.0, end_odometer: 1700.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t2_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-06-10T06:00:00Z", trip_end_utc: "2026-06-10T18:00:00Z", start_odometer: 1800.0, end_odometer: 2000.0, legs: [ { jurisdiction_code: "IL", leg_miles: 200.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t3_id: $.data.id }
          trigger:
            - call: "GET /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", limit: 2, offset: 0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "GET /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", limit: 2, offset: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "GET /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", trip_status: "GAP_FLAGGED" }
              as: TaxPreparer
              as_user_id: "preparer-1"
          assert:
            - "First read: HTTP 200, body.response_type == 'array', len(body.data) == 2, body.total_count == 3, body.has_more == true, body.limit == 2, body.offset == 0"
            - "Second read: len(body.data) == 1, body.total_count == 3, body.has_more == false"
            - "Third read: len(body.data) == 1 and body.data[0].id == ${t3_id} with gap_miles_from_previous == 100.0"
            - "TripRecord.${t1_id}.trip_status == CAPTURED and TripRecord.${t2_id}.trip_status == CAPTURED"

      - name: carrier_create_missing_usdot_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[13].ERR_INVALID_REQUEST
          - entities.Carrier.fields.usdot_number
          - endpoints[POST /apportionment/carriers]
        distinguishing_aspect: "usdot_number is a source: input field with no default; omitting it returns ERR_INVALID_REQUEST 400 and persists no Carrier row."
        test_recipe:
          setup:
            - "One jurisdiction declared; no carriers."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with body.response_type == 'error' and body.data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /apportionment/carriers returns total_count == 0 — no partial row was written"

      - name: shape_violations_on_gallons_and_odometer_are_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[13].ERR_INVALID_REQUEST
          - endpoints[POST /apportionment/fuel-purchases]
          - endpoints[POST /apportionment/trip-records]
        distinguishing_aspect: "Two distinct numeric-range clauses of priority 13 each return ERR_INVALID_REQUEST 400: gallons 0.000 (must be > 0.000) and end_odometer 900.0 below start_odometer 1000.0 (must be strictly greater)."
        test_recipe:
          setup:
            - "One carrier with one vehicle."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IL", purchase_date: "2026-05-02", gallons: 0.000, tax_paid_flag: true, receipt_reference: "RCPT-1" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_gallons: "$.data.error_id" }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 900.0, legs: [ { jurisdiction_code: "IL", leg_miles: 100.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_odo: "$.data.error_id" }
          assert:
            - "First trigger: HTTP 400 and body.data.error_id == 'ERR_INVALID_REQUEST'"
            - "Second trigger: HTTP 400 and body.data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /apportionment/fuel-purchases?carrier_id=${c1_id} returns total_count == 0 and GET /apportionment/trip-records?carrier_id=${c1_id} returns total_count == 0"
            - "Carrier.${c1_id}.tax_paid_gallons_ytd == 0.000"

      - name: unknown_change_type_enum_member_is_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[13].ERR_INVALID_REQUEST
          - entities.FleetChangeRequest.fields.change_type
          - endpoints[POST /apportionment/fleet-change-requests]
        distinguishing_aspect: "change_type 'SWAP' is outside {ADDITION, DELETION, TRANSFER}; priority 13 fires before the priority-16 OCC check and the priority-17 state check, so a DRAFT parent application and a correct version still yield ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "One carrier, one vehicle, one DRAFT registration application for 2026."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/registration-applications"
              payload: { carrier_id: "${c1_id}", registration_year: 2026, weight_group_code: "W80", distance_basis: "ACTUAL_DISTANCE_BASIS" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { app1_id: $.data.id }
            - call: "GET /apportionment/registration-applications/${app1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { app1_v: $.data.version }
          trigger:
            - call: "POST /apportionment/fleet-change-requests"
              payload: { registration_application_id: "${app1_id}", vehicle_id: "${v1_id}", change_type: "SWAP", effective_date: "2026-07-15", expected_registration_application_version: "${app1_v}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 and body.data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /apportionment/fleet-change-requests?registration_application_id=${app1_id} returns total_count == 0"
            - "RegistrationApplication.${app1_id}.version is unchanged from ${app1_v} — a rejected create bumps nothing"

      - name: trip_create_foreign_keys_are_checked_in_body_declaration_order
        claim_type: parent_relationships
        grounds:
          - validations[12]
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - endpoints[POST /apportionment/trip-records]
        distinguishing_aspect: "Priority 12 walks body foreign keys in declaration order carrier_id then vehicle_id: both bogus yields ERR_CARRIER_NOT_FOUND, a real carrier with a bogus vehicle_id yields ERR_VEHICLE_NOT_FOUND, both 404."
        test_recipe:
          setup:
            - "One carrier and one vehicle exist; two absent UUIDs are used as bogus foreign keys."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "11111111-1111-4111-8111-111111111111", vehicle_id: "22222222-2222-4222-8222-222222222222", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "22222222-2222-4222-8222-222222222222", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_vehicle: "$.data.error_id" }
          assert:
            - "First trigger: HTTP 404 and body.data.error_id == 'ERR_CARRIER_NOT_FOUND'"
            - "Second trigger: HTTP 404 and body.data.error_id == 'ERR_VEHICLE_NOT_FOUND'"
            - "GET /apportionment/trip-records?carrier_id=${c1_id} returns total_count == 0"

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations[5]
          - validations[6]
          - validations[7]
          - validations[9]
          - validations[10]
          - validations[11]
          - errors[ERR_TRIP_RECORD_NOT_FOUND]
          - errors[ERR_FUEL_PURCHASE_NOT_FOUND]
          - errors[ERR_FUEL_TAX_RETURN_NOT_FOUND]
          - errors[ERR_FLEET_CHANGE_REQUEST_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
          - errors[ERR_AUDIT_SELECTION_NOT_FOUND]
        distinguishing_aspect: "Against an empty database six different path ids each map to their own 404 code, and the credential distribute call proves the path check (priority 10) runs before the body foreign-key check (priority 12) by returning ERR_CREDENTIAL_NOT_FOUND rather than ERR_DRIVER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database — no setup calls are required because every trigger only needs an absent id."
          setup_api_calls: []
          trigger:
            - call: "GET /apportionment/trip-records/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_trip: "$.data.error_id" }
            - call: "POST /apportionment/fuel-purchases/44444444-4444-4444-8444-444444444444/disallow"
              payload: { disallow_reason_code: "MISSING_RECEIPT" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_purchase: "$.data.error_id" }
            - call: "GET /apportionment/fuel-tax-returns/55555555-5555-4555-8555-555555555555/jurisdiction-lines"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_return: "$.data.error_id" }
