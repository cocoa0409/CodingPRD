            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: {}
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { pick1: "$.data.reviewer_member_id", score1: "$.data.expertise_match_score" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: {}
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { pick2: "$.data.reviewer_member_id" }
            - call: "POST /abstracts/${ab2_id}/review-assignments"
              payload: {}
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { pick3: "$.data.reviewer_member_id" }
            - call: "POST /abstracts/${ab2_id}/review-assignments"
              payload: {}
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { pick4: "$.data.reviewer_member_id" }
            - call: "GET /committee-members/${mb_zed_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { zed_load: "$.data.current_review_load" }
            - call: "GET /reviews?abstract_id=${ab1_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { total_a1: "$.meta.total_count" }
          assert:
            - "pick1 == ${mb_rui_id}: all three oncology reviewers score 1.0000 with spare capacity 4, so created_at ASC decides and Rui was created first"
            - "score1 == 1.0000 (Dice over {oncology} and {oncology} = 2*1/(1+1))"
            - "pick2 == ${mb_mei_id}: Rui is now excluded by his own ASSIGNED review on A1, Mei and Nadia are still tied at spare capacity 4, and Mei was created before Nadia"
            - "pick3 == ${mb_nadia_id}: on A2 all three are eligible, but Rui and Mei now have spare capacity 3 against Nadia's 4, so spare capacity outranks creation order"
            - "pick4 == ${mb_rui_id}: Nadia is excluded by her ASSIGNED review on A2 and Rui and Mei are tied again at spare capacity 3, so the oldest row wins"
            - "Zed is never selected: his Dice score against [oncology] is 0.0000, below MIN_MATCH_SCORE 0.25, and his current_review_load stays 0"
            - "GET /reviews?abstract_id=${ab1_id} reports total_count 2, and no reviewer holds two ASSIGNED reviews on the same abstract"

      - name: decision_commit_rejects_a_stale_conference_version
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_conference_version_outranks_exhausted_oral_capacity_negative
          rationale: |
            The second §1.2.1 rule (decision-commit-stale-conference) is already
            driven end to end by that §1.8 instance, which additionally pins the
            interesting ordering property: the stale conference version at p8 wins
            over an exhausted oral capacity at p21, so a chair working from a stale
            read is told to refresh rather than told the quota is gone. A separate
            §1.9 instance would only restate the plain 412.
      - name: four_link_cascade_from_a_rejected_disclosure
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / disclosure_rejection_cascades_four_links_and_unpublishes_session
          rationale: |
            The deepest chain in the scaffold (disclosure REJECTED -> accreditation
            REVOKED -> conference pool and session posture recomputed -> session
            unpublished) is already verified link by link, in order, by that §1.8
            instance, with the two shallower chains (no-show sanctions, member
            suspension) covered by its siblings. §1.9 adds nothing by rerunning it.
      - name: provisional_versus_final_consensus_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / consensus_provisional_unweighted_vs_final_confidence_weighted_on_abstract
          rationale: |
            Variant divergence, selection and reconciliation for the consensus score
            are all covered there, and the other two dual-variant families (change
            fee, CME credit) have their own §1.8 instances. This section's own
            calculations entries already cover the narrower per-review claims
            (calibration bias, clamping, input-set filtering, final-score timing).

  - section: consistency_model
    instances:
      - name: every_write_is_visible_in_its_own_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/sessions/{sessionId}/slots
          - endpoints.GET_/conferences/{conferenceId}/capacity-summary
        distinguishing_aspect: |
          The declared consistency model is `immediate`, so no derived field is
          allowed to lag. The three most heavily denormalized readings in the
          scaffold are checked at the earliest possible moment: the decision
          response and the capacity summary must agree on the very next call, the
          slot-creation response must already carry the cascaded Abstract status
          change, and the withdrawal response must already reflect the released
          format capacity. Every assertion is made on the first read after the
          write, with no retry loop and no second attempt permitted — a test that
          passes only on a re-read has caught an implementation that defers its
          recomputation.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z. Conference GOS26 with capacities 2 / 2 / 1, cme_minutes_pool_total 600."
            - "Category GEN: allowed_formats [ORAL], min_reviews_required 2, discrepancy_threshold 4.00."
            - "Chair Cho, reviewers Rui and Mei, all ACTIVE. Author Ada, registered."
            - "Abstract A1 by Ada, keywords [oncology], two 4/4/4/4 reviews, conference in REVIEW_CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 2, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: true }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "A1 immediate visibility", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rev1_id: "$.data.id" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r2_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rev2_id: "$.data.id" }
            - call: "POST /reviews/${rev1_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "POST /reviews/${rev2_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r2_id}"
              captures: { rev2_status: "$.data.status" }
            - call: "GET /abstracts/${ab1_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { ab_status_after_second_submission: "$.data.status", prov: "$.data.provisional_score" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
          trigger:
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { conf_v0: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_v0}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { dec: "$.data.decision", dec_status: "$.data.status" }
            - call: "GET /conferences/${conf_id}/capacity-summary"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { oral_left_after_decision: "$.data.oral_remaining" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { conf_abs_status: "$.data.status" }
            - call: "POST /sessions"
              payload: { conference_id: "${conf_id}", chair_member_id: "${mb_chair_id}", theme_code: "oncology", format: "ORAL", room_code: "R1", start_utc: "2026-09-01T09:00:00Z", end_utc: "2026-09-01T11:00:00Z", capacity_slots: 2 }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { ses_id: "$.data.id", ses_v0: "$.data.version" }
            - call: "POST /sessions/${ses_id}/slots"
              payload: { abstract_id: "${ab1_id}", presenter_author_id: "${au_ada_id}", position: 1, duration_minutes: 30, expected_session_version: "${ses_v0}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { slot1_id: "$.data.id", slot1_status: "$.data.status" }
            - call: "GET /abstracts/${ab1_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { ab_after_slot: "$.data.status" }
            - call: "GET /sessions/${ses_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { ses_cnt: "$.data.slot_count", ses_mins: "$.data.committed_minutes", ses_v1: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "WITHDRAWN", reason: "author withdraws before the freeze" }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { wd_status: "$.data.status" }
            - call: "GET /conferences/${conf_id}/capacity-summary"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { oral_left_after_withdrawal: "$.data.oral_remaining" }
            - call: "GET /sessions/${ses_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { ses_cnt_after: "$.data.slot_count", ses_mins_after: "$.data.committed_minutes" }
            - call: "GET /session-slots/${slot1_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { slot1_status_after: "$.data.status" }
          assert:
            - "the second review submission returns status SUBMITTED, and the very first read of the abstract afterwards already shows status SCORED with provisional_score 4.00: the auto-advance happened inside that same request, not in a follow-up job"
            - "the decision response carries decision ORAL and status ACCEPTED, and the very next capacity-summary read shows oral_remaining 1 — one call, no retry"
            - "the slot-creation response carries status SCHEDULED, and the first read of the abstract afterwards already shows SCHEDULED rather than CONFIRMED"
            - "the first read of the session after slot creation already shows slot_count 1, committed_minutes 40 (30 + a 10-minute buffer) and version ${ses_v0} + 1"
            - "the withdrawal response carries status WITHDRAWN, and the first capacity-summary read afterwards already shows oral_remaining 2 with the slot read back as WITHDRAWN and the session at slot_count 0, committed_minutes 0"
            - "no assertion in this recipe is allowed a second attempt or a delay: under the immediate model each of these values is correct on the first read after the write"
