scenario: "Federal Student Loan Servicing System: loan types (Direct Sub/Unsub/PLUS), income-driven repayment (IBR/PAYE/SAVE), PSLF public service forgiveness, grace/deferment/forbearance, default collection, veteran discharge"
domain_name: "federal-student-loan-servicing"
api_prefix: "/loan-servicing"

complexity_profile:
  primary_archetype: "compliance/audit"
  secondary_archetype: "pricing engine"
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: "flat"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Borrower legal name"
        constraints: "1..200 chars"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of SSN (used as audit display only — not for decisions)"
        constraints: "exactly 4 digits"
      - name: is_veteran
        type: boolean
        source: input
        description: "Marker for eligibility to file VETERAN_TOTAL_DISABILITY discharge"
        default: false
      - name: current_agi_cents
        type: integer
        source: computed
        description: "Most recently certified AGI in cents; derived from the latest IncomeCertification whose status==CERTIFIED for this borrower (sort by effective_date DESC, then created_at DESC). Null when no CERTIFIED certification exists."
      - name: current_family_size
        type: integer
        source: computed
        description: "Most recently certified family size; same selection rule as current_agi_cents."

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: loan_type
        type: enum
        source: input
        description: "Loan product type"
        constraints: "one of DIRECT_SUB, DIRECT_UNSUB, DIRECT_PLUS"
      - name: principal_cents
        type: integer
        source: input
        description: "Disbursed principal in cents"
        constraints: ">= 100"
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Annual interest rate in basis points (e.g. 533 = 5.33%)"
        constraints: ">= 1, <= 2000"
      - name: disbursement_date
        type: datetime
        source: input
        description: "Date of original disbursement (used to compute grace period end)"
      - name: status
        type: enum
        source: system
        description: "Loan lifecycle status"
        default: "ORIGINATED"
        constraints: "one of ORIGINATED, IN_SCHOOL, GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DEFAULT, PAID_OFF, DISCHARGED"
      - name: principal_balance_cents
        type: integer
        source: system
        description: "Current outstanding principal in cents"
      - name: accrued_interest_cents
        type: integer
        source: system
        description: "Currently accrued (unpaid) interest in cents"
      - name: capitalized_interest_cents
        type: integer
        source: system
        description: "Cumulative interest that has been capitalized into principal"
      - name: last_accrual_date
        type: datetime
        source: system
        description: "Date through which interest has been accrued (inclusive)"
      - name: delinquency_days
        type: integer
        source: computed
        description: "Days past due as of current server clock; 0 when no past-due Payment exists"
      - name: pslf_qualifying_payment_count
        type: integer
        source: computed
        description: "PSLF-qualifying payment count per §1.3 calc pslf_qualifying_count"
      - name: status_change_at
        type: datetime
        source: system
        description: "UTC instant of the most recent status transition"

  - name: RepaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: plan_type
        type: enum
        source: input
        description: "Repayment plan variant"
        constraints: "one of STANDARD, IBR, PAYE, SAVE"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle status"
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, SUPERSEDED, COMPLETED"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Per §1.3 calc idr_monthly_payment; for STANDARD plans uses 10-year amortization; for IDR plans uses the plan-specific discretionary-income formula"
      - name: effective_date
        type: datetime
        source: input
        description: "Date the plan becomes ACTIVE"
      - name: superseded_by_plan_id
        type: string
        source: system
        description: "FK -> RepaymentPlan.id; set on supersede transition pointing to the replacement plan"

  - name: IncomeCertification
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: agi_cents
        type: integer
        source: input
        description: "Adjusted Gross Income in cents"
        constraints: ">= 0"
      - name: family_size
        type: integer
        source: input
        description: "Tax-household family size"
        constraints: ">= 1"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; selects the poverty-guideline table (CONTIGUOUS_48, ALASKA, HAWAII)"
        constraints: "ISO 3166-2 US subdivision code (e.g. CA, AK, HI)"
      - name: effective_date
        type: datetime
        source: input
        description: "Date this certification is valid from"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, CERTIFIED, REJECTED, EXPIRED"

  - name: QualifyingEmployment
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: employer_name
        type: string
        source: input
        description: "Employer legal name"
      - name: employer_type
        type: enum
        source: input
        description: "Employer classification per PSLF rules"
        constraints: "one of GOVERNMENT, NONPROFIT_501C3, OTHER_NONPROFIT, PRIVATE_NONQUALIFYING"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start date of the certified employment period"
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end date of the certified employment period; must be > period_start"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, CERTIFIED, REJECTED"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: repayment_plan_id
        type: string
        source: system
        description: "FK -> RepaymentPlan.id; resolved by server to the loan's currently-ACTIVE plan at posting time"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents"
        constraints: ">= 1"
      - name: payment_date
        type: datetime
        source: input
        description: "Date of payment (used for PSLF qualifying-month classification)"
      - name: status
        type: enum
        source: system
        description: "Payment posting status"
        default: "PENDING"
        constraints: "one of PENDING, APPLIED, REVERSED"
      - name: principal_applied_cents
        type: integer
        source: system
        description: "Cents applied to principal after waterfall allocation"
      - name: interest_applied_cents
        type: integer
        source: system
        description: "Cents applied to accrued interest after waterfall allocation"
      - name: is_pslf_qualifying
        type: boolean
        source: computed
        description: "True iff the APPLIED payment satisfies all PSLF qualifying-payment predicates at the moment of posting per §1.3 pslf_qualifying_count predicate set"
      - name: reversed_by_payment_id
        type: string
        source: system
        description: "FK -> Payment.id; populated on REVERSED status pointing to the reversing payment record (null when reversal originates from cascade rather than a counter-payment)"

  - name: StatusChange
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: from_status
        type: enum
        source: system
        description: "Loan.status before transition"
      - name: to_status
        type: enum
        source: system
        description: "Loan.status after transition"
      - name: reason_code
        type: enum
        source: input
        description: "Why the status changed"
        constraints: "one of GRACE_AUTO_START, GRACE_AUTO_END, DEFERMENT_REQUEST, FORBEARANCE_REQUEST, RESUME_REPAYMENT, DEFAULT_DECLARATION, REHABILITATION_COMPLETE, PAY_OFF, DISCHARGE_APPROVED"
      - name: actor_role
        type: string
        source: system
        description: "RBAC role that initiated the transition"
      - name: effective_at
        type: datetime
        source: system
        description: "UTC instant of the transition"

  - name: DischargeApplication
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: discharge_type
        type: enum
        source: input
        description: "Discharge program"
        constraints: "one of VETERAN_TOTAL_DISABILITY, PSLF"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, UNDER_REVIEW, APPROVED, DENIED"
      - name: review_notes
        type: string
        source: input
        description: "Reviewer notes; set on UNDER_REVIEW -> APPROVED|DENIED transitions"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Loan
    initial_state: ORIGINATED
    terminal_states: [PAID_OFF, DISCHARGED]
    transitions:
      - from: ORIGINATED
        to: IN_SCHOOL
        trigger: "POST /loans/{id}/enter-school"
        actor: LoanServicer
        preconditions:
          - "loan.status == ORIGINATED"
        side_effects:
          - "Loan.status := IN_SCHOOL"
          - "StatusChange row created with reason_code=GRACE_AUTO_START (in-school is treated as pre-grace deferment for interest subsidy)"
          - "increments Loan.version by 1"
        note: "DIRECT_SUB loans accrue NO interest while IN_SCHOOL; DIRECT_UNSUB and DIRECT_PLUS continue accruing."

      - from: IN_SCHOOL
        to: GRACE
        trigger: "POST /loans/{id}/graduate"
        actor: LoanServicer
        preconditions:
          - "loan.status == IN_SCHOOL"
        side_effects:
          - "Loan.status := GRACE"
          - "Loan.status_change_at := server clock"
          - "StatusChange row created with reason_code=GRACE_AUTO_START"
          - "increments Loan.version by 1"

      - from: GRACE
        to: REPAYMENT
        trigger: "POST /loans/{id}/start-repayment"
        actor: LoanServicer
        preconditions:
          - "loan.status == GRACE"
        side_effects:
          - "Loan.status := REPAYMENT"
          - "StatusChange row created with reason_code=GRACE_AUTO_END"
          - "increments Loan.version by 1"

      - from: REPAYMENT
        to: DEFERMENT
        trigger: "POST /loans/{id}/request-deferment"
        actor: Borrower
        preconditions:
          - "loan.status == REPAYMENT"
        side_effects:
          - "Loan.status := DEFERMENT"
          - "StatusChange row created with reason_code=DEFERMENT_REQUEST"
          - "increments Loan.version by 1"
        note: "DEFERMENT pauses required payments. Interest subsidy: DIRECT_SUB stops accruing; UNSUB/PLUS continue."

      - from: DEFERMENT
        to: REPAYMENT
        trigger: "POST /loans/{id}/resume-repayment"
        actor: LoanServicer
        preconditions:
          - "loan.status == DEFERMENT"
        side_effects:
          - "Loan.status := REPAYMENT"
          - "Loan.accrued_interest_cents is CAPITALIZED into Loan.principal_balance_cents (added to principal_balance_cents; recorded in capitalized_interest_cents; accrued_interest_cents := 0)"
          - "StatusChange row created with reason_code=RESUME_REPAYMENT"
          - "increments Loan.version by 1"

      - from: REPAYMENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/request-forbearance"
        actor: Borrower
        preconditions:
          - "loan.status == REPAYMENT"
        side_effects:
          - "Loan.status := FORBEARANCE"
          - "StatusChange row created with reason_code=FORBEARANCE_REQUEST"
          - "increments Loan.version by 1"
        note: "FORBEARANCE pauses payments but ALL loan types continue to accrue interest (no subsidy)."

      - from: FORBEARANCE
        to: REPAYMENT
        trigger: "POST /loans/{id}/resume-repayment"
        actor: LoanServicer
        preconditions:
          - "loan.status == FORBEARANCE"
        side_effects:
          - "Loan.status := REPAYMENT"
          - "Loan.accrued_interest_cents is CAPITALIZED into Loan.principal_balance_cents (same capitalization mechanic as DEFERMENT->REPAYMENT)"
          - "StatusChange row created with reason_code=RESUME_REPAYMENT"
          - "increments Loan.version by 1"

      - from: REPAYMENT
        to: DEFAULT
        trigger: "POST /loans/{id}/declare-default"
        actor: CollectionsAgent
        preconditions:
          - "loan.status == REPAYMENT"
          - "Loan.delinquency_days >= 270 (per calc default_delinquency_threshold)"
        side_effects:
          - "Loan.status := DEFAULT"
          - "StatusChange row created with reason_code=DEFAULT_DECLARATION"
          - "Cascade: every RepaymentPlan with status=ACTIVE for this Loan is set to SUPERSEDED (status := SUPERSEDED, superseded_by_plan_id := null). This cascade itself triggers the RepaymentPlan ACTIVE->SUPERSEDED transition's own side effects."
          - "increments Loan.version by 1"

      - from: DEFAULT
        to: REPAYMENT
        trigger: "POST /loans/{id}/rehabilitate"
        actor: CollectionsAgent
        preconditions:
          - "loan.status == DEFAULT"
          - "Loan has >= 9 APPLIED payments dated AFTER the most recent reason_code=DEFAULT_DECLARATION StatusChange.effective_at (per calc rehabilitation_count)"
        side_effects:
          - "Loan.status := REPAYMENT"
          - "StatusChange row created with reason_code=REHABILITATION_COMPLETE"
          - "increments Loan.version by 1"

      - from: REPAYMENT
        to: PAID_OFF
        trigger: "system: posted Payment causes principal_balance_cents + accrued_interest_cents == 0"
        actor: system
        preconditions:
          - "Loan.principal_balance_cents == 0"
          - "Loan.accrued_interest_cents == 0"
        side_effects:
          - "Loan.status := PAID_OFF"
          - "StatusChange row created with reason_code=PAY_OFF"
          - "increments Loan.version by 1"

      - from: REPAYMENT
        to: DISCHARGED
        trigger: "side-effect of DischargeApplication UNDER_REVIEW->APPROVED"
        actor: system
        preconditions:
          - "DischargeApplication.status transitions to APPROVED"
        side_effects:
          - "Loan.status := DISCHARGED"
          - "Loan.principal_balance_cents := 0"
          - "Loan.accrued_interest_cents := 0"
          - "StatusChange row created with reason_code=DISCHARGE_APPROVED"
          - "Cascade: every Payment for this Loan with status=PENDING is set to status=REVERSED"
          - "increments Loan.version by 1"

  - entity: RepaymentPlan
    initial_state: PENDING
    terminal_states: [SUPERSEDED, COMPLETED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /repayment-plans/{id}/activate"
        actor: LoanServicer
        preconditions:
          - "plan.status == PENDING"
          - "parent Loan.status == REPAYMENT"
          - "no other RepaymentPlan with loan_id == this.loan_id has status == ACTIVE"
        side_effects:
          - "RepaymentPlan.status := ACTIVE"
          - "increments RepaymentPlan.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /repayment-plans (creating a new plan for the same loan; requires expected_loan_version)"
        actor: LoanServicer
        preconditions:
          - "new plan.status == PENDING (newly created)"
          - "current ACTIVE plan exists for the same loan_id"
        side_effects:
          - "Previous ACTIVE RepaymentPlan.status := SUPERSEDED"
          - "Previous ACTIVE RepaymentPlan.superseded_by_plan_id := new plan.id"
          - "increments previous RepaymentPlan.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "side-effect of Loan REPAYMENT->DEFAULT (declare-default cascade)"
        actor: system
        preconditions:
          - "parent Loan.status transitions to DEFAULT"
        side_effects:
          - "RepaymentPlan.status := SUPERSEDED"
          - "RepaymentPlan.superseded_by_plan_id := null"
          - "increments RepaymentPlan.version by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "side-effect of Loan REPAYMENT->PAID_OFF"
        actor: system
        preconditions:
          - "parent Loan.status transitions to PAID_OFF"
        side_effects:
          - "RepaymentPlan.status := COMPLETED"
          - "increments RepaymentPlan.version by 1"

  - entity: DischargeApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /discharge-applications/{id}/begin-review"
        actor: LoanServicer
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "DischargeApplication.status := UNDER_REVIEW"
          - "increments DischargeApplication.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /discharge-applications/{id}/approve"
        actor: LoanServicer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "if discharge_type == VETERAN_TOTAL_DISABILITY then Borrower.is_veteran == true"
          - "if discharge_type == PSLF then Loan.pslf_qualifying_payment_count >= 120"
        side_effects:
          - "DischargeApplication.status := APPROVED"
          - "review_notes is persisted"
          - "Cascade: parent Loan REPAYMENT->DISCHARGED transition fires (this in turn triggers the Loan->Payment cascade — REVERSE all PENDING Payments)"
          - "increments DischargeApplication.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /discharge-applications/{id}/deny"
        actor: LoanServicer
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "DischargeApplication.status := DENIED"
          - "review_notes is persisted"
          - "increments DischargeApplication.version by 1"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [APPLIED, REVERSED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /payments/{id}/apply"
        actor: LoanServicer
        preconditions:
          - "payment.status == PENDING"
          - "parent Loan.status IN {REPAYMENT, DEFAULT} (DEFAULT permits rehabilitation-counter payments)"
        side_effects:
          - "Waterfall allocation: amount_cents is allocated first to Loan.accrued_interest_cents then to Loan.principal_balance_cents; principal_applied_cents / interest_applied_cents recorded; allocation is capped so neither balance goes negative"
          - "is_pslf_qualifying recomputed per §1.3 pslf_qualifying_count predicate set"
          - "If Loan.principal_balance_cents + Loan.accrued_interest_cents reaches 0 the parent Loan auto-transitions REPAYMENT->PAID_OFF"
          - "increments Payment.version by 1 (mutating Loan side effects also bump Loan.version per their own transitions)"

      - from: PENDING
        to: REVERSED
        trigger: "side-effect of Loan REPAYMENT->DISCHARGED"
        actor: system
        preconditions:
          - "parent Loan.status transitions to DISCHARGED"
          - "payment.status == PENDING"
        side_effects:
          - "Payment.status := REVERSED"
          - "increments Payment.version by 1"

      - from: APPLIED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: LoanServicer
        preconditions:
          - "payment.status == APPLIED"
        side_effects:
          - "Payment.status := REVERSED"
          - "Compensating: principal_applied_cents and interest_applied_cents are subtracted back from Loan.principal_balance_cents and Loan.accrued_interest_cents respectively, preserving the invariant: principal_balance_cents + accrued_interest_cents + sum(APPLIED Payments.principal_applied_cents + interest_applied_cents) is constant within a status window (see §1.3 calculation reversal_invariant)"
          - "Loan.pslf_qualifying_payment_count recomputed (REVERSED payments are excluded from the count)"
          - "increments Payment.version by 1; increments Loan.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: plan-create-stale-loan-version
    parent_entity: Loan
    write_endpoint: "POST /repayment-plans"
    occ_field: "expected_loan_version"
    description: |
      Creating a new RepaymentPlan against a Loan whose version has advanced
      since the client last observed it is rejected with 412. This captures
      the case where another writer has just submitted a competing plan
      (legitimately superseding the prior under the plan-supersede semantics
      in §1.2), and the current writer's view of the loan is therefore stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

  - rule_id: discharge-approve-stale-application-version
    parent_entity: DischargeApplication
    write_endpoint: "POST /discharge-applications/{id}/approve"
    occ_field: "expected_application_version"
    description: |
      Approving a DischargeApplication whose version has advanced since the
      reviewer fetched it is rejected with 412. Captures the case where
      another reviewer has already moved the application out of UNDER_REVIEW
      (or annotated it) and the current reviewer's snapshot is stale.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: idr_monthly_payment
    trigger: "On RepaymentPlan POST /repayment-plans create AND on RepaymentPlan PENDING->ACTIVE; recomputed when a new CERTIFIED IncomeCertification is recorded whose effective_date >= plan.effective_date for the same borrower"
    algorithm: tiered_pricing
    formula: |
      # Inputs (pinned at the moment of computation):
      #   agi          = Borrower.current_agi_cents (from latest CERTIFIED IncomeCertification)
      #   family_size  = Borrower.current_family_size
      #   state_code   = IncomeCertification.state_code on the SAME certification that supplied agi
      #   plan_type    = RepaymentPlan.plan_type
      #   principal    = Loan.principal_balance_cents + Loan.capitalized_interest_cents
      #   rate_bps     = Loan.interest_rate_bps
      #
      # Step 1 — poverty guideline lookup (cents/year per family member, see constants):
      #   pg_base = POVERTY_BASE_CENTS[state_code]
      #   pg_per_member = POVERTY_PER_MEMBER_CENTS[state_code]
      #   poverty_line = pg_base + pg_per_member * (family_size - 1)
      #
      # Step 2 — discretionary income (annual, cents):
      #   if plan_type == SAVE:
      #     discretionary = max(0, agi - 2.25 * poverty_line)      # 225% of poverty line
      #   elif plan_type in {IBR, PAYE}:
      #     discretionary = max(0, agi - 1.50 * poverty_line)      # 150% of poverty line
      #   else:  # STANDARD
      #     discretionary = NOT_USED
      #
      # Step 3 — annual IDR payment (cents):
      #   if plan_type == IBR:    annual = 0.15 * discretionary
      #   if plan_type == PAYE:   annual = 0.10 * discretionary
      #   if plan_type == SAVE:   annual = 0.10 * discretionary    # 10% for graduate-blended; this scaffold pins 10% as the SAVE rate
      #   if plan_type == STANDARD:
      #     # 10-year fixed amortization
      #     monthly_rate = rate_bps / 10000 / 12
      #     n = 120
      #     monthly = principal * monthly_rate / (1 - (1 + monthly_rate)^(-n))
      #     monthly_payment_cents = ROUND_HALF_UP(monthly)
      #     RETURN monthly_payment_cents
      #
      # Step 4 — Monthly:
      #   monthly = annual / 12
      #
      # Step 5 — round-after-dividing rule (pinned):
      #   monthly_payment_cents = ROUND_HALF_UP(monthly)
      #
      # Evaluation order is fixed: discretionary income is computed BEFORE rate selection;
      # rate is applied to discretionary; division by 12 is performed AFTER rate selection;
      # rounding is performed AFTER division.
    input_set: |
      Only the latest IncomeCertification with status=CERTIFIED for the borrower is consulted.
      Plan-type rate selection is based ON RepaymentPlan.plan_type at the moment of evaluation.
    constants:
      POVERTY_BASE_CENTS:
        CONTIGUOUS_48: 1558000   # $15,580 (one-person guideline used as base)
        ALASKA:        1947000
        HAWAII:        1791000
      POVERTY_PER_MEMBER_CENTS:
        CONTIGUOUS_48: 548000
        ALASKA:        686000
        HAWAII:        630000
      IBR_RATE: 0.15
      PAYE_RATE: 0.10
      SAVE_RATE: 0.10
      DISCRETIONARY_MULTIPLIER_IBR_PAYE: 1.50
      DISCRETIONARY_MULTIPLIER_SAVE: 2.25
      STANDARD_TERM_MONTHS: 120
    precision: "Cents (integer); ROUND_HALF_UP after the divide-by-12 step. No earlier rounding."
    variants:
      - name: IBR_variant
        when: "RepaymentPlan.plan_type == IBR"
        difference: "Uses 1.50 * poverty_line discretionary threshold AND 0.15 rate"
      - name: PAYE_variant
        when: "RepaymentPlan.plan_type == PAYE"
        difference: "Uses 1.50 * poverty_line discretionary threshold AND 0.10 rate"
      - name: SAVE_variant
        when: "RepaymentPlan.plan_type == SAVE"
        difference: "Uses 2.25 * poverty_line discretionary threshold AND 0.10 rate (significantly lower monthly payments at the same AGI relative to IBR/PAYE)"

  - name: interest_accrual
    trigger: "Continuous: applied at every Loan.status transition AND on POST /_clock/set_current_utc; accrues interest from Loan.last_accrual_date to current server clock (inclusive of start, exclusive of end day-of)"
    algorithm: chronological
    formula: |
      # Daily simple-interest rule with status-dependent subsidization.
      # Replay every day d in [last_accrual_date, current_clock):
      #
      #   daily_rate = rate_bps / 10000 / 365
      #   subsidized_today = (
      #     loan_type == DIRECT_SUB AND
      #     loan.status_at(d) IN {IN_SCHOOL, GRACE, DEFERMENT}
      #   )
      #   if subsidized_today:
      #     accrual_today = 0
      #   else:
      #     accrual_today = principal_balance_cents * daily_rate
      #
      #   accrued_interest_cents += ROUND_HALF_UP(accrual_today)   # per-day rounding
      #
      # Sum-then-round VARIANT (forward_looking) yields a different result;
      # this scaffold PINS per-day rounding above. The variant exists to expose
      # whether implementations choose the wrong order.
      #
      # Final step:
      #   Loan.last_accrual_date := current_clock
    input_set: "All days in the half-open window [Loan.last_accrual_date, current server clock)."
    constants:
      DAYS_PER_YEAR: 365
    precision: "Per-day ROUND_HALF_UP, accumulated as integer cents."
    variants:
      - name: chronological_per_day_rounding
        when: "Default; pinned by this scaffold"
        difference: "Rounds each day's accrual to cents BEFORE summing; status changes mid-window switch subsidy on/off on the correct calendar day"
      - name: forward_looking_sum_then_round
        when: "Alternative interpretation rejected by this scaffold but exposed for testing"
        difference: "Sums fractional accruals across the whole window then rounds; for identical inputs produces DIFFERENT cents than chronological_per_day_rounding"

  - name: pslf_qualifying_count
    trigger: "Recomputed on Loan.pslf_qualifying_payment_count read AND on every Payment PENDING->APPLIED, APPLIED->REVERSED, PENDING->REVERSED, QualifyingEmployment SUBMITTED->CERTIFIED, IncomeCertification SUBMITTED->CERTIFIED"
    algorithm: aggregation
    formula: |
      # Count payments p where ALL predicates hold:
      #
      #   (P1) p.status == APPLIED
      #   (P2) p.loan_id == this.loan_id
      #   (P3) p.amount_cents >= floor(plan.monthly_payment_cents) at the moment p.payment_date  -- 'full scheduled payment'
      #   (P4) There exists a QualifyingEmployment qe for the loan's borrower with:
      #          qe.status == CERTIFIED
      #          qe.employer_type IN {GOVERNMENT, NONPROFIT_501C3}
      #          qe.period_start <= p.payment_date <= qe.period_end
      #        (Both endpoints inclusive — closed interval semantics for employment.)
      #   (P5) The Loan's status_at(p.payment_date) == REPAYMENT
      #        (DEFERMENT/FORBEARANCE/IN_SCHOOL/GRACE/DEFAULT payments DO NOT count.)
      #   (P6) The RepaymentPlan ACTIVE for the Loan at p.payment_date had plan_type IN {IBR, PAYE, SAVE, STANDARD}
      #
      # Order: payments are scanned in (payment_date ASC, created_at ASC) for determinism.
      # The result is the integer count.
    input_set: |
      All Payment rows for this Loan; cross-referenced with the borrower's QualifyingEmployment
      rows and with the Loan's status history and active-plan history.
    constants:
      QUALIFYING_PAYMENT_THRESHOLD: 120
      QUALIFYING_EMPLOYER_TYPES: [GOVERNMENT, NONPROFIT_501C3]
    precision: "Exact integer count."
    variants:
      - name: strict_full_payment_predicate
        when: "Default"
        difference: "Payment amount must be >= floor(monthly_payment_cents); pinned"

  - name: rehabilitation_count
    trigger: "Evaluated as a precondition of POST /loans/{id}/rehabilitate"
    algorithm: aggregation
    formula: |
      # Count payments p where:
      #   p.status == APPLIED
      #   p.loan_id == this.loan_id
      #   p.payment_date > most_recent_default_declaration.effective_at
      # If count >= 9 the rehabilitate transition is permitted; otherwise rejected
      # with ERR_REHABILITATION_NOT_QUALIFIED.
    input_set: "Loan's Payments after the most recent reason_code=DEFAULT_DECLARATION StatusChange."
    precision: "Exact integer count."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-referenced Loan exists"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "all loan-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path-referenced Borrower exists"
    error_id: ERR_BORROWER_NOT_FOUND
    http_status: 404
    applies_to: "/borrowers/{id}/*"
  - priority: 5
    category: existence
    check: "Path-referenced RepaymentPlan / Payment / DischargeApplication / IncomeCertification / QualifyingEmployment exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all resource-id paths"
  - priority: 6
    category: state
    check: "Target resource is in the correct from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "When activating a RepaymentPlan, no other RepaymentPlan with the same loan_id is already ACTIVE"
    error_id: ERR_PLAN_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /repayment-plans/{id}/activate"
  - priority: 8
    category: business_safety
    check: "Veterans Discharge: when DischargeApplication.discharge_type == VETERAN_TOTAL_DISABILITY, Borrower.is_veteran must be true. Checked BEFORE business_constraint."
    error_id: ERR_NOT_VETERAN
    http_status: 422
    applies_to: "POST /discharge-applications/{id}/approve"
  - priority: 9
    category: business_safety
    check: "PSLF Discharge: when DischargeApplication.discharge_type == PSLF, Loan.pslf_qualifying_payment_count must be >= 120. Checked BEFORE business_constraint."
    error_id: ERR_PSLF_INSUFFICIENT_PAYMENTS
    http_status: 422
    applies_to: "POST /discharge-applications/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "When declaring default, Loan.delinquency_days must be >= 270"
    error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /loans/{id}/declare-default"
  - priority: 11
    category: business_constraint
    check: "Rehabilitation count: Loan must have >= 9 APPLIED payments dated AFTER the most recent DEFAULT_DECLARATION StatusChange"
    error_id: ERR_REHABILITATION_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /loans/{id}/rehabilitate"
  - priority: 12
    category: business_referential
    check: "OCC: expected_<parent>_version equals current parent version (per concurrency_rules)"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /repayment-plans"
  - priority: 13
    category: business_referential
    check: "OCC for DischargeApplication approval"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /discharge-applications/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "QualifyingEmployment.period_end must be > period_start"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /qualifying-employments"
  - priority: 15
    category: business_temporal
    check: "When posting a Payment, payment_date must be <= current server clock"
    error_id: ERR_FUTURE_PAYMENT
    http_status: 422
    applies_to: "POST /payments"
  - priority: 16
    category: business_fiscal
    check: "Payment.amount_cents must be >= 1 and <= Loan.principal_balance_cents + Loan.accrued_interest_cents (no over-payment)"
    error_id: ERR_PAYMENT_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /payments AND POST /payments/{id}/apply"
  - priority: 17
    category: business_constraint
    check: "Required input fields present (per endpoint input list) and correct enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Borrowers ---
  - method: POST
    path: "/loan-servicing/borrowers"
    description: "Create a Borrower"
    roles: [LoanServicer]
    code: 201
    input: ["full_name", "ssn_last4", "is_veteran?"]
    output: Borrower
    side_effects:
      - "Borrower row created"

  - method: GET
    path: "/loan-servicing/borrowers/{id}"
    description: "Retrieve a Borrower (computed AGI/family_size fields included)"
    roles: [LoanServicer, Borrower, CollectionsAgent]
    code: 200
    input: []
    output: Borrower

  - method: GET
    path: "/loan-servicing/borrowers"
    description: "List borrowers"
    roles: [LoanServicer]
    code: 200
    input: ["limit?", "offset?"]
    output: Borrower[]

  # --- Loans ---
  - method: POST
    path: "/loan-servicing/loans"
    description: "Create a Loan in ORIGINATED status"
    roles: [LoanServicer]
    code: 201
    input: ["borrower_id", "loan_type", "principal_cents", "interest_rate_bps", "disbursement_date"]
    output: Loan
    side_effects:
      - "Loan row created; status=ORIGINATED; principal_balance_cents := principal_cents; accrued_interest_cents := 0; capitalized_interest_cents := 0; last_accrual_date := disbursement_date"

  - method: GET
    path: "/loan-servicing/loans/{id}"
    description: "Retrieve a Loan (includes computed delinquency_days, pslf_qualifying_payment_count)"
    roles: [LoanServicer, Borrower, CollectionsAgent]
    code: 200
    input: []
    output: Loan

  - method: GET
    path: "/loan-servicing/loans"
    description: "List loans, optionally filtered by borrower"
    roles: [LoanServicer, CollectionsAgent]
    code: 200
    input: ["borrower_id?", "limit?", "offset?"]
    output: Loan[]

  - method: POST
    path: "/loan-servicing/loans/{id}/enter-school"
    description: "ORIGINATED -> IN_SCHOOL"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition ORIGINATED->IN_SCHOOL per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/graduate"
    description: "IN_SCHOOL -> GRACE"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition IN_SCHOOL->GRACE per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/start-repayment"
    description: "GRACE -> REPAYMENT"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition GRACE->REPAYMENT per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/request-deferment"
    description: "REPAYMENT -> DEFERMENT (borrower-initiated)"
    roles: [Borrower]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition REPAYMENT->DEFERMENT per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/request-forbearance"
    description: "REPAYMENT -> FORBEARANCE (borrower-initiated)"
    roles: [Borrower]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition REPAYMENT->FORBEARANCE per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/resume-repayment"
    description: "DEFERMENT|FORBEARANCE -> REPAYMENT (capitalizes accrued interest)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Capitalizes Loan.accrued_interest_cents into principal_balance_cents per §1.2"

  - method: POST
    path: "/loan-servicing/loans/{id}/declare-default"
    description: "REPAYMENT -> DEFAULT (CollectionsAgent only)"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition REPAYMENT->DEFAULT per §1.2; cascade-supersedes ACTIVE RepaymentPlans"

  - method: POST
    path: "/loan-servicing/loans/{id}/rehabilitate"
    description: "DEFAULT -> REPAYMENT (requires 9 post-default APPLIED payments)"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan transition DEFAULT->REPAYMENT per §1.2"

  - method: GET
    path: "/loan-servicing/loans/{id}/status-changes"
    description: "List StatusChange entries for a Loan (chronological ASC by effective_at then created_at)"
    roles: [LoanServicer, Borrower, CollectionsAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: StatusChange[]

  # --- Repayment Plans ---
  - method: POST
    path: "/loan-servicing/repayment-plans"
    description: "Create a RepaymentPlan in PENDING status (supersedes any current ACTIVE plan on activation)"
    roles: [LoanServicer]
    code: 201
    input: ["loan_id", "plan_type", "effective_date", "expected_loan_version"]
    output: RepaymentPlan
    side_effects:
      - "RepaymentPlan row created; monthly_payment_cents computed per §1.3 idr_monthly_payment using the latest CERTIFIED IncomeCertification of the loan's borrower"
      - "increments Loan.version by 1"

  - method: POST
    path: "/loan-servicing/repayment-plans/{id}/activate"
    description: "PENDING -> ACTIVE; supersedes prior ACTIVE plan for the same loan"
    roles: [LoanServicer]
    code: 200
    input: []
    output: RepaymentPlan
    side_effects:
      - "RepaymentPlan PENDING->ACTIVE; prior ACTIVE plan ACTIVE->SUPERSEDED with superseded_by_plan_id pointing to this plan per §1.2"

  - method: GET
    path: "/loan-servicing/repayment-plans/{id}"
    description: "Retrieve a RepaymentPlan"
    roles: [LoanServicer, Borrower]
    code: 200
    input: []
    output: RepaymentPlan

  - method: GET
    path: "/loan-servicing/repayment-plans"
    description: "List repayment plans (filterable by loan_id and/or superseded_by_plan_id)"
    roles: [LoanServicer, Borrower]
    code: 200
    input: ["loan_id?", "superseded_by_plan_id?", "limit?", "offset?"]
    output: RepaymentPlan[]

  # --- Income Certifications ---
  - method: POST
    path: "/loan-servicing/income-certifications"
    description: "Create an IncomeCertification (SUBMITTED)"
    roles: [Borrower]
    code: 201
    input: ["borrower_id", "agi_cents", "family_size", "state_code", "effective_date"]
    output: IncomeCertification

  - method: POST
    path: "/loan-servicing/income-certifications/{id}/certify"
    description: "SUBMITTED -> CERTIFIED"
    roles: [LoanServicer]
    code: 200
    input: []
    output: IncomeCertification
    side_effects:
      - "All RepaymentPlans for the borrower's loans whose status IN {PENDING, ACTIVE} and whose effective_date <= this.effective_date have monthly_payment_cents recomputed per §1.3 idr_monthly_payment"

  - method: GET
    path: "/loan-servicing/income-certifications/{id}"
    description: "Retrieve an IncomeCertification"
    roles: [LoanServicer, Borrower]
    code: 200
    input: []
    output: IncomeCertification

  - method: GET
    path: "/loan-servicing/income-certifications"
    description: "List income certifications (filter by borrower)"
    roles: [LoanServicer, Borrower]
    code: 200
    input: ["borrower_id?", "limit?", "offset?"]
    output: IncomeCertification[]

  # --- Qualifying Employments ---
  - method: POST
    path: "/loan-servicing/qualifying-employments"
    description: "Create a QualifyingEmployment (SUBMITTED)"
    roles: [Borrower]
    code: 201
    input: ["borrower_id", "employer_name", "employer_type", "period_start", "period_end"]
    output: QualifyingEmployment

  - method: POST
    path: "/loan-servicing/qualifying-employments/{id}/certify"
    description: "SUBMITTED -> CERTIFIED"
    roles: [LoanServicer]
    code: 200
    input: []
    output: QualifyingEmployment
    side_effects:
      - "Loan.pslf_qualifying_payment_count is recomputed for all Loans of this borrower"

  - method: GET
    path: "/loan-servicing/qualifying-employments/{id}"
    description: "Retrieve a QualifyingEmployment"
    roles: [LoanServicer, Borrower]
    code: 200
    input: []
    output: QualifyingEmployment

  - method: GET
    path: "/loan-servicing/qualifying-employments"
    description: "List qualifying employments (filter by borrower)"
    roles: [LoanServicer, Borrower]
    code: 200
    input: ["borrower_id?", "limit?", "offset?"]
    output: QualifyingEmployment[]

  # --- Payments ---
  - method: POST
    path: "/loan-servicing/payments"
    description: "Post a Payment (status=PENDING; not yet applied)"
    roles: [Borrower, LoanServicer]
    code: 201
    input: ["loan_id", "amount_cents", "payment_date"]
    output: Payment

  - method: POST
    path: "/loan-servicing/payments/{id}/apply"
    description: "PENDING -> APPLIED; waterfall to interest then principal; may auto-trigger PAID_OFF"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Waterfall allocation per §1.2 Payment transitions; auto Loan REPAYMENT->PAID_OFF if balance reaches 0"

  - method: POST
    path: "/loan-servicing/payments/{id}/reverse"
    description: "APPLIED -> REVERSED (compensating; reverses both balances)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Compensating reversal per §1.2; preserves the reversal_invariant"

  - method: GET
    path: "/loan-servicing/payments/{id}"
    description: "Retrieve a Payment"
    roles: [LoanServicer, Borrower]
    code: 200
    input: []
    output: Payment

  - method: GET
    path: "/loan-servicing/payments"
    description: "List payments (filter by loan_id, repayment_plan_id, and/or reversed_by_payment_id)"
    roles: [LoanServicer, Borrower]
    code: 200
    input: ["loan_id?", "repayment_plan_id?", "reversed_by_payment_id?", "limit?", "offset?"]
    output: Payment[]

  # --- Discharge Applications ---
  - method: POST
    path: "/loan-servicing/discharge-applications"
    description: "File a discharge application (SUBMITTED)"
    roles: [Borrower]
    code: 201
    input: ["loan_id", "discharge_type", "review_notes?"]
    output: DischargeApplication

  - method: POST
    path: "/loan-servicing/discharge-applications/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [LoanServicer]
    code: 200
    input: []
    output: DischargeApplication

  - method: POST
    path: "/loan-servicing/discharge-applications/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED; cascades Loan REPAYMENT->DISCHARGED which cascades PENDING Payment->REVERSED"
    roles: [LoanServicer]
    code: 200
    input: ["review_notes?", "expected_application_version"]
    output: DischargeApplication
    side_effects:
      - "DischargeApplication UNDER_REVIEW->APPROVED per §1.2"
      - "Cascade: parent Loan REPAYMENT->DISCHARGED; secondary cascade: all PENDING Payments REVERSED"

  - method: POST
    path: "/loan-servicing/discharge-applications/{id}/deny"
    description: "UNDER_REVIEW -> DENIED"
    roles: [LoanServicer]
    code: 200
    input: ["review_notes?"]
    output: DischargeApplication

  - method: GET
    path: "/loan-servicing/discharge-applications/{id}"
    description: "Retrieve a discharge application"
    roles: [LoanServicer, Borrower]
    code: 200
    input: []
    output: DischargeApplication

  - method: GET
    path: "/loan-servicing/discharge-applications"
    description: "List discharge applications (filter by loan)"
    roles: [LoanServicer, Borrower]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: DischargeApplication[]

  # --- Test-driving endpoint (clock) ---
  - method: POST
    path: "/loan-servicing/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC instant; triggers a flat interest_accrual recomputation"
    roles: [LoanServicer]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects:
      - "Server clock advanced; interest_accrual is invoked for every Loan; delinquency_days is recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "Path-referenced Loan does not exist"
  - id: ERR_BORROWER_NOT_FOUND
    http: 404
    condition: "Path-referenced Borrower does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-referenced RepaymentPlan / Payment / DischargeApplication / IncomeCertification / QualifyingEmployment does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in the from-state required for the transition"
  - id: ERR_PLAN_ALREADY_ACTIVE
    http: 409
    condition: "Activating a plan while another plan for the same loan is already ACTIVE"
  - id: ERR_NOT_VETERAN
    http: 422
    condition: "Veteran discharge requested for a borrower whose is_veteran is false"
  - id: ERR_PSLF_INSUFFICIENT_PAYMENTS
    http: 422
    condition: "PSLF discharge requested when Loan.pslf_qualifying_payment_count < 120"
  - id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http: 422
    condition: "Default declared when Loan.delinquency_days < 270"
  - id: ERR_REHABILITATION_NOT_QUALIFIED
    http: 422
    condition: "Rehabilitate requested with fewer than 9 post-default APPLIED payments"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "Concurrent plan creation: expected_loan_version mismatch"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "Concurrent discharge approval: expected_application_version mismatch"
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "QualifyingEmployment.period_end <= period_start"
  - id: ERR_FUTURE_PAYMENT
    http: 422
    condition: "Payment.payment_date is after server's current clock"
  - id: ERR_PAYMENT_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "Payment amount < 1 cent or > total outstanding (principal_balance_cents + accrued_interest_cents)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, malformed enum, or unknown field"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoanServicer
    description: "Servicing-side operator (federal servicer); processes lifecycle transitions, certifications, payments, and discharge applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /loan-servicing/borrowers"
      - "POST /loan-servicing/loans"
      - "POST /loan-servicing/loans/{id}/enter-school"
      - "POST /loan-servicing/loans/{id}/graduate"
      - "POST /loan-servicing/loans/{id}/start-repayment"
      - "POST /loan-servicing/loans/{id}/resume-repayment"
      - "POST /loan-servicing/repayment-plans"
      - "POST /loan-servicing/repayment-plans/{id}/activate"
      - "POST /loan-servicing/income-certifications/{id}/certify"
      - "POST /loan-servicing/qualifying-employments/{id}/certify"
      - "POST /loan-servicing/payments/{id}/apply"
      - "POST /loan-servicing/payments/{id}/reverse"
      - "POST /loan-servicing/discharge-applications/{id}/begin-review"
      - "POST /loan-servicing/discharge-applications/{id}/approve"
      - "POST /loan-servicing/discharge-applications/{id}/deny"
      - "POST /loan-servicing/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
      - "POST /loan-servicing/payments (also Borrower)"

  - name: Borrower
    description: "End-user borrower; can submit certifications, request deferment/forbearance on their own loans, post payments, file discharge applications."
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /loan-servicing/loans/{id}/request-deferment"
      - "POST /loan-servicing/loans/{id}/request-forbearance"
      - "POST /loan-servicing/income-certifications"
      - "POST /loan-servicing/qualifying-employments"
      - "POST /loan-servicing/discharge-applications"
    shared_operations:
      - "GET on borrower's own resources (Loan, Borrower, RepaymentPlan, IncomeCertification, QualifyingEmployment, Payment, DischargeApplication)"
      - "POST /loan-servicing/payments"

  - name: CollectionsAgent
    description: "Default/collections operator; declares default and processes rehabilitation."
    identity: "opaque"
    exclusive_operations:
      - "POST /loan-servicing/loans/{id}/declare-default"
      - "POST /loan-servicing/loans/{id}/rehabilitate"
    shared_operations:
      - "GET on Loan, Borrower, StatusChange"
