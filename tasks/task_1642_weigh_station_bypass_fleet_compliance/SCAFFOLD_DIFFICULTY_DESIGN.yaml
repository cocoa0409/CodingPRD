            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-03T10:00:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev1: $.data.id }
            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "${veh_id}", station_id: "${st_id}", approach_at: "2026-08-03T11:00:00Z", measured_weight_lbs: 90000, credentials_presented: ["IFTA", "IRP", "UCR"] }
              as: TelematicsGateway
              captures: { ev2: $.data.id }
            - call: "POST /api/bypass-disputes"
              payload: { bypass_event_id: "${ev1}", reason: "first overweight dispute", claimed_credit_cents: 4000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { dsp1: $.data.id }
            - call: "POST /api/bypass-disputes"
              payload: { bypass_event_id: "${ev2}", reason: "second overweight dispute", claimed_credit_cents: 2000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { dsp2: $.data.id }
            - call: "POST /api/bypass-disputes/${dsp1}/adjudicate"
              payload: { outcome: "OVERTURNED", credit_amount_cents: 3000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /api/bypass-disputes/${dsp2}/adjudicate"
              payload: { outcome: "OVERTURNED", credit_amount_cents: 1500 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers/${car_id}/close-billing-period"
              payload: { period_year: 2026, period_month: 8 }
              as: FinanceAdmin
              captures: { inv_id: $.data.id, inv_status: $.data.status, inv_due: $.data.amount_due_cents, inv_credit: $.data.credit_applied_cents }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: FinanceAdmin
              captures: { car_balance: $.data.credit_balance_cents, car_ledger: $.data.credit_ledger }
          assert:
            - "Invoice.${inv_id}: gross_cents == 1799, credit_applied_cents == 1799 (min(4500, 1799)), amount_due_cents == 0"
            - "Invoice.${inv_id}.status == PAID immediately at close (zero-due rule) — no record-payment call made"
            - "Carrier.credit_balance_cents == 2701"
            - "credit_ledger has exactly 3 entries: +3000 DISPUTE_OVERTURN_CREDIT, +1500 DISPUTE_OVERTURN_CREDIT, -1799 INVOICE_CREDIT_APPLICATION; SUM == 2701 == credit_balance_cents (invariant holds through grant and application)"

      - name: subscription_day_partition_conservation
        grounds:
          - calculations.subscription_period_invoice
          - state_machines.VehicleSubscription
          - entities.VehicleSubscription.fields.paused_days_current_period
        distinguishing_aspect: |
          Conserved quantity: period day-count — for an August subscription paused 2026-08-16 and resumed
          2026-08-21, billable_days (26) + paused days (5) == overlap_days (31) exactly; the forward pause and
          the compensating resume leave the partition closed, the invoice line bills 1509
          (round_half_up(1799*26/31)), and the pause counter resets to 0 at close.
        test_recipe:
          setup:
            - "Clock 2026-08-01; carrier ACTIVE (iss 30); vehicle with subscription ACTIVE 2026-08-01..2026-12-31 and credential ACTIVE"
            - "2026-08-16: snapshot iss 90 => credential SUSPENDED + subscription PAUSED (paused_at 2026-08-16)"
            - "2026-08-21: snapshot iss 20 => posture ELIGIBLE; credential manually reactivated => subscription resumes ACTIVE accruing 5 paused days (08-16..08-20)"
            - "2026-09-01: period closed"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA", requires_weight_clearance: true }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { participation_status: "PARTICIPATING", expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { car_v2: $.data.version }
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/bypass-credentials"
              payload: { vehicle_id: "${veh_id}", device_type: "TRANSPONDER", device_serial: "SN-0001" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 90, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-16", expected_carrier_version: "${car_v2}" }
              as: SafetyDataFeed
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { car_v3: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 20, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-21", expected_carrier_version: "${car_v3}" }
              as: SafetyDataFeed
            - call: "POST /api/bypass-credentials/${cred_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { cred_status: $.data.status }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/carriers/${car_id}/close-billing-period"
              payload: { period_year: 2026, period_month: 8 }
              as: FinanceAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}" }
              as: FinanceAdmin
              captures: { sub_status: "$.data[0].status", sub_paused_days: "$.data[0].paused_days_current_period" }
          assert:
            - "credential reactivation succeeded (status ACTIVE) even though subscription was PAUSED — PAUSED covering subscriptions auto-resume"
            - "Invoice.${inv_id}.lines[0].billable_days == 26 and line_net_cents == 1509 (round_half_up(1799*26/31))"
            - "day partition conserved: 26 billable + 5 paused == 31 overlap days of August"
            - "after close: subscription ${sub_id}.paused_days_current_period == 0 (reset) and status == ACTIVE"
            - "Invoice.${inv_id}.gross_cents == 1509 and amount_due_cents == 1509 (no credits)"
