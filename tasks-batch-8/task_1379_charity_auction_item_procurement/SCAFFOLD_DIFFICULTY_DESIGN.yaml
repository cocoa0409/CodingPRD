            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "Chair", description: "Oak", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it1: "$.data.id", it1_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "Lamp", description: "Brass", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it2: "$.data.id", it2_v: "$.data.version" } }
            - { call: "POST /items/${it1}/valuations", payload: { fmv_cents: 25000, fmv_source: "APPRAISAL", expected_item_version: "${it1_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /items/${it2}/valuations", payload: { fmv_cents: 15000, fmv_source: "APPRAISAL", expected_item_version: "${it2_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Furniture pair" }, as: CatalogManager, captures: { bd: "$.data.id" } }
          trigger:
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it1}" }, as: CatalogManager, captures: { fmv1: "$.data.bundle_fmv_cents" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it2}" }, as: CatalogManager, captures: { fmv2: "$.data.bundle_fmv_cents" } }
            - { call: "DELETE /bundles/${bd}/items/${it2}", payload: {}, as: CatalogManager, captures: { fmv3: "$.data.bundle_fmv_cents", it2_st: "$.data.status" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it2}" }, as: CatalogManager, captures: { fmv4: "$.data.bundle_fmv_cents", bd_ver: "$.data.version" } }
          assert:
            - "after attach iA: bundle_fmv_cents == 25000"
            - "after attach iB: bundle_fmv_cents == 40000"
            - "after detach iB: bundle_fmv_cents == 25000 (compensation restores exactly)"
            - "after re-attach iB: bundle_fmv_cents == 40000 and Bundle.version == 5 (create + 4 mutations)"
            - "sum invariant holds at every step: bundle_fmv_cents == sum(current_fmv_cents of attached items)"

      - name: winner_cardinality_conservation_across_refund
        grounds:
          - state_machines.Bid.ACTIVE_to_WINNER
          - state_machines.Bundle.SOLD_to_UNSOLD
        distinguishing_aspect: |
          Conserved quantity = winner-cardinality per bundle: count(Bid WINNER) ==
          (1 iff bundle SOLD else 0). The close cascade establishes 1 winner; the
          refund compensation returns the bundle to UNSOLD and the winner count to
          0 — the invariant holds on both sides of the compensating pair.
