              payload: {}
              as: ProgramAdmin
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "suspend: HTTP 200, data.status == \"SUSPENDED\", data.suspension_reason == \"audit hold\""
            - "the field read during suspension reports status == \"SUSPENDED\" (cascaded from ENROLLED, not from DRAFT)"
            - "the enrollment read during suspension reports status == \"SUSPENDED\" and its permanence_status is unchanged by the suspension"
            - "the data-packet write returns HTTP 409 with error_id ERR_GROWER_SUSPENDED — priority 7 wins over the priority 9 invalid-state error the SUSPENDED enrollment would also earn"
            - "the new-field write also returns ERR_GROWER_SUSPENDED and creates nothing (a later GET /fields?grower_id=${g1_id} still returns total_count == 1)"
            - "both GETs during suspension return HTTP 200 — suspension blocks writes only"
            - "after reinstate: the field is back to \"ENROLLED\" and the enrollment back to \"ACTIVE\" — the cascade restores the pre-suspension states rather than the initial ones"

      - name: baseline_rejection_is_terminal_and_leaves_enrollment_in_accepted
