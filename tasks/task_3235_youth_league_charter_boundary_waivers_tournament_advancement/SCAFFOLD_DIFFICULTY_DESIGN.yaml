              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { maj: "$.data[2].id" }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Pe", last_name: "Nding", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/all-star-rosters"
              payload: { division_id: "${maj}" }
              as: LeagueAdministrator
              captures: { ros: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p1}" }
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PLAYER_NOT_ELIGIBLE (P1 is PENDING — the roster's own OPEN state is not enough)"
            - "AllStarRoster.${ros}.roster_size == 0"

