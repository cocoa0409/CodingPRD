            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T08:00:00Z" }, as: ClubAdmin }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /reservations/${r1}/confirm", payload: {}, as: Member, as_user_id: "${m}" }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { rem_after_confirm: "$.data.reservations_remaining_this_week" } }
            - { call: "POST /reservations/${r1}/cancel", payload: {}, as: Member, as_user_id: "${m}" }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { rem_after_cancel: "$.data.reservations_remaining_this_week" } }
          assert:
            - "after confirm: Member.${m}.reservations_used_this_week == 1 and Member.${m}.reservations_remaining_this_week == 3"
            - "after cancel: Member.${m}.reservations_used_this_week == 0 and Member.${m}.reservations_remaining_this_week == 4"
            - "reservations_used_this_week + reservations_remaining_this_week == 4 at both observation points (no drift)"

      - name: ci_fee_ledger_assess_waive
        grounds:
          - calculations.member_fee_ledger
          - state_machines.DamageReport.FILED_to_ASSESSED
          - state_machines.Fee.ASSESSED_to_WAIVED
        distinguishing_aspect: "The conserved quantity is the fee-ledger money total: outstanding_fees_cents + waived_fees_cents + paid_fees_cents == sum of all the member's Fee.amount_cents (30000); assessing a damage fee moves 30000 into outstanding and waiving moves it into waived with the total conserved — a monetary conserved quantity, distinct from the weekly-credit count."
        test_recipe:
          setup:
            - "A SAIL member (deductible 30000) is ACTIVE and BASIC-certified with a reservation; a MODERATE damage report with repair_cost_cents=30000 is FILED, then ASSESSED, producing a single 30000-cent DAMAGE Fee."
