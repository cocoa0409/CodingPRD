            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${la}", as: Any, captures: { bia: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bia}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${la}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TF" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tf: "$.data.id" } }
            - { call: "POST /spd/trays/${tf}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tf}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tf}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tf}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
