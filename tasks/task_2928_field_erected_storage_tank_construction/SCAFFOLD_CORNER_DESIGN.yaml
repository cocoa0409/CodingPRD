      - name: seam_predecessor_chains_are_walked_to_a_root
        claim_type: acyclicity_walk
        grounds:
          - validations.priority_37_ERR_SEAM_SEQUENCE_CYCLE
          - endpoints.POST_weld_seams
        distinguishing_aspect: |
          The acyclicity rule is enforced by walking predecessor_seam_id to a seam with no
          predecessor, and the honest observable is that the walk terminates on a deep chain
          and that an unresolvable link is a 404 rather than a cycle report. A true cycle is
          unreachable through the declared write surface - predecessor_seam_id is set only at
          creation and no endpoint updates it, so a new seam can never be part of an existing
          chain - which is exactly why the rule must be implemented as a bounded walk and not
          as a graph mutation check.
        test_recipe:
          setup:
            - "Tank TK-101 with course 1 in its initial SPECIFIED state - declaring a seam needs only its parent course, not a fitted one, so no foundation is required here."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "A", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { sa: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "B", length_in: 96, sequence_index: 2, predecessor_seam_id: "${sa}" }
              as: ErectionSuperintendent
              captures: { sb: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "C", length_in: 96, sequence_index: 3, predecessor_seam_id: "${sb}" }
              as: ErectionSuperintendent
              captures: { sc: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "D", length_in: 96, sequence_index: 4, predecessor_seam_id: "00000000-0000-4000-8000-000000000000" }
              as: ErectionSuperintendent
          assert:
            - "A, B and C are all created with HTTP 201: the three-deep chain C -> B -> A terminates at a root with predecessor_seam_id == null, so the acyclicity walk accepts it"
            - "WeldSeam.${sc}.predecessor_seam_id == ${sb} and WeldSeam.${sb}.predecessor_seam_id == ${sa}"
            - "seam D, whose predecessor_seam_id does not resolve, returns HTTP 404 ERR_WELD_SEAM_NOT_FOUND - referential resolution (priority 6-class) precedes the acyclicity walk (priority 37) - and no seam D row exists"
            - "GET /weld-seams?shell_course_id=${course_id} returns total_count == 3"
            - "ERR_SEAM_SEQUENCE_CYCLE is retained as a defensive guard: no sequence of declared calls can close a predecessor cycle, so an implementation must still bound the walk, but there is no request that returns this id"

      - name: cancelling_an_already_cancelled_withdrawal_is_rejected
        claim_type: idempotency_rejection
        grounds:
          - validations.priority_19_ERR_WITHDRAWAL_STATE_INVALID
          - state_machines.WaterWithdrawal.terminal_states
        distinguishing_aspect: |
          Cancellation is not idempotent: the second call is refused rather than silently
          re-accepted, which matters because the volume ledger is adjusted by the transition -
          a tolerated repeat would credit the permit twice.
        test_recipe:
          setup:
            - "A DRAFT hydrotest plan on tank TK-101 with one RESERVED 400,000 gal withdrawal against a 2,000,000 gal source. Reservations do not require an approved plan."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id, tank_v: $.data.version }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id, ws_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v}" }
              as: ErectionSuperintendent
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /water-withdrawals/${wd_id}/cancellation"
              payload: { cancellation_reason: "intake permit re-negotiated" }
              as: ErectionSuperintendent
            - call: "POST /water-withdrawals/${wd_id}/cancellation"
              payload: { cancellation_reason: "duplicate submission by the field crew" }
              as: ErectionSuperintendent
          assert:
            - "the first cancellation returns HTTP 200 with status == 'CANCELLED' and cancellation_reason == 'intake permit re-negotiated'"
            - "after it WaterSource.${ws_id}.reserved_volume_gal == 0.00 and available_volume_gal == 2000000.00, and HydrotestPlan.${plan_id}.total_cost_usd == 0.00 because the only withdrawal was excluded from the cost recomputation"
            - "the second cancellation returns HTTP 409 ERR_WITHDRAWAL_STATE_INVALID"
            - "the ledger is untouched by the refusal: available_volume_gal is still 2000000.00, not 2400000.00, and cancellation_reason still reads 'intake permit re-negotiated'"

      - name: non_advancing_fill_and_mismatched_hold_point_are_rejected
        claim_type: progress_and_hold_point_rejection
        grounds:
          - validations.priority_43_ERR_FILL_PERCENT_NOT_ADVANCING
          - validations.priority_44_ERR_SETTLEMENT_HOLD_POINT_MISSING
        distinguishing_aspect: |
          The filling sequence is monotone and each mandatory hold point must be evidenced by
          a survey taken at that very fill level: re-declaring the level already reached is
          not progress, and carrying yesterday's 25 percent survey into the 50 percent hold
          point is not evidence. The two failures are adjacent priorities on the same
          endpoint, so the first must mask the second when both apply.
        test_recipe:
          setup:
            - "Tank TK-101 at SHELL_COMPLETE with an APPROVED plan, one 400,000 gal reservation and the 25 percent hold point already cleared, so fill_percent_current is 25.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
