          assert:
            - "after trigger call 1: schedule_status == \"SCHEDULED\", clearance_status == \"PENDING_PREP\", scheduled_end_at == \"2026-09-14T14:20:00.000Z\", block_end_at == \"2026-09-14T14:40:00.000Z\""
            - "after trigger call 2: clearance_status == \"CLEARED\", clearance_block_reason is null, schedule_status still \"SCHEDULED\""
            - "after trigger call 3: clearance_status == \"BLOCKED\", clearance_block_reason == \"ANTICOAG_HOLD_INCOMPLETE\", schedule_status still \"SCHEDULED\""
            - "after trigger call 4: clearance_status back to \"CLEARED\", clearance_block_reason is null, schedule_status still \"SCHEDULED\" (the clearance cycle never disturbed the schedule dimension)"
            - "after trigger call 5: schedule_status still \"SCHEDULED\" (self-loop, not a new state), scheduled_start_at == \"2026-09-14T16:00:00.000Z\", scheduled_end_at == \"2026-09-14T16:20:00.000Z\", block_end_at == \"2026-09-14T16:40:00.000Z\", clearance_status still \"CLEARED\""
            - "trigger call 6 returns turnover_minutes == 20 and procedure_minutes == 20 unchanged by the reschedule"
            - "an implementation that models one combined case status cannot represent SCHEDULED + BLOCKED and will fail call 3 or lose the schedule window at call 4"

      - name: nl_scope_reprocessing_full_cycle
        grounds:
          - state_machines[ScopeAsset.status]
          - state_machines[ReprocessingLog.log_status]
          - validations[priority=56]
          - endpoints[POST /urology/scope-assets/{id}/commissioning]
          - endpoints[POST /urology/reprocessing-logs/{id}/complete]
          - calculations.check_in_readiness_gates.constants.SCOPE_REPROCESS_SLA_HOURS
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind on a single dimension: ScopeAsset.status
          leaves AVAILABLE, passes through IN_USE and SOILED, sits in REPROCESSING
          across three consecutive stage closures that change other fields without
          changing status, and returns to its initial state AVAILABLE. Two of the
          five stages are status no-ops (MANUAL_CLEAN) or field-only mutators
