  - rule_id: priority_pair_validation_conflict
    instances:
      - name: privacy_safety_outranks_response_window_temporal_on_proof_submission
        grounds:
          - validations[priority=18]
          - validations[priority=21]
          - errors[ERR_PRIVACY_REDACTION_REQUIRED]
          - errors[ERR_RESPONSE_WINDOW_CLOSED]
          - endpoints[POST /proof-submissions]
        distinguishing_aspect: |
          Dual failure across the business_safety (p18 ERR_PRIVACY_REDACTION_REQUIRED) vs business_temporal
          (p21 ERR_RESPONSE_WINDOW_CLOSED) category pair: an unredacted JOINT_TAX_RETURN filed after the response
          deadline violates both, and the lower-numbered privacy rule must win so the response never reveals that
          the sensitive document was even evaluated for timeliness.
