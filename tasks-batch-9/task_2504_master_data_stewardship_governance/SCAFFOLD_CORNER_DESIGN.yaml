        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT, posture OPEN) with Olivia DATA_OWNER, Sam DATA_STEWARD, CERTIFIED ERP registered as AUTHORITATIVE, and one CRITICAL rule QR1 (40 pts, threshold 90.00) owned by the PRINCIPAL Olivia."
