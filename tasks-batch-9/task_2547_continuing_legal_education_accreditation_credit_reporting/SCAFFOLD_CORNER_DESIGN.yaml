      - name: an_appeal_at_exactly_thirty_days_is_refused_while_one_second_earlier_is_heard
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CourseApplication.DENIED_to_APPEALED
          - domain_constants.APPEAL_WINDOW_DAYS
          - validations[priority 68 -> ERR_APPEAL_WINDOW_EXPIRED]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The appeal precondition is the strict inequality clock_now < denied_at + 30 days, so the instant 2026-08-31T00:00:00Z is already too late while 2026-08-30T23:59:59Z is still in time — the window is half-open at its far end."
        test_recipe:
          setup:
            - "A DENIED application denied at the default clock instant 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Deadline CLE Works", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Wellness And Bias Awareness", delivery_format: "LIVE_WEBCAST", total_minutes: 120, presented_at: "2026-06-06T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "BIAS_ELIMINATION", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/courses/${crs_id}/applications"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "DENY", denial_reason: "Faculty credentials were not documented." }
              as: AccreditationReviewer
              as_user_id: "33333333-3333-4333-8333-333333333333"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "APPEAL", appeal_grounds: "Credentials were attached to the original filing." }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_APPEAL_WINDOW_EXPIRED
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59Z" }
              as: BoardAdmin
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
