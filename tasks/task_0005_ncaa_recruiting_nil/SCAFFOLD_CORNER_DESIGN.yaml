# =============================================================================
# §1.9 Scaffold Corner Design — NCAA Recruiting & NIL Compliance
# Breadth coverage of testable claims not already exercised by §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: program_create_returns_201_and_default_computed_fields
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints[POST /ncaa/programs]
        distinguishing_aspect: |
          POST /ncaa/programs with required fields returns 201 + Program with
          slots_committed=0, slots_projected=0, penalty_tier=NONE, version=1.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Greenfield U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, slots: $.data.slots_committed, tier: $.data.penalty_tier, ver: $.data.version }
          assert:
            - "slots == 0"
            - "tier == NONE"
            - "ver == 1"

      - name: student_athlete_default_eligibility_uncertified
        claim_type: defaults
        grounds:
          - entities.StudentAthlete.fields.eligibility_status
          - entities.StudentAthlete.fields.in_transfer_portal
          - endpoints[POST /ncaa/student-athletes]
        distinguishing_aspect: |
          Newly created StudentAthlete returns eligibility_status=UNCERTIFIED,
          in_transfer_portal=false, enrolled_program_id=null, version=1.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Newbie", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id, status: $.data.eligibility_status, portal: $.data.in_transfer_portal, ver: $.data.version }
          assert:
            - "status == UNCERTIFIED"
            - "portal == false"
            - "ver == 1"

      - name: program_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints[GET /ncaa/programs/{id}]
        distinguishing_aspect: |
          GET /ncaa/programs/{bogus-uuid} returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /ncaa/programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: nildeal_missing_gross_value_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /ncaa/nil-deals]
        distinguishing_aspect: |
          POST /ncaa/nil-deals missing required `gross_value_cents` returns
          400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Athlete exists."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Ath", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id }
          trigger:
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${ath_id}", brand_name: "Brand", agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${ath_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: invalid_enum_sport_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.StudentAthlete.fields.sport_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /ncaa/student-athletes with sport_code='LACROSSE' (not in enum)
          returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "X", sport_code: "LACROSSE", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: list_programs_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Program
          - endpoints[GET /ncaa/programs]
        distinguishing_aspect: |
          GET /ncaa/programs returns paginated list with limit, offset,
          total_count, has_more fields per the response envelope.
        test_recipe:
          setup:
            - "Two programs exist."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "U1", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "U2", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
          trigger:
            - call: "GET /ncaa/programs"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "response includes meta.api_request_id starting with 'req_'"
            - "response_type == 'array'"
            - "data.has_more == true"
            - "data.total_count == 2"
            - "data.limit == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: scholarship_offer_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.ScholarshipOffer
          - endpoints[POST /ncaa/scholarship-offers]
        distinguishing_aspect: |
          POST /ncaa/scholarship-offers returns status=DRAFT immediately;
          slots_committed not yet incremented.
        test_recipe:
          setup:
            - "Program FB, CERTIFIED athlete exists."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Init U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Y", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { y_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${y_id}", annual_value_cents: 5000000 }
              as: Coach
              captures: { off_status: $.data.status, off_id: $.data.id }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { slots: $.data.slots_committed }
          assert:
            - "off_status == DRAFT"
            - "slots == 0"

      - name: scholarship_offer_terminal_state_lockdown_accept_then_send_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ScholarshipOffer
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          From terminal ACCEPTED, any further transition (e.g., re-send) is
          rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "CERTIFIED athlete; offer in ACCEPTED state."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Terminal U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Z", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { z_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${z_id}" }
              as: EligibilityCenter
              captures: { cz_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cz_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${z_id}", annual_value_cents: 4000000 }
              as: Coach
              captures: { off_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { prog_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers/${off_id}/accept"
              payload: {}
              as: StudentAthlete
              as_user_id: "${z_id}"
          trigger:
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v1}" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: nildeal_invalid_transition_proposed_to_approve_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.NILDeal
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A NILDeal in PROPOSED cannot transition directly to APPROVED; the
          submit-for-review step is required. POST /approve from PROPOSED
          returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "CERTIFIED athlete; NILDeal in PROPOSED."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "L", sport_code: "WBB", gpa: 3.200, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { l_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${l_id}" }
              as: EligibilityCenter
              captures: { cl_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cl_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${l_id}", brand_name: "X", gross_value_cents: 100000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${l_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /ncaa/nil-deals/${deal_id}/approve"
              payload: {}
              as: NILReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: portal_expire_when_clock_advances_past_window
        claim_type: side_effect_execution
        grounds:
          - state_machines.TransferPortalEntry
          - endpoints[POST /ncaa/_jobs/sweep-portal-expirations]
        distinguishing_aspect: |
          A TransferPortalEntry sweeps to EXPIRED when current_utc >=
          window_closes_at via the sweep job; StudentAthlete.in_transfer_portal
          flips back to false.
        test_recipe:
          setup:
            - "Clock=2026-03-01. CERTIFIED athlete enters portal; clock advances to 2026-04-16 (>45 days)."
          setup_api_calls:
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Src U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { src_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "P", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${p_id}" }
              as: EligibilityCenter
              captures: { cp_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cp_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/transfer-portal-entries"
              payload: { student_athlete_id: "${p_id}", source_program_id: "${src_id}" }
              as: StudentAthlete
              as_user_id: "${p_id}"
              captures: { entry_id: $.data.id }
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ncaa/_jobs/sweep-portal-expirations"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /ncaa/transfer-portal-entries/${entry_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { entry_status: $.data.status }
            - call: "GET /ncaa/student-athletes/${p_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { portal: $.data.in_transfer_portal }
          assert:
            - "entry_status == EXPIRED"
            - "portal == false"

      - name: error_atletes_not_certified_on_create_offer_send
        claim_type: violation_to_error
        grounds:
          - state_machines.ScholarshipOffer
          - errors[ERR_ATHLETE_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / send_offer_requires_athlete_certified
          rationale: "Asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: nil_de_minimis_boundary_just_below_cutoff
        claim_type: threshold_boundary
        grounds:
          - calculations.nil_value_classification
        distinguishing_aspect: |
          NILDeal with net=59999 (gross=59999, fee=0.0) yields tier=DE_MINIMIS;
          net=60000 yields tier=STANDARD. Confirms the strict `<` boundary.
        test_recipe:
          setup:
            - "CERTIFIED athlete A."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Bound", sport_code: "BASEBALL", gpa: 3.100, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a_id}" }
              as: EligibilityCenter
              captures: { ca_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${ca_id}/approve"
              payload: {}
              as: EligibilityCenter
          trigger:
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${a_id}", brand_name: "JustBelow", gross_value_cents: 59999, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${a_id}"
              captures: { tier_below: $.data.tier, net_below: $.data.net_value_cents }
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${a_id}", brand_name: "Exact", gross_value_cents: 60000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${a_id}"
              captures: { tier_at: $.data.tier, net_at: $.data.net_value_cents }
          assert:
            - "net_below == 59999"
            - "tier_below == DE_MINIMIS"
            - "net_at == 60000"
            - "tier_at == STANDARD"

      - name: penalty_tier_zero_incidents_returns_none
        claim_type: input_set_filtering
        grounds:
          - calculations.program_penalty_tier
          - entities.Program.fields.penalty_tier
        distinguishing_aspect: |
          A Program with REPORTED or INVESTIGATING (not SUSTAINED) incidents
          still has penalty_tier=NONE; only SUSTAINED incidents enter the sum.
        test_recipe:
          setup:
            - "Program with a REPORTED and an INVESTIGATING incident; neither SUSTAINED."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Clean U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Q", sport_code: "MBB", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { q_id: $.data.id }
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "A", student_athlete_id: "${q_id}", alleged_value_cents: 100000 }
              as: ComplianceOfficer
              captures: { i1_id: $.data.id }
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "B", student_athlete_id: "${q_id}", alleged_value_cents: 200000 }
              as: ComplianceOfficer
              captures: { i2_id: $.data.id }
            - call: "POST /ncaa/booster-incidents/${i2_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier: $.data.penalty_tier }
          assert:
            - "tier == NONE"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:

      - name: quiet_period_email_channel_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_QUIET_PERIOD_VIOLATION]
        distinguishing_aspect: |
          A RecruitingContact in QUIET period via EMAIL channel is rejected;
          only IN_PERSON channel is allowed in QUIET.
        test_recipe:
          setup:
            - "Program with a QUIET period covering 2026-08-01..2026-08-10."
            - "Clock=2026-08-05."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Quiet U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "QUIET", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Cand", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /ncaa/recruiting-contacts"
              payload: { program_id: "${prog_id}", student_athlete_id: "${cand_id}", coach_user_id: "coach_a", contact_at: "2026-08-05T12:00:00Z", channel: "EMAIL" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_QUIET_PERIOD_VIOLATION"

      - name: contact_outside_any_period_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_OUTSIDE_RECRUITING_WINDOW]
        distinguishing_aspect: |
          A RecruitingContact whose contact_at is in a calendar gap (no Period
          covers it) is rejected with ERR_OUTSIDE_RECRUITING_WINDOW.
        test_recipe:
          setup:
            - "Program has one CONTACT period [2026-09-01..2026-09-10). No other periods."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "SOFTBALL", school_name: "Gap U", scholarship_slot_cap: 12 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "CONTACT", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Gp", sport_code: "SOFTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { gp_id: $.data.id }
          trigger:
            - call: "POST /ncaa/recruiting-contacts"
              payload: { program_id: "${prog_id}", student_athlete_id: "${gp_id}", coach_user_id: "coach_b", contact_at: "2026-09-15T12:00:00Z", channel: "PHONE" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_OUTSIDE_RECRUITING_WINDOW"

      - name: period_invalid_interval_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: |
          POST /ncaa/programs/{id}/periods with starts_at >= ends_at rejected
          with ERR_INVALID_INTERVAL.
        test_recipe:
          setup:
            - "Program exists."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "WBB", school_name: "Inv U", scholarship_slot_cap: 15 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "CONTACT", starts_at: "2026-10-05T00:00:00Z", ends_at: "2026-10-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_INTERVAL"

      - name: sod_violation_same_user_submits_and_approves
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Same NILReviewer X-User-ID submits-for-review then attempts approve
          → ERR_SOD_VIOLATION. A different NILReviewer X-User-ID would
          succeed; this is the same-user case.
        test_recipe:
          setup:
            - "CERTIFIED athlete; STANDARD-tier NILDeal in UNDER_REVIEW after the same-reviewer submit."
          setup_api_calls:
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Sod", sport_code: "BASEBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { s_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${s_id}" }
              as: EligibilityCenter
              captures: { cs_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cs_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/nil-deals"
              payload: { student_athlete_id: "${s_id}", brand_name: "SOD Co", gross_value_cents: 200000, agent_fee_pct: 0.0 }
              as: StudentAthlete
              as_user_id: "${s_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /ncaa/nil-deals/${deal_id}/submit-for-review"
              payload: {}
              as: NILReviewer
              as_user_id: "reviewer_alpha"
          trigger:
            - call: "POST /ncaa/nil-deals/${deal_id}/approve"
              payload: {}
              as: NILReviewer
              as_user_id: "reviewer_alpha"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_SOD_VIOLATION"

      - name: dead_period_contact_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_DEAD_PERIOD_CONTACT]
        distinguishing_aspect: |
          A RecruitingContact made at a moment covered by a DEAD period is
          rejected with ERR_DEAD_PERIOD_CONTACT regardless of channel.
        test_recipe:
          setup:
            - "Program with DEAD period [2026-11-01..2026-11-15)."
            - "Clock=2026-11-10."
          setup_api_calls:
            - call: "POST /ncaa/programs"
