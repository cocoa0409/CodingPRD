        distinguishing_aspect: "POST /mv/students omitting the required living_situation returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["One district exists."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /mv/students"
              payload: { first_name: "No", last_name: "Sit", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}" }
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION"

