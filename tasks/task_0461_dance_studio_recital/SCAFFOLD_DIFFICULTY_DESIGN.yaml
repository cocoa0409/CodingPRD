      - name: section_open_depends_on_term_open
        grounds:
          - state_machines.ClassSection.SCHEDULED_to_OPEN
          - state_machines.Term.DRAFT_to_OPEN
          - state_machines.Enrollment.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          A SCHEDULED section only becomes OPEN (enrollable) when its parent Term transitions DRAFT->OPEN;
          attempting to confirm into a section whose term is still DRAFT fails with ERR_INVALID_STATE.
          Entity pair: ClassSection->Term (distinct from Enrollment->Family above).
