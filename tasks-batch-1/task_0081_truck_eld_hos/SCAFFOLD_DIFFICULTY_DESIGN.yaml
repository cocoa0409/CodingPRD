scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: hos_clocks_standard_vs_adverse_driving_on_driver
        grounds:
          - calculations.hos_clocks
          - state_machines.AdverseConditionsClaim.PENDING_to_APPROVED
          - entities.Driver.fields.cycle_on_duty_minutes
        distinguishing_aspect: |
          Same DutyStatusEvent stream on the Driver domain yields a DRIVING_11H violation under the
          standard variant (limit 660) but no violation under the adverse_conditions variant (limit 780);
          the two variants diverge on the same 661-minute driving interval.
        test_recipe:
          setup:
            - "Driver D (tz_offset 0, cycle SEVENTY_HOUR_8_DAY, pc_authorized false), Vehicle IN_SERVICE, ELD device BOUND to D."
            - "Clock pinned to 2026-06-01T20:00:00Z."
            - "D drove ON_DUTY 06:00, DRIVING 06:30, then a closing event at 17:31 makes the DRIVING interval 661 minutes -> standard DRIVING_11H violation opened (overage 1)."
            - "An APPROVED AdverseConditionsClaim for (D, 2026-06-01) is then in place so the recompute uses limit 780."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U1", vin: "VINAAA1" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S1", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-A1", full_name: "Driver A", home_terminal_tz_offset_minutes: 0, cycle_rule: "SEVENTY_HOUR_8_DAY", pc_authorized: false }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v_after_e1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v_after_e1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v_after_e2: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v_after_e2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/adverse-claims"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01", reason: "WEATHER", narrative: "Snow on I-80 reduced speed." }
              as: Driver
              as_user_id: "${d_id}"
              captures: { claim_id: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H&status=OPEN"
              payload: {}
              as: SafetyOfficer
              captures: { pre_total: $.data }
            - call: "POST /eld/adverse-claims/${claim_id}/approve"
              payload: { expected_adverseconditionsclaim_version: "${claim_v0}" }
              as: SafetyOfficer
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H&status=DISMISSED"
              payload: {}
              as: SafetyOfficer
          assert:
            - "Before approve: exactly 1 HOSViolation with violation_type=DRIVING_11H, status=OPEN, overage_minutes == 1."
            - "After approve: that DRIVING_11H violation has status=DISMISSED, resolution_note == 'auto-dismissed: adverse conditions'."
            - "AdverseConditionsClaim.${claim_id}.status == APPROVED."
      - name: violation_overage_threshold_on_violation_vs_driver_cycle
        grounds:
          - calculations.violation_detection
          - calculations.hos_clocks
          - entities.HOSViolation.fields.overage_minutes
        distinguishing_aspect: |
          The overage formula on the HOSViolation domain (clock_after_interval - applicable_limit)
          produces a different number than the rolling cycle accumulation on the Driver domain
          (cycle_on_duty_minutes); a DRIVING_11H overage of 1 coexists with a Driver
          cycle_on_duty_minutes of 691, showing the two domains compute distinct results from the
          same stream.
        test_recipe:
          setup:
            - "Driver D drove a single day: ON_DUTY 06:00, DRIVING 06:30, OFF_DUTY 17:31 (661 driving min, 691 on-duty min)."
            - "Standard variant in force (no adverse claim)."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U2", vin: "VINBBB2" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S2", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-B2", full_name: "Driver B", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H"
              payload: {}
              as: SafetyOfficer
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: SafetyOfficer
          assert:
            - "Exactly 1 HOSViolation violation_type=DRIVING_11H with overage_minutes == 1."
            - "Driver.${d_id}.cycle_on_duty_minutes == 691."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hos_clocks_three_input_nonlinear_classification
        grounds:
          - calculations.hos_clocks
          - calculations.sleeper_split
          - entities.DutyStatusEvent.fields.special_driving_category
        distinguishing_aspect: |
          Mode (a): clock advancement is a non-linear function of three inputs
          (duty_status, special_driving_category, prior reset epoch) — a DRIVING interval advances
          driving+window+cycle, a PERSONAL_CONVEYANCE interval advances none, a YARD_MOVE advances
          window+cycle but not driving — branching on entity state, not a linear sum.
        test_recipe:
          setup:
            - "Driver D pc_authorized true. One day: ON_DUTY 06:00; DRIVING 06:30; DRIVING(PC) 08:00; YARD_MOVE-as-DRIVING 09:30; OFF_DUTY 10:00."
            - "Intervals: ON_DUTY 30m, DRIVING(NONE) 90m, PC 90m (excluded), YARD_MOVE 30m."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U3", vin: "VINCCC3" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S3", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-C3", full_name: "Driver C", home_terminal_tz_offset_minutes: 0, pc_authorized: true }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v2: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", special_driving_category: "PERSONAL_CONVEYANCE", event_time: "2026-06-01T08:00:00Z", annotation: "Drove to lodging.", expected_driver_version: "${d_v2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v3: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", special_driving_category: "YARD_MOVE", event_time: "2026-06-01T09:30:00Z", annotation: "Yard repositioning.", expected_driver_version: "${d_v3}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v4: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T10:00:00Z", expected_driver_version: "${d_v4}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Driver.${d_id}.cycle_on_duty_minutes == 150."
            - "No HOSViolation rows exist for Driver.${d_id} (driving 120 <= 660, window 240 <= 840)."
      - name: sum_of_floored_minute_rounding_order_pinned
        grounds:
          - calculations.hos_clocks
          - entities.DutyStatusEvent.fields.duration_minutes
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to sum-of-floored (floor each interval to whole minutes,
          then sum) rather than floor-of-sum; two intervals each carrying a 30-second tail floor to 30
          min independently, so the day on-duty total is 60 (30+30), NOT 61 (the floor-of-sum of 3660s).
          The pinned order changes the answer by one minute.
        test_recipe:
          setup:
            - "Driver D, one day. ON_DUTY 06:00:00; DRIVING 06:30:30 (interval 1 = 1830s = 30.5 min); ON_DUTY 07:01:00 (interval 2 = 1830s = 30.5 min)."
            - "Each interval floors to 30 min; sum-of-floored = 60. floor-of-sum of 3660s = 61. Method pinned to sum-of-floored = 60."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U4", vin: "VINDDD4" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S4", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-D4", full_name: "Driver D", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:30Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T07:01:00Z", expected_driver_version: "${d_v2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/duty-events?driver_id=${d_id}&record_status=ACTIVE"
              payload: {}
              as: CarrierAdmin
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "First ON_DUTY interval [06:00:00,06:30:30) = 1830s -> duration_minutes == 30 (floor of 30.5 min)."
            - "DRIVING interval [06:30:30,07:01:00) = 1830s -> duration_minutes == 30 (floor of 30.5 min)."
            - "Driver.${d_id}.cycle_on_duty_minutes == 60 (sum-of-floored 30+30), NOT 61 (floor-of-sum of 3660s); method pinned to sum-of-floored."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dutystatusevent_parallel_record_and_compliance_dimensions
        grounds:
          - state_machines.DutyStatusEvent.ACTIVE_to_INACTIVE_CHANGED
          - entities.DutyStatusEvent.fields.record_status
          - entities.DutyStatusEvent.fields.compliance_disposition
        distinguishing_aspect: |
          On DutyStatusEvent the record_status dimension (ACTIVE -> INACTIVE_CHANGED) and the
          compliance_disposition dimension (COMPLIANT <-> VIOLATING) evolve independently: a correction
          flips the superseded event's record_status while the surviving event's compliance_disposition
          flips on the same recompute without either dimension gating the other.
        test_recipe:
          setup:
            - "Driver D drove 661 DRIVING min -> DRIVING_11H violation; the DRIVING event has compliance_disposition VIOLATING and record_status ACTIVE."
            - "A correction reduces the DRIVING interval below 660 by superseding the closing event."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U5", vin: "VINEEE5" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S5", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-E5", full_name: "Driver E", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { drive_evt_id: $.data.id }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { close_evt_id: $.data.id }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:25:00Z", edited_from_event_id: "${close_evt_id}", annotation: "Corrected end time; engine off earlier.", expected_driver_version: "${d_v2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/duty-events/${close_evt_id}"
              payload: {}
              as: CarrierAdmin
            - call: "GET /eld/duty-events/${drive_evt_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "DutyStatusEvent.${close_evt_id}.record_status == INACTIVE_CHANGED (record dimension advanced)."
            - "DutyStatusEvent.${drive_evt_id}.record_status == ACTIVE (record dimension unchanged on surviving event)."
            - "DutyStatusEvent.${drive_evt_id}.compliance_disposition == COMPLIANT (compliance dimension flipped back; new DRIVING interval = 655 < 660)."
      - name: hosviolation_cyclic_acknowledge_reopen_loop
        grounds:
          - state_machines.HOSViolation.OPEN_to_ACKNOWLEDGED
          - state_machines.HOSViolation.ACKNOWLEDGED_to_OPEN
          - entities.HOSViolation.fields.status
        distinguishing_aspect: |
          HOSViolation has a cyclic OPEN -> ACKNOWLEDGED -> OPEN loop (a different entity than
          DutyStatusEvent): the officer can acknowledge then reopen, returning to a prior state,
          which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "An OPEN DRIVING_11H violation exists for Driver D (661 driving min)."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U6", vin: "VINFFF6" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S6", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-F6", full_name: "Driver F", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T17:31:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/hos-violations?driver_id=${d_id}&violation_type=DRIVING_11H&status=OPEN"
              payload: {}
              as: SafetyOfficer
              captures: { v_id: "$.data[0].id" }
          trigger:
            - call: "POST /eld/hos-violations/${v_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
              captures: { v_after_ack: $.data.status }
            - call: "POST /eld/hos-violations/${v_id}/reopen"
              payload: {}
              as: SafetyOfficer
            - call: "GET /eld/hos-violations/${v_id}"
              payload: {}
              as: SafetyOfficer
          assert:
            - "After acknowledge: HOSViolation.${v_id}.status == ACKNOWLEDGED."
            - "After reopen: HOSViolation.${v_id}.status == OPEN (returned to a prior state — cyclic)."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: append_cascades_event_to_violation_to_certified_log
        grounds:
          - state_machines.DutyStatusEvent.ACTIVE_to_ACTIVE
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFY_REQUIRED
          - calculations.violation_detection
        distinguishing_aspect: |
          Depth-3 cascade from the duty-event append trigger: append closes the prior interval (mutates
          the prior event's duration) -> the recompute mutates DailyLog totals which flips a CERTIFIED
          log to RECERTIFY_REQUIRED -> the violation_scan opens an HOSViolation; each link is caused by
          the previous, not by the original POST directly.
        test_recipe:
          setup:
