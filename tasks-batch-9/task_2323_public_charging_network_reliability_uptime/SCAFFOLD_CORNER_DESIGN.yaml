          setup:
            - "Logical clock walked 2026-05-01 -> 2026-06-10T00:00:00Z -> 2026-07-15T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1 created 2026-05-01T00:00:00Z."
            - "One MINOR outage detected 2026-06-10T00:00:00Z, never cleared, moved to EXCLUSION_REVIEW with excluded_cause_claim UTILITY_OUTAGE."
            - "UptimeReport 2026-06-01T00:00:00Z .. 2026-07-01T00:00:00Z computed provisionally: T 43200, E 0, D 30240, uptime 30.00."
