          one panelist's public_value score, isolating the comparison operator.
        test_recipe:
          setup:
            - "CycleMain panel SCORING with five submitted reviews scoring 8.00, 6.60, 7.30, 6.00, 8.50"
            - "max = 8.50 and min = 6.00 over the counted set, so score_spread is exactly 2.50"
