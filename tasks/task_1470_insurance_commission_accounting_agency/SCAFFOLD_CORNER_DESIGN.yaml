# =============================================================================
# Task 1470 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Sections/claim_types are exactly the guide's. Instances already covered by
# §1.8 are emitted as excluded_because stubs. All names unique across both files.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: producer_create_defaults_applied
        claim_type: defaults
        grounds: ["entities.Producer.fields.tier", "entities.Producer.fields.tax_form_on_file", "entities.Producer.fields.status"]
        distinguishing_aspect: "Omitting optional fields on create yields tier == STANDARD, tax_form_on_file == false, status == ACTIVE, balances 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Plain Pam", license_number: "LIC-D1" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /agency/producers/${p_id}"
              payload: {}
              as: AgencyAdmin
              captures: { tier: "$.data.tier", tax: "$.data.tax_form_on_file", st: "$.data.status", bal: "$.data.commission_balance_cents" }
          assert:
            - "tier == STANDARD (default)"
            - "tax_form_on_file == false (default)"
            - "status == ACTIVE (initial state)"
            - "commission_balance_cents == 0 and version == 1"

      - name: producer_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Producer.fields.commission_balance_cents"]
        distinguishing_aspect: "Client-supplied commission_balance_cents on create is ignored; the computed value 0 is returned."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agency/producers"
              payload: { name: "Sneaky Sam", license_number: "LIC-D2", commission_balance_cents: 999999 }
              as: AgencyAdmin
              captures: { bal: "$.data.commission_balance_cents" }
          assert:
            - "response commission_balance_cents == 0 (client input ignored for source:computed field)"

      - name: policy_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Policy.fields.premium_annual_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required premium_annual_cents on policy create returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one producer, one carrier, one product"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Req R", license_number: "LIC-D3" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D3", carrier_code: "CD3" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD3", name: "Product D3", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D3", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured D3", billing_type: "DIRECT_BILL", effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: policy_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Policy.fields.billing_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_type 'MONTHLY' is not in {AGENCY_BILL, DIRECT_BILL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one producer, one carrier, one product"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Enum E", license_number: "LIC-D4" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D4", carrier_code: "CD4" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD4", name: "Product D4", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D4", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "Insured D4", billing_type: "MONTHLY", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: get_nonexistent_policy_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown policy id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /agency/policies/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: policy_create_with_bogus_product_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Policy.fields.product_id", "validations[priority=3]"]
        distinguishing_aspect: "Body FK product_id referencing a nonexistent product is rejected ERR_NOT_FOUND (404) — flat-topology FK integrity."
        test_recipe:
          setup: ["one producer"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "FK F", license_number: "LIC-D5" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D5", product_id: "22222222-2222-2222-2222-222222222222", producer_id: "${w_id}", insured_name: "Insured D5", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: duplicate_policy_number_rejected
        claim_type: type_constraints
        grounds: ["entities.Policy.fields.policy_number", "errors[ERR_POLICY_NUMBER_EXISTS]"]
        distinguishing_aspect: "Second policy with an already-used policy_number fails ERR_POLICY_NUMBER_EXISTS (409) — uniqueness constraint."
        test_recipe:
          setup: ["one producer, carrier, product; policy P-D6 already created"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Dup D", license_number: "LIC-D6" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D6", carrier_code: "CD6" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD6", name: "Product D6", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D6", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I1", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D6", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I2", billing_type: "DIRECT_BILL", premium_annual_cents: 1000000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_POLICY_NUMBER_EXISTS with http 409"

      - name: duplicate_license_number_rejected
        claim_type: type_constraints
        grounds: ["entities.Producer.fields.license_number", "errors[ERR_LICENSE_NUMBER_EXISTS]"]
        distinguishing_aspect: "Reusing a license_number across producers fails ERR_LICENSE_NUMBER_EXISTS."
        test_recipe:
          setup: ["producer with license LIC-D7 exists"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "First", license_number: "LIC-D7" }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/producers"
              payload: { name: "Second", license_number: "LIC-D7" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_LICENSE_NUMBER_EXISTS with http 409"

      - name: duplicate_product_code_per_carrier_rejected
        claim_type: type_constraints
        grounds: ["entities.Product.fields.product_code", "errors[ERR_PRODUCT_CODE_EXISTS]"]
        distinguishing_aspect: "product_code is unique per carrier: second product with same code under the same carrier fails ERR_PRODUCT_CODE_EXISTS."
        test_recipe:
          setup: ["carrier with product PD8"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D8", carrier_code: "CD8" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD8", name: "First", line_of_business: "LIFE" }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD8", name: "Second", line_of_business: "HEALTH" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PRODUCT_CODE_EXISTS with http 409"

      - name: disclosure_projected_comp_computed_at_policy_create
        claim_type: computed_fields
        grounds: ["entities.ProducerDisclosure.fields.projected_comp_cents", "endpoints.\"POST /agency/policies"]
        distinguishing_aspect: "The auto-generated disclosure computes projected_comp_cents from the covering ACTIVE schedule at creation: 2400000 premium at 5000bps -> 1200000, with no client input."
        test_recipe:
          setup: ["producer tier STANDARD; carrier; product; STANDARD schedule 5000bps advance 12 from 2026-01-01"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Disc D", license_number: "LIC-D9" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier D9", carrier_code: "CD9" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PD9", name: "Product D9", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-D9", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I9", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { proj: "$.data[0].projected_comp_cents", st: "$.data[0].status" }
          assert:
            - "ProducerDisclosure created automatically with status == GENERATED"
            - "projected_comp_cents == 1200000"

      - name: products_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints.\"GET /agency/products"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope: 3 products, limit 2 -> page 1 has 2 items has_more true; offset 2 -> 1 item has_more false."
        test_recipe:
          setup: ["carrier with three products"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier PG", carrier_code: "CPG" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PG1", name: "PG One", line_of_business: "LIFE" }
              as: AgencyAdmin
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PG2", name: "PG Two", line_of_business: "LIFE" }
              as: AgencyAdmin
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PG3", name: "PG Three", line_of_business: "LIFE" }
              as: AgencyAdmin
          trigger:
            - call: "GET /agency/products"
              payload: { carrier_id: "${c_id}", limit: 2, offset: 0 }
              as: AgencyAdmin
            - call: "GET /agency/products"
              payload: { carrier_id: "${c_id}", limit: 2, offset: 2 }
              as: AgencyAdmin
          assert:
            - "Page 1: exactly 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: policy_initial_state_quoted
        claim_type: initial_state
        grounds: ["state_machines.Policy"]
        distinguishing_aspect: "A newly created policy starts in QUOTED before any bind."
        test_recipe:
          setup: ["producer, carrier, product"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Init I", license_number: "LIC-S1C" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S1C", carrier_code: "CS1C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PS1C", name: "Product S1C", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-S1C", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { st: "$.data.status" }
          assert:
            - "response status == QUOTED"

      - name: second_bind_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Policy.QUOTED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Bind is QUOTED->ACTIVE only; binding an already-ACTIVE policy fails ERR_INVALID_STATE (non-idempotent transition)."
        test_recipe:
          setup: ["fully bound DIRECT_BILL policy (producer, carrier, product, schedule, disclosure DELIVERED)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Bind B", license_number: "LIC-S2C" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S2C", carrier_code: "CS2C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PS2C", name: "Product S2C", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-S2C", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"

      - name: cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Policy.ACTIVE_to_CANCELLED_VOLUNTARY"]
        distinguishing_aspect: "From terminal CANCELLED_VOLUNTARY no further transitions exist: a second cancel fails ERR_INVALID_STATE and no additional chargebacks are created."
        test_recipe:
          setup: ["bound policy cancelled effective 2027-02-01 (CANCELLED_VOLUNTARY; chargeback 600000)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Term T", license_number: "LIC-S3C" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S3C", carrier_code: "CS3C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PS3C", name: "Product S3C", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-S3C", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-02-01" }
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2027-03-01" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /agency/chargebacks"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Still exactly 1 chargeback for the policy (total_count == 1, no cascade re-fired)"

      - name: statement_close_from_received_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.CarrierStatement.RECONCILING_to_RECONCILED"]
        distinguishing_aspect: "close is RECONCILING->RECONCILED only; closing a RECEIVED statement fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["carrier; statement imported (RECEIVED), reconciliation not started"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S4C", carrier_code: "CS4C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/close"
              payload: {}
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"

      - name: statement_resume_from_reconciling_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.CarrierStatement.DISPUTED_to_RECONCILING"]
        distinguishing_aspect: "resume is DISPUTED->RECONCILING only; resuming while already RECONCILING fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["carrier; statement in RECONCILING"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S5C", carrier_code: "CS5C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/resume"
              payload: {}
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: acknowledge_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ProducerDisclosure.DELIVERED_to_ACKNOWLEDGED"]
        distinguishing_aspect: "ACKNOWLEDGED is terminal: a second acknowledge by the same producer fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["producer P with policy (disclosure delivered and acknowledged)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Ack A", license_number: "LIC-S6C" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier S6C", carrier_code: "CS6C" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PS6C", name: "Product S6C", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-S6C", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/producer-disclosures/${d_id}/acknowledge"
              payload: {}
              as: Producer
              as_user_id: "${w_id}"
          trigger:
            - call: "POST /agency/producer-disclosures/${d_id}/acknowledge"
              payload: {}
