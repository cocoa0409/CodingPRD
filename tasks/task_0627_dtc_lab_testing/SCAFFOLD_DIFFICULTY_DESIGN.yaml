              as_user_id: "${p13}"
              captures: { cart13_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart13}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart13_v}" }
              as: Patient
              as_user_id: "${p13}"
              captures: { order13: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order13}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p13}"
            - call: "GET /catalog/order-lines?order_id=${order13}"
              as: CatalogAdmin
              captures: { ol13: '$.data[0].id' }
            - call: "GET /catalog/physician-orders?order_line_id=${ol13}"
              as: OrderingPhysician
              captures: { po13: '$.data[0].id' }
          trigger:
            - call: "POST /catalog/order-lines/${ol13}/collect"
              as: PhlebotomyTech
              captures: { err: '$.data.error_id' }
            - call: "POST /catalog/physician-orders/${po13}/decision"
