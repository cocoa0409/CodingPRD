          Pair state(p5) vs business_temporal(p6): a submit against a response whose
          claim is already WITHDRAWN (state violation) AND whose deadline has passed
          (temporal violation) must surface the state error because priority 5
          precedes priority 6.
        test_recipe:
          setup:
