  - { error_id: ERR_RESERVATION_QUOTA_EXCEEDED,    http_status: 422, category: business_constraint,  message: "Tier peak-day reservation quota exhausted" }
  - { error_id: ERR_RESERVATION_REQUIRED,          http_status: 422, category: business_constraint,  message: "This tier requires a reservation on peak days" }
  - { error_id: ERR_PARK_DAY_CAPACITY_FULL,        http_status: 422, category: business_fiscal,      message: "No reservation slots remain on that park day" }
  - { error_id: ERR_RESERVATION_SLOT_FULL,         http_status: 422, category: business_fiscal,      message: "No slots remain for arrival windows overlapping the requested window" }
  - { error_id: ERR_PAYMENT_AMOUNT_MISMATCH,       http_status: 422, category: business_fiscal,      message: "Payment amount does not match the installment amount" }
  - { error_id: ERR_UPGRADE_PAYMENT_INSUFFICIENT,  http_status: 422, category: business_fiscal,      message: "Payment amount does not match the upgrade total due" }
  - { error_id: ERR_CURE_AMOUNT_MISMATCH,          http_status: 422, category: business_fiscal,      message: "Cure amount does not match the outstanding missed installments" }

# =============================================================================
# §1.7 RBAC Table — role_model: segregation_of_duties
# X-User-ID identifies the acting user; X-User-Role names the role.
# =============================================================================
roles:
  - role: ProgramAdmin
    identity: opaque
    description: "Season program office: designs programs, tiers and the blockout calendar, re-forecasts operating days, runs monthly billing and sets the logical clock."
    exclusive_operations:
      - "POST /pass-programs"
      - "POST /pass-programs/{program_id}/advance-status"
      - "POST /pass-programs/{program_id}/billing-runs"
      - "POST /pass-tiers"
      - "POST /pass-tiers/{tier_id}/status"
      - "POST /park-days"
      - "POST /park-days/{park_day_id}/forecast"
      - "POST /blockout-assignments"
      - "POST /blockout-assignments/{assignment_id}/lift"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /pass-programs/{program_id}/revenue-summary (with ComplianceOfficer)"
      - "GET /season-passes/{pass_id}/renewal-quote (with PassOfficeClerk and Passholder)"
      - "all catalog and ledger GET endpoints"

  - role: PassOfficeClerk
    identity: opaque
    description: "Pass office counter: registers passholders, sells and processes passes, enrols and cures payment plans, takes installment and upgrade payments, quotes and applies upgrades, renews passes and books reservations on behalf of holders."
    exclusive_operations:
      - "POST /passholders"
      - "POST /season-passes"
      - "POST /season-passes/{pass_id}/process"
      - "POST /season-passes/{pass_id}/payment-plans"
      - "POST /season-passes/{pass_id}/reinstate"
      - "POST /season-passes/{pass_id}/renew"
      - "POST /installments/{installment_id}/settle"
      - "POST /upgrade-orders"
      - "POST /upgrade-orders/{upgrade_order_id}/apply"
    shared_operations:
      - "POST /reservations (with Passholder)"
      - "POST /reservations/{reservation_id}/cancel (with Passholder)"
      - "GET /season-passes/{pass_id}/renewal-quote (with ProgramAdmin and Passholder)"
      - "all catalog, pass, plan, installment, reservation, visit, case and upgrade GET endpoints"
    forbidden:
      - "POST /upgrade-orders/{upgrade_order_id}/reverse — segregation of duties: the office that applied an upgrade cannot reverse it"
      - "POST /sharing-cases and its review / decide actions"

  - role: GateAgent
    identity: opaque
    description: "Turnstile operator: records gate entries, closes visits with the in-park spend, and opens pass-sharing cases from gate evidence."
    exclusive_operations:
      - "POST /visits"
      - "POST /visits/{visit_id}/close"
      - "POST /sharing-cases"
    shared_operations:
      - "GET /park-days, GET /season-passes, GET /reservations, GET /visits, GET /sharing-cases and their single-resource reads"
    forbidden:
      - "POST /sharing-cases/{case_id}/review and /decide — an agent may open a case but never adjudicate it"

  - role: ComplianceOfficer
    identity: opaque
    description: "Compliance: reviews and adjudicates pass-sharing cases, reverses applied upgrades and reads the revenue analysis."
    exclusive_operations:
      - "POST /sharing-cases/{case_id}/review"
      - "POST /sharing-cases/{case_id}/decide"
      - "POST /upgrade-orders/{upgrade_order_id}/reverse"
    shared_operations:
      - "GET /pass-programs/{program_id}/revenue-summary (with ProgramAdmin)"
      - "all pass, plan, installment, reservation, visit, case and upgrade GET endpoints"
    constraints:
      - "A decide call whose X-User-ID equals SharingCase.opened_by_user_id is refused with ERR_SEGREGATION_OF_DUTIES (403). Auto-opened cases carry opened_by_user_id 'SYSTEM', so any officer may decide them."

  - role: Passholder
    identity: "entity_backed:Passholder"
    description: "The guest holding the pass. X-User-ID is the Passholder.id; a Passholder may only act on passes whose passholder_id equals that value."
    exclusive_operations:
      - "POST /sharing-cases/{case_id}/appeal"
    shared_operations:
      - "POST /reservations (with PassOfficeClerk)"
      - "POST /reservations/{reservation_id}/cancel (with PassOfficeClerk)"
      - "GET /season-passes/{pass_id}/renewal-quote (with ProgramAdmin and PassOfficeClerk)"
      - "read-only access to the catalog, and to their own passes, plans, installments, reservations, visits, cases and upgrade orders"
    constraints:
      - "Any Passholder-role call touching a pass whose passholder_id != X-User-ID is refused with ERR_NOT_PASS_OWNER (403)."
      - "Passholder has no access to GET /passholders (the holder directory) or to any ProgramAdmin / PassOfficeClerk / GateAgent / ComplianceOfficer write."
