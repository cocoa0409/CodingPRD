            - "the 00:00Z bucket is inclusive on the left: arrived_at 2026-09-02T01:00:00Z and 2026-09-02T05:59:59Z both fall in it, and it holds 80 units after the first two receives"
            - "the 06:00Z bucket is exclusive on the right of the previous bucket: arrived_at 2026-09-02T06:00:00Z starts a NEW bucket that is empty before that receive"
            - "the receive of ${bkt_3} at exactly 06:00:00Z is admitted because its bucket held 0 units and 0 + 40 <= 100"
            - "the receive of ${bkt_5} at 06:00:00Z is admitted because 40 + 60 <= 100, filling the new bucket to exactly 100"
            - "the receive of ${bkt_4} into the 00:00Z bucket is refused with 409 ERR_DOCK_BUCKET_CAPACITY_EXCEEDED because 80 + 40 == 120 > 100 — aggregate capacity, not pairwise adjacency"
            - "the receive of ${bkt_6} is refused because 100 + 60 > 100, so a bucket at exactly its cap of 100 admits nothing further"
            - "bkt_4 is NOT counted against the 06:00Z bucket: the two buckets are independent capacities and one being full does not spill into the other"

