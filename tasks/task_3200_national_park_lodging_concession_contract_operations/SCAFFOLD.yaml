scenario: 'National Park Lodging Concession Contract Operations (Xanterra Travel Collection): concession contract with a federal agency specifying franchise fees, rate approval and required services, room
  rate submission and approval against comparability studies rather than free market pricing, seasonal operation with employee housing, recruitment and transportation for remote locations, maintenance and
  capital improvement obligations on government-owned assets with leasehold surrender interest accounting, reservation systems handling extreme advance demand and lottery-like release dates, food service,
  retail and tour operations under the same contract with separate reporting, environmental management requirements including waste, water and wildlife protocols, contract expiration and recompetition with
  asset transfer to a successor

  '
domain_name: national-park-concession-operations
api_prefix: ''
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - optimistic_concurrency
  - ops_run_checkpoint
  - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Contract
  parent: null
  common_fields: true
  fields:
  - name: park_code
    type: string
    source: input
    description: National park code (e.g. YELL, GRCA)
  - name: contract_number
    type: string
    source: input
    description: Concession contract number; unique across the system
    constraints: unique
  - name: term_months
    type: integer
    source: input
    description: Contract term in months; must be a positive multiple of 12
    constraints: term_months > 0 and term_months % 12 == 0
  - name: start_date
    type: datetime
    source: input
    description: Contract effective date (ISO 8601)
  - name: end_date
    type: datetime
    source: computed
    description: start_date advanced by term_months months
  - name: franchise_fee_rate
    type: number
    source: input
    description: Contracted franchise fee rate applied to gross receipts
    constraints: 0 < franchise_fee_rate <= 0.20
  - name: employee_housing_capacity
    type: integer
    source: input
    description: Total seasonal employee bed capacity
    constraints: '>= 1'
  - name: lsi_annual_schedule_type
    type: enum
    source: input
    description: 'Leasehold surrender interest schedule family: LINEAR | DECLINING_BALANCE'
    constraints: 'enum: LINEAR | DECLINING_BALANCE'
  - name: environmental_plan_due_day_of_year
    type: integer
    source: input
    description: Day-of-year (1-365) by which the annual environmental plan must be filed
    constraints: 1 <= day_of_year <= 365
  - name: status
    type: enum
    source: system
    description: DRAFT | ACTIVE | EXPIRED | TRANSITION_PENDING | CLOSED
    constraints: 'enum: DRAFT | ACTIVE | EXPIRED | TRANSITION_PENDING | CLOSED'
  - name: successor_contract_id
    type: string
    source: system
    description: FK -> Contract.id; set when a successor is designated during TRANSITION_PENDING; self-referential, null otherwise
- name: OperatingSeason
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: year
    type: integer
    source: input
    description: Calendar year of the season
    constraints: '>= 2000'
  - name: open_date
    type: datetime
    source: input
    description: Season opening (ISO 8601)
  - name: close_date
    type: datetime
    source: input
    description: Season closing; must be after open_date
    constraints: close_date > open_date
  - name: lottery_open_date
    type: datetime
    source: input
    description: Reservation lottery release instant; must be strictly before open_date
    constraints: lottery_open_date < open_date
  - name: lottery_window_hours
    type: integer
    source: input
    description: Hours the lottery window stays open from lottery_open_date
    constraints: '>= 1'
  - name: status
    type: enum
    source: system
    description: PLANNED | OPEN | CLOSED | RECONCILED
    constraints: 'enum: PLANNED | OPEN | CLOSED | RECONCILED'
  - name: month_offset
    type: integer
    source: computed
    description: Whole months elapsed between contract start_date and season open_date, floor
- name: ServiceLine
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: line_type
    type: enum
    source: input
    description: 'Business line: LODGING | FOOD | RETAIL | TOURS'
    constraints: 'enum: LODGING | FOOD | RETAIL | TOURS'
  - name: authorized
    type: boolean
    source: input
    description: Whether the contract authorizes this line
    default: true
  - name: separate_reporting_required
    type: boolean
    source: input
    description: Whether the line must report gross receipts separately (always true in this contract form)
    default: true
  - name: status
    type: enum
    source: system
    description: AUTHORIZED | SUSPENDED | TERMINATED
    constraints: 'enum: AUTHORIZED | SUSPENDED | TERMINATED'
- name: RoomClass
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: code
    type: string
    source: input
    description: Room class code (e.g. CABIN_STANDARD); unique within the contract
    constraints: unique within contract_id
  - name: total_rooms
    type: integer
    source: input
    description: Physical room count in this class
    constraints: '>= 1'
  - name: peak_season_months
    type: array
    source: input
    description: Calendar months (1-12) considered peak for comparability matching
    constraints: array of integers 1-12
  - name: status
    type: enum
    source: system
    description: ACTIVE | DECOMMISSIONED
    constraints: 'enum: ACTIVE | DECOMMISSIONED'
- name: RateFiling
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: season_id
    type: string
    source: input
    description: FK -> OperatingSeason.id; season the rates apply to
  - name: room_class_id
    type: string
    source: input
    description: FK -> RoomClass.id; room class the rates apply to
  - name: submitted_rates
    type: array
    source: input
    description: 'Array of {occupancy_band: SOLO|DOUBLE|FAMILY, nightly_rate_cents: integer} — exactly three entries, one per band, nightly_rate_cents > 0'
  - name: reference_study_id
    type: string
    source: input
    description: FK -> ComparabilityStudy.id the filer cites
  - name: status
    type: enum
    source: system
    description: SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUPERSEDED | EXPIRED
    constraints: 'enum: SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUPERSEDED | EXPIRED'
  - name: effective_date
    type: datetime
    source: computed
    description: 'Set at approval: the season''s open_date'
  - name: approved_weighted_mean_cents
    type: integer
    source: computed
    description: Frozen weighted mean of the cited comparability study at approval time (version-pinned)
  - name: revision_of_id
    type: string
    source: system
    description: FK -> RateFiling.id; the filing this one revises, if any (self-referential, null for first filing)
- name: ComparabilityStudy
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: title
    type: string
    source: input
    description: Study title
  - name: comparables
    type: array
    source: input
    description: 'Array of {property_name: string, nightly_rate_cents: integer, weight: number} — at least 3 entries, weights > 0'
    constraints: len >= 3
  - name: weighted_mean_cents
    type: integer
    source: computed
    description: round_half_up(sum(rate*weight) / sum(weights)) over comparables
  - name: prepared_at
    type: datetime
    source: input
    description: When the study was prepared (ISO 8601)
  - name: valid_through
    type: datetime
    source: input
    description: Study validity horizon; must be after prepared_at
    constraints: valid_through > prepared_at
  - name: status
    type: enum
    source: system
    description: REGISTERED | STALE | ARCHIVED
    constraints: 'enum: REGISTERED | STALE | ARCHIVED'
- name: Reservation
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: season_id
    type: string
    source: input
    description: FK -> OperatingSeason.id
  - name: room_class_id
    type: string
    source: input
    description: FK -> RoomClass.id
  - name: guest_ref
    type: string
    source: input
    description: Guest reference string (no PII entity)
  - name: check_in_date
    type: datetime
    source: input
    description: Check-in instant
  - name: check_out_date
    type: datetime
    source: input
    description: Check-out instant; must be after check_in_date
    constraints: check_out_date > check_in_date
  - name: occupancy_band
    type: enum
    source: input
    description: SOLO | DOUBLE | FAMILY
    constraints: 'enum: SOLO | DOUBLE | FAMILY'
  - name: occupancy_mode
    type: enum
    source: input
    description: BANDED (default) uses the band's approved rate; ACTUAL_HEADCOUNT prices from beds_occupied
    default: BANDED
    constraints: 'enum: BANDED | ACTUAL_HEADCOUNT'
  - name: beds_occupied
    type: integer
    source: input
    description: Required only when occupancy_mode == ACTUAL_HEADCOUNT; exact bed count used
    constraints: 1..3; required iff ACTUAL_HEADCOUNT
  - name: quoted_nightly_rate_cents
    type: integer
    source: computed
    description: Rate resolved from the APPROVED filing per the occupancy pricing rule, frozen at booking
  - name: total_charge_cents
    type: integer
    source: computed
    description: quoted_nightly_rate_cents * nights (both computed)
  - name: deposit_cents
    type: integer
    source: computed
    description: min(round_half_up(total_charge_cents * DEPOSIT_RATE), DEPOSIT_CAP_CENTS)
  - name: nights
    type: integer
    source: computed
    description: Whole nights = (check_out_date - check_in_date) in days, floor
  - name: status
    type: enum
    source: system
    description: REQUESTED | CONFIRMED | CANCELLED | NO_SHOW | FULFILLED
    constraints: 'enum: REQUESTED | CONFIRMED | CANCELLED | NO_SHOW | FULFILLED'
  - name: cancellation_fee_cents
    type: integer
    source: system
    description: Fee captured on cancel; 0 unless cancelled
- name: GrossReceiptsReport
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: period_month
    type: string
    source: input
    description: Reporting month in YYYY-MM form; one report per (service_line_id, period_month)
    constraints: unique within (service_line_id)
  - name: service_line_id
    type: string
    source: input
    description: FK -> ServiceLine.id; line reporting
  - name: gross_receipts_cents
    type: integer
    source: input
    description: Gross receipts for the line in the month, in cents
    constraints: '>= 0'
  - name: submitted_by_role
    type: string
    source: system
    description: Role recorded at submission (audit; segregation-of-duties input)
  - name: submitted_by_user_id
    type: string
    source: system
    description: X-User-ID recorded at submission
  - name: status
    type: enum
    source: system
    description: DRAFT | SUBMITTED | ACCEPTED | RETURNED
    constraints: 'enum: DRAFT | SUBMITTED | ACCEPTED | RETURNED'
- name: FranchiseFeeStatement
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: period_month
    type: string
    source: input
    description: Statement month in YYYY-MM form; unique within the contract
    constraints: unique within contract_id
  - name: lines
    type: array
    source: computed
    description: 'Per-ACCEPTED-report rows: {service_line_id, line_gross_cents, line_fee_cents}; line_fee_cents = round_half_up(line_gross_cents * franchise_fee_rate) — per-line rounding'
  - name: total_fee_cents
    type: integer
    source: computed
    description: Sum of the per-line line_fee_cents values (per-line-then-sum order, pinned)
  - name: reporting_method
    type: enum
    source: system
    description: PER_LINE_ROUNDED (frozen at issuance) — the aggregate-first figure is a diagnostic only
    constraints: 'enum: PER_LINE_ROUNDED'
  - name: aggregate_diagnostic_cents
    type: integer
    source: computed
    description: 'Diagnostic: round_half_up(sum(line_gross_cents) * franchise_fee_rate); may differ from total_fee_cents'
  - name: status
    type: enum
    source: system
    description: ISSUED | PAID
    constraints: 'enum: ISSUED | PAID'
- name: CapitalProject
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: title
    type: string
    source: input
    description: Project title
  - name: asset_ref
    type: string
    source: input
    description: Government-owned asset identifier the project improves
  - name: authorized_cost_cents
    type: integer
    source: input
    description: Authorized construction cost
    constraints: '> 0'
  - name: actual_cost_cents
    type: integer
    source: input
    description: Actual cost; settable only while COMPLETED, before approval
    default: 0
    constraints: 0 <= actual_cost_cents <= authorized_cost_cents * COST_OVERRUN_CAP_RATE
  - name: in_service_month_offset
    type: integer
    source: input
    description: Whole months after contract start_date when the asset went in service; defaults to the current offset at completion
    constraints: '>= 0'
  - name: accrued_lsi_cents
    type: integer
    source: computed
    description: Leasehold surrender interest accrued at the current contract offset per lsi_accrual
  - name: status
    type: enum
    source: system
    description: PROPOSED | AUTHORIZED | COMPLETED | APPROVED | EXPENDED
    constraints: 'enum: PROPOSED | AUTHORIZED | COMPLETED | APPROVED | EXPENDED'
- name: EmployeeHousingUnit
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: unit_code
    type: string
    source: input
    description: Unit code; unique within the contract
    constraints: unique within contract_id
  - name: bed_count
    type: integer
    source: input
    description: Beds in the unit
    constraints: '>= 1'
  - name: status
    type: enum
    source: system
    description: AVAILABLE | OFFLINE
    constraints: 'enum: AVAILABLE | OFFLINE'
- name: SeasonalHire
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: season_id
    type: string
    source: input
    description: FK -> OperatingSeason.id; hiring season
  - name: service_line_id
    type: string
    source: input
    description: FK -> ServiceLine.id; employing line
  - name: employee_ref
    type: string
    source: input
    description: Employee reference string
  - name: housing_unit_id
    type: string
    source: input
    description: FK -> EmployeeHousingUnit.id; assigned housing
  - name: arrival_date
    type: datetime
    source: input
    description: Arrival instant
  - name: departure_date
    type: datetime
    source: input
    description: Departure instant; must be after arrival_date
    constraints: departure_date > arrival_date
  - name: transport_origin
    type: string
    source: input
    description: Pickup location for the auto-created transport voucher; required when needs_transport is true
    constraints: required iff needs_transport
  - name: needs_transport
    type: boolean
    source: input
    description: Whether the hire requires remote-location transport
    default: true
  - name: transport_voucher_id
    type: string
    source: system
    description: id of the TransportVoucher created alongside this hire when needs_transport is true
  - name: status
    type: enum
    source: system
    description: HIRED | ARRIVED | DEPARTED | NO_SHOW | TERMINATED
    constraints: 'enum: HIRED | ARRIVED | DEPARTED | NO_SHOW | TERMINATED'
- name: TransportVoucher
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: hire_id
    type: string
    source: input
    description: FK -> SeasonalHire.id this voucher transports
  - name: origin
    type: string
    source: input
    description: Pickup location
  - name: booked_seats
    type: integer
    source: input
    description: Seats booked on the transport run
    constraints: '>= 1'
  - name: travel_date
    type: datetime
    source: input
    description: Travel instant
  - name: status
    type: enum
    source: system
    description: BOOKED | USED | VOID
    constraints: 'enum: BOOKED | USED | VOID'
- name: EnvironmentalIncident
  parent: Contract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> Contract.id; owning contract
  - name: protocol
    type: enum
    source: input
    description: WASTE | WATER | WILDLIFE
    constraints: 'enum: WASTE | WATER | WILDLIFE'
  - name: severity
    type: enum
    source: input
    description: MINOR | MAJOR | CRITICAL
    constraints: 'enum: MINOR | MAJOR | CRITICAL'
  - name: occurred_at
    type: datetime
    source: input
    description: Incident instant
  - name: description
    type: string
    source: input
    description: Free-text description
  - name: corrective_plan_deadline
    type: datetime
    source: computed
    description: occurred_at + CORRECTIVE_PLAN_DAYS days
  - name: status
    type: enum
    source: system
    description: REPORTED | UNDER_REVIEW | CORRECTIVE_PLAN_REQUIRED | CLOSED
    constraints: 'enum: REPORTED | UNDER_REVIEW | CORRECTIVE_PLAN_REQUIRED | CLOSED'
state_machines:
- entity: Contract
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /contracts/{id}/activate
    actor: ConcessionerOpsManager
    preconditions:
    - contract has >= 1 OperatingSeason
    - contract has all four ServiceLine records (LODGING, FOOD, RETAIL, TOURS)
    side_effects:
    - increments Contract.version by 1
  - from: ACTIVE
    to: EXPIRED
    trigger: system (logical clock reaches end_date)
    actor: system
    preconditions: []
    side_effects:
    - all OperatingSeason not yet RECONCILED -> CLOSED
    - all ServiceLine -> SUSPENDED
    - increments Contract.version by 1
  - from: ACTIVE
    to: TRANSITION_PENDING
    trigger: POST /contracts/{id}/initiate-transition
    actor: AgencyContractingOfficer
    preconditions:
    - every CapitalProject in {PROPOSED, AUTHORIZED, COMPLETED} on this contract is either APPROVED or EXPENDED (no live projects)
    - no EnvironmentalIncident on this contract in {REPORTED, UNDER_REVIEW, CORRECTIVE_PLAN_REQUIRED}
    side_effects:
    - increments Contract.version by 1
  - from: EXPIRED
    to: TRANSITION_PENDING
    trigger: POST /contracts/{id}/initiate-transition
    actor: AgencyContractingOfficer
    preconditions:
    - every CapitalProject in {PROPOSED, AUTHORIZED, COMPLETED} on this contract is either APPROVED or EXPENDED
    - no EnvironmentalIncident on this contract in {REPORTED, UNDER_REVIEW, CORRECTIVE_PLAN_REQUIRED}
    side_effects:
    - increments Contract.version by 1
  - from: TRANSITION_PENDING
    to: CLOSED
    trigger: POST /contracts/{id}/finalize-transition
    actor: AgencyContractingOfficer
    preconditions:
    - successor_contract_id is set (a successor contract exists in DRAFT)
    - every FranchiseFeeStatement on this contract is PAID
    - every GrossReceiptsReport on this contract is ACCEPTED
    side_effects:
    - 'for each CapitalProject APPROVED on this contract: mark EXPENDED and create an identical CapitalProject (PROPOSED, same title/asset_ref/authorized_cost_cents, actual_cost_cents = 0) on the successor
      contract'
    - 'for each ServiceLine on this contract: mark TERMINATED; create the same four ServiceLines (AUTHORIZED) on the successor contract'
    - 'for each RoomClass ACTIVE on this contract: mark DECOMMISSIONED; create an equivalent RoomClass (ACTIVE) on the successor contract'
    - 'pay total accrued LSI: sum(accrued_lsi_cents over APPROVED projects) is recorded on the transition report'
    - increments Contract.version by 1
- entity: OperatingSeason
  initial_state: PLANNED
  terminal_states:
  - RECONCILED
  transitions:
  - from: PLANNED
    to: OPEN
    trigger: system (logical clock reaches open_date)
    actor: system
    preconditions: []
    side_effects: []
  - from: OPEN
    to: CLOSED
    trigger: system (logical clock reaches close_date)
    actor: system
    preconditions: []
    side_effects:
    - all Reservation in CONFIRMED with check_out_date <= close_date -> FULFILLED
    - all Reservation in CONFIRMED with check_out_date > close_date -> NO_SHOW
  - from: CLOSED
    to: RECONCILED
    trigger: POST /contracts/{id}/seasons/{seasonId}/reconcile
    actor: ConcessionerOpsManager
    preconditions:
    - every SeasonalHire for this season is in {DEPARTED, NO_SHOW, TERMINATED}
    - every GrossReceiptsReport whose period_month overlaps the season is ACCEPTED
    side_effects:
    - increments Contract.version by 1 (bubble-up)
- entity: RateFiling
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - SUPERSEDED
  - EXPIRED
  transitions:
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /contracts/{id}/rate-filings/{filingId}/start-review
    actor: AgencyRateAnalyst
    preconditions:
    - cited ComparabilityStudy.status == REGISTERED
    side_effects: []
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /contracts/{id}/rate-filings/{filingId}/reject
    actor: AgencyRateAnalyst
    preconditions:
    - rejection reason recorded in request
    side_effects: []
  - from: UNDER_REVIEW
    to: APPROVED
    trigger: POST /contracts/{id}/rate-filings/{filingId}/approve
    actor: AgencyRateAnalyst
    preconditions:
    - cited ComparabilityStudy.status == REGISTERED (re-checked at approval)
    - 'for every submitted band: nightly_rate_cents <= weighted_mean_cents * RATE_CAP_MULTIPLIER (round_half_up on the product)'
    - the submitting user (X-User-ID) is NOT the approving user (segregation of duties)
    side_effects:
    - effective_date = season.open_date
    - approved_weighted_mean_cents = study.weighted_mean_cents (version-pinned at approval)
    - any prior APPROVED RateFiling for the same (season_id, room_class_id) -> SUPERSEDED
    - increments Contract.version by 1 (bubble-up)
  - from: UNDER_REVIEW
    to: REJECTED
    trigger: POST /contracts/{id}/rate-filings/{filingId}/reject
    actor: AgencyRateAnalyst
    preconditions: []
    side_effects: []
  - from: REJECTED
    to: SUBMITTED
    trigger: POST /contracts/{id}/rate-filings (revision submission carrying revision_of_id)
    actor: ConcessionerRateManager
    preconditions:
    - revision_of_id references a REJECTED RateFiling of the same contract
    - same (season_id, room_class_id) as the rejected filing
    side_effects:
    - new RateFiling created in SUBMITTED; the REJECTED filing stays REJECTED (cyclic revision loop)
  - from: APPROVED
    to: SUPERSEDED
    trigger: system (a subsequent filing for the same (season_id, room_class_id) reaches APPROVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: APPROVED
    to: EXPIRED
    trigger: system (logical clock reaches season.close_date)
    actor: system
    preconditions: []
    side_effects: []
  - from: SUBMITTED
    to: SUPERSEDED
    trigger: POST /contracts/{id}/rate-filings (new filing for same (season_id, room_class_id) while a SUBMITTED filing exists)
    actor: ConcessionerRateManager
    preconditions: []
    side_effects:
    - prior SUBMITTED filing for the same (season_id, room_class_id) -> SUPERSEDED
- entity: Reservation
  initial_state: REQUESTED
  terminal_states:
  - CANCELLED
  - NO_SHOW
  - FULFILLED
  transitions:
  - from: REQUESTED
    to: CONFIRMED
    trigger: system (lottery window allocation run at lottery_open_date + lottery_window_hours), or immediate first-come allocation for reservations created after the window closes
    actor: system
    preconditions:
    - room_class nightly inventory available for every night of the stay (allocated_rooms < total_rooms per night)
    side_effects:
    - inventory allocated per night; ordering by created_at ASC, then guest_ref ASC
  - from: REQUESTED
    to: CANCELLED
    trigger: POST /contracts/{id}/reservations/{resId}/cancel
    actor: ConcessionerFrontDesk
    preconditions: []
    side_effects:
    - cancellation_fee_cents = 0 (no allocation yet)
  - from: CONFIRMED
    to: CANCELLED
    trigger: POST /contracts/{id}/reservations/{resId}/cancel
    actor: ConcessionerFrontDesk
    preconditions: []
    side_effects:
    - cancellation_fee_cents = deposit_cents if cancel occurs < CANCEL_FULL_REFUND_DAYS days before check_in_date, else 0
    - inventory released per night; the longest-waiting REQUESTED reservation (created_at ASC, then guest_ref ASC) that now fits is promoted to CONFIRMED
  - from: CONFIRMED
    to: NO_SHOW
    trigger: system (logical clock passes check_in_date + NO_SHOW_GRACE_HOURS hours without a check-in event)
    actor: system
    preconditions: []
    side_effects:
    - cancellation_fee_cents = deposit_cents (forfeit)
  - from: CONFIRMED
    to: FULFILLED
    trigger: system (season close sweep) or POST /contracts/{id}/reservations/{resId}/check-in then checkout sweep
    actor: system
    preconditions: []
    side_effects: []
- entity: GrossReceiptsReport
  initial_state: DRAFT
  terminal_states:
  - ACCEPTED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /contracts/{id}/receipts-reports/{reportId}/submit
    actor: ConcessionerAccountant
    preconditions: []
    side_effects:
    - records submitted_by_role and submitted_by_user_id
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /contracts/{id}/receipts-reports/{reportId}/accept
    actor: AgencyFinancialAuditor
    preconditions:
    - the accepting user (X-User-ID) is NOT the submitting user (segregation of duties)
    side_effects:
    - if a FranchiseFeeStatement for the same period_month is ISSUED, it is marked stale and must be reissued
  - from: SUBMITTED
    to: RETURNED
    trigger: POST /contracts/{id}/receipts-reports/{reportId}/return
    actor: AgencyFinancialAuditor
    preconditions: []
    side_effects: []
  - from: RETURNED
    to: SUBMITTED
    trigger: POST /contracts/{id}/receipts-reports/{reportId}/submit
    actor: ConcessionerAccountant
    preconditions:
    - gross_receipts_cents re-supplied in the resubmission body
    side_effects:
    - records new submitted_by_role and submitted_by_user_id (cyclic rework loop)
- entity: FranchiseFeeStatement
  initial_state: ISSUED
  terminal_states:
  - PAID
  transitions:
  - from: ISSUED
    to: PAID
    trigger: POST /contracts/{id}/fee-statements/{stmtId}/pay
    actor: ConcessionerAccountant
    preconditions: []
    side_effects:
    - payment recorded; statement immutable thereafter
- entity: CapitalProject
  initial_state: PROPOSED
  terminal_states:
  - EXPENDED
  transitions:
  - from: PROPOSED
    to: AUTHORIZED
    trigger: POST /contracts/{id}/capital-projects/{projId}/authorize
    actor: AgencyContractingOfficer
    preconditions: []
    side_effects: []
  - from: AUTHORIZED
    to: COMPLETED
    trigger: POST /contracts/{id}/capital-projects/{projId}/complete
    actor: ConcessionerMaintenanceChief
    preconditions:
    - actual_cost_cents supplied and <= authorized_cost_cents * COST_OVERRUN_CAP_RATE
    side_effects:
    - in_service_month_offset defaults to the current contract month offset when not supplied
    - accrued_lsi_cents computed for the current offset via lsi_accrual
  - from: COMPLETED
    to: APPROVED
    trigger: POST /contracts/{id}/capital-projects/{projId}/approve
    actor: AgencyContractingOfficer
    preconditions:
    - the completing user (X-User-ID) is NOT the approving user — enforcement is by role pair (MaintenanceChief vs ContractingOfficer), so the duty split is structural
    side_effects:
    - LSI accrual begins at in_service_month_offset
    - increments Contract.version by 1 (bubble-up)
  - from: APPROVED
    to: EXPENDED
    trigger: system (during finalize-transition asset transfer)
    actor: system
    preconditions: []
    side_effects:
    - accrued_lsi_cents frozen at the transition offset
- entity: SeasonalHire
  initial_state: HIRED
  terminal_states:
  - DEPARTED
  - NO_SHOW
  - TERMINATED
  transitions:
  - from: HIRED
    to: ARRIVED
    trigger: POST /contracts/{id}/seasonal-hires/{hireId}/mark-arrived
    actor: ConcessionerHRManager
    preconditions: []
    side_effects:
    - the linked TransportVoucher (BOOKED) -> USED
  - from: HIRED
    to: NO_SHOW
    trigger: system (logical clock passes arrival_date + NO_SHOW_GRACE_HOURS hours without mark-arrived)
    actor: system
    preconditions: []
    side_effects:
    - housing bed released
    - the linked TransportVoucher (BOOKED) -> VOID
  - from: HIRED
    to: TERMINATED
    trigger: POST /contracts/{id}/seasonal-hires/{hireId}/terminate
    actor: ConcessionerHRManager
    preconditions: []
    side_effects:
    - housing bed released
    - the linked TransportVoucher (BOOKED) -> VOID
  - from: ARRIVED
    to: DEPARTED
    trigger: POST /contracts/{id}/seasonal-hires/{hireId}/mark-departed
    actor: ConcessionerHRManager
    preconditions: []
    side_effects:
    - housing bed released
  - from: ARRIVED
    to: TERMINATED
    trigger: POST /contracts/{id}/seasonal-hires/{hireId}/terminate
    actor: ConcessionerHRManager
    preconditions: []
    side_effects:
    - housing bed released
- entity: TransportVoucher
  initial_state: BOOKED
  terminal_states:
  - USED
  - VOID
  transitions:
  - from: BOOKED
    to: USED
    trigger: system (linked SeasonalHire -> ARRIVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: BOOKED
    to: VOID
    trigger: system (linked SeasonalHire -> NO_SHOW or TERMINATED) or POST /contracts/{id}/transport-vouchers/{voucherId}/void
    actor: system
    preconditions: []
    side_effects: []
- entity: EnvironmentalIncident
  initial_state: REPORTED
  terminal_states:
  - CLOSED
  transitions:
  - from: REPORTED
    to: UNDER_REVIEW
    trigger: POST /contracts/{id}/environmental-incidents/{incId}/start-review
    actor: AgencyEnvironmentalInspector
    preconditions: []
    side_effects: []
  - from: UNDER_REVIEW
    to: CORRECTIVE_PLAN_REQUIRED
    trigger: POST /contracts/{id}/environmental-incidents/{incId}/require-corrective-plan
    actor: AgencyEnvironmentalInspector
    preconditions: []
    side_effects:
    - corrective_plan_deadline already computed at report time; breach is evaluated at close
  - from: CORRECTIVE_PLAN_REQUIRED
    to: UNDER_REVIEW
    trigger: POST /contracts/{id}/environmental-incidents/{incId}/submit-corrective-plan
    actor: ConcessionerOpsManager
    preconditions:
    - logical clock must be <= corrective_plan_deadline (late plans rejected; cyclic review loop)
    side_effects: []
  - from: UNDER_REVIEW
    to: CLOSED
    trigger: POST /contracts/{id}/environmental-incidents/{incId}/close
    actor: AgencyEnvironmentalInspector
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: rate-filing-create-stale-contract
  parent_entity: Contract
  write_endpoint: POST /contracts/{id}/rate-filings
  occ_field: expected_contract_version
  description: 'Creating a RateFiling against a Contract whose version has advanced since

    the client last observed it is rejected. A second writer who has just

    approved another filing (which supersedes the prior and bumps

    Contract.version) invalidates the current writer''s stale view.

    '
  error_id: ERR_STALE_CONTRACT_VERSION
  http_status: 412
- rule_id: receipts-report-create-stale-contract
  parent_entity: Contract
  write_endpoint: POST /contracts/{id}/receipts-reports
  occ_field: expected_contract_version
  description: 'Creating a GrossReceiptsReport against a Contract whose version has

    advanced since the client last observed it is rejected — the statement

    lineage the client used is no longer current.

    '
  error_id: ERR_STALE_CONTRACT_VERSION
  http_status: 412
- rule_id: reservation-create-stale-contract
  parent_entity: Contract
  write_endpoint: POST /contracts/{id}/reservations
  occ_field: expected_contract_version
  description: 'Creating a Reservation against a Contract whose version has advanced

    since the client last observed it is rejected — rate approvals or season

    reconciliation may have changed the approved-rate basis.

    '
  error_id: ERR_STALE_CONTRACT_VERSION
  http_status: 412
calculations:
- name: comparability_weighted_mean
  trigger: ComparabilityStudy registration
  algorithm: weighted_scoring
  formula: "weighted_mean_cents = round_half_up(\n  sum(c.nightly_rate_cents * c.weight for c in comparables)\n  / sum(c.weight for c in comparables)\n)\n"
  input_set: All comparables in the study; weights must be > 0
  precision: 0 decimal places (integer cents), round_half_up
- name: rate_cap_compliance
  trigger: RateFiling approval
  algorithm: threshold
  formula: "cap_cents = round_half_up(study.weighted_mean_cents * RATE_CAP_MULTIPLIER)\nfor each band in submitted_rates:\n  if band.nightly_rate_cents > cap_cents: reject with ERR_RATE_EXCEEDS_COMPARABILITY\n"
  constants:
    RATE_CAP_MULTIPLIER: 1.05
  precision: 0 decimal places (integer cents), round_half_up on the product
  note: 'Boundary is strict: rate == cap passes, rate == cap + 1 fails (>= vs >)'
- name: occupancy_rate_resolution
  trigger: Reservation creation (rate quote) and per-night charge
  algorithm: tiered_pricing
  formula: "From the APPROVED RateFiling for (season, room_class):\nbands = {SOLO: s, DOUBLE: d, FAMILY: f}\nBANDED variant:\n  quoted_nightly_rate_cents = bands[occupancy_band]\nACTUAL_HEADCOUNT variant:\n\
    \  if beds_occupied == 1: rate = s\n  if beds_occupied == 2: rate = d\n  if beds_occupied == 3: rate = f\nThe two variants price identical inputs differently: a FAMILY reservation\noccupied by 2 guests\
    \ quotes f under BANDED but d under ACTUAL_HEADCOUNT.\n"
  variants:
  - name: banded
    when: occupancy_mode == BANDED
    difference: Rate follows the declared band regardless of headcount
  - name: actual_headcount
    when: occupancy_mode == ACTUAL_HEADCOUNT
    difference: Rate follows beds_occupied; requires beds_occupied in the request
- name: reservation_charge_and_deposit
  trigger: Reservation creation
  algorithm: aggregation
  formula: "nights = floor((check_out_date - check_in_date) / 1 day); must be >= 1\ntotal_charge_cents = quoted_nightly_rate_cents * nights\ndeposit_cents = min(round_half_up(total_charge_cents * DEPOSIT_RATE),\
    \ DEPOSIT_CAP_CENTS)\ncancellation_fee_cents on cancel:\n  if status was CONFIRMED and (check_in_date - now) < CANCEL_FULL_REFUND_DAYS days:\n    fee = deposit_cents\n  else: fee = 0\n"
  constants:
    DEPOSIT_RATE: 0.2
    DEPOSIT_CAP_CENTS: 50000
    CANCEL_FULL_REFUND_DAYS: 30
    NO_SHOW_GRACE_HOURS: 24
  precision: 0 decimal places (integer cents), round_half_up
- name: franchise_fee
  trigger: FranchiseFeeStatement issuance
  algorithm: tiered_pricing
  formula: "Pinned evaluation order (per-line-then-sum):\n  for each ACCEPTED GrossReceiptsReport in the period:\n    line_fee_cents[r] = round_half_up(r.gross_receipts_cents * contract.franchise_fee_rate)\n\
    \  total_fee_cents = sum(line_fee_cents)\nDiagnostic (not the payable figure):\n  aggregate_diagnostic_cents = round_half_up(sum(gross_receipts_cents) * rate)\nThe two orders legitimately differ (e.g.\
    \ 200.00/150.00/90.00 at 3.85%\n-> 16.95 per-line vs 16.94 aggregate-first).\n"
  variants:
  - name: per_line_rounded
    when: reporting_method == PER_LINE_ROUNDED (all issued statements)
    difference: Round each line to cents, then sum — the payable figure
  - name: aggregate_first
    when: diagnostic only, never payable
    difference: Sum lines, then round once — exposes the rounding-order delta
  precision: 0 decimal places (integer cents), round_half_up; per-line rounding order is pinned
- name: lsi_accrual
  trigger: CapitalProject completion, approval, and every accrued_lsi_cents read
  algorithm: decay_function
  formula: "Inputs: authorized_cost_cents A, contract.term_months T,\n        in_service_month_offset m0, current contract offset n, schedule type.\nLINEAR:\n  accrued(n) = A * max(0, min(n, T) - m0) /\
    \ T\nDECLINING_BALANCE:\n  phase1 = 0.50 * A, amortized linearly over the first T/2 months\n  phase2 = 0.30 * A, amortized linearly over the next 0.40*T months\n  phase3 = 0.20 * A, amortized linearly\
    \ over the remaining 0.10*T months\n  accrued(n) = sum of phase accruals up to month min(n, T), each phase\n  counting only months strictly after m0 that fall inside the phase window.\nAll cents values\
    \ round_half_up per month-step before summing.\n"
  constants:
    DECLINING_PHASE_RATES:
    - 0.5
    - 0.3
    - 0.2
    DECLINING_PHASE_WINDOWS:
    - 0.5
    - 0.4
    - 0.1
  variants:
  - name: linear_schedule
    when: contract.lsi_annual_schedule_type == LINEAR
    difference: Straight-line accrual over the full term
  - name: declining_balance_schedule
    when: contract.lsi_annual_schedule_type == DECLINING_BALANCE
    difference: 'Phase-weighted accrual: an identical project and offset produce a different accrued_lsi_cents once the offset crosses a phase boundary (e.g. A=2000000, T=20, m0=2, n=12 accrues 950000 declining
      vs 1000000 linear)'
  precision: 0 decimal places (integer cents), round_half_up per month-step
- name: housing_bed_capacity
  trigger: SeasonalHire creation, arrival, termination, departure, no-show
  algorithm: waterfall_allocation
  formula: "occupied_beds(season) = sum over SeasonalHire in {HIRED, ARRIVED} for the\n  season of 1 bed per hire, capped by the assigned unit's bed_count pool.\nA new hire requires an AVAILABLE EmployeeHousingUnit\
    \ whose\n(bed_count - beds already assigned to hires in {HIRED, ARRIVED} in the\nsame season) >= 1; allocate the unit with the smallest remaining capacity\nthat still fits (best-fit decreasing), tie-break\
    \ unit_code ASC.\nArrival does not change occupancy (HIRED and ARRIVED both occupy).\nDEPARTED / NO_SHOW / TERMINATED release the bed.\nOverflow: if no AVAILABLE unit has a free bed, reject ERR_HOUSING_FULL.\n"
- name: lottery_allocation
  trigger: system allocation run at lottery_open_date + lottery_window_hours
  algorithm: waterfall_allocation
  formula: "Candidate set: all Reservation in REQUESTED for the season whose stay\nlies entirely inside [open_date, close_date].\nOrder: created_at ASC, then guest_ref ASC (id is never a tie-break).\nFor\
    \ each candidate in order:\n  for each night of the stay: require allocated_rooms(night, room_class)\n    < RoomClass.total_rooms — per-night capacity, half-open intervals\n    [check_in_date, check_out_date);\
    \ adjacent stays (one checks out the\n    day another checks in) do NOT conflict.\n  if all nights fit: CONFIRMED and allocate; else leave REQUESTED\n    (waitlisted; promotion occurs on later cancellations).\n\
    Requests submitted after the window closes are allocated in arrival\norder against remaining inventory (first-come by created_at).\n"
- name: environmental_reporting_clock
  trigger: EnvironmentalIncident report and corrective-plan submission
  algorithm: chronological
  formula: 'corrective_plan_deadline = occurred_at + CORRECTIVE_PLAN_DAYS days

    A corrective plan submitted when current logical clock >

    corrective_plan_deadline is rejected ERR_CORRECTIVE_PLAN_LATE.

    Annual plan obligation: if no EnvironmentalIncident exists for the

    calendar year AND no annual plan filing recorded by

    contract.environmental_plan_due_day_of_year, the season cannot reconcile.

    '
  constants:
    CORRECTIVE_PLAN_DAYS: 14
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers must be present and valid
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role must be permitted for this operation
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Resource ids in path must exist, validated left-to-right (contract, then child)
  error_id: ERR_{RESOURCE}_NOT_FOUND
  http_status: 404
  applies_to: all nested endpoints
- priority: 4
  category: existence
  check: Request-body foreign references must exist within the same contract (season, room_class, study, service_line, housing unit, revision filing)
  error_id: ERR_{RESOURCE}_NOT_FOUND
  http_status: 404
  applies_to: creation endpoints with body FKs
- priority: 5
  category: state
  check: Contract must be in a state permitting the operation (ACTIVE for operational writes; TRANSITION_PENDING only for transition finalization)
  error_id: ERR_CONTRACT_NOT_OPERATIONAL
  http_status: 409
  applies_to: all contract-scoped writes
- priority: 6
  category: state
  check: Target entity must be in the correct state for the transition (e.g. filing SUBMITTED/UNDER_REVIEW, report DRAFT/RETURNED, hire HIRED/ARRIVED); reservation creation additionally requires the season
    to be PLANNED or OPEN
  error_id: ERR_INVALID_STATE / ERR_SEASON_NOT_OPEN
  http_status: 409
  applies_to: state-transition endpoints, reservation creation
- priority: 7
  category: business_safety
  check: 'Environmental gate: contract must have no incident in {REPORTED, UNDER_REVIEW, CORRECTIVE_PLAN_REQUIRED} before transition initiation; corrective plan must arrive by deadline'
  error_id: ERR_OPEN_ENVIRONMENTAL_INCIDENT / ERR_CORRECTIVE_PLAN_LATE
  http_status: 409
  applies_to: initiate-transition, submit-corrective-plan, season reconcile
- priority: 8
  category: business_temporal
  check: 'Temporal windows: season open < close; lottery_open_date < open_date; reservation stay inside season; stay length >= 1 night; study valid_through > prepared_at and still valid at review/approval;
    voucher travel_date within season'
  error_id: ERR_INVALID_DATE_RANGE / ERR_LOTTERY_WINDOW / ERR_STAY_OUTSIDE_SEASON / ERR_STUDY_EXPIRED
  http_status: 422
  applies_to: season/filing/study/reservation/voucher creation and review actions
- priority: 9
  category: business_referential
  check: 'Cross-entity state: cited study must be REGISTERED; season must be PLANNED or OPEN for filings; room class ACTIVE; service line AUTHORIZED'
  error_id: ERR_STUDY_NOT_CURRENT / ERR_SEASON_NOT_OPEN_FOR_FILING / ERR_ROOM_CLASS_INACTIVE / ERR_SERVICE_LINE_SUSPENDED
  http_status: 409
  applies_to: rate filings, reservations, receipts reports, hires
- priority: 10
  category: business_constraint
  check: 'Rate cap: every band''s nightly_rate_cents <= round_half_up(weighted_mean_cents * 1.05)'
  error_id: ERR_RATE_EXCEEDS_COMPARABILITY
  http_status: 422
  applies_to: POST .../rate-filings/{id}/approve
- priority: 11
  category: business_constraint
  check: 'Lottery window: reservation creation only inside [lottery_open_date, lottery_open_date + lottery_window_hours] or after window close against remaining inventory; duplicate active reservation for
    same guest_ref + overlapping stay rejected'
  error_id: ERR_LOTTERY_NOT_OPEN / ERR_DUPLICATE_RESERVATION
  http_status: 409
  applies_to: POST .../reservations
- priority: 12
  category: business_constraint
  check: 'Housing capacity: an AVAILABLE unit with a free bed must exist; hire dates within the season; voucher seats >= 1'
  error_id: ERR_HOUSING_FULL / ERR_UNIT_OFFLINE
  http_status: 409
  applies_to: POST .../seasonal-hires
- priority: 13
  category: business_fiscal
  check: 'Fiscal gates: report period not already covered by an ACCEPTED report for the same line; statement only issuable when >= 1 ACCEPTED report exists for the period; project actual_cost <= authorized
    * 1.10; statements all PAID before transition finalization'
  error_id: ERR_DUPLICATE_PERIOD_REPORT / ERR_STATEMENT_NOT_PAID / ERR_COST_OVERRUN / ERR_NO_ACCEPTED_REPORTS
  http_status: 409
  applies_to: receipts reports, fee statements, capital projects, transition
- priority: 14
  category: business_fiscal
  check: 'Segregation of duties: the user approving a rate filing must differ from its submitter; the user accepting a receipts report must differ from its submitter (X-User-ID comparison)'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: approve filing, accept report
- priority: 15
  category: business_constraint
  check: 'OCC: expected_contract_version must equal Contract.version on guarded write endpoints'
  error_id: ERR_STALE_CONTRACT_VERSION
  http_status: 412
  applies_to: rate-filings/receipts-reports/reservations creation
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never falls back to wall-clock).
  roles:
  - SystemTestHarness
  code: 200
  input:
  - current_utc
  output: null
  side_effects:
  - advance system-triggered transitions whose time precondition now holds (season open/close, reservation allocation window close, no-show sweeps, contract expiry)
- method: POST
  path: /contracts
  description: Create a concession contract
  roles:
  - AgencyContractingOfficer
  code: 201
  input:
  - park_code
  - contract_number
  - term_months
  - start_date
  - franchise_fee_rate
  - employee_housing_capacity
  - lsi_annual_schedule_type
  - environmental_plan_due_day_of_year
  output: Contract
  side_effects:
  - end_date computed
  - status DRAFT
- method: GET
  path: /contracts
  description: List contracts
  roles: &id001
  - AgencyContractingOfficer
  - AgencyRateAnalyst
  - ConcessionerRateManager
  - ConcessionerOpsManager
  - ConcessionerFrontDesk
  - ConcessionerAccountant
  - AgencyFinancialAuditor
  - ConcessionerMaintenanceChief
  - ConcessionerHRManager
  - AgencyEnvironmentalInspector
  code: 200
  input:
  - status?
  - successor_contract_id?
  - limit?
  - offset?
  output: Contract[]
  side_effects: []
- method: GET
  path: /contracts/{id}
  description: Get a contract
  roles: *id001
  code: 200
  input: []
  output: Contract
  side_effects: []
- method: POST
  path: /contracts/{id}/activate
  description: Activate a DRAFT contract
  roles:
  - ConcessionerOpsManager
  code: 200
  input: []
  output: Contract
  side_effects:
  - status DRAFT -> ACTIVE
  - increments Contract.version by 1
- method: POST
  path: /contracts/{id}/initiate-transition
  description: Begin recompetition/transition (from ACTIVE or EXPIRED)
  roles:
  - AgencyContractingOfficer
  code: 200
  input: []
  output: Contract
  side_effects:
  - status -> TRANSITION_PENDING
  - increments Contract.version by 1
- method: POST
  path: /contracts/{id}/designate-successor
  description: Designate a DRAFT successor contract
  roles:
  - AgencyContractingOfficer
  code: 200
  input:
  - successor_contract_id
  output: Contract
  side_effects:
  - sets successor_contract_id
  - increments Contract.version by 1
- method: POST
  path: /contracts/{id}/finalize-transition
  description: Complete transition and asset transfer to the successor
  roles:
  - AgencyContractingOfficer
  code: 200
  input: []
  output: Contract
  side_effects:
  - status -> CLOSED; APPROVED capital projects -> EXPENDED and recreated on successor; service lines terminated and recreated; room classes decommissioned and recreated; LSI payout recorded
  - increments Contract.version by 1
- method: POST
  path: /contracts/{id}/seasons
  description: Create an operating season
  roles:
  - ConcessionerOpsManager
  code: 201
  input:
  - year
  - open_date
  - close_date
  - lottery_open_date
  - lottery_window_hours
  output: OperatingSeason
  side_effects:
  - month_offset computed
- method: GET
  path: /contracts/{id}/seasons
  description: List seasons for a contract
  roles: *id001
  code: 200
  input:
  - contract_id?
  - limit?
  - offset?
  output: OperatingSeason[]
  side_effects: []
- method: GET
  path: /contracts/{id}/seasons/{seasonId}
  description: Get a season
  roles: *id001
  code: 200
  input: []
  output: OperatingSeason
  side_effects: []
- method: POST
  path: /contracts/{id}/seasons/{seasonId}/reconcile
  description: Reconcile a CLOSED season
  roles:
  - ConcessionerOpsManager
  code: 200
