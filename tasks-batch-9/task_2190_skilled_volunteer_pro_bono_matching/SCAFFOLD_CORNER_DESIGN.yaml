      - name: endpoint_create_program_cycle_zero_capacity_rejected
        claim_type: standard_crud
        grounds: ["endpoints[POST /program-cycles]", "errors[ERR_VALIDATION]", "errors[ERR_ZERO_HOURS_NOT_ALLOWED]", calculations.cycle_posture]
        distinguishing_aspect: "capacity_slot_total 0 is a range violation, not an hours violation: ERR_ZERO_HOURS_NOT_ALLOWED is scoped to hours, hours_offered, requested_hours, estimated_hours and additional_hours, so the correct answer is 422 ERR_VALIDATION and a zero-capacity cycle - which would make utilization_ratio undefined - never exists."
        test_recipe:
          setup: ["One partner org."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 0}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\" - not ERR_ZERO_HOURS_NOT_ALLOWED, which covers hour fields only"
            - "the same body with capacity_slot_total 1 returns HTTP 201 with posture == \"OPEN\", slots_available == 1 and utilization_ratio == 0.0000"
      - name: endpoint_create_program_cycle_inverted_interval_rejected
        claim_type: standard_crud
        grounds: ["endpoints[POST /program-cycles]", "errors[ERR_VALIDATION]", "validations[priority=17]"]
        distinguishing_aspect: "The cycle interval is the containment reference every availability window is checked against, so an inverted interval (ends_at 2026-07-01 before starts_at 2026-08-01) must be refused at creation with 422 ERR_VALIDATION rather than producing a cycle that no window can ever satisfy."
