      - name: locking_the_collection_account_blocks_receipts_until_it_is_reopened
        claim_type: valid_transition
        grounds:
          - state_machines.CollectionAccount.transitions.OPEN_to_LOCKED
          - state_machines.CollectionAccount.transitions.LOCKED_to_OPEN
          - errors.ERR_COLLECTION_ACCOUNT_NOT_OPEN
        distinguishing_aspect: |
          LOCKED is a reversible pause, not a terminal state: while LOCKED a receipt on an INVOICED
          milestone returns ERR_COLLECTION_ACCOUNT_NOT_OPEN at 409 and leaves the milestone INVOICED
          with the account balance at 0.00; the LOCKED -> OPEN edge restores exactly the same call to
          success, so the same request produces two different outcomes purely from the account's state.
