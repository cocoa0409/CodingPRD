  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: battery_module_rework_cycle_with_auto_scrap
        grounds:
          - state_machines.BatteryModule.IN_QA_to_FAILED
          - state_machines.BatteryModule.FAILED_to_REWORK
          - state_machines.BatteryModule.REWORK_to_IN_QA
        distinguishing_aspect: "Cyclic machine on BatteryModule: IN_QA -> FAILED -> REWORK -> IN_QA loops legally, failure_count accumulates across the loop, and the second FAILED auto-scraps the module in the same request (cycle with a counting termination condition)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Supplier S; module M-100 registered (REGISTERED, failure_count 0)."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-100", pack_kwh: 52 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod_id: $.data.id }
            - call: "POST /evfleet/battery-modules/${mod_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /evfleet/battery-modules/${mod_id}/transition"
              payload: { to_state: "FAILED" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { fc_after_first_fail: $.data.failure_count }
            - call: "POST /evfleet/battery-modules/${mod_id}/transition"
              payload: { to_state: "REWORK" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /evfleet/battery-modules/${mod_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
          trigger:
            - call: "POST /evfleet/battery-modules/${mod_id}/transition"
              payload: { to_state: "FAILED" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { final_status: $.data.quality_status, final_fc: $.data.failure_count }
          assert:
            - "fc_after_first_fail == 1 (the loop preserved and accumulated the count)"
            - "final_status == SCRAPPED — the second FAILED auto-transitioned FAILED -> SCRAPPED because failure_count reached MODULE_MAX_FAILURES (2)"
            - "final_fc == 2"
            - "a subsequent REWORK attempt is rejected with ERR_ALREADY_TERMINAL (SCRAPPED is terminal)"

      - name: software_campaign_pause_resume_cycle_then_rollback
        grounds:
          - state_machines.SoftwareCampaign.CANARY_to_PAUSED
          - state_machines.SoftwareCampaign.PAUSED_to_CANARY
          - state_machines.SoftwareCampaign.CANARY_to_ROLLED_BACK
        distinguishing_aspect: "Branching+cyclic machine on SoftwareCampaign (different entity than BatteryModule): CANARY -> PAUSED -> CANARY resumes to exactly paused_from, and the later ROLLED_BACK branch terminates the campaign with its cascade."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Campaign C (target 2.0.0, scope ALL) created in DRAFT."
          setup_api_calls:
            - *d_clock
            - call: "POST /evfleet/software-campaigns"
              payload: { target_version: "2.0.0", telematics_tier_scope: "ALL" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { camp_id: $.data.id }
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "CANARY" }
              as: ReleaseManager
              as_user_id: "rm-1"
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "PAUSED" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { paused_from_seen: $.data.paused_from }
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "CANARY" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { resumed_status: $.data.status, resumed_paused_from: $.data.paused_from }
          trigger:
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "ROLLED_BACK" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { final_status: $.data.status }
          assert:
            - "paused_from_seen == CANARY (the pause recorded the origin stage)"
            - "resumed_status == CANARY and resumed_paused_from is null (resume returns to exactly paused_from)"
            - "final_status == ROLLED_BACK"
            - "with zero results recorded, the rollback cascade holds zero vehicles: no Vehicle mutates (cascade over empty set)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: campaign_rollback_recalls_vehicles_and_recomputes_order_hold_count
        grounds:
          - state_machines.SoftwareCampaign.CANARY_to_ROLLED_BACK
          - state_machines.Vehicle.delivery_status_IN_TRANSIT_to_delivery_status_ASSEMBLED
          - entities.VehicleOrder.fields.hold_count
        distinguishing_aspect: "Depth-3 chain from the ROLLED_BACK trigger: campaign rollback sets Vehicle.software_hold (link 1); the hold itself reverts an IN_TRANSIT vehicle to ASSEMBLED (link 2); each vehicle mutation recomputes the parent order's hold_count (link 3) — every link caused by the previous one, not by the trigger."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two-vehicle order CONFIRMED; vehicle 1 telematics ACTIVE and delivery IN_TRANSIT; vehicle 2 merely registered. Campaign (target 2.0.0, scope ALL) in CANARY with a SUCCESS result recorded for vehicle 1 (its software_version is 2.0.0)."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - *d_order
            - *d_order_submit
            - *d_order_confirm
            - *d_veh1
            - *d_order_read_1
            - *d_veh2
            - *d_veh1_prov
            - *d_veh1_act
            - *d_veh1_transit
            - call: "POST /evfleet/software-campaigns"
              payload: { target_version: "2.0.0", telematics_tier_scope: "ALL" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { camp_id: $.data.id }
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "CANARY" }
              as: ReleaseManager
              as_user_id: "rm-1"
            - call: "POST /evfleet/software-campaigns/${camp_id}/vehicle-results"
              payload: { vehicle_id: "${veh1_id}", result: "SUCCESS" }
              as: TelematicsIngestion
          trigger:
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "ROLLED_BACK" }
              as: ReleaseManager
              as_user_id: "rm-1"
            - call: "GET /evfleet/vehicles/${veh1_id}"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { v1_hold: $.data.software_hold, v1_delivery: $.data.delivery_status }
            - call: "GET /evfleet/vehicles/${veh2_id}"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { v2_hold: $.data.software_hold }
            - call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { ord_holds: $.data.hold_count }
          assert:
            - "v1_hold == true (link 1: SUCCESS result + telematics ACTIVE)"
            - "v1_delivery == ASSEMBLED (link 2: the hold recalled the IN_TRANSIT van)"
            - "v2_hold == false (no SUCCESS result for vehicle 2 — conditional cascade skips it)"
            - "ord_holds == 1 (link 3: derived hold_count recomputed from the child mutation)"
            - "Vehicle.${veh1_id}.software_version == \"2.0.0\" remains (rollback does not rewrite the version field)"

      - name: visit_completion_consumes_parts_and_flags_restock
        grounds:
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - entities.PartsStock.fields.restock_needed
        distinguishing_aspect: "Depth-2 chain from the COMPLETED trigger (different trigger than the campaign rollback): completion mutates PartsStock quantities (link 1); the stock mutation itself recomputes restock_needed across the reorder threshold (link 2)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Vehicle 1 COMMISSIONED. Service center SC with PartsStock sku BRK-1: on_hand 5, reorder_threshold 4. Visit V on vehicle 1 at SC, window 2026-09-10T09:00-10:00Z, parts_lines [{BRK-1 x 3}], moved SCHEDULED -> IN_PROGRESS."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - *d_order
            - *d_order_submit
            - *d_order_confirm
            - *d_veh1
            - *d_order_read_1
            - *d_veh2
            - *d_veh1_prov
            - *d_veh1_act
            - *d_veh1_transit
            - *d_veh1_depot
            - *d_veh1_comm
            - call: "POST /evfleet/service-centers"
              payload: { name: "SC Bay 1", region_code: "CA-N", state_code: "CA", bay_count: 4 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /evfleet/parts-stocks"
              payload: { service_center_id: "${sc_id}", sku: "BRK-1", qty_delta: 5, reorder_threshold: 4 }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { stock_id: $.data.id }
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", service_center_id: "${sc_id}", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T10:00:00Z", purpose: "MAINTENANCE", parts_lines: [ { sku: "BRK-1", qty: 3 } ] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /evfleet/service-visits/${visit_id}/transition"
              payload: { to_state: "IN_PROGRESS" }
              as: ServiceTechnician
              as_user_id: "st-1"
          trigger:
            - call: "POST /evfleet/service-visits/${visit_id}/transition"
              payload: { to_state: "COMPLETED" }
              as: ServiceTechnician
              as_user_id: "st-1"
            - call: "GET /evfleet/service-centers/${sc_id}/parts-stocks"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { stock_on_hand: "$.data[0].on_hand_qty", stock_reserved: "$.data[0].reserved_qty", stock_consumed: "$.data[0].consumed_total_qty", stock_received: "$.data[0].received_total_qty", stock_restock: "$.data[0].restock_needed" }
          assert:
            - "stock_on_hand == 2 and stock_reserved == 0 and stock_consumed == 3 (link 1: reservation converted to consumption, physical units left)"
            - "stock_received == 5 (receipt history untouched by consumption)"
            - "stock_restock == true (link 2: 2 < reorder_threshold 4, recomputed by the stock mutation)"
            - "ServiceVisit.${visit_id}.status == COMPLETED and completed_by_user_id == \"st-1\""

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_franchise_safety_on_order_review
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_FRANCHISE_EXEMPTION_REQUIRED]"
        distinguishing_aspect: "Category pair state x business_safety: a CONFIRM review on a DRAFT order violates both the state precondition and (with a TX depot + DIRECT_DELIVERY + no exemption) the franchise rule — the state error ERR_INVALID_STATE wins at priority 6; once the order is properly SUBMITTED the same request surfaces ERR_FRANCHISE_EXEMPTION_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot in TX (franchise-blocked); supplier; DIRECT_DELIVERY order left in DRAFT (never submitted)."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Acme Depot TX", state_code: "TX", address: "7 Ranch Rd", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_tx_id: $.data.id }
            - *d_sup
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_tx_id}", battery_supplier_id: "${sup_id}", quantity: 2, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_tx_id: $.data.id }
          trigger:
            - call: "POST /evfleet/vehicle-orders/${ord_tx_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /evfleet/vehicle-orders/${ord_tx_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord_tx_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_franchise: $.data.error_id }
          assert:
            - "err_state == ERR_INVALID_STATE (state precondition at priority 6 beats the franchise safety rule at priority 8)"
            - "err_franchise == ERR_FRANCHISE_EXEMPTION_REQUIRED (once state is clean, the safety rule surfaces)"
            - "VehicleOrder.${ord_tx_id}.status == SUBMITTED after the rejected approvals (no partial transition)"

      - name: temporal_constraint_beats_capacity_fiscal_on_project_create
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - "errors[ERR_INSTALL_WINDOW_CONFLICT]"
          - "errors[ERR_DEPOT_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Category pair business_constraint x business_fiscal: a project create that both overloads the overlapping install crew aggregate (3+2 > MAX_DEPOT_CREW 4) and exceeds the kW headroom (50 > 20) returns ERR_INSTALL_WINDOW_CONFLICT — the temporal-constraint error at priority 12, not the capacity error at priority 14."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot D (total 120 kW). Project P1 (100 kW, window 2026-09-10..2026-09-20, crew 3) created and advanced to PERMITTING."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Conflict Depot", state_code: "CA", address: "3 Wire Ln", total_capacity_kw: 120 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_c_id: $.data.id, depot_c_v: $.data.version }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_c_id}", requested_capacity_kw: 100, install_window_start: "2026-09-10T00:00:00Z", install_window_end: "2026-09-20T00:00:00Z", crew_count: 3, expected_depot_version: "${depot_c_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "PERMITTING" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "GET /evfleet/depots/${depot_c_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_c_v3: $.data.version }
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_c_id}", requested_capacity_kw: 50, install_window_start: "2026-09-15T00:00:00Z", install_window_end: "2026-09-25T00:00:00Z", crew_count: 2, expected_depot_version: "${depot_c_v3}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSTALL_WINDOW_CONFLICT (crew aggregate 3 + 2 = 5 > 4 beats the headroom failure 50 > 20)"
            - "Depot.${depot_c_id}.committed_capacity_kw == 100 unchanged"
            - "GET /evfleet/depots/${depot_c_id}/charging-projects returns exactly 1 project (P1)"

