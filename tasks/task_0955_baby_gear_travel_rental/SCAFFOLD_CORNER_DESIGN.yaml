      - name: error_unit_unavailable_on_confirm
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_UNIT]", "errors[ERR_UNIT_UNAVAILABLE]", calculations.availability_count]
        distinguishing_aspect: "Confirm when the only unit's committed interval (incl. buffer) covers the requested window fails atomically with ERR_NO_ELIGIBLE_UNIT and leaves every line PENDING."
        test_recipe:
          setup: ["single unit committed to CONFIRMED res1 2026-06-10 -> 2026-06-13; res2 QUOTED over the overlapping window 2026-06-12 -> 2026-06-15"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Xan Ye", email: "xan@x.com", phone: "024" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AU", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AU1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "52 Ursina St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations", payload: { delivery_address: "52 Ursina St", zone_code: "Z1", start_date: "2026-06-12", end_date: "2026-06-15", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res2: $.data.id } }
          trigger:
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_UNIT"
            - "Reservation.${res2}.status == QUOTED; its line stays PENDING with assigned_unit_id null; unit stays RESERVED to res1"

