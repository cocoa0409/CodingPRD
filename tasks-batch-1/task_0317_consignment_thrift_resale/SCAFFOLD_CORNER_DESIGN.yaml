            - "POST /items/${item_id}/grade with current version -> 200"
            - "Item.${item_id}.version == 2"
            - "Item.${item_id}.grading_status == ACCEPTED"

      - name: occ_settlement_stale_version_rejected_corner
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-finalize-stale-version]", entities.DailySettlement.fields.version, "errors[ERR_STALE_SETTLEMENT_VERSION]"]
        distinguishing_aspect: "POST /settlements/{id}/finalize carrying expected_settlement_version one below current -> 412 ERR_STALE_SETTLEMENT_VERSION; settlement stays OPEN."
        test_recipe:
          setup: ["One OPEN settlement for 2026-06-21."]
          setup_api_calls:
            - call: "POST /settlements"
              payload: { business_date: "2026-06-21" }
              as: SettlementManager
              captures: { settle_id: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: { expected_settlement_version: "${sv} - 1" }
              as: SettlementManager
              captures: { err: $.data.error_id }
          assert:
            - "POST /settlements/${settle_id}/finalize stale -> 412 ERR_STALE_SETTLEMENT_VERSION"
            - "DailySettlement.${settle_id}.status == OPEN"

      - name: settlement_finalize_sweeps_ledger_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [state_machines.DailySettlement.OPEN_to_FINALIZED, entities.Consignor.fields.unsettled_payable_cents, entities.Consignor.fields.lifetime_payout_cents]
        distinguishing_aspect: "After finalize sweeps a CASH consignor's 4000c SALE_PAYOUT, unsettled_payable_cents drops to 0 and lifetime_payout_cents rises to 4000 (entries move from unsettled to settled)."
        test_recipe:
          setup: ["One CASH GROSS consignor split 0.50; one item sold 8000c on 2026-06-22; an OPEN settlement for that date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T08:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Sweep Sal", email: "sweep@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_id}"}], payment_method: "CARD" }
              as: CashierClerk
            - call: "POST /settlements"
              payload: { business_date: "2026-06-22" }
              as: SettlementManager
              captures: { settle_id: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: { expected_settlement_version: "${sv}" }
              as: SettlementManager
          assert:
            - "GET /consignors/${cons_id} -> data.unsettled_payable_cents == 0"
            - "GET /consignors/${cons_id} -> data.lifetime_payout_cents == 4000"
            - "DailySettlement.${settle_id}.total_consignor_payable_cents == 4000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: error_invalid_state_already_covered_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / sale_void_gated_by_settlement_sweep_state
          rationale: "ERR_INVALID_STATE on a swept-sale void is already asserted as the failure path of that §1.8 instance."

      - name: error_authentication_required_already_covered_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUTHENTICATION_REQUIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / item_list_gated_by_authentication_review_verdict
          rationale: "ERR_AUTHENTICATION_REQUIRED is asserted as the pre-verdict list failure in that §1.8 instance."

      - name: error_price_below_floor_already_covered_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRICE_BELOW_FLOOR]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_temporal_vs_business_constraint_window_vs_price
          rationale: "ERR_PRICE_BELOW_FLOOR is the lower-priority loser in that §1.8 dual-violation; its own trigger is exercised there by construction."
