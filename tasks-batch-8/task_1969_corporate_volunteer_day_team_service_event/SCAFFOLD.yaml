# =============================================================================
# Task 1969 — Corporate Volunteer Day & Team Service Event
# PRD Benchmark seed tables (SCAFFOLD.yaml: §1.0–§1.7)
# =============================================================================

scenario: |
  1969. Corporate Volunteer Day & Team Service Event (corporate community engagement team): nonprofit project sourcing & capacity matching, participant registration & waiver collection, project supply/tool procurement & site prep, staff-to-volunteer supervision ratio, transportation & meal logistics, impact measurement & photo/story capture, corporate sponsorship/donation attached to event, post-event feedback & repeat booking

domain_name: corporate-volunteer-day
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating   # event readiness_posture gates all day-of operations
  secondary_archetype: quota_allocation      # project capacity, vehicle seats, vendor daily capacity
  complexity_layers:
    - cascading_side_effects                 # waiver-version bump → waiver void → rsvp demote → project demote → posture drop
    - dual_variant_calculation               # provisional vs settled sponsorship; scheduled vs verified hours
    - optimistic_concurrency                 # OCC on ServiceEvent.version for meal-plan supersede and reschedule
    - rate_threshold_triggers                # supervision ratio 8:1 / 4:1, reputation suspend/reinstate bands
  entity_topology: flat                      # peer entities with FK references; no nested URL ownership (except meal-plan create + sub-resource reads)
  state_machine_shape: posture_driven        # ServiceEvent.readiness_posture derived from children gates begin; plus cyclic + independent-dimension machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                       # ServiceEvent.source_event_id -> ServiceEvent.id (repeat booking)
  role_model: segregation_of_duties          # procurement creator cannot approve own order; nonprofit submits impact, CEM verifies
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: NonprofitPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Nonprofit organization name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; auto-transitions from reputation bands", default: "ACTIVE" }
      - { name: reputation_score, type: number, source: computed, description: "Recency-weighted mean feedback rating (calc nonprofit_reputation_score); null until first survey" }
      - { name: survey_count, type: integer, source: computed, description: "Count of FeedbackSurveys linked via registration.project.nonprofit_id", default: 0 }
      - { name: completed_event_count, type: integer, source: computed, description: "Count of events reaching COMPLETED/CLOSED that had at least one of this partner's projects COMPLETED", default: 0 }

  - name: ServiceEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: event_start_at, type: datetime, source: input, description: "Event start (ISO8601 UTC); must be strictly after current logical clock at creation" }
      - { name: event_end_at, type: datetime, source: input, description: "Event end (ISO8601 UTC); must be strictly after event_start_at" }
      - { name: status, type: enum, source: system, description: "PLANNING | REGISTRATION_OPEN | REGISTRATION_LOCKED | IN_PROGRESS | COMPLETED | CLOSED | CANCELLED" }
      - { name: readiness_posture, type: enum, source: computed, description: "BLOCKED | PARTIAL | READY; derived aggregate gating begin (calc event_readiness_posture)" }
      - { name: budget_cents, type: integer, source: input, description: "Total event budget in cents", constraints: ">= 0" }
      - { name: waiver_document_version, type: integer, source: input, description: "Current waiver document version; signing records this version", default: 1, constraints: ">= 1" }
      - { name: projected_spend_cents, type: integer, source: computed, description: "Forward-looking spend (calc event_spend_position): orders SUBMITTED/APPROVED/RECEIVED + meals ORDERED/FULFILLED + manifests BOOKED/CONFIRMED/COMPLETED", default: 0 }
      - { name: committed_spend_cents, type: integer, source: computed, description: "Committed spend (calc event_spend_position): orders APPROVED/RECEIVED + meals ORDERED/FULFILLED + manifests CONFIRMED/COMPLETED", default: 0 }
      - { name: available_budget_cents, type: integer, source: computed, description: "budget_cents - projected_spend_cents (conservative gate)" }
      - { name: sponsorship_credit_cents, type: integer, source: computed, description: "SETTLED settled_amount_cents + COMMITTED provisional_amount_cents across sponsorships", default: 0 }
      - { name: net_event_cost_cents, type: integer, source: computed, description: "committed_spend_cents - min(sponsorship_credit_cents, round_half_up(0.50 * committed_spend_cents)) (calc net_event_cost)" }
      - { name: registered_headcount, type: integer, source: computed, description: "Registrations with rsvp_status in {REGISTERED, CONFIRMED, CHECKED_IN}", default: 0 }
      - { name: confirmed_headcount, type: integer, source: computed, description: "Registrations with rsvp_status in {CONFIRMED, CHECKED_IN}", default: 0 }
      - { name: checked_in_headcount, type: integer, source: computed, description: "Registrations with rsvp_status == CHECKED_IN", default: 0 }
      - { name: total_scheduled_hours, type: number, source: computed, description: "Sum of registration.scheduled_hours_credit (calc volunteer_hours_credit)", default: 0 }
      - { name: total_verified_hours, type: number, source: computed, description: "Sum of ImpactRecord.hours_attended with status in {VERIFIED, PUBLISHED}", default: 0 }
      - { name: source_event_id, type: string, source: system, description: "FK -> ServiceEvent.id; set only by rebook; null for original events", default: null }
      - { name: repeat_booking_bonus, type: boolean, source: computed, description: "true iff source event avg_feedback_rating >= 4.0 and this event_start_at <= source event_start_at + 180 days", default: false }
      - { name: avg_feedback_rating, type: number, source: computed, description: "Mean of FeedbackSurvey.rating over registrations of this event, 2dp round_half_up; null until first survey" }

  - name: ServiceProject
    parent: null
    common_fields: true
    fields:
      - { name: nonprofit_id, type: string, source: input, description: "FK -> NonprofitPartner.id; sourcing nonprofit" }
      - { name: event_id, type: string, source: system, description: "FK -> ServiceEvent.id; null until matched; cleared when event cancelled (project returns to VETTED)", default: null }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: required_skills, type: array, source: input, description: "Skill tags volunteers should have (informational)", default: [] }
      - { name: min_volunteers, type: integer, source: input, description: "Minimum confirmed volunteers for lock", constraints: ">= 1" }
      - { name: max_volunteers, type: integer, source: input, description: "Capacity cap on confirmed volunteers", constraints: ">= min_volunteers" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VETTED | MATCHED | LOCKED | COMPLETED | CANCELLED" }
      - { name: confirmed_volunteer_count, type: integer, source: computed, description: "Registrations on this project with rsvp_status in {CONFIRMED, CHECKED_IN}", default: 0 }
      - { name: required_staff_leads, type: integer, source: computed, description: "ceil(adult_confirmed/8) + ceil(minor_confirmed/4); 0 when no confirmed (calc supervision_requirement)", default: 0 }
      - { name: active_staff_leads, type: integer, source: computed, description: "Count of SupervisionAssignments on this project with status ACTIVE", default: 0 }
      - { name: site_prep_complete, type: boolean, source: computed, description: "true iff >= 1 ProcurementOrder RECEIVED for this project AND no order in {SUBMITTED, APPROVED} for this project", default: false }

  - name: EmployeeVolunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer full name" }
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique across EmployeeVolunteer" }
      - { name: department, type: string, source: input, description: "Corporate department" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO8601 date); drives is_minor per event" }
      - { name: skills, type: array, source: input, description: "Skill tags", default: [] }
      - { name: dietary_tags, type: array, source: input, description: "Subset of {VEGETARIAN, VEGAN, GLUTEN_FREE}; empty = no dietary need", default: [] }
      - { name: is_staff_lead, type: boolean, source: input, description: "Eligible for SupervisionAssignment", default: false }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ServiceEvent.id" }
      - { name: project_id, type: string, source: input, description: "FK -> ServiceProject.id; project must be MATCHED/LOCKED to the same event" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> EmployeeVolunteer.id; taken from X-User-ID of the acting EmployeeVolunteer" }
      - { name: rsvp_status, type: enum, source: system, description: "REGISTERED | CONFIRMED | CHECKED_IN | CANCELLED | NO_SHOW" }
      - { name: waiver_status, type: enum, source: system, description: "WAIVER_PENDING | WAIVER_SIGNED | WAIVER_VERIFIED | WAIVER_VOIDED (independent dimension)" }
      - { name: waiver_signed_version, type: integer, source: system, description: "Event waiver_document_version captured at signing; null until signed", default: null }
      - { name: waiver_signer_relation, type: enum, source: system, description: "SELF | GUARDIAN; null until signed", default: null }
      - { name: waiver_signer_name, type: string, source: system, description: "Signer full name recorded at signing; null until signed", default: null }
      - { name: media_consent, type: boolean, source: system, description: "Captured at signing; gates photo/story publish", default: false }
      - { name: is_minor, type: boolean, source: computed, description: "true iff volunteer age < 18 at event.event_start_at" }
      - { name: wants_transport, type: boolean, source: input, description: "Needs shuttle seat", default: false }
      - { name: wants_meal, type: boolean, source: input, description: "Needs meal", default: true }
      - { name: transport_manifest_id, type: string, source: system, description: "FK -> TransportManifest.id; set by assign-transport; cleared on cancel or manifest cancel", default: null }
      - { name: scheduled_hours_credit, type: number, source: computed, description: "Event scheduled hours iff CHECKED_IN else 0 (calc volunteer_hours_credit)", default: 0 }
      - { name: verified_hours_credit, type: number, source: computed, description: "Sum of own ImpactRecord.hours_attended in {VERIFIED, PUBLISHED} (calc volunteer_hours_credit)", default: 0 }
      - { name: checked_in_at, type: datetime, source: system, description: "Timestamp of check-in; null until checked in", default: null }

  - name: ProcurementOrder
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ServiceEvent.id" }
      - { name: project_id, type: string, source: input, description: "FK -> ServiceProject.id; must belong to the same event (else ERR_PROJECT_EVENT_MISMATCH)" }
      - { name: lines, type: array, source: input, description: ">=1 line of {item_name, quantity >= 1, unit_cost_cents >= 0}" }
      - { name: order_total_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(quantity * unit_cost_cents * 1.0875) (calc procurement_order_total)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RECEIVED | REJECTED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties check on approve/reject" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded at reject; null otherwise", default: null }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vehicle label (e.g., Bus-7)" }
      - { name: seat_capacity, type: integer, source: input, description: "Total seats", constraints: ">= 1" }

  - name: TransportManifest
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ServiceEvent.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: depart_at, type: datetime, source: input, description: "Departure (ISO8601 UTC); must be after current logical clock" }
      - { name: return_at, type: datetime, source: input, description: "Return (ISO8601 UTC); strictly after depart_at" }
      - { name: cost_cents, type: integer, source: input, description: "Manifest cost debited to event spend while BOOKED/CONFIRMED/COMPLETED", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "BOOKED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: assigned_seats, type: integer, source: computed, description: "Registrations with transport_manifest_id == this and rsvp_status in {REGISTERED, CONFIRMED, CHECKED_IN}", default: 0 }

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ServiceEvent.id; from path of POST /service-events/{eventId}/meal-plans" }
      - { name: vendor_name, type: string, source: input, description: "Caterer; vendor-day capacity aggregation key (with event date)" }
      - { name: per_person_cost_cents, type: integer, source: input, constraints: ">= 1", description: "Base per-person price" }
      - { name: dietary_surcharge_cents, type: integer, source: input, default: 0, constraints: ">= 0", description: "Added per person with non-empty dietary_tags" }
      - { name: status, type: enum, source: system, description: "DRAFT | ORDERED | FULFILLED | CANCELLED" }
      - { name: ordered_headcount, type: integer, source: system, description: "Snapshot at order: registrations rsvp in {CONFIRMED, CHECKED_IN} with wants_meal; null until ORDERED", default: null }
      - { name: dietary_headcount, type: integer, source: system, description: "Snapshot at order: subset of ordered_headcount with non-empty dietary_tags; null until ORDERED", default: null }
      - { name: total_cost_cents, type: integer, source: computed, description: "(ordered-dietary)*per_person + dietary*(per_person+surcharge); null until ORDERED (calc meal_plan_total)", default: null }

  - name: SupervisionAssignment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> ServiceProject.id; project must be MATCHED or LOCKED" }
      - { name: event_id, type: string, source: system, description: "FK -> ServiceEvent.id; copied from project.event_id at creation" }
      - { name: lead_volunteer_id, type: string, source: input, description: "FK -> EmployeeVolunteer.id; must have is_staff_lead == true" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }

  - name: Sponsorship
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ServiceEvent.id" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor legal name" }
      - { name: match_type, type: enum, source: input, description: "FLAT | PER_CHECK_IN | PER_VERIFIED_HOUR" }
      - { name: rate_cents, type: integer, source: input, constraints: ">= 1", description: "Flat amount (FLAT) or per-unit rate (cents per check-in / per verified hour)" }
      - { name: pledge_cap_cents, type: integer, source: input, constraints: ">= 1", description: "Donation cap before repeat bonus uplift" }
      - { name: status, type: enum, source: system, description: "PLEDGED | COMMITTED | SETTLED | WITHDRAWN" }
      - { name: effective_cap_cents, type: integer, source: computed, description: "round_half_up(pledge_cap_cents * 1.10) when event.repeat_booking_bonus else pledge_cap_cents" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Forward-looking estimate (calc sponsorship_amount, provisional variant)", default: 0 }
      - { name: settled_amount_cents, type: integer, source: system, description: "Final amount computed at settle (chronological variant); null until SETTLED", default: null }

  - name: ImpactRecord
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; registration must be CHECKED_IN" }
      - { name: project_id, type: string, source: input, description: "FK -> ServiceProject.id; must equal registration.project_id (else ERR_IMPACT_PROJECT_MISMATCH)" }
      - { name: event_id, type: string, source: system, description: "FK -> ServiceEvent.id; copied from registration.event_id" }
      - { name: hours_attended, type: number, source: input, description: "Verified-worked hours claim", constraints: "> 0 and <= event scheduled hours" }
      - { name: photo_count, type: integer, source: input, default: 0, constraints: ">= 0", description: "Photos attached" }
      - { name: story_text, type: string, source: input, description: "Optional story capture; empty = no story", default: "" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | PUBLISHED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Recorded at reject; null otherwise", default: null }

  - name: FeedbackSurvey
    parent: null
    common_fields: false
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; exactly one survey per registration" }
      - { name: rating, type: integer, source: input, constraints: "1..5", description: "Star rating" }
      - { name: would_repeat, type: boolean, source: input, description: "Would volunteer with this nonprofit again" }
      - { name: comments, type: string, source: input, default: "", description: "Free-text comments" }

# =============================================================================
# Global invariants (pinned semantics referenced across tables)
# =============================================================================
global_invariants:
  version_bump_scope: |
    An entity's `version` increments by exactly 1 only on DIRECT writes to that entity
    (its own create/action/transition endpoints, including system transitions whose
    from/to live on that entity). Recomputation of a computed/derived field in the
    wake of a child or sibling mutation (headcounts, spend, posture, credits) does
    NOT increment version by itself; updated_at refreshes on any persisted change.
  clock: |
    The logical clock starts at exactly 2026-08-01T00:00:00Z and moves only via
    POST /_clock/set_current_utc. All deadline/window validations read this clock.
  ordering: |
    Batch/cascade side effects apply in created_at ASC order of the affected child
    entities; no selector or tie-break ever uses random id values.

# =============================================================================
# Table 2: State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: ServiceEvent
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /service-events/{eventId}/open-registration"
        actor: CommunityEngagementManager
        preconditions:
          - "status == PLANNING (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects:
          - "increments ServiceEvent.version by 1"
      - from: REGISTRATION_OPEN
        to: REGISTRATION_LOCKED
        trigger: "POST /service-events/{eventId}/lock-registration"
        actor: CommunityEngagementManager
        preconditions:
          - "status == REGISTRATION_OPEN (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects:
          - "increments ServiceEvent.version by 1"
      - from: REGISTRATION_LOCKED
        to: IN_PROGRESS
        trigger: "POST /service-events/{eventId}/begin"
        actor: CommunityEngagementManager
        preconditions:
          - "status == REGISTRATION_LOCKED (else ERR_INVALID_EVENT_TRANSITION)"
          - "readiness_posture == READY (else ERR_EVENT_NOT_READY)"
        side_effects:
          - "increments ServiceEvent.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-events/{eventId}/complete"
        actor: CommunityEngagementManager
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects:
          - "Every Registration with rsvp_status == CONFIRMED -> NO_SHOW (never-checked-in volunteers)"
          - "Every ServiceProject with event_id == this and status == LOCKED -> COMPLETED"
          - "Every TransportManifest with event_id == this and status in {BOOKED, CONFIRMED} -> COMPLETED"
          - "Every MealPlan with event_id == this and status == ORDERED -> FULFILLED"
          - "Recompute headcounts, spend, posture; increments ServiceEvent.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /service-events/{eventId}/close"
        actor: CommunityEngagementManager
        preconditions:
          - "status == COMPLETED (else ERR_INVALID_EVENT_TRANSITION)"
          - "All Sponsorships of this event in {SETTLED, WITHDRAWN} (else ERR_UNRESOLVED_SPONSORSHIPS)"
        side_effects:
          - "increments ServiceEvent.version by 1"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /service-events/{eventId}/cancel"
        actor: CommunityEngagementManager
        preconditions:
          - "status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects:
          - "Registrations of this event with rsvp_status in {REGISTERED, CONFIRMED} -> CANCELLED (transport_manifest_id cleared)"
          - "ProcurementOrders in {DRAFT, SUBMITTED, APPROVED} -> CANCELLED (budget reversal); RECEIVED untouched"
          - "TransportManifests in {BOOKED, CONFIRMED} -> CANCELLED"
          - "MealPlans in {DRAFT, ORDERED} -> CANCELLED"
          - "Sponsorships in {PLEDGED, COMMITTED} -> WITHDRAWN"
          - "ServiceProjects in {MATCHED, LOCKED} -> VETTED with event_id cleared to null"
          - "SupervisionAssignments ACTIVE -> WITHDRAWN"
          - "increments ServiceEvent.version by 1"
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /service-events/{eventId}/cancel"
        actor: CommunityEngagementManager
        preconditions:
          - "status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects: ["Same cascade as PLANNING -> CANCELLED"]
      - from: REGISTRATION_LOCKED
        to: CANCELLED
        trigger: "POST /service-events/{eventId}/cancel"
        actor: CommunityEngagementManager
        preconditions:
          - "status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_INVALID_EVENT_TRANSITION)"
        side_effects: ["Same cascade as PLANNING -> CANCELLED"]

  - entity: ServiceProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: VETTED
        trigger: "POST /service-projects/{projectId}/vet"
        actor: CommunityEngagementManager
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_PROJECT_TRANSITION)"
          - "NonprofitPartner.status == ACTIVE (else ERR_NONPROFIT_SUSPENDED)"
        side_effects: []
      - from: VETTED
        to: MATCHED
        trigger: "POST /service-projects/{projectId}/match"
        actor: CommunityEngagementManager
        preconditions:
          - "status == VETTED (else ERR_INVALID_PROJECT_TRANSITION)"
          - "NonprofitPartner.status == ACTIVE (else ERR_NONPROFIT_SUSPENDED)"
          - "Target ServiceEvent.status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"
        side_effects:
          - "project.event_id := target event; event readiness_posture recomputed"
      - from: MATCHED
        to: LOCKED
        trigger: "POST /service-projects/{projectId}/lock"
        actor: CommunityEngagementManager
        preconditions:
          - "status == MATCHED (else ERR_INVALID_PROJECT_TRANSITION)"
          - "event.status in {REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"
          - "confirmed_volunteer_count >= min_volunteers (else ERR_MIN_VOLUNTEERS_NOT_MET)"
          - "required_staff_leads >= 1 AND active_staff_leads >= required_staff_leads (else ERR_INSUFFICIENT_SUPERVISION)"
          - "site_prep_complete == true (else ERR_SITE_PREP_INCOMPLETE)"
        side_effects:
          - "event readiness_posture recomputed"
      - from: LOCKED
        to: MATCHED
        trigger: "system (automatic demotion when supervision or headcount invariant breaks)"
        actor: system
        preconditions:
          - "Fires when a confirm pushes required_staff_leads above active_staff_leads, OR a SupervisionAssignment withdraw leaves active_staff_leads < required_staff_leads, OR a registration cancel / waiver-version bump drops confirmed_volunteer_count below min_volunteers or required above active"
        side_effects:
          - "event readiness_posture recomputed (READY typically degrades to PARTIAL)"
      - from: LOCKED
        to: COMPLETED
        trigger: "system (cascade from POST /service-events/{eventId}/complete)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: VETTED
        trigger: "system (cascade from POST /service-events/{eventId}/cancel; event_id cleared)"
        actor: system
        preconditions: []
        side_effects: ["SupervisionAssignments of this project ACTIVE -> WITHDRAWN"]
      - from: LOCKED
        to: VETTED
        trigger: "system (cascade from POST /service-events/{eventId}/cancel; event_id cleared)"
        actor: system
        preconditions: []
        side_effects: ["SupervisionAssignments of this project ACTIVE -> WITHDRAWN"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /service-projects/{projectId}/cancel or system (nonprofit auto-suspend cascades PROPOSED/VETTED projects)"
        actor: CommunityEngagementManager | system
        preconditions:
          - "status in {PROPOSED, VETTED, MATCHED, LOCKED} (else ERR_INVALID_PROJECT_TRANSITION)"
        side_effects:
          - "Non-terminal Registrations on this project -> CANCELLED (transport_manifest_id cleared)"
          - "SupervisionAssignments ACTIVE -> WITHDRAWN"
          - "event readiness_posture recomputed"
      - from: VETTED
        to: CANCELLED
        trigger: "POST /service-projects/{projectId}/cancel or system (nonprofit auto-suspend)"
        actor: CommunityEngagementManager | system
        preconditions: ["status in {PROPOSED, VETTED, MATCHED, LOCKED}"]
        side_effects: ["Same cascade as PROPOSED -> CANCELLED"]
      - from: MATCHED
        to: CANCELLED
        trigger: "POST /service-projects/{projectId}/cancel"
        actor: CommunityEngagementManager
        preconditions: ["status in {PROPOSED, VETTED, MATCHED, LOCKED}"]
        side_effects: ["Same cascade as PROPOSED -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /service-projects/{projectId}/cancel"
        actor: CommunityEngagementManager
        preconditions: ["status in {PROPOSED, VETTED, MATCHED, LOCKED}"]
        side_effects: ["Same cascade as PROPOSED -> CANCELLED"]

  - entity: Registration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, NO_SHOW]
    transitions:
      # ---- rsvp dimension ----
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /registrations/{registrationId}/confirm"
        actor: CommunityEngagementManager
        preconditions:
          - "rsvp_status == REGISTERED (else ERR_INVALID_REGISTRATION_TRANSITION)"
          - "event.status in {REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"
          - "project.status in {MATCHED, LOCKED} (else ERR_INVALID_PROJECT_TRANSITION)"
          - "waiver_status in {WAIVER_SIGNED, WAIVER_VERIFIED} (else ERR_WAIVER_NOT_SIGNED) [business_safety]"
          - "project.confirmed_volunteer_count < project.max_volunteers (else ERR_PROJECT_AT_CAPACITY) [business_constraint]"
        side_effects:
          - "project.confirmed_volunteer_count += 1; required_staff_leads recomputed (calc supervision_requirement)"
          - "If project.status == LOCKED and new required_staff_leads > active_staff_leads: project auto-demotes LOCKED -> MATCHED and event posture recomputed"
          - "event headcounts recomputed"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /registrations/{registrationId}/check-in"
        actor: CommunityEngagementManager | StaffLead
        preconditions:
          - "rsvp_status == CONFIRMED (else ERR_INVALID_REGISTRATION_TRANSITION)"
          - "event.status == IN_PROGRESS (else ERR_EVENT_STATE_FORBIDS_WRITE)"
          - "waiver_status == WAIVER_VERIFIED (else ERR_WAIVER_NOT_VERIFIED) [business_safety]"
          - "If actor is StaffLead: acting lead must hold an ACTIVE SupervisionAssignment on registration.project_id (else ERR_NOT_PROJECT_LEAD)"
        side_effects:
          - "checked_in_at := current logical clock; scheduled_hours_credit := event scheduled hours (calc volunteer_hours_credit)"
          - "event.checked_in_headcount recomputed; posture recomputed"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /registrations/{registrationId}/cancel"
        actor: CommunityEngagementManager | EmployeeVolunteer
        preconditions:
          - "rsvp_status in {REGISTERED, CONFIRMED} (else ERR_INVALID_REGISTRATION_TRANSITION)"
          - "If actor is EmployeeVolunteer: X-User-ID must equal registration.volunteer_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "transport_manifest_id cleared (frees seat on manifest)"
          - "If was CONFIRMED: project.confirmed_volunteer_count -= 1; required_staff_leads recomputed; if project LOCKED and confirmed_volunteer_count < min_volunteers: project auto-demotes LOCKED -> MATCHED; event posture recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /registrations/{registrationId}/cancel"
        actor: CommunityEngagementManager | EmployeeVolunteer
        preconditions: ["Same as REGISTERED -> CANCELLED"]
        side_effects: ["Same as REGISTERED -> CANCELLED"]
      - from: CONFIRMED
        to: REGISTERED
        trigger: "system (demotion cascade from POST /service-events/{eventId}/bump-waiver-version voiding this registration's waiver)"
        actor: system
        preconditions: []
        side_effects:
          - "project.confirmed_volunteer_count -= 1; required_staff_leads recomputed; if project LOCKED and (confirmed < min_volunteers OR required > active): project LOCKED -> MATCHED; event posture recomputed"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (cascade from POST /service-events/{eventId}/complete)"
        actor: system
        preconditions: []
        side_effects: ["transport_manifest_id cleared"]
      # ---- waiver dimension (independent) ----
      - from: WAIVER_PENDING
        to: WAIVER_SIGNED
        trigger: "POST /registrations/{registrationId}/sign-waiver"
        actor: EmployeeVolunteer
        preconditions:
          - "waiver_status in {WAIVER_PENDING, WAIVER_VOIDED} (else ERR_INVALID_REGISTRATION_TRANSITION)"
          - "event.status in {REGISTRATION_OPEN, REGISTRATION_LOCKED, IN_PROGRESS} (else ERR_EVENT_STATE_FORBIDS_WRITE)"
          - "is_minor == true requires signer_relation == GUARDIAN and non-empty guardian_name (else ERR_GUARDIAN_SIGNATURE_REQUIRED)"
          - "is_minor == false requires signer_relation == SELF (else ERR_VALIDATION)"
        side_effects:
          - "waiver_signed_version := event.waiver_document_version; waiver_signer_name/relation/media_consent recorded"
      - from: WAIVER_VOIDED
        to: WAIVER_SIGNED
        trigger: "POST /registrations/{registrationId}/sign-waiver"
        actor: EmployeeVolunteer
        preconditions: ["Same as WAIVER_PENDING -> WAIVER_SIGNED"]
        side_effects: ["Same as WAIVER_PENDING -> WAIVER_SIGNED"]
      - from: WAIVER_SIGNED
        to: WAIVER_VERIFIED
        trigger: "POST /registrations/{registrationId}/verify-waiver"
        actor: CommunityEngagementManager
        preconditions:
          - "waiver_status == WAIVER_SIGNED (else ERR_INVALID_REGISTRATION_TRANSITION)"
        side_effects: []
      - from: WAIVER_SIGNED
        to: WAIVER_VOIDED
        trigger: "system (cascade from POST /service-events/{eventId}/bump-waiver-version when waiver_signed_version < new version)"
        actor: system
        preconditions: []
        side_effects: ["If rsvp_status == CONFIRMED: rsvp demotes to REGISTERED with project/event recomputes (see rsvp CONFIRMED -> REGISTERED)"]
      - from: WAIVER_VERIFIED
        to: WAIVER_VOIDED
        trigger: "system (cascade from POST /service-events/{eventId}/bump-waiver-version when waiver_signed_version < new version)"
        actor: system
        preconditions: []
        side_effects: ["Same demotion cascade as WAIVER_SIGNED -> WAIVER_VOIDED"]

  - entity: ProcurementOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /procurement-orders/{orderId}/submit"
        actor: CommunityEngagementManager
        preconditions: ["status in {DRAFT, REJECTED} (else ERR_INVALID_ORDER_TRANSITION)", "event.status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"]
        side_effects: ["event spend recomputed (order now counted in projected_spend)"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /procurement-orders/{orderId}/submit"
        actor: CommunityEngagementManager
        preconditions: ["Same as DRAFT -> SUBMITTED"]
        side_effects: ["Same as DRAFT -> SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /procurement-orders/{orderId}/approve"
        actor: ProcurementOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_ORDER_TRANSITION)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "event.status in {PLANNING, REGISTRATION_OPEN, REGISTRATION_LOCKED} (else ERR_EVENT_STATE_FORBIDS_WRITE) [state]"
          - "event.projected_spend_cents (already includes this order) <= event.budget_cents (else ERR_BUDGET_WOULD_EXCEED) [business_fiscal]"
        side_effects: ["event spend recomputed; posture recomputed (order now blocks readiness until RECEIVED)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /procurement-orders/{orderId}/reject"
        actor: ProcurementOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_ORDER_TRANSITION)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["rejection_reason recorded; event spend recomputed (order leaves projected_spend)"]
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /procurement-orders/{orderId}/receive"
        actor: CommunityEngagementManager
        preconditions: ["status == APPROVED (else ERR_INVALID_ORDER_TRANSITION)"]
        side_effects: ["project.site_prep_complete recomputed; event spend recomputed; posture recomputed"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /procurement-orders/{orderId}/cancel"
        actor: CommunityEngagementManager
        preconditions: ["status in {DRAFT, SUBMITTED, APPROVED} (else ERR_INVALID_ORDER_TRANSITION)"]
        side_effects: ["event spend recomputed (budget reversal); posture recomputed"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /procurement-orders/{orderId}/cancel"
        actor: CommunityEngagementManager
        preconditions: ["status in {DRAFT, SUBMITTED, APPROVED}"]
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /procurement-orders/{orderId}/cancel"
        actor: CommunityEngagementManager
        preconditions: ["status in {DRAFT, SUBMITTED, APPROVED}"]
        side_effects: ["Same as DRAFT -> CANCELLED"]

  - entity: TransportManifest
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /transport-manifests/{manifestId}/confirm"
        actor: LogisticsCoordinator
        preconditions: ["status == BOOKED (else ERR_INVALID_MANIFEST_TRANSITION)"]
        side_effects: ["event spend recomputed (cost enters committed_spend); posture recomputed"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /transport-manifests/{manifestId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in {BOOKED, CONFIRMED} (else ERR_INVALID_MANIFEST_TRANSITION)"]
        side_effects: ["Registrations pointing at this manifest have transport_manifest_id cleared; vehicle window freed; event spend recomputed; posture recomputed"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /transport-manifests/{manifestId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in {BOOKED, CONFIRMED}"]
        side_effects: ["Same as BOOKED -> CANCELLED"]
      - from: BOOKED
        to: COMPLETED
        trigger: "system (cascade from POST /service-events/{eventId}/complete)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade from POST /service-events/{eventId}/complete)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MealPlan
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /meal-plans/{mealPlanId}/order"
        actor: LogisticsCoordinator
        preconditions:
          - "status == DRAFT (else ERR_INVALID_MEAL_PLAN_TRANSITION)"
          - "current logical clock <= event.event_start_at - 72h (else ERR_MEAL_ORDER_DEADLINE_PASSED) [business_temporal]"
          - "snapshot ordered_headcount >= 1 (else ERR_NO_MEAL_HEADCOUNT) [business_constraint, empty-set edge]"
          - "vendor-day aggregate: sum of ordered_headcount over MealPlans with same vendor_name, same UTC event date, status in {ORDERED, FULFILLED}, plus this snapshot, <= VENDOR_DAILY_CAPACITY (else ERR_VENDOR_CAPACITY_EXCEEDED)"
        side_effects: ["ordered_headcount/dietary_headcount snapshotted; total_cost_cents computed (calc meal_plan_total); event spend recomputed; posture recomputed"]
      - from: ORDERED
        to: FULFILLED
        trigger: "POST /meal-plans/{mealPlanId}/fulfill or system cascade at event complete"
        actor: LogisticsCoordinator | system
        preconditions: ["status == ORDERED (else ERR_INVALID_MEAL_PLAN_TRANSITION); manual fulfill also requires event.status in {IN_PROGRESS, COMPLETED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /meal-plans/{mealPlanId}/cancel, system supersede (new meal plan created for event), or system cascade at event cancel"
        actor: LogisticsCoordinator | system
        preconditions: ["status in {DRAFT, ORDERED} (else ERR_INVALID_MEAL_PLAN_TRANSITION)"]
        side_effects: ["event spend recomputed (reversal); posture recomputed"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /meal-plans/{mealPlanId}/cancel or system cascade at event cancel"
        actor: LogisticsCoordinator | system
        preconditions: ["status in {DRAFT, ORDERED}"]
        side_effects: ["Same as DRAFT -> CANCELLED"]

  - entity: SupervisionAssignment
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /supervision-assignments/{assignmentId}/withdraw or system cascade (project cancel / event cancel)"
        actor: CommunityEngagementManager | StaffLead | system
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_SUPERVISION_TRANSITION)"
          - "If actor is StaffLead: X-User-ID must equal lead_volunteer_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "project.active_staff_leads -= 1; if project.status == LOCKED and active_staff_leads < required_staff_leads: project auto-demotes LOCKED -> MATCHED; event posture recomputed"

  - entity: Sponsorship
    initial_state: PLEDGED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: COMMITTED
        trigger: "POST /sponsorships/{sponsorshipId}/commit"
        actor: FinanceController
        preconditions: ["status == PLEDGED (else ERR_INVALID_SPONSORSHIP_TRANSITION)"]
        side_effects: ["event.sponsorship_credit_cents recomputed (provisional enters credit)"]
      - from: COMMITTED
        to: SETTLED
        trigger: "POST /sponsorships/{sponsorshipId}/settle"
        actor: FinanceController
        preconditions:
          - "status == COMMITTED (else ERR_INVALID_SPONSORSHIP_TRANSITION)"
          - "event.status in {COMPLETED, CLOSED} (else ERR_EVENT_STATE_FORBIDS_WRITE)"
        side_effects: ["settled_amount_cents computed (calc sponsorship_amount, settled variant); event sponsorship totals + net_event_cost recomputed"]
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /sponsorships/{sponsorshipId}/withdraw or system cascade at event cancel"
        actor: FinanceController | system
        preconditions: ["status in {PLEDGED, COMMITTED} (else ERR_INVALID_SPONSORSHIP_TRANSITION)"]
        side_effects: ["event.sponsorship_credit_cents recomputed (reversal)"]
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /sponsorships/{sponsorshipId}/withdraw or system cascade at event cancel"
        actor: FinanceController | system
        preconditions: ["status in {PLEDGED, COMMITTED}"]
        side_effects: ["Same as PLEDGED -> WITHDRAWN"]

  - entity: ImpactRecord
    initial_state: SUBMITTED
    terminal_states: [PUBLISHED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /impact-records/{recordId}/verify"
        actor: CommunityEngagementManager
        preconditions: ["status == SUBMITTED (else ERR_INVALID_IMPACT_TRANSITION)"]
        side_effects: ["event.total_verified_hours and registration.verified_hours_credit recomputed (calc volunteer_hours_credit)"]
      - from: VERIFIED
        to: PUBLISHED
        trigger: "POST /impact-records/{recordId}/publish"
        actor: CommunityEngagementManager
        preconditions:
          - "status == VERIFIED (else ERR_INVALID_IMPACT_TRANSITION)"
          - "If photo_count > 0 or story_text non-empty: registration.media_consent must be true (else ERR_MEDIA_CONSENT_MISSING) [business_safety]"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /impact-records/{recordId}/reject"
        actor: CommunityEngagementManager
        preconditions: ["status in {SUBMITTED, VERIFIED} (else ERR_INVALID_IMPACT_TRANSITION)"]
        side_effects: ["rejection_reason recorded; if was VERIFIED: verified-hours recomputes reverse the record's hours"]
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /impact-records/{recordId}/reject"
        actor: CommunityEngagementManager
        preconditions: ["status in {SUBMITTED, VERIFIED}"]
        side_effects: ["Same as SUBMITTED -> REJECTED"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /impact-records/{recordId}/resubmit"
        actor: NonprofitCoordinator
        preconditions:
          - "status == REJECTED (else ERR_INVALID_IMPACT_TRANSITION)"
          - "Acting NonprofitCoordinator id must equal project.nonprofit_id (else ERR_FORBIDDEN_ROLE)"
        side_effects: ["rejection_reason cleared to null"]

  - entity: NonprofitPartner
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic on FeedbackSurvey creation when reputation_score < 2.50 and survey_count >= 3)"
        actor: system
        preconditions: []
        side_effects: ["Partner's ServiceProjects in {PROPOSED, VETTED} -> CANCELLED (MATCHED/LOCKED/COMPLETED untouched)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic on FeedbackSurvey creation when reputation_score >= 3.00)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: meal-plan-create-stale-event
    parent_entity: ServiceEvent
    write_endpoint: "POST /service-events/{eventId}/meal-plans"
    occ_field: expected_event_version
    description: |
      Creating a MealPlan against a ServiceEvent whose version has advanced
      since the client last observed it is rejected. Creation supersedes the
      event's existing DRAFT MealPlan under §1.5, so a stale writer would
      silently cancel a plan it never saw; the stale expected_event_version
      is rejected instead.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: event-reschedule-stale-version
    parent_entity: ServiceEvent
    write_endpoint: "POST /service-events/{eventId}/reschedule"
    occ_field: expected_event_version
    description: |
      Rescheduling a ServiceEvent whose version has advanced since the client
      last observed it is rejected; the client's view of headcounts, posture,
      and deadlines is stale relative to the event's current mutation state.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: supervision_requirement
    trigger: "registration confirm / cancel / check-in demotion cascades; supervision create/withdraw; project lock"
    algorithm: threshold
    formula: |
      adult_confirmed = count of Registrations on the project with rsvp_status in {CONFIRMED, CHECKED_IN} and is_minor == false
      minor_confirmed = count of same with is_minor == true
      if adult_confirmed + minor_confirmed == 0: required_staff_leads = 0
      else: required_staff_leads = ceil(adult_confirmed / ADULT_RATIO) + ceil(minor_confirmed / MINOR_RATIO)
      # >=3 inputs (adult_confirmed, minor_confirmed, two ratio constants) with non-linear
      # interaction (two independent ceilings + zero-set branch). Boundary: exactly 8 adults
      # needs 1 lead; 9 adults needs 2; exactly 4 minors needs 1 dedicated lead; 5 minors needs 2.
    input_set: "Registrations of one project, rsvp_status in {CONFIRMED, CHECKED_IN}"
    constants:
      ADULT_RATIO: 8
      MINOR_RATIO: 4
    precision: "integer (ceil)"

  - name: procurement_order_total
    trigger: "POST /procurement-orders (creation)"
    algorithm: tiered_pricing
    formula: |
      # NESTED ROUNDING — pinned order: round each line FIRST, then sum.
      for each line in lines:
        line_total_cents = round_half_up(line.quantity * line.unit_cost_cents * (1 + TAX_RATE))   # to whole cents
      order_total_cents = sum(line_total_cents)
      # The alternative (sum raw line products, then round once) is REJECTED and yields
      # different cents: e.g. lines (3 x 999) + (7 x 149): per-line = 3259 + 1134 = 4393;
      # sum-then-round = round_half_up(4393.5) = 4394.
    input_set: "The order's lines array at creation; order_total_cents is immutable afterwards"
    constants:
      TAX_RATE: 0.0875
    precision: "whole cents (integer), round_half_up per line"

  - name: event_spend_position
    trigger: "procurement create/submit/approve/reject/receive/cancel; meal-plan order/cancel/supersede; manifest create/confirm/cancel; event cancel cascade"
    algorithm: aggregation
    formula: |
      projected_spend_cents =
          sum(order_total_cents of ProcurementOrders with status in {SUBMITTED, APPROVED, RECEIVED})
        + sum(total_cost_cents  of MealPlans         with status in {ORDERED, FULFILLED})
        + sum(cost_cents        of TransportManifests with status in {BOOKED, CONFIRMED, COMPLETED})
      committed_spend_cents =
          sum(order_total_cents of ProcurementOrders with status in {APPROVED, RECEIVED})
        + sum(total_cost_cents  of MealPlans         with status in {ORDERED, FULFILLED})
        + sum(cost_cents        of TransportManifests with status in {CONFIRMED, COMPLETED})
      available_budget_cents = budget_cents - projected_spend_cents
      # Fiscal gate at approve: order's event must satisfy projected_spend_cents <= budget_cents
      # (the SUBMITTED order is already inside projected_spend, so the check is simply
      # projected <= budget at approve time).
    input_set: "All ProcurementOrders, MealPlans, TransportManifests with event_id == this event, filtered by status sets above"
    precision: "whole cents (integer)"
    variants:
      - name: projected
        when: "approval gating, conservative availability reads"
        difference: "Includes SUBMITTED orders and BOOKED manifests (pipeline liabilities); committed excludes them"
      - name: committed
        when: "net_event_cost, close reporting"
        difference: "Only firmed liabilities (APPROVED+/ORDERED+/CONFIRMED+); excludes SUBMITTED orders and BOOKED manifests"

  - name: sponsorship_amount
    trigger: "provisional: live read of Sponsorship while PLEDGED/COMMITTED and on any headcount/hours change; settled: POST /sponsorships/{id}/settle"
    algorithm: forward_looking
    formula: |
      scheduled_hours = (event.event_end_at - event.event_start_at) in hours (e.g. 6.0)
      effective_cap_cents = round_half_up(pledge_cap_cents * 1.10) if event.repeat_booking_bonus else pledge_cap_cents
      PROVISIONAL variant (forward-looking inclusion set):
        base = FLAT              -> rate_cents
             | PER_CHECK_IN      -> rate_cents * event.confirmed_headcount          # CONFIRMED + CHECKED_IN
             | PER_VERIFIED_HOUR -> round_half_up(rate_cents * event.confirmed_headcount * scheduled_hours)
        provisional_amount_cents = min(base, effective_cap_cents)
      SETTLED variant (chronological actuals at settle):
        base = FLAT              -> rate_cents
             | PER_CHECK_IN      -> rate_cents * event.checked_in_headcount          # actual check-ins only
             | PER_VERIFIED_HOUR -> round_half_up(rate_cents * event.total_verified_hours)  # VERIFIED+PUBLISHED impact hours
        settled_amount_cents = min(base, effective_cap_cents)
      # Same registrations, different numbers: 2 confirmed (1 checks in, 1 no-shows) with
      # PER_CHECK_IN rate 2500: provisional 5000, settled 2500.
    input_set: "Registrations/ImpactRecords of the sponsorship's event; inclusion sets differ per variant as above"
    constants:
      REPEAT_CAP_UPLIFT_PCT: 0.10
    precision: "whole cents (integer), round_half_up on hour products"
    variants:
      - name: provisional
        when: "while status PLEDGED or COMMITTED"
        difference: "Forward-looking: counts CONFIRMED + CHECKED_IN headcount and projected hours"
      - name: settled
        when: "at POST /sponsorships/{id}/settle (event COMPLETED/CLOSED)"
        difference: "Chronological actuals: CHECKED_IN headcount / VERIFIED+PUBLISHED hours only"

  - name: volunteer_hours_credit
    trigger: "check-in; impact record verify/reject/resubmit-verify; event complete cascade"
    algorithm: aggregation
    formula: |
      Per registration:
        scheduled_hours_credit = (rsvp_status == CHECKED_IN) ? scheduled_hours : 0
        verified_hours_credit  = sum(ImpactRecord.hours_attended where registration_id == this
                                     and status in {VERIFIED, PUBLISHED})
      Per event:
        total_scheduled_hours = sum(scheduled_hours_credit over all registrations of the event)
        total_verified_hours  = sum(hours_attended over ImpactRecords of the event in {VERIFIED, PUBLISHED})
      # Dual variant: a checked-in volunteer with a 2.5h verified record on a 6.0h event
      # shows scheduled 6.0 vs verified 2.5 for identical underlying data.
    input_set: "Registrations of the event; ImpactRecords filtered to status in {VERIFIED, PUBLISHED}"
    precision: "1 decimal hour values allowed; sums exact"
    variants:
      - name: scheduled
        when: "attendance credit for the full event window"
        difference: "Whole-window credit keyed on CHECKED_IN flag"
      - name: verified
        when: "impact reporting and PER_VERIFIED_HOUR sponsorship settlement"
        difference: "Only ImpactRecord hours that reached VERIFIED/PUBLISHED count"

  - name: meal_plan_total
    trigger: "POST /meal-plans/{mealPlanId}/order"
    algorithm: aggregation
    formula: |
      eligible = Registrations of the event with rsvp_status in {CONFIRMED, CHECKED_IN} and wants_meal == true
      ordered_headcount = count(eligible)                      # snapshot, frozen at order time
      dietary_headcount = count(eligible with dietary_tags intersect {VEGETARIAN, VEGAN, GLUTEN_FREE} non-empty)
      require ordered_headcount >= 1 else ERR_NO_MEAL_HEADCOUNT
      total_cost_cents = (ordered_headcount - dietary_headcount) * per_person_cost_cents
                       + dietary_headcount * (per_person_cost_cents + dietary_surcharge_cents)
      Vendor-day capacity (aggregate interval semantics — calendar-day pooling, not geometric overlap):
        pool = sum(ordered_headcount of MealPlans with same vendor_name,
                   same UTC calendar date of event.event_start_at, status in {ORDERED, FULFILLED})
        require pool + ordered_headcount <= VENDOR_DAILY_CAPACITY else ERR_VENDOR_CAPACITY_EXCEEDED
    input_set: "Registrations of the event (snapshot set above); sibling MealPlans for the vendor-day pool"
    constants:
      VENDOR_DAILY_CAPACITY: 6
    precision: "whole cents (integer)"

  - name: nonprofit_reputation_score
    trigger: "POST /feedback-surveys (after persistence)"
    algorithm: weighted_scoring
    formula: |
      S = FeedbackSurveys whose registration.project.nonprofit_id == partner (registration must be CHECKED_IN — enforced at survey creation)
      weight(s) = 1.0 if s.created_at >= current_clock - RECENCY_WINDOW_DAYS else 0.5
      if |S| == 0: reputation_score = null
      else: reputation_score = round_half_up( sum(rating * weight) / sum(weight), 2 )
      survey_count = |S|
      Auto-transitions (hysteresis band):
        if survey_count >= SUSPEND_MIN_SURVEYS and reputation_score < SUSPEND_RATING_THRESHOLD: partner -> SUSPENDED
        if reputation_score >= REINSTATE_RATING_THRESHOLD: partner -> ACTIVE
    input_set: "All FeedbackSurveys reachable via Registration -> ServiceProject.nonprofit_id"
    constants:
      RECENCY_WINDOW_DAYS: 90
      SUSPEND_RATING_THRESHOLD: 2.50
      REINSTATE_RATING_THRESHOLD: 3.00
      SUSPEND_MIN_SURVEYS: 3
    precision: "2 decimal places, round_half_up"

  - name: event_readiness_posture
    trigger: "project match/lock/demote/cancel; registration confirm/cancel/check-in/waiver demotion; supervision create/withdraw; procurement submit/approve/reject/receive/cancel; meal-plan order/cancel/supersede; manifest create/confirm/cancel"
    algorithm: constraint_propagation
    formula: |
      Let P = ServiceProjects with event_id == this and status in {MATCHED, LOCKED}.
      meal_need    = count(Registrations of event, rsvp in {CONFIRMED, CHECKED_IN}, wants_meal == true)
      transit_need = count(Registrations of event, rsvp in {CONFIRMED, CHECKED_IN}, wants_transport == true)
      transit_supply = sum(Vehicle.seat_capacity over TransportManifests of event with status in {CONFIRMED, COMPLETED})
      posture =
        BLOCKED  if |P| == 0
        READY    if all of:
          (a) count(projects in P with status == LOCKED) >= 1
          (b) for every p in P: p.active_staff_leads >= p.required_staff_leads
              AND p.confirmed_volunteer_count >= p.min_volunteers
          (c) no ProcurementOrder on this event with status in {SUBMITTED, APPROVED}
          (d) for every p in P with status == LOCKED: p.site_prep_complete == true
          (e) meal_need == 0 OR exists MealPlan of event with status in {ORDERED, FULFILLED}
          (f) transit_need == 0 OR transit_supply >= transit_need
        PARTIAL  otherwise
      begin requires posture == READY (ERR_EVENT_NOT_READY otherwise).
    input_set: "Projects, orders, meal plans, manifests, registrations of this event"
    precision: "enum"

  - name: net_event_cost
    trigger: "any spend recompute (event_spend_position) or sponsorship commit/settle/withdraw"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency pinned to an explicit evaluation order:
      # sponsorship credit reduces net cost, but the offset itself is capped by gross spend.
      # Evaluation order (fixed):
      #   1. gross  = committed_spend_cents                          (from event_spend_position)
      #   2. credit = sum over Sponsorships of event:
      #               SETTLED   -> settled_amount_cents
      #               COMMITTED -> provisional_amount_cents
      #               PLEDGED/WITHDRAWN -> 0
      #   3. offset = min(credit, round_half_up(OFFSET_CAP_PCT * gross))
      #   4. net_event_cost_cents = gross - offset
      # sponsorship_credit_cents := credit (step 2 exposed on the event)
    input_set: "Sponsorships of the event in {COMMITTED, SETTLED}; committed_spend_cents"
    constants:
      OFFSET_CAP_PCT: 0.50
    precision: "whole cents (integer), round_half_up on the cap"

  - name: vehicle_window_conflict
    trigger: "POST /transport-manifests"
    algorithm: interval_merge
    formula: |
      # Half-open intervals with a turnaround buffer; adjacency at exactly the buffer is legal.
      For the same vehicle, consider existing manifests with status in {BOOKED, CONFIRMED, COMPLETED}:
        conflict exists iff NOT ( new.depart_at >= existing.return_at + TURNAROUND_BUFFER_MINUTES
                               OR new.return_at + TURNAROUND_BUFFER_MINUTES <= existing.depart_at )
      Reject with ERR_VEHICLE_SCHEDULE_CONFLICT on any conflict.
      # Boundary: new.depart_at == existing.return_at + 30 min exactly -> ALLOWED; 1 minute less -> REJECTED.
    input_set: "TransportManifests with vehicle_id == new.vehicle_id and status in {BOOKED, CONFIRMED, COMPLETED}"
    constants:
      TURNAROUND_BUFFER_MINUTES: 30
    precision: "minute resolution"

  - name: repeat_booking_bonus
    trigger: "POST /service-events/{eventId}/rebook"
    algorithm: threshold
    formula: |
      On rebook, new event's repeat_booking_bonus =
        source.avg_feedback_rating != null
        AND source.avg_feedback_rating >= REPEAT_RATING_THRESHOLD
        AND new.event_start_at <= source.event_start_at + REPEAT_WINDOW_DAYS
      Effect: sponsorship effective_cap_cents uplift of 10% (see sponsorship_amount).
    input_set: "Source event's avg_feedback_rating and event_start_at"
    constants:
      REPEAT_RATING_THRESHOLD: 4.0
      REPEAT_WINDOW_DAYS: 180
    precision: "boolean"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; ownership rules: EmployeeVolunteer acts only on own registrations/surveys (X-User-ID == registration.volunteer_id); NonprofitCoordinator acts only on own nonprofit's projects/impact records (X-User-ID == project.nonprofit_id); StaffLead check-in requires ACTIVE SupervisionAssignment on the registration's project (ERR_NOT_PROJECT_LEAD)"
    error_id: "ERR_FORBIDDEN_ROLE (403) | ERR_NOT_PROJECT_LEAD (403)"
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Segregation of duties: approve/reject require X-User-ID != ProcurementOrder.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: ["POST /procurement-orders/{orderId}/approve", "POST /procurement-orders/{orderId}/reject"]
  - priority: 4
    category: existence
    check: "Path resource ids exist (event, project, registration, order, manifest, meal plan, supervision, sponsorship, impact record, survey, partner, volunteer), validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all nested/id-addressed endpoints
  - priority: 5
    category: existence
    check: "Body-referenced FK ids exist (event_id, project_id, volunteer lead id, vehicle_id, manifest id, registration_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: create/action endpoints with body FKs
  - priority: 6
    category: state
    check: "Entity state preconditions: per-machine from-state (ERR_INVALID_EVENT_TRANSITION, ERR_INVALID_PROJECT_TRANSITION, ERR_INVALID_REGISTRATION_TRANSITION, ERR_INVALID_ORDER_TRANSITION, ERR_INVALID_MANIFEST_TRANSITION, ERR_INVALID_MEAL_PLAN_TRANSITION, ERR_INVALID_SPONSORSHIP_TRANSITION, ERR_INVALID_IMPACT_TRANSITION, ERR_INVALID_SUPERVISION_TRANSITION); event writable-state gate ERR_EVENT_STATE_FORBIDS_WRITE; partner active gate ERR_NONPROFIT_SUSPENDED; OCC expected_event_version == current version (ERR_STALE_EVENT_VERSION)"
    error_id: "various (see condition)"
    http_status: 409
    applies_to: all state-transition and state-gated write endpoints
  - priority: 7
    category: business_safety
    check: "Waiver & safety gates: confirm requires waiver_status in {SIGNED, VERIFIED} (ERR_WAIVER_NOT_SIGNED); check-in requires WAIVER_VERIFIED (ERR_WAIVER_NOT_VERIFIED); minor signing requires GUARDIAN + guardian_name (ERR_GUARDIAN_SIGNATURE_REQUIRED); publish with media requires registration.media_consent (ERR_MEDIA_CONSENT_MISSING)"
    error_id: "ERR_WAIVER_NOT_SIGNED | ERR_WAIVER_NOT_VERIFIED | ERR_GUARDIAN_SIGNATURE_REQUIRED | ERR_MEDIA_CONSENT_MISSING"
    http_status: 409
    applies_to: ["POST /registrations/{registrationId}/confirm", "POST /registrations/{registrationId}/check-in", "POST /registrations/{registrationId}/sign-waiver", "POST /impact-records/{recordId}/publish"]
  - priority: 8
    category: business_safety
    check: "Supervision safety: project lock requires active_staff_leads >= required_staff_leads (ERR_INSUFFICIENT_SUPERVISION); supervision create requires lead is_staff_lead and no ACTIVE registration of the lead on the same project (ERR_LEAD_NOT_QUALIFIED)"
    error_id: "ERR_INSUFFICIENT_SUPERVISION | ERR_LEAD_NOT_QUALIFIED"
    http_status: 409
    applies_to: ["POST /service-projects/{projectId}/lock", "POST /supervision-assignments"]
  - priority: 9
    category: business_temporal
    check: "Deadlines & windows: event create/reschedule start must be >= now + 24h (ERR_EVENT_IN_PAST); meal order requires now <= event_start - 72h (ERR_MEAL_ORDER_DEADLINE_PASSED); manifest depart_at must be > now (ERR_MANIFEST_IN_PAST); return_at > depart_at (ERR_VALIDATION)"
    error_id: "ERR_EVENT_IN_PAST | ERR_MEAL_ORDER_DEADLINE_PASSED | ERR_MANIFEST_IN_PAST | ERR_VALIDATION"
    http_status: 422
    applies_to: ["POST /service-events", "POST /service-events/{eventId}/reschedule", "POST /meal-plans/{mealPlanId}/order", "POST /transport-manifests"]
  - priority: 10
    category: business_temporal
    check: "Vehicle window conflict with 30-minute turnaround buffer (calc vehicle_window_conflict)"
    error_id: ERR_VEHICLE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: ["POST /transport-manifests"]
  - priority: 11
    category: business_constraint
    check: "Capacity & uniqueness: confirm requires project.confirmed_volunteer_count < max_volunteers (ERR_PROJECT_AT_CAPACITY); assign-transport requires manifest.assigned_seats < vehicle.seat_capacity (ERR_MANIFEST_FULL); meal order vendor-day pool <= VENDOR_DAILY_CAPACITY (ERR_VENDOR_CAPACITY_EXCEEDED); one ACTIVE meal plan pipeline per event — creating while ORDERED/FULFILLED plan exists rejected (ERR_ACTIVE_MEAL_PLAN_EXISTS); one non-CANCELLED registration per (event, volunteer) (ERR_DUPLICATE_REGISTRATION); one ACTIVE supervision per (project, lead) (ERR_ACTIVE_SUPERVISION_EXISTS); one survey per registration (ERR_ONE_SURVEY_PER_REGISTRATION); lock headcount floor (ERR_MIN_VOLUNTEERS_NOT_MET); lock site prep (ERR_SITE_PREP_INCOMPLETE); volunteer email uniqueness (ERR_DUPLICATE_EMAIL); min_volunteers <= max_volunteers, hours_attended <= scheduled hours (ERR_VALIDATION)"
    error_id: "ERR_PROJECT_AT_CAPACITY | ERR_MANIFEST_FULL | ERR_VENDOR_CAPACITY_EXCEEDED | ERR_ACTIVE_MEAL_PLAN_EXISTS | ERR_DUPLICATE_REGISTRATION | ERR_ACTIVE_SUPERVISION_EXISTS | ERR_ONE_SURVEY_PER_REGISTRATION | ERR_MIN_VOLUNTEERS_NOT_MET | ERR_SITE_PREP_INCOMPLETE | ERR_DUPLICATE_EMAIL | ERR_VALIDATION"
    http_status: 409
    applies_to: ["POST /registrations", "POST /registrations/{registrationId}/confirm", "POST /registrations/{registrationId}/assign-transport", "POST /service-events/{eventId}/meal-plans", "POST /meal-plans/{mealPlanId}/order", "POST /supervision-assignments", "POST /feedback-surveys", "POST /service-projects/{projectId}/lock", "POST /employee-volunteers", "POST /service-projects", "POST /impact-records"]
  - priority: 12
    category: business_referential
    check: "Cross-references must align: registration.project_id must be MATCHED/LOCKED to registration.event_id (ERR_PROJECT_EVENT_MISMATCH); manifest.event_id must equal registration.event_id on assign (ERR_MANIFEST_EVENT_MISMATCH); impact project_id must equal registration.project_id (ERR_IMPACT_PROJECT_MISMATCH); impact create requires registration rsvp CHECKED_IN (ERR_REGISTRATION_NOT_CHECKED_IN); survey requires registration CHECKED_IN and event COMPLETED/CLOSED (ERR_SURVEY_NOT_ELIGIBLE); rebook requires source COMPLETED/CLOSED (ERR_REBOOK_NOT_ELIGIBLE); close requires sponsorships terminal (ERR_UNRESOLVED_SPONSORSHIPS); begin requires posture READY (ERR_EVENT_NOT_READY)"
    error_id: "ERR_PROJECT_EVENT_MISMATCH | ERR_MANIFEST_EVENT_MISMATCH | ERR_IMPACT_PROJECT_MISMATCH | ERR_REGISTRATION_NOT_CHECKED_IN | ERR_SURVEY_NOT_ELIGIBLE | ERR_REBOOK_NOT_ELIGIBLE | ERR_UNRESOLVED_SPONSORSHIPS | ERR_EVENT_NOT_READY"
    http_status: 422
    applies_to: ["POST /registrations", "POST /registrations/{registrationId}/assign-transport", "POST /impact-records", "POST /feedback-surveys", "POST /service-events/{eventId}/rebook", "POST /service-events/{eventId}/close", "POST /service-events/{eventId}/begin"]
  - priority: 13
    category: business_fiscal
    check: "Fiscal gate: order approval requires event.projected_spend_cents <= budget_cents"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 402
    applies_to: ["POST /procurement-orders/{orderId}/approve"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- NonprofitPartner ---
  - { method: POST, path: "/nonprofit-partners", description: "Register a nonprofit partner", roles: [CommunityEngagementManager], code: 201, input: [name, contact_email], output: NonprofitPartner, side_effects: ["status ACTIVE; reputation null"] }
  - { method: GET, path: "/nonprofit-partners", description: "List nonprofit partners", roles: [Any], code: 200, input: ["limit?", "offset?", "status?"], output: "NonprofitPartner[]", side_effects: [] }
  - { method: GET, path: "/nonprofit-partners/{partnerId}", description: "Get a nonprofit partner", roles: [Any], code: 200, input: [], output: NonprofitPartner, side_effects: [] }

  # --- ServiceProject ---
  - { method: POST, path: "/service-projects", description: "Nonprofit proposes a project", roles: [NonprofitCoordinator], code: 201, input: [nonprofit_id, title, min_volunteers, max_volunteers, "required_skills?"], output: ServiceProject, side_effects: ["status PROPOSED"] }
  - { method: GET, path: "/service-projects", description: "List projects (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "nonprofit_id?", "event_id?", "status?"], output: "ServiceProject[]", side_effects: [] }
  - { method: GET, path: "/service-projects/{projectId}", description: "Get a project", roles: [Any], code: 200, input: [], output: ServiceProject, side_effects: [] }
  - { method: POST, path: "/service-projects/{projectId}/vet", description: "Vet a proposed project", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceProject, side_effects: ["PROPOSED -> VETTED"] }
  - { method: POST, path: "/service-projects/{projectId}/match", description: "Match a vetted project to an event", roles: [CommunityEngagementManager], code: 200, input: [event_id], output: ServiceProject, side_effects: ["VETTED -> MATCHED; event_id set; posture recompute"] }
  - { method: POST, path: "/service-projects/{projectId}/lock", description: "Lock a matched project (supervision + headcount + site prep gates)", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceProject, side_effects: ["MATCHED -> LOCKED; posture recompute"] }
  - { method: POST, path: "/service-projects/{projectId}/cancel", description: "Cancel a project", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceProject, side_effects: ["-> CANCELLED; cascade registrations/supervision; posture recompute"] }

  # --- ServiceEvent ---
  - { method: POST, path: "/service-events", description: "Create an event (start must be >= now + 24h)", roles: [CommunityEngagementManager], code: 201, input: [name, event_start_at, event_end_at, budget_cents, "waiver_document_version?"], output: ServiceEvent, side_effects: ["status PLANNING; posture BLOCKED"] }
  - { method: GET, path: "/service-events", description: "List events (source_event_id filter finds repeat bookings of a source event)", roles: [Any], code: 200, input: ["limit?", "offset?", "status?", "source_event_id?"], output: "ServiceEvent[]", side_effects: [] }
  - { method: GET, path: "/service-events/{eventId}", description: "Get an event (all computed fields)", roles: [Any], code: 200, input: [], output: ServiceEvent, side_effects: [] }
  - { method: POST, path: "/service-events/{eventId}/open-registration", description: "Open registration", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["PLANNING -> REGISTRATION_OPEN; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/lock-registration", description: "Lock registration", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["REGISTRATION_OPEN -> REGISTRATION_LOCKED; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/begin", description: "Begin the event day (requires posture READY)", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["REGISTRATION_LOCKED -> IN_PROGRESS; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/complete", description: "Complete the event; cascades no-shows, project completion, manifest/meal completion", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["IN_PROGRESS -> COMPLETED; full completion cascade; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/close", description: "Close the event (requires sponsorships terminal)", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["COMPLETED -> CLOSED; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/cancel", description: "Cancel the event with full compensating cascade", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["-> CANCELLED; registrations/orders/manifests/meals/sponsorships/projects/supervision cascades; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/reschedule", description: "Reschedule event window (OCC on event version)", roles: [CommunityEngagementManager], code: 200, input: [event_start_at, event_end_at, expected_event_version], output: ServiceEvent, side_effects: ["new start must be >= now + 24h; increments ServiceEvent.version by 1"] }
  - { method: POST, path: "/service-events/{eventId}/bump-waiver-version", description: "Advance waiver_document_version by 1; voids stale signed/verified waivers", roles: [CommunityEngagementManager], code: 200, input: [], output: ServiceEvent, side_effects: ["waiver_document_version += 1; SIGNED/VERIFIED waivers at older version -> WAIVER_VOIDED; CONFIRMED registrations demote to REGISTERED; project demotion cascade; posture recompute; version +1"] }
  - { method: POST, path: "/service-events/{eventId}/rebook", description: "Repeat-book a new event from a COMPLETED/CLOSED source event", roles: [CommunityEngagementManager], code: 201, input: [name, event_start_at, event_end_at, budget_cents], output: ServiceEvent, side_effects: ["new event PLANNING with source_event_id set; repeat_booking_bonus computed (calc repeat_booking_bonus)"] }

  # --- EmployeeVolunteer ---
  - { method: POST, path: "/employee-volunteers", description: "Register an employee volunteer profile", roles: [CommunityEngagementManager], code: 201, input: [full_name, email, department, date_of_birth, "skills?", "dietary_tags?", "is_staff_lead?"], output: EmployeeVolunteer, side_effects: [] }
  - { method: GET, path: "/employee-volunteers", description: "List volunteers", roles: [Any], code: 200, input: ["limit?", "offset?", "is_staff_lead?"], output: "EmployeeVolunteer[]", side_effects: [] }
  - { method: GET, path: "/employee-volunteers/{volunteerId}", description: "Get a volunteer", roles: [Any], code: 200, input: [], output: EmployeeVolunteer, side_effects: [] }

  # --- Registration ---
  - { method: POST, path: "/registrations", description: "Volunteer self-registers for a project at an event", roles: [EmployeeVolunteer], code: 201, input: [event_id, project_id, "wants_transport?", "wants_meal?"], output: Registration, side_effects: ["rsvp REGISTERED; waiver WAIVER_PENDING; event headcounts recompute"] }
  - { method: GET, path: "/registrations", description: "List registrations (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "event_id?", "volunteer_id?", "project_id?", "transport_manifest_id?", "rsvp_status?"], output: "Registration[]", side_effects: [] }
  - { method: GET, path: "/registrations/{registrationId}", description: "Get a registration", roles: [Any], code: 200, input: [], output: Registration, side_effects: [] }
  - { method: POST, path: "/registrations/{registrationId}/confirm", description: "Confirm a registration (waiver + capacity gates)", roles: [CommunityEngagementManager], code: 200, input: [], output: Registration, side_effects: ["REGISTERED -> CONFIRMED; counts recompute; possible project auto-demotion"] }
  - { method: POST, path: "/registrations/{registrationId}/cancel", description: "Cancel a registration (self or manager)", roles: [CommunityEngagementManager, EmployeeVolunteer], code: 200, input: [], output: Registration, side_effects: ["-> CANCELLED; seat freed; counts recompute; possible project auto-demotion"] }
  - { method: POST, path: "/registrations/{registrationId}/check-in", description: "Day-of check-in (manager or supervising StaffLead)", roles: [CommunityEngagementManager, StaffLead], code: 200, input: [], output: Registration, side_effects: ["CONFIRMED -> CHECKED_IN; checked_in_at set; scheduled_hours_credit set"] }
  - { method: POST, path: "/registrations/{registrationId}/sign-waiver", description: "Sign the current event waiver (guardian for minors)", roles: [EmployeeVolunteer], code: 200, input: [signer_name, signer_relation, media_consent, "guardian_name?"], output: Registration, side_effects: ["WAIVER_PENDING/WAIVER_VOIDED -> WAIVER_SIGNED; waiver fields recorded"] }
  - { method: POST, path: "/registrations/{registrationId}/verify-waiver", description: "Staff verifies a signed waiver", roles: [CommunityEngagementManager], code: 200, input: [], output: Registration, side_effects: ["WAIVER_SIGNED -> WAIVER_VERIFIED"] }
  - { method: POST, path: "/registrations/{registrationId}/assign-transport", description: "Assign registration to a transport manifest seat", roles: [LogisticsCoordinator], code: 200, input: [transport_manifest_id], output: Registration, side_effects: ["transport_manifest_id set; manifest.assigned_seats recomputed"] }

  # --- ProcurementOrder ---
  - { method: POST, path: "/procurement-orders", description: "Create a supply/tool order (computes per-line-tax total)", roles: [CommunityEngagementManager], code: 201, input: [event_id, project_id, lines], output: ProcurementOrder, side_effects: ["status DRAFT; order_total_cents computed; created_by_user_id recorded"] }
  - { method: GET, path: "/procurement-orders", description: "List orders (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "event_id?", "project_id?", "status?"], output: "ProcurementOrder[]", side_effects: [] }
  - { method: GET, path: "/procurement-orders/{orderId}", description: "Get an order", roles: [Any], code: 200, input: [], output: ProcurementOrder, side_effects: [] }
  - { method: POST, path: "/procurement-orders/{orderId}/submit", description: "Submit (or resubmit from REJECTED) an order", roles: [CommunityEngagementManager], code: 200, input: [], output: ProcurementOrder, side_effects: ["DRAFT/REJECTED -> SUBMITTED; projected spend recompute"] }
  - { method: POST, path: "/procurement-orders/{orderId}/approve", description: "Approve an order (segregation of duties + budget gate)", roles: [ProcurementOfficer], code: 200, input: [], output: ProcurementOrder, side_effects: ["SUBMITTED -> APPROVED; spend + posture recompute"] }
  - { method: POST, path: "/procurement-orders/{orderId}/reject", description: "Reject an order (segregation of duties)", roles: [ProcurementOfficer], code: 200, input: ["rejection_reason?"], output: ProcurementOrder, side_effects: ["SUBMITTED -> REJECTED; spend recompute"] }
  - { method: POST, path: "/procurement-orders/{orderId}/receive", description: "Mark an approved order received (drives site_prep_complete)", roles: [CommunityEngagementManager], code: 200, input: [], output: ProcurementOrder, side_effects: ["APPROVED -> RECEIVED; site_prep + posture recompute"] }
  - { method: POST, path: "/procurement-orders/{orderId}/cancel", description: "Cancel a non-received order (budget reversal)", roles: [CommunityEngagementManager], code: 200, input: [], output: ProcurementOrder, side_effects: ["DRAFT/SUBMITTED/APPROVED -> CANCELLED; spend + posture recompute"] }

  # --- Vehicle / TransportManifest ---
  - { method: POST, path: "/vehicles", description: "Register a fleet vehicle", roles: [LogisticsCoordinator], code: 201, input: [name, seat_capacity], output: Vehicle, side_effects: [] }
  - { method: GET, path: "/vehicles", description: "List vehicles", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Vehicle[]", side_effects: [] }
  - { method: POST, path: "/transport-manifests", description: "Book a vehicle window for an event (30-min turnaround buffer conflict check)", roles: [LogisticsCoordinator], code: 201, input: [event_id, vehicle_id, depart_at, return_at, cost_cents], output: TransportManifest, side_effects: ["status BOOKED; projected spend recompute; posture recompute"] }
  - { method: GET, path: "/transport-manifests", description: "List manifests (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "event_id?", "vehicle_id?", "status?"], output: "TransportManifest[]", side_effects: [] }
  - { method: GET, path: "/transport-manifests/{manifestId}", description: "Get a manifest", roles: [Any], code: 200, input: [], output: TransportManifest, side_effects: [] }
  - { method: POST, path: "/transport-manifests/{manifestId}/confirm", description: "Confirm a booked manifest", roles: [LogisticsCoordinator], code: 200, input: [], output: TransportManifest, side_effects: ["BOOKED -> CONFIRMED; spend + posture recompute"] }
  - { method: POST, path: "/transport-manifests/{manifestId}/cancel", description: "Cancel a manifest (frees window and seats)", roles: [LogisticsCoordinator], code: 200, input: [], output: TransportManifest, side_effects: ["BOOKED/CONFIRMED -> CANCELLED; registrations unassigned; spend + posture recompute"] }

  # --- MealPlan ---
  - { method: POST, path: "/service-events/{eventId}/meal-plans", description: "Create the event's meal plan (OCC on event version; supersedes an existing DRAFT plan)", roles: [LogisticsCoordinator], code: 201, input: [vendor_name, per_person_cost_cents, "dietary_surcharge_cents?", expected_event_version], output: MealPlan, side_effects: ["existing DRAFT MealPlan of the event -> CANCELLED; increments ServiceEvent.version by 1"] }
  - { method: GET, path: "/meal-plans", description: "List meal plans (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "event_id?", "vendor_name?", "status?"], output: "MealPlan[]", side_effects: [] }
  - { method: GET, path: "/meal-plans/{mealPlanId}", description: "Get a meal plan", roles: [Any], code: 200, input: [], output: MealPlan, side_effects: [] }
  - { method: POST, path: "/meal-plans/{mealPlanId}/order", description: "Place the meal order (72h deadline, headcount snapshot, vendor-day capacity)", roles: [LogisticsCoordinator], code: 200, input: [], output: MealPlan, side_effects: ["DRAFT -> ORDERED; snapshot + total; spend + posture recompute"] }
  - { method: POST, path: "/meal-plans/{mealPlanId}/fulfill", description: "Mark the order fulfilled", roles: [LogisticsCoordinator], code: 200, input: [], output: MealPlan, side_effects: ["ORDERED -> FULFILLED"] }
  - { method: POST, path: "/meal-plans/{mealPlanId}/cancel", description: "Cancel a draft/ordered meal plan", roles: [LogisticsCoordinator], code: 200, input: [], output: MealPlan, side_effects: ["DRAFT/ORDERED -> CANCELLED; spend + posture recompute"] }

  # --- SupervisionAssignment ---
  - { method: POST, path: "/supervision-assignments", description: "Assign a staff lead to a matched/locked project", roles: [CommunityEngagementManager], code: 201, input: [project_id, lead_volunteer_id], output: SupervisionAssignment, side_effects: ["status ACTIVE; project.active_staff_leads += 1; posture recompute"] }
  - { method: GET, path: "/supervision-assignments", description: "List supervision assignments (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "project_id?", "event_id?", "lead_volunteer_id?", "status?"], output: "SupervisionAssignment[]", side_effects: [] }
  - { method: GET, path: "/supervision-assignments/{assignmentId}", description: "Get a supervision assignment", roles: [Any], code: 200, input: [], output: SupervisionAssignment, side_effects: [] }
  - { method: POST, path: "/supervision-assignments/{assignmentId}/withdraw", description: "Withdraw a supervision assignment (manager or the lead)", roles: [CommunityEngagementManager, StaffLead], code: 200, input: [], output: SupervisionAssignment, side_effects: ["ACTIVE -> WITHDRAWN; possible project auto-demotion; posture recompute"] }

  # --- Sponsorship ---
  - { method: POST, path: "/sponsorships", description: "Pledge a sponsorship attached to an event", roles: [FinanceController], code: 201, input: [event_id, sponsor_name, match_type, rate_cents, pledge_cap_cents], output: Sponsorship, side_effects: ["status PLEDGED"] }
  - { method: GET, path: "/sponsorships", description: "List sponsorships (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "event_id?", "status?"], output: "Sponsorship[]", side_effects: [] }
  - { method: GET, path: "/sponsorships/{sponsorshipId}", description: "Get a sponsorship", roles: [Any], code: 200, input: [], output: Sponsorship, side_effects: [] }
  - { method: POST, path: "/sponsorships/{sponsorshipId}/commit", description: "Commit a pledge", roles: [FinanceController], code: 200, input: [], output: Sponsorship, side_effects: ["PLEDGED -> COMMITTED; credit recompute"] }
  - { method: POST, path: "/sponsorships/{sponsorshipId}/settle", description: "Settle a committed sponsorship against actuals (event must be COMPLETED/CLOSED)", roles: [FinanceController], code: 200, input: [], output: Sponsorship, side_effects: ["COMMITTED -> SETTLED; settled_amount_cents computed; credit + net_event_cost recompute"] }
  - { method: POST, path: "/sponsorships/{sponsorshipId}/withdraw", description: "Withdraw a pledge/commitment", roles: [FinanceController], code: 200, input: [], output: Sponsorship, side_effects: ["PLEDGED/COMMITTED -> WITHDRAWN; credit recompute"] }

  # --- ImpactRecord ---
  - { method: POST, path: "/impact-records", description: "Nonprofit submits an impact record for a checked-in registration", roles: [NonprofitCoordinator], code: 201, input: [registration_id, project_id, hours_attended, "photo_count?", "story_text?"], output: ImpactRecord, side_effects: ["status SUBMITTED"] }
  - { method: GET, path: "/impact-records", description: "List impact records (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "registration_id?", "project_id?", "event_id?", "status?"], output: "ImpactRecord[]", side_effects: [] }
  - { method: GET, path: "/impact-records/{recordId}", description: "Get an impact record", roles: [Any], code: 200, input: [], output: ImpactRecord, side_effects: [] }
  - { method: POST, path: "/impact-records/{recordId}/verify", description: "Verify a submitted record", roles: [CommunityEngagementManager], code: 200, input: [], output: ImpactRecord, side_effects: ["SUBMITTED -> VERIFIED; verified-hours recompute"] }
  - { method: POST, path: "/impact-records/{recordId}/publish", description: "Publish a verified record (media consent gate)", roles: [CommunityEngagementManager], code: 200, input: [], output: ImpactRecord, side_effects: ["VERIFIED -> PUBLISHED"] }
  - { method: POST, path: "/impact-records/{recordId}/reject", description: "Reject a record with reason", roles: [CommunityEngagementManager], code: 200, input: ["rejection_reason?"], output: ImpactRecord, side_effects: ["SUBMITTED/VERIFIED -> REJECTED; verified-hours reversal if was VERIFIED"] }
  - { method: POST, path: "/impact-records/{recordId}/resubmit", description: "Nonprofit resubmits a rejected record", roles: [NonprofitCoordinator], code: 200, input: [], output: ImpactRecord, side_effects: ["REJECTED -> SUBMITTED"] }

  # --- FeedbackSurvey ---
  - { method: POST, path: "/feedback-surveys", description: "Volunteer submits post-event feedback (one per registration)", roles: [EmployeeVolunteer], code: 201, input: [registration_id, rating, would_repeat, "comments?"], output: FeedbackSurvey, side_effects: ["event avg_feedback_rating recompute; nonprofit reputation recompute with auto-suspend/reinstate"] }
  - { method: GET, path: "/feedback-surveys", description: "List feedback surveys (filtered)", roles: [Any], code: 200, input: ["limit?", "offset?", "registration_id?"], output: "FeedbackSurvey[]", side_effects: [] }
  - { method: GET, path: "/feedback-surveys/{surveyId}", description: "Get a feedback survey", roles: [Any], code: 200, input: [], output: FeedbackSurvey, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advances logical clock used by all temporal validations"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership check failed (volunteer on own registration/survey; coordinator on own nonprofit's records)" }
  - { id: ERR_NOT_PROJECT_LEAD, http: 403, condition: "StaffLead attempting check-in without an ACTIVE SupervisionAssignment on the registration's project" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approve/reject attempted by the order's created_by_user_id" }
  # --- Not found ---
  - { id: ERR_NONPROFIT_NOT_FOUND, http: 404, condition: "nonprofit id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not exist" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteer id does not exist (incl. X-User-ID of EmployeeVolunteer/StaffLead roles)" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "procurement order id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle id does not exist" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "transport manifest id does not exist" }
  - { id: ERR_MEAL_PLAN_NOT_FOUND, http: 404, condition: "meal plan id does not exist" }
  - { id: ERR_SUPERVISION_NOT_FOUND, http: 404, condition: "supervision assignment id does not exist" }
  - { id: ERR_SPONSORSHIP_NOT_FOUND, http: 404, condition: "sponsorship id does not exist" }
  - { id: ERR_IMPACT_RECORD_NOT_FOUND, http: 404, condition: "impact record id does not exist" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "feedback survey id does not exist" }
  # --- State ---
  - { id: ERR_INVALID_EVENT_TRANSITION, http: 409, condition: "Event action not allowed from current event status" }
  - { id: ERR_INVALID_PROJECT_TRANSITION, http: 409, condition: "Project action not allowed from current project status (incl. registration/confirm referencing non-MATCHED/LOCKED project, supervision on unmatched project)" }
  - { id: ERR_INVALID_REGISTRATION_TRANSITION, http: 409, condition: "Registration rsvp/waiver action not allowed from current dimension state" }
  - { id: ERR_INVALID_ORDER_TRANSITION, http: 409, condition: "Order action not allowed from current order status" }
  - { id: ERR_INVALID_MANIFEST_TRANSITION, http: 409, condition: "Manifest action (incl. assign-transport target) not allowed from current manifest status" }
  - { id: ERR_INVALID_MEAL_PLAN_TRANSITION, http: 409, condition: "Meal plan action not allowed from current meal plan status" }
  - { id: ERR_INVALID_SPONSORSHIP_TRANSITION, http: 409, condition: "Sponsorship action not allowed from current sponsorship status" }
  - { id: ERR_INVALID_IMPACT_TRANSITION, http: 409, condition: "Impact record action not allowed from current record status" }
  - { id: ERR_INVALID_SUPERVISION_TRANSITION, http: 409, condition: "Withdraw on a non-ACTIVE supervision assignment" }
  - { id: ERR_EVENT_STATE_FORBIDS_WRITE, http: 409, condition: "Write requires event in a specific status set (e.g., procurement/registrations only in PLANNING/OPEN/LOCKED; check-in only IN_PROGRESS; settle only COMPLETED/CLOSED)" }
  - { id: ERR_NONPROFIT_SUSPENDED, http: 409, condition: "Project create/vet/match while partner is SUSPENDED" }
  - { id: ERR_EVENT_NOT_READY, http: 409, condition: "begin attempted while readiness_posture != READY" }
  - { id: ERR_UNRESOLVED_SPONSORSHIPS, http: 409, condition: "close attempted with sponsorships still PLEDGED or COMMITTED" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not match current ServiceEvent.version (OCC)" }
  # --- Business safety ---
  - { id: ERR_WAIVER_NOT_SIGNED, http: 409, condition: "confirm requires waiver_status in {WAIVER_SIGNED, WAIVER_VERIFIED}" }
  - { id: ERR_WAIVER_NOT_VERIFIED, http: 409, condition: "check-in requires waiver_status == WAIVER_VERIFIED" }
  - { id: ERR_GUARDIAN_SIGNATURE_REQUIRED, http: 422, condition: "Minor registration signed with signer_relation SELF or missing guardian_name" }
  - { id: ERR_MEDIA_CONSENT_MISSING, http: 409, condition: "publish with photo_count > 0 or non-empty story_text while registration.media_consent is false" }
  - { id: ERR_INSUFFICIENT_SUPERVISION, http: 409, condition: "project lock with active_staff_leads < required_staff_leads" }
  - { id: ERR_LEAD_NOT_QUALIFIED, http: 409, condition: "lead_volunteer lacks is_staff_lead or holds a non-CANCELLED registration on the same project" }
  # --- Temporal ---
  - { id: ERR_EVENT_IN_PAST, http: 422, condition: "event create/reschedule with event_start_at < current clock + 24h, or event_end_at <= event_start_at" }
  - { id: ERR_MEAL_ORDER_DEADLINE_PASSED, http: 409, condition: "meal order attempted after event_start_at - 72h" }
  - { id: ERR_MANIFEST_IN_PAST, http: 422, condition: "manifest depart_at <= current logical clock" }
  - { id: ERR_VEHICLE_SCHEDULE_CONFLICT, http: 409, condition: "vehicle window conflict under 30-minute turnaround buffer semantics" }
  # --- Constraint / capacity ---
  - { id: ERR_PROJECT_AT_CAPACITY, http: 409, condition: "confirm would exceed project.max_volunteers confirmed volunteers" }
  - { id: ERR_MANIFEST_FULL, http: 409, condition: "assign-transport with assigned_seats == vehicle.seat_capacity" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "vendor-day pooled ordered_headcount would exceed VENDOR_DAILY_CAPACITY" }
  - { id: ERR_ACTIVE_MEAL_PLAN_EXISTS, http: 409, condition: "meal plan create while an ORDERED or FULFILLED plan exists for the event" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "non-CANCELLED registration already exists for (event_id, volunteer_id)" }
  - { id: ERR_ACTIVE_SUPERVISION_EXISTS, http: 409, condition: "ACTIVE supervision assignment already exists for (project_id, lead_volunteer_id)" }
  - { id: ERR_ONE_SURVEY_PER_REGISTRATION, http: 409, condition: "second feedback survey for the same registration" }
  - { id: ERR_MIN_VOLUNTEERS_NOT_MET, http: 409, condition: "project lock with confirmed_volunteer_count < min_volunteers" }
  - { id: ERR_SITE_PREP_INCOMPLETE, http: 409, condition: "project lock without site_prep_complete (needs >=1 RECEIVED order and none SUBMITTED/APPROVED)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "employee volunteer email already exists" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field-level validation: missing required field, enum/range violation, min>max, non-positive quantities, wrong signer relation for adult" }
  # --- Referential ---
  - { id: ERR_PROJECT_EVENT_MISMATCH, http: 422, condition: "project_id not matched to the referenced event_id (registration create, procurement create)" }
  - { id: ERR_MANIFEST_EVENT_MISMATCH, http: 422, condition: "assign-transport manifest belongs to a different event than the registration" }
  - { id: ERR_IMPACT_PROJECT_MISMATCH, http: 422, condition: "impact record project_id differs from registration.project_id" }
  - { id: ERR_REGISTRATION_NOT_CHECKED_IN, http: 409, condition: "impact record create requires registration rsvp_status == CHECKED_IN" }
  - { id: ERR_SURVEY_NOT_ELIGIBLE, http: 409, condition: "feedback requires registration CHECKED_IN and event COMPLETED or CLOSED" }
  - { id: ERR_REBOOK_NOT_ELIGIBLE, http: 409, condition: "rebook source event not in {COMPLETED, CLOSED}" }
  # --- Fiscal ---
  - { id: ERR_BUDGET_WOULD_EXCEED, http: 402, condition: "order approval would leave projected_spend_cents > budget_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CommunityEngagementManager
    description: "Corporate community engagement team operator; owns events, projects vetting/matching, registration oversight, waivers, procurement creation/receipt, supervision, impact moderation, repeat booking"
    identity: opaque
    exclusive_operations:
      - "POST /service-events and all /service-events/{id}/* lifecycle actions (open, lock, begin, complete, close, cancel, reschedule, bump-waiver-version, rebook)"
      - "POST /service-projects/{id}/vet|match|lock|cancel"
      - "POST /employee-volunteers"
      - "POST /registrations/{id}/confirm and /verify-waiver"
      - "POST /procurement-orders and submit/receive/cancel"
      - "POST /supervision-assignments"
      - "POST /impact-records/{id}/verify|publish|reject"
    shared_operations:
      - "POST /registrations/{id}/cancel (with EmployeeVolunteer owner)"
      - "POST /registrations/{id}/check-in (with supervising StaffLead)"
      - "POST /supervision-assignments/{id}/withdraw (with the assigned StaffLead)"
      - "All GET endpoints"
  - name: NonprofitCoordinator
    description: "Nonprofit partner operator; X-User-ID equals the NonprofitPartner id"
    identity: "entity_backed:NonprofitPartner"
    exclusive_operations:
      - "POST /service-projects (nonprofit_id must equal X-User-ID)"
      - "POST /impact-records (project's nonprofit_id must equal X-User-ID)"
      - "POST /impact-records/{id}/resubmit"
    shared_operations:
      - "All GET endpoints"
  - name: EmployeeVolunteer
    description: "Corporate employee participant; X-User-ID equals the EmployeeVolunteer id"
    identity: "entity_backed:EmployeeVolunteer"
    exclusive_operations:
      - "POST /registrations (volunteer_id taken from X-User-ID)"
      - "POST /registrations/{id}/sign-waiver (own registrations only)"
      - "POST /feedback-surveys (own registrations only)"
    shared_operations:
      - "POST /registrations/{id}/cancel (own registrations only; shared with CommunityEngagementManager)"
      - "All GET endpoints"
  - name: StaffLead
    description: "Employee flagged is_staff_lead; X-User-ID equals the EmployeeVolunteer id"
    identity: "entity_backed:EmployeeVolunteer"
    exclusive_operations: []
    shared_operations:
      - "POST /registrations/{id}/check-in (requires ACTIVE SupervisionAssignment on the registration's project)"
      - "POST /supervision-assignments/{id}/withdraw (own assignments only)"
      - "All GET endpoints"
  - name: ProcurementOfficer
    description: "Approver for procurement; segregated from order creation"
    identity: opaque
    exclusive_operations:
      - "POST /procurement-orders/{id}/approve"
      - "POST /procurement-orders/{id}/reject"
    shared_operations:
      - "All GET endpoints"
  - name: LogisticsCoordinator
    description: "Owns fleet, transport manifests, meal plans, seat assignment"
    identity: opaque
    exclusive_operations:
      - "POST /vehicles"
      - "POST /transport-manifests and confirm/cancel"
      - "POST /service-events/{id}/meal-plans and order/fulfill/cancel"
      - "POST /registrations/{id}/assign-transport"
    shared_operations:
      - "All GET endpoints"
  - name: FinanceController
    description: "Owns sponsorship lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /sponsorships and commit/settle/withdraw"
    shared_operations:
      - "All GET endpoints"
  - name: PlatformAdmin
    description: "Test-driving operator for the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
