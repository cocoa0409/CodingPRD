# =============================================================================
# Ambulatory Surgery Center (ASC) Scheduling — Seed Tables (Expert tier)
# =============================================================================
# Generated purely from the scenario description + the scaffold-generator skill.
# No sibling task was consulted.
# =============================================================================

scenario: |
  Ambulatory Surgery Center Scheduling (ASC): case booking & surgeon block time,
  OR/anesthesia/recovery resource, pre-op clearance & H&P window, implant/preference
  card & supply, case-cost & device tracking, turnover & utilization, ASC payment
  grouping (CMS ASC list), cancellation/add-on

domain_name: asc-scheduling
api_prefix: /asc

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing            # OR/anesthesia/recovery interval scheduling with adjacency + buffer rules
  secondary_archetype: ledger_reconciliation       # estimated vs actual case cost; CMS ASC payment grouping
  complexity_layers:
    - optimistic_concurrency                       # OCC on SurgeonBlock.version when booking a case into finite block minutes
    - cascading_side_effects                       # block release -> orphan cases; case cancel -> free resources -> recompute day utilization
    - dual_variant_calculation                     # estimated case cost (at booking) vs actual case cost (at completion)
    - rate_threshold_triggers                      # day utilization %, H&P 30-day window, block release auto-threshold

  entity_topology: flat
  # All entities are peer flat collections under /asc (no nested URL paths); every
  # relationship is expressed by a foreign-key field in the body, resolved via
  # filtered-list GET endpoints. SurgicalCase references Patient, Procedure,
  # SurgeonBlock, OR, Anesthesiologist, RecoveryBay as cross-cutting flat foreign keys.

  state_machine_shape: parallel
  # SurgicalCase carries two independent state dimensions:
  #   clearance_status (pre-op clearance lifecycle) × case_status (scheduling/OR lifecycle).
  # SurgeonBlock has a branching-with-revert lifecycle; SurgicalDay has a compound posture.

  relationship_patterns:
    - one_to_many        # Facility -> ORs, RecoveryBays, SurgeonBlocks, SurgicalCases
    - cross_aggregate    # SurgicalCase -> SurgeonBlock, OR, Anesthesiologist, RecoveryBay, Patient, Procedure
    - many_to_many       # CaseImplant junctions a SurgicalCase to a SupplyItem (device tracking)

  role_model: peer_roles
  # Scheduler owns booking/blocks; PreOpNurse owns clearance/H&P; ORManager owns
  # OR/recovery resource + intraop settlement; BillingAnalyst owns cost/payment grouping.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "ASC facility name" }
      - { name: turnover_minutes, type: integer, source: input, default: 25, description: "Mandatory cleaning/turnover buffer enforced after every case in the same OR; non-negative" }
      - { name: hp_validity_days, type: integer, source: input, default: 30, description: "History & Physical (H&P) validity window in days; an H&P dated more than this many days before the case start is stale" }
      - { name: utilization_target_pct, type: number, source: input, default: 75, description: "Prime-time utilization target percentage (0..100) used to flag SurgicalDay under/over utilization" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic facility clock; advanced only via POST /asc/facilities/{facilityId}/clock; all window/staleness checks read this, never wall-clock" }

  - name: OperatingRoom
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: room_label, type: string, source: input, description: "Human label e.g. OR-1" }
      - { name: prime_time_start_min, type: integer, source: input, default: 420, description: "Prime-time window open as minutes-from-midnight local (default 420 = 07:00); used as utilization denominator basis" }
      - { name: prime_time_end_min, type: integer, source: input, default: 960, description: "Prime-time window close as minutes-from-midnight local (default 960 = 16:00); must be > prime_time_start_min" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE -> OFFLINE -> AVAILABLE; OFFLINE rooms reject new case assignment" }

  - name: RecoveryBay
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: bay_label, type: string, source: input, description: "Human label e.g. PACU-3" }
      - { name: phase2_capable, type: boolean, source: input, default: true, description: "True if bay supports Phase II recovery; non-capable bays reject cases whose procedure requires Phase II" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE -> OFFLINE -> AVAILABLE; OFFLINE bays reject new recovery assignment" }

  - name: Anesthesiologist
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Anesthesiologist name" }
      - { name: credential, type: enum, source: input, default: MD, description: "MD | DO | CRNA; CRNA may not solo-cover cases with anesthesia_class == GENERAL" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive anesthesiologists cannot be assigned to new cases" }

  - name: Surgeon
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Surgeon name" }
      - { name: npi, type: string, source: input, description: "10-digit National Provider Identifier; unique within facility" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive surgeons cannot open new blocks or have cases booked" }

  - name: Procedure
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: cpt_code, type: string, source: input, description: "5-character CPT/HCPCS code; unique within facility" }
      - { name: description, type: string, source: input, description: "Procedure description" }
      - { name: scheduled_minutes, type: integer, source: input, description: "Planned wheels-in-to-wheels-out duration in minutes; positive" }
      - { name: requires_phase2, type: boolean, source: input, default: false, description: "True if recovery requires a Phase II-capable RecoveryBay" }
      - { name: anesthesia_class, type: enum, source: input, default: MAC, description: "LOCAL | MAC | REGIONAL | GENERAL" }
      - { name: cms_payment_indicator, type: enum, source: input, description: "CMS ASC list indicator: COVERED_ASC | DEVICE_INTENSIVE | OFFICE_BASED | EXCLUDED; EXCLUDED procedures cannot be booked" }
      - { name: cms_base_rate_cents, type: integer, source: input, description: "CMS ASC base payment rate in cents for this procedure; non-negative integer" }
      - { name: device_offset_pct, type: number, source: input, default: 0, description: "Device offset percentage (0..100) used in DEVICE_INTENSIVE payment grouping; ignored unless cms_payment_indicator == DEVICE_INTENSIVE" }

  - name: SupplyItem
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: sku, type: string, source: input, description: "Supply SKU; unique within facility" }
      - { name: description, type: string, source: input, description: "Supply / device description" }
      - { name: is_device, type: boolean, source: input, default: false, description: "True if this item is a billable implantable device (counts toward device cost)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Acquisition unit cost in cents; non-negative" }
      - { name: on_hand_qty, type: integer, source: input, default: 0, description: "Current available quantity; reservations decrement availability but not on_hand_qty until consumed" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Sum of quantities reserved by RESERVED CaseImplant rows; available = on_hand_qty - reserved_qty" }

  - name: SurgicalDay
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: service_date, type: string, source: input, description: "Calendar date YYYY-MM-DD for which blocks and cases are scheduled; unique within facility" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "Compound posture derived from child SurgicalCase states: OPEN | LOCKED | CLOSED; gates booking and settlement (see §1.3 day_posture)" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of scheduled_minutes of non-cancelled cases on this day" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "Prime-time utilization percentage across the day's ORs (see §1.3 day_utilization)" }

  - name: SurgeonBlock
    parent: SurgicalDay
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: surgical_day_id, type: string, source: system, description: "FK -> SurgicalDay.id" }
      - { name: surgeon_id, type: string, source: input, description: "FK -> Surgeon.id; the surgeon who owns this block" }
      - { name: operating_room_id, type: string, source: input, description: "FK -> OperatingRoom.id; the OR the block occupies" }
      - { name: start_min, type: integer, source: input, description: "Block start as minutes-from-midnight local; inclusive lower bound (half-open interval [start,end))" }
      - { name: end_min, type: integer, source: input, description: "Block end as minutes-from-midnight local; exclusive upper bound; must be > start_min" }
      - { name: allocated_minutes, type: integer, source: computed, description: "= end_min - start_min; the finite minute pool cases consume" }
      - { name: committed_minutes, type: integer, source: computed, default: 0, description: "Sum of scheduled_minutes of non-cancelled SurgicalCases booked into this block" }
      - { name: release_threshold_hours, type: integer, source: input, default: 48, description: "Hours-before-service-date at which an unused block becomes auto-releasable" }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD -> CONFIRMED -> RELEASED; HELD/CONFIRMED accept bookings, RELEASED does not (see §1.2)" }

  - name: SurgicalCase
    parent: SurgicalDay
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: surgical_day_id, type: string, source: system, description: "FK -> SurgicalDay.id" }
      - { name: surgeon_block_id, type: string, source: input, description: "FK -> SurgeonBlock.id; the block whose minutes this case consumes" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: procedure_id, type: string, source: input, description: "FK -> Procedure.id" }
      - { name: operating_room_id, type: string, source: computed, description: "FK -> OperatingRoom.id; inherited from the booked block's operating_room_id" }
      - { name: anesthesiologist_id, type: string, source: input, required: false, description: "FK -> Anesthesiologist.id; assigned at booking or via assign-anesthesia" }
      - { name: recovery_bay_id, type: string, source: input, required: false, description: "FK -> RecoveryBay.id; assigned at booking or via assign-recovery" }
      - { name: start_min, type: integer, source: input, description: "Wheels-in time as minutes-from-midnight local; inclusive lower bound" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "Inherited from procedure.scheduled_minutes at booking; the case's footprint length" }
      - { name: end_min, type: integer, source: computed, description: "= start_min + scheduled_minutes; exclusive upper bound (half-open [start,end))" }
      - { name: is_add_on, type: boolean, source: input, default: false, description: "True if booked after the day was LOCKED (add-on case); add-ons skip block-minute capacity check but still pay an add-on cost surcharge" }
      - { name: actual_minutes, type: integer, source: input, required: false, description: "Actual wheels-in-to-wheels-out minutes recorded at completion; positive" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Estimated case cost computed at booking (see §1.3 estimated_case_cost)" }
      - { name: actual_cost_cents, type: integer, source: computed, required: false, description: "Actual case cost computed at completion (see §1.3 actual_case_cost); null until completed" }
      - { name: cms_payment_cents, type: integer, source: computed, required: false, description: "ASC payment-group amount (see §1.3 asc_payment_grouping); null until completed" }
      - { name: clearance_status, type: enum, source: system, default: PENDING_CLEARANCE, description: "Independent dimension: PENDING_CLEARANCE -> CLEARED, with PENDING_CLEARANCE <-> ON_HOLD revert loop; gates IN_OR transition (see §1.2)" }
      - { name: hp_signed_at, type: datetime, source: input, required: false, description: "Timestamp the History & Physical was signed; H&P is fresh iff (case service_date 00:00Z minus hp_signed_at) <= Facility.hp_validity_days" }
      - { name: case_status, type: enum, source: system, default: SCHEDULED, description: "Independent dimension: SCHEDULED -> IN_OR -> IN_RECOVERY -> COMPLETED, with SCHEDULED -> CANCELLED revert; gates settlement (see §1.2)" }

  - name: Patient
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique within facility" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }

  - name: CaseImplant
    parent: SurgicalCase
    common_fields: true
    fields:
      - { name: surgical_case_id, type: string, source: system, description: "FK -> SurgicalCase.id" }
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id; the device/supply attached to this case" }
      - { name: planned_qty, type: integer, source: input, description: "Quantity planned/reserved at attach time; positive integer" }
      - { name: consumed_qty, type: integer, source: input, required: false, description: "Quantity actually consumed, recorded at case completion; 0..planned_qty unless over-consume allowed" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED -> CONSUMED, with RESERVED -> RELEASED revert; RESERVED holds SupplyItem.reserved_qty (see §1.2)" }

  - name: ClearanceCheck
    parent: SurgicalCase
    common_fields: false   # append-only event: only id + created_at
    fields:
      - { name: surgical_case_id, type: string, source: system, description: "FK -> SurgicalCase.id" }
      - { name: check_type, type: enum, source: input, description: "HP_REVIEW | LABS | ANESTHESIA_ASSESSMENT | CARDIAC_CONSULT" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL | DEFER; a FAIL drives the case clearance PENDING_CLEARANCE -> ON_HOLD; a DEFER leaves clearance PENDING_CLEARANCE but blocks clearing until a later PASS of the same check_type supersedes it (see §1.2)" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the PreOpNurse who recorded the check" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # SurgeonBlock — branching-with-revert: HELD -> CONFIRMED -> RELEASED,
  # plus HELD -> RELEASED directly. RELEASE cascades to orphan its cases.
  # ---------------------------------------------------------------------------
  - entity: SurgeonBlock
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /asc/surgeon-blocks/{blockId}/confirm"
        actor: Scheduler
        preconditions:
          - "Block must be HELD (ERR_BLOCK_NOT_HELD)"
          - "Owning Surgeon.active == true (ERR_SURGEON_INACTIVE)"
          - "Owning SurgicalDay.posture != CLOSED (ERR_DAY_CLOSED)"
        side_effects:
          - "status -> CONFIRMED"
          - "increments SurgeonBlock.version by 1"

      - from: HELD
        to: RELEASED
        trigger: "POST /asc/surgeon-blocks/{blockId}/release"
        actor: Scheduler
        preconditions:
          - "Block must be HELD or CONFIRMED (ERR_BLOCK_NOT_RELEASABLE)"
          - "Owning SurgicalDay.posture != CLOSED (ERR_DAY_CLOSED)"
        side_effects:
          - "status -> RELEASED"
          - "CASCADE depth-1: every non-cancelled SurgicalCase booked into this block with case_status == SCHEDULED is force-cancelled (case_status -> CANCELLED), in ascending (start_min, created_at) order"
          - "CASCADE depth-2: each such case-cancel releases its RESERVED CaseImplant rows (CaseImplant.status -> RELEASED) which decrements each SupplyItem.reserved_qty by planned_qty"
          - "CASCADE depth-2: each such case-cancel sets the block's committed_minutes down by that case's scheduled_minutes and recomputes the owning SurgicalDay.booked_minutes and utilization_pct"
          - "increments SurgeonBlock.version by 1"
        note: "A case already IN_OR / IN_RECOVERY / COMPLETED is NOT force-cancelled; release is rejected if any such case exists (ERR_BLOCK_HAS_ACTIVE_CASES)"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /asc/surgeon-blocks/{blockId}/release"
        actor: Scheduler
        preconditions:
          - "Block must be HELD or CONFIRMED (ERR_BLOCK_NOT_RELEASABLE)"
          - "No SurgicalCase in this block with case_status IN_OR, IN_RECOVERY, or COMPLETED (ERR_BLOCK_HAS_ACTIVE_CASES)"
          - "Owning SurgicalDay.posture != CLOSED (ERR_DAY_CLOSED)"
        side_effects:
          - "status -> RELEASED"
          - "CASCADE depth-1: every SCHEDULED SurgicalCase in this block force-cancelled in ascending (start_min, created_at) order"
          - "CASCADE depth-2: released implants decrement SupplyItem.reserved_qty; day booked_minutes and utilization_pct recomputed"
          - "increments SurgeonBlock.version by 1"

  # ---------------------------------------------------------------------------
  # SurgicalCase dimension A — case_status (scheduling/OR lifecycle).
  # SCHEDULED -> IN_OR -> IN_RECOVERY -> COMPLETED, plus SCHEDULED -> CANCELLED.
  # ---------------------------------------------------------------------------
  - entity: SurgicalCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_OR
        trigger: "POST /asc/surgical-cases/{caseId}/start"
        actor: ORManager
        preconditions:
          - "Case case_status must be SCHEDULED (ERR_CASE_NOT_SCHEDULED)"
          - "Case clearance_status must be CLEARED (ERR_CASE_NOT_CLEARED) — cross-dimension guard"
          - "Assigned OperatingRoom.status == AVAILABLE (ERR_OR_OFFLINE)"
          - "anesthesiologist_id is set and that Anesthesiologist.active == true (ERR_ANESTHESIA_NOT_ASSIGNED)"
          - "Owning SurgicalDay.posture == LOCKED (ERR_DAY_NOT_LOCKED) — the day must be locked before any case enters the OR"
        side_effects:
          - "case_status -> IN_OR"

      - from: IN_OR
        to: IN_RECOVERY
        trigger: "POST /asc/surgical-cases/{caseId}/to-recovery"
        actor: ORManager
        preconditions:
          - "Case case_status must be IN_OR (ERR_CASE_NOT_IN_OR)"
          - "recovery_bay_id is set and that RecoveryBay.status == AVAILABLE (ERR_RECOVERY_NOT_ASSIGNED)"
        side_effects:
          - "case_status -> IN_RECOVERY"

      - from: IN_RECOVERY
        to: COMPLETED
        trigger: "POST /asc/surgical-cases/{caseId}/complete"
        actor: ORManager
        preconditions:
          - "Case case_status must be IN_RECOVERY (ERR_CASE_NOT_IN_RECOVERY)"
          - "actual_minutes provided and positive (ERR_ACTUAL_MINUTES_REQUIRED)"
          - "Every CaseImplant on this case has consumed_qty recorded (ERR_IMPLANT_NOT_SETTLED)"
        side_effects:
          - "case_status -> COMPLETED"
          - "CASCADE depth-1: each RESERVED CaseImplant -> CONSUMED, decrementing SupplyItem.reserved_qty by planned_qty AND SupplyItem.on_hand_qty by consumed_qty"
          - "compute actual_cost_cents (§1.3 actual_case_cost) and cms_payment_cents (§1.3 asc_payment_grouping)"
          - "recompute owning SurgicalDay.utilization_pct using actual_minutes for completed cases"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /asc/surgical-cases/{caseId}/cancel"
        actor: Scheduler
        preconditions:
          - "Case case_status must be SCHEDULED (ERR_CASE_NOT_CANCELLABLE)"
        side_effects:
          - "case_status -> CANCELLED"
          - "COMPENSATION: SurgeonBlock.committed_minutes -= scheduled_minutes (invariant block_minutes_conservation, §1.9)"
          - "COMPENSATION: every RESERVED CaseImplant -> RELEASED, decrementing SupplyItem.reserved_qty by planned_qty (invariant supply_reservation_conservation)"
          - "recompute owning SurgicalDay.booked_minutes and utilization_pct"

  # ---------------------------------------------------------------------------
  # SurgicalCase dimension B — clearance_status (pre-op clearance lifecycle).
  # PENDING_CLEARANCE -> CLEARED, with PENDING_CLEARANCE <-> ON_HOLD revert loop.
  # Evolves INDEPENDENTLY of case_status (parallel dimensions on one entity).
  # ---------------------------------------------------------------------------
  - entity: SurgicalCase
    initial_state: PENDING_CLEARANCE
    terminal_states: []
    transitions:
      - from: PENDING_CLEARANCE
        to: ON_HOLD
        trigger: "POST /asc/surgical-cases/{caseId}/clearance-checks (outcome == FAIL)"
        actor: PreOpNurse
        preconditions:
          - "Case clearance_status must be PENDING_CLEARANCE (ERR_CLEARANCE_NOT_PENDING)"
        side_effects:
          - "clearance_status -> ON_HOLD"
          - "append ClearanceCheck row with outcome == FAIL"

      - from: ON_HOLD
        to: PENDING_CLEARANCE
        trigger: "POST /asc/surgical-cases/{caseId}/clearance-reset"
        actor: PreOpNurse
        preconditions:
          - "Case clearance_status must be ON_HOLD (ERR_CLEARANCE_NOT_ON_HOLD)"
        side_effects:
          - "clearance_status -> PENDING_CLEARANCE"
        note: "Revert loop: a failed check can be re-worked and re-submitted; this is the cyclic edge"

      - from: PENDING_CLEARANCE
        to: CLEARED
        trigger: "POST /asc/surgical-cases/{caseId}/clear"
        actor: PreOpNurse
        preconditions:
          - "Case clearance_status must be PENDING_CLEARANCE (ERR_CLEARANCE_NOT_PENDING)"
          - "hp_signed_at is set and H&P is fresh: (service_date 00:00Z - hp_signed_at) days <= Facility.hp_validity_days (ERR_HP_WINDOW_EXPIRED)"
          - "At least one ClearanceCheck of check_type HP_REVIEW with outcome PASS exists (ERR_HP_REVIEW_MISSING)"
          - "No ClearanceCheck on this case has outcome DEFER recorded AFTER the latest clearance-reset (or after creation if no reset) — a DEFER leaves clearance PENDING_CLEARANCE but blocks clearing until superseded by a PASS of the same check_type (ERR_OPEN_FAILED_CHECK)"
        side_effects:
          - "clearance_status -> CLEARED"

  # ---------------------------------------------------------------------------
  # CaseImplant — RESERVED -> CONSUMED, with RESERVED -> RELEASED revert.
  # ---------------------------------------------------------------------------
  - entity: CaseImplant
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /asc/surgical-cases/{caseId}/implants/{implantId}/release  (or cascaded from case cancel / block release)"
        actor: ORManager
        preconditions:
          - "Implant must be RESERVED (ERR_IMPLANT_NOT_RESERVED) — note: a COMPLETED case has all implants CONSUMED, so this precondition already blocks release on a completed case"
        side_effects:
          - "status -> RELEASED"
          - "SupplyItem.reserved_qty -= planned_qty (invariant supply_reservation_conservation)"

      - from: RESERVED
        to: CONSUMED
        trigger: "system (cascaded from case complete)"
        actor: system
        preconditions:
          - "Implant must be RESERVED (ERR_IMPLANT_NOT_RESERVED)"
          - "consumed_qty recorded and 0 <= consumed_qty <= planned_qty (ERR_CONSUMED_QTY_INVALID)"
        side_effects:
          - "status -> CONSUMED"
          - "SupplyItem.reserved_qty -= planned_qty; SupplyItem.on_hand_qty -= consumed_qty"

  # ---------------------------------------------------------------------------
  # SurgicalDay — compound posture derived from / driving child cases.
  # OPEN -> LOCKED -> CLOSED, with LOCKED -> OPEN revert (re-open).
  # ---------------------------------------------------------------------------
  - entity: SurgicalDay
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /asc/surgical-days/{dayId}/lock"
        actor: Scheduler
        preconditions:
          - "Day posture must be OPEN (ERR_DAY_NOT_OPEN)"
          - "At least one non-cancelled SurgicalCase exists on this day (ERR_DAY_EMPTY)"
        side_effects:
          - "posture -> LOCKED"
        note: "Once LOCKED, normal bookings are rejected (ERR_DAY_LOCKED); only is_add_on cases may be booked, and cases may now be started into the OR"

      - from: LOCKED
        to: OPEN
        trigger: "POST /asc/surgical-days/{dayId}/reopen"
        actor: Scheduler
        preconditions:
          - "Day posture must be LOCKED (ERR_DAY_NOT_LOCKED)"
          - "No SurgicalCase on this day with case_status IN_OR, IN_RECOVERY, or COMPLETED (ERR_DAY_HAS_ACTIVE_CASES)"
        side_effects:
          - "posture -> OPEN"

      - from: LOCKED
        to: CLOSED
        trigger: "POST /asc/surgical-days/{dayId}/close"
        actor: ORManager
        preconditions:
          - "Day posture must be LOCKED (ERR_DAY_NOT_LOCKED)"
          - "Every non-cancelled SurgicalCase on this day has case_status COMPLETED (ERR_DAY_HAS_UNFINISHED_CASES)"
        side_effects:
          - "posture -> CLOSED"
          - "freeze utilization_pct (no further recomputation)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
# CREATE-with-supersede: booking a case consumes a finite minute pool on the
# parent SurgeonBlock. Two strictly sequential bookings that each observed the
# same pre-booking block version: the first legitimately commits minutes and
# advances block.version; the second still carries the stale version and is
# rejected by OCC. A second booking that simply observes committed_minutes
# changed would NOT be a race (it is a capacity precondition) — but the OCC
# guard is what makes the stale-view rejection deterministic and is the only
# sanctioned write-write resolver here.
concurrency_rules:
  - rule_id: case-book-stale-block
    parent_entity: SurgeonBlock
    write_endpoint: "POST /asc/surgeon-blocks/{blockId}/cases"
    occ_field: "expected_block_version"
    description: |
      Booking a SurgicalCase into a SurgeonBlock whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just committed minutes into the same block
      (advancing its version), so the current writer's view of the block's
      remaining minute pool is stale.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT pair, instance 1 (SurgicalCase cost domain) -------------
  - name: estimated_case_cost
    trigger: "case booking (POST /surgeon-blocks/{bid}/cases) and re-run on any CaseImplant attach/release while case_status == SCHEDULED"
    algorithm: forward_looking
    formula: |
      # Forward-looking: uses PLANNED inputs (procedure.scheduled_minutes, implant planned_qty).
      labor_cents       = procedure.scheduled_minutes * OR_MINUTE_RATE_CENTS
      anesthesia_cents  = ANESTHESIA_BASE_CENTS[procedure.anesthesia_class]
      # Implant cost: sum over RESERVED CaseImplant rows on this case, rounding PER-LINE then summing.
      implant_cents     = sum_over_RESERVED_implants( round_half_up( supply.unit_cost_cents * implant.planned_qty ) )
      add_on_surcharge  = ADD_ON_SURCHARGE_CENTS if case.is_add_on else 0
      estimated_cost_cents = labor_cents + anesthesia_cents + implant_cents + add_on_surcharge
    input_set: "Only CaseImplant rows with status == RESERVED are summed; RELEASED/CONSUMED excluded. Uses planned_qty, never consumed_qty."
    constants:
      OR_MINUTE_RATE_CENTS: 1200          # $12.00 / scheduled minute
      ANESTHESIA_BASE_CENTS: { LOCAL: 0, MAC: 18000, REGIONAL: 32000, GENERAL: 55000 }
      ADD_ON_SURCHARGE_CENTS: 40000       # $400 flat add-on surcharge
    precision: "integer cents; round PER LINE ITEM then sum (round_half_up), NOT sum-then-round"
    variants:
      - name: estimate
        when: "case_status == SCHEDULED (before the case is started)"
        difference: "Uses procedure.scheduled_minutes and implant.planned_qty; never reads actual_minutes/consumed_qty."

  - name: actual_case_cost
    trigger: "case completion (POST /surgical-cases/{cid}/complete)"
    algorithm: chronological
    formula: |
      # Actual: uses RECORDED inputs (actual_minutes, implant consumed_qty), settled at completion.
      labor_cents       = case.actual_minutes * OR_MINUTE_RATE_CENTS
      anesthesia_cents  = ANESTHESIA_BASE_CENTS[procedure.anesthesia_class]
      # Implant cost: sum over CONSUMED CaseImplant rows, rounding PER-LINE then summing.
      implant_cents     = sum_over_CONSUMED_implants( round_half_up( supply.unit_cost_cents * implant.consumed_qty ) )
      add_on_surcharge  = ADD_ON_SURCHARGE_CENTS if case.is_add_on else 0
      # Over-run penalty: if actual_minutes exceeds the booked block's allocated_minutes-attributable
      # share, a tiered penalty applies (combinatorial mode (a), 3 inputs + tiered selection).
      overrun_min       = max(0, case.actual_minutes - procedure.scheduled_minutes)
      overrun_penalty   = overrun_tiered_penalty(overrun_min)     # see overrun_tiered_penalty below
      actual_cost_cents = labor_cents + anesthesia_cents + implant_cents + add_on_surcharge + overrun_penalty
    input_set: "Only CaseImplant rows with status == CONSUMED are summed; RESERVED/RELEASED excluded. Uses consumed_qty, never planned_qty."
    constants:
      OR_MINUTE_RATE_CENTS: 1200
      ANESTHESIA_BASE_CENTS: { LOCAL: 0, MAC: 18000, REGIONAL: 32000, GENERAL: 55000 }
      ADD_ON_SURCHARGE_CENTS: 40000
    precision: "integer cents; round PER LINE ITEM then sum (round_half_up)"
    variants:
      - name: actual
        when: "case_status transitions to COMPLETED"
        difference: "Uses actual_minutes and consumed_qty; adds overrun_penalty which the estimate never carries. Same data with different variant yields a different number whenever actual_minutes != scheduled_minutes or consumed_qty != planned_qty."

  # --- DUAL-VARIANT pair, instance 2 (Anesthesiologist / staffing domain) ---
  - name: anesthesia_coverage_load_estimate
    trigger: "GET /asc/anesthesiologists/{anesthId}/coverage-load (forward-looking projection)"
    algorithm: forward_looking
    formula: |
      # Projected coverage minutes for an anesthesiologist across a service date,
      # using PLANNED footprints (scheduled_minutes) of every non-cancelled case
      # assigned to this anesthesiologist on that date.
      projected_minutes = sum( case.scheduled_minutes
                               for case assigned to this anesthesiologist on service_date
                               where case_status != CANCELLED )
      coverage_load_pct = round_half_up( 100.0 * projected_minutes / SOLO_COVERAGE_CAP_MIN, 1 )
    input_set: "Cases on the given service_date with case_status in {SCHEDULED, IN_OR, IN_RECOVERY, COMPLETED}; CANCELLED excluded. Planned scheduled_minutes."
    constants:
      SOLO_COVERAGE_CAP_MIN: 480          # 8 prime-time hours of solo coverage
    precision: "one decimal place, round_half_up"
    variants:
      - name: projected
        when: "any case state; uses scheduled_minutes"
        difference: "Forward-looking sum of planned footprints; different entity domain (Anesthesiologist staffing, not SurgicalCase cost)."

  - name: anesthesia_coverage_load_actual
    trigger: "GET /asc/anesthesiologists/{anesthId}/coverage-load?basis=ACTUAL"
    algorithm: chronological
    formula: |
      # Realized coverage minutes using ACTUAL recorded minutes for COMPLETED cases
      # processed in chronological (start_min ASC, created_at ASC) order; cases not
      # yet COMPLETED contribute their scheduled_minutes as a still-pending placeholder.
      realized_minutes = sum( case.actual_minutes if case_status == COMPLETED
                              else case.scheduled_minutes
                              for case assigned to this anesthesiologist on service_date
                              where case_status != CANCELLED,
                              ordered by (start_min ASC, created_at ASC) )
      coverage_load_pct = round_half_up( 100.0 * realized_minutes / SOLO_COVERAGE_CAP_MIN, 1 )
    input_set: "Same case set as the estimate; COMPLETED cases swap scheduled_minutes for actual_minutes."
    constants:
      SOLO_COVERAGE_CAP_MIN: 480
    precision: "one decimal place, round_half_up"
    variants:
      - name: actual
        when: "basis=ACTUAL query param"
        difference: "Realized load: COMPLETED cases contribute actual_minutes, diverging from the projected variant whenever any completed case ran over/under its scheduled_minutes."

  # --- COMBINATORIAL mode (a): >=3 inputs, tiered selection + nested max -----
  - name: overrun_tiered_penalty
    trigger: "embedded in actual_case_cost at case completion"
    algorithm: tiered_pricing
    formula: |
      # 3 inputs: overrun_min, the two tier breakpoints, two marginal rates.
      # Marginal tiered rate (NOT average): each minute band charged at its own rate.
      # band 1: minutes 1..TIER1_MIN charged at TIER1_RATE_CENTS
      # band 2: minutes TIER1_MIN+1..TIER2_MIN charged at TIER2_RATE_CENTS
      # band 3: minutes above TIER2_MIN charged at TIER3_RATE_CENTS
      b1 = min(overrun_min, TIER1_MIN)
      b2 = min( max(overrun_min - TIER1_MIN, 0), TIER2_MIN - TIER1_MIN )
      b3 = max(overrun_min - TIER2_MIN, 0)
      overrun_penalty_cents = b1*TIER1_RATE_CENTS + b2*TIER2_RATE_CENTS + b3*TIER3_RATE_CENTS
    input_set: "overrun_min = max(0, actual_minutes - procedure.scheduled_minutes)"
    constants:
      TIER1_MIN: 15            # first 15 overrun minutes
      TIER2_MIN: 45            # cumulative breakpoint at 45 overrun minutes
      TIER1_RATE_CENTS: 800    # $8.00/min for first band
      TIER2_RATE_CENTS: 1500   # $15.00/min for second band
      TIER3_RATE_CENTS: 3000   # $30.00/min beyond 45
    precision: "integer cents; marginal banding (boundary at exactly 15 and exactly 45 — minute 15 is band 1, minute 16 starts band 2)"

  # --- COMBINATORIAL mode (c): pinned evaluation order over circular-looking dep ---
  - name: asc_payment_grouping
    trigger: "case completion (POST /surgical-cases/{cid}/complete)"
    algorithm: aggregation
    formula: |
      # ASC payment grouping over the CMS ASC list. The device offset depends on the
      # device portion of cost, but the multiple-procedure reduction depends on the
      # payment which depends on the device offset — evaluation order is PINNED to
      # break the circular look:
      #   STEP 1: base = procedure.cms_base_rate_cents
      #   STEP 2: device_offset (ONLY when cms_payment_indicator == DEVICE_INTENSIVE):
      #             device_consumed_cents = sum_over_CONSUMED_implants_where_supply.is_device(
      #                                        round_half_up(supply.unit_cost_cents * consumed_qty) )
      #             offset = round_half_up( base * (procedure.device_offset_pct / 100.0) )
      #             # device offset is the LESSER of the percentage offset and the actual device cost
      #             device_offset = min(offset, device_consumed_cents)
      #             grouped = base + device_offset
      #           else: grouped = base
      #   STEP 3: multiple-procedure reduction — if this case is the 2nd or later
      #           non-cancelled COMPLETED case for the SAME patient on the SAME
      #           service_date (ordered by start_min ASC, created_at ASC), apply
      #           MULTI_PROC_REDUCTION_PCT to `grouped` (computed AFTER device offset):
      #             cms_payment_cents = round_half_up( grouped * (1 - MULTI_PROC_REDUCTION_PCT/100.0) )
      #           else: cms_payment_cents = grouped
      #   STEP 4: OFFICE_BASED indicator pays OFFICE_BASED_FLOOR_CENTS floor if grouped is below it.
    input_set: "Single completing case + its CONSUMED device implants + sibling COMPLETED cases for same patient/day to determine rank."
    constants:
      MULTI_PROC_REDUCTION_PCT: 50        # 50% reduction on 2nd+ procedure same patient/day
      OFFICE_BASED_FLOOR_CENTS: 9000
    precision: "integer cents, round_half_up; evaluation order STEP1->STEP2->STEP3->STEP4 is mandatory and non-commutative"

  # --- COMPOUND posture derivation -------------------------------------------
  - name: day_posture
    trigger: "any SurgicalDay lock/reopen/close transition (posture is the persisted result of those transitions, not auto-derived per request)"
    algorithm: projection
    formula: |
      # posture is set ONLY by explicit lock/reopen/close transitions (see §1.2);
      # this entry pins the read-side invariant the transitions must preserve:
      #   OPEN   : no case may be IN_OR/IN_RECOVERY/COMPLETED; bookings (non-add-on) allowed
      #   LOCKED : cases may be started; only is_add_on bookings allowed
      #   CLOSED : terminal; utilization_pct frozen; no transitions, no bookings
    input_set: "Child SurgicalCase case_status values on the day."

  # --- UTILIZATION threshold (rate/threshold trigger) ------------------------
  - name: day_utilization
    trigger: "case book / cancel / complete / block release; recomputed unless day posture == CLOSED (frozen)"
    algorithm: threshold
    formula: |
      # Denominator: total prime-time minutes across all AVAILABLE+OFFLINE ORs in the facility
      # that hosted >=1 non-cancelled case on this day, per OR (prime_time_end_min - prime_time_start_min).
      prime_capacity_min = sum_over_distinct_ORs_used_on_day( OR.prime_time_end_min - OR.prime_time_start_min )
      # Numerator: for COMPLETED cases use actual_minutes, otherwise scheduled_minutes,
      # counting ONLY the portion of each case footprint that falls inside its OR prime-time window.
      used_min = sum_over_noncancelled_cases(
                   overlap_minutes( [case.start_min, case.end_min),
                                    [OR.prime_time_start_min, OR.prime_time_end_min) )
                   using actual_minutes for COMPLETED, scheduled_minutes otherwise )
      utilization_pct = 0 if prime_capacity_min == 0
                        else round_half_up( 100.0 * used_min / prime_capacity_min, 1 )
      # Threshold flags (boundary >=): is_under = utilization_pct < utilization_target_pct;
      #                                 is_over  = utilization_pct >= 100.0
    input_set: "Non-cancelled cases on the day; prime-time clipped via half-open overlap; CLOSED days frozen."
    constants: {}
    precision: "one decimal place, round_half_up; overlap uses half-open [start,end) so a case ending exactly at prime_time_end_min contributes 0 for the boundary minute"

  - name: supply_availability
    trigger: "CaseImplant attach/release/consume; SupplyItem read"
    algorithm: aggregation
    formula: |
      reserved_qty = sum( implant.planned_qty for CaseImplant where supply_item_id == this and status == RESERVED )
      available    = on_hand_qty - reserved_qty
    input_set: "Only RESERVED CaseImplant rows contribute to reserved_qty; RELEASED/CONSUMED excluded."
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Every FK id in the request body references an existing resource within the same facility"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "create/assign endpoints with FK bodies"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; positive minutes; npi 10 digits; cpt 5 chars"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 6
    category: business_constraint
    check: "Uniqueness within facility: Surgeon.npi, Procedure.cpt_code, Patient.mrn, SupplyItem.sku, SurgicalDay.service_date"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST surgeons / procedures / patients / supply-items / surgical-days"

  - priority: 7
    category: concurrency
    check: "expected_block_version (when the endpoint requires it) equals SurgeonBlock.version BEFORE business logic"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /surgeon-blocks/{bid}/cases"
    note: "OCC check runs AFTER existence (3,4) but BEFORE all state/business checks below"

  - priority: 8
    category: state
    check: "Target resource is in the correct state for the transition (state-machine from: clause)"
    error_id: "ERR_*_NOT_<STATE> / ERR_BLOCK_NOT_HELD / ERR_CASE_NOT_SCHEDULED / etc."
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 9
    category: business_referential
    check: "Booking: the chosen Procedure.cms_payment_indicator must NOT be EXCLUDED"
    error_id: ERR_PROCEDURE_EXCLUDED
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases"

  - priority: 10
    category: business_referential
    check: "Booking: SurgeonBlock.surgeon's Surgeon.active == true AND the case's procedure facility matches the block facility"
    error_id: ERR_SURGEON_INACTIVE
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases"

  - priority: 11
    category: business_temporal
    check: "Booking: non-add-on case start_min/end_min must lie within the block's [start_min,end_min) window"
    error_id: ERR_CASE_OUTSIDE_BLOCK_WINDOW
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases (is_add_on == false)"

  - priority: 12
    category: business_temporal
    check: "Booking: case footprint [start_min,end_min) plus Facility.turnover_minutes must NOT overlap any other non-cancelled case in the SAME OperatingRoom on the SAME day. Turnover is appended AFTER each case; two cases are compatible iff next.start_min >= prev.end_min + turnover_minutes. Adjacency exactly at prev.end_min + turnover_minutes is allowed (half-open + buffer)."
    error_id: ERR_OR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases ; PATCH /surgical-cases/{cid}/reschedule"

  - priority: 13
    category: business_temporal
    check: "Booking: case footprint [start_min,end_min) must NOT overlap any other non-cancelled case assigned to the SAME Anesthesiologist on the SAME day. NO turnover buffer applies to anesthesia (back-to-back allowed): two cases conflict iff a.start_min < b.end_min AND b.start_min < a.end_min."
    error_id: ERR_ANESTHESIA_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases ; POST /surgical-cases/{cid}/assign-anesthesia"

  - priority: 14
    category: business_safety
    check: "Assign-anesthesia: a CRNA-credential Anesthesiologist may not solo-cover a case whose procedure.anesthesia_class == GENERAL"
    error_id: ERR_CRNA_CANNOT_COVER_GENERAL
    http_status: 409
    applies_to: "POST /surgical-cases/{cid}/assign-anesthesia ; POST /surgeon-blocks/{bid}/cases"

  - priority: 15
    category: business_safety
    check: "Assign-recovery: if procedure.requires_phase2 == true the chosen RecoveryBay.phase2_capable must be true"
    error_id: ERR_RECOVERY_PHASE2_REQUIRED
    http_status: 409
    applies_to: "POST /surgical-cases/{cid}/assign-recovery ; POST /surgeon-blocks/{bid}/cases"

  - priority: 16
    category: business_temporal
    check: "Clear: H&P must be fresh — (case service_date 00:00Z - hp_signed_at) days <= Facility.hp_validity_days. Boundary: exactly hp_validity_days is still fresh; hp_validity_days + 1 is stale."
    error_id: ERR_HP_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /surgical-cases/{cid}/clear"

  - priority: 17
    category: business_constraint
    check: "Implant attach: SupplyItem.available (on_hand_qty - reserved_qty) >= planned_qty"
    error_id: ERR_SUPPLY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /surgical-cases/{cid}/implants"

  - priority: 18
    category: business_fiscal
    check: "Booking non-add-on case: block committed_minutes + procedure.scheduled_minutes must NOT exceed allocated_minutes (finite block-minute pool). Boundary: committed + scheduled == allocated is allowed; one minute over is rejected."
    error_id: ERR_BLOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases (is_add_on == false)"

  - priority: 19
    category: business_constraint
    check: "Add-on booking (is_add_on == true) only permitted when SurgicalDay.posture == LOCKED; a non-add-on booking is rejected when posture == LOCKED or CLOSED"
    error_id: ERR_DAY_LOCKED
    http_status: 409
    applies_to: "POST /surgeon-blocks/{bid}/cases"

# =============================================================================
# §1.5 API Endpoint Table  (flat collections under /asc)
# =============================================================================
endpoints:
  # ---- Facilities ----------------------------------------------------------
  - method: POST
    path: "/asc/facilities"
    description: "Create an ASC facility (aggregate root)"
    roles: [Scheduler]
    code: 201
    input: [name, "turnover_minutes?", "hp_validity_days?", "utilization_target_pct?"]
    output: Facility
    side_effects: ["current_utc initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/asc/facilities/{facilityId}"
    description: "Get a facility"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/asc/facilities/{facilityId}/clock"
    description: "Advance the deterministic facility clock to an absolute UTC timestamp"
    roles: [Scheduler, ORManager]
    code: 200
    input: [to_iso8601]
    output: Facility
    side_effects: ["current_utc set to to_iso8601 (must be >= prior current_utc, else ERR_INVALID_REQUEST)"]

  # ---- Operating Rooms -----------------------------------------------------
  - method: POST
    path: "/asc/operating-rooms"
    description: "Create an operating room"
    roles: [ORManager]
    code: 201
    input: [facility_id, room_label, "prime_time_start_min?", "prime_time_end_min?"]
    output: OperatingRoom
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/asc/operating-rooms"
    description: "List operating rooms (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "OperatingRoom[]"
    side_effects: []

  - method: GET
    path: "/asc/operating-rooms/{orId}"
    description: "Get an operating room"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: OperatingRoom
    side_effects: []

  - method: POST
    path: "/asc/operating-rooms/{orId}/status"
    description: "Toggle OR status AVAILABLE<->OFFLINE"
    roles: [ORManager]
    code: 200
    input: [status]
    output: OperatingRoom
    side_effects: ["status set to AVAILABLE or OFFLINE"]

  # ---- Recovery Bays -------------------------------------------------------
  - method: POST
    path: "/asc/recovery-bays"
    description: "Create a recovery bay"
    roles: [ORManager]
    code: 201
    input: [facility_id, bay_label, "phase2_capable?"]
    output: RecoveryBay
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/asc/recovery-bays"
    description: "List recovery bays (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "RecoveryBay[]"
    side_effects: []

  - method: GET
    path: "/asc/recovery-bays/{bayId}"
    description: "Get a recovery bay"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: RecoveryBay
    side_effects: []

  - method: POST
    path: "/asc/recovery-bays/{bayId}/status"
    description: "Toggle recovery bay status AVAILABLE<->OFFLINE"
    roles: [ORManager]
    code: 200
    input: [status]
    output: RecoveryBay
    side_effects: ["status set to AVAILABLE or OFFLINE"]

  # ---- Anesthesiologists ---------------------------------------------------
  - method: POST
    path: "/asc/anesthesiologists"
    description: "Create an anesthesiologist"
    roles: [ORManager]
    code: 201
    input: [facility_id, full_name, "credential?", "active?"]
    output: Anesthesiologist
    side_effects: []

  - method: GET
    path: "/asc/anesthesiologists"
    description: "List anesthesiologists (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Anesthesiologist[]"
    side_effects: []

  - method: GET
    path: "/asc/anesthesiologists/{anesthId}"
    description: "Get an anesthesiologist"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: Anesthesiologist
    side_effects: []

  - method: GET
    path: "/asc/anesthesiologists/{anesthId}/coverage-load"
    description: "Computed read: projected (default) or actual anesthesia coverage load for a service date"
    roles: [Scheduler, ORManager, BillingAnalyst]
    code: 200
    input: [service_date, "basis?"]
    output: "{ anesthesiologist_id: string, service_date: string, basis: string, minutes: integer, coverage_load_pct: number }"
    side_effects: []

  # ---- Surgeons ------------------------------------------------------------
  - method: POST
    path: "/asc/surgeons"
    description: "Create a surgeon"
    roles: [Scheduler]
    code: 201
    input: [facility_id, full_name, npi, "active?"]
    output: Surgeon
    side_effects: []

  - method: GET
    path: "/asc/surgeons"
    description: "List surgeons (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Surgeon[]"
    side_effects: []

  - method: GET
    path: "/asc/surgeons/{surgeonId}"
    description: "Get a surgeon"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: Surgeon
    side_effects: []

  - method: PATCH
    path: "/asc/surgeons/{surgeonId}"
    description: "Update surgeon active flag"
    roles: [Scheduler]
    code: 200
    input: ["active?"]
    output: Surgeon
    side_effects: []

  # ---- Procedures ----------------------------------------------------------
  - method: POST
    path: "/asc/procedures"
    description: "Create a procedure (CMS ASC list entry)"
    roles: [BillingAnalyst]
    code: 201
    input: [facility_id, cpt_code, description, scheduled_minutes, cms_payment_indicator, cms_base_rate_cents, "requires_phase2?", "anesthesia_class?", "device_offset_pct?"]
    output: Procedure
    side_effects: []

  - method: GET
    path: "/asc/procedures"
    description: "List procedures (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/asc/procedures/{procedureId}"
    description: "Get a procedure"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  # ---- Supply Items --------------------------------------------------------
  - method: POST
    path: "/asc/supply-items"
    description: "Create a supply/device item"
    roles: [ORManager]
    code: 201
    input: [facility_id, sku, description, unit_cost_cents, "is_device?", "on_hand_qty?"]
    output: SupplyItem
    side_effects: ["reserved_qty initialized to 0"]

  - method: GET
    path: "/asc/supply-items"
    description: "List supply items (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "SupplyItem[]"
    side_effects: []

  - method: GET
    path: "/asc/supply-items/{itemId}"
    description: "Get a supply item (with computed reserved_qty)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: SupplyItem
    side_effects: []

  - method: POST
    path: "/asc/supply-items/{itemId}/restock"
    description: "Increase on_hand_qty"
    roles: [ORManager]
    code: 200
    input: [delta_qty]
    output: SupplyItem
    side_effects: ["on_hand_qty += delta_qty (delta_qty positive integer)"]

  # ---- Patients ------------------------------------------------------------
  - method: POST
    path: "/asc/patients"
    description: "Create a patient"
    roles: [Scheduler, PreOpNurse]
    code: 201
    input: [facility_id, mrn, full_name, date_of_birth]
    output: Patient
    side_effects: []

  - method: GET
    path: "/asc/patients"
    description: "List patients (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/asc/patients/{patientId}"
    description: "Get a patient"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Surgical Days -------------------------------------------------------
  - method: POST
    path: "/asc/surgical-days"
    description: "Create a surgical day"
    roles: [Scheduler]
    code: 201
    input: [facility_id, service_date]
    output: SurgicalDay
    side_effects: ["posture = OPEN; booked_minutes = 0; utilization_pct = 0"]

  - method: GET
    path: "/asc/surgical-days"
    description: "List surgical days (filterable by facility)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "SurgicalDay[]"
    side_effects: []

  - method: GET
    path: "/asc/surgical-days/{dayId}"
    description: "Get a surgical day (with computed posture, booked_minutes, utilization_pct)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: SurgicalDay
    side_effects: []

  - method: POST
    path: "/asc/surgical-days/{dayId}/lock"
    description: "Lock the day (OPEN -> LOCKED)"
    roles: [Scheduler]
    code: 200
    input: []
    output: SurgicalDay
    side_effects: ["posture -> LOCKED"]

  - method: POST
    path: "/asc/surgical-days/{dayId}/reopen"
    description: "Reopen the day (LOCKED -> OPEN)"
    roles: [Scheduler]
    code: 200
    input: []
    output: SurgicalDay
    side_effects: ["posture -> OPEN"]

  - method: POST
    path: "/asc/surgical-days/{dayId}/close"
    description: "Close the day (LOCKED -> CLOSED)"
    roles: [ORManager]
    code: 200
    input: []
    output: SurgicalDay
    side_effects: ["posture -> CLOSED; utilization_pct frozen"]

  # ---- Surgeon Blocks ------------------------------------------------------
  - method: POST
    path: "/asc/surgeon-blocks"
    description: "Open a surgeon block (HELD) on a surgical day in an OR"
    roles: [Scheduler]
    code: 201
    input: [surgical_day_id, surgeon_id, operating_room_id, start_min, end_min, "release_threshold_hours?"]
    output: SurgeonBlock
    side_effects: ["status = HELD; allocated_minutes = end_min - start_min; committed_minutes = 0; facility_id inherited from day"]

  - method: GET
    path: "/asc/surgeon-blocks"
    description: "List surgeon blocks (filterable by surgical_day_id, surgeon_id, operating_room_id, facility_id)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["surgical_day_id?", "surgeon_id?", "operating_room_id?", "facility_id?", "limit?", "offset?"]
    output: "SurgeonBlock[]"
    side_effects: []

  - method: GET
    path: "/asc/surgeon-blocks/{blockId}"
    description: "Get a surgeon block (with committed_minutes, version)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: SurgeonBlock
    side_effects: []

  - method: POST
    path: "/asc/surgeon-blocks/{blockId}/confirm"
    description: "Confirm a block (HELD -> CONFIRMED)"
    roles: [Scheduler]
    code: 200
    input: []
    output: SurgeonBlock
    side_effects: ["status -> CONFIRMED", "increments SurgeonBlock.version by 1"]

  - method: POST
    path: "/asc/surgeon-blocks/{blockId}/release"
    description: "Release a block (HELD/CONFIRMED -> RELEASED); cascades to force-cancel its SCHEDULED cases"
    roles: [Scheduler]
    code: 200
    input: []
    output: SurgeonBlock
    side_effects:
      - "status -> RELEASED"
      - "force-cancel each SCHEDULED case in block (depth-1)"
      - "released implants decrement SupplyItem.reserved_qty; day booked_minutes + utilization_pct recomputed (depth-2)"
      - "increments SurgeonBlock.version by 1"

  - method: POST
    path: "/asc/surgeon-blocks/{blockId}/cases"
    description: "Book a SurgicalCase into the block (OCC-guarded; the case is the booked unit)"
    roles: [Scheduler]
    code: 201
    input: [expected_block_version, patient_id, procedure_id, start_min, "anesthesiologist_id?", "recovery_bay_id?", "is_add_on?"]
    output: SurgicalCase
    side_effects:
      - "SurgicalCase created (case_status = SCHEDULED, clearance_status = PENDING_CLEARANCE)"
      - "scheduled_minutes inherited from procedure; end_min = start_min + scheduled_minutes; operating_room_id inherited from block"
      - "SurgeonBlock.committed_minutes += scheduled_minutes; day booked_minutes + utilization_pct recomputed"
      - "estimated_cost_cents computed (§1.3 estimated_case_cost)"
      - "increments SurgeonBlock.version by 1"

  # ---- Surgical Cases ------------------------------------------------------
  - method: GET
    path: "/asc/surgical-cases"
    description: "List surgical cases (filterable by surgical_day_id, surgeon_block_id, patient_id, procedure_id, operating_room_id, anesthesiologist_id, recovery_bay_id, facility_id)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["surgical_day_id?", "surgeon_block_id?", "patient_id?", "procedure_id?", "operating_room_id?", "anesthesiologist_id?", "recovery_bay_id?", "facility_id?", "case_status?", "limit?", "offset?"]
    output: "SurgicalCase[]"
    side_effects: []

  - method: GET
    path: "/asc/surgical-cases/{caseId}"
    description: "Get a surgical case (with both status dimensions and cost fields)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []

  - method: PATCH
    path: "/asc/surgical-cases/{caseId}/reschedule"
    description: "Move a SCHEDULED case to a new start_min within its block (re-runs OR + anesthesia overlap checks)"
    roles: [Scheduler]
    code: 200
    input: [start_min]
    output: SurgicalCase
    side_effects: ["start_min updated; end_min recomputed; day utilization_pct recomputed"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/assign-anesthesia"
    description: "Assign or reassign an anesthesiologist to a case"
    roles: [ORManager]
    code: 200
    input: [anesthesiologist_id]
    output: SurgicalCase
    side_effects: ["anesthesiologist_id set"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/assign-recovery"
    description: "Assign or reassign a recovery bay to a case"
    roles: [ORManager]
    code: 200
    input: [recovery_bay_id]
    output: SurgicalCase
    side_effects: ["recovery_bay_id set"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/clearance-checks"
    description: "Record a pre-op clearance check (FAIL drives clearance_status -> ON_HOLD)"
    roles: [PreOpNurse]
    code: 201
    input: [check_type, outcome]
    output: ClearanceCheck
    side_effects: ["ClearanceCheck appended", "if outcome == FAIL: clearance_status -> ON_HOLD"]

  - method: GET
    path: "/asc/clearance-checks"
    description: "List clearance checks (filterable by surgical_case_id)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["surgical_case_id?", "limit?", "offset?"]
    output: "ClearanceCheck[]"
    side_effects: []

  - method: GET
    path: "/asc/clearance-checks/{checkId}"
    description: "Get a clearance check"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: ClearanceCheck
    side_effects: []

  - method: POST
    path: "/asc/surgical-cases/{caseId}/clearance-reset"
    description: "Reset clearance ON_HOLD -> PENDING_CLEARANCE (rework loop)"
    roles: [PreOpNurse]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["clearance_status -> PENDING_CLEARANCE"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/clear"
    description: "Mark clearance CLEARED (PENDING_CLEARANCE -> CLEARED); enforces H&P window"
    roles: [PreOpNurse]
    code: 200
    input: ["hp_signed_at?"]
    output: SurgicalCase
    side_effects: ["clearance_status -> CLEARED; hp_signed_at recorded if provided"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/start"
    description: "Start the case into the OR (SCHEDULED -> IN_OR); requires CLEARED + LOCKED day"
    roles: [ORManager]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["case_status -> IN_OR"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/to-recovery"
    description: "Move case to recovery (IN_OR -> IN_RECOVERY)"
    roles: [ORManager]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["case_status -> IN_RECOVERY"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/complete"
    description: "Complete the case (IN_RECOVERY -> COMPLETED); settles implants and computes actual cost + ASC payment"
    roles: [ORManager]
    code: 200
    input: [actual_minutes]
    output: SurgicalCase
    side_effects:
      - "case_status -> COMPLETED"
      - "RESERVED implants -> CONSUMED (decrement reserved_qty by planned_qty, on_hand_qty by consumed_qty)"
      - "actual_cost_cents + cms_payment_cents computed"
      - "day utilization_pct recomputed with actual_minutes"

  - method: POST
    path: "/asc/surgical-cases/{caseId}/cancel"
    description: "Cancel a SCHEDULED case (compensating: free block minutes + reserved supply)"
    roles: [Scheduler]
    code: 200
    input: []
    output: SurgicalCase
    side_effects:
      - "case_status -> CANCELLED"
      - "SurgeonBlock.committed_minutes -= scheduled_minutes"
      - "RESERVED implants -> RELEASED (decrement reserved_qty)"
      - "day booked_minutes + utilization_pct recomputed"

  # ---- Case Implants -------------------------------------------------------
  - method: POST
    path: "/asc/surgical-cases/{caseId}/implants"
    description: "Attach an implant/supply to a case (RESERVED; holds supply availability)"
    roles: [ORManager]
    code: 201
    input: [supply_item_id, planned_qty]
    output: CaseImplant
    side_effects:
      - "CaseImplant created (status = RESERVED)"
      - "SupplyItem.reserved_qty += planned_qty"
      - "owning case estimated_cost_cents recomputed if case_status == SCHEDULED"

  - method: PATCH
    path: "/asc/case-implants/{implantId}"
    description: "Record consumed_qty on an implant prior to case completion"
    roles: [ORManager]
    code: 200
    input: [consumed_qty]
    output: CaseImplant
    side_effects: ["consumed_qty recorded (0 <= consumed_qty <= planned_qty)"]

  - method: POST
    path: "/asc/surgical-cases/{caseId}/implants/{implantId}/release"
    description: "Release a RESERVED implant (RESERVED -> RELEASED); frees supply"
    roles: [ORManager]
    code: 200
    input: []
    output: CaseImplant
    side_effects: ["status -> RELEASED", "SupplyItem.reserved_qty -= planned_qty", "estimated_cost_cents recomputed if case SCHEDULED"]

  - method: GET
    path: "/asc/case-implants"
    description: "List case implants (filterable by surgical_case_id, supply_item_id)"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: ["surgical_case_id?", "supply_item_id?", "limit?", "offset?"]
    output: "CaseImplant[]"
    side_effects: []

  - method: GET
    path: "/asc/case-implants/{implantId}"
    description: "Get a case implant"
    roles: [Scheduler, PreOpNurse, ORManager, BillingAnalyst]
    code: 200
    input: []
    output: CaseImplant
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or X-User-Role is not a known role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation per §1.7" }

  # --- Not found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id not found" }
  - { id: ERR_OPERATING_ROOM_NOT_FOUND, http: 404, condition: "OperatingRoom id not found" }
  - { id: ERR_RECOVERY_BAY_NOT_FOUND, http: 404, condition: "RecoveryBay id not found" }
  - { id: ERR_ANESTHESIOLOGIST_NOT_FOUND, http: 404, condition: "Anesthesiologist id not found" }
  - { id: ERR_SURGEON_NOT_FOUND, http: 404, condition: "Surgeon id not found" }
  - { id: ERR_PROCEDURE_NOT_FOUND, http: 404, condition: "Procedure id not found" }
  - { id: ERR_SUPPLY_ITEM_NOT_FOUND, http: 404, condition: "SupplyItem id not found" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id not found" }
  - { id: ERR_SURGICAL_DAY_NOT_FOUND, http: 404, condition: "SurgicalDay id not found" }
  - { id: ERR_SURGEON_BLOCK_NOT_FOUND, http: 404, condition: "SurgeonBlock id not found" }
  - { id: ERR_SURGICAL_CASE_NOT_FOUND, http: 404, condition: "SurgicalCase id not found" }
  - { id: ERR_CASE_IMPLANT_NOT_FOUND, http: 404, condition: "CaseImplant id not found" }
  - { id: ERR_CLEARANCE_CHECK_NOT_FOUND, http: 404, condition: "ClearanceCheck id not found" }

  # --- Input / uniqueness ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing/typed-wrong field, enum out of range, non-positive minutes, end_min <= start_min, clock moving backward, bad npi/cpt format" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Facility-scoped uniqueness violated (npi / cpt_code / mrn / sku / service_date)" }

  # --- Concurrency ---
  - { id: ERR_STALE_BLOCK_VERSION, http: 412, condition: "expected_block_version != current SurgeonBlock.version (OCC mismatch on booking)" }

  # --- Block state ---
  - { id: ERR_BLOCK_NOT_HELD, http: 409, condition: "Block must be HELD to confirm" }
  - { id: ERR_BLOCK_NOT_RELEASABLE, http: 409, condition: "Block must be HELD or CONFIRMED to release" }
  - { id: ERR_BLOCK_RELEASED, http: 409, condition: "Block is RELEASED and cannot accept bookings/confirmation" }
  - { id: ERR_BLOCK_HAS_ACTIVE_CASES, http: 409, condition: "Block release rejected: a case is IN_OR / IN_RECOVERY / COMPLETED" }

  # --- Day state ---
  - { id: ERR_DAY_NOT_OPEN, http: 409, condition: "SurgicalDay must be OPEN" }
  - { id: ERR_DAY_NOT_LOCKED, http: 409, condition: "SurgicalDay must be LOCKED for this operation" }
  - { id: ERR_DAY_LOCKED, http: 409, condition: "Non-add-on booking rejected: SurgicalDay is LOCKED (or CLOSED)" }
  - { id: ERR_DAY_CLOSED, http: 409, condition: "SurgicalDay is CLOSED; no further mutations" }
  - { id: ERR_DAY_EMPTY, http: 409, condition: "Cannot lock a day with no non-cancelled cases" }
  - { id: ERR_DAY_HAS_ACTIVE_CASES, http: 409, condition: "Cannot reopen a day with a case IN_OR / IN_RECOVERY / COMPLETED" }
  - { id: ERR_DAY_HAS_UNFINISHED_CASES, http: 409, condition: "Cannot close a day with a non-cancelled case not yet COMPLETED" }

  # --- Case state (case_status dimension) ---
  - { id: ERR_CASE_NOT_SCHEDULED, http: 409, condition: "Case must be SCHEDULED for this operation" }
  - { id: ERR_CASE_NOT_IN_OR, http: 409, condition: "Case must be IN_OR to move to recovery" }
  - { id: ERR_CASE_NOT_IN_RECOVERY, http: 409, condition: "Case must be IN_RECOVERY to complete" }
  - { id: ERR_CASE_NOT_CANCELLABLE, http: 409, condition: "Only SCHEDULED cases may be cancelled" }

  # --- Clearance state (clearance_status dimension) ---
  - { id: ERR_CASE_NOT_CLEARED, http: 409, condition: "Case clearance_status must be CLEARED to start the case (cross-dimension guard)" }
  - { id: ERR_CLEARANCE_NOT_PENDING, http: 409, condition: "Clearance must be PENDING_CLEARANCE for this operation" }
  - { id: ERR_CLEARANCE_NOT_ON_HOLD, http: 409, condition: "Clearance must be ON_HOLD to reset" }
  - { id: ERR_HP_REVIEW_MISSING, http: 409, condition: "No passing HP_REVIEW clearance check exists" }
  - { id: ERR_OPEN_FAILED_CHECK, http: 409, condition: "An un-superseded DEFER clearance check exists when clearing" }
  - { id: ERR_HP_WINDOW_EXPIRED, http: 409, condition: "H&P older than Facility.hp_validity_days relative to service_date" }

  # --- Resource / assignment ---
  - { id: ERR_OR_OFFLINE, http: 409, condition: "Assigned OperatingRoom is OFFLINE" }
  - { id: ERR_RECOVERY_NOT_ASSIGNED, http: 409, condition: "recovery_bay_id unset or its bay OFFLINE when moving to recovery" }
  - { id: ERR_ANESTHESIA_NOT_ASSIGNED, http: 409, condition: "anesthesiologist_id unset or anesthesiologist inactive when starting case" }
  - { id: ERR_ANESTHESIOLOGIST_INACTIVE, http: 409, condition: "Anesthesiologist.active == false when assigning" }
  - { id: ERR_CRNA_CANNOT_COVER_GENERAL, http: 409, condition: "CRNA credential cannot cover anesthesia_class GENERAL" }
  - { id: ERR_RECOVERY_PHASE2_REQUIRED, http: 409, condition: "Procedure requires Phase II but bay is not phase2_capable" }

  # --- Booking business rules ---
  - { id: ERR_PROCEDURE_EXCLUDED, http: 409, condition: "Procedure.cms_payment_indicator == EXCLUDED cannot be booked" }
  - { id: ERR_SURGEON_INACTIVE, http: 409, condition: "Block surgeon is inactive" }
  - { id: ERR_CASE_OUTSIDE_BLOCK_WINDOW, http: 409, condition: "Non-add-on case footprint falls outside the block [start_min,end_min) window" }
  - { id: ERR_OR_TIME_CONFLICT, http: 409, condition: "Case footprint + turnover overlaps another case in the same OR on the same day" }
  - { id: ERR_ANESTHESIA_TIME_CONFLICT, http: 409, condition: "Case footprint overlaps another case for the same anesthesiologist on the same day (no buffer)" }
  - { id: ERR_BLOCK_CAPACITY_EXCEEDED, http: 409, condition: "Non-add-on booking would push committed_minutes over allocated_minutes" }
  - { id: ERR_SUPPLY_INSUFFICIENT, http: 409, condition: "SupplyItem available (on_hand - reserved) < planned_qty" }

  # --- Completion / implant settlement ---
  - { id: ERR_ACTUAL_MINUTES_REQUIRED, http: 400, condition: "actual_minutes missing or non-positive on complete" }
  - { id: ERR_IMPLANT_NOT_SETTLED, http: 409, condition: "A RESERVED implant has no consumed_qty recorded at completion" }
  - { id: ERR_IMPLANT_NOT_RESERVED, http: 409, condition: "Implant must be RESERVED for release/consume" }
  - { id: ERR_CONSUMED_QTY_INVALID, http: 409, condition: "consumed_qty out of [0, planned_qty]" }

# =============================================================================
# §1.7 RBAC Matrix  (peer_roles — non-overlapping resource ownership)
# =============================================================================
roles:
  - name: Scheduler
    description: "Owns facilities, surgeons, patients, surgical days, surgeon blocks, case booking, rescheduling, cancellation, and day lock/reopen"
    identity: opaque
    exclusive_operations:
      - "POST /asc/facilities — create facility"
      - "POST /asc/surgeons — create surgeon"
      - "PATCH /asc/surgeons/{id} — toggle surgeon active"
      - "POST /asc/surgical-days — create day"
      - "POST /asc/surgical-days/{id}/lock — lock day"
      - "POST /asc/surgical-days/{id}/reopen — reopen day"
      - "POST /asc/surgeon-blocks — open block"
      - "POST /asc/surgeon-blocks/{id}/confirm — confirm block"
      - "POST /asc/surgeon-blocks/{id}/release — release block"
      - "POST /asc/surgeon-blocks/{id}/cases — book case (OCC)"
      - "PATCH /asc/surgical-cases/{id}/reschedule — reschedule case"
      - "POST /asc/surgical-cases/{id}/cancel — cancel case"
    shared_operations:
      - "POST /asc/patients — create patient (shared with PreOpNurse)"
      - "POST /asc/facilities/{id}/clock — advance clock (shared with ORManager)"
      - "GET ... — all list/read endpoints"

  - name: PreOpNurse
    description: "Owns pre-op clearance lifecycle: clearance checks, clearance reset, clear, and the H&P window"
    identity: opaque
    exclusive_operations:
      - "POST /asc/surgical-cases/{id}/clearance-checks — record clearance check"
      - "POST /asc/surgical-cases/{id}/clearance-reset — reset clearance"
      - "POST /asc/surgical-cases/{id}/clear — clear case"
    shared_operations:
      - "POST /asc/patients — create patient (shared with Scheduler)"
      - "GET ... — all list/read endpoints"

  - name: ORManager
    description: "Owns OR/recovery/anesthesia resources, supply, intra-op case progression (start/to-recovery/complete), implant settlement, and day close"
    identity: opaque
    exclusive_operations:
      - "POST /asc/operating-rooms — create OR"
      - "POST /asc/operating-rooms/{id}/status — toggle OR status"
      - "POST /asc/recovery-bays — create recovery bay"
      - "POST /asc/recovery-bays/{id}/status — toggle bay status"
      - "POST /asc/anesthesiologists — create anesthesiologist"
