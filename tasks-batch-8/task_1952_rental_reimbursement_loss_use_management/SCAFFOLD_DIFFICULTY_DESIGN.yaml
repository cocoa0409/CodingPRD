# =============================================================================
# §1.8 Scaffold Difficulty Design — task 1952 rental reimbursement & loss-of-use
# 22 non-stub instances across the nine Difficulty Rules of SKILL.md §0.5.
# Shared base fixture (replayed per instance from empty-DB):
#   policyholder POL-100; shop SHOP-1; partner RC-1 (rates 4500/6000/9000,
#   capacities 2/1/1); claim (limit 6000, cap 20, per-diem 3500, reserve 120000);
#   coverage VERIFIED (rental+LOU eligible); repair order IN_PROGRESS
#   (estimate 2026-08-14); reservation STANDARD 2026-08-05..2026-08-15
#   (10 days, rate 6000, estimate 60000), AUTHORIZED then ACTIVE at clock
#   2026-08-05T09:00:00Z. Claim.version after base chain = 6
#   (create 1, CV create 2, CV decide 3, reservation create 4, authorize 5,
#   activate track-flip 6).
# =============================================================================
scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_provisional_vs_audited_diverge
        grounds:
          - calculations.rental_charge_provisional
          - calculations.audited_charge_final
          - entities.RentalReservation.fields.estimated_charge_cents
          - entities.Invoice.fields.audited_payable_cents
        distinguishing_aspect: |
          Entity domain = RentalReservation direct-bill charge. The provisional
          forward-looking variant (uncapped, pre-tax) yields 52500 after a
          downgrade, while the chronological audit variant (per-day limit cap,
          per-day tax rounding, fee cap) yields 59200 for the SAME reservation
          and SAME rental days — the two valid algorithms provably diverge.
        test_recipe:
          setup:
            - "Base fixture; reservation ${res_id} ACTIVE (pickup 2026-08-05, authorized return 2026-08-15, STANDARD @6000)"
            - "Class change to ECONOMY effective 2026-08-10 drops the provisional estimate to 52500"
            - "Vehicle returned 2026-08-15 with repair still IN_PROGRESS (no recovery case)"
            - "Invoice over 2026-08-05..2026-08-15 routes to MANUAL_REVIEW (class change present) and is audited ADJUST_TO_AUTHORIZED"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /class-changes", payload: { reservation_id: "${res_id}", to_class: "ECONOMY", effective_date: "2026-08-10" }, as: RentalDeskAgent, captures: { cc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /invoices", payload: { reservation_id: "${res_id}", invoice_number: "INV-A1", period_start: "2026-08-05", period_end: "2026-08-15", daily_rate_cents: 4500, tax_cents: 4200, fees_cents: 3000 }, as: RentalPartner, as_user_id: "${rp_id}", captures: { inv_id: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv_id}/audit-decision", payload: { decision: "ADJUST_TO_AUTHORIZED" }, as: ClaimsAdjuster, captures: { aud: $.data.audited_payable_cents } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: ClaimsAdjuster, captures: { est: $.data.estimated_charge_cents } }
          assert:
            - "Reservation.${res_id}.estimated_charge_cents == 52500  (provisional variant: 60000 - (6000-4500)x5 downgrade delta, uncapped, pre-tax)"
            - "Invoice.${inv_id}.audited_payable_cents == 59200  (audit variant: 5x(6000+480) + 5x(4500+360) + min(3000,2500) fees)"
            - "Invoice.${inv_id}.status == AUTO_APPROVED after audit-decision"
            - "estimated_charge_cents != audited_payable_cents for identical rental days (52500 vs 59200)"

      - name: loss_of_use_variants_diverge
        grounds:
          - calculations.loss_of_use_payout
          - entities.LossOfUseClaim.fields.payout_cents
        distinguishing_aspect: |
          Entity domain = LossOfUseClaim payout (distinct from the reservation
          charge domain of reservation_provisional_vs_audited_diverge). For the
          SAME 14-day closed period, STANDARD_PER_DIEM pays 49000
          (3500 x 14) while COMPARABLE_VEHICLE pays 70000
          (min(claimed 70000, limit 6000 x 14)) — variant selection changes the
          payout by 21000 on identical dates.
        test_recipe:
          setup:
            - "Claim ${cl_id} with coverage VERIFIED (rental_eligible=true, loss_of_use_eligible=true); no reservation exists (LOU conflict rule inert)"
            - "Two loss-of-use claims on the same claim, same closed period 2026-08-05..2026-08-18 (14 days); LOU-A STANDARD_PER_DIEM claimed 60000, LOU-B COMPARABLE_VEHICLE claimed 70000 with documentation attached"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /loss-of-use-claims", payload: { claim_id: "${cl_id}", vehicle_description: "Borrowed sedan", period_start: "2026-08-05", period_end: "2026-08-18", claimed_amount_cents: 60000, payout_method: "STANDARD_PER_DIEM" }, as: Customer, as_user_id: "${ph_id}", captures: { lou_a: $.data.id } }
            - { call: "POST /loss-of-use-claims", payload: { claim_id: "${cl_id}", vehicle_description: "Borrowed pickup", period_start: "2026-08-05", period_end: "2026-08-18", claimed_amount_cents: 70000, payout_method: "COMPARABLE_VEHICLE" }, as: Customer, as_user_id: "${ph_id}", captures: { lou_b: $.data.id } }
            - { call: "POST /loss-of-use-claims/${lou_b}/attach-documentation", payload: {}, as: Customer, as_user_id: "${ph_id}" }
          trigger:
            - { call: "POST /loss-of-use-claims/${lou_a}/approve", payload: {}, as: ClaimsAdjuster, captures: { pay_a: $.data.payout_cents } }
            - { call: "POST /loss-of-use-claims/${lou_b}/approve", payload: {}, as: ClaimsAdjuster, captures: { pay_b: $.data.payout_cents } }
          assert:
            - "LossOfUseClaim.${lou_a}.payout_cents == 49000  (STANDARD_PER_DIEM: 3500 x min(14, 20))"
            - "LossOfUseClaim.${lou_b}.payout_cents == 70000  (COMPARABLE_VEHICLE: min(70000, 6000 x 14))"
            - "payouts diverge by exactly 21000 for identical period dates"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: class_change_upgrade_nested_minmax
        grounds:
          - calculations.class_change_cost_responsibility
          - entities.ClassChangeRecord.fields.customer_responsibility_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested min/max over
          (from_rate 6000, to_rate 9000, daily_limit 6000, remaining_days 5)
          plus the upgrade_waiver branch. Because from_rate already sits AT the
          limit, insurer_per_day collapses to 0 and the entire 3000/day upgrade
          differential lands on the customer: responsibility 15000, insurer
          delta 0, provisional estimate unchanged at 60000.
        test_recipe:
          setup:
            - "Base fixture through authorize (reservation AUTHORIZED, STANDARD @6000, 2026-08-05..2026-08-15, estimate 60000, reserve 60000)"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
          trigger:
            - { call: "POST /class-changes", payload: { reservation_id: "${res_id}", to_class: "PREMIUM", effective_date: "2026-08-10", upgrade_waiver: false }, as: RentalDeskAgent, captures: { cc_cust: $.data.customer_responsibility_cents, cc_day: $.data.per_day_customer_cents, cc_ins: $.data.insurer_delta_cents } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { est: $.data.estimated_charge_cents, rate: $.data.daily_rate_cents } }
          assert:
            - "ClassChangeRecord.per_day_customer_cents == 3000  (max(0, 9000 - max(6000, 6000)))"
            - "ClassChangeRecord.customer_responsibility_cents == 15000  (3000 x 5 remaining days 08-10..08-14)"
            - "ClassChangeRecord.insurer_delta_cents == 0  (max(0, min(9000,6000) - min(6000,6000)) x 5)"
            - "Reservation.${res_id}.daily_rate_cents == 9000 and estimated_charge_cents == 60000 (unchanged — insurer bears nothing)"

      - name: invoice_audit_per_day_rounding_pinned
        grounds:
          - calculations.audited_charge_final
          - calculations.invoice_auto_adjudication
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — at rate 4519 the
          pinned per-day-round-then-sum audit yields 24405, while the forbidden
          sum-then-round order yields 24403. Submitting the 1808
          (sum-then-round) tax figure forces MANUAL_REVIEW (criterion (e)
          mismatch) and the audit still lands on 24405.
        test_recipe:
          setup:
            - "Partner RC-R with economy_rate 4519; claim limit 6000 cap 20; reservation ECONOMY 2026-08-05..2026-08-10 (5 days, estimate 22595), AUTHORIZED then ACTIVE at 2026-08-05, RETURNED at 2026-08-10"
            - "Invoice bills rate 4519 with tax_cents 1808 (the sum-then-round figure) — routes MANUAL_REVIEW"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-R", economy_rate_cents: 4519, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "ECONOMY", pickup_date: "2026-08-05", authorized_return_date: "2026-08-10", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /invoices", payload: { reservation_id: "${res_id}", invoice_number: "INV-R1", period_start: "2026-08-05", period_end: "2026-08-10", daily_rate_cents: 4519, tax_cents: 1808, fees_cents: 0 }, as: RentalPartner, as_user_id: "${rp_id}", captures: { inv_id: $.data.id, inv_v: $.data.version, inv_status: $.data.status } }
          trigger:
            - { call: "POST /invoices/${inv_id}/audit-decision", payload: { decision: "ADJUST_TO_AUTHORIZED" }, as: ClaimsAdjuster, captures: { aud: $.data.audited_payable_cents } }
          assert:
            - "Invoice.${inv_id}.status == MANUAL_REVIEW at ingestion (submitted tax 1808 != per-day-rounded 1810)"
            - "Invoice.${inv_id}.audited_payable_cents == 24405 after ADJUST_TO_AUTHORIZED (5 x (4519 + round_half_up(4519 x 0.08)=362) + 0)"
            - "audited_payable_cents != 24403 (the sum-then-round result is explicitly NOT the algorithm)"
            - "Invoice.${inv_id}.unauthorized_days == 0"

      - name: extension_grant_circular_order_pinned
        grounds:
          - calculations.extension_day_grant
          - state_machines.ExtensionRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — days_needed depends on the
          authorized_return_date that the grant itself extends, and cap_remaining
          depends on the claim aggregate the grant mutates. The pinned pre-grant
          evaluation order yields granted_days = min(10, 10, (08-18 + 1 grace
          - 08-15) = 4) = 4; any other order (e.g., post-grant re-evaluation)
          yields a different number.
        test_recipe:
          setup:
            - "Base fixture; reservation ACTIVE (10 authorized days, estimate 60000, reserve 60000); repair IN_PROGRESS estimate 2026-08-14"
            - "DELAY_REPORTED milestone moves the estimate to 2026-08-18 and flips the reservation to EXTENSION_REVIEW"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-18" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms_id: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms_id}", requested_additional_days: 10, expected_reservation_version: "${res_v}" }, as: RentalDeskAgent, captures: { er_id: $.data.id } }
          trigger:
            - { call: "POST /extension-requests/${er_id}/approve", payload: {}, as: ClaimsAdjuster, captures: { granted: $.data.granted_days } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: ClaimsAdjuster, captures: { ret: $.data.authorized_return_date, days: $.data.authorized_days, est: $.data.estimated_charge_cents } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { reserve: $.data.rental_reserve_cents } }
          assert:
            - "ExtensionRequest.${er_id}.granted_days == 4  (min(requested 10, cap_remaining 10, days_needed (2026-08-18 + 1 - 2026-08-15) = 4))"
            - "Reservation.authorized_return_date == 2026-08-19 and authorized_days == 14"
            - "Reservation.estimated_charge_cents == 84000  (60000 + 4 x 6000)"
            - "Claim.rental_reserve_cents == 36000  (120000 - 60000 - 24000)"
            - "Reservation.status == ACTIVE after the approve (EXTENSION_REVIEW loop closes)"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_extension_review_cycle
        grounds:
          - state_machines.RentalReservation.ACTIVE_to_EXTENSION_REVIEW
          - state_machines.RentalReservation.EXTENSION_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          Cyclic shape on RentalReservation: the ACTIVE -> EXTENSION_REVIEW ->
          ACTIVE loop is executed TWICE in one lifecycle — first closed by a
          denial (no day grant), then by an approval (grant 5). Each loop
          iteration must re-arm cleanly; a linear pipeline cannot express this.
