  instances:
  - name: application_without_required_documents_is_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Producer.DRAFT_to_SUBMITTED
    - validations[priority=14]
    - errors[ERR_MISSING_REQUIRED_DOCUMENTS]
    distinguishing_aspect: DRAFT -> SUBMITTED requires a SUBMITTED or VERIFIED document for each of GAP_AUDIT, LIABILITY_INSURANCE and HACCP_PLAN; with HACCP_PLAN absent the transition must fail with HTTP
      422 ERR_MISSING_REQUIRED_DOCUMENTS and leave onboarding_status at DRAFT.
    test_recipe:
      setup:
      - Producer P1 is in onboarding_status DRAFT with only GAP_AUDIT and LIABILITY_INSURANCE submitted.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
