  - name: SupplierUser
    description: "Acts on behalf of exactly one component part supplier. Submits component part testing certificates for parts it supplies. May only touch ComponentPart rows whose supplier_id equals the supplier backing the caller's identity; any other part raises ERR_SUPPLIER_NOT_PART_OWNER."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /compliance/component-parts/{part_id}/certificates"
    shared_operations:
