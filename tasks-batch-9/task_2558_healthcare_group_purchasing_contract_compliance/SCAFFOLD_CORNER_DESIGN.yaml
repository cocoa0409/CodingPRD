            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-1", match_type: "CONVERSION", conversion_factor: 1.5 }
              as: MemberMaterialsManager
