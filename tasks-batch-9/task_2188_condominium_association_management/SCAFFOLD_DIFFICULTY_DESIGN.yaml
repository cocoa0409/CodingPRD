              payload: { full_name: "Priya Nandan", email: "priya@ap.test", board_role: "TREASURER", is_seated: true }
              as: CommunityManager
              captures: { tr: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner A", email: "oa@ap.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { oa: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
