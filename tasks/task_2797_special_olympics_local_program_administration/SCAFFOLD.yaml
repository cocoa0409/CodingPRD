  # ---- program, athletes and medical clearance ---------------------------
  - method: POST
    path: "/programs"
    description: "Create a local program. It starts in compliance_posture FROZEN because it has no certified coach yet."
    roles: [ProgramManager]
    code: 201
    input: [name, region_code]
    output: Program
    side_effects: ["compliance_posture initialised to FROZEN", "all derived counters initialised to 0", "sweep_epoch initialised to 0"]

  - method: POST
    path: "/programs/{id}/athletes"
    description: "Register an athlete. Registration is PENDING_MEDICAL with medical_status NONE until a medical form is approved."
    roles: [ProgramManager]
    code: 201
    input: ["legal_name", "birth_date", "sport", "down_syndrome_flag?"]
    output: Athlete
    side_effects: ["Program.active_athlete_count recomputed", "calculations.program_compliance_posture re-evaluated"]

  - method: POST
    path: "/athletes/{id}/medical-forms"
    description: "File a medical form for the athlete; enforces the attestation and exam-recency safety gates and moves the athlete's medical_status to PENDING_REVIEW."
    roles: [ProgramManager, MedicalReviewer]
    code: 201
    input: ["exam_date", "physician_name", "physician_license_id", "attestation_cardiac_clearance", "attestation_seizure_history", "attestation_atlantoaxial_screen?", "restrictions?"]
    output: MedicalForm
    side_effects: ["MedicalForm.expires_on = exam_date + MEDICAL_FORM_VALIDITY_DAYS", "Athlete.medical_status -> PENDING_REVIEW", "any prior APPROVED form for this athlete -> SUPERSEDED"]

  - method: POST
    path: "/medical-forms/{id}/review"
    description: "Approve or reject a SUBMITTED medical form. Approval clears the athlete and computes calculations.athlete_registration_expiry; rejection puts the medical dimension back to HOLD."
    roles: [MedicalReviewer]
    code: 200
    input: ["decision", "rejection_reason_code?"]
    output: MedicalForm
    side_effects: ["MedicalForm -> APPROVED or REJECTED", "MedicalForm.reviewed_by_user_id set from X-User-ID", "on APPROVE: Athlete.medical_status -> CLEARED or RESTRICTED, registration_status -> ACTIVE, current_medical_form_id set, registration_expires_on computed", "on REJECT: Athlete.medical_status -> HOLD", "calculations.program_compliance_posture re-evaluated"]

  - method: POST
    path: "/medical-forms/{id}/resubmit"
    description: "Correct and resubmit a REJECTED medical form in place, bounded by MEDICAL_FORM_MAX_REVISIONS."
    roles: [ProgramManager, MedicalReviewer]
    code: 200
    input: ["exam_date", "physician_name", "physician_license_id", "attestation_cardiac_clearance", "attestation_seizure_history", "attestation_atlantoaxial_screen?", "restrictions?"]
    output: MedicalForm
    side_effects: ["MedicalForm REJECTED -> SUBMITTED", "revision_count incremented by 1", "rejection_reason_code cleared", "expires_on recomputed from the new exam_date", "Athlete.medical_status -> PENDING_REVIEW"]

  - method: POST
    path: "/athletes/{id}/withdraw"
    description: "Withdraw an athlete from the program; cascades to live competition entries and unified team rosters."
    roles: [ProgramManager]
    code: 200
    input: [withdrawal_reason_code]
    output: Athlete
    side_effects: ["Athlete.registration_status -> WITHDRAWN", "every SUBMITTED/DIVISIONED/LOCKED entry of this athlete -> VOIDED with void_reason_code ATHLETE_WITHDRAWN", "affected Division.entry_count recomputed and status re-derived", "affected UnifiedTeam roster recomposed via calculations.unified_team_composition", "Program.active_athlete_count and posture re-evaluated"]

  # ---- volunteer credentialing ------------------------------------------
  - method: POST
    path: "/programs/{id}/volunteers"
    description: "Add a prospective coach, unified partner or general volunteer; is_minor is derived from date_of_birth against the logical clock."
    roles: [ProgramManager, CredentialingOfficer]
    code: 201
    input: [full_name, email, date_of_birth, volunteer_class]
    output: Volunteer
    side_effects: ["is_minor computed from date_of_birth and ADULT_AGE_YEARS"]

  - method: POST
    path: "/volunteers/{id}/credentials"
    description: "Open a credentialing file. It starts INITIATED with both the screening and the training branch outstanding."
    roles: [CredentialingOfficer]
    code: 201
    input: [role_class]
    output: Credential
    side_effects: ["Credential -> INITIATED", "Program.credential_denominator_count recomputed", "calculations.program_compliance_posture re-evaluated"]

  - method: POST
    path: "/credentials/{id}/screening"
    description: "Record the background screening branch. A DISQUALIFYING result denies the credential outright and cascades to the volunteer's scheduled sessions."
    roles: [CredentialingOfficer]
    code: 200
    input: [completed_on, result, vendor_reference]
    output: Credential
    side_effects: ["screening_completed_on, screening_result, screening_vendor_reference and screening_expires_on written", "screening_recorded_by_user_id set from X-User-ID", "status advances INITIATED -> SCREENING_CLEARED or TRAINING_COMPLETE -> READY_TO_CERTIFY", "on DISQUALIFYING: status -> DENIED with denial_reason_code DISQUALIFYING_SCREENING plus the deep session/attendance cascade", "calculations.program_compliance_posture re-evaluated"]

  - method: POST
    path: "/credentials/{id}/training"
    description: "Record the protective-behaviours training branch with its role-specific validity window."
    roles: [CredentialingOfficer]
    code: 200
    input: [completed_on, curriculum_code]
    output: Credential
    side_effects: ["training_completed_on, training_curriculum_code and training_expires_on written", "training_recorded_by_user_id set from X-User-ID", "status advances INITIATED -> TRAINING_COMPLETE or SCREENING_CLEARED -> READY_TO_CERTIFY"]

  - method: POST
    path: "/credentials/{id}/certify"
    description: "Certify a READY_TO_CERTIFY (or RENEWAL_IN_PROGRESS) credential. The certifying user must differ from both recording users."
    roles: [CredentialingOfficer]
    code: 200
    input: ["flag_override_reason?"]
    output: Credential
    side_effects: ["Credential -> CERTIFIED", "certified_by_user_id set from X-User-ID and certified_at set from the logical clock", "expires_on written by calculations.credential_effective_expiry", "Program.certified_coach_count recomputed", "calculations.program_compliance_posture re-evaluated"]

  # ---- season structure and practice -----------------------------------
  - method: POST
    path: "/programs/{id}/seasons"
    description: "Create a sport season with its practice minimums, milestone dates, entry slot budget and advancement slots."
    roles: [ProgramManager, CompetitionDirector]
    code: 201
    input: [sport, season_name, practice_minimum_sessions, practice_minimum_minutes, registration_deadline, divisioning_date, competition_date, games_level, entry_slot_budget, advancement_slots_per_division]
    output: SportSeason
    side_effects: ["SportSeason -> PLANNING"]

  - method: POST
    path: "/seasons/{id}/open-practice"
    description: "Open the practice window. Requires at least one live CERTIFIED coach credential in the program and a posture that is not FROZEN."
    roles: [ProgramManager, CompetitionDirector]
    code: 200
    input: []
    output: SportSeason
    side_effects: ["SportSeason PLANNING -> PRACTICE_OPEN"]

  - method: POST
    path: "/practice-sessions"
    description: "Schedule a practice session under a live coach credential; enforces the buffered coach overlap window."
    roles: [ProgramManager, Coach]
    code: 201
    input: [season_id, coach_credential_id, scheduled_start, duration_minutes, capacity_slots]
    output: PracticeSession
    side_effects: ["scheduled_end = scheduled_start + duration_minutes", "counts_toward_minimum set from duration_minutes >= MIN_QUALIFYING_SESSION_MINUTES", "PracticeSession -> SCHEDULED"]

  - method: POST
    path: "/practice-sessions/{id}/attendance-records"
    description: "Record one athlete's minutes at a session. Requires expected_session_version; the counting threshold decides whether the minutes count toward the practice minimum."
    roles: [ProgramManager, Coach]
    code: 201
    input: [athlete_id, minutes_present, expected_session_version]
    output: AttendanceRecord
    side_effects: ["increments PracticeSession.version by 1", "required_minutes, status and counted_minutes written by calculations.attendance_counting_threshold", "season_id denormalised from the parent session", "PracticeSession.recorded_attendance_count incremented and status SCHEDULED -> HELD", "Athlete and Program practice ledgers updated by calculations.program_practice_minute_ledger"]

  - method: POST
    path: "/practice-sessions/{id}/cancel"
    description: "Void a practice session and compensate every attendance row it produced, restoring the practice-minute ledger exactly."
    roles: [ProgramManager, Coach]
    code: 200
    input: [void_reason_code]
    output: PracticeSession
    side_effects: ["PracticeSession -> VOIDED", "every COUNTED/NOT_COUNTED AttendanceRecord of the session -> VOIDED with counted_minutes zeroed", "Athlete.cumulative_practice_minutes and counted_session_count decremented by exactly the reversed amounts", "Program.program_practice_minutes decremented by the same total"]

  # ---- unified teams ----------------------------------------------------
  - method: POST
    path: "/seasons/{id}/unified-teams"
    description: "Create an empty unified team roster for the season; it starts FORMING."
    roles: [ProgramManager, CompetitionDirector]
    code: 201
    input: [team_name]
    output: UnifiedTeam
    side_effects: ["UnifiedTeam -> FORMING with empty rosters and all derived counts 0"]

  - method: POST
    path: "/unified-teams/{id}/members"
    description: "Add one athlete or one certified unified partner to the roster; member_type is one of {ATHLETE, PARTNER} and member_id is an Athlete.id or a Volunteer.id accordingly. Requires expected_team_version and re-derives roster_status."
    roles: [ProgramManager, CompetitionDirector]
    code: 200
    input: [member_type, member_id, expected_team_version]
    output: UnifiedTeam
    side_effects: ["increments UnifiedTeam.version by 1", "member id appended to athlete_ids or partner_volunteer_ids", "athlete_count, partner_count, age_span_years and roster_status re-derived by calculations.unified_team_composition"]

  # ---- competition, divisioning and advancement -------------------------
  - method: POST
    path: "/competition-entries"
    description: "Submit a competition entry for an athlete or a unified team with its declared skill score; freezes the age group at the season's competition_date."
    roles: [CompetitionDirector]
    code: 201
    input: [season_id, participant_type, participant_id, event_code, skill_score]
    output: CompetitionEntry
    side_effects: ["age_on_competition_date and age_group frozen on the row", "CompetitionEntry -> SUBMITTED with a null division_id", "SportSeason.entry_count incremented"]

  - method: POST
    path: "/seasons/{id}/divisioning"
    description: "Run divisioning: the banding pass builds ability/age divisions, then the merge pass folds undersized divisions into neighbours."
    roles: [CompetitionDirector]
    code: 200
    input: []
    output: SportSeason
    side_effects: ["Division rows created by calculations.division_assignment", "undersized divisions folded by calculations.undersized_division_merge", "every assigned CompetitionEntry SUBMITTED -> DIVISIONED with division_id and seed_rank", "SportSeason PRACTICE_OPEN -> DIVISIONED", "divisioning_run_count incremented and divisioned_entry_count recomputed"]

  - method: POST
    path: "/seasons/{id}/redivision"
    description: "Revert a DIVISIONED season to PRACTICE_OPEN, void the divisions it produced and return its entries to SUBMITTED so divisioning can run again."
    roles: [CompetitionDirector]
    code: 200
    input: []
    output: SportSeason
    side_effects: ["every DRAFT/VALID/UNDERSIZED Division of the season -> VOIDED", "every DIVISIONED entry -> SUBMITTED with division_id and seed_rank cleared", "SportSeason DIVISIONED -> PRACTICE_OPEN", "divisioned_entry_count reset to 0"]

  - method: POST
    path: "/seasons/{id}/lock-entries"
    description: "Lock the divisioned field. Rejected while any division of the season is still UNDERSIZED."
    roles: [CompetitionDirector]
    code: 200
    input: []
    output: SportSeason
    side_effects: ["SportSeason DIVISIONED -> ENTRIES_LOCKED", "every DIVISIONED entry -> LOCKED"]

  - method: POST
    path: "/competition-entries/{id}/result"
    description: "Post a competition result. Computes the direction-dependent performance ratio and re-runs the division's advancement waterfall."
    roles: [CompetitionDirector]
    code: 200
    input: ["result_value", "disqualified?", "disqualification_reason_code?"]
    output: CompetitionEntry
    side_effects: ["result_value stored and performance_ratio written by calculations.entry_performance_ratio", "CompetitionEntry LOCKED -> RESULTED, or -> DISQUALIFIED when disqualified is true", "placement and advancement_status of every entry in the division recomputed by calculations.advancement_waterfall", "entries that gain a slot -> ADVANCED, entries that lose one revert to RESULTED"]

  # ---- health screening, fundraising and the sweep ----------------------
  - method: POST
    path: "/health-screenings"
    description: "Record a Healthy Athletes screening finding. An URGENT finding opens a referral and immediately restricts the program's posture."
    roles: [HealthScreeningLead]
    code: 201
    input: ["athlete_id", "event_name", "discipline", "screened_on", "finding_severity", "finding_note?"]
    output: HealthScreening
    side_effects: ["referral_status set to NOT_REQUIRED for ROUTINE, REFERRED for ADVISORY and URGENT", "referral_due_on set from URGENT_REFERRAL_DUE_DAYS or ADVISORY_REFERRAL_DUE_DAYS", "on URGENT: Athlete.medical_status -> HOLD, live entries VOIDED with ATHLETE_MEDICAL_HOLD, Program.unresolved_urgent_referral_count incremented and posture re-evaluated"]

  - method: POST
    path: "/health-screenings/{id}/referral-followup"
    description: "Log a referral follow-up contact (outcome LOGGED), re-open a referral that needs another contact (outcome REREFER), or resolve the referral entirely and release the athlete's medical hold (outcome RESOLVED)."
    roles: [HealthScreeningLead, MedicalReviewer]
    code: 200
    input: ["note", "outcome"]
    output: HealthScreening
    side_effects: ["followup_count incremented and last_followup_note stored", "referral_status -> FOLLOW_UP_LOGGED for LOGGED, -> REFERRED with referral_due_on reset for REREFER, -> RESOLVED for RESOLVED", "on RESOLVED of an URGENT finding: Athlete.medical_status returns to CLEARED/RESTRICTED (or NONE when no approved form remains), Program.unresolved_urgent_referral_count decremented and posture re-evaluated"]

  - method: POST
    path: "/programs/{id}/contributions"
    description: "Log a cash pledge, cash receipt, in-kind gift or volunteer-hour contribution and recognise its value."
    roles: [ProgramManager]
    code: 201
    input: ["donor_name", "contribution_type", "designation", "stated_value_cents?", "volunteer_hours?", "received_on?"]
    output: Contribution
    side_effects: ["recognized_value_cents written by calculations.contribution_recognized_value", "status set to PLEDGED for CASH_PLEDGE and RECEIVED otherwise", "match_credit_cents written by calculations.family_engagement_match_credit", "Program.pledged_support_cents / recognized_support_cents / family_engagement_credit_cents updated"]

  - method: POST
    path: "/contributions/{id}/fulfill"
    description: "Convert a PLEDGED contribution into a received one, moving its value from the pledged ledger to the recognised ledger."
    roles: [ProgramManager]
    code: 200
    input: [received_on]
    output: Contribution
    side_effects: ["Contribution PLEDGED -> RECEIVED with received_on stored", "Program.pledged_support_cents decremented and recognized_support_cents incremented by recognized_value_cents", "family engagement match credit recomputed"]

  - method: POST
    path: "/contributions/{id}/void"
    description: "Void a contribution and reverse every ledger effect it had, leaving no drift on the program."
    roles: [ProgramManager]
    code: 200
    input: [void_reason_code]
    output: Contribution
    side_effects: ["Contribution -> VOID", "recognized_value_cents and match_credit_cents zeroed", "whichever of Program.pledged_support_cents or recognized_support_cents carried the value is decremented by exactly that value", "Program.family_engagement_credit_cents decremented by the reversed match credit"]

  - method: POST
    path: "/programs/{id}/compliance-sweep"
    description: "Run the periodic compliance checkpoint: expire credentials, expire medical forms, lapse registrations, escalate overdue referrals, complete finished seasons and re-derive every program counter and the posture."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["step 1: CERTIFIED credentials with expires_on before the clock date -> EXPIRED (cascading to their SCHEDULED sessions)", "step 2: APPROVED medical forms with expires_on before the clock date -> EXPIRED and their athletes' medical_status -> HOLD or NONE", "step 3: ACTIVE athletes with registration_expires_on before the clock date -> LAPSED", "step 4: URGENT referrals past referral_due_on -> ESCALATED", "step 5: ENTRIES_LOCKED seasons whose every live entry is RESULTED, ADVANCED or DISQUALIFIED -> COMPLETED", "step 6: all Program counters, expired_credential_ratio and compliance_posture recomputed; sweep_epoch incremented by 1 and last_sweep_at set to the clock"]

  # ---- test-driving surface ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every expiry, deadline, window and age computation reads. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramManager, CredentialingOfficer, MedicalReviewer, Coach, CompetitionDirector, HealthScreeningLead]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["subsequent requests evaluate every temporal rule against the new instant; no stored row is mutated by this call itself"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header missing or naming an undeclared role, or X-User-ID missing on a write"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID would record two credentialing steps that must be performed by different officers"
  - id: ERR_NOT_CREDENTIAL_OWNER
    http: 403
    condition: "a Coach acts on a practice session whose coach_credential_id is not held by that coach's volunteer record"

  # -- existence
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id does not resolve"
  - id: ERR_ATHLETE_NOT_FOUND
    http: 404
    condition: "athlete_id in the path or body does not resolve"
  - id: ERR_MEDICAL_FORM_NOT_FOUND
    http: 404
    condition: "form_id does not resolve"
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "volunteer_id does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "credential_id in the path or coach_credential_id in the body does not resolve"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season_id in the path or body does not resolve"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id does not resolve"
  - id: ERR_DIVISION_NOT_FOUND
    http: 404
    condition: "division_id does not resolve"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "entry_id does not resolve"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "team_id does not resolve"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "screening_id does not resolve"
  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "contribution_id does not resolve"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "the polymorphic participant_id does not resolve in the collection named by participant_type, or belongs to another program"

  # -- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required input, unknown enum member, or numeric value outside its declared range"
  - id: ERR_VOLUNTEER_HOURS_REQUIRED
    http: 400
    condition: "contribution_type is VOLUNTEER_HOURS but volunteer_hours is absent or not greater than zero"
  - id: ERR_SEASON_DATE_ORDER
    http: 400
    condition: "season milestone dates are not strictly ordered registration_deadline < divisioning_date < competition_date"

  # -- optimistic concurrency
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version does not equal the practice session's current version"
  - id: ERR_STALE_TEAM_VERSION
    http: 412
    condition: "expected_team_version does not equal the unified team's current version"

  # -- state preconditions
  - id: ERR_MEDICAL_FORM_STATE_INVALID
    http: 409
    condition: "review requires SUBMITTED, resubmit requires REJECTED"
  - id: ERR_RESUBMIT_LIMIT_REACHED
    http: 409
    condition: "the medical form has already been revised MEDICAL_FORM_MAX_REVISIONS times"
  - id: ERR_CREDENTIAL_STEP_ALREADY_RECORDED
    http: 409
    condition: "the screening or training branch of this credential cycle has already been recorded, or the credential is DENIED/EXPIRED/CERTIFIED"
  - id: ERR_CREDENTIAL_NOT_READY_TO_CERTIFY
    http: 409
    condition: "certification attempted while the credential is not READY_TO_CERTIFY or RENEWAL_IN_PROGRESS with both branches complete, including any attempt to certify a DENIED credential"
  - id: ERR_SEASON_STATE_INVALID
    http: 409
    condition: "the season is not in the state the requested season action requires"
  - id: ERR_SEASON_NOT_PRACTICE_OPEN
    http: 409
    condition: "practice sessions, unified teams or competition entries requested while the season is not PRACTICE_OPEN"
  - id: ERR_SESSION_NOT_OPEN_FOR_ATTENDANCE
    http: 409
    condition: "attendance or cancellation requested on a VOIDED practice session"
  - id: ERR_ENTRY_STATE_INVALID
    http: 409
    condition: "a result was posted for an entry that is not LOCKED"
  - id: ERR_SCREENING_STATE_INVALID
    http: 409
    condition: "a referral follow-up was logged on a screening whose referral_status is NOT_REQUIRED or RESOLVED"
  - id: ERR_CONTRIBUTION_STATE_INVALID
    http: 409
    condition: "fulfil requires PLEDGED, void requires PLEDGED or RECEIVED"
  - id: ERR_ATHLETE_ALREADY_WITHDRAWN
    http: 409
    condition: "withdraw called on an athlete already in WITHDRAWN"

  # -- compliance posture gate
  - id: ERR_PROGRAM_POSTURE_RESTRICTED
    http: 409
    condition: "a competition-facing operation was requested while the program's compliance_posture is RESTRICTED"
  - id: ERR_PROGRAM_POSTURE_FROZEN
    http: 409
    condition: "a practice- or competition-facing operation was requested while the program's compliance_posture is FROZEN"

  # -- medical and protective-behaviours safety
  - id: ERR_MEDICAL_ATTESTATION_INCOMPLETE
    http: 422
    condition: "the medical form lacks cardiac clearance or a seizure-history attestation"
  - id: ERR_ATLANTOAXIAL_SCREEN_MISSING
    http: 422
    condition: "the athlete's down_syndrome_flag is true and the atlantoaxial screen attestation is absent or false"
  - id: ERR_EXAM_DATE_IN_FUTURE
    http: 422
    condition: "exam_date is after the logical clock date"
  - id: ERR_MEDICAL_EXAM_STALE
    http: 422
    condition: "exam_date + MEDICAL_FORM_VALIDITY_DAYS is before the logical clock date"
  - id: ERR_ATHLETE_MEDICAL_HOLD
    http: 422
    condition: "the athlete's medical_status is HOLD, PENDING_REVIEW or NONE for an operation that puts them on a field of play"
  - id: ERR_ATHLETE_NOT_ACTIVE
    http: 422
    condition: "the athlete's registration_status is not ACTIVE for attendance, roster membership or competition entry"
  - id: ERR_MEDICAL_RESTRICTION_INCOMPATIBLE
    http: 422
    condition: "the athlete's approved medical restrictions forbid the season's sport (NO_SWIMMING vs SWIMMING, NO_CONTACT vs BASKETBALL)"
  - id: ERR_MINOR_CANNOT_BE_COACH
    http: 422
    condition: "a volunteer under ADULT_AGE_YEARS was given a COACH credential"
  - id: ERR_FLAG_OVERRIDE_REQUIRED
    http: 422
    condition: "certification of a FLAGGED screening was attempted without a flag_override_reason"

  # -- temporal
  - id: ERR_SESSION_START_IN_PAST
    http: 422
    condition: "a practice session was scheduled to start before the logical clock"
  - id: ERR_ATTENDANCE_BEFORE_SESSION_START
    http: 422
    condition: "attendance was recorded before the session's scheduled_start has been reached"
  - id: ERR_COACH_SESSION_OVERLAP
    http: 409
    condition: "the coach credential already holds a live session whose buffered window overlaps the new one"
  - id: ERR_ATHLETE_SESSION_OVERLAP
    http: 409
    condition: "the athlete already has attendance on a live session whose closed interval intersects this one"
  - id: ERR_REGISTRATION_STILL_OPEN
    http: 409
    condition: "divisioning was requested before the season's registration_deadline"
  - id: ERR_REGISTRATION_DEADLINE_PASSED
    http: 409
    condition: "a competition entry was submitted after the season's registration_deadline"
  - id: ERR_COMPETITION_DATE_NOT_REACHED
    http: 409
    condition: "a result was posted before the season's competition_date"

  # -- referential integrity across entities
  - id: ERR_COACH_CREDENTIAL_INVALID
    http: 422
    condition: "the named credential is not a live CERTIFIED COACH credential"
  - id: ERR_ROLE_CLASS_MISMATCH
    http: 422
    condition: "the credential's role_class differs from the volunteer's volunteer_class"
  - id: ERR_PARTNER_CREDENTIAL_INVALID
    http: 422
    condition: "a unified partner added to a roster lacks a live CERTIFIED UNIFIED_PARTNER credential"
  - id: ERR_ROSTER_NOT_COMPLIANT
    http: 422
    condition: "a UNIFIED_TEAM entry was submitted while the team's roster_status is not COMPLIANT"
  - id: ERR_PRACTICE_MINIMUM_NOT_MET
    http: 422
    condition: "the athlete has not met the season's practice session or practice minute minimum"

  # -- composition, uniqueness and structural constraints
  - id: ERR_DUPLICATE_ATTENDANCE
    http: 409
    condition: "the athlete already has a live attendance row on this session"
  - id: ERR_DUPLICATE_TEAM_MEMBER
    http: 409
    condition: "the member is already on this unified team's roster"
  - id: ERR_UNIFIED_RATIO_VIOLATION
    http: 422
    condition: "the add would move athlete_count and partner_count more than one apart"
  - id: ERR_UNIFIED_AGE_SPAN_EXCEEDED
    http: 422
    condition: "the add would push the roster's age span above UNIFIED_AGE_SPAN_MAX_YEARS"
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "the participant already has a live entry for this season and event_code"
  - id: ERR_NO_ELIGIBLE_ENTRIES
    http: 422
    condition: "divisioning ran with an empty candidate set"
  - id: ERR_UNDERSIZED_DIVISION_PRESENT
    http: 409
    condition: "entries were locked while at least one division of the season is still UNDERSIZED"

  # -- capacity and budget
  - id: ERR_SESSION_CAPACITY_EXCEEDED
    http: 409
    condition: "the session's recorded_attendance_count has reached capacity_slots"
  - id: ERR_SEASON_ENTRY_BUDGET_EXCEEDED
    http: 409
    condition: "the season's live entry_count has reached entry_slot_budget"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramManager
    description: "Local program administrator: registers athletes and volunteers, runs seasons, logs fundraising and runs the compliance sweep"
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/athletes"
      - "POST /athletes/{id}/withdraw"
      - "POST /programs/{id}/contributions"
      - "POST /contributions/{id}/fulfill"
      - "POST /contributions/{id}/void"
      - "POST /programs/{id}/compliance-sweep"
      - "GET /programs/{id}/contributions"
    shared_operations:
      - "POST /programs/{id}/volunteers (with CredentialingOfficer)"
      - "POST /athletes/{id}/medical-forms and POST /medical-forms/{id}/resubmit (with MedicalReviewer)"
      - "POST /programs/{id}/seasons, POST /seasons/{id}/open-practice, POST /seasons/{id}/unified-teams, POST /unified-teams/{id}/members (with CompetitionDirector)"
      - "POST /practice-sessions, POST /practice-sessions/{id}/attendance-records, POST /practice-sessions/{id}/cancel (with Coach)"
      - "all GET endpoints except the credential-detail reads reserved to credentialing staff"

  - name: CredentialingOfficer
    description: "Records background screening and protective-behaviours training and certifies credentials; bound by segregation of duties"
    identity: opaque
    exclusive_operations:
      - "POST /volunteers/{id}/credentials"
      - "POST /credentials/{id}/screening"
      - "POST /credentials/{id}/training"
      - "POST /credentials/{id}/certify"
    shared_operations:
      - "POST /programs/{id}/volunteers (with ProgramManager)"
      - "GET /programs/{id}/athletes, GET /programs/{id}/volunteers, GET /volunteers/{id}, GET /volunteers/{id}/credentials, GET /credentials/{id}, GET /practice-sessions"

  - name: MedicalReviewer
    description: "Clinician reviewer who approves or rejects athlete medical forms and may resolve health-screening referrals"
    identity: opaque
    exclusive_operations:
      - "POST /medical-forms/{id}/review"
    shared_operations:
      - "POST /athletes/{id}/medical-forms and POST /medical-forms/{id}/resubmit (with ProgramManager)"
      - "POST /health-screenings/{id}/referral-followup (with HealthScreeningLead)"
      - "GET /programs/{id}/athletes, GET /athletes/{id}, GET /athletes/{id}/medical-forms, GET /athletes/{id}/health-screenings"

  - name: Coach
    description: "Certified coach acting as a persisted Volunteer; may only run sessions under a credential they personally hold"
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations:
      - "POST /practice-sessions, POST /practice-sessions/{id}/attendance-records, POST /practice-sessions/{id}/cancel (with ProgramManager, restricted to the coach's own credential)"
      - "GET /programs/{id}/athletes, GET /athletes/{id}, GET /athletes/{id}/attendance-records, GET /programs/{id}/seasons, GET /seasons/{id}, GET /seasons/{id}/unified-teams, GET /practice-sessions, GET /practice-sessions/{id}, GET /practice-sessions/{id}/attendance-records, GET /divisions, GET /divisions/{id}, GET /competition-entries, GET /competition-entries/{id}, GET /unified-teams/{id}, GET /credentials/{id}"

  - name: CompetitionDirector
    description: "Owns the competition pipeline: entries, divisioning, merges, locking, results and advancement"
    identity: opaque
    exclusive_operations:
      - "POST /competition-entries"
      - "POST /seasons/{id}/divisioning"
      - "POST /seasons/{id}/redivision"
      - "POST /seasons/{id}/lock-entries"
      - "POST /competition-entries/{id}/result"
    shared_operations:
      - "POST /programs/{id}/seasons, POST /seasons/{id}/open-practice, POST /seasons/{id}/unified-teams, POST /unified-teams/{id}/members (with ProgramManager)"
      - "GET /programs/{id}/athletes, GET /programs/{id}/volunteers, GET /programs/{id}/seasons, GET /athletes/{id}, GET /athletes/{id}/attendance-records, GET /volunteers/{id}, GET /volunteers/{id}/credentials, GET /credentials/{id}, GET /seasons/{id}, GET /seasons/{id}/unified-teams, GET /practice-sessions, GET /practice-sessions/{id}, GET /practice-sessions/{id}/attendance-records, GET /divisions, GET /divisions/{id}, GET /competition-entries, GET /competition-entries/{id}, GET /unified-teams/{id}"

  - name: HealthScreeningLead
    description: "Runs the Healthy Athletes screening program at events and drives referral follow-up"
    identity: opaque
    exclusive_operations:
      - "POST /health-screenings"
    shared_operations:
      - "POST /health-screenings/{id}/referral-followup (with MedicalReviewer)"
      - "GET /programs/{id}, GET /programs/{id}/athletes, GET /athletes/{id}, GET /athletes/{id}/medical-forms, GET /athletes/{id}/health-screenings"
