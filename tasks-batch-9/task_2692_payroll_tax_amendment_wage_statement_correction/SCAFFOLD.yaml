scenario: |
  Generate task harder than expert level!

  2692. Payroll Tax Amendment & Wage Statement Correction (payroll tax operations): error detection from
  reconciliation between payroll registers, deposits and filed returns, correction categorization across
  taxable wage, withholding and jurisdiction assignment errors, amended return preparation by agency and
  quarter with interest and penalty computation, corrected wage statement issuance to employees with
  reissue tracking and prior-year adjustment rules, employee repayment of overpaid wages with tax year
  implications and gross versus net recovery, agency notice response, abatement requests and penalty
  waiver arguments, state and local registration corrections and retroactive account setup, root cause
  analysis and control remediation

domain_name: payroll-tax-amendment-correction
api_prefix: "/"

complexity_profile:
  difficulty_level: beyond_expert
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parentage is
  # expressed exclusively through FK body fields, never through nested URL paths.
  # Children are discovered through filtered-list GETs (`GET /discrepancies?correction_case_id=...`).

  state_machine_shape: parallel
  # CorrectionCase carries FOUR independent state dimensions on one row
  # (detection_status x filing_status x statement_status x status); AgencyNotice carries two
  # (response_status x abatement_status). AmendedReturn, CorrectedWageStatement, WageRepayment,
  # AgencyNotice and ControlRemediation are additionally cyclic.

  relationship_patterns:
    - one_to_many          # CorrectionCase -> Discrepancy / AmendedReturn / CorrectedWageStatement
    - self_referential     # AmendedReturn.supersedes_amended_return_id, CorrectedWageStatement.supersedes_statement_id
    - cross_aggregate      # AgencyNotice references a CorrectionCase across the detection aggregate
    - polymorphic          # Discrepancy.employee_id is populated only for employee-scoped categories

  role_model: segregation_of_duties
  # TaxPreparer prepares an AmendedReturn; TaxOfficer signs it, and the signing X-User-ID MUST
  # differ from the preparing X-User-ID. Likewise ControlsAuditor cannot verify a remediation
  # they own.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the filing entity
        constraints: "1..120 chars"
      - name: fein
        type: string
        source: input
        description: federal employer identification number, unique across all Employers
        constraints: "pattern ^[0-9]{2}-[0-9]{7}$; unique"
      - name: deposit_schedule
        type: enum
        source: input
        description: deposit cadence that determines deposit obligation due dates
        constraints: "MONTHLY | SEMIWEEKLY"
      - name: authorization_limit_cents
        type: integer
        source: input
        description: maximum total_exposure_cents a single CorrectionCase may carry when an AmendedReturn is signed
        constraints: ">= 0"
      - name: open_exposure_cents
        type: integer
        source: computed
        description: "SUM(CorrectionCase.total_exposure_cents) over CorrectionCase where employer_id == this.id AND status IN {OPEN, REMEDIATION_PENDING}; recomputed on every write that changes any such case's total_exposure_cents or status"
        default: 0
      - name: open_remediation_count
        type: integer
        source: computed
        description: "COUNT(ControlRemediation) where the remediation's CorrectionCase.employer_id == this.id AND ControlRemediation.status IN {OPEN, SUBMITTED_FOR_VERIFICATION, VERIFICATION_FAILED}"
        default: 0
      - name: granted_abatement_count
        type: integer
        source: computed
        description: "COUNT(AgencyNotice) where employer_id == this.id AND abatement_status IN {GRANTED, PARTIALLY_GRANTED}; read by calculation abatement_penalty_waiver BEFORE the notice under decision is updated"
        default: 0

  - name: TaxAgency
    parent: null
    common_fields: true
    fields:
      - name: agency_code
        type: string
        source: input
        description: short agency identifier, unique across all TaxAgency rows
        constraints: "pattern ^[A-Z0-9-]{3,16}$; unique"
      - name: level
        type: enum
        source: input
        description: government level that determines which registration rules apply
        constraints: "FEDERAL | STATE | LOCAL"
      - name: jurisdiction_code
        type: string
        source: input
        description: jurisdiction this agency taxes; compared against PayrollRegisterLine.work_jurisdiction_code during detection
        constraints: "2..8 upper-case chars"
      - name: interest_rate_bps_annual
        type: integer
        source: input
        description: annual statutory interest rate in basis points used by calculation amendment_interest_accrual
        constraints: "0..10000"
      - name: interest_method
        type: enum
        source: input
        description: selects which variant of calculation amendment_interest_accrual applies to this agency
        constraints: "STATUTORY_DAILY | DEPOSIT_WEIGHTED"
      - name: penalty_multiplier_bps
        type: integer
        source: input
        description: agency-specific scaling applied to the floored gross penalty in calculation amendment_penalty_assessment
        constraints: "0..20000"
      - name: min_days_between_amendments
        type: integer
        source: input
        description: half-open cooling-off buffer in whole days measured from the prior AmendedReturn.submitted_at for the same (employer, agency, tax_year, quarter) slot
        constraints: ">= 0"
      - name: amendment_window_days
        type: integer
        source: input
        description: whole days after the original statutory due date during which an AmendedReturn may be submitted
        constraints: ">= 1"
      - name: requires_registration
        type: boolean
        source: input
        description: when true, an AgencyAccount with registration_status IN {ACTIVE, RETRO_ACTIVE} covering the case period is required before an AmendedReturn may be prepared
        default: false

  - name: AgencyAccount
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer this registration belongs to"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; the agency this registration is with"
      - name: account_number
        type: string
        source: input
        description: agency-assigned account number; may be omitted at creation and supplied at activation
        default: null
      - name: effective_from_tax_year
        type: integer
        source: input
        description: first tax year covered by this registration
        constraints: "2000..2100"
      - name: effective_from_quarter
        type: integer
        source: input
        description: first quarter covered by this registration
        constraints: "1..4"
      - name: effective_to_tax_year
        type: integer
        source: input
        description: last tax year covered; null means open-ended
        default: null
      - name: effective_to_quarter
        type: integer
        source: input
        description: last quarter covered; null means open-ended
        default: null
      - name: retroactive
        type: boolean
        source: input
        description: when true the registration is being created for periods that already closed, and follows the RETRO_PENDING -> RETRO_ACTIVE branch
        default: false
      - name: registration_status
        type: enum
        source: system
        description: registration lifecycle state
        default: PENDING
        constraints: "PENDING | RETRO_PENDING | ACTIVE | RETRO_ACTIVE | CLOSED"
      - name: from_period_ordinal
        type: integer
        source: computed
        description: "effective_from_tax_year * 4 + (effective_from_quarter - 1); the closed lower bound used by the overlap rule"
      - name: to_period_ordinal
        type: integer
        source: computed
        description: "effective_to_tax_year * 4 + (effective_to_quarter - 1) when effective_to_tax_year is non-null, else 999999 (open-ended); the closed upper bound used by the overlap rule"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant at which registration_status entered ACTIVE or RETRO_ACTIVE
        default: null

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer that paid this employee"
      - name: full_name
        type: string
        source: input
        description: employee legal name printed on corrected wage statements
        constraints: "1..120 chars"
      - name: national_id_last4
        type: string
        source: input
        description: last four digits of the taxpayer identification number
        constraints: "pattern ^[0-9]{4}$"
      - name: mailing_state_code
        type: string
        source: input
        description: mailing state used for statement delivery; updated by a reissue that supplies corrected_mailing_state_code
        constraints: "2 upper-case chars"
      - name: active_statement_count
        type: integer
        source: computed
        description: "COUNT(CorrectedWageStatement) where employee_id == this.id AND status IN {ISSUED, ACKNOWLEDGED}"
        default: 0

  - name: PayrollRegisterLine
    parent: null
    common_fields: false
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer whose register this line belongs to"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee this line pays"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; agency this line's wages and withholding were assigned to"
      - name: tax_year
        type: integer
        source: input
        description: tax year of the pay period
        constraints: "2000..2100"
      - name: quarter
        type: integer
        source: input
        description: calendar quarter of the pay period
        constraints: "1..4"
      - name: taxable_wage_cents
        type: integer
        source: input
        description: taxable wages assigned to this agency for this employee and quarter
        constraints: ">= 0"
      - name: withheld_cents
        type: integer
        source: input
        description: tax withheld and remitted to this agency for this employee and quarter
        constraints: ">= 0"
      - name: work_jurisdiction_code
        type: string
        source: input
        description: jurisdiction where the work was actually performed; a mismatch against TaxAgency.jurisdiction_code produces a JURISDICTION_ASSIGNMENT discrepancy
        constraints: "2..8 upper-case chars"
      - name: workday_ratio_bps
        type: integer
        source: input
        description: share of this line's wages that belong to the correct jurisdiction, in basis points; the per-line apportionment factor in calculation jurisdiction_wage_apportionment
        default: 10000
        constraints: "0..10000"
      - name: posting_status
        type: enum
        source: system
        description: register lines are immutable once posted; only POSTED lines enter reconciliation
        default: POSTED
        constraints: "POSTED"

  - name: DepositRecord
    parent: null
    common_fields: false
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer that made the deposit"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; agency the deposit was sent to"
      - name: tax_year
        type: integer
        source: input
        description: tax year of the deposit obligation
        constraints: "2000..2100"
      - name: quarter
        type: integer
        source: input
        description: quarter of the deposit obligation
        constraints: "1..4"
      - name: deposit_due_date
        type: datetime
        source: input
        description: statutory due date of the obligation this deposit satisfies; the per-tranche accrual start used by the DEPOSIT_WEIGHTED interest variant
      - name: deposit_date
        type: datetime
        source: input
        description: date the deposit was actually made; primary sort key of the chronological deposit waterfall
      - name: amount_cents
        type: integer
        source: input
        description: amount actually deposited
        constraints: ">= 0"
      - name: obligation_amount_cents
        type: integer
        source: input
        description: amount that was due on deposit_due_date
        constraints: ">= 0"
      - name: clearing_status
        type: enum
        source: input
        description: only CLEARED deposits enter the reconciliation waterfall
        default: CLEARED
        constraints: "CLEARED | RETURNED"

  - name: FiledReturn
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer that filed the return"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; agency the return was filed with"
      - name: tax_year
        type: integer
        source: input
        description: tax year of the return
        constraints: "2000..2100"
      - name: quarter
        type: integer
        source: input
        description: quarter of the return
        constraints: "1..4"
      - name: form_code
        type: string
        source: input
        description: agency form identifier as originally filed
        constraints: "1..16 chars"
      - name: filed_at
        type: datetime
        source: input
        description: instant the original return was transmitted to the agency
      - name: reported_taxable_wage_cents
        type: integer
        source: input
        description: taxable wages as reported on the original return
        constraints: ">= 0"
      - name: reported_withheld_cents
        type: integer
        source: input
        description: tax withheld as reported on the original return
        constraints: ">= 0"
      - name: original_due_date
        type: datetime
        source: computed
        description: "statutory due date derived from (tax_year, quarter): Q1 -> tax_year-04-30T00:00:00.000Z, Q2 -> tax_year-07-31T00:00:00.000Z, Q3 -> tax_year-10-31T00:00:00.000Z, Q4 -> (tax_year+1)-01-31T00:00:00.000Z"
      - name: status
        type: enum
        source: system
        description: FILED until an AmendedReturn for the same key is ACCEPTED, then AMENDED
        default: FILED
        constraints: "FILED | AMENDED"

  - name: CorrectionCase
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer being corrected"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; agency being corrected"
      - name: tax_year
        type: integer
        source: input
        description: tax year under correction
        constraints: "2000..2100"
      - name: quarter
        type: integer
        source: input
        description: quarter under correction
        constraints: "1..4"
      - name: status
        type: enum
        source: system
        description: overall case lifecycle dimension; independent of the three dimensions below
        default: OPEN
        constraints: "OPEN | REMEDIATION_PENDING | CLOSED"
      - name: detection_status
        type: enum
        source: system
        description: reconciliation dimension, advanced only by POST /correction-cases/{id}/reconcile
        default: NOT_RUN
        constraints: "NOT_RUN | NO_VARIANCE | VARIANCE_FOUND"
      - name: filing_status
        type: enum
        source: system
        description: amended-return dimension, advanced by AmendedReturn transitions and by Discrepancy resolution
        default: FILING_NOT_REQUIRED
        constraints: "FILING_NOT_REQUIRED | FILING_PENDING | FILING_IN_PROGRESS | FILING_COMPLETE"
      - name: statement_status
        type: enum
        source: system
        description: corrected-wage-statement dimension, advanced by CorrectedWageStatement transitions
        default: STMT_NOT_REQUIRED
        constraints: "STMT_NOT_REQUIRED | STMT_PENDING | STMT_ISSUED | STMT_REISSUE_PENDING | STMT_COMPLETE"
      - name: dominant_root_cause_code
        type: enum
        source: computed
        description: "root_cause_code of the Discrepancy carrying the largest ABS(amount_cents) among Discrepancy where correction_case_id == this.id AND status IN {CATEGORIZED, RESOLVED}; tie-break by Discrepancy.created_at ASC; null when that set is empty"
        default: null
        constraints: "RATE_TABLE_STALE | JURISDICTION_MAPPING_ERROR | THIRD_PARTY_FEED_ERROR | MANUAL_ENTRY_ERROR | DEPOSIT_SCHEDULING_ERROR"
      - name: open_discrepancy_count
        type: integer
        source: computed
        description: "COUNT(Discrepancy) where correction_case_id == this.id AND status IN {OPEN, CATEGORIZED}"
        default: 0
      - name: total_exposure_cents
        type: integer
        source: computed
        description: "SUM(AmendedReturn.tax_delta_cents + AmendedReturn.interest_cents + AmendedReturn.penalty_cents) over AmendedReturn where correction_case_id == this.id AND status IN {PREPARED, SIGNED, SUBMITTED, ACCEPTED} MINUS SUM(AgencyNotice.waived_penalty_cents + AgencyNotice.waived_interest_cents) over AgencyNotice where correction_case_id == this.id AND abatement_status IN {GRANTED, PARTIALLY_GRANTED}; floored at 0"
        default: 0
      - name: corrected_wage_base_cents
        type: integer
        source: computed
        description: "SUM(PayrollRegisterLine.taxable_wage_cents) over lines matching (this.employer_id, this.agency_id, this.tax_year, this.quarter) AND posting_status == POSTED PLUS SUM(CorrectedWageStatement.wage_delta_cents) over statements where correction_case_id == this.id AND status IN {ISSUED, ACKNOWLEDGED}"
        default: 0
      - name: repayment_recovered_cents
        type: integer
        source: computed
        description: "SUM(WageRepayment.agency_recoverable_cents) over WageRepayment where correction_case_id == this.id AND status == COLLECTED"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant at which status entered CLOSED
        default: null

  - name: Discrepancy
    parent: null
    common_fields: true
    fields:
      - name: correction_case_id
        type: string
        source: system
        description: "FK -> CorrectionCase.id; the case whose reconcile run emitted this discrepancy"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; populated only for JURISDICTION_ASSIGNMENT discrepancies, null for the three case-level categories"
        default: null
      - name: register_line_id
        type: string
        source: system
        description: "FK -> PayrollRegisterLine.id; populated only for JURISDICTION_ASSIGNMENT discrepancies"
        default: null
      - name: detected_category
        type: enum
        source: system
        description: category assigned by the detection algorithm at emission time; never mutated afterwards
        constraints: "TAXABLE_WAGE | WITHHOLDING | JURISDICTION_ASSIGNMENT | DEPOSIT_SHORTFALL"
      - name: category
        type: enum
        source: input
        description: analyst-confirmed category, set by POST /discrepancies/{id}/categorize; may differ from detected_category
        default: null
        constraints: "TAXABLE_WAGE | WITHHOLDING | JURISDICTION_ASSIGNMENT | DEPOSIT_SHORTFALL"
      - name: root_cause_code
        type: enum
        source: input
        description: root cause chosen by the analyst at categorization; feeds CorrectionCase.dominant_root_cause_code
        default: null
        constraints: "RATE_TABLE_STALE | JURISDICTION_MAPPING_ERROR | THIRD_PARTY_FEED_ERROR | MANUAL_ENTRY_ERROR | DEPOSIT_SCHEDULING_ERROR"
      - name: amount_cents
        type: integer
        source: system
        description: signed variance in cents produced by calculation three_way_variance_detection; positive means the register exceeds what was filed or deposited
      - name: emission_index
        type: integer
        source: system
        description: zero-based position of this discrepancy within its emitting reconcile run, fixed by the pinned detection order
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: discrepancy lifecycle state
        default: OPEN
        constraints: "OPEN | CATEGORIZED | RESOLVED | DISMISSED | SUPERSEDED"
      - name: dismissal_reason
        type: string
        source: input
        description: free text recorded when the analyst dismisses the discrepancy
        default: null
      - name: resolved_amended_return_id
        type: string
        source: system
        description: "FK -> AmendedReturn.id; the accepted amended return that resolved this discrepancy, cleared when that return is voided"
        default: null
      - name: resolved_amount_cents
        type: integer
        source: system
        description: amount_cents frozen at the instant the discrepancy entered RESOLVED
        default: null

  - name: AmendedReturn
    parent: null
    common_fields: true
    fields:
      - name: correction_case_id
        type: string
        source: input
        description: "FK -> CorrectionCase.id; the case this amendment settles"
      - name: supersedes_amended_return_id
        type: string
        source: input
        description: "FK -> AmendedReturn.id; self-referential link to the AGENCY_REJECTED or VOID return this one replaces, null for a first attempt"
        default: null
      - name: form_code
        type: string
        source: input
        description: amended form identifier transmitted to the agency
        constraints: "1..16 chars"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the TaxPreparer that ran POST /amended-returns/{id}/prepare; compared against signed_by_user_id by the segregation-of-duties check
        default: null
      - name: signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the TaxOfficer that ran POST /amended-returns/{id}/sign
        default: null
      - name: accrual_through_date
        type: datetime
        source: input
        description: end date of the interest accrual window, supplied at prepare time
        default: null
      - name: wage_delta_cents
        type: integer
        source: computed
        description: output of calculation amended_return_delta_rollup; taxable-wage correction carried by this amendment
        default: 0
      - name: tax_delta_cents
        type: integer
        source: computed
        description: output of calculation amended_return_delta_rollup; additional tax owed carried by this amendment
        default: 0
      - name: deposit_shortfall_cents
        type: integer
        source: computed
        description: output of calculation amended_return_delta_rollup; unpaid deposit obligation feeding the failure-to-deposit penalty base
        default: 0
      - name: days_late
        type: integer
        source: computed
        description: "whole days from FiledReturn.original_due_date for this case's (agency, tax_year, quarter) to accrual_through_date, floored at 0"
        default: 0
      - name: interest_variant
        type: enum
        source: computed
        description: variant of calculation amendment_interest_accrual selected from the case agency's interest_method
        default: null
        constraints: "STATUTORY_DAILY | DEPOSIT_WEIGHTED"
      - name: interest_cents
        type: integer
        source: computed
        description: output of calculation amendment_interest_accrual
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: output of calculation amendment_penalty_assessment
        default: 0
      - name: voluntary_reduction_applied
        type: boolean
        source: computed
        description: true when no AgencyNotice with the case's (employer, agency, tax_year, quarter) key existed at prepare time, so the voluntary reduction was applied
        default: false
      - name: status
        type: enum
        source: system
        description: amended-return lifecycle state
        default: DRAFT
        constraints: "DRAFT | PREPARED | SIGNED | SUBMITTED | ACCEPTED | AGENCY_REJECTED | VOID"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of transmission; anchor of the half-open cooling-off buffer
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the agency outcome ACCEPTED was recorded
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: agency-supplied reason recorded when the outcome is REJECTED
        default: null
      - name: void_reason
        type: string
        source: input
        description: reason recorded when the return is voided
        default: null

  - name: CorrectedWageStatement
    parent: null
    common_fields: true
    fields:
      - name: correction_case_id
        type: string
        source: input
        description: "FK -> CorrectionCase.id; the case this statement reports"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; recipient of the corrected statement"
      - name: supersedes_statement_id
        type: string
        source: system
        description: "FK -> CorrectedWageStatement.id; self-referential link to the statement this reissue replaces, null for sequence_no 1"
        default: null
      - name: tax_year
        type: integer
        source: input
        description: tax year the statement corrects
        constraints: "2000..2100"
      - name: is_prior_year
        type: boolean
        source: computed
        description: "true when tax_year < the calendar year of the logical clock at creation time; selects the prior-year box policy in calculation statement_box_deltas"
        default: false
      - name: sequence_no
        type: integer
        source: system
        description: reissue sequence; 1 for the first statement and prior.sequence_no + 1 for each successor
        default: 1
      - name: wage_delta_cents
        type: integer
        source: computed
        description: box-1 taxable wage delta from calculation statement_box_deltas
        default: 0
      - name: fica_wage_delta_cents
        type: integer
        source: computed
        description: box-3/box-5 social-insurance wage delta from calculation statement_box_deltas
        default: 0
      - name: withholding_delta_cents
        type: integer
        source: computed
        description: box-2 withholding delta from calculation statement_box_deltas
        default: 0
      - name: delivery_channel
        type: enum
        source: input
        description: channel used for issuance or reissuance
        default: null
        constraints: "MAIL | PORTAL"
      - name: status
        type: enum
        source: system
        description: statement lifecycle state
        default: DRAFT
        constraints: "DRAFT | ISSUED | ACKNOWLEDGED | RETURNED_UNDELIVERABLE | VOIDED"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant the statement entered ISSUED
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant the employee acknowledged receipt
        default: null
      - name: undeliverable_reason
        type: string
        source: input
        description: reason recorded when the statement is reported undeliverable
        default: null

  - name: WageRepayment
    parent: null
    common_fields: true
    fields:
      - name: correction_case_id
        type: string
        source: input
        description: "FK -> CorrectionCase.id; the case that discovered the overpayment"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee who must repay"
      - name: overpaid_gross_cents
        type: integer
        source: input
        description: gross wages overpaid to the employee
        constraints: "> 0"
      - name: overpaid_income_tax_withheld_cents
        type: integer
        source: input
        description: income tax withheld on the overpaid gross wages
        constraints: ">= 0"
      - name: overpaid_fica_withheld_cents
        type: integer
        source: input
        description: social-insurance tax withheld on the overpaid gross wages
        constraints: ">= 0"
      - name: overpayment_tax_year
        type: integer
        source: input
        description: tax year in which the overpaid wages were paid
        constraints: "2000..2100"
      - name: recovery_tax_year
        type: integer
        source: input
        description: tax year in which the repayment is being collected; equality with overpayment_tax_year selects the recovery basis
        constraints: "2000..2100"
      - name: recovery_basis
        type: enum
        source: computed
        description: variant of calculation repayment_recovery_basis selected by comparing recovery_tax_year against overpayment_tax_year
        default: null
        constraints: "SAME_YEAR_NET | PRIOR_YEAR_GROSS"
      - name: employee_due_cents
        type: integer
        source: computed
        description: amount the employee must repay under the selected recovery basis
        default: 0
      - name: agency_recoverable_cents
        type: integer
        source: computed
        description: withholding the employer may reclaim from agencies under the selected recovery basis
        default: 0
      - name: installment_count
        type: integer
        source: input
        description: number of installments the employee agreed to
        default: null
        constraints: "1..24"
      - name: collected_cents
        type: integer
        source: system
        description: amount actually collected from the employee
        default: 0
      - name: status
        type: enum
        source: system
        description: repayment lifecycle state
        default: PROPOSED
        constraints: "PROPOSED | AGREED | COLLECTED | WRITTEN_OFF | CANCELLED"
      - name: write_off_reason
        type: string
        source: input
        description: reason recorded when the balance is written off
        default: null

  - name: AgencyNotice
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer that received the notice"
      - name: agency_id
        type: string
        source: input
        description: "FK -> TaxAgency.id; agency that issued the notice"
      - name: correction_case_id
        type: string
        source: input
        description: "FK -> CorrectionCase.id; case this notice is attached to; null for an unattached notice"
        default: null
      - name: tax_year
        type: integer
        source: input
        description: tax year assessed by the notice
        constraints: "2000..2100"
      - name: quarter
        type: integer
        source: input
        description: quarter assessed by the notice
        constraints: "1..4"
      - name: notice_number
        type: string
        source: input
        description: agency notice identifier, unique per agency_id
        constraints: "1..32 chars; unique per agency_id"
      - name: assessed_tax_cents
        type: integer
        source: input
        description: additional tax the agency asserts is owed
        constraints: ">= 0"
      - name: assessed_penalty_cents
        type: integer
        source: input
        description: penalty the agency asserts is owed
        constraints: ">= 0"
      - name: assessed_interest_cents
        type: integer
        source: input
        description: interest the agency asserts is owed
        constraints: ">= 0"
      - name: response_due_date
        type: datetime
        source: input
        description: agency deadline for the employer response
      - name: response_narrative
        type: string
        source: input
        description: narrative drafted for the agency response
        default: null
      - name: abatement_grounds
        type: enum
        source: input
        description: legal grounds argued for penalty waiver, supplied when the response draft includes an abatement request
        default: null
        constraints: "FIRST_TIME | REASONABLE_CAUSE | STATUTORY_EXCEPTION | AGENCY_ERROR"
      - name: requested_penalty_waiver_cents
        type: integer
        source: input
        description: penalty amount the employer asks the agency to waive
        default: null
        constraints: ">= 0"
      - name: response_status
        type: enum
        source: system
        description: response dimension of the notice
        default: RECEIVED
        constraints: "RECEIVED | RESPONSE_DRAFTED | RESPONDED | INFO_REQUESTED | CLOSED"
      - name: abatement_status
        type: enum
        source: system
        description: abatement dimension of the notice, independent of response_status
        default: NONE
        constraints: "NONE | REQUESTED | GRANTED | PARTIALLY_GRANTED | DENIED"
      - name: abatement_round
        type: integer
        source: system
        description: number of times the response has been drafted; incremented on each draft-response including resubmissions after INFO_REQUESTED
        default: 0
      - name: waiver_pct_bps
        type: integer
        source: computed
        description: waiver percentage in basis points selected by calculation abatement_penalty_waiver from the pre-waiver gross exposure tier
        default: 0
      - name: waived_penalty_cents
        type: integer
        source: computed
        description: penalty waived by the agency decision
        default: 0
      - name: waived_interest_cents
        type: integer
        source: computed
        description: interest waived by the agency decision, including the de-minimis sweep
        default: 0
      - name: net_exposure_cents
        type: integer
        source: computed
        description: "assessed_tax_cents + assessed_penalty_cents + assessed_interest_cents - waived_penalty_cents - waived_interest_cents"
        default: 0
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant the response was transmitted
        default: null
      - name: agency_decision_reference
        type: string
        source: input
        description: agency reference recorded with the outcome
        default: null

  - name: ControlRemediation
    parent: null
    common_fields: true
    fields:
      - name: correction_case_id
        type: string
        source: input
        description: "FK -> CorrectionCase.id; the case whose root cause this remediation addresses"
      - name: root_cause_code
        type: enum
        source: input
        description: root cause this remediation targets
        constraints: "RATE_TABLE_STALE | JURISDICTION_MAPPING_ERROR | THIRD_PARTY_FEED_ERROR | MANUAL_ENTRY_ERROR | DEPOSIT_SCHEDULING_ERROR"
      - name: control_gap_class
        type: enum
        source: input
        description: classification of the failing control; THIRD_PARTY_FAILURE grants the reasonable-cause waiver bonus once the remediation is VERIFIED
        constraints: "PROCESS_CONTROL | SYSTEM_CONTROL | THIRD_PARTY_FAILURE"
      - name: owner_user_id
        type: string
        source: input
        description: X-User-ID accountable for the remediation; the verifying X-User-ID MUST differ from this value
        default: null
      - name: target_date
        type: datetime
        source: input
        description: committed completion date
      - name: evidence_reference
        type: string
        source: input
        description: evidence pointer supplied when verification is requested
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ControlsAuditor that verified the remediation
        default: null
      - name: verification_round
        type: integer
        source: system
        description: number of verification attempts; incremented on every submit-verification
        default: 0
      - name: status
        type: enum
        source: system
        description: remediation lifecycle state
        default: OPEN
        constraints: "OPEN | SUBMITTED_FOR_VERIFICATION | VERIFIED | VERIFICATION_FAILED"
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant the remediation entered VERIFIED
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # AgencyAccount — branching: normal registration vs retroactive back-dated setup
  # ---------------------------------------------------------------------------
  - entity: AgencyAccount
    state_field: registration_status
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: RETRO_PENDING
        trigger: "POST /agency-accounts with retroactive: true (branch selected at creation; the row is written directly in RETRO_PENDING)"
        actor: PlatformAdmin
        preconditions:
          - "no other AgencyAccount for the same (employer_id, agency_id) with registration_status IN {PENDING, RETRO_PENDING, ACTIVE, RETRO_ACTIVE} has a closed-closed period interval intersecting [from_period_ordinal, to_period_ordinal]"
        side_effects:
          - "sets from_period_ordinal and to_period_ordinal from the supplied effective_* fields (to_period_ordinal = 999999 when effective_to_tax_year is null)"
        note: "the retroactive branch and the non-retroactive branch diverge in which activate side-effects fire"
      - from: PENDING
        to: ACTIVE
        trigger: "POST /agency-accounts/{account_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "registration_status == PENDING"
          - "account_number supplied in the request body"
        side_effects:
          - "sets account_number from the request body"
          - "sets activated_at to the current logical-clock instant"
          - "increments AgencyAccount.version by 1"
      - from: RETRO_PENDING
        to: RETRO_ACTIVE
        trigger: "POST /agency-accounts/{account_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "registration_status == RETRO_PENDING"
          - "account_number supplied in the request body"
        side_effects:
          - "sets account_number from the request body"
          - "sets activated_at to the current logical-clock instant"
          - "back-dates coverage: every CorrectionCase for the same (employer_id, agency_id) whose (tax_year, quarter) ordinal falls inside [from_period_ordinal, to_period_ordinal] becomes eligible for amendment preparation without any further action"
          - "increments AgencyAccount.version by 1"
        note: "RETRO_ACTIVE differs from ACTIVE by the back-dating side effect; both satisfy the registration gate"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /agency-accounts with a non-overlapping successor period for the same (employer_id, agency_id) is NOT sufficient; CLOSED is reached only by POST /agency-accounts/{account_id}/activate on a successor account whose from_period_ordinal == this.to_period_ordinal + 1"
        actor: PlatformAdmin
        preconditions:
          - "a successor AgencyAccount for the same (employer_id, agency_id) exists with from_period_ordinal == this.to_period_ordinal + 1"
          - "this.to_period_ordinal != 999999"
        side_effects:
          - "increments AgencyAccount.version by 1"
        note: "adjacency (successor starts exactly one quarter after this account ends) is legal and is what retires the predecessor"

  # ---------------------------------------------------------------------------
  # CorrectionCase dimension 1/4 — detection_status (branching + self-loop)
  # ---------------------------------------------------------------------------
  - entity: CorrectionCase
    state_field: detection_status
    initial_state: NOT_RUN
    terminal_states: [NO_VARIANCE]
    transitions:
      - from: NOT_RUN
        to: NO_VARIANCE
        trigger: "POST /correction-cases/{correction_case_id}/reconcile — calculation three_way_variance_detection emits ZERO discrepancies"
        actor: PayrollAnalyst
        preconditions:
          - "status == OPEN"
          - "exactly one FiledReturn with status IN {FILED, AMENDED} exists for (employer_id, agency_id, tax_year, quarter)"
        side_effects:
          - "filing_status stays FILING_NOT_REQUIRED and statement_status stays STMT_NOT_REQUIRED"
          - "recomputes open_discrepancy_count to 0"
          - "increments CorrectionCase.version by 1"
        note: "empty-result branch: a run that finds nothing is terminal for this dimension and can never be re-run"
      - from: NOT_RUN
        to: VARIANCE_FOUND
        trigger: "POST /correction-cases/{correction_case_id}/reconcile — calculation three_way_variance_detection emits AT LEAST ONE discrepancy"
        actor: PayrollAnalyst
        preconditions:
          - "status == OPEN"
          - "exactly one FiledReturn with status IN {FILED, AMENDED} exists for (employer_id, agency_id, tax_year, quarter)"
        side_effects:
          - "creates one Discrepancy row per emitted variance in status OPEN, with emission_index assigned in the pinned detection order"
          - "sets filing_status to FILING_PENDING when any emitted discrepancy has detected_category IN {TAXABLE_WAGE, WITHHOLDING, DEPOSIT_SHORTFALL}"
          - "sets statement_status to STMT_PENDING when any emitted discrepancy has detected_category == JURISDICTION_ASSIGNMENT (an employee-level reportable-wage reassignment is the only variance that forces a corrected wage statement)"
          - "recomputes open_discrepancy_count"
          - "increments CorrectionCase.version by 1"
      - from: VARIANCE_FOUND
        to: VARIANCE_FOUND
        trigger: "POST /correction-cases/{correction_case_id}/reconcile — re-run after source records changed"
        actor: PayrollAnalyst
        preconditions:
          - "status == OPEN"
          - "no AmendedReturn for this case has status IN {SIGNED, SUBMITTED, ACCEPTED}"
        side_effects:
          - "every Discrepancy for this case with status IN {OPEN, CATEGORIZED} transitions to SUPERSEDED"
          - "creates a fresh Discrepancy set from the current source records with emission_index restarting at 0"
          - "recomputes open_discrepancy_count, dominant_root_cause_code and corrected_wage_base_cents"
          - "increments CorrectionCase.version by 1"
        note: "self-loop: the detection dimension is re-enterable, which is what makes CorrectionCase non-linear"

  # ---------------------------------------------------------------------------
  # CorrectionCase dimension 2/4 — filing_status
  # ---------------------------------------------------------------------------
  - entity: CorrectionCase
    state_field: filing_status
    initial_state: FILING_NOT_REQUIRED
    terminal_states: [FILING_COMPLETE]
    transitions:
      - from: FILING_PENDING
        to: FILING_IN_PROGRESS
        trigger: "POST /amended-returns/{amended_return_id}/prepare (system side effect of the AmendedReturn DRAFT -> PREPARED transition)"
        actor: system
        preconditions:
          - "filing_status == FILING_PENDING"
        side_effects:
          - "recomputes total_exposure_cents from the newly PREPARED AmendedReturn"
          - "recomputes Employer.open_exposure_cents"
          - "increments CorrectionCase.version by 1"
      - from: FILING_IN_PROGRESS
        to: FILING_COMPLETE
        trigger: "system: a Discrepancy for this case transitions CATEGORIZED -> RESOLVED and open_discrepancy_count thereby reaches 0"
        actor: system
        preconditions:
          - "open_discrepancy_count == 0 after the Discrepancy transition"
          - "filing_status == FILING_IN_PROGRESS"
        side_effects:
          - "when statement_status IN {STMT_NOT_REQUIRED, STMT_ISSUED, STMT_COMPLETE}, transitions status OPEN -> REMEDIATION_PENDING (join of the two dimensions)"
          - "increments CorrectionCase.version by 1"
        note: "link 3 of cascade amended_return_acceptance_cascade — caused by the Discrepancy transition, not by the accept call"
      - from: FILING_IN_PROGRESS
        to: FILING_PENDING
        trigger: "POST /amended-returns/{amended_return_id}/void (system side effect of AmendedReturn -> VOID)"
        actor: system
        preconditions:
          - "no other AmendedReturn for this case has status IN {PREPARED, SIGNED, SUBMITTED, ACCEPTED}"
        side_effects:
          - "recomputes total_exposure_cents (the voided return leaves the summed set)"
          - "recomputes Employer.open_exposure_cents"
          - "increments CorrectionCase.version by 1"
        note: "compensating transition of the PREPARED path; conserves Employer.open_exposure_cents"

  # ---------------------------------------------------------------------------
  # CorrectionCase dimension 3/4 — statement_status
  # ---------------------------------------------------------------------------
  - entity: CorrectionCase
    state_field: statement_status
    initial_state: STMT_NOT_REQUIRED
    terminal_states: [STMT_COMPLETE]
    transitions:
      - from: STMT_PENDING
        to: STMT_ISSUED
        trigger: "POST /corrected-wage-statements/{statement_id}/issue (system side effect of the CorrectedWageStatement DRAFT -> ISSUED transition)"
        actor: system
        preconditions:
          - "statement_status == STMT_PENDING"
        side_effects:
          - "recomputes corrected_wage_base_cents"
          - "recomputes Employee.active_statement_count"
          - "increments CorrectionCase.version by 1"
      - from: STMT_ISSUED
        to: STMT_COMPLETE
        trigger: "POST /corrected-wage-statements/{statement_id}/acknowledge (system side effect of ISSUED -> ACKNOWLEDGED) when every CorrectedWageStatement for this case has status == ACKNOWLEDGED"
        actor: system
        preconditions:
          - "COUNT(CorrectedWageStatement where correction_case_id == this.id AND status IN {DRAFT, ISSUED, RETURNED_UNDELIVERABLE}) == 0"
        side_effects:
          - "when status == OPEN AND filing_status IN {FILING_NOT_REQUIRED, FILING_COMPLETE}, transitions status OPEN -> REMEDIATION_PENDING"
          - "increments CorrectionCase.version by 1"
      - from: STMT_ISSUED
        to: STMT_REISSUE_PENDING
        trigger: "system: a successor CorrectedWageStatement is created for this case by POST /corrected-wage-statements/{statement_id}/reissue or by the WageRepayment AGREED -> COLLECTED cascade"
        actor: system
        preconditions:
          - "the predecessor statement has transitioned to VOIDED"
        side_effects:
          - "when status == REMEDIATION_PENDING, reverts status REMEDIATION_PENDING -> OPEN and recomputes Employer.open_exposure_cents"
          - "recomputes corrected_wage_base_cents"
          - "increments CorrectionCase.version by 1"
        note: "link 4 of cascade repayment_collection_cascade"
      - from: STMT_REISSUE_PENDING
        to: STMT_ISSUED
        trigger: "POST /corrected-wage-statements/{statement_id}/issue on the successor statement"
        actor: system
        preconditions:
          - "statement_status == STMT_REISSUE_PENDING"
        side_effects:
          - "recomputes corrected_wage_base_cents"
          - "increments CorrectionCase.version by 1"

  # ---------------------------------------------------------------------------
  # CorrectionCase dimension 4/4 — status (compound: gated by the other three)
  # ---------------------------------------------------------------------------
  - entity: CorrectionCase
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_PENDING
        trigger: "system: filing_status reaches FILING_COMPLETE while statement_status IN {STMT_NOT_REQUIRED, STMT_ISSUED, STMT_COMPLETE}, OR statement_status reaches STMT_ISSUED or STMT_COMPLETE while filing_status IN {FILING_NOT_REQUIRED, FILING_COMPLETE}"
        actor: system
        preconditions:
          - "filing_status IN {FILING_NOT_REQUIRED, FILING_COMPLETE}"
          - "statement_status IN {STMT_NOT_REQUIRED, STMT_ISSUED, STMT_COMPLETE}"
        side_effects:
          - "creates one ControlRemediation in status OPEN with correction_case_id == this.id, root_cause_code == this.dominant_root_cause_code, control_gap_class == PROCESS_CONTROL, owner_user_id == null and target_date == the current logical-clock instant + 30 days, but ONLY when no ControlRemediation for this case already exists"
          - "increments Employer.open_remediation_count by 1 when the remediation was created"
          - "increments CorrectionCase.version by 1"
        note: "link 4 of cascade amended_return_acceptance_cascade — caused by the filing_status transition"
      - from: REMEDIATION_PENDING
        to: OPEN
        trigger: "system: statement_status transitions STMT_ISSUED -> STMT_REISSUE_PENDING"
        actor: system
        preconditions:
          - "status == REMEDIATION_PENDING"
        side_effects:
          - "recomputes Employer.open_exposure_cents (the case re-enters the open set)"
          - "increments CorrectionCase.version by 1"
        note: "compensating reopen; link 5 of cascade repayment_collection_cascade"
      - from: REMEDIATION_PENDING
        to: CLOSED
        trigger: "POST /correction-cases/{correction_case_id}/close"
        actor: TaxOfficer
        preconditions:
          - "status == REMEDIATION_PENDING"
          - "open_discrepancy_count == 0"
          - "every ControlRemediation with correction_case_id == this.id has status == VERIFIED"
          - "every WageRepayment with correction_case_id == this.id has status IN {COLLECTED, WRITTEN_OFF, CANCELLED}"
        side_effects:
          - "sets closed_at to the current logical-clock instant"
          - "recomputes Employer.open_exposure_cents (the case leaves the open set, so open_exposure_cents drops by this case's total_exposure_cents)"
          - "increments CorrectionCase.version by 1"

  # ---------------------------------------------------------------------------
  # Discrepancy — cyclic (assign/unassign is expressed as categorize/resolve/revert)
  # ---------------------------------------------------------------------------
  - entity: Discrepancy
    state_field: status
    initial_state: OPEN
    terminal_states: [DISMISSED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CATEGORIZED
        trigger: "POST /discrepancies/{discrepancy_id}/categorize"
        actor: PayrollAnalyst
        preconditions:
          - "status == OPEN"
          - "the owning CorrectionCase.status == OPEN"
        side_effects:
          - "sets category and root_cause_code from the request body"
          - "recomputes CorrectionCase.dominant_root_cause_code"
          - "increments Discrepancy.version by 1"
      - from: CATEGORIZED
        to: DISMISSED
        trigger: "POST /discrepancies/{discrepancy_id}/dismiss"
        actor: PayrollAnalyst
        preconditions:
          - "status == CATEGORIZED"
          - "the owning CorrectionCase.status == OPEN"
        side_effects:
          - "sets dismissal_reason from the request body"
          - "recomputes CorrectionCase.open_discrepancy_count"
          - "when open_discrepancy_count reaches 0 and filing_status == FILING_IN_PROGRESS, transitions filing_status FILING_IN_PROGRESS -> FILING_COMPLETE"
          - "increments Discrepancy.version by 1"
      - from: CATEGORIZED
        to: RESOLVED
        trigger: "POST /amended-returns/{amended_return_id}/agency-outcome with outcome == ACCEPTED (system side effect of the AmendedReturn SUBMITTED -> ACCEPTED transition)"
        actor: system
        preconditions:
          - "status == CATEGORIZED"
          - "the accepted AmendedReturn.correction_case_id == this.correction_case_id"
        side_effects:
          - "sets resolved_amended_return_id to the accepted return's id and resolved_amount_cents to amount_cents"
          - "recomputes CorrectionCase.open_discrepancy_count; when it reaches 0 this transition itself drives filing_status FILING_IN_PROGRESS -> FILING_COMPLETE"
          - "increments Discrepancy.version by 1"
        note: "link 2 of cascade amended_return_acceptance_cascade"
      - from: RESOLVED
        to: CATEGORIZED
        trigger: "POST /amended-returns/{amended_return_id}/void on the return named in resolved_amended_return_id"
        actor: system
        preconditions:
          - "resolved_amended_return_id == the voided AmendedReturn.id"
        side_effects:
          - "clears resolved_amended_return_id and resolved_amount_cents back to null"
          - "recomputes CorrectionCase.open_discrepancy_count"
          - "increments Discrepancy.version by 1"
        note: "cycle CATEGORIZED -> RESOLVED -> CATEGORIZED; the compensating half of the resolution invariant"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /correction-cases/{correction_case_id}/reconcile re-run (VARIANCE_FOUND -> VARIANCE_FOUND self-loop)"
        actor: system
        preconditions:
          - "status IN {OPEN, CATEGORIZED}"
        side_effects:
          - "recomputes CorrectionCase.open_discrepancy_count and dominant_root_cause_code"
          - "increments Discrepancy.version by 1"
      - from: CATEGORIZED
        to: SUPERSEDED
        trigger: "POST /correction-cases/{correction_case_id}/reconcile re-run (VARIANCE_FOUND -> VARIANCE_FOUND self-loop)"
        actor: system
        preconditions:
          - "status IN {OPEN, CATEGORIZED}"
        side_effects:
          - "recomputes CorrectionCase.open_discrepancy_count and dominant_root_cause_code"
          - "increments Discrepancy.version by 1"

  # ---------------------------------------------------------------------------
  # AmendedReturn — cyclic (AGENCY_REJECTED -> DRAFT, SIGNED -> DRAFT) + branching
  # ---------------------------------------------------------------------------
  - entity: AmendedReturn
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, VOID]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /amended-returns/{amended_return_id}/prepare"
        actor: TaxPreparer
        preconditions:
          - "status == DRAFT"
          - "every Discrepancy for the case with status == OPEN has been categorized or dismissed, i.e. COUNT(Discrepancy where correction_case_id == case.id AND status == OPEN) == 0"
          - "COUNT(Discrepancy where correction_case_id == case.id AND status == CATEGORIZED) > 0"
          - "when the case agency's requires_registration is true, an AgencyAccount for (case.employer_id, case.agency_id) exists with registration_status IN {ACTIVE, RETRO_ACTIVE} and from_period_ordinal <= case period ordinal <= to_period_ordinal"
          - "accrual_through_date >= the case's FiledReturn.original_due_date and accrual_through_date <= the current logical-clock instant"
        side_effects:
          - "runs calculation amended_return_delta_rollup and writes wage_delta_cents, tax_delta_cents, deposit_shortfall_cents"
          - "computes days_late from the FiledReturn.original_due_date to accrual_through_date"
          - "sets interest_variant from the case agency's interest_method and runs calculation amendment_interest_accrual, writing interest_cents"
          - "runs calculation amendment_penalty_assessment and writes penalty_cents and voluntary_reduction_applied"
          - "sets prepared_by_user_id to the acting X-User-ID"
          - "transitions CorrectionCase.filing_status FILING_PENDING -> FILING_IN_PROGRESS"
          - "recomputes CorrectionCase.total_exposure_cents and Employer.open_exposure_cents"
          - "increments AmendedReturn.version by 1"
      - from: PREPARED
        to: SIGNED
        trigger: "POST /amended-returns/{amended_return_id}/sign"
        actor: TaxOfficer
        preconditions:
          - "status == PREPARED"
          - "the acting X-User-ID != prepared_by_user_id"
          - "CorrectionCase.total_exposure_cents <= Employer.authorization_limit_cents"
        side_effects:
          - "sets signed_by_user_id to the acting X-User-ID"
          - "increments AmendedReturn.version by 1"
      - from: SIGNED
        to: DRAFT
        trigger: "POST /amended-returns/{amended_return_id}/prepare (re-preparation recalls the signature)"
        actor: TaxPreparer
        preconditions:
          - "status == SIGNED"
        side_effects:
          - "clears signed_by_user_id back to null"
          - "clears wage_delta_cents, tax_delta_cents, deposit_shortfall_cents, interest_cents and penalty_cents back to 0 before the recomputation runs"
          - "recomputes CorrectionCase.total_exposure_cents and Employer.open_exposure_cents"
          - "increments AmendedReturn.version by 1"
        note: "cycle SIGNED -> DRAFT -> PREPARED -> SIGNED; a re-prepare always voids the prior signature so segregation of duties cannot be laundered"
      - from: SIGNED
        to: SUBMITTED
        trigger: "POST /amended-returns/{amended_return_id}/submit"
        actor: TaxOfficer
        preconditions:
          - "status == SIGNED"
          - "the current logical-clock instant is at or before FiledReturn.original_due_date + agency.amendment_window_days days"
          - "either no prior AmendedReturn exists for the same (employer, agency, tax_year, quarter) with status IN {SUBMITTED, ACCEPTED, AGENCY_REJECTED}, or the whole-day count from the latest such prior return's submitted_at to the current logical-clock instant is >= agency.min_days_between_amendments"
        side_effects:
          - "sets submitted_at to the current logical-clock instant"
          - "increments AmendedReturn.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /amended-returns/{amended_return_id}/agency-outcome with outcome == ACCEPTED"
        actor: TaxOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets accepted_at to the current logical-clock instant and freezes interest_cents and penalty_cents"
          - "sets the case's FiledReturn.status FILED -> AMENDED"
          - "every Discrepancy for the case with status == CATEGORIZED transitions CATEGORIZED -> RESOLVED (link 2); that Discrepancy transition itself drives CorrectionCase.filing_status FILING_IN_PROGRESS -> FILING_COMPLETE (link 3); that filing_status transition itself drives CorrectionCase.status OPEN -> REMEDIATION_PENDING and auto-creates a ControlRemediation (link 4); that creation itself increments Employer.open_remediation_count (link 5)"
          - "increments AmendedReturn.version by 1"
        note: "head of cascade amended_return_acceptance_cascade (depth 5)"
      - from: SUBMITTED
        to: AGENCY_REJECTED
        trigger: "POST /amended-returns/{amended_return_id}/agency-outcome with outcome == REJECTED"
        actor: TaxOfficer
        preconditions:
          - "status == SUBMITTED"
          - "rejection_reason supplied in the request body"
        side_effects:
          - "sets rejection_reason from the request body"
          - "no Discrepancy is resolved and CorrectionCase.filing_status stays FILING_IN_PROGRESS"
          - "increments AmendedReturn.version by 1"
        note: "divergent branch: ACCEPTED fires the five-link cascade, REJECTED fires none of it"
      - from: AGENCY_REJECTED
        to: DRAFT
        trigger: "POST /amended-returns/{amended_return_id}/prepare on the rejected return"
        actor: TaxPreparer
        preconditions:
          - "status == AGENCY_REJECTED"
        side_effects:
          - "clears signed_by_user_id, submitted_at and rejection_reason back to null"
          - "increments AmendedReturn.version by 1"
        note: "cycle AGENCY_REJECTED -> DRAFT -> PREPARED -> SIGNED -> SUBMITTED"
      - from: PREPARED
        to: VOID
        trigger: "POST /amended-returns/{amended_return_id}/void"
        actor: TaxPreparer
        preconditions:
          - "status IN {DRAFT, PREPARED, AGENCY_REJECTED}"
          - "void_reason supplied in the request body"
        side_effects:
          - "sets void_reason from the request body"
          - "every Discrepancy whose resolved_amended_return_id == this.id transitions RESOLVED -> CATEGORIZED"
          - "recomputes CorrectionCase.total_exposure_cents (this return leaves the summed set) and Employer.open_exposure_cents"
          - "transitions CorrectionCase.filing_status FILING_IN_PROGRESS -> FILING_PENDING when no other AmendedReturn for the case is in {PREPARED, SIGNED, SUBMITTED, ACCEPTED}"
          - "increments AmendedReturn.version by 1"
        note: "compensating action for prepare; conserves Employer.open_exposure_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /amended-returns/{amended_return_id}/void"
        actor: TaxPreparer
        preconditions:
          - "status IN {DRAFT, PREPARED, AGENCY_REJECTED}"
          - "void_reason supplied in the request body"
        side_effects:
          - "sets void_reason from the request body"
          - "increments AmendedReturn.version by 1"
      - from: AGENCY_REJECTED
        to: VOID
        trigger: "POST /amended-returns/{amended_return_id}/void"
        actor: TaxPreparer
        preconditions:
          - "status IN {DRAFT, PREPARED, AGENCY_REJECTED}"
          - "void_reason supplied in the request body"
        side_effects:
          - "sets void_reason from the request body"
          - "recomputes CorrectionCase.total_exposure_cents and Employer.open_exposure_cents"
          - "increments AmendedReturn.version by 1"

  # ---------------------------------------------------------------------------
  # FiledReturn — single system transition driven by amendment acceptance
  # ---------------------------------------------------------------------------
  - entity: FiledReturn
    state_field: status
    initial_state: FILED
    terminal_states: [AMENDED]
    transitions:
      - from: FILED
        to: AMENDED
        trigger: "POST /amended-returns/{amended_return_id}/agency-outcome with outcome == ACCEPTED"
        actor: system
        preconditions:
          - "status == FILED"
          - "employer_id, agency_id, tax_year and quarter all equal the accepted AmendedReturn's CorrectionCase keys"
        side_effects:
          - "increments FiledReturn.version by 1"

  # ---------------------------------------------------------------------------
  # CorrectedWageStatement — cyclic via undeliverable/reissue with supersede chain
  # ---------------------------------------------------------------------------
  - entity: CorrectedWageStatement
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /corrected-wage-statements/{statement_id}/issue"
        actor: PayrollAnalyst
        preconditions:
          - "status == DRAFT"
          - "wage_delta_cents != 0 OR fica_wage_delta_cents != 0 OR withholding_delta_cents != 0"
          - "every WageRepayment with correction_case_id == this.correction_case_id has status IN {COLLECTED, WRITTEN_OFF, CANCELLED}"
          - "when is_prior_year is true, the current logical-clock instant is at or before the agency's amendment_window_days boundary measured from the case FiledReturn.original_due_date"
        side_effects:
          - "sets issued_at and delivery_channel"
          - "transitions CorrectionCase.statement_status STMT_PENDING -> STMT_ISSUED, or STMT_REISSUE_PENDING -> STMT_ISSUED for a successor statement"
          - "recomputes Employee.active_statement_count and CorrectionCase.corrected_wage_base_cents"
          - "increments CorrectedWageStatement.version by 1"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /corrected-wage-statements/{statement_id}/acknowledge"
        actor: EmployeeSelfService
        preconditions:
          - "status == ISSUED"
          - "the acting X-User-ID == employee_id"
        side_effects:
          - "sets acknowledged_at"
          - "when no statement for the case remains in {DRAFT, ISSUED, RETURNED_UNDELIVERABLE}, transitions CorrectionCase.statement_status STMT_ISSUED -> STMT_COMPLETE"
          - "increments CorrectedWageStatement.version by 1"
      - from: ISSUED
        to: RETURNED_UNDELIVERABLE
        trigger: "POST /corrected-wage-statements/{statement_id}/report-undeliverable"
        actor: PayrollAnalyst
        preconditions:
          - "status == ISSUED"
          - "delivery_channel == MAIL"
        side_effects:
          - "sets undeliverable_reason"
          - "recomputes Employee.active_statement_count (this statement leaves the counted set)"
          - "recomputes CorrectionCase.corrected_wage_base_cents"
          - "increments CorrectedWageStatement.version by 1"
      - from: RETURNED_UNDELIVERABLE
        to: VOIDED
        trigger: "POST /corrected-wage-statements/{statement_id}/reissue"
        actor: PayrollAnalyst
        preconditions:
          - "status IN {ISSUED, RETURNED_UNDELIVERABLE}"
          - "expected_statement_version equals this row's current version"
        side_effects:
          - "creates a successor CorrectedWageStatement in status DRAFT with supersedes_statement_id == this.id, sequence_no == this.sequence_no + 1 and the same correction_case_id, employee_id and tax_year"
          - "when corrected_mailing_state_code is supplied, updates Employee.mailing_state_code"
          - "transitions CorrectionCase.statement_status STMT_ISSUED -> STMT_REISSUE_PENDING"
          - "increments CorrectedWageStatement.version by 1"
        note: "cycle ISSUED -> RETURNED_UNDELIVERABLE -> VOIDED -> (successor) DRAFT -> ISSUED, tracked through the self-referential supersedes_statement_id chain"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /corrected-wage-statements/{statement_id}/reissue, or the WageRepayment AGREED -> COLLECTED cascade when this statement covers the repayment's overpayment_tax_year"
        actor: PayrollAnalyst
        preconditions:
          - "status IN {ISSUED, RETURNED_UNDELIVERABLE}"
        side_effects:
          - "creates a successor CorrectedWageStatement in status DRAFT with supersedes_statement_id == this.id and sequence_no == this.sequence_no + 1 (link 2 of cascade repayment_collection_cascade)"
          - "recomputes Employee.active_statement_count and CorrectionCase.corrected_wage_base_cents (link 3)"
          - "transitions CorrectionCase.statement_status STMT_ISSUED -> STMT_REISSUE_PENDING (link 4)"
          - "increments CorrectedWageStatement.version by 1"

  # ---------------------------------------------------------------------------
  # WageRepayment — cyclic (AGREED -> PROPOSED) + branching terminal outcomes
  # ---------------------------------------------------------------------------
  - entity: WageRepayment
    state_field: status
    initial_state: PROPOSED
    terminal_states: [COLLECTED, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: PROPOSED
        to: AGREED
        trigger: "POST /wage-repayments/{wage_repayment_id}/agree"
        actor: EmployeeSelfService
        preconditions:
          - "status == PROPOSED"
          - "the acting X-User-ID == employee_id"
          - "the owning CorrectionCase.status IN {OPEN, REMEDIATION_PENDING}"
        side_effects:
          - "sets installment_count from the request body"
          - "increments WageRepayment.version by 1"
      - from: AGREED
        to: PROPOSED
        trigger: "POST /wage-repayments/{wage_repayment_id}/renegotiate"
        actor: PayrollAnalyst
        preconditions:
          - "status == AGREED"
          - "collected_cents == 0"
        side_effects:
          - "clears installment_count back to null"
          - "increments WageRepayment.version by 1"
        note: "cycle PROPOSED -> AGREED -> PROPOSED"
      - from: AGREED
        to: COLLECTED
        trigger: "POST /wage-repayments/{wage_repayment_id}/collect"
        actor: PayrollAnalyst
        preconditions:
          - "status == AGREED"
          - "collected_cents in the request body == employee_due_cents"
        side_effects:
          - "sets collected_cents from the request body"
          - "recomputes CorrectionCase.repayment_recovered_cents"
          - "every CorrectedWageStatement for the case whose tax_year == overpayment_tax_year and whose status IN {ISSUED, ACKNOWLEDGED} transitions to VOIDED and spawns a DRAFT successor (link 2); the successor creation recomputes Employee.active_statement_count and CorrectionCase.corrected_wage_base_cents (link 3) and flips CorrectionCase.statement_status STMT_ISSUED -> STMT_REISSUE_PENDING (link 4); that flip reverts CorrectionCase.status REMEDIATION_PENDING -> OPEN (link 5)"
          - "increments WageRepayment.version by 1"
        note: "head of cascade repayment_collection_cascade (depth 5)"
      - from: AGREED
        to: WRITTEN_OFF
        trigger: "POST /wage-repayments/{wage_repayment_id}/write-off"
        actor: TaxOfficer
        preconditions:
          - "status == AGREED"
          - "write_off_reason supplied in the request body"
        side_effects:
          - "sets write_off_reason; collected_cents stays at its current value"
          - "no CorrectedWageStatement is voided and CorrectionCase.corrected_wage_base_cents is unchanged"
          - "increments WageRepayment.version by 1"
        note: "divergent branch: COLLECTED fires the five-link statement cascade, WRITTEN_OFF fires none of it"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /wage-repayments/{wage_repayment_id}/write-off"
        actor: TaxOfficer
        preconditions:
          - "status == PROPOSED"
          - "write_off_reason supplied in the request body"
        side_effects:
          - "sets write_off_reason"
          - "increments WageRepayment.version by 1"
        note: "a write-off requested before the employee agrees cancels the proposal instead of writing off a balance"

  # ---------------------------------------------------------------------------
  # AgencyNotice dimension 1/2 — response_status (cyclic via INFO_REQUESTED)
  # ---------------------------------------------------------------------------
  - entity: AgencyNotice
    state_field: response_status
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: RESPONSE_DRAFTED
        trigger: "POST /agency-notices/{agency_notice_id}/draft-response"
        actor: TaxPreparer
        preconditions:
          - "response_status IN {RECEIVED, INFO_REQUESTED}"
          - "the current logical-clock instant is at or before response_due_date"
          - "when requested_penalty_waiver_cents is supplied it is <= assessed_penalty_cents"
        side_effects:
          - "sets response_narrative, abatement_grounds and requested_penalty_waiver_cents"
          - "increments abatement_round by 1"
          - "sets abatement_status NONE -> REQUESTED when abatement_grounds is supplied"
          - "increments AgencyNotice.version by 1"
      - from: RESPONSE_DRAFTED
        to: RESPONDED
        trigger: "POST /agency-notices/{agency_notice_id}/respond"
        actor: TaxOfficer
        preconditions:
          - "response_status == RESPONSE_DRAFTED"
        side_effects:
          - "sets responded_at to the current logical-clock instant"
          - "increments AgencyNotice.version by 1"
      - from: RESPONDED
        to: INFO_REQUESTED
        trigger: "POST /agency-notices/{agency_notice_id}/request-info"
        actor: TaxOfficer
        preconditions:
          - "response_status == RESPONDED"
          - "abatement_status == REQUESTED"
        side_effects:
          - "clears responded_at back to null"
          - "increments AgencyNotice.version by 1"
      - from: INFO_REQUESTED
        to: RESPONSE_DRAFTED
        trigger: "POST /agency-notices/{agency_notice_id}/draft-response (supplemental round)"
        actor: TaxPreparer
        preconditions:
          - "response_status IN {RECEIVED, INFO_REQUESTED}"
        side_effects:
          - "overwrites response_narrative and increments abatement_round by 1"
          - "increments AgencyNotice.version by 1"
        note: "cycle RESPONDED -> INFO_REQUESTED -> RESPONSE_DRAFTED -> RESPONDED; abatement_round counts the rounds"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /agency-notices/{agency_notice_id}/record-outcome"
        actor: TaxOfficer
        preconditions:
          - "response_status == RESPONDED"
        side_effects:
          - "runs calculation abatement_penalty_waiver and writes waiver_pct_bps, waived_penalty_cents, waived_interest_cents and net_exposure_cents"
          - "sets abatement_status per the outcome: ABATED_FULL -> GRANTED, ABATED_PARTIAL -> PARTIALLY_GRANTED, UPHELD -> DENIED (or leaves NONE when no abatement was requested)"
          - "recomputes CorrectionCase.total_exposure_cents when correction_case_id is non-null, then recomputes Employer.open_exposure_cents"
          - "increments AgencyNotice.version by 1"

  # ---------------------------------------------------------------------------
  # AgencyNotice dimension 2/2 — abatement_status (independent axis)
  # ---------------------------------------------------------------------------
  - entity: AgencyNotice
    state_field: abatement_status
    initial_state: NONE
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /agency-notices/{agency_notice_id}/draft-response with abatement_grounds supplied"
        actor: TaxPreparer
        preconditions:
          - "abatement_status == NONE"
          - "abatement_grounds supplied in the request body"
        side_effects:
          - "increments AgencyNotice.version by 1"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /agency-notices/{agency_notice_id}/record-outcome with outcome == ABATED_FULL"
        actor: TaxOfficer
        preconditions:
          - "abatement_status == REQUESTED"
          - "response_status == RESPONDED"
        side_effects:
          - "waiver percentages are taken from calculation abatement_penalty_waiver including the de-minimis sweep"
          - "increments Employer.granted_abatement_count by 1"
          - "increments AgencyNotice.version by 1"
      - from: REQUESTED
        to: PARTIALLY_GRANTED
        trigger: "POST /agency-notices/{agency_notice_id}/record-outcome with outcome == ABATED_PARTIAL"
        actor: TaxOfficer
        preconditions:
          - "abatement_status == REQUESTED"
          - "response_status == RESPONDED"
        side_effects:
          - "waived_penalty_cents = MIN(calculation output, requested_penalty_waiver_cents); the de-minimis sweep is NOT applied on this branch"
          - "increments Employer.granted_abatement_count by 1"
          - "increments AgencyNotice.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /agency-notices/{agency_notice_id}/record-outcome with outcome == UPHELD"
        actor: TaxOfficer
        preconditions:
          - "abatement_status == REQUESTED"
          - "response_status == RESPONDED"
        side_effects:
          - "waiver_pct_bps, waived_penalty_cents and waived_interest_cents all stay 0 and net_exposure_cents equals the full assessment"
          - "Employer.granted_abatement_count is unchanged"
          - "increments AgencyNotice.version by 1"

  # ---------------------------------------------------------------------------
  # ControlRemediation — cyclic (VERIFICATION_FAILED -> OPEN)
  # ---------------------------------------------------------------------------
  - entity: ControlRemediation
    state_field: status
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED_FOR_VERIFICATION
        trigger: "POST /control-remediations/{control_remediation_id}/submit-verification"
        actor: ControlsAuditor
        preconditions:
          - "status IN {OPEN, VERIFICATION_FAILED}"
          - "owner_user_id is non-null"
          - "evidence_reference supplied in the request body"
        side_effects:
          - "sets evidence_reference and increments verification_round by 1"
          - "increments ControlRemediation.version by 1"
      - from: VERIFICATION_FAILED
        to: SUBMITTED_FOR_VERIFICATION
        trigger: "POST /control-remediations/{control_remediation_id}/submit-verification"
        actor: ControlsAuditor
        preconditions:
          - "status IN {OPEN, VERIFICATION_FAILED}"
          - "evidence_reference supplied in the request body"
        side_effects:
          - "sets evidence_reference and increments verification_round by 1"
          - "increments ControlRemediation.version by 1"
        note: "cycle OPEN -> SUBMITTED_FOR_VERIFICATION -> VERIFICATION_FAILED -> SUBMITTED_FOR_VERIFICATION -> VERIFIED"
      - from: OPEN
        to: OPEN
        trigger: "POST /control-remediations/{control_remediation_id}/assign"
        actor: ControlsAuditor
        preconditions:
          - "status IN {OPEN, VERIFICATION_FAILED}"
        side_effects:
          - "sets owner_user_id from the request body (a remediation auto-created by the CorrectionCase join starts with owner_user_id null and therefore cannot reach SUBMITTED_FOR_VERIFICATION until this runs)"
          - "replaces target_date when supplied"
          - "increments ControlRemediation.version by 1"
        note: "self-loop on OPEN: assignment moves fields only, and is what unlocks the OPEN -> SUBMITTED_FOR_VERIFICATION precondition"
      - from: SUBMITTED_FOR_VERIFICATION
        to: VERIFIED
        trigger: "POST /control-remediations/{control_remediation_id}/verify with passed == true"
        actor: ControlsAuditor
        preconditions:
          - "status == SUBMITTED_FOR_VERIFICATION"
          - "the acting X-User-ID != owner_user_id"
        side_effects:
          - "sets verified_by_user_id and verified_at"
          - "recomputes Employer.open_remediation_count (this remediation leaves the counted set)"
          - "unlocks CorrectionCase REMEDIATION_PENDING -> CLOSED once every remediation for the case is VERIFIED"
          - "increments ControlRemediation.version by 1"
      - from: SUBMITTED_FOR_VERIFICATION
        to: VERIFICATION_FAILED
        trigger: "POST /control-remediations/{control_remediation_id}/verify with passed == false"
        actor: ControlsAuditor
        preconditions:
          - "status == SUBMITTED_FOR_VERIFICATION"
          - "the acting X-User-ID != owner_user_id"
        side_effects:
          - "leaves verified_by_user_id null and verified_at null"
          - "Employer.open_remediation_count is unchanged (the remediation stays in the counted set)"
          - "increments ControlRemediation.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
#        write-write resolution mechanism in this scaffold)
# =============================================================================
concurrency_rules:
  - rule_id: amended-return-create-stale-case
    parent_entity: CorrectionCase
    write_endpoint: "POST /amended-returns"
    occ_field: "expected_correction_case_version"
    description: |
      Creating an AmendedReturn against a CorrectionCase whose version has advanced
      since the client last observed it is rejected with a stale-version error. This
      captures the case where the case's discrepancy set was re-derived by a
      reconcile re-run (VARIANCE_FOUND -> VARIANCE_FOUND) after the client read the
      case, so the amendment the client is about to create would legitimately
      supersede an amendment built on a discrepancy set that no longer exists.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: statement-reissue-stale-statement
    parent_entity: CorrectedWageStatement
    write_endpoint: "POST /corrected-wage-statements/{statement_id}/reissue"
    occ_field: "expected_statement_version"
    description: |
      Reissuing a CorrectedWageStatement whose version has advanced since the client
      last observed it is rejected with a stale-version error. A reissue legitimately
      supersedes the statement it names, so a client acting on a stale view would
      spawn a second successor in the supersede chain for the same predecessor and
      double-count wage_delta_cents in CorrectionCase.corrected_wage_base_cents.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: three_way_variance_detection
    trigger: "POST /correction-cases/{correction_case_id}/reconcile (CorrectionCase.detection_status NOT_RUN -> NO_VARIANCE | NOT_RUN -> VARIANCE_FOUND | VARIANCE_FOUND -> VARIANCE_FOUND)"
    algorithm: chronological
    formula: |
      scope = (case.employer_id, case.agency_id, case.tax_year, case.quarter)
      agency = TaxAgency[case.agency_id]

      lines = PayrollRegisterLine WHERE employer_id/employee-agnostic scope matches scope
                                   AND posting_status == POSTED
              ORDER BY created_at ASC                      # pinned; no id ever participates
      register_wage_cents     = SUM(lines.taxable_wage_cents)
      register_withheld_cents = SUM(lines.withheld_cents)

      ret = the single FiledReturn WHERE scope matches AND status IN {FILED, AMENDED}

      obligations = DepositRecord WHERE scope matches AND clearing_status == CLEARED
                    ORDER BY deposit_due_date ASC, created_at ASC          # obligation fill order
      deposits    = the same DepositRecord rows
                    ORDER BY deposit_date ASC, created_at ASC              # chronological cash order
      total_obligation_cents = SUM(obligations.obligation_amount_cents)

      # chronological waterfall: walk cash in deposit_date order, fill obligations in
      # deposit_due_date order, cap each obligation at its obligation_amount_cents,
      # spill any leftover cash into the next unsatisfied obligation.
      remaining = [o.obligation_amount_cents for o in obligations]
      deposits_applied_cents = 0
      for d in deposits:
          cash = d.amount_cents
          for k in range(len(remaining)):
              if cash == 0: break
              take = MIN(cash, remaining[k])
              remaining[k] -= take
              cash -= take
              deposits_applied_cents += take
          # cash left over after every obligation is full is discarded (over-deposit)

      emitted = []                                          # emission order is PINNED below
      IF register_wage_cents != ret.reported_taxable_wage_cents:
          emitted += (TAXABLE_WAGE,
                      amount_cents = register_wage_cents - ret.reported_taxable_wage_cents,
                      employee_id = null, register_line_id = null)
      IF register_withheld_cents != ret.reported_withheld_cents:
          emitted += (WITHHOLDING,
                      amount_cents = register_withheld_cents - ret.reported_withheld_cents,
                      employee_id = null, register_line_id = null)
      FOR line IN lines (created_at ASC):                   # per-line, in the pinned order
          IF line.work_jurisdiction_code != agency.jurisdiction_code:
              emitted += (JURISDICTION_ASSIGNMENT,
                          amount_cents = jurisdiction_wage_apportionment(line),
                          employee_id = line.employee_id, register_line_id = line.id)
      IF deposits_applied_cents < total_obligation_cents:
          emitted += (DEPOSIT_SHORTFALL,
                      amount_cents = total_obligation_cents - deposits_applied_cents,
                      employee_id = null, register_line_id = null)

      Discrepancy.emission_index = the 0-based position in `emitted`
      Discrepancy.detected_category = the emitted category
      RESULT: len(emitted) == 0  ->  detection_status = NO_VARIANCE
              len(emitted) >  0  ->  detection_status = VARIANCE_FOUND
    input_set: |
      Only PayrollRegisterLine rows with posting_status == POSTED and DepositRecord rows with
      clearing_status == CLEARED enter the computation. RETURNED deposits are excluded entirely
      (they contribute neither cash nor obligation). Exactly one FiledReturn with status IN
      {FILED, AMENDED} must exist for the scope; zero -> ERR_NO_FILED_RETURN_FOR_PERIOD.
      Discrepancy rows previously emitted for the case are NOT inputs; a re-run supersedes them.
    constants:
      EMISSION_CATEGORY_ORDER: ["TAXABLE_WAGE", "WITHHOLDING", "JURISDICTION_ASSIGNMENT", "DEPOSIT_SHORTFALL"]
    precision: "whole cents; no rounding occurs in this calculation except inside jurisdiction_wage_apportionment"

  - name: jurisdiction_wage_apportionment
    trigger: "invoked per PayrollRegisterLine by three_way_variance_detection, and again by amended_return_delta_rollup at POST /amended-returns/{amended_return_id}/prepare"
    algorithm: weighted_scoring
    formula: |
      # PER-LINE rounding, THEN summation. This order is PINNED.
      per_line_cents(line) = ROUND_HALF_UP(line.taxable_wage_cents * line.workday_ratio_bps / 10000)

      jurisdiction_removal_cents = SUM over the selected lines of per_line_cents(line)

      # FORBIDDEN alternative (produces different cents and MUST NOT be implemented):
      #   ROUND_HALF_UP(SUM(line.taxable_wage_cents) * workday_ratio_bps / 10000)
      # Worked divergence: three lines of 100001 cents at 5000 bps
      #   pinned  : ROUND_HALF_UP(50000.5) = 50001 per line, summed = 150003
      #   forbidden: ROUND_HALF_UP(300003 * 0.5) = ROUND_HALF_UP(150001.5) = 150002
    input_set: |
      For detection: the single line being examined. For the rollup: every PayrollRegisterLine named
      by a Discrepancy with correction_case_id == case.id, category == JURISDICTION_ASSIGNMENT and
      status == CATEGORIZED, iterated in Discrepancy.emission_index ASC order.
    constants:
      BPS_DENOMINATOR: 10000
    precision: "2 decimal places at the cent level, ROUND_HALF_UP, applied ONCE PER LINE before summation"

  - name: amended_return_delta_rollup
    trigger: "POST /amended-returns/{amended_return_id}/prepare (AmendedReturn DRAFT -> PREPARED, AGENCY_REJECTED -> DRAFT -> PREPARED, SIGNED -> DRAFT -> PREPARED)"
    algorithm: aggregation
    formula: |
      C = Discrepancy WHERE correction_case_id == return.correction_case_id AND status == CATEGORIZED
          ORDER BY emission_index ASC

      taxable_wage_delta_cents   = SUM(d.amount_cents for d in C where d.category == TAXABLE_WAGE)
      jurisdiction_removal_cents = SUM(jurisdiction_wage_apportionment(PayrollRegisterLine[d.register_line_id])
                                       for d in C where d.category == JURISDICTION_ASSIGNMENT)

      wage_delta_cents         = taxable_wage_delta_cents - jurisdiction_removal_cents
      tax_delta_cents          = SUM(d.amount_cents for d in C where d.category == WITHHOLDING)
      deposit_shortfall_cents  = SUM(d.amount_cents for d in C where d.category == DEPOSIT_SHORTFALL)
      days_late                = MAX(0, WHOLE_DAYS(FiledReturn.original_due_date -> return.accrual_through_date))
    input_set: |
      Only Discrepancy rows with status == CATEGORIZED are summed. OPEN rows block preparation
      (ERR_UNCATEGORIZED_DISCREPANCIES); DISMISSED, SUPERSEDED and RESOLVED rows are excluded.
      Note that category (analyst-confirmed) is used, never detected_category.
    constants:
      DAYS_PER_YEAR: 365
    precision: "whole cents; the only rounding is the per-line ROUND_HALF_UP inside jurisdiction_wage_apportionment"

  - name: amendment_interest_accrual
    trigger: "POST /amended-returns/{amended_return_id}/prepare (AmendedReturn DRAFT -> PREPARED); the value is frozen when the AmendedReturn transitions SUBMITTED -> ACCEPTED"
    algorithm: chronological
    formula: |
      agency        = TaxAgency[case.agency_id]
      rate          = agency.interest_rate_bps_annual / 10000
      through       = return.accrual_through_date
      interest_variant = agency.interest_method

      # ---- variant STATUTORY_DAILY -------------------------------------------
      days_late = MAX(0, WHOLE_DAYS(FiledReturn.original_due_date -> through))
      interest_cents = ROUND_HALF_UP(return.tax_delta_cents * rate * days_late / 365)

      # ---- variant DEPOSIT_WEIGHTED ------------------------------------------
      obligations = DepositRecord WHERE (case.employer_id, case.agency_id, case.tax_year,
                                         case.quarter) matches AND clearing_status == CLEARED
                    ORDER BY deposit_due_date ASC, created_at ASC
      total_obligation_cents = SUM(obligations.obligation_amount_cents)
      IF total_obligation_cents == 0 OR len(obligations) == 0:
          fall back to the STATUTORY_DAILY branch verbatim
      ELSE:
          running = 0
          interest_cents = 0
          FOR k, o IN enumerate(obligations):                       # pinned order above
              IF k < len(obligations) - 1:
                  tranche_cents = ROUND_HALF_UP(return.tax_delta_cents
                                                * o.obligation_amount_cents
                                                / total_obligation_cents)
                  running += tranche_cents
              ELSE:
                  tranche_cents = return.tax_delta_cents - running   # last tranche absorbs the remainder
              days_k = MAX(0, WHOLE_DAYS(o.deposit_due_date -> through))
              interest_cents += ROUND_HALF_UP(tranche_cents * rate * days_k / 365)
    input_set: |
      STATUTORY_DAILY reads only tax_delta_cents, the agency rate and the two dates. DEPOSIT_WEIGHTED
      additionally reads every CLEARED DepositRecord for the case scope and accrues each tranche from
      its own deposit_due_date, so an earlier obligation accrues for MORE days than the return's own
      statutory due date would allow.
    constants:
      DAYS_PER_YEAR: 365
    precision: "cents, ROUND_HALF_UP; DEPOSIT_WEIGHTED rounds EACH tranche's interest before summing"
    variants:
      - name: STATUTORY_DAILY
        when: "TaxAgency.interest_method == STATUTORY_DAILY (federal-style agencies)"
        difference: "one simple-interest accrual on the whole tax_delta_cents from FiledReturn.original_due_date"
      - name: DEPOSIT_WEIGHTED
        when: "TaxAgency.interest_method == DEPOSIT_WEIGHTED (state-style agencies)"
        difference: |
          tax_delta_cents is split across the quarter's deposit obligations proportional to
          obligation_amount_cents (last tranche absorbs the rounding remainder) and each tranche
          accrues from its own deposit_due_date, which is earlier than original_due_date. For
          tax_delta_cents = 250000, rate 1200 bps, through 2026-04-30 and obligations of 150000
          (due 2025-02-19) and 100000 (due 2025-03-19): DEPOSIT_WEIGHTED yields 34833 cents while
          STATUTORY_DAILY on the very same inputs yields 30000 cents.

  - name: amendment_penalty_assessment
    trigger: "POST /amended-returns/{amended_return_id}/prepare (AmendedReturn DRAFT -> PREPARED); the value is frozen when the AmendedReturn transitions SUBMITTED -> ACCEPTED"
    algorithm: tiered_pricing
    formula: |
      agency    = TaxAgency[case.agency_id]
      shortfall = return.deposit_shortfall_cents
      delta     = return.tax_delta_cents
      d         = return.days_late

      # step 1 — failure-to-deposit rate, selected from a days-late tier ladder
      IF   d <= 5  : ftd_bps = 200
      ELIF d <= 15 : ftd_bps = 500
      ELSE         : ftd_bps = 1000
      ftd_cents = ROUND_HALF_UP(shortfall * ftd_bps / 10000)

      # step 2 — failure-to-file, 500 bps per whole-or-partial 30-day month, capped
      months_late   = MIN(CEIL(d / 30), 5)   IF d > 0 ELSE 0
      ftf_uncapped  = ROUND_HALF_UP(delta * (500 * months_late) / 10000)
      ftf_cap_cents = ROUND_HALF_UP(delta * 2500 / 10000)
      ftf_cents     = MIN(ftf_uncapped, ftf_cap_cents)

      # step 3 — gross, then the statutory minimum FLOOR (applied BEFORE any scaling)
      gross_cents = ftd_cents + ftf_cents
      IF gross_cents > 0:
          gross_cents = MAX(gross_cents, MIN_PENALTY_CENTS)

      # step 4 — agency multiplier
      scaled_cents = ROUND_HALF_UP(gross_cents * agency.penalty_multiplier_bps / 10000)

      # step 5 — voluntary self-correction reduction, LAST
      voluntary = (no AgencyNotice exists with employer_id == case.employer_id
                   AND agency_id == case.agency_id AND tax_year == case.tax_year
                   AND quarter == case.quarter)
      IF voluntary:
          penalty_cents = ROUND_HALF_UP(scaled_cents * (10000 - VOLUNTARY_REDUCTION_BPS) / 10000)
      ELSE:
          penalty_cents = scaled_cents
      voluntary_reduction_applied = voluntary

      # The step order 3 -> 4 -> 5 is PINNED. Applying the floor after the multiplier or
      # after the voluntary reduction yields different cents and is forbidden.
    input_set: |
      Reads only the AmendedReturn's own computed deposit_shortfall_cents, tax_delta_cents and
      days_late, plus the agency's penalty_multiplier_bps, plus the existence (not the state) of any
      AgencyNotice on the case's (employer, agency, tax_year, quarter) key. A notice in ANY
      response_status suppresses the voluntary reduction.
    constants:
      FTD_TIER_BPS: { "0..5": 200, "6..15": 500, "16+": 1000 }
      FTF_BPS_PER_MONTH: 500
      FTF_MAX_MONTHS: 5
      FTF_CAP_BPS: 2500
      MIN_PENALTY_CENTS: 5000
      VOLUNTARY_REDUCTION_BPS: 2500
    precision: "cents, ROUND_HALF_UP at each of steps 1, 2, 4 and 5"

  - name: repayment_recovery_basis
    trigger: "POST /wage-repayments (creation); re-evaluated on POST /wage-repayments/{wage_repayment_id}/renegotiate"
    algorithm: threshold
    formula: |
      g  = overpaid_gross_cents
      it = overpaid_income_tax_withheld_cents
      fi = overpaid_fica_withheld_cents

      IF recovery_tax_year == overpayment_tax_year:
          recovery_basis           = SAME_YEAR_NET
          employee_due_cents       = g - it - fi
          agency_recoverable_cents = it + fi
      ELSE:                                   # recovery_tax_year > overpayment_tax_year
          recovery_basis           = PRIOR_YEAR_GROSS
          employee_due_cents       = g
          agency_recoverable_cents = fi
    input_set: |
      Reads only the four numeric inputs plus the two tax years on the WageRepayment row itself.
      No other entity participates. recovery_tax_year < overpayment_tax_year is rejected by
      validation ERR_INVALID_RECOVERY_YEAR before this calculation runs.
    constants: {}
    precision: "whole cents; no rounding occurs (all inputs are already integral cents)"
    variants:
      - name: SAME_YEAR_NET
        when: "recovery_tax_year == overpayment_tax_year — the wage statement for the year is still open"
        difference: |
          The employee repays the NET they actually received, because the employer can still reverse
          income tax withholding inside the same reporting year; both income tax and social-insurance
          withholding become recoverable from the agencies.
      - name: PRIOR_YEAR_GROSS
        when: "recovery_tax_year > overpayment_tax_year — the prior year's statement is already filed"
        difference: |
          The employee repays the FULL GROSS, because prior-year income tax withholding was already
          credited to the employee and cannot be reclaimed by the employer; only social-insurance
          withholding remains recoverable. For g = 400000, it = 60000, fi = 30600:
          SAME_YEAR_NET yields employee_due_cents = 309400 / agency_recoverable_cents = 90600, while
          PRIOR_YEAR_GROSS on the very same inputs yields 400000 / 30600.

  - name: statement_box_deltas
    trigger: "POST /corrected-wage-statements (creation), POST /corrected-wage-statements/{statement_id}/issue, and successor-statement creation inside the CorrectedWageStatement ISSUED -> VOIDED transition"
    algorithm: projection
    formula: |
      case = CorrectionCase[statement.correction_case_id]
      is_prior_year = (statement.tax_year < CALENDAR_YEAR(current logical-clock instant))

      jurisdiction_removal_cents =
          SUM(d.amount_cents) over Discrepancy WHERE correction_case_id == case.id
              AND employee_id == statement.employee_id
              AND category == JURISDICTION_ASSIGNMENT
              AND status IN {CATEGORIZED, RESOLVED}
          ORDER BY emission_index ASC

      rp = the WageRepayment WHERE correction_case_id == case.id
                AND employee_id == statement.employee_id
                AND status == COLLECTED
                AND overpayment_tax_year == statement.tax_year
           ORDER BY created_at DESC  ->  take the first row, else null

      IF rp IS null:
          wage_delta_cents        = -jurisdiction_removal_cents
          fica_wage_delta_cents   = -jurisdiction_removal_cents
          withholding_delta_cents = 0
      ELIF rp.recovery_basis == SAME_YEAR_NET:
          wage_delta_cents        = -jurisdiction_removal_cents - rp.overpaid_gross_cents
          fica_wage_delta_cents   = -jurisdiction_removal_cents - rp.overpaid_gross_cents
          withholding_delta_cents = -rp.overpaid_income_tax_withheld_cents
      ELSE:                                            # PRIOR_YEAR_GROSS
          wage_delta_cents        = -jurisdiction_removal_cents      # box 1 is NOT adjusted
          fica_wage_delta_cents   = -jurisdiction_removal_cents - rp.overpaid_gross_cents
          withholding_delta_cents = 0                                # not recoverable
    input_set: |
      Only Discrepancy rows for THIS employee with status IN {CATEGORIZED, RESOLVED} contribute;
      OPEN, DISMISSED and SUPERSEDED rows are excluded. Only a COLLECTED WageRepayment contributes;
      PROPOSED, AGREED, WRITTEN_OFF and CANCELLED repayments never move a box.
    constants: {}
    precision: "whole cents; the only rounding already happened per-line inside jurisdiction_wage_apportionment"
    variants:
      - name: CURRENT_YEAR_BOXES
        when: "the matched WageRepayment.recovery_basis == SAME_YEAR_NET"
        difference: "box 1, box 3/5 and box 2 are all adjusted"
      - name: PRIOR_YEAR_BOXES
        when: "the matched WageRepayment.recovery_basis == PRIOR_YEAR_GROSS"
        difference: "box 1 and box 2 are left untouched; only box 3/5 social-insurance wages are reduced"

  - name: abatement_penalty_waiver
    trigger: "POST /agency-notices/{agency_notice_id}/record-outcome (AgencyNotice response_status RESPONDED -> CLOSED and abatement_status REQUESTED -> GRANTED | PARTIALLY_GRANTED | DENIED)"
    algorithm: constraint_propagation
    formula: |
      pen   = notice.assessed_penalty_cents
      intr  = notice.assessed_interest_cents
      # STEP 1 — the tier key is the PRE-WAIVER gross exposure. It is evaluated ONCE and is
      #          NEVER re-evaluated against the post-waiver net. This pins the otherwise
      #          circular dependency net_exposure -> tier -> waiver -> net_exposure.
      gross_exposure_cents = notice.assessed_tax_cents + pen + intr

      IF outcome == UPHELD:
          waiver_pct_bps = 0 ; waived_penalty_cents = 0 ; waived_interest_cents = 0
          net_exposure_cents = gross_exposure_cents
          RETURN

      # STEP 2 — waiver percentage by grounds
      IF notice.abatement_grounds == FIRST_TIME:
          waiver_pct_bps = 10000 IF (Employer.granted_abatement_count == 0
                                     AND gross_exposure_cents <= FIRST_TIME_EXPOSURE_CEILING_CENTS)
                                 ELSE 5000
      ELIF notice.abatement_grounds == REASONABLE_CAUSE:
          bonus = 2000 IF (a ControlRemediation exists with correction_case_id == notice.correction_case_id
                           AND control_gap_class == THIRD_PARTY_FAILURE
                           AND status == VERIFIED)
                       ELSE 0
          waiver_pct_bps = MIN(6000 + bonus, 10000)
      ELIF notice.abatement_grounds == AGENCY_ERROR:
          waiver_pct_bps = 10000                       # and interest is fully waived too
      ELSE:                                            # STATUTORY_EXCEPTION
          waiver_pct_bps = 10000                       # penalty only; interest untouched

      # STEP 3 — waived amounts
      waived_penalty_cents = ROUND_HALF_UP(pen * waiver_pct_bps / 10000)
      waived_interest_cents = intr IF notice.abatement_grounds == AGENCY_ERROR ELSE 0

      IF outcome == ABATED_PARTIAL:
          waived_penalty_cents = MIN(waived_penalty_cents, notice.requested_penalty_waiver_cents)

      # STEP 4 — de-minimis sweep, executed EXACTLY ONCE and only on the ABATED_FULL branch.
      #          It never re-runs step 2 and never re-tiers.
      net_exposure_cents = gross_exposure_cents - waived_penalty_cents - waived_interest_cents
      IF outcome == ABATED_FULL AND 0 < net_exposure_cents <= DE_MINIMIS_CENTS:
          waived_penalty_cents  = pen
          waived_interest_cents = intr
          net_exposure_cents    = gross_exposure_cents - pen - intr
    input_set: |
      Employer.granted_abatement_count is read BEFORE this notice's own abatement_status is updated,
      so a first abatement always sees 0. The REASONABLE_CAUSE bonus counts only ControlRemediation
      rows already in status VERIFIED at decision time; SUBMITTED_FOR_VERIFICATION and
      VERIFICATION_FAILED rows contribute nothing.
    constants:
      FIRST_TIME_EXPOSURE_CEILING_CENTS: 5000000
      FIRST_TIME_BASE_PCT_BPS: 10000
      FIRST_TIME_REPEAT_PCT_BPS: 5000
      REASONABLE_CAUSE_BASE_PCT_BPS: 6000
      THIRD_PARTY_VERIFIED_BONUS_BPS: 2000
      DE_MINIMIS_CENTS: 2500
    precision: "cents, ROUND_HALF_UP at step 3 only"

  - name: case_exposure_rollup
    trigger: "AmendedReturn DRAFT -> PREPARED, SIGNED -> DRAFT, PREPARED -> VOID, AGENCY_REJECTED -> VOID; AgencyNotice RESPONDED -> CLOSED; CorrectionCase REMEDIATION_PENDING -> CLOSED and REMEDIATION_PENDING -> OPEN"
    algorithm: aggregation
    formula: |
      gross = SUM(a.tax_delta_cents + a.interest_cents + a.penalty_cents)
              over AmendedReturn a WHERE a.correction_case_id == case.id
                   AND a.status IN {PREPARED, SIGNED, SUBMITTED, ACCEPTED}
      waived = SUM(n.waived_penalty_cents + n.waived_interest_cents)
               over AgencyNotice n WHERE n.correction_case_id == case.id
                    AND n.abatement_status IN {GRANTED, PARTIALLY_GRANTED}
      CorrectionCase.total_exposure_cents = MAX(0, gross - waived)
    input_set: |
      AmendedReturn rows in DRAFT, AGENCY_REJECTED and VOID are excluded, so a void removes the
      return's whole contribution. AgencyNotice rows with abatement_status IN {NONE, REQUESTED,
      DENIED} contribute nothing. Order-insensitive (pure sum), so no tie-break is required.
    constants: {}
    precision: "whole cents; floored at 0"

  - name: employer_open_exposure_rollup
    trigger: "every write that changes any CorrectionCase.total_exposure_cents or CorrectionCase.status, and CorrectionCase REMEDIATION_PENDING -> CLOSED / REMEDIATION_PENDING -> OPEN"
    algorithm: aggregation
    formula: |
      Employer.open_exposure_cents = SUM(c.total_exposure_cents)
          over CorrectionCase c WHERE c.employer_id == employer.id
               AND c.status IN {OPEN, REMEDIATION_PENDING}
    input_set: "CLOSED cases are excluded entirely; a reopen (REMEDIATION_PENDING -> OPEN) re-admits the case's full total_exposure_cents."
    constants: {}
    precision: "whole cents"

  - name: corrected_wage_base_rollup
    trigger: "CorrectedWageStatement DRAFT -> ISSUED, ISSUED -> ACKNOWLEDGED, ISSUED -> RETURNED_UNDELIVERABLE, ISSUED -> VOIDED, RETURNED_UNDELIVERABLE -> VOIDED; CorrectionCase VARIANCE_FOUND -> VARIANCE_FOUND"
    algorithm: aggregation
    formula: |
      base = SUM(l.taxable_wage_cents) over PayrollRegisterLine l
             WHERE (l.employer_id, l.agency_id, l.tax_year, l.quarter)
                   == (case.employer_id, case.agency_id, case.tax_year, case.quarter)
                   AND l.posting_status == POSTED
      adj  = SUM(s.wage_delta_cents) over CorrectedWageStatement s
             WHERE s.correction_case_id == case.id AND s.status IN {ISSUED, ACKNOWLEDGED}
      CorrectionCase.corrected_wage_base_cents = base + adj

      Employee.active_statement_count = COUNT(CorrectedWageStatement s
             WHERE s.employee_id == employee.id AND s.status IN {ISSUED, ACKNOWLEDGED})
    input_set: |
      DRAFT, RETURNED_UNDELIVERABLE and VOIDED statements contribute nothing, which is exactly what
      makes a void + successor-issue pair conserve corrected_wage_base_cents when the successor
      carries the same wage_delta_cents.
    constants: {}
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Priority Table
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty on every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the seven declared roles AND must be listed in the endpoint's allowed_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 3
    category: auth
    check: "For entity_backed roles (EmployerRep, EmployeeSelfService) the X-User-ID must resolve to an existing Employer.id / Employee.id respectively"
    error_id: ERR_IDENTITY_NOT_RESOLVABLE
    http_status: 403
    applies_to: "all endpoints whose roles include EmployerRep or EmployeeSelfService"

  - priority: 4
    category: auth
    check: "An entity_backed caller may only read or write rows inside its own scope: EmployerRep -> rows whose employer_id chain equals its Employer.id; EmployeeSelfService -> rows whose employee_id equals its Employee.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include EmployerRep or EmployeeSelfService"

  - priority: 10
    category: existence
    check: "Every path parameter {X_id} must name an existing row of the corresponding entity"
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_TAX_AGENCY_NOT_FOUND | ERR_AGENCY_ACCOUNT_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_FILED_RETURN_NOT_FOUND | ERR_CORRECTION_CASE_NOT_FOUND | ERR_DISCREPANCY_NOT_FOUND | ERR_AMENDED_RETURN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_WAGE_REPAYMENT_NOT_FOUND | ERR_AGENCY_NOTICE_NOT_FOUND | ERR_CONTROL_REMEDIATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 11
    category: existence
    check: "Every FK supplied in a request body must name an existing row of the referenced entity"
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_TAX_AGENCY_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_CORRECTION_CASE_NOT_FOUND | ERR_AMENDED_RETURN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every POST that accepts a foreign key in its body"

  - priority: 20
    category: schema
    check: "Body must be a JSON object; every required input field present and of the declared type; every enum field one of its declared values; every *_cents field a non-negative integer unless the field is explicitly signed; fein matching ^[0-9]{2}-[0-9]{7}$; quarter in 1..4; tax_year in 2000..2100; workday_ratio_bps in 0..10000; unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST endpoint"

  - priority: 21
    category: schema
    check: "limit must be an integer in 1..100 and offset an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET list endpoint"

  - priority: 22
    category: schema
    check: "WageRepayment.recovery_tax_year must be >= overpayment_tax_year, and overpaid_income_tax_withheld_cents + overpaid_fica_withheld_cents must be <= overpaid_gross_cents"
    error_id: ERR_INVALID_RECOVERY_YEAR
    http_status: 400
    applies_to: "POST /wage-repayments, POST /wage-repayments/{wage_repayment_id}/renegotiate"

  - priority: 30
    category: concurrency
    check: "POST /amended-returns requires expected_correction_case_version == CorrectionCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /amended-returns"

  - priority: 31
    category: concurrency
    check: "POST /corrected-wage-statements/{statement_id}/reissue requires expected_statement_version == CorrectedWageStatement.version"
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
    applies_to: "POST /corrected-wage-statements/{statement_id}/reissue"

  - priority: 40
    category: state
    check: "The target entity's relevant state field must permit the requested transition (see §1.2). Signing requires PREPARED; submitting requires SIGNED; collecting requires AGREED; verifying requires SUBMITTED_FOR_VERIFICATION; issuing requires DRAFT; categorising requires OPEN."
    error_id: "ERR_AMENDED_RETURN_NOT_SIGNED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 41
    category: state
    check: "No transition may leave a terminal state: AmendedReturn VOID/ACCEPTED, CorrectedWageStatement VOIDED/ACKNOWLEDGED, WageRepayment COLLECTED/WRITTEN_OFF/CANCELLED, AgencyNotice response_status CLOSED, ControlRemediation VERIFIED, CorrectionCase status CLOSED, CorrectionCase detection_status NO_VARIANCE, AgencyAccount CLOSED"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 42
    category: state
    check: "AmendedReturn DRAFT -> PREPARED requires at least one Discrepancy with status == CATEGORIZED and zero with status == OPEN on the case"
    error_id: ERR_UNCATEGORIZED_DISCREPANCIES
    http_status: 409
    applies_to: "POST /amended-returns/{amended_return_id}/prepare"

  - priority: 50
    category: business_referential
    check: "Every row joined into one operation must share the same scope: a Discrepancy's correction_case_id must match the AmendedReturn's; a CorrectedWageStatement's employee_id must belong to the case's employer_id; an AgencyNotice's correction_case_id must share the notice's (employer_id, agency_id, tax_year, quarter); a WageRepayment's employee_id must match the statement's"
    error_id: ERR_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /amended-returns, POST /corrected-wage-statements, POST /agency-notices, POST /wage-repayments, POST /discrepancies/{discrepancy_id}/categorize"

  - priority: 51
    category: business_referential
    check: "When TaxAgency.requires_registration is true, an AgencyAccount for (employer_id, agency_id) with registration_status IN {ACTIVE, RETRO_ACTIVE} must cover the case's period ordinal before an AmendedReturn may be PREPARED"
    error_id: ERR_AGENCY_ACCOUNT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /amended-returns/{amended_return_id}/prepare"

  - priority: 52
    category: business_referential
    check: "CorrectionCase REMEDIATION_PENDING -> CLOSED requires every ControlRemediation on the case to be in status VERIFIED"
    error_id: ERR_REMEDIATION_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /correction-cases/{correction_case_id}/close"

  - priority: 53
    category: business_referential
    check: "POST /amended-returns requires COUNT(Discrepancy where correction_case_id == the named case) > 0 — an amendment may not be opened on a case whose reconciliation has emitted nothing, i.e. detection_status IN {NOT_RUN, NO_VARIANCE}"
    error_id: ERR_CASE_HAS_NO_DISCREPANCIES
    http_status: 409
    applies_to: "POST /amended-returns"

  - priority: 54
    category: business_referential
    check: "CorrectionCase REMEDIATION_PENDING -> CLOSED requires every WageRepayment on the case to be in a terminal status (COLLECTED, WRITTEN_OFF or CANCELLED)"
    error_id: ERR_REPAYMENT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /correction-cases/{correction_case_id}/close"

  - priority: 55
    category: business_safety
    check: "AmendedReturn PREPARED -> SIGNED requires the acting X-User-ID to differ from AmendedReturn.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /amended-returns/{amended_return_id}/sign"

  - priority: 56
    category: business_safety
    check: "ControlRemediation SUBMITTED_FOR_VERIFICATION -> VERIFIED requires the acting X-User-ID to differ from ControlRemediation.owner_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /control-remediations/{control_remediation_id}/verify"

  - priority: 60
    category: business_temporal
    check: "AmendedReturn SIGNED -> SUBMITTED requires the current logical instant to be on or before FiledReturn.original_due_date + TaxAgency.amendment_window_days (inclusive)"
    error_id: ERR_AMENDMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /amended-returns/{amended_return_id}/submit"

  - priority: 61
    category: business_temporal
    check: "AmendedReturn SIGNED -> SUBMITTED requires WHOLE_DAYS(previous ACCEPTED-or-SUBMITTED return's submitted_at -> now) >= TaxAgency.min_days_between_amendments on the same (employer, agency, tax_year, quarter); the buffer interval is half-open so equality passes"
    error_id: ERR_AMENDMENT_COOLING_OFF_ACTIVE
    http_status: 409
    applies_to: "POST /amended-returns/{amended_return_id}/submit"

  - priority: 62
    category: business_temporal
    check: "AmendedReturn.accrual_through_date must be >= the case's FiledReturn.original_due_date and must not be after the current logical instant"
    error_id: ERR_INVALID_ACCRUAL_DATE
    http_status: 422
    applies_to: "POST /amended-returns/{amended_return_id}/prepare"

  - priority: 63
    category: business_temporal
    check: "AgencyNotice RESPONSE_DRAFTED -> RESPONDED requires the current logical instant to be on or before response_due_date"
    error_id: ERR_NOTICE_RESPONSE_OVERDUE
    http_status: 422
    applies_to: "POST /agency-notices/{agency_notice_id}/respond"

  - priority: 64
    category: business_temporal
    check: "A CorrectedWageStatement whose tax_year is more than PRIOR_YEAR_WINDOW_YEARS (3) calendar years before the current logical year may not be created or issued"
    error_id: ERR_PRIOR_YEAR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /corrected-wage-statements, POST /corrected-wage-statements/{statement_id}/issue"

  - priority: 70
    category: business_constraint
    check: "At most one AmendedReturn per (correction_case_id, form_code) may occupy a non-terminal, non-rejected slot — that is status IN {DRAFT, PREPARED, SIGNED, SUBMITTED}"
    error_id: ERR_AMENDMENT_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /amended-returns"

  - priority: 71
    category: business_constraint
    check: "Two AgencyAccount rows for the same (employer_id, agency_id) may not have overlapping closed-closed period-ordinal intervals [from_period_ordinal, to_period_ordinal]; touching endpoints where successor.from == predecessor.to + 1 are adjacent, not overlapping, and are allowed"
    error_id: ERR_ACCOUNT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /agency-accounts"

  - priority: 72
    category: business_constraint
    check: "At most one FiledReturn may exist per (employer_id, agency_id, tax_year, quarter, form_code); Employer.fein must be globally unique; AgencyNotice.notice_number must be unique within its agency_id; TaxAgency.agency_code must be globally unique"
    error_id: "ERR_DUPLICATE_FILED_RETURN | ERR_DUPLICATE_EMPLOYER_FEIN | ERR_DUPLICATE_NOTICE_NUMBER | ERR_DUPLICATE_AGENCY_CODE"
    http_status: 409
    applies_to: "POST /filed-returns, POST /employers, POST /agency-notices, POST /tax-agencies"

  - priority: 73
    category: business_constraint
    check: "A CorrectedWageStatement may not be created when statement_box_deltas yields wage_delta_cents == 0 AND fica_wage_delta_cents == 0 AND withholding_delta_cents == 0"
    error_id: ERR_NO_REPORTABLE_DELTA
    http_status: 422
    applies_to: "POST /corrected-wage-statements"

  - priority: 74
    category: business_constraint
    check: "A CorrectionCase must have exactly one FiledReturn with status IN {FILED, AMENDED} on its scope before reconciliation may run"
    error_id: ERR_NO_FILED_RETURN_FOR_PERIOD
    http_status: 422
    applies_to: "POST /correction-cases/{correction_case_id}/reconcile"

  - priority: 75
    category: business_constraint
    check: "CorrectedWageStatement ISSUED -> RETURNED_UNDELIVERABLE is only available when delivery_channel == MAIL"
    error_id: ERR_CHANNEL_NOT_UNDELIVERABLE_CAPABLE
    http_status: 422
    applies_to: "POST /corrected-wage-statements/{statement_id}/report-undeliverable"

  - priority: 80
    category: business_fiscal
    check: "AmendedReturn PREPARED -> SIGNED requires CorrectionCase.total_exposure_cents (as it stands with this return counted) to be <= Employer.authorization_limit_cents"
    error_id: ERR_AUTHORIZATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /amended-returns/{amended_return_id}/sign"

  - priority: 81
    category: business_fiscal
    check: "WageRepayment AGREED -> COLLECTED requires the posted collected_cents to equal employee_due_cents exactly; a larger amount is an over-collection"
    error_id: ERR_OVERCOLLECTION
    http_status: 422
    applies_to: "POST /wage-repayments/{wage_repayment_id}/collect"

  - priority: 82
    category: business_fiscal
    check: "AgencyNotice.requested_penalty_waiver_cents may not exceed assessed_penalty_cents"
    error_id: ERR_WAIVER_EXCEEDS_ASSESSMENT
    http_status: 422
    applies_to: "POST /agency-notices/{agency_notice_id}/record-outcome"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Employer
  - method: POST
    path: "/employers"
    description: "Register an employer subject to payroll tax reporting."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, fein, deposit_schedule, authorization_limit_cents]
    output: Employer
    side_effects: ["open_exposure_cents, open_remediation_count and granted_abatement_count initialised to 0"]

  - method: GET
    path: "/employers/{employer_id}"
    description: "Fetch one employer including its derived exposure and remediation counters."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/employers"
    description: "List employers, optionally filtered by federal identification number."
    roles: [PlatformAdmin, PayrollAnalyst, TaxOfficer, ControlsAuditor]
    code: 200
    input: ["fein?", "deposit_schedule?", "limit?", "offset?"]
    output: Employer[]
    side_effects: []

  - method: PATCH
    path: "/employers/{employer_id}"
    description: "Adjust an employer's deposit schedule or signing authorization limit."
    roles: [PlatformAdmin]
    code: 200
    input: ["deposit_schedule?", "authorization_limit_cents?"]
    output: Employer
    side_effects: ["version incremented"]

  # --------------------------------------------------------------- TaxAgency
  - method: POST
    path: "/tax-agencies"
    description: "Register a federal, state or local taxing agency with its interest and penalty regime."
    roles: [PlatformAdmin]
    code: 201
    input: [agency_code, level, jurisdiction_code, interest_rate_bps_annual, interest_method, penalty_multiplier_bps, min_days_between_amendments, amendment_window_days, "requires_registration?"]
    output: TaxAgency
    side_effects: []

  - method: GET
    path: "/tax-agencies/{tax_agency_id}"
    description: "Fetch one taxing agency and its computation regime."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: TaxAgency
    side_effects: []

  - method: GET
    path: "/tax-agencies"
    description: "List taxing agencies, optionally filtered by level or jurisdiction."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["level?", "jurisdiction_code?", "interest_method?", "limit?", "offset?"]
    output: TaxAgency[]
    side_effects: []

  # ------------------------------------------------------------ AgencyAccount
  - method: POST
    path: "/agency-accounts"
    description: "Open an employer's registration with an agency for a closed-closed quarter range; omitting effective_to_* leaves the range open-ended. A retroactive registration starts in RETRO_PENDING."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 201
    input: [employer_id, agency_id, "account_number?", effective_from_tax_year, effective_from_quarter, "effective_to_tax_year?", "effective_to_quarter?", "retroactive?"]
    output: AgencyAccount
    side_effects: ["from_period_ordinal and to_period_ordinal derived (999999 when open-ended)", "registration_status set to RETRO_PENDING when retroactive is true, otherwise PENDING", "period-ordinal overlap check against sibling accounts for the same (employer_id, agency_id)"]

  - method: GET
    path: "/agency-accounts/{agency_account_id}"
    description: "Fetch one agency registration record."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: AgencyAccount
    side_effects: []

  - method: GET
    path: "/agency-accounts"
    description: "List agency registrations filtered by employer, agency or registration status."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "agency_id?", "registration_status?", "retroactive?", "limit?", "offset?"]
    output: AgencyAccount[]
    side_effects: []

  - method: POST
    path: "/agency-accounts/{agency_account_id}/activate"
    description: "Activate a registration by recording the agency-assigned account number. PENDING becomes ACTIVE; RETRO_PENDING becomes RETRO_ACTIVE and back-dates coverage over the account's period range."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: [account_number]
    output: AgencyAccount
    side_effects: ["registration_status advanced", "activated_at set (back-dated on the retroactive branch)", "version incremented"]

  - method: POST
    path: "/agency-accounts/{agency_account_id}/close"
    description: "Close an active registration at a stated final quarter, shrinking its period range."
    roles: [PlatformAdmin]
    code: 200
    input: [effective_to_tax_year, effective_to_quarter]
    output: AgencyAccount
    side_effects: ["registration_status set to CLOSED", "to_period_ordinal recomputed", "version incremented"]

  # ---------------------------------------------------------------- Employee
  - method: POST
    path: "/employees"
    description: "Add an employee to an employer's payroll roster."
    roles: [PlatformAdmin, PayrollAnalyst, EmployerRep]
    code: 201
    input: [employer_id, full_name, national_id_last4, mailing_state_code]
    output: Employee
    side_effects: ["active_statement_count initialised to 0"]

  - method: GET
    path: "/employees/{employee_id}"
    description: "Fetch one employee including the count of statements currently in force."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List employees filtered by employer."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "mailing_state_code?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # ------------------------------------------------------- PayrollRegisterLine
  - method: POST
    path: "/payroll-register-lines"
    description: "Post an immutable payroll register line for one employee, agency and quarter. workday_ratio_bps defaults to 10000 (all workdays in the agency's own jurisdiction)."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 201
    input: [employer_id, employee_id, agency_id, tax_year, quarter, taxable_wage_cents, withheld_cents, work_jurisdiction_code, "workday_ratio_bps?"]
    output: PayrollRegisterLine
    side_effects: ["posting_status fixed at POSTED; the row is immutable and carries no version field"]

  - method: GET
    path: "/payroll-register-lines/{register_line_id}"
    description: "Fetch one posted payroll register line."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: PayrollRegisterLine
    side_effects: []

  - method: GET
    path: "/payroll-register-lines"
    description: "List posted register lines filtered by employer, employee, agency or period."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "employee_id?", "agency_id?", "tax_year?", "quarter?", "limit?", "offset?"]
    output: PayrollRegisterLine[]
    side_effects: []

  # ------------------------------------------------------------- DepositRecord
  - method: POST
    path: "/deposit-records"
    description: "Record an immutable tax deposit together with the obligation it was meant to satisfy. A RETURNED deposit contributes neither cash nor obligation to reconciliation."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 201
    input: [employer_id, agency_id, tax_year, quarter, deposit_due_date, deposit_date, amount_cents, obligation_amount_cents, "clearing_status?"]
    output: DepositRecord
    side_effects: ["the row is immutable and carries no version field"]

  - method: GET
    path: "/deposit-records/{deposit_record_id}"
    description: "Fetch one deposit record."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: DepositRecord
    side_effects: []

  - method: GET
    path: "/deposit-records"
    description: "List deposit records filtered by employer, agency or period."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "agency_id?", "tax_year?", "quarter?", "clearing_status?", "limit?", "offset?"]
    output: DepositRecord[]
    side_effects: []

  # ---------------------------------------------------------------- FiledReturn
  - method: POST
    path: "/filed-returns"
    description: "Record the return as originally filed with an agency for a quarter. original_due_date is derived from the quarter (Q1 04-30, Q2 07-31, Q3 10-31, Q4 the following 01-31)."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer]
    code: 201
    input: [employer_id, agency_id, tax_year, quarter, form_code, filed_at, reported_taxable_wage_cents, reported_withheld_cents]
    output: FiledReturn
    side_effects: ["original_due_date derived from tax_year and quarter", "status set to FILED"]

  - method: GET
    path: "/filed-returns/{filed_return_id}"
    description: "Fetch one filed return including its derived statutory due date."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: FiledReturn
    side_effects: []

  - method: GET
    path: "/filed-returns"
    description: "List filed returns filtered by employer, agency, period or status."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "agency_id?", "tax_year?", "quarter?", "status?", "limit?", "offset?"]
    output: FiledReturn[]
    side_effects: []

  # -------------------------------------------------------------- CorrectionCase
  - method: POST
    path: "/correction-cases"
    description: "Open a correction case for one employer, agency, tax year and quarter. All four state dimensions start at their initial values."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 201
    input: [employer_id, agency_id, tax_year, quarter]
    output: CorrectionCase
    side_effects: ["status OPEN, detection_status NOT_RUN, filing_status FILING_NOT_REQUIRED, statement_status STMT_NOT_REQUIRED", "corrected_wage_base_cents seeded from the scope's POSTED register lines", "Employer.open_exposure_cents recomputed"]

  - method: GET
    path: "/correction-cases/{correction_case_id}"
    description: "Fetch one correction case with all four state dimensions and every derived rollup."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: CorrectionCase
    side_effects: []

  - method: GET
    path: "/correction-cases"
    description: "List correction cases filtered by employer, agency, period or any state dimension."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "agency_id?", "tax_year?", "quarter?", "status?", "detection_status?", "filing_status?", "statement_status?", "limit?", "offset?"]
    output: CorrectionCase[]
    side_effects: []

  - method: POST
    path: "/correction-cases/{correction_case_id}/reconcile"
    description: "Run the three-way reconciliation between register, deposits and filed return, emitting Discrepancy rows in the pinned category order. Re-running supersedes every discrepancy left from the previous run."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: []
    output: CorrectionCase
    side_effects: ["runs three_way_variance_detection", "creates Discrepancy rows with emission_index 0..n-1", "supersedes prior OPEN and CATEGORIZED discrepancies on a re-run", "detection_status set to NO_VARIANCE or VARIANCE_FOUND", "filing_status and statement_status advanced to FILING_PENDING / STMT_PENDING when a variance is found", "corrected_wage_base_cents recomputed", "version incremented"]

  - method: POST
    path: "/correction-cases/{correction_case_id}/close"
    description: "Close a case that has finished filing, statement issuance and control remediation."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: ["closure_note?"]
    output: CorrectionCase
    side_effects: ["status set to CLOSED and closed_at stamped", "Employer.open_exposure_cents recomputed (the case drops out)", "Employer.open_remediation_count decremented", "version incremented"]

  - method: GET
    path: "/correction-cases/{correction_case_id}/exposure-summary"
    description: "Computed read of the case's gross amendment exposure, granted waivers and net exposure."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: "{ gross_exposure_cents: integer, waived_cents: integer, total_exposure_cents: integer, corrected_wage_base_cents: integer, repayment_recovered_cents: integer, dominant_root_cause_code: string|null }"
    side_effects: []

  # ----------------------------------------------------------------- Discrepancy
  - method: GET
    path: "/discrepancies/{discrepancy_id}"
    description: "Fetch one discrepancy emitted by reconciliation."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: Discrepancy
    side_effects: []

  - method: GET
    path: "/discrepancies"
    description: "List discrepancies filtered by case, employee, register line, category or status. Discrepancy rows are only ever created by reconciliation, so this is their sole discovery channel."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["correction_case_id?", "employee_id?", "register_line_id?", "resolved_amended_return_id?", "category?", "status?", "limit?", "offset?"]
    output: Discrepancy[]
    side_effects: []

  - method: POST
    path: "/discrepancies/{discrepancy_id}/categorize"
    description: "Confirm or re-classify a detected discrepancy and attach its root cause. The analyst-confirmed category, not detected_category, is what the amendment rollup sums."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: [category, root_cause_code]
    output: Discrepancy
    side_effects: ["status set to CATEGORIZED", "CorrectionCase.open_discrepancy_count and dominant_root_cause_code recomputed", "version incremented"]

  - method: POST
    path: "/discrepancies/{discrepancy_id}/dismiss"
    description: "Dismiss a categorised discrepancy as not requiring an amendment."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: [dismissal_reason]
    output: Discrepancy
    side_effects: ["status set to DISMISSED", "CorrectionCase.dominant_root_cause_code recomputed", "version incremented"]

  # --------------------------------------------------------------- AmendedReturn
  - method: POST
    path: "/amended-returns"
    description: "Open a draft amended return for a case and form. Requires the case's current version. Supply supersedes_amended_return_id when this draft replaces an agency-rejected or voided predecessor."
    roles: [PlatformAdmin, TaxPreparer]
    code: 201
    input: [correction_case_id, form_code, accrual_through_date, expected_correction_case_version, "supersedes_amended_return_id?"]
    output: AmendedReturn
    side_effects: ["status set to DRAFT", "CorrectionCase.version incremented", "at most one non-terminal return per (case, form_code) enforced", "refused with ERR_CASE_HAS_NO_DISCREPANCIES when the case has no Discrepancy rows"]

  - method: GET
    path: "/amended-returns/{amended_return_id}"
    description: "Fetch one amended return with its computed deltas, interest and penalty."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: AmendedReturn
    side_effects: []

  - method: GET
    path: "/amended-returns"
    description: "List amended returns filtered by case, superseded predecessor or status."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["correction_case_id?", "supersedes_amended_return_id?", "form_code?", "status?", "interest_variant?", "limit?", "offset?"]
    output: AmendedReturn[]
    side_effects: []

  - method: POST
    path: "/amended-returns/{amended_return_id}/prepare"
    description: "Roll up the categorised discrepancies and compute wage delta, tax delta, deposit shortfall, interest and penalty. Records the acting X-User-ID as prepared_by_user_id."
    roles: [PlatformAdmin, TaxPreparer]
    code: 200
    input: ["accrual_through_date?"]
    output: AmendedReturn
    side_effects: ["runs amended_return_delta_rollup, jurisdiction_wage_apportionment, amendment_interest_accrual and amendment_penalty_assessment", "prepared_by_user_id set from X-User-ID", "interest_variant recorded from the agency's interest_method", "status set to PREPARED", "CorrectionCase.filing_status set to FILING_IN_PROGRESS", "CorrectionCase.total_exposure_cents and Employer.open_exposure_cents recomputed", "version incremented"]

  - method: POST
    path: "/amended-returns/{amended_return_id}/sign"
    description: "Second-person sign-off. The acting X-User-ID must differ from the preparer and the case exposure must stay within the employer's authorization limit."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: []
    output: AmendedReturn
    side_effects: ["signed_by_user_id set from X-User-ID", "status set to SIGNED", "version incremented"]

  - method: POST
    path: "/amended-returns/{amended_return_id}/submit"
    description: "Transmit a signed amendment to the agency. Enforces the amendment window and the half-open cooling-off buffer since the previous amendment for the same period."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: []
    output: AmendedReturn
    side_effects: ["status set to SUBMITTED and submitted_at stamped from the logical clock", "version incremented"]

  - method: POST
    path: "/amended-returns/{amended_return_id}/agency-outcome"
    description: "Record the agency's disposition of a submitted amendment. ACCEPTED starts the acceptance cascade; REJECTED starts no cascade at all."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: AmendedReturn
    side_effects: ["on ACCEPTED: status ACCEPTED and accepted_at stamped, FiledReturn.status set to AMENDED, every CATEGORIZED Discrepancy set to RESOLVED with resolved_amended_return_id and resolved_amount_cents, CorrectionCase.filing_status set to FILING_COMPLETE, CorrectionCase.status set to REMEDIATION_PENDING with one ControlRemediation auto-created from the case dominant_root_cause_code when the case has none yet, Employer.open_remediation_count incremented", "on REJECTED: status AGENCY_REJECTED and rejection_reason stored, no other row changes", "version incremented"]

  - method: POST
    path: "/amended-returns/{amended_return_id}/void"
    description: "Void a draft, prepared or agency-rejected amendment and reverse every rollup it contributed."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: [void_reason]
    output: AmendedReturn
    side_effects: ["status set to VOID", "CorrectionCase.total_exposure_cents and Employer.open_exposure_cents recomputed (the return's contribution is removed)", "CorrectionCase.filing_status returned to FILING_PENDING when no other in-flight return remains", "version incremented"]

  # ------------------------------------------------- CorrectedWageStatement
  - method: POST
    path: "/corrected-wage-statements"
    description: "Draft a corrected wage statement for one employee and tax year. The three box deltas are computed, never supplied. A statement with all three deltas zero is refused."
    roles: [PlatformAdmin, TaxPreparer]
    code: 201
    input: [correction_case_id, employee_id, tax_year, delivery_channel, "supersedes_statement_id?"]
    output: CorrectedWageStatement
    side_effects: ["runs statement_box_deltas", "is_prior_year derived against the logical clock's calendar year", "sequence_no assigned as one plus the count of prior statements for the same (case, employee)", "status set to DRAFT"]

  - method: GET
    path: "/corrected-wage-statements/{statement_id}"
    description: "Fetch one corrected wage statement with its computed box deltas."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: []
    output: CorrectedWageStatement
    side_effects: []

  - method: GET
    path: "/corrected-wage-statements"
    description: "List corrected wage statements filtered by case, employee, superseded predecessor, tax year or status. Successor statements created inside the reissue cascade are discoverable only here."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: ["correction_case_id?", "employee_id?", "supersedes_statement_id?", "tax_year?", "is_prior_year?", "status?", "limit?", "offset?"]
    output: CorrectedWageStatement[]
    side_effects: []

  - method: POST
    path: "/corrected-wage-statements/{statement_id}/issue"
    description: "Issue a drafted statement to the employee."
    roles: [PlatformAdmin, TaxPreparer]
    code: 200
    input: []
    output: CorrectedWageStatement
    side_effects: ["status set to ISSUED and issued_at stamped", "CorrectionCase.statement_status set to STMT_ISSUED", "CorrectionCase.corrected_wage_base_cents recomputed", "Employee.active_statement_count recomputed", "version incremented"]

  - method: POST
    path: "/corrected-wage-statements/{statement_id}/acknowledge"
    description: "Employee acknowledges receipt of an issued statement."
    roles: [PlatformAdmin, EmployeeSelfService]
    code: 200
    input: []
    output: CorrectedWageStatement
    side_effects: ["status set to ACKNOWLEDGED and acknowledged_at stamped", "CorrectionCase.statement_status set to STMT_COMPLETE when every statement on the case is terminal", "version incremented"]

  - method: POST
    path: "/corrected-wage-statements/{statement_id}/report-undeliverable"
    description: "Mark a mailed statement as returned by the postal channel. Only available when delivery_channel is MAIL."
    roles: [PlatformAdmin, TaxPreparer]
    code: 200
    input: [undeliverable_reason]
    output: CorrectedWageStatement
    side_effects: ["status set to RETURNED_UNDELIVERABLE", "CorrectionCase.corrected_wage_base_cents recomputed (the statement stops contributing)", "Employee.active_statement_count recomputed", "version incremented"]

  - method: POST
    path: "/corrected-wage-statements/{statement_id}/reissue"
    description: "Void a statement and create its successor in one operation, optionally switching delivery channel. Requires the statement's current version."
    roles: [PlatformAdmin, TaxPreparer]
    code: 201
    input: [expected_statement_version, "delivery_channel?", "reissue_reason?", "corrected_mailing_state_code?"]
    output: CorrectedWageStatement
    side_effects: ["predecessor status set to VOIDED", "a successor statement is created with supersedes_statement_id pointing at the predecessor, sequence_no incremented, and its box deltas recomputed by statement_box_deltas", "CorrectionCase.statement_status set to STMT_REISSUE_PENDING", "CorrectionCase.corrected_wage_base_cents and Employee.active_statement_count recomputed", "predecessor version incremented"]

  # -------------------------------------------------------------- WageRepayment
  - method: POST
    path: "/wage-repayments"
    description: "Propose recovery of wages overpaid to an employee. The recovery basis, amount due from the employee and amount recoverable from the agencies are all computed from the two tax years."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 201
    input: [correction_case_id, employee_id, overpaid_gross_cents, overpaid_income_tax_withheld_cents, overpaid_fica_withheld_cents, overpayment_tax_year, recovery_tax_year, "installment_count?"]
    output: WageRepayment
    side_effects: ["runs repayment_recovery_basis to derive recovery_basis, employee_due_cents and agency_recoverable_cents", "status set to PROPOSED"]

  - method: GET
    path: "/wage-repayments/{wage_repayment_id}"
    description: "Fetch one wage repayment arrangement with its derived basis and amounts."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: []
    output: WageRepayment
    side_effects: []

  - method: GET
    path: "/wage-repayments"
    description: "List wage repayment arrangements filtered by case, employee, basis or status."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: ["correction_case_id?", "employee_id?", "recovery_basis?", "status?", "limit?", "offset?"]
    output: WageRepayment[]
    side_effects: []

  - method: POST
    path: "/wage-repayments/{wage_repayment_id}/agree"
    description: "Employee agrees to the proposed repayment arrangement."
    roles: [PlatformAdmin, PayrollAnalyst, EmployeeSelfService]
    code: 200
    input: []
    output: WageRepayment
    side_effects: ["status set to AGREED", "version incremented"]

  - method: POST
    path: "/wage-repayments/{wage_repayment_id}/renegotiate"
    description: "Return an agreed arrangement to PROPOSED with revised amounts or a revised recovery year, re-deriving the recovery basis."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: ["overpaid_gross_cents?", "overpaid_income_tax_withheld_cents?", "overpaid_fica_withheld_cents?", "recovery_tax_year?", "installment_count?"]
    output: WageRepayment
    side_effects: ["status returned to PROPOSED", "repayment_recovery_basis re-run over the revised inputs", "version incremented"]

  - method: POST
    path: "/wage-repayments/{wage_repayment_id}/collect"
    description: "Record full collection of the amount due from the employee. The posted amount must equal employee_due_cents exactly. Starts the repayment cascade."
    roles: [PlatformAdmin, PayrollAnalyst]
    code: 200
    input: [collected_cents]
    output: WageRepayment
    side_effects: ["status set to COLLECTED", "every ISSUED statement for this employee and overpayment tax year is VOIDED and a successor statement is created with recomputed box deltas", "CorrectionCase.statement_status set to STMT_REISSUE_PENDING", "CorrectionCase.repayment_recovered_cents increased by agency_recoverable_cents", "CorrectionCase.status returned from REMEDIATION_PENDING to OPEN", "Employer.open_remediation_count recomputed", "version incremented"]

  - method: POST
    path: "/wage-repayments/{wage_repayment_id}/write-off"
    description: "Write off an agreed but uncollectable repayment. This is the divergent branch: no statement is voided and no cascade runs."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: [write_off_reason]
    output: WageRepayment
    side_effects: ["status set to WRITTEN_OFF", "no statement, case or employer field changes", "version incremented"]

  # --------------------------------------------------------------- AgencyNotice
  - method: POST
    path: "/agency-notices"
    description: "Record a notice received from an agency assessing tax, penalty and interest for a period. Recording a notice for a period suppresses the voluntary self-correction reduction on that period's penalty."
    roles: [PlatformAdmin, TaxOfficer]
    code: 201
    input: [employer_id, agency_id, tax_year, quarter, notice_number, assessed_tax_cents, assessed_penalty_cents, assessed_interest_cents, response_due_date, "correction_case_id?"]
    output: AgencyNotice
    side_effects: ["response_status set to RECEIVED and abatement_status set to NONE", "notice_number uniqueness enforced within the agency"]

  - method: GET
    path: "/agency-notices/{agency_notice_id}"
    description: "Fetch one agency notice with both of its state dimensions and its waiver outcome."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: []

  - method: GET
    path: "/agency-notices"
    description: "List agency notices filtered by employer, agency, case, period or either state dimension."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["employer_id?", "agency_id?", "correction_case_id?", "tax_year?", "quarter?", "response_status?", "abatement_status?", "limit?", "offset?"]
    output: AgencyNotice[]
    side_effects: []

  - method: POST
    path: "/agency-notices/{agency_notice_id}/draft-response"
    description: "Draft the narrative response and, optionally, the abatement request with its grounds and requested waiver amount."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: [response_narrative, "abatement_grounds?", "requested_penalty_waiver_cents?"]
    output: AgencyNotice
    side_effects: ["response_status set to RESPONSE_DRAFTED", "abatement_status set to REQUESTED when abatement_grounds is supplied", "abatement_round incremented when grounds are supplied", "version incremented"]

  - method: POST
    path: "/agency-notices/{agency_notice_id}/respond"
    description: "Transmit the drafted response to the agency. Must happen on or before response_due_date."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: ["response_status set to RESPONDED and responded_at stamped from the logical clock", "version incremented"]

  - method: POST
    path: "/agency-notices/{agency_notice_id}/request-info"
    description: "Record that the agency has asked for more information, sending the notice back for redrafting."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: ["info_request_note?"]
    output: AgencyNotice
    side_effects: ["response_status set to INFO_REQUESTED", "version incremented"]

  - method: POST
    path: "/agency-notices/{agency_notice_id}/record-outcome"
    description: "Record the agency's abatement decision and compute the penalty waiver. ABATED_FULL applies the de-minimis sweep once; ABATED_PARTIAL caps the waiver at the requested amount and skips the sweep."
    roles: [PlatformAdmin, TaxOfficer]
    code: 200
    input: [outcome, "agency_decision_reference?"]
    output: AgencyNotice
    side_effects: ["runs abatement_penalty_waiver to set waiver_pct_bps, waived_penalty_cents, waived_interest_cents and net_exposure_cents", "abatement_status set to GRANTED, PARTIALLY_GRANTED or DENIED", "response_status set to CLOSED", "Employer.granted_abatement_count incremented on a granted or partially granted outcome, read AFTER the waiver percentage was chosen", "CorrectionCase.total_exposure_cents and Employer.open_exposure_cents recomputed", "version incremented"]

  # ----------------------------------------------------------- ControlRemediation
  - method: POST
    path: "/control-remediations"
    description: "Record a control remediation action for a root cause on a case. One remediation is also auto-created by the amendment acceptance cascade, carrying the case dominant_root_cause_code."
    roles: [PlatformAdmin, ControlsAuditor]
    code: 201
    input: [correction_case_id, root_cause_code, control_gap_class, owner_user_id, target_date]
    output: ControlRemediation
    side_effects: ["status set to OPEN", "Employer.open_remediation_count recomputed"]

  - method: GET
    path: "/control-remediations/{control_remediation_id}"
    description: "Fetch one control remediation record."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: []
    output: ControlRemediation
    side_effects: []

  - method: GET
    path: "/control-remediations"
    description: "List control remediations filtered by case, root cause, gap class or status. Cascade-created remediations are discoverable only here."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep]
    code: 200
    input: ["correction_case_id?", "root_cause_code?", "control_gap_class?", "status?", "limit?", "offset?"]
    output: ControlRemediation[]
    side_effects: []

  - method: POST
    path: "/control-remediations/{control_remediation_id}/submit-verification"
    description: "Owner submits evidence that the control gap has been remediated."
    roles: [PlatformAdmin, ControlsAuditor, PayrollAnalyst]
    code: 200
    input: [evidence_reference]
    output: ControlRemediation
    side_effects: ["status set to SUBMITTED_FOR_VERIFICATION", "verification_round incremented", "version incremented"]

  - method: POST
    path: "/control-remediations/{control_remediation_id}/assign"
    description: "Assign the accountable owner (and optionally re-commit the target date) of a remediation. A remediation auto-created by the CorrectionCase join carries owner_user_id null, so this is the only way to give it an owner before verification can be requested."
    roles: [PlatformAdmin, ControlsAuditor]
    code: 200
    input: [owner_user_id, "target_date?"]
    output: ControlRemediation
    side_effects: ["owner_user_id set", "target_date replaced when supplied", "version incremented"]

  - method: POST
    path: "/control-remediations/{control_remediation_id}/verify"
    description: "Independent verification of submitted evidence. The acting X-User-ID must differ from owner_user_id."
    roles: [PlatformAdmin, ControlsAuditor]
    code: 200
    input: [passed, "verification_note?"]
    output: ControlRemediation
    side_effects: ["status set to VERIFIED (passed true) or VERIFICATION_FAILED (passed false)", "verified_by_user_id set from X-User-ID and verified_at stamped on the passing branch", "version incremented"]

  # ------------------------------------------------------ test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, cooling-off buffer, accrual date, prior-year rule and *_at stamp reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin, PayrollAnalyst, TaxPreparer, TaxOfficer, ControlsAuditor, EmployerRep, EmployeeSelfService]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock is set; no business row is modified"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not one of the seven declared roles, or is not listed in the endpoint's roles"
  - id: ERR_IDENTITY_NOT_RESOLVABLE
    http: 403
    condition: "an entity_backed role's X-User-ID does not name an existing Employer (EmployerRep) or Employee (EmployeeSelfService)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed caller addressed a row outside its own employer or employee scope"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "the acting X-User-ID equals AmendedReturn.prepared_by_user_id at sign, or equals ControlRemediation.owner_user_id at verify"

  # ---- existence
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employer_id in a path or body names no Employer"
  - id: ERR_TAX_AGENCY_NOT_FOUND
    http: 404
    condition: "tax_agency_id or agency_id names no TaxAgency"
  - id: ERR_AGENCY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "agency_account_id names no AgencyAccount"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee_id names no Employee"
  - id: ERR_REGISTER_LINE_NOT_FOUND
    http: 404
    condition: "register_line_id names no PayrollRegisterLine"
  - id: ERR_DEPOSIT_RECORD_NOT_FOUND
    http: 404
    condition: "deposit_record_id names no DepositRecord"
  - id: ERR_FILED_RETURN_NOT_FOUND
    http: 404
    condition: "filed_return_id names no FiledReturn"
  - id: ERR_CORRECTION_CASE_NOT_FOUND
    http: 404
    condition: "correction_case_id names no CorrectionCase"
  - id: ERR_DISCREPANCY_NOT_FOUND
    http: 404
    condition: "discrepancy_id names no Discrepancy"
  - id: ERR_AMENDED_RETURN_NOT_FOUND
    http: 404
    condition: "amended_return_id or supersedes_amended_return_id names no AmendedReturn"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "statement_id or supersedes_statement_id names no CorrectedWageStatement"
  - id: ERR_WAGE_REPAYMENT_NOT_FOUND
    http: 404
    condition: "wage_repayment_id names no WageRepayment"
  - id: ERR_AGENCY_NOTICE_NOT_FOUND
    http: 404
    condition: "agency_notice_id names no AgencyNotice"
  - id: ERR_CONTROL_REMEDIATION_NOT_FOUND
    http: 404
    condition: "control_remediation_id names no ControlRemediation"

  # ---- schema
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, unknown enum value, negative cents amount, quarter outside 1..4, workday_ratio_bps outside 0..10000, or fein not matching ^[0-9]{2}-[0-9]{7}$"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative on a list endpoint"
  - id: ERR_INVALID_RECOVERY_YEAR
    http: 400
    condition: "recovery_tax_year earlier than overpayment_tax_year, or withheld components exceeding overpaid_gross_cents"

  # ---- optimistic concurrency
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_correction_case_version does not equal the CorrectionCase's current version at POST /amended-returns"
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "expected_statement_version does not equal the CorrectedWageStatement's current version at reissue"

  # ---- state
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed entity's state field does not permit the requested transition"
  - id: ERR_AMENDED_RETURN_NOT_SIGNED
    http: 409
    condition: "submit was attempted on an amended return that is not in status SIGNED"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "a transition was attempted out of a terminal state (VOID, ACCEPTED, VOIDED, ACKNOWLEDGED, COLLECTED, WRITTEN_OFF, CANCELLED, CLOSED, VERIFIED, NO_VARIANCE)"
  - id: ERR_UNCATEGORIZED_DISCREPANCIES
    http: 409
    condition: "prepare was attempted while the case still has OPEN discrepancies, or has no CATEGORIZED discrepancy at all"

  # ---- business referential
  - id: ERR_SCOPE_MISMATCH
    http: 422
    condition: "rows joined into one operation do not share the same employer, agency, case, employee or period scope"
  - id: ERR_AGENCY_ACCOUNT_NOT_ACTIVE
    http: 422
    condition: "the agency requires registration but no ACTIVE or RETRO_ACTIVE AgencyAccount covers the case's period ordinal"
  - id: ERR_REMEDIATION_NOT_VERIFIED
    http: 409
    condition: "case closure was attempted while a ControlRemediation on the case is not VERIFIED"
  - id: ERR_CASE_HAS_NO_DISCREPANCIES
    http: 409
    condition: "an AmendedReturn was opened on a CorrectionCase that has no Discrepancy rows at all"
  - id: ERR_REPAYMENT_NOT_SETTLED
    http: 409
    condition: "case closure was attempted while a WageRepayment on the case is still PROPOSED or AGREED"

  # ---- business temporal
  - id: ERR_AMENDMENT_WINDOW_CLOSED
    http: 422
    condition: "submission occurs after FiledReturn.original_due_date plus TaxAgency.amendment_window_days"
  - id: ERR_AMENDMENT_COOLING_OFF_ACTIVE
    http: 409
    condition: "fewer whole days than TaxAgency.min_days_between_amendments have elapsed since the previous amendment for the same period was submitted"
  - id: ERR_INVALID_ACCRUAL_DATE
    http: 422
    condition: "accrual_through_date precedes the filed return's original_due_date or lies after the current logical instant"
  - id: ERR_NOTICE_RESPONSE_OVERDUE
    http: 422
    condition: "the notice response was transmitted after response_due_date"
  - id: ERR_PRIOR_YEAR_WINDOW_CLOSED
    http: 422
    condition: "a corrected wage statement was drafted or issued for a tax year more than three calendar years before the current logical year"

  # ---- business constraint
  - id: ERR_AMENDMENT_SLOT_OCCUPIED
    http: 409
    condition: "another AmendedReturn for the same case and form_code is already in DRAFT, PREPARED, SIGNED or SUBMITTED"
  - id: ERR_ACCOUNT_PERIOD_OVERLAP
    http: 409
    condition: "a new AgencyAccount's closed-closed period-ordinal interval overlaps a sibling account for the same employer and agency (touching endpoints are adjacent, not overlapping)"
  - id: ERR_DUPLICATE_FILED_RETURN
    http: 409
    condition: "a FiledReturn already exists for the same employer, agency, tax year, quarter and form code"
  - id: ERR_DUPLICATE_EMPLOYER_FEIN
    http: 409
    condition: "another Employer already carries the same fein"
  - id: ERR_DUPLICATE_NOTICE_NUMBER
    http: 409
    condition: "another AgencyNotice for the same agency already carries the same notice_number"
  - id: ERR_DUPLICATE_AGENCY_CODE
    http: 409
    condition: "another TaxAgency already carries the same agency_code"
  - id: ERR_NO_REPORTABLE_DELTA
    http: 422
    condition: "statement_box_deltas produced zero for all three of wage_delta_cents, fica_wage_delta_cents and withholding_delta_cents"
  - id: ERR_NO_FILED_RETURN_FOR_PERIOD
    http: 422
    condition: "reconciliation was requested for a scope with no FiledReturn in status FILED or AMENDED"
  - id: ERR_CHANNEL_NOT_UNDELIVERABLE_CAPABLE
    http: 422
    condition: "report-undeliverable was attempted on a statement whose delivery_channel is PORTAL"

  # ---- business fiscal
  - id: ERR_AUTHORIZATION_LIMIT_EXCEEDED
    http: 422
    condition: "signing would leave CorrectionCase.total_exposure_cents above Employer.authorization_limit_cents"
  - id: ERR_OVERCOLLECTION
    http: 422
    condition: "collected_cents does not equal WageRepayment.employee_due_cents"
  - id: ERR_WAIVER_EXCEEDS_ASSESSMENT
    http: 422
    condition: "requested_penalty_waiver_cents exceeds assessed_penalty_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operations superuser; may perform every declared operation, subject to the same segregation-of-duties rules as everyone else."
    identity: "opaque"
    exclusive_operations:
      - "POST /employers"
      - "PATCH /employers/{employer_id}"
      - "POST /tax-agencies"
      - "POST /agency-accounts/{agency_account_id}/close"
    shared_operations:
      - "every other declared endpoint"

  - name: PayrollAnalyst
    description: "Owns the payroll data and the detection side: posts register lines and deposits, opens cases, runs reconciliation, categorises discrepancies, and proposes wage repayments."
    identity: "opaque"
    exclusive_operations:
      - "POST /payroll-register-lines"
      - "POST /deposit-records"
      - "POST /correction-cases"
      - "POST /correction-cases/{correction_case_id}/reconcile"
      - "POST /discrepancies/{discrepancy_id}/categorize"
      - "POST /discrepancies/{discrepancy_id}/dismiss"
      - "POST /wage-repayments"
      - "POST /wage-repayments/{wage_repayment_id}/renegotiate"
      - "POST /wage-repayments/{wage_repayment_id}/collect"
    shared_operations:
      - "POST /agency-accounts"
      - "POST /agency-accounts/{agency_account_id}/activate"
      - "POST /employees"
      - "POST /filed-returns"
      - "POST /wage-repayments/{wage_repayment_id}/agree"
      - "POST /control-remediations/{control_remediation_id}/submit-verification"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TaxPreparer
    description: "Prepares amendments and corrected wage statements. May never sign, submit, or record an agency outcome for anything it prepared."
    identity: "opaque"
    exclusive_operations:
      - "POST /amended-returns"
      - "POST /amended-returns/{amended_return_id}/prepare"
      - "POST /corrected-wage-statements"
      - "POST /corrected-wage-statements/{statement_id}/issue"
      - "POST /corrected-wage-statements/{statement_id}/report-undeliverable"
      - "POST /corrected-wage-statements/{statement_id}/reissue"
    shared_operations:
      - "POST /filed-returns"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TaxOfficer
    description: "Independent signing and agency-facing authority: signs and submits amendments, records agency outcomes, handles notices and abatement requests, writes off repayments and closes cases."
    identity: "opaque"
    exclusive_operations:
      - "POST /amended-returns/{amended_return_id}/sign"
      - "POST /amended-returns/{amended_return_id}/submit"
      - "POST /amended-returns/{amended_return_id}/agency-outcome"
      - "POST /amended-returns/{amended_return_id}/void"
      - "POST /agency-notices"
      - "POST /agency-notices/{agency_notice_id}/draft-response"
      - "POST /agency-notices/{agency_notice_id}/respond"
      - "POST /agency-notices/{agency_notice_id}/request-info"
      - "POST /agency-notices/{agency_notice_id}/record-outcome"
      - "POST /wage-repayments/{wage_repayment_id}/write-off"
      - "POST /correction-cases/{correction_case_id}/close"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ControlsAuditor
    description: "Owns root-cause remediation and its independent verification. Read-only over the tax filing surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /control-remediations"
      - "POST /control-remediations/{control_remediation_id}/assign"
      - "POST /control-remediations/{control_remediation_id}/verify"
    shared_operations:
      - "POST /control-remediations/{control_remediation_id}/submit-verification"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: EmployerRep
    description: "The employer acting on its own behalf. X-User-ID is the Employer.id, and every read is confined to rows in that employer's chain."
    identity: "entity_backed:Employer"
    exclusive_operations: []
    shared_operations:
      - "POST /employees"
      - "every GET endpoint, scoped to the caller's own employer"
      - "POST /_clock/set_current_utc"

  - name: EmployeeSelfService
    description: "The employee acting on their own behalf. X-User-ID is the Employee.id; may acknowledge their own corrected statements and agree to their own repayment arrangements."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /corrected-wage-statements/{statement_id}/acknowledge"
    shared_operations:
      - "POST /wage-repayments/{wage_repayment_id}/agree"
      - "GET /employees/{employee_id}, GET /corrected-wage-statements, GET /corrected-wage-statements/{statement_id}, GET /wage-repayments, GET /wage-repayments/{wage_repayment_id}, all scoped to the caller's own employee row"
      - "POST /_clock/set_current_utc"
