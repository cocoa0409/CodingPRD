# =============================================================================
# task_1374_community_composting_drop_off_program — SCAFFOLD.yaml
# =============================================================================

scenario: |
  Community Composting Drop-Off Program (city compost drop-off program): site
  network & accepted-material list, participant registration & access
  code/bucket program, contamination monitoring & feedback to participants,
  collection route from drop sites & processing partner, finished compost
  distribution back to participants, odor/vector complaint response, tonnage
  diversion reporting to municipality, site host agreement & maintenance

domain_name: community-composting-drop-off
api_prefix: /

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - selector_policy
    - soft_delete
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: fiscal_year, type: integer, source: input, description: "Reporting fiscal year (e.g., 2026)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }
      - { name: posture_contam_threshold, type: integer, source: input, default: 3, description: "Open contamination reports at a site that force posture WATCH (>=) and SUSPENDED (>= 2x)" }
      - { name: posture_complaint_threshold, type: integer, source: input, default: 2, description: "Unresolved odor/vector complaints in rolling 14-day window forcing posture WATCH (>=)" }
      - { name: diversion_credit_rate, type: number, source: input, default: 1.0, description: "Bucket-credit points granted per net kg of accepted drop" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotonic counter bumped by run_ops checkpoint" }
      - { name: total_diverted_kg, type: number, source: computed, default: 0, description: "Sum of final_net_kg over all CONFIRMED DropEvents in program" }
      - { name: total_contamination_kg, type: number, source: computed, default: 0, description: "Sum of contamination_kg over all CONFIRMED DropEvents" }

  - name: Site
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: capacity_kg, type: integer, source: input, description: "Maximum on-site stored kilograms before posture degrades" }
      - { name: stored_kg, type: number, source: computed, default: 0, description: "Current on-site mass: sum of net drop kg minus sum of route pickup kg" }
      - { name: pending_pickup_kg, type: number, source: computed, default: 0, description: "Mass committed to SCHEDULED RouteStops not yet COLLECTED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | WATCH | SUSPENDED | CLOSED — derived; gates drop acceptance" }
      - { name: host_agreement_id, type: string, source: system, description: "FK -> SiteHostAgreement.id; currently effective agreement (null when none ACTIVE)" }
      - { name: archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived sites excluded from default list" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | OPERATIONAL | DECOMMISSIONED" }

  - name: SiteHostAgreement
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; covered site" }
      - { name: host_name, type: string, source: input, description: "Legal name of site host" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive term start (ISO8601 UTC, date precision)" }
      - { name: term_end, type: datetime, source: input, description: "Exclusive term end (ISO8601 UTC, date precision)" }
      - { name: cure_period_days, type: integer, source: input, default: 14, description: "Days after breach notice before termination allowed" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | BREACH_NOTICED | TERMINATED | EXPIRED" }
      - { name: breach_noticed_at, type: datetime, source: system, description: "When breach notice was issued (null otherwise)" }

  - name: MaterialCategory
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: code, type: string, source: input, description: "Unique code within program (e.g., FOOD_SCRAPS, YARD_WASTE)" }
      - { name: description, type: string, source: input, description: "Human description" }
      - { name: accepted_start_month_day, type: string, source: input, description: "MM-DD inclusive season start; annual window may wrap year boundary" }
      - { name: accepted_end_month_day, type: string, source: input, description: "MM-DD inclusive season end; if < start, window wraps Dec→Jan" }
      - { name: contamination_sensitivity, type: enum, source: input, description: "LOW | MEDIUM | HIGH — drives rejection thresholds" }
      - { name: active, type: boolean, source: input, default: true, description: "Soft toggle; inactive categories rejected at intake" }

  - name: Participant
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: email, type: string, source: input, description: "Contact email; unique within program" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: household_size, type: integer, source: input, description: "Household size used in distribution fair-share" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFY | ACTIVE | SUSPENDED | DEACTIVATED" }
      - { name: verification_token, type: string, source: system, description: "Token issued at registration; required to activate" }
      - { name: bucket_credit_balance, type: integer, source: computed, default: 0, description: "Credits available for compost distribution redemption" }
      - { name: bucket_credits_granted_total, type: integer, source: computed, default: 0, description: "Lifetime credits granted from confirmed drops" }
      - { name: bucket_credits_redeemed_total, type: integer, source: computed, default: 0, description: "Lifetime credits redeemed via distributions" }
      - { name: bucket_credits_expired_total, type: integer, source: computed, default: 0, description: "Lifetime credits expired by ops run" }
      - { name: suspension_count, type: integer, source: system, default: 0, description: "Number of times suspended; 3rd suspension is permanent" }

  - name: AccessGrant
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site this grant opens" }
      - { name: access_code, type: string, source: system, description: "Server-minted 8-char code; unique per (site_id, status=ACTIVE)" }
      - { name: bucket_quota, type: integer, source: input, description: "Number of buckets the participant may hold at once at this site" }
      - { name: buckets_checked_out, type: integer, source: system, default: 0, description: "Currently held buckets" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED" }
      - { name: expires_at, type: datetime, source: input, description: "Grant expiry; ops run flips ACTIVE→EXPIRED at/after this" }

  - name: DropEvent
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: access_grant_id, type: string, source: input, description: "FK -> AccessGrant.id used for entry" }
      - { name: material_category_id, type: string, source: input, description: "FK -> MaterialCategory.id" }
      - { name: gross_weight_kg, type: number, source: input, description: "Scale reading, must be > 0" }
      - { name: contamination_kg, type: number, source: input, description: "Estimated contaminant mass in [0, gross_weight_kg]" }
      - { name: provisional_net_kg, type: number, source: computed, description: "gross_weight_kg - contamination_kg, rounded to 0.01 kg half-up" }
      - { name: final_net_kg, type: number, source: computed, description: "Partner-confirmed net mass after batch reconciliation; null until batch closes" }
      - { name: credit_state, type: enum, source: system, description: "UNCREDITED | PROVISIONALLY_CREDITED | FINALLY_CREDITED | REVOKED" }
      - { name: verification_state, type: enum, source: system, description: "PENDING_AUDIT | ACCEPTED | FLAGGED_CONTAMINATED | REJECTED" }
      - { name: processing_batch_id, type: string, source: system, description: "FK -> ProcessingBatch.id; assigned when batch closes over this event" }
      - { name: occurred_at, type: datetime, source: input, description: "When the drop physically occurred" }

  - name: ContaminationReport
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: drop_event_id, type: string, source: input, description: "FK -> DropEvent.id that triggered the report (null for site-wide audits)" }
      - { name: auditor_id, type: string, source: input, description: "X-User-ID of MunicipalAuditor recording the finding" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: finding_note, type: string, source: input, description: "Free text" }
      - { name: feedback_sent_at, type: datetime, source: system, description: "Timestamp when feedback was dispatched to participant; null until sent" }
      - { name: status, type: enum, source: system, description: "OPEN | FEEDBACK_SENT | RESOLVED | DISMISSED" }

  - name: CollectionRoute
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: route_code, type: string, source: input, description: "Unique route code within program" }
      - { name: vehicle_capacity_kg, type: integer, source: input, description: "Maximum payload kg per run" }
      - { name: processing_partner_id, type: string, source: input, description: "FK -> ProcessingPartner.id that receives loads" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | COMPLETED | CANCELLED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Route departure window start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Route return window end (UTC, exclusive)" }
      - { name: assigned_load_kg, type: number, source: computed, default: 0, description: "Sum of planned pickup kg over its RouteStops" }

  - name: ProcessingPartner
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Partner name" }
      - { name: intake_capacity_kg_per_day, type: integer, source: input, description: "Daily intake cap" }
      - { name: yield_ratio, type: number, source: input, description: "Finished compost kg produced per net input kg, in (0,1]" }
      - { name: contamination_reject_threshold_pct, type: number, source: input, description: "Batch contamination % at/above which batch is REJECTED" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive partners cannot be assigned new routes" }

  - name: RouteStop
    parent: CollectionRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> CollectionRoute.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id visited" }
      - { name: planned_pickup_kg, type: integer, source: input, description: "Planned mass to remove from site" }
      - { name: actual_pickup_kg, type: number, source: input, description: "Driver-recorded mass picked up; null until stop completed" }
      - { name: stop_sequence, type: integer, source: input, description: "Order within route; unique per route" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COLLECTED | SKIPPED | CANCELLED" }

  - name: ProcessingBatch
    parent: ProcessingPartner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> ProcessingPartner.id" }
      - { name: route_id, type: string, source: input, description: "FK -> CollectionRoute.id that delivered the load" }
      - { name: input_gross_kg, type: number, source: system, description: "Sum of actual_pickup_kg across route COLLECTED stops at batch open" }
      - { name: measured_contamination_kg, type: number, source: input, description: "Partner-measured contaminant mass for the batch" }
      - { name: measured_net_kg, type: number, source: computed, description: "input_gross_kg - measured_contamination_kg" }
      - { name: contamination_pct, type: number, source: computed, description: "measured_contamination_kg / input_gross_kg * 100, rounded to 0.01 half-up" }
      - { name: finished_compost_kg, type: number, source: computed, description: "measured_net_kg * partner.yield_ratio, rounded to 0.01 half-up; 0 when REJECTED" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_ACCEPTED | CLOSED_REJECTED" }
      - { name: closed_at, type: datetime, source: system, description: "When batch was closed" }

  - name: CompostDistribution
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> ProcessingBatch.id whose finished compost is being distributed" }
      - { name: total_pool_kg, type: number, source: system, description: "Batch finished_compost_kg at distribution open; immutable snapshot" }
      - { name: allocated_kg, type: number, source: computed, default: 0, description: "Sum of allocation_kg over DISTRIBUTED DistributionAllocations" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | CANCELLED" }
      - { name: opened_at, type: datetime, source: system, description: "When distribution opened" }

  - name: DistributionAllocation
    parent: CompostDistribution
    common_fields: false
    fields:
      - { name: distribution_id, type: string, source: system, description: "FK -> CompostDistribution.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: requested_kg, type: number, source: input, description: "Participant-requested mass" }
      - { name: credits_redeemed, type: integer, source: input, description: "Bucket credits spent on this allocation (1 credit = 1 kg max request)" }
      - { name: allocation_kg, type: number, source: computed, description: "Final granted mass after fair-share clamp" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISTRIBUTED | CANCELLED" }

  - name: ComplaintTicket
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: reporter_contact, type: string, source: input, description: "Free-form reporter handle" }
      - { name: kind, type: enum, source: input, description: "ODOR | VECTOR | OTHER" }
      - { name: description, type: string, source: input, description: "Complaint text" }
      - { name: reported_at, type: datetime, source: input, description: "When the complaint was received" }
      - { name: sla_due_at, type: datetime, source: computed, description: "reported_at + 72h" }
      - { name: acknowledged_at, type: datetime, source: system, description: "When an operator acknowledged; null until ack" }
      - { name: resolved_at, type: datetime, source: system, description: "When resolved; null otherwise" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Set true by ops run if unresolved at sla_due_at; never cleared" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times ticket has been REOPENED" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED | REOPENED | CLOSED" }

  - name: DiversionReport
    parent: Program
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive UTC window start" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive UTC window end" }
      - { name: method, type: enum, source: input, description: "PROVISIONAL_NET | FINAL_NET — selects calculation variant" }
      - { name: gross_diverted_kg, type: number, source: computed, description: "Sum of gross_weight_kg over included DropEvents" }
      - { name: net_diverted_kg, type: number, source: computed, description: "Method-dependent net mass (see diversion_net_kg calc)" }
      - { name: contamination_kg, type: number, source: computed, description: "Sum of contamination_kg over included DropEvents" }
      - { name: diversion_rate_pct, type: number, source: computed, description: "net_diverted_kg / gross_diverted_kg * 100, 0 when gross is 0, rounded 0.01 half-up" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of certifying MunicipalAuditor; null until certified" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{programId}/activate"
        actor: ProgramAdmin
        preconditions:
          - "At least one Site in OPERATIONAL status under this program (ERR_PROGRAM_NO_OPERATIONAL_SITE)"
          - "At least one MaterialCategory with active=true (ERR_PROGRAM_NO_MATERIAL_CATEGORY)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{programId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "All sites: posture forced to SUSPENDED until program re-activated"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{programId}/activate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "All sites: posture recomputed from scratch"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramAdmin
        preconditions:
          - "No Site with status OPERATIONAL remains (ERR_PROGRAM_HAS_OPERATIONAL_SITES)"
        side_effects: []

  - entity: Site
    initial_state: ONBOARDING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ONBOARDING
        to: OPERATIONAL
        trigger: "POST /programs/{programId}/sites/{siteId}/commission"
        actor: ProgramAdmin
        preconditions:
          - "An ACTIVE SiteHostAgreement exists with site_id == this site (ERR_SITE_NO_ACTIVE_AGREEMENT)"
          - "Program is ACTIVE"
        side_effects:
          - "posture recomputed (starts OPEN when stored_kg==0 and no open reports)"
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /programs/{programId}/sites/{siteId}/decommission"
        actor: ProgramAdmin
        preconditions:
          - "stored_kg == 0 (ERR_SITE_NOT_EMPTY)"
          - "No RouteStop in SCHEDULED status for this site (ERR_SITE_HAS_SCHEDULED_PICKUPS)"
          - "No AccessGrant in ACTIVE status referencing this site (ERR_SITE_HAS_ACTIVE_GRANTS)"
        side_effects:
          - "ACTIVE SiteHostAgreement for this site → TERMINATED (host_agreement_id cleared)"
          - "posture → CLOSED"
      - from: OPERATIONAL
        to: OPERATIONAL
        trigger: "system (posture recompute after DropEvent create / ContaminationReport status change / ComplaintTicket status change / RouteStop COLLECTED / run_ops)"
        actor: system
        preconditions: []
        side_effects:
          - "posture recomputed per site_posture calculation"
        note: "Posture is a derived parallel dimension, not a user-set state"

  - entity: SiteHostAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{programId}/host-agreements/{agreementId}/activate"
        actor: ProgramAdmin
        preconditions:
          - "term_end > term_start (ERR_INVALID_TERM)"
          - "No other ACTIVE agreement for the same site_id whose [term_start, term_end) overlaps this one (ERR_AGREEMENT_OVERLAP)"
          - "term_end > current logical clock (ERR_AGREEMENT_ALREADY_EXPIRED)"
        side_effects:
          - "Site.host_agreement_id set to this agreement when site_id matches and no other ACTIVE agreement"
      - from: ACTIVE
        to: BREACH_NOTICED
        trigger: "POST /programs/{programId}/host-agreements/{agreementId}/breach-notice"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "breach_noticed_at = current logical clock"
      - from: BREACH_NOTICED
        to: ACTIVE
        trigger: "POST /programs/{programId}/host-agreements/{agreementId}/cure"
        actor: ProgramAdmin
        preconditions:
          - "current logical clock < breach_noticed_at + cure_period_days (ERR_CURE_PERIOD_ELAPSED)"
        side_effects:
          - "breach_noticed_at cleared to null"
      - from: BREACH_NOTICED
        to: TERMINATED
        trigger: "POST /programs/{programId}/host-agreements/{agreementId}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "current logical clock >= breach_noticed_at + cure_period_days (ERR_CURE_PERIOD_NOT_ELAPSED)"
        side_effects:
          - "If Site.host_agreement_id == this agreement: clear it and force Site posture recompute"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /programs/{programId}/host-agreements/{agreementId}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "If Site.host_agreement_id == this agreement: clear it and force Site posture recompute"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_ops when current logical clock >= term_end)"
        actor: system
        preconditions: []
        side_effects:
          - "If Site.host_agreement_id == this agreement: clear it"
          - "Linked Site in OPERATIONAL: posture recompute; if no other ACTIVE agreement covers the site, posture → CLOSED"

  - entity: Participant
    initial_state: PENDING_VERIFY
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_VERIFY
        to: ACTIVE
        trigger: "POST /programs/{programId}/participants/{participantId}/verify"
        actor: Anonymous
        preconditions:
          - "verification_token matches (ERR_INVALID_VERIFICATION_TOKEN)"
        side_effects:
          - "verification_token cleared"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{programId}/participants/{participantId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "suspension_count += 1"
          - "If suspension_count >= 3: status transitions directly to DEACTIVATED instead"
          - "All ACTIVE AccessGrants for participant → REVOKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{programId}/participants/{participantId}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "suspension_count < 3 (ERR_PARTICIPANT_PERMANENTLY_DEACTIVATED)"
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /programs/{programId}/participants/{participantId}/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "No REQUESTED DistributionAllocations exist for participant (ERR_PARTICIPANT_HAS_PENDING_ALLOCATIONS)"
        side_effects:
          - "All ACTIVE AccessGrants → REVOKED"
          - "bucket_credit_balance transferred to bucket_credits_expired_total (zeroed out via expiry invariant)"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /programs/{programId}/participants/{participantId}/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "No REQUESTED DistributionAllocations exist (ERR_PARTICIPANT_HAS_PENDING_ALLOCATIONS)"
        side_effects:
          - "All ACTIVE AccessGrants → REVOKED"
          - "bucket_credit_balance folded into bucket_credits_expired_total"

  - entity: AccessGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /programs/{programId}/participants/{participantId}/grants/{grantId}/revoke OR cascaded from Participant suspend/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "buckets_checked_out == 0 (ERR_BUCKETS_STILL_OUT)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_ops when current logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "If buckets_checked_out > 0: a ContaminationReport of severity MINOR is auto-opened on the grant's site documenting overdue buckets"

  - entity: DropEvent
    initial_state: PENDING_AUDIT
    terminal_states: [REJECTED]
    note: "Two parallel dimensions: verification_state (PENDING_AUDIT | ACCEPTED | FLAGGED_CONTAMINATED | REJECTED) × credit_state (UNCREDITED | PROVISIONALLY_CREDITED | FINALLY_CREDITED | REVOKED)"
    transitions:
      - from: PENDING_AUDIT
        to: ACCEPTED
        trigger: "POST /programs/{programId}/sites/{siteId}/drops/{dropId}/accept"
        actor: SiteHost
        preconditions:
          - "Site containing the drop is not archived"
        side_effects:
          - "credit_state: UNCREDITED → PROVISIONALLY_CREDITED"
          - "Participant.bucket_credit_balance += round(provisional_net_kg * program.diversion_credit_rate) (credits granted at 0.01-kg precision before integer rounding)"
          - "Participant.bucket_credits_granted_total incremented by the same amount"
      - from: PENDING_AUDIT
        to: FLAGGED_CONTAMINATED
        trigger: "POST /programs/{programId}/sites/{siteId}/contamination-reports (auto: creating a report with drop_event_id == this drop)"
        actor: MunicipalAuditor
        preconditions: []
        side_effects:
          - "credit_state stays UNCREDITED until resolved"
      - from: FLAGGED_CONTAMINATED
        to: ACCEPTED
        trigger: "system (when the linked ContaminationReport transitions to RESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same credit side effects as PENDING_AUDIT → ACCEPTED"
      - from: FLAGGED_CONTAMINATED
        to: REJECTED
        trigger: "system (when the linked ContaminationReport transitions to DISMISSED with severity CRITICAL) OR POST .../drops/{dropId}/reject"
        actor: system
        preconditions: []
        side_effects:
          - "Site.stored_kg -= provisional_net_kg (mass never accepted)"
          - "credit_state → REVOKED"
      - from: ACCEPTED
        to: ACCEPTED
        trigger: "system (when a ProcessingBatch covering this drop closes CLOSED_ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "credit_state: PROVISIONALLY_CREDITED → FINALLY_CREDITED"
          - "final_net_kg assigned per batch reconciliation (drop_final_net calc)"
          - "If final_net_kg != provisional_net_kg: Participant.bucket_credit_balance adjusted by the signed delta (rounded per credit rounding rule)"

  - entity: ContaminationReport
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: FEEDBACK_SENT
        trigger: "POST /programs/{programId}/sites/{siteId}/contamination-reports/{reportId}/send-feedback"
        actor: ProgramAdmin
        preconditions:
          - "drop_event_id is not null (ERR_FEEDBACK_REQUIRES_DROP_LINK)"
        side_effects:
          - "feedback_sent_at = current logical clock"
      - from: FEEDBACK_SENT
        to: RESOLVED
        trigger: "POST /programs/{programId}/sites/{siteId}/contamination-reports/{reportId}/resolve"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Linked DropEvent (if any) in FLAGGED_CONTAMINATED → ACCEPTED with credit side effects"
          - "Site posture recompute (open-report count decreased)"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /programs/{programId}/sites/{siteId}/contamination-reports/{reportId}/resolve"
        actor: ProgramAdmin
        preconditions:
          - "drop_event_id is null (site-wide audit reports may resolve without feedback)"
        side_effects:
          - "Site posture recompute"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /programs/{programId}/sites/{siteId}/contamination-reports/{reportId}/dismiss"
        actor: MunicipalAuditor
        preconditions: []
        side_effects:
          - "If severity == CRITICAL and drop_event_id not null: linked DropEvent → REJECTED"
          - "Site posture recompute"

  - entity: CollectionRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /programs/{programId}/routes/{routeId}/dispatch"
        actor: RouteOperator
        preconditions:
          - "At least one RouteStop in SCHEDULED status (ERR_ROUTE_HAS_NO_STOPS)"
          - "assigned_load_kg <= vehicle_capacity_kg (ERR_ROUTE_OVER_CAPACITY)"
          - "ProcessingPartner.active == true (ERR_PARTNER_INACTIVE)"
          - "No other DISPATCHED route with the same processing_partner_id whose [scheduled_start, scheduled_end) overlaps this route's window (ERR_PARTNER_DOUBLE_BOOKED)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /programs/{programId}/routes/{routeId}/complete"
        actor: RouteOperator
        preconditions:
          - "Every RouteStop is in {COLLECTED, SKIPPED, CANCELLED} (ERR_ROUTE_STOPS_PENDING)"
        side_effects:
          - "For each COLLECTED stop: Site.stored_kg -= actual_pickup_kg; Site.pending_pickup_kg -= planned_pickup_kg; Site posture recompute"
          - "A ProcessingBatch is opened at the route's partner with input_gross_kg = sum(actual_pickup_kg over COLLECTED stops) (0 stops → no batch)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /programs/{programId}/routes/{routeId}/cancel"
        actor: RouteOperator
        preconditions: []
        side_effects:
          - "All SCHEDULED RouteStops → CANCELLED; Site.pending_pickup_kg -= planned_pickup_kg per stop; Site posture recompute"

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COLLECTED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /programs/{programId}/routes/{routeId}/stops/{stopId}/collect"
        actor: RouteOperator
        preconditions:
          - "Parent route is DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "actual_pickup_kg provided, 0 <= actual_pickup_kg <= site.stored_kg + site.pending_pickup_kg (ERR_PICKUP_EXCEEDS_AVAILABLE)"
        side_effects:
          - "actual_pickup_kg recorded"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /programs/{programId}/routes/{routeId}/stops/{stopId}/skip"
        actor: RouteOperator
        preconditions:
          - "Parent route is DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
        side_effects:
          - "Site.pending_pickup_kg -= planned_pickup_kg; Site posture recompute"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "cascade from CollectionRoute cancel, or POST .../stops/{stopId}/cancel while route is PLANNED"
        actor: RouteOperator
        preconditions:
          - "Parent route is PLANNED for direct cancel (ERR_ROUTE_NOT_PLANNED)"
        side_effects:
          - "Site.pending_pickup_kg -= planned_pickup_kg; Site posture recompute"

  - entity: ProcessingBatch
    initial_state: OPEN
    terminal_states: [CLOSED_ACCEPTED, CLOSED_REJECTED]
    transitions:
      - from: OPEN
        to: CLOSED_ACCEPTED
        trigger: "POST /programs/{programId}/partners/{partnerId}/batches/{batchId}/close"
        actor: ProcessingPartner
        preconditions:
          - "measured_contamination_kg provided"
          - "contamination_pct < partner.contamination_reject_threshold_pct"
        side_effects:
          - "measured_net_kg, contamination_pct, finished_compost_kg computed"
          - "closed_at = current logical clock"
          - "For every ACCEPTED DropEvent whose site was served by the batch's route in this run: assign processing_batch_id, compute final_net_kg via drop_final_net, flip credit_state → FINALLY_CREDITED with delta adjustment"
      - from: OPEN
        to: CLOSED_REJECTED
        trigger: "POST /programs/{programId}/partners/{partnerId}/batches/{batchId}/close"
        actor: ProcessingPartner
        preconditions:
          - "contamination_pct >= partner.contamination_reject_threshold_pct"
        side_effects:
          - "finished_compost_kg = 0"
          - "All DropEvents linked to stops on this route: verification_state → FLAGGED_CONTAMINATED with a new OPEN ContaminationReport (severity MAJOR, drop_event_id set) auto-created per drop; provisional credits reversed"
          - "closed_at = current logical clock"

  - entity: CompostDistribution
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /programs/{programId}/distributions/{distributionId}/close"
        actor: ProgramAdmin
        preconditions:
          - "No REQUESTED allocations remain (ERR_DISTRIBUTION_HAS_PENDING_REQUESTS)"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /programs/{programId}/distributions/{distributionId}/cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "All REQUESTED allocations → CANCELLED; credits_redeemed refunded to Participant.bucket_credit_balance"

  - entity: DistributionAllocation
    initial_state: REQUESTED
    terminal_states: [DISTRIBUTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISTRIBUTED
        trigger: "POST /programs/{programId}/distributions/{distributionId}/allocations/{allocationId}/distribute"
        actor: ProgramAdmin
        preconditions:
          - "Parent distribution is OPEN"
          - "allocation_kg computed via distribution_fair_share; distribution.allocated_kg + allocation_kg <= distribution.total_pool_kg (ERR_DISTRIBUTION_POOL_EXHAUSTED)"
        side_effects:
          - "Participant.bucket_credit_balance -= credits_redeemed; bucket_credits_redeemed_total += credits_redeemed"
          - "Distribution.allocated_kg += allocation_kg"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST .../allocations/{allocationId}/cancel or cascade from distribution cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "credits_redeemed refunded to Participant.bucket_credit_balance (no redemption counted)"

  - entity: ComplaintTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /programs/{programId}/sites/{siteId}/complaints/{complaintId}/acknowledge"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "acknowledged_at = current logical clock"
      - from: OPEN
        to: RESOLVED
        trigger: "POST .../complaints/{complaintId}/resolve"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "resolved_at = current logical clock; Site posture recompute"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST .../complaints/{complaintId}/resolve"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "resolved_at = current logical clock; Site posture recompute"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST .../complaints/{complaintId}/reopen"
        actor: MunicipalAuditor
        preconditions:
          - "reopen_count < 2 (ERR_COMPLAINT_REOPEN_LIMIT)"
        side_effects:
          - "reopen_count += 1; resolved_at cleared; Site posture recompute"
      - from: REOPENED
        to: RESOLVED
        trigger: "POST .../complaints/{complaintId}/resolve"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "resolved_at = current logical clock; Site posture recompute"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST .../complaints/{complaintId}/close"
        actor: ProgramAdmin
        preconditions:
          - "status has been RESOLVED for at least one ops run (tracked via ops_run_index at resolve; ERR_COMPLAINT_NOT_STABLE)"
        side_effects: []

  - entity: DiversionReport
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /programs/{programId}/diversion-reports/{reportId}/certify"
        actor: MunicipalAuditor
        preconditions:
          - "The certifying auditor's X-User-ID differs from the X-User-ID that created the report (segregation of duties: ERR_SOD_SAME_USER) — the creator's id is captured at report creation time from the caller"
          - "period_end <= current logical clock (ERR_REPORT_PERIOD_NOT_CLOSED)"
        side_effects:
          - "certified_by = certifying auditor X-User-ID"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system (when a new DiversionReport with identical (period_start, period_end, method) is certified)"
        actor: system
        preconditions: []
        side_effects:
          - "Previous CERTIFIED report → SUPERSEDED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: drop-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /programs/{programId}/sites/{siteId}/drops"
    occ_field: "expected_site_version"
    description: |
      Creating a DropEvent against a Site whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just recorded a drop, completed a pickup, or had a posture-
      affecting report/complaint land (each of which legitimately changes
      stored_kg or posture), so the current writer's view of the site is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: route-stop-create-stale-route
    parent_entity: CollectionRoute
    write_endpoint: "POST /programs/{programId}/routes/{routeId}/stops"
    occ_field: "expected_route_version"
    description: |
      Adding a RouteStop to a CollectionRoute whose version has advanced since
      the client last observed it is rejected. A prior writer may have just
      added a stop or dispatched the route, so the current writer's capacity
      and sequence view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-distribution
    parent_entity: CompostDistribution
    write_endpoint: "POST /programs/{programId}/distributions/{distributionId}/allocations"
    occ_field: "expected_distribution_version"
    description: |
      Requesting an allocation against a CompostDistribution whose version has
      advanced since the client last observed it is rejected. A prior request
      may have just consumed part of the pool, so the current writer's view of
      remaining pool is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: site_posture
    trigger: "DropEvent created; ContaminationReport created/resolved/dismissed; ComplaintTicket created/resolved/reopened; RouteStop collected/skipped/cancelled; run_ops; SiteHostAgreement expired/terminated"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: (1) capacity check, (2) complaint check,
      # (3) contamination check, (4) agreement check. First matching tier wins.
      if site.status != OPERATIONAL or program.status != ACTIVE:
        posture = CLOSED   # hard override
      else if site.host_agreement_id is null:
        posture = CLOSED   # no active agreement — site cannot accept drops
      else if (site.stored_kg - site.pending_pickup_kg) >= site.capacity_kg:
        posture = SUSPENDED  # physically full (>=, boundary triggers)
      else if open_critical_or_major_contam_count >= 2 * program.posture_contam_threshold:
        posture = SUSPENDED
      else if (site.stored_kg - site.pending_pickup_kg) >= ceil(0.8 * site.capacity_kg)
              or open_contam_count >= program.posture_contam_threshold
              or unresolved_complaint_count_14d >= program.posture_complaint_threshold:
        posture = WATCH
      else:
        posture = OPEN
      # open_contam_count: ContaminationReports at this site with status in
      #   {OPEN, FEEDBACK_SENT}
      # open_critical_or_major_contam_count: same, severity in {MAJOR, CRITICAL}
      # unresolved_complaint_count_14d: ComplaintTickets at this site with
      #   status in {OPEN, ACKNOWLEDGED, REOPENED} and reported_at within the
      #   last 14 days of current logical clock (rolling window, inclusive)
    input_set: "All ContaminationReports and ComplaintTickets for the site filtered by status sets above; clock = logical clock"
    constants:
      CAPACITY_WATCH_PCT: 0.8
      COMPLAINT_WINDOW_DAYS: 14

  - name: drop_provisional_net_kg
    trigger: "DropEvent creation"
    algorithm: aggregation
    formula: |
      provisional_net_kg = round_half_up(gross_weight_kg - contamination_kg, 2)
    input_set: "single DropEvent"
    precision: "2 decimal places, round_half_up"

  - name: drop_final_net
    trigger: "ProcessingBatch close (CLOSED_ACCEPTED)"
    algorithm: waterfall_allocation
    formula: |
      # Distribute the batch's measured_net_kg across that route-run's ACCEPTED
      # DropEvents proportionally to their provisional_net_kg, largest-remainder
      # rounding to 0.01 kg, ties broken by DropEvent.occurred_at ASC then
      # DropEvent.created_at ASC. Sum of per-drop final_net_kg MUST equal
      # batch.measured_net_kg exactly.
      weights = [d.provisional_net_kg for d in drops if d.verification_state == ACCEPTED]
      if sum(weights) == 0:
        each drop final_net_kg = 0
      else:
        raw_i = measured_net_kg * weights[i] / sum(weights)
        floor_i = floor(raw_i * 100) / 100
        remainder_units = round((measured_net_kg - sum(floor_i)) * 100)
        sort drops by (raw_i - floor_i) DESC, then occurred_at ASC, then created_at ASC
        distribute remainder_units one 0.01-kg unit per drop in that order until exhausted
    input_set: "DropEvents whose site was served by a COLLECTED stop on the batch's route and verification_state == ACCEPTED"
    precision: "2 decimal places, round_half_up via largest-remainder"

  - name: diversion_net_kg
    trigger: "DiversionReport creation"
    algorithm: aggregation
    formula: |
      # Base (PROVISIONAL_NET): include DropEvents with occurred_at in
      # [period_start, period_end) and verification_state in
      # {PENDING_AUDIT, ACCEPTED, FLAGGED_CONTAMINATED} — REJECTED excluded.
      # net = sum of provisional_net_kg over included events, rounded per-event
      # to 0.01 then summed (per-event-then-sum order is PINNED).
      if method == PROVISIONAL_NET:
        net_diverted_kg = sum(round_half_up(d.provisional_net_kg, 2))
      else:
        # FINAL_NET variant: only DropEvents with credit_state ==
        # FINALLY_CREDITED are included; uses final_net_kg (batch-reconciled).
        net_diverted_kg = sum(round_half_up(d.final_net_kg, 2))
      gross_diverted_kg = sum(d.gross_weight_kg) over the same included set
      contamination_kg  = sum(d.contamination_kg) over the same included set
      diversion_rate_pct = (gross == 0) ? 0 : round_half_up(net / gross * 100, 2)
    input_set: "DropEvents in the program filtered by occurred_at window and method-specific state set"
    precision: "2 decimal places, round_half_up; per-event rounding before summation"
    variants:
      - name: provisional_net_variant
        when: "method == PROVISIONAL_NET — municipality wants the fast, unaudited number"
        difference: "Includes pending/flagged drops and uses provisional (pre-batch) net; produces a LARGER tonnage than final when partner reconciliation shrinks masses"
      - name: final_net_variant
        when: "method == FINAL_NET — certified year-end figure"
        difference: "Includes only FINALLY_CREDITED drops and uses batch-reconciled final_net_kg; produces a SMALLER tonnage whenever partner-measured contamination exceeds participant-declared contamination"

  - name: distribution_fair_share
    trigger: "DistributionAllocation distribute"
    algorithm: weighted_scoring
    formula: |
      # fair-share cap per participant combines household weighting, credit
      # spend, and a pool-level cap. 3 inputs, non-linear (min of three).
      pool_remaining = distribution.total_pool_kg - distribution.allocated_kg
      total_households = sum(p.household_size for p with a REQUESTED or
                             DISTRIBUTED allocation in this distribution)
      if total_households == 0: reject ERR_DISTRIBUTION_NO_REQUESTS
      household_share_kg = pool_remaining * participant.household_size / total_households
      credit_cap_kg = allocation.credits_redeemed * 1.0   # 1 credit caps at 1 kg
      equal_split_cap_kg = pool_remaining / count(REQUESTED allocations incl. this one)
      allocation_kg = round_half_up(
        min(allocation.requested_kg,
            min(household_share_kg, credit_cap_kg),
            equal_split_cap_kg), 2)
    input_set: "All allocations in the distribution with status REQUESTED or DISTRIBUTED"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: with_equal_split_cap
        when: "more than one REQUESTED allocation exists"
        difference: "equal_split_cap applies; large households cannot drain the pool ahead of smaller ones"
      - name: single_requester
        when: "exactly one REQUESTED allocation"
        difference: "equal_split_cap_kg == pool_remaining, so the binding constraint is min(requested, household_share, credit_cap)"

  - name: route_window_overlap
    trigger: "CollectionRoute dispatch"
    algorithm: interval_merge
    formula: |
      # Half-open interval overlap on the partner axis: routes A and B conflict
      # iff A.start < B.end AND B.start < A.end (adjacent windows where
      # A.end == B.start do NOT conflict).
      conflict = any(other.status == DISPATCHED
                     and other.processing_partner_id == route.processing_partner_id
                     and route.scheduled_start < other.scheduled_end
                     and other.scheduled_start < route.scheduled_end)
    input_set: "All CollectionRoutes in the program with status DISPATCHED"

  - name: agreement_term_overlap
    trigger: "SiteHostAgreement activate"
    algorithm: interval_merge
    formula: |
      # Same-site agreement terms use half-open overlap, but a NEW agreement
      # may begin exactly at the outgoing agreement's term_end (renewal chain),
      # which is permitted. Overlap iff term_start < other.term_end AND
      # other.term_start < term_end. The equality boundary (touching terms)
      # is explicitly allowed.
      overlap = any(other.status == ACTIVE
                    and other.site_id == agreement.site_id
                    and agreement.term_start < other.term_end
                    and other.term_start < agreement.term_end)
    input_set: "SiteHostAgreements with status ACTIVE for the same site_id"

  - name: material_season_window
    trigger: "DropEvent creation (material acceptance check)"
    algorithm: interval_merge
    formula: |
      # Annual MM-DD window, inclusive on both ends, that MAY wrap the year
      # boundary. Wrap case (start > end): accepted iff md >= start OR md <= end.
      # Non-wrap: accepted iff start <= md <= end. md is taken from the current
      # logical clock.
      md = month_day(clock_now)
      if accepted_start_month_day <= accepted_end_month_day:
        accepted = accepted_start_month_day <= md <= accepted_end_month_day
      else:
        accepted = (md >= accepted_start_month_day) or (md <= accepted_end_month_day)

  - name: bucket_credit_ledger
    trigger: "DropEvent accept / batch close delta / allocation distribute / allocation cancel / ops run expiry / participant deactivate"
    algorithm: aggregation
    formula: |
      # Conserved quantity: balance == granted - redeemed - expired at all times.
      bucket_credit_balance = bucket_credits_granted_total
                              - bucket_credits_redeemed_total
                              - bucket_credits_expired_total
      # Ops-run expiry: credits granted > 365 days ago (by the granting
      # DropEvent's occurred_at) and not yet redeemed expire at ops run.
      # FIFO: oldest granted credits are consumed first by both redemption and
      # expiry; ties by DropEvent.created_at ASC.
    input_set: "All credit ledger entries derived from DropEvent accepts, batch reconciliations, allocation redemptions/refunds, expiries"
    constants:
      CREDIT_TTL_DAYS: 365

  - name: site_mass_ledger
    trigger: "DropEvent create/accept/reject; RouteStop collect/skip/cancel"
    algorithm: aggregation
    formula: |
      # Conserved quantity: stored_kg == sum(final-or-provisional net of live
      # accepted-or-pending drops at site) - sum(actual_pickup_kg of COLLECTED
      # stops at site). A rejected drop subtracts its provisional mass.
      # pending_pickup_kg == sum(planned_pickup_kg of SCHEDULED stops at site).
    input_set: "DropEvents at site not REJECTED; RouteStops at site"

  - name: diversion_credit_delta
    trigger: "ProcessingBatch CLOSED_ACCEPTED"
    algorithm: aggregation
    formula: |
      # Signed adjustment applied per drop when final replaces provisional.
      # Credit rounding: credits are integers; granted amount is
      # round_half_up(net_kg * diversion_credit_rate) applied independently to
      # provisional and final values — the delta is the difference of the two
      # roundings (NOT the rounding of the delta).
      delta_credits = round_half_up(final_net_kg * rate) - round_half_up(provisional_net_kg * rate)
    precision: "credits are integers; round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for the target endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (program, site, child...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declared in §1.2.1 concurrency_rules"
  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Site posture must be OPEN to accept a DropEvent (WATCH allows only <= 5 kg per drop; SUSPENDED/CLOSED reject all)"
    error_id: ERR_SITE_POSTURE_BLOCKS_DROP
    http_status: 409
    applies_to: "POST /programs/{programId}/sites/{siteId}/drops"
  - priority: 7
    category: business_safety
    check: "MaterialCategory must be active AND within its seasonal acceptance window at drop time"
    error_id: ERR_MATERIAL_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /programs/{programId}/sites/{siteId}/drops"
  - priority: 8
    category: business_referential
    check: "AccessGrant must be ACTIVE, belong to the participant, and reference this site; buckets_checked_out < bucket_quota"
    error_id: ERR_ACCESS_GRANT_INVALID
    http_status: 409
    applies_to: "POST /programs/{programId}/sites/{siteId}/drops"
  - priority: 9
    category: business_temporal
    check: "DropEvent.occurred_at must be <= current logical clock and within the site's host agreement term [term_start, term_end)"
    error_id: ERR_DROP_OUTSIDE_AGREEMENT_TERM
    http_status: 409
    applies_to: "POST /programs/{programId}/sites/{siteId}/drops"
  - priority: 10
    category: business_temporal
    check: "CollectionRoute scheduled_end > scheduled_start and route window does not overlap another DISPATCHED route at the same partner (half-open adjacency allowed)"
    error_id: ERR_PARTNER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /programs/{programId}/routes/{routeId}/dispatch"
  - priority: 11
    category: business_fiscal
    check: "assigned_load_kg <= vehicle_capacity_kg at dispatch; stop collect actual_pickup_kg bounded by site available mass"
    error_id: ERR_ROUTE_OVER_CAPACITY
    http_status: 409
    applies_to: "route dispatch and stop collect"
  - priority: 12
    category: business_fiscal
    check: "Allocation request: credits_redeemed <= participant.bucket_credit_balance; requested_kg > 0"
    error_id: ERR_INSUFFICIENT_BUCKET_CREDITS
    http_status: 409
    applies_to: "POST /programs/{programId}/distributions/{distributionId}/allocations"
  - priority: 13
    category: business_constraint
    check: "Segregation of duties: DiversionReport certifier != report creator (creator id recorded at creation)"
    error_id: ERR_SOD_SAME_USER
    http_status: 403
    applies_to: "POST /programs/{programId}/diversion-reports/{reportId}/certify"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly that value and never falls back to wall-clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: []

  # --- Program ---
  - method: POST
    path: "/programs"
    description: "Create a program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, fiscal_year, "posture_contam_threshold?", "posture_complaint_threshold?", "diversion_credit_rate?"]
    output: Program
    side_effects: ["status=DRAFT, ops_run_index=0"]
  - method: GET
    path: "/programs/{id}"
    description: "Get a program"
    roles: [ProgramAdmin, SiteHost, Participant, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{id}/activate"
    description: "Activate (or re-activate) a program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/programs/{id}/suspend"
    description: "Suspend a program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → SUSPENDED; all site postures SUSPENDED"]
  - method: POST
    path: "/programs/{id}/close"
    description: "Close a program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → CLOSED"]
  - method: POST
    path: "/programs/{id}/run_ops"
    description: "Ops-run checkpoint: expire grants/agreements/credits, mark SLA breaches, recompute postures"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects:
      - "ops_run_index += 1"
      - "AccessGrants past expires_at → EXPIRED (auto MINOR ContaminationReport if buckets still out)"
      - "Agreements past term_end → EXPIRED; uncovered sites posture → CLOSED"
      - "ComplaintTickets unresolved past sla_due_at → sla_breached = true"
      - "Bucket credits older than 365 days expire (FIFO)"
      - "All site postures recomputed"

  # --- Site ---
  - method: POST
    path: "/programs/{id}/sites"
    description: "Create a site"
    roles: [ProgramAdmin]
    code: 201
    input: [name, address, capacity_kg]
    output: Site
    side_effects: ["status=ONBOARDING, posture=CLOSED, stored_kg=0"]
  - method: GET
    path: "/programs/{id}/sites"
    description: "List sites (archived excluded by default)"
    roles: [ProgramAdmin, SiteHost, Participant, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "include_archived?", "status?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/sites/{siteId}"
    description: "Get a site"
    roles: [ProgramAdmin, SiteHost, Participant, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: POST
    path: "/programs/{id}/sites/{siteId}/commission"
    description: "Commission a site (requires ACTIVE host agreement)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["status → OPERATIONAL; posture recompute"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/decommission"
    description: "Decommission a site"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["status → DECOMMISSIONED; agreement terminated; posture CLOSED"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/archive"
    description: "Soft-delete a decommissioned site"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["archived = true"]

  # --- SiteHostAgreement ---
  - method: POST
    path: "/programs/{id}/host-agreements"
    description: "Create a host agreement"
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, host_name, term_start, term_end, "cure_period_days?"]
    output: SiteHostAgreement
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/programs/{id}/host-agreements"
    description: "List host agreements"
    roles: [ProgramAdmin, SiteHost, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "site_id?", "status?"]
    output: SiteHostAgreement[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/host-agreements/{agreementId}"
    description: "Get a host agreement"
    roles: [ProgramAdmin, SiteHost, MunicipalAuditor]
    code: 200
    input: []
    output: SiteHostAgreement
    side_effects: []
  - method: POST
    path: "/programs/{id}/host-agreements/{agreementId}/activate"
    description: "Activate an agreement"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SiteHostAgreement
    side_effects: ["status → ACTIVE; site.host_agreement_id linked"]
  - method: POST
    path: "/programs/{id}/host-agreements/{agreementId}/breach-notice"
    description: "Issue breach notice"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SiteHostAgreement
    side_effects: ["status → BREACH_NOTICED; breach_noticed_at set"]
  - method: POST
    path: "/programs/{id}/host-agreements/{agreementId}/cure"
    description: "Cure a breach"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SiteHostAgreement
    side_effects: ["status → ACTIVE; breach_noticed_at cleared"]
  - method: POST
    path: "/programs/{id}/host-agreements/{agreementId}/terminate"
    description: "Terminate an agreement"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SiteHostAgreement
    side_effects: ["status → TERMINATED; site link cleared; posture recompute"]

  # --- MaterialCategory ---
  - method: POST
    path: "/programs/{id}/materials"
    description: "Create a material category"
    roles: [ProgramAdmin]
    code: 201
    input: [code, description, accepted_start_month_day, accepted_end_month_day, contamination_sensitivity, "active?"]
    output: MaterialCategory
    side_effects: []
  - method: GET
    path: "/programs/{id}/materials"
    description: "List material categories"
    roles: [ProgramAdmin, SiteHost, Participant, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: MaterialCategory[]
    side_effects: []
  - method: PATCH
    path: "/programs/{id}/materials/{materialId}"
    description: "Update active flag or description"
    roles: [ProgramAdmin]
    code: 200
    input: ["active?", "description?"]
    output: MaterialCategory
    side_effects: []

  # --- Participant ---
  - method: POST
    path: "/programs/{id}/participants/register"
    description: "Register a participant"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, household_size]
    output: Participant
    side_effects: ["status=PENDING_VERIFY; verification_token minted"]
  - method: GET
    path: "/programs/{id}/participants"
    description: "List participants"
    roles: [ProgramAdmin, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/participants/{participantId}"
    description: "Get a participant"
    roles: [ProgramAdmin, Participant, MunicipalAuditor]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/programs/{id}/participants/{participantId}/verify"
    description: "Verify registration"
    roles: [Anonymous]
    code: 200
    input: [verification_token]
    output: Participant
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/programs/{id}/participants/{participantId}/suspend"
    description: "Suspend a participant"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["status → SUSPENDED (or DEACTIVATED at 3rd); grants revoked"]
  - method: POST
    path: "/programs/{id}/participants/{participantId}/reinstate"
    description: "Reinstate a suspended participant"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["status → ACTIVE"]
  - method: POST
    path: "/programs/{id}/participants/{participantId}/deactivate"
    description: "Deactivate a participant"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["status → DEACTIVATED; credits expired; grants revoked"]

  # --- AccessGrant ---
  - method: POST
    path: "/programs/{id}/participants/{participantId}/grants"
    description: "Issue an access grant for a site"
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, bucket_quota, expires_at]
    output: AccessGrant
    side_effects: ["status=ACTIVE; access_code minted"]
  - method: GET
    path: "/programs/{id}/participants/{participantId}/grants"
    description: "List a participant's grants"
    roles: [ProgramAdmin, Participant, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AccessGrant[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/participants/{participantId}/grants/{grantId}/revoke"
    description: "Revoke a grant"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["status → REVOKED"]

  # --- DropEvent ---
  - method: POST
    path: "/programs/{id}/sites/{siteId}/drops"
    description: "Record a drop (OCC on Site.version)"
    roles: [Participant]
    code: 201
    input: [participant_id, access_grant_id, material_category_id, gross_weight_kg, contamination_kg, occurred_at, expected_site_version]
    output: DropEvent
    side_effects:
      - "provisional_net_kg computed; verification_state=PENDING_AUDIT; credit_state=UNCREDITED"
      - "Site.stored_kg += provisional_net_kg; Site posture recompute; increments Site.version by 1"
  - method: GET
    path: "/programs/{id}/sites/{siteId}/drops"
    description: "List drops at a site"
    roles: [ProgramAdmin, SiteHost, Participant, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "verification_state?", "credit_state?"]
    output: DropEvent[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/sites/{siteId}/drops/{dropId}"
    description: "Get a drop"
    roles: [ProgramAdmin, SiteHost, Participant, MunicipalAuditor]
    code: 200
    input: []
    output: DropEvent
    side_effects: []
  - method: POST
    path: "/programs/{id}/sites/{siteId}/drops/{dropId}/accept"
    description: "Accept a pending drop (SiteHost)"
    roles: [SiteHost]
    code: 200
    input: []
    output: DropEvent
    side_effects: ["verification_state → ACCEPTED; credits provisionally granted"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/drops/{dropId}/reject"
    description: "Reject a flagged drop (SiteHost)"
    roles: [SiteHost]
    code: 200
    input: []
    output: DropEvent
    side_effects: ["verification_state → REJECTED; stored_kg debited; credits revoked"]

  # --- ContaminationReport ---
  - method: POST
    path: "/programs/{id}/sites/{siteId}/contamination-reports"
    description: "Open a contamination report"
    roles: [MunicipalAuditor]
    code: 201
    input: ["drop_event_id?", auditor_id, severity, finding_note]
    output: ContaminationReport
    side_effects:
      - "status=OPEN; linked drop → FLAGGED_CONTAMINATED"
      - "Site posture recompute"
  - method: GET
    path: "/programs/{id}/sites/{siteId}/contamination-reports"
    description: "List contamination reports"
    roles: [ProgramAdmin, SiteHost, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?"]
    output: ContaminationReport[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/sites/{siteId}/contamination-reports/{reportId}/send-feedback"
    description: "Send participant feedback"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ContaminationReport
    side_effects: ["status → FEEDBACK_SENT; feedback_sent_at set"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/contamination-reports/{reportId}/resolve"
    description: "Resolve a report"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ContaminationReport
    side_effects: ["status → RESOLVED; linked drop may flip to ACCEPTED; posture recompute"]
  - method: POST
    path: "/programs/{id}/sites/{siteId}/contamination-reports/{reportId}/dismiss"
    description: "Dismiss a report"
    roles: [MunicipalAuditor]
    code: 200
    input: []
    output: ContaminationReport
    side_effects: ["status → DISMISSED; CRITICAL linked drop → REJECTED; posture recompute"]

  # --- ProcessingPartner ---
  - method: POST
    path: "/programs/{id}/partners"
    description: "Register a processing partner"
    roles: [ProgramAdmin]
    code: 201
    input: [name, intake_capacity_kg_per_day, yield_ratio, contamination_reject_threshold_pct, "active?"]
    output: ProcessingPartner
    side_effects: []
  - method: GET
    path: "/programs/{id}/partners"
    description: "List partners"
    roles: [ProgramAdmin, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: ProcessingPartner[]
    side_effects: []

  # --- CollectionRoute ---
  - method: POST
    path: "/programs/{id}/routes"
    description: "Plan a collection route"
    roles: [RouteOperator]
    code: 201
    input: [route_code, vehicle_capacity_kg, processing_partner_id, scheduled_start, scheduled_end]
    output: CollectionRoute
    side_effects: ["status=PLANNED; assigned_load_kg=0"]
  - method: GET
    path: "/programs/{id}/routes"
    description: "List routes"
    roles: [ProgramAdmin, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "processing_partner_id?"]
    output: CollectionRoute[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/routes/{routeId}"
    description: "Get a route"
    roles: [ProgramAdmin, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: []
  - method: POST
    path: "/programs/{id}/routes/{routeId}/dispatch"
    description: "Dispatch a route"
    roles: [RouteOperator]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status → DISPATCHED"]
  - method: POST
    path: "/programs/{id}/routes/{routeId}/complete"
    description: "Complete a route; opens a ProcessingBatch at the partner"
    roles: [RouteOperator]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status → COMPLETED; per-stop site mass debits; batch opened"]
  - method: POST
    path: "/programs/{id}/routes/{routeId}/cancel"
    description: "Cancel a planned route"
    roles: [RouteOperator]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status → CANCELLED; stops cancelled; pending_pickup released"]

  # --- RouteStop ---
  - method: POST
    path: "/programs/{id}/routes/{routeId}/stops"
    description: "Add a stop to a route (OCC on CollectionRoute.version)"
    roles: [RouteOperator]
    code: 201
    input: [site_id, planned_pickup_kg, stop_sequence, expected_route_version]
    output: RouteStop
    side_effects:
      - "status=SCHEDULED; Site.pending_pickup_kg += planned_pickup_kg; Site posture recompute"
      - "CollectionRoute.assigned_load_kg += planned_pickup_kg; increments CollectionRoute.version by 1"
  - method: GET
    path: "/programs/{id}/routes/{routeId}/stops"
    description: "List stops of a route"
    roles: [ProgramAdmin, RouteOperator, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "site_id?", "status?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/routes/{routeId}/stops/{stopId}/collect"
    description: "Mark a stop collected"
    roles: [RouteOperator]
    code: 200
    input: [actual_pickup_kg]
    output: RouteStop
    side_effects: ["status → COLLECTED; actual_pickup_kg recorded"]
  - method: POST
    path: "/programs/{id}/routes/{routeId}/stops/{stopId}/skip"
    description: "Skip a stop"
    roles: [RouteOperator]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → SKIPPED; site pending_pickup released"]
  - method: POST
    path: "/programs/{id}/routes/{routeId}/stops/{stopId}/cancel"
    description: "Cancel a stop on a planned route"
    roles: [RouteOperator]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → CANCELLED; site pending_pickup released"]

  # --- ProcessingBatch ---
  - method: GET
    path: "/programs/{id}/partners/{partnerId}/batches"
    description: "List batches at a partner"
    roles: [ProgramAdmin, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ProcessingBatch[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/partners/{partnerId}/batches/{batchId}"
    description: "Get a batch"
    roles: [ProgramAdmin, ProcessingPartner, MunicipalAuditor]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: []
  - method: POST
    path: "/programs/{id}/partners/{partnerId}/batches/{batchId}/close"
    description: "Close a batch with partner-measured contamination"
    roles: [ProcessingPartner]
    code: 200
    input: [measured_contamination_kg]
    output: ProcessingBatch
    side_effects:
      - "status → CLOSED_ACCEPTED or CLOSED_REJECTED by threshold"
      - "On accept: drop final_net_kg assigned; credit deltas applied"
      - "On reject: drops flagged; provisional credits reversed; reports auto-opened"

  # --- CompostDistribution ---
  - method: POST
    path: "/programs/{id}/distributions"
    description: "Open a compost distribution over a CLOSED_ACCEPTED batch"
    roles: [ProgramAdmin]
    code: 201
    input: [batch_id]
    output: CompostDistribution
    side_effects: ["status=OPEN; total_pool_kg = batch.finished_compost_kg; opened_at = clock"]
  - method: GET
    path: "/programs/{id}/distributions"
    description: "List distributions"
    roles: [ProgramAdmin, Participant, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CompostDistribution[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/distributions/{distributionId}"
    description: "Get a distribution"
    roles: [ProgramAdmin, Participant, MunicipalAuditor]
    code: 200
    input: []
    output: CompostDistribution
    side_effects: []
  - method: POST
    path: "/programs/{id}/distributions/{distributionId}/allocations"
    description: "Request an allocation (OCC on CompostDistribution.version)"
    roles: [Participant]
    code: 201
    input: [participant_id, requested_kg, credits_redeemed, expected_distribution_version]
    output: DistributionAllocation
    side_effects: ["status=REQUESTED; increments CompostDistribution.version by 1"]
  - method: GET
    path: "/programs/{id}/distributions/{distributionId}/allocations"
    description: "List allocations of a distribution"
    roles: [ProgramAdmin, Participant, MunicipalAuditor]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "status?"]
    output: DistributionAllocation[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/distributions/{distributionId}/allocations/{allocationId}/distribute"
    description: "Distribute (grant) an allocation after fair-share clamp"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects: ["status → DISTRIBUTED; credits debited; distribution.allocated_kg incremented"]
  - method: POST
    path: "/programs/{id}/distributions/{distributionId}/allocations/{allocationId}/cancel"
    description: "Cancel a requested allocation"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects: ["status → CANCELLED; credits refunded"]
  - method: POST
    path: "/programs/{id}/distributions/{distributionId}/close"
    description: "Close a distribution"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CompostDistribution
    side_effects: ["status → CLOSED"]
  - method: POST
    path: "/programs/{id}/distributions/{distributionId}/cancel"
    description: "Cancel a distribution"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CompostDistribution
    side_effects: ["status → CANCELLED; pending allocations cancelled and refunded"]

  # --- ComplaintTicket ---
  - method: POST
    path: "/programs/{id}/sites/{siteId}/complaints"
