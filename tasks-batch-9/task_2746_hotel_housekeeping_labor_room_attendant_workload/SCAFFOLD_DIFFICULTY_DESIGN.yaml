              as: LaundryLead
              captures: { linen_id: $.data.id, li_v1: $.data.version }
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 150, dispatched_at: "2026-08-03T08:00:00.000Z", expected_return_at: "2026-08-03T12:00:00.000Z", expected_linen_item_version: "${li_v1}" }
              as: LaundryLead
              captures: { cycle1_id: $.data.id, li_v2: $.data.linen_item_version_after }
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 100, dispatched_at: "2026-08-03T10:00:00.000Z", expected_return_at: "2026-08-03T13:00:00.000Z", expected_linen_item_version: "${li_v2}" }
              as: LaundryLead
              captures: { cycle2_id: $.data.id, li_v3: $.data.linen_item_version_after }
          trigger:
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 60, dispatched_at: "2026-08-03T11:00:00.000Z", expected_return_at: "2026-08-03T12:30:00.000Z", expected_linen_item_version: "${li_v3}" }
              as: LaundryLead
              captures: { capacity_error: $.data.error_id }
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 60, dispatched_at: "2026-08-03T13:00:00.000Z", expected_return_at: "2026-08-03T16:00:00.000Z", expected_linen_item_version: "${li_v3}" }
              as: LaundryLead
              captures: { disjoint_cycle_id: $.data.id, disjoint_status: $.data.status }
          assert:
            - "The overlapping 60-set dispatch returns HTTP 409 with error_id == ERR_LAUNDRY_CAPACITY_EXCEEDED, because 150 + 100 + 60 == 310 > 300 over [11:00, 12:00)"
            - "LinenItem.${linen_id}.version == ${li_v3} after the refusal, so the same expected_linen_item_version is still current"
            - "LinenItem.${linen_id}.in_laundry == 250 and soiled_queue == 150 after the refusal"
            - "The disjoint 60-set dispatch returns HTTP 201 with LaundryCycle.${disjoint_cycle_id}.status == QUEUED, since [13:00, 16:00) does not overlap the half-open [10:00, 13:00)"
            - "LinenItem.${linen_id}.in_laundry == 310 and soiled_queue == 90 after the accepted dispatch"
            - "LinenItem.${linen_id}.on_hand_clean + in_laundry + soiled_queue == 400 at every step"

  - rule_id: compensating_invariant
    instances:
      - name: forecast_day_allocated_credits_returns_to_pre_assignment_total_after_cancel
        grounds:
          - endpoints[POST /housekeeping/room-assignments/{id}/cancel]
          - calculations.roster_workload_compliance.input_set
          - entities.ForecastDay.fields.allocated_credits_total
          - state_machines.RoomAssignment.ASSIGNED_to_CANCELLED
        distinguishing_aspect: |
          The invariant is a two-level ledger identity: ForecastDay.allocated_credits_total must equal
          the sum of its rosters' assigned_credits at all times, and cancelling the 2.00-credit deep
          clean must return BOTH figures to the exact pre-assignment values 1.00 - not to 1.00 with a
          stale roster total, and not to 3.00 with the cancelled row still counted. The cancelled row
          itself must survive with credits 2.00 intact so the audit trail is not rewritten.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with max_daily_credits 16.00; KING room type with checkout_credits 1.00 and deep_clean_credits 2.00."
            - "Rooms 101 in DUE_OUT and 103 in VACANT, so par_required_sets is 4; SHEET_SET linen line with 20 owned sets, shortage_status OK."
            - "Attendant E-101 and supervisor E-900."
            - "PUBLISHED ForecastDay 2026-08-03 with a CLOCKED_IN roster for E-101 carrying one CHECKOUT (1.00) and one DEEP_CLEAN (2.00), so assigned_credits and allocated_credits_total are both 3.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "103", floor: 1, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room103_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20 }
              as: HousekeepingDirector
              captures: { linen_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-900", full_name: "Ivan Petrov", seniority_date: "2014-02-01", hourly_rate_cents: 4200, can_inspect: true }
              as: HousekeepingDirector
              captures: { sup_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 1, forecast_arrivals: 0, forecast_departures: 1, planned_deep_clean_rooms: 1 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id }
            - call: "POST /housekeeping/shift-rosters/${roster_id}/clock-in"
              payload: {}
              as: RoomAttendant
              as_user_id: "${ra1_id}"
              captures: { r_v1: $.data.version }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room101_id}", service_type: "CHECKOUT", expected_roster_version: "${r_v1}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a_checkout_id: $.data.id, r_v2: $.data.roster_version_after }
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room103_id}", service_type: "DEEP_CLEAN", expected_roster_version: "${r_v2}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a_deep_id: $.data.id, deep_credits: $.data.credits }
          trigger:
            - call: "POST /housekeeping/room-assignments/${a_deep_id}/cancel"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { cancelled_status: $.data.status, cancelled_credits: $.data.credits }
          assert:
            - "Before the trigger, ShiftRoster.${roster_id}.assigned_credits == 3.00 and ForecastDay.${fd_id}.allocated_credits_total == 3.00"
            - "RoomAssignment.${a_deep_id}.status == CANCELLED"
            - "RoomAssignment.${a_deep_id}.credits == 2.00 still, so the cancelled row keeps its own figure"
            - "ShiftRoster.${roster_id}.assigned_credits == 1.00 exactly"
            - "ShiftRoster.${roster_id}.assigned_square_feet == 420 exactly"
            - "ForecastDay.${fd_id}.allocated_credits_total == 1.00 exactly, equal to the sum of its rosters' assigned_credits"
            - "ShiftRoster.${roster_id}.compliance_state == COMPLIANT"

      - name: linen_ledger_three_bucket_identity_restored_by_laundry_void
        grounds:
          - state_machines.LaundryCycle.QUEUED_to_VOIDED
          - calculations.linen_coverage_status
          - entities.LinenItem.fields.soiled_queue
          - entities.LinenItem.fields.in_laundry
        distinguishing_aspect: |
          The invariant is a THREE-bucket conservation law - on_hand_clean + in_laundry + soiled_queue
          == total_owned_sets - and the void must restore the exact bucket distribution, not merely the
          total: (12, 0, 8) -> dispatch -> (12, 8, 0) -> void -> (12, 0, 8). An implementation that
          returns the voided sets to on_hand_clean instead of soiled_queue keeps the sum at 20 and still
          fails, which is what separates this from a simple total-preservation check.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with laundry_capacity_sets 300 and one KING room 101, so par_required_sets is 2."
            - "SHEET_SET linen line with total_owned_sets 20 and initial_soiled_sets 8, so the opening buckets are on_hand_clean 12, in_laundry 0, soiled_queue 8, coverage_ratio 6.0000 and shortage_status OK."
            - "One QUEUED cycle of 8 sets dispatched over [08:00, 12:00), which moves the buckets to (12, 8, 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20, initial_soiled_sets: 8 }
              as: LaundryLead
              captures: { linen_id: $.data.id, li_v1: $.data.version, open_clean: $.data.on_hand_clean, open_soiled: $.data.soiled_queue }
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 8, dispatched_at: "2026-08-03T08:00:00.000Z", expected_return_at: "2026-08-03T12:00:00.000Z", expected_linen_item_version: "${li_v1}" }
              as: LaundryLead
              captures: { cycle_id: $.data.id, li_v2: $.data.linen_item_version_after }
          trigger:
            - call: "POST /housekeeping/laundry-cycles/${cycle_id}/void"
              payload: {}
              as: LaundryLead
              captures: { voided_status: $.data.status }
          assert:
            - "Before the trigger, LinenItem.${linen_id} holds on_hand_clean 12, in_laundry 8, soiled_queue 0"
            - "LaundryCycle.${cycle_id}.status == VOIDED with turnaround_minutes null and sla_breach false"
            - "LinenItem.${linen_id}.on_hand_clean == 12, in_laundry == 0 and soiled_queue == 8 - the exact opening distribution"
            - "LinenItem.${linen_id}.on_hand_clean + in_laundry + soiled_queue == 20 at all three checkpoints"
            - "LinenItem.${linen_id}.par_required_sets == 2 and coverage_ratio == 6.0000"
            - "LinenItem.${linen_id}.shortage_status == OK, never forced to ESCALATED, because no cycle reached LATE_ESCALATED"

      - name: guest_incentive_points_and_room_program_both_reversed_by_enrollment_void
        grounds:
          - state_machines.ServiceEnrollment.ACTIVE_to_VOIDED
          - entities.Property.fields.outstanding_incentive_points
          - entities.ServiceEnrollment.fields.points_accrued
          - entities.Room.fields.service_program
        distinguishing_aspect: |
          The compensation spans THREE rows in two aggregates and must be exact in all of them: the
          enrollment's own points_accrued and skips_accrued return to 0, the Property's
          outstanding_incentive_points returns to its pre-enrollment value of 0 rather than being merely
          decremented once, and Room.service_program is restored to DAILY so the room becomes
          serviceable again. Partial compensation - zeroing the enrollment but leaving the room on
          OPT_OUT, or leaving 1000 points outstanding - is the defect this catches.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property whose outstanding_incentive_points opens at 0."
            - "One KING room 101 with service_program DAILY at creation."
            - "An ACTIVE OPT_OUT ServiceEnrollment on room 101 for reservation RES-7781 with nights 3, so points_per_skip is 500 and Room.service_program has been overwritten to OPT_OUT."
            - "Two accruals already recorded, so skips_accrued is 2, points_accrued is 1000, status is still ACTIVE and Property.outstanding_incentive_points is 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id, opening_points: $.data.outstanding_incentive_points }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "STAYOVER", service_program: "DAILY" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/service-enrollments"
              payload: { room_id: "${room101_id}", reservation_code: "RES-7781", program: "OPT_OUT", nights: 3 }
              as: FrontDeskAgent
              captures: { enroll_id: $.data.id, per_skip: $.data.points_per_skip }
            - call: "POST /housekeeping/service-enrollments/${enroll_id}/accrue"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /housekeeping/service-enrollments/${enroll_id}/accrue"
              payload: {}
              as: FrontDeskAgent
              captures: { skips_before: $.data.skips_accrued, points_before: $.data.points_accrued }
          trigger:
            - call: "POST /housekeeping/service-enrollments/${enroll_id}/void"
              payload: {}
              as: FrontDeskAgent
              captures: { voided_status: $.data.status, voided_points: $.data.points_accrued }
          assert:
            - "Before the trigger, ServiceEnrollment.${enroll_id}.skips_accrued == 2, points_per_skip == 500, points_accrued == 1000 and status == ACTIVE"
            - "Before the trigger, Room.${room101_id}.service_program == OPT_OUT and Property.${prop_id}.outstanding_incentive_points == 1000"
            - "ServiceEnrollment.${enroll_id}.status == VOIDED"
            - "ServiceEnrollment.${enroll_id}.skips_accrued == 0 and points_accrued == 0"
            - "Property.${prop_id}.outstanding_incentive_points == 0, the exact pre-enrollment value"
            - "Room.${room101_id}.service_program == DAILY"
            - "ServiceEnrollment.${enroll_id}.nights == 3 and points_per_skip == 500 are unchanged, so only the accrual is reversed"
