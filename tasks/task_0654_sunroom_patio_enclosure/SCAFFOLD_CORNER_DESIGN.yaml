  # =========================================================================
  # Endpoints — listing/pagination, FK integrity, computed read
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints./projects
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /projects returns an array envelope with total_count and has_more; with two projects and limit=1 the first page has_more==true, total_count==2."
        test_recipe:
          setup: ["One homeowner with two projects."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "e1@x.com", full_name: "E1", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "E1a", structure_type: "SCREEN_ROOM", material: "ALUMINUM" }
              as: SalesDesigner
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "E1b", structure_type: "SCREEN_ROOM", material: "ALUMINUM" }
              as: SalesDesigner
          trigger:
            - call: "GET /projects?homeowner_id=${ho}&limit=1&offset=0"
              payload: {}
              as: SalesDesigner
          assert:
            - "response envelope total_count == 2 and has_more == true and data array length == 1"

      - name: list_projects_invalid_pagination_rejected
        claim_type: Listing
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "GET /projects?limit=0 (below the [1,100] floor) returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects?limit=0"
              payload: {}
              as: SalesDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PAGINATION and HTTP status == 400"

      - name: project_quotes_reverse_reachability_returns_both_revisions
        claim_type: Computed read
        grounds:
          - endpoints./projects/{id}/quotes
          - entities.Quote.fields.revision_no
        distinguishing_aspect: "After two ESTIMATE quotes are issued on one DESIGNED project, GET /projects/{id}/quotes returns both with revision_no 1 and 2 (FK reverse-reachability for Quote.project_id)."
        test_recipe:
          setup: ["A DESIGNED project with two ESTIMATE quotes issued (the first auto-superseded only on accept, so both remain ISSUED here)."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "e3@x.com", full_name: "E3", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "E3", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q2: $.data.id }
          trigger:
            - call: "GET /projects/${pj}/quotes"
              payload: {}
              as: SalesDesigner
          assert:
            - "the returned array contains ${q1} with revision_no == 1 and ${q2} with revision_no == 2"

  # =========================================================================
  # RBAC — authentication, role denial, ownership
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_headers_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { email: "rb1@x.com", full_name: "RB1", ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: wrong_role_forbidden_on_create_project
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.SalesDesigner
        distinguishing_aspect: "POST /projects called as Homeowner (only SalesDesigner may create projects) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "rb2@x.com", full_name: "RB2", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "RB2", structure_type: "SCREEN_ROOM", material: "ALUMINUM" }
              as: Homeowner
              as_user_id: "${ho}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403"

      - name: non_owner_homeowner_cannot_accept_quote
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Homeowner
        distinguishing_aspect: "A different Homeowner (not the project owner) calling /quotes/{id}/accept returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Owner ho1 has a DESIGNED project with an ISSUED quote; a second homeowner ho2 exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "owner@x.com", full_name: "Owner", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho1: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "intruder@x.com", full_name: "Intruder", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho2: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho1}", address_line: "RB3", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER and HTTP status == 403; Quote.${q1}.status == ISSUED"

  # =========================================================================
  # Cross-cutting layers — optimistic concurrency (OCC)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: quote_accept_stale_project_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-accept-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
          - entities.Project.fields.version
        distinguishing_aspect: "After a re-measure bumps Project.version, accepting a quote with the pre-bump expected_project_version returns ERR_STALE_PROJECT_VERSION (412)."
        test_recipe:
          setup: ["A DESIGNED project with an ISSUED quote; the client captured the project version, then a re-measure advanced it (superseding the quote)."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "occ@x.com", full_name: "OCC", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "OCC1", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { stale_pv: $.data.version }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 130, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m2: $.data.id }
            - call: "POST /measurements/${m2}/accept"
              payload: {}
              as: SalesDesigner
          trigger:
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${stale_pv}" }
              as: Homeowner
              as_user_id: "${ho}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_PROJECT_VERSION and HTTP status == 412 (the captured version is now stale and the quote was superseded by the re-measure)"

      - name: quote_accept_correct_version_increments_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-accept-stale-project]
          - entities.Project.fields.version
        distinguishing_aspect: "Accepting with the current expected_project_version succeeds and bumps Project.version by 1 (drives QUOTED->PERMITTING)."
        test_recipe:
          setup: ["A DESIGNED project with an ISSUED quote and a freshly read current version."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "occ2@x.com", full_name: "OCC2", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "OCC2", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
          assert:
            - "Quote.${q1}.status == ACCEPTED and Project.${pj}.status == PERMITTING"
            - "Project.${pj}.version == ${pv} + 1 (incremented on the accept)"
