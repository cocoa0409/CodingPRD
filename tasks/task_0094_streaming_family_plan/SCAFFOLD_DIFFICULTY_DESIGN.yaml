scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_charge_prorated_vs_flat_on_account
        grounds:
          - calculations.cycle_charge
          - entities.Account.fields.period_charge_cents
          - entities.Account.fields.proration_adjustment_cents
          - entities.PlanChange.fields.direction
        distinguishing_aspect: "The prorated period charge on the ACCOUNT domain (983 over a mixed 1d@500 + 29d@1000 period) differs from one flat period of the final plan (1000); proration_adjustment_cents == -17."
        test_recipe:
          setup:
            - "Plan AD (AD_SUPPORTED, 500/period) and Plan PREM (PREMIUM, 1000/period) exist."
            - "Account on Plan PREM with billing_anchor_day 1; clock at the period's day-1 00:00Z; one PlanChange already applied at day-29 moving PREM->... no — see chain."
            - "Wallet pre-funded so invoice can settle."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_SUPPORTED", monthly_fee_cents: 500, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: false, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_ad_id: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_ad_id}", owner_email: "owner1@x.com", billing_anchor_day: 1, initial_credit_cents: 100000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T00:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { to_plan_id: "${plan_prem_id}", expected_account_version: "${acct_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { charge: $.data.period_charge_cents, adj: $.data.proration_adjustment_cents }
          assert:
            - "Account.${acct_id}.period_charge_cents == 983"
            - "Account.${acct_id}.proration_adjustment_cents == -17"
            - "Account.${acct_id}.period_charge_cents != 1000  # prorated total diverges from one flat PREMIUM period"

      - name: watch_minutes_midnight_cross_vs_naive_on_profile
        grounds:
          - calculations.watch_minutes_attributed
          - entities.Profile.fields.daily_watch_minutes_used
          - state_machines.StreamSession.ACTIVE_to_ENDED
          - entities.StreamSession.fields.started_at_min
        distinguishing_aspect: "On the PROFILE domain, a session that starts at 23:50 (started_at_min 1430) and stops at 00:10 (minute 10) attributes 20 minutes via the wrap-around elapsed formula (1440-1430)+10, whereas a naive current-minus-start would yield a negative value clamped to 0 — two interpretations of identical timestamps diverge (20 vs 0)."
        test_recipe:
          setup:
            - "An unlimited ADULT profile (no daily limit so the start gate never blocks); a 120-minute title; a session started at 23:50 UTC and stopped at 00:10 the next day with NO midnight sweep (run_sweeps=false, so daily usage is not reset)."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Movie120", maturity_rating: "PG", runtime_minutes: 120, downloadable: true, license_size_mb: 700 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T23:50:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner2@x.com", billing_anchor_day: 10, initial_credit_cents: 0 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Adult", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV1", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-11T00:10:00Z", run_sweeps: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /stream-sessions/${sess_id}/stop"
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { mw: $.data.minutes_watched }
            - call: "GET /profiles/${prof_id}"
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { used: $.data.daily_watch_minutes_used }
          assert:
            - "StreamSession.${sess_id}.minutes_watched == 20  # (1440-1430)+10 wrap-around, NOT 0"
            - "Profile.${prof_id}.daily_watch_minutes_used == 20"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ad_break_tiered_nonlinear_mode_a
        grounds:
          - calculations.ad_break_count
          - entities.StreamSession.fields.ad_breaks_served
          - entities.Title.fields.runtime_minutes
          - entities.SubscriptionPlan.fields.ad_free
        distinguishing_aspect: "MODE (a): ad_breaks_served = 1 + floor(runtime/30) is a >=3-input non-linear formula (runtime, cadence constant, ad_free branch); a 90-min title on an ad-supported plan yields 4 (1 pre-roll + 3 mid-rolls)."
        test_recipe:
          setup:
            - "Ad-supported plan; a 90-minute title; an ADULT profile and a registered device."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_SUPPORTED", monthly_fee_cents: 500, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: false, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Movie90", maturity_rating: "R", runtime_minutes: 90, downloadable: true, license_size_mb: 500 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T12:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner3@x.com", billing_anchor_day: 5, initial_credit_cents: 0 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Dad", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV1", platform: "TV", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { sess_id: $.data.id, ads: $.data.ad_breaks_served }
          assert:
            - "StreamSession.${sess_id}.ad_breaks_served == 4  # 1 + floor(90/30)"

      - name: cycle_charge_sum_then_round_mode_b
        grounds:
          - calculations.cycle_charge
          - entities.Account.fields.period_charge_cents
          - entities.PlanChange.fields.to_plan_id
        distinguishing_aspect: "MODE (b): nested rounding where order matters — SUM-THEN-ROUND of (16.6667 + 966.6667) yields 983, whereas round-per-segment-then-sum would yield 984; the scaffold pins SUM-THEN-ROUND so 983 is the only correct value."
        test_recipe:
          setup:
            - "Account opens on a 500/period plan, then upgrades to a 1000/period plan after exactly 1 whole day, leaving 1 day @500 + 29 days @1000."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_SUPPORTED", monthly_fee_cents: 500, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: false, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_ad_id: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-07-01T00:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_ad_id}", owner_email: "owner4@x.com", billing_anchor_day: 1, initial_credit_cents: 50000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-07-02T00:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { to_plan_id: "${plan_prem_id}", expected_account_version: "${acct_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { charge: $.data.period_charge_cents }
          assert:
            - "Account.${acct_id}.period_charge_cents == 983  # sum-then-round; round-per-segment would give 984"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_suspend_reactivate_revert_loop
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - entities.Account.fields.status
        distinguishing_aspect: "The ACCOUNT carries a cyclic ACTIVE->SUSPENDED->ACTIVE revert loop (not a linear pipeline): reactivate returns the account to ACTIVE and debits one period fee, proving the back-edge exists."
        test_recipe:
          setup:
            - "An ACTIVE account on a 1000/period plan with wallet credit >= 1000."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner5@x.com", billing_anchor_day: 1, initial_credit_cents: 5000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct_id}/suspend"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/reactivate"
              payload: { expected_account_version: "${v1}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { st: $.data.status, wallet: $.data.wallet_credit_cents }
          assert:
            - "Account.${acct_id}.status == ACTIVE  # back-edge SUSPENDED->ACTIVE traversed"
            - "Account.${acct_id}.wallet_credit_cents == 4000  # 5000 - one 1000 period fee debited on reactivate"

      - name: invite_pending_fork_divergent_branches
        grounds:
          - state_machines.Invite.PENDING_to_ACCEPTED
          - state_machines.Invite.PENDING_to_DECLINED
          - entities.Invite.fields.status
          - entities.Invite.fields.created_profile_id
        distinguishing_aspect: "The INVITE forks from PENDING into ACCEPTED (mints a Profile + commits hold) vs DECLINED (no Profile + releases hold) — branching shape with divergent side-effect sets per branch, on a different entity than the Account loop."
        test_recipe:
          setup:
            - "An ACTIVE account with two PENDING invites, each holding a per-seat fee."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner6@x.com", billing_anchor_day: 1, initial_credit_cents: 10000 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /invites"
              payload: { account_id: "${acct_id}", invitee_email: "a@x.com" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { inv_a_id: $.data.id, tok_a: $.data.token }
            - call: "POST /invites"
              payload: { account_id: "${acct_id}", invitee_email: "b@x.com" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { inv_b_id: $.data.id, tok_b: $.data.token }
          trigger:
            - call: "POST /invites/${inv_a_id}/accept"
              payload: { token: "${tok_a}" }
              as: Anonymous
              captures: { a_status: $.data.status, a_prof: $.data.created_profile_id }
            - call: "POST /invites/${inv_b_id}/decline"
              payload: { token: "${tok_b}" }
              as: Anonymous
              captures: { b_status: $.data.status }
          assert:
            - "Invite.${inv_a_id}.status == ACCEPTED and Invite.${inv_a_id}.created_profile_id is a non-null Profile id"
            - "Invite.${inv_b_id}.status == DECLINED and Invite.${inv_b_id}.created_profile_id is null  # divergent side effects"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_close_depth3_cascade
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - state_machines.StreamSession.ACTIVE_to_ENDED
          - state_machines.Download.READY_to_DELETED
          - entities.Account.fields.active_stream_count
          - entities.Account.fields.wallet_credit_cents
        distinguishing_aspect: "DEPTH >=3 from account CLOSE: close(A) ends an ACTIVE StreamSession(B) which folds its minutes into the Profile(C); independently close debits the invoiced net charge. The session-end -> minute-fold hop is itself caused by the close-triggered end, not by the close directly."
        test_recipe:
          setup:
            - "ACTIVE account, one ACTIVE stream in progress, one READY download, wallet funded."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Long", maturity_rating: "PG", runtime_minutes: 120, downloadable: true, license_size_mb: 700 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-15T10:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner7@x.com", billing_anchor_day: 15, initial_credit_cents: 50000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Mom", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV1", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_id: $.data.id }
            - call: "POST /downloads/${dl_id}/complete"
              as: ProfileUser
              as_user_id: "${prof_id}"
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-15T10:30:00Z", run_sweeps: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { st: $.data.status, asc: $.data.active_stream_count }
            - call: "GET /profiles/${prof_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { used: $.data.daily_watch_minutes_used }
            - call: "GET /downloads/${dl_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dl_status: $.data.status }
          assert:
            - "Account.${acct_id}.status == CLOSED"
            - "Account.${acct_id}.active_stream_count == 0  # session force-ENDED by close"
            - "Profile.${prof_id}.daily_watch_minutes_used == 30  # 10:00->10:30 minutes folded by the close-triggered session end (3rd hop)"
            - "Download.${dl_id}.status == DELETED  # parallel cascade branch"

      - name: deregister_depth2_cascade_frees_quota
        grounds:
          - state_machines.Device.REGISTERED_to_DEREGISTERED
          - state_machines.Download.READY_to_DELETED
          - entities.SubscriptionPlan.fields.download_quota_per_profile
        distinguishing_aspect: "DEPTH >=2 from a DIFFERENT trigger (device deregister): deregister(A) DELETEs the device's READY Download(B), and that deletion frees the profile's download quota slot(C) so a fresh download then succeeds against an otherwise-full quota."
        test_recipe:
          setup:
            - "Plan with download_quota_per_profile=1; profile holds one READY download on a device; quota is full."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 800, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 1, ad_free: true, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Doc", maturity_rating: "G", runtime_minutes: 45, downloadable: true, license_size_mb: 300 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner8@x.com", billing_anchor_day: 1, initial_credit_cents: 0 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Kid", kind: "KID" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "Tab", platform: "TABLET", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev1_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "Phone", platform: "MOBILE", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev2_id: $.data.id }
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev1_id}", title_id: "${title_id}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_id: $.data.id }
            - call: "POST /downloads/${dl_id}/complete"
              as: ProfileUser
              as_user_id: "${prof_id}"
          trigger:
            - call: "POST /devices/${dev1_id}/deregister"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev2_id}", title_id: "${title_id}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl2_status: $.data.status }
          assert:
            - "Download.${dl_id}.status == DELETED  # cascade from deregister"
            - "the second POST /downloads succeeds (201) with status DOWNLOADING  # freed quota slot consumed"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rating_safety_beats_daily_limit_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_RATING_BLOCKED]
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: "Pair business_safety(p8 ERR_RATING_BLOCKED) vs business_temporal(p10 ERR_DAILY_LIMIT_EXCEEDED): a single start request that violates BOTH (over-rating AND over-daily-limit) returns the higher-priority ERR_RATING_BLOCKED."
        test_recipe:
          setup:
            - "KID profile (ceiling G) with daily limit 30 and 30 already used; an R-rated 60-min title."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "RMovie", maturity_rating: "R", runtime_minutes: 60, downloadable: true, license_size_mb: 400 }
              as: PlatformAdmin
              captures: { rt_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "GShort", maturity_rating: "G", runtime_minutes: 30, downloadable: true, license_size_mb: 200 }
              as: PlatformAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /_clock/advance"
