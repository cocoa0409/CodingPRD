        distinguishing_aspect: "POST /docks with missing X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any authorization or body check."
        test_recipe:
          setup: ["Empty DB; the request is sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "with auth headers omitted, response status == 401 and data.error_id == ERR_UNAUTHENTICATED"

      - name: clubadmin_can_perform_dockstaff_assess_override
        claim_type: Role Denial
        grounds: ["roles"]
        distinguishing_aspect: "ClubAdmin (hierarchical superset) can perform the DockStaff-exclusive damage-report assess; the request succeeds (200) rather than 403."
        test_recipe:
          setup: ["A SAIL ACTIVE BASIC member with a FILED MODERATE damage report."]
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r: "$.data.id" } }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r}", boat_id: "${b1}", severity: "MODERATE", repair_cost_cents: 20000 }, as: DockStaff, captures: { dr: "$.data.id" } }
          trigger:
            - { call: "POST /damage-reports/${dr}/assess", payload: {}, as: ClubAdmin }
          assert:
            - "response status == 200"
            - "DamageReport.${dr}.status == ASSESSED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_member_version_on_dues_invoice
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dues-invoice-supersede-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Issuing a first dues invoice bumps Member.version; a second issuance still carrying the pre-first observed version (${mv}, now stale) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A member exists; the client observes member.version once (${mv}) before issuing the first invoice."]
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { mv: "$.data.version" } }
            - { call: "POST /members/${m}/dues-invoices", payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_member_version: "${mv}" }, as: ClubAdmin, captures: { inv1: "$.data.id" } }
          trigger:
            - { call: "POST /members/${m}/dues-invoices", payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", expected_member_version: "${mv}" }, as: ClubAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_member_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dues-invoice-supersede-stale-member]", "entities.Member.fields.version"]
        distinguishing_aspect: "Issuing a dues invoice with a matching expected_member_version succeeds (201) and increments Member.version by exactly 1."
        test_recipe:
          setup: ["A member exists at version 1."]
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /members/${m}", payload: {}, as: ClubAdmin, captures: { mv: "$.data.version" } }
          trigger:
            - { call: "POST /members/${m}/dues-invoices", payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_member_version: "${mv}" }, as: ClubAdmin, captures: { inv: "$.data.id" } }
          assert:
            - "response status == 201"
            - "DuesInvoice.${inv}.status == ISSUED"
            - "Member.${m}.version == 2"

      - name: derived_session_enrolled_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: ["entities.TrainingSession.fields.enrolled_count", "state_machines.TrainingSession.SCHEDULED_to_FULL"]
        distinguishing_aspect: "A session with capacity=1 shows enrolled_count=1 and status=FULL after one enrollment; a second enrollment returns ERR_SESSION_FULL."
        test_recipe:
          setup: ["A capacity-1 ORIENTATION session; two members."]
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M1", email: "m1@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M2", email: "m2@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m2: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 1, instructor_name: "I" }, as: ClubAdmin, captures: { s: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m1}", session_id: "${s}" }, as: Member, as_user_id: "${m1}", captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments", payload: { member_id: "${m2}", session_id: "${s}" }, as: Member, as_user_id: "${m2}", captures: { err: "$.data.error_id" } }
          assert:
            - "TrainingSession.${s}.enrolled_count == 1 and TrainingSession.${s}.status == FULL"
            - "response status == 409 and data.error_id == ERR_SESSION_FULL"

      - name: duplicate_enrollment_rejected
        claim_type: idempotency
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A member enrolling twice in the same session (non-terminal existing enrollment) is rejected the second time with ERR_DUPLICATE_ENROLLMENT (409)."
        test_recipe:
          setup: ["A member already ENROLLED in an ORIENTATION session."]
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10 }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { s: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${s}" }, as: Member, as_user_id: "${m}", captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${s}" }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_DUPLICATE_ENROLLMENT"

