  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_fork_join_self_loop_then_join_pin
        grounds:
          - state_machines.ChangeRequest.IN_REVIEW_to_IN_REVIEW
          - state_machines.ChangeRequest.IN_REVIEW_to_APPROVED
          - state_machines.ContentVersion.IN_REVIEW_to_PINNED
          - entities.ChangeRequest.fields.legal_review_state
          - entities.ChangeRequest.fields.brand_review_state
          - entities.RetailerListing.fields.pinned_content_version_id
        distinguishing_aspect: |
          The first APPROVED decision is a self-loop: the aggregate state re-enters IN_REVIEW with one
          dimension moved and NO pin, no supersede and no listing write, while the second APPROVED
          decision on the other track is the join that fires the whole pin cascade. A linear reading
          that pins on the first approval would leave pinned_content_version_id non-null after call
          one, which the captured post-LEGAL values falsify.
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval true and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and one DRAFT revision carrying only title, image_count 1"
            - "one ChangeRequest authored by author_1 targets that revision on the SimpleMart listing and has been submitted, so the request is IN_REVIEW with both tracks PENDING and the revision is IN_REVIEW"
            - "nothing is pinned yet: RetailerListing.pinned_content_version_id is null, both completeness variants are 0.00, readiness_score is 0.00, Product.status is DRAFT and Product.last_pinned_at is null; the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crd_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
          trigger:
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pd_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
              captures: { cr_state_1: $.data.state, legal_1: $.data.legal_review_state, brand_1: $.data.brand_review_state, decided_1: $.data.decided_at }
            - call: "GET /digital-shelf/content-versions/${vd1_id}"
              payload: {}
              as: ContentAuthor
              captures: { v_state_1: $.data.state, v_pin_1: $.data.pin_count }
            - call: "GET /digital-shelf/retailer-listings/${ld_id}"
              payload: {}
              as: ContentAuthor
              captures: { pinned_1: $.data.pinned_content_version_id, cert_1: $.data.completeness_score_certified }
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v2: $.data.version, pinned_at_1: $.data.last_pinned_at, p_status_1: $.data.status }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pd_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
              captures: { cr_state_2: $.data.state }
          assert:
            - "${cr_state_1} == \"IN_REVIEW\" and ${legal_1} == \"APPROVED\" and ${brand_1} == \"PENDING\" and ${decided_1} is null — the self-loop kept the aggregate state"
            - "${v_state_1} == \"IN_REVIEW\" and ${v_pin_1} == 0 — the first approval pins nothing"
            - "${pinned_1} is null and ${cert_1} == 0.00 — the listing was not written by the self-loop"
            - "${pinned_at_1} is null and ${p_status_1} == \"DRAFT\" — Product was not promoted by the self-loop"
            - "${cr_state_2} == \"APPROVED\" — the second track decision is the join"
            - "ChangeRequest.${crd_id}.legal_review_state == \"APPROVED\" and brand_review_state == \"APPROVED\" and decided_at == \"2026-08-10T00:00:00Z\""
            - "ContentVersion.${vd1_id}.state == \"PINNED\" and pin_count == 1"
            - "RetailerListing.${ld_id}.pinned_content_version_id == \"${vd1_id}\" and completeness_score_certified == 100.00 and completeness_score_declared == 100.00 and readiness_score == 60.00"
            - "Product.${pd_id}.status == \"ACTIVE\" and last_pinned_at == \"2026-08-10T00:00:00Z\" and last_review_at == \"2026-08-10T00:00:00Z\""

      - name: syndication_job_cycles_rejected_back_to_queued_as_attempt_two
        grounds:
          - state_machines.SyndicationJob.TRANSMITTED_to_REJECTED
          - state_machines.SyndicationJob.REJECTED_to_QUEUED
          - state_machines.RetailerListing.syndication_ERROR_HOLD_to_syndication_NOT_SYNDICATED
          - entities.SyndicationJob.fields.attempt_no
          - calculations.content_service_fee
          - validations[priority=31]
        distinguishing_aspect: |
          REJECTED is not terminal: once the last OPEN BLOCKING RejectionError is closed the same job
          re-enters QUEUED as attempt_no 2 with a NEW window, so service_fee_cents is recomputed at
