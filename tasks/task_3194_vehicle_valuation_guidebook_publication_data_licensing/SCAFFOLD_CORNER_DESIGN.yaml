# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Vehicle Valuation Guidebook Publication & Data Licensing
# §1.9 Coverage Index: breadth walk over every testable claim §1.1–§1.7 declares
# that §1.8 does not already cover. excluded_because stubs cite the §1.8 instance
# that already covers the corner.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: region_creation_persists_all_fields
        claim_type: creation
        grounds: [entities.Region, endpoints]
        distinguishing_aspect: "POST /regions with valid input returns 201 and a subsequent GET /regions/{id} returns identical region_code, name, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "NORTH", name: "North Region" }
              as: ValuationAdmin
              captures: { r_n1: $.data.id }
          trigger:
            - call: "GET /regions/${r_n1}"
              as: ValuationAdmin
          assert:
            - "Region.${r_n1}.region_code == NORTH"
            - "Region.${r_n1}.status == ACTIVE"
            - "Region.${r_n1}.version == 1"

      - name: configuration_year_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.Configuration.fields.year, errors.ERR_INVALID_INPUT]
        distinguishing_aspect: "year outside [1990, 2030] is rejected with ERR_INVALID_INPUT (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Old", year: 1985, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-bad-year" }
              as: ValuationAdmin
              captures: { bad_year_err: $.data.error_id }
          assert:
            - "bad_year_err == ERR_INVALID_INPUT"

      - name: configuration_default_annual_expected_miles_applied
        claim_type: defaults
        grounds: [entities.Configuration.fields.annual_expected_miles]
        distinguishing_aspect: "Omitting annual_expected_miles yields the documented default 10000."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Def", year: 2022, trim: "S", segment: "SEDAN", external_key: "cfg-def" }
              as: ValuationAdmin
              captures: { cfg_def: $.data.id }
          trigger:
            - call: "GET /configurations/${cfg_def}"
              as: ValuationAdmin
          assert:
            - "Configuration.${cfg_def}.annual_expected_miles == 10000"

      - name: edition_computed_tier_values_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.ValuationEdition.fields.trade_in_cents, calculations.tier_values]
        distinguishing_aspect: "tier values are system-computed from reference_price_cents (0.87/0.95/1.08 multipliers); the create endpoint accepts no such input fields."
        test_recipe:
          setup:
            - "std bootstrap: region EAST, cfg_ent (SEDAN), ACTIVE dealer src_ent, ACCEPTED batch with one item 3040000 on 2026-08-20, series S_ent ACTIVE, edition E_ent created"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_ent: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Ent", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-ent" }
              as: ValuationAdmin
              captures: { cfg_ent: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_ent}", name: "ED", external_key: "src-ent" }
              as: DataOps
              captures: { src_ent: $.data.id }
            - call: "POST /sources/${src_ent}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_ent}", submission_ref: "b-ent", items: [ { configuration_id: "${cfg_ent}", region_id: "${r_ent}", sold_price_cents: 3040000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_ent: $.data.id }
            - call: "POST /batches/${b_ent}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_ent}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_ent}", region_id: "${r_ent}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-ent" }
              as: ValuationAdmin
              captures: { s_ent: $.data.id }
            - call: "POST /valuation-series/${s_ent}/activate"
              payload: {}
              as: ValuationAdmin
          trigger:
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_ent}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_ent: $.data.id }
          assert:
            - "ValuationEdition.${e_ent}.reference_price_cents == 3040000"
            - "ValuationEdition.${e_ent}.trade_in_cents == 2644800"
            - "ValuationEdition.${e_ent}.private_party_cents == 2888000"
            - "ValuationEdition.${e_ent}.retail_cents == 3283200"

      - name: license_event_has_no_update_endpoint
        claim_type: immutability
        grounds: [entities.LicenseEvent]
        distinguishing_aspect: "LicenseEvent (common_fields: false) is append-only: no PATCH/PUT/DELETE endpoint exists for it and it carries no version field."
        test_recipe:
          setup: ["scaffold declaration"]
          setup_api_calls: []
          trigger:
            - call: "GET /license-agreements"
              as: ValuationAdmin
          assert:
            - "no endpoint in §1.5 mutates LicenseEvent"
            - "LicenseEvent carries only id and created_at from common fields"

      - name: source_requires_existing_region
        claim_type: parent_relationships
        grounds: [entities.Source.fields.region_id, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "Creating a source with a non-existent region_id yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "00000000-0000-0000-0000-000000000000", name: "Ghost", external_key: "src-ghost" }
              as: DataOps
              captures: { ghost_err: $.data.error_id }
          assert:
            - "ghost_err == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_valid_transition_received_to_validated
        claim_type: valid_transition
        grounds: [state_machines.TransactionBatch.RECEIVED_to_VALIDATED]
        distinguishing_aspect: "A RECEIVED batch moves to VALIDATED via POST /batches/{id}/validate and version increments to 2."
        test_recipe:
          setup: ["region EAST, cfg_sm (SEDAN), ACTIVE dealer src_sm, batch b_sm RECEIVED"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_sm: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "SM", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-sm" }
              as: ValuationAdmin
              captures: { cfg_sm: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_sm}", name: "SMD", external_key: "src-sm" }
              as: DataOps
              captures: { src_sm: $.data.id }
            - call: "POST /sources/${src_sm}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_sm}", submission_ref: "b-sm", items: [ { configuration_id: "${cfg_sm}", region_id: "${r_sm}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_sm: $.data.id }
          trigger:
            - call: "POST /batches/${b_sm}/validate"
              payload: {}
              as: DataOps
          assert:
            - "TransactionBatch.${b_sm}.status == VALIDATED"
            - "TransactionBatch.${b_sm}.version == 2"

      - name: validate_from_accepted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TransactionBatch, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal ACCEPTED, every further transition trigger is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["batch b_sm2 driven to ACCEPTED via validate + accept"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_sm2: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "SM2", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-sm2" }
              as: ValuationAdmin
              captures: { cfg_sm2: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_sm2}", name: "SM2D", external_key: "src-sm2" }
              as: DataOps
              captures: { src_sm2: $.data.id }
            - call: "POST /sources/${src_sm2}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_sm2}", submission_ref: "b-sm2", items: [ { configuration_id: "${cfg_sm2}", region_id: "${r_sm2}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_sm2: $.data.id }
            - call: "POST /batches/${b_sm2}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_sm2}/accept"
              payload: {}
              as: DataOps
          trigger:
            - call: "POST /batches/${b_sm2}/validate"
              payload: {}
              as: DataOps
              captures: { sm2_err: $.data.error_id }
          assert:
            - "sm2_err == ERR_INVALID_STATE"

      - name: offer_initial_state_is_quoted
        claim_type: initial_state
        grounds: [state_machines.CashOffer]
        distinguishing_aspect: "A newly created CashOffer starts in QUOTED with final_amount_cents unset and expires_at == edition.published_at + 7 days."
        test_recipe:
          setup:
            - "std published edition E_is (ref 30400.00) for cfg_is (SEDAN, region EAST); dealer src_is ACTIVE; consumer cons_is exists"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_is: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "IS", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-is" }
              as: ValuationAdmin
              captures: { cfg_is: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_is}", name: "ISD", external_key: "src-is" }
              as: DataOps
              captures: { src_is: $.data.id }
            - call: "POST /sources/${src_is}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_is}", submission_ref: "b-is", items: [ { configuration_id: "${cfg_is}", region_id: "${r_is}", sold_price_cents: 3040000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_is: $.data.id }
            - call: "POST /batches/${b_is}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_is}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_is}", region_id: "${r_is}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-is" }
              as: ValuationAdmin
              captures: { s_is: $.data.id }
            - call: "POST /valuation-series/${s_is}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_is}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_is: $.data.id }
            - call: "POST /valuation-editions/${e_is}/publish"
              payload: {}
              as: ValuationAdmin
              captures: { e_is_pub: $.data.published_at }
            - call: "POST /consumer-profiles"
              payload: { email: "is@x.com", full_name: "Is" }
              as: Consumer
              captures: { cons_is: $.data.id }
          trigger:
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_is}", funding_dealer_id: "${src_is}", consumer_id: "${cons_is}", mileage: 20000, age_years: 2, declared_condition_tier: "GOOD", option_ids: [] }
              as: DealerPartner
              as_user_id: "${src_is}"
              captures: { o_is: $.data.id }
          assert:
            - "CashOffer.${o_is}.status == QUOTED"
            - "CashOffer.${o_is}.final_amount_cents is null"
            - "CashOffer.${o_is}.expires_at == ${e_is_pub} + 7 days"

      - name: superseded_series_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ValuationSeries]
        distinguishing_aspect: "A SUPERSEDED series accepts no further transitions: activate on it returns ERR_INVALID_STATE, and its editions cannot be published."
        test_recipe:
          setup:
            - "series S_ts ACTIVE for (cfg_ts, region EAST) with edition pinned; a replacement series created with expected_version supersedes it"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_ts: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "TS", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-ts" }
              as: ValuationAdmin
              captures: { cfg_ts: $.data.id }
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_ts}", region_id: "${r_ts}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-ts1" }
              as: ValuationAdmin
              captures: { s_ts: $.data.id }
            - call: "POST /valuation-series/${s_ts}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "GET /valuation-series/${s_ts}"
              as: ValuationAdmin
              captures: { s_ts_ver: $.data.version }
          trigger:
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_ts}", region_id: "${r_ts}", effective_from: "2026-09-08T00:00:00Z", cadence: "WEEKLY", external_key: "ser-ts2", expected_version: "${s_ts_ver}" }
              as: ValuationAdmin
              captures: { s_ts2: $.data.id }
            - call: "POST /valuation-series/${s_ts}/activate"
              payload: {}
              as: ValuationAdmin
              captures: { ts_err: $.data.error_id }
          assert:
            - "ValuationSeries.${s_ts}.status == SUPERSEDED"
            - "ts_err == ERR_INVALID_STATE"

      - name: batch_submission_ref_replay_returns_existing_batch
        claim_type: idempotency
        grounds: [entities.TransactionBatch.fields.submission_ref, validations.priority=4]
        distinguishing_aspect: "Re-POSTing /batches with the same submission_ref and identical body returns the existing batch (201 semantics replay, no duplicate row, no version bump)."
        test_recipe:
          setup: ["region EAST, cfg_idem (SEDAN), ACTIVE dealer src_idem"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_idem: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "IDEM", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-idem" }
              as: ValuationAdmin
              captures: { cfg_idem: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_idem}", name: "IDEMD", external_key: "src-idem" }
              as: DataOps
              captures: { src_idem: $.data.id }
            - call: "POST /sources/${src_idem}/activate"
              payload: {}
              as: DataOps
          trigger:
            - call: "POST /batches"
              payload: { source_id: "${src_idem}", submission_ref: "dup-1", items: [ { configuration_id: "${cfg_idem}", region_id: "${r_idem}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_idem1: $.data.id }
            - call: "POST /batches"
              payload: { source_id: "${src_idem}", submission_ref: "dup-1", items: [ { configuration_id: "${cfg_idem}", region_id: "${r_idem}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_idem2: $.data.id }
          assert:
            - "b_idem1 == b_idem2"
            - "GET /batches?source_id=${src_idem} returns total_count == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: trailing_window_excludes_items_older_than_90_days
        claim_type: input_set_filtering
        grounds: [calculations.trailing_market_reference]
        distinguishing_aspect: "Items with sale_date more than 90 days before the clock are excluded from the window; with only stale items present, edition creation fails with ERR_INSUFFICIENT_DATA."
        test_recipe:
          setup: ["series S_calc (cfg_calc SEDAN, region EAST) ACTIVE; sole ACCEPTED batch dated 2026-05-20 (over 90 days before 2026-09-01)"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_calc: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "CALC", year: 2020, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-calc" }
              as: ValuationAdmin
              captures: { cfg_calc: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_calc}", name: "CALCD", external_key: "src-calc" }
              as: DataOps
              captures: { src_calc: $.data.id }
            - call: "POST /sources/${src_calc}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_calc}", submission_ref: "b-calc", items: [ { configuration_id: "${cfg_calc}", region_id: "${r_calc}", sold_price_cents: 2000000, sale_date: "2026-05-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_calc: $.data.id }
            - call: "POST /batches/${b_calc}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_calc}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_calc}", region_id: "${r_calc}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-calc" }
              as: ValuationAdmin
              captures: { s_calc: $.data.id }
            - call: "POST /valuation-series/${s_calc}/activate"
              payload: {}
              as: ValuationAdmin
          trigger:
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_calc}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { calc_err: $.data.error_id }
          assert:
            - "calc_err == ERR_INSUFFICIENT_DATA"

      - name: trailing_window_excludes_rejected_batch_items
        claim_type: input_set_filtering
        grounds: [calculations.trailing_market_reference]
        distinguishing_aspect: "Only batches with status ACCEPTED feed the reference; a REJECTED batch's items are invisible — edition creation on a series whose only batch was REJECTED fails with ERR_INSUFFICIENT_DATA."
        test_recipe:
          setup: ["series S_calc2 (cfg_calc2 SEDAN, region EAST) ACTIVE; sole batch REJECTED"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_calc2: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "CALC2", year: 2020, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-calc2" }
              as: ValuationAdmin
              captures: { cfg_calc2: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_calc2}", name: "CALC2D", external_key: "src-calc2" }
              as: DataOps
              captures: { src_calc2: $.data.id }
            - call: "POST /sources/${src_calc2}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_calc2}", submission_ref: "b-calc2", items: [ { configuration_id: "${cfg_calc2}", region_id: "${r_calc2}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_calc2: $.data.id }
            - call: "POST /batches/${b_calc2}/reject"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_calc2}", region_id: "${r_calc2}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-calc2" }
              as: ValuationAdmin
              captures: { s_calc2: $.data.id }
            - call: "POST /valuation-series/${s_calc2}/activate"
              payload: {}
              as: ValuationAdmin
          trigger:
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_calc2}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { calc2_err: $.data.error_id }
          assert:
            - "calc2_err == ERR_INSUFFICIENT_DATA"

      - name: condition_tier_constants_applied
        claim_type: constants_applied
        grounds: [calculations.tier_values, entities.ConditionStandard.fields.multiplier]
        distinguishing_aspect: "The fixed catalog multipliers (EXCELLENT 1.10 / GOOD 1.00 / FAIR 0.85 / POOR 0.70) gate both standard creation (mismatched multiplier rejected) and offer pricing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /condition-standards"
              payload: { tier: "GOOD", description: "Decent shape", multiplier: 1.05 }
              as: ValuationAdmin
              captures: { tier_err: $.data.error_id }
          assert:
            - "tier_err == ERR_INVALID_INPUT"

      - name: tier_values_rounding_half_up
        claim_type: precision
        grounds: [calculations.tier_values]
        distinguishing_aspect: "round_half_up at integer cents: reference 2001000 -> private_party == round_half_up(2001000*0.95) == 1900950 exactly, retail == round_half_up(2001000*1.08) == 2161080."
        test_recipe:
          setup: ["series S_prec (cfg_prec SEDAN, region EAST) ACTIVE with one ACCEPTED item at 2001000 dated 2026-08-20"]
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_prec: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "PREC", year: 2022, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-prec" }
              as: ValuationAdmin
              captures: { cfg_prec: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_prec}", name: "PRECD", external_key: "src-prec" }
              as: DataOps
              captures: { src_prec: $.data.id }
            - call: "POST /sources/${src_prec}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
