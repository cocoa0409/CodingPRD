        grounds:
          - validations[priority=32]
          - errors.ERR_ELEMENT_SCHEDULE_CONFLICT
          - entities.ProgramBlock.fields.planned_start_at
          - entities.ProgramBlock.fields.planned_end_at
        distinguishing_aspect: |
          Resource = Element, interval semantics = half-open
          [planned_start_at, planned_end_at): a second low-element block starting
          at exactly 10:30 — the instant the first one ends — is accepted, while
          one starting a single minute earlier at 10:29 is refused, so a closed
          interval or an inclusive comparison is caught by the accepted call
          rather than the rejected one.
