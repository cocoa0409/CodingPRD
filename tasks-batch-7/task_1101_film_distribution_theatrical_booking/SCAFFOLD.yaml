# =============================================================================
# PRD Benchmark Scaffold — task_1101_film_distribution_theatrical_booking
# Indie Film Distributor: Theatrical Booking, Box Office Settlement, Holdover,
# Marketing Co-op, Clearance/Zone, DCP/KDM Logistics, Ancillary Handoff.
#
# Difficulty target: HARDER-THAN-EXPERT. Density over volume: every entity
# participates in at least one cross-entity rule; every calculation has at
# least one variant or non-linear branch; every state machine is non-linear
# (cyclic, branching, or parallel-dimension); every validation pair produces
# testable priority conflicts.
# =============================================================================

scenario: |
  generate task hard than expert level! 1101. Film Distribution & Theatrical
  Booking (indie film distributor): release date strategy & screen count
  negotiation, exhibitor booking, film rental terms & aggregate deals,
  print/DCP delivery & key management, box office reporting & settlement,
  holdover decision & screen reallocation, marketing spend by market & co-op
  with exhibitor, clearance/zone disputes, ancillary window handoff

domain_name: film-distribution-theatrical-booking
api_prefix: /distributors/{did}

# =============================================================================
# §0.3 Structural dimensions
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation     # distributor ↔ exhibitor haggling over terms
  secondary_archetype: ledger_reconciliation     # box office accrual vs settlement; co-op accrual vs settlement
  complexity_layers:
    - optimistic_concurrency                     # OCC on BookingAgreement.version for renegotiate / accept
    - cascading_side_effects                     # holdover decision → screen release → zone clearance recompute → competing booking unblocked
    - dual_variant_calculation                   # provisional vs final settlement; provisional vs final co-op
    - rate_threshold_triggers                    # per-week rental tier decay; holdover gross threshold; wide-release screen-count gate
    - derived_field_reconciliation               # film.lifecycle_posture derived from child agreement states
    - ops_run_checkpoint                         # weekly box_office_close advances week_epoch
    - selector_policy                            # zone-clearance screen allocation; holdover screen retention
    - scheduled_deferred_actions                 # ancillary window handoff fires at theatrical_window_end

  entity_topology: hybrid                        # Distributor→Film→BookingAgreement tree + Theatre/Screen peer references + Market as cross-cutting config
  state_machine_shape: parallel                  # BookingAgreement carries (deal_status × print_status) independent axes; Film carries branch on wide/limited
  relationship_patterns:
    - one_to_many                                # Distributor→Film, Film→BookingAgreement, Theatre→Screen
    - many_to_many                               # Theatre↔Market via Screen (screen belongs to one market); BookingAgreement↔MarketingCommitment
    - cross_aggregate                            # BookingAgreement references Theatre (outside Film tree); AncillaryWindow references Film but is owned by Distributor
    - self_referential                           # ZoneClearance dispute may supersede a prior ZoneClearance (parent_dispute_id)
  role_model: segregation_of_duties              # Booker negotiates; SettlementClerk settles; same user cannot also approve marketing in same market
  consistency_model: immediate                   # all mutations atomic within one request; no async ledgers

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor legal name" }
      - { name: territory, type: string, source: input, description: "ISO country/territory code, e.g. US" }
      - { name: week_epoch, type: integer, source: system, default: 0, description: "Monotone counter advanced by POST /distributors/{id}/close_box_office_week" }
      - { name: logical_clock_utc, type: datetime, source: system, description: "Server logical clock; default 2026-05-01T00:00:00Z; advanced only via /_clock/set_current_utc" }
      - { name: lifecycle_posture, type: enum, source: computed, description: "ACTIVE | FROZEN — FROZEN when any film has a Settlement in DISPUTED state; gates new booking creation" }

  - name: Film
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id" }
      - { name: title, type: string, source: input, description: "Film title" }
      - { name: genre, type: enum, source: input, description: "NARRATIVE | DOCUMENTARY | ANIMATION | GENRE_HORROR" }
      - { name: runtime_minutes, type: integer, source: input, description: "Runtime in whole minutes" }
      - { name: rating, type: enum, source: input, description: "G | PG | PG13 | R | NC17" }
      - { name: release_pattern, type: enum, source: input, description: "WIDE | LIMITED | PLATFORM — chosen at creation, immutable" }
      - { name: target_release_date, type: datetime, source: input, description: "First public playdate (UTC midnight)" }
      - { name: min_screens_for_wide, type: integer, source: input, description: "Wide-release gate: minimum ACCEPTED BookingAgreements required to open wide; ignored for LIMITED/PLATFORM" }
      - { name: lifecycle_status, type: enum, source: system, description: "PRE_RELEASE | IN_RELEASE | HOLDOVER_PHASE | ANCILLARY_PENDING | ANCILLARY_RELEASED | PULLED" }
      - { name: screens_committed, type: integer, source: computed, description: "Count of BookingAgreements in {ACCEPTED, IN_PLAY} across all markets" }
      - { name: theatrical_window_end, type: datetime, source: computed, description: "target_release_date + 90 days; the exclusive theatrical window" }

  - name: Theatre
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id" }
      - { name: name, type: string, source: input, description: "Theatre name" }
      - { name: circuit, type: string, source: input, description: "Circuit identifier (e.g. 'Alamo', 'Landmark', 'Independent')" }
      - { name: market_code, type: string, source: input, description: "FK -> Market.code (market this theatre serves)" }
      - { name: house_allowance_cents, type: integer, source: input, description: "Weekly fixed house expense deducted before rental split" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DARK" }

  - name: Screen
    parent: Theatre
    common_fields: true
    fields:
      - { name: theatre_id, type: string, source: system, description: "FK -> Theatre.id" }
      - { name: auditorium_label, type: string, source: input, description: "e.g. 'Auditorium 3'" }
      - { name: seat_count, type: integer, source: input, description: "Auditorium seating capacity" }
      - { name: projection_format, type: enum, source: input, description: "DCP_2K | DCP_4K | FILM_35MM" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BOOKED | MAINTENANCE" }

  - name: Market
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id" }
      - { name: code, type: string, source: input, description: "DMA code, e.g. 'NYC', 'LA', 'CHI'" }
      - { name: population_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3" }
      - { name: weekly_coop_budget_cents, type: integer, source: input, description: "Distributor's per-week marketing co-op budget for this market" }
      - { name: coop_committed_cents, type: integer, source: computed, description: "Sum of MarketingCommitment.committed_cents in state {COMMITTED, ACCRUING} for this market" }

  - name: BookingAgreement
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id" }
      - { name: theatre_id, type: string, source: input, description: "FK -> Theatre.id; cross-aggregate reference" }
      - { name: screen_id, type: string, source: input, description: "FK -> Screen.id; specific auditorium" }
      - { name: deal_status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | IN_PLAY | HELD_OVER | DECLINED | CANCELLED | COMPLETED" }
      - { name: print_status, type: enum, source: system, description: "NOT_ORDERED | DCP_QUEUED | DCP_SHIPPED | DCP_DELIVERED | KDM_ISSUED | KEY_LIVE | PRINT_STRUCK | PRINT_RETURNED — parallel axis" }
      - { name: opening_date, type: datetime, source: input, description: "First playdate (UTC midnight)" }
      - { name: min_weeks_committed, type: integer, source: input, description: "Minimum number of weekly renewals the exhibitor guarantees" }
      - { name: week_one_rental_pct, type: number, source: input, description: "Distributor's share of net box office for week 1 (0.00–0.95)" }
      - { name: rental_decay_per_week, type: number, source: input, description: "Percentage-point decay per week (e.g. 0.05 = -5pp per week)" }
      - { name: floor_pct, type: number, source: input, description: "Absolute floor: rental pct never drops below this" }
      - { name: per_capita_floor_cents, type: integer, source: input, description: "Per-ticket minimum rental the distributor accepts (net per admission)" }
      - { name: weeks_played, type: integer, source: system, default: 0, description: "Number of weekly settlements COMPLETED for this agreement" }
      - { name: current_week_rental_pct, type: number, source: computed, description: "= max(floor_pct, week_one_rental_pct - rental_decay_per_week * weeks_played)" }
      - { name: aggregate_deal_id, type: string, source: system, description: "FK -> AggregateDeal.id; non-null when this agreement participates in an aggregate deal; nullable" }
      - { name: holdover_eligible, type: boolean, source: computed, description: "True when weeks_played >= min_weeks_committed AND deal_status == IN_PLAY" }

  - name: AggregateDeal
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: circuit, type: string, source: input, description: "Circuit this aggregate applies to (matches Theatre.circuit)" }
      - { name: deal_status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | VOIDED" }
      - { name: aggregate_rental_pct, type: number, source: input, description: "Single rental pct applied across all participating agreements (overrides per-agreement pct when ACTIVE)" }
      - { name: min_screens, type: integer, source: input, description: "Minimum screens in this aggregate for the deal to be ACTIVE" }
      - { name: aggregate_house_allowance_cents, type: integer, source: input, description: "Single house allowance covering the entire circuit per week (replaces per-theatre allowance when ACTIVE)" }

  - name: DCPShipment
    parent: BookingAgreement
    common_fields: true
    fields:
      - { name: booking_agreement_id, type: string, source: system, description: "FK -> BookingAgreement.id" }
      - { name: content_format, type: enum, source: input, description: "DCP_2K | DCP_4K | FILM_35MM" }
      - { name: tracking_number, type: string, source: input, description: "Courier tracking reference" }
      - { name: shipped_at, type: datetime, source: system, description: "Server-stamped at POST /dcp-shipments" }
      - { name: delivered_at, type: datetime, source: system, description: "Server-stamped at mark_delivered; null while in transit" }
      - { name: status, type: enum, source: system, description: "QUEUED | IN_TRANSIT | DELIVERED | RETURNED | LOST" }

  - name: KDMKey
    parent: BookingAgreement
    common_fields: true
    fields:
      - { name: booking_agreement_id, type: string, source: system, description: "FK -> BookingAgreement.id" }
      - { name: valid_from_utc, type: datetime, source: input, description: "Start of KDM validity window (inclusive)" }
      - { name: valid_until_utc, type: datetime, source: input, description: "End of KDM validity window (EXCLUSIVE — half-open)" }
      - { name: screen_cert_fingerprint, type: string, source: input, description: "Target screen certificate fingerprint" }
      - { name: status, type: enum, source: system, description: "ISSUED | LIVE | EXPIRED | REVOKED | EXTENDED" }

  - name: BoxOfficeReport
    parent: BookingAgreement
    common_fields: true
    fields:
      - { name: booking_agreement_id, type: string, source: system, description: "FK -> BookingAgreement.id" }
      - { name: report_date, type: datetime, source: input, description: "UTC date of gross (midnight)" }
      - { name: gross_cents, type: integer, source: input, description: "Gross box office in cents for that date" }
      - { name: admissions, type: integer, source: input, description: "Ticket count for that date" }
      - { name: week_index, type: integer, source: computed, description: "Distributor.week_epoch at the time the report is locked" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED | VOIDED" }

  - name: Settlement
    parent: BookingAgreement
    common_fields: true
    fields:
      - { name: booking_agreement_id, type: string, source: system, description: "FK -> BookingAgreement.id" }
      - { name: week_index, type: integer, source: system, description: "Distributor.week_epoch this settlement covers" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of LOCKED BoxOfficeReport.gross_cents for this week" }
      - { name: house_allowance_cents, type: integer, source: computed, description: "Per-theatre or aggregate allowance applied" }
      - { name: net_cents, type: integer, source: computed, description: "= gross_cents - house_allowance_cents (floor at 0)" }
      - { name: rental_pct_applied, type: number, source: computed, description: "Effective pct after aggregate deal override and weekly decay" }
      - { name: distributor_share_cents, type: integer, source: computed, description: "= round(net_cents * rental_pct_applied), with per-capita floor applied" }
      - { name: exhibitor_share_cents, type: integer, source: computed, description: "= net_cents - distributor_share_cents" }
      - { name: marketing_offset_cents, type: integer, source: computed, description: "Co-op credit applied against distributor_share (capped by MarketingCommitment outstanding)" }
      - { name: final_distributor_payout_cents, type: integer, source: computed, description: "= distributor_share_cents + marketing_offset_cents" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | FINAL — provisional uses forward-looking estimate, final uses locked reports" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | PENDING_FINAL | FINALIZED | DISPUTED | SETTLED | WRITTEN_OFF" }

  - name: HoldoverDecision
    parent: BookingAgreement
    common_fields: true
    fields:
      - { name: booking_agreement_id, type: string, source: system, description: "FK -> BookingAgreement.id" }
      - { name: week_index, type: integer, source: system, description: "Distributor.week_epoch when decision was made" }
      - { name: prior_week_gross_cents, type: integer, source: computed, description: "Sum of LOCKED reports for prior week" }
      - { name: decision, type: enum, source: system, description: "HOLD | RELEASE | AUTO_HOLD | AUTO_RELEASE" }
      - { name: rationale, type: string, source: input, description: "Booker-supplied note for manual overrides" }

  - name: MarketingCommitment
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: theatre_id, type: string, source: input, description: "FK -> Theatre.id — exhibitor co-op partner; nullable when commitment is pure-distributor" }
      - { name: committed_cents, type: integer, source: input, description: "Dollar amount committed" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Cumulative approved spend against this commitment" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= committed_cents - spent_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTED | ACCRUING | SETTLED | CANCELLED" }
      - { name: coop_share_pct, type: number, source: input, description: "Exhibitor's share of spend (e.g. 0.50 means 50/50 co-op)" }

  - name: ZoneClearance
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: theatre_id, type: string, source: input, description: "FK -> Theatre.id granted clearance" }
      - { name: clearance_radius_km, type: number, source: input, description: "Exclusivity radius in kilometers" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Window start (inclusive, closed)" }
      - { name: effective_until_utc, type: datetime, source: input, description: "Window end (INCLUSIVE — closed interval; contrast with KDM half-open)" }
      - { name: parent_dispute_id, type: string, source: input, description: "FK -> ZoneClearance.id; non-null when this is a superseding ruling on a prior dispute; nullable" }
      - { name: status, type: enum, source: system, description: "GRANTED | CHALLENGED | UPHELD | OVERRULED | EXPIRED" }

  - name: AncillaryWindow
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id" }
      - { name: window_kind, type: enum, source: input, description: "HOME_VIDEO | TVOD | SVOD | AIRLINE" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Ancillary window start (must be >= Film.theatrical_window_end unless override)" }
      - { name: actual_start_utc, type: datetime, source: system, description: "Stamped on handoff" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HANDED_OFF | CANCELLED | VIOLATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Film
    initial_state: PRE_RELEASE
    terminal_states: [ANCILLARY_RELEASED, PULLED]
    transitions:
      - from: PRE_RELEASE
        to: IN_RELEASE
        trigger: "POST /distributors/{did}/films/{fid}/open_release"
        actor: Booker
        preconditions:
          - "release_pattern == LIMITED or PLATFORM → no screen-count gate"
          - "release_pattern == WIDE → Film.screens_committed >= Film.min_screens_for_wide (ERR_WIDE_GATE_NOT_MET)"
          - "Distributor.lifecycle_posture == ACTIVE (ERR_DISTRIBUTOR_FROZEN)"
        side_effects:
          - "Film.lifecycle_status → IN_RELEASE"

      - from: IN_RELEASE
        to: HOLDOVER_PHASE
        trigger: "system (automatic when any BookingAgreement.holdover_eligible flips true)"
        actor: system
        preconditions: []
        side_effects:
          - "Film.lifecycle_status → HOLDOVER_PHASE"

      - from: IN_RELEASE
        to: ANCILLARY_PENDING
        trigger: "POST /distributors/{did}/films/{fid}/request_ancillary_handoff"
        actor: Booker
        preconditions:
          - "All BookingAgreements for the film are in {COMPLETED, CANCELLED, DECLINED} (no IN_PLAY or HELD_OVER)"
          - "logical_clock_utc >= Film.theatrical_window_end - 7 days (may schedule up to 7 days early; actual handoff still gated)"
        side_effects:
          - "Film.lifecycle_status → ANCILLARY_PENDING"

      - from: HOLDOVER_PHASE
        to: ANCILLARY_PENDING
        trigger: "POST /distributors/{did}/films/{fid}/request_ancillary_handoff"
        actor: Booker
        preconditions:
          - "All BookingAgreements for the film are in {COMPLETED, CANCELLED, DECLINED}"
        side_effects:
          - "Film.lifecycle_status → ANCILLARY_PENDING"

      - from: ANCILLARY_PENDING
        to: ANCILLARY_RELEASED
        trigger: "system (automatic at logical_clock_utc >= Film.theatrical_window_end AND at least one AncillaryWindow.status == SCHEDULED exists)"
        actor: system
        preconditions:
          - "logical_clock_utc >= Film.theatrical_window_end"
        side_effects:
          - "All SCHEDULED AncillaryWindows for this film transition to HANDED_OFF; actual_start_utc stamped"
          - "Film.lifecycle_status → ANCILLARY_RELEASED"

      - from: PRE_RELEASE
        to: PULLED
        trigger: "POST /distributors/{did}/films/{fid}/pull"
        actor: Booker
        preconditions:
          - "No BookingAgreement in {ACCEPTED, IN_PLAY, HELD_OVER}"
        side_effects:
          - "All PROPOSED / COUNTERED BookingAgreements → CANCELLED"
          - "All SCHEDULED AncillaryWindows → CANCELLED"

      - from: IN_RELEASE
        to: PULLED
        trigger: "POST /distributors/{did}/films/{fid}/pull"
        actor: Booker
        preconditions:
          - "No BookingAgreement in {ACCEPTED, IN_PLAY, HELD_OVER} (bookings must be cancelled first)"
        side_effects:
          - "All SCHEDULED AncillaryWindows → CANCELLED"

      - from: HOLDOVER_PHASE
        to: PULLED
        trigger: "POST /distributors/{did}/films/{fid}/pull"
        actor: Booker
        preconditions:
          - "No BookingAgreement in {ACCEPTED, IN_PLAY, HELD_OVER}"
        side_effects:
          - "All SCHEDULED AncillaryWindows → CANCELLED"

  - entity: BookingAgreement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    note: "Deal axis is CYCLIC (PROPOSED ⇄ COUNTERED negotiation rounds); print axis is independent parallel dimension"
    transitions:
      # --- Deal axis (cyclic negotiation) ---
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/counter"
        actor: Exhibitor
        preconditions:
          - "deal_status == PROPOSED"
          - "expected_booking_agreement_version matches (OCC)"
        side_effects:
          - "deal_status → COUNTERED"
          - "BookingAgreement.version += 1"
          - "Proposed counter-terms recorded on the agreement"

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/counter"
        actor: Booker
        preconditions:
          - "deal_status == COUNTERED"
          - "expected_booking_agreement_version matches (OCC)"
        side_effects:
          - "deal_status → PROPOSED"
          - "BookingAgreement.version += 1"

      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/accept"
        actor: Exhibitor
        preconditions:
          - "deal_status == PROPOSED"
          - "expected_booking_agreement_version matches (OCC)"
          - "Film.lifecycle_status ∈ {PRE_RELEASE, IN_RELEASE, HOLDOVER_PHASE} (ERR_FILM_NOT_BOOKABLE)"
          - "Theatre.status == ACTIVE (ERR_THEATRE_INACTIVE)"
          - "Screen.status == AVAILABLE (ERR_SCREEN_UNAVAILABLE)"
          - "Zone clearance check: no conflicting UPHELD ZoneClearance within clearance_radius_km for the same film and overlapping closed interval (ERR_ZONE_CLEARANCE_CONFLICT)"
        side_effects:
          - "deal_status → ACCEPTED"
          - "Screen.status → BOOKED"
          - "Film.screens_committed incremented by 1"
          - "BookingAgreement.version += 1"
          - "Auto-create DCPShipment with status=QUEUED, content_format=Screen.projection_format (Ledger sync — cascades to print axis)"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/accept"
        actor: Booker
        preconditions:
          - "deal_status == COUNTERED"
          - "expected_booking_agreement_version matches (OCC)"
          - "Film.lifecycle_status ∈ {PRE_RELEASE, IN_RELEASE, HOLDOVER_PHASE}"
          - "Theatre.status == ACTIVE"
          - "Screen.status == AVAILABLE"
          - "Zone clearance check passes"
        side_effects:
          - "deal_status → ACCEPTED"
          - "Screen.status → BOOKED"
          - "Film.screens_committed incremented by 1"
          - "BookingAgreement.version += 1"
          - "Auto-create DCPShipment with status=QUEUED"

      - from: ACCEPTED
        to: IN_PLAY
        trigger: "system (automatic when logical_clock_utc >= opening_date AND print_status == KEY_LIVE)"
        actor: system
        preconditions:
          - "print_status == KEY_LIVE"
          - "logical_clock_utc >= opening_date"
        side_effects:
          - "deal_status → IN_PLAY"

      - from: IN_PLAY
        to: HELD_OVER
        trigger: "POST /distributors/{did}/booking-agreements/{id}/holdover"
        actor: Booker
        preconditions:
          - "deal_status == IN_PLAY"
          - "holdover_eligible == true"
        side_effects:
          - "deal_status → HELD_OVER"
          - "weeks_played incremented implicitly by next weekly close"
          - "Creates HoldoverDecision record with decision=HOLD"

      - from: HELD_OVER
        to: IN_PLAY
        trigger: "POST /distributors/{did}/booking-agreements/{id}/holdover_release"
        actor: Booker
        preconditions:
          - "deal_status == HELD_OVER"
        side_effects:
          - "deal_status → IN_PLAY"
          - "Creates HoldoverDecision record with decision=RELEASE"

      - from: IN_PLAY
        to: COMPLETED
        trigger: "system (automatic during close_box_office_week when all weeks_played >= min_weeks_committed AND no further holdover requested AND latest Settlement SETTLED)"
        actor: system
        preconditions:
          - "weeks_played >= min_weeks_committed"
          - "Latest Settlement for this agreement is in {SETTLED, WRITTEN_OFF}"
        side_effects:
          - "deal_status → COMPLETED"
          - "Screen.status → AVAILABLE (CASCADE: screen freed)"
          - "Film.screens_committed decremented by 1 (Ledger sync)"
          - "If release_pattern == WIDE AND screens_committed now < min_screens_for_wide → all other ACCEPTED BookingAgreements for this film re-evaluated (none auto-cancel, but future /accept calls re-check the wide gate)"

      - from: HELD_OVER
        to: COMPLETED
        trigger: "system (automatic during close_box_office_week when holdover was released prior week AND latest Settlement SETTLED)"
        actor: system
        preconditions:
          - "Latest Settlement SETTLED"
        side_effects:
          - "deal_status → COMPLETED"
          - "Screen.status → AVAILABLE"
          - "Film.screens_committed decremented by 1"

      - from: PROPOSED
        to: DECLINED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/decline"
        actor: Exhibitor
        preconditions:
          - "deal_status == PROPOSED"
        side_effects:
          - "deal_status → DECLINED"

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/decline"
        actor: Booker
        preconditions:
          - "deal_status == COUNTERED"
        side_effects:
          - "deal_status → DECLINED"

      - from: [PROPOSED, COUNTERED, ACCEPTED]
        to: CANCELLED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/cancel"
        actor: Booker
        preconditions:
          - "deal_status NOT IN {IN_PLAY, HELD_OVER, COMPLETED}"
        side_effects:
          - "deal_status → CANCELLED"
          - "If previously ACCEPTED: Screen.status → AVAILABLE"
          - "If previously ACCEPTED: Film.screens_committed decremented by 1"
          - "If previously ACCEPTED: DCPShipment.status → RETURNED (if not yet DELIVERED)"
          - "If KDMKey in {ISSUED, LIVE}: KDMKey.status → REVOKED"

      # --- Print axis (independent parallel dimension) ---
      - from: NOT_ORDERED
        to: DCP_QUEUED
        trigger: "system (automatic on deal_status → ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "print_status → DCP_QUEUED"

      - from: DCP_QUEUED
        to: DCP_SHIPPED
        trigger: "system (on POST /distributors/{did}/booking-agreements/{id}/dcp-shipments)"
        actor: Booker
        preconditions:
          - "print_status == DCP_QUEUED"
        side_effects:
          - "print_status → DCP_SHIPPED"

      - from: DCP_SHIPPED
        to: DCP_DELIVERED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/dcp-shipments/{sid}/mark_delivered"
        actor: Exhibitor
        preconditions:
          - "DCPShipment.status == IN_TRANSIT"
        side_effects:
          - "print_status → DCP_DELIVERED"

      - from: DCP_DELIVERED
        to: KDM_ISSUED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/kdm-keys (issue)"
        actor: Booker
        preconditions:
          - "print_status == DCP_DELIVERED"
        side_effects:
          - "print_status → KDM_ISSUED"
          - "KDMKey created with status=ISSUED"

      - from: KDM_ISSUED
        to: KEY_LIVE
        trigger: "system (automatic when logical_clock_utc >= KDMKey.valid_from_utc AND KDMKey.status == ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "print_status → KEY_LIVE"
          - "KDMKey.status → LIVE"

      - from: KEY_LIVE
        to: PRINT_STRUCK
        trigger: "system (automatic when deal_status transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "print_status → PRINT_STRUCK"
          - "KDMKey.status → EXPIRED (if not already EXPIRED/REVOKED)"

      - from: PRINT_STRUCK
        to: PRINT_RETURNED
        trigger: "POST /distributors/{did}/booking-agreements/{id}/dcp-shipments/{sid}/mark_returned"
        actor: Booker
        preconditions:
          - "print_status == PRINT_STRUCK"
        side_effects:
          - "print_status → PRINT_RETURNED"
          - "DCPShipment.status → RETURNED"

  - entity: DCPShipment
    initial_state: QUEUED
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: QUEUED
        to: IN_TRANSIT
        trigger: "POST /distributors/{did}/booking-agreements/{baid}/dcp-shipments (creation fires)"
        actor: Booker
        preconditions: []
        side_effects:
          - "DCPShipment.status → IN_TRANSIT"
          - "BookingAgreement.print_status → DCP_SHIPPED"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST .../dcp-shipments/{sid}/mark_delivered"
        actor: Exhibitor
        preconditions:
          - "BookingAgreement.deal_status ∈ {ACCEPTED, IN_PLAY}"
        side_effects:
          - "DCPShipment.delivered_at stamped"
          - "BookingAgreement.print_status → DCP_DELIVERED"

      - from: DELIVERED
        to: RETURNED
        trigger: "POST .../dcp-shipments/{sid}/mark_returned"
        actor: Booker
        preconditions:
          - "BookingAgreement.print_status == PRINT_STRUCK"
        side_effects:
          - "BookingAgreement.print_status → PRINT_RETURNED"

      - from: [QUEUED, IN_TRANSIT]
        to: LOST
        trigger: "POST .../dcp-shipments/{sid}/mark_lost"
        actor: Booker
        preconditions: []
        side_effects:
          - "If BookingAgreement.deal_status == ACCEPTED: print_status → DCP_QUEUED (reset for re-shipment)"

      - from: [QUEUED, IN_TRANSIT]
        to: RETURNED
        trigger: "system (on BookingAgreement cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: KDMKey
    initial_state: ISSUED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: LIVE
        trigger: "system (automatic at logical_clock_utc >= valid_from_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "BookingAgreement.print_status → KEY_LIVE"

      - from: LIVE
        to: EXPIRED
        trigger: "system (automatic at logical_clock_utc >= valid_until_utc; half-open — at exactly valid_until_utc the key is no longer valid)"
        actor: system
        preconditions: []
        side_effects:
          - "If deal_status == IN_PLAY: deal_status does not auto-complete; booking blocked from further playdates until extended"

      - from: ISSUED
        to: EXTENDED
        trigger: "POST .../kdm-keys/{kid}/extend"
        actor: Booker
        preconditions:
          - "KDMKey.status == ISSUED"
          - "new valid_until_utc > current valid_until_utc"
        side_effects:
          - "KDMKey.status → EXTENDED"
          - "Original record replaced by extended window; superseding KDMKey created with status=ISSUED"

      - from: LIVE
        to: EXTENDED
        trigger: "POST .../kdm-keys/{kid}/extend"
        actor: Booker
        preconditions:
          - "KDMKey.status == LIVE"
        side_effects:
          - "KDMKey.status → EXTENDED"
          - "Superseding KDMKey created with status=ISSUED and new window"

      - from: [ISSUED, LIVE]
        to: REVOKED
        trigger: "system (on BookingAgreement cancel) OR POST .../kdm-keys/{kid}/revoke"
        actor: Booker
        preconditions: []
        side_effects:
          - "If print_status == KEY_LIVE: print_status → DCP_DELIVERED (rollback)"

  - entity: BoxOfficeReport
    initial_state: DRAFT
    terminal_states: [LOCKED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST .../box-office-reports/{id}/submit"
        actor: Exhibitor
        preconditions:
          - "BookingAgreement.deal_status ∈ {IN_PLAY, HELD_OVER}"
          - "report_date within current or prior week_epoch"
        side_effects: []

      - from: SUBMITTED
        to: LOCKED
        trigger: "system (automatic during close_box_office_week)"
        actor: system
        preconditions: []
        side_effects:
          - "week_index stamped = Distributor.week_epoch"
          - "Triggers Settlement PROVISIONAL → PENDING_FINAL → FINALIZED cascade"

      - from: DRAFT
        to: VOIDED
        trigger: "POST .../box-office-reports/{id}/void"
        actor: Exhibitor
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: VOIDED
        trigger: "POST .../box-office-reports/{id}/void"
        actor: Booker
        preconditions:
          - "BookingAgreement's latest Settlement for this week is still PROVISIONAL"
        side_effects:
          - "Recompute Settlement gross_cents excluding the voided report"

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: PROVISIONAL
        to: PENDING_FINAL
        trigger: "system (on first LOCKED BoxOfficeReport for this week)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute variant=FINAL fields (gross, net, distributor_share) from locked reports"

      - from: PENDING_FINAL
        to: FINALIZED
        trigger: "system (at close_box_office_week when no DRAFT or SUBMITTED reports remain for this week)"
        actor: system
        preconditions: []
        side_effects:
          - "Apply marketing_offset_cents from linked MarketingCommitment"
          - "MarketingCommitment.spent_cents += marketing_offset_cents"
          - "Market.coop_committed_cents unchanged (only spent_cents moves)"

      - from: FINALIZED
        to: SETTLED
        trigger: "POST .../settlements/{id}/mark_settled"
        actor: SettlementClerk
        preconditions:
          - "Same X-User-ID MUST NOT have created the linked BookingAgreement (segregation of duties) — ERR_SOD_VIOLATION"
        side_effects:
          - "BookingAgreement.weeks_played += 1"
          - "Recalc BookingAgreement.current_week_rental_pct for next week"

      - from: FINALIZED
        to: DISPUTED
        trigger: "POST .../settlements/{id}/dispute"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "Distributor.lifecycle_posture → FROZEN (cascade: no new bookings accepted while any dispute is open)"

      - from: DISPUTED
        to: FINALIZED
        trigger: "POST .../settlements/{id}/resolve_dispute"
        actor: SettlementClerk
        preconditions:
          - "X-User-ID MUST NOT equal the original BookingAgreement creator (segregation of duties)"
        side_effects:
          - "Recompute final_distributor_payout_cents with resolution delta"
          - "If no other DISPUTED Settlements for this Distributor: Distributor.lifecycle_posture → ACTIVE"

      - from: FINALIZED
        to: WRITTEN_OFF
        trigger: "POST .../settlements/{id}/write_off"
        actor: SettlementClerk
        preconditions:
          - "Settlement older than 2 week_epochs"
        side_effects:
          - "BookingAgreement.weeks_played += 1"

  - entity: MarketingCommitment
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST .../marketing-commitments/{id}/commit"
        actor: MarketingLead
        preconditions:
          - "Market.coop_committed_cents + committed_cents <= Market.weekly_coop_budget_cents * 4 (running 4-week cap) — ERR_COOP_BUDGET_EXCEEDED"
          - "Film.lifecycle_status ∈ {PRE_RELEASE, IN_RELEASE, HOLDOVER_PHASE}"
        side_effects:
          - "Market.coop_committed_cents += committed_cents"

      - from: COMMITTED
        to: ACCRUING
        trigger: "system (on first Settlement FINALIZED referencing this commitment)"
        actor: system
        preconditions: []
        side_effects:
          - "MarketingCommitment.spent_cents starts accumulating"

      - from: ACCRUING
        to: SETTLED
        trigger: "system (when outstanding_cents == 0 after a Settlement FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "Market.coop_committed_cents -= committed_cents"

      - from: [DRAFT, COMMITTED]
        to: CANCELLED
        trigger: "POST .../marketing-commitments/{id}/cancel"
        actor: MarketingLead
        preconditions:
          - "spent_cents == 0"
        side_effects:
          - "If was COMMITTED: Market.coop_committed_cents -= committed_cents"

  - entity: ZoneClearance
    initial_state: GRANTED
    terminal_states: [UPHELD, OVERRULED, EXPIRED]
    transitions:
      - from: GRANTED
        to: CHALLENGED
        trigger: "POST .../zone-clearances/{id}/challenge"
        actor: Exhibitor
        preconditions:
          - "Challenger is another Theatre in the same Market (X-User-ID must differ from granted theatre)"
        side_effects:
          - "Booking creation for challenging theatre is blocked while dispute is open"

      - from: CHALLENGED
        to: UPHELD
        trigger: "POST .../zone-clearances/{id}/rule"
        actor: Booker
        preconditions:
          - "Ruling: keep original grant"
        side_effects:
          - "Challenging theatre cannot book this film within clearance_radius_km for the closed window [effective_from_utc, effective_until_utc] inclusive"

      - from: CHALLENGED
        to: OVERRULED
        trigger: "POST .../zone-clearances/{id}/rule"
        actor: Booker
        preconditions:
          - "Ruling: reverse grant"
        side_effects:
          - "Creates superseding ZoneClearance with parent_dispute_id pointing at the original; original status → OVERRULED"
          - "Any BookingAgreement for the original theatre in {PROPOSED, COUNTERED} → CANCELLED"

      - from: [GRANTED, UPHELD]
        to: EXPIRED
        trigger: "system (automatic at logical_clock_utc > effective_until_utc — closed interval, so equality means still in force)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AncillaryWindow
    initial_state: SCHEDULED
    terminal_states: [HANDED_OFF, CANCELLED, VIOLATED]
    transitions:
      - from: SCHEDULED
        to: HANDED_OFF
        trigger: "system (at logical_clock_utc >= scheduled_start_utc AND logical_clock_utc >= Film.theatrical_window_end AND Film.lifecycle_status == ANCILLARY_PENDING)"
        actor: system
        preconditions:
          - "logical_clock_utc >= Film.theatrical_window_end"
          - "Film.lifecycle_status == ANCILLARY_PENDING"
        side_effects:
          - "actual_start_utc stamped"
          - "Film.lifecycle_status → ANCILLARY_RELEASED (when last SCHEDULED window hands off)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST .../ancillary-windows/{id}/cancel"
        actor: Booker
        preconditions:
          - "logical_clock_utc < scheduled_start_utc"
        side_effects: []

      - from: SCHEDULED
        to: VIOLATED
        trigger: "system (at close_box_office_week, if scheduled_start_utc < Film.theatrical_window_end AND no override flag on Film)"
        actor: system
        preconditions: []
        side_effects:
          - "Film.lifecycle_status unchanged; violation recorded for audit"

  - entity: Distributor
    initial_state: ACTIVE
    terminal_states: []
    note: "Posture-driven gating — computed field lifecycle_posture"
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system (on any Settlement transitioning to DISPUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "POST /booking-agreements rejected with ERR_DISTRIBUTOR_FROZEN"

      - from: FROZEN
        to: ACTIVE
        trigger: "system (when last DISPUTED Settlement resolves)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules — only true CREATE-with-supersede races (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: booking-counter-stale-version
    parent_entity: BookingAgreement
    write_endpoint: "POST /distributors/{did}/booking-agreements/{baid}/counter"
    occ_field: expected_booking_agreement_version
    description: |
      A counter-offer made against a BookingAgreement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just countered or accepted the agreement (which
      legitimately supersedes the prior state) and the current writer's view
      of the negotiation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-accept-stale-version
    parent_entity: BookingAgreement
    write_endpoint: "POST /distributors/{did}/booking-agreements/{baid}/accept"
    occ_field: expected_booking_agreement_version
    description: |
      Accepting a BookingAgreement whose version has advanced since the
      client last observed it is rejected. The client must re-read the
      agreement to observe the latest negotiated terms before accepting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: film-open-release-stale-version
    parent_entity: Film
    write_endpoint: "POST /distributors/{did}/films/{fid}/open_release"
    occ_field: expected_film_version
    description: |
      Opening a release against a Film whose version has advanced (e.g.,
      because a concurrent acceptance bumped screens_committed) is rejected.
      The Booker must re-read the film to observe the current screens_committed
      before deciding whether the wide-release gate is met.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: current_week_rental_pct
    trigger: "recomputed on (a) Settlement SETTLED / WRITTEN_OFF, (b) BookingAgreement entering HELD_OVER, (c) any change to weeks_played"
    algorithm: tiered_pricing
    formula: |
      base = week_one_rental_pct - (rental_decay_per_week * weeks_played)
      current_week_rental_pct = max(floor_pct, base)
      # Aggregate deal override:
      #   if BookingAgreement.aggregate_deal_id is not null AND AggregateDeal.deal_status == ACTIVE:
      #     current_week_rental_pct = AggregateDeal.aggregate_rental_pct  (no decay, no floor)
      # Aggregate bypasses BOTH the per-agreement decay AND the floor.
    constants:
      MIN_PCT: 0.00
      MAX_PCT: 0.95
    precision: "4 decimal places, round_half_up"
    variants:
      - name: aggregate_override
        when: "BookingAgreement.aggregate_deal_id points to an ACTIVE AggregateDeal"
        difference: "Flat AggregateDeal.aggregate_rental_pct; ignores weeks_played, floor_pct, rental_decay_per_week"

  - name: settlement_distributor_share
    trigger: "on Settlement FINALIZED"
    algorithm: constraint_propagation
    formula: |
      # Order of evaluation is PINNED — circular-looking dependency broken:
      #   1. gross_cents          = sum of LOCKED BoxOfficeReport.gross_cents for this (booking, week_index)
      #   2. house_allowance      = per-theatre weekly house_allowance_cents
      #                          OR AggregateDeal.aggregate_house_allowance_cents / count_of_participating_accepted_agreements
      #                             (aggregate splits equally per screen; remainder goes to lowest-created_at screen)
      #   3. net_cents            = max(0, gross_cents - house_allowance)
      #   4. rental_pct_applied   = current_week_rental_pct (which may already reflect aggregate override)
      #   5. share_before_floor   = round(net_cents * rental_pct_applied)
      #   6. per_capita_floor     = admissions_total * per_capita_floor_cents
      #   7. distributor_share    = max(share_before_floor, per_capita_floor)
      #   8. exhibitor_share      = net_cents - distributor_share
      #      NOTE: if distributor_share > net_cents (per-capita floor exceeded net), exhibitor_share = 0
      #      and the shortfall is recorded as negative exhibitor_share — this is a deliberate fiscal edge.
      #   9. marketing_offset     = min(linked MarketingCommitment.outstanding_cents, committed_cents * coop_share_pct)
      #  10. final_payout         = distributor_share + marketing_offset
    constants: {}
    precision: "integer cents, round_half_up at step 5 only; subsequent steps use exact integer arithmetic"
    variants:
      - name: provisional
        when: "variant == PROVISIONAL — used for in-week preview before reports lock"
        difference: "gross_cents = sum of DRAFT + SUBMITTED + LOCKED reports (forward-looking, includes uncommitted); house_allowance applied per-theatre only (aggregate allocation is NOT yet split)"
      - name: final
        when: "variant == FINAL — used at FINALIZED transition"
        difference: "gross_cents = sum of LOCKED reports only; aggregate house allowance split per screen if applicable"

  - name: marketing_coop_accrual
    trigger: "on Settlement FINALIZED"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: each MarketingCommitment linked to this BookingAgreement's
      # (film_id, theatre_id) is drawn down in created_at ASC order until the
      # settlement's marketing_offset_cents is fully allocated.
      remaining = settlement.marketing_offset_cents
      for mc in marketing_commitments_for(film, theatre) sorted by created_at ASC:
        draw = min(remaining, mc.outstanding_cents)
        mc.spent_cents += draw
        remaining -= draw
        if remaining == 0: break
      # NOTE: two orderings produce different cents:
      #   (a) per-line-then-sum: each draw is rounded BEFORE summation (chosen — pinned)
      #   (b) sum-then-round: rejected, would drift by ±1 cent per settlement
      # Rounding: each draw is computed in integer cents; no rounding needed.
    constants: {}
    precision: "integer cents, no rounding (per-line-then-sum order PINNED)"

  - name: zone_clearance_overlap
    trigger: "on POST /booking-agreements (validate zone), POST /zone-clearances (validate grant)"
    algorithm: interval_merge
    formula: |
      # ZoneClearance uses CLOSED interval [effective_from_utc, effective_until_utc] — both endpoints INCLUSIVE.
      # Two clearances conflict when:
      #   distance(theatre_A, theatre_B) <= clearance.radius_km
      #   AND intervals overlap: a.effective_from_utc <= b.effective_until_utc AND b.effective_from_utc <= a.effective_until_utc
      # Overlap on a CLOSED interval means effective_until == another.effective_from COUNTS as overlap.
      # Adjacency (one ends at T, another starts at T) IS a conflict for closed intervals.
    constants: {}
    precision: "datetime equality is inclusive on both ends"

  - name: kdm_window_validity
    trigger: "on every state change involving KDMKey"
    algorithm: interval_merge
    formula: |
      # KDMKey uses HALF-OPEN interval [valid_from_utc, valid_until_utc) — start inclusive, end EXCLUSIVE.
      # A key is LIVE at time t iff valid_from_utc <= t < valid_until_utc.
      # At t == valid_until_utc the key is EXPIRED (boundary goes to EXPIRED, not LIVE).
      # Two KDM windows on the same screen conflict iff:
      #   a.valid_from_utc < b.valid_until_utc AND b.valid_from_utc < a.valid_until_utc
      # Adjacency (a.valid_until == b.valid_from) is NOT a conflict — key A ends exactly when key B begins.
    constants: {}
    precision: "datetime equality at the end boundary is EXCLUSIVE"
    note: "CONTRAST with zone_clearance_overlap: closed vs half-open semantics; both are intentional"

  - name: holdover_recommendation
    trigger: "computed during close_box_office_week for each IN_PLAY agreement with holdover_eligible"
    algorithm: threshold
    formula: |
      # Boundary precision: uses >= (inclusive) on the threshold.
      prior_week_gross = sum of LOCKED BoxOfficeReport.gross_cents for prior week_index
      if prior_week_gross >= BookingAgreement.min_weeks_committed * 100000:  # cents threshold: $1000/wk/screen committed
        recommend HOLD
      else:
        recommend RELEASE
      # Boundary: at exactly the threshold (>=), recommend HOLD (not RELEASE).
    constants:
      PER_SCREEN_WEEKLY_HOLD_THRESHOLD_CENTS: 100000
    precision: "integer cents; threshold uses >="

  - name: wide_release_gate
    trigger: "on POST /films/{fid}/open_release when release_pattern == WIDE"
    algorithm: threshold
    formula: |
      # Boundary precision: uses >= (inclusive).
      if Film.screens_committed >= Film.min_screens_for_wide:
        allow transition PRE_RELEASE → IN_RELEASE
      else:
        reject with ERR_WIDE_GATE_NOT_MET
      # Boundary: at exactly min_screens_for_wide the gate is MET (not below).
    constants: {}
    precision: "integer; threshold uses >="

  - name: distributor_lifecycle_posture
    trigger: "on any Settlement transition DISPUTED or resolved"
    algorithm: aggregation
    formula: |
      open_disputes = count of Settlements in {DISPUTED} for any BookingAgreement whose Film.distributor_id == this.distributor
      if open_disputes > 0:
        lifecycle_posture = FROZEN
      else:
        lifecycle_posture = ACTIVE

  - name: coop_market_cap_check
    trigger: "on POST /marketing-commitments/{id}/commit"
    algorithm: threshold
    formula: |
      # Cap: a single market's running co-op commitment cannot exceed 4x the weekly budget.
      # Boundary: at exactly 4x weekly budget, the commit is ALLOWED (<=, not <).
      projected = Market.coop_committed_cents + MarketingCommitment.committed_cents
      if projected > Market.weekly_coop_budget_cents * 4:
        reject with ERR_COOP_BUDGET_EXCEEDED
      # Equality with the cap is permitted; only strict overflow rejects.
    constants:
      RUNNING_WEEKS_CAP: 4
    precision: "integer cents; threshold uses <="

  - name: film_screens_committed
    trigger: "on BookingAgreement transitions to/from {ACCEPTED, IN_PLAY, HELD_OVER} vs other states"
    algorithm: aggregation
    formula: |
      screens_committed = count of BookingAgreements where film_id == this.id
                          AND deal_status IN {ACCEPTED, IN_PLAY, HELD_OVER}
      # Only "live" agreements count; COMPLETED / CANCELLED / DECLINED do not.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path parameters reference existing entities in the correct parent scope (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Distributor.lifecycle_posture permits the operation (FROZEN blocks new bookings)"
    error_id: ERR_DISTRIBUTOR_FROZEN
    http_status: 409
    applies_to: "POST /booking-agreements, POST /booking-agreements/{id}/accept, POST /booking-agreements/{id}/counter"

  - priority: 5
    category: state
    check: "Resource is in valid state for requested transition (per state machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "Film.lifecycle_status permits the operation (e.g., bookable, ancillary gates)"
    error_id: ERR_FILM_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /booking-agreements, POST /booking-agreements/{id}/accept"

  - priority: 7
    category: business_safety
    check: "KDM validity window does not overlap another KDM on the same screen (half-open)"
    error_id: ERR_KDM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /booking-agreements/{id}/kdm-keys, POST /kdm-keys/{id}/extend"

  - priority: 8
    category: business_safety
    check: "DCP delivered before KDM can be issued; print_status gates"
    error_id: ERR_PRINT_NOT_READY
    http_status: 409
    applies_to: "POST /booking-agreements/{id}/kdm-keys"

  - priority: 9
    category: business_temporal
    check: "Zone clearance conflict (closed interval, radius overlap with UPHELD grant)"
    error_id: ERR_ZONE_CLEARANCE_CONFLICT
    http_status: 409
    applies_to: "POST /booking-agreements, POST /booking-agreements/{id}/accept"

  - priority: 10
    category: business_temporal
    check: "Ancillary scheduled_start must be >= Film.theatrical_window_end"
    error_id: ERR_ANCILLARY_TOO_EARLY
    http_status: 422
    applies_to: "POST /films/{fid}/ancillary-windows"

  - priority: 11
    category: business_referential
    check: "Foreign keys resolve (theatre_id, screen_id, film_id, market_id, aggregate_deal_id, parent_dispute_id)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: all creation endpoints

  - priority: 12
    category: business_referential
    check: "Screen belongs to Theatre (screen_id's theatre_id must match request's theatre_id)"
    error_id: ERR_SCREEN_THEATRE_MISMATCH
    http_status: 422
    applies_to: "POST /booking-agreements"

  - priority: 13
    category: business_constraint
    check: "Screen uniqueness — screen not already committed to another agreement for overlapping dates"
    error_id: ERR_SCREEN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /booking-agreements, POST /booking-agreements/{id}/accept"

  - priority: 14
    category: business_constraint
    check: "Wide-release gate: screens_committed >= min_screens_for_wide at open_release time"
    error_id: ERR_WIDE_GATE_NOT_MET
    http_status: 409
    applies_to: "POST /films/{fid}/open_release"

  - priority: 15
    category: business_fiscal
    check: "Co-op running cap not exceeded (projected <= 4x weekly budget)"
    error_id: ERR_COOP_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /marketing-commitments/{id}/commit"

  - priority: 16
    category: business_fiscal
    check: "Rental pct within [0.00, 0.95]; floor_pct <= week_one_rental_pct"
    error_id: ERR_INVALID_RENTAL_TERMS
    http_status: 422
    applies_to: "POST /booking-agreements, POST /booking-agreements/{id}/counter"

  - priority: 17
    category: business_fiscal
    check: "Segregation of duties: SettlementClerk cannot settle an agreement they created"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /settlements/{id}/mark_settled, POST /settlements/{id}/resolve_dispute"

  - priority: 18
    category: business_constraint
    check: "Holdover eligibility: weeks_played >= min_weeks_committed"
    error_id: ERR_HOLDOVER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /booking-agreements/{id}/holdover"

  - priority: 19
    category: business_temporal
    check: "Report date within acceptable window (current or prior week_epoch)"
    error_id: ERR_REPORT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /box-office-reports, POST /box-office-reports/{id}/submit"

  - priority: 20
    category: business_constraint
    check: "Optimistic concurrency: expected_<parent>_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /booking-agreements/{id}/counter, POST /booking-agreements/{id}/accept, POST /films/{id}/open_release"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Distributor ---
  - method: POST
    path: "/distributors"
    description: "Create a Distributor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, territory]
    output: Distributor
    side_effects: ["lifecycle_posture=ACTIVE, week_epoch=0, logical_clock_utc=2026-05-01T00:00:00Z"]

  - method: GET
    path: "/distributors/{did}"
    description: "Read Distributor (includes posture, week_epoch, logical_clock)"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: GET
    path: "/distributors"
    description: "List Distributors (paginated)"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Distributor[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/close_box_office_week"
    description: "Advance week_epoch; lock SUBMITTED reports; finalize settlements; fire holdover recommendations; auto-complete agreements; auto-expire zone clearances"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Distributor
    side_effects:
      - "week_epoch += 1"
      - "All SUBMITTED BoxOfficeReports for the prior week → LOCKED"
      - "All affected Settlements PROVISIONAL → PENDING_FINAL → FINALIZED (in order)"
      - "For each IN_PLAY agreement with holdover_eligible: compute holdover_recommendation (stored as HoldoverDecision with decision=AUTO_HOLD or AUTO_RELEASE)"
      - "For each agreement where weeks_played >= min_weeks_committed AND latest Settlement is SETTLED: deal_status → COMPLETED (cascade: screen freed, screens_committed decremented)"
      - "For each ZoneClearance with logical_clock_utc > effective_until_utc: status → EXPIRED"
      - "For each KDMKey with logical_clock_utc >= valid_until_utc: status → EXPIRED"
      - "For each SCHEDULED AncillaryWindow past theatrical_window_end: status → VIOLATED if scheduled_start < theatrical_window_end"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock (drives KDM transitions, zone expiry, ancillary handoff, auto IN_PLAY). Server startup default is 2026-05-01T00:00:00Z — before any set_current_utc call, the logical clock reads exactly this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: Distributor
    side_effects:
      - "logical_clock_utc updated for ALL distributors (single global logical clock)"
      - "Triggers automatic transitions: KDM ISSUED→LIVE, KDM LIVE→EXPIRED, ZoneClearance GRANTED/UPHELD→EXPIRED, BookingAgreement ACCEPTED→IN_PLAY (when opening_date reached AND KEY_LIVE), Film ANCILLARY_PENDING→ANCILLARY_RELEASED (when theatrical_window_end reached), AncillaryWindow SCHEDULED→HANDED_OFF"

  # --- Film ---
  - method: POST
    path: "/distributors/{did}/films"
    description: "Create a Film"
    roles: [Booker]
    code: 201
    input: [title, genre, runtime_minutes, rating, release_pattern, target_release_date, min_screens_for_wide]
    output: Film
    side_effects: ["lifecycle_status=PRE_RELEASE, screens_committed=0, theatrical_window_end=target_release_date+90d"]

  - method: GET
    path: "/distributors/{did}/films/{fid}"
    description: "Read Film"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: []
    output: Film
    side_effects: []

  - method: GET
    path: "/distributors/{did}/films"
    description: "List Films for distributor"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?", "lifecycle_status?", "release_pattern?", "distributor_id?"]
    output: "Film[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/films/{fid}/open_release"
    description: "Open the film for public playdates (transition PRE_RELEASE → IN_RELEASE); WIDE requires screens_committed gate"
    roles: [Booker]
    code: 200
    input: [expected_film_version]
    output: Film
    side_effects:
      - "lifecycle_status → IN_RELEASE"
      - "increments Film.version by 1"

  - method: POST
    path: "/distributors/{did}/films/{fid}/pull"
    description: "Pull film from release"
    roles: [Booker]
    code: 200
    input: []
    output: Film
    side_effects: ["lifecycle_status → PULLED; cascades to non-active bookings and ancillary windows"]

  - method: POST
    path: "/distributors/{did}/films/{fid}/request_ancillary_handoff"
    description: "Request handoff to ancillary; transitions Film to ANCILLARY_PENDING"
    roles: [Booker]
    code: 200
    input: []
    output: Film
    side_effects: ["lifecycle_status → ANCILLARY_PENDING (when all bookings are terminal)"]

  # --- Market ---
  - method: POST
    path: "/distributors/{did}/markets"
    description: "Create a Market"
    roles: [PlatformAdmin]
    code: 201
    input: [code, population_tier, weekly_coop_budget_cents]
    output: Market
    side_effects: ["coop_committed_cents=0"]

  - method: GET
    path: "/distributors/{did}/markets/{mid}"
    description: "Read Market"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
