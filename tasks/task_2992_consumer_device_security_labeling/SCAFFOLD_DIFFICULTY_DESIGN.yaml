  # RULE 6 — boundary / precision checks on DIFFERENT metrics and endpoints
  #   instance 1: score vs tier minimum, 0.01 apart, on /assessments/{id}/decide
  #   instance 2: empty and zero-count rate denominators on /program-evaluation
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: score_exactly_at_tier_minimum_approves_and_one_hundredth_above_rejects
        metric: "ConformanceAssessment.decided_overall_score compared against ProgramTier.min_overall_score at 2-decimal precision"
        grounds:
          - validations.priority_53_ERR_SCORE_BELOW_MINIMUM
          - calculations.conformance_score
          - entities.ProgramTier.fields.min_overall_score
          - errors.ERR_SCORE_BELOW_MINIMUM
        distinguishing_aspect: |
          Two tiers whose min_overall_score differ by exactly 0.01 (80.80 and 80.81) judge the SAME
          decided_overall_score of 80.80: the inclusive >= comparison approves on TIER_1 and rejects on
          TIER_1_STRICT. Both assessments carry grade B, so an implementation that gates on the grade
          ladder instead of the score comparison approves both and an implementation that rounds the
          score to 1dp approves both.
