      - name: en_contest_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /elections/{id}/contests
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count reports the whole filtered set (3), not the page size, and has_more flips true -> false between offset 0 and offset 2 of a limit-2 walk while the two pages remain disjoint."
        test_recipe:
          setup:
            - "One election in SETUP with exactly three DRAFT contests filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
