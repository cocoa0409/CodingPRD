            - "Assessment A1 is validated with present_on_admission_confirmed false, producing HAPI #1: Unit.open_hapi_rca_count 1, survey_posture still OPEN."
            - "Order O1 is then requested for MRN-V1 on surface BED-201 (3 billable days at 10000/day) while the posture is still OPEN."
