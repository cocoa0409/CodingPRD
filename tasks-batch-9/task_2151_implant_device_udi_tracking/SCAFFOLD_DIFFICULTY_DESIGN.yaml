            - "While SN-0001 is RESERVED: Lot.${lot_id}.on_hand_qty == 3 and consumed_qty == 0 and received_qty == 3"
            - "After release-reservation: Lot.${lot_id}.on_hand_qty == 3 and consumed_qty == 0 and received_qty == 3"
            - "Lot.${lot_id}.on_hand_qty + Lot.${lot_id}.consumed_qty == Lot.${lot_id}.received_qty at every step"
            - "CatalogItem.${cat_id}.on_hand_available_qty == 2 while reserved and == 3 after release-reservation"
            - "DeviceUnit.${u1_id}.custody_state == AVAILABLE and reserved_case_id == null at the end"
            - "Lot.${lot_id}.status == AVAILABLE (never DEPLETED)"

      - name: vendor_liability_conserved_across_implant_explant_roundtrip
        grounds:
          - calculations.vendor_open_consignment_liability
          - state_machines.DeviceUnit.billing_state.NOT_BILLABLE_to_BILLABLE
          - state_machines.DeviceUnit.billing_state.BILLABLE_to_CREDIT_PENDING
          - state_machines.ImplantRecord.VERIFIED_to_EXPLANTED
          - entities.Vendor.fields.open_consignment_liability_cents
        distinguishing_aspect: |
          A different conserved quantity from
          lot_unit_count_conserved_across_reserve_release_roundtrip: this one is
          MONETARY. Vendor.open_consignment_liability_cents must read 0 before
          the implant, exactly 462500 after it, and exactly 0 again after the
          compensating explant - zero drift, not merely "roughly restored".
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE agreement AGR-A (ON_IMPLANT, UNIT_MATCH)."
            - "One released lot with one consigned unit SN-0001, acquisition_cost_cents 462500, still NOT_BILLABLE."
            - "Vendor.open_consignment_liability_cents is 0."
            - "An IN_PROGRESS case CASE-1 for patient P1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id", liab_start: "$.data.open_consignment_liability_cents" }
            - call: "POST /udi/consignment-agreements"
              payload: { vendor_id: "${vendor_id}", agreement_code: "AGR-A", billing_trigger: "ON_IMPLANT", reconciliation_method: "UNIT_MATCH", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-12-31T23:59:59.999Z", invoice_tolerance_bps: 150 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { agr_id: "$.data.id" }
            - call: "POST /udi/consignment-agreements/${agr_id}/activate"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 462500, consignment_agreement_id: "${agr_id}", expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v: "$.data.version" }
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { liab_before: "$.data.open_consignment_liability_cents" }
          trigger:
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678905", udi_pi_serial: "SN-0001", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { liab_mid: "$.data.open_consignment_liability_cents" }
            - call: "POST /udi/implant-records/${ir1_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
            - call: "POST /udi/implant-records/${ir1_id}/explants"
              payload: { reason: "DEVICE_FAILURE" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ex_id: "$.data.id", credit_exp: "$.data.credit_expected_cents" }
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { liab_after: "$.data.open_consignment_liability_cents" }
          assert:
            - "Before the implant, Vendor.${vendor_id}.open_consignment_liability_cents == 0"
            - "After the implant, Vendor.${vendor_id}.open_consignment_liability_cents == 462500"
            - "After the explant, Vendor.${vendor_id}.open_consignment_liability_cents == 0"
            - "DeviceUnit.${u1_id}.contract_price_cents == 462500 and price_list_version_at_billing == 1"
            - "DeviceUnit.${u1_id}.billing_state == CREDIT_PENDING and custody_state == EXPLANTED"
            - "ExplantRecord.${ex_id}.credit_expected_cents == 462500 (days_implanted 0 falls in the 100 percent tier)"
            - "ImplantRecord.${ir1_id}.status == EXPLANTED"

      - name: case_charge_ledger_conserved_across_post_void_roundtrip
        grounds:
          - calculations.implant_charge_amount
          - entities.SurgicalCase.fields.total_posted_charge_cents
          - state_machines.ChargeCapture.DRAFT_to_POSTED
          - state_machines.ChargeCapture.POSTED_to_VOIDED
        distinguishing_aspect: |
          A third conserved quantity, distinct from the unit count and from the
          vendor liability: the PATIENT-FACING CASE LEDGER.
          SurgicalCase.total_posted_charge_cents must be 0 before the post,
          exactly 792000 after it, and exactly 0 again after the compensating
          void, and readiness_status must return from BLOCKED_CHARGE to READY.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One STANDARD_IMPLANT catalog item with list_charge_cents 600000 and registry_required false."
            - "One released lot with one owned unit implanted into an IN_PROGRESS case and VERIFIED."
            - "One DRAFT ChargeCapture with quantity 1 whose provisional_charge_cents is 792000 (600000 x 1.32, the 32 percent tier)."
            - "SurgicalCase.total_posted_charge_cents is 0 because DRAFT lines are excluded from the sum."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678905", udi_pi_serial: "SN-0001", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
            - call: "POST /udi/implant-records/${ir1_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
            - call: "POST /udi/implant-records/${ir1_id}/charges"
              payload: { quantity: 1 }
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { ch_id: "$.data.id", prov: "$.data.provisional_charge_cents" }
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { total_before: "$.data.total_posted_charge_cents" }
          trigger:
            - call: "POST /udi/charge-captures/${ch_id}/post"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { total_mid: "$.data.total_posted_charge_cents", readiness_mid: "$.data.readiness_status" }
            - call: "POST /udi/charge-captures/${ch_id}/void"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
