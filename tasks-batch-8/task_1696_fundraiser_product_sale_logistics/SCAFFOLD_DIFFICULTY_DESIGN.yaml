        grounds:
          - state_machines.Campaign.ORDERING_CLOSED_to_SUPPLIER_ORDERED
          - state_machines.Campaign.SUPPLIER_ORDERED_to_DELIVERED
          - state_machines.SupplierOrder.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Campaign <- SupplierOrder pair: the campaign's long chain cannot advance past
          ORDERING_CLOSED until a DIFFERENT entity (the supplier order) reaches ACKNOWLEDGED, and
          cannot reach DELIVERED until that order is DELIVERED — auto-transitions fired by
          cross-entity state, not by any direct campaign call.
        test_recipe:
          setup:
            - "campaign with one submitted order; ordering closed; supplier order created and submitted but not yet acknowledged"
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
