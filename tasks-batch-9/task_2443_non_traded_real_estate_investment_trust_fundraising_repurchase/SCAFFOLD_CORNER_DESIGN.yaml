            - "resume_error == \"ERR_INVALID_STATE_TRANSITION\" with response http status == 409 (TERMINATED is terminal on this axis)"
            - "new_period_error == \"ERR_REPURCHASE_PLAN_SUSPENDED\" with response http status == 409"
            - "new_request_error == \"ERR_REPURCHASE_PLAN_SUSPENDED\" with response http status == 409"
            - "Offering.${off_id}.registration_status == \"EFFECTIVE\" and Offering.${off_id}.escrow_status == \"BROKEN\" (the other two axes are untouched)"
            - "Investor.${inv_id}.total_shares_e4 == 300000000 (rejecting the tenders consumed no shares)"
            - "GET /repurchase-periods?offering_id=${off_id} returns total_count == 1"

      - name: processing_is_refused_before_the_cutoff_and_allowed_at_it
        claim_type: conditional_action
        grounds:
          - endpoints[POST /repurchase-periods/{repurchase_period_id}/processing]
          - errors[ERR_PERIOD_NOT_READY_FOR_PROCESSING]
          - entities.RepurchasePeriod.fields.request_cutoff_at
          - calculations.repurchase_capacity
        distinguishing_aspect: |
          Processing must be refused at any instant before request_cutoff_at and
          permitted at exactly that instant, and with no tenders at all it must
          still settle cleanly at capacity 0 rather than erroring on an empty
          waterfall.
        test_recipe:
          setup:
            - "Offering 'Halewood Core REIT' is EFFECTIVE with one class I and no subscriptions, so aggregate_nav_cents is 0."
            - "An August period runs from 2026-08-01T00:00:00Z to a 2026-08-26T00:00:00Z cutoff with settlement 2026-08-30 and holds no requests."
            - "The clock starts at its declared 2026-08-01T00:00:00Z default."
