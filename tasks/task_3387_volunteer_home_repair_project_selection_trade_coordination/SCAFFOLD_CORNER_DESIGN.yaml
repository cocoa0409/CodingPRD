          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"
            - "the matching self commitment succeeds and SponsorshipCommitment.${com}.status == PLEDGED"

      - name: assessor_cannot_verify_application_and_anonymous_cannot_read_cycle
        claim_type: RBAC Denial
        grounds:
          - roles.Assessor
          - roles.Anonymous
          - roles.Any
        distinguishing_aspect: "Two distinct denial shapes in one sweep: Assessor (a real staff-adjacent role) is outside PATCH /applications, and Anonymous is outside the Any pseudo-role's GET surface."
        test_recipe:
          setup:
            - "One cycle; one SUBMITTED application."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
