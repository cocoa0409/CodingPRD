      - name: duplicate_fee_code_within_one_program_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_DUPLICATE_FEE_CODE]
          - errors[ERR_DUPLICATE_INCLUSION_CODE]
        distinguishing_aspect: "Fee.code uniqueness is scoped to the fee_program_id, not global, and FeeInclusion.service_code uniqueness is scoped to the fee: the same literal string is legal again one parent over."
        test_recipe:
          setup:
            - "Two DRAFT programs on the same property; the first already carries a RESORT fee with a POOL_ACCESS inclusion"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_resort: $.data.id }
            - call: "POST /fees/${fee_resort}/inclusions"
              payload: { service_code: "POOL_ACCESS", service_label: "Pool and cabana access", retail_value_cents: 1500, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "GET /properties/${p1}"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { p1_v2: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY27-Q1", effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", expected_property_version: "${p1_v2}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp2: $.data.id }
          trigger:
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee v2", classification: "OPTIONAL", basis: "PER_NIGHT", amount_cents: 800, disclosure_text: "A second fee reusing the RESORT code." }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_FEE_CODE — the classification and basis differ, so only the code collides"
            - "FeeProgram.${fp1}.fee_count is still 1 and no second Fee row exists"
            - "control: the same payload posted to ${fp2} returns HTTP 201, because uniqueness is per fee_program_id"
            - "a second POST /fees/${fee_resort}/inclusions with service_code POOL_ACCESS returns HTTP 409 with data.error_id == ERR_DUPLICATE_INCLUSION_CODE, and Fee.${fee_resort}.inclusion_count stays 1"
            - "the same POOL_ACCESS service_code attached to a different Fee returns HTTP 201 — that uniqueness is scoped to the fee"

      - name: duplicate_jurisdiction_code_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_DUPLICATE_JURISDICTION_CODE]
          - errors[ERR_DUPLICATE_TAXABILITY_RULE]
          - errors[ERR_DUPLICATE_DOCKET_NUMBER]
        distinguishing_aspect: "Three uniqueness scopes are exercised from one fixture: Jurisdiction.code is GLOBAL, (jurisdiction_id, fee_code) is per jurisdiction for TaxabilityRule, and docket_number is per jurisdiction for RegulatorInquiry — so the same docket string is legal in a second county."
        test_recipe:
          setup:
            - "Two jurisdictions (US-NV-CLARK and US-AZ-MARICOPA) each with one ACTIVE property"
            - "A TaxabilityRule for (US-NV-CLARK, RESORT) and a RegulatorInquiry with docket_number NV-2026-0091 against the Nevada property"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "US-AZ-MARICOPA", name: "Maricopa County AZ", occupancy_tax_rate_bps: 1250, first_quote_total_required: false, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: false }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_az: $.data.id }
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_az}", name: "Camelback Lodge", brand_code: "CBL", base_room_rate_cents: 21900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_az: $.data.id }
            - call: "POST /regulator-inquiries"
              payload: { jurisdiction_id: "${j_nv}", property_id: "${p_nv}", docket_number: "NV-2026-0091", channel_scope: ["OTA"], response_due_at: "2026-10-01T00:00:00Z" }
              as: RegulatoryLiaison
              as_user_id: "u-liaison-1"
              captures: { inq1: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County Nevada (duplicate)", occupancy_tax_rate_bps: 1400, first_quote_total_required: false, itemization_required_on_folio: false, mandatory_fee_ban: true, opt_out_mandate: false }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_JURISDICTION_CODE — every other field differs, so only the code collides, and the collision is global rather than scoped"
            - "GET /jurisdictions returns total_count 2, and Jurisdiction.${j_nv}.occupancy_tax_rate_bps is still 1338 — a rejected create never patches the incumbent"
            - "a second POST /taxability-rules for (${j_nv}, RESORT) returns HTTP 409 with data.error_id == ERR_DUPLICATE_TAXABILITY_RULE, even when its taxability differs"
            - "the same fee_code RESORT posted for ${j_az} returns HTTP 201 — TaxabilityRule uniqueness is on the pair, not on the code"
            - "a second RegulatorInquiry with docket_number NV-2026-0091 against ${p_nv} returns HTTP 409 with data.error_id == ERR_DUPLICATE_DOCKET_NUMBER"
            - "the identical docket_number NV-2026-0091 against ${p_az} in ${j_az} returns HTTP 201 — docket uniqueness is scoped per jurisdiction, not global"

