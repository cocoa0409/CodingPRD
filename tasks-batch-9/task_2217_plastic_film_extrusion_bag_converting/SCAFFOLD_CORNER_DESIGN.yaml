  - section: cross_cutting_complexity_layers
    instances:
      - name: pool_version_advances_on_every_write_and_only_the_current_one_is_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.regrind-reincorporation-stale-pool
          - errors[ERR_STALE_POOL_VERSION]
        distinguishing_aspect: "The declared OCC field is the only observable that separates a client working from a current view of available_kg from one working from a superseded view: the first draw carries the freshly read version and succeeds, and replaying that same literal version afterwards is refused even though 40.000 kg would still have covered the request."
        test_recipe:
          setup:
            - "POOL-NF holding 100.000 kg from RUN-NF-1 scrap"
            - "RUN-NF-2 RUNNING with a 175.000 kg regrind budget"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_roll1
            - *a_run1_comp
            - *a_clock_d1_1500
            - *a_run2b_new
            - *a_run2b_start
            - *a_get_pool_nf2
          trigger:
            - { call: "POST /extrusion-runs/${run2}/regrind-reincorporations", payload: { pool_id: "${pool_nf}", kg: 60.0, expected_regrind_pool_version: "${v_pool_nf}" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run2}/regrind-reincorporations", payload: { pool_id: "${pool_nf}", kg: 10.0, expected_regrind_pool_version: "${v_pool_nf}" }, as: ExtrusionOperator }
          assert:
            - "the first reincorporation -> 201 and RegrindPool.${pool_nf}.available_kg == 40.000, cumulative_out_kg == 60.000"
            - "RegrindPool.${pool_nf}.version is strictly greater than the value captured as ${v_pool_nf}"
            - "the second reincorporation, replaying ${v_pool_nf}, -> 412 ERR_STALE_POOL_VERSION"
            - "the response error_id is neither ERR_REGRIND_INSUFFICIENT nor ERR_REGRIND_BUDGET_EXCEEDED (10.000 kg fits in both)"
            - "RegrindPool.${pool_nf}.available_kg is still 40.000 and reincorporation_count == 1"
      - name: packout_rejects_a_stale_bag_lot_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.packout-stale-bag-lot
          - errors[ERR_STALE_BAG_LOT_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / optimistic_concurrency_priority_8_outranks_business_fiscal_priority_15_on_packout
          rationale: "The stale-version rejection and the current-version success for this rule are both asserted in the named 1.8 instance."
      - name: recipe_derived_fields_are_reconciled_after_every_component_write
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.layers.derived_field_reconciliation
          - calculations.blend_cost_and_density
        distinguishing_aspect: "No derived field is a running accumulator: each component write recomputes the whole vector from the current component set, so the 60/40 split reaches exactly the same totals a single 100.000 % component would have produced."
        test_recipe:
          setup:
            - "DRAFT recipe R-NF-0 for P-NF-1 with no components"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_r0_new
          trigger:
            - { call: "POST /blend-recipes/${r0}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 60.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - { call: "POST /blend-recipes/${r0}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 40.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
          assert:
            - "after the first component: BlendRecipe.${r0}.total_weight_pct == 60.000, blended_cost_per_kg == 0.87, blended_density_kg_m3 == 550.80"
            - "after the first component: BlendRecipe.${r0}.strength_index == 25.20, clarity_index == 88.00, slip_index == 58.00"
            - "after the second component: BlendRecipe.${r0}.total_weight_pct == 100.000, blended_cost_per_kg == 1.45, blended_density_kg_m3 == 918.00"
            - "after the second component: BlendRecipe.${r0}.strength_index == 42.00, clarity_index == 80.00, slip_index == 30.00"
            - "BlendRecipe.${r0}.status is still DRAFT throughout"
      - name: the_second_active_hold_restricts_the_line_and_a_resume_reopens_it
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.layers.rate_threshold_triggers
          - calculations.line_posture
          - calculations.line_posture.constants.POSTURE_RESTRICTED_MIN_HOLDS
        distinguishing_aspect: "The hold counter is a live rate gauge, not a cumulative tally: one HELD run leaves the line OPEN, the second crosses POSTURE_RESTRICTED_MIN_HOLDS and restricts it, and resuming either run drops the count back below the threshold and reopens it in the same request."
        test_recipe:
          setup:
            - "RUN-NF-1 HELD on line L-NF (one active hold)"
            - "RUN-NF-H RUNNING on the same line from 15:00"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - &a_run1_hold { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "gauge drift" }, as: ExtrusionOperator }
            - *a_clock_d1_1500
            - &a_runH_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-H", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T15:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runH: "$.data.id" } }
            - &a_runH_start { call: "POST /extrusion-runs/${runH}/start", payload: {}, as: ExtrusionOperator }
          trigger:
            - { call: "GET /extrusion-lines/${line_nf}", payload: {}, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${runH}/hold", payload: { hold_reason: "bubble instability" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${runH}/resume", payload: {}, as: ExtrusionOperator }
          assert:
            - "the GET shows ExtrusionLine.${line_nf}.active_hold_count == 1 and posture == OPEN (one hold is below the threshold)"
            - "the hold -> 200 and ExtrusionLine.${line_nf}.active_hold_count == 2 with posture == RESTRICTED"
            - "the resume -> 200 and ExtrusionLine.${line_nf}.active_hold_count == 1 with posture == OPEN"
            - "ExtrusionRun.${runH}.hold_count == 1 and status == RUNNING; ExtrusionRun.${run1}.status is still HELD"
            - "ExtrusionLine.${line_nf}.incapable_run_count == 0 throughout"
      - name: a_five_level_cascade_runs_end_to_end_from_one_write
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_dossier_revocation_quarantines_lot_wears_plate_and_freezes_line
          rationale: "Both cascade roots are traced hop by hop in the two named transitive_cascade instances."
      - name: both_recycled_content_variants_are_computed_and_their_delta_checked
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.layers.dual_variant_calculation
          - calculations.run_mass_balance.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / recycled_content_nominal_versus_as_built_diverge
          rationale: "The two variants and the signed delta between them are the subject of the named 1.8 instance."
  - section: consistency_model
    instances:
      - name: run_completion_returns_every_derived_field_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.run_mass_balance
          - calculations.pool_mass_balance
        distinguishing_aspect: "Nothing lags behind the write: the completion response itself carries the mass balance, the capability verdict and the recycled-content figures, and the pool it fed is already at its new balance on the next read with no settling step."
        test_recipe:
          setup:
            - "RUN-NF-1 RUNNING with five 40.0 micron readings and roll 1 (100.0 kg) wound"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
