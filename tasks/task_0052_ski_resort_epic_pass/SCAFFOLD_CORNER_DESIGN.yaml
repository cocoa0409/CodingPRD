          - errors[ERR_FORBIDDEN_ROLE]
          - endpoints.POST_/refund-requests/{id}/approve
        distinguishing_aspect: "POST /refund-requests/{id}/approve as ResortOps (a RefundAdmin-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
