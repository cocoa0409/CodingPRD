  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: ad_fund_rounding_half_up
        claim_type: Precision
        grounds:
          - calculations.ad_fund
          - entities.RoyaltyStatement.fields.ad_fund_cents
        distinguishing_aspect: |
          ad_fund_cents = round_half_up(net_sales_basis_cents * 0.02). For basis 1234567:
          1234567*0.02 = 24691.34 → 24691 (round half up to whole cents).
        test_recipe:
          setup:
            - "Brand; OPEN unit; one ACCEPTED SalesReport period 0 net 1234567; DRAFT statement period 0."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 1234567, discounts_cents: 0 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
          assert:
            - "RoyaltyStatement.${rs_id}.net_sales_basis_cents == 1234567"
            - "RoyaltyStatement.${rs_id}.ad_fund_cents == 24691   # round_half_up(24691.34)"
            - "RoyaltyStatement.${rs_id}.royalty_cents == 74074   # round_half_up(1234567*0.06=74074.02)"

      - name: rebate_excludes_below_threshold_authorization
        claim_type: Input Set Filtering
        grounds:
          - calculations.rebate_distribution
          - entities.VendorAuthorization.fields.qualifying_purchase_cents
          - entities.NationalAccount.fields.min_qualifying_cents
        distinguishing_aspect: |
          A VendorAuthorization with qualifying_purchase_cents below min_qualifying_cents (500000 < 1000000)
          is excluded from the rebate; the full pool goes to the single qualifying authorization.
        test_recipe:
          setup:
            - "Brand; APPROVED vendor; two OPEN units with ACTIVE VendorAuthorizations qpc 2000000 (qualifies) and 500000 (below min); NationalAccount pool 1000000, min 1000000, OPEN."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/vendors"
              payload: { brand_id: "${brand_id}", name: "Acme", category: "FOOD" }
              as: ComplianceAuditor
              captures: { vendor_id: $.data.id }
            - call: "POST /franchise/vendors/${vendor_id}/approve"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
