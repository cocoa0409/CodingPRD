            - "HTTP 200; the shadow is LINKED with claimed_use_case_id == the LITE use case id"
            - "grace_deadline_at is unchanged at 2026-08-15T00:00:00Z (INTERNAL_PILOT base 14 days) - linking does not touch the grace clock"
            - "ModelAsset.enforced_shadow_count is still 0 and the asset is still APPROVED_FOR_USE"
            - "GET /shadow-deployments?claimed_use_case_id={uc} returns exactly 1 row"

