              as: AccountManager
              as_user_id: "am-001"
              captures: { qe_id: "$.data.id", qe_monthly: "$.data.monthly_recurring_cents"}
            - call: "POST /fence-rentals/quotes/${qe_id}/issue"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/quotes/${qe_id}/accept"
              payload: { accepted_by_name: "R. Vance" }
              as: CustomerContact
              as_user_id: "${a1_id}"
            - call: "POST /fence-rentals/contracts"
              payload: { quote_id: "${qe_id}", terms_acknowledged_by: "R. Vance" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { ce_id: "$.data.id"}
            - call: "POST /fence-rentals/jobsites/${j2_id}/quotes"
              payload: { expected_jobsite_version: "${j2_v}", contract_type: "CONSTRUCTION", linear_feet: 250, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE", addon_lines: [ { product_code: "GATE-12", quantity: 7 }, { product_code: "BARR-8", quantity: 4 } ] }
              as: AccountManager
              as_user_id: "am-001"
              captures: { qc_id: "$.data.id", qc_monthly: "$.data.monthly_recurring_cents"}
            - call: "POST /fence-rentals/quotes/${qc_id}/issue"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/quotes/${qc_id}/accept"
              payload: { accepted_by_name: "R. Vance" }
              as: CustomerContact
              as_user_id: "${a1_id}"
            - call: "POST /fence-rentals/contracts"
              payload: { quote_id: "${qc_id}", terms_acknowledged_by: "R. Vance" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { cc_id: "$.data.id"}
            - call: "POST /fence-rentals/contracts/${ce_id}/work-orders"
              payload: { work_order_type: "DELIVERY_INSTALL", ordered_linear_feet: 250 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { woe_id: "$.data.id"}
            - call: "POST /fence-rentals/contracts/${cc_id}/work-orders"
              payload: { work_order_type: "DELIVERY_INSTALL", ordered_linear_feet: 250 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { woc_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/work-orders/${woe_id}/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-20T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${woc_id}/dispatch"
              payload: { crew_id: "${c2_id}", scheduled_start_utc: "2026-08-20T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${woe_id}/complete"
              payload: { completed_linear_feet: 250 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${woc_id}/complete"
              payload: { completed_linear_feet: 250 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fence-rentals/contracts/${ce_id}/billing-runs"
              payload: { period_start_utc: "2026-08-20T00:00:00Z", period_end_utc: "2026-09-06T00:00:00Z" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { inv_e_id: "$.data.id", inv_e_sub: "$.data.subtotal_cents"}
            - call: "POST /fence-rentals/contracts/${cc_id}/billing-runs"
              payload: { period_start_utc: "2026-08-20T00:00:00Z", period_end_utc: "2026-09-06T00:00:00Z" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { inv_c_id: "$.data.id", inv_c_sub: "$.data.subtotal_cents"}
          assert:
            - "RentalContract.${ce_id}.monthly_recurring_cents == 60000"
            - "RentalContract.${cc_id}.monthly_recurring_cents == 60000"
            - "RentalContract.${ce_id}.contract_type == EVENT"
            - "RentalContract.${cc_id}.contract_type == CONSTRUCTION"
            - "Invoice.${inv_e_id}.invoice_kind == PERIODIC"
            - "Invoice.${inv_e_id}.billable_days == 17"
            - "Invoice.${inv_e_id}.lines has exactly one entry with line_type == RENTAL and amount_cents == 34000"
            - "Invoice.${inv_e_id}.subtotal_cents == 34000"
            - "Invoice.${inv_e_id}.tax_cents == 3026"
            - "Invoice.${inv_e_id}.late_fee_cents == 0"
            - "Invoice.${inv_e_id}.total_cents == 37026"
            - "Invoice.${inv_c_id}.billable_days == 17"
            - "Invoice.${inv_c_id}.lines has exactly one entry with line_type == RENTAL and amount_cents == 36429"
            - "Invoice.${inv_c_id}.subtotal_cents == 36429"
            - "Invoice.${inv_c_id}.tax_cents == 3242"
            - "Invoice.${inv_c_id}.late_fee_cents == 0"
            - "Invoice.${inv_c_id}.total_cents == 39671"
            - "Invoice.${inv_c_id}.subtotal_cents - Invoice.${inv_e_id}.subtotal_cents == 2429"
            - "RentalContract.${ce_id}.billed_through_utc == 2026-09-06T00:00:00Z"
            - "RentalContract.${cc_id}.billed_through_utc == 2026-09-06T00:00:00Z"

      - name: theft_loss_replacement_vs_depreciated_divergence
        grounds:
          - calculations.reconciliation_loss_assessment
          - calculations.invoice_total_rollup
          - entities.RemovalReconciliation.fields.assessment_variant
          - entities.RemovalReconciliation.fields.theft_police_report_number
          - entities.FenceProduct.fields.fleet_age_months
          - state_machines.RemovalReconciliation.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Two reconciliations with identical unit_returns (43 returned, 2 damaged,
          5 missing of the same 18-month-old 24000-cent panel) charge 120000 and
          76800 for the theft because supplying theft_police_report_number on a
          CONSTRUCTION contract switches the variant to DEPRECIATED_VALUE at
