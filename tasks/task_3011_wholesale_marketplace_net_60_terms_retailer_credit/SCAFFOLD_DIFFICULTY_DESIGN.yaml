# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Wholesale Marketplace Net-60 Terms & Retailer Credit Underwriting
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: credit_limit_provisional_vs_behavioral
        grounds:
          - calculations.credit_limit_underwriting
          - entities.CreditAccount.fields.limit_cents
          - entities.Retailer.fields.risk_tier
        distinguishing_aspect: |
          Two valid interpretations of the credit limit — the provisional variant
          (no invoice history, limit == store-type base) and the behavioral variant
          (history-adjusted before clamp) — produce different limits for the same
          BRICK_AND_MORTAR retailer: 250000 at opening vs 200000 at review after
          one late-paid invoice.
        test_recipe:
          setup:
            - "a VERIFIED BRICK_AND_MORTAR retailer with a CreditAccount whose initial limit is the provisional 250000"
            - "one invoice shipped at T0, moved past its net-60 due date, then paid late"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Corner Store", store_type: "BRICK_AND_MORTAR", address: "1 Main St", lat: 40.0, lng: -105.0, storefront_proof_url: "https://proof/1", resale_certificate_no: "RC-1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id, ca_limit_initial: $.data.limit_cents }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand A", contact_email: "a@b.com", min_order_value_cents: 10000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 20000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale/invoices/${inv_id}/payments"
              payload: { amount_cents: 20000 }
              as: Retailer
              as_user_id: "${r_id}"
            - call: "GET /wholesale/credit-accounts/${ca_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ca_ver: $.data.version }
          trigger:
            - call: "POST /wholesale/credit-accounts/${ca_id}/limit-review"
              payload: { expected_credit_account_version: "${ca_ver}" }
              as: PlatformAdmin
              captures: { ca_limit_reviewed: $.data.limit_cents }
          assert:
            - "CreditAccount.${ca_id}.limit_cents at opening == 250000 (provisional variant: base for BRICK_AND_MORTAR, no history)"
            - "CreditAccount.${ca_id}.limit_cents after review == 200000 (behavioral variant: 250000 + 0*50000 - 1*100000, clamped inside [50000, 1000000])"
            - "Retailer.${r_id}.risk_tier after review == MEDIUM (200000 > 100000 and <= 400000)"
      - name: return_credit_opening_free_vs_reorder_fee
        grounds:
          - calculations.return_credit_calc
          - entities.ReturnAuthorization.fields.return_fee_cents
          - entities.ReturnAuthorization.fields.is_opening_order
        distinguishing_aspect: |
          Two valid return-credit interpretations on the Order domain — the
          opening-order-free variant (fee 0) and the reorder-fee variant (15% of
          returned merchandise) — produce different invoice credits for identical
          return quantities: 20000 credit on the opening order vs 17000 on the
          reorder for the same 4 returned units at 5000 cents each.
        test_recipe:
          setup:
            - "a VERIFIED retailer with an ACTIVE credit account and an ACTIVE brand (case pack 1, lead time 0)"
            - "order 1 (opening order for the pair): 4 units at 5000, shipped and delivered"
            - "order 2 (reorder for the pair): 4 units at 5000, shipped and delivered"
            - "two APPROVED return authorizations, one per order, each returning all 4 units"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Shop R", store_type: "ONLINE", address: "2 Web Way", lat: 41.0, lng: -106.0, storefront_proof_url: "https://proof/2", resale_certificate_no: "RC-2" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand B", contact_email: "b@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /wholesale/orders/${o1_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders/${o1_id}/deliver"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o1_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /wholesale/orders/${o2_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders/${o2_id}/deliver"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o2_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv2_id: "$.data[0].id" }
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${o1_id}", lines: [{ order_line_id: "line-of-${o1_id}-0", qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { ra1_id: $.data.id }
            - call: "POST /wholesale/return-authorizations/${ra1_id}/review"
              payload: { decision: "APPROVE" }
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${o2_id}", lines: [{ order_line_id: "line-of-${o2_id}-0", qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { ra2_id: $.data.id }
            - call: "POST /wholesale/return-authorizations/${ra2_id}/review"
              payload: { decision: "APPROVE" }
              as: Brand
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /wholesale/return-authorizations/${ra1_id}/receive"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/return-authorizations/${ra2_id}/receive"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/orders/${o1_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv1_due: "$.data[0].amount_due_cents" }
            - call: "GET /wholesale/orders/${o2_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv2_due: "$.data[0].amount_due_cents" }
          assert:
            - "ReturnAuthorization.${ra1_id}.is_opening_order == true and return_fee_cents == 0 (opening-order-free variant)"
            - "Invoice.${inv1_id}.amount_due_cents == 0 after credit 20000 (20000 - 0 fee)"
            - "ReturnAuthorization.${ra2_id}.is_opening_order == false and return_fee_cents == 3000 (round_half_up(20000 * 0.15))"
            - "Invoice.${inv2_id}.amount_due_cents == 3000 after credit 17000 (20000 - 3000 fee)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: underwriting_mode_a_tiered_clamp
        grounds:
          - calculations.credit_limit_underwriting
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): the underwriting formula combines 3+ inputs (store-type base,
          on-time count, late count) with non-linear interaction (signed steps then
          a two-sided clamp); the floor clamp, not the arithmetic, decides the
          result when 2 late invoices would drag an ONLINE retailer to -50000.
        test_recipe:
          setup:
            - "a VERIFIED ONLINE retailer with a credit account (provisional limit 150000)"
            - "two separate orders, each shipped, each invoice moved past due, each WRITTEN_OFF (late_or_wo_count == 2)"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Net Shop", store_type: "ONLINE", address: "3 Dot Com", lat: 42.0, lng: -107.0, storefront_proof_url: "https://proof/3", resale_certificate_no: "RC-3" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand C", contact_email: "c@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 10000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /wholesale/orders/${o1_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S2", unit_price_cents: 10000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /wholesale/orders/${o2_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wholesale/orders/${o1_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale/invoices/${inv1_id}/write-off"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/orders/${o2_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv2_id: "$.data[0].id" }
            - call: "POST /wholesale/invoices/${inv2_id}/write-off"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/credit-accounts/${ca_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ca_ver: $.data.version }
          trigger:
            - call: "POST /wholesale/credit-accounts/${ca_id}/limit-review"
              payload: { expected_credit_account_version: "${ca_ver}" }
              as: PlatformAdmin
              captures: { ca_limit: $.data.limit_cents }
          assert:
            - "CreditAccount.${ca_id}.limit_cents == 50000 (raw 150000 - 2*100000 = -50000, floor clamp FLOOR=50000 applies)"
            - "Retailer.${r_id}.risk_tier == HIGH (limit <= 100000)"
      - name: return_credit_mode_c_evaluation_order
        grounds:
          - calculations.return_credit_calc
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (c): the credit formula is circular-looking — credit reduces the
          invoice balance while a clamp on the invoice balance caps the credit —
          so evaluation order is pinned (merchandise -> fee from merchandise ->
          clamp against the pre-credit amount_due); the fee is computed from
          merchandise value, never from the invoice balance.
        test_recipe:
          setup:
            - "a VERIFIED retailer with credit account; ACTIVE brand (case pack 1)"
            - "order 1 (opening) 4x5000 shipped+delivered and fully returned+received (clears the opening-order slot)"
            - "order 2 (reorder) 4x5000 shipped+delivered; a partial payment of 5000 leaves invoice amount_due 20000, balance 15000"
            - "an APPROVED return authorization on order 2 returning 4 units (merchandise 20000)"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Order Shop", store_type: "HYBRID", address: "4 Mix Ln", lat: 43.0, lng: -108.0, storefront_proof_url: "https://proof/4", resale_certificate_no: "RC-4" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand D", contact_email: "d@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /wholesale/orders/${o1_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders/${o1_id}/deliver"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${o1_id}", lines: [{ order_line_id: "line-of-${o1_id}-0", qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { ra1_id: $.data.id }
            - call: "POST /wholesale/return-authorizations/${ra1_id}/review"
              payload: { decision: "APPROVE" }
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/return-authorizations/${ra1_id}/receive"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S2", unit_price_cents: 5000, qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /wholesale/orders/${o2_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders/${o2_id}/deliver"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o2_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv2_id: "$.data[0].id" }
            - call: "POST /wholesale/invoices/${inv2_id}/payments"
              payload: { amount_cents: 5000 }
              as: Retailer
              as_user_id: "${r_id}"
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${o2_id}", lines: [{ order_line_id: "line-of-${o2_id}-0", qty: 4 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { ra2_id: $.data.id }
            - call: "POST /wholesale/return-authorizations/${ra2_id}/review"
              payload: { decision: "APPROVE" }
              as: Brand
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /wholesale/return-authorizations/${ra2_id}/receive"
              payload: {}
              as: PlatformAdmin
              captures: { ra2_credit: $.data.credit_cents, ra2_fee: $.data.return_fee_cents }
            - call: "GET /wholesale/invoices/${inv2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv2_status: $.data.status }
          assert:
            - "ReturnAuthorization.${ra2_id}.return_fee_cents == 3000 (fee from merchandise 20000, not from balance 15000)"
            - "ReturnAuthorization.${ra2_id}.credit_cents == 17000 (raw 20000-3000, clamp min(17000, 20000) = 17000)"
            - "Invoice.${inv2_id}.amount_due_cents == 3000 (20000 - 17000) while paid_amount_cents stays 5000"
            - "Invoice.${inv2_id}.balance_cents == 0 and status == PAID after re-evaluation"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: retailer_verification_cycle
        grounds:
          - state_machines.Retailer.PENDING_to_MORE_INFO_REQUESTED
          - state_machines.Retailer.MORE_INFO_REQUESTED_to_PENDING
          - validations[priority=10]
        distinguishing_aspect: |
          The Retailer verification machine is cyclic (PENDING ->
          MORE_INFO_REQUESTED -> PENDING) with a loop-guard counter; the third
          resubmission succeeds but a fourth is rejected with
          ERR_RESUBMISSION_LIMIT, proving the cycle is bounded.
        test_recipe:
          setup:
            - "a registered retailer whose verification has been bounced to MORE_INFO_REQUESTED and resubmitted exactly 3 times (verification_resubmission_count == 3, status back to PENDING)"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Loop Retail", store_type: "BRICK_AND_MORTAR", address: "5 Cycle Ave", lat: 44.0, lng: -109.0, storefront_proof_url: "https://proof/5", resale_certificate_no: "RC-5" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/request-more-info"
              payload: { reason: "blurry photo" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verification/resubmit"
              payload: { storefront_proof_url: "https://proof/5b", resale_certificate_no: "RC-5b" }
              as: Retailer
              as_user_id: "${r_id}"
            - call: "POST /wholesale/retailers/${r_id}/request-more-info"
              payload: { reason: "cert mismatch" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verification/resubmit"
              payload: { storefront_proof_url: "https://proof/5c", resale_certificate_no: "RC-5c" }
              as: Retailer
              as_user_id: "${r_id}"
            - call: "POST /wholesale/retailers/${r_id}/request-more-info"
              payload: { reason: "address mismatch" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verification/resubmit"
              payload: { storefront_proof_url: "https://proof/5d", resale_certificate_no: "RC-5d" }
              as: Retailer
              as_user_id: "${r_id}"
            - call: "POST /wholesale/retailers/${r_id}/request-more-info"
              payload: { reason: "still unclear" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/retailers/${r_id}/verification/resubmit"
              payload: { storefront_proof_url: "https://proof/5e", resale_certificate_no: "RC-5e" }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger is rejected with error_id == ERR_RESUBMISSION_LIMIT (HTTP 422)"
            - "Retailer.${r_id}.verification_status remains MORE_INFO_REQUESTED"
            - "Retailer.${r_id}.verification_resubmission_count == 3 (unchanged)"
      - name: order_parallel_dimensions
        grounds:
          - state_machines.Order
          - state_machines.Invoice
          - entities.Order.fields.status
          - entities.Invoice.fields.status
        distinguishing_aspect: |
          Order and its 1:1 Invoice carry parallel state dimensions that evolve
          independently after shipment: the invoice flips OPEN -> OVERDUE ->
          WRITTEN_OFF via the net-60 aging machine while the order itself remains
          DELIVERED — no transition on one dimension forces a transition on the
          other.
        test_recipe:
          setup:
            - "a VERIFIED retailer with credit account; ACTIVE brand (case pack 1, lead time 0)"
            - "an order shipped and delivered at the default clock; its invoice OPEN with due_date 2026-10-31T00:00:00Z"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Parallel Retail", store_type: "ONLINE", address: "6 Axis Rd", lat: 45.0, lng: -110.0, storefront_proof_url: "https://proof/6", resale_certificate_no: "RC-6" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
