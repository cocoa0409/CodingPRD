            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "CHECK" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { out_issue: $.data.outstanding_liability_cents }
            - call: "POST /annuity/scheduled-payments/${p1_id}/report-returned"
              payload: { return_reason: "BAD_ADDRESS" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { out_return: $.data.outstanding_liability_cents }
            - call: "GET /annuity/returned-payment-cases"
              payload: { scheduled_payment_id: "${p1_id}" }
              as: Any
              captures: { case_id: "$.data[0].id" }
            - call: "POST /annuity/returned-payment-cases/${case_id}/authorize-reissue"
              payload: {}
              as: OperationsSpecialist
              as_user_id: "ops-2"
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { out_reauth: $.data.outstanding_liability_cents }
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "EFT" }
              as: OperationsSpecialist
              as_user_id: "ops-2"
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { out_reissue: $.data.outstanding_liability_cents }
            - call: "POST /annuity/scheduled-payments/${p1_id}/mark-cleared"
              payload: {}
              as: OperationsSpecialist
              as_user_id: "ops-2"
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { out_final: $.data.outstanding_liability_cents, paid_final: $.data.paid_total_cents, total_final: $.data.total_scheduled_cents }
          assert:
            - "${out_issue} == 120000 (ISSUED is inside the outstanding set — issuance moves nothing)"
            - "${out_return} == 120000 (RETURNED also inside — the return is compensated without drift)"
            - "${out_reauth} == 120000 and ${out_reissue} == 120000 (reissue cycle conserves outstanding exactly)"
            - "${out_final} == 0 and ${paid_final} == 120000 after mark-cleared"
            - "${paid_final} + ${out_final} == ${total_final} == 120000 (no double count across the whole loop)"

      - name: finalize_reclaim_conserve_tracked
        grounds:
          - calculations.escheat_sweep_totals
          - state_machines.ScheduledPayment.ESCHEATABLE_to_ESCHEATED
          - state_machines.ScheduledPayment.ESCHEATED_to_PAYABLE
          - state_machines.EscheatmentBatch.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Conserved quantity = paid_total_cents + outstanding_liability_cents +
          escheated_total_cents (a three-field tracked-liability sum — a different
          quantity than the single-field outstanding invariant): finalize moves
          80000 from outstanding to escheated, reclaim moves it back, and the sum
          is 170000 before, between, and after the pair.
        test_recipe:
          setup:
            - "OR profile (AOM 18, cap 1500, cooling 15, ipa false, dormancy 1 year, commutation true); OR payee"
            - "funded agreement; ACTIVE schedule with p1 80000 due 2026-09-01 and p2 90000 due 2027-09-01 (esc 0)"
            - "clock 2026-09-05: p1 PAYABLE and issued by CHECK (issued 2026-09-05)"
            - "clock 2027-09-06: p1 passes dormancy (due+1yr = 2027-09-01 < 2027-09-06) -> ESCHEATABLE; p2 merely PAYABLE"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "OR", age_of_majority: 18, sspa_max_discount_rate_bps: 1500, disclosure_cooling_off_days: 15, ipa_required: false, dormancy_years: 1, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Esch Eatable", date_of_birth: "1972-08-17", tax_id: "909-09-0909", address_line1: "90 Forest Rd", address_city: "Salem", address_state_code: "OR", address_postal_code: "97301" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "IV-002", court_state_code: "OR", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-Q", insurer_name: "LifeCo", premium_cents: 30000000, contract_discount_rate_bps: 500, commutation_rider: "NONE", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2026-09-01", base_amount_cents: 80000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2027-09-01", base_amount_cents: 90000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p2_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "CHECK" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /annuity/scheduled-payments/${p1_id}"
              payload: {}
              as: Any
              captures: { p1_st: $.data.status }
          trigger:
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { t0_out: $.data.outstanding_liability_cents, t0_esch: $.data.escheated_total_cents, t0_paid: $.data.paid_total_cents }
            - call: "POST /annuity/escheatment-batches"
              payload: { state_code: "OR", batch_period: "2027-09" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { batch_id: $.data.id }
            - call: "POST /annuity/escheatment-batches/${batch_id}/finalize"
              payload: {}
              as: ComplianceOfficer
