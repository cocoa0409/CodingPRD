errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the called endpoint"
  - id: ERR_CREW_IDENTITY_MISMATCH
    http: 403
    condition: "InstallContractor's X-User-ID is not the install_crew_id of any InstallBooking of the shipment being handed off, in any status"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unrecognised enum member, wrong type, negative quantity, limit outside [1,100] or negative offset"
  - id: ERR_REFRIGERANT_NOT_FOUND
    http: 404
    condition: "refrigerant_id does not resolve"
  - id: ERR_ENERGY_STANDARD_NOT_FOUND
    http: 404
    condition: "energy_standard_id does not resolve"
  - id: ERR_TEST_CHAMBER_NOT_FOUND
    http: 404
    condition: "test_chamber_id does not resolve"
  - id: ERR_CASE_MODEL_NOT_FOUND
    http: 404
    condition: "A case model id in the path or body does not resolve"
  - id: ERR_ENERGY_TEST_NOT_FOUND
    http: 404
    condition: "An energy test id in the path or body does not resolve"
  - id: ERR_COMPLIANCE_LABEL_NOT_FOUND
    http: 404
    condition: "A compliance label id in the path does not resolve"
  - id: ERR_STORE_PLAN_NOT_FOUND
    http: 404
    condition: "A store plan id in the path or body does not resolve"
  - id: ERR_STORE_PLAN_LINE_NOT_FOUND
    http: 404
    condition: "A store plan line id in the path does not resolve"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "A work order id in the path or body does not resolve"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "A shipment id in the path or body does not resolve"
  - id: ERR_INSTALL_CREW_NOT_FOUND
    http: 404
    condition: "install_crew_id does not resolve"
  - id: ERR_INSTALL_BOOKING_NOT_FOUND
    http: 404
    condition: "An install booking id in the path does not resolve"
  - id: ERR_PART_INVENTORY_NOT_FOUND
    http: 404
    condition: "part_inventory_id does not resolve"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "A warranty claim id in the path does not resolve"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target row's current state does not admit the requested transition per §1.2"
  - id: ERR_STALE_CASE_MODEL_VERSION
    http: 412
    condition: "expected_case_model_version does not equal the live CaseModel.version"
  - id: ERR_STALE_STORE_PLAN_VERSION
    http: 412
    condition: "expected_store_plan_version does not equal the live StorePlan.version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The label issuer equals CaseModel.submitted_by_user_id, or the plan approver equals StorePlan.priced_by_user_id"
  - id: ERR_REFRIGERANT_SYSTEM_TYPE_INCOMPATIBLE
    http: 422
    condition: "CaseModel.system_type is not in Refrigerant.allowed_system_types"
  - id: ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED
    http: 422
    condition: "installed_charge_grams exceeds Refrigerant.max_charge_grams"
  - id: ERR_GWP_EXCEEDS_STANDARD
    http: 422
    condition: "Refrigerant.gwp_100yr exceeds EnergyStandard.max_gwp at label issuance"
  - id: ERR_STANDARD_NOT_APPLICABLE
    http: 422
    condition: "Standard temperature class, system-type scope or effective date does not cover the model and test window"
  - id: ERR_CASE_MODEL_REVISION_STALE
    http: 409
    condition: "EnergyTest.pinned_design_revision no longer equals CaseModel.design_revision"
  - id: ERR_MODEL_NOT_CERTIFIED
    http: 422
    condition: "An ordered or released line references a CaseModel whose status is not CERTIFIED"
  - id: ERR_PLAN_ON_COMPLIANCE_HOLD
    http: 409
    condition: "The plan has at least one line with compliance_hold == true"
  - id: ERR_DOOR_CONFIG_INVALID
    http: 422
    condition: "glass_door_count is non-zero on an OPEN case, or zero on a GLASS_DOOR case"
  - id: ERR_LINE_SET_NOT_PERMITTED
    http: 422
    condition: "line_set_length_ft is non-zero on a SELF_CONTAINED case, or zero on a REMOTE case"
  - id: ERR_LENGTH_NOT_OFFERED
    http: 422
    condition: "StorePlanLine.length_ft does not equal CaseModel.nominal_length_ft"
  - id: ERR_OPTION_NOT_COMPATIBLE
    http: 422
    condition: "GLASS_DOOR_UPGRADE ordered on an OPEN case, or NIGHT_CURTAIN ordered on a GLASS_DOOR case"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A uniqueness constraint from validation priority 21 is violated"
  - id: ERR_CHAMBER_CLASS_UNSUPPORTED
    http: 422
    condition: "The chamber does not support the model's temperature class"
  - id: ERR_CHAMBER_TDA_EXCEEDED
    http: 422
    condition: "The model's tda_sqft exceeds the chamber's max_tda_sqft"
  - id: ERR_CHAMBER_WINDOW_CONFLICT
    http: 409
    condition: "The requested window overlaps another test's turnaround-widened window, or intersects the chamber's closed maintenance interval"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 422
    condition: "A FAIL QA result is recorded on a unit whose rework_count already equals 2"
  - id: ERR_SCRAP_NOT_PERMITTED
    http: 422
    condition: "A SCRAP QA result is recorded on a unit whose rework_count is below 2"
  - id: ERR_NO_SHIPPABLE_UNITS
    http: 422
    condition: "The plan has zero WorkOrder rows with status COMPLETE when a shipment is created"
  - id: ERR_DELIVERY_OUTSIDE_REMODEL_WINDOW
    http: 422
    condition: "delivery_date falls outside the plan's remodel window or precedes ship_date"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "An interval's exclusive end is not strictly after its start"
  - id: ERR_BOOKING_OUTSIDE_REMODEL_WINDOW
    http: 422
    condition: "A booking starts before the shipment's delivery_date or ends after the day following the plan's remodel window end"
  - id: ERR_CREW_REGION_NOT_SERVED
    http: 422
    condition: "The plan's region_code is not in InstallCrew.service_region_codes"
  - id: ERR_CREW_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "On some day of the requested interval the crew's summed committed cases would exceed daily_case_capacity"
  - id: ERR_INSTALL_BOOKING_NOT_READY
    http: 409
    condition: "No InstallBooking with status BOOKED exists for the shipment being handed off"
  - id: ERR_HANDOFF_OUTSIDE_BOOKING_WINDOW
    http: 422
    condition: "The logical clock instant is outside [InstallBooking.start_date, InstallBooking.end_date)"
  - id: ERR_PART_MODEL_MISMATCH
    http: 422
    condition: "The depot stock row is stocked for a different case model than the claimed unit"
  - id: ERR_PART_REGION_MISMATCH
    http: 422
    condition: "The depot stock row's region_code differs from the claimed unit's plan region_code"
  - id: ERR_CLAIM_OUT_OF_WARRANTY
    http: 422
    condition: "The claim's reported_date falls outside the unit's coverage window, or the unit was never handed off"
  - id: ERR_PARTS_UNAVAILABLE
    http: 409
    condition: "PartInventory.available_qty is below the claim's requested_qty"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "StorePlan.total_cents exceeds credit_limit_cents at approval"

roles:
  - name: PlatformAdmin
    description: "Operator who seeds refrigerants, standards, chambers, crews and depot stock and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /refrigerants"
      - "POST /test-chambers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /energy-standards"
      - "POST /install-crews"
      - "POST /part-inventories"
      - "all GET reads"

  - name: DesignEngineer
    description: "Engineer who designs case models, runs the airflow and charge models, submits designs to the lab and opens refrigerant-transition engineering changes."
    identity: "opaque"
    exclusive_operations:
      - "POST /case-models"
      - "POST /case-models/{id}/airflow-model"
      - "POST /case-models/{id}/submit-for-test"
      - "POST /case-models/{id}/engineering-change"
    shared_operations:
      - "all GET reads"

  - name: TestLabTechnician
    description: "Energy lab technician who schedules, starts and completes chamber tests."
    identity: "opaque"
    exclusive_operations:
      - "POST /energy-tests"
      - "POST /energy-tests/{id}/start"
      - "POST /energy-tests/{id}/complete"
    shared_operations:
      - "all GET reads"

  - name: ComplianceOfficer
    description: "Officer who issues and revokes energy labels. May not issue a label for a model they submitted as engineer."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance-labels"
      - "POST /compliance-labels/{id}/revoke"
    shared_operations:
      - "POST /energy-standards"
      - "all GET reads"

  - name: SalesEngineer
    description: "Engineer who builds, prices and approves store plans. Pricing and approval must be performed by two different sales engineers."
    identity: "opaque"
    exclusive_operations:
      - "POST /store-plans"
      - "POST /store-plans/{id}/lines"
      - "POST /store-plans/{id}/price"
      - "POST /store-plans/{id}/approve"
    shared_operations:
      - "all GET reads"

  - name: PlantSupervisor
    description: "Supervisor who releases plans to the plant and drives every case through fabrication and final QA."
    identity: "opaque"
    exclusive_operations:
      - "POST /store-plans/{id}/release"
      - "POST /work-orders/{id}/advance"
      - "POST /work-orders/{id}/qa-result"
    shared_operations:
      - "all GET reads"

  - name: LogisticsCoordinator
    description: "Coordinator who ships completed cases into the store remodel window and reserves installation crews."
    identity: "opaque"
    exclusive_operations:
      - "POST /shipments"
      - "POST /shipments/{id}/advance"
      - "POST /shipments/{id}/cancel"
      - "POST /install-bookings"
      - "POST /install-bookings/{id}/release"
    shared_operations:
      - "POST /install-crews"
      - "all GET reads"

  - name: InstallContractor
    description: "Installation contractor crew that accepts delivered shipments on site. X-User-ID is the crew's id."
    identity: "entity_backed:InstallCrew"
    exclusive_operations:
      - "POST /shipments/{id}/handoff"
    shared_operations:
      - "all GET reads"

  - name: ServiceManager
    description: "Field service manager who stocks depots and runs warranty claims from report to resolution or denial."
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty-claims"
      - "POST /warranty-claims/{id}/reserve-parts"
      - "POST /warranty-claims/{id}/resolve"
      - "POST /warranty-claims/{id}/deny"
    shared_operations:
      - "POST /part-inventories"
      - "all GET reads"
