          assert:
            - "wr == 0.600000 — exactly at the 0.600000 threshold ((2x15.000000 + 1x6.000000) / (2x15.000000 + 5x6.000000) = 36/60)"
            - "st == CERTIFIED — the >= boundary is inclusive; the gate passes"
            - "cert_by == analyst-1 (certifier identity recorded for segregation-of-duties checks)"

      - name: embargo_bulletin_at_exact_open_instant_succeeds
        grounds:
          - validations[priority=33]
          - state_machines.EmbargoGrant.ISSUED_to_ACCESSED
          - errors[ERR_EMBARGO_NOT_OPEN]
        distinguishing_aspect: |
          Metric: logical-clock timestamp against release.embargo_open_at
          (distinct from the rate threshold of the sibling instance, and reached
          via the bulletin endpoint, not cycle advance). At clock ==
          embargo_open_at exactly, the bulletin read succeeds (>= semantics) and
          flips the grant ISSUED -> ACCESSED.
