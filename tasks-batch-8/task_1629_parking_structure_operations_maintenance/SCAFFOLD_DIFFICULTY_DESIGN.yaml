      - call: GET /ops/access-devices/${d1}
        as: FacilityManager
        captures:
          m1: $.data.device_mode
      - call: GET /ops/access-devices/${d2}
        as: FacilityManager
        captures:
          m2: $.data.device_mode
      - call: POST /ops/parking-sessions
        payload:
