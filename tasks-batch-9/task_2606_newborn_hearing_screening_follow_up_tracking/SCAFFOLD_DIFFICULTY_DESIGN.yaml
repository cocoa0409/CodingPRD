              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-V", guardian_contact_phone: "5550801", guardian_consent_status: "REFUSED" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { v_id: "$.data.id" }
            - call: "GET /infants/${v_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_ver: "$.data.version" }
            - call: "POST /follow-up-episodes"
              payload: { infant_id: "${v_id}", episode_type: "DIAGNOSTIC", expected_infant_version: "${v_ver}" }
              as: ProgramAdmin
              captures: { ep_v_id: "$.data.id" }
            - call: "POST /diagnostic-evaluations"
              payload: { infant_id: "${v_id}", episode_id: "${ep_v_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", evaluation_datetime: "2026-08-02T06:00:00Z", method: "DIAGNOSTIC_ABR" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { ev_v_id: "$.data.id" }
          trigger:
            - call: "POST /diagnostic-evaluations/${ev_v_id}/submit"
              payload: { left_ear_threshold_db: 45, right_ear_threshold_db: 50, outcome: "BILATERAL_LOSS" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_GUARDIAN_CONSENT_REFUSED"
            - "data.error_id != ERR_INFANT_NOT_REFERRED even though Infant.${v_id}.screening_status == NOT_SCREENED also violates priority 24"
            - "DiagnosticEvaluation.${ev_v_id}.status is still DRAFT with left_ear_threshold_db == null, right_ear_threshold_db == null and outcome == null"
            - "Infant.${v_id}.screening_status is still NOT_SCREENED"

