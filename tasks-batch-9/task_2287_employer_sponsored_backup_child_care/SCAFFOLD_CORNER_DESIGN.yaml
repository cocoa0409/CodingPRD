          difficulty_instance: priority_pair_validation_conflict / issue_void_empty_invoice_returns_terminal_state_not_invoice_empty
          rationale: "That instance issues a VOID invoice and asserts ERR_EMPLOYERINVOICE_TERMINAL wins over the fiscal check, which is exactly the terminal-state lockdown claim for the EmployerInvoice machine."

      - name: corner_parallel_billing_dimension_moves_independently
        claim_type: parallel
        grounds:
          - state_machines.Reservation.NOT_BILLABLE_to_ACCRUED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: boundary_precision_check / cancel_exactly_at_deadline_is_free_one_second_later_costs_6000
          rationale: "Both reservations leave the fulfillment dimension in CANCELLED while the parallel billing dimension diverges — NOT_BILLABLE for the on-time cancel and ACCRUED for the late one — which is the independent-dimension claim."

      - name: corner_cascade_down_provider_suspension_to_reservations
        claim_type: Cascade down
        grounds:
          - state_machines.Provider.CREDENTIALED_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_MATCHING
        excluded_because:
          difficulty_instance: transitive_cascade / credential_revoke_cascades_credential_provider_reservation_ledger_block
          rationale: "That instance walks credential revoke -> provider SUSPENDED -> future CONFIRMED reservation back to MATCHING -> ledger RELEASE -> block seats freed, asserting each cascade hop."

      - name: corner_compensation_void_reverses_invoice_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.EmployerInvoice.ISSUED_to_VOID
        excluded_because:
          difficulty_instance: compensating_invariant / employer_money_ledger_survives_invoice_issue_and_void
          rationale: "The void path there reverses every side effect of invoicing (lines deleted, totals zeroed, reservations back to ACCRUED, ytd_billed_cents back to 0) with no drift in the money ledger."

      - name: corner_ledger_sync_entitlement_derived_fields
        claim_type: Ledger sync
        grounds:
          - state_machines.Reservation.IN_SERVICE_to_COMPLETED
          - calculations.employee_entitlement_projection
        excluded_because:
          difficulty_instance: compensating_invariant / entitlement_days_reconcile_to_ledger_after_release_and_cancel
          rationale: "That instance reconciles Employee.entitlement_days_used and entitlement_days_reserved against the append-only ledger at three observation points."

      - name: corner_cyclic_reservation_returns_to_matching
        claim_type: cyclic
        grounds:
          - state_machines.Reservation.OFFERED_to_MATCHING
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_reenters_offered_after_rejection_then_exhausts_pool
          rationale: "That instance drives MATCHING -> OFFERED -> MATCHING -> OFFERED and then terminates the loop in UNFULFILLED once the candidate pool is exhausted."

