          assert:
            - "Every call returns HTTP 422 ERR_INVALID_REQUEST"
            - "Call 1: expected_days_in_office_per_week 6 is one past the declared 0..5 ceiling"
            - "Call 2: the desk band 1..12 holds 12 desks for a 13-seat neighborhood, so (desk_index_to - desk_index_from + 1) != seat_count; the individual numbers are all in range, which is what makes this a relational check"
            - "Call 3: buffer_seats 13 == seat_count 13 would leave usable capacity 0, and the rule demands a STRICT inequality"
            - "Call 4: 'VPN_TUNNEL' is not a member of the signal_source enum (BADGE, NETWORK, MANUAL_ATTEST)"
            - "Call 5: minutes_present 1441 is one past the 0..1440 ceiling"
