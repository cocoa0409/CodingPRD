  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_submit_phase
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - state_machines.CertificationProject.STRATEGY_LOCKED_to_DESIGN_SUBMITTED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a submit-phase request on
          a REGISTERED project (invalid from-state, priority 4) that would also
          fail the fee check (budget 100000 < 850000 design fee, priority 8)
          must return ERR_INVALID_PROJECT_STATE, not ERR_INSUFFICIENT_SUBMISSION_FUNDS.
        test_recipe:
          setup:
            - "Project in REGISTERED (strategy never locked) with fee_budget_cents = 100000 (below the 850000 design fee for 120000 sqft)"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower I", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 100000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /certification-projects/${p_id}/submit-phase"
              payload: { phase: "DESIGN" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_PROJECT_STATE (state priority 4 wins over business_fiscal priority 8)"
            - "error_id != ERR_INSUFFICIENT_SUBMISSION_FUNDS despite fee_balance_cents (100000) < design fee (850000)"
            - "CertificationProject.${p_id}.status still == REGISTERED"

      - name: safety_before_constraint_on_cx_schedule
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - calculations.commissioning_schedule_overlap
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (different
          pair than the state-vs-fiscal instance): scheduling a commissioning
          task with a non-independent agent (safety, priority 5) that also
          overlaps an existing task (constraint, priority 7) must return
          ERR_CX_AGENT_NOT_INDEPENDENT, not ERR_CX_SCHEDULE_OVERLAP.
        test_recipe:
          setup:
            - "Project exists; CxGood (COMMISSIONING, is_independent=true) has a SCHEDULED task [2026-09-01T09:00Z, 2026-09-01T12:00Z)"
            - "CxBad has specialty COMMISSIONING but is_independent=false"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Carl Cx", email: "carl@x.com", specialty: "COMMISSIONING", is_independent: true }
              as: ProgramAdmin
              captures: { m_cx_good: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Chuck Cx", email: "chuck@x.com", specialty: "COMMISSIONING", is_independent: false }
              as: ProgramAdmin
              captures: { m_cx_bad: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower J", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id }
            - call: "POST /commissioning-tasks"
              payload: { project_id: "${p_id}", task_type: "CX_PLAN", agent_id: "${m_cx_good}", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T12:00:00Z", is_prerequisite_linked: true }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
          trigger:
            - call: "POST /commissioning-tasks"
              payload: { project_id: "${p_id}", task_type: "FUNCTIONAL_TESTING", agent_id: "${m_cx_bad}", scheduled_start: "2026-09-01T11:00:00Z", scheduled_end: "2026-09-01T13:00:00Z", is_prerequisite_linked: false }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
          assert:
            - "HTTP 403 with error_id == ERR_CX_AGENT_NOT_INDEPENDENT (business_safety priority 5 wins over business_constraint priority 7)"
            - "error_id != ERR_CX_SCHEDULE_OVERLAP despite [11:00,13:00) overlapping [09:00,12:00)"

