      - name: occ_stale_product_version_rejects_the_assessment_open_then_accepts_the_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assessment-create-stale-product
          - validations[priority=46]
          - errors[ERR_STALE_PRODUCT_VERSION]
          - endpoints.POST_labeling_products_id_assessments
        distinguishing_aspect: "A spec change bumps Product.version from 1 to 2, so the assessment open replayed with the version the client last read (1) returns 412 ERR_STALE_PRODUCT_VERSION and creates nothing, while the same call carrying version 2 returns 201 and snapshots assessed_spec_revision 2."
        test_recipe:
          setup:
            - "Acme owns one SMART_SPEAKER product created at version 1; a firmware spec change has since advanced it to version 2 and spec_revision 2."
