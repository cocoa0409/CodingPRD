            - "Keg.${k1_id}.custody_state == IN_TRADE with distributor_custody_started_at == 2026-08-04T00:00:00Z after the control"

      - name: a_future_timestamp_is_refused_on_every_endpoint_that_accepts_one
        claim_type: triggerable
        grounds:
          - errors.ERR_SCAN_TIMESTAMP_FUTURE
          - validations[priority=33]
        distinguishing_aspect: "Priority 33 is not scan-only: the same code guards scanned_at, received_at and effective_date, and it is a strict future test, so a scanned_at exactly equal to the logical clock is accepted while one millisecond of tomorrow is refused. Four endpoints are probed with one clock."
