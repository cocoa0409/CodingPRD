          assert:
            - "${n1_i} == 750  # statutory_per_charge: 2026-08-15 to 2026-11-01 is 2 whole months (3 calendar months minus 1 because day 1 < day 15); round_half_up(75000 * 0.005 * 2) == 750"
            - "${n2_i} == 375  # 2026-09-15 to 2026-11-01 is 1 whole month"
            - "${n3_i} == 0  # 2026-10-15 to 2026-11-01 is 0 whole months, so no interest despite the charge being OPEN and past due"
