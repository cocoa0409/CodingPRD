  # ===========================================================================
  - section: state_machines
    instances:

      - name: submit_for_review_moves_listing_draft_to_in_review
        claim_type: valid_transition
        grounds:
          - state_machines.Listing.transitions.DRAFT_to_IN_REVIEW
          - endpoints[POST /rv-marketplace/listings/{listingId}/submit-for-review]
        distinguishing_aspect: >-
          With all three statutory documents VERIFIED and all five inspection
          zones present, submit-for-review moves listing_status DRAFT → IN_REVIEW
          and the same response shows the two recomputed onboarding fields
          (insurance_status VERIFIED, inspection_photo_zone_count 5) and
          version 13 — 1 at create, +8 for the eight document uploads, +3 for
          the three verifications, +1 for this transition.
        test_recipe:
          setup: >-
            Owner and the canonical DRAFT listing with TITLE, REGISTRATION and
            INSURANCE_POLICY uploaded and verified plus all five INSPECTION_PHOTO
            zones uploaded.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
          trigger:
            - *k_submit
          assert:
            - "response 200"
            - "data.listing_status == 'IN_REVIEW'"
            - "data.insurance_status == 'VERIFIED'"
            - "data.inspection_photo_zone_count == 5"
            - "data.version == 13"

      - name: new_booking_starts_in_requested_with_no_settlement_and_no_ledger
        claim_type: initial_state
        grounds:
          - state_machines.Booking.initial_state
          - entities.Booking.fields.trip_status
          - entities.Booking.fields.settlement_status
          - endpoints[GET /rv-marketplace/ledger-entries]
        distinguishing_aspect: >-
          Booking carries TWO independent dimensions and both must sit at their
          declared initial value the moment the row is created — trip_status
          REQUESTED and settlement_status NONE — with hold_amount_cents 0 and
          zero LedgerEntry rows for the booking, proving that quoting is not
          holding and holding is not posting.
        test_recipe:
          setup: "Full canonical marketplace with the listing LISTED, the wallet funded and booking B1 created."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
          trigger:
            - call: "GET /rv-marketplace/ledger-entries"
              payload: { booking_id: "${booking_id}" }
              as: PlatformAdmin
          assert:
            - "response 200"
            - "total_count == 0 and len(data) == 0"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.trip_status == 'REQUESTED'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.settlement_status == 'NONE'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.hold_amount_cents == 0"
            - "GET /rv-marketplace/renters/${renter_id} returns data.wallet_credit_cents == 800000"

      - name: listing_approval_increments_the_owners_listed_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.Listing.transitions.IN_REVIEW_to_LISTED
          - entities.Owner.fields.listed_listing_count
        distinguishing_aspect: >-
          The IN_REVIEW → LISTED transition's side effects reach a DIFFERENT
          entity: Owner.listed_listing_count goes 0 → 1 and Owner.version is
          bumped alongside Listing.version (13 → 14), so approving a listing is
          observable on the owner aggregate and not only on the listing.
        test_recipe:
          setup: "The canonical listing sitting in IN_REVIEW with its owner still at listed_listing_count 0."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
          trigger:
            - *k_list_approve
          assert:
            - "response 200"
            - "data.listing_status == 'LISTED'"
            - "data.version == 14"
            - "GET /rv-marketplace/owners/${owner_id} returns data.listed_listing_count == 1"
            - "GET /rv-marketplace/owners/${owner_id} returns data.version == 2 (1 at create, +1 for this cascade)"

      - name: trip_start_preconditions_fire_in_priority_order_readings_then_photos
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.transitions.CONFIRMED_to_IN_TRIP
          - validations[priority 37]
          - validations[priority 38]
          - errors[ERR_METER_READINGS_INCOMPLETE]
          - errors[ERR_TRIP_PHOTOS_INCOMPLETE]
        distinguishing_aspect: >-
          The CONFIRMED → IN_TRIP transition declares two independent
          preconditions and they are enforced in §1.4 order: with neither
          satisfied the answer is 422 ERR_METER_READINGS_INCOMPLETE (priority
          37), and once the PRE_TRIP reading exists but only three distinct
          PRE_TRIP zones are photographed the answer becomes 422
          ERR_TRIP_PHOTOS_INCOMPLETE (priority 38) — three zones is one short of
          MIN_TRIP_PHOTO_ZONES 4.
        test_recipe:
          setup: >-
            Full canonical marketplace with booking B1 approved and CONFIRMED
            (hold 146063 debited from the 800000 wallet), no meter readings and
            no trip photos yet.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
            - &k_bk_approve
              call: "POST /rv-marketplace/bookings/${booking_id}/approve"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_bk_confirm
              call: "POST /rv-marketplace/bookings/${booking_id}/confirm"
              as: Renter
              as_user_id: "${renter_id}"
          trigger:
            - call: "POST /rv-marketplace/bookings/${booking_id}/start"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
            - &k_read_pre
              call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "PRE_TRIP"
                odometer_miles: 42000
                generator_hours: 120.0
                recorded_at: "2026-08-29T15:00:00Z"
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "EXTERIOR_FRONT", damage_flagged: false, image_ref: "s3://trip/pre-front.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "EXTERIOR_REAR", damage_flagged: false, image_ref: "s3://trip/pre-rear.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "INTERIOR", damage_flagged: false, image_ref: "s3://trip/pre-interior.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /rv-marketplace/bookings/${booking_id}/start"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "trigger step 1 (no readings, no photos): response 422 and data.error_id == 'ERR_METER_READINGS_INCOMPLETE'"
            - "trigger step 6 (PRE_TRIP reading present, only 3 distinct PRE_TRIP zones): response 422 and data.error_id == 'ERR_TRIP_PHOTOS_INCOMPLETE'"
            - "GET /rv-marketplace/bookings/${booking_id} still returns data.trip_status == 'CONFIRMED'"
            - "GET /rv-marketplace/bookings/${booking_id} still returns data.settlement_status == 'HELD' and data.hold_amount_cents == 146063"

      - name: confirm_from_requested_is_an_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.transitions.OWNER_APPROVED_to_CONFIRMED
          - validations[priority 9]
          - errors[ERR_BOOKING_STATE_INVALID]
        distinguishing_aspect: >-
          /confirm declares OWNER_APPROVED as its only from-state, so calling it
          on a REQUESTED booking is 409 ERR_BOOKING_STATE_INVALID and — crucially
          — none of the confirm side effects fire: settlement_status stays NONE,
          hold_amount_cents stays 0 and the renter's wallet is untouched at
          800000.
        test_recipe:
          setup: "Full canonical marketplace with booking B1 still in REQUESTED (never approved)."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
          trigger:
            - call: "POST /rv-marketplace/bookings/${booking_id}/confirm"
              as: Renter
              as_user_id: "${renter_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 409"
            - "data.error_id == 'ERR_BOOKING_STATE_INVALID'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.trip_status == 'REQUESTED' and data.settlement_status == 'NONE'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.hold_amount_cents == 0"
            - "GET /rv-marketplace/renters/${renter_id} returns data.wallet_credit_cents == 800000"

      - name: archived_listing_accepts_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Listing.terminal_states
          - validations[priority 11]
          - errors[ERR_LISTING_STATE_INVALID]
        distinguishing_aspect: >-
          ARCHIVED is the Listing machine's only terminal state: both an
          Owner-driven submit-for-review and a PlatformAdmin-driven decision on
          an ARCHIVED listing return 409 ERR_LISTING_STATE_INVALID, and the
          priority-11 state gate answers BEFORE the priority-28/29 document and
          photo gates that this bare listing would also fail.
        test_recipe:
          setup: >-
            Owner with a second, bare DRAFT listing that carries no documents at
            all, archived straight from DRAFT.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Retired Fifth Wheel"
                vehicle_class: "FIFTH_WHEEL"
                gvwr_lbs: 15000
                length_ft: 34
                base_nightly_rate_cents: 25000
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 70
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 450
                min_renter_age: 25
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_arch_id: "$.data.id" }
            - call: "POST /rv-marketplace/listings/${listing_arch_id}/archive"
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /rv-marketplace/listings/${listing_arch_id}/submit-for-review"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /rv-marketplace/listings/${listing_arch_id}/decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { err2: "$.data.error_id" }
          assert:
            - "trigger step 1: response 409 and data.error_id == 'ERR_LISTING_STATE_INVALID' (not ERR_REQUIRED_DOCUMENT_MISSING)"
            - "trigger step 2: response 409 and data.error_id == 'ERR_LISTING_STATE_INVALID'"
            - "GET /rv-marketplace/listings/${listing_arch_id} returns data.listing_status == 'ARCHIVED'"

      - name: voiding_the_same_assignment_twice_fails_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.DeliveryAssignment.transitions.SCHEDULED_to_VOIDED
          - validations[priority 13]
          - errors[ERR_ASSIGNMENT_STATE_INVALID]
        distinguishing_aspect: >-
          /void is NOT idempotent: the first call moves the assignment SCHEDULED
          → VOIDED, zeroes Booking.delivery_fee_cents (quote back to 146063) and
          decrements Campground.scheduled_assignment_count to 0; the second call
          on the now-VOIDED row returns 409 ERR_ASSIGNMENT_STATE_INVALID and does
          NOT decrement the campground counter a second time.
        test_recipe:
          setup: >-
            Full canonical marketplace, the Cascade Bend campground (capacity 1,
            buffer 30 min), and a CAMPGROUND_DROPOFF booking approved with a
            SCHEDULED assignment (distance 10 miles, fee 12000 + 10*350 = 15500)
            that has already been voided once.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_camp
            - &k_booking_dropoff
              call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "CAMPGROUND_DROPOFF"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_d_id: "$.data.id", booking_d_v: "$.data.version" }
            - &k_bkd_approve
              call: "POST /rv-marketplace/bookings/${booking_d_id}/approve"
              as: Owner
              as_user_id: "${owner_id}"
            - &k_assign1
              call: "POST /rv-marketplace/delivery-assignments"
              payload:
                booking_id: "${booking_d_id}"
                campground_id: "${camp_id}"
                window_start: "2026-08-29T16:00:00Z"
                window_end: "2026-08-29T17:00:00Z"
