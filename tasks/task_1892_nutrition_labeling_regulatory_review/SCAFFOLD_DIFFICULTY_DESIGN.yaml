          assert:
            - "err == ERR_FACILITY_SCHEDULE_OVERLAP (constraint priority 6 beats referential priority 8; the lvB scope mismatch is never reported)"

  # ===================================================================
  # Rule 6 — boundary_precision_check (3 instances, 3 metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_dual_column_at_exact_200pct
        grounds:
          - calculations.serving_size_determination
          - entities.RaccAssignment.fields.label_mode
        distinguishing_aspect: |
          Metric = net_weight/RACC ratio, endpoint = POST /api/products/{id}/racc-assignments:
          ratio exactly 2.0 (110g net / 55g RACC) falls in DUAL_COLUMN (>= 2.0), while
          109.9g (ratio 1.998) is SINGLE_SERVING — exact >= boundary.
        test_recipe:
          setup:
            - "Client with two BAKED_GOOD products: P110 net exactly 110.0g and P109 net 109.9g (RACC 55g)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "BakeCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie 110", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { p110: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie 109", product_category: "BAKED_GOOD", net_weight_g: 109.9, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { p109: $.data.id } }
          trigger:
            - { call: "POST /api/products/${p110}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { m110: $.data.label_mode, s110: $.data.serving_size_g, n110: $.data.servings_per_container } }
            - { call: "POST /api/products/${p109}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { m109: $.data.label_mode, s109: $.data.serving_size_g, n109: $.data.servings_per_container } }
          assert:
            - "m110 == DUAL_COLUMN (ratio exactly 2.0 satisfies 2.0 <= r <= 3.0)"
            - "s110 == 55.0 and n110 == 2.0"
            - "m109 == SINGLE_SERVING (ratio 1.998 < 2.0) and s109 == 109.9 and n109 == 1"

      - name: boundary_low_fat_threshold_exact
        grounds:
          - calculations.claim_eligibility_evaluation
          - entities.ClaimAssessment.fields.evaluated_value_per_racc
        distinguishing_aspect: |
          Metric = fat grams per RACC, endpoint = POST /api/label-versions/{id}/claims
          (distinct metric and endpoint from the ratio boundary above): fat per RACC exactly
          3.0g satisfies LOW_FAT (<= 3.0, ELIGIBLE) while 3.02g fails — exact <= boundary.
        test_recipe:
          setup:
            - "Client with two SNACK products (net 30g, RACC 30g): PA recipe fat 10.0 g/100g; PB recipe fat 10.05 g/100g; both LOCKED with DATABASE panels, US_FDA RACC, draft labels"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "SnackCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Crackers A", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pidA: $.data.id, pverA: $.data.version } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Crackers B", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 20.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pidB: $.data.id, pverB: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Cracker Mix A", allergen_tags: [], kcal_per_100g: 400, fat_g_per_100g: 10.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 100, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 2.0, protein_g_per_100g: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { iA: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Cracker Mix B", allergen_tags: [], kcal_per_100g: 400, fat_g_per_100g: 10.05, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 100, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 2.0, protein_g_per_100g: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { iB: $.data.id } }
            - { call: "POST /api/products/${pidA}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${iA}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { ridA: $.data.id } }
            - { call: "POST /api/products/${pidB}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${iB}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { ridB: $.data.id } }
            - { call: "POST /api/recipes/${ridA}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${ridB}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${ridA}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/recipes/${ridB}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pidA}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { raA: $.data.id } }
            - { call: "POST /api/products/${pidB}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { raB: $.data.id } }
            - { call: "POST /api/products/${pidA}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${raA}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Cracker Mix A", contains_text: "Contains: None.", expected_product_version: "${pverA}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lvA: $.data.id } }
            - { call: "POST /api/products/${pidB}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${raB}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Cracker Mix B", contains_text: "Contains: None.", expected_product_version: "${pverB}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lvB: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lvA}/claims", payload: { claim_type: "LOW_FAT" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { clA_status: $.data.status, clA_value: $.data.evaluated_value_per_racc } }
            - { call: "POST /api/label-versions/${lvB}/claims", payload: { claim_type: "LOW_FAT" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { clB_status: $.data.status, clB_value: $.data.evaluated_value_per_racc } }
          assert:
            - "clA_value == 3.0 and clA_status == ELIGIBLE (3.0 <= 3.0: boundary inclusive)"
            - "clB_value == 3.02 and clB_status == INELIGIBLE (10.05 x 0.30 = 3.015 -> 3.02 > 3.0)"

      - name: boundary_small_package_format_at_exact_12sqin
        grounds:
          - calculations.format_compliance_evaluation
          - entities.FormatCheck.fields.result
        distinguishing_aspect: |
          Metric = total package surface area in square inches, endpoint =
          POST /api/label-versions/{id}/submit-review (auto-created FormatCheck) — distinct
          metric and endpoint from both ratio and nutrient boundaries: area exactly 12.0
          admits LINEAR (<= 12.0) while 12.5 rejects it.
        test_recipe:
          setup:
            - "Client with two SNACK products: PA total_surface_area_sq_in exactly 12.0, PB 12.5; both with LOCKED single-ingredient recipes, DATABASE panels, US_FDA RACC, labels declaring LINEAR format, type size 0.03125 (pdp 4.0 -> min 0.03125)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "MiniCo", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Mini A", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 12.0, pdp_area_sq_in: 4.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pidA: $.data.id, pverA: $.data.version } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Mini B", product_category: "SNACK", net_weight_g: 30, total_surface_area_sq_in: 12.5, pdp_area_sq_in: 4.0, household_unit_name: "piece", household_unit_weight_g: 1 }, as: ClientRep, as_user_id: "${cid}", captures: { pidB: $.data.id, pverB: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", allergen_tags: [], kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pidA}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { ridA: $.data.id } }
            - { call: "POST /api/products/${pidB}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { ridB: $.data.id } }
            - { call: "POST /api/recipes/${ridA}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${ridB}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${ridA}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/recipes/${ridB}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pidA}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { raA: $.data.id } }
            - { call: "POST /api/products/${pidB}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { raB: $.data.id } }
            - { call: "POST /api/products/${pidA}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${raA}", declared_format: "LINEAR", declared_type_size_in: 0.03125, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pverA}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lvA: $.data.id } }
            - { call: "POST /api/products/${pidB}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${raB}", declared_format: "LINEAR", declared_type_size_in: 0.03125, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pverB}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lvB: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lvA}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lvB}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /api/label-versions/${lvA}/format-checks", as: PlatformAdmin, captures: { fcA_result: "$.data[0].result", fcA_allowed: "$.data[0].allowed_formats" } }
            - { call: "GET /api/label-versions/${lvB}/format-checks", as: PlatformAdmin, captures: { fcB_result: "$.data[0].result", fcB_viol: "$.data[0].violations" } }
          assert:
            - "fcA_result == PASS (area 12.0 <= 12.0 admits LINEAR; type 0.03125 >= min 0.03125 for pdp 4.0)"
            - "fcA_allowed == [LINEAR]"
            - "fcB_result == FAIL and fcB_violations contain FORMAT_NOT_ALLOWED_FOR_PACKAGE (12.5 > 12.0 -> LINEAR not allowed)"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, 3 entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_blocked_by_ineligible_claim
        grounds:
          - state_machines.LabelVersion.release_status=NOT_RELEASED (with review_status=APPROVED)_to_release_status=RELEASED
          - entities.ClaimAssessment.fields.status
          - errors[ERR_CLAIMS_NOT_RESOLVED]
        distinguishing_aspect: |
          Pair LabelVersion x ClaimAssessment: a label that is APPROVED, content READY and
          format-PASS still cannot release while one of its ClaimAssessments is INELIGIBLE —
          the valid transition set of LabelVersion depends on child claim states.
        test_recipe:
          setup:
            - "Client, product Cookie, LOCKED recipe, DATABASE panel, US_FDA RACC, label APPROVED, FormatCheck PASS, HIGH_FIBER claim INELIGIBLE (fiber per RACC 1.24 < 5.0)"
          setup_api_calls:
