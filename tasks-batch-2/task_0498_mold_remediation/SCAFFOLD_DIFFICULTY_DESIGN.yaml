            - "Assessment.${asid}.finding_level == CLEAN"
            - "Project.${pid}.open_finding_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Instance 1: state (OCC stale, priority 9) vs business_safety (signoff not independent, priority 15)
      - name: occ_stale_outranks_signoff_independence
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - concurrency_rules[clearance-signoff-stale-project]
        distinguishing_aspect: |
          A signoff request both carries a stale expected_project_version AND names a
          non-independent signer (the sampler). Priority 9 (category state, OCC) outranks
          priority 15 (category business_safety, independence) -> ERR_STALE_VERSION wins.
          Error-category pair state vs business_safety, different from instance 2's pair.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; PASSED ClearanceTest whose sampler is a HYGIENIST worker we will (wrongly) also name as the signer (violates independence)."
            - "The sign-off is sent with a deliberately stale expected_project_version (one below the live Project.version captured via GET), so both the OCC check (priority 9) and the independence check (priority 15) would fail; OCC must win."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
