scaffold_corner_design:
  - section: entities
    instances:
      - name: site_create_success_and_defaults
        claim_type: creation_with_defaults
        grounds:
          - entities.Site
          - endpoints["POST /kitchen/sites"]
        distinguishing_aspect: "POST /kitchen/sites with required fields returns 201; status defaults to OPEN; equipment_posture computes to OPERATIONAL with zero assets."
        test_recipe:
          setup: ["Nothing (default clock 2026-08-01T00:00:00Z)."]
          setup_api_calls: []
          trigger:
            - call: "POST /kitchen/sites"
              payload: { name: "Default Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id, st: $.data.status, posture: $.data.equipment_posture }
          assert:
            - "Site.${site_id}.status == OPEN (default applied)"
            - "Site.${site_id}.equipment_posture == OPERATIONAL (no CRITICAL assets down)"
      - name: site_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Site
          - endpoints["GET /kitchen/sites/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /kitchen/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_NOT_FOUND"
      - name: menu_day_duplicate_site_date_rejected
        claim_type: type_constraint
        grounds:
          - entities.MenuDay
          - validations[priority=7]
          - errors[ERR_CONSTRAINT_VIOLATION]
        distinguishing_aspect: "Second MenuDay for the same (site_id, service_date) violates the uniqueness constraint; a different service_date succeeds."
        test_recipe:
          setup: ["Site S; one MenuDay for (S, 2026-08-11) already created."]
          setup_api_calls:
            - call: "POST /kitchen/sites"
              payload: { name: "Dup Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { err: $.data.error_id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-12" }
              as: KitchenManager
              captures: { ok_id: $.data.id }
          assert:
            - "duplicate (site,date) rejected: $.data.error_id == ERR_CONSTRAINT_VIOLATION"
            - "different service_date accepted (MenuDay id present)"
      - name: volunteer_duplicate_email_rejected
        claim_type: type_constraint
        grounds:
          - entities.Volunteer
          - validations[priority=7]
          - errors[ERR_CONSTRAINT_VIOLATION]
        distinguishing_aspect: "Volunteer email uniqueness is enforced across the program."
        test_recipe:
          setup: ["Volunteer with email dup@x.org exists."]
          setup_api_calls:
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "First", email: "dup@x.org" }
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Second", email: "dup@x.org" }
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_CONSTRAINT_VIOLATION"
      - name: meal_order_quantity_capped_by_household
        claim_type: type_constraint
        grounds:
          - entities.MealOrder.fields.quantity
          - errors[ERR_CONSTRAINT_VIOLATION]
        distinguishing_aspect: "quantity > GuestProfile.household_size is rejected (shape constraint, priority 7)."
        test_recipe:
          setup:
            - "Full serving chain: site, batch ACCEPTED, item CONFIRMED planned 10, menu day SERVING, DINE_IN service OPEN capacity 10; guest G household_size 1."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Cap Site", dine_in_capacity: 50, togo_capacity_per_window: 20, delivery_radius_km: 8 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "grain", quantity_servings: 10, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 50 }
              as: KitchenManager
              captures: { b: $.data.id }
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-10" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Grain Bowl", planned_servings: 10 }
              as: KitchenManager
              captures: { item: $.data.id }
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${b}", servings: 10 }
              as: KitchenManager
            - call: "POST /kitchen/menu-items/${item}/confirm"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/guests"
              payload: { full_name: "Solo", household_size: 1 }
              as: KitchenManager
              captures: { g: $.data.id }
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
              as: KitchenManager
              captures: { mdv: $.data.version }
            - call: "POST /kitchen/menu-days/${md}/lock-forecast"
              payload: { expected_menu_day_version: "${mdv}" }
              as: KitchenManager
            - call: "POST /kitchen/menu-days/${md}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/meal-services"
              payload: { menu_day_id: "${md}", service_model: "DINE_IN", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T13:00:00Z", capacity: 10 }
              as: KitchenManager
              captures: { svc: $.data.id }
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:30:00Z" }
              as: ProgramAdmin
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
              as: KitchenManager
              captures: { mdv2: $.data.version }
            - call: "POST /kitchen/meal-services/${svc}/open"
              payload: { expected_menu_day_version: "${mdv2}" }
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/meal-orders"
              payload: { meal_service_id: "${svc}", guest_id: "${g}", menu_item_id: "${item}", quantity: 2, substitution_allowed: false }
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_CONSTRAINT_VIOLATION (quantity 2 > household_size 1)"
      - name: waste_log_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.WasteLog
        distinguishing_aspect: "WasteLog has common_fields: false (append-only event): readable via GET, carries logged_at, and has no version field."
        test_recipe:
          setup: ["Site S; menu day D; batch B ACCEPTED; one waste log W created."]
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Imm Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "DONATION", item_description: "cans", quantity_servings: 10, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-30T00:00:00Z" }
              as: KitchenManager
              captures: { b: $.data.id }
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
          trigger:
            - call: "POST /kitchen/waste-logs"
              payload: { menu_day_id: "${md}", food_batch_id: "${b}", servings_wasted: 2, reason: "SPOILAGE", disposition: "COMPOST" }
              as: KitchenManager
              captures: { w: $.data.id }
            - call: "GET /kitchen/waste-logs/${w}"
              payload: {}
              as: KitchenManager
          assert:
            - "WasteLog.${w} readable via GET with server-stamped logged_at"
            - "response carries no version field (common_fields: false)"
      - name: fk_reverse_reachability_menu_items
        claim_type: parent_relationship
        grounds:
          - entities.MenuItem.fields.menu_day_id
          - endpoints["GET /kitchen/menu-days/{id}/menu-items"]
        distinguishing_aspect: "Children of a MenuDay are discoverable via the sub-resource GET; returns array of the day's items."
        test_recipe:
          setup: ["Site S; menu day D with two items."]
          setup_api_calls:
            - call: "POST /kitchen/sites"
              payload: { name: "FK Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "A", planned_servings: 5 }
              as: KitchenManager
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "B", planned_servings: 5 }
              as: KitchenManager
          trigger:
            - call: "GET /kitchen/menu-days/${md}/menu-items"
              payload: {}
              as: KitchenManager
          assert:
            - "GET /kitchen/menu-days/${md}/menu-items returns an array of length 2"

  - section: state_machines
    instances:
      - name: menu_day_invalid_transition_skip_forecast
        claim_type: invalid_transition
        grounds:
          - state_machines.MenuDay
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "start-production from DRAFT (skipping FORECAST_LOCKED) is an undefined transition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site S; menu day D in DRAFT."]
          setup_api_calls:
            - call: "POST /kitchen/sites"
              payload: { name: "SM Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
          trigger:
            - call: "POST /kitchen/menu-days/${md}/start-production"
              payload: {}
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
      - name: menu_day_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MenuDay
        distinguishing_aspect: "From CANCELLED (terminal) no further transitions are possible: a second cancel fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site S; menu day D cancelled from DRAFT."]
          setup_api_calls:
            - call: "POST /kitchen/sites"
              payload: { name: "Term Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/cancel"
              payload: {}
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/menu-days/${md}/cancel"
              payload: {}
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "second cancel from CANCELLED: $.data.error_id == ERR_INVALID_STATE (terminal lockdown)"
      - name: menu_item_confirm_without_coverage_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MenuItem.PLANNED_to_CONFIRMED
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: "Confirm requires allocations >= planned_servings; partial coverage (5 of 10) rejects confirm with ERR_CAPACITY_FULL."
        test_recipe:
          setup: ["Site S; batch ACCEPTED 20; menu day D DRAFT; item planned 10 with only 5 allocated."]
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Cov Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "oil", quantity_servings: 20, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 50 }
              as: KitchenManager
              captures: { b: $.data.id }
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Fry", planned_servings: 10 }
              as: KitchenManager
              captures: { item: $.data.id }
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${b}", servings: 5 }
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/menu-items/${item}/confirm"
              payload: {}
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_CAPACITY_FULL (coverage 5 < planned 10)"
      - name: batch_reject_releases_allocations
        claim_type: side_effect_execution
        grounds:
          - state_machines.FoodBatch.QUARANTINED_to_REJECTED
        distinguishing_aspect: "Rejecting a QUARANTINED batch forces remaining_servings to 0 and releases outstanding allocations (made while ACCEPTED, batch re-inspected to QUARANTINED, then rejected)."
        test_recipe:
          setup: ["Site S; batch B ACCEPTED 20; 10 allocated to item I (PLANNED) on menu day D; B re-inspected to QUARANTINED via begin-inspection + record FAILED."]
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Rej Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "fish", quantity_servings: 20, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 90 }
              as: KitchenManager
              captures: { b: $.data.id }
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Fish Cake", planned_servings: 10 }
              as: KitchenManager
              captures: { item: $.data.id }
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${b}", servings: 10 }
              as: KitchenManager
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "FAILED" }
              as: FoodSafetyOfficer
          trigger:
            - call: "POST /kitchen/food-batches/${b}/reject"
              payload: {}
              as: FoodSafetyOfficer
            - call: "GET /kitchen/food-batches/${b}"
              payload: {}
              as: KitchenManager
              captures: { b_rem: $.data.remaining_servings, b_status: $.data.status }
            - call: "GET /kitchen/menu-items/${item}/batch-allocations"
              payload: {}
              as: KitchenManager
          assert:
            - "FoodBatch.${b}.status == REJECTED and remaining_servings == 0"
            - "GET /kitchen/menu-items/${item}/batch-allocations returns empty array (allocations released)"
      - name: shift_cancel_lockout_for_volunteer
        claim_type: precondition_enforcement
        grounds:
          - state_machines.VolunteerShift.SCHEDULED_to_CANCELLED
          - errors[ERR_CANCEL_IN_LOCKOUT]
        distinguishing_aspect: "Volunteer self-cancel inside CANCEL_LOCKOUT_HOURS (24h) before starts_at is rejected; KitchenManager cancel at the same instant succeeds."
        test_recipe:
          setup: ["Site S; menu day D 2026-08-12; volunteer V shift 2026-08-12T10:00-14:00 SCHEDULED; clock 2026-08-11T12:00:00Z (22h before start, inside 24h lockout)."]
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Lock Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-12" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Vol L", email: "vl@x.org", certification_level: "BASIC", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: KitchenManager
              captures: { vol: $.data.id }
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${site_id}", volunteer_id: "${vol}", menu_day_id: "${md}", role_on_shift: "SERVER", starts_at: "2026-08-12T10:00:00Z", ends_at: "2026-08-12T14:00:00Z" }
              as: KitchenManager
              captures: { sh: $.data.id }
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /kitchen/volunteer-shifts/${sh}/cancel"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { err: $.data.error_id }
            - call: "POST /kitchen/volunteer-shifts/${sh}/cancel"
              payload: { apply_penalty: false }
              as: KitchenManager
              captures: { sh_status: $.data.status }
          assert:
            - "volunteer self-cancel rejected: $.data.error_id == ERR_CANCEL_IN_LOCKOUT"
            - "manager cancel succeeds: VolunteerShift.${sh}.status == CANCELLED"
      - name: service_close_auto_expires_reserved_orders
        claim_type: side_effect_execution
        grounds:
          - state_machines.MealService.OPEN_to_CLOSED
          - state_machines.MealOrder
        distinguishing_aspect: "Closing a service auto-EXPIREs still-RESERVED orders and decrements reserved_count to 0."
        test_recipe:
          setup: ["Full serving chain; one order O RESERVED (never prepped); service OPEN capacity 5."]
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Expire Site", dine_in_capacity: 50, togo_capacity_per_window: 20, delivery_radius_km: 8 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "beans", quantity_servings: 10, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 50 }
              as: KitchenManager
              captures: { b: $.data.id }
            - call: "POST /kitchen/food-batches/${b}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-10" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Beans", planned_servings: 10 }
              as: KitchenManager
              captures: { item: $.data.id }
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${b}", servings: 10 }
              as: KitchenManager
            - call: "POST /kitchen/menu-items/${item}/confirm"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/guests"
              payload: { full_name: "GE", household_size: 2 }
              as: KitchenManager
              captures: { g: $.data.id }
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
              as: KitchenManager
              captures: { mdv: $.data.version }
            - call: "POST /kitchen/menu-days/${md}/lock-forecast"
              payload: { expected_menu_day_version: "${mdv}" }
              as: KitchenManager
            - call: "POST /kitchen/menu-days/${md}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/meal-services"
              payload: { menu_day_id: "${md}", service_model: "DINE_IN", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T13:00:00Z", capacity: 5 }
              as: KitchenManager
              captures: { svc: $.data.id }
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:30:00Z" }
              as: ProgramAdmin
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
