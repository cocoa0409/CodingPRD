  - section: consistency_model
    instances:

      - name: approval_visibility_is_immediate_in_same_request_chain
        claim_type: Immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ListingApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Immediate consistency: the very next GET after approve shows Issuer LISTED, one ACTIVE Listing, and one INVOICED ENTRY fee — no reconciliation lag anywhere in the approval chain."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer with a SUBMITTED CAPITAL application."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
          trigger:
            - *c_approve
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
            - *c_listings
            - *c_entry_fee
          assert:
            - "the approve response itself carries status APPROVED"
            - "the immediate GET /issuers/${issuer_id} shows status LISTED and version incremented by exactly 1 from the pre-approve read"
            - "GET /issuers/${issuer_id}/listings returns exactly 1 ACTIVE CAPITAL row"
            - "GET /issuers/${issuer_id}/fee-assessments with fee_kind ENTRY returns exactly 1 INVOICED row — every cascade is visible in the same request chain"
