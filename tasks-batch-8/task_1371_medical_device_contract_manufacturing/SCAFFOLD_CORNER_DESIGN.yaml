        test_recipe:
          setup: ["DMR DEV-SM APPROVED"]
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-SM", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
