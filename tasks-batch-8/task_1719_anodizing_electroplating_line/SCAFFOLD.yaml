scenario: |
  Anodizing & Electroplating Line (metal finishing job shop): rack/barrel routing & thickness spec, bath chemistry titration & bath-life dosing, waste-treatment discharge limit & sampling, rejection (burn/stain) & strip-and-replate, hazardous rinse & sludge manifest, part masking & fixture cost, salt-spray test lot, alloy compatibility rejection

domain_name: anodizing-electroplating-line
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit        # discharge limits, manifests, segregation of duties
  secondary_archetype: quota_allocation      # bath-life amp-hour capacity reserved/committed/released
  complexity_layers:
    - optimistic_concurrency                 # OCC on PlatingBath / WorkOrder / WasteManifest version
    - cascading_side_effects                 # exceedance -> permit -> baths -> work orders
    - dual_variant_calculation               # provisional vs final invoice; nameplate vs effective bath-life
    - rate_threshold_triggers                # exhaustion, exceedance, pricing tiers
  entity_topology: flat                      # all resources top-level, linked by FK references
  state_machine_shape: cyclic                # rework loop, quarantine cycle, renew cycle
  relationship_patterns:
    - one_to_many                            # Bath -> Titrations/Doses/LoadRuns; WO -> LoadRuns/Inspections/Lots
    - cross_aggregate                        # WorkOrder references Customer, PlatingBath, Fixture
  role_model: segregation_of_duties          # manifest creator cannot finalize; ShopManager override bounded
  consistency_model: immediate               # all side effects atomic in request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Customer company name" }
      - { name: priority_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREFERRED", constraints: "enum {STANDARD, PREFERRED}" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, routing new work and shipping are blocked" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: Fixture
    parent: null
    common_fields: true
    fields:
      - { name: fixture_code, type: string, source: input, description: "Unique fixture/rack code", constraints: "unique across all fixtures" }
      - { name: routing_mode, type: enum, source: input, description: "RACK | BARREL", constraints: "enum {RACK, BARREL}" }
      - { name: capacity_dm2, type: number, source: input, description: "Max total part surface area (dm^2) the fixture holds per load", constraints: "> 0" }
      - { name: purchase_cost_cents, type: integer, source: input, description: "Acquisition cost in cents", constraints: ">= 0" }
      - { name: rated_uses, type: integer, source: input, description: "Rated load cycles before retirement; drives amortization", constraints: ">= 1" }
      - { name: amortization_cents_per_use, type: integer, source: computed, description: "= ceil(purchase_cost_cents / rated_uses), computed at creation, immutable" }

  - name: AlloyCompatibilityRule
    parent: null
    common_fields: true
    fields:
      - { name: alloy_code, type: string, source: input, description: "Alloy designator, e.g. AL6061, AL2024, CRS1018, C360" }
      - { name: process_type, type: enum, source: input, description: "ANODIZE | PLATE", constraints: "enum {ANODIZE, PLATE}" }
      - { name: chemistry_family, type: enum, source: input, description: "SULFURIC | CHROMIC | NICKEL | ZINC | COPPER | CYANIDE", constraints: "enum {SULFURIC, CHROMIC, NICKEL, ZINC, COPPER, CYANIDE}" }
      - { name: compatibility, type: enum, source: input, description: "COMPATIBLE | CONDITIONAL | INCOMPATIBLE", constraints: "enum {COMPATIBLE, CONDITIONAL, INCOMPATIBLE}" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text rationale" }
      - { name: uniqueness, type: string, source: system, description: "Unique constraint on (alloy_code, process_type, chemistry_family); duplicates rejected with ERR_DUPLICATE_COMPATIBILITY_RULE" }

  - name: PlatingBath
    parent: null
    common_fields: true
    fields:
      - { name: bath_code, type: string, source: input, description: "Unique bath code", constraints: "unique across all baths" }
      - { name: process_type, type: enum, source: input, description: "ANODIZE | PLATE", constraints: "enum {ANODIZE, PLATE}" }
      - { name: chemistry_family, type: enum, source: input, description: "SULFURIC | CHROMIC | NICKEL | ZINC | COPPER | CYANIDE", constraints: "enum {SULFURIC, CHROMIC, NICKEL, ZINC, COPPER, CYANIDE}" }
      - { name: routing_modes_supported, type: array, source: input, description: "Non-empty subset of [RACK, BARREL]" }
      - { name: volume_liters, type: number, source: input, description: "Bath working volume in liters", constraints: "> 0" }
      - { name: target_concentration_g_l, type: number, source: input, description: "Target chemistry concentration g/L", constraints: "> 0" }
      - { name: low_concentration_g_l, type: number, source: input, description: "Inclusive lower control limit; load start requires current >= low", constraints: "> 0 and < target" }
      - { name: high_concentration_g_l, type: number, source: input, description: "Inclusive upper control limit; load start requires current <= high", constraints: "> target" }
      - { name: amp_hour_capacity, type: number, source: input, description: "Total bath-life capacity in amp-hours", constraints: "> 0" }
      - { name: current_concentration_g_l, type: number, source: computed, description: "Most recently recorded titration result, adjusted by dose math and dragout; null until first titration" }
      - { name: amp_hour_used, type: number, source: computed, default: 0, description: "= sum of amp_hours_consumed over COMPLETED LoadRuns of this bath; invariant under abort" }
      - { name: amp_hour_reserved, type: number, source: computed, default: 0, description: "= sum of estimated_amp_hours over RUNNING LoadRuns of this bath" }
      - { name: active_load_run_id, type: string, source: system, description: "ID of the RUNNING LoadRun on this bath, null when idle (max one)" }
      - { name: dose_verification_pending, type: boolean, source: system, default: false, description: "Set true by every DoseEvent; cleared by the next BathTitration; blocks load start" }
      - { name: quarantine_cause, type: enum, source: system, description: "MANUAL | DISCHARGE_EXCEEDANCE; null when not quarantined", constraints: "enum {MANUAL, DISCHARGE_EXCEEDANCE} or null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | QUARANTINED | EXHAUSTED | DUMPED | DECOMMISSIONED", constraints: "enum {ACTIVE, QUARANTINED, EXHAUSTED, DUMPED, DECOMMISSIONED}" }
      - { name: nameplate_remaining_ah, type: number, source: computed, description: "= amp_hour_capacity - amp_hour_used (optimistic variant)" }
      - { name: effective_remaining_ah, type: number, source: computed, description: "= floor((amp_hour_capacity - amp_hour_used) x efficiency); efficiency = 1.0 if current >= target else max(0.5, current/target); pessimistic variant used by routing" }

  - name: BathTitration
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: bath_id, type: string, source: input, description: "FK -> PlatingBath.id; bath being measured" }
      - { name: titrant_volume_ml, type: number, source: input, description: "Burette reading of titrant consumed", constraints: "> 0" }
      - { name: titrant_normality, type: number, source: input, description: "Normality of titrant (eq/L)", constraints: "> 0" }
      - { name: sample_volume_ml, type: number, source: input, description: "Bath sample volume titrated", constraints: "> 0" }
      - { name: measured_concentration_g_l, type: number, source: computed, description: "= round_half_up(titrant_volume_ml x titrant_normality x EQ_WEIGHT / sample_volume_ml, 3); EQ_WEIGHT by chemistry_family" }

  - name: DoseEvent
    parent: null
    common_fields: false   # append-only event
    fields:
      - { name: bath_id, type: string, source: input, description: "FK -> PlatingBath.id; bath being dosed" }
      - { name: chemical_code, type: string, source: input, description: "Chemical added, e.g. NISO4, H2SO4" }
      - { name: quantity_g, type: number, source: input, description: "Grams added", constraints: "> 0" }
      - { name: resulting_concentration_g_l, type: number, source: computed, description: "= round_half_up(current + quantity_g / volume_liters, 3) at dose time" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: part_number, type: string, source: input, description: "Customer part number" }
      - { name: alloy_code, type: string, source: input, description: "Alloy designator of parts" }
      - { name: process_type, type: enum, source: input, description: "ANODIZE | PLATE", constraints: "enum {ANODIZE, PLATE}" }
      - { name: routing_mode, type: enum, source: input, description: "RACK | BARREL", constraints: "enum {RACK, BARREL}" }
      - { name: part_count, type: integer, source: input, description: "Parts in the job", constraints: ">= 1" }
      - { name: surface_area_dm2_per_part, type: number, source: input, description: "Surface area per part in dm^2", constraints: "> 0" }
      - { name: surface_area_total_dm2, type: number, source: computed, description: "= part_count x surface_area_dm2_per_part" }
      - { name: thickness_spec_min_um, type: number, source: input, description: "Inclusive minimum deposited thickness, micrometers", constraints: "> 0 and <= thickness_spec_max_um" }
      - { name: thickness_spec_max_um, type: number, source: input, description: "Inclusive maximum deposited thickness", constraints: ">= thickness_spec_min_um" }
      - { name: requires_masking, type: boolean, source: input, default: false, description: "Whether parts need masking before routing" }
      - { name: masking_minutes_actual, type: integer, source: system, description: "Recorded at prepare; null until prepared" }
      - { name: requires_salt_spray, type: boolean, source: input, default: false, description: "Whether a salt-spray lot gates completion" }
      - { name: predip_completed, type: boolean, source: system, default: false, description: "Set by complete-predip; required before load start when compatibility is CONDITIONAL" }
      - { name: bath_id, type: string, source: system, description: "FK -> PlatingBath.id; bath assigned at route; null when unrouted" }
      - { name: fixture_id, type: string, source: system, description: "FK -> Fixture.id; assigned at route; required iff routing_mode = RACK; null when unrouted" }
      - { name: routed_chemistry_family, type: string, source: system, description: "Snapshot of bath chemistry_family at route time; drives hazmat fee" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Completed strip-and-replate cycles; incremented by complete-strip; max 2 (MAX_REWORKS)" }
      - { name: pending_strip, type: boolean, source: system, default: false, description: "True between a reworkable rejection and its complete-strip" }
      - { name: last_defect_type, type: string, source: system, description: "Defect of the most recent rejection: BURN | STAIN | PITTING | ADHESION | UNDERTHICKNESS | LOT_CORROSION" }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "Quote at creation/amendment: 1 planned run, 0 reworks (provisional variant of pricing)" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Invoice computed at ship (final variant); null until SHIPPED" }
      - { name: completed_load_count, type: integer, source: system, default: 0, description: "Number of COMPLETED LoadRuns; drives fixture fee at invoice" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Set at cancel: 0 for early-state cancel; round_half_up(processing_component x 0.5) for manager late cancel" }
      - { name: status, type: enum, source: system, description: "RECEIVED | READY_FOR_ROUTING | ROUTED | ROUTE_HELD | IN_PROCESS | AWAITING_INSPECTION | AWAITING_LOT_TEST | REJECTED | STRIPPING | COMPLETE | SHIPPED | SCRAPPED | CANCELLED", constraints: "13-state enum, see state machine" }

  - name: LoadRun
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the job being processed" }
      - { name: bath_id, type: string, source: system, description: "FK -> PlatingBath.id; copied from work order routing at load start" }
      - { name: fixture_id, type: string, source: system, description: "Snapshot of work order fixture at load start; null for BARREL" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned/process time in minutes", constraints: ">= 1" }
      - { name: current_density_a_dm2, type: number, source: input, description: "Applied current density A/dm^2", constraints: "> 0" }
      - { name: surface_area_dm2, type: number, source: system, description: "Snapshot of work order surface_area_total_dm2 at start" }
      - { name: estimated_amp_hours, type: number, source: computed, description: "= round_half_up(surface_area_dm2 x current_density_a_dm2 x duration_minutes / 60, 2); reserved at start" }
      - { name: amp_hours_consumed, type: number, source: computed, description: "= estimated_amp_hours, debited to bath only on COMPLETED; null while RUNNING/ABORTED" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock at start" }
      - { name: ended_at, type: datetime, source: system, description: "Logical clock at complete/abort; null while RUNNING" }
      - { name: status, type: enum, source: system, description: "RUNNING | COMPLETED | ABORTED", constraints: "enum {RUNNING, COMPLETED, ABORTED}" }

  - name: InspectionReport
    parent: null
    common_fields: false   # append-only record
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; inspected job" }
      - { name: load_run_id, type: string, source: system, description: "ID of the inspected LoadRun; system-set to the work order's latest COMPLETED load run (unique because AWAITING_INSPECTION admits exactly one uninspected completed load)" }
      - { name: thickness_readings_um, type: array, source: input, description: "At least 3 numeric thickness readings (micrometers)", constraints: "array length >= 3, each > 0" }
      - { name: defect_type, type: enum, source: input, description: "NONE | BURN | STAIN | PITTING | ADHESION | UNDERTHICKNESS", constraints: "enum {NONE, BURN, STAIN, PITTING, ADHESION, UNDERTHICKNESS}" }
      - { name: thickness_min_um, type: number, source: computed, description: "= min(thickness_readings_um)" }
      - { name: thickness_max_um, type: number, source: computed, description: "= max(thickness_readings_um)" }
      - { name: thickness_ok, type: boolean, source: computed, description: "= (min >= spec_min) AND (max <= spec_max); both bounds inclusive" }
      - { name: disposition, type: enum, source: computed, description: "PASS | REWORKABLE_REJECT | SCRAP_REJECT per disposition rule", constraints: "enum {PASS, REWORKABLE_REJECT, SCRAP_REJECT}" }

  - name: SaltSprayLot
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; job under corrosion test" }
      - { name: sample_count, type: integer, source: input, description: "Panels in the test lot", constraints: ">= 1" }
      - { name: hours_required, type: integer, source: input, description: "Specified exposure hours (e.g. 96, 336, 500)", constraints: ">= 1" }
      - { name: allowed_failures, type: integer, source: computed, description: "= 2 if sample_count >= 10; 1 if >= 5; else 0" }
      - { name: panels_failed, type: integer, source: system, description: "Set at evaluate" }
      - { name: hours_run, type: integer, source: computed, description: "= floor((current_utc - created_at) in whole hours) at read time" }
      - { name: result, type: enum, source: system, description: "PENDING | PASSED | FAILED", constraints: "enum {PENDING, PASSED, FAILED}" }

  - name: DischargePermit
    parent: null
    common_fields: true
    fields:
      - { name: outfall_code, type: string, source: input, description: "Outfall identifier, e.g. OUTFALL-001" }
      - { name: effective_from, type: string, source: input, description: "Inclusive window start date YYYY-MM-DD (closed interval)" }
      - { name: effective_to, type: string, source: input, description: "Inclusive window end date YYYY-MM-DD (closed interval)", constraints: ">= effective_from" }
      - { name: limits, type: array, source: input, description: "Non-empty array of {analyte_code, max_concentration_mg_l, monthly_mass_cap_g}; analyte_code in {NICKEL, ZINC, COPPER, CHROME, CYANIDE}; unique per analyte within the permit" }
      - { name: current_month, type: string, source: system, description: "YYYY-MM of the most recently accepted sample; null before first sample" }
      - { name: cumulative_mass_g, type: object, source: computed, description: "Map analyte_code -> sum of per-sample rounded mass_g for current_month; resets when a sample from a later month arrives" }
      - { name: last_sampled_at, type: string, source: system, description: "sampled_at of the most recently accepted sample; regression guard" }
      - { name: exceedance_active, type: boolean, source: system, default: false, description: "Set by any exceedance sample; cleared by clear-exceedance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXCEEDED", constraints: "enum {ACTIVE, EXCEEDED}" }

  - name: WasteSample
    parent: null
    common_fields: false   # append-only event
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> DischargePermit.id; permit the discharge is reported under" }
      - { name: sampled_at, type: string, source: input, required: false, description: "ISO8601 timestamp of sample; defaults to current logical clock when omitted" }
      - { name: flow_liters, type: number, source: input, description: "Discharge volume since previous sample", constraints: "> 0" }
      - { name: readings, type: array, source: input, description: "Non-empty array of {analyte_code, concentration_mg_l}; analyte must exist in permit limits; at most one reading per analyte per sample" }
      - { name: masses_g, type: object, source: computed, description: "Map analyte_code -> round_half_up(concentration_mg_l x flow_liters / 1000, 3); per-analyte rounding BEFORE summing (pinned order)" }
      - { name: is_exceedance, type: boolean, source: computed, description: "True if any concentration > max_concentration_mg_l (strict) or any cumulative mass after add > monthly_mass_cap_g (strict); equality is compliant" }

  - name: WasteManifest
    parent: null
    common_fields: true
    fields:
      - { name: generator_epa_id, type: string, source: input, description: "Generator EPA identification number" }
      - { name: transporter_name, type: string, source: input, required: false, description: "Required at ship; null until shipped" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties anchor for finalize" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of finalizer; must differ from created_by_user_id" }
      - { name: total_mass_kg, type: number, source: computed, default: 0, description: "= sum of line item mass_kg (3 decimals, round_half_up)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SHIPPED | RECEIVED", constraints: "enum {DRAFT, FINALIZED, SHIPPED, RECEIVED}" }

  - name: ManifestLineItem
    parent: null
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "FK -> WasteManifest.id; owning manifest" }
      - { name: waste_code, type: string, source: input, description: "EPA hazardous waste code, e.g. F006, F007, D007" }
      - { name: source_type, type: enum, source: input, description: "BATH_DUMP | SLUDGE_PRESS | RINSE_CONCENTRATE", constraints: "enum {BATH_DUMP, SLUDGE_PRESS, RINSE_CONCENTRATE}" }
      - { name: description, type: string, source: input, description: "Waste description" }
      - { name: volume_liters, type: number, source: input, description: "Waste volume", constraints: "> 0" }
      - { name: mass_kg, type: number, source: computed, description: "= round_half_up(volume_liters x density, 3); density = 1.2 kg/L for BATH_DUMP and RINSE_CONCENTRATE, 1.5 kg/L for SLUDGE_PRESS" }
      - { name: origin_bath_id, type: string, source: system, description: "Set when created by bath dump; null for manual lines" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /customers/{id} with status=SUSPENDED"
        actor: ShopManager
        preconditions: ["Customer exists"]
        side_effects: ["New work orders for this customer are rejected; in-flight work orders are unaffected"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /customers/{id} with status=ACTIVE"
        actor: ShopManager
        preconditions: ["Customer exists"]
        side_effects: []

  - entity: PlatingBath
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /baths/{id}/quarantine (actor EHSOfficer|ShopManager, cause=MANUAL) OR system cascade when a WasteSample exceedance matches this bath's chemistry_family (cause=DISCHARGE_EXCEEDANCE)"
        actor: EHSOfficer
        preconditions: ["Bath is ACTIVE (ERR_BATH_NOT_ACTIVE)"]
        side_effects:
          - "quarantine_cause set (MANUAL or DISCHARGE_EXCEEDANCE)"
          - "CASCADE: every WorkOrder in ROUTED status with bath_id == this bath transitions to ROUTE_HELD"
          - "A RUNNING LoadRun on this bath is NOT aborted; it may still complete"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /baths/{id}/release-quarantine"
        actor: EHSOfficer
        preconditions:
          - "Bath is QUARANTINED (ERR_BATH_NOT_QUARANTINED)"
          - "dose_verification_pending == false (ERR_DOSE_VERIFICATION_PENDING)"
          - "current_concentration_g_l within [low_concentration_g_l, high_concentration_g_l] inclusive (ERR_BATH_CONCENTRATION_OUT_OF_BAND)"
          - "If quarantine_cause == DISCHARGE_EXCEEDANCE: no DischargePermit with exceedance_active == true whose limits contain an analyte of this bath's chemistry_family (ERR_DISCHARGE_EXCEEDANCE_HOLD)"
          - "If amp_hour_used >= amp_hour_capacity at release time, the bath transitions to EXHAUSTED instead of ACTIVE"
        side_effects:
          - "quarantine_cause cleared"
          - "CASCADE: every WorkOrder in ROUTE_HELD with bath_id == this bath transitions back to ROUTED (only when the bath actually reaches ACTIVE)"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when a LoadRun completion makes amp_hour_used >= amp_hour_capacity; >= is inclusive)"
        actor: system
        preconditions: ["amp_hour_used >= amp_hour_capacity"]
        side_effects:
          - "CASCADE: every WorkOrder in ROUTED status with bath_id == this bath transitions to ROUTE_HELD"
      - from: ACTIVE
        to: DUMPED
        trigger: "POST /baths/{id}/dump"
        actor: ShopManager
        preconditions:
          - "Bath in {ACTIVE, QUARANTINED, EXHAUSTED} (ERR_BATH_NOT_DUMPABLE)"
          - "No RUNNING LoadRun on this bath (ERR_BATH_OCCUPIED)"
          - "manifest_id references a WasteManifest in DRAFT status (ERR_MANIFEST_NOT_DRAFT)"
        side_effects:
          - "Creates ManifestLineItem on that manifest: waste_code=F006, source_type=BATH_DUMP, volume_liters=volume_liters, origin_bath_id=this bath; manifest.total_mass_kg recomputed; manifest.version incremented"
          - "Any WorkOrder in ROUTED/ROUTE_HELD with bath_id == this bath transitions to ROUTE_HELD (stays held; renew or re-route resolves)"
      - from: QUARANTINED
        to: DUMPED
        trigger: "POST /baths/{id}/dump"
        actor: ShopManager
        preconditions: ["Same as ACTIVE -> DUMPED"]
        side_effects: ["Same as ACTIVE -> DUMPED"]
      - from: EXHAUSTED
        to: DUMPED
        trigger: "POST /baths/{id}/dump"
        actor: ShopManager
        preconditions: ["Same as ACTIVE -> DUMPED"]
        side_effects: ["Same as ACTIVE -> DUMPED"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /baths/{id}/dump with decommission=true"
        actor: ShopManager
        preconditions: ["Same as ACTIVE -> DUMPED"]
        side_effects: ["Same manifest line item as dump; bath is permanently retired"]
      - from: DUMPED
        to: ACTIVE
        trigger: "POST /baths/{id}/renew"
        actor: ShopManager
        preconditions:
          - "Bath is DUMPED (ERR_BATH_NOT_DUMPED)"
        side_effects:
          - "amp_hour_used := 0; amp_hour_reserved := 0"
          - "Creates the renewal BathTitration from the request's burette readings; current_concentration_g_l := measured value"
          - "dose_verification_pending := false; quarantine_cause := null"
          - "CASCADE: every WorkOrder in ROUTE_HELD with bath_id == this bath transitions back to ROUTED"

  - entity: WorkOrder
    initial_state: RECEIVED
    terminal_states: [SHIPPED, SCRAPPED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: READY_FOR_ROUTING
        trigger: "POST /work-orders/{id}/prepare"
        actor: LineOperator
        preconditions:
          - "Work order is RECEIVED (ERR_WORK_ORDER_NOT_RECEIVED)"
          - "masking_minutes is required in the request iff requires_masking == true (ERR_MASKING_MINUTES_REQUIRED)"
        side_effects:
          - "masking_minutes_actual recorded (0 when requires_masking == false)"
          - "provisional_quote_cents recomputed with actual masking minutes"
      - from: READY_FOR_ROUTING
        to: ROUTED
        trigger: "POST /work-orders/{id}/route"
        actor: LineOperator
        preconditions:
          - "Work order in READY_FOR_ROUTING or ROUTE_HELD (ERR_WORK_ORDER_NOT_ROUTABLE)"
          - "Bath exists, is ACTIVE, and bath.process_type == work order process_type (ERR_PROCESS_TYPE_MISMATCH)"
          - "routing_mode in bath.routing_modes_supported (ERR_ROUTING_MODE_NOT_SUPPORTED)"
          - "Alloy compatibility rule for (alloy_code, process_type, bath.chemistry_family): missing rule or INCOMPATIBLE -> ERR_ALLOY_BATH_INCOMPATIBLE; CONDITIONAL -> allowed, predip gate applies at load start"
          - "If routing_mode == RACK: fixture_id required, fixture.routing_mode == RACK (ERR_FIXTURE_ROUTING_MODE_MISMATCH), fixture.capacity_dm2 >= surface_area_total_dm2 (ERR_FIXTURE_CAPACITY_INSUFFICIENT); if BARREL: fixture_id must be null"
          - "planned_duration_minutes/planned_current_density_a_dm2 estimate: effective_remaining_ah (pessimistic variant) >= estimated amp-hours (ERR_BATH_LIFE_INSUFFICIENT)"
          - "Customer credit_hold == false and status == ACTIVE (ERR_CUSTOMER_CREDIT_HOLD / ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "bath_id, fixture_id, routed_chemistry_family set on the work order"
      - from: ROUTE_HELD
        to: ROUTED
        trigger: "POST /work-orders/{id}/route (re-route to a healthy bath)"
        actor: LineOperator
        preconditions: ["Same as READY_FOR_ROUTING -> ROUTED"]
        side_effects: ["Same as READY_FOR_ROUTING -> ROUTED"]
      - from: ROUTED
        to: ROUTE_HELD
        trigger: "system cascade (linked bath is quarantined, exhausted, or dumped)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ROUTE_HELD
        to: ROUTED
        trigger: "system cascade (linked bath returns to ACTIVE via release-quarantine or renew)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ROUTED
        to: IN_PROCESS
        trigger: "POST /work-orders/{id}/load-runs"
        actor: LineOperator
        preconditions:
          - "Work order is ROUTED (ERR_WORK_ORDER_NOT_ROUTED)"
          - "expected_bath_version matches linked bath version (ERR_STALE_VERSION, 412)"
          - "Bath is ACTIVE (ERR_BATH_NOT_ACTIVE) and has no RUNNING load (ERR_BATH_OCCUPIED)"
          - "dose_verification_pending == false (ERR_DOSE_VERIFICATION_PENDING)"
          - "current_concentration_g_l within [low, high] inclusive (ERR_BATH_CONCENTRATION_OUT_OF_BAND)"
          - "If compatibility for (alloy, process, family) is CONDITIONAL: predip_completed == true (ERR_PREDIP_REQUIRED)"
          - "If routing_mode == RACK: no RUNNING LoadRun references the same fixture (ERR_FIXTURE_OCCUPIED; occupancy interval is half-open [started_at, ended_at) so a load starting at the exact ended_at of the previous load is allowed)"
          - "Nameplate capacity check: amp_hour_used + amp_hour_reserved + estimated_amp_hours <= amp_hour_capacity, inclusive equality allowed (ERR_BATH_CAPACITY_EXCEEDED)"
          - "Customer credit_hold == false and status == ACTIVE"
        side_effects:
          - "LoadRun created RUNNING; estimated_amp_hours computed; started_at = current logical clock"
          - "bath.amp_hour_reserved += estimated_amp_hours; bath.active_load_run_id set; bath.version incremented"
      - from: IN_PROCESS
        to: AWAITING_INSPECTION
        trigger: "POST /load-runs/{id}/complete"
        actor: LineOperator
        preconditions:
          - "Load run is RUNNING (ERR_LOAD_RUN_NOT_RUNNING)"
        side_effects:
          - "Load run -> COMPLETED; amp_hours_consumed := estimated_amp_hours; ended_at = current clock"
          - "bath.amp_hour_reserved -= estimated_amp_hours; bath.amp_hour_used += amp_hours_consumed; bath.active_load_run_id cleared; bath.version incremented"
          - "Dragout depletion: bath.current_concentration_g_l = round_half_up(max(0, current - surface_area_dm2 x 0.0008), 3)"
          - "work_order.completed_load_count += 1"
          - "If bath.amp_hour_used >= amp_hour_capacity (inclusive): bath -> EXHAUSTED, cascading ROUTED work orders on it to ROUTE_HELD"
      - from: IN_PROCESS
        to: ROUTED
        trigger: "POST /load-runs/{id}/abort"
        actor: LineOperator
        preconditions:
          - "Load run is RUNNING (ERR_LOAD_RUN_NOT_RUNNING)"
        side_effects:
          - "Load run -> ABORTED; ended_at = current clock; amp_hours_consumed stays null"
          - "bath.amp_hour_reserved -= estimated_amp_hours; bath.active_load_run_id cleared; bath.version incremented"
          - "Invariant: amp_hour_used unchanged by abort"
      - from: AWAITING_INSPECTION
        to: COMPLETE
        trigger: "POST /work-orders/{id}/inspections with disposition PASS and requires_salt_spray == false"
        actor: QCInspector
        preconditions: ["Work order is AWAITING_INSPECTION (ERR_WORK_ORDER_NOT_AWAITING_INSPECTION)"]
        side_effects: ["InspectionReport persisted with computed disposition"]
      - from: AWAITING_INSPECTION
        to: AWAITING_LOT_TEST
        trigger: "POST /work-orders/{id}/inspections with disposition PASS and requires_salt_spray == true"
        actor: QCInspector
        preconditions: ["Work order is AWAITING_INSPECTION"]
        side_effects: ["InspectionReport persisted"]
      - from: AWAITING_INSPECTION
        to: REJECTED
        trigger: "POST /work-orders/{id}/inspections with disposition REWORKABLE_REJECT"
        actor: QCInspector
        preconditions: ["Work order is AWAITING_INSPECTION"]
        side_effects:
          - "pending_strip := true; last_defect_type recorded"
      - from: AWAITING_INSPECTION
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/inspections with disposition SCRAP_REJECT"
        actor: QCInspector
        preconditions: ["Work order is AWAITING_INSPECTION"]
        side_effects: ["No strip cycle created; terminal"]
      - from: AWAITING_LOT_TEST
        to: COMPLETE
        trigger: "system (salt spray lot evaluates PASSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_LOT_TEST
        to: REJECTED
        trigger: "system (salt spray lot evaluates FAILED)"
        actor: system
        preconditions: []
        side_effects: ["pending_strip := true; last_defect_type := LOT_CORROSION"]
      - from: REJECTED
        to: STRIPPING
        trigger: "POST /work-orders/{id}/start-strip"
        actor: LineOperator
        preconditions:
          - "Work order is REJECTED (ERR_WORK_ORDER_NOT_REJECTED); REJECTED is only reachable with pending_strip == true, so no separate check is needed"
        side_effects: []
      - from: STRIPPING
        to: READY_FOR_ROUTING
        trigger: "POST /work-orders/{id}/complete-strip"
        actor: LineOperator
        preconditions: ["Work order is STRIPPING (ERR_WORK_ORDER_NOT_STRIPPING)"]
        side_effects:
          - "rework_count += 1; pending_strip := false"
          - "bath_id, fixture_id, routed_chemistry_family cleared (must re-route)"
          - "predip_completed := false (must re-verify on the next cycle)"
      - from: COMPLETE
        to: SHIPPED
        trigger: "POST /work-orders/{id}/ship"
        actor: LineOperator
        preconditions:
          - "Work order is COMPLETE (ERR_WORK_ORDER_NOT_COMPLETE)"
          - "Customer credit_hold == false (ERR_CUSTOMER_CREDIT_HOLD) and status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "final_invoice_cents computed per final_invoice calculation (actual completed_load_count and rework_count)"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Customer
        preconditions: ["Owner customer or ShopManager; state in {RECEIVED, READY_FOR_ROUTING, ROUTED, ROUTE_HELD} for owner cancel (ERR_WORK_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["cancellation_fee_cents := 0; fixture/bath links cleared"]
      - from: READY_FOR_ROUTING
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Customer
        preconditions: ["Same as RECEIVED -> CANCELLED"]
        side_effects: ["Same as RECEIVED -> CANCELLED"]
      - from: ROUTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Customer
        preconditions: ["Same as RECEIVED -> CANCELLED"]
        side_effects: ["Same as RECEIVED -> CANCELLED; releases routing"]
      - from: ROUTE_HELD
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Customer
        preconditions: ["Same as RECEIVED -> CANCELLED"]
        side_effects: ["Same as RECEIVED -> CANCELLED"]
      - from: AWAITING_INSPECTION
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel (ShopManager only)"
        actor: ShopManager
        preconditions: ["State in {AWAITING_INSPECTION, REJECTED, STRIPPING, AWAITING_LOT_TEST}; ShopManager role (ERR_WORK_ORDER_NOT_CANCELLABLE for owner in these states)"]
        side_effects: ["cancellation_fee_cents := round_half_up(processing_component_cents x 0.5, 0); links cleared"]
      - from: REJECTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel (ShopManager only)"
        actor: ShopManager
        preconditions: ["Same as AWAITING_INSPECTION -> CANCELLED"]
        side_effects: ["Same as AWAITING_INSPECTION -> CANCELLED"]
      - from: STRIPPING
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel (ShopManager only)"
        actor: ShopManager
        preconditions: ["Same as AWAITING_INSPECTION -> CANCELLED"]
        side_effects: ["Same as AWAITING_INSPECTION -> CANCELLED"]
      - from: AWAITING_LOT_TEST
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel (ShopManager only)"
        actor: ShopManager
        preconditions: ["Same as AWAITING_INSPECTION -> CANCELLED"]
        side_effects: ["Same as AWAITING_INSPECTION -> CANCELLED"]

  - entity: LoadRun
    initial_state: RUNNING
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /load-runs/{id}/complete"
        actor: LineOperator
        preconditions: ["Load run is RUNNING (ERR_LOAD_RUN_NOT_RUNNING)"]
        side_effects: ["See WorkOrder IN_PROCESS -> AWAITING_INSPECTION side effects (bath debit, dragout, exhaustion cascade)"]
      - from: RUNNING
        to: ABORTED
        trigger: "POST /load-runs/{id}/abort"
        actor: LineOperator
        preconditions: ["Load run is RUNNING (ERR_LOAD_RUN_NOT_RUNNING)"]
        side_effects: ["See WorkOrder IN_PROCESS -> ROUTED side effects (reservation release, no amp-hour debit)"]

  - entity: SaltSprayLot
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /salt-spray-lots/{id}/evaluate"
        actor: LabChemist
        preconditions:
          - "Lot result == PENDING (ERR_LOT_NOT_RUNNING)"
          - "hours_run >= hours_required (ERR_LOT_HOURS_INSUFFICIENT)"
          - "panels_failed <= allowed_failures (otherwise the lot evaluates FAILED instead)"
        side_effects: ["Linked work order AWAITING_LOT_TEST -> COMPLETE"]
      - from: PENDING
        to: FAILED
        trigger: "POST /salt-spray-lots/{id}/evaluate"
        actor: LabChemist
        preconditions:
          - "Lot result == PENDING (ERR_LOT_NOT_RUNNING)"
          - "hours_run >= hours_required (ERR_LOT_HOURS_INSUFFICIENT)"
        side_effects:
          - "Linked work order AWAITING_LOT_TEST -> REJECTED with pending_strip=true, last_defect_type=LOT_CORROSION"
          - "If work order rework_count already >= MAX_REWORKS (2), the work order goes SCRAPPED instead of REJECTED"

  - entity: DischargePermit
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXCEEDED
        trigger: "system (a WasteSample with is_exceedance == true is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "exceedance_active := true"
          - "CASCADE: every ACTIVE PlatingBath whose chemistry_family maps to any exceeded analyte -> QUARANTINED with cause=DISCHARGE_EXCEEDANCE; their ROUTED work orders -> ROUTE_HELD"
          - "Chemistry-to-analyte map: NICKEL bath -> NICKEL; ZINC -> ZINC; COPPER -> COPPER; CHROMIC -> CHROME; CYANIDE -> CYANIDE; SULFURIC -> none (never quarantined by exceedance)"
      - from: EXCEEDED
        to: ACTIVE
        trigger: "POST /discharge-permits/{id}/clear-exceedance"
        actor: EHSOfficer
        preconditions: ["Permit is EXCEEDED (ERR_PERMIT_NOT_EXCEEDED)"]
        side_effects: ["exceedance_active := false; does NOT release bath quarantines (baths released individually via release-quarantine)"]

  - entity: WasteManifest
    initial_state: DRAFT
    terminal_states: [RECEIVED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /waste-manifests/{id}/finalize"
        actor: EHSOfficer
        preconditions:
          - "Manifest is DRAFT (ERR_MANIFEST_NOT_DRAFT)"
          - "Segregation of duties: X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES; applies to every role including ShopManager)"
          - "At least one line item (ERR_MANIFEST_EMPTY)"
          - "No DischargePermit with exceedance_active == true exists (ERR_DISCHARGE_EXCEEDANCE_HOLD)"
        side_effects: ["finalized_by_user_id recorded; line items locked"]
      - from: FINALIZED
        to: SHIPPED
        trigger: "POST /waste-manifests/{id}/ship"
        actor: EHSOfficer
        preconditions:
          - "Manifest is FINALIZED (ERR_MANIFEST_NOT_FINALIZED)"
          - "transporter_name provided (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /waste-manifests/{id}/receive"
        actor: EHSOfficer
        preconditions: ["Manifest is SHIPPED (ERR_MANIFEST_NOT_SHIPPED)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: dose-stale-bath-version
    parent_entity: PlatingBath
    write_endpoint: "POST /baths/{id}/doses"
    occ_field: "expected_bath_version"
    description: |
      Recording a dose against a PlatingBath whose version has advanced since the
      client last read it is rejected with ERR_STALE_VERSION. Both a fresh-view
      dose and a stale-view dose would each legitimately succeed sequentially
      (bath ACTIVE/QUARANTINED, concentration below target), so the stale
      request is rejected purely because its view of the bath is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: load-start-stale-bath-version
    parent_entity: PlatingBath
    write_endpoint: "POST /work-orders/{id}/load-runs"
    occ_field: "expected_bath_version"
    description: |
      Starting a LoadRun against the routed PlatingBath whose version has
      advanced since the client last read it is rejected with ERR_STALE_VERSION.
      The OCC check runs at priority 6, before state checks, so a stale-version
      start is rejected with 412 even when the bath is already occupied by
      another RUNNING load (which would otherwise yield ERR_BATH_OCCUPIED).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-line-add-stale-version
    parent_entity: WasteManifest
    write_endpoint: "POST /waste-manifests/{id}/line-items"
    occ_field: "expected_manifest_version"
    description: |
      Adding a ManifestLineItem to a DRAFT WasteManifest whose version has
      advanced since the client last read it is rejected with ERR_STALE_VERSION,
      because the client may have computed totals against a stale line-item set.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workorder-amend-stale-version
    parent_entity: WorkOrder
    write_endpoint: "PATCH /work-orders/{id}"
    occ_field: "expected_work_order_version"
    description: |
      Amending a RECEIVED WorkOrder (spec band, part_count, surface area) whose
      version has advanced since the client last read it is rejected with
      ERR_STALE_VERSION; each successful amendment recomputes the provisional
      quote, so an amendment based on a stale quote view is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: titration_concentration
    trigger: "POST /baths/{id}/titrations (also the renewal titration inside POST /baths/{id}/renew)"
    algorithm: chemistry_conversion
    formula: |
      measured_concentration_g_l = round_half_up(titrant_volume_ml * titrant_normality * EQ_WEIGHT / sample_volume_ml, 3)
      EQ_WEIGHT depends on the bath's chemistry_family (constants below).
      On success: bath.current_concentration_g_l := measured_concentration_g_l;
      bath.dose_verification_pending := false; bath.version incremented.
      Application order is arrival order (creation order), NOT sampled timestamps.
    input_set: "The target bath (status ACTIVE or QUARANTINED)"
    constants:
      EQ_WEIGHT_SULFURIC: 49.0
      EQ_WEIGHT_CHROMIC: 33.3
      EQ_WEIGHT_NICKEL: 29.35
      EQ_WEIGHT_ZINC: 32.69
      EQ_WEIGHT_COPPER: 31.77
      EQ_WEIGHT_CYANIDE: 49.0
    precision: "3 decimal places, round_half_up"

  - name: dose_concentration
    trigger: "POST /baths/{id}/doses"
    algorithm: chemistry_conversion
    formula: |
      recommended_dose_g = round_half_up(max(0, target_concentration_g_l - current_concentration_g_l) * volume_liters, 0)
      (recommendation exposed in bath detail reads; a dose with quantity_g when current >= target is rejected ERR_DOSE_NOT_NEEDED)
      On success: bath.current_concentration_g_l = round_half_up(current_concentration_g_l + quantity_g / volume_liters, 3)
      bath.dose_verification_pending := true; bath.version incremented.
    input_set: "The target bath (status ACTIVE or QUARANTINED; EXHAUSTED/DUMPED/DECOMMISSIONED rejected ERR_BATH_NOT_DOSABLE)"
    precision: "3 decimal places, round_half_up"

  - name: amp_hour_consumption
    trigger: "POST /work-orders/{id}/load-runs (estimate at start) and POST /load-runs/{id}/complete (debit)"
    algorithm: aggregation
    formula: |
      surface_area_dm2 = work_order.part_count * work_order.surface_area_dm2_per_part  (snapshot on the LoadRun)
      estimated_amp_hours = round_half_up(surface_area_dm2 * current_density_a_dm2 * duration_minutes / 60, 2)
      At start:  bath.amp_hour_reserved += estimated_amp_hours
      At complete: bath.amp_hour_reserved -= estimated_amp_hours; bath.amp_hour_used += amp_hours_consumed
                   where amp_hours_consumed := estimated_amp_hours
      At abort:    bath.amp_hour_reserved -= estimated_amp_hours (no used debit)
      INVARIANTS:  bath.amp_hour_used   == sum(amp_hours_consumed over COMPLETED runs)
                   bath.amp_hour_reserved == sum(estimated_amp_hours over RUNNING runs)
    input_set: "LoadRuns of the bath with status RUNNING (reserved) or COMPLETED (used); ABORTED excluded from both"
    precision: "2 decimal places, round_half_up"

  - name: bath_life_projection
    trigger: "read of bath detail (both variants exposed); routing check (pessimistic variant)"
    algorithm: forward_looking
    formula: |
      nameplate_remaining_ah = amp_hour_capacity - amp_hour_used                       (optimistic variant)
      efficiency = 1.0 if current_concentration_g_l >= target_concentration_g_l
                   else max(0.5, current_concentration_g_l / target_concentration_g_l)
      effective_remaining_ah = floor((amp_hour_capacity - amp_hour_used) * efficiency)  (pessimistic variant)
      Routing requires effective_remaining_ah >= estimated amp-hours of the planned load.
      Load start re-checks the nameplate physical capacity: amp_hour_used + amp_hour_reserved + estimate <= amp_hour_capacity.
    input_set: "The bath; current_concentration_g_l must be non-null for the pessimistic variant (no titration yet -> routing rejected ERR_BATH_CONCENTRATION_OUT_OF_BAND)"
    variants:
      - name: nameplate_optimistic
        when: "informational display on bath detail; load-start physical capacity check uses nameplate inequality"
        difference: "ignores chemistry efficiency; larger than or equal to the pessimistic variant"
      - name: chemistry_adjusted_pessimistic
        when: "route-time sufficiency check"
        difference: "multiplies by efficiency in [0.5, 1.0]; strictly smaller whenever current < target"
    precision: "effective_remaining_ah is an integer (floor); nameplate carries 2 decimals"

  - name: dragout_depletion
    trigger: "POST /load-runs/{id}/complete"
    algorithm: decay_function
    formula: |
      bath.current_concentration_g_l = round_half_up(max(0, current_concentration_g_l - surface_area_dm2 * DRAGOUT_RATE), 3)
    input_set: "The completing LoadRun's bath"
    constants:
      DRAGOUT_RATE: 0.0008   # g/L depleted per dm^2 of load surface area
    precision: "3 decimal places, round_half_up"

  - name: thickness_acceptance
    trigger: "POST /work-orders/{id}/inspections"
    algorithm: threshold
    formula: |
      thickness_min_um = min(thickness_readings_um); thickness_max_um = max(thickness_readings_um)
      thickness_ok = (thickness_min_um >= thickness_spec_min_um) AND (thickness_max_um <= thickness_spec_max_um)
      Both bounds INCLUSIVE: min == spec_min passes; max == spec_max passes.
      disposition:
        PASS               if thickness_ok AND defect_type == NONE
        SCRAP_REJECT       if defect_type in {BURN, ADHESION}  (regardless of thickness)
                           OR (not PASS) AND work_order.rework_count >= MAX_REWORKS
        REWORKABLE_REJECT  otherwise (includes defect_type in {STAIN, PITTING, UNDERTHICKNESS}
                           or thickness_ok == false with rework_count < MAX_REWORKS)
    input_set: "The AWAITING_INSPECTION work order and its latest COMPLETED LoadRun"
    constants:
      MAX_REWORKS: 2
    precision: "readings compared as given (1 decimal recommended, not enforced)"

  - name: salt_spray_acceptance
    trigger: "POST /salt-spray-lots and POST /salt-spray-lots/{id}/evaluate"
    algorithm: threshold
    formula: |
      allowed_failures = 2 if sample_count >= 10
                         1 if sample_count >= 5
                         0 otherwise        (boundaries: 4 -> 0, 5 -> 1, 9 -> 1, 10 -> 2)
      hours_run = floor((current_utc - lot.created_at) / 1 hour) using the logical clock
      Evaluate is rejected while hours_run < hours_required (ERR_LOT_HOURS_INSUFFICIENT).
      PASSED iff panels_failed <= allowed_failures (inclusive), else FAILED.
    input_set: "The PENDING SaltSprayLot; work order must be AWAITING_LOT_TEST"
    precision: "integer hours and panels"

  - name: waste_mass_accounting
    trigger: "POST /discharge-permits/{id}/samples"
    algorithm: aggregation
    formula: |
      Per sample, per analyte reading:
        mass_g = round_half_up(concentration_mg_l * flow_liters / 1000, 3)
      PINNED ROUNDING ORDER: each per-analyte mass is rounded to 3 decimals FIRST;
      the monthly cumulative is the plain sum of those rounded per-sample masses
      (never re-rounded, never sum-then-round).
      Month bucketing by sampled_at calendar month:
        - if permit.current_month is null or sample month > current_month:
            current_month := sample month; cumulative_mass_g := {sample masses only}  (RESET)
        - if sample month == current_month: cumulative_mass_g[analyte] += mass_g
        - if sample month < current_month: reject ERR_SAMPLE_MONTH_REGRESSION
      Within-month ties on sampled_at are applied in arrival order.
      Exceedance (either condition, both STRICT; equality is compliant):
        instantaneous: concentration_mg_l > limit.max_concentration_mg_l
        cumulative:    cumulative_mass_g[analyte] (after add) > limit.monthly_mass_cap_g
    input_set: "Samples of this permit accepted in arrival order; each reading's analyte must exist in permit.limits (else ERR_INVALID_REQUEST)"
    precision: "3 decimal places per analyte mass, round_half_up"

  - name: provisional_quote
    trigger: "POST /work-orders and PATCH /work-orders/{id}"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned, resolves the circular-looking dependency):
        1. masking_cents    = requires_masking ? (masking_minutes_actual if set else 0) * MASKING_RATE : 0
        2. fixture_cents    = routing_mode == RACK ? fixture.amortization_cents_per_use * planned_runs
                              : BARREL_FLAT_FEE * planned_runs          (planned_runs = 1 for provisional)
        3. billing_thickness_um = round_half_up((thickness_spec_min_um + thickness_spec_max_um) / 2, 1)
        4. processing_cents = round_half_up(surface_area_total_dm2 * billing_thickness_um * tier_rate, 0)
             tier_rate = 12 if billing_thickness_um < 10; 15 if 10 <= billing_thickness_um < 25; 19 if >= 25
        5. rework_surcharge_cents = round_half_up(processing_cents * 0.20, 0) * rework_count   (0 for provisional)
        6. subtotal_cents = masking_cents + fixture_cents + processing_cents + rework_surcharge_cents
        7. discount_cents = round_half_up(subtotal_cents * rate, 0)
             rate keyed on PRE-discount subtotal: >= 1000000 -> 0.08; >= 500000 -> 0.05; else 0
        8. hazmat_fee_cents = 2500 if routed_chemistry_family in {CHROMIC, CYANIDE} else 0
             (provisional: family unknown before routing -> hazmat fee 0 at quote time)
        9. total_cents = subtotal_cents - discount_cents + hazmat_fee_cents
      ROUNDING: every line is rounded to whole cents (half-up) BEFORE summing (round-per-line-then-sum).
    input_set: "The work order; fixture looked up only when routing_mode == RACK (provisional quote at creation uses a null fixture -> fixture_cents uses UNASSIGNED_RACK_FEE 2000 when no fixture is yet assigned)"
    constants:
      MASKING_RATE: 85        # cents per masking minute
      BARREL_FLAT_FEE: 1200   # cents per load run
      UNASSIGNED_RACK_FEE: 2000  # cents per load run when no fixture assigned yet
      REWORK_RATE: 0.20
      HAZMAT_FEE: 2500
    variants:
      - name: provisional
        when: "creation and amendment while RECEIVED"
        difference: "planned_runs = 1, rework_count = 0, hazmat fee 0 (no bath routed)"
      - name: final
        when: "at ship"
        difference: "planned_runs = completed_load_count (actual), rework_count actual, hazmat fee from routed_chemistry_family"
    precision: "whole cents, round_half_up, per-line before sum"

  - name: final_invoice
    trigger: "POST /work-orders/{id}/ship"
    algorithm: tiered_pricing
    formula: |
      Identical line structure and pinned evaluation order as provisional_quote, with:
        planned_runs := completed_load_count (actual COMPLETED LoadRuns)
        rework_count := actual rework_count
        hazmat fee from routed_chemistry_family snapshot
      final_invoice_cents is stored on the work order at SHIPPED.
      Divergence source vs provisional: fixture amortization multiplies actual runs,
      rework surcharges apply, hazmat fee applies when routed family is CHROMIC/CYANIDE.
    input_set: "The COMPLETE work order being shipped"
    constants:
      MASKING_RATE: 85
      BARREL_FLAT_FEE: 1200
      REWORK_RATE: 0.20
      HAZMAT_FEE: 2500
    precision: "whole cents, round_half_up, per-line before sum"

  - name: cancellation_fee
    trigger: "POST /work-orders/{id}/cancel from a late state (ShopManager only)"
    algorithm: threshold
    formula: |
      Early cancel (owner, states {RECEIVED, READY_FOR_ROUTING, ROUTED, ROUTE_HELD}): fee = 0
      Late cancel (ShopManager, states {AWAITING_INSPECTION, REJECTED, STRIPPING, AWAITING_LOT_TEST}):
        cancellation_fee_cents = round_half_up(processing_component_cents * 0.5, 0)
        where processing_component_cents is step 4 of the pricing formula evaluated on current spec.
    input_set: "The cancelled work order"
    precision: "whole cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership scoping: Customer role may only access resources whose customer_id == X-User-ID; POST /work-orders body customer_id must equal X-User-ID for Customer role"
    error_id: ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "Customer-role calls on /work-orders/**, GET /customers"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right; FK body references (bath_id, fixture_id, manifest_id, work_order_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request schema: required fields present, types correct, enum members valid, ranges valid (e.g. thickness_spec_min_um <= thickness_spec_max_um, readings array length >= 3, limits non-empty with unique analytes)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 6
    category: concurrency
    check: "OCC: expected_<parent>_version equals the parent's current version (checked after schema, before all state/business logic)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /baths/{id}/doses, POST /work-orders/{id}/load-runs, POST /waste-manifests/{id}/line-items, PATCH /work-orders/{id}"
  - priority: 7
    category: state
    check: "State preconditions of the target entity's state machine (work order routable/routed/stripping states, bath active/quarantined/dumped states, load run RUNNING, lot PENDING, manifest DRAFT/FINALIZED/SHIPPED, permit EXCEEDED for clear). Within priority 7, the work order's own state is checked before the linked bath's state."
    error_id: "ERR_* state family (ERR_WORK_ORDER_NOT_ROUTABLE, ERR_BATH_NOT_ACTIVE, ERR_MANIFEST_NOT_DRAFT, ...)"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_safety
    check: "Chemistry/alloy safety: alloy compatibility (missing rule or INCOMPATIBLE -> reject), predip gate for CONDITIONAL, bath concentration within [low, high] inclusive and titrated at least once, dose_verification_pending == false at load start"
    error_id: "ERR_ALLOY_BATH_INCOMPATIBLE | ERR_PREDIP_REQUIRED | ERR_BATH_CONCENTRATION_OUT_OF_BAND | ERR_DOSE_VERIFICATION_PENDING"
    http_status: 422
    applies_to: "route, load-runs, release-quarantine"
  - priority: 9
    category: business_temporal
    check: "Time/overlap rules: permit window containment for samples (closed interval), sample month regression, permit window overlap on create (closed-closed: sharing a boundary date IS overlap), fixture occupation (half-open: ended_at == next started_at is NOT occupied), salt-spray hours gate"
    error_id: "ERR_SAMPLE_OUTSIDE_PERMIT_WINDOW | ERR_SAMPLE_MONTH_REGRESSION | ERR_PERMIT_WINDOW_OVERLAP | ERR_FIXTURE_OCCUPIED | ERR_LOT_HOURS_INSUFFICIENT"
    http_status: 409
    applies_to: "samples, permits create, load-runs, lot evaluate"
  - priority: 10
    category: business_constraint
    check: "Structural constraints: process_type match, routing mode supported by bath, fixture mode match and capacity, dose needed (current < target), manifest non-empty at finalize, segregation of duties on finalize, uniqueness (bath_code, fixture_code, compat rule triple)"
    error_id: "ERR_PROCESS_TYPE_MISMATCH | ERR_ROUTING_MODE_NOT_SUPPORTED | ERR_FIXTURE_ROUTING_MODE_MISMATCH | ERR_FIXTURE_CAPACITY_INSUFFICIENT | ERR_DOSE_NOT_NEEDED | ERR_MANIFEST_EMPTY | ERR_SEGREGATION_OF_DUTIES | ERR_DUPLICATE_COMPATIBILITY_RULE"
    http_status: 422
    applies_to: "route, doses, manifest finalize, compat rule create"
  - priority: 11
    category: business_fiscal
    check: "Capacity/budget last: route-time effective bath-life sufficiency, load-start nameplate capacity (used + reserved + estimate <= capacity, inclusive), customer credit hold and suspension"
    error_id: "ERR_BATH_LIFE_INSUFFICIENT | ERR_BATH_CAPACITY_EXCEEDED | ERR_CUSTOMER_CREDIT_HOLD | ERR_CUSTOMER_SUSPENDED"
    http_status: 409
    applies_to: "route, load-runs, ship, work-order create"
  - priority: 12
    category: business_safety
    check: "Compliance hold: manifest finalize blocked while any DischargePermit has exceedance_active == true"
    error_id: ERR_DISCHARGE_EXCEEDANCE_HOLD
    http_status: 409
    applies_to: "POST /waste-manifests/{id}/finalize"
    note: "Safety hold is evaluated at priority 8 for bath release but at 12 for manifest finalize; per-endpoint ordering pins: finalize checks segregation (10) before exceedance hold (12)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - { method: POST, path: "/customers", description: "Create a customer", roles: [ShopManager], code: 201, input: [company_name, "priority_tier?", "credit_hold?", "status?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers", description: "List customers; Customer role sees only its own record", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: PATCH, path: "/customers/{id}", description: "Update credit_hold, status, priority_tier", roles: [ShopManager], code: 200, input: ["credit_hold?", "status?", "priority_tier?"], output: Customer, side_effects: ["increments Customer.version by 1"] }

  # --- Fixtures ---
  - { method: POST, path: "/fixtures", description: "Create a fixture; amortization_cents_per_use computed", roles: [ShopManager], code: 201, input: [fixture_code, routing_mode, capacity_dm2, purchase_cost_cents, rated_uses], output: Fixture, side_effects: [] }
  - { method: GET, path: "/fixtures", description: "List fixtures", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "Fixture[]", side_effects: [] }

  # --- Alloy compatibility rules ---
  - { method: POST, path: "/alloy-compatibility-rules", description: "Create a rule; unique (alloy_code, process_type, chemistry_family)", roles: [LabChemist, ShopManager], code: 201, input: [alloy_code, process_type, chemistry_family, compatibility, "notes?"], output: AlloyCompatibilityRule, side_effects: [] }
  - { method: GET, path: "/alloy-compatibility-rules", description: "List rules with optional filters", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["alloy_code?", "chemistry_family?", "limit?", "offset?"], output: "AlloyCompatibilityRule[]", side_effects: [] }
  - { method: DELETE, path: "/alloy-compatibility-rules/{id}", description: "Delete a rule (reopens fail-closed default)", roles: [LabChemist, ShopManager], code: 204, input: [], output: null, side_effects: [] }

  # --- Baths ---
  - { method: POST, path: "/baths", description: "Create a plating bath (ACTIVE, untitrated)", roles: [ShopManager], code: 201, input: [bath_code, process_type, chemistry_family, routing_modes_supported, volume_liters, target_concentration_g_l, low_concentration_g_l, high_concentration_g_l, amp_hour_capacity], output: PlatingBath, side_effects: ["status = ACTIVE; amp_hour_used = 0; current_concentration_g_l = null"] }
  - { method: GET, path: "/baths/{id}", description: "Bath detail incl. nameplate_remaining_ah and effective_remaining_ah variants", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: [], output: PlatingBath, side_effects: [] }
  - { method: POST, path: "/baths/{id}/titrations", description: "Record a titration; sets concentration, clears dose_verification_pending", roles: [LabChemist, ShopManager], code: 201, input: [titrant_volume_ml, titrant_normality, sample_volume_ml], output: BathTitration, side_effects: ["titration_concentration calc; bath.current_concentration_g_l updated; dose_verification_pending := false; increments PlatingBath.version by 1"] }
  - { method: GET, path: "/baths/{id}/titrations", description: "List titration events of a bath (arrival order)", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "BathTitration[]", side_effects: [] }
  - { method: POST, path: "/baths/{id}/doses", description: "Dose a bath (OCC on bath version)", roles: [LabChemist, ShopManager], code: 201, input: [chemical_code, quantity_g, expected_bath_version], output: DoseEvent, side_effects: ["dose_concentration calc; dose_verification_pending := true; increments PlatingBath.version by 1"] }
  - { method: GET, path: "/baths/{id}/doses", description: "List dose events of a bath", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "DoseEvent[]", side_effects: [] }
  - { method: POST, path: "/baths/{id}/quarantine", description: "Manually quarantine an ACTIVE bath (cause=MANUAL)", roles: [EHSOfficer, ShopManager], code: 200, input: [], output: PlatingBath, side_effects: ["status -> QUARANTINED; ROUTED work orders on it -> ROUTE_HELD; increments PlatingBath.version by 1"] }
  - { method: POST, path: "/baths/{id}/release-quarantine", description: "Release a QUARANTINED bath after chemistry verification", roles: [EHSOfficer, ShopManager], code: 200, input: [], output: PlatingBath, side_effects: ["status -> ACTIVE (or EXHAUSTED if capacity reached); ROUTE_HELD work orders on it -> ROUTED; increments PlatingBath.version by 1"] }
  - { method: POST, path: "/baths/{id}/dump", description: "Dump bath contents to a DRAFT manifest; decommission=true retires the bath", roles: [ShopManager], code: 200, input: [manifest_id, "decommission?"], output: PlatingBath, side_effects: ["status -> DUMPED (or DECOMMISSIONED); creates ManifestLineItem on manifest; increments WasteManifest.version by 1; increments PlatingBath.version by 1"] }
  - { method: POST, path: "/baths/{id}/renew", description: "Renew a DUMPED bath with a baseline titration", roles: [ShopManager], code: 200, input: [titrant_volume_ml, titrant_normality, sample_volume_ml], output: PlatingBath, side_effects: ["status -> ACTIVE; amp_hour_used := 0; creates BathTitration; ROUTE_HELD work orders on it -> ROUTED; increments PlatingBath.version by 1"] }
  - { method: GET, path: "/baths/{id}/load-runs", description: "List load runs processed on a bath", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "LoadRun[]", side_effects: [] }

  # --- Work orders ---
  - { method: POST, path: "/work-orders", description: "Create a work order (RECEIVED); computes provisional_quote_cents", roles: [Customer, ShopManager], code: 201, input: [customer_id, part_number, alloy_code, process_type, routing_mode, part_count, surface_area_dm2_per_part, thickness_spec_min_um, thickness_spec_max_um, "requires_masking?", "requires_salt_spray?"], output: WorkOrder, side_effects: ["provisional_quote computed (variant provisional)"] }
  - { method: GET, path: "/work-orders", description: "List work orders; Customer role sees only own; filters for FK reverse-reachability", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["customer_id?", "bath_id?", "fixture_id?", "status?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}", description: "Work order detail (owner Customer or staff)", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: PATCH, path: "/work-orders/{id}", description: "Amend spec while RECEIVED (OCC on work order version); recomputes provisional quote", roles: [Customer, ShopManager], code: 200, input: [expected_work_order_version, "part_count?", "surface_area_dm2_per_part?", "thickness_spec_min_um?", "thickness_spec_max_um?", "requires_masking?", "requires_salt_spray?"], output: WorkOrder, side_effects: ["provisional_quote recomputed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/prepare", description: "Masking/preparation; RECEIVED -> READY_FOR_ROUTING", roles: [LineOperator, ShopManager], code: 200, input: ["masking_minutes?"], output: WorkOrder, side_effects: ["masking_minutes_actual recorded; provisional_quote recomputed"] }
  - { method: POST, path: "/work-orders/{id}/complete-predip", description: "Record pre-dip completion for CONDITIONAL alloy compatibility", roles: [LineOperator, ShopManager], code: 200, input: [], output: WorkOrder, side_effects: ["predip_completed := true"] }
  - { method: POST, path: "/work-orders/{id}/route", description: "Assign bath and fixture; READY_FOR_ROUTING/ROUTE_HELD -> ROUTED", roles: [LineOperator, ShopManager], code: 200, input: [bath_id, "fixture_id?", planned_duration_minutes, planned_current_density_a_dm2], output: WorkOrder, side_effects: ["bath_id, fixture_id, routed_chemistry_family set"] }
  - { method: POST, path: "/work-orders/{id}/load-runs", description: "Start a load run on the routed bath (OCC on bath version); ROUTED -> IN_PROCESS", roles: [LineOperator, ShopManager], code: 201, input: [duration_minutes, current_density_a_dm2, expected_bath_version], output: LoadRun, side_effects: ["amp_hour reservation on bath; increments PlatingBath.version by 1"] }
  - { method: GET, path: "/work-orders/{id}/load-runs", description: "List load runs of a work order", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "LoadRun[]", side_effects: [] }
  - { method: POST, path: "/load-runs/{id}/complete", description: "Complete a RUNNING load; debits amp-hours, dragout depletion, may auto-exhaust bath", roles: [LineOperator, ShopManager], code: 200, input: [], output: LoadRun, side_effects: ["amp_hour_consumption debit; dragout_depletion; exhaustion cascade; WO -> AWAITING_INSPECTION; increments PlatingBath.version by 1"] }
  - { method: POST, path: "/load-runs/{id}/abort", description: "Abort a RUNNING load; releases reservation, no amp-hour debit", roles: [LineOperator, ShopManager], code: 200, input: [], output: LoadRun, side_effects: ["reservation release; WO -> ROUTED; increments PlatingBath.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/inspections", description: "Record QC inspection; computes disposition and drives PASS/REWORK/SCRAP transition", roles: [QCInspector, ShopManager], code: 201, input: [thickness_readings_um, defect_type], output: InspectionReport, side_effects: ["thickness_acceptance calc; WO transition per disposition"] }
  - { method: GET, path: "/work-orders/{id}/inspections", description: "List inspection reports of a work order", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "InspectionReport[]", side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/start-strip", description: "Begin strip of a rejected order; REJECTED -> STRIPPING", roles: [LineOperator, ShopManager], code: 200, input: [strip_method], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/complete-strip", description: "Finish strip; STRIPPING -> READY_FOR_ROUTING, rework_count += 1", roles: [LineOperator, ShopManager], code: 200, input: [], output: WorkOrder, side_effects: ["rework_count += 1; routing cleared; predip_completed := false"] }
  - { method: POST, path: "/work-orders/{id}/ship", description: "Ship a COMPLETE order; computes final_invoice_cents", roles: [LineOperator, ShopManager], code: 200, input: [], output: WorkOrder, side_effects: ["final_invoice computed (variant final)"] }
  - { method: POST, path: "/work-orders/{id}/cancel", description: "Cancel: owner from early states (fee 0); ShopManager from late states (50% processing fee)", roles: [Customer, ShopManager], code: 200, input: [], output: WorkOrder, side_effects: ["cancellation_fee computed; routing cleared"] }

  # --- Salt spray lots ---
  - { method: POST, path: "/salt-spray-lots", description: "Create a salt spray lot for an AWAITING_LOT_TEST work order", roles: [LabChemist, ShopManager], code: 201, input: [work_order_id, sample_count, hours_required], output: SaltSprayLot, side_effects: ["allowed_failures computed"] }
  - { method: POST, path: "/salt-spray-lots/{id}/evaluate", description: "Evaluate a PENDING lot after hours gate; PASSED -> WO COMPLETE, FAILED -> WO REJECTED/SCRAPPED", roles: [LabChemist, ShopManager], code: 200, input: [panels_failed], output: SaltSprayLot, side_effects: ["salt_spray_acceptance calc; WO transition"] }
  - { method: GET, path: "/work-orders/{id}/salt-spray-lots", description: "List salt spray lots of a work order", roles: [Customer, LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "SaltSprayLot[]", side_effects: [] }

  # --- Discharge permits & samples ---
  - { method: POST, path: "/discharge-permits", description: "Create a discharge permit; closed-window overlap per outfall rejected", roles: [EHSOfficer, ShopManager], code: 201, input: [outfall_code, effective_from, effective_to, limits], output: DischargePermit, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/discharge-permits/{id}", description: "Permit detail incl. cumulative_mass_g", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: [], output: DischargePermit, side_effects: [] }
  - { method: POST, path: "/discharge-permits/{id}/samples", description: "Record a waste sample; mass accounting; exceedance cascade", roles: [EHSOfficer, ShopManager], code: 201, input: [flow_liters, readings, "sampled_at?"], output: WasteSample, side_effects: ["waste_mass_accounting calc; on exceedance: permit -> EXCEEDED, matching baths -> QUARANTINED, their ROUTED orders -> ROUTE_HELD"] }
  - { method: GET, path: "/discharge-permits/{id}/samples", description: "List samples of a permit", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "WasteSample[]", side_effects: [] }
  - { method: POST, path: "/discharge-permits/{id}/clear-exceedance", description: "Clear EXCEEDED status after review", roles: [EHSOfficer, ShopManager], code: 200, input: [], output: DischargePermit, side_effects: ["status -> ACTIVE; exceedance_active := false"] }

  # --- Waste manifests ---
  - { method: POST, path: "/waste-manifests", description: "Create a DRAFT manifest; created_by_user_id recorded", roles: [EHSOfficer, ShopManager], code: 201, input: [generator_epa_id, "transporter_name?"], output: WasteManifest, side_effects: [] }
  - { method: GET, path: "/waste-manifests/{id}", description: "Manifest detail incl. total_mass_kg", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: [], output: WasteManifest, side_effects: [] }
  - { method: POST, path: "/waste-manifests/{id}/line-items", description: "Add a line item to a DRAFT manifest (OCC on manifest version)", roles: [EHSOfficer, ShopManager], code: 201, input: [waste_code, source_type, description, volume_liters, expected_manifest_version], output: ManifestLineItem, side_effects: ["mass_kg computed; total_mass_kg recomputed; increments WasteManifest.version by 1"] }
  - { method: DELETE, path: "/waste-manifests/{id}/line-items/{lineItemId}", description: "Remove a line item from a DRAFT manifest", roles: [EHSOfficer, ShopManager], code: 204, input: [], output: null, side_effects: ["total_mass_kg recomputed; increments WasteManifest.version by 1"] }
  - { method: GET, path: "/waste-manifests/{id}/line-items", description: "List line items of a manifest", roles: [LineOperator, LabChemist, QCInspector, EHSOfficer, ShopManager], code: 200, input: ["limit?", "offset?"], output: "ManifestLineItem[]", side_effects: [] }
  - { method: POST, path: "/waste-manifests/{id}/finalize", description: "Finalize a DRAFT manifest; segregation of duties enforced", roles: [EHSOfficer, ShopManager], code: 200, input: [], output: WasteManifest, side_effects: ["status -> FINALIZED; finalized_by_user_id recorded"] }
  - { method: POST, path: "/waste-manifests/{id}/ship", description: "Ship a FINALIZED manifest (transporter_name required)", roles: [EHSOfficer, ShopManager], code: 200, input: [transporter_name], output: WasteManifest, side_effects: ["status -> SHIPPED"] }
  - { method: POST, path: "/waste-manifests/{id}/receive", description: "Confirm receipt of a SHIPPED manifest (terminal)", roles: [EHSOfficer, ShopManager], code: 200, input: [], output: WasteManifest, side_effects: ["status -> RECEIVED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Used by salt-spray hours_run, permit window checks, load run timestamps, sampled_at defaults.", roles: [ShopManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Customer role accessing a resource whose customer_id != X-User-ID" }
  # --- Existence / schema / OCC ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, invalid range (spec_min > spec_max, readings < 3, empty limits, duplicate analyte in one sample, transporter_name missing at ship)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  # --- State machine ---
  - { id: ERR_WORK_ORDER_NOT_RECEIVED, http: 409, condition: "prepare requires status RECEIVED" }
  - { id: ERR_WORK_ORDER_NOT_ROUTABLE, http: 409, condition: "route requires status READY_FOR_ROUTING or ROUTE_HELD" }
  - { id: ERR_WORK_ORDER_NOT_ROUTED, http: 409, condition: "load-runs requires status ROUTED" }
  - { id: ERR_WORK_ORDER_NOT_AWAITING_INSPECTION, http: 409, condition: "inspections requires status AWAITING_INSPECTION" }
  - { id: ERR_WORK_ORDER_NOT_REJECTED, http: 409, condition: "start-strip requires status REJECTED" }
  - { id: ERR_WORK_ORDER_NOT_STRIPPING, http: 409, condition: "complete-strip requires status STRIPPING" }
  - { id: ERR_WORK_ORDER_NOT_COMPLETE, http: 409, condition: "ship requires status COMPLETE" }
  - { id: ERR_WORK_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel not permitted from this state for this actor (owner: early states only; manager: late states; IN_PROCESS/COMPLETE+/terminal: nobody)" }
  - { id: ERR_WORK_ORDER_NOT_AWAITING_LOT_TEST, http: 409, condition: "salt-spray lot create requires status AWAITING_LOT_TEST" }
  - { id: ERR_LOAD_RUN_NOT_RUNNING, http: 409, condition: "complete/abort requires load run RUNNING" }
  - { id: ERR_LOT_NOT_RUNNING, http: 409, condition: "evaluate requires lot result PENDING" }
  - { id: ERR_BATH_NOT_ACTIVE, http: 409, condition: "operation requires bath status ACTIVE (load start, quarantine)" }
  - { id: ERR_BATH_OCCUPIED, http: 409, condition: "Bath already has a RUNNING load run, or a RUNNING load blocks dump" }
  - { id: ERR_BATH_NOT_QUARANTINED, http: 409, condition: "release-quarantine requires status QUARANTINED" }
  - { id: ERR_BATH_NOT_DUMPED, http: 409, condition: "renew requires status DUMPED" }
  - { id: ERR_BATH_NOT_DOSABLE, http: 409, condition: "dose/titration on EXHAUSTED, DUMPED, or DECOMMISSIONED bath" }
  - { id: ERR_BATH_NOT_DUMPABLE, http: 409, condition: "dump from DUMPED or DECOMMISSIONED bath" }
  - { id: ERR_MANIFEST_NOT_DRAFT, http: 409, condition: "line-item add/remove or finalize requires manifest DRAFT" }
  - { id: ERR_MANIFEST_NOT_FINALIZED, http: 409, condition: "ship requires manifest FINALIZED" }
  - { id: ERR_MANIFEST_NOT_SHIPPED, http: 409, condition: "receive requires manifest SHIPPED" }
  - { id: ERR_PERMIT_NOT_EXCEEDED, http: 409, condition: "clear-exceedance requires permit EXCEEDED" }
  # --- Business safety ---
  - { id: ERR_ALLOY_BATH_INCOMPATIBLE, http: 422, condition: "No compatibility rule for (alloy_code, process_type, chemistry_family) — fail-closed default — or rule is INCOMPATIBLE" }
  - { id: ERR_PREDIP_REQUIRED, http: 422, condition: "Compatibility CONDITIONAL and work order predip_completed == false at load start" }
  - { id: ERR_BATH_CONCENTRATION_OUT_OF_BAND, http: 422, condition: "current_concentration_g_l is null or outside [low, high] inclusive at route/load-start/release" }
  - { id: ERR_DOSE_VERIFICATION_PENDING, http: 422, condition: "A dose was recorded after the last titration; load start and quarantine release blocked until re-titration" }
  - { id: ERR_DISCHARGE_EXCEEDANCE_HOLD, http: 409, condition: "Manifest finalize or exceedance-caused bath release blocked while a permit has exceedance_active == true" }
  # --- Business temporal ---
  - { id: ERR_SAMPLE_OUTSIDE_PERMIT_WINDOW, http: 409, condition: "sampled_at outside [effective_from, effective_to] closed interval" }
  - { id: ERR_SAMPLE_MONTH_REGRESSION, http: 409, condition: "Sample's calendar month earlier than permit's current_month" }
  - { id: ERR_PERMIT_WINDOW_OVERLAP, http: 409, condition: "New permit's closed window [from, to] intersects an existing permit's closed window for the same outfall; sharing a boundary date counts as overlap" }
  - { id: ERR_FIXTURE_OCCUPIED, http: 409, condition: "Another RUNNING load references the fixture; half-open intervals: a load starting exactly at the previous load's ended_at is allowed" }
  - { id: ERR_LOT_HOURS_INSUFFICIENT, http: 409, condition: "evaluate with hours_run < hours_required" }
  # --- Business constraint ---
  - { id: ERR_PROCESS_TYPE_MISMATCH, http: 422, condition: "Bath process_type differs from work order process_type at route" }
  - { id: ERR_ROUTING_MODE_NOT_SUPPORTED, http: 422, condition: "Work order routing_mode not in bath.routing_modes_supported" }
  - { id: ERR_FIXTURE_ROUTING_MODE_MISMATCH, http: 422, condition: "RACK order with BARREL fixture (or vice versa), or fixture_id supplied for BARREL order" }
  - { id: ERR_FIXTURE_CAPACITY_INSUFFICIENT, http: 422, condition: "fixture.capacity_dm2 < surface_area_total_dm2" }
  - { id: ERR_DOSE_NOT_NEEDED, http: 422, condition: "Dose while current_concentration_g_l >= target_concentration_g_l" }
  - { id: ERR_MANIFEST_EMPTY, http: 422, condition: "Finalize with zero line items" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Finalizer X-User-ID equals manifest created_by_user_id (applies to every role)" }
  - { id: ERR_DUPLICATE_COMPATIBILITY_RULE, http: 409, condition: "Rule with same (alloy_code, process_type, chemistry_family) exists" }
  - { id: ERR_MASKING_MINUTES_REQUIRED, http: 422, condition: "prepare on requires_masking order without masking_minutes, or masking_minutes supplied when not required" }
  # --- Business fiscal / capacity ---
  - { id: ERR_BATH_LIFE_INSUFFICIENT, http: 409, condition: "Route-time check: effective_remaining_ah (chemistry-adjusted) < planned estimate" }
  - { id: ERR_BATH_CAPACITY_EXCEEDED, http: 409, condition: "Load-start check: amp_hour_used + amp_hour_reserved + estimated_amp_hours > amp_hour_capacity (equality allowed)" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Customer credit_hold == true at route, load start, or ship" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 403, condition: "Customer status SUSPENDED blocks new work orders, routing, load start, ship" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Job shop client; sees and manages only its own work orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /work-orders — create own work order (body customer_id must equal X-User-ID)"
      - "POST /work-orders/{id}/cancel — owner cancel from early states"
    shared_operations:
      - "PATCH /work-orders/{id} — amend own order while RECEIVED (shared with ShopManager)"
      - "GET /work-orders, /work-orders/{id} and child lists — own orders only"
      - "GET /customers — sees only own record"
  - name: LineOperator
    description: "Shop floor operator: routing, load runs, strips, shipping, preparation"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/prepare, /complete-predip, /route, /load-runs, /start-strip, /complete-strip, /ship"
      - "POST /load-runs/{id}/complete, /abort"
    shared_operations:
      - "GET on baths, fixtures, work orders, load runs, inspections, lots, permits, samples, manifests (staff-wide reads)"
  - name: LabChemist
    description: "Wet lab: titrations, dosing, alloy compatibility rules, salt spray testing"
    identity: "opaque"
    exclusive_operations:
      - "POST /baths/{id}/titrations, /doses"
      - "POST /alloy-compatibility-rules; DELETE /alloy-compatibility-rules/{id}"
      - "POST /salt-spray-lots; POST /salt-spray-lots/{id}/evaluate"
    shared_operations:
      - "Staff-wide GETs"
  - name: QCInspector
    description: "Quality control: thickness/defect inspection and disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/inspections"
    shared_operations:
      - "Staff-wide GETs"
  - name: EHSOfficer
    description: "Environmental health & safety: discharge permits, samples, manifests, quarantine"
    identity: "opaque"
    exclusive_operations:
      - "POST /discharge-permits, /discharge-permits/{id}/samples, /clear-exceedance"
      - "POST /waste-manifests, /line-items, /finalize, /ship, /receive; DELETE line-items"
    shared_operations:
      - "POST /baths/{id}/quarantine, /release-quarantine (shared with ShopManager)"
      - "Staff-wide GETs"
  - name: ShopManager
    description: "Hierarchical override: allowed on every endpoint; sole actor for customers, fixtures, baths create/dump/renew, late-state cancel. Segregation-of-duties on manifest finalize binds ShopManager too."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers; PATCH /customers/{id}"
      - "POST /fixtures"
      - "POST /baths; POST /baths/{id}/dump; POST /baths/{id}/renew"
      - "POST /work-orders/{id}/cancel — late-state manager cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Every other endpoint (superset of all staff roles), subject to ERR_SEGREGATION_OF_DUTIES on manifest finalize"




