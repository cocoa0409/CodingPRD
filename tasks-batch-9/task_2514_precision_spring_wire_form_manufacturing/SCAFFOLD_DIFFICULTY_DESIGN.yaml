        cascade_depth: 5
        grounds:
          - state_machines.ProductionRun.OPEN_to_SPC_HOLD
          - state_machines.ShipmentLot.ALLOCATED_to_QUARANTINED
          - entities.CustomerProgram.fields.quarantined_lot_count
          - entities.CustomerProgram.fields.allocated_pieces
          - entities.CustomerProgram.fields.open_commitment_pieces
          - calculations.program_delivery_posture
          - calculations.process_capability
        distinguishing_aspect: |
          One POST /production-runs/{id}/inspections call must ripple five entity hops deep on the QUALITY axis:
          InspectionRecord OUT_OF_CONTROL (hop 1) -> ProductionRun.quality_status SPC_HOLD (hop 2) -> every
