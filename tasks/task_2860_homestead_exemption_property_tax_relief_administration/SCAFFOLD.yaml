# =============================================================================
# PRD Benchmark Scaffold — Homestead Exemption & Property Tax Relief Administration
# County Assessor — Exemptions Unit
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  2860. Homestead Exemption & Property Tax Relief Administration (county assessor exemptions unit):
  application intake with residency, ownership and occupancy verification against multiple data
  sources, exemption type determination across homestead, senior, veteran, disability and
  agricultural classifications, income-tested relief programs with annual recertification and asset
  limits, assessment cap or valuation freeze application and portability between properties,
  retroactive exemption claims and refund calculation with statutory limits, exemption fraud
  detection through address and registration cross-matching, penalty and back-tax recovery on
  improperly claimed exemptions, notice, appeal and hearing rights

domain_name: homestead-exemption-relief
api_prefix: ""   # flat top-level collections; every path is absolute (e.g. /exemption-grants/{id})

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by explicit foreign keys; no nesting in URL paths except
  # reverse-reachability sub-resource reads. Parcel, TaxpayerAccount, ReliefProgram,
  # ExemptionApplication, ExemptionGrant and FraudCase are all top-level collections.

  state_machine_shape: cyclic
  # ExemptionApplication loops UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW (bounded rounds);
  # Appeal loops SCHEDULED -> CONTINUED -> SCHEDULED; ExemptionGrant loops ACTIVE -> SUSPENDED ->
  # ACTIVE; FraudCase carries two independent status dimensions on one row
  # (investigation_status and recovery_status advance on separate axes).

  relationship_patterns:
    - one_to_many          # Parcel -> OwnershipRecord, ExemptionApplication, ExemptionGrant
    - self_referential     # ExemptionGrant.ported_from_grant_id -> ExemptionGrant.id (portability chain)
    - polymorphic          # Notice.subject_id resolves by Notice.subject_type
    - cross_aggregate      # FraudCase -> ExemptionGrant -> Parcel value ledger

  role_model: segregation_of_duties
  # The clerk who intook an application may not determine it; the investigator who substantiated a
  # fraud case may not collect or abate on it; the reviewer who determined an application may not
  # decide the appeal against the resulting notice.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 44 endpoints / 55 errors / 7 calculations / 6 state machines / 34 validations.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------

entities:

  - name: ReliefProgram
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - { name: program_code, type: enum, source: input, description: "Statutory exemption classification.", constraints: "one of HOMESTEAD_BASIC, SENIOR_FREEZE, VETERAN_DISABILITY, DISABILITY_INCOME, AGRICULTURAL_USE; unique across ReliefProgram rows" }
      - { name: name, type: string, source: input, description: "Human-readable program name." }
      - { name: relief_pct_bps, type: integer, source: input, description: "Share of assessed value exempted before caps, in basis points.", constraints: "1 <= relief_pct_bps <= 10000" }
      - { name: max_exempt_value_cents, type: integer, source: input, description: "Hard ceiling on the exempted value produced by this program for one parcel.", constraints: ">= 0" }
      - { name: income_limit_cents, type: integer, source: input, description: "Annual household income ceiling for eligibility; null when the program is not income-tested.", default: null }
      - { name: asset_limit_cents, type: integer, source: input, description: "Countable-asset ceiling; null when the program applies no asset test.", default: null }
      - { name: requires_income_certification, type: boolean, source: input, description: "When true a CERTIFIED IncomeCertification for the application tax year is a determination precondition.", default: false }
      - { name: recertification_required, type: boolean, source: input, description: "When true the taxpayer must recertify income every year or the grant is suspended by the annual roll.", default: false }
      - { name: freeze_enabled, type: boolean, source: input, description: "When true an approved grant freezes the parcel assessed value at the approval-time assessed value.", default: false }
      - { name: statutory_lookback_years, type: integer, source: input, description: "Maximum number of full tax years a retroactive claim may reach back from its filing tax year.", constraints: "0 <= statutory_lookback_years <= 5" }
      - { name: penalty_pct_bps, type: integer, source: input, description: "Penalty rate applied to each improper tax year back tax amount.", constraints: ">= 0" }
      - { name: interest_pct_bps_per_year, type: integer, source: input, description: "Simple interest rate per elapsed year on recovery back tax.", constraints: ">= 0" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall order in which this program's benefit is applied against a parcel assessed value; lower rank applies first.", constraints: "1 <= priority_rank <= 99; unique across ReliefProgram rows" }
      - { name: status, type: enum, source: system, description: "Program lifecycle; only OPEN programs accept new applications.", default: "OPEN", constraints: "one of OPEN, CLOSED" }

  - name: Parcel
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: apn, type: string, source: input, description: "Assessor parcel number.", constraints: "unique across Parcel rows" }
      - { name: situs_address_normalized, type: string, source: input, description: "Upper-cased whitespace-collapsed street address used for every registry cross-match." }
      - { name: county_zone, type: enum, source: input, description: "Taxing zone the parcel sits in.", constraints: "one of NORTH, SOUTH, EAST, WEST" }
      - { name: tax_year, type: integer, source: input, description: "Tax year the currently published values belong to.", constraints: "2015 <= tax_year <= 2100" }
      - { name: base_year, type: integer, source: input, description: "Year the base-year value was established for assessment-cap purposes.", constraints: "base_year <= tax_year" }
      - { name: base_year_value_cents, type: integer, source: input, description: "Base-year value the assessment cap grows from.", constraints: ">= 0" }
      - { name: market_value_cents, type: integer, source: input, description: "Current appraised market value.", constraints: ">= 0" }
      - { name: assessment_cap_pct_bps, type: integer, source: input, description: "Annual growth cap applied to the base-year value, in basis points per elapsed year.", default: 200, constraints: "0 <= assessment_cap_pct_bps <= 2000" }
      - { name: capped_value_cents, type: integer, source: computed, description: "Base-year value grown by the cap for elapsed years; see calculations.parcel_value_decomposition." }
      - { name: assessed_value_cents, type: integer, source: computed, description: "Taxable basis after cap and after any active valuation freeze; see calculations.parcel_value_decomposition." }
      - { name: exempt_value_cents, type: integer, source: computed, description: "Total value absorbed by ACTIVE exemption grants under the waterfall." }
      - { name: taxable_value_cents, type: integer, source: computed, description: "assessed_value_cents - exempt_value_cents; never negative." }
      - { name: exemption_status, type: enum, source: computed, description: "Derived exemption posture of the parcel.", default: "UNEXEMPTED", constraints: "one of UNEXEMPTED, PARTIALLY_EXEMPT, FULLY_EXEMPT" }

  - name: TaxpayerAccount
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: full_name, type: string, source: input, description: "Claimant legal name." }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 calendar date used for the senior age test.", constraints: "YYYY-MM-DD" }
      - { name: ssn_last4, type: string, source: input, description: "Last four digits of the taxpayer identification number used for registry cross-matching.", constraints: "exactly 4 digits" }
      - { name: mailing_address_normalized, type: string, source: input, description: "Upper-cased whitespace-collapsed mailing address of record." }
      - { name: disability_rating_pct_bps, type: integer, source: input, description: "Adjudicated service-connected disability rating in basis points; multiplies the veteran benefit.", default: 0, constraints: "0 <= disability_rating_pct_bps <= 10000" }
      - { name: lifetime_refund_cents, type: integer, source: computed, description: "Sum of total_payable_cents over this taxpayer's APPROVED RetroactiveClaim rows, less reversals.", default: 0 }
      - { name: lifetime_recovery_collected_cents, type: integer, source: computed, description: "Sum of recovery_paid_cents over this taxpayer's FraudCase rows, less abated collections.", default: 0 }
      - { name: net_relief_cents, type: integer, source: computed, description: "lifetime_refund_cents - lifetime_recovery_collected_cents; the conserved money ledger." }
      - { name: status, type: enum, source: system, description: "Account posture; FLAGGED while any FraudCase with investigation_status OPEN exists for the taxpayer.", default: "GOOD_STANDING", constraints: "one of GOOD_STANDING, FLAGGED, BARRED" }

  - name: OwnershipRecord
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel this ownership and occupancy interval describes." }
      - { name: taxpayer_id, type: string, source: input, description: "FK -> TaxpayerAccount.id; the owner-occupant of record." }
      - { name: ownership_pct_bps, type: integer, source: input, description: "Undivided ownership share held by this taxpayer, in basis points; pro-rates every benefit.", constraints: "1 <= ownership_pct_bps <= 10000" }
      - { name: deed_recorded_date, type: string, source: input, description: "ISO 8601 calendar date the deed was recorded.", constraints: "YYYY-MM-DD" }
      - { name: occupancy_type, type: enum, source: input, description: "Occupancy claimed for this interval.", constraints: "one of PRIMARY_RESIDENCE, SECONDARY, RENTAL, AGRICULTURAL" }
      - { name: occupancy_start_date, type: string, source: input, description: "Inclusive first day of the occupancy interval.", constraints: "YYYY-MM-DD" }
      - { name: occupancy_end_date, type: string, source: input, description: "Exclusive last day of the occupancy interval; null means open-ended.", default: null, constraints: "YYYY-MM-DD when present; must be strictly after occupancy_start_date" }
      - { name: source_system, type: enum, source: input, description: "Data source the record was ingested from.", constraints: "one of DEED_REGISTRY, FIELD_INSPECTION, TAXPAYER_AFFIDAVIT" }
      - { name: status, type: enum, source: system, description: "VERIFIED when source_system is DEED_REGISTRY or FIELD_INSPECTION at creation, otherwise UNVERIFIED; SUPERSEDED when a later record closes it.", default: "UNVERIFIED", constraints: "one of UNVERIFIED, VERIFIED, SUPERSEDED" }

  - name: ExemptionApplication
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the property the exemption is claimed on." }
      - { name: taxpayer_id, type: string, source: input, description: "FK -> TaxpayerAccount.id; the claimant." }
      - { name: program_id, type: string, source: input, description: "FK -> ReliefProgram.id; the classification applied for." }
      - { name: tax_year, type: integer, source: input, description: "Tax year the exemption is claimed for.", constraints: "2015 <= tax_year <= 2100" }
      - { name: claimed_occupancy_date, type: string, source: input, description: "ISO 8601 calendar date the claimant asserts occupancy began.", constraints: "YYYY-MM-DD" }
      - { name: claimed_address_normalized, type: string, source: input, description: "Address the claimant asserts as primary residence; cross-matched against registry records." }
      - { name: intake_user_id, type: string, source: system, description: "X-User-ID of the IntakeClerk that created the application; the segregation-of-duties bar for determination." }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of the ExemptionsReviewer that issued the determination; null until determined.", default: null }
      - { name: info_request_round, type: integer, source: computed, description: "Count of REQUEST_INFO determinations issued on this application.", default: 0, constraints: "0 <= info_request_round <= 2" }
      - { name: status, type: enum, source: system, description: "Application lifecycle state.", default: "DRAFT", constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED" }
      - { name: denial_reason, type: string, source: system, description: "Populated on DENIED determinations with the deciding error condition or reviewer note.", default: null }
      - { name: resulting_grant_id, type: string, source: system, description: "Back-reference to the ExemptionGrant minted by the APPROVE determination; mirrors ExemptionGrant.application_id and resolves against ExemptionGrant.id. Null until approved.", default: null }

  - name: VerificationCheck
    parent: null
    common_fields: false
    kind: event
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> ExemptionApplication.id; the application this check was run for." }
      - { name: source, type: enum, source: input, description: "External data source consulted.", constraints: "one of VOTER_REGISTRY, DMV, USPS_NCOA, INCOME_DOR, DEED_REGISTRY" }
      - { name: result, type: enum, source: computed, description: "MATCH when the latest registry record for this source agrees with the application claim, MISMATCH when it disagrees, NO_RECORD when no record exists for the taxpayer and source.", constraints: "one of MATCH, MISMATCH, NO_RECORD" }
      - { name: observed_value, type: string, source: computed, description: "Registry value that was compared, or the empty string when NO_RECORD." }
      - { name: expected_value, type: string, source: computed, description: "Application-claimed value the registry value was compared against." }
      - { name: checked_at, type: datetime, source: system, description: "Logical-clock instant the check was recorded; ISO 8601 UTC with three fractional digits." }

  - name: IncomeCertification
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> TaxpayerAccount.id; the certifying household head." }
      - { name: certification_year, type: integer, source: input, description: "Tax year the income and asset figures apply to.", constraints: "2015 <= certification_year <= 2100" }
      - { name: household_income_cents, type: integer, source: input, description: "Total household income declared for certification_year.", constraints: ">= 0" }
      - { name: countable_asset_cents, type: integer, source: input, description: "Countable non-residence assets declared for certification_year.", constraints: ">= 0" }
      - { name: household_size, type: integer, source: input, description: "Number of household members.", constraints: "1 <= household_size <= 20" }
      - { name: recertification_due_date, type: string, source: input, description: "Inclusive ISO 8601 calendar date by which the next certification must be on file.", constraints: "YYYY-MM-DD" }
      - { name: relief_tier, type: enum, source: computed, description: "Income band derived by calculations.income_relief_tier against the program consuming this certification at determination time; NOT_ASSESSED until a determination consumes it.", default: "NOT_ASSESSED", constraints: "one of NOT_ASSESSED, TIER_FULL, TIER_HIGH, TIER_PARTIAL" }
      - { name: relief_multiplier_bps, type: integer, source: computed, description: "Multiplier implied by relief_tier; 0 while NOT_ASSESSED.", default: 0, constraints: "one of 0, 5000, 7500, 10000" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle state.", default: "PENDING", constraints: "one of PENDING, CERTIFIED, LAPSED, REVOKED" }

  - name: ExemptionGrant
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> ExemptionApplication.id; the approved application that minted this grant." }
      - { name: parcel_id, type: string, source: system, description: "FK -> Parcel.id; the parcel whose value this grant reduces." }
      - { name: taxpayer_id, type: string, source: system, description: "FK -> TaxpayerAccount.id; the beneficiary." }
      - { name: program_id, type: string, source: system, description: "FK -> ReliefProgram.id; the classification granted." }
      - { name: ported_from_grant_id, type: string, source: system, description: "FK -> ExemptionGrant.id; the source grant a portability transfer carved this grant out of, null for originally determined grants.", default: null }
      - { name: exemption_type, type: enum, source: system, description: "Snapshot of ReliefProgram.program_code at approval.", constraints: "one of HOMESTEAD_BASIC, SENIOR_FREEZE, VETERAN_DISABILITY, DISABILITY_INCOME, AGRICULTURAL_USE" }
      - { name: effective_tax_year, type: integer, source: system, description: "First tax year the grant reduces value for." }
      - { name: first_eligible_tax_year, type: integer, source: system, description: "Earliest tax year a retroactive claim on this grant may reach; set from the verified occupancy start year at approval." }
      - { name: ownership_pct_bps_snapshot, type: integer, source: system, description: "OwnershipRecord.ownership_pct_bps captured at approval; pro-rates benefit_amount_cents." }
      - { name: relief_multiplier_bps, type: integer, source: system, description: "Income-tier multiplier captured at approval; 10000 when the program is not income-tested.", default: 10000 }
      - { name: benefit_amount_cents, type: integer, source: computed, description: "Program benefit for this grant before the parcel waterfall; see calculations.exemption_benefit_amount." }
      - { name: applied_exempt_value_cents, type: integer, source: computed, description: "Portion of benefit_amount_cents actually absorbed by the parcel waterfall; may be less than benefit_amount_cents when the parcel runs out of assessed value." }
      - { name: frozen_value_cents, type: integer, source: computed, description: "Parcel assessed value frozen at approval when the program has freeze_enabled true, else null.", default: null }
      - { name: portable_balance_cents, type: integer, source: computed, description: "Unported remainder of frozen_value_cents available for transfer to another parcel; null when the program is not freeze-enabled.", default: null }
      - { name: benefit_status, type: enum, source: system, description: "Grant lifecycle state; only ACTIVE grants enter the parcel waterfall.", default: "ACTIVE", constraints: "one of ACTIVE, SUSPENDED, REVOKED, TRANSFERRED, LAPSED" }
      - { name: suspension_reason, type: enum, source: system, description: "Why the grant is currently SUSPENDED; null when not suspended.", default: null, constraints: "one of FRAUD_INVESTIGATION, RECERTIFICATION_LAPSE, OCCUPANCY_LOST" }

  - name: RetroactiveClaim
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> ExemptionGrant.id; the grant whose benefit is claimed for prior years." }
      - { name: filing_tax_year, type: integer, source: input, description: "Tax year the claim is filed in; the statutory lookback is measured from it.", constraints: "2015 <= filing_tax_year <= 2100" }
      - { name: requested_start_tax_year, type: integer, source: input, description: "Earliest tax year the claimant asks to be refunded for.", constraints: "2015 <= requested_start_tax_year <= filing_tax_year" }
      - { name: first_eligible_tax_year, type: integer, source: computed, description: "Earliest year that survives the statutory lookback and the grant first_eligible_tax_year floor." }
      - { name: last_eligible_tax_year, type: integer, source: computed, description: "filing_tax_year - 1; the current year is served by the grant itself." }
      - { name: eligible_year_count, type: integer, source: computed, description: "Number of closed-interval years between first_eligible_tax_year and last_eligible_tax_year inclusive." }
      - { name: gross_refund_cents, type: integer, source: computed, description: "Provisional variant output computed at filing; see calculations.retroactive_refund_amount." }
      - { name: offset_applied_cents, type: integer, source: computed, description: "Outstanding recovery balance absorbed by the refund at approval time.", default: 0 }
      - { name: net_refund_cents, type: integer, source: computed, description: "Final variant refund principal after the recovery offset waterfall.", default: 0 }
      - { name: refund_interest_cents, type: integer, source: computed, description: "Statutory refund interest on the un-offset per-year remainders.", default: 0 }
      - { name: total_payable_cents, type: integer, source: computed, description: "net_refund_cents + refund_interest_cents.", default: 0 }
      - { name: status, type: enum, source: system, description: "Claim lifecycle state.", default: "PENDING", constraints: "one of PENDING, APPROVED, DENIED, REVERSED" }

  - name: FraudCase
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> TaxpayerAccount.id; the subject of the investigation." }
      - { name: grant_id, type: string, source: input, description: "FK -> ExemptionGrant.id; the grant alleged to be improperly claimed." }
      - { name: improper_start_tax_year, type: integer, source: input, description: "First tax year alleged to be improperly exempted.", constraints: "improper_start_tax_year <= improper_end_tax_year" }
      - { name: improper_end_tax_year, type: integer, source: input, description: "Last tax year alleged to be improperly exempted." }
      - { name: assessment_tax_year, type: integer, source: input, description: "Tax year the recovery is assessed in; interest accrues from each improper year to it." }
      - { name: screening_risk_score, type: integer, source: computed, description: "Snapshot variant score at case open; see calculations.fraud_risk_score.", constraints: "0 <= screening_risk_score <= 100" }
      - { name: adjudication_risk_score, type: integer, source: computed, description: "Replay variant score computed at substantiation; see calculations.fraud_risk_score.", default: 0, constraints: "0 <= adjudication_risk_score <= 100" }
      - { name: investigation_status, type: enum, source: system, description: "First status dimension; advances independently of recovery_status.", default: "OPEN", constraints: "one of OPEN, SUBSTANTIATED, CLEARED" }
      - { name: recovery_status, type: enum, source: system, description: "Second status dimension on the same row; tracks the money ledger independently of investigation_status.", default: "NONE", constraints: "one of NONE, ASSESSED, PARTIALLY_PAID, PAID, ABATED" }
      - { name: back_tax_cents, type: integer, source: computed, description: "Sum of per-year rounded back tax; see calculations.recovery_assessment_total.", default: 0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Sum of per-year rounded penalties.", default: 0 }
      - { name: interest_cents, type: integer, source: computed, description: "Sum of per-year rounded interest.", default: 0 }
      - { name: total_assessed_cents, type: integer, source: computed, description: "back_tax_cents + penalty_cents + interest_cents; frozen at substantiation and never re-accrued.", default: 0 }
      - { name: recovery_paid_cents, type: integer, source: computed, description: "Cumulative collected amount against total_assessed_cents.", default: 0 }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the FraudInvestigator that opened the case." }
      - { name: substantiated_by_user_id, type: string, source: system, description: "X-User-ID of the FraudInvestigator that substantiated the case; the segregation-of-duties bar for recovery actions.", default: null }

  - name: Notice
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: taxpayer_id, type: string, source: system, description: "FK -> TaxpayerAccount.id; the noticed party." }
      - { name: subject_type, type: enum, source: system, description: "Entity type the polymorphic subject_id resolves against.", constraints: "one of EXEMPTION_APPLICATION, EXEMPTION_GRANT, RETROACTIVE_CLAIM, FRAUD_CASE" }
      - { name: subject_id, type: string, source: system, description: "Polymorphic subject identifier; resolves to ExemptionApplication.id when subject_type is EXEMPTION_APPLICATION, ExemptionGrant.id when EXEMPTION_GRANT, RetroactiveClaim.id when RETROACTIVE_CLAIM, FraudCase.id when FRAUD_CASE." }
      - { name: notice_type, type: enum, source: system, description: "Statutory notice class.", constraints: "one of DENIAL, SUSPENSION, REVOCATION, RECOVERY_ASSESSMENT, REFUND_DETERMINATION" }
      - { name: mailed_at, type: datetime, source: system, description: "Logical-clock instant the notice was issued; ISO 8601 UTC with three fractional digits." }
      - { name: appeal_deadline, type: datetime, source: computed, description: "mailed_at plus APPEAL_WINDOW_DAYS; appeals filed at exactly this instant are still timely." }
      - { name: appealable, type: boolean, source: system, description: "False for REFUND_DETERMINATION notices issued on APPROVED retroactive claims (no adverse action to challenge); true for every other notice.", default: true }
      - { name: body_summary, type: string, source: system, description: "Short machine-generated description of the noticed action." }

  - name: HearingDocket
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: docket_date, type: string, source: input, description: "ISO 8601 calendar date of the hearing session.", constraints: "YYYY-MM-DD" }
      - { name: session_start_utc, type: datetime, source: input, description: "Inclusive earliest hearing start instant on this docket; ISO 8601 UTC." }
      - { name: session_end_utc, type: datetime, source: input, description: "Inclusive latest hearing end instant on this docket; ISO 8601 UTC." }
      - { name: capacity, type: integer, source: input, description: "Maximum number of appeals that may hold slots on this docket.", constraints: "1 <= capacity <= 20" }
      - { name: scheduled_appeal_count, type: integer, source: computed, description: "Count of Appeal rows whose docket_id is this docket and whose status is one of SCHEDULED, GRANTED, DENIED, DISMISSED; a CONTINUED appeal releases its slot.", default: 0 }
      - { name: status, type: enum, source: system, description: "Docket posture; only OPEN dockets accept scheduling.", default: "OPEN", constraints: "one of OPEN, CLOSED" }

  - name: Appeal
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: notice_id, type: string, source: input, description: "FK -> Notice.id; the noticed action being challenged." }
      - { name: taxpayer_id, type: string, source: system, description: "FK -> TaxpayerAccount.id; copied from the notice." }
      - { name: docket_id, type: string, source: system, description: "FK -> HearingDocket.id; null until scheduled.", default: null }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the appeal was filed; ISO 8601 UTC with three fractional digits." }
      - { name: grounds, type: string, source: input, description: "Taxpayer statement of grounds." }
      - { name: hearing_start_utc, type: datetime, source: system, description: "Inclusive start of the reserved hearing interval; null until scheduled.", default: null }
      - { name: hearing_end_utc, type: datetime, source: system, description: "Inclusive end of the reserved hearing interval; null until scheduled.", default: null }
      - { name: continuance_count, type: integer, source: computed, description: "Number of CONTINUE decisions issued on this appeal.", default: 0, constraints: "0 <= continuance_count <= 2" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the HearingOfficer that issued the final decision; null until decided.", default: null }
      - { name: status, type: enum, source: system, description: "Appeal lifecycle state.", default: "FILED", constraints: "one of FILED, SCHEDULED, CONTINUED, GRANTED, DENIED, DISMISSED" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------

state_machines:

  - entity: ExemptionApplication
    initial_state: DRAFT
    terminal_states: [APPROVED]
    shape: "cyclic — UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, bounded by MAX_INFO_REQUEST_ROUNDS = 2"
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exemption-applications/{id}/submit"
        actor: IntakeClerk
        preconditions:
          - "application.status == DRAFT"
          - "program.status == OPEN"
          - "taxpayer.status IN {GOOD_STANDING, FLAGGED} (BARRED taxpayers rejected with ERR_TAXPAYER_BARRED)"
          - "no other ExemptionApplication exists with the same parcel_id, program_id and tax_year whose status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
        side_effects:
          - "application.updated_at refreshed and application.version incremented by 1"
        note: "Verification is not run here; the reviewer or clerk records checks explicitly."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system event: first VerificationCheck row recorded for the application by POST /exemption-applications/{id}/verification-checks"
        actor: system
        preconditions:
          - "application.status == SUBMITTED"
          - "the VerificationCheck being recorded is the first row with application_id == application.id"
        side_effects:
          - "application.status becomes UNDER_REVIEW and application.version incremented by 1"
        note: "Auto-transition; recording a second and later check leaves status UNDER_REVIEW untouched."

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /exemption-applications/{id}/determine with outcome REQUEST_INFO"
        actor: ExemptionsReviewer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.info_request_round < MAX_INFO_REQUEST_ROUNDS (2)"
          - "X-User-ID != application.intake_user_id (segregation of duties)"
          - "payload.expected_parcel_version == parcel.version"
        side_effects:
          - "application.info_request_round incremented by 1"
          - "application.version incremented by 1; Parcel.version NOT incremented on this outcome"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /exemption-applications/{id}/respond-info"
        actor: Taxpayer
        preconditions:
          - "application.status == INFO_REQUESTED"
          - "X-User-ID == application.taxpayer_id"
        side_effects:
          - "application.claimed_address_normalized and application.claimed_occupancy_date replaced by the supplied values"
          - "application.version incremented by 1"
        note: "Closes the review cycle; the reviewer may request information at most twice."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /exemption-applications/{id}/determine with outcome APPROVE"
        actor: ExemptionsReviewer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID != application.intake_user_id (segregation of duties)"
          - "payload.expected_parcel_version == parcel.version"
          - "an OwnershipRecord exists with parcel_id == application.parcel_id, taxpayer_id == application.taxpayer_id, status == VERIFIED, occupancy_type == PRIMARY_RESIDENCE for HOMESTEAD_BASIC, SENIOR_FREEZE, VETERAN_DISABILITY and DISABILITY_INCOME programs (occupancy_type == AGRICULTURAL for AGRICULTURAL_USE), whose interval [occupancy_start_date, occupancy_end_date) covers January 1 of application.tax_year"
          - "VerificationCheck rows exist for this application with source VOTER_REGISTRY and source DEED_REGISTRY, and for each of those two sources the latest row (checked_at DESC, tie-break created_at DESC) has result == MATCH"
          - "when program.requires_income_certification is true: an IncomeCertification exists with taxpayer_id == application.taxpayer_id, certification_year == application.tax_year and status == CERTIFIED"
          - "when program.income_limit_cents is not null: certification.household_income_cents <= program.income_limit_cents"
          - "when program.asset_limit_cents is not null: certification.countable_asset_cents <= program.asset_limit_cents"
          - "when program.program_code == SENIOR_FREEZE: the taxpayer reaches SENIOR_MIN_AGE (65) on or before January 1 of application.tax_year"
          - "when program.program_code == VETERAN_DISABILITY: taxpayer.disability_rating_pct_bps > 0"
          - "no ExemptionGrant exists with the same parcel_id, program_id and effective_tax_year whose benefit_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "CASCADE L1: a new ExemptionGrant row is created (benefit_status ACTIVE, effective_tax_year = application.tax_year, ownership_pct_bps_snapshot from the verified OwnershipRecord, relief_multiplier_bps from calculations.income_relief_tier or 10000, first_eligible_tax_year = calendar year of the verified occupancy_start_date, benefit_amount_cents from calculations.exemption_benefit_amount); when program.freeze_enabled is true, grant.frozen_value_cents and grant.portable_balance_cents are both set to the parcel assessed_value_cents observed at approval"
          - "CASCADE L2: the new grant entering the ACTIVE set forces calculations.parcel_value_decomposition to re-run for the parcel, rewriting parcel.capped_value_cents, parcel.assessed_value_cents, parcel.exempt_value_cents, parcel.taxable_value_cents and every ACTIVE grant's applied_exempt_value_cents on that parcel"
          - "CASCADE L3: the rewritten parcel.exempt_value_cents forces parcel.exemption_status to be re-derived (UNEXEMPTED / PARTIALLY_EXEMPT / FULLY_EXEMPT) and increments Parcel.version by 1"
          - "when the program consumed an IncomeCertification, that certification's relief_tier and relief_multiplier_bps are written from calculations.income_relief_tier"
          - "application.determined_by_user_id set to X-User-ID; application.version incremented by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /exemption-applications/{id}/determine with outcome DENY"
        actor: ExemptionsReviewer
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID != application.intake_user_id (segregation of duties)"
          - "payload.expected_parcel_version == parcel.version"
        side_effects:
          - "application.denial_reason set from payload.denial_reason; application.determined_by_user_id set to X-User-ID"
          - "CASCADE L1: a Notice row is created with notice_type DENIAL, subject_type EXEMPTION_APPLICATION, subject_id == application.id, taxpayer_id == application.taxpayer_id, mailed_at == the logical clock instant and appealable true"
          - "CASCADE L2: the new notice's appeal_deadline is computed as mailed_at + APPEAL_WINDOW_DAYS (30 days), which is what later gates POST /appeals"
          - "application.version incremented by 1; Parcel.version NOT incremented on this outcome"

      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/decide with action GRANT on a Notice whose subject_type == EXEMPTION_APPLICATION"
        actor: system
        preconditions:
          - "application.status == DENIED"
          - "the appeal's notice has notice_type DENIAL and subject_id == application.id"
        side_effects:
          - "CASCADE L1: application.status returns to UNDER_REVIEW and application.denial_reason is cleared to null"
          - "CASCADE L2: the reopened application clears determined_by_user_id to null so the reviewer that issued the reversed denial is no longer recorded as the decider"
          - "application.version incremented by 1"
        note: "Appeal-driven reopening; info_request_round is preserved, so a reopened application that already used both information requests cannot request more."

  - entity: ExemptionGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, TRANSFERRED, LAPSED]
    shape: "cyclic — ACTIVE -> SUSPENDED -> ACTIVE (reinstatement loop) with three distinct suspension reasons"
    transitions:

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fraud-cases (opening an investigation against this grant)"
        actor: system
        preconditions:
          - "grant.benefit_status == ACTIVE"
          - "the FraudCase being opened has grant_id == grant.id"
        side_effects:
          - "CASCADE L1: grant.benefit_status becomes SUSPENDED with suspension_reason FRAUD_INVESTIGATION"
          - "CASCADE L2: the grant leaving the ACTIVE set forces calculations.parcel_value_decomposition to re-run for grant.parcel_id, rewriting parcel.exempt_value_cents, parcel.taxable_value_cents and the applied_exempt_value_cents of the grants that remain ACTIVE"
          - "CASCADE L3: the rewritten parcel.exempt_value_cents re-derives parcel.exemption_status and increments Parcel.version by 1"
          - "taxpayer.status becomes FLAGGED"
          - "a Notice row with notice_type SUSPENSION, subject_type EXEMPTION_GRANT, subject_id == grant.id and appealable true is created, with appeal_deadline == mailed_at + APPEAL_WINDOW_DAYS"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ownership-records (a later record supersedes the primary-residence occupancy with a non-primary occupancy_type)"
        actor: system
        preconditions:
          - "grant.benefit_status == ACTIVE and grant.exemption_type != AGRICULTURAL_USE"
          - "the newly created OwnershipRecord has parcel_id == grant.parcel_id, taxpayer_id == grant.taxpayer_id and occupancy_type IN {SECONDARY, RENTAL}"
          - "the superseded record was the one that supported the grant at approval"
        side_effects:
          - "CASCADE L1: the predecessor OwnershipRecord is truncated (occupancy_end_date set to the new record's occupancy_start_date) and its status becomes SUPERSEDED"
          - "CASCADE L2: the loss of primary-residence occupancy sets grant.benefit_status to SUSPENDED with suspension_reason OCCUPANCY_LOST"
          - "CASCADE L3: the suspended grant leaving the ACTIVE set re-runs calculations.parcel_value_decomposition for the parcel and increments Parcel.version by 1"
          - "a Notice row with notice_type SUSPENSION, subject_type EXEMPTION_GRANT, subject_id == grant.id and appealable true is created, with appeal_deadline == mailed_at + APPEAL_WINDOW_DAYS"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /assessment-roll-runs (recertification lapse detected during the annual roll)"
        actor: system
        preconditions:
          - "grant.benefit_status == ACTIVE and program.recertification_required == true"
          - "no IncomeCertification exists for grant.taxpayer_id with certification_year >= run.target_tax_year and status == CERTIFIED"
        side_effects:
          - "CASCADE L1: the taxpayer's CERTIFIED IncomeCertification whose recertification_due_date is strictly before the logical clock date becomes LAPSED"
          - "CASCADE L2: the lapse of that certification sets grant.benefit_status to SUSPENDED with suspension_reason RECERTIFICATION_LAPSE"
          - "CASCADE L3: the suspended grant re-runs calculations.parcel_value_decomposition for grant.parcel_id and increments Parcel.version by 1"
          - "a Notice row with notice_type SUSPENSION, subject_type EXEMPTION_GRANT, subject_id == grant.id and appealable true is created, with appeal_deadline == mailed_at + APPEAL_WINDOW_DAYS"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /exemption-grants/{id}/compliance-actions with action REINSTATE"
        actor: ExemptionsReviewer
        preconditions:
          - "grant.benefit_status == SUSPENDED"
          - "no FraudCase exists with taxpayer_id == grant.taxpayer_id and investigation_status == OPEN"
          - "when grant.suspension_reason == RECERTIFICATION_LAPSE: a CERTIFIED IncomeCertification exists for the taxpayer with certification_year >= grant.effective_tax_year"
        side_effects:
          - "grant.benefit_status becomes ACTIVE and suspension_reason becomes null"
          - "CASCADE: calculations.parcel_value_decomposition re-runs for grant.parcel_id, restoring parcel.exempt_value_cents and re-deriving parcel.exemption_status; Parcel.version incremented by 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /fraud-cases/{id}/decide with action SUBSTANTIATE, or POST /exemption-grants/{id}/compliance-actions with action REVOKE"
        actor: "system (substantiation cascade) or ExemptionsReviewer (direct revocation)"
        preconditions:
          - "grant.benefit_status IN {ACTIVE, SUSPENDED}"
          - "for the direct revocation path: X-User-ID of the ExemptionsReviewer differs from the FraudInvestigator that opened any case on this grant"
        side_effects:
          - "grant.benefit_status becomes REVOKED; suspension_reason cleared"
          - "CASCADE: calculations.parcel_value_decomposition re-runs for grant.parcel_id and Parcel.version incremented by 1"
          - "CASCADE: a Notice row with notice_type REVOCATION, subject_type EXEMPTION_GRANT and subject_id == grant.id is created, and its appeal_deadline computed as mailed_at + APPEAL_WINDOW_DAYS"

      - from: SUSPENDED
        to: LAPSED
        trigger: "POST /assessment-roll-runs (a second consecutive roll with the recertification still missing)"
        actor: system
        preconditions:
          - "grant.benefit_status == SUSPENDED and grant.suspension_reason == RECERTIFICATION_LAPSE"
          - "no IncomeCertification exists for grant.taxpayer_id with certification_year >= run.target_tax_year and status == CERTIFIED"
        side_effects:
          - "grant.benefit_status becomes LAPSED (terminal); suspension_reason cleared"
          - "CASCADE: calculations.parcel_value_decomposition re-runs for grant.parcel_id and Parcel.version incremented by 1"

      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /exemption-grants/{id}/port with transfer_value_cents equal to the whole portable balance"
        actor: ExemptionsReviewer
        preconditions:
          - "grant.benefit_status == ACTIVE and grant.portable_balance_cents is not null"
          - "no FraudCase exists with taxpayer_id == grant.taxpayer_id and investigation_status == OPEN"
          - "the destination parcel has a VERIFIED PRIMARY_RESIDENCE OwnershipRecord for grant.taxpayer_id"
          - "payload.expected_grant_version == grant.version"
          - "calculations.portable_freeze_allocation allocates the entire remaining portable_balance_cents"
        side_effects:
          - "CASCADE L1: a new ExemptionGrant is created on the destination parcel with ported_from_grant_id == grant.id, frozen_value_cents == the allocated amount and benefit_status ACTIVE"
          - "CASCADE L2: grant.portable_balance_cents drops to 0 and grant.benefit_status becomes TRANSFERRED, removing it from the source parcel ACTIVE set"
          - "CASCADE L3: calculations.parcel_value_decomposition re-runs for BOTH the source parcel (losing the grant) and the destination parcel (gaining it); both Parcel.version values increment by 1"
          - "grant.version incremented by 1"
        note: "A partial port (transfer_value_cents below the portable balance) leaves the source grant ACTIVE with a reduced portable_balance_cents; only a full port reaches TRANSFERRED."

  - entity: IncomeCertification
    initial_state: PENDING
    terminal_states: [REVOKED, LAPSED]
    shape: "linear with a cross-entity certifying trigger and two distinct terminations"
    transitions:

      - from: PENDING
        to: CERTIFIED
        trigger: "system event: a VerificationCheck with source INCOME_DOR and result MATCH is recorded by POST /exemption-applications/{id}/verification-checks"
        actor: system
        preconditions:
          - "certification.status == PENDING"
          - "certification.taxpayer_id == application.taxpayer_id and certification.certification_year == application.tax_year, and it is the row selected by greatest created_at (tie-break greatest version) among that taxpayer-and-year set with status IN {PENDING, CERTIFIED}"
          - "the recorded check has source == INCOME_DOR and result == MATCH"
        side_effects:
          - "certification.status becomes CERTIFIED; certification.version incremented by 1"
        note: "A MISMATCH or NO_RECORD INCOME_DOR check leaves the certification PENDING, which later blocks approval of income-tested programs."

      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /assessment-roll-runs"
        actor: system
        preconditions:
          - "certification.status == CERTIFIED"
          - "certification.recertification_due_date is strictly before the logical clock calendar date at roll time"
          - "no CERTIFIED IncomeCertification exists for the same taxpayer with certification_year >= run.target_tax_year"
        side_effects:
          - "certification.status becomes LAPSED"
          - "CASCADE: every ACTIVE ExemptionGrant of that taxpayer whose program has recertification_required true is suspended with suspension_reason RECERTIFICATION_LAPSE, which in turn re-runs the parcel value decomposition"

      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /fraud-cases/{id}/decide with action SUBSTANTIATE"
        actor: system
        preconditions:
          - "certification.status == CERTIFIED"
          - "certification.taxpayer_id == case.taxpayer_id"
          - "certification.certification_year is inside the closed interval [case.improper_start_tax_year, case.improper_end_tax_year]"
        side_effects:
          - "certification.status becomes REVOKED; relief_tier and relief_multiplier_bps are preserved for audit"

  - entity: RetroactiveClaim
    initial_state: PENDING
    terminal_states: [DENIED, REVERSED]
    shape: "branching with a compensating reversal edge from the approved state"
    transitions:

      - from: PENDING
        to: APPROVED
        trigger: "POST /retroactive-claims/{id}/decide with action APPROVE"
        actor: ExemptionsReviewer
        preconditions:
          - "claim.status == PENDING"
          - "grant.benefit_status IN {ACTIVE, SUSPENDED} (a REVOKED, TRANSFERRED or LAPSED grant cannot support a refund)"
          - "no FraudCase exists with taxpayer_id == grant.taxpayer_id and investigation_status == OPEN"
        side_effects:
          - "the NET_FINAL variant of calculations.retroactive_refund_amount runs, writing claim.offset_applied_cents, claim.net_refund_cents, claim.refund_interest_cents and claim.total_payable_cents"
          - "CASCADE L1: taxpayer.lifetime_refund_cents increases by claim.total_payable_cents"
          - "CASCADE L2: the changed lifetime_refund_cents re-derives taxpayer.net_relief_cents"
          - "CASCADE L3: when claim.offset_applied_cents > 0, the offset is credited against the outstanding FraudCase rows of the taxpayer in ascending case.assessment_tax_year order (tie-break case.created_at ASC), raising each case's recovery_paid_cents and advancing its recovery_status to PARTIALLY_PAID or PAID; taxpayer.lifetime_recovery_collected_cents increases by the total credited amount and taxpayer.net_relief_cents is re-derived"
          - "a Notice row with notice_type REFUND_DETERMINATION, subject_type RETROACTIVE_CLAIM, subject_id == claim.id and appealable false is created"

      - from: PENDING
        to: DENIED
        trigger: "POST /retroactive-claims/{id}/decide with action DENY"
        actor: ExemptionsReviewer
        preconditions:
          - "claim.status == PENDING"
        side_effects:
          - "claim.net_refund_cents, claim.refund_interest_cents and claim.total_payable_cents stay 0"
          - "a Notice row with notice_type REFUND_DETERMINATION, subject_type RETROACTIVE_CLAIM, subject_id == claim.id and appealable true is created, with appeal_deadline == mailed_at + APPEAL_WINDOW_DAYS"

      - from: APPROVED
        to: REVERSED
        trigger: "POST /fraud-cases/{id}/decide with action SUBSTANTIATE"
        actor: system
        preconditions:
          - "claim.status == APPROVED"
          - "claim.grant_id == case.grant_id"
        side_effects:
          - "CASCADE L1: claim.status becomes REVERSED"
          - "CASCADE L2: the reversal reduces taxpayer.lifetime_refund_cents by claim.total_payable_cents"
          - "CASCADE L3: the reduced lifetime_refund_cents re-derives taxpayer.net_relief_cents"

  - entity: FraudCase
    initial_state: "investigation_status OPEN and recovery_status NONE"
    terminal_states: [CLEARED, "SUBSTANTIATED with recovery_status PAID", "SUBSTANTIATED with recovery_status ABATED"]
    shape: "two independent status dimensions on one row — investigation_status advances on the adjudication axis while recovery_status advances on the money axis; a SUBSTANTIATED case keeps that investigation_status forever while its recovery_status walks ASSESSED -> PARTIALLY_PAID -> PAID or jumps to ABATED"
    transitions:

      - dimension: investigation_status
        from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /fraud-cases/{id}/decide with action SUBSTANTIATE"
        actor: FraudInvestigator
        preconditions:
          - "case.investigation_status == OPEN"
          - "calculations.fraud_risk_score ADJUDICATION_REPLAY variant >= RISK_SUBSTANTIATION_THRESHOLD (60)"
          - "case.improper_end_tax_year <= case.assessment_tax_year"
        side_effects:
          - "case.adjudication_risk_score written from the ADJUDICATION_REPLAY variant; case.substantiated_by_user_id set to X-User-ID"
          - "CASCADE L1: calculations.recovery_assessment_total runs, writing case.back_tax_cents, case.penalty_cents, case.interest_cents and case.total_assessed_cents, and advancing case.recovery_status from NONE to ASSESSED"
          - "CASCADE L2: the assessment forces the alleged grant to REVOKED (the grant was already SUSPENDED by case opening)"
          - "CASCADE L3: the revoked grant re-runs calculations.parcel_value_decomposition for its parcel, rewriting exempt_value_cents and taxable_value_cents and incrementing Parcel.version by 1"
          - "CASCADE L4: the revoked grant's APPROVED RetroactiveClaim rows become REVERSED, which reduces taxpayer.lifetime_refund_cents and re-derives taxpayer.net_relief_cents"
          - "taxpayer.status becomes BARRED; every CERTIFIED IncomeCertification of the taxpayer inside the improper year interval becomes REVOKED"
          - "a Notice row with notice_type RECOVERY_ASSESSMENT, subject_type FRAUD_CASE, subject_id == case.id and appealable true is created, with appeal_deadline == mailed_at + APPEAL_WINDOW_DAYS"

      - dimension: investigation_status
        from: OPEN
        to: CLEARED
        trigger: "POST /fraud-cases/{id}/decide with action CLEAR"
        actor: FraudInvestigator
        preconditions:
          - "case.investigation_status == OPEN"
        side_effects:
          - "case.adjudication_risk_score written from the ADJUDICATION_REPLAY variant for the audit record; recovery_status stays NONE"
          - "CASCADE L1: the suspended grant returns to ACTIVE with suspension_reason cleared (compensation for the suspension applied at case opening)"
          - "CASCADE L2: the reactivated grant re-runs calculations.parcel_value_decomposition for its parcel and increments Parcel.version by 1"
          - "taxpayer.status returns to GOOD_STANDING when no other FraudCase of that taxpayer has investigation_status OPEN"

      - dimension: recovery_status
        from: ASSESSED
        to: PARTIALLY_PAID
        trigger: "POST /fraud-cases/{id}/recovery-actions with action PAY and amount_cents below the outstanding balance"
        actor: RecoveryOfficer
        preconditions:
          - "case.recovery_status IN {ASSESSED, PARTIALLY_PAID}"
          - "X-User-ID != case.substantiated_by_user_id (segregation of duties)"
          - "payload.amount_cents <= case.total_assessed_cents - case.recovery_paid_cents"
        side_effects:
          - "case.recovery_paid_cents increased by payload.amount_cents"
          - "CASCADE L1: taxpayer.lifetime_recovery_collected_cents increased by the same amount"
          - "CASCADE L2: the changed lifetime_recovery_collected_cents re-derives taxpayer.net_relief_cents"
        note: "investigation_status is untouched by this transition — the two dimensions move on their own axes."

      - dimension: recovery_status
        from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /fraud-cases/{id}/recovery-actions with action PAY closing the outstanding balance"
        actor: RecoveryOfficer
        preconditions:
          - "case.recovery_status IN {ASSESSED, PARTIALLY_PAID}"
          - "X-User-ID != case.substantiated_by_user_id (segregation of duties)"
          - "payload.amount_cents == case.total_assessed_cents - case.recovery_paid_cents"
        side_effects:
          - "case.recovery_paid_cents becomes equal to case.total_assessed_cents and recovery_status becomes PAID"
          - "CASCADE: taxpayer.lifetime_recovery_collected_cents increased and taxpayer.net_relief_cents re-derived"

      - dimension: recovery_status
        from: ASSESSED
        to: ABATED
        trigger: "POST /fraud-cases/{id}/recovery-actions with action ABATE, or POST /appeals/{id}/decide with action GRANT on the RECOVERY_ASSESSMENT notice"
        actor: "RecoveryOfficer (direct abatement) or system (appeal cascade)"
        preconditions:
          - "case.recovery_status IN {ASSESSED, PARTIALLY_PAID}"
          - "for the direct path: X-User-ID != case.substantiated_by_user_id (segregation of duties)"
        side_effects:
          - "case.recovery_status becomes ABATED; the whole assessed balance is written off and case.recovery_paid_cents is reset to 0"
          - "CASCADE L1: taxpayer.lifetime_recovery_collected_cents is reduced by the amount previously collected on this case"
          - "CASCADE L2: the reduced lifetime_recovery_collected_cents re-derives taxpayer.net_relief_cents back to its pre-assessment figure"
        note: "investigation_status remains SUBSTANTIATED after abatement — abatement settles money, not guilt."

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, DISMISSED]
    shape: "cyclic — SCHEDULED -> CONTINUED -> SCHEDULED, bounded by MAX_CONTINUANCES = 2; each continuance releases the docket slot"
    transitions:

      - from: FILED
        to: SCHEDULED
        trigger: "POST /appeals/{id}/schedule"
        actor: HearingClerk
        preconditions:
          - "appeal.status IN {FILED, CONTINUED}"
          - "docket.status == OPEN"
          - "hearing_start_utc >= docket.session_start_utc and hearing_end_utc <= docket.session_end_utc (both bounds inclusive)"
          - "hearing_start_utc < hearing_end_utc"
          - "no other Appeal holding a slot on this docket has a hearing interval that collides with [hearing_start_utc, hearing_end_utc] once expanded by HEARING_BUFFER_MINUTES (15) on both sides"
          - "docket.scheduled_appeal_count < docket.capacity"
        side_effects:
          - "appeal.docket_id, appeal.hearing_start_utc and appeal.hearing_end_utc written; appeal.status becomes SCHEDULED"
          - "CASCADE: docket.scheduled_appeal_count re-derived (incremented by 1) and docket.version incremented by 1"

      - from: CONTINUED
        to: SCHEDULED
        trigger: "POST /appeals/{id}/schedule (re-docketing after a continuance)"
        actor: HearingClerk
        preconditions:
          - "appeal.status == CONTINUED"
          - "the same interval, buffer, capacity and session-window preconditions as the FILED -> SCHEDULED edge"
        side_effects:
          - "appeal.docket_id and hearing interval written again; appeal.status becomes SCHEDULED"
          - "CASCADE: the new docket's scheduled_appeal_count re-derived (incremented by 1)"

      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /appeals/{id}/decide with action CONTINUE"
        actor: HearingOfficer
        preconditions:
          - "appeal.status == SCHEDULED"
          - "appeal.continuance_count < MAX_CONTINUANCES (2)"
        side_effects:
          - "appeal.continuance_count incremented by 1; appeal.docket_id, hearing_start_utc and hearing_end_utc reset to null"
          - "CASCADE: the released slot re-derives the former docket's scheduled_appeal_count (decremented by 1), freeing the buffer window for another appeal"

      - from: SCHEDULED
        to: GRANTED
        trigger: "POST /appeals/{id}/decide with action GRANT"
        actor: HearingOfficer
        preconditions:
          - "appeal.status == SCHEDULED"
          - "X-User-ID != the decider recorded on the noticed action (application.determined_by_user_id for a DENIAL notice, case.substantiated_by_user_id for a RECOVERY_ASSESSMENT notice)"
        side_effects:
          - "appeal.decided_by_user_id set to X-User-ID; appeal.status becomes GRANTED"
          - "when notice.subject_type == FRAUD_CASE: CASCADE L1 the case recovery_status becomes ABATED and recovery_paid_cents resets to 0; CASCADE L2 the abatement returns the REVOKED grant to ACTIVE; CASCADE L3 the reactivated grant re-runs calculations.parcel_value_decomposition and increments Parcel.version by 1; CASCADE L4 taxpayer.lifetime_recovery_collected_cents drops by the collected amount and taxpayer.net_relief_cents is re-derived"
          - "when notice.subject_type == EXEMPTION_APPLICATION: CASCADE L1 the DENIED application returns to UNDER_REVIEW; CASCADE L2 its determined_by_user_id is cleared"
          - "when notice.subject_type == EXEMPTION_GRANT: CASCADE L1 the REVOKED grant returns to ACTIVE; CASCADE L2 the parcel value decomposition re-runs and Parcel.version increments by 1"
          - "CASCADE: docket.scheduled_appeal_count is unchanged — a decided appeal keeps consuming its slot"

      - from: SCHEDULED
        to: DENIED
        trigger: "POST /appeals/{id}/decide with action DENY"
        actor: HearingOfficer
        preconditions:
          - "appeal.status == SCHEDULED"
          - "X-User-ID != the decider recorded on the noticed action"
        side_effects:
          - "appeal.decided_by_user_id set to X-User-ID; appeal.status becomes DENIED; the noticed action stands unchanged"

      - from: SCHEDULED
        to: DISMISSED
        trigger: "POST /appeals/{id}/decide with action DISMISS"
        actor: HearingOfficer
        preconditions:
          - "appeal.status == SCHEDULED"
        side_effects:
          - "appeal.decided_by_user_id set to X-User-ID; appeal.status becomes DISMISSED; the noticed action stands unchanged"
        note: "Used when the appellant fails to appear at the reserved interval."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on a parent entity's `version` only)
# -----------------------------------------------------------------------------

concurrency_rules:

  - rule_id: determination-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /exemption-applications/{id}/determine"
    occ_field: "expected_parcel_version"
    description: |
      A determination is rejected when the parcel version the reviewer last observed no longer
      matches the stored Parcel.version. Approving an application mints a grant that rewrites the
      parcel exempt and taxable value decomposition, and several exemption classifications may
      legitimately stack on one parcel, so a determination issued against a stale parcel view would
      be computed from superseded assessed and exempt values. The stale-version check forces the
      reviewer to re-read the parcel before deciding.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

  - rule_id: grant-port-stale-grant
    parent_entity: ExemptionGrant
    write_endpoint: "POST /exemption-grants/{id}/port"
    occ_field: "expected_grant_version"
    description: |
      A portability transfer is rejected when the grant version the reviewer last observed no longer
      matches the stored ExemptionGrant.version. Partial ports are legitimate and each one reduces
      portable_balance_cents, so a transfer computed from a stale grant view would allocate frozen
      value that a prior port already carved out. The stale-version check makes the second transfer
      re-read the remaining portable balance first.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------

calculations:

  - name: parcel_value_decomposition
    trigger: "Runs on every event that changes the ACTIVE grant set or the published values of a parcel: ExemptionApplication UNDER_REVIEW -> APPROVED, every ExemptionGrant benefit_status change (ACTIVE -> SUSPENDED, SUSPENDED -> ACTIVE, -> REVOKED, -> LAPSED, -> TRANSFERRED), POST /exemption-grants/{id}/port on both parcels, and POST /assessment-roll-runs for every rolled parcel."
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — assessment cap (single rounding here, nowhere else in this step)
      years_since_base   = max(0, parcel.tax_year - parcel.base_year)
      capped_value_cents = round_half_up(parcel.base_year_value_cents
                             * (10000 + parcel.assessment_cap_pct_bps * years_since_base) / 10000)

      # STEP 2 — assessed basis: cap first, then any valuation freeze
      assessed = min(parcel.market_value_cents, capped_value_cents)
      freeze_grants = [g for g in grants(parcel)
                       if g.benefit_status == 'ACTIVE' and g.frozen_value_cents is not None]
      if freeze_grants:
          # controlling freeze = lowest program.priority_rank, tie-break grant.created_at ASC
          controlling = sorted(freeze_grants, key=lambda g: (program(g).priority_rank, g.created_at))[0]
          assessed = min(assessed, controlling.frozen_value_cents)
      parcel.assessed_value_cents = assessed

      # STEP 3 — exemption waterfall over ACTIVE grants only
      #   order: program.priority_rank ASC, tie-break grant.created_at ASC (never grant.id)
      remaining = assessed
      total     = 0
      for g in sorted([g for g in grants(parcel) if g.benefit_status == 'ACTIVE'],
                      key=lambda g: (program(g).priority_rank, g.created_at)):
          applied = min(g.benefit_amount_cents, remaining)
          g.applied_exempt_value_cents = applied
          total    += applied
          remaining = remaining - applied

      parcel.exempt_value_cents  = total
      parcel.taxable_value_cents = assessed - total          # INVARIANT: exempt + taxable == assessed

      # STEP 4 — derived posture
      if   total == 0:        parcel.exemption_status = 'UNEXEMPTED'
      elif total == assessed: parcel.exemption_status = 'FULLY_EXEMPT'
      else:                   parcel.exemption_status = 'PARTIALLY_EXEMPT'
    input_set: "Grants with benefit_status == ACTIVE on this parcel only; SUSPENDED, REVOKED, TRANSFERRED and LAPSED grants are excluded from both the freeze selection and the waterfall. applied_exempt_value_cents of an excluded grant is reset to 0."
    constants:
      DEFAULT_ASSESSMENT_CAP_PCT_BPS: 200
    precision: "whole cents; the only rounding is round_half_up on capped_value_cents in STEP 1"
    determinism: "Waterfall order is program.priority_rank ASC then grant.created_at ASC; grant.id never participates. A grant whose benefit exceeds the remaining assessed value is absorbed partially and every later grant receives 0."

  - name: income_relief_tier
    trigger: "Runs inside POST /exemption-applications/{id}/determine with outcome APPROVE, for programs whose requires_income_certification is true; the result is stamped on both the consumed IncomeCertification and the minted ExemptionGrant."
    algorithm: threshold
    formula: |
      # exact rational comparison — no floating point, no pre-rounding of the ratio
      income = certification.household_income_cents
      limit  = program.income_limit_cents
      if income * 2 <= limit * 1:            relief_tier, relief_multiplier_bps = 'TIER_FULL',    10000
      elif income * 4 <= limit * 3:          relief_tier, relief_multiplier_bps = 'TIER_HIGH',     7500
      elif income      <= limit:             relief_tier, relief_multiplier_bps = 'TIER_PARTIAL',  5000
      else:                                  reject with ERR_INCOME_LIMIT_EXCEEDED
      # asset test is a separate gate, evaluated after the income tier is resolved:
      if program.asset_limit_cents is not None and
         certification.countable_asset_cents > program.asset_limit_cents:
             reject with ERR_ASSET_LIMIT_EXCEEDED
    input_set: "The single IncomeCertification with taxpayer_id == application.taxpayer_id, certification_year == application.tax_year and status == CERTIFIED. If more than one exists, the one with the greatest created_at is used."
    constants:
      TIER_FULL_UPPER_RATIO: "50% of income_limit_cents, inclusive"
      TIER_HIGH_UPPER_RATIO: "75% of income_limit_cents, inclusive"
      TIER_PARTIAL_UPPER_RATIO: "100% of income_limit_cents, inclusive"
    precision: "integer basis points; every tier boundary is inclusive on its upper edge (<=), so income exactly equal to the limit yields TIER_PARTIAL and income of limit + 1 cent is rejected"

  - name: exemption_benefit_amount
    trigger: "Runs inside POST /exemption-applications/{id}/determine with outcome APPROVE to write ExemptionGrant.benefit_amount_cents, and inside POST /exemption-grants/{id}/port to write the ported grant's benefit_amount_cents on the destination parcel."
    algorithm: constraint_propagation
    formula: |
      # five exact-rational steps; a SINGLE round_half_up at the end (STEP 6)
      # STEP 1 statutory share of the assessed basis
      raw       = parcel.assessed_value_cents * program.relief_pct_bps / 10000
      # STEP 2 income tier (10000 when the program is not income-tested)
      tier_mult = grant.relief_multiplier_bps            # 10000 | 7500 | 5000
      tiered    = raw * tier_mult / 10000
      # STEP 3 veteran disability rating (10000 for every other program_code)
      dis_mult  = taxpayer.disability_rating_pct_bps if program.program_code == 'VETERAN_DISABILITY' else 10000
      adjusted  = tiered * dis_mult / 10000
      # STEP 4 program ceiling
      capped    = min(program.max_exempt_value_cents, adjusted)
      # STEP 5 undivided ownership share
      prorated  = capped * grant.ownership_pct_bps_snapshot / 10000
      # STEP 6 the one and only rounding
      benefit_amount_cents = round_half_up(prorated)
    input_set: "parcel.assessed_value_cents as it stands AFTER step 2 of parcel_value_decomposition for the current tax year; the OwnershipRecord that satisfied the approval precondition supplies ownership_pct_bps_snapshot."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up, applied once at STEP 6. Rounding any intermediate step is explicitly wrong: the ceiling in STEP 4 must be compared against the unrounded adjusted value."
    determinism: "The program ceiling is applied BEFORE the ownership pro-ration (STEP 4 then STEP 5). Applying the ceiling after pro-ration would produce a larger benefit for fractional owners and is explicitly not the pinned order."

  - name: retroactive_refund_amount
    trigger: "The GROSS_PROVISIONAL variant runs on POST /retroactive-claims; the NET_FINAL variant runs on POST /retroactive-claims/{id}/decide with action APPROVE."
    algorithm: chronological
    formula: |
      # ---------- eligible window (closed interval, both ends inclusive) ----------
      last_eligible  = claim.filing_tax_year - 1
      first_eligible = max(claim.filing_tax_year - program.statutory_lookback_years,
                           grant.first_eligible_tax_year,
                           claim.requested_start_tax_year)
      if first_eligible > last_eligible: reject with ERR_NO_ELIGIBLE_CLAIM_YEARS
      years = [first_eligible .. last_eligible]              # ascending
      eligible_year_count = last_eligible - first_eligible + 1

      # ---------- per-year saving: rounded PER YEAR, then summed ----------
      saving[y] = round_half_up(grant.benefit_amount_cents * COUNTY_MILL_RATE_BPS / 10000)

      # ---------- variant GROSS_PROVISIONAL ----------
      gross_refund_cents = sum(saving[y] for y in years)

      # ---------- variant NET_FINAL (pinned evaluation order 1..6) ----------
      # 1. gross as above
      # 2. outstanding recovery is read as FROZEN at substantiation time — recovery interest is
      #    never re-accrued during claim adjudication:
      outstanding = sum(case.total_assessed_cents - case.recovery_paid_cents
                        for case in fraud_cases(grant.taxpayer_id)
                        if case.recovery_status in {'ASSESSED', 'PARTIALLY_PAID'})
      # 3. offset waterfall across years in ASCENDING tax-year order (oldest year absorbs first)
      offset_remaining = min(gross_refund_cents, outstanding)
      for y in years:                       # ascending
          absorbed[y]   = min(offset_remaining, saving[y])
          refundable[y] = saving[y] - absorbed[y]
          offset_remaining -= absorbed[y]
      offset_applied_cents = sum(absorbed[y] for y in years)
      # 4. statutory refund interest applies ONLY to the un-offset remainder of each year,
      #    rounded per year and then summed:
      interest[y] = round_half_up(refundable[y] * REFUND_INTEREST_BPS_PER_YEAR
                                  * (claim.filing_tax_year - y) / 10000)
      # 5. totals
      net_refund_cents     = sum(refundable[y] for y in years)
      refund_interest_cents = sum(interest[y] for y in years)
      # 6. payable
      total_payable_cents  = net_refund_cents + refund_interest_cents
    input_set: "Only tax years inside the closed eligible window; the outstanding-recovery figure counts FraudCase rows of the same taxpayer whose recovery_status is ASSESSED or PARTIALLY_PAID (NONE, PAID and ABATED cases contribute nothing)."
    constants:
      COUNTY_MILL_RATE_BPS: 125
      REFUND_INTEREST_BPS_PER_YEAR: 400
    precision: "whole cents, round_half_up, applied per tax year for both saving[y] and interest[y]; summing exact products and rounding once at the end is explicitly wrong"
    determinism: "The offset waterfall walks years in ascending tax_year order; interest is computed AFTER the offset, never on an absorbed amount. Reversing steps 3 and 4 (interest first, then offset) would inflate the payable amount and is explicitly not the pinned order."
    variants:
      - name: GROSS_PROVISIONAL
        when: "at claim filing (POST /retroactive-claims), before any adjudication"
        difference: "Ignores the taxpayer's outstanding recovery balance entirely and adds no interest; writes gross_refund_cents only and leaves net_refund_cents, refund_interest_cents and total_payable_cents at 0."
      - name: NET_FINAL
        when: "at claim approval (POST /retroactive-claims/{id}/decide with action APPROVE)"
        difference: "Applies the recovery offset waterfall oldest-year-first and then adds statutory interest on the un-offset remainders, so for identical inputs it produces a strictly smaller principal than GROSS_PROVISIONAL whenever an outstanding recovery balance exists."

  - name: recovery_assessment_total
    trigger: "Runs inside POST /fraud-cases/{id}/decide with action SUBSTANTIATE, writing FraudCase.back_tax_cents, penalty_cents, interest_cents and total_assessed_cents."
    algorithm: aggregation
    formula: |
      years = [case.improper_start_tax_year .. case.improper_end_tax_year]     # closed interval
      # PINNED ROUNDING ORDER — round every per-year component to whole cents BEFORE summing,
      # and derive the penalty from the ALREADY ROUNDED back tax of that year:
      for y in years:
          back_tax[y] = round_half_up(grant.benefit_amount_cents * COUNTY_MILL_RATE_BPS / 10000)
          penalty[y]  = round_half_up(back_tax[y] * program.penalty_pct_bps / 10000)
          interest[y] = round_half_up(back_tax[y] * program.interest_pct_bps_per_year
                                      * (case.assessment_tax_year - y) / 10000)
      back_tax_cents      = sum(back_tax[y] for y in years)
      penalty_cents       = sum(penalty[y]  for y in years)
      interest_cents      = sum(interest[y] for y in years)
      total_assessed_cents = back_tax_cents + penalty_cents + interest_cents
      # total_assessed_cents is FROZEN here and is never re-accrued afterwards
    input_set: "The single ExemptionGrant referenced by case.grant_id, using its benefit_amount_cents as stored at substantiation time; every tax year in the closed improper interval contributes exactly one back tax, one penalty and one interest term."
    constants:
      COUNTY_MILL_RATE_BPS: 125
    precision: "whole cents, round_half_up per year. Round-then-sum is pinned: summing exact per-year products and rounding once, or deriving the penalty from the unrounded back tax, produce cent-level differences and are explicitly wrong."
    determinism: "Interest uses simple (not compounded) accrual over (assessment_tax_year - y) whole years, so the year immediately before the assessment year accrues exactly one year of interest."

  - name: fraud_risk_score
    trigger: "The SCREENING_SNAPSHOT variant runs on POST /fraud-cases, writing screening_risk_score; the ADJUDICATION_REPLAY variant runs on POST /fraud-cases/{id}/decide (both actions), writing adjudication_risk_score."
    algorithm: weighted_scoring
    formula: |
      # four 0-or-100 factors, weighted in basis points that sum to 10000
      # f1 registration address mismatch (VOTER_REGISTRY or DMV)
      # f2 multiple concurrent homestead claims by the same taxpayer on distinct parcels
      # f3 postal forwarding order (USPS_NCOA)
      # f4 income under-reporting versus the revenue department record (INCOME_DOR)
      f1 = 100 if any_mismatch(sources={'VOTER_REGISTRY', 'DMV'}) else 0
      f2 = 100 if count(distinct g.parcel_id for g in grants(case.taxpayer_id)
                        if g.exemption_type == 'HOMESTEAD_BASIC'
                        and g.benefit_status in {'ACTIVE', 'SUSPENDED'}) >= 2 else 0
      f3 = 100 if any_mismatch(sources={'USPS_NCOA'}) else 0
      f4 = 100 if any_mismatch(sources={'INCOME_DOR'}) else 0
      score = round_half_up((f1 * 3500 + f2 * 3000 + f3 * 1500 + f4 * 2000) / 10000)
      # the two variants differ ONLY in how any_mismatch() reads the VerificationCheck log
    input_set: "VerificationCheck rows of every ExemptionApplication whose taxpayer_id == case.taxpayer_id. NO_RECORD results never contribute a mismatch. The grant-count factor f2 reads ExemptionGrant rows of the taxpayer whose benefit_status is ACTIVE or SUSPENDED."
    constants:
      WEIGHT_ADDRESS_MISMATCH_BPS: 3500
      WEIGHT_MULTI_PARCEL_BPS: 3000
      WEIGHT_POSTAL_FORWARDING_BPS: 1500
      WEIGHT_INCOME_UNDERREPORT_BPS: 2000
      RISK_SUBSTANTIATION_THRESHOLD: 60
    precision: "integer score in [0, 100], round_half_up once on the weighted sum"
    determinism: "SCREENING_SNAPSHOT collapses the log to the latest check per source by checked_at DESC, tie-break created_at DESC; ADJUDICATION_REPLAY walks every check in checked_at ASC order and latches a mismatch permanently. Neither variant uses id."
    variants:
      - name: SCREENING_SNAPSHOT
        when: "at case opening (POST /fraud-cases)"
        difference: "any_mismatch(S) is true only when the LATEST check for a source in S has result MISMATCH; a later MATCH from the same source hides an earlier MISMATCH, so a corrected registry record drives the score down."
      - name: ADJUDICATION_REPLAY
        when: "at case adjudication (POST /fraud-cases/{id}/decide)"
        difference: "any_mismatch(S) is true when ANY check ever recorded for a source in S has result MISMATCH, superseded rows included, so the same VerificationCheck log yields a strictly higher score than SCREENING_SNAPSHOT whenever a mismatch was later corrected."

  - name: portable_freeze_allocation
    trigger: "Runs inside POST /exemption-grants/{id}/port to size the ported frozen value and reduce the source grant's portable balance."
    algorithm: waterfall_allocation
    formula: |
      allocated_cents = min(payload.transfer_value_cents,
                            source.portable_balance_cents,
                            destination_parcel.assessed_value_cents)
      if allocated_cents <= 0: reject with ERR_PORTABLE_BALANCE_EXHAUSTED
      new_grant.frozen_value_cents     = allocated_cents
      new_grant.portable_balance_cents = 0
      source.portable_balance_cents    = source.portable_balance_cents - allocated_cents
      if source.portable_balance_cents == 0: source.benefit_status = 'TRANSFERRED'
      # CONSERVED QUANTITY (checked after every port):
      #   source.portable_balance_cents
      #     + sum(child.frozen_value_cents for child in grants where ported_from_grant_id == source.id)
      #   == source.frozen_value_cents
    input_set: "The single source ExemptionGrant addressed by the path, its already-created child grants (ported_from_grant_id == source.id) and the destination Parcel's assessed_value_cents as it stands before the port."
    constants:
      MIN_PORTABLE_ALLOCATION_CENTS: 1
    precision: "whole cents; no rounding occurs because every term is already an integer number of cents"
    determinism: "The destination parcel's assessed_value_cents is read BEFORE the new grant is inserted, so the ceiling is the pre-port basis; re-reading it afterwards would let the freeze cap itself."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# -----------------------------------------------------------------------------

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the nine declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when the acting role is Taxpayer, X-User-ID equals the taxpayer_id of the addressed resource (application.taxpayer_id, claim -> grant.taxpayer_id, notice.taxpayer_id, appeal.taxpayer_id); when the addressed or referenced resource does not exist at all the ownership check cannot be evaluated and the matching NOT_FOUND error of priority 6 or 7 is returned instead"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /exemption-applications/{id}/respond-info, POST /retroactive-claims, POST /appeals, GET /taxpayer-accounts/{id}, GET /exemption-grants, GET /taxpayer-accounts/{id}/notices"

  - priority: 4
    category: auth
    check: "segregation of duties: X-User-ID differs from the user recorded on the prior step — application.intake_user_id for determination, application.determined_by_user_id for the retroactive-claim decision on a grant minted by that determination, case.substantiated_by_user_id for recovery actions, application.determined_by_user_id or case.substantiated_by_user_id for appeal decisions"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exemption-applications/{id}/determine, POST /retroactive-claims/{id}/decide, POST /fraud-cases/{id}/recovery-actions, POST /appeals/{id}/decide"

  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present, integers non-negative where declared, enum members valid, ISO 8601 dates and instants well formed, pagination limit within [1, 100]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: existence
    check: "path resources resolve left to right: parcel, taxpayer account, application, grant, claim, fraud case, appeal, docket"
    error_id: "ERR_PARCEL_NOT_FOUND | ERR_TAXPAYER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_FRAUD_CASE_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_DOCKET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 7
    category: existence
    check: "body foreign keys resolve: parcel_id, taxpayer_id, program_id, grant_id, notice_id, docket_id, destination_parcel_id"
    error_id: "ERR_PARCEL_NOT_FOUND | ERR_TAXPAYER_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_DOCKET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ownership-records, POST /exemption-applications, POST /income-certifications, POST /retroactive-claims, POST /fraud-cases, POST /appeals, POST /appeals/{id}/schedule, POST /exemption-grants/{id}/port"

  - priority: 8
    category: state
    check: "optimistic concurrency: expected_parcel_version equals Parcel.version on determination; expected_grant_version equals ExemptionGrant.version on portability transfer"
    error_id: "ERR_STALE_PARCEL_VERSION | ERR_STALE_GRANT_VERSION"
    http_status: 412
    applies_to: "POST /exemption-applications/{id}/determine, POST /exemption-grants/{id}/port"

  - priority: 9
    category: state
    check: "target resource is in a state that admits the requested transition (application DRAFT for submit, UNDER_REVIEW for determine, INFO_REQUESTED for respond-info; grant ACTIVE for port, SUSPENDED for reinstate, non-terminal for revoke; claim PENDING for decide; case investigation_status OPEN for decide; case recovery_status ASSESSED or PARTIALLY_PAID for recovery actions; appeal FILED or CONTINUED for schedule, SCHEDULED for decide; docket OPEN for scheduling)"
    error_id: "ERR_APPLICATION_NOT_DRAFT | ERR_APPLICATION_NOT_UNDER_REVIEW | ERR_APPLICATION_NOT_INFO_REQUESTED | ERR_GRANT_NOT_ACTIVE | ERR_GRANT_NOT_SUSPENDED | ERR_GRANT_ALREADY_TERMINAL | ERR_CLAIM_NOT_PENDING | ERR_CASE_ALREADY_ADJUDICATED | ERR_RECOVERY_NOT_ASSESSED | ERR_APPEAL_NOT_SCHEDULABLE | ERR_APPEAL_NOT_SCHEDULED | ERR_DOCKET_CLOSED"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: business_safety
    check: "taxpayer.status != BARRED when submitting a new application for that taxpayer"
    error_id: ERR_TAXPAYER_BARRED
    http_status: 409
    applies_to: "POST /exemption-applications/{id}/submit"

  - priority: 11
    category: business_safety
    check: "no FraudCase of the acting taxpayer has investigation_status OPEN (fraud hold) when porting a freeze, reinstating a grant or approving a retroactive claim"
    error_id: ERR_FRAUD_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /exemption-grants/{id}/port, POST /exemption-grants/{id}/compliance-actions, POST /retroactive-claims/{id}/decide"

  - priority: 12
    category: business_referential
    check: "the destination parcel of a portability transfer has a VERIFIED PRIMARY_RESIDENCE OwnershipRecord for the grant's taxpayer covering the transfer date"
    error_id: ERR_DESTINATION_NOT_OWNED
    http_status: 422
    applies_to: "POST /exemption-grants/{id}/port"

  - priority: 13
    category: business_referential
    check: "a VERIFIED OwnershipRecord links application.taxpayer_id to application.parcel_id with the occupancy_type the program requires and an interval covering January 1 of application.tax_year"
    error_id: ERR_OWNERSHIP_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 14
    category: business_safety
    check: "for each of source VOTER_REGISTRY and source DEED_REGISTRY at least one VerificationCheck row exists for the application, and the LATEST row per source (checked_at DESC, tie-break created_at DESC) has result MATCH; a superseded MISMATCH row does not block approval"
    error_id: ERR_RESIDENCY_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 15
    category: business_referential
    check: "program-specific eligibility: SENIOR_FREEZE requires the taxpayer to reach 65 on or before January 1 of the tax year; VETERAN_DISABILITY requires disability_rating_pct_bps > 0; AGRICULTURAL_USE requires an AGRICULTURAL occupancy_type record"
    error_id: ERR_EXEMPTION_TYPE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 16
    category: business_temporal
    check: "occupancy interval geometry on a parcel: a new PRIMARY_RESIDENCE OwnershipRecord must not overlap an existing PRIMARY_RESIDENCE record on the same parcel under half-open [start, end) semantics; touching endpoints (end == next start) are allowed"
    error_id: ERR_OCCUPANCY_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /ownership-records"

  - priority: 17
    category: business_temporal
    check: "one primary residence per taxpayer: a new PRIMARY_RESIDENCE OwnershipRecord must not overlap (half-open) another PRIMARY_RESIDENCE record of the same taxpayer on a different parcel"
    error_id: ERR_DUPLICATE_PRIMARY_RESIDENCE
    http_status: 409
    applies_to: "POST /ownership-records"

  - priority: 18
    category: business_temporal
    check: "hearing interval geometry on a docket: the requested closed interval [hearing_start_utc, hearing_end_utc] must fit inside the docket session window (both bounds inclusive) and must keep more than HEARING_BUFFER_MINUTES (15) of clear time from every other slot on that docket; a gap of exactly 15 minutes collides"
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appeals/{id}/schedule"

  - priority: 19
    category: business_temporal
    check: "an appeal is filed at or before notice.appeal_deadline (the deadline instant itself is timely) and the notice has appealable true"
    error_id: "ERR_APPEAL_DEADLINE_PASSED | ERR_NOTICE_NOT_APPEALABLE"
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 20
    category: business_temporal
    check: "retroactive claim window: at least one tax year survives the statutory lookback, the grant first_eligible_tax_year floor and the requested start year"
    error_id: ERR_NO_ELIGIBLE_CLAIM_YEARS
    http_status: 422
    applies_to: "POST /retroactive-claims"

  - priority: 21
    category: business_temporal
    check: "requested_start_tax_year is not earlier than filing_tax_year minus program.statutory_lookback_years"
    error_id: ERR_STATUTORY_LOOKBACK_EXCEEDED
    http_status: 422
    applies_to: "POST /retroactive-claims"

  - priority: 22
    category: business_constraint
    check: "claim-year exclusivity: the eligible year interval of a new claim must not intersect the eligible interval of an existing PENDING or APPROVED claim on the same grant (closed-interval intersection)"
    error_id: ERR_CLAIM_YEARS_OVERLAP
    http_status: 409
    applies_to: "POST /retroactive-claims"

  - priority: 23
    category: business_constraint
    check: "no other ExemptionApplication for the same parcel_id, program_id and tax_year is in SUBMITTED, UNDER_REVIEW, INFO_REQUESTED or APPROVED"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /exemption-applications/{id}/submit"

  - priority: 24
    category: business_constraint
    check: "no ExemptionGrant with the same parcel_id, program_id and effective_tax_year has benefit_status ACTIVE or SUSPENDED"
    error_id: ERR_DUPLICATE_GRANT
    http_status: 409
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 25
    category: business_constraint
    check: "information requests are bounded: application.info_request_round < 2"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /exemption-applications/{id}/determine (outcome REQUEST_INFO)"

  - priority: 26
    category: business_constraint
    check: "continuances are bounded: appeal.continuance_count < 2"
    error_id: ERR_CONTINUANCE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /appeals/{id}/decide (action CONTINUE)"

  - priority: 27
    category: business_constraint
    check: "docket aggregate capacity: docket.scheduled_appeal_count < docket.capacity"
    error_id: ERR_DOCKET_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /appeals/{id}/schedule"

  - priority: 28
    category: business_constraint
    check: "at most one Appeal exists per Notice"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 29
    category: business_fiscal
    check: "when program.requires_income_certification is true, a CERTIFIED IncomeCertification for the application tax year exists for the taxpayer; and when reinstating a grant whose suspension_reason is RECERTIFICATION_LAPSE, a CERTIFIED IncomeCertification with certification_year >= grant.effective_tax_year exists for grant.taxpayer_id"
    error_id: ERR_INCOME_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE), POST /exemption-grants/{id}/compliance-actions (action REINSTATE)"

  - priority: 30
    category: business_fiscal
    check: "household_income_cents <= program.income_limit_cents (upper edge inclusive)"
    error_id: ERR_INCOME_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 31
    category: business_fiscal
    check: "countable_asset_cents <= program.asset_limit_cents (strictly greater is rejected)"
    error_id: ERR_ASSET_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /exemption-applications/{id}/determine (outcome APPROVE)"

  - priority: 32
    category: business_fiscal
    check: "portability allocation is positive: min(transfer_value_cents, source.portable_balance_cents, destination_parcel.assessed_value_cents) >= 1"
    error_id: ERR_PORTABLE_BALANCE_EXHAUSTED
    http_status: 422
    applies_to: "POST /exemption-grants/{id}/port"

  - priority: 33
    category: business_fiscal
    check: "recovery payment does not exceed the outstanding balance: amount_cents <= total_assessed_cents - recovery_paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /fraud-cases/{id}/recovery-actions (action PAY)"

  - priority: 34
    category: business_safety
    check: "substantiation threshold: the ADJUDICATION_REPLAY risk score is at least RISK_SUBSTANTIATION_THRESHOLD (60)"
    error_id: ERR_RISK_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /fraud-cases/{id}/decide (action SUBSTANTIATE)"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table (flat top-level collections; sub-resource GETs are
# reverse-reachability reads for cascade-created children)
# -----------------------------------------------------------------------------

endpoints:

  # ---------- ReliefProgram (configuration) ----------
  - method: POST
    path: "/relief-programs"
    description: "Register a statutory relief program."
    roles: [ProgramAdministrator]
    code: 201
    input: [program_code, name, relief_pct_bps, max_exempt_value_cents, statutory_lookback_years, penalty_pct_bps, interest_pct_bps_per_year, priority_rank, "income_limit_cents?", "asset_limit_cents?", "requires_income_certification?", "recertification_required?", "freeze_enabled?"]
    output: ReliefProgram
    side_effects: ["program.status initialised to OPEN"]

  - method: GET
    path: "/relief-programs/{id}"
    description: "Read one relief program."
    roles: [ProgramAdministrator, ExemptionsReviewer, IntakeClerk]
    code: 200
    input: []
    output: ReliefProgram
    side_effects: []

  # ---------- Parcel ----------
  - method: POST
    path: "/parcels"
    description: "Create a parcel with its published valuation inputs."
    roles: [AssessorAnalyst]
    code: 201
    input: [apn, situs_address_normalized, county_zone, tax_year, base_year, base_year_value_cents, market_value_cents, "assessment_cap_pct_bps?"]
    output: Parcel
    side_effects: ["runs calculations.parcel_value_decomposition with an empty ACTIVE grant set, writing capped_value_cents, assessed_value_cents, exempt_value_cents 0, taxable_value_cents and exemption_status UNEXEMPTED"]

  - method: GET
    path: "/parcels/{id}"
    description: "Read one parcel including its computed value decomposition and current version."
    roles: [AssessorAnalyst, ExemptionsReviewer, IntakeClerk, FraudInvestigator]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  # ---------- TaxpayerAccount ----------
  - method: POST
    path: "/taxpayer-accounts"
    description: "Open a taxpayer account for a claimant."
    roles: [IntakeClerk]
    code: 201
    input: [full_name, date_of_birth, ssn_last4, mailing_address_normalized, "disability_rating_pct_bps?"]
    output: TaxpayerAccount
    side_effects: ["status initialised to GOOD_STANDING; lifetime_refund_cents, lifetime_recovery_collected_cents and net_relief_cents initialised to 0"]

  - method: GET
    path: "/taxpayer-accounts/{id}"
    description: "Read one taxpayer account including the conserved relief ledger."
    roles: [IntakeClerk, ExemptionsReviewer, FraudInvestigator, RecoveryOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxpayerAccount
    side_effects: []

  # ---------- OwnershipRecord ----------
  - method: POST
    path: "/ownership-records"
    description: "Ingest an ownership and occupancy interval from a data source."
    roles: [AssessorAnalyst]
    code: 201
    input: [parcel_id, taxpayer_id, ownership_pct_bps, deed_recorded_date, occupancy_type, occupancy_start_date, source_system, "occupancy_end_date?"]
    output: OwnershipRecord
    side_effects:
      - "status set to VERIFIED when source_system is DEED_REGISTRY or FIELD_INSPECTION, otherwise UNVERIFIED"
      - "an open-ended predecessor record for the same parcel_id and taxpayer_id is truncated (occupancy_end_date set to the new record's occupancy_start_date) and marked SUPERSEDED, whatever its occupancy_type; when several open-ended predecessors exist the one with the greatest occupancy_start_date (tie-break created_at ASC) is the one truncated"
      - "when the new occupancy_type is SECONDARY or RENTAL and it supersedes the record supporting an ACTIVE grant: that grant is SUSPENDED with suspension_reason OCCUPANCY_LOST, which re-runs calculations.parcel_value_decomposition and increments Parcel.version by 1"

  - method: GET
    path: "/ownership-records/{id}"
    description: "Read one ownership record."
    roles: [AssessorAnalyst, ExemptionsReviewer]
    code: 200
    input: []
    output: OwnershipRecord
    side_effects: []

  - method: GET
    path: "/ownership-records"
    description: "List ownership records filtered by parcel, taxpayer or occupancy type."
    roles: [AssessorAnalyst, ExemptionsReviewer]
    code: 200
    input: ["parcel_id?", "taxpayer_id?", "occupancy_type?", "status?", "limit?", "offset?"]
    output: OwnershipRecord[]
    side_effects: []

  # ---------- ExemptionApplication ----------
  - method: POST
    path: "/exemption-applications"
    description: "Create a draft exemption application."
    roles: [IntakeClerk]
    code: 201
    input: [parcel_id, taxpayer_id, program_id, tax_year, claimed_occupancy_date, claimed_address_normalized]
    output: ExemptionApplication
    side_effects: ["status initialised to DRAFT; intake_user_id set to the acting X-User-ID; info_request_round 0"]

  - method: GET
    path: "/exemption-applications/{id}"
    description: "Read one exemption application."
    roles: [IntakeClerk, ExemptionsReviewer, Taxpayer]
    code: 200
    input: []
    output: ExemptionApplication
    side_effects: []

  - method: GET
    path: "/exemption-applications"
    description: "List exemption applications filtered by parcel, taxpayer, program or status."
    roles: [IntakeClerk, ExemptionsReviewer]
    code: 200
    input: ["parcel_id?", "taxpayer_id?", "program_id?", "status?", "tax_year?", "limit?", "offset?"]
    output: ExemptionApplication[]
    side_effects: []

  - method: POST
    path: "/exemption-applications/{id}/submit"
    description: "Submit a draft application for review."
    roles: [IntakeClerk]
    code: 200
    input: []
    output: ExemptionApplication
    side_effects: ["status DRAFT -> SUBMITTED; application.version incremented by 1"]

  - method: POST
    path: "/exemption-applications/{id}/verification-checks"
    description: "Cross-match the application against one external data source and record the result."
    roles: [IntakeClerk, ExemptionsReviewer]
    code: 201
    input: [source]
    output: VerificationCheck
    side_effects:
      - "compares the latest injected registry record for (application.taxpayer_id, source) against the application claim (claimed_address_normalized for VOTER_REGISTRY, DMV, USPS_NCOA and DEED_REGISTRY; for INCOME_DOR the household_income_cents of the IncomeCertification whose taxpayer_id == application.taxpayer_id, certification_year == application.tax_year and status IN {PENDING, CERTIFIED}, selected by greatest created_at with tie-break greatest version) and writes result MATCH, MISMATCH or NO_RECORD; NO_RECORD is written when no registry record exists for that (taxpayer, source) pair, and also when source is INCOME_DOR and no IncomeCertification satisfies the selector above, since there is then nothing to compare the reported income against"
      - "the first check recorded for an application auto-transitions it SUBMITTED -> UNDER_REVIEW"
      - "an INCOME_DOR check with result MATCH transitions that same selected IncomeCertification to CERTIFIED when its status is PENDING"

  - method: GET
    path: "/exemption-applications/{id}/verification-checks"
    description: "List the verification checks recorded for an application (reverse reachability for cascade-created checks)."
    roles: [IntakeClerk, ExemptionsReviewer, FraudInvestigator]
    code: 200
    input: ["source?", "result?", "limit?", "offset?"]
    output: VerificationCheck[]
    side_effects: []

  - method: POST
    path: "/exemption-applications/{id}/respond-info"
    description: "Taxpayer answers an information request, closing the review cycle."
    roles: [Taxpayer]
    code: 200
    input: [claimed_address_normalized, claimed_occupancy_date]
    output: ExemptionApplication
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW; the claimed address and occupancy date are replaced; application.version incremented by 1"]

  - method: POST
    path: "/exemption-applications/{id}/determine"
    description: "Issue a determination: APPROVE mints an exemption grant, DENY issues an appealable denial notice, REQUEST_INFO returns the application to the taxpayer."
    roles: [ExemptionsReviewer]
    code: 200
    input: [outcome, expected_parcel_version, "denial_reason?"]
    output: ExemptionApplication
    side_effects:
      - "outcome APPROVE: creates an ExemptionGrant (benefit_amount_cents from calculations.exemption_benefit_amount, frozen_value_cents and portable_balance_cents for freeze-enabled programs), stamps application.resulting_grant_id, re-runs calculations.parcel_value_decomposition for the parcel and increments Parcel.version by 1"
      - "outcome APPROVE on an income-tested program: writes relief_tier and relief_multiplier_bps on the consumed IncomeCertification"
      - "outcome DENY: sets denial_reason and creates a DENIAL Notice whose appeal_deadline is mailed_at + 30 days"
      - "outcome REQUEST_INFO: increments info_request_round and returns the application to INFO_REQUESTED"
      - "every outcome sets determined_by_user_id (APPROVE and DENY only) and increments application.version by 1"

  # ---------- IncomeCertification ----------
  - method: POST
    path: "/income-certifications"
    description: "File an income and asset certification for a taxpayer and certification year."
    roles: [IntakeClerk]
    code: 201
    input: [taxpayer_id, certification_year, household_income_cents, countable_asset_cents, household_size, recertification_due_date]
    output: IncomeCertification
    side_effects: ["status initialised to PENDING; relief_tier NOT_ASSESSED until a determination consumes it"]

  - method: GET
    path: "/taxpayer-accounts/{id}/income-certifications"
    description: "List a taxpayer's income certifications (reverse reachability for cascade-certified rows)."
    roles: [IntakeClerk, ExemptionsReviewer, Taxpayer]
    code: 200
    input: ["certification_year?", "status?", "limit?", "offset?"]
    output: IncomeCertification[]
    side_effects: []

  # ---------- ExemptionGrant ----------
  - method: GET
    path: "/exemption-grants/{id}"
    description: "Read one exemption grant including benefit, freeze and portable balance fields."
    roles: [ExemptionsReviewer, FraudInvestigator, AssessorAnalyst, Taxpayer]
    code: 200
    input: []
    output: ExemptionGrant
    side_effects: []

  - method: GET
    path: "/exemption-grants"
    description: "List exemption grants filtered by parcel, taxpayer, application, program, portability parent or status (reverse reachability for grants minted by determination and by portability)."
    roles: [ExemptionsReviewer, FraudInvestigator, AssessorAnalyst, Taxpayer]
    code: 200
    input: ["parcel_id?", "taxpayer_id?", "application_id?", "program_id?", "ported_from_grant_id?", "benefit_status?", "limit?", "offset?"]
    output: ExemptionGrant[]
    side_effects: []

  - method: POST
    path: "/exemption-grants/{id}/port"
    description: "Port frozen value from this grant to another parcel owned by the same taxpayer; returns the newly created destination grant."
    roles: [ExemptionsReviewer]
    code: 201
    input: [destination_parcel_id, transfer_value_cents, expected_grant_version]
    output: ExemptionGrant
    side_effects:
      - "runs calculations.portable_freeze_allocation; creates the destination grant with ported_from_grant_id set to the source grant"
      - "reduces the source grant's portable_balance_cents and increments ExemptionGrant.version by 1 on the source grant"
      - "sets the source grant to TRANSFERRED when its portable_balance_cents reaches 0"
      - "re-runs calculations.parcel_value_decomposition for the source parcel and for the destination parcel, incrementing Parcel.version by 1 on each"

  - method: POST
    path: "/exemption-grants/{id}/compliance-actions"
    description: "Reinstate a suspended grant or revoke a grant outright."
    roles: [ExemptionsReviewer]
    code: 200
    input: [action, "reason?"]
    output: ExemptionGrant
    side_effects:
      - "action REINSTATE: SUSPENDED -> ACTIVE, clears suspension_reason, re-runs calculations.parcel_value_decomposition and increments Parcel.version by 1"
      - "action REVOKE: ACTIVE or SUSPENDED -> REVOKED, re-runs the parcel decomposition, increments Parcel.version by 1 and creates a REVOCATION Notice with a 30-day appeal deadline"

  # ---------- RetroactiveClaim ----------
  - method: POST
    path: "/retroactive-claims"
    description: "File a retroactive exemption claim against a grant; computes the provisional gross refund."
    roles: [Taxpayer, IntakeClerk]
    code: 201
    input: [grant_id, filing_tax_year, requested_start_tax_year]
    output: RetroactiveClaim
    side_effects: ["runs the GROSS_PROVISIONAL variant of calculations.retroactive_refund_amount, writing first_eligible_tax_year, last_eligible_tax_year, eligible_year_count and gross_refund_cents; status PENDING"]

  - method: GET
    path: "/retroactive-claims/{id}"
    description: "Read one retroactive claim."
    roles: [ExemptionsReviewer, IntakeClerk, Taxpayer]
    code: 200
    input: []
    output: RetroactiveClaim
    side_effects: []

  - method: GET
    path: "/exemption-grants/{id}/retroactive-claims"
    description: "List the retroactive claims filed against a grant (reverse reachability, including claims reversed by a fraud cascade)."
    roles: [ExemptionsReviewer, IntakeClerk, Taxpayer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetroactiveClaim[]
    side_effects: []

  - method: POST
    path: "/retroactive-claims/{id}/decide"
    description: "Approve or deny a retroactive claim; approval runs the final refund variant."
    roles: [ExemptionsReviewer]
    code: 200
    input: [action, "note?"]
    output: RetroactiveClaim
    side_effects:
      - "action APPROVE: runs the NET_FINAL variant of calculations.retroactive_refund_amount, credits the offset against outstanding fraud recoveries, raises taxpayer.lifetime_refund_cents, re-derives taxpayer.net_relief_cents and creates a non-appealable REFUND_DETERMINATION Notice"
      - "action DENY: leaves the money fields at 0 and creates an appealable REFUND_DETERMINATION Notice with a 30-day appeal deadline"

  # ---------- FraudCase ----------
  - method: POST
    path: "/fraud-cases"
    description: "Open a fraud investigation against a grant; computes the screening risk score and suspends the grant."
    roles: [FraudInvestigator]
    code: 201
    input: [taxpayer_id, grant_id, improper_start_tax_year, improper_end_tax_year, assessment_tax_year]
    output: FraudCase
    side_effects:
      - "runs the SCREENING_SNAPSHOT variant of calculations.fraud_risk_score, writing screening_risk_score; investigation_status OPEN, recovery_status NONE; opened_by_user_id set to X-User-ID"
      - "suspends the addressed grant with suspension_reason FRAUD_INVESTIGATION, which re-runs calculations.parcel_value_decomposition and increments Parcel.version by 1"
      - "sets taxpayer.status to FLAGGED"

  - method: GET
    path: "/fraud-cases/{id}"
    description: "Read one fraud case including both status dimensions and the frozen recovery ledger."
    roles: [FraudInvestigator, RecoveryOfficer, ExemptionsReviewer]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: GET
    path: "/fraud-cases"
    description: "List fraud cases filtered by taxpayer, grant or either status dimension."
    roles: [FraudInvestigator, RecoveryOfficer, ExemptionsReviewer]
    code: 200
    input: ["taxpayer_id?", "grant_id?", "investigation_status?", "recovery_status?", "limit?", "offset?"]
    output: FraudCase[]
    side_effects: []

  - method: POST
    path: "/fraud-cases/{id}/decide"
    description: "Substantiate or clear an open investigation; substantiation assesses back tax, penalty and interest."
    roles: [FraudInvestigator]
    code: 200
    input: [action, "findings?"]
    output: FraudCase
    side_effects:
      - "recomputes the ADJUDICATION_REPLAY risk score into adjudication_risk_score"
      - "action SUBSTANTIATE: runs calculations.recovery_assessment_total, advances recovery_status NONE -> ASSESSED, revokes the grant, re-runs the parcel decomposition, reverses APPROVED retroactive claims on that grant, revokes in-window income certifications, bars the taxpayer and creates an appealable RECOVERY_ASSESSMENT Notice"
      - "action CLEAR: returns the suspended grant to ACTIVE, re-runs the parcel decomposition and restores taxpayer.status to GOOD_STANDING"

  - method: POST
    path: "/fraud-cases/{id}/recovery-actions"
    description: "Collect against or abate an assessed recovery balance."
    roles: [RecoveryOfficer]
    code: 200
    input: [action, "amount_cents?", "reason?"]
    output: FraudCase
    side_effects:
      - "action PAY: raises recovery_paid_cents, advances recovery_status to PARTIALLY_PAID or PAID, raises taxpayer.lifetime_recovery_collected_cents and re-derives taxpayer.net_relief_cents"
      - "action ABATE: sets recovery_status ABATED, resets recovery_paid_cents to 0, reduces taxpayer.lifetime_recovery_collected_cents by the amount previously collected and re-derives taxpayer.net_relief_cents"

  # ---------- Notice ----------
  - method: GET
    path: "/taxpayer-accounts/{id}/notices"
    description: "List the statutory notices mailed to a taxpayer (reverse reachability for cascade-created notices, including their appeal deadlines)."
    roles: [IntakeClerk, ExemptionsReviewer, RecoveryOfficer, Taxpayer]
    code: 200
    input: ["notice_type?", "subject_id?", "subject_type?", "limit?", "offset?"]
    output: Notice[]
    side_effects: []

  # ---------- HearingDocket / Appeal ----------
  - method: POST
    path: "/hearing-dockets"
    description: "Open a hearing docket session with an aggregate capacity."
    roles: [HearingClerk]
    code: 201
    input: [docket_date, session_start_utc, session_end_utc, capacity]
    output: HearingDocket
    side_effects: ["status OPEN; scheduled_appeal_count initialised to 0"]

  - method: GET
    path: "/hearing-dockets/{id}"
    description: "Read one hearing docket including its derived slot count."
    roles: [HearingClerk, HearingOfficer]
    code: 200
    input: []
    output: HearingDocket
    side_effects: []

  - method: POST
    path: "/hearing-dockets/{id}/close"
    description: "Close a hearing docket session so no further appeals can be docketed onto it."
    roles: [HearingClerk]
    code: 200
    input: ["reason?"]
    output: HearingDocket
    side_effects:
      - "docket.status becomes CLOSED and docket.version is incremented by 1"
      - "appeals already holding slots keep them and stay SCHEDULED; scheduled_appeal_count is unchanged"
      - "every later POST /appeals/{id}/schedule naming this docket is rejected with ERR_DOCKET_CLOSED"

  - method: POST
    path: "/appeals"
    description: "File an appeal against an appealable notice."
    roles: [Taxpayer]
    code: 201
    input: [notice_id, grounds]
    output: Appeal
    side_effects: ["status FILED; filed_at stamped from the logical clock; taxpayer_id copied from the notice"]

  - method: GET
    path: "/appeals/{id}"
    description: "Read one appeal."
    roles: [HearingClerk, HearingOfficer, Taxpayer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals filtered by notice, taxpayer, docket or status."
    roles: [HearingClerk, HearingOfficer]
    code: 200
    input: ["notice_id?", "taxpayer_id?", "docket_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/schedule"
    description: "Reserve a hearing interval for an appeal on a docket."
    roles: [HearingClerk]
    code: 200
    input: [docket_id, hearing_start_utc, hearing_end_utc]
    output: Appeal
    side_effects: ["status FILED or CONTINUED -> SCHEDULED; docket.scheduled_appeal_count re-derived and docket.version incremented by 1"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Grant, deny, dismiss or continue a scheduled appeal; a granted appeal compensates the noticed action."
    roles: [HearingOfficer]
    code: 200
    input: [action, "findings?"]
    output: Appeal
    side_effects:
      - "action GRANT on a RECOVERY_ASSESSMENT notice: abates the fraud recovery, reinstates the revoked grant, re-runs the parcel decomposition and restores taxpayer.net_relief_cents"
      - "action GRANT on a DENIAL notice: returns the DENIED application to UNDER_REVIEW and clears determined_by_user_id"
      - "action GRANT on a REVOCATION notice: returns the REVOKED grant to ACTIVE and re-runs the parcel decomposition"
      - "action CONTINUE: releases the docket slot (docket_id and hearing interval cleared) and increments continuance_count"
      - "action DENY or DISMISS: records decided_by_user_id and leaves the noticed action standing"

  # ---------- Ops run ----------
  - method: POST
    path: "/assessment-roll-runs"
    description: "Advance the assessment roll to a target tax year: rolls parcel values, lapses overdue income certifications, suspends and then lapses grants whose recertification is missing."
    roles: [AssessorAnalyst]
    code: 200
    input: [target_tax_year]
    output: "{ target_tax_year: integer, parcels_rolled_count: integer, certifications_lapsed_count: integer, grants_suspended_count: integer, grants_lapsed_count: integer }"
    side_effects:
      - "every Parcel with tax_year < target_tax_year gets tax_year = target_tax_year and re-runs calculations.parcel_value_decomposition, incrementing Parcel.version by 1"
      - "CERTIFIED IncomeCertification rows whose recertification_due_date is strictly before the logical clock date become LAPSED"
      - "ACTIVE grants of recertification-required programs whose taxpayer has no CERTIFIED certification for the target year become SUSPENDED with suspension_reason RECERTIFICATION_LAPSE; grants already SUSPENDED for that reason become LAPSED"

  # ---------- Test-driving endpoints (declared scaffold surface, /_ namespace) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server starts at the fixed default 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, appeal window and recertification comparison reads this clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity state changes; subsequent mailed_at, filed_at, checked_at and due-date comparisons use the new instant"]

  - method: POST
    path: "/_registry-records"
    description: "Inject an external data-source record (voter registry, DMV, USPS national change of address, revenue department income, deed registry) for a taxpayer so verification cross-matching has something to read."
    roles: [ProgramAdministrator]
    code: 201
    input: [taxpayer_id, source, record_effective_date, "address_normalized?", "reported_income_cents?"]
    output: "{ record_id: string, taxpayer_id: string, source: string, record_effective_date: string }"
    side_effects: ["appends an immutable registry record; later verification checks read the record with the greatest record_effective_date for the (taxpayer_id, source) pair, tie-break latest insertion"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the nine declared roles"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "role Taxpayer acts on a resource whose taxpayer_id (directly or through application/grant/notice) differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting operator id equals an operator id already recorded on the resource for an incompatible step: the reviewer who determined an application decides its retroactive claim, the investigator who substantiated a fraud case records its recovery, or the hearing officer who decided an appeal was the reviewer who issued the appealed determination"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, non-integer where integer required, negative money or basis-point value, malformed ISO-8601 instant or date, or hearing_end_utc not strictly after hearing_start_utc"

  # --- existence ---
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "parcel id in path or body does not resolve"
  - id: ERR_TAXPAYER_NOT_FOUND
    http: 404
    condition: "taxpayer id in path or body does not resolve"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in body does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "exemption application id in path or body does not resolve"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "exemption grant id in path or body (including destination-side and ported_from references) does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "retroactive claim id in path does not resolve"
  - id: ERR_FRAUD_CASE_NOT_FOUND
    http: 404
    condition: "fraud case id in path does not resolve"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "notice_id in an appeal filing body does not resolve"
  - id: ERR_DOCKET_NOT_FOUND
    http: 404
    condition: "docket_id in path or scheduling body does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal id in path does not resolve"

  # --- optimistic concurrency (precondition) ---
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version on a determination does not equal the current Parcel.version"
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_grant_version on a portability transfer does not equal the current ExemptionGrant.version"

  # --- state machine guards ---
  - id: ERR_APPLICATION_NOT_DRAFT
    http: 409
    condition: "submit attempted on an application whose status is not DRAFT"
  - id: ERR_APPLICATION_NOT_UNDER_REVIEW
    http: 409
    condition: "determine attempted on an application whose status is not UNDER_REVIEW"
  - id: ERR_APPLICATION_NOT_INFO_REQUESTED
    http: 409
    condition: "respond-info attempted on an application whose status is not INFO_REQUESTED"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "port attempted on a grant whose benefit_status is SUSPENDED; the three terminal statuses are reported as ERR_GRANT_ALREADY_TERMINAL, which is evaluated first"
  - id: ERR_GRANT_NOT_SUSPENDED
    http: 409
    condition: "REINSTATE attempted on a grant whose benefit_status is ACTIVE; the three terminal statuses are reported as ERR_GRANT_ALREADY_TERMINAL, which is evaluated first"
  - id: ERR_GRANT_ALREADY_TERMINAL
    http: 409
    condition: "any compliance action or port attempted on a grant in TRANSFERRED, LAPSED or REVOKED, or a retroactive-claim decide with action APPROVE whose claim.grant_id resolves to a grant in one of those three statuses; evaluated before ERR_GRANT_NOT_ACTIVE and ERR_GRANT_NOT_SUSPENDED so a terminal grant never yields either of those"
  - id: ERR_CLAIM_NOT_PENDING
    http: 409
    condition: "decide attempted on a retroactive claim whose status is not PENDING"
  - id: ERR_CASE_ALREADY_ADJUDICATED
    http: 409
    condition: "SUBSTANTIATE or CLEAR attempted on a fraud case whose investigation_status is no longer OPEN"
  - id: ERR_RECOVERY_NOT_ASSESSED
    http: 409
    condition: "a recovery action is recorded on a fraud case whose recovery_status is NONE (case not substantiated, so no assessment exists) or already PAID or ABATED (the balance is closed)"
  - id: ERR_APPEAL_NOT_SCHEDULABLE
    http: 409
    condition: "schedule attempted on an appeal whose status is not FILED or CONTINUED"
  - id: ERR_APPEAL_NOT_SCHEDULED
    http: 409
    condition: "decide attempted on an appeal whose status is not SCHEDULED"
  - id: ERR_DOCKET_CLOSED
    http: 409
    condition: "scheduling onto a docket whose status is CLOSED"

  # --- business: safety and eligibility gates ---
  - id: ERR_TAXPAYER_BARRED
    http: 403
    condition: "the application's taxpayer has status BARRED at submit time"
  - id: ERR_FRAUD_HOLD_ACTIVE
    http: 409
    condition: "the taxpayer has at least one FraudCase with investigation_status OPEN while porting a freeze, reinstating a grant, or approving a retroactive claim"
  - id: ERR_RESIDENCY_VERIFICATION_FAILED
    http: 422
    condition: "approval attempted while the latest VOTER_REGISTRY check or the latest DEED_REGISTRY check for the application (checked_at DESC, tie-break created_at DESC) is absent or not in result MATCH"
  - id: ERR_RISK_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "SUBSTANTIATE attempted while the ADJUDICATION_REPLAY risk score is below RISK_SUBSTANTIATION_THRESHOLD (60)"

  # --- business: referential / cross-entity ---
  - id: ERR_OWNERSHIP_NOT_VERIFIED
    http: 422
    condition: "approval attempted with no VERIFIED OwnershipRecord of the program's required occupancy_type linking taxpayer and parcel across January 1 of the tax year"
  - id: ERR_DESTINATION_NOT_OWNED
    http: 422
    condition: "portability transfer whose destination parcel has no VERIFIED PRIMARY_RESIDENCE OwnershipRecord for the grant's taxpayer covering the transfer date"
  - id: ERR_EXEMPTION_TYPE_NOT_ELIGIBLE
    http: 422
    condition: "program-specific eligibility unmet: SENIOR_FREEZE age, VETERAN_DISABILITY rating, or AGRICULTURAL_USE occupancy_type"

  # --- business: temporal / interval geometry ---
  - id: ERR_OCCUPANCY_INTERVAL_OVERLAP
    http: 409
    condition: "a new PRIMARY_RESIDENCE ownership interval overlaps an existing PRIMARY_RESIDENCE interval on the same parcel under half-open [start, end) semantics"
  - id: ERR_DUPLICATE_PRIMARY_RESIDENCE
    http: 409
    condition: "a new PRIMARY_RESIDENCE ownership interval overlaps another PRIMARY_RESIDENCE interval of the same taxpayer on a different parcel"
  - id: ERR_HEARING_SLOT_CONFLICT
    http: 409
    condition: "the requested hearing interval leaves 15 minutes or less of clear time from another slot on the same docket, or falls outside the docket session window"
  - id: ERR_APPEAL_DEADLINE_PASSED
    http: 422
    condition: "appeal filed strictly after notice.appeal_deadline"
  - id: ERR_NOTICE_NOT_APPEALABLE
    http: 422
    condition: "appeal filed against a notice whose appealable flag is false"
  - id: ERR_NO_ELIGIBLE_CLAIM_YEARS
    http: 422
    condition: "the intersection of the statutory lookback window, the grant's first_eligible_tax_year floor and the requested start year is empty"
  - id: ERR_STATUTORY_LOOKBACK_EXCEEDED
    http: 422
    condition: "requested_start_tax_year is earlier than filing_tax_year minus program.statutory_lookback_years"

  # --- business: uniqueness / capacity constraints ---
  - id: ERR_CLAIM_YEARS_OVERLAP
    http: 409
    condition: "the eligible tax-year interval of a new retroactive claim intersects that of an existing PENDING or APPROVED claim on the same grant"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "another application for the same parcel, program and tax year is in SUBMITTED, UNDER_REVIEW, INFO_REQUESTED or APPROVED"
  - id: ERR_DUPLICATE_GRANT
    http: 409
    condition: "an ExemptionGrant for the same parcel, program and effective tax year is already ACTIVE or SUSPENDED"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "REQUEST_INFO attempted when application.info_request_round is already 2"
  - id: ERR_CONTINUANCE_LIMIT_REACHED
    http: 409
    condition: "CONTINUE attempted when appeal.continuance_count is already 2"
  - id: ERR_DOCKET_CAPACITY_REACHED
    http: 409
    condition: "docket.scheduled_appeal_count already equals docket.capacity"
  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "an Appeal already exists for the referenced notice"

  # --- business: fiscal ---
  - id: ERR_INCOME_CERTIFICATION_REQUIRED
    http: 422
    condition: "program requires income certification but no CERTIFIED IncomeCertification exists for the taxpayer and application tax year, or a RECERTIFICATION_LAPSE reinstatement is attempted with no CERTIFIED certification for certification_year >= grant.effective_tax_year"
  - id: ERR_INCOME_LIMIT_EXCEEDED
    http: 422
    condition: "certified household_income_cents strictly exceeds program.income_limit_cents"
  - id: ERR_ASSET_LIMIT_EXCEEDED
    http: 422
    condition: "certified countable_asset_cents strictly exceeds program.asset_limit_cents"
  - id: ERR_PORTABLE_BALANCE_EXHAUSTED
    http: 422
    condition: "the portable allocation min(transfer_value_cents, source.portable_balance_cents, destination assessed value) computes to zero or less"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a recovery payment exceeds total_assessed_cents minus recovery_paid_cents"

# ============================================================================
# 1.7 RBAC Matrix
#   role_model: segregation_of_duties over peer operational units. Nine roles.
#   X-User-Role selects the role; X-User-ID is the actor identity. Only
#   Taxpayer is entity_backed; every operator role is opaque, and no opaque id
#   is ever compared to an entity id — opaque ids are only compared to other
#   opaque ids recorded on the resource (determined_by_user_id,
#   substantiated_by_user_id, decided_by_user_id) for duty separation.
# ============================================================================

roles:
  - name: Taxpayer
    description: "the property owner or applicant; may read only their own records, answer information requests, file retroactive claims and file appeals"
    identity: "entity_backed:TaxpayerAccount"
    exclusive_operations:
      - "POST /exemption-applications/{id}/respond-info"
      - "POST /appeals"
    shared_operations:
      - "POST /retroactive-claims"
      - "GET /taxpayer-accounts/{id}"
      - "GET /exemption-applications/{id}"
      - "GET /taxpayer-accounts/{id}/income-certifications"
      - "GET /exemption-grants/{id}"
      - "GET /exemption-grants"
      - "GET /retroactive-claims/{id}"
      - "GET /exemption-grants/{id}/retroactive-claims"
      - "GET /taxpayer-accounts/{id}/notices"
      - "GET /appeals/{id}"
    ownership_rule: "every Taxpayer request must resolve to a TaxpayerAccount whose id equals X-User-ID: directly for /taxpayer-accounts/{id} and its sub-resources, through application.taxpayer_id, grant.taxpayer_id, claim -> grant.taxpayer_id, notice.taxpayer_id and appeal.taxpayer_id otherwise; otherwise ERR_NOT_RESOURCE_OWNER"

  - name: ProgramAdministrator
    description: "configures relief programs and operates the test-driving registry and clock endpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /relief-programs"
      - "POST /_clock/set_current_utc"
      - "POST /_registry-records"
    shared_operations:
      - "GET /relief-programs/{id}"

  - name: AssessorAnalyst
    description: "maintains the parcel roll, ownership and occupancy records, and runs the annual assessment roll"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels"
      - "POST /ownership-records"
      - "POST /assessment-roll-runs"
    shared_operations:
      - "GET /parcels/{id}"
      - "GET /ownership-records/{id}"
      - "GET /ownership-records"
      - "GET /exemption-grants/{id}"
      - "GET /exemption-grants"

  - name: IntakeClerk
    description: "opens taxpayer accounts and applications, records verification checks and income certifications, and submits applications for review; may never determine an application"
    identity: "opaque"
    exclusive_operations:
      - "POST /taxpayer-accounts"
      - "POST /exemption-applications"
      - "POST /exemption-applications/{id}/submit"
      - "POST /income-certifications"
    shared_operations:
      - "POST /exemption-applications/{id}/verification-checks"
      - "POST /retroactive-claims"
      - "GET /relief-programs/{id}"
      - "GET /parcels/{id}"
      - "GET /taxpayer-accounts/{id}"
      - "GET /exemption-applications/{id}"
      - "GET /exemption-applications"
      - "GET /exemption-applications/{id}/verification-checks"
      - "GET /taxpayer-accounts/{id}/income-certifications"
      - "GET /retroactive-claims/{id}"
      - "GET /exemption-grants/{id}/retroactive-claims"
      - "GET /taxpayer-accounts/{id}/notices"

  - name: ExemptionsReviewer
    description: "determines applications, mints and ports grants, runs compliance actions on grants and decides retroactive claims; the reviewer who determined an application may not later decide that grant's retroactive claim"
    identity: "opaque"
    exclusive_operations:
      - "POST /exemption-applications/{id}/determine"
      - "POST /exemption-grants/{id}/port"
      - "POST /exemption-grants/{id}/compliance-actions"
      - "POST /retroactive-claims/{id}/decide"
    shared_operations:
      - "POST /exemption-applications/{id}/verification-checks"
      - "GET /relief-programs/{id}"
      - "GET /parcels/{id}"
      - "GET /taxpayer-accounts/{id}"
      - "GET /ownership-records/{id}"
      - "GET /ownership-records"
      - "GET /exemption-applications/{id}"
      - "GET /exemption-applications"
      - "GET /exemption-applications/{id}/verification-checks"
      - "GET /taxpayer-accounts/{id}/income-certifications"
      - "GET /exemption-grants/{id}"
      - "GET /exemption-grants"
      - "GET /retroactive-claims/{id}"
      - "GET /exemption-grants/{id}/retroactive-claims"
      - "GET /fraud-cases/{id}"
      - "GET /fraud-cases"
      - "GET /taxpayer-accounts/{id}/notices"

  - name: FraudInvestigator
    description: "opens fraud cases from address and registration cross-matches and adjudicates them; may never record the money movement on a case it substantiated"
    identity: "opaque"
    exclusive_operations:
      - "POST /fraud-cases"
      - "POST /fraud-cases/{id}/decide"
    shared_operations:
      - "GET /parcels/{id}"
      - "GET /taxpayer-accounts/{id}"
      - "GET /exemption-applications/{id}/verification-checks"
      - "GET /exemption-grants/{id}"
      - "GET /exemption-grants"
      - "GET /fraud-cases/{id}"
      - "GET /fraud-cases"

  - name: RecoveryOfficer
    description: "collects, waives and writes off recovery assessments raised by substantiated fraud cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /fraud-cases/{id}/recovery-actions"
    shared_operations:
      - "GET /taxpayer-accounts/{id}"
      - "GET /fraud-cases/{id}"
      - "GET /fraud-cases"
      - "GET /taxpayer-accounts/{id}/notices"

  - name: HearingClerk
    description: "opens hearing dockets and schedules appeals onto docket slots; may never decide an appeal"
    identity: "opaque"
    exclusive_operations:
      - "POST /hearing-dockets"
      - "POST /hearing-dockets/{id}/close"
      - "POST /appeals/{id}/schedule"
    shared_operations:
      - "GET /hearing-dockets/{id}"
      - "GET /appeals/{id}"
      - "GET /appeals"

  - name: HearingOfficer
    description: "hears scheduled appeals and issues the decision that can grant, deny, dismiss or continue them"
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET /hearing-dockets/{id}"
      - "GET /appeals/{id}"
      - "GET /appeals"
