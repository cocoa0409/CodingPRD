# =============================================================================
# Commercial Printing Plant (web/sheetfed) — PRD Benchmark Scaffold
# =============================================================================
scenario: |
  Commercial Printing Plant (web/sheetfed): estimate by signature/impression &
  make-ready, prepress proof & customer approval hold, paper purchase & spoilage
  allowance, press scheduling & gang-run consolidation, bindery routing &
  finishing options, postal presort & mail drop linkage, overrun/underrun
  tolerance billing, reprint liability & credit

domain_name: commercial-printing-plant
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  difficulty_level: expert_plus   # deliberately beyond Expert band per request
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat           # all resources top-level; FK links in bodies; reverse reads via filtered lists
  state_machine_shape: cyclic     # Proof revision loop, GangRun FORMING<->LOCKED loop; Job has parallel billing dimension; Customer is posture-driven
  relationship_patterns:
    - one_to_many
    - self_referential            # Job.parent_job_id -> Job.id (reprint jobs)
    - cross_aggregate             # PressRun links Job + Press + GangRun; ReprintClaim links Job + Invoice
  role_model: segregation_of_duties   # claim reviewer != claim approver; otherwise peer_roles by department
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed exposure in cents; must be >= 0" }
      - { name: default_tolerance_pct, type: integer, source: input, default: 5, description: "Overrun/underrun tolerance percent applied to jobs at accept time" }
      - { name: exposure_cents, type: integer, source: computed, description: "Sum of amount_outstanding_cents of invoices in {ISSUED, PARTIALLY_PAID, DISPUTED} for this customer + sum of total_price_cents of jobs (snapshot at accept) with billing_status == UNBILLED and production_status not in {CLOSED, CANCELLED}" }
      - { name: posture, type: enum, source: computed, description: "ACTIVE | CREDIT_HOLD — CREDIT_HOLD iff exposure_cents > credit_limit_cents (equality stays ACTIVE)" }
      - { name: reprint_credit_balance_cents, type: integer, source: computed, default: 0, description: "Unapplied reprint credit remainder available for apply-credit on this customer's invoices" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: job_name, type: string, source: input, description: "Free-form job name" }
      - { name: quantity_ordered, type: integer, source: input, description: "Ordered pieces; must be >= 1" }
      - { name: press_type, type: enum, source: input, description: "WEB | SHEETFED" }
      - { name: binding_method, type: enum, source: input, description: "SADDLE_STITCH | PERFECT_BIND | CASE_BIND | PLASTIC_COIL" }
      - { name: fulfillment_type, type: enum, source: input, description: "SHIP | MAIL" }
      - { name: signatures, type: array, source: input, description: "Array of {name, pages, up_count, paper_stock_id, make_ready_cents, rate_per_thousand_cents}; up_count >= 1; make_ready_cents >= 0; rate_per_thousand_cents >= 0; at least 1 signature" }
      - { name: finishing_options, type: array, source: input, default: [], description: "Array of enum PERF | SCORE | UV_COAT | LAMINATE | FOIL | DIE_CUT; each maps to a flat fee" }
      - { name: press_spoilage_pct, type: number, source: input, description: "Press-stage spoilage percent (e.g., 3 means 3%); >= 0" }
      - { name: bindery_spoilage_pct, type: number, source: input, description: "Bindery-stage spoilage percent; >= 0" }
      - { name: included_proof_rounds, type: integer, source: input, default: 2, description: "Proof rounds included before per-round overage fee applies" }
      - { name: quote_valid_days, type: integer, source: input, default: 30, description: "Days the QUOTED estimate remains acceptable" }
      - { name: due_date, type: datetime, source: input, description: "Customer due date (ISO8601)" }
      - { name: impressions_per_signature, type: array, source: computed, description: "ceil(quantity_ordered / up_count) per signature, same order as signatures[]" }
      - { name: total_impressions, type: integer, source: computed, description: "Sum of impressions_per_signature" }
      - { name: make_ready_total_cents, type: integer, source: computed, description: "Sum of signatures[].make_ready_cents" }
      - { name: running_cost_cents, type: integer, source: computed, description: "Sum over signatures of round_half_up(impressions_s * rate_per_thousand_cents_s / 1000); rounding applied PER SIGNATURE before summing" }
      - { name: paper_sheets_total, type: integer, source: computed, description: "Sum over signatures of ceil(ceil(impressions_s * (1 + press_spoilage_pct/100)) * (1 + bindery_spoilage_pct/100))" }
      - { name: paper_cost_cents, type: integer, source: computed, description: "Sum over signatures of sheets_s * stock.cost_per_sheet_cents (integer multiplication, no rounding)" }
      - { name: finishing_cost_cents, type: integer, source: computed, description: "Sum of flat fees for finishing_options: PERF 18000, SCORE 12000, UV_COAT 40000, LAMINATE 55000, FOIL 75000, DIE_CUT 60000" }
      - { name: subtotal_cents, type: integer, source: computed, description: "make_ready_total_cents + running_cost_cents + paper_cost_cents + finishing_cost_cents" }
      - { name: discount_pct, type: number, source: computed, description: "Tier on subtotal_cents: subtotal < 500000 -> 0; 500000 <= subtotal < 2000000 -> 3; subtotal >= 2000000 -> 5" }
      - { name: total_price_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * (1 - discount_pct/100))" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | ACCEPTED | DECLINED | EXPIRED" }
      - { name: quoted_at, type: datetime, source: system, description: "Set when status becomes QUOTED" }
      - { name: expires_at, type: datetime, source: computed, description: "quoted_at + quote_valid_days days; null until QUOTED" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; null for reprint jobs" , constraints: "nullable" }
      - { name: parent_job_id, type: string, source: system, description: "FK -> Job.id; set on reprint jobs created by claim approval; null otherwise", constraints: "nullable" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from estimate at accept (or from parent job for reprints)" }
      - { name: zero_charge, type: boolean, source: system, default: false, description: "true on reprint jobs; such jobs are never invoiced" }
      - { name: quantity_ordered, type: integer, source: system, description: "Snapshot from estimate (or defect_qty for reprints)" }
      - { name: due_date, type: datetime, source: system, description: "Snapshot from estimate" }
      - { name: press_type, type: enum, source: system, description: "WEB | SHEETFED (snapshot)" }
      - { name: fulfillment_type, type: enum, source: system, description: "SHIP | MAIL (snapshot)" }
      - { name: binding_method, type: enum, source: system, description: "Snapshot from estimate" }
      - { name: signatures, type: array, source: system, description: "Snapshot of estimate.signatures at accept" }
      - { name: press_spoilage_pct, type: number, source: system, description: "Snapshot" }
      - { name: bindery_spoilage_pct, type: number, source: system, description: "Snapshot" }
      - { name: included_proof_rounds, type: integer, source: system, description: "Snapshot" }
      - { name: tolerance_pct, type: integer, source: system, description: "Snapshot of customer.default_tolerance_pct at accept" }
      - { name: total_impressions, type: integer, source: system, description: "Snapshot of estimate.total_impressions" }
      - { name: make_ready_total_cents, type: integer, source: system, description: "Snapshot of estimate.make_ready_total_cents" }
      - { name: total_price_cents, type: integer, source: system, description: "Snapshot of estimate.total_price_cents (provisional value at accept; never recomputed afterwards)" }
      - { name: discount_pct, type: number, source: system, description: "Snapshot of estimate.discount_pct at accept" }
      - { name: subtotal_cents, type: integer, source: system, description: "Snapshot of estimate.subtotal_cents at accept" }
      - { name: production_status, type: enum, source: system, description: "PREPRESS | PROOF_REVIEW | PLATED | PRESS_SCHEDULED | BINDERY | READY_TO_SHIP | FULFILLED | CLOSED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED | SETTLED | NOT_BILLABLE — parallel dimension, evolves independently of production_status" }
      - { name: gang_run_id, type: string, source: system, description: "FK -> GangRun.id; set while job is a gang member; null otherwise", constraints: "nullable" }
      - { name: allocated_make_ready_cents, type: integer, source: computed, description: "Gang-allocated make-ready share; null unless job is member of a LOCKED/CONSUMED gang" }
      - { name: delivered_quantity, type: integer, source: system, description: "Set by record-delivery (SHIP) or mail drop (MAIL); null until FULFILLED", constraints: "nullable" }
      - { name: proof_rounds_used, type: integer, source: system, default: 0, description: "Count of Proof rows created for this job" }

  - name: Proof
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: file_uri, type: string, source: input, description: "Proof artifact location" }
      - { name: round_number, type: integer, source: system, description: "1 + max(existing round_number for job); 1 for first proof" }
      - { name: status, type: enum, source: system, description: "AWAITING_CUSTOMER | CHANGES_REQUESTED | APPROVED | SUPERSEDED" }
      - { name: decided_at, type: datetime, source: system, description: "Set on APPROVED / CHANGES_REQUESTED", constraints: "nullable" }

  - name: PaperStock
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Stock name (e.g., '80# gloss text')" }
      - { name: grade, type: enum, source: input, description: "COATED | UNCOATED | NEWSPRINT" }
      - { name: cost_per_sheet_cents, type: integer, source: input, description: "Catalog cost per sheet; >= 0" }
      - { name: reorder_threshold_sheets, type: integer, source: input, description: "Auto-replenishment triggers when available sheets drop strictly below this; >= 0" }
      - { name: reorder_quantity_sheets, type: integer, source: input, description: "Sheets ordered on an auto-replenishment PO; >= 1" }
      - { name: available_sheets, type: integer, source: computed, description: "Sum of remaining_sheets over all lots of this stock (remaining already excludes reserved)" }

  - name: PaperPurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: paper_stock_id, type: string, source: input, description: "FK -> PaperStock.id" }
      - { name: ordered_sheets, type: integer, source: input, description: "Sheets ordered; >= 1" }
      - { name: cost_per_sheet_cents, type: integer, source: input, description: "Purchase cost per sheet; >= 0" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_REPLENISH" }
      - { name: received_sheets_total, type: integer, source: system, default: 0, description: "Cumulative sheets received (excluding damaged)" }
      - { name: status, type: enum, source: system, description: "ORDERED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED" }

  - name: PaperLot
    parent: null
    common_fields: true
    fields:
      - { name: paper_stock_id, type: string, source: system, description: "FK -> PaperStock.id; copied from PO" }
      - { name: paper_purchase_order_id, type: string, source: system, description: "FK -> PaperPurchaseOrder.id; one lot per PO, created on first receive" }
      - { name: received_sheets, type: integer, source: system, default: 0, description: "Cumulative good sheets received into this lot" }
      - { name: damaged_sheets, type: integer, source: system, default: 0, description: "Cumulative sheets received damaged (quarantined, unusable)" }
      - { name: reserved_sheets, type: integer, source: system, default: 0, description: "Sheets reserved by SCHEDULED press runs" }
      - { name: consumed_sheets, type: integer, source: system, default: 0, description: "Sheets consumed by COMPLETE press runs" }
      - { name: remaining_sheets, type: integer, source: computed, description: "received_sheets - reserved_sheets - consumed_sheets - damaged_sheets (conservation invariant)" }

  - name: Press
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Press name" }
      - { name: press_type, type: enum, source: input, description: "WEB | SHEETFED" }
      - { name: rated_impressions_per_hour, type: integer, source: input, description: "Rated speed; >= 1" }
      - { name: make_ready_minutes_base, type: integer, source: input, description: "Base make-ready minutes per run; >= 0" }
      - { name: washup_buffer_minutes, type: integer, source: input, description: "Buffer appended after each run's end for overlap checks; >= 0" }
      - { name: status, type: enum, source: input, default: AVAILABLE, description: "AVAILABLE | DOWN" }

  - name: PressRun
    parent: null
    common_fields: true
    fields:
      - { name: press_id, type: string, source: input, description: "FK -> Press.id" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; null when gang_run_id is set", constraints: "nullable" }
      - { name: gang_run_id, type: string, source: input, description: "FK -> GangRun.id; null for solo runs", constraints: "nullable" }
      - { name: run_quantity, type: integer, source: input, description: "Planned pieces; solo: 1..job.quantity_ordered; gang: must equal sum of member quantities" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO8601)" }
      - { name: planned_impressions, type: integer, source: computed, description: "Solo: sum over job signatures of ceil(run_quantity / up_count). Gang: sum over member jobs' total_impressions" }
      - { name: planned_sheets, type: integer, source: computed, description: "Spoilage-compounded sheets reserved: sum per signature of ceil(ceil(impressions_s * (1+press_spoilage)) * (1+bindery_spoilage)); gang: sum over member jobs" }
      - { name: duration_minutes, type: integer, source: computed, description: "press.make_ready_minutes_base + ceil(planned_impressions / press.rated_impressions_per_hour * 60)" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + duration_minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETE | CANCELLED" }
      - { name: gross_impressions, type: integer, source: input, description: "Actual impressions printed; set at complete" }
      - { name: sheets_used, type: integer, source: input, description: "Actual sheets consumed (press counter); set at complete" }
      - { name: waste_sheets, type: integer, source: input, description: "Spoiled sheets subset of sheets_used; set at complete; 0 <= waste_sheets <= sheets_used" }

  - name: GangRun
    parent: null
    common_fields: true
    fields:
      - { name: paper_stock_id, type: string, source: input, description: "FK -> PaperStock.id; every signature of every member job must use this stock" }
      - { name: press_type, type: enum, source: input, description: "WEB | SHEETFED" }
      - { name: anchor_due_date, type: datetime, source: input, description: "Member jobs' due_date must be within +/- 3 days inclusive" }
      - { name: status, type: enum, source: system, description: "FORMING | LOCKED | CONSUMED" }
      - { name: members, type: array, source: system, default: [], description: "Array of {job_id, added_at, allocated_make_ready_cents}; allocated share computed at lock; job_id references Job.id (member jobs back-reference via Job.gang_run_id)" }
      - { name: make_ready_total_cents, type: integer, source: computed, description: "max over members of member.make_ready_total_cents; null until lock", constraints: "nullable" }

  - name: BinderyTicket
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: operation, type: enum, source: input, description: "FOLD | STITCH | TRIM | PERF | SCORE | UV_COAT | LAMINATE | FOIL | DIE_CUT | COLLATE | PAD" }
      - { name: sequence_no, type: integer, source: input, description: "Routing order within job; >= 1; unique per job" }
      - { name: pieces_completed, type: integer, source: input, description: "Output pieces; set at complete; >= 0" }
      - { name: status, type: enum, source: system, description: "QUEUED | COMPLETE" }

  - name: MailDrop
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; job must have fulfillment_type MAIL" }
      - { name: drop_date, type: string, source: input, description: "Calendar date YYYY-MM-DD of the mail drop" }
      - { name: destination_entry, type: enum, source: input, description: "NONE | BMC | SCF | DDU" }
      - { name: piece_weight_oz, type: number, source: input, description: "Weight per piece; informational" }
      - { name: zip_counts, type: array, source: input, description: "Array of {zip5, pieces}: 5-digit ZIP prefix string and piece count >= 1; at least one entry" }
      - { name: total_pieces, type: integer, source: computed, description: "Sum of zip_counts[].pieces" }
      - { name: tier_breakdown, type: object, source: computed, description: "{five_digit_pieces, three_digit_pieces, aadc_pieces} after presort" }
      - { name: postage_cents, type: integer, source: computed, description: "five_digit_pieces*24 + three_digit_pieces*28 + aadc_pieces*31; null until presort", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | PRESORTED | DROPPED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from job" }
      - { name: kind, type: enum, source: system, description: "PRODUCTION | CANCELLATION_FEE" }
      - { name: quantity_ordered, type: integer, source: system, description: "Snapshot" }
      - { name: delivered_quantity, type: integer, source: system, description: "Snapshot at generation" }
      - { name: billable_quantity, type: integer, source: computed, description: "Tolerance-adjusted billable pieces (see overrun_underrun_billing)" }
      - { name: base_amount_cents, type: integer, source: computed, description: "round_half_up(job_total_basis_cents * billable_quantity / quantity_ordered); job_total_basis uses gang-adjusted total when job ganged, else job.total_price_cents" }
      - { name: postage_cents, type: integer, source: computed, default: 0, description: "Sum of postage_cents over job's MailDrops in status DROPPED at generation" }
      - { name: proof_overage_cents, type: integer, source: computed, default: 0, description: "max(0, job.proof_rounds_used - job.included_proof_rounds) * 12500" }
      - { name: shortage_credit_cents, type: integer, source: computed, default: 0, description: "Underrun penalty credit (see overrun_underrun_billing)" }
      - { name: gang_make_ready_allocated_cents, type: integer, source: computed, description: "Member's gang allocation when ganged; null otherwise", constraints: "nullable" }
      - { name: total_due_cents, type: integer, source: computed, description: "base_amount_cents + postage_cents + proof_overage_cents - shortage_credit_cents; CANCELLATION_FEE kind: job.make_ready_total_cents exactly" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments" }
      - { name: credit_applied_cents, type: integer, source: system, default: 0, description: "Cumulative credits applied (reprint sweep or apply-credit)" }
      - { name: amount_outstanding_cents, type: integer, source: computed, description: "total_due_cents - amount_paid_cents - credit_applied_cents (monetary conservation invariant)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | DISPUTED" }

  - name: ReprintClaim
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; job must be FULFILLED or CLOSED" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; the job's PRODUCTION invoice, bound at approve time for CREDIT resolution", constraints: "nullable" }
      - { name: claimed_defect, type: enum, source: input, description: "MISREGISTER | COLOR_SHIFT | TRIM_ERROR | BINDING_DEFECT | PAPER_STOCK_WRONG | SHORTAGE" }
      - { name: defect_qty, type: integer, source: input, description: "Defective pieces claimed; 1 <= defect_qty <= job.delivered_quantity" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the PlantManager who moved the claim to UNDER_REVIEW", constraints: "nullable" }
      - { name: resolution, type: enum, source: system, description: "REPRINT | CREDIT; set at approve", constraints: "nullable" }
      - { name: liability_pct, type: integer, source: system, description: "25 | 50 | 100; set at approve", constraints: "nullable" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "At approve (CREDIT): round_half_up(invoice.base_amount_cents * liability_pct/100 * defect_qty / invoice.delivered_quantity)", constraints: "nullable" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Credit actually issued: min(round_half_up(invoice.total_due_cents * liability_pct/100 * defect_qty / invoice.delivered_quantity), invoice.total_due_cents)", constraints: "nullable" }
      - { name: reprint_job_id, type: string, source: system, description: "FK -> Job.id; reprint job created when resolution == REPRINT", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /estimates/{id}/quote"
        actor: Estimator
        preconditions:
          - "Estimate must have at least 1 signature (guaranteed by create validation)"
        side_effects:
          - "quoted_at = current logical clock; expires_at = quoted_at + quote_valid_days days"
          - "increments Estimate.version by 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Acting Customer.id == estimate.customer_id (ERR_NOT_OWN_RESOURCE)"
          - "current clock <= expires_at, else transition estimate to EXPIRED and fail with ERR_ESTIMATE_EXPIRED"
          - "customer.posture == ACTIVE (ERR_CREDIT_HOLD)"
        side_effects:
          - "Create Job: production_status PREPRESS, billing_status UNBILLED, zero_charge false, snapshot of all estimate pricing fields, tolerance_pct from customer.default_tolerance_pct"
          - "Recompute customer.exposure_cents and posture (new UNBILLED job adds total_price_cents)"
          - "increments Estimate.version by 1"
      - from: QUOTED
        to: DECLINED
        trigger: "POST /estimates/{id}/decline"
        actor: Customer
        preconditions:
          - "Acting Customer.id == estimate.customer_id (ERR_NOT_OWN_RESOURCE)"
        side_effects: ["increments Estimate.version by 1"]
      - from: QUOTED
        to: EXPIRED
        trigger: "system (evaluated lazily when an accept is attempted after expires_at, or when the clock advances past expires_at)"
        actor: system
        preconditions: ["current clock > expires_at"]
        side_effects: ["increments Estimate.version by 1"]

  - entity: Job
    initial_state: PREPRESS
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PREPRESS
        to: PROOF_REVIEW
        trigger: "system (first Proof created for the job)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: PROOF_REVIEW
        to: PLATED
        trigger: "system (a Proof of this job transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: PLATED
        to: PRESS_SCHEDULED
        trigger: "system (first PressRun created referencing this job, or gang containing this job gets a PressRun)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: PRESS_SCHEDULED
        to: BINDERY
        trigger: "system (a PressRun for this job completes AND no other SCHEDULED PressRun references this job; for gang members: the gang PressRun completes)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: BINDERY
        to: READY_TO_SHIP
        trigger: "system (all BinderyTickets of the job are COMPLETE and at least 1 exists)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: READY_TO_SHIP
        to: FULFILLED
        trigger: "POST /jobs/{id}/record-delivery (fulfillment_type SHIP) or system on MailDrop drop (fulfillment_type MAIL)"
        actor: PlantManager | system
        preconditions:
          - "SHIP jobs: record-delivery with delivered_quantity >= 1"
          - "MAIL jobs: a MailDrop of the job transitions to DROPPED; delivered_quantity := mail_drop.total_pieces"
        side_effects: ["increments Job.version by 1"]
      - from: FULFILLED
        to: CLOSED
        trigger: "system (billing_status becomes SETTLED while production_status == FULFILLED)"
        actor: system
        preconditions: []
        side_effects: ["increments Job.version by 1"]
      - from: PREPRESS
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["job not member of a LOCKED gang (ERR_JOB_IN_LOCKED_GANG)"]
        side_effects:
          - "No cancellation fee; billing_status := NOT_BILLABLE"
          - "increments Job.version by 1"
      - from: PROOF_REVIEW
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["job not member of a LOCKED gang (ERR_JOB_IN_LOCKED_GANG)"]
        side_effects:
          - "No cancellation fee; billing_status := NOT_BILLABLE; any non-terminal Proofs -> SUPERSEDED"
          - "increments Job.version by 1"
      - from: PLATED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["job not member of a LOCKED gang (ERR_JOB_IN_LOCKED_GANG)"]
        side_effects:
          - "If member of a FORMING gang: remove membership (job removed from GangRun.members, gang version increments)"
          - "Auto-create Invoice kind CANCELLATION_FEE status ISSUED with total_due_cents = job.make_ready_total_cents; billing_status := INVOICED"
          - "Recompute customer.exposure_cents and posture"
          - "increments Job.version by 1"
      - from: PRESS_SCHEDULED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["job not member of a LOCKED gang (ERR_JOB_IN_LOCKED_GANG)"]
        side_effects:
          - "All SCHEDULED PressRuns of the job -> CANCELLED; their lot reservations released (reserved_sheets decrease, remaining_sheets increase)"
          - "Auto-create Invoice kind CANCELLATION_FEE status ISSUED with total_due_cents = job.make_ready_total_cents; billing_status := INVOICED"
          - "Recompute customer.exposure_cents and posture"
          - "increments Job.version by 1"

  - entity: JobBilling
    note: "Parallel state dimension on the Job entity (billing_status), evolving independently of production_status"
    initial_state: UNBILLED
    terminal_states: [SETTLED, NOT_BILLABLE]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system (an Invoice for this job transitions DRAFT -> ISSUED, or a CANCELLATION_FEE invoice is auto-created ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: SETTLED
        trigger: "system (every non-void Invoice of this job reaches PAID; evaluated on each payment/credit application)"
        actor: system
        preconditions: []
        side_effects:
          - "If production_status == FULFILLED: production_status := CLOSED"
      - from: UNBILLED
        to: NOT_BILLABLE
        trigger: "system (job cancelled before any invoice, or reprint job created with zero_charge)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Proof
    initial_state: AWAITING_CUSTOMER
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: AWAITING_CUSTOMER
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Customer
        preconditions:
          - "Acting Customer.id == proof.job.customer_id (ERR_NOT_OWN_RESOURCE)"
          - "Job production_status == PROOF_REVIEW (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "decided_at set; Job PROOF_REVIEW -> PLATED"
          - "increments Proof.version by 1"
      - from: AWAITING_CUSTOMER
        to: CHANGES_REQUESTED
        trigger: "POST /proofs/{id}/request-changes"
        actor: Customer
        preconditions:
          - "Acting Customer.id == proof.job.customer_id (ERR_NOT_OWN_RESOURCE)"
          - "Job production_status == PROOF_REVIEW (ERR_JOB_INVALID_STATE)"
        side_effects: ["decided_at set", "increments Proof.version by 1"]
      - from: AWAITING_CUSTOMER
        to: SUPERSEDED
        trigger: "system (a new Proof is created for the same job)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system (a new Proof is created for the same job)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PressRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETE
        trigger: "POST /press-runs/{id}/complete"
        actor: PressScheduler
        preconditions:
          - "waste_sheets <= sheets_used (ERR_VALIDATION)"
          - "If sheets_used > reserved: unreserved remainder must be coverable from available lots FIFO (ERR_PAPER_INSUFFICIENT)"
        side_effects:
          - "Consume paper: reserved sheets of this run convert reserved->consumed per lot (FIFO draw recorded at schedule); shortfall beyond reserved draws additional sheets FIFO by lot.created_at ASC; unused reservation released"
          - "Job(s): if no other SCHEDULED run references the job: PRESS_SCHEDULED -> BINDERY (all member jobs for gang runs)"
          - "GangRun (if gang run): LOCKED -> CONSUMED"
          - "For each stock consumed: recompute PaperStock.available_sheets; if available_sheets < reorder_threshold_sheets AND no open (ORDERED/PARTIALLY_RECEIVED) AUTO_REPLENISH PO exists for the stock: auto-create PaperPurchaseOrder(source=AUTO_REPLENISH, ordered_sheets=reorder_quantity_sheets, cost_per_sheet_cents=stock.cost_per_sheet_cents, status=ORDERED)"
          - "increments PressRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /press-runs/{id}/cancel or system (owning job cancelled)"
        actor: PressScheduler | system
        preconditions: []
        side_effects:
          - "Release all lot reservations of this run (reserved_sheets decrease)"
          - "Job (solo run, still PRESS_SCHEDULED, no other SCHEDULED runs): remains PRESS_SCHEDULED (no auto-revert)"
          - "increments PressRun.version by 1"

  - entity: GangRun
    initial_state: FORMING
    terminal_states: [CONSUMED]
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /gang-runs/{id}/lock"
        actor: PressScheduler
        preconditions:
          - "members count >= 2 (ERR_GANG_TOO_SMALL) and <= 6 (ERR_GANG_FULL)"
          - "Every member job production_status == PLATED (ERR_GANG_INELIGIBLE_JOB)"
        side_effects:
          - "make_ready_total_cents := max(member.make_ready_total_cents)"
          - "Per-member allocated_make_ready_cents computed (gang_make_ready_allocation); each member Job.allocated_make_ready_cents set; each member Job.version increments"
          - "increments GangRun.version by 1"
      - from: LOCKED
        to: FORMING
        trigger: "POST /gang-runs/{id}/unlock"
        actor: PressScheduler
        preconditions:
          - "No PressRun in SCHEDULED status references this gang (ERR_GANG_HAS_SCHEDULED_RUN)"
        side_effects:
          - "All member allocated_make_ready_cents cleared to null; make_ready_total_cents cleared to null"
          - "increments GangRun.version by 1"
      - from: LOCKED
        to: CONSUMED
        trigger: "system (the PressRun referencing this gang completes)"
        actor: system
        preconditions: []
        side_effects: ["increments GangRun.version by 1"]

  - entity: PaperPurchaseOrder
    initial_state: ORDERED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: ORDERED
        to: PARTIALLY_RECEIVED
        trigger: "POST /paper-purchase-orders/{id}/receive"
        actor: PurchasingManager
        preconditions:
          - "received_sheets_total + sheets_received <= floor(ordered_sheets * 1.10) (ERR_OVER_RECEIPT)"
          - "After this receipt received_sheets_total < ordered_sheets"
        side_effects:
          - "PaperLot for this PO created on first receive (or reused): received_sheets += sheets_received; damaged_sheets += sheets_damaged"
          - "Recompute stock.available_sheets; increments PO.version by 1"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /paper-purchase-orders/{id}/receive"
        actor: PurchasingManager
        preconditions:
          - "received_sheets_total + sheets_received <= floor(ordered_sheets * 1.10) (ERR_OVER_RECEIPT)"
          - "After this receipt received_sheets_total >= ordered_sheets"
        side_effects: ["Same lot effects as partial receive", "increments PO.version by 1"]
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /paper-purchase-orders/{id}/receive"
        actor: PurchasingManager
        preconditions: ["Same over-receipt cap", "Still below ordered_sheets after receipt"]
        side_effects: ["Same lot effects as partial receive", "increments PO.version by 1"]
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /paper-purchase-orders/{id}/receive"
        actor: PurchasingManager
        preconditions: ["Same over-receipt cap", "Reaches or exceeds ordered_sheets after receipt"]
        side_effects: ["Same lot effects as partial receive", "increments PO.version by 1"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /paper-purchase-orders/{id}/cancel"
        actor: PurchasingManager
        preconditions: []
        side_effects: ["increments PO.version by 1"]
      - from: PARTIALLY_RECEIVED
        to: CANCELLED
        trigger: "POST /paper-purchase-orders/{id}/cancel"
        actor: PurchasingManager
        preconditions: []
        side_effects:
          - "Existing lot unchanged (compensation: no further receives possible; conservation invariant preserved)"
          - "increments PO.version by 1"

  - entity: BinderyTicket
    initial_state: QUEUED
    terminal_states: [COMPLETE]
    transitions:
      - from: QUEUED
        to: COMPLETE
        trigger: "POST /bindery-tickets/{id}/complete"
        actor: PlantManager
        preconditions:
          - "Job production_status in {BINDERY} (ERR_JOB_INVALID_STATE)"
          - "All tickets of the same job with lower sequence_no are COMPLETE (ERR_BINDERY_SEQUENCE)"
        side_effects:
          - "If this was the last non-COMPLETE ticket: Job BINDERY -> READY_TO_SHIP"
          - "increments BinderyTicket.version by 1"

  - entity: MailDrop
    initial_state: PLANNED
    terminal_states: [DROPPED]
    transitions:
      - from: PLANNED
        to: PRESORTED
        trigger: "POST /mail-drops/{id}/presort"
        actor: MailSpecialist
        preconditions:
          - "Aggregate daily capacity: sum(total_pieces of MailDrops with status in {PRESORTED, DROPPED} on same drop_date) + this.total_pieces <= 100000 (ERR_MAIL_CAPACITY_EXCEEDED)"
        side_effects:
          - "tier_breakdown and postage_cents computed (presort_postage_waterfall)"
          - "increments MailDrop.version by 1"
      - from: PRESORTED
        to: DROPPED
        trigger: "POST /mail-drops/{id}/drop"
        actor: MailSpecialist
        preconditions:
          - "Job production_status == READY_TO_SHIP and job.fulfillment_type == MAIL (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "Job READY_TO_SHIP -> FULFILLED; job.delivered_quantity := this.total_pieces"
          - "increments MailDrop.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue or system (CANCELLATION_FEE invoices are created already ISSUED)"
        actor: PlantManager | system
        preconditions: []
        side_effects:
          - "Job billing_status UNBILLED -> INVOICED"
          - "Recompute customer.exposure_cents and posture"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with 0 < amount_paid_cents_total < amount_outstanding"
        actor: PlantManager
        preconditions: ["payment amount >= 1 and <= amount_outstanding_cents (ERR_OVERPAYMENT)"]
        side_effects: ["amount_paid_cents += amount; recompute outstanding; recompute customer.exposure/posture", "increments Invoice.version by 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments covering exact outstanding, or credit application reducing outstanding to 0"
        actor: PlantManager | system
        preconditions: []
        side_effects:
          - "Job billing_status INVOICED -> SETTLED; if job FULFILLED -> CLOSED"
          - "Recompute customer.exposure_cents and posture"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments covering remaining outstanding, or credit application reducing outstanding to 0"
        actor: PlantManager | system
        preconditions: []
        side_effects: ["Same SETTLED/CLOSED cascade as ISSUED -> PAID", "increments Invoice.version by 1"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: Customer | PlantManager
        preconditions: ["Customer actor must own the invoice (ERR_NOT_OWN_RESOURCE)"]
        side_effects: ["increments Invoice.version by 1"]
      - from: DISPUTED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments (partial)"
        actor: PlantManager
        preconditions: ["payment amount >= 1 and < amount_outstanding_cents"]
        side_effects: ["Same payment effects", "increments Invoice.version by 1"]
      - from: DISPUTED
        to: PAID
        trigger: "POST /invoices/{id}/payments (exact remaining) or credit application to 0"
        actor: PlantManager | system
        preconditions: []
        side_effects: ["Same SETTLED/CLOSED cascade", "increments Invoice.version by 1"]

  - entity: ReprintClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /reprint-claims/{id}/review"
        actor: PlantManager
        preconditions: []
        side_effects: ["reviewed_by := acting X-User-ID", "increments ReprintClaim.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reprint-claims/{id}/approve"
        actor: PlantManager
        preconditions:
          - "acting X-User-ID != reviewed_by (ERR_SEGREGATION_OF_DUTIES)"
          - "liability_pct in {25, 50, 100} (ERR_VALIDATION)"
          - "resolution CREDIT: job's PRODUCTION invoice exists with status in {ISSUED, PARTIALLY_PAID, DISPUTED} and amount_outstanding_cents > 0 (ERR_CLAIM_NO_OPEN_INVOICE)"
        side_effects:
          - "resolution REPRINT: create reprint Job (parent_job_id = job.id, quantity_ordered = defect_qty, zero_charge = true, billing_status NOT_BILLABLE, production_status PREPRESS, same specs snapshot)"
          - "resolution CREDIT: provisional_credit_cents computed; final_credit_cents computed and issued; credit applied to job's invoice: applied = min(final_credit_cents, invoice.amount_outstanding_cents); invoice.credit_applied_cents += applied; if invoice.amount_outstanding_cents becomes 0: invoice -> PAID; remainder (final - applied) -> customer.reprint_credit_balance_cents"
          - "Cascade: invoice PAID -> job.billing_status SETTLED (production FULFILLED -> CLOSED) -> customer.exposure_cents/posture recomputed"
          - "increments ReprintClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /reprint-claims/{id}/deny"
        actor: PlantManager
        preconditions:
          - "acting X-User-ID != reviewed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["increments ReprintClaim.version by 1"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-revise-stale-version
    parent_entity: Estimate
    write_endpoint: "PUT /estimates/{id}"
    occ_field: expected_estimate_version
    description: |
      Revising a DRAFT Estimate whose version has advanced since the client last
      observed it is rejected; the client's view of quantities/signatures is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: gang-member-add-stale-version
    parent_entity: GangRun
    write_endpoint: "POST /gang-runs/{id}/members"
    occ_field: expected_gang_run_version
    description: |
      Adding a member job to a FORMING GangRun whose version has advanced since
      the client last observed it (e.g., another member was just added, which is
      itself legitimate) is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: press-run-create-stale-version
    parent_entity: Press
    write_endpoint: "POST /press-runs"
    occ_field: expected_press_version
    description: |
      Scheduling a PressRun against a Press whose version has advanced since the
      client last observed it (another run was scheduled on the press, which is
      itself legitimate) is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: signature_impressions
    trigger: "estimate create / revise (PUT)"
    algorithm: aggregation
    formula: |
      per signature s: impressions_s = ceil(quantity_ordered / up_count_s)
      total_impressions = sum(impressions_s)
    input_set: "signatures[] of the estimate being priced"
    precision: "integer impressions (ceil)"

  - name: paper_sheets_with_spoilage
    trigger: "estimate create/revise (planned sheets) and press-run scheduling (reservation)"
    algorithm: aggregation
    formula: |
      per signature s:
        press_stage_s  = ceil(impressions_s * (1 + press_spoilage_pct/100))
        sheets_s       = ceil(press_stage_s * (1 + bindery_spoilage_pct/100))
      paper_sheets_total = sum(sheets_s)
      Rounding order is pinned: ceiling is applied after EACH stage (press, then
      bindery) — compounding; a single combined multiplier is FORBIDDEN.
    input_set: "signatures of the estimate/job; for a press run, impressions derived from run_quantity"
    precision: "integer sheets (ceil per stage)"

  - name: estimate_provisional_total
    trigger: "estimate create / revise (PUT); fields recomputed and persisted"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned):
      1. impressions_s = ceil(Q / up_count_s)
      2. running_cost_s = round_half_up(impressions_s * rate_per_thousand_cents_s / 1000)
         — rounding applied PER SIGNATURE, then summed (sum-then-round is FORBIDDEN)
      3. make_ready_total = sum(make_ready_cents_s)
      4. paper_cost = sum(sheets_s * stock.cost_per_sheet_cents)   (integer, no rounding)
      5. finishing_cost = sum(flat fees: PERF 18000, SCORE 12000, UV_COAT 40000,
         LAMINATE 55000, FOIL 75000, DIE_CUT 60000)
      6. subtotal = make_ready_total + running_cost + paper_cost + finishing_cost
      7. discount_pct = 0 if subtotal < 500000; 3 if 500000 <= subtotal < 2000000;
         5 if subtotal >= 2000000  (tier keyed on PRE-DISCOUNT subtotal)
      8. total_price_cents = round_half_up(subtotal * (1 - discount_pct/100))
    input_set: "the estimate's signatures, finishing_options, referenced PaperStocks"
    constants:
      TIER1_MIN_CENTS: 500000
      TIER1_PCT: 3
      TIER2_MIN_CENTS: 2000000
      TIER2_PCT: 5
      FEE_PERF_CENTS: 18000
      FEE_SCORE_CENTS: 12000
      FEE_UV_COAT_CENTS: 40000
      FEE_LAMINATE_CENTS: 55000
      FEE_FOIL_CENTS: 75000
      FEE_DIE_CUT_CENTS: 60000
    precision: "integer cents, round_half_up at steps 2 and 8 only"
    variants:
      - name: provisional
        when: "estimate-time (create/revise) and snapshot onto Job at accept"
        difference: "uses planned impressions from quantity_ordered and each signature's own make_ready_cents"
      - name: final_invoice
        when: "invoice generation (see invoice_billing_amount)"
        difference: "for gang members substitutes allocated_make_ready_cents for the standalone make_ready_total and RE-DERIVES the discount tier from the adjusted subtotal; for non-gang jobs equals the provisional snapshot"

  - name: press_run_duration
    trigger: "press-run creation"
    algorithm: aggregation
    formula: |
      planned_impressions = (solo) sum over job signatures ceil(run_quantity / up_count_s)
                            (gang) sum over member jobs' total_impressions
      duration_minutes = press.make_ready_minutes_base + ceil(planned_impressions / press.rated_impressions_per_hour * 60)
      scheduled_end = scheduled_start + duration_minutes
    input_set: "press config + job/gang signatures"
    precision: "integer minutes (ceil)"

  - name: press_window_conflict
    trigger: "press-run creation (validation)"
    algorithm: interval_merge
    formula: |
      For candidate run R on press P with window [R.start, R.end):
      conflict exists iff any other run X on P with status == SCHEDULED satisfies
        R.start < X.scheduled_end + P.washup_buffer_minutes  AND
        R.end   > X.scheduled_start
      i.e., each existing run occupies [X.start, X.end + washup_buffer) — half-open
      with a trailing buffer. A candidate starting exactly at X.end + buffer is
      ALLOWED (>= boundary). COMPLETE and CANCELLED runs occupy nothing.
    input_set: "SCHEDULED PressRuns on the same press"
    precision: "minute precision"

  - name: paper_lot_allocation
    trigger: "press-run scheduling (reserve), completion (consume), cancellation (release)"
    algorithm: chronological
    formula: |
      Reservations and consumption draw lots FIFO: lot.created_at ASC (earliest
      first; ties broken by created_at only — ids never participate).
      At schedule: per signature stock, reserve planned sheets; draw across lots
      of that stock until satisfied; insufficient aggregate remaining_sheets ->
      ERR_PAPER_INSUFFICIENT.
      At complete: this run's reserved sheets convert reserved->consumed;
      if sheets_used > reserved, the excess draws additional sheets FIFO;
      if sheets_used < reserved, the remainder is released.
    input_set: "PaperLots of the required stock(s), all statuses"
    precision: "integer sheets"

  - name: gang_make_ready_allocation
    trigger: "gang-run lock"
    algorithm: waterfall_allocation
    formula: |
      gang_make_ready = max over members of member.make_ready_total_cents
      For member j: raw_share_j = gang_make_ready * member_j.total_impressions / sum_all_members_impressions
      share_j = round_half_up(raw_share_j)
      remainder = gang_make_ready - sum(share_j)   (may be negative)
      The member with the earliest Job.created_at receives share + remainder
      (tie-break on equal created_at: none needed — created_at has ms precision;
      ids are never used).
      Conservation invariant: sum(allocated_make_ready_cents) == gang_make_ready exactly.
    input_set: "member jobs of the gang at lock time"
    precision: "integer cents, round_half_up per share, remainder to earliest-created member"

  - name: overrun_underrun_billing
    trigger: "invoice generation"
    algorithm: threshold
    formula: |
      Q = job.quantity_ordered; D = job.delivered_quantity; t = job.tolerance_pct
      allowed = floor(Q * t / 100)
      band = [Q - allowed, Q + allowed]  — BOTH bounds inclusive
      if D > Q + allowed:  billable_quantity = Q + allowed     (excess above cap is free)
      elif D < Q - allowed: billable_quantity = D
                             shortage_credit_cents = round_half_up(job_total_basis * (Q - allowed - D) / Q)
      else:                billable_quantity = D; shortage_credit_cents = 0
      base_amount_cents = round_half_up(job_total_basis * billable_quantity / Q)
      where job_total_basis = gang-adjusted total for gang members
      (final_invoice variant of estimate_provisional_total) else job.total_price_cents.
    input_set: "the fulfilled job + its invoice context"
    precision: "integer cents, round_half_up"
    variants:
      - name: within_tolerance
        when: "D inside the inclusive band"
        difference: "bill actual delivered quantity; no shortage credit"
      - name: beyond_tolerance
        when: "D outside the band"
        difference: "overrun capped at Q + allowed; underrun bills D minus a shortage credit on the missing-to-band pieces"

  - name: presort_postage_waterfall
    trigger: "mail-drop presort"
    algorithm: waterfall_allocation
    formula: |
      rates (cents/piece): FIVE_DIGIT 24, THREE_DIGIT 28, AADC 31
      TIER_MINIMUM = 150 pieces; GLOBAL_MINIMUM = 500 total pieces
      1. If total_pieces < GLOBAL_MINIMUM: all pieces -> AADC. STOP.
      2. 5-digit qualification: each zip_counts entry with pieces >= 150 qualifies
         entirely at FIVE_DIGIT rate; its pieces are removed from the pool.
      3. 3-digit qualification: pool remaining pieces by first-3 ZIP digits;
         each pool with pieces >= 150 qualifies entirely at THREE_DIGIT rate.
      4. All remaining pieces -> AADC.
      postage_cents = five*24 + three*28 + aadc*31   (integer, no rounding)
    input_set: "the mail drop's zip_counts"
    constants:
      FIVE_DIGIT_RATE_CENTS: 24
      THREE_DIGIT_RATE_CENTS: 28
      AADC_RATE_CENTS: 31
      TIER_MINIMUM_PIECES: 150
      GLOBAL_MINIMUM_PIECES: 500
      MAIL_DAILY_CAPACITY_PIECES: 100000
    precision: "integer cents"

  - name: mail_daily_capacity
    trigger: "mail-drop presort (validation)"
    algorithm: aggregation
    formula: |
      committed = sum(total_pieces of MailDrops with status in {PRESORTED, DROPPED}
                      whose drop_date == this.drop_date)
      reject iff committed + this.total_pieces > 100000  (equality allowed)
      Capacity is per calendar date aggregate — NOT a pairwise interval check;
      adjacent dates are independent.
    input_set: "all MailDrops on the same drop_date in {PRESORTED, DROPPED}"
    constants:
      MAIL_DAILY_CAPACITY_PIECES: 100000
    precision: "integer pieces"

  - name: customer_credit_exposure
    trigger: "estimate accept; invoice issue/payment/credit/dispute-resolution; job cancellation; claim credit issuance"
    algorithm: aggregation
    formula: |
      exposure_cents =
          sum(invoice.amount_outstanding_cents for invoices of customer with status in {ISSUED, PARTIALLY_PAID, DISPUTED})
        + sum(job.total_price_cents for jobs of customer with billing_status == UNBILLED
              and production_status not in {CLOSED, CANCELLED})
      posture = CREDIT_HOLD if exposure_cents > credit_limit_cents else ACTIVE
      (equality stays ACTIVE — strictly-greater comparison)
    input_set: "customer's invoices and jobs as filtered above"
    precision: "integer cents"

  - name: reprint_credit
    trigger: "reprint-claim approve with resolution CREDIT"
    algorithm: weighted_scoring
    formula: |
      defect_ratio = claim.defect_qty / invoice.delivered_quantity
      provisional_credit_cents = round_half_up(invoice.base_amount_cents * liability_pct/100 * defect_ratio)
      final_credit_cents = min(round_half_up(invoice.total_due_cents * liability_pct/100 * defect_ratio),
                               invoice.total_due_cents)
      applied_to_invoice = min(final_credit_cents, invoice.amount_outstanding_cents)
      remainder_to_customer_balance = final_credit_cents - applied_to_invoice
    input_set: "the claim + the job's PRODUCTION invoice"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed and stored at approval time"
        difference: "keys off invoice.base_amount_cents only (excludes postage and proof overage)"
      - name: final
        when: "issued and applied in the same approval transaction"
        difference: "keys off invoice.total_due_cents (includes postage + proof overage) and is capped at total_due_cents; diverges from provisional whenever postage_cents + proof_overage_cents > 0"

  - name: cancellation_fee
    trigger: "job cancellation"
    algorithm: threshold
    formula: |
      if production_status in {PREPRESS, PROOF_REVIEW}: fee = 0 (no invoice created)
      if production_status in {PLATED, PRESS_SCHEDULED}: fee = job.make_ready_total_cents,
        auto-create Invoice(kind=CANCELLATION_FEE, status=ISSUED, total_due_cents=fee)
    input_set: "the job being cancelled"
    precision: "integer cents"

  - name: proof_overage_fee
    trigger: "invoice generation"
    algorithm: threshold
    formula: |
      proof_overage_cents = max(0, job.proof_rounds_used - job.included_proof_rounds) * 12500
    input_set: "job's proofs count vs included_proof_rounds snapshot"
    constants:
      PROOF_ROUND_FEE_CENTS: 12500
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "When X-User-Role == Customer, the target resource's customer_id must equal X-User-ID (applies to estimates/jobs/proofs/invoices/reprint-claims/mail-drops reads and customer actions)"
    error_id: ERR_NOT_OWN_RESOURCE
    http_status: 403
    applies_to: "customer-visible endpoints"
  - priority: 4
    category: existence
    check: "Path parameters and body FK references resolve to existing resources, validated left-to-right (path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /estimates/{id}, POST /gang-runs/{id}/members, POST /gang-runs/{id}/remove-member, POST /press-runs"
  - priority: 6
    category: state
    check: "Target entity is in the required state for the operation (per state machines; e.g., estimate QUOTED for accept, proof AWAITING_CUSTOMER for approve, run SCHEDULED for complete, gang FORMING for membership changes / LOCKED for unlock-or-schedule, invoice ISSUED/PARTIALLY_PAID/DISPUTED for payments, claim FILED/UNDER_REVIEW for review/approve, ticket QUEUED, drop PLANNED/PRESORTED, PO ORDERED/PARTIALLY_RECEIVED, job in the required production state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity consistency: gang member job's every signature uses the gang's paper_stock_id, job press_type matches gang press_type, job not already in another gang (ERR_GANG_INELIGIBLE_JOB); press-run press_type matches job/gang press_type (ERR_PRESS_TYPE_MISMATCH); mail-drop job fulfillment_type == MAIL and record-delivery job fulfillment_type == SHIP (ERR_FULFILLMENT_CHANNEL_MISMATCH)"
    error_id: ERR_GANG_INELIGIBLE_JOB
    http_status: 409
    applies_to: "gang membership, press-run creation, fulfillment endpoints"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: estimate not expired at accept (ERR_ESTIMATE_EXPIRED — evaluated before fiscal checks); gang member due_date within +/-3 days inclusive of anchor_due_date (ERR_GANG_DUE_WINDOW_EXCEEDED); press-run window conflict incl. washup buffer (ERR_PRESS_WINDOW_CONFLICT)"
    error_id: ERR_ESTIMATE_EXPIRED
    http_status: 409
    applies_to: "estimate accept, gang membership, press-run creation"
  - priority: 9
    category: business_constraint
    check: "Sequencing and resource constraints: gang size 2..6 at lock (ERR_GANG_TOO_SMALL / ERR_GANG_FULL); bindery tickets complete in ascending sequence_no (ERR_BINDERY_SEQUENCE); paper availability for reservation/consumption (ERR_PAPER_INSUFFICIENT); press AVAILABLE (ERR_PRESS_UNAVAILABLE); mail daily aggregate capacity (ERR_MAIL_CAPACITY_EXCEEDED); PO over-receipt cap floor(ordered*1.10) (ERR_OVER_RECEIPT); duplicate PRODUCTION invoice per job (ERR_DUPLICATE_INVOICE); job cancel cutoff at BINDERY (ERR_JOB_PAST_CANCEL_POINT) and locked-gang membership (ERR_JOB_IN_LOCKED_GANG); one open claim per job (ERR_CLAIM_ALREADY_OPEN); defect_qty bounds (ERR_DEFECT_QTY_INVALID); gang run_quantity equals member quantity sum (ERR_GANG_RUN_QUANTITY_MISMATCH); segregation of duties on claims (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_GANG_TOO_SMALL / ERR_GANG_FULL / ERR_BINDERY_SEQUENCE / ERR_PAPER_INSUFFICIENT / ERR_PRESS_UNAVAILABLE / ERR_MAIL_CAPACITY_EXCEEDED / ERR_OVER_RECEIPT / ERR_DUPLICATE_INVOICE / ERR_JOB_PAST_CANCEL_POINT / ERR_JOB_IN_LOCKED_GANG / ERR_CLAIM_ALREADY_OPEN / ERR_DEFECT_QTY_INVALID / ERR_GANG_RUN_QUANTITY_MISMATCH / ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "action endpoints"
  - priority: 10
    category: business_fiscal
    check: "Fiscal checks last: customer.posture == ACTIVE at estimate accept (ERR_CREDIT_HOLD); payment amount <= amount_outstanding_cents (ERR_OVERPAYMENT); apply-credit amount <= min(customer.reprint_credit_balance_cents, invoice.amount_outstanding_cents) (ERR_CREDIT_APPLICATION_INVALID)"
    error_id: ERR_CREDIT_HOLD
    http_status: 409
    applies_to: "estimate accept, payments, apply-credit"
  - priority: 11
    category: business_constraint
    check: "Field-level request validity (required fields present, enum membership, numeric ranges) when not covered above"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
    note: "Malformed payloads fail fast per-field; when both a business rule and a field-format rule fail, the business rule wins (higher priority number loses)."

