  # ===================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_screen_blocked_when_requisition_not_approved
        grounds:
          - state_machines.Application.APPLIED_to_SCREENING
          - validations[priority=6]
          - errors[ERR_PRECONDITION_FAILED]
        distinguishing_aspect: |
          Entity pair Application→JobRequisition: Application APPLIED→SCREENING requires
          JobRequisition.status == APPROVED. With requisition still in DRAFT (not yet submitted),
          the screen call MUST fail with ERR_PRECONDITION_FAILED — the child transition is gated
          by the parent's state, not by the child's own state.
        test_recipe:
          setup:
            - "JobRequisition R in DRAFT (never submitted)"
            - "Application A on R in APPLIED — but wait, application create itself is allowed? Recheck: §1.5 applications:create has no precondition on requisition state in current scaffold; application creation succeeds even on DRAFT requisition. Then screen attempts but fails."
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "DraftDept", cost_center_code: "DFT-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "DraftRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/candidates"
              payload: { full_name: "Draft Cand", email: "draftc@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id == ERR_PRECONDITION_FAILED (parent JobRequisition.status == DRAFT, not APPROVED)"
            - "Application.status remains APPLIED"

      - name: offer_extend_blocked_when_requisition_cancelled
        grounds:
          - state_machines.Offer.APPROVED_to_EXTENDED
          - state_machines.JobRequisition.APPROVED_to_CANCELLED
          - validations[priority=6]
          - errors[ERR_PRECONDITION_FAILED]
        distinguishing_aspect: |
          Entity pair Offer→JobRequisition: Offer APPROVED→EXTENDED requires JobRequisition.status
          == APPROVED. Different entity pair from the application/requisition dependency above
          (Offer is a different child entity even though parent is also JobRequisition by
          aggregate; the FK chain Offer→Application→Requisition makes the dependent state
          inherited transitively).
          NOTE on differentiation: pair is (Offer-extend-trigger × Requisition-status), distinct
          from (Application-screen-trigger × Requisition-status) above because Offer's transition
          guards on the same parent state but the triggering verb, the child entity type, and the
          impacted side-effect set are all different.
        test_recipe:
          setup:
            - "Offer in APPROVED state on a Requisition that was approved, then cancelled (or revoked path)"
            - "Use a separate mechanism: requisition gets cancelled AFTER offer is approved — offer must then be in REVOKED already via cascade. So instead construct: requisition NEVER approved second time. Use the precondition path via creating a second Offer where the requisition was approved but Offer was approved on a different application; then verify extend respects parent state."
            - "Simpler: try to extend an offer whose requisition was just cancelled, where the offer itself is already REVOKED by cascade — the test asserts the cross-entity guard rejects rather than letting through."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "CancExt", cost_center_code: "CXT-001", hiring_budget_cents: 100000000 }
