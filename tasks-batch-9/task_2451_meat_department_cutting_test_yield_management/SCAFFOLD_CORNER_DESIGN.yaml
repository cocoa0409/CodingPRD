            - "The fill response alone answers every derived question: ${f_actual} == 34.50, ${f_pack} == 2026-08-05, ${f_sell_by} == 2026-08-10 (whole-muscle shelf life 5 days) and ${f_status} == FILLED"
            - "${plan_actual} == 34.50 and ${plan_fill} == FILLED in the immediately following read — no re-read delay and no stale intermediate value"

      - name: a_posture_cascade_is_visible_to_the_next_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.case_posture_derivation
          - endpoints[POST /meat-ops/temperature-logs]
        distinguishing_aspect: "The reading that trips the consecutive threshold returns its own out_of_spec verdict and consecutive_index, and the four-hop cascade it fires — failure opened, department halted, published plan suspended, filled line held — is fully observable in the requests that follow, with no intermediate state in which the failure exists but the plan is still PUBLISHED."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T09:00:00Z; RIB01 is PROPOSED at 2149."
            - "CasePlan CP1 (service_date 2026-08-05) is PUBLISHED with line 1 filled with 34.5 lb, so the line is FILLED and eligible for the hold."
            - "One out-of-spec reading of 4.5 C on CASE-A has already been posted, leaving the consecutive counter at 1 and the posture at SALES_RESTRICTED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${dept_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "PUBLISH" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 34.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { log1_index: $.data.consecutive_index }
          trigger:
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { log2_spec: $.data.out_of_spec, log2_index: $.data.consecutive_index }
            - call: "GET /meat-ops/departments/${dept_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { posture: $.data.case_posture, open_cnt: $.data.open_case_failure_count }
            - call: "GET /meat-ops/case-plans/${cp1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { plan_status: $.data.plan_status }
            - call: "GET /meat-ops/case-plan-lines/${cpl1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { line_status: $.data.line_status, line_held_from: $.data.held_from_status }
            - call: "GET /meat-ops/case-failures"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", status: "OPEN" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cf_total: $.meta.total_count, cf_peak: "$.data[0].peak_reading_c", cf_affected: "$.data[0].affected_line_count" }
          assert:
            - "${log1_index} == 1 and ${log2_spec} == true with ${log2_index} == 2 — the tripping reading reports its own place in the run"
            - "${posture} == SALES_HALTED with ${open_cnt} == 1 in the request right after the reading"
            - "${plan_status} == SUSPENDED and ${line_status} == HELD with ${line_held_from} == FILLED — hops 2 and 3 of the cascade are already applied"
            - "${cf_total} == 1 with ${cf_peak} == 4.6 and ${cf_affected} == 1 — the failure row, its peak and its held-line count are all consistent in the same read"
