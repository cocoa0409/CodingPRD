  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  #   instance 1 = incentive award conservation (PAID->REVERSED nets to 0 awarded)
  #   instance 2 = electrician day-load conservation (cancel BOOKED frees a slot)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: incentive_award_reversal_conserves_net_paid
        grounds:
          - state_machines.IncentiveClaim.PAID_to_REVERSED
          - calculations.incentive_award
          - entities.IncentiveClaim.fields.award_cents
        distinguishing_aspect: |
          Conserved quantity = job-cumulative net-paid incentive cents = sum(award_cents over claims in
          status PAID). A FEDERAL_45W claim of 58725 paid then reversed leaves cumulative-PAID at 0
          (claim moves PAID->REVERSED so it no longer counts), while award_cents stays 58725 for audit —
          forward+compensating action leaves net-paid unchanged at 0.
        test_recipe:
          setup:
            - "Activated InstallJob J17 with one FEDERAL_45W claim (award 58725) advanced DRAFT->SUBMITTED->PAID"
          setup_api_calls:
            - call: "POST /homeowners"
