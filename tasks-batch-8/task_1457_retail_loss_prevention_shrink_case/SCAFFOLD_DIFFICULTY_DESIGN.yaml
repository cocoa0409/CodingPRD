# =============================================================================
# §1.8 Scaffold Difficulty Design — Retail Loss Prevention & Shrink Case Management
# 20 instances across the nine §0.5 Difficulty Rules (>= 2 per rule).
# Actor ids (opaque X-User-ID values): ana-1/ana-2 (LPAnalyst), mgr-1/mgr-2
# (LPManager), hr-1 (HRPartner), adm-1 (LPAdmin), feed-1 (PosFeed), aud-1 (Auditor).
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: civil_demand_statutory_vs_actual_loss_same_inputs
        grounds:
          - calculations.civil_demand_amount
          - state_machines.CivilDemand.DRAFT_to_ISSUED
          - entities.CivilDemand.fields.statutory_penalty_cents
        distinguishing_aspect: |
          Two demands over identical inputs (merchandise loss 75000 cents, priors 2, zero recovery
          cost) diverge purely by basis variant: STATUTORY yields amount_due_cents 130000 with
          statutory_penalty_cents 55000 (tier2 27500 x multiplier 2.0), while ACTUAL_LOSS yields
          amount_due_cents 75000 with statutory_penalty_cents 0. Entity domain: CivilDemand/Case loss.
        test_recipe:
          setup:
            - "Store S1 ACTIVE; shrink period P1 covering 2026-08-01 (status OPEN) exists for S1"
            - "Two MANUAL EXTERNAL-subject cases CA and CB at S1, each with manual_loss_cents=75000, each walked to INTERVIEWED (assigned to ana-1, one evidence item each, interview documented non-stale)"
            - "Demand DA on CA with basis=STATUTORY, priors_offense_count=2; demand DB on CB with basis=ACTUAL_LOSS; both ISSUED by mgr-1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S100", name: "Store 100", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", book_inventory_cents: 10000000, period_sales_cents: 8000000 }
              as: LPAdmin
              as_user_id: adm-1
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 75000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { ca: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 75000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cb: $.data.id }
            - call: "POST /cases/${ca}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /cases/${cb}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${ca}", evidence_type: "VIDEO_CLIP", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cb}", evidence_type: "TRANSACTION_LOG", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${ca}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cb}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${ca}", interviewer_id: "ana-1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv_a: $.data.id }
            - call: "POST /interviews"
              payload: { case_id: "${cb}", interviewer_id: "ana-1", scheduled_start: "2026-08-02T13:00:00Z", scheduled_end: "2026-08-02T14:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv_b: $.data.id }
            - call: "POST /interviews/${iv_a}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv_b}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv_a}/document"
              payload: { notes: "Subject admitted the refund scheme." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv_b}/document"
              payload: { notes: "Subject admitted the void scheme." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /cases/${ca}"
              as: LPManager
              as_user_id: mgr-1
              captures: { ca_v: $.data.version }
            - call: "GET /cases/${cb}"
              as: LPManager
              as_user_id: mgr-1
              captures: { cb_v: $.data.version }
            - call: "POST /civil-demands"
              payload: { case_id: "${ca}", basis: "STATUTORY", priors_offense_count: 2, expected_case_version: "${ca_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { da: $.data.id }
            - call: "POST /civil-demands"
              payload: { case_id: "${cb}", basis: "ACTUAL_LOSS", priors_offense_count: 2, expected_case_version: "${cb_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { db: $.data.id }
            - call: "POST /civil-demands/${da}/issue"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /civil-demands/${db}/issue"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "GET /civil-demands/${da}"
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /civil-demands/${db}"
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "CivilDemand.${da}.merchandise_loss_cents == 75000"
            - "CivilDemand.${da}.statutory_penalty_cents == 55000  # tier2: 25000 + round_half_up(0.10*25000)=27500; x2.0 = 55000"
            - "CivilDemand.${da}.amount_due_cents == 130000"
            - "CivilDemand.${db}.merchandise_loss_cents == 75000"
            - "CivilDemand.${db}.statutory_penalty_cents == 0"
            - "CivilDemand.${db}.amount_due_cents == 75000"
            - "CivilDemand.${da}.amount_due_cents != CivilDemand.${db}.amount_due_cents"

      - name: shrink_accrual_case_posted_vs_sales_ratio_same_period
        grounds:
          - calculations.shrink_accrual
          - entities.ShrinkPeriod.fields.accrual_case_basis_cents
          - entities.ShrinkPeriod.fields.accrual_sales_basis_cents
        distinguishing_aspect: |
          One ShrinkPeriod read exposes both accrual variants over identical period data
          (period_sales_cents 8000000, known_loss_posted_cents 150000): CASE_POSTED yields
          accrual_case_basis_cents 150000 while SALES_RATIO yields accrual_sales_basis_cents
          100000 = round_half_up(8000000 * 0.0125). Entity domain: ShrinkPeriod (distinct from
          the CivilDemand domain of the sibling instance).
        test_recipe:
          setup:
            - "Store S1 ACTIVE; ShrinkPeriod P1 for S1 [2026-07-01, 2026-09-30] OPEN with book 10000000 and sales 8000000"
            - "EXTERNAL manual case CX at S1 with manual_loss_cents=150000, adjudicated SUBSTANTIATED by mgr-1 with restitution_waived=true at the default clock 2026-08-01 (contained in P1, status OPEN), so 150000 posts to P1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S101", name: "Store 101", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", book_inventory_cents: 10000000, period_sales_cents: 8000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 150000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "PHOTO", captured_at: "2026-07-20T09:00:00Z", retention_class: "EXTENDED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
            - call: "POST /interviews/${iv}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv}/document"
              payload: { notes: "Documented same day." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/adjudicate"
              payload: { decision: "SUBSTANTIATED", restitution_waived: true }
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "GET /shrink-periods/${p1}"
              as: LPAdmin
              as_user_id: adm-1
          assert:
            - "ShrinkPeriod.${p1}.known_loss_posted_cents == 150000"
            - "ShrinkPeriod.${p1}.accrual_case_basis_cents == 150000"
            - "ShrinkPeriod.${p1}.accrual_sales_basis_cents == 100000"
            - "ShrinkPeriod.${p1}.accrual_case_basis_cents != ShrinkPeriod.${p1}.accrual_sales_basis_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: orc_escalation_three_input_conjunction_at_boundary
        grounds:
          - calculations.orc_escalation
          - state_machines.OrcGroup.IDENTIFIED_to_ACTIVE_MONITORING
          - state_machines.CaseLink.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): three-input conjunctive threshold with inclusive boundaries. After two
          confirmations the group stays IDENTIFIED (count 2 < 3); the third confirmation lands
          exactly on all three boundaries (confirmed_case_count == 3, distinct_store_count == 2,
          exposure_cents == 500000) and flips the group to ACTIVE_MONITORING.
        test_recipe:
          setup:
            - "Stores SA and SB ACTIVE; ORC group G IDENTIFIED"
            - "Manual EXTERNAL cases: C1 at SA loss 200000, C2 at SB loss 150000, C3 at SA loss 150000 (each OPEN — no assign needed for linking)"
            - "Links L1 (C1), L2 (C2) CONFIRMED; L3 (C3) PROPOSED"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S110", name: "Store 110", region_code: "R2" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S111", name: "Store 111", region_code: "R2" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { sb: $.data.id }
            - call: "POST /orc-groups"
              payload: { name: "Ring Alpha", description: "Multi-store refund crew" }
              as: LPManager
              as_user_id: mgr-1
              captures: { g: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sa}", subject_type: "EXTERNAL", manual_loss_cents: 200000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sb}", subject_type: "EXTERNAL", manual_loss_cents: 150000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c2: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sa}", subject_type: "EXTERNAL", manual_loss_cents: 150000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c3: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c1}", orc_group_id: "${g}", link_score: 80 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l1: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c2}", orc_group_id: "${g}", link_score: 70 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l2: $.data.id }
            - call: "POST /case-links"
              payload: { case_id: "${c3}", orc_group_id: "${g}", link_score: 65 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l3: $.data.id }
            - call: "POST /case-links/${l1}/confirm"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /case-links/${l2}/confirm"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "GET /orc-groups/${g}"
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /case-links/${l3}/confirm"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /orc-groups/${g}"
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /cases/${c1}"
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "first GET: OrcGroup.${g}.status == IDENTIFIED and confirmed_case_count == 2"
            - "after third confirm: OrcGroup.${g}.confirmed_case_count == 3"
            - "after third confirm: OrcGroup.${g}.distinct_store_count == 2"
            - "after third confirm: OrcGroup.${g}.exposure_cents == 500000"
            - "after third confirm: OrcGroup.${g}.status == ACTIVE_MONITORING  # all three boundaries inclusive"
            - "Case.${c1}.priority == HIGH  # cascade link 3"

      - name: civil_demand_tier2_round_then_multiply_order
        grounds:
          - calculations.civil_demand_amount
          - entities.CivilDemand.fields.statutory_penalty_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is load-bearing. Loss 75555, priors 1 (multiplier 1.5):
          pinned order rounds the tier excess first (0.10 * 25555 = 2555.5 -> 2556, tier = 27556)
          then multiplies and rounds again (27556 * 1.5 = 41334.0 -> 41334), amount_due = 116889.
          Multiplying before rounding would yield 41333 and 116888 — a one-cent divergence the
          assertion rejects.
        test_recipe:
          setup:
            - "Store S1 ACTIVE; no shrink period needed (no adjudication performed)"
            - "EXTERNAL manual case CX loss 75555 walked to INTERVIEWED; STATUTORY demand DX with priors_offense_count=1 ISSUED"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S120", name: "Store 120", region_code: "R3" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 75555 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "TRANSACTION_LOG", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
            - call: "POST /interviews/${iv}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv}/document"
              payload: { notes: "Documented." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /cases/${cx}"
              as: LPManager
              as_user_id: mgr-1
              captures: { cx_v: $.data.version }
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "STATUTORY", priors_offense_count: 1, expected_case_version: "${cx_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { dx: $.data.id }
            - call: "POST /civil-demands/${dx}/issue"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "GET /civil-demands/${dx}"
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "CivilDemand.${dx}.merchandise_loss_cents == 75555"
            - "CivilDemand.${dx}.statutory_penalty_cents == 41334"
            - "CivilDemand.${dx}.amount_due_cents == 116889"
            - "CivilDemand.${dx}.amount_due_cents != 116888  # multiply-first order would produce this"

      - name: shrink_variance_feedback_loop_pinned_order
        grounds:
          - calculations.shrink_variance
          - state_machines.ShrinkPeriod.COUNTED_to_RECONCILED
          - entities.ShrinkPeriod.fields.auto_case_id
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order. Reconciling P1
          (variance -250000, |pct| 0.0250 >= 0.0200) spawns a SHRINK_VARIANCE case; when that
          case is later adjudicated its 250000-cent loss posts to the OPEN period containing the
          adjudication date (P2), never retroactively into the RECONCILED P1 that spawned it.
        test_recipe:
          setup:
            - "Store S1 ACTIVE; P1 [2026-07-01, 2026-09-30] book 10000000 sales 8000000; P2 [2026-10-01, 2026-12-31] book 9000000 sales 7000000 (both OPEN)"
            - "P1 counted at 9600000 and reconciled -> variance -250000, auto-case AC created (OPEN, UNKNOWN subject, manual_loss_cents 250000)"
            - "Clock advanced to 2026-10-15 (inside P2); AC resolved to EXTERNAL, assigned to ana-1, evidenced, interviewed, documented, advanced to ADJUDICATING"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S130", name: "Store 130", region_code: "R3" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", book_inventory_cents: 10000000, period_sales_cents: 8000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", book_inventory_cents: 9000000, period_sales_cents: 7000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p2: $.data.id }
            - call: "POST /shrink-periods/${p1}/record-count"
              payload: { counted_inventory_cents: 9600000, expected_shrink_period_version: "${p1_v}" }
              as: LPAdmin
              as_user_id: adm-1
            - call: "POST /shrink-periods/${p1}/reconcile"
              payload: {}
              as: LPAdmin
              as_user_id: adm-1
              captures: { ac: $.data.auto_case_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: LPAdmin
              as_user_id: adm-1
            - call: "POST /cases/${ac}/resolve-subject"
              payload: { subject_type: "EXTERNAL" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /cases/${ac}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${ac}", evidence_type: "TRANSACTION_LOG", captured_at: "2026-09-25T10:00:00Z", retention_class: "EXTENDED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${ac}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${ac}", interviewer_id: "ana-1", scheduled_start: "2026-10-16T10:00:00Z", scheduled_end: "2026-10-16T11:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
            - call: "POST /interviews/${iv}/record-outcome"
              payload: { outcome: "DENIED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv}/document"
              payload: { notes: "Inventory variance review documented." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${ac}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
          trigger:
            - call: "POST /cases/${ac}/adjudicate"
              payload: { decision: "SUBSTANTIATED", restitution_waived: true }
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /shrink-periods/${p1}"
              as: LPAdmin
              as_user_id: adm-1
            - call: "GET /shrink-periods/${p2}"
              as: LPAdmin
              as_user_id: adm-1
            - call: "GET /cases/${ac}"
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "Case.${ac}.status == CLOSED_SUBSTANTIATED"
            - "Case.${ac}.loss_posted_period_id == ${p2}"
            - "ShrinkPeriod.${p2}.known_loss_posted_cents == 250000"
            - "ShrinkPeriod.${p1}.known_loss_posted_cents == 0  # reconciled source period never retro-adjusted"
            - "ShrinkPeriod.${p1}.variance_cents == -250000  # reconcile snapshot immutable"
            - "ShrinkPeriod.${p1}.status == RECONCILED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: referral_packet_return_revise_resubmit_cycle
        grounds:
          - state_machines.ReferralPacket.DRAFT_to_SEALED
          - state_machines.ReferralPacket.SEALED_to_SUBMITTED
          - state_machines.ReferralPacket.SUBMITTED_to_RETURNED
          - state_machines.ReferralPacket.RETURNED_to_DRAFT
          - state_machines.ReferralPacket.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Cyclic machine on ReferralPacket: DRAFT -> SEALED -> SUBMITTED -> RETURNED -> DRAFT ->
          SEALED -> SUBMITTED -> ACKNOWLEDGED is traversed in full, and the legal_hold side effect
          tracks the cycle (true while SUBMITTED, cleared on RETURNED, set again on resubmission).
