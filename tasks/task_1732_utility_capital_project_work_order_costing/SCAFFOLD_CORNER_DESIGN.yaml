          assert:
            - "error_id ${err} == ERR_NO_APPROVED_ESTIMATE"

      - name: complete_in_service_outside_open_period_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_IN_SERVICE_PERIOD_NOT_OPEN]", state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "in_service_date 2026-07-15 while the only open period is 2026-08 fails ERR_IN_SERVICE_PERIOD_NOT_OPEN; a date inside the open period succeeds."
        test_recipe:
          setup: ["CAPITAL work order authorized/started; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-ISD", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "In-service dating", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-07-15" }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st: $.data.status, isp: $.data.in_service_period_id } }
          assert:
            - "Outside open period: ${err} == ERR_IN_SERVICE_PERIOD_NOT_OPEN"
            - "Inside open period: status ${st} == COMPLETED with in_service_period_id ${isp} == ${per1}"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: reversal_posts_to_current_open_period
        claim_type: action_endpoint
        grounds: ["endpoints[POST /ucp/cost-charges/{charge_id}/reverse]", "errors[ERR_PERIOD_NOT_FOUND]"]
        distinguishing_aspect: "Reversal is a prior-period adjustment: with the original's period CLOSED it fails while NO period is open (ERR_PERIOD_NOT_FOUND), then posts into the newly opened 2026-09 period — never back into the CLOSED one."
        test_recipe:
          setup: ["CAPITAL work order authorized/started; 30,000c charge dated 2026-08-10; period 2026-08 closed; no open period yet"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-RVP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
