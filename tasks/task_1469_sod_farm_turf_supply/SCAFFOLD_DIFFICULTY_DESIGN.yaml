                z1_pallets: 10
                z2_pallets: 0
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
