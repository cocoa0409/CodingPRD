            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 500, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour A", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 39, attendance_cap: 60, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog_a: $.data.id, prog_a_v: $.data.version }
            - call: "POST /library/programs/${prog_a}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_a_v}" }
              as: ProgramCoordinator
              captures: { resv_a: $.data.id }
            - call: "POST /library/reservations/${resv_a}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog_a}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour B", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T16:00:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", attendance_target: 40, attendance_cap: 60, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog_b: $.data.id, prog_b_v: $.data.version }
            - call: "POST /library/programs/${prog_b}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T16:00:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_b_v}" }
              as: ProgramCoordinator
              captures: { resv_b: $.data.id }
            - call: "POST /library/reservations/${resv_b}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog_b}/schedule"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/programs/${prog_a}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /library/programs/${prog_b}/confirm"
              payload: {}
              as: ProgramManager
          assert:
            - "Program.${prog_a}.materials_committed_cents == 21450 (19500 + round_half_up(1950.0)) and materials_available_cents == 28550"
            - "Program.${prog_b}.materials_committed_cents == 21000 (20000 + round_half_up(1000.0)) and materials_available_cents == 29000"
            - "Program.${prog_a}.supply_draw_lines has exactly one line with units 39 and line_total_cents 19500"
            - "Program.${prog_b}.supply_draw_lines has exactly one line with units 40 and line_total_cents 20000"
