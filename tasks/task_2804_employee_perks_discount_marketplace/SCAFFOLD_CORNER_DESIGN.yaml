          - errors[ERR_MEMBERSHIP_REVOKED]
          - entities.EmployeeMembership.fields.status
          - entities.EmployeeMembership.fields.employment_status
        distinguishing_aspect: |
          REVOKED is EmployeeMembership's only terminal state: after one TERMINATED write the
          row is REVOKED, and both a re-ACTIVATE write and a second TERMINATED write return 409
          ERR_MEMBERSHIP_REVOKED, so the employer cannot resurrect a membership through the
          employment-status endpoint - only a fresh eligibility file may.
