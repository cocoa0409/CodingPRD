  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID fails 401 ERR_UNAUTHENTICATED before any role, existence, or state check — even for a nonexistent resource id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /yachts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED, http 401 (auth priority 1 fires before the 404 existence check)"

      - name: not_found_precedes_business_rules
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Cancelling a nonexistent agreement id returns 404 ERR_NOT_FOUND (existence, priority 3) even though the payload would also be evaluable against state rules."
        test_recipe:
          setup: ["operator exists (so the caller is authenticated)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /charter-agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cancel", payload: { reason: "x" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, http 404"

      - name: operator_suspended_gates_writes
        claim_type: conditional_validation
        grounds: ["validations[priority=5]", "errors[ERR_OPERATOR_SUSPENDED]"]
        distinguishing_aspect: "A SUSPENDED operator cannot list, create blocks, or have its yachts' requests submitted or offered — but existing GETs keep working; reactivation restores writes."
        test_recipe:
          setup: ["Operator O with LISTED Yacht A (version 2 after list); QUALIFIED client with a DRAFT request"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { ya_v2: $.data.version } }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /operators/${op_id}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-09-01", end_date: "2026-09-05", expected_yacht_version: "${ya_v2}" }, as: Operator, as_user_id: "${op_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /operators/${op_id}/reactivate", payload: {}, as: PlatformAdmin }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { rq_st: $.data.status } }
          assert:
            - "err1 == ERR_OPERATOR_SUSPENDED (block creation blocked while SUSPENDED)"
            - "err2 == ERR_OPERATOR_SUSPENDED (submit blocked; yacht is LISTED so the state gate passes and the suspension gate fires)"
            - "after reactivate: rq_st == SUBMITTED"

      - name: yacht_not_listed_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_YACHT_NOT_LISTED]"]
        distinguishing_aspect: "Submitting a request for a DRAFT (never listed) yacht fails ERR_YACHT_NOT_LISTED even when the client is fully qualified."
        test_recipe:
          setup: ["Yacht A in DRAFT; QUALIFIED client; DRAFT request"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_YACHT_NOT_LISTED; request stays DRAFT"

      - name: broker_conflict_of_interest_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_BROKER_CONFLICT_OF_INTEREST]"]
        distinguishing_aspect: "Segregation of duties: a broker of type BOTH who is the yacht's listing central agent may not create a request as its retail broker — same-person both-sides dealing fails ERR_BROKER_CONFLICT_OF_INTEREST."
        test_recipe:
          setup: ["broker B (broker_type BOTH) is listing central agent of LISTED Yacht A; QUALIFIED client exists"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "Both Broker", broker_type: BOTH, license_no: "LIC-B-1" }, as: PlatformAdmin, captures: { both_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${both_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: RetailBroker, as_user_id: "${both_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BROKER_CONFLICT_OF_INTEREST (retail_broker_id would equal yacht.listing_central_agent_id)"
            - "no CharterRequest is persisted (GET /charter-requests?client_id=${cl_id} -> total_count 0)"

      - name: gratuity_minimum_crewed_boundary
        claim_type: boundary
        grounds: ["validations[priority=7]", "errors[ERR_GRATUITY_BELOW_MINIMUM]"]
        distinguishing_aspect: "CREWED offers enforce gratuity >= round_half_up(0.10 x fee): at fee 1000000 the pledge 99999 fails and exactly 100000 passes; BAREBOAT offers carry no minimum."
        test_recipe:
          setup: ["CREWED Yacht D (capacity 10, required_resume_class NONE, PRO_RATA weekly 700000) LISTED; client (unqualified is fine for CREWED); request 2026-10-01..2026-10-11 SUBMITTED (fee will compute to 1000000)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht D", charter_type: CREWED, home_port: "Athens", capacity_berths: 10, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: NONE, security_deposit_cents: 0, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { yd_id: $.data.id } }
            - { call: "POST /yachts/${yd_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${yd_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 6 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/offer", payload: { gratuity_pledged_cents: 99999 }, as: CentralAgent, as_user_id: "${ca_id}", captures: { err: $.data.error_id } }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: { gratuity_pledged_cents: 100000 }, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_st: $.data.status, fee: $.data.quoted_charter_fee_cents } }
          assert:
            - "err == ERR_GRATUITY_BELOW_MINIMUM (99999 < round_half_up(0.10 x 1000000) = 100000); request stays SUBMITTED"
            - "rq_st == OFFERED and fee == 1000000 (boundary pledge exactly at the minimum passes)"

      - name: duplicate_active_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_ACTIVE_REQUEST]"]
        distinguishing_aspect: "Same client + yacht with half-open overlapping dates and a live request (DRAFT..COUNTERED) is rejected at creation; disjoint dates for the same pair pass."
        test_recipe:
          setup: ["Yacht A LISTED; client exists; R1 DRAFT for 2026-10-01..2026-10-11"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
