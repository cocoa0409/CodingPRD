scenario: "Newborn Screening Program (state lab): specimen collection & timeliness, panel (metabolic/hearing/CCHD), lab processing & critical-result flag, short-term follow-up & repeat, confirmatory & specialty referral, unsatisfactory-specimen recollection, parental refusal, long-term follow-up"
domain_name: newborn-screening
api_prefix: "/nbs"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys (infant_id, specimen_id, screen_id,
  # follow_up_case_id, referral_id, facility_id). Two reverse-reachability
  # GETs use the sub-resource form (recollection-orders under a specimen,
  # confirmatory-appointments under a referral); every other FK is discovered
  # by a filtered list. No deep nesting in the URL surface.

  state_machine_shape: parallel
  # Screen carries three INDEPENDENT status axes (metabolic_status,
  # hearing_status, cchd_status). FollowUpCase is cyclic (repeat loop).
  # Specimen/Referral/ConfirmatoryAppointment/AssayRun are branching.

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles
  # BirthFacilityUser owns collection/point-of-care/consent at its facility;
  # LabTechnician owns lab processing; FollowUpCoordinator owns follow-up and
  # referrals; SpecialtyClinician owns confirmatory completion at its clinic;
  # ProgramAdmin is the operational/config role.

  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility display name.
      - name: facility_type
        type: enum
        source: input
        description: "Kind of facility."
        constraints: "one of {HOSPITAL, BIRTHING_CENTER, LAB}"
      - name: state_region
        type: string
        source: input
        description: Two-letter region/state code the facility reports under; used to group the program timeliness summary.
      - name: total_booked_minutes
        type: integer
        source: computed
        description: "Conserved quantity for AssayRun scheduling: SUM of duration_minutes over this facility's AssayRuns whose status != CANCELLED. Recomputed on every AssayRun create/cancel."
        default: 0

  - name: Infant
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the birthing facility (HOSPITAL or BIRTHING_CENTER) that registered this infant."
      - name: birth_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC instant of birth; anchors all timeliness math.
      - name: gestational_age_weeks
        type: integer
        source: input
        description: Completed weeks of gestation at birth; drives the preterm branch of specimen acceptability and the follow-up priority score.
      - name: birth_weight_grams
        type: integer
        source: input
        description: Birth weight in grams; low-birth-weight flag feeds the follow-up priority score.
      - name: sex
        type: enum
        source: input
        description: Recorded sex.
        constraints: "one of {M, F, U}"
      - name: multiple_birth
        type: boolean
        source: input
        description: Whether the infant is part of a multiple birth.
        default: false
      - name: consent_status
        type: enum
        source: system
        description: "Parental consent posture. Starts PENDING; set by POST /nbs/infants/{id}/consent. REFUSAL cascades to void non-terminal specimens."
        default: PENDING
        constraints: "one of {PENDING, CONSENTED, REFUSED}"
      - name: current_specimen_id
        type: string
        source: system
        description: Id of the most recently created (non-voided) Specimen for this infant; a REPEAT specimen supersedes the prior current pointer.
      - name: open_recollection_count
        type: integer
        source: computed
        description: "Number of this infant's RecollectionOrders in ORDERED state. Incremented when an UNSATISFACTORY specimen spawns a RecollectionOrder; decremented on collection/cancel."
        default: 0
      - name: open_case_count
        type: integer
        source: computed
        description: "Conserved quantity: COUNT of this infant's FollowUpCases whose status is not in {RESOLVED_NORMAL, CLOSED}. Incremented on case open; decremented on resolve/close."
        default: 0
      - name: followup_status
        type: enum
        source: computed
        description: "Derived: ACTIVE when open_case_count > 0, else CLEAR."
        default: CLEAR
        constraints: "one of {CLEAR, ACTIVE}"

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: "FK -> Infant.id; the infant this dried-blood-spot card belongs to."
      - name: specimen_type
        type: enum
        source: input
        description: "Whether this is the first card or a repeat/recollection card."
        constraints: "one of {INITIAL, REPEAT}"
      - name: collection_datetime
        type: datetime
        source: input
        description: When the heel-stick specimen was collected (must be >= Infant.birth_datetime).
      - name: received_datetime
        type: datetime
        source: system
        description: When the lab logged receipt; set by POST /nbs/specimens/{id}/receive.
      - name: reported_datetime
        type: datetime
        source: system
        description: When the metabolic result was reported; stamped from the logical clock by POST /nbs/screens/{id}/report-metabolic on this specimen's screen.
      - name: blood_spot_count
        type: integer
        source: system
        description: Number of adequately saturated blood spots recorded at receipt.
      - name: collection_age_hours
        type: number
        source: computed
        description: "(collection_datetime - Infant.birth_datetime) in hours, 2 decimals."
      - name: transit_time_hours
        type: number
        source: computed
        description: "(received_datetime - collection_datetime) in hours, 2 decimals; null until received."
      - name: acceptability
        type: enum
        source: computed
        description: "Result of the acceptability determination at receipt."
        constraints: "one of {SATISFACTORY, UNSAT_QUANTITY, UNSAT_EARLY, UNSAT_TRANSIT}"
      - name: timeliness_provisional
        type: enum
        source: computed
        description: "Provisional (at-receipt) timeliness class from collection age and transit time."
        constraints: "one of {ON_TIME, LATE}"
      - name: timeliness_final
        type: enum
        source: computed
        description: "Final (at-report) timeliness class from birth-to-report turnaround; null until reported."
        constraints: "one of {TIMELY, DELAYED}"
      - name: status
        type: enum
        source: system
        description: Specimen lifecycle state.
        default: COLLECTED
        constraints: "one of {COLLECTED, RECEIVED, SATISFACTORY, UNSATISFACTORY, IN_TESTING, TESTED, VOIDED}"

  - name: Screen
    parent: null
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; the SATISFACTORY specimen this screening panel runs on."
      - name: metabolic_status
        type: enum
        source: system
        description: Metabolic (blood-spot) dimension, reported by the lab.
        default: PENDING
        constraints: "one of {PENDING, REPORTED_NORMAL, BORDERLINE, PRESUMPTIVE_POSITIVE, CANCELLED}"
      - name: hearing_status
        type: enum
        source: system
        description: Hearing (point-of-care) dimension, reported by the birth facility.
        default: NOT_DONE
        constraints: "one of {NOT_DONE, PASS, REFER}"
      - name: cchd_status
        type: enum
        source: system
        description: Critical congenital heart disease pulse-oximetry dimension, reported by the birth facility.
        default: NOT_DONE
        constraints: "one of {NOT_DONE, PASS, RETEST, FAIL}"
      - name: spo2_right_hand
        type: integer
        source: system
        description: Recorded pre-ductal SpO2 percentage (right hand).
      - name: spo2_foot
        type: integer
        source: system
        description: Recorded post-ductal SpO2 percentage (either foot).
      - name: critical_analyte_count
        type: integer
        source: system
        description: Number of metabolic analytes flagged critical at metabolic reporting.
        default: 0
      - name: overall_disposition
        type: enum
        source: computed
        description: "Derived: FLAGGED if any dimension is PRESUMPTIVE_POSITIVE/REFER/FAIL; CLEARED if all three are terminal-normal; CANCELLED if metabolic_status is CANCELLED; else PENDING."
        default: PENDING
        constraints: "one of {PENDING, CLEARED, FLAGGED, CANCELLED}"

  - name: RecollectionOrder
    parent: null
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: system
        description: "FK -> Specimen.id; the UNSATISFACTORY specimen that triggered this recollection request."
      - name: reason
        type: enum
        source: system
        description: Copied from the triggering specimen's acceptability determination.
        constraints: "one of {UNSAT_QUANTITY, UNSAT_EARLY, UNSAT_TRANSIT}"
      - name: deadline_datetime
        type: datetime
        source: system
        description: "Clock-at-creation plus RECOLLECTION_WINDOW_DAYS (= 30 days); recorded for follow-up."
      - name: status
        type: enum
        source: system
        description: Recollection order lifecycle.
        default: ORDERED
        constraints: "one of {ORDERED, COLLECTED, CANCELLED}"

  - name: FollowUpCase
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: system
        description: "FK -> Infant.id; the infant under follow-up."
      - name: screen_id
        type: string
        source: system
        description: "FK -> Screen.id; the screen whose flag opened this case."
      - name: case_type
        type: enum
        source: system
        description: Short-term (repeat/confirm) versus long-term monitoring.
        default: SHORT_TERM
        constraints: "one of {SHORT_TERM, LONG_TERM}"
      - name: critical_flag_count
        type: integer
        source: system
        description: Copied from Screen.critical_analyte_count at open; multiplier input to the priority score.
        default: 0
      - name: repeat_count
        type: integer
        source: system
        description: Number of times a repeat has been requested on this case.
        default: 0
      - name: opened_at_clock
        type: datetime
        source: system
        description: "Logical-clock instant when the case opened; the repeat window (REPEAT_WINDOW_DAYS = 30 days) is measured from here."
      - name: priority_variant
        type: enum
        source: computed
        description: "INITIAL until a confirmatory/repeat outcome is recorded; REVISED thereafter."
        default: INITIAL
        constraints: "one of {INITIAL, REVISED}"
      - name: priority_score
        type: integer
        source: computed
        description: Triage score from the followup_priority_score calculation; recomputed on resolve.
        default: 0
      - name: status
        type: enum
        source: system
        description: Follow-up case lifecycle (cyclic via the repeat loop).
        default: OPEN
        constraints: "one of {OPEN, REPEAT_REQUESTED, REPEAT_RECEIVED, CONFIRMED_POSITIVE, LONG_TERM_MONITORING, RESOLVED_NORMAL, CLOSED}"

  - name: SpecialtyClinic
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Clinic display name.
      - name: specialty
        type: enum
        source: input
        description: Referral specialty this clinic serves.
        constraints: "one of {METABOLIC_GENETICS, AUDIOLOGY, CARDIOLOGY}"
      - name: concurrent_capacity
        type: integer
        source: input
        description: Maximum number of mutually-overlapping SCHEDULED confirmatory appointments the clinic can hold at any instant.
        constraints: ">= 1"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: follow_up_case_id
        type: string
        source: input
        description: "FK -> FollowUpCase.id; the case this confirmatory/specialty referral belongs to."
      - name: specialty_clinic_id
        type: string
        source: input
        description: "FK -> SpecialtyClinic.id; the receiving clinic (its specialty must match referral_reason)."
      - name: referral_reason
        type: enum
        source: input
        description: The specialty being referred to; must equal the clinic's specialty.
        constraints: "one of {METABOLIC_GENETICS, AUDIOLOGY, CARDIOLOGY}"
      - name: status
        type: enum
        source: system
        description: Referral lifecycle.
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, COMPLETED, NO_SHOW, DECLINED}"

  - name: ConfirmatoryAppointment
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral being scheduled."
      - name: specialty_clinic_id
        type: string
        source: computed
        description: Denormalized clinic id copied from Referral.specialty_clinic_id at booking; used only to group clinic-level overlap/capacity checks (not a client-supplied field).
      - name: start_datetime
        type: datetime
        source: input
        description: Appointment start (half-open interval start).
      - name: end_datetime
        type: datetime
        source: input
        description: Appointment end (half-open interval end); must be strictly after start_datetime.
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW}"

  - name: AssayRun
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the LAB facility whose instrument runs this batch."
      - name: instrument_code
        type: string
        source: input
        description: Instrument identifier within the lab; overlap is checked per (facility_id, instrument_code).
      - name: start_datetime
        type: datetime
        source: input
        description: Run start (half-open interval start).
      - name: end_datetime
        type: datetime
        source: input
        description: "Run end (half-open interval end); must be strictly after start_datetime. Overlap check uses ASSAY_BUFFER_MINUTES = 30 minutes between runs on the same instrument."
      - name: duration_minutes
        type: integer
        source: computed
        description: "(end_datetime - start_datetime) in whole minutes; contributes to Facility.total_booked_minutes while status != CANCELLED."
      - name: status
        type: enum
        source: system
        description: Assay run lifecycle.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [TESTED, UNSATISFACTORY, VOIDED]
    transitions:
      - from: COLLECTED
        to: RECEIVED
        trigger: "POST /nbs/specimens/{id}/receive"
        actor: LabTechnician
        preconditions:
          - "received_datetime >= collection_datetime (else ERR_RECEIVED_BEFORE_COLLECTION)"
          - "Infant.consent_status != REFUSED (else ERR_CONSENT_REFUSED)"
        side_effects:
          - "records received_datetime and blood_spot_count"
          - "computes transit_time_hours and acceptability (calculation specimen_acceptability)"
          - "immediately auto-transitions to SATISFACTORY or UNSATISFACTORY per acceptability"
      - from: RECEIVED
        to: SATISFACTORY
        trigger: "system (auto, same request as receive)"
        actor: system
        preconditions: ["acceptability == SATISFACTORY"]
        side_effects: ["computes timeliness_provisional"]
      - from: RECEIVED
        to: UNSATISFACTORY
        trigger: "system (auto, same request as receive)"
        actor: system
        preconditions: ["acceptability != SATISFACTORY"]
        side_effects:
          - "CASCADE link1: creates a RecollectionOrder(status=ORDERED, reason=acceptability, deadline=clock+RECOLLECTION_WINDOW_DAYS) for this specimen"
          - "CASCADE link2: that RecollectionOrder creation increments Infant.open_recollection_count by 1"
      - from: SATISFACTORY
        to: IN_TESTING
        trigger: "POST /nbs/screens (create a Screen for this specimen)"
        actor: LabTechnician
        preconditions: ["Specimen.status == SATISFACTORY (else ERR_SPECIMEN_NOT_SATISFACTORY)"]
        side_effects: ["links the new Screen; specimen enters testing"]
      - from: IN_TESTING
        to: TESTED
        trigger: "POST /nbs/screens/{id}/report-metabolic"
        actor: LabTechnician
        preconditions: ["the screen's metabolic_status == PENDING"]
        side_effects:
          - "stamps reported_datetime from the logical clock"
          - "computes timeliness_final"
      - from: COLLECTED
        to: VOIDED
        trigger: "system (parental refusal cascade)"
        actor: system
        preconditions: ["Infant.consent_status transitioning to REFUSED"]
        side_effects: ["specimen voided (refusal cascade link1)"]
      - from: RECEIVED
        to: VOIDED
        trigger: "system (parental refusal cascade)"
        actor: system
        preconditions: ["Infant.consent_status transitioning to REFUSED"]
        side_effects: ["specimen voided; any ORDERED RecollectionOrder for it is CANCELLED (refusal cascade link2)"]
      - from: SATISFACTORY
        to: VOIDED
        trigger: "system (parental refusal cascade)"
        actor: system
        preconditions: ["Infant.consent_status transitioning to REFUSED"]
        side_effects: ["specimen voided"]
      - from: IN_TESTING
        to: VOIDED
        trigger: "system (parental refusal cascade)"
        actor: system
        preconditions: ["Infant.consent_status transitioning to REFUSED"]
        side_effects:
          - "specimen voided (refusal cascade link1)"
          - "its Screen's metabolic_status set to CANCELLED (refusal cascade link2)"

  - entity: Screen
    initial_state: PENDING
    terminal_states: []
    note: "Three independent status axes. metabolic_status is the primary lifecycle; hearing_status and cchd_status evolve independently on the same row (parallel dimensions). overall_disposition is derived from all three."
    transitions:
      - from: PENDING
        to: REPORTED_NORMAL
        trigger: "POST /nbs/screens/{id}/report-metabolic (metabolic_result=NORMAL)"
        actor: LabTechnician
        preconditions: ["metabolic_status == PENDING", "Specimen.status == IN_TESTING"]
        side_effects: ["Specimen -> TESTED", "recompute overall_disposition"]
      - from: PENDING
        to: BORDERLINE
        trigger: "POST /nbs/screens/{id}/report-metabolic (metabolic_result=BORDERLINE)"
        actor: LabTechnician
        preconditions: ["metabolic_status == PENDING", "Specimen.status == IN_TESTING"]
        side_effects: ["Specimen -> TESTED", "recompute overall_disposition"]
      - from: PENDING
        to: PRESUMPTIVE_POSITIVE
        trigger: "POST /nbs/screens/{id}/report-metabolic (metabolic_result=PRESUMPTIVE_POSITIVE)"
        actor: LabTechnician
        preconditions: ["metabolic_status == PENDING", "Specimen.status == IN_TESTING"]
        side_effects:
          - "records critical_analyte_count; Specimen -> TESTED; recompute overall_disposition = FLAGGED"
          - "CASCADE link1: opens a FollowUpCase(case_type=SHORT_TERM, status=OPEN, screen_id=this, infant_id=specimen.infant_id, critical_flag_count=critical_analyte_count, opened_at_clock=clock)"
          - "CASCADE link2: that FollowUpCase open increments Infant.open_case_count by 1 and sets Infant.followup_status = ACTIVE"
          - "CASCADE link3: the priority_score (INITIAL variant) is computed on the new case"
      - from: PENDING
        to: CANCELLED
        trigger: "system (parental refusal cascade, via specimen void)"
        actor: system
        preconditions: ["linked Specimen transitioning to VOIDED while IN_TESTING"]
        side_effects:
          - "overall_disposition = CANCELLED"
          - "CASCADE link3: any OPEN/REPEAT_* FollowUpCase for this screen is CLOSED"
      - from: NOT_DONE
        to: PASS
        trigger: "POST /nbs/screens/{id}/point-of-care (component=HEARING, hearing_result=PASS)"
        actor: BirthFacilityUser
        preconditions: ["hearing_status == NOT_DONE"]
        side_effects: ["recompute overall_disposition"]
        note: "hearing axis (independent of metabolic/cchd)"
      - from: NOT_DONE
        to: REFER
        trigger: "POST /nbs/screens/{id}/point-of-care (component=HEARING, hearing_result=REFER)"
        actor: BirthFacilityUser
        preconditions: ["hearing_status == NOT_DONE"]
        side_effects:
          - "recompute overall_disposition = FLAGGED"
          - "CASCADE: if no FollowUpCase is open for this screen, opens a FollowUpCase(SHORT_TERM, OPEN, critical_flag_count=0, opened_at_clock=clock), increments Infant.open_case_count, sets followup_status=ACTIVE, computes INITIAL priority_score. Does NOT change the specimen's status (metabolic stays PENDING, specimen stays IN_TESTING)."
        note: "hearing axis"
      - from: NOT_DONE
        to: PASS
        trigger: "POST /nbs/screens/{id}/point-of-care (component=CCHD)"
        actor: BirthFacilityUser
        preconditions: ["cchd_status == NOT_DONE", "cchd_interpretation(spo2_right_hand, spo2_foot) == PASS"]
        side_effects: ["records spo2 values; recompute overall_disposition"]
        note: "cchd axis (independent). Target state chosen by cchd_interpretation."
      - from: NOT_DONE
        to: RETEST
        trigger: "POST /nbs/screens/{id}/point-of-care (component=CCHD)"
        actor: BirthFacilityUser
        preconditions: ["cchd_status == NOT_DONE", "cchd_interpretation(spo2_right_hand, spo2_foot) == RETEST"]
        side_effects: ["records spo2 values; recompute overall_disposition"]
        note: "cchd axis"
      - from: NOT_DONE
        to: FAIL
        trigger: "POST /nbs/screens/{id}/point-of-care (component=CCHD)"
        actor: BirthFacilityUser
        preconditions: ["cchd_status == NOT_DONE", "cchd_interpretation(spo2_right_hand, spo2_foot) == FAIL"]
        side_effects:
          - "records spo2 values; recompute overall_disposition = FLAGGED"
          - "CASCADE: if no FollowUpCase is open for this screen, opens a FollowUpCase(SHORT_TERM, OPEN, critical_flag_count=0, opened_at_clock=clock), increments Infant.open_case_count, sets followup_status=ACTIVE, computes INITIAL priority_score. Does NOT change the specimen's status (metabolic stays PENDING, specimen stays IN_TESTING)."
        note: "cchd axis"

  - entity: FollowUpCase
    initial_state: OPEN
    terminal_states: [RESOLVED_NORMAL, CLOSED]
    note: "Cyclic: REPEAT_RECEIVED can loop back to REPEAT_REQUESTED any number of times."
    transitions:
      - from: OPEN
        to: REPEAT_REQUESTED
        trigger: "POST /nbs/follow-up-cases/{id}/request-repeat"
        actor: FollowUpCoordinator
        preconditions:
          - "status == OPEN or REPEAT_RECEIVED"
          - "status != REPEAT_REQUESTED (else ERR_DUPLICATE_REPEAT_PENDING)"
          - "clock <= opened_at_clock + REPEAT_WINDOW_DAYS (= 30 days) (else ERR_REPEAT_WINDOW_EXPIRED)"
        side_effects: ["increments repeat_count by 1"]
      - from: REPEAT_REQUESTED
        to: REPEAT_RECEIVED
        trigger: "system (a REPEAT specimen for this infant reaches TESTED)"
        actor: system
        preconditions: ["a REPEAT Specimen for infant_id transitions to TESTED"]
        side_effects: ["case ready for re-triage"]
      - from: REPEAT_RECEIVED
        to: REPEAT_REQUESTED
        trigger: "POST /nbs/follow-up-cases/{id}/request-repeat"
        actor: FollowUpCoordinator
        preconditions:
          - "status == REPEAT_RECEIVED"
          - "clock <= opened_at_clock + REPEAT_WINDOW_DAYS (= 30 days) (else ERR_REPEAT_WINDOW_EXPIRED)"
        side_effects: ["increments repeat_count by 1 (repeat loop)"]
      - from: OPEN
        to: RESOLVED_NORMAL
        trigger: "POST /nbs/follow-up-cases/{id}/resolve (outcome=NORMAL)"
        actor: FollowUpCoordinator
        preconditions: ["status in {OPEN, REPEAT_RECEIVED}"]
        side_effects:
          - "priority_variant -> REVISED; recompute priority_score (REVISED variant)"
          - "COMPENSATION: decrements Infant.open_case_count by 1; if it reaches 0, Infant.followup_status = CLEAR"
      - from: REPEAT_RECEIVED
        to: RESOLVED_NORMAL
        trigger: "POST /nbs/follow-up-cases/{id}/resolve (outcome=NORMAL)"
        actor: FollowUpCoordinator
        preconditions: ["status in {OPEN, REPEAT_RECEIVED}"]
        side_effects:
          - "priority_variant -> REVISED; recompute priority_score (REVISED variant)"
          - "COMPENSATION: decrements Infant.open_case_count by 1; if it reaches 0, Infant.followup_status = CLEAR"
      - from: OPEN
        to: CONFIRMED_POSITIVE
        trigger: "POST /nbs/follow-up-cases/{id}/resolve (outcome=CONFIRMED)"
        actor: FollowUpCoordinator
        preconditions:
          - "status in {OPEN, REPEAT_RECEIVED}"
          - "at least one Referral for this case has status == COMPLETED (else ERR_REFERRALS_UNRESOLVED)"
        side_effects:
          - "priority_variant -> REVISED; recompute priority_score (REVISED variant, confirmatory_positive=true)"
          - "case_type -> LONG_TERM; auto-transitions to LONG_TERM_MONITORING"
      - from: CONFIRMED_POSITIVE
        to: LONG_TERM_MONITORING
        trigger: "system (auto, same request as CONFIRMED resolve)"
        actor: system
        preconditions: ["case_type == LONG_TERM"]
        side_effects: ["case enters long-term monitoring (remains counted in open_case_count)"]
      - from: OPEN
        to: CLOSED
        trigger: "system (parental refusal / screen-cancel cascade)"
        actor: system
        preconditions: ["linked Screen transitioning to CANCELLED"]
        side_effects:
          - "COMPENSATION: decrements Infant.open_case_count by 1 (refusal cascade link4); if 0, followup_status = CLEAR"
      - from: REPEAT_REQUESTED
        to: CLOSED
        trigger: "system (parental refusal / screen-cancel cascade)"
        actor: system
        preconditions: ["linked Screen transitioning to CANCELLED"]
        side_effects: ["COMPENSATION: decrements Infant.open_case_count by 1"]

  - entity: Referral
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "system (a ConfirmatoryAppointment is created for this referral)"
        actor: system
        preconditions: ["status == REQUESTED"]
        side_effects: ["referral now has an appointment"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /nbs/referrals/{id}/resolve (outcome=DECLINED)"
        actor: FollowUpCoordinator
        preconditions: ["status == REQUESTED"]
        side_effects: ["family declined the referral"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /nbs/referrals/{id}/resolve (outcome=COMPLETED)"
        actor: FollowUpCoordinator
        preconditions:
          - "status == SCHEDULED (else ERR_REFERRAL_NOT_SCHEDULED)"
          - "at least one ConfirmatoryAppointment for this referral has status == COMPLETED (else ERR_APPOINTMENT_NOT_COMPLETED)"
        side_effects: ["referral completed; unlocks case CONFIRMED resolution"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /nbs/referrals/{id}/resolve (outcome=NO_SHOW)"
        actor: FollowUpCoordinator
        preconditions: ["status == SCHEDULED"]
        side_effects: ["marks the scheduled appointment NO_SHOW"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "system (a new ConfirmatoryAppointment is created for this referral)"
        actor: system
        preconditions: ["status == NO_SHOW"]
        side_effects: ["rescheduled (revert loop)"]

  - entity: ConfirmatoryAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /nbs/confirmatory-appointments/{id}/complete"
        actor: SpecialtyClinician
        preconditions:
          - "status == SCHEDULED"
          - "acting clinic owns this appointment (specialty_clinic_id == X-User-ID, else ERR_NOT_OWNER)"
        side_effects: ["appointment attended"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (referral resolved NO_SHOW)"
        actor: system
        preconditions: ["parent Referral resolves NO_SHOW"]
        side_effects: ["appointment marked no-show"]

  - entity: AssayRun
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /nbs/assay-runs/{id}/cancel"
        actor: LabTechnician
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "COMPENSATION: subtracts this run's duration_minutes from Facility.total_booked_minutes (restoring the pre-create value)"

  - entity: RecollectionOrder
    initial_state: ORDERED
    terminal_states: [COLLECTED, CANCELLED]
    note: "Created only by the UNSATISFACTORY-specimen cascade; advanced only by system triggers (no direct write endpoint)."
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "system (a REPEAT Specimen is created for this order's infant via POST /nbs/specimens)"
        actor: system
        preconditions: ["status == ORDERED"]
        side_effects: ["decrements Infant.open_recollection_count by 1"]
      - from: ORDERED
        to: CANCELLED
        trigger: "system (parental refusal cascade voids the triggering specimen)"
        actor: system
        preconditions: ["status == ORDERED", "the triggering Specimen transitions to VOIDED"]
        side_effects: ["decrements Infant.open_recollection_count by 1 (refusal cascade)"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: specimen-create-stale-infant
    parent_entity: Infant
    write_endpoint: "POST /nbs/specimens"
    occ_field: "expected_infant_version"
    description: |
      Creating a Specimen against an Infant whose version has advanced since
      the client last observed it is rejected. A REPEAT card legitimately
      supersedes the prior current_specimen_id pointer, so a second create
      would succeed under the natural product semantics; it is rejected only
      because the caller's view of the infant is stale (its version no longer
      matches). Cascades — open_recollection_count / open_case_count / consent
      changes — also bump Infant.version between the caller's read and this
      write, so a stale expected_infant_version is the deterministic signal.
    error_id: ERR_STALE_INFANT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: specimen_timeliness
    trigger: "timeliness_provisional at receipt (RECEIVED->SATISFACTORY); timeliness_final at metabolic report (IN_TESTING->TESTED)"
    algorithm: threshold
    formula: |
      collection_age_hours = round((collection_datetime - birth_datetime)/3600, 2)
      transit_time_hours   = round((received_datetime - collection_datetime)/3600, 2)
      # PROVISIONAL variant (known at receipt):
      if collection_age_hours >= MIN_COLLECTION_AGE_HOURS
         and collection_age_hours <= MAX_COLLECTION_AGE_HOURS
         and transit_time_hours <= MAX_TRANSIT_ONTIME_HOURS:
          timeliness_provisional = ON_TIME
      else:
          timeliness_provisional = LATE
      # FINAL variant (known at report):
      total_turnaround_hours = (reported_datetime - birth_datetime)/3600
      timeliness_final = TIMELY if total_turnaround_hours <= MAX_REPORT_TURNAROUND_HOURS else DELAYED
    input_set: "A single Specimen. PROVISIONAL uses collection/transit; FINAL uses birth->report turnaround."
    constants:
      MIN_COLLECTION_AGE_HOURS: 24
      MAX_COLLECTION_AGE_HOURS: 48
      MAX_TRANSIT_ONTIME_HOURS: 24
      MAX_REPORT_TURNAROUND_HOURS: 120
    precision: "hours to 2 decimals, round_half_up; classifications are enums"
    variants:
      - name: PROVISIONAL
        when: "computed at receipt (RECEIVED->SATISFACTORY), before the result is reported"
        difference: "uses collection age + transit time only; yields ON_TIME/LATE"
      - name: FINAL
        when: "computed at metabolic report (IN_TESTING->TESTED)"
        difference: "uses total birth->report turnaround; yields TIMELY/DELAYED; can disagree with PROVISIONAL for the same specimen"

  - name: followup_priority_score
    trigger: "INITIAL at FollowUpCase open (cascade from PRESUMPTIVE_POSITIVE); REVISED at resolve"
    algorithm: weighted_scoring
    formula: |
      preterm    = 1 if Infant.gestational_age_weeks < PRETERM_WEEKS else 0
      low_weight = 1 if Infant.birth_weight_grams < LOW_BIRTH_WEIGHT_GRAMS else 0
      base = W_CRITICAL * critical_flag_count + W_PRETERM * preterm + W_LOWBIRTH * low_weight
      # INITIAL variant:
      priority_score = base
      # REVISED variant (at resolve):
      confirmed    = 1 if outcome == CONFIRMED else 0
      repeat_norm  = 1 if outcome == NORMAL else 0
      priority_score = base + W_CONFIRMED * confirmed - W_REPEAT_NORMAL * repeat_norm
    input_set: "One FollowUpCase and its Infant. critical_flag_count copied from Screen at open."
    constants:
      W_CRITICAL: 50
      W_PRETERM: 20
      W_LOWBIRTH: 15
      W_CONFIRMED: 40
      W_REPEAT_NORMAL: 30
      PRETERM_WEEKS: 34
      LOW_BIRTH_WEIGHT_GRAMS: 1500
    precision: "integer score (all weights integers); no rounding"
    variants:
      - name: INITIAL
        when: "at case open"
        difference: "base weighted sum only"
      - name: REVISED
        when: "at resolve (NORMAL or CONFIRMED)"
        difference: "adds W_CONFIRMED when confirmed, subtracts W_REPEAT_NORMAL when repeat came back normal; diverges from INITIAL on the same case"

  - name: specimen_acceptability
    trigger: "at receipt (COLLECTED->RECEIVED side effect)"
    algorithm: threshold
    formula: |
      # First-match-wins, evaluated strictly top to bottom (order is pinned):
      if blood_spot_count < REQUIRED_SPOTS:
          acceptability = UNSAT_QUANTITY
      elif collection_age_hours < MIN_COLLECTION_AGE_HOURS
           and Infant.gestational_age_weeks >= TERM_WEEKS:
          acceptability = UNSAT_EARLY        # term infants only; preterm are exempt
      elif transit_time_hours > MAX_TRANSIT_HOURS:
          acceptability = UNSAT_TRANSIT
      else:
          acceptability = SATISFACTORY
    input_set: "One Specimen at receipt: blood_spot_count, collection_age_hours, transit_time_hours, and Infant.gestational_age_weeks."
    constants:
      REQUIRED_SPOTS: 4
      MIN_COLLECTION_AGE_HOURS: 24
      TERM_WEEKS: 37
      MAX_TRANSIT_HOURS: 96
    precision: "enum result; the four-branch order is authoritative"

  - name: cchd_interpretation
    trigger: "POST /nbs/screens/{id}/point-of-care (component=CCHD)"
    algorithm: threshold
    formula: |
      lower = min(spo2_right_hand, spo2_foot)
      diff  = abs(spo2_right_hand - spo2_foot)
      if lower < CCHD_FAIL_BELOW:                 # < 90
          result = FAIL
      elif lower >= CCHD_PASS_AT and diff <= CCHD_DIFF_MAX:   # >= 95 and diff <= 3
          result = PASS
      else:
          result = RETEST                          # 90..94, or >=95 with diff > 3
    input_set: "spo2_right_hand and spo2_foot on one Screen's cchd axis."
    constants:
      CCHD_FAIL_BELOW: 90
      CCHD_PASS_AT: 95
      CCHD_DIFF_MAX: 3
    precision: "integer percentages; boundary at exactly 90 (< is FAIL) and exactly 95 (>= is eligible for PASS)"

  - name: program_timeliness_rate
    trigger: "GET /nbs/program/timeliness-summary"
    algorithm: aggregation
    formula: |
      # Eligible specimen: specimen_type == INITIAL AND timeliness_final != null
      # (reported), optionally filtered to Facility.state_region.
      # Per-facility rate, rounded FIRST:
      for each Facility f with >=1 eligible specimen:
          timely_f = count(eligible specimens of f with timeliness_final == TIMELY)
          total_f  = count(eligible specimens of f)
          rate_f   = round_half_up(100 * timely_f / total_f, 1)   # 1 decimal, per facility
      # Program rate: AVERAGE of the per-facility rounded rates, then round:
      if no facility has an eligible specimen:
          program_rate = null                      # empty-set: null, NOT 0, NOT an error
      else:
          program_rate = round_half_up(mean(rate_f over facilities), 1)
    input_set: "All Specimens with specimen_type=INITIAL and a non-null timeliness_final, grouped by their Infant's Facility.state_region when state_region filter is supplied."
    constants:
      ROUNDING: round_half_up
    precision: "percentages to 1 decimal; ROUND EACH FACILITY FIRST, THEN AVERAGE, THEN ROUND (this order is pinned; 'sum-timely / sum-total then round' is explicitly NOT used)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID equals the owning entity id (BirthFacilityUser -> Infant.facility_id / Specimen's infant.facility_id; SpecialtyClinician -> appointment.specialty_clinic_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /nbs/infants, POST /nbs/infants/{id}/consent, POST /nbs/specimens, POST /nbs/screens/{id}/point-of-care, POST /nbs/confirmatory-appointments/{id}/complete"
  - priority: 4
    category: existence
    check: "all path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_INFANT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing an infant_id/{id}"
  - priority: 4
    category: existence
    check: "referenced facility exists"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/infants, POST /nbs/assay-runs"
  - priority: 4
    category: existence
    check: "referenced specimen exists"
    error_id: ERR_SPECIMEN_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/specimens/{id}/receive, POST /nbs/screens, GET /nbs/specimens/{id}, GET /nbs/specimens/{id}/recollection-orders"
  - priority: 4
    category: existence
    check: "referenced screen exists"
    error_id: ERR_SCREEN_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/screens/{id}/report-metabolic, POST /nbs/screens/{id}/point-of-care, GET /nbs/screens/{id}"
  - priority: 4
    category: existence
    check: "referenced follow-up case exists"
    error_id: ERR_FOLLOWUP_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/follow-up-cases/{id}/request-repeat, POST /nbs/follow-up-cases/{id}/resolve, POST /nbs/referrals, GET /nbs/follow-up-cases/{id}"
  - priority: 4
    category: existence
    check: "referenced referral exists"
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/referrals/{id}/resolve, POST /nbs/confirmatory-appointments, GET /nbs/referrals/{id}, GET /nbs/referrals/{id}/confirmatory-appointments"
  - priority: 4
    category: existence
    check: "referenced specialty clinic exists"
    error_id: ERR_SPECIALTY_CLINIC_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/referrals"
  - priority: 4
    category: existence
    check: "referenced confirmatory appointment exists"
    error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/confirmatory-appointments/{id}/complete"
  - priority: 4
    category: existence
    check: "referenced assay run exists"
    error_id: ERR_ASSAY_RUN_NOT_FOUND
    http_status: 404
    applies_to: "POST /nbs/assay-runs/{id}/cancel, GET /nbs/assay-runs/{id}"
  - priority: 5
    category: business_constraint
    check: "required body fields present and correctly typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "enum body fields hold a declared member"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints with enum inputs"
  - priority: 6
    category: state
    check: "target resource is in a state that allows the requested transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: state
    check: "target resource is already terminal"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: state
    check: "Screen create: linked Specimen.status == SATISFACTORY"
    error_id: ERR_SPECIMEN_NOT_SATISFACTORY
    http_status: 409
    applies_to: "POST /nbs/screens"
  - priority: 6
    category: state
    check: "Referral resolve COMPLETED/NO_SHOW: referral.status == SCHEDULED"
    error_id: ERR_REFERRAL_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /nbs/referrals/{id}/resolve"
  - priority: 7
    category: business_safety
    check: "operation on an infant whose consent_status == REFUSED is blocked"
    error_id: ERR_CONSENT_REFUSED
    http_status: 409
    applies_to: "POST /nbs/specimens, POST /nbs/specimens/{id}/receive, POST /nbs/screens"
  - priority: 8
    category: business_referential
    check: "Referral.referral_reason equals the SpecialtyClinic.specialty"
    error_id: ERR_CLINIC_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /nbs/referrals"
  - priority: 8
    category: business_referential
    check: "Referral resolve COMPLETED requires a ConfirmatoryAppointment for it in status COMPLETED"
    error_id: ERR_APPOINTMENT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /nbs/referrals/{id}/resolve"
  - priority: 8
    category: business_referential
    check: "FollowUpCase resolve CONFIRMED requires >=1 Referral for the case in status COMPLETED"
    error_id: ERR_REFERRALS_UNRESOLVED
    http_status: 409
    applies_to: "POST /nbs/follow-up-cases/{id}/resolve"
  - priority: 9
    category: business_constraint
    check: "request-repeat: case is not already REPEAT_REQUESTED (no duplicate pending repeat)"
    error_id: ERR_DUPLICATE_REPEAT_PENDING
    http_status: 409
    applies_to: "POST /nbs/follow-up-cases/{id}/request-repeat"
  - priority: 9
    category: business_constraint
    check: "referral create: the case has no existing referral in status REQUESTED or SCHEDULED (at most one open referral per case at a time)"
    error_id: ERR_DUPLICATE_OPEN_REFERRAL
    http_status: 409
    applies_to: "POST /nbs/referrals"
  - priority: 10
    category: business_temporal
    check: "collection_datetime >= Infant.birth_datetime"
    error_id: ERR_COLLECTION_BEFORE_BIRTH
    http_status: 422
    applies_to: "POST /nbs/specimens"
  - priority: 10
    category: business_temporal
    check: "received_datetime >= collection_datetime"
    error_id: ERR_RECEIVED_BEFORE_COLLECTION
    http_status: 422
    applies_to: "POST /nbs/specimens/{id}/receive"
  - priority: 10
    category: business_temporal
    check: "request-repeat within the window: clock <= opened_at_clock + REPEAT_WINDOW_DAYS"
    error_id: ERR_REPEAT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /nbs/follow-up-cases/{id}/request-repeat"
  - priority: 10
    category: business_temporal
    check: "end_datetime strictly after start_datetime (appointments and assay runs)"
    error_id: ERR_INTERVAL_END_BEFORE_START
    http_status: 422
    applies_to: "POST /nbs/confirmatory-appointments, POST /nbs/assay-runs"
  - priority: 11
    category: business_temporal
    check: "clinic aggregate capacity: number of SCHEDULED appointments at the clinic overlapping [start,end) is < concurrent_capacity"
    error_id: ERR_CLINIC_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nbs/confirmatory-appointments"
  - priority: 11
    category: business_temporal
    check: "instrument exclusivity: no non-CANCELLED AssayRun on the same (facility_id, instrument_code) whose [start,end) is within ASSAY_BUFFER_MINUTES (= 30 minutes) of the new run"
    error_id: ERR_INSTRUMENT_BUSY
    http_status: 409
    applies_to: "POST /nbs/assay-runs"
  - priority: 12
    category: business_constraint
    check: "OCC: expected_infant_version equals current Infant.version"
    error_id: ERR_STALE_INFANT_VERSION
    http_status: 412
    applies_to: "POST /nbs/specimens"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/nbs/facilities"
    description: Register a facility (hospital, birthing center, or state lab).
    roles: [ProgramAdmin]
    code: 201
    input: [name, facility_type, state_region]
    output: Facility
    side_effects: ["creates Facility with total_booked_minutes=0"]
  - method: GET
    path: "/nbs/facilities/{id}"
    description: Fetch one facility (exposes total_booked_minutes for the assay-scheduling invariant).
    roles: [LabTechnician, ProgramAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/nbs/infants"
    description: Register a newborn at the acting facility.
    roles: [BirthFacilityUser, ProgramAdmin]
    code: 201
    input: [facility_id, birth_datetime, gestational_age_weeks, birth_weight_grams, sex, "multiple_birth?"]
    output: Infant
    side_effects: ["creates Infant with consent_status=PENDING, counts=0"]
  - method: GET
    path: "/nbs/infants/{id}"
    description: Fetch one infant.
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Infant
    side_effects: []
  - method: GET
    path: "/nbs/infants"
    description: List infants, optionally filtered by facility (reverse lookup for Infant.facility_id).
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: ["facility_id?", "consent_status?", "limit?", "offset?"]
    output: Infant[]
    side_effects: []
  - method: POST
    path: "/nbs/infants/{id}/consent"
    description: "Record parental consent or refusal (decision in {CONSENT, REFUSAL}; CONSENT -> consent_status CONSENTED, REFUSAL -> REFUSED). REFUSAL cascades to void non-terminal specimens."
    roles: [BirthFacilityUser]
    code: 200
    input: [decision, recorded_by, "religious_exemption?"]
    output: Infant
    side_effects:
      - "sets consent_status to CONSENTED or REFUSED"
      - "on REFUSED: refusal cascade (void specimens -> cancel recollection orders / cancel screens -> close cases)"

  - method: POST
    path: "/nbs/specimens"
    description: Log a collected specimen for an infant (OCC on Infant.version).
    roles: [BirthFacilityUser]
    code: 201
    input: [infant_id, specimen_type, collection_datetime, expected_infant_version]
    output: Specimen
    side_effects:
      - "creates Specimen (status=COLLECTED), computes collection_age_hours"
      - "sets Infant.current_specimen_id to the new specimen"
      - "if specimen_type=REPEAT: marks the infant's ORDERED RecollectionOrders COLLECTED and decrements Infant.open_recollection_count accordingly"
      - "increments Infant.version by 1"
  - method: GET
    path: "/nbs/specimens/{id}"
    description: Fetch one specimen.
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Specimen
    side_effects: []
  - method: GET
    path: "/nbs/specimens"
    description: List specimens, optionally filtered by infant (reverse lookup for Specimen.infant_id).
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: ["infant_id?", "status?", "specimen_type?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []
  - method: POST
    path: "/nbs/specimens/{id}/receive"
    description: Log lab receipt; runs acceptability and auto-sorts to SATISFACTORY or UNSATISFACTORY.
    roles: [LabTechnician]
    code: 200
    input: [received_datetime, blood_spot_count]
    output: Specimen
    side_effects:
      - "records received_datetime, blood_spot_count; computes transit_time_hours, acceptability"
      - "SATISFACTORY: computes timeliness_provisional"
      - "UNSATISFACTORY: creates RecollectionOrder, increments Infant.open_recollection_count"

  - method: POST
    path: "/nbs/screens"
    description: Open a screening panel on a SATISFACTORY specimen (moves specimen to IN_TESTING).
    roles: [LabTechnician]
    code: 201
    input: [specimen_id]
    output: Screen
    side_effects: ["creates Screen (all axes at initial); Specimen SATISFACTORY -> IN_TESTING"]
  - method: GET
    path: "/nbs/screens/{id}"
    description: Fetch one screen.
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Screen
    side_effects: []
  - method: GET
    path: "/nbs/screens"
    description: List screens, optionally filtered by specimen (reverse lookup for Screen.specimen_id).
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: ["specimen_id?", "limit?", "offset?"]
    output: Screen[]
    side_effects: []
  - method: POST
    path: "/nbs/screens/{id}/report-metabolic"
    description: Report the metabolic (blood-spot) dimension; PRESUMPTIVE_POSITIVE opens a follow-up case.
    roles: [LabTechnician]
    code: 200
    input: [metabolic_result, "critical_analyte_count?"]
    output: Screen
    side_effects:
      - "sets metabolic_status; stamps Specimen.reported_datetime from clock; Specimen -> TESTED; computes timeliness_final"
      - "PRESUMPTIVE_POSITIVE: opens FollowUpCase, increments Infant.open_case_count, sets followup_status=ACTIVE, computes INITIAL priority_score"
      - "if the specimen is REPEAT and a case is REPEAT_REQUESTED: that case -> REPEAT_RECEIVED"
  - method: POST
    path: "/nbs/screens/{id}/point-of-care"
    description: Report a point-of-care dimension (HEARING or CCHD) done at the birth facility.
    roles: [BirthFacilityUser]
    code: 200
    input: [component, "hearing_result?", "spo2_right_hand?", "spo2_foot?"]
    output: Screen
    side_effects:
      - "HEARING: sets hearing_status to PASS/REFER"
      - "CCHD: records spo2 values, runs cchd_interpretation, sets cchd_status to PASS/RETEST/FAIL"
      - "recomputes overall_disposition"
      - "a REFER (hearing) or FAIL (cchd) opens a SHORT_TERM FollowUpCase for this screen if none is open, without moving the specimen out of IN_TESTING"

  - method: GET
    path: "/nbs/specimens/{id}/recollection-orders"
    description: List recollection orders for a specimen (reverse lookup for RecollectionOrder.specimen_id).
    roles: [BirthFacilityUser, LabTechnician, FollowUpCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: RecollectionOrder[]
    side_effects: []

  - method: GET
    path: "/nbs/follow-up-cases/{id}"
    description: Fetch one follow-up case.
    roles: [FollowUpCoordinator, LabTechnician, ProgramAdmin]
    code: 200
    input: []
    output: FollowUpCase
    side_effects: []
  - method: GET
    path: "/nbs/follow-up-cases"
    description: List follow-up cases, filterable by infant or screen (reverse lookup for both FKs).
    roles: [FollowUpCoordinator, LabTechnician, ProgramAdmin]
    code: 200
    input: ["infant_id?", "screen_id?", "status?", "limit?", "offset?"]
    output: FollowUpCase[]
    side_effects: []
  - method: POST
    path: "/nbs/follow-up-cases/{id}/request-repeat"
    description: Request a repeat specimen (cyclic; increments repeat_count).
    roles: [FollowUpCoordinator]
    code: 200
    input: ["note?"]
    output: FollowUpCase
    side_effects: ["status -> REPEAT_REQUESTED; increments repeat_count"]
  - method: POST
    path: "/nbs/follow-up-cases/{id}/resolve"
    description: Resolve a case (NORMAL, CONFIRMED, or DECLINED path); recomputes REVISED priority.
    roles: [FollowUpCoordinator]
    code: 200
    input: [outcome]
    output: FollowUpCase
    side_effects:
      - "NORMAL: -> RESOLVED_NORMAL, decrement Infant.open_case_count, REVISED priority"
      - "CONFIRMED: requires a COMPLETED referral; -> CONFIRMED_POSITIVE -> LONG_TERM_MONITORING, REVISED priority"

  - method: POST
    path: "/nbs/referrals"
    description: Create a confirmatory/specialty referral for a case.
    roles: [FollowUpCoordinator]
    code: 201
    input: [follow_up_case_id, specialty_clinic_id, referral_reason]
    output: Referral
    side_effects: ["creates Referral (REQUESTED)"]
    note: "rejects if the case already has a REQUESTED/SCHEDULED referral (ERR_DUPLICATE_OPEN_REFERRAL) or referral_reason != clinic.specialty (ERR_CLINIC_SPECIALTY_MISMATCH)"
  - method: GET
    path: "/nbs/referrals/{id}"
    description: Fetch one referral.
    roles: [FollowUpCoordinator, SpecialtyClinician, ProgramAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/nbs/referrals"
    description: List referrals, filterable by case or clinic (reverse lookup for both FKs).
    roles: [FollowUpCoordinator, SpecialtyClinician, ProgramAdmin]
    code: 200
    input: ["follow_up_case_id?", "specialty_clinic_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/nbs/referrals/{id}/resolve"
    description: Resolve a referral (COMPLETED / NO_SHOW / DECLINED).
    roles: [FollowUpCoordinator]
    code: 200
    input: [outcome]
    output: Referral
    side_effects:
      - "COMPLETED: requires a COMPLETED appointment; referral -> COMPLETED"
      - "NO_SHOW: referral -> NO_SHOW, its SCHEDULED appointment -> NO_SHOW"
      - "DECLINED: referral -> DECLINED"

  - method: POST
    path: "/nbs/specialty-clinics"
    description: Register a specialty clinic with a concurrent capacity.
    roles: [ProgramAdmin]
    code: 201
    input: [name, specialty, concurrent_capacity]
    output: SpecialtyClinic
    side_effects: ["creates SpecialtyClinic"]

  - method: POST
    path: "/nbs/confirmatory-appointments"
    description: Book a confirmatory appointment against a referral (clinic aggregate-capacity overlap check).
    roles: [FollowUpCoordinator]
    code: 201
    input: [referral_id, start_datetime, end_datetime]
    output: ConfirmatoryAppointment
    side_effects:
      - "copies specialty_clinic_id from the referral; creates ConfirmatoryAppointment (SCHEDULED)"
      - "referral REQUESTED/NO_SHOW -> SCHEDULED"
  - method: GET
    path: "/nbs/referrals/{id}/confirmatory-appointments"
    description: List confirmatory appointments for a referral (reverse lookup for ConfirmatoryAppointment.referral_id).
    roles: [FollowUpCoordinator, SpecialtyClinician, ProgramAdmin]
    code: 200
    input: []
    output: ConfirmatoryAppointment[]
    side_effects: []
  - method: POST
    path: "/nbs/confirmatory-appointments/{id}/complete"
    description: Mark an appointment attended (clinic owns it).
    roles: [SpecialtyClinician]
    code: 200
    input: ["attended?"]
    output: ConfirmatoryAppointment
    side_effects: ["appointment -> COMPLETED"]

  - method: POST
    path: "/nbs/assay-runs"
    description: Schedule a lab assay run on a facility instrument (exclusive+buffer overlap check).
    roles: [LabTechnician]
    code: 201
    input: [facility_id, instrument_code, start_datetime, end_datetime]
    output: AssayRun
    side_effects:
      - "creates AssayRun (SCHEDULED); computes duration_minutes"
      - "adds duration_minutes to Facility.total_booked_minutes"
  - method: GET
    path: "/nbs/assay-runs/{id}"
    description: Fetch one assay run.
    roles: [LabTechnician, ProgramAdmin]
    code: 200
    input: []
    output: AssayRun
    side_effects: []
  - method: GET
    path: "/nbs/assay-runs"
    description: List assay runs, filterable by facility (reverse lookup for AssayRun.facility_id).
    roles: [LabTechnician, ProgramAdmin]
    code: 200
    input: ["facility_id?", "instrument_code?", "status?", "limit?", "offset?"]
    output: AssayRun[]
    side_effects: []
  - method: POST
    path: "/nbs/assay-runs/{id}/cancel"
    description: Cancel an assay run (compensation restores Facility.total_booked_minutes).
    roles: [LabTechnician]
    code: 200
    input: ["reason?"]
    output: AssayRun
    side_effects: ["status -> CANCELLED; subtracts duration_minutes from Facility.total_booked_minutes"]

  - method: GET
    path: "/nbs/program/timeliness-summary"
    description: Program timeliness rate (round-per-facility then average); null when no eligible specimens.
    roles: [ProgramAdmin]
    code: 200
    input: ["state_region?"]
    output: "{ program_rate: number, facility_count: integer, eligible_specimen_count: integer }"
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Server startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advances the logical clock used for reported_datetime, deadlines, and repeat windows"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Entity-backed role acting on a resource it does not own (facility/clinic mismatch)."
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "Referenced facility does not exist."
  - id: ERR_INFANT_NOT_FOUND
    http: 404
    condition: "Referenced infant does not exist."
  - id: ERR_SPECIMEN_NOT_FOUND
    http: 404
    condition: "Referenced specimen does not exist."
  - id: ERR_SCREEN_NOT_FOUND
    http: 404
    condition: "Referenced screen does not exist."
  - id: ERR_FOLLOWUP_CASE_NOT_FOUND
    http: 404
    condition: "Referenced follow-up case does not exist."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "Referenced referral does not exist."
  - id: ERR_SPECIALTY_CLINIC_NOT_FOUND
    http: 404
    condition: "Referenced specialty clinic does not exist."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Referenced confirmatory appointment does not exist."
  - id: ERR_ASSAY_RUN_NOT_FOUND
    http: 404
    condition: "Referenced assay run does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field or wrong type."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum body field holds a value outside its declared set."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not allowed from the resource's current state."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Resource is already in a terminal state."
  - id: ERR_SPECIMEN_NOT_SATISFACTORY
    http: 409
    condition: "Screen create attempted on a specimen not in SATISFACTORY."
  - id: ERR_REFERRAL_NOT_SCHEDULED
    http: 409
    condition: "Referral resolve COMPLETED/NO_SHOW attempted while referral not SCHEDULED."
  - id: ERR_CONSENT_REFUSED
    http: 409
    condition: "Screening operation attempted on an infant whose consent_status is REFUSED."
  - id: ERR_CLINIC_SPECIALTY_MISMATCH
    http: 422
    condition: "Referral referral_reason does not equal the clinic's specialty."
  - id: ERR_APPOINTMENT_NOT_COMPLETED
    http: 409
    condition: "Referral resolve COMPLETED without a COMPLETED appointment."
  - id: ERR_REFERRALS_UNRESOLVED
    http: 409
    condition: "Case resolve CONFIRMED without any COMPLETED referral."
  - id: ERR_DUPLICATE_REPEAT_PENDING
    http: 409
    condition: "request-repeat on a case already in REPEAT_REQUESTED."
  - id: ERR_DUPLICATE_OPEN_REFERRAL
    http: 409
    condition: "Referral create for a case that already has a referral in REQUESTED or SCHEDULED."
  - id: ERR_COLLECTION_BEFORE_BIRTH
    http: 422
    condition: "collection_datetime earlier than the infant's birth_datetime."
  - id: ERR_RECEIVED_BEFORE_COLLECTION
    http: 422
    condition: "received_datetime earlier than collection_datetime."
  - id: ERR_REPEAT_WINDOW_EXPIRED
    http: 409
    condition: "request-repeat after opened_at_clock + REPEAT_WINDOW_DAYS."
  - id: ERR_INTERVAL_END_BEFORE_START
    http: 422
    condition: "end_datetime not strictly after start_datetime."
  - id: ERR_CLINIC_CAPACITY_EXCEEDED
    http: 409
    condition: "New appointment would exceed the clinic's concurrent_capacity of overlapping SCHEDULED appointments."
  - id: ERR_INSTRUMENT_BUSY
    http: 409
    condition: "New assay run collides (within ASSAY_BUFFER_MINUTES) with a non-CANCELLED run on the same instrument."
  - id: ERR_STALE_INFANT_VERSION
    http: 412
    condition: "expected_infant_version does not match the infant's current version (OCC)."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: BirthFacilityUser
    description: "Birth-facility staff: register infants, collect specimens, report point-of-care (hearing/CCHD), record consent/refusal at their own facility."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /nbs/infants (facility_id must equal X-User-ID)"
      - "POST /nbs/infants/{id}/consent"
      - "POST /nbs/specimens"
      - "POST /nbs/screens/{id}/point-of-care"
    shared_operations:
      - "GET reads on infants/specimens/screens/recollection-orders"
  - name: LabTechnician
    description: "State-lab staff: receive specimens, open screens, report metabolic results, schedule/cancel assay runs."
    identity: opaque
    exclusive_operations:
      - "POST /nbs/specimens/{id}/receive"
      - "POST /nbs/screens"
      - "POST /nbs/screens/{id}/report-metabolic"
      - "POST /nbs/assay-runs"
      - "POST /nbs/assay-runs/{id}/cancel"
    shared_operations:
      - "GET reads on infants/specimens/screens/follow-up-cases/assay-runs"
  - name: FollowUpCoordinator
    description: "Program follow-up staff: manage cases, request repeats, resolve cases, create referrals and appointments."
    identity: opaque
    exclusive_operations:
      - "POST /nbs/follow-up-cases/{id}/request-repeat"
      - "POST /nbs/follow-up-cases/{id}/resolve"
      - "POST /nbs/referrals"
      - "POST /nbs/referrals/{id}/resolve"
      - "POST /nbs/confirmatory-appointments"
    shared_operations:
      - "GET reads on cases/referrals/appointments/infants/specimens/screens"
  - name: SpecialtyClinician
    description: "Specialty-clinic clinician: mark confirmatory appointments attended at their own clinic."
    identity: "entity_backed:SpecialtyClinic"
    exclusive_operations:
      - "POST /nbs/confirmatory-appointments/{id}/complete (appointment.specialty_clinic_id must equal X-User-ID)"
    shared_operations:
      - "GET reads on referrals/appointments"
  - name: ProgramAdmin
    description: "Program operator: register facilities and clinics, view the program timeliness summary, set the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /nbs/facilities"
      - "POST /nbs/specialty-clinics"
      - "GET /nbs/program/timeliness-summary"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /nbs/infants (shared with BirthFacilityUser)"
      - "GET reads across resources"
