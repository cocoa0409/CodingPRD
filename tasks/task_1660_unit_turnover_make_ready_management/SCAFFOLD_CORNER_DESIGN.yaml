              as: TurnCoordinator
              captures: { y: $.data.id }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /make-ready/scope-items/${y}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "POST /make-ready/scope-items/${y}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: RegionalManager
          assert:
            - "ScopeItem.${x}.approval_tier == PM (variance exactly 3000bp satisfies <= rm) and status == PENDING_APPROVAL"
            - "ScopeItem.${y}.approval_tier == RM (variance 3001bp > 3000bp)"
            - "PM approve of RM-tier item fails: error_id == ERR_APPROVAL_AUTHORITY_EXCEEDED (http 403); failed attempt does not bump turn.version"
            - "RM approve of ${y} succeeds with the same captured version: item PLANNED and Turn.${t}.approved_budget_cents == 130010"

