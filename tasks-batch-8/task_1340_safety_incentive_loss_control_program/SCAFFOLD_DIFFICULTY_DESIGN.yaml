            - "program.remaining_budget_cents == 3000 after the rejected second approve (no drift)"

      - name: training_create_constraint_beats_referential
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - calculations.certification_window
          - errors[ERR_CERTIFICATION_ACTIVE]
          - errors[ERR_EMPLOYEE_INACTIVE]
        distinguishing_aspect: |
          Error-category pair business_constraint vs business_referential: one create
          call that both violates the live-certification suppression window AND targets
          an INACTIVE employee must surface ERR_CERTIFICATION_ACTIVE (priority 12 beats 15).
        test_recipe:
          setup:
            - "Employee E (LOW role) COMPLETED course HAZCOM (validity 12 months, renewal window 30 days) on 2026-06-01 -> cert_valid_until 2027-06-01"
            - "E then deactivated; cert still live with ~351 days > 30-day renewal window"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "HAZCOM", hazard_class: "LOW", validity_months: 12, renewal_window_days: 30 }, as: EHSAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-06-20T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { ta_id: $.data.id } }
            - { call: "POST /safety/training-assignments/${ta_id}/complete", payload: {}, as: Supervisor, as_user_id: "${e_id}" }
            - { call: "POST /safety/employees/${e_id}/deactivate", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-07-01T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CERTIFICATION_ACTIVE (constraint priority 12 shadows ERR_EMPLOYEE_INACTIVE at priority 15)"
            - "no new TrainingAssignment is created for the pair"

      - name: triage_safety_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_HAZARD_NOT_OPEN]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: triage where the
          triager IS the reporter (SoD) and the link target hazard is already CLOSED —
          ERR_SEGREGATION_OF_DUTIES (priority 7) shadows ERR_HAZARD_NOT_OPEN (priority 16).
        test_recipe:
          setup:
            - "ACTIVE program; employees A and M; hazard created by A, assessed, single control implemented by A and verified by M -> hazard CLOSED"
            - "Observation reported by M (reporter_id == M) still SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
