    instances:
      - name: pump_trailing_buffer_overlap_asymmetric
        grounds:
          - calculations.pump_reservation_conflict
          - validations[priority=10]
          - errors[ERR_PUMP_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Pump interval semantics: half-open [delivery_at, retrieval_at) with an ASYMMETRIC trailing
          reprocessing buffer of 1440 min on the existing reservation's END only. A second compound whose
          delivery_at is before existing.retrieval_at + 1440min collides; a start exactly at the boundary
          (existing.retrieval 2026-06-17T09:00Z + 24h = 2026-06-18T09:00Z) is allowed — distinct geometry
          from the nurse rule.
        test_recipe:
          setup:
            - "one COMPOUNDED compound on pump PUMP-OV occupying [2026-06-10T09:00Z, 2026-06-17T09:00Z); a second compound on the same pump created with delivery_at 2026-06-18T08:59Z (one minute inside the trailing buffer)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
