  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_shop_operating
        grounds:
          - state_machines.ShopSupplyOrder.PLACED_to_CONFIRMED
          - state_machines.ScoopShop.OPERATING_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair ShopSupplyOrder -> ScoopShop: an order in PLACED cannot be
          confirmed while its parent shop is SUSPENDED; the confirm transition's
          validity depends on a different entity's current state.
        test_recipe:
          setup:
            - "ScoopShop FRANCHISEE OPERATING with ample credit, then suspended"
            - "Order PLACED for a LIMITED_RUN flavor while the shop was OPERATING"
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Suspension Shop", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 10000000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Orderable Oak", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 100 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 10 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { o_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/suspend"
              as: FranchiseAdmin
          trigger:
            - call: "POST /creamery/supply-orders/${o_id}/confirm"
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SHOP_NOT_OPERATING (HTTP 409)"
            - "ShopSupplyOrder.${o_id}.status remains PLACED"

      - name: slot_confirm_requires_flavor_schedulable
        grounds:
          - state_machines.ProductionSlot.PLANNED_to_CONFIRMED
          - entities.Flavor.fields.status
        distinguishing_aspect: |
          Entity pair ProductionSlot -> Flavor (different pair from
          order_confirm_requires_shop_operating): a slot may be created for a
          DEVELOPMENT flavor but cannot be confirmed until the flavor reaches
          TEST_BATCH, LIMITED_RUN or CORE_LINE.
        test_recipe:
          setup:
            - "Flavor in DEVELOPMENT (never promoted)"
            - "ProductionSlot PLANNED for that flavor at VT_WATERBURY on 2026-10-05 DAY"
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Lab Prototype", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${f_id}", production_date: "2026-10-05", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /creamery/production-slots/${slot_id}/confirm"
              as: PlantScheduler
              captures: { err: $.data.error_id }
          assert:
            - "slot creation succeeded (201) while flavor was DEVELOPMENT"
            - "err == ERR_FLAVOR_NOT_SCHEDULABLE (HTTP 409) on confirm"
            - "ProductionSlot.${slot_id}.status remains PLANNED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cert_window_halfopen_overlap
        grounds:
          - "validations[priority=11]"
          - entities.Certification.fields.issued_at
          - entities.Certification.fields.valid_until
        distinguishing_aspect: |
          Half-open interval semantics on Certification: for the same
          (supplier, scheme, ingredient_scope), a new window [2026-07-01, ...)
          exactly adjacent to an existing window's valid_until 2026-07-01 is
          ACCEPTED, while a window starting one day earlier (2026-06-30)
          OVERLAPS and is rejected — pairwise half-open intersection on the
          supplier's certification resource.
        test_recipe:
          setup:
            - "Supplier PROSPECT with one PENDING FAIR_TRADE/DAIRY cert [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Window Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-W1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2026-07-01T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-W2", ingredient_scope: "DAIRY", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { c2_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-W3", ingredient_scope: "DAIRY", issued_at: "2026-06-30T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "adjacent cert (issued_at == prior valid_until) is accepted: ${c2_id} created with status PENDING"
            - "err == ERR_CERT_WINDOW_OVERLAP (HTTP 409) for the one-day-earlier window"
            - "overlap pool considers PENDING and VERIFIED certs only; neither FT-W1 nor FT-W2 was terminal"

      - name: plant_date_aggregate_capacity
        grounds:
          - "validations[priority=21]"
          - calculations.supply_order_total
          - state_machines.ShopSupplyOrder.CONFIRMED_to_ALLOCATED
        distinguishing_aspect: |
          Discrete-bucket aggregate semantics on the plant-day resource
          (different interval semantics from the pairwise half-open cert
          windows): no single order overlaps another; the SUM of total_pints of
          ALLOCATED orders for (VT_ST_ALBANS, 2026-10-05) may not exceed 9000 —
          6000 + 4000 = 10000 exceeds it.
        test_recipe:
          setup:
            - "ScoopShop FRANCHISEE OPERATING, credit_limit_cents 10000000"
            - "Flavor LIMITED_RUN price 100; order A 6000 pints CONFIRMED then ALLOCATED to VT_ST_ALBANS 2026-10-05"
            - "Order B 4000 pints CONFIRMED for the same date"
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Bulk Buyer", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 10000000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Bulk Vanilla", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 100 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 6000 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /creamery/supply-orders/${oa_id}/confirm"
              as: FranchiseAdmin
            - call: "POST /creamery/supply-orders/${oa_id}/allocate"
              payload: { plant_code: "VT_ST_ALBANS" }
              as: PlantScheduler
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 4000 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /creamery/supply-orders/${ob_id}/confirm"
              as: FranchiseAdmin
          trigger:
            - call: "POST /creamery/supply-orders/${ob_id}/allocate"
              payload: { plant_code: "VT_ST_ALBANS" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_CAPACITY_EXCEEDED (HTTP 422): 6000 + 4000 = 10000 > 9000 pool capacity"
            - "ShopSupplyOrder.${ob_id}.status remains CONFIRMED"

  - rule_id: compensating_invariant
    instances:
      - name: commitment_supersede_single_active
        grounds:
          - state_machines.SourcingCommitment.ACTIVE_to_SUPERSEDED
          - "concurrency_rules[commitment-supersede-stale-supplier]"
        distinguishing_aspect: |
          Conserved quantity = cardinality: the forward action (create
          commitment) paired with its built-in compensating action (supersede
          the prior one) keeps count(ACTIVE commitments for (supplier,
          ingredient_category)) == 1 before and after — the pair never leaves
          zero or two ACTIVE commitments for a category.
        test_recipe:
          setup:
            - "Supplier APPROVED via PASS audit"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Supersede Supplier", country_code: "GH", ingredient_category: "COCOA" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v1: $.data.version }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "COCOA", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 8, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v1}" }
              as: SourcingManager
              captures: { c1_id: $.data.id }
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v2: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "COCOA", fair_trade_required: true, min_social_score: 70, premium_over_commodity_pct: 9, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", expected_supplier_version: "${s_v2}" }
              as: SourcingManager
              captures: { c2_id: $.data.id }
            - call: "GET /creamery/suppliers/${s_id}/commitments?status=ACTIVE"
              as: SourcingManager
              captures: { active_id: "$.data[0].id" }
            - call: "GET /creamery/suppliers/${s_id}/commitments?status=SUPERSEDED"
              as: SourcingManager
              captures: { superseded_id: "$.data[0].id" }
          assert:
            - "active_id == ${c2_id} and the ACTIVE-filtered list has exactly one element"
            - "superseded_id == ${c1_id} and the SUPERSEDED-filtered list has exactly one element"
            - "count(ACTIVE commitments for (supplier, COCOA)) == 1 both before and after the second create"
            - "s_v2 == s_v1 + 1 (the superseding create bumped Supplier.version exactly once)"

      - name: order_allocate_cancel_capacity_conservation
        grounds:
          - state_machines.ShopSupplyOrder.CONFIRMED_to_ALLOCATED
          - state_machines.ShopSupplyOrder.ALLOCATED_to_CANCELLED
          - "validations[priority=21]"
        distinguishing_aspect: |
          Conserved quantity = plant-day capacity units (different quantity type
          from the cardinality invariant of commitment_supersede_single_active):
          allocate(A) followed by cancel(A) returns the (VT_ST_ALBANS,
          2026-10-05) free capacity to its pre-allocate value, provable because
          a 4000-pint order B that was rejected while A held 6000 pints is
          accepted after A's cancellation.
        test_recipe:
          setup:
            - "ScoopShop FRANCHISEE OPERATING credit 10000000; flavor LIMITED_RUN price 100"
            - "Order A 6000 pints ALLOCATED to VT_ST_ALBANS 2026-10-05; order B 4000 pints CONFIRMED for same plant-date"
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Conserve Shop", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 10000000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Conserve Cocoa", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 100 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 6000 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /creamery/supply-orders/${oa_id}/confirm"
              as: FranchiseAdmin
            - call: "POST /creamery/supply-orders/${oa_id}/allocate"
              payload: { plant_code: "VT_ST_ALBANS" }
              as: PlantScheduler
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 4000 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /creamery/supply-orders/${ob_id}/confirm"
              as: FranchiseAdmin
            - call: "POST /creamery/supply-orders/${ob_id}/allocate"
              payload: { plant_code: "VT_ST_ALBANS" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /creamery/supply-orders/${oa_id}/cancel"
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /creamery/supply-orders/${ob_id}/allocate"
              payload: { plant_code: "VT_ST_ALBANS" }
              as: PlantScheduler
              captures: { ob_status: $.data.status }
            - call: "GET /creamery/scoop-shops/${shop_id}/supply-orders?status=ALLOCATED"
              as: FranchiseAdmin
              captures: { allocated_list: $.data }
          assert:
            - "while A held the pool: err == ERR_ORDER_CAPACITY_EXCEEDED (6000 + 4000 > 9000)"
            - "after cancel(A): ob_status == ALLOCATED — the allocate+cancel pair on A left free capacity unchanged"
            - "allocated_list contains exactly one order (${ob_id} with total_pints 4000); ${oa_id} is CANCELLED"
