      - name: official_statement_final_post_requires_deal_awarded
        grounds:
          - state_machines.OfficialStatement.PRELIMINARY_POSTED_to_FINAL_POSTED
          - state_machines.Deal.PRICED_to_AWARDED
          - errors[ERR_DEAL_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair is OfficialStatement depending on Deal: the OS is itself in the only state
          from which post-final is legal (PRELIMINARY_POSTED) and every one of its sections is
          APPROVED, so the sole reason for refusal is the OTHER entity's state (Deal PRICED, not
          yet AWARDED). Awarding the deal changes nothing on the OS row yet unblocks the same
          call.
