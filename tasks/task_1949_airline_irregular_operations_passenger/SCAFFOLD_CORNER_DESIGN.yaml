            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent }
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}", as: ReaccommodationAgent }
          assert:
            - "second generate-options advanced the case version, so the commit with the stale captured version fails 412 ERR_STALE_VERSION"
            - "case remains OFFERED; booking remains DISRUPTED; no seat movement occurred"

      - name: occ_delay_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[flight-retime-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A crew assignment bumps Flight.version (crew coverage recompute); a delay carrying the pre-assignment version fails 412."
        test_recipe:
          setup: ["flight F at version 1; crew assignment added (version advances to 2)"]
          setup_api_calls:
            - { call: "POST /irops/flights", payload: { flight_number: "OC82", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T08:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights/${f}/crew-assignments", payload: { crew_member_ref: "CM30", crew_role: "CAPTAIN", duty_start_utc: "2026-08-10T06:00:00Z", duty_end_utc: "2026-08-10T14:00:00Z" }, as: CrewScheduler }
          trigger:
            - { call: "POST /irops/flights/${f}/delay", payload: { new_sched_dep_utc: "2026-08-10T09:00:00Z", new_sched_arr_utc: "2026-08-10T11:00:00Z", expected_flight_version: "${fv}" }, as: OpsController, captures: { err: "$.data.error_id" } }
          assert:
            - "412 ERR_STALE_VERSION (version moved 1 -> 2 via the crew assignment side effect)"
            - "flight sched_dep_utc unchanged at 2026-08-10T08:00:00Z"

