            - "improvement ${imp} remains PROPOSED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: field_lease_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_FIELD_LEASE_OVERLAP]
          - endpoints: POST /leases
        distinguishing_aspect: |
          Resource: Field (via lease terms). Interval semantics: HALF-OPEN
          [term_start_date, term_end_date) — a new term starting exactly at the
          existing term's end (2028-03-01) is ADJACENT and allowed, while a
          term starting 2027-06-01 intersects and is rejected with
          ERR_FIELD_LEASE_OVERLAP.
        test_recipe:
          setup:
            - "Lease1 ACTIVE on field F with term [2027-03-01, 2028-03-01)"
            - "Second offering on F awarded to bid2 (accepted_at = default clock 2026-05-01, valid 30 days)"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Ovl", contact_email: "lo@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T OvlA", years_experience: 6 }
              as: FarmManager
              captures:
                tn1: "$.data.id"
            - call: "POST /tenants/${tn1}/approve"
              as: FarmManager
            - call: "POST /tenants"
              payload: { name: "T OvlB", years_experience: 9 }
              as: FarmManager
              captures:
                tn2: "$.data.id"
            - call: "POST /tenants/${tn2}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F15", acres: 100, soil_csr2: 82 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off1: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off1}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn1}"
              captures:
                bid1: "$.data.id"
            - call: "POST /bids/${bid1}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off1}/close"
              as: FarmManager
            - call: "POST /offerings/${off1}/award"
              payload: { bid_id: "${bid1}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid1}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse1: "$.data.id"
            - call: "POST /leases/${lse1}/activate"
              as: FarmManager
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2028-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off2: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off2}", lease_type: "CASH", cash_bid_per_acre_cents: 26000, cash_equivalent_bid_cents_per_acre: 26000 }
              as: Tenant
              as_user_id: "${tn2}"
              captures:
                bid2: "$.data.id"
            - call: "POST /bids/${bid2}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off2}/close"
              as: FarmManager
            - call: "POST /offerings/${off2}/award"
              payload: { bid_id: "${bid2}" }
              as: Landlord
              as_user_id: "${ld}"
          trigger:
            - call: "POST /leases"
              payload: { bid_id: "${bid2}", term_start_date: "2027-06-01T00:00:00Z", term_end_date: "2028-06-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                err: "$.data.error_id"
            - call: "POST /leases"
              payload: { bid_id: "${bid2}", term_start_date: "2028-03-01T00:00:00Z", term_end_date: "2029-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse2: "$.data.id"
                lse2_st: "$.data.status"
          assert:
            - "overlapping create fails with error_id == ERR_FIELD_LEASE_OVERLAP ([2027-06-01, 2028-06-01) intersects [2027-03-01, 2028-03-01))"
            - "adjacent create succeeds: lease ${lse2} created with status DRAFT (start 2028-03-01 == existing end 2028-03-01 is disjoint under half-open semantics)"

      - name: landlord_report_closed_interval_touching_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - endpoints: POST /reports
        distinguishing_aspect: |
          Resource: Landlord (via report windows) — a different resource entity
          than Field. Interval semantics: CLOSED [period_start, period_end]
          inclusive — a new report starting on the exact day the previous one
          ends (2026-03-31) counts as overlap (ERR_REPORT_PERIOD_OVERLAP),
          whereas [2026-04-01, ...] is accepted. Adjacency treatment is the
          OPPOSITE of the half-open lease rule.
        test_recipe:
          setup:
            - "Landlord with an existing QUARTERLY report for closed window [2026-01-01, 2026-03-31]"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Rpt", contact_email: "lrr@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /reports"
              payload: { landlord_id: "${ld}", report_type: "QUARTERLY", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: FarmManager
              captures:
                r1: "$.data.id"
          trigger:
            - call: "POST /reports"
              payload: { landlord_id: "${ld}", report_type: "QUARTERLY", period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: FarmManager
              captures:
                err: "$.data.error_id"
            - call: "POST /reports"
              payload: { landlord_id: "${ld}", report_type: "QUARTERLY", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: FarmManager
              captures:
                r2: "$.data.id"
                r2_st: "$.data.status"
          assert:
            - "touching window [2026-03-31, 2026-06-30] fails with error_id == ERR_REPORT_PERIOD_OVERLAP (closed interval: shared endpoint 2026-03-31 counts)"
            - "disjoint window [2026-04-01, 2026-06-30] succeeds: report ${r2} created with status DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_then_reversal_conserves_landlord_balance
        grounds:
          - state_machines.PaymentInstallment.OPEN_to_PAID
          - state_machines.PaymentInstallment.PAID_to_OPEN
          - calculations.landlord_ledger_totals
        distinguishing_aspect: |
          Conserved quantity: MONEY. Invariant: landlord.total_received_cents
          == SUM(paid_cents) over all installments of the landlord's leases.
          Forward action record_payment(1250000) followed by its compensating
          reverse_payment returns total_received_cents to exactly 0 and
          paid_cents to 0 — no drift.
        test_recipe:
          setup:
            - "CASH lease ACTIVE; clock 2027-03-01; I1 1250000 OPEN"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Inv", contact_email: "liv@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Inv", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F16", acres: 100, soil_csr2: 81 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: FarmManager
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                i1: "$.data[0].id"
            - call: "GET /landlords/${ld}"
              as: FarmManager
              captures:
                recv0: "$.data.total_received_cents"
          trigger:
            - call: "POST /installments/${i1}/record_payment"
              payload: { amount_cents: 1250000 }
              as: FarmManager
              as_user_id: "mgr-1"
            - call: "GET /landlords/${ld}"
              as: FarmManager
              captures:
                recv1: "$.data.total_received_cents"
            - call: "POST /installments/${i1}/reverse_payment"
              as: FarmManager
              as_user_id: "mgr-2"
              captures:
                i1_paid: "$.data.paid_cents"
            - call: "GET /landlords/${ld}"
              as: FarmManager
              captures:
                recv2: "$.data.total_received_cents"
          assert:
            - "baseline ${recv0} == 0"
            - "after payment: landlord.total_received_cents == 1250000 (invariant: equals SUM(paid_cents))"
            - "after compensating reversal: landlord.total_received_cents == 0 == baseline (money conserved, zero drift)"
            - "installment ${i1}.paid_cents == 0 after reversal"

      - name: submit_then_withdraw_conserves_eligible_bid_count
        grounds:
          - entities.LeaseOffering.fields.eligible_bid_count
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: COUNT (not money). Invariant:
          offering.eligible_bid_count == count of the offering's bids in
          {SUBMITTED, SHORTLISTED}. Submit (+1) followed by withdraw (-1)
          returns the count to its exact pre-submit baseline.
        test_recipe:
          setup:
            - "Offering OPEN with one SUBMITTED bid from tenant A (count 1); tenant B registered and APPROVED"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Cnt", contact_email: "lcn@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T CntA", years_experience: 5 }
              as: FarmManager
              captures:
                tnA: "$.data.id"
            - call: "POST /tenants/${tnA}/approve"
              as: FarmManager
            - call: "POST /tenants"
              payload: { name: "T CntB", years_experience: 7 }
              as: FarmManager
              captures:
                tnB: "$.data.id"
            - call: "POST /tenants/${tnB}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F17", acres: 100, soil_csr2: 83 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tnA}"
              captures:
                bidA: "$.data.id"
            - call: "GET /offerings/${off}"
              as: FarmManager
              captures:
                cnt0: "$.data.eligible_bid_count"
          trigger:
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 26000, cash_equivalent_bid_cents_per_acre: 26000 }
              as: Tenant
              as_user_id: "${tnB}"
              captures:
                bidB: "$.data.id"
            - call: "GET /offerings/${off}"
              as: FarmManager
              captures:
                cnt1: "$.data.eligible_bid_count"
            - call: "POST /bids/${bidB}/withdraw"
              as: Tenant
              as_user_id: "${tnB}"
            - call: "GET /offerings/${off}"
              as: FarmManager
              captures:
                cnt2: "$.data.eligible_bid_count"
          assert:
            - "baseline eligible_bid_count == 1 (tenant A's bid)"
            - "after submit: eligible_bid_count == 2"
            - "after compensating withdraw: eligible_bid_count == 1 == baseline (count conserved)"
            - "bid ${bidB}.status == WITHDRAWN"
