scenario: |
  Real Estate Investment Underwriting & Pro Forma (real estate private equity firm):
  rent roll & operating history normalization, market rent/expense benchmarking &
  growth assumptions, capital expenditure & lease-up cost modeling, debt sizing
  (DSCR/LTV) & sensitivity analysis, exit cap & hold period return metrics
  (IRR/equity multiple), waterfall/promote structure modeling, scenario/stress
  testing, investment committee memo & approval.

domain_name: real-estate-underwriting
api_prefix: /re-underwriting

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - version_pinning_on_approval
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate
  difficulty_target: advanced

# -----------------------------------------------------------------------------
# §1.0 Response envelope (FIXED — emit verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entities
# -----------------------------------------------------------------------------
entities:
  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: deal_code, type: string, source: input, description: "Human-readable deal identifier, unique per firm", constraints: "unique; 4-32 chars" }
      - { name: deal_name, type: string, source: input, description: "Short display name for the opportunity" }
      - { name: strategy, type: enum, source: input, description: "Investment strategy", constraints: "CORE | CORE_PLUS | VALUE_ADD | OPPORTUNISTIC" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the deal", default: DRAFT, constraints: "DRAFT | UNDERWRITING | IC_REVIEW | APPROVED | REJECTED | DEAD" }
      - { name: target_purchase_price_cents, type: integer, source: input, description: "Proposed purchase price in cents" }
      - { name: analyst_id, type: string, source: input, description: "X-User-ID of the owning Analyst" }
      - { name: asset_manager_id, type: string, source: system, description: "X-User-ID of the AssetManager assigned once deal enters UNDERWRITING; null before then" }
      - { name: current_scenario_id, type: string, source: system, description: "FK -> Scenario.id; pinned base-case scenario when IC_REVIEW begins; null until then" }
      - { name: approved_at, type: datetime, source: system, description: "Timestamp when IC quorum reached APPROVED; null otherwise" }
      - { name: rejected_reason, type: string, source: system, description: "Reason text recorded on REJECTED transition; null otherwise" }

  - name: Property
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; owning deal" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: market, type: string, source: input, description: "MSA / market name (e.g., 'Austin, TX')" }
      - { name: property_type, type: enum, source: input, description: "Asset class", constraints: "MULTIFAMILY | OFFICE | RETAIL | INDUSTRIAL | MIXED_USE" }
      - { name: units, type: integer, source: input, description: "Rentable units (multifamily) or suites (commercial)", constraints: ">= 1" }
      - { name: rentable_sqft, type: integer, source: input, description: "Total rentable square feet", constraints: ">= 100" }
      - { name: year_built, type: integer, source: input, description: "Year property was built", constraints: "1800-2100" }
      - { name: occupancy_pct, type: number, source: computed, description: "Computed from latest RentRollPeriod: occupied_units / units; null until first rent roll" }

  - name: RentRollPeriod
    parent: Property
    common_fields: false
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; owning property" }
      - { name: period_month, type: string, source: input, description: "Calendar month of the rent roll, format YYYY-MM" }
      - { name: occupied_units, type: integer, source: input, description: "Units occupied at month end", constraints: ">= 0" }
      - { name: total_units, type: integer, source: input, description: "Total units at month end", constraints: ">= 1" }
      - { name: gross_potential_rent_cents, type: integer, source: input, description: "100%-occupied rent for the month", constraints: ">= 0" }
      - { name: collected_rent_cents, type: integer, source: input, description: "Actual rent collected in the month", constraints: ">= 0" }
      - { name: concessions_cents, type: integer, source: input, description: "Concessions granted in the month (>=0)", default: 0 }
      - { name: source_doc_ref, type: string, source: input, description: "External reference to source rent roll PDF/CSV" }

  - name: OperatingExpense
    parent: Property
    common_fields: false
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; owning property" }
      - { name: period_year, type: integer, source: input, description: "Calendar year of the expense" }
      - { name: category, type: enum, source: input, description: "Expense bucket", constraints: "TAXES | INSURANCE | UTILITIES | REPAIRS | MANAGEMENT | PAYROLL | MARKETING | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount in cents", constraints: ">= 0" }
      - { name: is_recoverable, type: boolean, source: input, description: "Whether the expense is recoverable from tenants", default: false }

  - name: MarketAssumption
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; owning deal" }
      - { name: label, type: string, source: input, description: "Assumption set label (e.g., 'Base 2026 H2')" }
      - { name: market_rent_growth_yr1_bps, type: integer, source: input, description: "Year-1 market rent growth, basis points (e.g. 250 = 2.50%)" }
      - { name: market_rent_growth_steady_bps, type: integer, source: input, description: "Steady-state rent growth applied years 2+; bps" }
      - { name: expense_growth_bps, type: integer, source: input, description: "Annual expense growth, basis points" }
      - { name: exit_cap_rate_bps, type: integer, source: input, description: "Terminal cap rate, basis points", constraints: "> 0" }
      - { name: hold_period_years, type: integer, source: input, description: "Planned hold period, years", constraints: "1-15" }
      - { name: capex_per_unit_cents, type: integer, source: input, description: "Renovation capex budget per unit", constraints: ">= 0" }
      - { name: lease_up_months, type: integer, source: input, description: "Months to stabilize post-renovation", constraints: "0-36" }
      - { name: is_active, type: boolean, source: system, description: "Whether this assumption set is the deal's currently-active one (exactly one per deal)", default: false }

  - name: Scenario
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; owning deal" }
      - { name: scenario_kind, type: enum, source: input, description: "Scenario family", constraints: "BASE | DOWNSIDE | UPSIDE | STRESS" }
      - { name: assumption_id, type: string, source: input, description: "FK -> MarketAssumption.id; assumption set driving this scenario" }
      - { name: occupancy_stress_pct, type: integer, source: input, description: "Steady-state occupancy assumption in whole percent, e.g. 92", constraints: "0-100" }
      - { name: status, type: enum, source: system, description: "Computation lifecycle", default: DRAFT, constraints: "DRAFT | COMPUTED | SUPERSEDED" }
      - { name: computed_noi_yr1_cents, type: integer, source: computed, description: "Year-1 NOI output, cents" }
      - { name: computed_irr_bps, type: integer, source: computed, description: "Unlevered IRR over hold, basis points" }
      - { name: computed_equity_multiple_bp, type: integer, source: computed, description: "Equity multiple in basis points (e.g. 16500 = 1.65x)" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> Scenario.id; newer scenario that replaced this one; null while active" }

  - name: DebtSizing
    parent: Scenario
    common_fields: true
    fields:
      - { name: scenario_id, type: string, source: input, description: "FK -> Scenario.id; scenario being sized" }
      - { name: loan_amount_cents, type: integer, source: computed, description: "Sized loan amount (min of DSCR- and LTV-constrained maximums)" }
      - { name: interest_rate_bps, type: integer, source: input, description: "Fixed annual note rate, basis points" }
      - { name: amortization_years, type: integer, source: input, description: "Amortization term, years", constraints: "1-30" }
      - { name: io_months, type: integer, source: input, description: "Interest-only period, months", constraints: "0-120" }
      - { name: min_dscr_pct, type: integer, source: input, description: "Minimum acceptable DSCR in whole percent (e.g. 125 = 1.25x)" }
      - { name: max_ltv_pct, type: integer, source: input, description: "Maximum loan-to-value in whole percent (e.g. 65 = 65%)" }
      - { name: dscr_at_size_pct, type: integer, source: computed, description: "DSCR at the sized loan amount, percent" }
      - { name: ltv_at_size_pct, type: integer, source: computed, description: "LTV at the sized loan amount, percent" }
      - { name: sizing_constraint, type: enum, source: computed, description: "Which constraint bound the size", constraints: "DSCR | LTV | BOTH" }

  - name: Waterfall
    parent: Scenario
    common_fields: true
    fields:
      - { name: scenario_id, type: string, source: input, description: "FK -> Scenario.id; scenario this waterfall models" }
      - { name: pref_return_bps, type: integer, source: input, description: "LP preferred return, basis points annualized" }
      - { name: promote_tier1_bps, type: integer, source: input, description: "GP promote over pref to tier-1 hurdle, bps of excess profits (e.g. 2000 = 20%)" }
      - { name: tier1_hurdle_bps, type: integer, source: input, description: "Tier-1 hurdle IRR (bps) above which tier-2 promote applies" }
      - { name: promote_tier2_bps, type: integer, source: input, description: "GP promote over tier-1 hurdle, bps of excess profits" }
      - { name: lp_split_cents, type: integer, source: computed, description: "LP total distribution at exit under this waterfall, cents" }
      - { name: gp_split_cents, type: integer, source: computed, description: "GP total distribution at exit under this waterfall, cents" }
      - { name: gp_promote_cents, type: integer, source: computed, description: "GP promote (carried interest) portion of gp_split_cents" }

  - name: ICMemo
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal being decided" }
      - { name: scenario_id, type: string, source: input, description: "FK -> Scenario.id; pinned base-case scenario for the memo" }
      - { name: recommendation, type: enum, source: input, description: "Analyst recommendation", constraints: "PURSUE | PASS | RENEGOTIATE" }
      - { name: thesis, type: string, source: input, description: "Free-text investment thesis" }
      - { name: risks, type: string, source: input, description: "Free-text risk summary" }
      - { name: status, type: enum, source: system, description: "Memo workflow", default: DRAFT, constraints: "DRAFT | SUBMITTED | UNDER_VOTE | APPROVED | REJECTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of SUBMITTED transition" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of APPROVED/REJECTED terminal transition" }

  - name: ICVote
    parent: ICMemo
    common_fields: false
    fields:
      - { name: memo_id, type: string, source: input, description: "FK -> ICMemo.id; memo being voted on" }
      - { name: voter_user_id, type: string, source: system, description: "X-User-ID of the casting IC_Member (or IC_Chair); recorded for audit" }
      - { name: vote, type: enum, source: input, description: "Cast vote", constraints: "YES | NO | ABSTAIN" }
      - { name: comment, type: string, source: input, description: "Optional rationale" }
      - { name: cast_at, type: datetime, source: system, description: "Server-stamped vote time" }

# -----------------------------------------------------------------------------
# §1.2 State Machines
# -----------------------------------------------------------------------------
state_machines:
  - entity: Deal
    initial_state: DRAFT
    terminal_states: [APPROVED, DEAD]
    transitions:
      - from: DRAFT
        to: UNDERWRITING
        trigger: "POST /re-underwriting/deals/{id}/submit-underwriting"
        actor: Analyst
        preconditions:
          - "deal.status == DRAFT"
          - "caller X-User-ID == deal.analyst_id"
          - "EXISTS Property p WHERE p.deal_id == deal.id"
          - "EXISTS MarketAssumption m WHERE m.deal_id == deal.id AND m.is_active == true"
        side_effects:
          - "deal.asset_manager_id := header X-AssetManager-ID (assigned at this step)"
          - "increments Deal.version by 1"
      - from: UNDERWRITING
        to: DRAFT
        trigger: "POST /re-underwriting/deals/{id}/reopen"
        actor: Analyst
        preconditions:
          - "deal.status == UNDERWRITING"
          - "caller X-User-ID == deal.analyst_id"
          - "no ICMemo exists for this deal in status SUBMITTED or UNDER_VOTE"
        side_effects:
          - "every Scenario s WHERE s.deal_id == deal.id AND s.status == COMPUTED transitions to SUPERSEDED with superseded_by_id null (mark for re-compute)"
          - "increments Deal.version by 1"
      - from: UNDERWRITING
        to: IC_REVIEW
        trigger: "POST /re-underwriting/deals/{id}/submit-ic"
        actor: AssetManager
        preconditions:
          - "deal.status == UNDERWRITING"
          - "caller X-User-ID == deal.asset_manager_id"
          - "EXISTS ICMemo m WHERE m.deal_id == deal.id AND m.status == SUBMITTED"
          - "EXISTS Scenario s WHERE s.id == m.scenario_id AND s.status == COMPUTED"
        side_effects:
          - "deal.current_scenario_id := m.scenario_id (pins the scenario version)"
          - "every OTHER Scenario s' WHERE s'.deal_id == deal.id AND s'.id != m.scenario_id AND s'.status == COMPUTED transitions to SUPERSEDED with superseded_by_id := m.scenario_id"
          - "ICMemo m transitions SUBMITTED -> UNDER_VOTE"
          - "increments Deal.version by 1"
      - from: IC_REVIEW
        to: APPROVED
        trigger: "POST /re-underwriting/ic-memos/{id}/vote (auto when quorum of YES votes reached)"
        actor: system
        preconditions:
          - "deal.status == IC_REVIEW"
          - "memo.status == UNDER_VOTE"
          - "COUNT(ICVote v WHERE v.memo_id == memo.id AND v.vote == YES) >= IC_QUORUM_YES (constant 2)"
          - "COUNT(ICVote v WHERE v.memo_id == memo.id AND v.vote == NO) == 0"
        side_effects:
          - "ICMemo transitions UNDER_VOTE -> APPROVED"
          - "deal.approved_at := current UTC timestamp"
          - "increments Deal.version by 1"
      - from: IC_REVIEW
        to: REJECTED
        trigger: "POST /re-underwriting/ic-memos/{id}/vote (auto on first NO vote) OR POST /re-underwriting/ic-memos/{id}/reject"
        actor: system | IC_Chair
        preconditions:
          - "deal.status == IC_REVIEW"
          - "memo.status == UNDER_VOTE"
          - "either a NO vote was just cast, or caller is IC_Chair invoking reject"
        side_effects:
          - "ICMemo transitions UNDER_VOTE -> REJECTED"
          - "deal.rejected_reason := vote.comment or reject payload reason"
          - "deal transitions to REJECTED"
          - "increments Deal.version by 1"
      - from: REJECTED
        to: UNDERWRITING
        trigger: "POST /re-underwriting/deals/{id}/reopen"
        actor: Analyst
        preconditions:
          - "deal.status == REJECTED"
          - "caller X-User-ID == deal.analyst_id"
        side_effects:
          - "ICMemo for this deal remains in terminal REJECTED status (audit trail)"
          - "deal.current_scenario_id := null (unpin; new scenario must be built)"
          - "every Scenario s WHERE s.deal_id == deal.id AND s.status == COMPUTED transitions to SUPERSEDED with superseded_by_id null"
          - "increments Deal.version by 1"
      - from: REJECTED
        to: DEAD
        trigger: "POST /re-underwriting/deals/{id}/mark-dead"
        actor: AssetManager
        preconditions:
          - "deal.status == REJECTED"
          - "caller X-User-ID == deal.asset_manager_id"
        side_effects:
          - "increments Deal.version by 1"

  - entity: Scenario
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /re-underwriting/scenarios/{id}/compute"
        actor: Analyst
        preconditions:
          - "scenario.status == DRAFT"
          - "deal = scenario.deal; deal.status IN {UNDERWRITING}"
          - "caller X-User-ID == deal.analyst_id"
        side_effects:
          - "runs calculation noi_year1, irr_unlevered, equity_multiple over scenario"
          - "writes computed_noi_yr1_cents, computed_irr_bps, computed_equity_multiple_bp on scenario"
          - "increments Scenario.version by 1"
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system cascade from Deal reopen / Deal submit-ic / Scenario compute of a newer BASE scenario"
        actor: system
        preconditions:
          - "scenario.status == COMPUTED"
        side_effects:
          - "scenario.superseded_by_id set per cascade"
          - "increments Scenario.version by 1"

  - entity: ICMemo
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /re-underwriting/ic-memos/{id}/submit"
        actor: Analyst
        preconditions:
          - "memo.status == DRAFT"
          - "deal = memo.deal; deal.status == UNDERWRITING"
          - "caller X-User-ID == deal.analyst_id"
          - "scenario referenced by memo.scenario_id has status == COMPUTED"
        side_effects:
          - "memo.submitted_at := current UTC timestamp"
          - "increments ICMemo.version by 1"
      - from: SUBMITTED
        to: UNDER_VOTE
        trigger: "system cascade from Deal submit-ic"
        actor: system
        preconditions:
          - "memo.status == SUBMITTED"
        side_effects:
          - "increments ICMemo.version by 1"
      - from: UNDER_VOTE
        to: APPROVED
        trigger: "system cascade on quorum of YES votes (see Deal.IC_REVIEW -> APPROVED)"
        actor: system
        preconditions:
          - "COUNT(ICVote v WHERE v.memo_id == memo.id AND v.vote == YES) >= 2"
          - "COUNT(ICVote v WHERE v.memo_id == memo.id AND v.vote == NO) == 0"
        side_effects:
          - "memo.decided_at := current UTC timestamp"
          - "Deal cascades to APPROVED"
          - "increments ICMemo.version by 1"
      - from: UNDER_VOTE
        to: REJECTED
        trigger: "system cascade on first NO vote or IC_Chair reject"
        actor: system | IC_Chair
        preconditions:
          - "memo.status == UNDER_VOTE"
        side_effects:
          - "memo.decided_at := current UTC timestamp"
          - "Deal cascades to REJECTED"
          - "increments ICMemo.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency rules (true races resolved via OCC on parent's version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: scenario-create-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /re-underwriting/deals/{id}/scenarios"
    occ_field: expected_deal_version
    description: |
      Creating a Scenario against a Deal whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer just advanced the deal (submitted to IC, reopened, or marked dead)
      and the current writer's view of deal status is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ic-memo-submit-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /re-underwriting/deals/{id}/ic-memos"
    occ_field: expected_deal_version
    description: |
      Creating an ICMemo against a Deal whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has advanced the deal lifecycle (submit-underwriting, submit-ic,
      reopen) and the current writer is operating on stale deal state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation rules
# -----------------------------------------------------------------------------
calculations:
  - name: noi_year1
    description: "Year-1 Net Operating Income for a Scenario, derived from rent roll, expenses, market assumptions, and occupancy stress"
    trigger: "POST /re-underwriting/scenarios/{id}/compute"
    algorithm: forward_looking
    formula: |
      Let prop = scenario.deal.property (exactly one per deal, enforced by validation).
      Let rr = most recent RentRollPeriod on prop by period_month (chronological, latest wins).
      Let ops = OperatingExpense rows on prop for the LATEST period_year (group by period_year,
                pick max year, sum amounts within).
      Let m = scenario.assumption.
      Let occ_factor = scenario.occupancy_stress_pct / 100.

      # Annualize monthly rent-roll figures
      gpr_annual = rr.gross_potential_rent_cents * 12
      concessions_annual = rr.concessions_cents * 12

      # Effective Gross Income (EGI) — provisional vs final variants differ on
      # whether concessions are netted BEFORE or AFTER growth is applied.
      base_egi_provisional =
          gpr_annual * occ_factor * (1 + m.market_rent_growth_yr1_bps / 10000)
          - concessions_annual
      base_egi_final =
          (gpr_annual - concessions_annual) * occ_factor
          * (1 + m.market_rent_growth_yr1_bps / 10000)

      # Operating expenses for year 1 (grown from latest period_year).
      # Capex is straight-line amortized across the hold period.
      # Lease-up cost is charged fully to year 1: lease_up_months * monthly GPR * vacancy factor.
      opex_yr1 = sum(ops.amount_cents) * (1 + m.expense_growth_bps / 10000)
                 + m.capex_per_unit_cents * prop.units * (1 / max(1, m.hold_period_years))
                 + (m.lease_up_months * rr.gross_potential_rent_cents) * (1 - occ_factor)

      noi_yr1_cents = round_half_up(base_egi - opex_yr1)
    input_set: "RentRollPeriod rows for the property (latest period_month), OperatingExpense rows for the property (latest period_year), the Scenario, its MarketAssumption, and its Property"
    constants:
      BPS_DENOM: 10000
      MONTHS_PER_YEAR: 12
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "scenario.status == DRAFT when compute is invoked"
        difference: "uses base_egi_provisional (concessions subtracted AFTER growth)"
      - name: final
        when: "scenario referenced by an ICMemo submitted for approval (i.e., Deal in IC_REVIEW pinned to this scenario)"
        difference: "uses base_egi_final (concessions subtracted BEFORE growth); recompute replaces the provisional value when the scenario is pinned"

  - name: debt_size
    description: "Max loan amount bounded by DSCR and LTV constraints; picks the binding constraint"
    trigger: "POST /re-underwriting/scenarios/{id}/debt-sizing"
    algorithm: tiered_pricing
    formula: |
      Let noi = scenario.computed_noi_yr1_cents  (must be > 0; else ERR_NOI_NONPOSITIVE).
      Let rate = input.interest_rate_bps / 10000 (annual).
      Let n = input.amortization_years * 12 (payments).
      Let io = input.io_months.
      Let min_dscr = input.min_dscr_pct / 100.
      Let max_ltv = input.max_ltv_pct / 100.
      Let price = scenario.deal.target_purchase_price_cents.

      # Monthly payment factor for amortizing loan (standard annuity)
      monthly_rate = rate / 12
      if monthly_rate == 0:
          annual_debt_service_per_dollar = 1 / input.amortization_years
      else:
          pmt_per_dollar = monthly_rate / (1 - (1 + monthly_rate) ** (-n))
          annual_debt_service_per_dollar = pmt_per_dollar * 12

      # DSCR-constrained size: max loan such that NOI / debt_service >= min_dscr
      dscr_max_loan = noi / (min_dscr * annual_debt_service_per_dollar)

      # LTV-constrained size
      ltv_max_loan = price * max_ltv

      loan = floor(min(dscr_max_loan, ltv_max_loan))
      binding = if abs(dscr_max_loan - ltv_max_loan) < 1 then BOTH
                elif dscr_max_loan < ltv_max_loan then DSCR
                else LTV

      dscr_at_size = noi / (loan * annual_debt_service_per_dollar)   # in decimal, converted to pct
      ltv_at_size = loan / price * 100
    input_set: "Scenario (must be COMPUTED), input parameters (interest_rate_bps, amortization_years, io_months, min_dscr_pct, max_ltv_pct), deal.target_purchase_price_cents"
    constants:
      BPS_DENOM: 10000
      MONTHS_PER_YEAR: 12
    precision: "0 decimal places (integer cents), round_half_down (floor) for loan amount; percent fields rounded to nearest whole percent"

  - name: irr_unlevered
    description: "Unlevered IRR over the hold period using entry price, annual NOI growth, and exit at exit_cap"
    trigger: "POST /re-underwriting/scenarios/{id}/compute"
    algorithm: projection
    formula: |
      Let noi1 = scenario.computed_noi_yr1_cents.
      Let m = scenario.assumption.
      Let hold = m.hold_period_years.
      Let exit_cap = m.exit_cap_rate_bps / 10000.
      Let price = scenario.deal.target_purchase_price_cents.

      # Project NOI per year (year 1 = noi1, then grows at steady state)
      noi[t] = noi1 * (1 + m.market_rent_growth_steady_bps / 10000) ** (t - 1)   for t = 2..hold

      # Exit value at end of hold = noi[hold+1] / exit_cap
      noi_terminal = noi1 * (1 + m.market_rent_growth_steady_bps / 10000) ** hold
      exit_value = round_half_up(noi_terminal / exit_cap)

      # Cash flows: t=0: -price; t=1..hold-1: noi[t]; t=hold: noi[hold] + exit_value
      # IRR is the rate r such that NPV = 0. Solve via bisection on r in [-0.99, 1.00]
      # with 1e-6 precision, then convert to basis points and round_half_up to integer.
      irr_decimal = bisect(r -> -price + sum(noi[t]/(1+r)**t) + exit_value/(1+r)**hold, -0.99, 1.00, tol=1e-6)
      irr_bps = round_half_up(irr_decimal * 10000)
    input_set: "Scenario (must have computed_noi_yr1_cents), MarketAssumption, Deal.target_purchase_price_cents"
    constants:
      BPS_DENOM: 10000
      IRR_SOLVER_TOL: 1e-6
    precision: "IRR as integer basis points, round_half_up"

  - name: equity_multiple
    description: "Unlevered equity multiple = total distributions / invested capital"
    trigger: "POST /re-underwriting/scenarios/{id}/compute"
    algorithm: projection
    formula: |
      # Same projected cash flows as irr_unlevered
      total_distributions = sum(noi[t] for t = 1..hold) + exit_value
      invested = deal.target_purchase_price_cents
      equity_multiple_bp = round_half_up(total_distributions / invested * 10000)
    input_set: "same as irr_unlevered"
    constants:
      BPS_DENOM: 10000
    precision: "Equity multiple as integer basis points (10000 = 1.0x), round_half_up"

  - name: waterfall_split
    description: "LP/GP distribution split at exit under a two-tier promote structure"
    trigger: "POST /re-underwriting/scenarios/{id}/waterfall"
    algorithm: waterfall_allocation
    formula: |
      Let cf = projected cash flows for the scenario (same projection as irr_unlevered).
      Let lp_equity = deal.target_purchase_price_cents * lp_equity_share (constant 0.90).
      Let gp_equity = deal.target_purchase_price_cents - lp_equity.

      # Tier 0: return of capital (pro-rata, LP first by convention here — LP gets
      # capital back first).
      # Tier 1: LP preferred return at pref_return_bps on lp_equity, simple annual.
      # Tier 2: excess profits above pref split tier-1: GP gets promote_tier1_bps of excess up to tier1_hurdle IRR.
      # Tier 3: excess above tier1_hurdle: GP gets promote_tier2_bps.

      # Implementation: compute total profit = total_distributions - invested
      # pref_owed = lp_equity * (pref_return_bps/10000) * hold_years  (simple, not compounded)
      # profit_after_capital_return = total_distributions - (lp_equity + gp_equity)
      # lp_pref = min(pref_owed, max(0, profit_after_capital_return))
      # remaining = profit_after_capital_return - lp_pref
      # hurdle_amount = lp_equity * ((1 + tier1_hurdle_bps/10000) ** hold_years - 1) - lp_pref
      # tier1_excess = min(max(0, remaining), max(0, hurdle_amount))
      # gp_tier1 = tier1_excess * promote_tier1_bps / 10000
      # lp_tier1 = tier1_excess - gp_tier1
      # tier2_excess = remaining - tier1_excess
      # gp_tier2 = tier2_excess * promote_tier2_bps / 10000
      # lp_tier2 = tier2_excess - gp_tier2

      # lp_split = lp_equity + lp_pref + lp_tier1 + lp_tier2
      # gp_split = gp_equity + gp_tier1 + gp_tier2
      # gp_promote = gp_tier1 + gp_tier2
    input_set: "Scenario COMPUTED projections, input promote parameters"
    constants:
      LP_EQUITY_SHARE_BPS: 9000
      BPS_DENOM: 10000
    precision: "0 decimal places (integer cents), round_half_up per tier; tiers computed in order, each tier's rounding is locked before the next tier"

  - name: occupancy_pct
    description: "Property occupancy percentage, recomputed on each new RentRollPeriod"
    trigger: "POST /re-underwriting/properties/{id}/rent-roll (cascade) and on rent-roll update"
    algorithm: aggregation
    formula: |
      Let rr = most recent RentRollPeriod on property by period_month.
      occupancy_pct = round_half_up(rr.occupied_units / rr.total_units * 10000) / 100
      # Stored as percent with 2 decimal places (e.g., 92.50).
    input_set: "most recent RentRollPeriod by period_month on the property"
    constants: {}
    precision: "2 decimal places, round_half_up"

# -----------------------------------------------------------------------------
# §1.4 Validation rules (ordered by priority)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and one of the declared role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Caller role is permitted for the requested endpoint (RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path resources exist (deal / property / scenario / memo / etc.), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Body-referenced FK ids exist (assumption_id, scenario_id, deal_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is valid per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit-underwriting, submit-ic, compute, submit, vote, reject, reopen, mark-dead, debt-sizing, waterfall)"
  - priority: 7
    category: state
    check: "Ownership: caller X-User-ID matches the owning role field on the parent (deal.analyst_id for analyst-scoped actions, deal.asset_manager_id for asset-manager-scoped actions)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /re-underwriting/deals/{id}/submit-underwriting, /reopen, /compute, /submit (memo), /mark-dead"
  - priority: 8
    category: business_referential
    check: "For scenario create: body.assumption_id resolves to a MarketAssumption belonging to the same deal"
    error_id: ERR_ASSUMPTION_MISMATCH
    http_status: 422
    applies_to: "POST /re-underwriting/deals/{id}/scenarios"
  - priority: 9
    category: business_referential
    check: "For IC memo create: body.scenario_id resolves to a Scenario belonging to the same deal and with status == COMPUTED"
    error_id: ERR_SCENARIO_NOT_COMPUTED
    http_status: 422
    applies_to: "POST /re-underwriting/deals/{id}/ic-memos"
  - priority: 10
    category: business_constraint
    check: "Unique deal_code across all deals"
    error_id: ERR_DUPLICATE_DEAL_CODE
    http_status: 409
    applies_to: "POST /re-underwriting/deals"
  - priority: 11
    category: business_constraint
    check: "Unique (property_id, period_month) for RentRollPeriod and unique (property_id, period_year, category) for OperatingExpense"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /re-underwriting/properties/{id}/rent-roll, POST /re-underwriting/properties/{id}/operating-expenses"
  - priority: 12
    category: business_constraint
    check: "occupancy_stress_pct within [0,100]; exit_cap_rate_bps > 0; amortization_years 1-30; hold_period_years 1-15"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST/PATCH on MarketAssumption, Scenario, DebtSizing"
  - priority: 13
    category: business_fiscal
    check: "For debt-sizing: scenario.computed_noi_yr1_cents > 0"
    error_id: ERR_NOI_NONPOSITIVE
    http_status: 422
    applies_to: "POST /re-underwriting/scenarios/{id}/debt-sizing"
  - priority: 14
    category: business_fiscal
    check: "For waterfall: promote_tier2_bps >= promote_tier1_bps (no regressive promote)"
    error_id: ERR_PROMOTE_REGRESSIVE
    http_status: 422
    applies_to: "POST /re-underwriting/scenarios/{id}/waterfall"
  - priority: 15
    category: business_safety
    check: "ICVote: voter X-User-ID has not already cast a vote on this memo"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /re-underwriting/ic-memos/{id}/vote"
  - priority: 16
    category: business_safety
    check: "Segregation of duties: deal.analyst_id MAY NOT cast ICVote on a memo belonging to that deal"
    error_id: ERR_SEG_DUTIES
    http_status: 403
    applies_to: "POST /re-underwriting/ic-memos/{id}/vote"
  - priority: 17
    category: business_safety
    check: "ICVote only allowed while memo.status == UNDER_VOTE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /re-underwriting/ic-memos/{id}/vote"
  - priority: 18
    category: business_temporal
    check: "RentRollPeriod.period_month must be strictly greater than the latest existing RentRollPeriod on the same property (chronological append-only)"
    error_id: ERR_NONMONOTONIC_PERIOD
    http_status: 422
    applies_to: "POST /re-underwriting/properties/{id}/rent-roll"
  - priority: 19
    category: business_temporal
    check: "OperatingExpense.period_year must not be in the future relative to the server's logical clock"
    error_id: ERR_FUTURE_PERIOD
    http_status: 422
    applies_to: "POST /re-underwriting/properties/{id}/operating-expenses"
  - priority: 20
    category: state
    check: "OCC: when expected_<parent>_version is supplied, it must equal parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /re-underwriting/deals/{id}/scenarios, POST /re-underwriting/deals/{id}/ic-memos"

# -----------------------------------------------------------------------------
# §1.5 API endpoints
# -----------------------------------------------------------------------------
endpoints:
  # Deals
  - method: POST
    path: "/re-underwriting/deals"
    description: "Create a new deal in DRAFT status"
    roles: [Analyst]
    code: 201
    input: [deal_code, deal_name, strategy, target_purchase_price_cents]
    output: Deal
    side_effects:
      - "deal.analyst_id := X-User-ID"
      - "deal.status := DRAFT"
  - method: GET
    path: "/re-underwriting/deals"
    description: "List deals (paginated, filterable)"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "analyst_id?", "asset_manager_id?", "current_scenario_id?"]
    output: Deal[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/deals/{id}"
    description: "Fetch single deal"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: []
    output: Deal
    side_effects: []
  - method: POST
    path: "/re-underwriting/deals/{id}/submit-underwriting"
    description: "Move deal DRAFT -> UNDERWRITING; assigns asset manager via X-AssetManager-ID header"
    roles: [Analyst]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "deal.status := UNDERWRITING"
      - "deal.asset_manager_id := X-AssetManager-ID header"
      - "increments Deal.version by 1"
  - method: POST
    path: "/re-underwriting/deals/{id}/submit-ic"
    description: "Move deal UNDERWRITING -> IC_REVIEW; pins memo's scenario; supersedes other COMPUTED scenarios; flips memo to UNDER_VOTE"
    roles: [AssetManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "deal.status := IC_REVIEW; deal.current_scenario_id := memo.scenario_id"
      - "ICMemo transitions SUBMITTED -> UNDER_VOTE"
      - "Other COMPUTED scenarios on this deal transition to SUPERSEDED"
      - "increments Deal.version by 1"
  - method: POST
    path: "/re-underwriting/deals/{id}/reopen"
    description: "Move deal back to DRAFT (from UNDERWRITING) or UNDERWRITING (from REJECTED); supersedes all COMPUTED scenarios"
    roles: [Analyst]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "deal.status := DRAFT (if was UNDERWRITING) or UNDERWRITING (if was REJECTED)"
      - "all COMPUTED scenarios on this deal -> SUPERSEDED (superseded_by_id null)"
      - "deal.current_scenario_id := null"
      - "increments Deal.version by 1"
  - method: POST
    path: "/re-underwriting/deals/{id}/mark-dead"
    description: "Move deal REJECTED -> DEAD (terminal)"
    roles: [AssetManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "deal.status := DEAD"
      - "increments Deal.version by 1"

  # Properties
  - method: POST
    path: "/re-underwriting/deals/{id}/properties"
    description: "Create a property under a deal (deal must be in DRAFT or UNDERWRITING)"
    roles: [Analyst]
    code: 201
    input: [address_line, market, property_type, units, rentable_sqft, year_built]
    output: Property
    side_effects:
      - "increments Deal.version by 1"
  - method: GET
    path: "/re-underwriting/deals/{id}/properties"
    description: "List properties for a deal"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/properties/{id}"
    description: "Fetch single property"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: []
    output: Property
    side_effects: []

  # Rent roll
  - method: POST
    path: "/re-underwriting/properties/{id}/rent-roll"
    description: "Append a new RentRollPeriod (chronologically append-only)"
    roles: [Analyst]
    code: 201
    input: [period_month, occupied_units, total_units, gross_potential_rent_cents, collected_rent_cents, "concessions_cents?", source_doc_ref]
    output: RentRollPeriod
    side_effects:
      - "recompute property.occupancy_pct"
      - "increments Property.version by 1"
  - method: GET
    path: "/re-underwriting/properties/{id}/rent-roll"
    description: "List rent roll periods for a property"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "period_month?"]
    output: RentRollPeriod[]
    side_effects: []

  # Operating expenses
  - method: POST
    path: "/re-underwriting/properties/{id}/operating-expenses"
    description: "Record an operating expense (unique per property+year+category)"
    roles: [Analyst]
    code: 201
    input: [period_year, category, amount_cents, "is_recoverable?"]
    output: OperatingExpense
    side_effects:
      - "increments Property.version by 1"
  - method: GET
    path: "/re-underwriting/properties/{id}/operating-expenses"
    description: "List operating expenses for a property"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "period_year?", "category?"]
    output: OperatingExpense[]
    side_effects: []

  # Market assumptions
  - method: POST
    path: "/re-underwriting/deals/{id}/assumptions"
    description: "Create a MarketAssumption set under a deal; the first set for a deal becomes active by default"
    roles: [Analyst]
    code: 201
    input: [label, market_rent_growth_yr1_bps, market_rent_growth_steady_bps, expense_growth_bps, exit_cap_rate_bps, hold_period_years, capex_per_unit_cents, lease_up_months]
    output: MarketAssumption
    side_effects:
      - "if no other MarketAssumption for deal is_active, set is_active=true"
      - "increments Deal.version by 1"
  - method: POST
    path: "/re-underwriting/assumptions/{id}/activate"
    description: "Mark this assumption set as the deal's active one (deactivates any prior)"
    roles: [Analyst]
    code: 200
    input: []
    output: MarketAssumption
    side_effects:
      - "every other MarketAssumption for the same deal: is_active := false"
      - "this MarketAssumption: is_active := true"
      - "increments MarketAssumption.version by 1"
  - method: GET
    path: "/re-underwriting/deals/{id}/assumptions"
    description: "List assumption sets for a deal"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketAssumption[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/assumptions/{id}"
    description: "Fetch single MarketAssumption"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: []
    output: MarketAssumption
    side_effects: []

  # Scenarios
  - method: POST
    path: "/re-underwriting/deals/{id}/scenarios"
    description: "Create a scenario (OCC-guarded on deal.version)"
    roles: [Analyst]
    code: 201
    input: [scenario_kind, assumption_id, occupancy_stress_pct, expected_deal_version]
    output: Scenario
    side_effects:
      - "increments Deal.version by 1"
  - method: GET
    path: "/re-underwriting/deals/{id}/scenarios"
    description: "List scenarios for a deal"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "scenario_kind?", "assumption_id?", "superseded_by_id?"]
    output: Scenario[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/scenarios"
    description: "Flat list of all scenarios (filtered list form; supports FK reverse-reachability for assumption_id and superseded_by_id)"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "scenario_kind?", "assumption_id?", "superseded_by_id?", "deal_id?"]
    output: Scenario[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/scenarios/{id}"
    description: "Fetch single scenario"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: []
    output: Scenario
    side_effects: []
  - method: POST
    path: "/re-underwriting/scenarios/{id}/compute"
    description: "Compute scenario outputs (NOI, IRR, equity multiple)"
    roles: [Analyst]
    code: 200
    input: []
    output: Scenario
    side_effects:
      - "runs noi_year1, irr_unlevered, equity_multiple"
      - "scenario.status := COMPUTED"
      - "increments Scenario.version by 1"
  - method: POST
    path: "/re-underwriting/scenarios/{id}/debt-sizing"
    description: "Run debt sizing against this scenario"
    roles: [Analyst]
    code: 201
    input: [interest_rate_bps, amortization_years, io_months, min_dscr_pct, max_ltv_pct]
    output: DebtSizing
    side_effects:
      - "creates DebtSizing row"
  - method: GET
    path: "/re-underwriting/scenarios/{id}/debt-sizing"
    description: "List debt sizings for a scenario"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: DebtSizing[]
    side_effects: []
  - method: POST
    path: "/re-underwriting/scenarios/{id}/waterfall"
    description: "Run waterfall split against this scenario"
    roles: [Analyst]
    code: 201
    input: [pref_return_bps, promote_tier1_bps, tier1_hurdle_bps, promote_tier2_bps]
    output: Waterfall
    side_effects:
      - "creates Waterfall row"
  - method: GET
    path: "/re-underwriting/scenarios/{id}/waterfall"
    description: "List waterfalls for a scenario"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: Waterfall[]
    side_effects: []

  # IC memos
  - method: POST
    path: "/re-underwriting/deals/{id}/ic-memos"
    description: "Create an IC memo pinned to a computed scenario (OCC-guarded on deal.version)"
    roles: [Analyst]
    code: 201
    input: [scenario_id, recommendation, thesis, risks, expected_deal_version]
    output: ICMemo
    side_effects:
      - "increments Deal.version by 1"
  - method: GET
    path: "/re-underwriting/deals/{id}/ic-memos"
    description: "List IC memos for a deal"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "scenario_id?"]
    output: ICMemo[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/ic-memos"
    description: "Flat list of all IC memos (filtered list form; supports FK reverse-reachability for scenario_id)"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?", "status?", "scenario_id?", "deal_id?"]
    output: ICMemo[]
    side_effects: []
  - method: GET
    path: "/re-underwriting/ic-memos/{id}"
    description: "Fetch single IC memo"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: []
    output: ICMemo
    side_effects: []
  - method: POST
    path: "/re-underwriting/ic-memos/{id}/submit"
    description: "Submit memo (DRAFT -> SUBMITTED)"
    roles: [Analyst]
    code: 200
    input: []
    output: ICMemo
    side_effects:
      - "memo.status := SUBMITTED; memo.submitted_at := now"
      - "increments ICMemo.version by 1"
  - method: POST
    path: "/re-underwriting/ic-memos/{id}/vote"
    description: "Cast a YES/NO/ABSTAIN vote on a memo in UNDER_VOTE"
    roles: [IC_Member, IC_Chair]
    code: 201
    input: [vote, "comment?"]
    output: ICVote
    side_effects:
      - "creates ICVote row"
      - "if YES count >= 2 and NO count == 0, cascade memo -> APPROVED, deal -> APPROVED"
      - "if NO count >= 1, cascade memo -> REJECTED, deal -> REJECTED"
  - method: POST
    path: "/re-underwriting/ic-memos/{id}/reject"
    description: "IC Chair override: force memo to REJECTED"
    roles: [IC_Chair]
    code: 200
    input: [reason]
    output: ICMemo
    side_effects:
      - "memo.status := REJECTED; memo.decided_at := now"
      - "deal.status := REJECTED; deal.rejected_reason := reason"
      - "increments ICMemo.version by 1; increments Deal.version by 1"
  - method: GET
    path: "/re-underwriting/ic-memos/{id}/votes"
    description: "List votes cast on a memo"
    roles: [Analyst, AssetManager, IC_Member, IC_Chair, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: ICVote[]
    side_effects: []

  # Test-driving: logical clock
  - method: POST
    path: "/re-underwriting/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Server default at startup is 2026-08-01T00:00:00Z (never falls back to wall clock)."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

# -----------------------------------------------------------------------------
# §1.6 Error code catalog
# -----------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role lacks permission, or ownership check failed (deal.analyst_id / deal.asset_manager_id mismatch), or other RBAC denial" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (deal, property, scenario, memo, assumption, debt-sizing, waterfall, vote) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is valid; includes duplicate submit/compute, vote on already-decided memo, etc." }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, out-of-range numeric (occupancy_stress_pct, amortization_years, etc.), or invalid enum value" }
  - { id: ERR_DUPLICATE_DEAL_CODE, http: 409, condition: "deal_code already in use by another Deal" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "A RentRollPeriod already exists for (property_id, period_month), or an OperatingExpense already exists for (property_id, period_year, category)" }
  - { id: ERR_NONMONOTONIC_PERIOD, http: 422, condition: "New RentRollPeriod.period_month is not strictly greater than the latest existing period_month on the property" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "OperatingExpense.period_year is in the future relative to the server's logical clock" }
  - { id: ERR_ASSUMPTION_MISMATCH, http: 422, condition: "Scenario.assumption_id resolves to a MarketAssumption that does not belong to the deal" }
  - { id: ERR_SCENARIO_NOT_COMPUTED, http: 422, condition: "ICMemo.scenario_id does not resolve to a Scenario in status == COMPUTED for this deal" }
  - { id: ERR_NOI_NONPOSITIVE, http: 422, condition: "Debt sizing attempted on a scenario whose computed_noi_yr1_cents <= 0" }
  - { id: ERR_PROMOTE_REGRESSIVE, http: 422, condition: "promote_tier2_bps < promote_tier1_bps (regressive promote structure)" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Same X-User-ID has already cast a vote on this memo" }
  - { id: ERR_SEG_DUTIES, http: 403, condition: "Segregation-of-duties violation: deal.analyst_id may not cast ICVote on memos belonging to that deal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_<parent>_version does not match parent's current version" }

# -----------------------------------------------------------------------------
# §1.7 RBAC
# -----------------------------------------------------------------------------
roles:
  - name: Analyst
    description: "Deal originator; creates deals, inputs rent roll / expenses / assumptions, builds scenarios, drafts IC memo"
    identity: opaque
    exclusive_operations:
      - "POST /re-underwriting/deals"
      - "POST /re-underwriting/deals/{id}/properties"
      - "POST /re-underwriting/properties/{id}/rent-roll"
      - "POST /re-underwriting/properties/{id}/operating-expenses"
      - "POST /re-underwriting/deals/{id}/assumptions"
      - "POST /re-underwriting/assumptions/{id}/activate"
      - "POST /re-underwriting/deals/{id}/scenarios"
      - "POST /re-underwriting/scenarios/{id}/compute"
      - "POST /re-underwriting/scenarios/{id}/debt-sizing"
      - "POST /re-underwriting/scenarios/{id}/waterfall"
      - "POST /re-underwriting/deals/{id}/ic-memos"
      - "POST /re-underwriting/ic-memos/{id}/submit"
      - "POST /re-underwriting/deals/{id}/submit-underwriting"
      - "POST /re-underwriting/deals/{id}/reopen"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: AssetManager
    description: "Senior reviewer; owns deal after submit-underwriting; submits to IC; marks rejected deals dead"
    identity: opaque
    exclusive_operations:
      - "POST /re-underwriting/deals/{id}/submit-ic"
      - "POST /re-underwriting/deals/{id}/mark-dead"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: IC_Member
    description: "Investment committee member; votes on memos in UNDER_VOTE"
    identity: opaque
    exclusive_operations:
      - "POST /re-underwriting/ic-memos/{id}/vote"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: IC_Chair
    description: "IC chair; can vote AND force-reject a memo"
    identity: opaque
    exclusive_operations:
      - "POST /re-underwriting/ic-memos/{id}/reject"
    shared_operations:
      - "POST /re-underwriting/ic-memos/{id}/vote"
      - "GET endpoints (read-only)"
  - name: Admin
    description: "Operator; can read anything and set the logical clock for tests"
    identity: opaque
    exclusive_operations:
      - "POST /re-underwriting/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read-only)"
