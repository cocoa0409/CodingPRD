scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_system_required_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.InstitutionSystem
          - endpoints["POST /accreditation/systems"]
        distinguishing_aspect: "POST with all required fields returns 201 with system defaults applied (CANDIDATE, fee_credit_cents 0)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /accreditation/systems"
              payload: { name: "New County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
          trigger:
            - call: "GET /accreditation/systems/${sys_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "InstitutionSystem.accreditation_status == CANDIDATE"
            - "InstitutionSystem.fee_credit_cents == 0"
            - "InstitutionSystem.version == 1"
            - "InstitutionSystem.current_term_id is null"

      - name: create_system_missing_name_returns_validation
        claim_type: required_fields
        grounds:
          - entities.InstitutionSystem.fields.name
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Missing required input field name is rejected with ERR_VALIDATION 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/systems"
              payload: { system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: get_system_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/systems/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: campus_enrollment_below_one_rejected
        claim_type: type_constraints
        grounds:
          - entities.Campus.fields.enrollment
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "enrollment 0 violates the >= 1 constraint."
        test_recipe:
          setup: ["One system"]
          setup_api_calls:
            - call: "POST /accreditation/systems"
              payload: { name: "C County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
          trigger:
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Zero Campus", enrollment: 0 }
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: rating_value_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.SelfStudyRating.fields.rating
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "rating 5 violates the 1..4 rubric constraint."
        test_recipe:
          setup: ["System, campus, standard, term in PREPARATION"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Range School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
          trigger:
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 5, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ImprovementGoal.fields.attainment_pct
        distinguishing_aspect: "Client-supplied value for computed field attainment_pct on goal creation is ignored; server sets 0.00."
        test_recipe:
          setup: ["Term in TERM_ACTIVE (requires full pipeline to decide)"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Computed School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
          trigger:
            - call: "POST /accreditation/terms/${term_id}/goals"
              payload: { campus_id: "${campus_id}", standard_id: "${std_l1}", title: "Raise proficiency", baseline_value: 50, target_value: 80, direction: "INCREASE" }
              as: SchoolLeader
              captures: { goal_id: $.data.id }
          assert:
            - "ImprovementGoal.${goal_id}.attainment_pct == 0.00"
            - "ImprovementGoal.${goal_id}.current_value == 50"
            - "ImprovementGoal.${goal_id}.status == PROPOSED"

      - name: list_campuses_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints["GET /accreditation/systems/{systemId}/campuses"]
        distinguishing_aspect: "List endpoint returns pagination fields limit, offset, total_count, has_more with defaults 10/0."
        test_recipe:
          setup: ["One system with two campuses"]
          setup_api_calls:
            - call: "POST /accreditation/systems"
              payload: { name: "Paged County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "C1", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "C2", enrollment: 200 }
              as: AccreditationOfficer
          trigger:
            - call: "GET /accreditation/systems/${sys_id}/campuses"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "data is an array of length 2"
            - "pagination block reports total_count == 2 and has_more == false with default limit 10 offset 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_term_preparation_to_review_skipped
        claim_type: invalid_transition
        grounds:
          - state_machines.AccreditationTerm
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Advance from PREPARATION when rating coverage is incomplete must fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Term in PREPARATION; campus exists but NO rating rows exist for it"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems"
              payload: { name: "Skip County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminal_state_lockdown_invoice_paid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
        distinguishing_aspect: "From PAID no further transitions are possible; void on PAID invoice fails."
        test_recipe:
          setup: ["Invoice fully paid"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems"
              payload: { name: "Paid County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/invoices"
              payload: { billing_year: 2026, invoice_type: "ANNUAL_FEE" }
              as: SystemBursar
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /accreditation/invoices/${inv_id}/payments"
              payload: { amount_cents: 620000, paid_at: "2026-08-02T00:00:00Z", expected_invoice_version: "${inv_v}" }
              as: SystemBursar
          trigger:
            - call: "POST /accreditation/invoices/${inv_id}/void"
              payload: {}
              as: SystemBursar
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: initial_state_new_rating_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.SelfStudyRating
        distinguishing_aspect: "Newly created SelfStudyRating starts in DRAFT."
        test_recipe:
          setup: ["Term in PREPARATION"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Init School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
          trigger:
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 2, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_id: $.data.id }
          assert:
            - "SelfStudyRating.${r_id}.status == DRAFT"
            - "SelfStudyRating.${r_id}.finalized_at is null"

      - name: side_effect_visit_confirm_flips_reviewer
        claim_type: side_effect_execution
        grounds:
          - state_machines.VisitEvent.REQUESTED_to_CONFIRMED
          - state_machines.Reviewer
        distinguishing_aspect: "Confirming a visit flips assigned reviewers AVAILABLE->ON_ASSIGNMENT; cancelling a CONFIRMED visit before starts_on flips them back."
        test_recipe:
          setup: ["Term REVIEW; visit REQUESTED with chair assigned"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "SideEffect County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Rev A", email: "reva@accreditor.org" }
              as: AccreditationOfficer
              captures: { rev_a: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_a}", starts_on: "2027-03-01T00:00:00Z", ends_on: "2027-03-03T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_id: $.data.id }
            - call: "POST /accreditation/visits/${visit_id}/assignments"
              payload: { reviewer_id: "${rev_a}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/visits/${visit_id}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/reviewers/${rev_a}"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_id}/cancel"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/reviewers/${rev_a}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "After confirm: Reviewer.${rev_a}.reviewer_status == ON_ASSIGNMENT"
            - "After cancel (before starts_on): Reviewer.${rev_a}.reviewer_status == AVAILABLE"

      - name: bubble_up_all_action_items_resolved_allows_term_advance
        claim_type: bubble_up
        grounds:
          - state_machines.AccreditationTerm.TERM_ACTIVE_to_INTERIM_MONITORING
        distinguishing_aspect: "Term TERM_ACTIVE->INTERIM_MONITORING requires every RequiredActionItem in {VERIFIED, WAIVED} and at least one ACCEPTED interim report — compound precondition on child states."
        test_recipe:
          setup: ["Term TERM_ACTIVE with one OPEN action item"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Bubble County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Rev A", email: "reva@accreditor.org" }
              as: AccreditationOfficer
              captures: { rev_a: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_a}", starts_on: "2026-11-02T00:00:00Z", ends_on: "2026-11-04T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_id: $.data.id }
            - call: "POST /accreditation/visits/${visit_id}/assignments"
              payload: { reviewer_id: "${rev_a}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_id}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_id}/findings"
              payload: { standard_id: "${std_l1}", severity: "REQUIRED_ACTION", narrative: "Adopt a formal policy review cycle.", follow_up_months: 6 }
              as: Reviewer
              as_user_id: "${rev_a}"
              captures: { f_1: $.data.id }
            - call: "POST /accreditation/findings/${f_1}/issue"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_a}"
            - call: "POST /accreditation/visits/${visit_id}/issue-report"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_a}"
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/decide"
              payload: { outcome: "ACCREDITED_WITH_STIPULATIONS" }
              as: AccreditationCommission
          trigger:
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (OPEN action item blocks TERM_ACTIVE->INTERIM_MONITORING)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: goal_attainment_increase_direction
        claim_type: correct_result
        grounds:
          - calculations.goal_attainment
        distinguishing_aspect: "INCREASE goal baseline 50 target 80, indicator value 65 -> attainment_pct 50.00."
