      - name: recordation_sharing_a_boundary_date_returns_window_overlap
        claim_type: Violation → Error
        grounds:
          - validations[priority=74]
          - interval_rules.recordation_window_overlap
          - errors[ERR_RECORDATION_WINDOW_OVERLAP]
        distinguishing_aspect: "The recordation interval is CLOSED on both ends, so a second window starting exactly on the first one's expires_on (2026-08-10) collides, while starting the day after (2026-08-11) does not — and a same-dates window under a different customs authority never collides at all."
        test_recipe:
          setup:
            - "A RECORDED CBP recordation for class 8 covering [2026-07-01, 2026-08-10]"
            - "Three further DRAFT recordations: CBP [2026-08-10, 2027-01-31], CBP [2026-08-11, 2027-01-31] and EUC [2026-07-01, 2026-08-10]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "CBP", nice_class: 8, recorded_on: "2026-07-01", expires_on: "2026-08-10" }
              as: CustomsCoordinator
              captures: { rec1_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations/${rec1_id}/record"
              payload: { recordation_number: "CBP-0001" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "CBP", nice_class: 8, recorded_on: "2026-08-10", expires_on: "2027-01-31" }
              as: CustomsCoordinator
              captures: { rec2_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "CBP", nice_class: 8, recorded_on: "2026-08-11", expires_on: "2027-01-31" }
              as: CustomsCoordinator
              captures: { rec3_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "EUC", nice_class: 8, recorded_on: "2026-07-01", expires_on: "2026-08-10" }
              as: CustomsCoordinator
              captures: { rec4_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/customs-recordations/${rec2_id}/record"
              payload: { recordation_number: "CBP-0002" }
              as: CustomsCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/customs-recordations/${rec3_id}/record"
              payload: { recordation_number: "CBP-0003" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/customs-recordations/${rec4_id}/record"
              payload: { recordation_number: "EUC-0001" }
              as: CustomsCoordinator
          assert:
            - "the 2026-08-10 start returns HTTP 409 with data.error_id == ERR_RECORDATION_WINDOW_OVERLAP"
            - "CustomsRecordation.${rec2_id}.status == DRAFT and recordation_number == null after the refusal"
            - "the 2026-08-11 start returns HTTP 200 with status RECORDED and recordation_number CBP-0003"
            - "the EUC window sharing both dates with rec1 returns HTTP 200 with status RECORDED (the scope is the (brand, authority, class) triple)"
            - "CustomsRecordation.${rec1_id}.status == RECORDED throughout"

      - name: recordation_status_check_outranks_the_principal_register_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=45]
          - validations[priority=46]
          - errors[ERR_REGISTRATION_NOT_ELIGIBLE]
          - errors[ERR_RECORDATION_NOT_PRINCIPAL_REGISTER]
