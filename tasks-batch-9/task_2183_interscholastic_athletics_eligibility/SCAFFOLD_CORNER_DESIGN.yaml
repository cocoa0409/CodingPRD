# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# sections 1.1-1.7. Corners already asserted by a SCAFFOLD_DIFFICULTY_DESIGN.yaml
# instance are emitted as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: school_creation_returns_every_declared_field_with_server_defaults
        claim_type: creation
        grounds: [entities.School, "endpoints[POST /athletics/schools]"]
        distinguishing_aspect: "POST /athletics/schools with only the three required fields returns 201 and a body carrying id, created_at, updated_at, version 1, sanction_status GOOD_STANDING, forfeit_count 0, release_minutes_used 0, fee_collected_cents 0 and an empty credential_gap_sports."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
          assert:
            - "HTTP status == 201"
            - "School.${sch_a}.version == 1"
            - "School.${sch_a}.sanction_status == GOOD_STANDING"
            - "School.${sch_a}.forfeit_count == 0"
            - "School.${sch_a}.release_minutes_used == 0"
            - "School.${sch_a}.fee_collected_cents == 0"
            - "School.${sch_a}.credential_gap_sports == []"
            - "response meta contains api_request_id and api_request_timestamp and response_type == object"

      - name: school_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.School.fields.school_day_end_utc_hhmm
          - entities.School.fields.bus_fleet_size
          - entities.School.fields.max_release_minutes_per_request
          - entities.School.fields.fee_cap_cents
          - entities.School.fields.venue_concurrent_capacity
        distinguishing_aspect: "Omitting all five optional school settings yields school_day_end_utc_hhmm 20:30, bus_fleet_size 4, max_release_minutes_per_request 240, fee_cap_cents 20000 and venue_concurrent_capacity 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/schools"
              payload: { name: "Default High", classification: "C2A", region_code: "R-WEST" }
              as: AssociationAdmin
              captures: { sch_d: $.data.id }
          assert:
            - "School.${sch_d}.school_day_end_utc_hhmm == 20:30"
            - "School.${sch_d}.bus_fleet_size == 4"
            - "School.${sch_d}.max_release_minutes_per_request == 240"
            - "School.${sch_d}.fee_cap_cents == 20000"
            - "School.${sch_d}.venue_concurrent_capacity == 1"

      - name: student_retrieval_returns_the_stored_record
        claim_type: retrieval
        grounds: [entities.Student, "endpoints[GET /athletics/students/{id}]"]
        distinguishing_aspect: "GET /athletics/students/{id} returns the exact enrolment record written by POST /athletics/students, with academic fields still null and credits still 0."
        test_recipe:
          setup: ["One C3A school with one enrolled student."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Jo Marsh", birth_date: "2009-05-14", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_1: $.data.id }
          trigger:
            - call: "GET /athletics/students/${stu_1}"
              payload: {}
              as: Registrar
              as_user_id: "${sch_a}"
          assert:
            - "HTTP status == 200"
            - "Student.${stu_1}.full_name == Jo Marsh"
            - "Student.${stu_1}.gpa_prior_period == null"
            - "Student.${stu_1}.credits_prior_period == 0"
            - "Student.${stu_1}.residency_verified == false"
            - "Student.${stu_1}.previous_school_id == null"
            - "Student.${stu_1}.academic_record_submitted_at == null"

      - name: student_creation_missing_birth_date_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=20]", "errors[ERR_INVALID_REQUEST]", "endpoints[POST /athletics/students]"]
        distinguishing_aspect: "birth_date has source input and no default, so omitting it yields ERR_INVALID_REQUEST with HTTP 400 and no Student row is created."
        test_recipe:
          setup: ["One C3A school."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
          trigger:
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "No Birthday", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /athletics/students?school_id=${sch_a} returns an array of length 0"

      - name: student_create_body_cannot_seed_academic_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Student.fields.gpa_prior_period
          - entities.Student.fields.academic_record_submitted_by
          - endpoints[POST /athletics/students]
          - endpoints[POST /athletics/students/{id}/academic-record]
        distinguishing_aspect: "gpa_prior_period is not in POST /athletics/students input, so sending it is an unknown field rejected with ERR_INVALID_REQUEST; the value can only arrive through the Registrar's academic-record endpoint, which also stamps academic_record_submitted_by."
        test_recipe:
          setup: ["One C3A school."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Kim Lau", birth_date: "2009-05-14", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_1: $.data.id }
          trigger:
            - call: "POST /athletics/students/${stu_1}/academic-record"
              payload: { gpa_prior_period: 3.250, gpa_current_period: 3.100, credits_prior_period: 4, credits_current_period: 4 }
              as: Registrar
              as_user_id: "${sch_a}"
          assert:
            - "Student.${stu_1}.gpa_prior_period == 3.250"
            - "Student.${stu_1}.academic_record_submitted_by == ${sch_a}"
            - "Student.${stu_1}.academic_record_submitted_at is not null"
            - "Student.${stu_1}.version == 2"

      - name: student_listing_filters_by_school_and_honours_pagination
        claim_type: listing
        grounds: ["endpoints[GET /athletics/students]", response_envelope.pagination_fields]
        distinguishing_aspect: "GET /athletics/students?school_id=<A>&limit=2&offset=1 returns exactly the second and third of A's three students in created_at ASC order, with total_count 3 and has_more false, and never leaks school B's student."
        test_recipe:
          setup: ["Two C3A schools; school A has three students created in a known order, school B has one."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "South High", classification: "C3A", region_code: "R-SOUTH" }
              as: AssociationAdmin
              captures: { sch_b: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "S1", birth_date: "2009-01-01", grade_level: 9 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { s1: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "S2", birth_date: "2009-01-02", grade_level: 9 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { s2: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "S3", birth_date: "2009-01-03", grade_level: 9 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { s3: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_b}", full_name: "B1", birth_date: "2009-01-04", grade_level: 9 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_b}"
              captures: { b1: $.data.id }
          trigger:
            - call: "GET /athletics/students"
              payload: { school_id: "${sch_a}", limit: 2, offset: 1 }
              as: AssociationAdmin
          assert:
            - "response data is an array of length 2 holding ${s2} then ${s3}"
            - "response total_count == 3"
            - "response has_more == false"
            - "${b1} does not appear in the response"

      - name: student_listing_with_limit_zero_returns_invalid_pagination
        claim_type: type_constraints
        grounds: ["validations[priority=22]", "errors[ERR_INVALID_PAGINATION]", "endpoints[GET /athletics/students]"]
        distinguishing_aspect: "limit must sit in [1, 100]; limit 0 is rejected with ERR_INVALID_PAGINATION and HTTP 400 rather than silently clamped to the default of 10."
        test_recipe:
          setup: ["One C3A school with one student."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "S1", birth_date: "2009-01-01", grade_level: 9 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /athletics/students"
              payload: { school_id: "${sch_a}", limit: 0 }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_PAGINATION"

      - name: season_creation_with_an_unknown_sport_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.SportSeason.fields.sport, "validations[priority=20]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "sport is constrained to {FOOTBALL, BASKETBALL, TRACK, SOCCER}; the value LACROSSE is rejected with ERR_INVALID_REQUEST and HTTP 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "LACROSSE", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10 }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: school_read_with_an_unknown_uuid_returns_school_not_found
        claim_type: not_found
        grounds: ["validations[priority=10]", "errors[ERR_SCHOOL_NOT_FOUND]", "endpoints[GET /athletics/schools/{id}]"]
        distinguishing_aspect: "A syntactically valid but unpersisted UUID on GET /athletics/schools/{id} yields ERR_SCHOOL_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "GET /athletics/schools/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AssociationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_SCHOOL_NOT_FOUND"
            - "response response_type == error"

      - name: eligibility_case_creation_against_an_unknown_season_returns_season_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=12]", "errors[ERR_SEASON_NOT_FOUND]", entities.EligibilityCase.fields.sport_season_id]
        distinguishing_aspect: "The body foreign key sport_season_id is validated at priority 12; an unpersisted season UUID yields ERR_SEASON_NOT_FOUND with HTTP 404 and no EligibilityCase row is minted."
        test_recipe:
          setup: ["One C3A school with one student and no seasons."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Lia Moss", birth_date: "2009-05-14", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_1: $.data.id }
          trigger:
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_1}", sport_season_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_SEASON_NOT_FOUND"
            - "GET /athletics/eligibility-cases?student_id=${stu_1} returns an array of length 0"

      - name: clearance_document_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds: [entities.ClearanceDocument, "endpoints[GET /athletics/eligibility-cases/{id}/clearance-documents]"]
        distinguishing_aspect: "ClearanceDocument declares common_fields false, so its rows expose id and created_at but no updated_at and no version, and section 1.5 offers no update or delete endpoint for them; freshness is recomputed on read from expires_on."
        test_recipe:
          setup: ["One school, one FOOTBALL C3A season, one student with one eligibility case, and a PHYSICAL form expiring 2027-07-15."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Mo Idris", birth_date: "2009-05-14", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_1: $.data.id }
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_1}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_1: $.data.id }
            - call: "POST /athletics/eligibility-cases/${case_1}/clearance-documents"
              payload: { doc_type: "PHYSICAL", issued_on: "2026-07-15", expires_on: "2027-07-15", signer_name: "Dr. Lin" }
              as: MedicalOfficer
              as_user_id: "med-001"
              captures: { doc_1: $.data.id }
          trigger:
            - call: "GET /athletics/eligibility-cases/${case_1}/clearance-documents"
              payload: { doc_type: "PHYSICAL" }
              as: EligibilityReviewer
              as_user_id: "rev-001"
          assert:
            - "response data is an array of length 1 whose element id == ${doc_1}"
            - "the element carries id and created_at but no version key"
            - "the element status == VALID"

      - name: playoff_seed_is_reachable_from_both_of_its_graph_endpoints
        claim_type: topology
        grounds:
          - entities.PlayoffSeed.fields.sport_season_id
          - entities.PlayoffSeed.fields.school_id
          - endpoints[GET /athletics/sport-seasons/{id}/playoff-seeds]
          - endpoints[GET /athletics/schools/{id}/playoff-seeds]
        distinguishing_aspect: "PlayoffSeed is a School x SportSeason junction, so the same row must be discoverable from the season side and from the school side; a cascade-minted row appears in no creation response and these two GETs are its only discovery channel."
        test_recipe:
          setup: ["Two C1A schools and one seeded BASKETBALL C1A season with a single forfeited contest."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "Larch High", classification: "C1A", region_code: "R-EAST" }
              as: AssociationAdmin
              captures: { sch_l: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Maple High", classification: "C1A", region_code: "R-EAST" }
              as: AssociationAdmin
              captures: { sch_m: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "BASKETBALL", classification: "C1A", school_year: "2026-2027", sport_tier: "TIER_C", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 1 }
              as: AssociationAdmin
              captures: { seas_b: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_b}"
              payload: {}
              as: AssociationAdmin
              captures: { sbv1: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_b}", home_school_id: "${sch_l}", away_school_id: "${sch_m}", starts_at: "2026-09-12T18:00:00Z", ends_at: "2026-09-12T20:00:00Z", travel_miles: 20, expected_sport_season_version: "${sbv1}" }
              as: AssociationAdmin
              captures: { con_lm: $.data.id }
            - call: "POST /athletics/contests/${con_lm}/forfeit"
              payload: { forfeiting_school_id: "${sch_m}" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_b}/advance"
              payload: { to_status: "PRACTICE_OPEN" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_b}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_b}/seed"
              payload: {}
              as: AssociationAdmin
          trigger:
            - call: "GET /athletics/schools/${sch_l}/playoff-seeds"
              payload: {}
              as: SchoolAthleticDirector
              as_user_id: "${sch_l}"
          assert:
            - "response data is an array of length 1"
            - "its sport_season_id == ${seas_b} and school_id == ${sch_l} and seed_number == 1"
            - "GET /athletics/sport-seasons/${seas_b}/playoff-seeds returns an array of length 2 containing the same row"

      - name: official_creation_initialises_its_computed_assignment_counter
        claim_type: computed_fields
        grounds: [entities.Official.fields.accepted_assignment_count, "endpoints[POST /athletics/officials]"]
        distinguishing_aspect: "accepted_assignment_count has source computed and is initialised to 0 by POST /athletics/officials; it is not part of the endpoint's input."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/officials"
              payload: { full_name: "Ola Nkemdi", certification_level: "LEVEL_3", home_region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { off_1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Official.${off_1}.accepted_assignment_count == 0"
            - "Official.${off_1}.version == 1"

  - section: state_machines
    instances:

      - name: season_is_created_in_planned_and_case_is_created_in_intake_with_assessed_fee
        claim_type: initial_state
        grounds:
          - state_machines.SportSeason.initial_state
          - state_machines.EligibilityCase.initial_state
          - entities.EligibilityCase.fields.fee_status
        distinguishing_aspect: "A new SportSeason lands in PLANNED with scheduled_contest_count 0, and a new EligibilityCase lands in INTAKE on the status axis and ASSESSED on the independent fee axis with fee_outstanding_cents equal to fee_amount_cents."
        test_recipe:
          setup: ["One C3A school with one student."]
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH", fee_cap_cents: 20000 }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Nia Frost", birth_date: "2009-05-14", grade_level: 10 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_1: $.data.id }
          trigger:
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_1}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_1: $.data.id }
          assert:
            - "SportSeason.${seas_f}.status == PLANNED"
            - "SportSeason.${seas_f}.scheduled_contest_count == 0"
