            - call: "POST /pole-attachment-requests/${pr2}/survey"
              payload: { make_ready_cost_cents: 90000 }
              as: UtilityOperator
          trigger:
            - call: "POST /pole-attachment-requests/${pr1}/decision"
              payload: { decision: "ACCEPT" }
              as: ProgramManager
              captures: { status_accept: $.data.status }
            - call: "POST /pole-attachment-requests/${pr2}/decision"
              payload: { decision: "DENY", denial_reason: "No spare capacity on the shared route." }
