        distinguishing_aspect: "close from OPEN (skipping LOCKED) -> ERR_INVALID_STATE; closing P2 while P1 still OPEN -> ERR_PAYROLL_CLOSE_ORDER (fiscal close-order rule distinct from raw state errors)."
        test_recipe:
          setup: ["P1 [2026-08-24..2026-09-20] OPEN (never locked); P2 [2026-09-21..2026-10-18] LOCKED"]
          setup_api_calls:
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P1", start_date: "2026-08-24", end_date: "2026-09-20" }
