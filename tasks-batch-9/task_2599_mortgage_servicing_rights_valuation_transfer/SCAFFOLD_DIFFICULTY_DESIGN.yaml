    instances:

      - name: bid_negotiation_cycles_countered_and_revised_until_round_cap
        grounds:
          - state_machines.Bid
          - state_machines.Bid.transitions[COUNTERED -> REVISED]
          - state_machines.Bid.transitions[REVISED -> COUNTERED]
          - entities.Bid.fields.round_number
          - entities.Bid.fields.counter_price_bps
          - entities.Bid.fields.counter_expires_at
          - validations[priority=40]
          - errors[ERR_MAX_NEGOTIATION_ROUNDS]
        distinguishing_aspect: |
          A CYCLE: COUNTERED -> REVISED -> COUNTERED is a genuine loop on a single Bid row, and the
          only thing that terminates it is the monotone round_number counter reaching
          MAX_NEGOTIATION_ROUNDS = 3. The same trigger (revise) therefore succeeds at rounds 1 and 2
          and fails at round 3 from the identical COUNTERED state, and each revision must clear the
          counter fields to null so the next counter can restamp them.
