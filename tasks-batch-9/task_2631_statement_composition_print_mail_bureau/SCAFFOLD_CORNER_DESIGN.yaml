            - "HTTP 201 with ${e6_mode_selected} == SELECTED, ${e6_line_selected} == ${e6_line_id} (the only eligible line) and ${e6_score_selected} == 839.40 == round_half_up((1000 - 1) * 6000 / 10000 + 600 * 4000 / 10000 - 0 * 500, 2): the first run's committed sheet has already eaten one unit of headroom, and the empty capability set carries no surplus penalty"
            - "The second window starts at 11:00, clear of the first run's 09:00-10:00 window plus the 30-minute changeover buffer, so no ERR_PRESS_WINDOW_CONFLICT is raised"
            - "Both jobs read status SCHEDULED and PressLine.${e6_line_id}.committed_sheet_count == 2"

      - name: presort_batching_side_effects_are_covered_by_the_difficulty_design
        claim_type: action_endpoint
        grounds: [endpoints.POST_composition_jobs_id_presort]
        excluded_because:
          difficulty_instance: batch_seal_depends_on_composition_job_verified_state
          rationale: "That instance walks presort into sealing and asserts the batch rows, piece buckets and job status the presort action writes, covering this endpoint's side-effect list."

      - name: manifest_side_effects_are_covered_by_the_difficulty_design
        claim_type: action_endpoint
        grounds: [endpoints.POST_presort_batches_id_manifest]
        excluded_because:
          difficulty_instance: manifested_postage_rounds_per_piece_before_summing
          rationale: "That instance manifests a multi-piece batch and asserts the per-piece rounding, the facility tray commitment and the job bubble to MANIFESTED, which is the manifest endpoint's full side-effect set."

      - name: close_side_effects_are_covered_by_the_difficulty_design
