      - name: incident_decision_errors_cover_missing_linkage_and_second_decision
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_LINKED_RELEASE]
          - errors[ERR_INCIDENT_ALREADY_DECIDED]
          - validations[priority=26]
          - endpoints[POST /incidents/{id}/decide]
        distinguishing_aspect: "A ROLLBACK decision on an incident that linked to nothing is 409 ERR_NO_LINKED_RELEASE, a NO_ACTION decision on the same SEV3 incident succeeds, and repeating it is 409 ERR_INCIDENT_ALREADY_DECIDED rather than a silent no-op."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; train core-train has no cut release, so incident linkage resolves to null."
            - "One SEV3 incident detected at 2026-08-01T00:00:00Z with linked_release_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /incidents"
              payload: { title: "Noisy alert with no recent release", severity: "SEV3", detected_at: "2026-08-01T00:00:00Z", release_train_id: "${train_id}" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { inc_id: "$.data.id", linked: "$.data.linked_release_id" }
          trigger:
            - call: "POST /incidents/${inc_id}/decide"
              payload: { decision: "ROLLBACK" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_link: "$.data.error_id" }
            - call: "POST /incidents/${inc_id}/decide"
              payload: { decision: "NO_ACTION" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { inc_state: "$.data.state" }
            - call: "POST /incidents/${inc_id}/decide"
              payload: { decision: "FORWARD_FIX" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_again: "$.data.error_id" }
          assert:
            - "Incident.${inc_id}.linked_release_id == null and linked_deployment_id == null at creation"
            - "The ROLLBACK attempt returns HTTP 409 with error_id ERR_NO_LINKED_RELEASE and leaves state OPEN"
            - "The NO_ACTION decision returns HTTP 200 with Incident.${inc_id}.state == DECIDED and decision == NO_ACTION"
            - "Incident.${inc_id}.decided_at == 2026-08-01T00:00:00Z"
            - "The FORWARD_FIX attempt returns HTTP 409 with error_id ERR_INCIDENT_ALREADY_DECIDED"
            - "Incident.${inc_id}.decision is still NO_ACTION"

