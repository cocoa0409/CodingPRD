      - name: participant_cleansing_refuses_a_fourth_address_search
        claim_type: triggerable
        grounds:
          - errors.ERR_ADDRESS_SEARCH_TIER_EXHAUSTED
          - state_machines.ParticipantRecord.address_status
          - calculations.data_confidence_score
        distinguishing_aspect: |
          The tier ladder is a hard three: after three consecutive NO_MATCH searches
          the participant is UNLOCATABLE with address_search_attempts == 3, and a
          fourth attempt is ERR_ADDRESS_SEARCH_TIER_EXHAUSTED rather than a silent
          no-op or a fourth increment — even when that fourth search would have found
          the participant, which is the tempting shortcut to allow.
        test_recipe:
          setup:
            - "one plan and one participant searched three times with NO_MATCH"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
