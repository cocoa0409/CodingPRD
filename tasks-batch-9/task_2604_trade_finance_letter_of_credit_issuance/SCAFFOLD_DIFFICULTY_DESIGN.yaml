            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${f2_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Istanbul", presentation_period_days: 21 }
              as: TradeFinanceOfficer
