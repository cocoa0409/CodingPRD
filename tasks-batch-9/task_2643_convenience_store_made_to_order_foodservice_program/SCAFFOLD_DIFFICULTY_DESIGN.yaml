      - name: refund_reverses_final_points_while_lifetime_earned_and_tier_stay_put
        grounds:
          - state_machines.Order.SETTLED_to_REFUNDED
          - state_machines.Order.AUTHORIZED_to_SETTLED
          - calculations.loyalty_points_invariant
          - calculations.loyalty_points_accrual
          - calculations.loyalty_tier_derivation
          - entities.LoyaltyAccount.fields.points_reversed_total
          - entities.LoyaltyAccount.fields.lifetime_points_earned
        distinguishing_aspect: |
          A DELIBERATELY ASYMMETRIC compensation: the refund claws back points_final 11 into
          points_reversed_total, but lifetime_points_earned stays at 506 and the tier stays PLUS even
          though the member is back to a 495 balance that would only qualify as BASIC. The invariant
          506 - 0 - 11 = 495 is what has to hold, not a full unwind. An implementation that decrements
          lifetime_points_earned lands on the right balance by the wrong route and demotes the tier, and one
          that reverses points_provisional 8 instead of points_final 11 leaves a 3-point drift.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in LUNCH with a PUBLISHED plan for 2026-08-01"
            - "loyalty member WAWA-M-495 seeded to lifetime_points_earned 495 and points_balance 495 by an admin adjustment, so the tier is BASIC and sits 5 points below PLUS_THRESHOLD"
            - "one TOUCHSCREEN order for that member with a single Italian Hoagie line, total 899, no promotion and no service fee"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "WAWA-M-495", email: "member495@example.com" }
              as: ChainAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 495, reason: "MIGRATION_OPENING_BALANCE" }
              as: ChainAdmin
              captures: { seed_tier: $.data.tier, seed_balance: $.data.points_balance, seed_lifetime: $.data.lifetime_points_earned }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN", loyalty_account_id: "${acct_id}" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { total: $.data.total_cents, prov: $.data.points_provisional }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: ChainAdmin
              captures: { tier_after_place: $.data.tier, bal_after_place: $.data.points_balance }
            - call: "POST /orders/${order_id}/authorize"
              payload: { tender_type: "CARD" }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/settle"
              payload: {}
              as: StoreTerminal
              captures: { fin: $.data.points_final, ss_settled: $.data.settlement_status }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: ChainAdmin
              captures: { bal_settled: $.data.points_balance, life_settled: $.data.lifetime_points_earned }
          trigger:
            - call: "POST /orders/${order_id}/refund"
              payload: { reason: "QUALITY_COMPLAINT" }
              as: StoreManager
              captures: { ss_refunded: $.data.settlement_status }
          assert:
            - "${seed_tier} == BASIC"
            - "${seed_balance} == 495"
            - "${seed_lifetime} == 495"
            - "${total} == 899"
            - "${prov} == 8"
            - "${bal_after_place} == 503"
            - "${tier_after_place} == PLUS"
            - "${fin} == 11"
            - "${ss_settled} == SETTLED"
            - "${bal_settled} == 506"
            - "${life_settled} == 506"
            - "${ss_refunded} == REFUNDED"
            - "Order.${order_id}.production_status == READY"
            - "Order.${order_id}.points_provisional == 8"
            - "Order.${order_id}.points_final == 11"
            - "LoyaltyAccount.${acct_id}.points_balance == 495"
            - "LoyaltyAccount.${acct_id}.points_reversed_total == 11"
            - "LoyaltyAccount.${acct_id}.lifetime_points_earned == 506"
            - "LoyaltyAccount.${acct_id}.lifetime_points_redeemed == 0"
            - "LoyaltyAccount.${acct_id}.tier == PLUS"
