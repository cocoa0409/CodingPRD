# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Fixture conventions: logical clock starts at 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_patient_portion
        grounds:
          - calculations.claim_benefit_estimate
          - calculations.claim_final_settlement
          - entities.Claim.fields.estimated_patient_portion_cents
          - entities.Claim.fields.final_patient_portion_cents
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: |
          Same claim, two algorithms on the Claim/Payment domain: the pre-service
          estimate yields estimated_patient_portion_cents == 74500, while the EOB
          final settlement yields final_patient_portion_cents == 79500 (they differ).
        test_recipe:
          setup:
            - "Plan P1: annual max 150000, deductible 5000 on {BASIC,MAJOR}, prev/basic/major = 100/80/50."
            - "Procedures D2740 CROWN(MAJOR ucr 120000), D1110 PROPHY(PREV ucr 10000, freq 2)."
            - "Verified coverage; claim lines crown 130000 + prophy 12000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BillingManager
            - call: "POST /patients"
              payload: { full_name: "Pat One", date_of_birth: "1980-01-01", email: "p1@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, deductible_applies_to: ["BASIC","MAJOR"], preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /procedures"
              payload: { cdt_code: "D1110", description: "Prophy", category: "PREVENTIVE", ucr_fee_cents: 10000, frequency_limit_per_year: 2 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-10", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 }, { cdt_code: "D1110", billed_fee_cents: 12000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { est_ins: $.data.estimated_insurance_cents, est_pat: $.data.estimated_patient_portion_cents }
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 62500, claim_id: "${claim_id}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 110000, paid_cents: 52500, deductible_applied_cents: 5000 }, { cdt_code: "D1110", allowed_cents: 10000, paid_cents: 10000, deductible_applied_cents: 0 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
          assert:
            - "Claim.${claim_id}.estimated_insurance_cents == 67500"
            - "Claim.${claim_id}.estimated_patient_portion_cents == 74500"
            - "Claim.${claim_id}.paid_insurance_cents == 62500"
            - "Claim.${claim_id}.final_patient_portion_cents == 79500"
            - "Claim.${claim_id}.estimated_patient_portion_cents (74500) != Claim.${claim_id}.final_patient_portion_cents (79500)"

      - name: cob_standard_vs_non_duplication
        grounds:
          - calculations.cob_secondary_benefit
          - entities.InsurancePlan.fields.cob_method
          - entities.Claim.fields.primary_claim_id
          - entities.Claim.fields.estimated_insurance_cents
        distinguishing_aspect: |
          On the Coverage/secondary-Claim domain, identical secondary inputs give
          estimated_insurance_cents == 57500 under STANDARD COB but == 0 under
          NON_DUPLICATION COB (max(0, normal 57500 − primary 57500)).
        test_recipe:
          setup:
            - "Primary plan PA + secondary plans S_STD (STANDARD) and S_NON (NON_DUPLICATION), all major 50 / ded 5000 / crown ucr 120000."
            - "Primary crown claim adjudicated with paid_insurance 57500; two secondary claims off the same primary."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cob", date_of_birth: "1980-01-01", email: "cob@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "PrimaryCo", plan_name: "PA", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50, cob_method: "STANDARD" }
              as: BillingManager
              captures: { pa_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "SecStd", plan_name: "S_STD", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50, cob_method: "STANDARD" }
              as: BillingManager
              captures: { sstd_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "SecNon", plan_name: "S_NON", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50, cob_method: "NON_DUPLICATION" }
              as: BillingManager
              captures: { snon_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${pa_id}", priority: "PRIMARY", subscriber_id: "SA", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { covp_id: $.data.id, covp_v: $.data.version }
            - call: "POST /coverages/${covp_id}/verifications"
              payload: { expected_coverage_version: "${covp_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${sstd_id}", priority: "SECONDARY", subscriber_id: "SB", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { covs1_id: $.data.id, covs1_v: $.data.version }
            - call: "POST /coverages/${covs1_id}/verifications"
              payload: { expected_coverage_version: "${covs1_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${snon_id}", priority: "SECONDARY", subscriber_id: "SC", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { covs2_id: $.data.id, covs2_v: $.data.version }
            - call: "POST /coverages/${covs2_id}/verifications"
              payload: { expected_coverage_version: "${covs2_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${covp_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { c0: $.data.id }
            - call: "POST /claims/${c0}/submit"
              as: Biller
              as_user_id: "biller_alice"
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 57500, claim_id: "${c0}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 120000, paid_cents: 57500, deductible_applied_cents: 5000 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${covs1_id}", primary_claim_id: "${c0}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${covs2_id}", primary_claim_id: "${c0}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /claims/${c1}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { s1_ins: $.data.estimated_insurance_cents }
            - call: "POST /claims/${c2}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { s2_ins: $.data.estimated_insurance_cents }
          assert:
            - "Claim.${c1}.estimated_insurance_cents == 57500"
            - "Claim.${c2}.estimated_insurance_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_nonlinear_estimate_mode_a
        grounds:
          - calculations.claim_benefit_estimate
          - entities.InsurancePlan.fields.deductible_applies_to
          - entities.Procedure.fields.category
        distinguishing_aspect: |
          Mode (a): >=3 interacting inputs with nested min/max and a conditional
          deductible branch keyed on category — crown = (min(130000,120000)−5000)*50%
          = 57500, prophy = min(12000,10000)*100% = 10000, summed to 67500.
        test_recipe:
          setup:
            - "Same P1 plan/verification as estimate_vs_final; crown 130000 + prophy 12000 claim."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat A", date_of_birth: "1980-01-01", email: "a@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, deductible_applies_to: ["BASIC","MAJOR"], preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /procedures"
              payload: { cdt_code: "D1110", description: "Prophy", category: "PREVENTIVE", ucr_fee_cents: 10000, frequency_limit_per_year: 2 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 }, { cdt_code: "D1110", billed_fee_cents: 12000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { est_ins: $.data.estimated_insurance_cents }
          assert:
            - "Claim.${claim_id}.estimated_insurance_cents == 67500"
            - "Claim.${claim_id}.total_billed_cents == 142000"

      - name: per_line_rounding_order_mode_b
        grounds:
          - calculations.claim_benefit_estimate
          - entities.Claim.fields.estimated_insurance_cents
        distinguishing_aspect: |
          Mode (b): round-per-line-then-sum is pinned — two MAJOR lines give
          round(6172.5)+round(3394.5) = 6173+3395 = 9568, NOT sum-then-round
          (6172.5+3394.5=9567.0 -> 9567). The scaffold requires 9568.
        test_recipe:
          setup:
            - "Plan P2: deductible 0, deductible_applies_to [], major 50, annual max 1000000."
            - "Procedures D2000A(MAJOR ucr 12345), D2000B(MAJOR ucr 6789); claim bills them at ucr."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat B", date_of_birth: "1980-01-01", email: "b@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Rnd", plan_name: "P2", annual_maximum_cents: 1000000, deductible_cents: 0, deductible_applies_to: [], major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2000A", description: "MajA", category: "MAJOR", ucr_fee_cents: 12345 }
              as: BillingManager
            - call: "POST /procedures"
              payload: { cdt_code: "D2000B", description: "MajB", category: "MAJOR", ucr_fee_cents: 6789 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S2", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 1000000, verified_deductible_cents: 0, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2000A", billed_fee_cents: 12345 }, { cdt_code: "D2000B", billed_fee_cents: 6789 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { est_ins: $.data.estimated_insurance_cents }
          assert:
            - "Claim.${claim_id}.estimated_insurance_cents == 9568"
            - "Claim.${claim_id}.estimated_patient_portion_cents == 9566"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_denied_appealed_adjudicated_cycle
        grounds:
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_ADJUDICATED
          - entities.Claim.fields.appeal_count
        distinguishing_aspect: |
          Claim is cyclic: SUBMITTED->DENIED->APPEALED->ADJUDICATED revisits the
          ADJUDICATED family after a loop, with appeal_count incremented to 1.
        test_recipe:
          setup:
            - "Verified primary coverage; crown claim submitted then denied, then appealed, then paid."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cyc", date_of_birth: "1980-01-01", email: "cyc@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 0, claim_id: "${claim_id}", is_denial: true }
              as: BillingManager
              as_user_id: "mgr_bob"
          trigger:
            - call: "POST /claims/${claim_id}/appeal"
              as: Biller
              captures: { st_app: $.data.status, ac: $.data.appeal_count }
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 57500, claim_id: "${claim_id}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 120000, paid_cents: 57500, deductible_applied_cents: 5000 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
          assert:
            - "Claim.${claim_id}.status == APPEALED immediately after appeal"
            - "Claim.${claim_id}.appeal_count == 1"
            - "Claim.${claim_id}.status == ADJUDICATED after the post-appeal EOB"
            - "Claim.${claim_id}.paid_insurance_cents == 57500"

      - name: membership_active_pastdue_active_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_PAST_DUE
          - state_machines.Membership.PAST_DUE_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: |
          Membership is cyclic on a different entity: ACTIVE->PAST_DUE (billing)
          ->ACTIVE (dues payment), balance returning to 0 after the loop.
        test_recipe:
          setup:
            - "MembershipPlan annual 30000 MONTHLY (period fee 2500); enroll at 2026-05-01; overdue after grace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingManager
            - call: "POST /patients"
              payload: { full_name: "Pat Mem", date_of_birth: "1980-01-01", email: "mem@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /membership-plans"
              payload: { name: "Basic", annual_fee_cents: 30000, billing_period: "MONTHLY" }
              as: BillingManager
              captures: { mp_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pid}", membership_plan_id: "${mp_id}", period_start: "2026-05-01", period_end: "2027-05-01" }
              as: FrontOffice
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: BillingManager
            - call: "POST /billing/run"
              as: BillingManager
          trigger:
            - call: "POST /memberships/${mem_id}/pay"
              payload: { amount_cents: 2500 }
              as: Patient
              as_user_id: "${pid}"
              captures: { st: $.data.status, bal: $.data.balance_cents }
          assert:
            - "Membership.${mem_id}.status == PAST_DUE with balance_cents == 2500 after billing/run"
            - "Membership.${mem_id}.status == ACTIVE with balance_cents == 0 after pay"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: insurance_posting_cascade_payment_claim_patientbalance_patientstatus
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - calculations.patient_balance
          - entities.Patient.fields.balance_cents
          - entities.Patient.fields.status
        distinguishing_aspect: |
          Depth-3 transitive chain from POST /payments (NOT a parallel fan-out):
          Payment -> Claim (ADJUDICATED, final_patient_portion 72500) -> Patient.balance_cents
          (72500, caused by the claim's final portion) -> Patient.status (COLLECTIONS,
          caused by balance crossing 50000). Each link is caused by the previous.
          Coverage.benefits_used_cents == 57500 is a corroborating side effect, not part of the chain.
        test_recipe:
          setup:
            - "Verified coverage; crown claim 130000 submitted; single INSURANCE EOB posts 57500."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cas", date_of_birth: "1980-01-01", email: "cas@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, deductible_cents: 5000, major_coinsurance_pct: 50 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
          trigger:
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 57500, claim_id: "${claim_id}", is_denial: false, eob_lines: [ { cdt_code: "D2740", allowed_cents: 120000, paid_cents: 57500, deductible_applied_cents: 5000 } ] }
              as: BillingManager
              as_user_id: "mgr_bob"
          assert:
            - "Link1: Claim.${claim_id}.status == ADJUDICATED, final_patient_portion_cents == 72500"
            - "Link2: Patient.${pid}.balance_cents == 72500 (caused by the claim's final portion)"
            - "Link3: Patient.${pid}.status == COLLECTIONS (caused by balance 72500 > 50000)"
            - "Corroborating: Coverage.${cov_id}.benefits_used_cents == 57500"

