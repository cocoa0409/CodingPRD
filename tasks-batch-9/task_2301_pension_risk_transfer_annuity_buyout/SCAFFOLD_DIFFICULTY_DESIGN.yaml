          The SAME asset-transfer payload — IN_KIND, gross 12000000, three security
          lots, expense 225000, credited 11775000, shortfall 25000 against a
          locked premium of 11800000 — produces two different errors depending
          only on the tranche's own state: while the tranche is PRICING_LOCKED the
          priority-72 fiscal check fires with ERR_TRANSFER_VALUE_SHORTFALL, and
          once the tranche has reached SETTLED the priority-40 state check fires
