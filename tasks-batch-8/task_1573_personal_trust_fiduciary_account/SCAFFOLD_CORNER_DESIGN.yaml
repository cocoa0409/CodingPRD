      - name: cross_trust_reference_rejected_with_valid_purpose
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CROSS_TRUST_REFERENCE]"]
        distinguishing_aspect: "FK integrity across aggregates: with a DISCRETIONARY target trust (purpose passes safety), a beneficiary_id from another trust fails with ERR_CROSS_TRUST_REFERENCE."
