  - section: endpoints
    instances:
      - name: screening_room_calibrate_refreshes_derived_calibration_status
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /studio/screening-rooms/{id}/calibrate]
          - entities.ScreeningRoom.fields.calibration_status
          - validations[priority=19]
        distinguishing_aspect: |
          calibration_status is never stored: it is re-derived from last_calibrated_at against the clock on
          every read, so the same row reads CALIBRATED, then EXPIRED after the validity window lapses, then
          CALIBRATED again after a second calibrate — and session start follows that derived value.
        test_recipe:
          setup:
            - "screening room SCREEN_1 has calibration_valid_days 30 and has never been calibrated"
            - "production AD01 is PRODUCTION_ACTIVE so that sessions may be started"
          setup_api_calls:
            - call: "POST /studio/screening-rooms"
              payload: { name: "SCREEN_1", seat_capacity: 12, room_color_space: "ACEScg", calibration_valid_days: 30 }
