          trigger:
            - call: "GET /portal/services/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: PlatformAdmin
              captures: { e_svc: $.data.error_id }
            - call: "GET /portal/settlement-batches/00000000-0000-4000-8000-0000000000a2"
              payload: {}
              as: PlatformAdmin
              captures: { e_batch: $.data.error_id }
