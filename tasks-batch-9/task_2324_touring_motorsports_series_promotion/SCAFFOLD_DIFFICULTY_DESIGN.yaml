              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_pit}", purchaser_name: "Rounding Group", purchaser_email: "rounding@example.com", qty: 21, is_group: true, pit_party_addon_qty: 21, expected_ticket_tier_version: "${pit_v}" }
              as: TicketingManager
              captures: { order_r: "$.data.id" }
          assert:
            - "TicketOrder.${order_r}.line_subtotal_cents == 99750"
            - "TicketOrder.${order_r}.group_discount_cents == 12469"
            - "TicketOrder.${order_r}.addon_subtotal_cents == 51450"
            - "TicketOrder.${order_r}.addon_discount_cents == 7718"
            - "TicketOrder.${order_r}.facility_fee_cents == 7350"
            - "TicketOrder.${order_r}.total_cents == 138363 (an implementation that sums the raw discounts and rounds once returns 138364)"
            - "TicketOrder.${order_r}.status == PENDING and TicketTier.${tier_pit}.reserved_seat_count == 21"

      - name: coop_credit_rate_keyed_on_pre_credit_total_at_the_inclusive_boundary
        grounds:
          - calculations.venue_settlement_due
          - entities.EventSettlement.fields.rental_due_pre_credit_cents
          - entities.EventSettlement.fields.coop_credit_pct
          - entities.EventSettlement.fields.venue_due_cents
          - global_constants.MARKETING_COOP_TIERS
        distinguishing_aspect: |
          Mode (c) — an interaction the naive ordering gets wrong. The co-op credit RATE is selected
          from rental_due_pre_credit_cents, the very figure the credit then reduces. The DAL fixture
          lands pre-credit on exactly 5000000, the inclusive floor of the 0.06 band, so the credit is
          300000 and venue_due_cents is 4700000. Selecting the rate from the post-credit figure
