      - name: patch_rejects_fair_housing_language
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FAIR_HOUSING_VIOLATION]"]
        distinguishing_aspect: "PATCH on an editable DRAFT listing with a prohibited phrase is rejected and leaves version unchanged."
        test_recipe:
          setup: ["DRAFT listing (version 1)"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id, lv: $.data.version } }
          trigger:
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", marketing_remarks: "No children allowed" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FAIR_HOUSING_VIOLATION with http 422; Listing.version still ${lv}"

