            - call: "POST /culinary/price-change-proposals"
              payload: { menu_item_id: "${mi_id}", proposed_price_cents: 420, effective_from: "2026-09-01T00:00:00.000Z", elasticity_bps: 12000 }
              as: RecipeDeveloper
