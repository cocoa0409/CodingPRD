  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + meta.api_request_timestamp + response_type 'object' + data; the 404 error has response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["Shipper ACME exists"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "GET /air-freight/shippers/${sh1}", as: ClaimsAdjuster }
            - { call: "GET /air-freight/shippers/00000000-0000-4000-8000-0000000000ff", as: ClaimsAdjuster, captures: { err: "$.data.error_id" } }
          assert:
            - "success response: meta.api_request_id and meta.api_request_timestamp present, response_type == 'object', data.account_code == 'ACME'"
            - "error response: response_type == 'error', captured ${err} == ERR_SHIPPER_NOT_FOUND, data.message present"

      - name: fk_reverse_listings_return_children
