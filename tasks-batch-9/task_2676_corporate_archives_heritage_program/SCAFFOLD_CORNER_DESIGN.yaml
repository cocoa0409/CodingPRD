              as: ArchivesDirector
              as_user_id: "director-b"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_DUPLICATE_RESOURCE_KEY"
            - "RetentionSchedule.${sched_id}.retention_years == 7"
            - "RetentionSchedule.${sched_id}.disposition_action == DESTROY"
            - "RetentionSchedule.${sched_id}.min_appraisal_score_for_permanent == 85.00"
            - "GET /retention-schedules/${sched_id} response data contains no version field and no updated_at field"
            - "GET /retention-schedules returns total_count == 1"

