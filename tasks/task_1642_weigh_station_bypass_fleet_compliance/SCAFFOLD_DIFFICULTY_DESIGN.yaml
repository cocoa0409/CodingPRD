        distinguishing_aspect: |
          Depth-4 chain from adjudicate-OVERTURNED (different trigger than the snapshot cascade): dispute ->
          Carrier.credit_ledger append +3000 (link 2) -> auto-apply sweep finds the PAST_DUE invoice covered and
          marks it PAID with a -1799 ledger entry (link 3) -> with no PAST_DUE invoices left, the subscription's
          payment_standing flips PAST_DUE -> CURRENT (link 4).
        test_recipe:
          setup:
