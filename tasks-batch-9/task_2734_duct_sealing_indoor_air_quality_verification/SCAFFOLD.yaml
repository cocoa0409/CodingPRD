# =============================================================================
# task_2734 — Duct Sealing & Indoor Air Quality Verification (Aeroseal dealer)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2734. Duct Sealing & Indoor Air Quality Verification (Aeroseal dealer): pre-test duct leakage measurement and system pressurization setup, register masking and sealing-run monitoring with real-time leakage curve, safety cutoffs for gas appliances and combustion spillage testing, post-test verification report and guarantee thresholds, comfort complaint diagnosis and room-by-room airflow balancing, utility program rebate documentation and inspector verification, retrofit exclusions for damaged or asbestos-containing ductwork, warranty registration and follow-up re-test

domain_name: duct-sealing-iaq
api_prefix: /duct-sealing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity is nested more than
  # one segment deep under another in any URL. Every child is discoverable via a
  # filtered list or a single sub-resource list, never by a 3-level path.

  state_machine_shape: cyclic
  # SealJob INJECTING <-> PAUSED, RebateClaim SUBMITTED <-> RETURNED_FOR_CORRECTION,
  # VerificationReport ISSUED <-> CORRECTION_REQUIRED, ComfortComplaint
  # BALANCING <-> DIAGNOSED. DuctSystem additionally carries two independent
  # state dimensions (eligibility_status x seal_status) on the same row.

  relationship_patterns:
    - one_to_many
    - self_referential      # SealJob.retest_of_job_id -> SealJob.id
    - cross_aggregate       # LeakageTest normalization reads Project.conditioned_floor_area_sqft

  role_model: segregation_of_duties
  # The QAVerifier who signs a VerificationReport must not be the Technician who
  # ran the SealJob, and the UtilityInspector who spot-checks a RebateClaim must
  # not be the QAVerifier who issued the underlying report.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_placement: "On every response_type == 'array' response the four pagination_fields are returned inside meta (meta.limit, meta.offset, meta.total_count, meta.has_more) alongside api_request_id and api_request_timestamp; data stays a bare array of rows. total_count is the size of the FILTERED population, not of the returned page, and has_more is (offset + returned_row_count) < total_count."

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: UtilityProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Utility duct-sealing program name" }
      - { name: rebate_basis, type: enum, source: input, description: "Which candidate amount becomes the rebate base", constraints: "PER_CFM | PERCENT_OF_INVOICE | LESSER_OF_BOTH" }
      - { name: rate_cents_per_cfm_reduced, type: integer, source: input, description: "Cents paid per whole-house CFM25 of leakage removed", constraints: ">= 0" }
      - { name: pct_of_invoice_bps, type: integer, source: input, description: "Basis points of Project.invoice_amount_cents used by the PERCENT_OF_INVOICE candidate", constraints: "0..10000" }
      - { name: cap_cents, type: integer, source: input, description: "Per-claim ceiling applied to the bonused subtotal", constraints: ">= 0" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Total program budget available to commit and pay", constraints: ">= 0" }
      - { name: min_reduction_pct, type: number, source: input, description: "Minimum reduction percentage the program will fund and the guarantee threshold it imposes", constraints: "0.00..100.00, 2 decimals" }
      - { name: requires_inspector_verification, type: boolean, source: input, default: true, description: "When true a RebateClaim cannot be paid before an inspector spot check" }
      - { name: combustion_safety_required, type: boolean, source: input, default: true, description: "When true POST-phase combustion tests gate report issuance" }
      - { name: committed_rebate_cents, type: integer, source: computed, default: 0, description: "Sum of payable_cents over RebateClaim rows with utility_program_id == this.id AND status IN {SUBMITTED, APPROVED}" }
      - { name: paid_rebate_cents, type: integer, source: computed, default: 0, description: "Sum of payable_cents over RebateClaim rows with utility_program_id == this.id AND status == PAID" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "= annual_budget_cents - committed_rebate_cents - paid_rebate_cents" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician legal name" }
      - { name: license_number, type: string, source: input, description: "Dealer license identifier; unique across Technician rows" }
      - { name: certification_status, type: enum, source: input, default: PENDING, description: "Aeroseal certification standing", constraints: "PENDING | ACTIVE | SUSPENDED | REVOKED" }
      - { name: certification_expires_at, type: datetime, source: input, description: "ISO 8601 UTC instant at which ACTIVE certification stops being honoured; null when never certified" }
      - { name: open_seal_job_count, type: integer, source: computed, default: 0, description: "Count of SealJob rows with technician_id == this.id AND status IN {SCHEDULED, MASKING, INJECTING, PAUSED}" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: utility_program_id, type: string, source: input, description: "FK -> UtilityProgram.id; null for a self-funded retrofit with no rebate program" }
      - { name: address_line, type: string, source: input, description: "Dwelling street address" }
      - { name: conditioned_floor_area_sqft, type: integer, source: input, description: "Conditioned floor area used to normalize leakage per 100 sqft", constraints: ">= 100" }
      - { name: gas_appliance_count, type: integer, source: input, description: "Number of atmospherically vented combustion appliances in the dwelling", constraints: ">= 0" }
      - { name: invoice_amount_cents, type: integer, source: input, description: "Retrofit invoice total used by the PERCENT_OF_INVOICE rebate candidate", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Project posture", constraints: "ACTIVE | SAFETY_HOLD" }
      - { name: safety_hold, type: boolean, source: computed, default: false, description: "True while status == SAFETY_HOLD; blocks new SealJob creation and RebateClaim submission project-wide" }
      - { name: safety_hold_reason, type: string, source: computed, description: "Free text stamped when safety_hold flips true; null while false" }
      - { name: duct_system_count, type: integer, source: computed, default: 0, description: "Count of DuctSystem rows with project_id == this.id, regardless of eligibility" }
      - { name: eligible_duct_system_count, type: integer, source: computed, default: 0, description: "Count of DuctSystem rows with project_id == this.id AND eligibility_status == ELIGIBLE" }

  - name: DuctSystem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; taken from the creation path, never from the body" }
      - { name: system_label, type: string, source: input, description: "Air handler / system label, e.g. AHU-1" }
      - { name: total_register_count, type: integer, source: input, description: "Supply and return registers that must be masked before injection", constraints: ">= 1" }
      - { name: design_cfm, type: number, source: input, description: "Design airflow of the system in CFM", constraints: "> 0" }
      - { name: duct_material, type: enum, source: input, description: "Duct construction", constraints: "SHEET_METAL | FLEX | DUCT_BOARD | ASBESTOS_WRAP" }
      - { name: condition_grade, type: enum, source: input, description: "Field condition assessment", constraints: "A | B | C | FAIL" }
      - { name: asbestos_screening_result, type: enum, source: system, default: PENDING, description: "Lab screening outcome", constraints: "PENDING | CLEARED | SUSPECT | CONFIRMED" }
      - { name: lab_reference, type: string, source: system, description: "Lab report identifier recorded with the screening result; null before screening" }
      - { name: eligibility_status, type: enum, source: system, default: PENDING_SCREENING, description: "Retrofit eligibility dimension (independent of seal_status)", constraints: "PENDING_SCREENING | ELIGIBLE | EXCLUDED" }
      - { name: exclusion_reason, type: enum, source: system, description: "Why the system was excluded from the retrofit; null while eligibility_status != EXCLUDED", constraints: "ASBESTOS_CONFIRMED | STRUCTURAL_DAMAGE | MATERIAL_NOT_SEALABLE | INACCESSIBLE" }
      - { name: seal_status, type: enum, source: system, default: SEAL_PENDING, description: "Sealing progress dimension (independent of eligibility_status)", constraints: "SEAL_PENDING | SEALING | SEALED | VERIFIED" }
      - { name: baseline_leakage_cfm25, type: number, source: computed, description: "normalized_leakage_cfm25 of the most recently ACCEPTED PRE-phase LeakageTest for this system (tie-break: greatest created_at); null until one exists" }
      - { name: working_leakage_cfm25, type: number, source: computed, description: "Live leakage of the system: baseline while no sealing has been recorded, else the current_leakage_cfm of the SealJob that last reached SEALED or is INJECTING/PAUSED" }
      - { name: sealed_leakage_reduction_cfm, type: number, source: computed, default: 0.00, description: "= baseline_leakage_cfm25 - working_leakage_cfm25; conserved-quantity ledger for the sealing invariant" }
      - { name: active_seal_job_id, type: string, source: computed, description: "Computed pointer (not a declared FK; discover via GET /duct-sealing/seal-jobs?duct_system_id=...) to the SealJob on this system whose status IN {SCHEDULED, MASKING, INJECTING, PAUSED}; null when none" }

  - name: LeakageTest
    parent: null
    common_fields: true
    fields:
      - { name: duct_system_id, type: string, source: input, description: "FK -> DuctSystem.id; the system under test" }
      - { name: phase, type: enum, source: input, description: "Whether this is the pre-seal baseline or the post-seal verification measurement", constraints: "PRE | POST" }
      - { name: method, type: enum, source: input, description: "Measurement rig used", constraints: "PRESSURE_PAN | DUCT_BLASTER | AEROSEAL_INTERNAL" }
      - { name: window_start_at, type: datetime, source: input, description: "ISO 8601 UTC start of the reserved test window on the duct system" }
      - { name: window_end_at, type: datetime, source: input, description: "ISO 8601 UTC end of the reserved test window; must be strictly after window_start_at" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Test lifecycle", constraints: "DRAFT | PRESSURIZED | RECORDED | ACCEPTED | REJECTED" }
      - { name: test_pressure_pa, type: number, source: input, description: "Pressurization setpoint supplied by POST /leakage-tests/{id}/pressurize; null while DRAFT", constraints: "10..100" }
      - { name: fan_ring_config, type: enum, source: input, description: "Calibrated fan ring installed at pressurization; null while DRAFT", constraints: "RING_1 | RING_2 | RING_3" }
      - { name: masked_register_count, type: integer, source: input, description: "Registers masked for the measurement, supplied at pressurization; null while DRAFT", constraints: ">= 0" }
      - { name: measured_leakage_cfm, type: number, source: input, description: "Raw fan flow at test_pressure_pa supplied by POST /leakage-tests/{id}/record; null before RECORDED", constraints: ">= 0" }
      - { name: ambient_temp_f, type: number, source: input, description: "Ambient temperature logged with the measurement; null before RECORDED" }
      - { name: normalized_leakage_cfm25, type: number, source: computed, description: "Power-law normalization of measured_leakage_cfm to 25 Pa, 2 decimals; see calculations.normalized_duct_leakage" }
      - { name: leakage_per_100_sqft, type: number, source: computed, description: "normalized_leakage_cfm25 per 100 sqft of Project.conditioned_floor_area_sqft, 2 decimals" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the FieldTechnician who recorded the measurement (equals a Technician.id per §1.7 identity); null before RECORDED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the QAVerifier who accepted or rejected the test; null before review" }
      - { name: review_note, type: string, source: system, description: "Reviewer note captured at review; null before review" }

  - name: SealJob
    parent: null
    common_fields: true
    fields:
      - { name: duct_system_id, type: string, source: input, description: "FK -> DuctSystem.id; the system being sealed" }
      - { name: pre_test_id, type: string, source: input, description: "FK -> LeakageTest.id; must be an ACCEPTED PRE-phase test whose duct_system_id equals this.duct_system_id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the certified technician who owns the run" }
      - { name: retest_of_job_id, type: string, source: input, description: "FK -> SealJob.id; set only when this run is the follow-up re-test of an earlier job, else null" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO 8601 UTC start of the technician's booked slot" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "ISO 8601 UTC end of the technician's booked slot; must be strictly after scheduled_start_at" }
      - { name: target_leakage_cfm, type: number, source: input, description: "Leakage value at or below which the run may be completed", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Run lifecycle", constraints: "SCHEDULED | MASKING | INJECTING | PAUSED | SEALED | VERIFIED | RETEST_REQUIRED | RETEST_CLOSED | ABORTED_MANUAL | ABORTED_SAFETY | ABORTED_EXCLUSION | ABORTED_SUPERSEDED" }
      - { name: masked_register_labels, type: array, source: computed, default: [], description: "Distinct register labels currently masked, appended in call order by POST /seal-jobs/{id}/masks" }
      - { name: masked_register_count, type: integer, source: computed, default: 0, description: "= length of masked_register_labels" }
      - { name: sample_count, type: integer, source: computed, default: 0, description: "Count of LeakageSample rows with seal_job_id == this.id" }
      - { name: current_leakage_cfm, type: number, source: computed, description: "instantaneous_leakage_cfm of the LeakageSample with the greatest sample_seq for this job; null while sample_count == 0" }
      - { name: target_reached, type: boolean, source: computed, default: false, description: "Latched true once any LeakageSample has instantaneous_leakage_cfm <= target_leakage_cfm" }
      - { name: stall_flag, type: boolean, source: computed, default: false, description: "True while the 3-sample seal rate is below MIN_SEAL_RATE_CFM_PER_MIN; cleared by POST /seal-jobs/{id}/resume" }
      - { name: pause_count, type: integer, source: computed, default: 0, description: "Number of INJECTING -> PAUSED transitions this job has taken (manual and stall-triggered)" }
      - { name: sealant_lbs_used, type: number, source: system, description: "Sealant consumed, supplied at completion; null before SEALED" }
      - { name: abort_reason, type: string, source: system, description: "Reason stamped by any ABORTED_* transition; null otherwise" }
      - { name: warranty_suspended, type: boolean, source: computed, default: false, description: "Set true when the verification report backing this job is driven to CORRECTION_REQUIRED; cleared when that report returns to ISSUED" }
      - { name: warranty_status, type: enum, source: computed, default: NOT_REGISTERED, description: "Derived in this precedence order: (1) NOT_REGISTERED while warranty_registered_at is null; (2) SUSPENDED while warranty_suspended == true; (3) LAPSED when the logical clock is strictly after retest_due_at AND no SealJob with retest_of_job_id == this.id has status == VERIFIED or RETEST_CLOSED; (4) REGISTERED otherwise", constraints: "NOT_REGISTERED | REGISTERED | SUSPENDED | LAPSED" }
      - { name: warranty_registered_at, type: datetime, source: system, description: "Logical-clock instant at which the warranty was registered; null while NOT_REGISTERED" }
      - { name: retest_due_at, type: datetime, source: computed, description: "= warranty_registered_at + RETEST_INTERVAL_DAYS; null while NOT_REGISTERED" }
      - { name: homeowner_name, type: string, source: system, description: "Warranty registrant name; null before registration" }
      - { name: homeowner_email, type: string, source: system, description: "Warranty registrant email; null before registration" }

  - name: LeakageSample
    parent: null
    common_fields: false
    fields:
      - { name: seal_job_id, type: string, source: system, description: "FK -> SealJob.id; taken from the creation path" }
      - { name: sample_seq, type: integer, source: input, description: "1-based monotone position in the run's leakage curve; must equal SealJob.sample_count + 1", constraints: ">= 1" }
      - { name: elapsed_seconds, type: integer, source: input, description: "Seconds since injection start", constraints: ">= 0" }
      - { name: instantaneous_leakage_cfm, type: number, source: input, description: "Leakage reading at this point on the curve", constraints: ">= 0" }
      - { name: injection_pressure_pa, type: number, source: input, description: "Injection pressure at this point on the curve", constraints: ">= 0" }
      - { name: seal_rate_cfm_per_min, type: number, source: computed, description: "Three-sample backward rate, 2 decimals; null while sample_seq < 3" }
      - { name: cutoff_triggered, type: boolean, source: computed, default: false, description: "True when this sample tripped the injection-pressure safety cutoff" }

  - name: CombustionTest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; taken from the creation path" }
      - { name: appliance_label, type: string, source: input, description: "Appliance identifier, e.g. WH-1" }
      - { name: appliance_type, type: enum, source: input, description: "Appliance class selecting the CO and depressurization limits", constraints: "ATMOSPHERIC_WATER_HEATER | FURNACE | BOILER | RANGE" }
      - { name: phase, type: enum, source: input, description: "PRE gates injection start; POST gates report issuance", constraints: "PRE | POST" }
      - { name: spillage_seconds, type: integer, source: input, description: "Seconds of combustion spillage observed at the draft diverter", constraints: ">= 0" }
      - { name: co_ppm_air_free, type: number, source: input, description: "Air-free carbon monoxide in the flue, ppm", constraints: ">= 0" }
      - { name: draft_pressure_pa, type: number, source: input, description: "Measured draft pressure in Pa" }
      - { name: worst_case_depressurization_pa, type: number, source: input, description: "Worst-case room depressurization in Pa" }
      - { name: verdict, type: enum, source: computed, description: "See calculations.combustion_safety_verdict", constraints: "PASS | MARGINAL | FAIL" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the FieldTechnician who ran the test (equals a Technician.id per §1.7 identity)" }

  - name: VerificationReport
    parent: null
    common_fields: true
    fields:
      - { name: seal_job_id, type: string, source: input, description: "FK -> SealJob.id; the run being verified" }
      - { name: post_test_id, type: string, source: input, description: "FK -> LeakageTest.id; must be an ACCEPTED POST-phase test on the same duct_system_id as the seal job" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Report lifecycle", constraints: "DRAFT | ISSUED | CORRECTION_REQUIRED | VOIDED" }
      - { name: pre_leakage_cfm25, type: number, source: computed, description: "normalized_leakage_cfm25 of the seal job's pre_test_id, copied at report creation" }
      - { name: post_leakage_cfm25, type: number, source: computed, description: "normalized_leakage_cfm25 of post_test_id, copied at report creation" }
      - { name: reduction_pct_system_basis, type: number, source: computed, description: "Single-system reduction percentage, 2 decimals; variant SYSTEM_BASIS of calculations.leakage_reduction_basis" }
      - { name: reduction_pct_whole_house_basis, type: number, source: computed, description: "Project-wide reduction percentage over eligible systems, 2 decimals; variant WHOLE_HOUSE_BASIS of calculations.leakage_reduction_basis" }
      - { name: cfm_reduced_whole_house, type: number, source: computed, description: "Whole-house CFM25 removed, 2 decimals; the rebate quantity" }
      - { name: guarantee_threshold_pct, type: number, source: computed, description: "= UtilityProgram.min_reduction_pct of the project's program, or GUARANTEE_DEFAULT_MIN_PCT when Project.utility_program_id is null" }
      - { name: guarantee_met, type: boolean, source: computed, description: "= reduction_pct_system_basis >= guarantee_threshold_pct" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the QAVerifier who issued the report; null while DRAFT" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance; null while DRAFT" }
      - { name: signature_note, type: string, source: system, description: "Verifier signature note captured at issuance; null while DRAFT" }
      - { name: correction_round, type: integer, source: computed, default: 0, description: "Number of times this report has been driven ISSUED -> CORRECTION_REQUIRED" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: verification_report_id, type: string, source: input, description: "FK -> VerificationReport.id; must be ISSUED at claim creation" }
      - { name: utility_program_id, type: string, source: input, description: "FK -> UtilityProgram.id; must equal the project's utility_program_id" }
      - { name: documentation_bundle_ref, type: string, source: input, description: "Reference to the uploaded rebate documentation bundle" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Claim lifecycle", constraints: "SUBMITTED | APPROVED | RETURNED_FOR_CORRECTION | PAID | WITHDRAWN" }
      - { name: per_cfm_candidate_cents, type: integer, source: computed, description: "PER_CFM base candidate = round_half_up(rate_cents_per_cfm_reduced * cfm_reduced_whole_house)" }
      - { name: percent_of_invoice_candidate_cents, type: integer, source: computed, description: "PERCENT_OF_INVOICE base candidate = round_half_up(Project.invoice_amount_cents * pct_of_invoice_bps / 10000)" }
      - { name: basis_applied, type: enum, source: computed, description: "Which candidate became the base under the program's rebate_basis", constraints: "PER_CFM | PERCENT_OF_INVOICE" }
      - { name: tier_bonus_pct, type: number, source: computed, description: "Volume tier bonus selected from reduction_pct_whole_house_basis, 2 decimals" }
      - { name: capped_subtotal_cents, type: integer, source: computed, description: "min(bonused subtotal, UtilityProgram.cap_cents)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "= round_half_up(capped_subtotal_cents * ADMIN_FEE_RATE); computed after the cap, never before" }
      - { name: payable_cents, type: integer, source: computed, description: "= capped_subtotal_cents - admin_fee_cents" }
      - { name: committed, type: boolean, source: computed, default: true, description: "True while payable_cents is held against UtilityProgram.committed_rebate_cents (status IN {SUBMITTED, APPROVED})" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the UtilityInspector who spot-checked the claim; null before verification" }
      - { name: spot_check_leakage_cfm, type: number, source: system, description: "Inspector's raw re-measured leakage; null before verification" }
      - { name: spot_check_pressure_pa, type: number, source: system, description: "Pressure at which the inspector re-measured; null before verification" }
      - { name: spot_check_cfm25, type: number, source: computed, description: "Inspector reading normalized to 25 Pa, 2 decimals; null before verification" }
      - { name: inspector_variance_pct, type: number, source: computed, description: "Absolute percentage gap between spot_check_cfm25 and the report's post_leakage_cfm25, 2 decimals; null before verification" }
      - { name: inspector_outcome, type: enum, source: computed, default: PENDING, description: "Spot-check outcome", constraints: "PENDING | PASS | FAIL" }
      - { name: resubmission_count, type: integer, source: computed, default: 0, description: "Number of RETURNED_FOR_CORRECTION -> SUBMITTED transitions this claim has taken" }
      - { name: payment_reference, type: string, source: system, description: "Payment reference stamped at PAID; null otherwise" }

  - name: ComfortComplaint
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the dwelling the complaint belongs to" }
      - { name: room_label, type: string, source: input, description: "Room the homeowner complained about" }
      - { name: complaint_type, type: enum, source: input, description: "Complaint class", constraints: "TOO_HOT | TOO_COLD | NOISE | ODOR | DUST" }
      - { name: reported_by, type: string, source: input, description: "Name of the person who reported the complaint" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Complaint lifecycle", constraints: "OPEN | DIAGNOSED | BALANCING | RESOLVED" }
      - { name: diagnosis_code, type: enum, source: system, description: "Diagnosis recorded at OPEN -> DIAGNOSED; null while OPEN", constraints: "UNDERSIZED_BRANCH | DAMPER_MISADJUSTED | BLOCKED_REGISTER | EXCESS_BYPASS | RESIDUAL_LEAKAGE" }
      - { name: tolerance_pct, type: number, source: system, description: "Absolute room deviation tolerance set at diagnosis, 2 decimals; null while OPEN", constraints: "0.00..50.00" }
      - { name: balanced_room_count, type: integer, source: computed, default: 0, description: "Count of distinct room_label values whose latest AirflowReading has within_tolerance == true" }
      - { name: rebalance_count, type: integer, source: computed, default: 0, description: "Number of BALANCING -> DIAGNOSED reverts caused by an out-of-tolerance reading" }
      - { name: damper_adjustment_note, type: string, source: system, description: "Note captured at DIAGNOSED -> BALANCING; null before" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant at which the complaint auto-resolved; null while unresolved" }

  - name: AirflowReading
    parent: null
    common_fields: false
    fields:
      - { name: comfort_complaint_id, type: string, source: system, description: "FK -> ComfortComplaint.id; taken from the creation path" }
      - { name: room_label, type: string, source: input, description: "Room measured" }
      - { name: reading_seq, type: integer, source: input, description: "1-based monotone position within (comfort_complaint_id, room_label); duplicates are rejected", constraints: ">= 1" }
      - { name: measured_cfm, type: number, source: input, description: "Measured supply airflow at the register", constraints: ">= 0" }
      - { name: design_cfm, type: number, source: input, description: "Design airflow for that room", constraints: "> 0" }
      - { name: damper_position_pct, type: number, source: input, description: "Balancing damper position at the time of measurement", constraints: "0..100" }
      - { name: deviation_pct, type: number, source: computed, description: "= round_half_up((measured_cfm - design_cfm) / design_cfm * 100, 2)" }
      - { name: within_tolerance, type: boolean, source: computed, description: "= abs(deviation_pct) <= ComfortComplaint.tolerance_pct" }
      - { name: measured_by_user_id, type: string, source: system, description: "X-User-ID of the FieldTechnician who took the reading (equals a Technician.id per §1.7 identity)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LeakageTest
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: PRESSURIZED
        trigger: "POST /duct-sealing/leakage-tests/{id}/pressurize"
        actor: FieldTechnician
        preconditions:
          - "status == DRAFT"
          - "DuctSystem.eligibility_status != EXCLUDED"
          - "masked_register_count in the body == DuctSystem.total_register_count"
          - "test_pressure_pa between 10 and 100 inclusive"
        side_effects:
          - "stores test_pressure_pa, fan_ring_config, masked_register_count"
        note: "System pressurization setup; the rig must be sealed to every register before a reading is legal."
      - from: PRESSURIZED
        to: RECORDED
        trigger: "POST /duct-sealing/leakage-tests/{id}/record"
        actor: FieldTechnician
        preconditions:
          - "status == PRESSURIZED"
        side_effects:
          - "stores measured_leakage_cfm, ambient_temp_f, performed_by_user_id = X-User-ID"
          - "runs calculations.normalized_duct_leakage: sets normalized_leakage_cfm25 then leakage_per_100_sqft in that pinned order"
      - from: RECORDED
        to: ACCEPTED
        trigger: "POST /duct-sealing/leakage-tests/{id}/review with decision == ACCEPT"
        actor: QAVerifier
        preconditions:
          - "status == RECORDED"
          - "X-User-ID != performed_by_user_id (segregation of duties)"
        side_effects:
          - "stores reviewed_by_user_id, review_note"
          - "when phase == PRE: sets DuctSystem.baseline_leakage_cfm25 = this.normalized_leakage_cfm25, DuctSystem.working_leakage_cfm25 = this.normalized_leakage_cfm25, DuctSystem.sealed_leakage_reduction_cfm = 0.00, and increments DuctSystem.version by 1"
          - "when phase == POST: no DuctSystem field changes (the post value reaches DuctSystem only through the SealJob ledger)"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /duct-sealing/leakage-tests/{id}/review with decision == REJECT"
        actor: QAVerifier
        preconditions:
          - "status == RECORDED"
          - "X-User-ID != performed_by_user_id (segregation of duties)"
        side_effects:
          - "stores reviewed_by_user_id, review_note"
          - "no DuctSystem field changes; a rejected test can never back a SealJob or a VerificationReport"

  - entity: DuctSystem
    initial_state: PENDING_SCREENING
    terminal_states: [EXCLUDED]
    transitions:
      - from: PENDING_SCREENING
        to: ELIGIBLE
        trigger: "POST /duct-sealing/duct-systems/{id}/asbestos-screening with screening_result == CLEARED"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_status == PENDING_SCREENING"
          - "condition_grade != FAIL"
          - "duct_material != ASBESTOS_WRAP"
        side_effects:
          - "sets asbestos_screening_result = CLEARED, lab_reference, eligibility_status = ELIGIBLE"
          - "increments Project.eligible_duct_system_count by 1"
        note: "Dimension 1 of two independent state dimensions on this row; seal_status evolves separately."
      - from: PENDING_SCREENING
        to: PENDING_SCREENING
        trigger: "POST /duct-sealing/duct-systems/{id}/asbestos-screening with screening_result == SUSPECT"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_status == PENDING_SCREENING"
        side_effects:
          - "sets asbestos_screening_result = SUSPECT, lab_reference; eligibility_status stays PENDING_SCREENING so the system remains unsealable until a re-screen clears or confirms it"
      - from: PENDING_SCREENING
        to: EXCLUDED
        trigger: "POST /duct-sealing/duct-systems/{id}/asbestos-screening with screening_result == CONFIRMED"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_status IN {PENDING_SCREENING, ELIGIBLE}"
        side_effects:
          - "hop 1: sets asbestos_screening_result = CONFIRMED, eligibility_status = EXCLUDED, exclusion_reason = ASBESTOS_CONFIRMED, seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00, active_seal_job_id = null, and decrements Project.eligible_duct_system_count by 1 when the previous eligibility_status was ELIGIBLE"
          - "hop 2 (caused by hop 1): every SealJob with duct_system_id == this.id and status IN {SCHEDULED, MASKING, INJECTING, PAUSED, SEALED, VERIFIED, RETEST_REQUIRED} moves to ABORTED_EXCLUSION with abort_reason = 'asbestos confirmed'"
          - "hop 3 (caused by hop 2): every VerificationReport whose seal_job_id is one of the jobs aborted in hop 2 and whose status IN {DRAFT, ISSUED, CORRECTION_REQUIRED} moves to VOIDED"
          - "hop 4 (caused by hop 3): every RebateClaim whose verification_report_id is one of the reports voided in hop 3 and whose status IN {SUBMITTED, APPROVED, RETURNED_FOR_CORRECTION} moves to WITHDRAWN, sets committed = false, and releases payable_cents from UtilityProgram.committed_rebate_cents (raising remaining_budget_cents by the same amount)"
      - from: ELIGIBLE
        to: EXCLUDED
        trigger: "POST /duct-sealing/duct-systems/{id}/exclude"
        actor: ProgramAdmin
        preconditions:
          - "eligibility_status IN {PENDING_SCREENING, ELIGIBLE}"
          - "exclusion_reason in the body IN {STRUCTURAL_DAMAGE, MATERIAL_NOT_SEALABLE, INACCESSIBLE}"
        side_effects:
          - "same four-hop cascade as the CONFIRMED screening transition, with exclusion_reason taken from the request body instead of ASBESTOS_CONFIRMED"
        note: "Retrofit exclusion for damaged or non-sealable ductwork discovered after screening."

  - entity: DuctSystem
    initial_state: SEAL_PENDING
    terminal_states: []
    transitions:
      - from: SEAL_PENDING
        to: SEALING
        trigger: "POST /duct-sealing/seal-jobs/{id}/start-injection"
        actor: FieldTechnician
        preconditions:
          - "eligibility_status == ELIGIBLE"
          - "seal_status == SEAL_PENDING"
        side_effects:
          - "sets seal_status = SEALING; working_leakage_cfm25 begins tracking SealJob.current_leakage_cfm"
        note: "Dimension 2 of the same row. eligibility_status and seal_status advance independently: an EXCLUDED row can still read seal_status == SEAL_PENDING, and a SEALED row can be driven to EXCLUDED by a late asbestos confirmation."
      - from: SEALING
        to: SEALED
        trigger: "POST /duct-sealing/seal-jobs/{id}/complete-seal"
        actor: FieldTechnician
        preconditions:
          - "seal_status == SEALING"
        side_effects:
          - "sets seal_status = SEALED, working_leakage_cfm25 = SealJob.current_leakage_cfm, sealed_leakage_reduction_cfm = baseline_leakage_cfm25 - working_leakage_cfm25"
      - from: SEALING
        to: SEAL_PENDING
        trigger: "POST /duct-sealing/seal-jobs/{id}/abort, injection-pressure safety cutoff, POST-phase combustion FAIL cascade, or an exclusion cascade"
        actor: FieldTechnician | system
        preconditions:
          - "seal_status == SEALING"
        side_effects:
          - "compensation: sets seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00, active_seal_job_id = null"
      - from: SEALED
        to: VERIFIED
        trigger: "POST /duct-sealing/verification-reports/{id}/issue"
        actor: QAVerifier
        preconditions:
          - "seal_status == SEALED"
        side_effects:
          - "sets seal_status = VERIFIED"
      - from: VERIFIED
        to: SEAL_PENDING
        trigger: "asbestos confirmation or exclusion cascade (hop 1)"
        actor: system
        preconditions:
          - "seal_status IN {SEALING, SEALED, VERIFIED}"
        side_effects:
          - "compensation: seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00"
      - from: VERIFIED
        to: SEAL_PENDING
        trigger: "POST /duct-sealing/seal-jobs whose retest_of_job_id names a SealJob of this duct system in status RETEST_REQUIRED"
        actor: FieldTechnician
        preconditions:
          - "seal_status == VERIFIED"
          - "the SealJob named by retest_of_job_id has duct_system_id == this.id AND status == RETEST_REQUIRED"
        side_effects:
          - "reopens the system for the follow-up re-test: seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00, active_seal_job_id = the new re-test job"
        note: "Only re-test creation reopens a VERIFIED system; the inspector-failure cascade of §1.2 deliberately stops at SealJob.RETEST_REQUIRED and leaves seal_status == VERIFIED."

  - entity: SealJob
    initial_state: SCHEDULED
    terminal_states: [RETEST_CLOSED, ABORTED_MANUAL, ABORTED_SAFETY, ABORTED_EXCLUSION, ABORTED_SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: ABORTED_SUPERSEDED
        trigger: "POST /duct-sealing/seal-jobs (a newer job is created on the same duct_system_id)"
        actor: FieldTechnician
        preconditions:
          - "status == SCHEDULED"
          - "the incoming request carried expected_duct_system_version equal to DuctSystem.version"
        side_effects:
          - "sets abort_reason = 'superseded by a newer scheduled job'"
          - "DuctSystem.active_seal_job_id is repointed to the new job"
        note: "Supersede semantics: a second scheduling of the same system legitimately replaces a not-yet-started job, which is why POST /seal-jobs is guarded by OCC on DuctSystem.version (see §1.2.1)."
      - from: SCHEDULED
        to: MASKING
        trigger: "POST /duct-sealing/seal-jobs/{id}/masks (first masked register)"
        actor: FieldTechnician
        preconditions:
          - "status == SCHEDULED"
          - "DuctSystem.eligibility_status == ELIGIBLE"
        side_effects:
          - "appends register_label to masked_register_labels when masked == true and recomputes masked_register_count"
          - "increments SealJob.version by 1"
      - from: MASKING
        to: MASKING
        trigger: "POST /duct-sealing/seal-jobs/{id}/masks (subsequent registers)"
        actor: FieldTechnician
        preconditions:
          - "status == MASKING"
          - "register_label is not already present in masked_register_labels"
        side_effects:
          - "appends register_label and recomputes masked_register_count"
      - from: MASKING
        to: INJECTING
        trigger: "POST /duct-sealing/seal-jobs/{id}/start-injection"
        actor: FieldTechnician
        preconditions:
          - "status == MASKING"
          - "masked_register_count == DuctSystem.total_register_count"
          - "DuctSystem.eligibility_status == ELIGIBLE"
          - "Technician.certification_status == ACTIVE"
          - "Technician.certification_expires_at is strictly after the logical clock"
          - "Project.safety_hold == false"
          - "when Project.gas_appliance_count > 0: the count of CombustionTest rows with project_id == Project.id AND phase == PRE AND verdict IN {PASS, MARGINAL} is >= Project.gas_appliance_count"
          - "injection_pressure_pa <= MAX_INJECTION_PA"
        side_effects:
          - "DuctSystem.seal_status = SEALING; DuctSystem.active_seal_job_id = this.id"
          - "increments SealJob.version by 1"
      - from: INJECTING
        to: PAUSED
        trigger: "POST /duct-sealing/seal-jobs/{id}/pause"
        actor: FieldTechnician
        preconditions:
          - "status == INJECTING"
        side_effects:
          - "increments pause_count by 1; stores abort_reason = null and the pause_reason on the run log"
      - from: INJECTING
        to: PAUSED
        trigger: "POST /duct-sealing/seal-jobs/{id}/leakage-samples whose 3-sample seal rate is below MIN_SEAL_RATE_CFM_PER_MIN"
        actor: system
        preconditions:
          - "status == INJECTING"
          - "sample_count >= 3 after this sample is stored"
          - "seal_rate_cfm_per_min < MIN_SEAL_RATE_CFM_PER_MIN"
        side_effects:
          - "sets stall_flag = true and increments pause_count by 1"
        note: "Real-time leakage-curve stall detection; the run cannot continue until the technician resumes."
      - from: PAUSED
        to: INJECTING
        trigger: "POST /duct-sealing/seal-jobs/{id}/resume"
        actor: FieldTechnician
        preconditions:
          - "status == PAUSED"
          - "DuctSystem.eligibility_status == ELIGIBLE"
          - "Project.safety_hold == false"
          - "injection_pressure_pa <= MAX_INJECTION_PA"
        side_effects:
          - "sets stall_flag = false"
        note: "Closes the INJECTING <-> PAUSED cycle; pause_count keeps the loop count observable."
      - from: INJECTING
        to: SEALED
        trigger: "POST /duct-sealing/seal-jobs/{id}/complete-seal"
        actor: FieldTechnician
        preconditions:
          - "status == INJECTING"
          - "target_reached == true"
        side_effects:
          - "stores sealant_lbs_used"
          - "DuctSystem.seal_status = SEALED, DuctSystem.working_leakage_cfm25 = current_leakage_cfm, DuctSystem.sealed_leakage_reduction_cfm = DuctSystem.baseline_leakage_cfm25 - current_leakage_cfm"
      - from: INJECTING
        to: ABORTED_SAFETY
        trigger: "POST /duct-sealing/seal-jobs/{id}/leakage-samples with injection_pressure_pa > MAX_INJECTION_PA"
        actor: system
        preconditions:
          - "status IN {INJECTING, PAUSED}"
        side_effects:
          - "hop 1: sets abort_reason = 'injection pressure cutoff', LeakageSample.cutoff_triggered = true"
          - "hop 2 (caused by hop 1): DuctSystem.seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00, active_seal_job_id = null"
          - "hop 3 (caused by hop 2): Project.status = SAFETY_HOLD, Project.safety_hold = true, Project.safety_hold_reason = 'injection pressure cutoff on system <system_label>'"
      - from: INJECTING
        to: ABORTED_SAFETY
        trigger: "POST /duct-sealing/projects/{id}/combustion-tests with phase == POST and verdict == FAIL"
        actor: system
        preconditions:
          - "status IN {MASKING, INJECTING, PAUSED}"
        side_effects:
          - "Project.status = SAFETY_HOLD, Project.safety_hold = true, Project.safety_hold_reason = 'combustion spillage failure on <appliance_label>'"
          - "abort_reason = 'combustion spillage failure'; DuctSystem compensation as in the pressure-cutoff hop 2"
      - from: INJECTING
        to: ABORTED_MANUAL
        trigger: "POST /duct-sealing/seal-jobs/{id}/abort"
        actor: FieldTechnician
        preconditions:
          - "status IN {MASKING, INJECTING, PAUSED}"
        side_effects:
          - "stores abort_reason from the body"
          - "compensation: DuctSystem.seal_status = SEAL_PENDING, working_leakage_cfm25 = baseline_leakage_cfm25, sealed_leakage_reduction_cfm = 0.00, active_seal_job_id = null"
      - from: SEALED
        to: VERIFIED
        trigger: "POST /duct-sealing/verification-reports/{id}/issue"
        actor: QAVerifier
        preconditions:
          - "status == SEALED (or RETEST_REQUIRED when the report is being re-issued)"
        side_effects:
          - "DuctSystem.seal_status = VERIFIED"
          - "when retest_of_job_id is not null: the referenced SealJob moves RETEST_REQUIRED -> RETEST_CLOSED"
      - from: VERIFIED
        to: RETEST_REQUIRED
        trigger: "POST /duct-sealing/rebate-claims/{id}/inspector-verification whose inspector_variance_pct exceeds INSPECTOR_TOLERANCE_PCT (cascade hop 3)"
        actor: system
        preconditions:
          - "status == VERIFIED"
        side_effects:
          - "sets warranty_suspended = true (warranty_status therefore reads SUSPENDED once registered)"
      - from: RETEST_REQUIRED
        to: VERIFIED
        trigger: "POST /duct-sealing/verification-reports/{id}/issue re-issuing the CORRECTION_REQUIRED report of this job"
        actor: QAVerifier
        preconditions:
          - "status == RETEST_REQUIRED"
        side_effects:
          - "sets warranty_suspended = false"
      - from: RETEST_REQUIRED
        to: RETEST_CLOSED
        trigger: "a SealJob whose retest_of_job_id == this.id reaches VERIFIED (bubble-up through the self-referential FK)"
        actor: system
        preconditions:
          - "status == RETEST_REQUIRED"
        side_effects:
          - "sets warranty_suspended = false"
      - from: SEALED
        to: ABORTED_EXCLUSION
        trigger: "asbestos confirmation or exclusion cascade (hop 2)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, MASKING, INJECTING, PAUSED, SEALED, VERIFIED, RETEST_REQUIRED}"
        side_effects:
          - "sets abort_reason to the exclusion reason; DuctSystem compensation already applied in hop 1; drives hop 3 on any VerificationReport of this job"

  - entity: VerificationReport
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: VOIDED
        trigger: "POST /duct-sealing/verification-reports (a newer draft is created for the same seal_job_id)"
        actor: QAVerifier
        preconditions:
          - "status == DRAFT"
          - "the incoming request carried expected_seal_job_version equal to SealJob.version"
        side_effects:
          - "the superseded draft keeps its computed values but can never be issued"
        note: "Supersede semantics for re-drafting a report; this is why POST /verification-reports is OCC-guarded on SealJob.version (see §1.2.1)."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /duct-sealing/verification-reports/{id}/issue"
        actor: QAVerifier
        preconditions:
          - "status == DRAFT"
          - "SealJob.status == SEALED"
          - "X-User-ID != SealJob.technician_id (segregation of duties)"
          - "guarantee_met == true"
          - "when the project's UtilityProgram.combustion_safety_required == true or Project.utility_program_id is null: every CombustionTest with project_id == Project.id AND phase == POST has verdict IN {PASS, MARGINAL}, and at least Project.gas_appliance_count such rows exist"
          - "Project.safety_hold == false"
        side_effects:
          - "stores issued_by_user_id, issued_at (logical clock), signature_note"
          - "SealJob.status SEALED -> VERIFIED; DuctSystem.seal_status SEALED -> VERIFIED"
      - from: ISSUED
        to: CORRECTION_REQUIRED
        trigger: "POST /duct-sealing/rebate-claims/{id}/inspector-verification with inspector_outcome == FAIL (cascade hop 2)"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "increments correction_round by 1"
          - "hop 3 (caused by this hop): the report's SealJob moves VERIFIED -> RETEST_REQUIRED and sets warranty_suspended = true"
      - from: CORRECTION_REQUIRED
        to: ISSUED
        trigger: "POST /duct-sealing/verification-reports/{id}/issue"
        actor: QAVerifier
        preconditions:
          - "status == CORRECTION_REQUIRED"
          - "X-User-ID != SealJob.technician_id (segregation of duties)"
          - "guarantee_met == true"
          - "Project.safety_hold == false"
        side_effects:
          - "re-stamps issued_by_user_id, issued_at, signature_note"
          - "SealJob.status RETEST_REQUIRED -> VERIFIED and warranty_suspended = false"
        note: "Closes the ISSUED <-> CORRECTION_REQUIRED cycle."
      - from: ISSUED
        to: VOIDED
        trigger: "asbestos confirmation or exclusion cascade (hop 3)"
        actor: system
        preconditions:
          - "status IN {DRAFT, ISSUED, CORRECTION_REQUIRED}"
        side_effects:
          - "drives hop 4 on any RebateClaim referencing this report"

  - entity: RebateClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /duct-sealing/rebate-claims/{id}/inspector-verification with inspector_variance_pct <= INSPECTOR_TOLERANCE_PCT"
        actor: UtilityInspector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != VerificationReport.issued_by_user_id (segregation of duties)"
          - "VerificationReport.status == ISSUED"
        side_effects:
          - "stores inspector_user_id, spot_check_leakage_cfm, spot_check_pressure_pa, spot_check_cfm25, inspector_variance_pct, inspector_outcome = PASS"
          - "committed stays true; UtilityProgram.committed_rebate_cents unchanged"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /duct-sealing/rebate-claims/{id}/inspector-verification with inspector_variance_pct > INSPECTOR_TOLERANCE_PCT"
        actor: UtilityInspector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != VerificationReport.issued_by_user_id (segregation of duties)"
        side_effects:
          - "hop 1: stores the spot-check fields with inspector_outcome = FAIL, sets committed = false and releases payable_cents from UtilityProgram.committed_rebate_cents (remaining_budget_cents rises by payable_cents)"
          - "hop 2 (caused by hop 1): the linked VerificationReport moves ISSUED -> CORRECTION_REQUIRED and correction_round increments"
          - "hop 3 (caused by hop 2): that report's SealJob moves VERIFIED -> RETEST_REQUIRED and sets warranty_suspended = true"
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /duct-sealing/rebate-claims/{id}/resubmit"
        actor: ProgramAdmin
        preconditions:
          - "status == RETURNED_FOR_CORRECTION"
          - "VerificationReport.status == ISSUED (the report must have been re-issued first)"
          - "payable_cents <= UtilityProgram.remaining_budget_cents"
        side_effects:
          - "recomputes nothing: per_cfm_candidate_cents, percent_of_invoice_candidate_cents, tier_bonus_pct, capped_subtotal_cents, admin_fee_cents and payable_cents are frozen at first submission"
          - "increments resubmission_count by 1, replaces documentation_bundle_ref, resets inspector_outcome to PENDING and clears the spot-check fields"
          - "sets committed = true and re-commits payable_cents to UtilityProgram.committed_rebate_cents"
        note: "Closes the SUBMITTED <-> RETURNED_FOR_CORRECTION cycle."
      - from: APPROVED
        to: PAID
        trigger: "POST /duct-sealing/rebate-claims/{id}/pay"
        actor: ProgramAdmin
        preconditions:
          - "status == APPROVED"
          - "when UtilityProgram.requires_inspector_verification == true: inspector_outcome == PASS"
        side_effects:
          - "stores payment_reference; sets committed = false"
          - "moves payable_cents from UtilityProgram.committed_rebate_cents to UtilityProgram.paid_rebate_cents, leaving remaining_budget_cents unchanged"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "asbestos confirmation or exclusion cascade (hop 4)"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, APPROVED, RETURNED_FOR_CORRECTION}"
        side_effects:
          - "sets committed = false and releases payable_cents from UtilityProgram.committed_rebate_cents when it was still committed"

  - entity: ComfortComplaint
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: DIAGNOSED
        trigger: "POST /duct-sealing/comfort-complaints/{id}/diagnose"
        actor: FieldTechnician
        preconditions:
          - "status == OPEN"
          - "tolerance_pct between 0.00 and 50.00 inclusive"
        side_effects:
          - "stores diagnosis_code and tolerance_pct"
      - from: DIAGNOSED
        to: BALANCING
        trigger: "POST /duct-sealing/comfort-complaints/{id}/balance"
        actor: FieldTechnician
        preconditions:
          - "status == DIAGNOSED"
          - "at least one AirflowReading exists with comfort_complaint_id == this.id"
        side_effects:
          - "stores damper_adjustment_note"
      - from: BALANCING
        to: RESOLVED
        trigger: "POST /duct-sealing/comfort-complaints/{id}/airflow-readings whose stored reading leaves every room within tolerance"
        actor: system
        preconditions:
          - "status == BALANCING"
          - "for every distinct room_label under this complaint, the reading with the greatest reading_seq has within_tolerance == true"
        side_effects:
          - "sets balanced_room_count = the number of distinct room_label values and resolved_at = the logical clock"
      - from: BALANCING
        to: DIAGNOSED
        trigger: "POST /duct-sealing/comfort-complaints/{id}/airflow-readings whose stored reading has within_tolerance == false"
        actor: system
        preconditions:
          - "status == BALANCING"
        side_effects:
          - "increments rebalance_count by 1 and recomputes balanced_room_count"
        note: "Closes the DIAGNOSED <-> BALANCING cycle: an out-of-tolerance room throws the complaint back to diagnosis."

  - entity: Project
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SAFETY_HOLD
        trigger: "POST /duct-sealing/projects/{id}/safety-hold, the injection-pressure cutoff (hop 3), or POST /duct-sealing/projects/{id}/combustion-tests with phase == POST and verdict == FAIL"
        actor: "ProgramAdmin | QAVerifier | system"
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets safety_hold = true and safety_hold_reason; blocks POST /seal-jobs, start-injection, resume and POST /rebate-claims for this project"
      - from: SAFETY_HOLD
        to: ACTIVE
        trigger: "POST /duct-sealing/projects/{id}/combustion-tests with phase == POST and verdict == PASS"
        actor: FieldTechnician
        preconditions:
          - "status == SAFETY_HOLD"
          - "every CombustionTest with project_id == this.id AND phase == POST AND created_at strictly after safety_hold was set has verdict == PASS"
        side_effects:
          - "sets safety_hold = false and safety_hold_reason = null"
        note: "Combustion spillage retest clears the hold; the cycle can repeat."
      - from: SAFETY_HOLD
        to: ACTIVE
        trigger: "POST /duct-sealing/projects/{id}/release-safety-hold"
        actor: ProgramAdmin
        preconditions:
          - "status == SAFETY_HOLD"
        side_effects:
          - "sets safety_hold = false, safety_hold_reason = null and stores the release_note"
          - "no SealJob is auto-resumed: each PAUSED job still requires an explicit POST /duct-sealing/seal-jobs/{id}/resume"
        note: "Administrative release, used when the hold was raised manually rather than by a failed POST combustion test."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: seal-job-create-stale-duct-system
    parent_entity: DuctSystem
    write_endpoint: "POST /duct-sealing/seal-jobs"
    occ_field: "expected_duct_system_version"
    description: |
      Creating a SealJob against a DuctSystem whose version has advanced since
      the client last read it is rejected. The product deliberately lets a new
      job supersede an existing SCHEDULED job on the same system, so a create
      that observes a stale DuctSystem.version would silently discard whatever
      the previous writer scheduled or whatever screening decision has since
      been recorded; the stale-version check turns that into a 412.
    error_id: ERR_STALE_DUCT_SYSTEM_VERSION
    http_status: 412
  - rule_id: verification-report-create-stale-seal-job
    parent_entity: SealJob
    write_endpoint: "POST /duct-sealing/verification-reports"
    occ_field: "expected_seal_job_version"
    description: |
      Creating a VerificationReport against a SealJob whose version has advanced
      since the client last read it is rejected. A new draft report legitimately
      supersedes an existing DRAFT report for the same job, so a create carrying
      a stale SealJob.version would void a draft the writer never saw; the
      stale-version check turns that into a 412.
    error_id: ERR_STALE_SEAL_JOB_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: normalized_duct_leakage
    trigger: "POST /duct-sealing/leakage-tests/{id}/record (LeakageTest PRESSURIZED -> RECORDED)"
    algorithm: threshold
    formula: |
      # Power-law normalization of a duct-leakage reading to the 25 Pa reference.
      # Step 1 — normalize, then round ONCE to 2 decimals, round_half_up:
      normalized_leakage_cfm25 = round_half_up(
          measured_leakage_cfm * (25.0 / test_pressure_pa) ** FLOW_EXPONENT, 2)
      # Step 2 — the per-area figure is derived from the ALREADY-ROUNDED value
      # in step 1, then rounded again. This order is pinned:
      leakage_per_100_sqft = round_half_up(
          normalized_leakage_cfm25 / (Project.conditioned_floor_area_sqft / 100.0), 2)
      # Pinning matters: computing leakage_per_100_sqft from the UNROUNDED
      # step-1 value differs by one cent-equivalent at 2 decimals for readings
      # near a .xx5 boundary (e.g. measured 130.0 CFM at 50 Pa over 1800 sqft
      # gives 4.77 under the pinned order and 4.76 under the unrounded order).
      # The pinned order is round-then-divide-then-round.
    input_set: "The single LeakageTest being recorded; Project reached through LeakageTest.duct_system_id -> DuctSystem.project_id -> Project.id"
    constants:
      FLOW_EXPONENT: 0.60
      REFERENCE_PRESSURE_PA: 25
    precision: "2 decimal places, round_half_up, applied twice in the pinned order above"
    variants: []

  - name: leakage_reduction_basis
    trigger: "POST /duct-sealing/verification-reports (report creation)"
    algorithm: aggregation
    formula: |
      pre_leakage_cfm25  = LeakageTest[SealJob.pre_test_id].normalized_leakage_cfm25
      post_leakage_cfm25 = LeakageTest[post_test_id].normalized_leakage_cfm25

      # Variant SYSTEM_BASIS — the guarantee number:
      reduction_pct_system_basis = round_half_up(
          (pre_leakage_cfm25 - post_leakage_cfm25) / pre_leakage_cfm25 * 100, 2)

      # Variant WHOLE_HOUSE_BASIS — the rebate number. Candidate set: every
      # DuctSystem D with D.project_id == Project.id AND
      # D.eligibility_status == ELIGIBLE AND D.baseline_leakage_cfm25 IS NOT NULL,
      # ordered by D.created_at ASC (order does not change the sums; it pins the
      # replay). EXCLUDED systems are omitted from BOTH sums.
      #   sum_pre  = sum over candidates of D.baseline_leakage_cfm25
      #   sum_post = sum over candidates of:
      #                 the normalized_leakage_cfm25 of the ACCEPTED POST-phase
      #                 LeakageTest on D with the greatest created_at, when one
      #                 exists; otherwise D.baseline_leakage_cfm25 (a system with
      #                 no accepted post test counts as fully unsealed)
      cfm_reduced_whole_house         = round_half_up(sum_pre - sum_post, 2)
      reduction_pct_whole_house_basis = round_half_up((sum_pre - sum_post) / sum_pre * 100, 2)

      guarantee_threshold_pct = UtilityProgram.min_reduction_pct
                                if Project.utility_program_id is not null
                                else GUARANTEE_DEFAULT_MIN_PCT
      guarantee_met = (reduction_pct_system_basis >= guarantee_threshold_pct)   # >=, not >
    input_set: "SYSTEM_BASIS reads exactly two ACCEPTED LeakageTest rows. WHOLE_HOUSE_BASIS reads every ELIGIBLE DuctSystem of the project that has a baseline, and for each the latest ACCEPTED POST test (tie-break greatest created_at)."
    constants:
      GUARANTEE_DEFAULT_MIN_PCT: 80.00
    precision: "2 decimal places, round_half_up on each of the three outputs independently"
    variants:
      - name: SYSTEM_BASIS
        when: "Used for VerificationReport.guarantee_met and for the dealer guarantee promised to the homeowner"
        difference: "Looks only at the one duct system that was sealed; ignores every sibling system, sealed or not"
      - name: WHOLE_HOUSE_BASIS
        when: "Used for RebateClaim.tier_bonus_pct, for cfm_reduced_whole_house and for the program minimum check at claim creation"
        difference: "Aggregates every ELIGIBLE sibling system and charges unsealed ones at their full baseline, so a project with a second eligible-but-unsealed system yields a strictly smaller percentage than SYSTEM_BASIS on identical measurements (81.67 vs 49.00 for the canonical 300/55 + 200/unsealed fixture)"

  - name: rebate_payable_amount
    trigger: "POST /duct-sealing/rebate-claims (claim creation); frozen thereafter, resubmission never recomputes it"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — the two independent base candidates, both always computed and
      # both persisted on the claim:
      per_cfm_candidate_cents            = round_half_up(
          UtilityProgram.rate_cents_per_cfm_reduced * VerificationReport.cfm_reduced_whole_house)
      percent_of_invoice_candidate_cents = round_half_up(
          Project.invoice_amount_cents * UtilityProgram.pct_of_invoice_bps / 10000)

      # Step 2 — basis selection (this is the variant axis):
      if   UtilityProgram.rebate_basis == PER_CFM:             base_cents = per_cfm_candidate_cents;            basis_applied = PER_CFM
      elif UtilityProgram.rebate_basis == PERCENT_OF_INVOICE:  base_cents = percent_of_invoice_candidate_cents; basis_applied = PERCENT_OF_INVOICE
      else:  # LESSER_OF_BOTH
          base_cents = min(per_cfm_candidate_cents, percent_of_invoice_candidate_cents)
          basis_applied = PER_CFM if per_cfm_candidate_cents <= percent_of_invoice_candidate_cents
                                  else PERCENT_OF_INVOICE     # ties resolve to PER_CFM

      # Step 3 — performance tier read off the WHOLE-HOUSE percentage:
      r = VerificationReport.reduction_pct_whole_house_basis
      tier_bonus_pct = 0.20 if r >= 90.00 else
                       0.10 if r >= 75.00 else
                       0.05 if r >= 60.00 else 0.00

      # Steps 4-6 — the evaluation order below is PINNED. The cap is applied to
      # the bonused subtotal BEFORE the administrative fee is taken, and the fee
      # is a percentage of the CAPPED subtotal. Taking the fee first and capping
      # afterwards is a different number whenever the cap binds (canonical
      # fixture: base 294000, bonused 323400, cap 200000 -> pinned payable
      # 190000; fee-first would yield 200000).
      bonused_subtotal_cents = round_half_up(base_cents * (1 + tier_bonus_pct))
      capped_subtotal_cents  = min(bonused_subtotal_cents, UtilityProgram.cap_cents)
      admin_fee_cents        = round_half_up(capped_subtotal_cents * ADMIN_FEE_RATE)
      payable_cents          = capped_subtotal_cents - admin_fee_cents
    input_set: "One VerificationReport in status ISSUED, its Project, and the UtilityProgram named in the request (which must equal Project.utility_program_id)"
    constants:
      ADMIN_FEE_RATE: 0.05
      TIER_BONUS_BANDS: "[90.00, +inf) -> 0.20 | [75.00, 90.00) -> 0.10 | [60.00, 75.00) -> 0.05 | (-inf, 60.00) -> 0.00"
    precision: "Integer cents throughout; round_half_up at each of the three rounding points (candidates, bonused subtotal, admin fee)"
    variants:
      - name: PER_CFM
        when: "UtilityProgram.rebate_basis == PER_CFM, or LESSER_OF_BOTH when the per-CFM candidate is the smaller (ties included)"
        difference: "Scales with whole-house CFM25 removed and is insensitive to the invoice; on the canonical fixture (245.00 CFM removed, rate 1200, invoice 480000, 3000 bps) it yields base 294000"
      - name: PERCENT_OF_INVOICE
        when: "UtilityProgram.rebate_basis == PERCENT_OF_INVOICE, or LESSER_OF_BOTH when the invoice candidate is strictly smaller"
        difference: "Scales with the retrofit invoice and is insensitive to how much leakage was actually removed; on the same fixture it yields base 144000 — a different payable for identical measurements"

  - name: combustion_safety_verdict
    trigger: "POST /duct-sealing/projects/{id}/combustion-tests (CombustionTest creation)"
    algorithm: threshold
    formula: |
      co_max  = CO_MAX_PPM[appliance_type]
      co_warn = CO_WARN_PPM[appliance_type]
      wcd_max = WCD_LIMIT_PA[appliance_type]

      if (co_ppm_air_free > co_max)
         or (spillage_seconds > SPILLAGE_MAX_SECONDS)
         or (worst_case_depressurization_pa > wcd_max and draft_pressure_pa < DRAFT_MIN_PA):
          verdict = FAIL
      elif (co_ppm_air_free >= co_warn) or (spillage_seconds == SPILLAGE_MAX_SECONDS):
          verdict = MARGINAL
      else:
          verdict = PASS
      # Three inputs interact non-linearly: the depressurization limit only bites
      # when the draft is simultaneously weak, and the CO limit is selected by
      # appliance_type. Boundaries are exact: spillage_seconds == 60 is MARGINAL
      # (not FAIL) and co_ppm_air_free == co_max is MARGINAL (not FAIL).
    input_set: "The single CombustionTest being created"
    constants:
      SPILLAGE_MAX_SECONDS: 60
      DRAFT_MIN_PA: 1.0
      CO_MAX_PPM: { ATMOSPHERIC_WATER_HEATER: 100, FURNACE: 100, BOILER: 100, RANGE: 800 }
      CO_WARN_PPM: { ATMOSPHERIC_WATER_HEATER: 50, FURNACE: 50, BOILER: 50, RANGE: 400 }
      WCD_LIMIT_PA: { ATMOSPHERIC_WATER_HEATER: 5.0, FURNACE: 5.0, BOILER: 5.0, RANGE: 999.0 }
    precision: "Integer seconds and ppm as supplied; no rounding"
    variants: []

  - name: sealing_run_curve_monitor
    trigger: "POST /duct-sealing/seal-jobs/{id}/leakage-samples (LeakageSample creation)"
    algorithm: chronological
    formula: |
      # Samples are replayed strictly by sample_seq ASC; sample_seq must equal
      # SealJob.sample_count + 1, so no out-of-order or duplicate curve point
      # can enter the series (see validations priority 100).
      SealJob.current_leakage_cfm = instantaneous_leakage_cfm of the sample with
                                    the greatest sample_seq
      if instantaneous_leakage_cfm <= SealJob.target_leakage_cfm:
          SealJob.target_reached = true      # latched, never cleared
      DuctSystem.working_leakage_cfm25      = SealJob.current_leakage_cfm
      DuctSystem.sealed_leakage_reduction_cfm =
          round_half_up(DuctSystem.baseline_leakage_cfm25 - SealJob.current_leakage_cfm, 2)

      # Safety cutoff — evaluated BEFORE the stall check:
      if injection_pressure_pa > MAX_INJECTION_PA:
          cutoff_triggered = true; SealJob -> ABORTED_SAFETY (see §1.2)
      # Stall detection over a fixed 3-sample backward window:
      if sample_seq >= STALL_WINDOW_SAMPLES:
          s_new = this sample; s_old = the sample with sample_seq == sample_seq - 2
          seal_rate_cfm_per_min = round_half_up(
              (s_old.instantaneous_leakage_cfm - s_new.instantaneous_leakage_cfm)
              / ((s_new.elapsed_seconds - s_old.elapsed_seconds) / 60.0), 2)
          if seal_rate_cfm_per_min < MIN_SEAL_RATE_CFM_PER_MIN:
              SealJob -> PAUSED with stall_flag = true
      else:
          seal_rate_cfm_per_min = null
      # Boundaries are exact: injection_pressure_pa == 1000.0 does NOT cut off,
      # and seal_rate_cfm_per_min == 0.50 does NOT stall.
    input_set: "All LeakageSample rows of the job, replayed by sample_seq ASC; the 3-sample window uses sample_seq and sample_seq-2 only"
    constants:
      MAX_INJECTION_PA: 1000.0
      MIN_SEAL_RATE_CFM_PER_MIN: 0.50
      STALL_WINDOW_SAMPLES: 3
    precision: "2 decimal places, round_half_up on seal_rate_cfm_per_min and sealed_leakage_reduction_cfm"
    variants: []

  - name: airflow_balance_deviation
    trigger: "POST /duct-sealing/comfort-complaints/{id}/airflow-readings (AirflowReading creation)"
    algorithm: aggregation
    formula: |
      deviation_pct    = round_half_up((measured_cfm - design_cfm) / design_cfm * 100, 2)
      within_tolerance = (abs(deviation_pct) <= ComfortComplaint.tolerance_pct)   # <=, not <

      # Room-by-room roll-up. For each distinct room_label under the complaint,
      # the governing reading is the one with the greatest reading_seq (reading_seq
      # is unique per (comfort_complaint_id, room_label), so no tie is possible;
      # duplicates are rejected by validations priority 100).
      balanced_room_count = count of distinct room_label whose governing reading
                            has within_tolerance == true
      distinct_room_count = count of distinct room_label under the complaint
      # Auto-resolution / revert (see §1.2 ComfortComplaint):
      if status == BALANCING and within_tolerance == false:  status -> DIAGNOSED, rebalance_count += 1
      elif status == BALANCING and balanced_room_count == distinct_room_count and distinct_room_count >= 1:
           status -> RESOLVED, resolved_at = logical clock
    input_set: "Every AirflowReading with comfort_complaint_id == the complaint; only the greatest reading_seq per room_label governs"
    constants:
      DEFAULT_TOLERANCE_PCT: 10.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: inspector_spot_check_variance
    trigger: "POST /duct-sealing/rebate-claims/{id}/inspector-verification"
    algorithm: threshold
    formula: |
      spot_check_cfm25 = round_half_up(
          spot_check_leakage_cfm * (25.0 / spot_check_pressure_pa) ** FLOW_EXPONENT, 2)
      inspector_variance_pct = round_half_up(
          abs(spot_check_cfm25 - VerificationReport.post_leakage_cfm25)
          / VerificationReport.post_leakage_cfm25 * 100, 2)
      inspector_outcome = FAIL if inspector_variance_pct > INSPECTOR_TOLERANCE_PCT else PASS
      # Boundary is exact: inspector_variance_pct == 10.00 is a PASS.
    input_set: "The claim's VerificationReport.post_leakage_cfm25 and the inspector's own re-measurement"
    constants:
      FLOW_EXPONENT: 0.60
      INSPECTOR_TOLERANCE_PCT: 10.00
    precision: "2 decimal places, round_half_up on both outputs"
    variants: []

  - name: warranty_retest_schedule
    trigger: "POST /duct-sealing/seal-jobs/{id}/warranty-registration"
    algorithm: projection
    formula: |
      warranty_registered_at = the logical clock at registration
      retest_due_at          = warranty_registered_at + RETEST_INTERVAL_DAYS days
      # warranty_status is then derived on every read in this precedence order:
      #   1. warranty_registered_at is null                     -> NOT_REGISTERED
      #   2. warranty_suspended == true                          -> SUSPENDED
      #   3. clock > retest_due_at AND no SealJob with
      #      retest_of_job_id == this.id has status IN
      #      {VERIFIED, RETEST_CLOSED}                           -> LAPSED
      #   4. otherwise                                           -> REGISTERED
    input_set: "The single SealJob plus its follow-up re-test jobs found by retest_of_job_id"
    constants:
      RETEST_INTERVAL_DAYS: 365
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "Whole days added to an ISO 8601 UTC instant with three fractional digits"
    variants: []

# =============================================================================
# §1.4 Validation Rules (Ordered)
# =============================================================================
# Every mutation endpoint evaluates these rules in ascending priority and returns
# the FIRST violated rule's error. Lower number == checked earlier == wins.
validations:
  - priority: 10
    category: authentication
    rule: "X-User-ID header must be present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 20
    category: authorization
    rule: "The caller's role (resolved from X-User-ID via §1.7) must appear in the endpoint's allowed roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 30
    category: authorization
    rule: "Segregation of duties — three independent pairs, all comparing the caller's X-User-ID (X-User-Role is checked separately at priority 20, so the same X-User-ID presented under a different role does NOT escape this rule): (a) reviewing a LeakageTest requires X-User-ID != LeakageTest.performed_by_user_id, so the technician who measured cannot accept or reject the measurement; (b) issuing a VerificationReport requires X-User-ID != SealJob.technician_id, so the technician assigned to the sealing run cannot sign off on its outcome; (c) recording the inspector verification for a RebateClaim requires X-User-ID != VerificationReport.issued_by_user_id on the report that claim was built from, so the verifier who issued the report cannot also be the independent inspector"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /leakage-tests/{id}/review, POST /verification-reports/{id}/issue, POST /rebate-claims/{id}/inspector-verification"

  - priority: 40
    category: existence
    rule: "Every id in the path and every FK in the payload must resolve to an existing row; the entity named by the path segment is checked before payload FKs, and payload FKs are checked in the field order declared in §1.1"
    error_id: "ERR_UTILITY_PROGRAM_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DUCT_SYSTEM_NOT_FOUND | ERR_LEAKAGE_TEST_NOT_FOUND | ERR_SEAL_JOB_NOT_FOUND | ERR_VERIFICATION_REPORT_NOT_FOUND | ERR_REBATE_CLAIM_NOT_FOUND | ERR_COMFORT_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or an FK payload field"

  - priority: 50
    category: request_validity
    rule: "Required fields present; enum values in range; numbers of the declared type; measured/design/pressure quantities strictly greater than zero; percentages within 0..100; cents non-negative integers; ISO 8601 UTC timestamps well formed; limit in 1..100 and offset >= 0; unknown fields ignored rather than rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body or query string"

  - priority: 60
    category: state
    rule: "The target entity must be in a from-state that permits the requested transition per §1.2. Checked BEFORE any business rule, so an action fired from the wrong state reports the state error even when a safety, referential, constraint or fiscal precondition is also unmet. ONE carve-out: POST /seal-jobs/{id}/resume aimed at a SealJob in ABORTED_SAFETY skips this rule and falls through to priority 80(d), because that from-state was produced by the safety cutoff itself and the caller is entitled to hear why; every OTHER action aimed at an ABORTED_SAFETY job (pause, complete-seal, leakage-samples, warranty-registration) still reports ERR_SEAL_JOB_INVALID_STATE here."
    error_id: "ERR_LEAKAGE_TEST_INVALID_STATE | ERR_SEAL_JOB_INVALID_STATE | ERR_DUCT_SYSTEM_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_COMPLAINT_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 70
    category: concurrency
    rule: "When the endpoint declares an expected_<parent>_version input, it must equal the named parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_DUCT_SYSTEM_VERSION | ERR_STALE_SEAL_JOB_VERSION"
    http_status: 412
    applies_to: "POST /seal-jobs, POST /verification-reports"

  - priority: 80
    category: business_safety
    rule: "Combustion-safety gating. (a) Starting injection requires an accepted PRE-phase CombustionTest on the project whose verdict is PASS or MARGINAL; a missing PRE test is ERR_COMBUSTION_SAFETY_REQUIRED and a FAIL verdict is ERR_COMBUSTION_SPILLAGE_FAIL. (b) Issuing a VerificationReport requires a POST-phase CombustionTest with verdict PASS or MARGINAL. (c) No SealJob may advance while its Project.status == SAFETY_HOLD (ERR_PROJECT_SAFETY_HOLD). (d) A LeakageSample whose injection_pressure_pa exceeds MAX_INJECTION_PA is accepted but trips the safety cutoff; requesting resume on a job the cutoff drove to ABORTED_SAFETY is ERR_INJECTION_PRESSURE_LIMIT (this is the priority-60 carve-out: the state rule stands aside only for resume, and only for ABORTED_SAFETY)."
    error_id: "ERR_COMBUSTION_SAFETY_REQUIRED | ERR_COMBUSTION_SPILLAGE_FAIL | ERR_PROJECT_SAFETY_HOLD | ERR_INJECTION_PRESSURE_LIMIT"
    http_status: 422
    applies_to: "POST /seal-jobs/{id}/start-injection, POST /seal-jobs/{id}/resume, POST /seal-jobs/{id}/complete-seal, POST /verification-reports/{id}/issue, POST /rebate-claims, POST /rebate-claims/{id}/resubmit"

  - priority: 90
    category: business_referential
    rule: "Cross-entity coherence of the artifacts being wired together: a SealJob's pre_test_id must be an ACCEPTED PRE-phase LeakageTest on the SAME duct system (ERR_PRE_TEST_SYSTEM_MISMATCH for a foreign system, ERR_TEST_PHASE_MISMATCH for the wrong phase); a VerificationReport's post_test_id must be an ACCEPTED POST-phase test on the job's duct system; a RebateClaim's utility_program_id must equal the report's Project.utility_program_id; retest_of_job_id must point at a SealJob in status VERIFIED or RETEST_REQUIRED on the same duct system (ERR_RETEST_TARGET_INVALID); a DuctSystem with eligibility_status == EXCLUDED accepts no new SealJob (ERR_DUCT_SYSTEM_EXCLUDED) and one still PENDING_SCREENING accepts none either (ERR_ASBESTOS_SCREENING_REQUIRED)"
    error_id: "ERR_PRE_TEST_SYSTEM_MISMATCH | ERR_TEST_PHASE_MISMATCH | ERR_RETEST_TARGET_INVALID | ERR_DUCT_SYSTEM_EXCLUDED | ERR_ASBESTOS_SCREENING_REQUIRED | ERR_PROGRAM_MISMATCH"
    http_status: 422
    applies_to: "POST /seal-jobs, POST /verification-reports, POST /rebate-claims"

  - priority: 100
    category: business_constraint
    rule: "Structural and completeness constraints: the assigned Technician must hold an ACTIVE certification (ERR_TECHNICIAN_NOT_CERTIFIED) that has not expired against the logical clock (ERR_CERTIFICATION_EXPIRED); start-injection requires masked_register_count == DuctSystem.total_register_count (ERR_MASKING_INCOMPLETE); balancing a ComfortComplaint requires at least one AirflowReading (ERR_NO_AIRFLOW_READINGS); LeakageSample.sample_seq must equal SealJob.sample_count + 1 (ERR_SAMPLE_SEQUENCE_INVALID); AirflowReading.reading_seq must be unique per (comfort_complaint_id, room_label) (ERR_DUPLICATE_READING_SEQ)"
    error_id: "ERR_TECHNICIAN_NOT_CERTIFIED | ERR_CERTIFICATION_EXPIRED | ERR_MASKING_INCOMPLETE | ERR_NO_AIRFLOW_READINGS | ERR_SAMPLE_SEQUENCE_INVALID | ERR_DUPLICATE_READING_SEQ"
    http_status: 422
    applies_to: "POST /seal-jobs, POST /seal-jobs/{id}/start-injection, POST /seal-jobs/{id}/leakage-samples, POST /comfort-complaints/{id}/balance, POST /comfort-complaints/{id}/airflow-readings"

  - priority: 110
    category: business_temporal
    rule: "Interval and window rules: a Technician may not hold two SealJobs whose [scheduled_start_at, scheduled_end_at) half-open windows overlap — sharing an endpoint instant is allowed (ERR_TECHNICIAN_SCHEDULE_CONFLICT); two LeakageTests on the same duct system may not fall inside each other's [window_start_at - STABILIZATION_BUFFER_MINUTES, window_end_at + STABILIZATION_BUFFER_MINUTES] CLOSED buffered interval (STABILIZATION_BUFFER_MINUTES = 30), so touching endpoints DO conflict (ERR_TEST_WINDOW_CONFLICT); a follow-up re-test SealJob may not be created once the logical clock is strictly past the parent job's retest_due_at (ERR_RETEST_WINDOW_ELAPSED)"
    error_id: "ERR_TECHNICIAN_SCHEDULE_CONFLICT | ERR_TEST_WINDOW_CONFLICT | ERR_RETEST_WINDOW_ELAPSED"
    http_status: 409
    applies_to: "POST /seal-jobs, POST /leakage-tests"

  - priority: 120
    category: business_fiscal
    rule: "Money and performance gates on the guarantee and the rebate, evaluated in this order: (a) on POST /verification-reports/{id}/issue the SYSTEM_BASIS reduction on the report must be >= guarantee_threshold_pct (ERR_GUARANTEE_NOT_MET); (b) on claim creation and resubmission the WHOLE_HOUSE_BASIS reduction must reach UtilityProgram.min_reduction_pct (ERR_REBATE_REDUCTION_BELOW_PROGRAM_MINIMUM); (c) then the computed payable_cents must fit inside UtilityProgram.remaining_budget_cents (ERR_PROGRAM_BUDGET_EXCEEDED)"
    error_id: "ERR_GUARANTEE_NOT_MET | ERR_REBATE_REDUCTION_BELOW_PROGRAM_MINIMUM | ERR_PROGRAM_BUDGET_EXCEEDED"
    http_status: 422
    applies_to: "POST /verification-reports/{id}/issue, POST /rebate-claims, POST /rebate-claims/{id}/resubmit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Every path is rooted at api_prefix /duct-sealing. Every first-level resource id
# segment is literally {id}.
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/duct-sealing/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit ISO 8601 UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, certification expiry, warranty re-test window and *_at stamp in this scaffold reads this clock."
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock := to_iso8601; no entity is mutated and no derived field is recomputed eagerly"

  # --- UtilityProgram ---
  - method: POST
    path: "/duct-sealing/utility-programs"
    description: "Register a utility duct-sealing rebate program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, rebate_basis, rate_cents_per_cfm_reduced, pct_of_invoice_bps, cap_cents, annual_budget_cents, min_reduction_pct, "requires_inspector_verification?", "combustion_safety_required?"]
    output: UtilityProgram
    side_effects:
      - "committed_rebate_cents=0, paid_rebate_cents=0"
      - "remaining_budget_cents=annual_budget_cents"
      - "version=1"

  - method: GET
    path: "/duct-sealing/utility-programs/{id}"
    description: "Read one utility program including its live budget ledger"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: UtilityProgram
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/duct-sealing/technicians"
    description: "Register a field technician"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, license_number, "certification_status?", "certification_expires_at?"]
    output: Technician
    side_effects:
      - "certification_status defaults to PENDING when omitted"
      - "open_seal_job_count=0, version=1"

  - method: GET
    path: "/duct-sealing/technicians/{id}"
    description: "Read one technician, including certification standing and the open seal-job count"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: Technician

  - method: POST
    path: "/duct-sealing/technicians/{id}/certification"
    description: "Record or change a technician's Aeroseal certification standing and expiry"
    roles: [ProgramAdmin]
    code: 200
    input: [certification_status, certification_expires_at]
    output: Technician
    side_effects:
      - "certification_status and certification_expires_at replaced"
      - "increments Technician.version by 1"

  # --- Project ---
  - method: POST
    path: "/duct-sealing/projects"
    description: "Open a retrofit project for a dwelling"
    roles: [ProgramAdmin]
    code: 201
    input: ["utility_program_id?", address_line, conditioned_floor_area_sqft, gas_appliance_count, invoice_amount_cents]
    output: Project
    side_effects:
      - "status=ACTIVE, safety_hold=false, safety_hold_reason=null"
      - "duct_system_count=0, eligible_duct_system_count=0, version=1"

  - method: GET
    path: "/duct-sealing/projects/{id}"
    description: "Read one project"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/duct-sealing/projects"
    description: "List projects, optionally filtered by program or posture; reverse-reachability channel for Project.utility_program_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["utility_program_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/projects/{id}/safety-hold"
    description: "Place the project on safety hold, freezing every seal job and rebate submission under it"
    roles: [ProgramAdmin, QAVerifier]
    code: 200
    input: [safety_hold_reason]
    output: Project
    side_effects:
      - "status ACTIVE -> SAFETY_HOLD, safety_hold=true, safety_hold_reason stamped"
      - "every SealJob under the project with status IN {SCHEDULED, MASKING, INJECTING} is driven to PAUSED (INJECTING) or left in place (SCHEDULED, MASKING) per §1.2"
      - "increments Project.version by 1"

  - method: POST
    path: "/duct-sealing/projects/{id}/release-safety-hold"
    description: "Clear the project's safety hold once combustion safety has been re-established"
    roles: [ProgramAdmin]
    code: 200
    input: [release_note]
    output: Project
    side_effects:
      - "status SAFETY_HOLD -> ACTIVE, safety_hold=false, safety_hold_reason=null"
      - "paused jobs are NOT auto-resumed; each requires an explicit POST /seal-jobs/{id}/resume"
      - "increments Project.version by 1"

  # --- DuctSystem ---
  - method: POST
    path: "/duct-sealing/projects/{id}/duct-systems"
    description: "Add a duct system to the project; project_id is taken from the path"
    roles: [ProgramAdmin, FieldTechnician]
    code: 201
    input: [system_label, total_register_count, design_cfm, duct_material, condition_grade]
    output: DuctSystem
    side_effects:
      - "asbestos_screening_result=PENDING, eligibility_status=PENDING_SCREENING, seal_status=SEAL_PENDING"
      - "sealed_leakage_reduction_cfm=0.00, baseline_leakage_cfm25=null, working_leakage_cfm25=null"
      - "active_seal_job_id=null, version=1"
      - "increments Project.duct_system_count by 1 (eligible_duct_system_count is NOT touched until screening clears the system)"

  - method: GET
    path: "/duct-sealing/projects/{id}/duct-systems"
    description: "List the duct systems of a project; reverse-reachability channel for DuctSystem.project_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["eligibility_status?", "seal_status?"]
    output: DuctSystem[]
    side_effects: []

  - method: GET
    path: "/duct-sealing/duct-systems/{id}"
    description: "Read one duct system including its leakage ledger and version"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: DuctSystem
    side_effects: []

  - method: POST
    path: "/duct-sealing/duct-systems/{id}/asbestos-screening"
    description: "Record the asbestos lab screening result for a duct system; a CONFIRMED result starts the retrofit-exclusion cascade"
    roles: [ProgramAdmin, QAVerifier]
    code: 200
    input: [asbestos_screening_result, lab_reference]
    output: DuctSystem
    side_effects:
      - "asbestos_screening_result and lab_reference stamped"
      - "CLEARED and condition_grade != FAIL and duct_material != ASBESTOS_WRAP -> eligibility_status PENDING_SCREENING -> ELIGIBLE; Project.eligible_duct_system_count += 1"
      - "CLEARED and (condition_grade == FAIL or duct_material == ASBESTOS_WRAP) -> eligibility_status EXCLUDED with exclusion_reason STRUCTURAL_DAMAGE or MATERIAL_NOT_SEALABLE"
      - "CONFIRMED -> eligibility_status EXCLUDED, exclusion_reason=ASBESTOS_CONFIRMED, then the depth-4 cascade of §1.2: every SealJob on the system with status IN {SCHEDULED, MASKING, INJECTING, PAUSED, SEALED, VERIFIED, RETEST_REQUIRED} -> ABORTED_EXCLUSION; each aborted job's VerificationReport in status ISSUED or CORRECTION_REQUIRED -> VOIDED; each voided report's RebateClaim in status SUBMITTED, APPROVED or RETURNED_FOR_CORRECTION -> WITHDRAWN with committed=false and UtilityProgram.committed_rebate_cents decreased by payable_cents"
      - "SUSPECT leaves eligibility_status at PENDING_SCREENING pending a re-screen"
      - "increments DuctSystem.version by 1"

  - method: POST
    path: "/duct-sealing/duct-systems/{id}/exclude"
    description: "Exclude a duct system from the retrofit for a non-asbestos reason (damage, inaccessibility, unsealable material)"
    roles: [ProgramAdmin]
    code: 200
    input: [exclusion_reason]
    output: DuctSystem
    side_effects:
      - "eligibility_status -> EXCLUDED with the supplied exclusion_reason; the same cascade as a CONFIRMED screening runs"
      - "Project.eligible_duct_system_count decreases by 1 when the system was ELIGIBLE"
      - "increments DuctSystem.version by 1"

  # --- LeakageTest ---
  - method: POST
    path: "/duct-sealing/leakage-tests"
    description: "Reserve a pre- or post-test measurement window on a duct system"
    roles: [FieldTechnician, QAVerifier]
    code: 201
    input: [duct_system_id, phase, method, window_start_at, window_end_at]
    output: LeakageTest
    side_effects:
      - "status=DRAFT; test_pressure_pa, fan_ring_config, masked_register_count, measured_leakage_cfm, ambient_temp_f all null"
      - "normalized_leakage_cfm25=null, leakage_per_100_sqft=null, version=1"
      - "rejected with ERR_TEST_WINDOW_CONFLICT when the CLOSED buffered interval [window_start_at - 30min, window_end_at + 30min] intersects that of another non-REJECTED test on the same duct system"

  - method: GET
    path: "/duct-sealing/leakage-tests/{id}"
    description: "Read one leakage test with its normalized results"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: LeakageTest
    side_effects: []

  - method: GET
    path: "/duct-sealing/duct-systems/{id}/leakage-tests"
    description: "List the leakage tests of a duct system; reverse-reachability channel for LeakageTest.duct_system_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["phase?", "status?"]
    output: LeakageTest[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/leakage-tests/{id}/pressurize"
    description: "Set up system pressurization: install the calibrated fan ring, mask registers and hold the setpoint"
    roles: [FieldTechnician]
    code: 200
    input: [test_pressure_pa, fan_ring_config, masked_register_count]
    output: LeakageTest
    side_effects:
      - "status DRAFT -> PRESSURIZED; test_pressure_pa, fan_ring_config, masked_register_count stamped"
      - "increments LeakageTest.version by 1"

  - method: POST
    path: "/duct-sealing/leakage-tests/{id}/record"
    description: "Record the raw fan flow at the held setpoint and normalize it to 25 Pa"
    roles: [FieldTechnician]
    code: 200
    input: [measured_leakage_cfm, ambient_temp_f]
    output: LeakageTest
    side_effects:
      - "status PRESSURIZED -> RECORDED; measured_leakage_cfm and ambient_temp_f stamped"
      - "runs calculations.normalized_duct_leakage -> normalized_leakage_cfm25 then leakage_per_100_sqft, in that pinned order"
      - "performed_by_user_id = X-User-ID"
      - "increments LeakageTest.version by 1"

  - method: POST
    path: "/duct-sealing/leakage-tests/{id}/review"
    description: "QA review of a recorded measurement; decision is ACCEPT or REJECT"
    roles: [QAVerifier]
    code: 200
    input: [decision, "review_note?"]
    output: LeakageTest
    side_effects:
      - "status RECORDED -> ACCEPTED on ACCEPT, RECORDED -> REJECTED on REJECT"
      - "reviewed_by_user_id = X-User-ID; review_note stamped"
      - "on ACCEPT of a PRE-phase test: DuctSystem.baseline_leakage_cfm25 := normalized_leakage_cfm25, DuctSystem.working_leakage_cfm25 := the same value, DuctSystem.sealed_leakage_reduction_cfm := 0.00"
      - "increments LeakageTest.version by 1 and DuctSystem.version by 1 when the baseline is set"

  # --- CombustionTest ---
  - method: POST
    path: "/duct-sealing/projects/{id}/combustion-tests"
    description: "Run a combustion spillage / CO / worst-case-depressurization test on one appliance; project_id comes from the path"
    roles: [FieldTechnician]
    code: 201
    input: [appliance_label, appliance_type, phase, spillage_seconds, co_ppm_air_free, draft_pressure_pa, worst_case_depressurization_pa]
    output: CombustionTest
    side_effects:
      - "runs calculations.combustion_safety_verdict -> verdict"
      - "performed_by_user_id = X-User-ID; version=1"
      - "verdict == FAIL drives Project.status ACTIVE -> SAFETY_HOLD with safety_hold=true and safety_hold_reason = 'combustion spillage failure on ' + appliance_label, and every SealJob under the project in status INJECTING -> PAUSED"

  - method: GET
    path: "/duct-sealing/projects/{id}/combustion-tests"
    description: "List the combustion tests of a project; reverse-reachability channel for CombustionTest.project_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["phase?", "verdict?"]
    output: CombustionTest[]
    side_effects: []

  # --- SealJob ---
  - method: POST
    path: "/duct-sealing/seal-jobs"
    description: "Schedule an aerosol sealing run against an eligible duct system and an accepted pre-test. Optimistic concurrency: expected_duct_system_version must equal the duct system's current version."
    roles: [FieldTechnician]
    code: 201
    input: [duct_system_id, pre_test_id, technician_id, "retest_of_job_id?", scheduled_start_at, scheduled_end_at, target_leakage_cfm, expected_duct_system_version]
    output: SealJob
    side_effects:
      - "status=SCHEDULED; masked_register_labels=[], masked_register_count=0, sample_count=0, current_leakage_cfm=null"
      - "target_reached=false, stall_flag=false, pause_count=0, warranty_status=NOT_REGISTERED, warranty_suspended=false, version=1"
      - "Technician.open_seal_job_count += 1; DuctSystem.active_seal_job_id := this job's id"
      - "any pre-existing SealJob on the same duct_system_id whose status == SCHEDULED moves to ABORTED_SUPERSEDED with abort_reason = 'superseded by a newer scheduled job' and Technician.open_seal_job_count decreased by 1 for its technician"
      - "when retest_of_job_id names a SealJob of this system in status RETEST_REQUIRED, the duct system is reopened: seal_status VERIFIED -> SEAL_PENDING, working_leakage_cfm25 := baseline_leakage_cfm25, sealed_leakage_reduction_cfm := 0.00"
      - "increments DuctSystem.version by 1"

  - method: GET
    path: "/duct-sealing/seal-jobs/{id}"
    description: "Read one seal job including its live curve state, warranty fields and version"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: SealJob
    side_effects: []

  - method: GET
    path: "/duct-sealing/seal-jobs"
    description: "List seal jobs; the single filtered-list reverse-reachability channel for SealJob.duct_system_id, SealJob.pre_test_id, SealJob.technician_id and the self-referential SealJob.retest_of_job_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["duct_system_id?", "pre_test_id?", "technician_id?", "retest_of_job_id?", "status?", "limit?", "offset?"]
    output: SealJob[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/masks"
    description: "Mask registers for the sealing run; appends distinct labels to masked_register_labels"
    roles: [FieldTechnician]
    code: 200
    input: [register_labels]
    output: SealJob
    side_effects:
      - "status SCHEDULED -> MASKING on the first call; subsequent calls keep MASKING"
      - "masked_register_labels extended with the not-yet-present labels in call order; masked_register_count recomputed"
      - "increments SealJob.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/start-injection"
    description: "Begin the aerosol injection run; requires masking complete, a certified technician and a passing pre-phase combustion test"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: SealJob
    side_effects:
      - "status MASKING -> INJECTING"
      - "DuctSystem.seal_status SEAL_PENDING -> SEALING"
      - "increments SealJob.version by 1 and DuctSystem.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/leakage-samples"
    description: "Append one point to the real-time leakage curve; seal_job_id comes from the path"
    roles: [FieldTechnician]
    code: 201
    input: [sample_seq, elapsed_seconds, instantaneous_leakage_cfm, injection_pressure_pa]
    output: LeakageSample
    side_effects:
      - "runs calculations.sealing_run_curve_monitor: seal_rate_cfm_per_min (null while sample_seq < 3), cutoff_triggered"
      - "SealJob.sample_count += 1; SealJob.current_leakage_cfm := instantaneous_leakage_cfm; target_reached latched when the reading is <= target_leakage_cfm"
      - "DuctSystem.working_leakage_cfm25 := instantaneous_leakage_cfm; DuctSystem.sealed_leakage_reduction_cfm := baseline_leakage_cfm25 - working_leakage_cfm25"
      - "injection_pressure_pa > 1000.0 sets cutoff_triggered=true and drives SealJob INJECTING -> ABORTED_SAFETY, DuctSystem.seal_status SEALING -> SEAL_PENDING with the leakage ledger restored to baseline"
      - "otherwise a 3-sample seal rate strictly below 0.50 drives SealJob INJECTING -> PAUSED with stall_flag=true and pause_count += 1"
      - "increments SealJob.version and DuctSystem.version by 1 each"

  - method: GET
    path: "/duct-sealing/seal-jobs/{id}/leakage-samples"
    description: "Read the full leakage curve of a run in sample_seq order; reverse-reachability channel for LeakageSample.seal_job_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: LeakageSample[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/pause"
    description: "Manually pause an injection run"
    roles: [FieldTechnician]
    code: 200
    input: [pause_reason]
    output: SealJob
    side_effects:
      - "status INJECTING -> PAUSED; pause_count += 1; stall_flag unchanged"
      - "increments SealJob.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/resume"
    description: "Resume a paused injection run; blocked while the project is on safety hold or the run was aborted by the pressure cutoff"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: SealJob
    side_effects:
      - "status PAUSED -> INJECTING; stall_flag=false"
      - "increments SealJob.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/complete-seal"
    description: "Close out the injection run once the target leakage has been reached"
    roles: [FieldTechnician]
    code: 200
    input: [sealant_lbs_used]
    output: SealJob
    side_effects:
      - "status INJECTING -> SEALED; sealant_lbs_used stamped"
      - "DuctSystem.seal_status SEALING -> SEALED; DuctSystem.active_seal_job_id := null; Technician.open_seal_job_count -= 1"
      - "increments SealJob.version by 1 and DuctSystem.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/abort"
    description: "Abort a run manually from SCHEDULED, MASKING, INJECTING or PAUSED"
    roles: [FieldTechnician, ProgramAdmin]
    code: 200
    input: [abort_reason]
    output: SealJob
    side_effects:
      - "status -> ABORTED_MANUAL; abort_reason stamped"
      - "DuctSystem.seal_status SEALING -> SEAL_PENDING; DuctSystem.working_leakage_cfm25 := baseline_leakage_cfm25; DuctSystem.sealed_leakage_reduction_cfm := 0.00 (compensation restores the ledger identity exactly)"
      - "DuctSystem.active_seal_job_id := null; Technician.open_seal_job_count -= 1"
      - "increments SealJob.version by 1 and DuctSystem.version by 1"

  - method: POST
    path: "/duct-sealing/seal-jobs/{id}/warranty-registration"
    description: "Register the homeowner warranty on a verified run and schedule the follow-up re-test"
    roles: [ProgramAdmin]
    code: 200
    input: [homeowner_name, homeowner_email]
    output: SealJob
    side_effects:
      - "requires status == VERIFIED"
      - "warranty_registered_at := logical clock; retest_due_at := warranty_registered_at + 365 days; warranty_status -> REGISTERED"
      - "homeowner_name and homeowner_email stamped"
      - "increments SealJob.version by 1"

  # --- VerificationReport ---
  - method: POST
    path: "/duct-sealing/verification-reports"
    description: "Draft the post-test verification report for a sealed run. Optimistic concurrency: expected_seal_job_version must equal the seal job's current version."
    roles: [QAVerifier]
    code: 201
    input: [seal_job_id, post_test_id, expected_seal_job_version]
    output: VerificationReport
    side_effects:
      - "status=DRAFT, correction_round=0, issued_by_user_id=null, issued_at=null, version=1"
      - "copies pre_leakage_cfm25 from SealJob.pre_test_id and post_leakage_cfm25 from post_test_id"
      - "runs calculations.leakage_reduction_basis: reduction_pct_system_basis (SYSTEM_BASIS), reduction_pct_whole_house_basis and cfm_reduced_whole_house (WHOLE_HOUSE_BASIS), guarantee_threshold_pct, guarantee_met"
      - "any earlier DRAFT report on the same seal_job_id moves DRAFT -> VOIDED"
      - "increments SealJob.version by 1"

  - method: GET
    path: "/duct-sealing/verification-reports/{id}"
    description: "Read one verification report with both reduction bases and the guarantee outcome"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: VerificationReport
    side_effects: []

  - method: GET
    path: "/duct-sealing/verification-reports"
    description: "List verification reports; the filtered-list reverse-reachability channel for VerificationReport.seal_job_id and VerificationReport.post_test_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["seal_job_id?", "post_test_id?", "status?", "limit?", "offset?"]
    output: VerificationReport[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/verification-reports/{id}/issue"
    description: "Issue (or re-issue after a correction) the verification report, which verifies the run and stamps the guarantee outcome"
    roles: [QAVerifier]
    code: 200
    input: [signature_note]
    output: VerificationReport
    side_effects:
      - "status DRAFT -> ISSUED, or CORRECTION_REQUIRED -> ISSUED on re-issue"
      - "stores issued_by_user_id = X-User-ID, issued_at = logical clock, signature_note"
      - "SealJob.status SEALED -> VERIFIED (or RETEST_REQUIRED -> VERIFIED with warranty_suspended=false on re-issue); DuctSystem.seal_status -> VERIFIED"
      - "when SealJob.retest_of_job_id is not null the referenced parent job moves RETEST_REQUIRED -> RETEST_CLOSED"
      - "increments VerificationReport.version, SealJob.version and DuctSystem.version by 1 each"

  # --- RebateClaim ---
  - method: POST
    path: "/duct-sealing/rebate-claims"
    description: "Submit the utility rebate claim built on an issued verification report; the payable amount is computed once here and frozen"
    roles: [ProgramAdmin]
    code: 201
    input: [verification_report_id, utility_program_id, documentation_bundle_ref]
    output: RebateClaim
    side_effects:
      - "status=SUBMITTED, committed=true, inspector_outcome=PENDING, resubmission_count=0, version=1"
      - "runs calculations.rebate_payable_amount: per_cfm_candidate_cents, percent_of_invoice_candidate_cents, basis_applied, tier_bonus_pct, capped_subtotal_cents, admin_fee_cents, payable_cents (cap applied before the admin fee)"
      - "UtilityProgram.committed_rebate_cents += payable_cents; remaining_budget_cents falls by the same amount"
      - "increments UtilityProgram.version by 1"

  - method: GET
    path: "/duct-sealing/rebate-claims/{id}"
    description: "Read one rebate claim with both base candidates, the frozen payable amount and the inspector spot-check result"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: RebateClaim
    side_effects: []

  - method: GET
    path: "/duct-sealing/rebate-claims"
    description: "List rebate claims; the filtered-list reverse-reachability channel for RebateClaim.verification_report_id and RebateClaim.utility_program_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["verification_report_id?", "utility_program_id?", "status?", "limit?", "offset?"]
    output: RebateClaim[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/rebate-claims/{id}/inspector-verification"
    description: "Utility inspector re-measures the sealed system and records the spot check; a variance above tolerance returns the claim and cascades a re-test requirement"
    roles: [UtilityInspector]
    code: 200
    input: [spot_check_leakage_cfm, spot_check_pressure_pa]
    output: RebateClaim
    side_effects:
      - "runs calculations.inspector_spot_check_variance -> spot_check_cfm25, inspector_variance_pct, inspector_outcome"
      - "stores inspector_user_id = X-User-ID and the raw spot-check inputs"
      - "PASS: status SUBMITTED -> APPROVED, commitment untouched"
      - "FAIL: status SUBMITTED -> RETURNED_FOR_CORRECTION, committed=false, UtilityProgram.committed_rebate_cents -= payable_cents; then VerificationReport ISSUED -> CORRECTION_REQUIRED with correction_round += 1; then that report's SealJob VERIFIED -> RETEST_REQUIRED with warranty_suspended=true"
      - "increments RebateClaim.version by 1 (and on FAIL also UtilityProgram.version, VerificationReport.version and SealJob.version by 1 each)"

  - method: POST
    path: "/duct-sealing/rebate-claims/{id}/resubmit"
    description: "Resubmit a returned claim with corrected documentation once the report has been re-issued; the frozen money is never recomputed"
    roles: [ProgramAdmin]
    code: 200
    input: [documentation_bundle_ref]
    output: RebateClaim
    side_effects:
      - "status RETURNED_FOR_CORRECTION -> SUBMITTED; resubmission_count += 1"
      - "documentation_bundle_ref replaced; inspector_outcome reset to PENDING; spot_check_leakage_cfm, spot_check_pressure_pa, spot_check_cfm25, inspector_variance_pct and inspector_user_id cleared"
      - "committed=true; UtilityProgram.committed_rebate_cents += payable_cents"
      - "increments RebateClaim.version and UtilityProgram.version by 1 each"

  - method: POST
    path: "/duct-sealing/rebate-claims/{id}/pay"
    description: "Pay an approved rebate claim"
    roles: [ProgramAdmin]
    code: 200
    input: [payment_reference]
    output: RebateClaim
    side_effects:
      - "status APPROVED -> PAID; payment_reference stamped; committed=false"
      - "UtilityProgram.committed_rebate_cents -= payable_cents and paid_rebate_cents += payable_cents, so remaining_budget_cents is unchanged"
      - "increments RebateClaim.version and UtilityProgram.version by 1 each"

  # --- ComfortComplaint ---
  - method: POST
    path: "/duct-sealing/comfort-complaints"
    description: "Log a homeowner comfort complaint against a project"
    roles: [ProgramAdmin, FieldTechnician]
    code: 201
    input: [project_id, room_label, complaint_type, reported_by]
    output: ComfortComplaint
    side_effects:
      - "status=OPEN; diagnosis_code=null, tolerance_pct=null, damper_adjustment_note=null, resolved_at=null"
      - "balanced_room_count=0, rebalance_count=0, version=1"

  - method: GET
    path: "/duct-sealing/comfort-complaints/{id}"
    description: "Read one comfort complaint with its balancing roll-up"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: []
    output: ComfortComplaint
    side_effects: []

  - method: GET
    path: "/duct-sealing/projects/{id}/comfort-complaints"
    description: "List the comfort complaints of a project; reverse-reachability channel for ComfortComplaint.project_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["status?"]
    output: ComfortComplaint[]
    side_effects: []

  - method: POST
    path: "/duct-sealing/comfort-complaints/{id}/diagnose"
    description: "Record the room-by-room airflow diagnosis and the balancing tolerance that will govern the readings"
    roles: [FieldTechnician]
    code: 200
    input: [diagnosis_code, tolerance_pct]
    output: ComfortComplaint
    side_effects:
      - "status OPEN -> DIAGNOSED; diagnosis_code and tolerance_pct stamped"
      - "increments ComfortComplaint.version by 1"

  - method: POST
    path: "/duct-sealing/comfort-complaints/{id}/balance"
    description: "Enter the balancing phase after adjusting dampers; requires at least one airflow reading already taken"
    roles: [FieldTechnician]
    code: 200
    input: [damper_adjustment_note]
    output: ComfortComplaint
    side_effects:
      - "status DIAGNOSED -> BALANCING; damper_adjustment_note stamped"
      - "increments ComfortComplaint.version by 1"

  - method: POST
    path: "/duct-sealing/comfort-complaints/{id}/airflow-readings"
    description: "Record one room's measured airflow against its design value; comfort_complaint_id comes from the path"
    roles: [FieldTechnician]
    code: 201
    input: [room_label, reading_seq, measured_cfm, design_cfm, damper_position_pct]
    output: AirflowReading
    side_effects:
      - "runs calculations.airflow_balance_deviation -> deviation_pct, within_tolerance"
      - "measured_by_user_id = X-User-ID"
      - "ComfortComplaint.balanced_room_count recomputed over the latest reading per distinct room_label"
      - "while the complaint is BALANCING: an out-of-tolerance reading reverts status BALANCING -> DIAGNOSED with rebalance_count += 1; once every distinct room is within tolerance the complaint auto-resolves BALANCING -> RESOLVED with resolved_at = logical clock"
      - "increments ComfortComplaint.version by 1"

  - method: GET
    path: "/duct-sealing/comfort-complaints/{id}/airflow-readings"
    description: "List the airflow readings of a complaint in reading_seq order; reverse-reachability channel for AirflowReading.comfort_complaint_id"
    roles: [ProgramAdmin, FieldTechnician, QAVerifier, UtilityInspector]
    code: 200
    input: ["room_label?"]
    output: AirflowReading[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same person who performed the incompatible prior step (technician who recorded a measurement reviewing it; technician assigned to the seal job issuing its report; verifier who issued the report performing the inspector spot check)"

  - id: ERR_UTILITY_PROGRAM_NOT_FOUND
    http: 404
    condition: "utility_program_id in the path or payload matches no UtilityProgram"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "technician_id in the path or payload matches no Technician"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project id in the path or project_id in the payload matches no Project"
  - id: ERR_DUCT_SYSTEM_NOT_FOUND
    http: 404
    condition: "DuctSystem id in the path or duct_system_id in the payload matches no DuctSystem"
  - id: ERR_LEAKAGE_TEST_NOT_FOUND
    http: 404
    condition: "LeakageTest id in the path or pre_test_id / post_test_id in the payload matches no LeakageTest"
  - id: ERR_SEAL_JOB_NOT_FOUND
    http: 404
    condition: "SealJob id in the path or seal_job_id / retest_of_job_id in the payload matches no SealJob"
  - id: ERR_VERIFICATION_REPORT_NOT_FOUND
    http: 404
    condition: "VerificationReport id in the path or verification_report_id in the payload matches no VerificationReport"
  - id: ERR_REBATE_CLAIM_NOT_FOUND
    http: 404
    condition: "RebateClaim id in the path matches no RebateClaim"
  - id: ERR_COMFORT_COMPLAINT_NOT_FOUND
    http: 404
    condition: "ComfortComplaint id in the path matches no ComfortComplaint"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, wrong scalar type, out-of-range number, malformed ISO 8601 instant, window_end_at not strictly after window_start_at, scheduled_end_at not strictly after scheduled_start_at, limit outside 1..100 or negative offset"

  - id: ERR_LEAKAGE_TEST_INVALID_STATE
    http: 409
    condition: "pressurize from a status other than DRAFT, record from a status other than PRESSURIZED, or review from a status other than RECORDED"
  - id: ERR_SEAL_JOB_INVALID_STATE
    http: 409
    condition: "A seal-job action fired from a status the transition table does not allow (masks outside {SCHEDULED, MASKING}, start-injection outside MASKING, sample or pause outside INJECTING, resume outside PAUSED, complete-seal outside INJECTING, abort outside {SCHEDULED, MASKING, INJECTING, PAUSED}, warranty registration outside VERIFIED, or any action on a terminal status)"
  - id: ERR_DUCT_SYSTEM_INVALID_STATE
    http: 409
    condition: "Screening or exclusion attempted on a DuctSystem whose eligibility_status is already EXCLUDED"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "issue attempted on a VerificationReport whose status is neither DRAFT nor CORRECTION_REQUIRED (including VOIDED and already-ISSUED), or a RebateClaim created against a report whose status is not ISSUED"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "inspector-verification outside SUBMITTED, resubmit outside RETURNED_FOR_CORRECTION, or pay outside APPROVED"
  - id: ERR_COMPLAINT_INVALID_STATE
    http: 409
    condition: "diagnose outside OPEN, balance outside DIAGNOSED, or an airflow reading recorded on a RESOLVED complaint"

  - id: ERR_STALE_DUCT_SYSTEM_VERSION
    http: 412
    condition: "expected_duct_system_version supplied to POST /duct-sealing/seal-jobs does not equal the duct system's current version"
  - id: ERR_STALE_SEAL_JOB_VERSION
    http: 412
    condition: "expected_seal_job_version supplied to POST /duct-sealing/verification-reports does not equal the seal job's current version"

  - id: ERR_COMBUSTION_SAFETY_REQUIRED
    http: 422
    condition: "Injection start attempted with no PRE-phase CombustionTest on the project, or report issuance attempted without the required POST-phase combustion coverage"
  - id: ERR_COMBUSTION_SPILLAGE_FAIL
    http: 422
    condition: "The governing CombustionTest verdict is FAIL (CO above the appliance limit, spillage beyond 60 s, or worst-case depressurization above the limit with a weak draft)"
  - id: ERR_PROJECT_SAFETY_HOLD
    http: 422
    condition: "A seal-job advance, report issuance or rebate submission attempted while Project.safety_hold == true"
  - id: ERR_INJECTION_PRESSURE_LIMIT
    http: 422
    condition: "Resume attempted on a run that the injection-pressure safety cutoff already drove to ABORTED_SAFETY"

  - id: ERR_PRE_TEST_SYSTEM_MISMATCH
    http: 422
    condition: "pre_test_id (or post_test_id) belongs to a LeakageTest whose duct_system_id differs from the seal job's duct system"
  - id: ERR_TEST_PHASE_MISMATCH
    http: 422
    condition: "pre_test_id is not a PRE-phase test, post_test_id is not a POST-phase test, or the referenced test is not in status ACCEPTED"
  - id: ERR_RETEST_TARGET_INVALID
    http: 422
    condition: "retest_of_job_id points at a SealJob on a different duct system or in a status other than VERIFIED or RETEST_REQUIRED"
  - id: ERR_DUCT_SYSTEM_EXCLUDED
    http: 422
    condition: "A SealJob is created against a DuctSystem whose eligibility_status == EXCLUDED (asbestos-containing, damaged, unsealable or inaccessible ductwork)"
  - id: ERR_ASBESTOS_SCREENING_REQUIRED
    http: 422
    condition: "A SealJob is created against a DuctSystem still in eligibility_status PENDING_SCREENING"
  - id: ERR_PROGRAM_MISMATCH
    http: 422
    condition: "RebateClaim.utility_program_id differs from the Project.utility_program_id behind the verification report, or the project has no program at all"

  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "The assigned Technician's certification_status is not ACTIVE"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "The assigned Technician's certification_status is ACTIVE but certification_expires_at is at or before the logical clock"
  - id: ERR_MASKING_INCOMPLETE
    http: 422
    condition: "start-injection attempted while masked_register_count < DuctSystem.total_register_count, including the zero-register case"
  - id: ERR_NO_AIRFLOW_READINGS
    http: 422
    condition: "balance attempted on a complaint with no AirflowReading rows"
  - id: ERR_SAMPLE_SEQUENCE_INVALID
    http: 422
    condition: "LeakageSample.sample_seq does not equal SealJob.sample_count + 1"
  - id: ERR_DUPLICATE_READING_SEQ
    http: 422
    condition: "AirflowReading.reading_seq already exists for the same (comfort_complaint_id, room_label)"

  - id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http: 409
    condition: "The technician already owns a non-terminal SealJob whose [scheduled_start_at, scheduled_end_at) half-open window overlaps the requested one; sharing only an endpoint instant does not conflict"
  - id: ERR_TEST_WINDOW_CONFLICT
    http: 409
    condition: "Another non-REJECTED LeakageTest on the same duct system has a [window_start_at - 30 min, window_end_at + 30 min] CLOSED buffered interval that intersects the requested one; touching buffered endpoints DO conflict"
  - id: ERR_RETEST_WINDOW_ELAPSED
    http: 409
    condition: "A follow-up re-test SealJob is created when the logical clock is strictly after the parent job's retest_due_at"

  - id: ERR_GUARANTEE_NOT_MET
    http: 422
    condition: "Report issuance attempted while reduction_pct_system_basis is strictly below guarantee_threshold_pct"
  - id: ERR_REBATE_REDUCTION_BELOW_PROGRAM_MINIMUM
    http: 422
    condition: "Claim creation attempted while reduction_pct_whole_house_basis is strictly below UtilityProgram.min_reduction_pct"
  - id: ERR_PROGRAM_BUDGET_EXCEEDED
    http: 422
    condition: "The computed payable_cents exceeds UtilityProgram.remaining_budget_cents at claim creation or resubmission"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Dealer back-office administrator: sets up utility programs and technicians, opens projects, manages retrofit exclusions, registers warranties, and files, resubmits and pays rebate claims"
    identity: opaque
    exclusive_operations:
      - "POST /duct-sealing/utility-programs"
      - "POST /duct-sealing/technicians"
      - "POST /duct-sealing/technicians/{id}/certification"
      - "POST /duct-sealing/projects"
      - "POST /duct-sealing/projects/{id}/release-safety-hold"
      - "POST /duct-sealing/duct-systems/{id}/exclude"
      - "POST /duct-sealing/seal-jobs/{id}/warranty-registration"
      - "POST /duct-sealing/rebate-claims"
      - "POST /duct-sealing/rebate-claims/{id}/resubmit"
      - "POST /duct-sealing/rebate-claims/{id}/pay"
    shared_operations:
      - "POST /duct-sealing/projects/{id}/safety-hold (with QAVerifier)"
      - "POST /duct-sealing/projects/{id}/duct-systems (with FieldTechnician)"
      - "POST /duct-sealing/duct-systems/{id}/asbestos-screening (with QAVerifier)"
      - "POST /duct-sealing/seal-jobs/{id}/abort (with FieldTechnician)"
      - "POST /duct-sealing/comfort-complaints (with FieldTechnician)"
      - "POST /duct-sealing/_clock/set_current_utc (with all roles)"
      - "every GET endpoint (with all roles)"

  - name: FieldTechnician
    description: "Certified Aeroseal technician who runs pre/post leakage measurements, combustion safety tests, the masking and injection run itself, and room-by-room airflow balancing"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /duct-sealing/leakage-tests/{id}/pressurize"
      - "POST /duct-sealing/leakage-tests/{id}/record"
      - "POST /duct-sealing/projects/{id}/combustion-tests"
      - "POST /duct-sealing/seal-jobs"
      - "POST /duct-sealing/seal-jobs/{id}/masks"
      - "POST /duct-sealing/seal-jobs/{id}/start-injection"
      - "POST /duct-sealing/seal-jobs/{id}/leakage-samples"
      - "POST /duct-sealing/seal-jobs/{id}/pause"
      - "POST /duct-sealing/seal-jobs/{id}/resume"
      - "POST /duct-sealing/seal-jobs/{id}/complete-seal"
      - "POST /duct-sealing/comfort-complaints/{id}/diagnose"
      - "POST /duct-sealing/comfort-complaints/{id}/balance"
      - "POST /duct-sealing/comfort-complaints/{id}/airflow-readings"
    shared_operations:
      - "POST /duct-sealing/leakage-tests (with QAVerifier)"
      - "POST /duct-sealing/projects/{id}/duct-systems (with ProgramAdmin)"
      - "POST /duct-sealing/seal-jobs/{id}/abort (with ProgramAdmin)"
      - "POST /duct-sealing/comfort-complaints (with ProgramAdmin)"
      - "POST /duct-sealing/_clock/set_current_utc (with all roles)"
      - "every GET endpoint (with all roles)"
    note: "X-User-ID for this role is a Technician.id; it is stamped into LeakageTest.performed_by_user_id, CombustionTest.performed_by_user_id and AirflowReading.measured_by_user_id, and it is the value the segregation-of-duties rule compares against SealJob.technician_id."

  - name: QAVerifier
    description: "Quality assurance verifier who accepts or rejects measurements, records asbestos screening outcomes, drafts and issues the post-test verification report and can place a project on safety hold"
    identity: opaque
    exclusive_operations:
      - "POST /duct-sealing/leakage-tests/{id}/review"
      - "POST /duct-sealing/verification-reports"
      - "POST /duct-sealing/verification-reports/{id}/issue"
    shared_operations:
      - "POST /duct-sealing/leakage-tests (with FieldTechnician)"
      - "POST /duct-sealing/duct-systems/{id}/asbestos-screening (with ProgramAdmin)"
      - "POST /duct-sealing/projects/{id}/safety-hold (with ProgramAdmin)"
      - "POST /duct-sealing/_clock/set_current_utc (with all roles)"
      - "every GET endpoint (with all roles)"

  - name: UtilityInspector
    description: "Utility program inspector who independently re-measures a sealed system and records the spot-check verification that gates rebate payment"
    identity: opaque
    exclusive_operations:
      - "POST /duct-sealing/rebate-claims/{id}/inspector-verification"
    shared_operations:
      - "POST /duct-sealing/_clock/set_current_utc (with all roles)"
      - "every GET endpoint (with all roles)"
