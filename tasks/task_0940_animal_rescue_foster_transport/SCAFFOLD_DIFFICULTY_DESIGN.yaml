  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_leg_exclusive_interval_with_trailing_turnaround_buffer
        grounds:
          - calculations.driver_interval_conflict
          - validations[priority=37]
          - errors[ERR_DRIVER_LEG_OVERLAP]
          - entities.TransportLeg.fields.driver_person_id
        distinguishing_aspect: |
          Interval semantics on TransportLeg: EXCLUSIVE half-open occupancy with a 60-minute
          buffer appended only to the END of each existing leg. A candidate departing at 12:59
          on the same day is rejected, and the identical candidate departing at 13:00 — exactly
          arrival plus buffer — is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z."
            - "One licensed driver and one PLANNED relay run."
            - "Leg 1 for that driver runs 2026-05-05T08:00:00Z to 2026-05-05T12:00:00Z, so the driver is occupied until 13:00:00Z."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Milo Frey", email: "milo@example.test", driver_license_number: "CDL-8891" }
              as: PlatformAdmin
              captures: { driver_id: $.data.id }
            - call: "POST /rescue/transport-runs"
              payload: { origin_organization_id: "${org_id}", run_type: "RELAY", origin_hub_code: "HUB-A", destination_hub_code: "HUB-C", purpose: "INTAKE_TRANSPORT" }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 1, origin_hub_code: "HUB-A", destination_hub_code: "HUB-B", scheduled_depart_at: "2026-05-05T08:00:00Z", scheduled_arrive_at: "2026-05-05T12:00:00Z", crate_capacity_units: 8, weight_capacity_lb: 400.0, crosses_state_line: false, species_policy: "ANY" }
              as: PlatformAdmin
              captures: { leg1_id: $.data.id }
          trigger:
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 2, origin_hub_code: "HUB-B", destination_hub_code: "HUB-C", scheduled_depart_at: "2026-05-05T12:59:00Z", scheduled_arrive_at: "2026-05-05T16:00:00Z", crate_capacity_units: 8, weight_capacity_lb: 400.0, crosses_state_line: false, species_policy: "ANY" }
              as: TransportDispatcher
              captures: { overlap_error: $.data.error_id }
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 2, origin_hub_code: "HUB-B", destination_hub_code: "HUB-C", scheduled_depart_at: "2026-05-05T13:00:00Z", scheduled_arrive_at: "2026-05-05T16:00:00Z", crate_capacity_units: 8, weight_capacity_lb: 400.0, crosses_state_line: false, species_policy: "ANY" }
              as: TransportDispatcher
              captures: { leg2_id: $.data.id, leg2_status: $.data.status }
          assert:
            - "overlap_error == ERR_DRIVER_LEG_OVERLAP"
            - "the 12:59 candidate returns HTTP 409"
            - "leg2_status == SCHEDULED"
            - "TransportLeg.${leg2_id}.scheduled_depart_at == 2026-05-05T13:00:00.000Z"
            - "TransportLeg.${leg2_id}.sequence_no == 2"
            - "TransportLeg.${leg1_id}.status == SCHEDULED"

      - name: foster_home_aggregate_capacity_over_concurrent_placements
        grounds:
          - calculations.foster_slot_consumption
          - calculations.foster_headcount_consumption
