            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { s1: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-20" }, as: SchoolAdmin, captures: { s2: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-27" }, as: SchoolAdmin, captures: { s3: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-10-04" }, as: SchoolAdmin, captures: { s4: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-10-11" }, as: SchoolAdmin, captures: { s5: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-10-18" }, as: SchoolAdmin, captures: { s6: $.data.id } }
            - { call: "POST /school/_clock/set_current_utc", payload: { to_iso8601: "2026-10-18T12:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s1}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s2}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s3}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s4}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s5}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s6}/hold", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s1}/attendance", payload: { entries: [{ student_id: "${stu}", status: "PRESENT" }] }, as: SchoolAdmin }
            - { call: "POST /school/sessions/${s2}/attendance", payload: { entries: [{ student_id: "${stu}", status: "PRESENT" }] }, as: SchoolAdmin }
