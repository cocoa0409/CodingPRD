scenario: "Grant Management (Grantee): NOFO/application, budget/period of performance, award/subaward, drawdown/reimbursement, restricted-fund tracking, indirect cost rate, financial/progress report, Single Audit, closeout"
domain_name: grant-management
api_prefix: ""   # endpoints declared as absolute paths (e.g. /applications, /awards, /subawards)

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Flat with foreign-key references: Award, Subaward, Drawdown, FinancialReport,
  # ProgressReport, RestrictedFund, FundAllocation, SingleAudit, AuditFinding,
  # IndirectCostRate, NofoApplication all reference one another by FK in the body;
  # no nested-ownership URL chains. Peer entities linked by FK.

  state_machine_shape: branching
  # NofoApplication: branching (SUBMITTED -> {AWARDED | REJECTED}); revision loop
  #   on Application (UNDER_REVIEW -> REVISIONS_REQUESTED -> SUBMITTED) = cycle.
  # Award has a compound/closeout pipeline with cross-entity gates.
  # FinancialReport has a revise cycle (REJECTED -> DRAFT -> SUBMITTED).

  relationship_patterns:
    - one_to_many        # Award -> Subaward, Award -> Drawdown, Award -> FinancialReport
    - cross_aggregate    # Drawdown debits Award.federal_drawn_cents and RestrictedFund balances
    - self_referential   # NofoApplication.supersedes_application_id (resubmission lineage)

  role_model: segregation_of_duties
  # GrantWriter prepares applications; FinanceOfficer initiates drawdowns and files
  # financial reports; ProgramManager approves progress reports and subawards;
  # Auditor records Single Audit + findings; AgencyOfficer (opaque) issues awards
  # and adjudicates closeout. Segregation: the FinanceOfficer who initiated a
  # drawdown cannot be the same user who certifies its FinancialReport.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: NofoApplication
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: nofo_number
        type: string
        source: input
        description: "Notice of Funding Opportunity identifier the application responds to, e.g. 'NOFO-2026-ED-001'."
        constraints: "non-empty"
      - name: applicant_org_name
        type: string
        source: input
        description: "Legal name of the grantee organization submitting the application."
        constraints: "non-empty"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Total federal funds requested across the full period of performance, in integer cents."
        constraints: ">= 1"
      - name: federal_share_pct
        type: number
        source: input
        description: "Federal share of total project cost as a decimal fraction; recipient cost-share is (1 - this)."
        default: 0.80
        constraints: "0 < federal_share_pct <= 1"
      - name: period_start_date
        type: datetime
        source: input
        description: "Proposed period-of-performance start (ISO 8601 UTC). Half-open interval [start, end)."
      - name: period_end_date
        type: datetime
        source: input
        description: "Proposed period-of-performance end (ISO 8601 UTC, exclusive). Must be strictly after period_start_date."
      - name: supersedes_application_id
        type: string
        source: input
        description: "FK -> NofoApplication.id; nullable. Set on a resubmission to point at the REJECTED prior application this one supersedes (self-referential lineage)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISIONS_REQUESTED, AWARDED, REJECTED, WITHDRAWN}"

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: application_id
        type: string
        source: system
        description: "FK -> NofoApplication.id; the AWARDED application this award was issued from."
      - name: total_award_cents
        type: integer
        source: system
        description: "Total obligated award (full project cost basis), copied from the application's requested_amount_cents at issuance."
      - name: federal_share_pct
        type: number
        source: system
        description: "Federal share fraction copied from the application at issuance; drives federal_ceiling_cents."
      - name: federal_ceiling_cents
        type: integer
        source: computed
        description: "round_half_up(total_award_cents * federal_share_pct) — the maximum federal cash the grantee may draw or be reimbursed over the life of the award."
      - name: period_start_date
        type: datetime
        source: system
        description: "Period-of-performance start, copied from the application (ISO 8601 UTC; half-open [start, end))."
      - name: period_end_date
        type: datetime
        source: system
        description: "Period-of-performance end, copied from the application (ISO 8601 UTC, exclusive)."
      - name: federal_drawn_cents
        type: integer
        source: computed
        description: "Running ledger of federal cash actually disbursed; sum of Drawdown.amount_cents for this award whose status == DISBURSED. Debited on each drawdown disbursement."
        default: 0
      - name: federal_approved_expenditures_cents
        type: integer
        source: computed
        description: "Cumulative approved federal-eligible expenditures = round_half_up(federal_share_pct * sum of FinancialReport.approved_direct_cents over reports whose status == ACCEPTED), excluding disallowed. Drives reimbursement reconciliation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Award lifecycle state."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, PENDING_CLOSEOUT, CLOSED}"

  - name: IndirectCostRate
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award this rate agreement applies to."
      - name: rate_type
        type: enum
        source: input
        description: "Whether the grantee uses a federally NEGOTIATED rate or the 10% DE_MINIMIS rate."
        constraints: "one of {NEGOTIATED, DE_MINIMIS}"
      - name: negotiated_rate
        type: number
        source: input
        description: "Negotiated indirect-cost rate as a decimal fraction (e.g. 0.345). Required and used only when rate_type == NEGOTIATED; for DE_MINIMIS the system applies the 0.10 constant and this field is ignored."
        default: null
        constraints: "0 < negotiated_rate <= 1 when rate_type == NEGOTIATED"
      - name: base_type
        type: enum
        source: input
        description: "Cost base the rate applies against; MTDC = Modified Total Direct Cost (excludes equipment and the portion of each subaward over $25,000)."
        default: MTDC
        constraints: "one of {MTDC, TDC}"
      - name: status
        type: enum
        source: system
        description: "Whether this rate is the one in force for the award; superseding a rate retires the prior."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: Subaward
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the prime award funding this subaward."
      - name: subrecipient_name
        type: string
        source: input
        description: "Legal name of the subrecipient organization."
        constraints: "non-empty"
      - name: subaward_amount_cents
        type: integer
        source: input
        description: "Total committed to the subrecipient over its term, in integer cents."
        constraints: ">= 1"
      - name: risk_tier
        type: enum
        source: input
        description: "Subrecipient risk assessment tier; HIGH tier requires ProgramManager approval before activation."
        default: LOW
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: status
        type: enum
        source: system
        description: "Subaward lifecycle state."
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, ACTIVE, TERMINATED}"

  - name: RestrictedFund
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award this restricted budget category belongs to."
      - name: category
        type: enum
        source: input
        description: "Restricted budget category the fund tracks."
        constraints: "one of {PERSONNEL, EQUIPMENT, TRAVEL, SUPPLIES, SUBAWARD_PASS_THROUGH, INDIRECT}"
      - name: budgeted_cents
        type: integer
        source: input
        description: "Approved budget ceiling for this category over the period of performance, in integer cents."
        constraints: ">= 0"
      - name: allocated_cents
        type: integer
        source: computed
        description: "Running sum of FundAllocation.amount_cents posted against this fund from disbursed drawdowns. May never exceed budgeted_cents."
        default: 0
      - name: priority_order
        type: integer
        source: input
        description: "Tie-independent waterfall rank for drawdown allocation; lower number is filled first. Distinct within an award."
        constraints: ">= 1"

  - name: Drawdown
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award cash is drawn against."
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who created this drawdown; recorded for segregation-of-duties enforcement against report certification."
      - name: amount_cents
        type: integer
        source: input
        description: "Federal cash requested in this drawdown, in integer cents."
        constraints: ">= 1"
      - name: allocation_plan
        type: array
        source: input
        description: "Ordered list of { restricted_fund_id, amount_cents } the requester proposes; server re-derives the canonical waterfall and rejects on mismatch. Sum must equal amount_cents."
      - name: status
        type: enum
        source: system
        description: "Drawdown lifecycle state."
        default: REQUESTED
        constraints: "one of {REQUESTED, DISBURSED, RETURNED}"

  - name: FundAllocation
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: drawdown_id
        type: string
        source: system
        description: "FK -> Drawdown.id; the disbursed drawdown that produced this allocation line."
      - name: restricted_fund_id
        type: string
        source: system
        description: "FK -> RestrictedFund.id; the fund this slice of cash was posted to."
      - name: amount_cents
        type: integer
        source: system
        description: "Cash posted to the fund by the waterfall, in integer cents."

  - name: FinancialReport
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award this Federal Financial Report (FFR) covers."
      - name: period_label
        type: string
        source: input
        description: "Reporting period label, e.g. 'FY2026-Q1'. Unique per award among non-REJECTED reports."
        constraints: "non-empty"
      - name: report_basis
        type: enum
        source: input
        description: "INTERIM for periodic FFRs (provisional reimbursement variant); FINAL for the closeout FFR (final reimbursement variant with disallowance sweep and ceiling cap)."
        constraints: "one of {INTERIM, FINAL}"
      - name: direct_cost_lines
        type: array
        source: input
        description: "List of { category, amount_cents } direct-cost line items claimed this period; category is one of the RestrictedFund categories except INDIRECT."
      - name: disallowed_cents
        type: integer
        source: input
        description: "Federal-eligible costs disallowed for this report (e.g. by audit). Applied only when report_basis == FINAL; ignored for INTERIM."
        default: 0
        constraints: ">= 0"
      - name: approved_direct_cents
        type: integer
        source: computed
        description: "Sum of direct_cost_lines[].amount_cents accepted on this report (set at ACCEPT)."
        default: 0
      - name: indirect_cost_cents
        type: integer
        source: computed
        description: "Indirect cost recovery for this report computed from the award's ACTIVE IndirectCostRate over the MTDC base; see calculations.indirect_cost_recovery."
        default: 0
      - name: reimbursable_cents
        type: integer
        source: computed
        description: "Federal reimbursement owed for this report; provisional vs final variant per report_basis. See calculations.reimbursement_reconciliation."
        default: 0
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who certified (submitted) this report; must differ from every initiated_by_user_id of drawdowns it reconciles (segregation of duties)."
        default: null
      - name: status
        type: enum
        source: system
        description: "FFR lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED}"

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award this performance/progress narrative covers."
      - name: period_label
        type: string
        source: input
        description: "Reporting period label, e.g. 'FY2026-Q1'."
        constraints: "non-empty"
      - name: milestones_met
        type: integer
        source: input
        description: "Count of planned milestones achieved this period."
        constraints: ">= 0"
      - name: milestones_planned
        type: integer
        source: input
        description: "Count of milestones planned for this period."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Progress report lifecycle state."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, RETURNED}"

  - name: SingleAudit
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: award_id
        type: string
        source: input
        description: "FK -> Award.id; the award the audit fiscal year is scoped to."
      - name: fiscal_year
        type: integer
        source: input
        description: "Federal fiscal year the audit covers, e.g. 2026."
        constraints: ">= 2000"
      - name: federal_expenditures_cents
        type: integer
        source: input
        description: "Total federal awards expended in the fiscal year, used to test the Single Audit threshold."
        constraints: ">= 0"
      - name: audit_required
        type: boolean
        source: computed
        description: "True iff federal_expenditures_cents >= SINGLE_AUDIT_THRESHOLD_CENTS (75000000 = $750,000). Boundary is inclusive (>=)."
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state."
        default: OPEN
        constraints: "one of {OPEN, SUBMITTED, RESOLVED}"

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: single_audit_id
        type: string
        source: input
        description: "FK -> SingleAudit.id; the audit this finding belongs to."
      - name: severity
        type: enum
        source: input
        description: "Finding severity; MATERIAL_WEAKNESS blocks award closeout until resolved."
        constraints: "one of {DEFICIENCY, SIGNIFICANT_DEFICIENCY, MATERIAL_WEAKNESS}"
      - name: questioned_cost_cents
        type: integer
        source: input
        description: "Costs questioned by the finding, in integer cents."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Finding resolution state."
        default: OPEN
        constraints: "one of {OPEN, RESOLVED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: NofoApplication
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: GrantWriter
        preconditions:
          - "application.status == DRAFT"
          - "period_end_date strictly after period_start_date"
        side_effects:
          - "set status = SUBMITTED"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/begin-review"
        actor: AgencyOfficer
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "set status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: REVISIONS_REQUESTED
        trigger: "POST /applications/{id}/request-revisions"
        actor: AgencyOfficer
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "set status = REVISIONS_REQUESTED"
        note: "Revision loop: REVISIONS_REQUESTED -> SUBMITTED -> UNDER_REVIEW may repeat (cyclic shape)."

      - from: REVISIONS_REQUESTED
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: GrantWriter
        preconditions:
          - "application.status == REVISIONS_REQUESTED"
          - "period_end_date strictly after period_start_date"
        side_effects:
          - "set status = SUBMITTED"

      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /applications/{id}/award"
        actor: AgencyOfficer
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "set status = AWARDED"
          - "create Award (cross-entity): copy total_award_cents = requested_amount_cents, federal_share_pct, period dates; compute federal_ceiling_cents = round_half_up(total_award_cents * federal_share_pct); status = ACTIVE; federal_drawn_cents = 0; federal_approved_expenditures_cents = 0"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: AgencyOfficer
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "set status = REJECTED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: GrantWriter
        preconditions:
          - "application.status == DRAFT"
        side_effects:
          - "set status = WITHDRAWN"

  - entity: Subaward
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /subawards/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "subaward.status == PROPOSED"
          - "parent Award.status == ACTIVE (cross-entity: Subaward depends on Award state)"
        side_effects:
          - "set status = APPROVED"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /subawards/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "subaward.status == APPROVED"
          - "parent Award.status == ACTIVE"
        side_effects:
          - "set status = ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /subawards/{id}/terminate"
        actor: ProgramManager
        preconditions:
          - "subaward.status == ACTIVE"
        side_effects:
          - "set status = TERMINATED"

      - from: APPROVED
        to: TERMINATED
        trigger: "POST /subawards/{id}/terminate"
        actor: ProgramManager
        preconditions:
          - "subaward.status == APPROVED"
        side_effects:
          - "set status = TERMINATED"

  - entity: Drawdown
    initial_state: REQUESTED
    terminal_states: [RETURNED]
    transitions:
      - from: REQUESTED
        to: DISBURSED
        trigger: "POST /drawdowns/{id}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "drawdown.status == REQUESTED"
          - "parent Award.status == ACTIVE (cross-entity: Drawdown depends on Award state)"
          - "Award.federal_drawn_cents + drawdown.amount_cents <= Award.federal_ceiling_cents"
          - "for every line in the server-derived waterfall, RestrictedFund.allocated_cents + line.amount_cents <= RestrictedFund.budgeted_cents"
        side_effects:
          - "set status = DISBURSED"
          - "create one FundAllocation per waterfall line (cross-entity, cascade hop 1)"
          - "for each FundAllocation: RestrictedFund.allocated_cents += amount_cents (cascade hop 2, derived-field reconciliation)"
          - "Award.federal_drawn_cents += drawdown.amount_cents (ledger sync)"
          - "increments Award.version by 1"

      - from: DISBURSED
        to: RETURNED
        trigger: "POST /drawdowns/{id}/return"
        actor: FinanceOfficer
        preconditions:
          - "drawdown.status == DISBURSED"
        side_effects:
          - "set status = RETURNED"
          - "for each FundAllocation of this drawdown: RestrictedFund.allocated_cents -= amount_cents (compensation, reverses hop 2)"
          - "Award.federal_drawn_cents -= drawdown.amount_cents (compensation; conserved quantity Q1 = federal_drawn_cents must return to pre-drawdown value)"
          - "increments Award.version by 1"

  - entity: FinancialReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /financial-reports/{id}/certify"
        actor: FinanceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "parent Award.status IN {ACTIVE, PENDING_CLOSEOUT}"
          - "certifying X-User-ID differs from every Drawdown.initiated_by_user_id on this award (segregation of duties)"
        side_effects:
          - "set status = SUBMITTED"
          - "set certified_by_user_id = acting X-User-ID"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /financial-reports/{id}/accept"
        actor: AgencyOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "set status = ACCEPTED"
          - "compute approved_direct_cents = sum of direct_cost_lines[].amount_cents (calculation: report_approval_totals)"
          - "compute indirect_cost_cents (calculation: indirect_cost_recovery)"
          - "compute reimbursable_cents (calculation: reimbursement_reconciliation, variant per report_basis)"
          - "Award.federal_approved_expenditures_cents = round_half_up(Award.federal_share_pct * sum of approved_direct_cents over this award's ACCEPTED reports) (ledger sync, derived-field reconciliation)"
          - "increments Award.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /financial-reports/{id}/reject"
        actor: AgencyOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "set status = REJECTED"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /financial-reports/{id}/revise"
        actor: FinanceOfficer
        preconditions:
          - "report.status == REJECTED"
        side_effects:
          - "set status = DRAFT"
        note: "Revise cycle: REJECTED -> DRAFT -> SUBMITTED may repeat."

  - entity: ProgressReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /progress-reports/{id}/accept"
        actor: ProgramManager
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "set status = ACCEPTED"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /progress-reports/{id}/return"
        actor: ProgramManager
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "set status = RETURNED"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /progress-reports/{id}/resubmit"
        actor: GrantWriter
        preconditions:
          - "report.status == RETURNED"
        side_effects:
          - "set status = SUBMITTED"
        note: "Return/resubmit cycle."

  - entity: SingleAudit
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /single-audits/{id}/submit"
        actor: Auditor
        preconditions:
          - "audit.status == OPEN"
          - "audit.audit_required == true (only required audits are submitted; a not-required audit is closed via resolve directly)"
        side_effects:
          - "set status = SUBMITTED"

      - from: SUBMITTED
        to: RESOLVED
        trigger: "POST /single-audits/{id}/resolve"
        actor: Auditor
        preconditions:
          - "audit.status == SUBMITTED"
          - "every AuditFinding of this audit with severity == MATERIAL_WEAKNESS has status == RESOLVED"
        side_effects:
          - "set status = RESOLVED"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /single-audits/{id}/resolve"
        actor: Auditor
        preconditions:
          - "audit.status == OPEN"
          - "audit.audit_required == false"
        side_effects:
          - "set status = RESOLVED"
        note: "Below-threshold audits resolve directly from OPEN with no submission step."

  - entity: Award
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /awards/{id}/suspend"
        actor: AgencyOfficer
        preconditions:
          - "award.status == ACTIVE"
          - "expected_award_version matches current Award.version"
        side_effects:
          - "set status = SUSPENDED"
          - "increments Award.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /awards/{id}/reinstate"
        actor: AgencyOfficer
        preconditions:
          - "award.status == SUSPENDED"
          - "expected_award_version matches current Award.version"
        side_effects:
          - "set status = ACTIVE"
          - "increments Award.version by 1"

      - from: ACTIVE
        to: PENDING_CLOSEOUT
        trigger: "POST /awards/{id}/initiate-closeout"
        actor: AgencyOfficer
        preconditions:
          - "award.status == ACTIVE"
          - "expected_award_version matches current Award.version"
        side_effects:
          - "set status = PENDING_CLOSEOUT"
          - "increments Award.version by 1"

      - from: PENDING_CLOSEOUT
        to: CLOSED
        trigger: "POST /awards/{id}/close"
        actor: AgencyOfficer
        preconditions:
          - "award.status == PENDING_CLOSEOUT"
          - "expected_award_version matches current Award.version"
          - "no FinancialReport for this award in status DRAFT or SUBMITTED (cross-entity: Award close depends on FinancialReport states)"
          - "every Subaward of this award is in status APPROVED-or-earlier-terminal: status IN {PROPOSED, TERMINATED} OR status == APPROVED (no ACTIVE subaward); i.e. no Subaward.status == ACTIVE"
          - "every SingleAudit of this award with audit_required == true is in status RESOLVED, and no AuditFinding with severity == MATERIAL_WEAKNESS is in status OPEN (cross-entity: Award close depends on SingleAudit/AuditFinding states)"
        side_effects:
          - "set status = CLOSED"
          - "compute closeout_unobligated_cents (calculation: closeout_unobligated_balance) and surface it on the close response"
          - "increments Award.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rate-supersede-stale-award
    parent_entity: Award
    write_endpoint: "POST /indirect-cost-rates"
    occ_field: "expected_award_version"
    description: |
      Creating a new IndirectCostRate against an Award whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A new rate legitimately supersedes the prior ACTIVE rate (the prior is
      retired to SUPERSEDED), so two sequential rate-create requests both carrying
      the version the client first observed describe a genuine supersede race: the
      second request's view of the award is stale because the first already
      advanced the award version. The loser is rejected on the stale version, not
      on any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: indirect_cost_recovery
    trigger: "On FinancialReport SUBMITTED->ACCEPTED (POST /financial-reports/{id}/accept); writes FinancialReport.indirect_cost_cents."
    algorithm: aggregation
    formula: |
      # All money in integer cents. Base is the award's ACTIVE IndirectCostRate.
      # MTDC base excludes EQUIPMENT lines entirely and the portion of each
      # SUBAWARD_PASS_THROUGH line over SUBAWARD_EXCLUSION_CAP_CENTS.
      direct_total = sum(line.amount_cents for line in direct_cost_lines)
      equipment_excl = sum(line.amount_cents for line in direct_cost_lines
                           if line.category == "EQUIPMENT")
      subaward_excess = sum(max(0, line.amount_cents - SUBAWARD_EXCLUSION_CAP_CENTS)
                            for line in direct_cost_lines
                            if line.category == "SUBAWARD_PASS_THROUGH")
      if base_type == "MTDC":
          base = direct_total - equipment_excl - subaward_excess
      else:  # TDC
          base = direct_total
      rate = (rate.negotiated_rate if rate.rate_type == "NEGOTIATED"
              else DE_MINIMIS_RATE)
      # SUM-THEN-ROUND: apply the rate ONCE to the whole base, never per line.
      indirect_cost_cents = round_half_up(base * rate)
    input_set: "direct_cost_lines of the report being accepted; the award's single IndirectCostRate whose status == ACTIVE."
    constants:
      SUBAWARD_EXCLUSION_CAP_CENTS: 2500000   # $25,000 per-subaward MTDC exclusion threshold
      DE_MINIMIS_RATE: 0.10
    precision: "integer cents, round_half_up; rate applied once to summed base (sum-then-round), NOT per line item"
    variants:
      - name: negotiated_rate_mtdc
        when: "award's ACTIVE IndirectCostRate.rate_type == NEGOTIATED and base_type == MTDC"
        difference: "rate = negotiated_rate; base excludes equipment and subaward excess over the cap."
      - name: de_minimis_mtdc
        when: "award's ACTIVE IndirectCostRate.rate_type == DE_MINIMIS"
        difference: "rate = 0.10 constant; negotiated_rate field is ignored even if present."

  - name: reimbursement_reconciliation
    trigger: "On FinancialReport SUBMITTED->ACCEPTED (POST /financial-reports/{id}/accept); writes FinancialReport.reimbursable_cents."
    algorithm: forward_looking
    formula: |
      # All money in integer cents.
      this_period_federal = round_half_up(Award.federal_share_pct * approved_direct_cents)
      if report_basis == "INTERIM":
          # PROVISIONAL variant: pay the federal share of this period's approved
          # direct costs outright; no ceiling cap, no disallowance sweep, no
          # netting against cash already drawn.
          reimbursable_cents = this_period_federal
      else:  # FINAL (closeout FFR)
          # FINAL variant: cumulative federal-eligible expenditures across ALL
          # ACCEPTED reports (including this one), MINUS disallowed, capped at the
          # federal ceiling, NET of cash already disbursed.
          cum_direct = approved_direct_cents
                       + sum(r.approved_direct_cents for r in award.financial_reports
                             if r.status == "ACCEPTED" and r.id != this.id)
          cum_federal = round_half_up(Award.federal_share_pct
                                      * cum_direct) - disallowed_cents
          capped = min(Award.federal_ceiling_cents, cum_federal)
          reimbursable_cents = capped - Award.federal_drawn_cents
    input_set: "this report's approved_direct_cents; for FINAL also every other ACCEPTED FinancialReport's approved_direct_cents on the same award, the award's federal_ceiling_cents and federal_drawn_cents, and this report's disallowed_cents."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_interim
        when: "report_basis == INTERIM"
        difference: "federal share of this-period approved direct only; no cap, no disallowance, no netting against drawn cash."
      - name: final_closeout
        when: "report_basis == FINAL"
        difference: "cumulative across ACCEPTED reports, less disallowed, capped at federal_ceiling_cents, net of federal_drawn_cents — yields a different number than provisional for identical period inputs."

  - name: drawdown_waterfall_allocation
    trigger: "On Drawdown REQUESTED->DISBURSED (POST /drawdowns/{id}/disburse); produces FundAllocation lines."
    algorithm: waterfall_allocation
    formula: |
      # Distribute drawdown.amount_cents across the award's RestrictedFunds in
      # ascending priority_order (deterministic; created_at ASC as the tie-break
      # though priority_order is constrained distinct within an award). Each bucket
      # absorbs up to its remaining headroom (budgeted_cents - allocated_cents).
      remaining = drawdown.amount_cents
      allocations = []
      for fund in sort(award.restricted_funds, key=priority_order ASC, then created_at ASC):
          headroom = fund.budgeted_cents - fund.allocated_cents
          take = min(remaining, headroom)
          if take > 0:
              allocations.append({restricted_fund_id: fund.id, amount_cents: take})
              remaining -= take
      if remaining > 0:
          reject ERR_BUDGET_WOULD_EXCEED   # not enough headroom across all funds
      # The server-derived allocations MUST equal drawdown.allocation_plan line-for-line
      # (same fund ids, same amounts, same order) else ERR_ALLOCATION_MISMATCH.
    input_set: "all RestrictedFund rows for the award (no status filter — every fund participates); their budgeted_cents and current allocated_cents."
    constants: {}
    precision: "integer cents; no fractional split — each bucket takes whole-cent min(remaining, headroom)"
    variants:
      - name: full_fill_within_first_bucket
        when: "drawdown.amount_cents <= first bucket headroom"
        difference: "single FundAllocation; later buckets untouched."
      - name: cross_bucket_spill
        when: "drawdown.amount_cents exceeds first bucket headroom"
        difference: "fills first bucket to its budget, spills remainder to the next priority bucket(s)."

  - name: report_approval_totals
    trigger: "On FinancialReport SUBMITTED->ACCEPTED; writes FinancialReport.approved_direct_cents."
    algorithm: aggregation
    formula: |
      approved_direct_cents = sum(line.amount_cents for line in direct_cost_lines)
    input_set: "the report's direct_cost_lines."
    constants: {}
    precision: "integer cents (inputs are integer cents; exact sum)"

  - name: single_audit_threshold
    trigger: "On SingleAudit creation (POST /single-audits); writes SingleAudit.audit_required."
    algorithm: threshold
    formula: |
      audit_required = (federal_expenditures_cents >= SINGLE_AUDIT_THRESHOLD_CENTS)
    input_set: "the SingleAudit.federal_expenditures_cents supplied at creation."
    constants:
      SINGLE_AUDIT_THRESHOLD_CENTS: 75000000   # $750,000 inclusive boundary
    precision: "integer cents; inclusive boundary (>=). 74999999 -> false; 75000000 -> true."

  - name: closeout_unobligated_balance
    trigger: "On Award PENDING_CLOSEOUT->CLOSED (POST /awards/{id}/close); surfaced on the close response."
    algorithm: aggregation
    formula: |
      closeout_unobligated_cents = Award.federal_ceiling_cents - Award.federal_drawn_cents
    input_set: "the award's federal_ceiling_cents and current federal_drawn_cents at close."
    constants: {}
    precision: "integer cents; exact subtraction"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except endpoints whose roles include Anonymous"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource referenced in the path or required FK body field exists; validated left-to-right in the path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or required FK"

  - priority: 4
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_award_version equals current Award.version on award-mutating writes that take it."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /awards/{id}/suspend, /reinstate, /initiate-closeout, /close; POST /indirect-cost-rates"

  - priority: 6
    category: business_referential
    check: "On disburse, the parent Award is in status ACTIVE; on subaward approve/activate, the parent Award is in status ACTIVE (cross-entity guard)."
    error_id: ERR_AWARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /drawdowns/{id}/disburse, POST /subawards/{id}/approve, POST /subawards/{id}/activate"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: on FinancialReport certify, the acting X-User-ID must not equal any Drawdown.initiated_by_user_id on the same award."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /financial-reports/{id}/certify"

  - priority: 8
    category: business_safety
    check: "Closeout blocked while any required audit is unresolved or any MATERIAL_WEAKNESS finding is OPEN."
    error_id: ERR_AUDIT_UNRESOLVED
    http_status: 409
    applies_to: "POST /awards/{id}/close"

  - priority: 9
    category: business_constraint
    check: "On close, no FinancialReport for the award is in DRAFT or SUBMITTED, and no Subaward is ACTIVE."
    error_id: ERR_CLOSEOUT_PRECONDITIONS
    http_status: 409
    applies_to: "POST /awards/{id}/close"

  - priority: 10
    category: business_constraint
    check: "On disburse, the server-derived waterfall allocation equals the requester's allocation_plan line-for-line (fund ids, amounts, order)."
    error_id: ERR_ALLOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /drawdowns/{id}/disburse"

  - priority: 11
    category: business_temporal
    check: "period_end_date strictly after period_start_date (half-open interval) on application submit; subaward/restricted-fund creation requires the award period to be valid."
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 12
    category: business_fiscal
    check: "On disburse, Award.federal_drawn_cents + amount_cents must not exceed Award.federal_ceiling_cents."
    error_id: ERR_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /drawdowns/{id}/disburse"

  - priority: 13
    category: business_fiscal
    check: "On disburse, for every waterfall line RestrictedFund.allocated_cents + line.amount_cents must not exceed RestrictedFund.budgeted_cents."
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 409
    applies_to: "POST /drawdowns/{id}/disburse"

  - priority: 14
    category: business_constraint
    check: "Required input fields present, correct types, enum members valid, integer-cents fields non-negative (or >=1 where noted), and contextual requireds (negotiated_rate present when rate_type==NEGOTIATED; allocation_plan sums to amount_cents)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: FinancialReport.period_label unique per award among non-REJECTED reports; RestrictedFund.priority_order distinct within an award; RestrictedFund.category distinct within an award."
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /financial-reports, POST /restricted-funds"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- NofoApplication ----
  - method: POST
    path: "/applications"
    description: "Create a draft NOFO application."
    roles: [GrantWriter]
    code: 201
    input: [nofo_number, applicant_org_name, requested_amount_cents, "federal_share_pct?", period_start_date, period_end_date, "supersedes_application_id?"]
    output: NofoApplication
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/applications"
    description: "List applications (paginated); filterable by superseded lineage."
    roles: [GrantWriter, AgencyOfficer]
    code: 200
    input: ["supersedes_application_id?", "status?", "limit?", "offset?"]
    output: NofoApplication[]
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Retrieve one application."
    roles: [GrantWriter, AgencyOfficer]
    code: 200
    input: []
    output: NofoApplication
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT or REVISIONS_REQUESTED application for review."
    roles: [GrantWriter]
    code: 200
    input: []
    output: NofoApplication
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw a DRAFT application."
    roles: [GrantWriter]
    code: 200
    input: []
    output: NofoApplication
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/applications/{id}/begin-review"
    description: "Agency begins review of a SUBMITTED application."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: NofoApplication
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/applications/{id}/request-revisions"
    description: "Agency requests revisions, returning the application to the writer."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: NofoApplication
    side_effects: ["status -> REVISIONS_REQUESTED"]

  - method: POST
    path: "/applications/{id}/award"
    description: "Agency awards a reviewed application; creates the Award."
    roles: [AgencyOfficer]
    code: 201
    input: []
    output: Award
    side_effects: ["application status -> AWARDED", "create Award (ACTIVE) with computed federal_ceiling_cents"]

  - method: POST
    path: "/applications/{id}/reject"
    description: "Agency rejects a reviewed application."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: NofoApplication
    side_effects: ["status -> REJECTED"]

  # ---- Award ----
  - method: GET
    path: "/awards"
    description: "List awards (paginated); filterable by source application."
    roles: [GrantWriter, FinanceOfficer, ProgramManager, AgencyOfficer, Auditor]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []

  - method: GET
    path: "/awards/{id}"
    description: "Retrieve one award including federal_ceiling_cents, federal_drawn_cents, federal_approved_expenditures_cents, and version."
    roles: [GrantWriter, FinanceOfficer, ProgramManager, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: POST
    path: "/awards/{id}/suspend"
    description: "Suspend an ACTIVE award (OCC-guarded)."
    roles: [AgencyOfficer]
    code: 200
    input: [expected_award_version]
    output: Award
    side_effects: ["status -> SUSPENDED", "increments Award.version by 1"]

  - method: POST
    path: "/awards/{id}/reinstate"
    description: "Reinstate a SUSPENDED award (OCC-guarded)."
    roles: [AgencyOfficer]
    code: 200
    input: [expected_award_version]
    output: Award
    side_effects: ["status -> ACTIVE", "increments Award.version by 1"]

  - method: POST
    path: "/awards/{id}/initiate-closeout"
    description: "Move an ACTIVE award to PENDING_CLOSEOUT (OCC-guarded)."
    roles: [AgencyOfficer]
    code: 200
    input: [expected_award_version]
    output: Award
    side_effects: ["status -> PENDING_CLOSEOUT", "increments Award.version by 1"]

  - method: POST
    path: "/awards/{id}/close"
    description: "Close a PENDING_CLOSEOUT award once all closeout preconditions hold (OCC-guarded). Response surfaces closeout_unobligated_cents."
    roles: [AgencyOfficer]
    code: 200
    input: [expected_award_version]
    output: Award
    side_effects: ["status -> CLOSED", "compute closeout_unobligated_cents", "increments Award.version by 1"]

  # ---- IndirectCostRate ----
  - method: POST
    path: "/indirect-cost-rates"
    description: "Set the in-force indirect-cost rate for an award; supersedes any prior ACTIVE rate. OCC-guarded on Award.version."
    roles: [FinanceOfficer]
    code: 201
    input: [award_id, rate_type, "negotiated_rate?", "base_type?", expected_award_version]
    output: IndirectCostRate
    side_effects: ["prior ACTIVE rate -> SUPERSEDED", "new rate ACTIVE", "increments Award.version by 1"]

  - method: GET
    path: "/indirect-cost-rates"
    description: "List indirect-cost rates; filter by award_id."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: IndirectCostRate[]
    side_effects: []

  - method: GET
    path: "/indirect-cost-rates/{id}"
    description: "Retrieve one indirect-cost rate including rate_type, status, and the computed effective rate."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: IndirectCostRate
    side_effects: []

  # ---- Subaward ----
  - method: POST
    path: "/subawards"
    description: "Create a PROPOSED subaward under an award."
    roles: [ProgramManager]
    code: 201
    input: [award_id, subrecipient_name, subaward_amount_cents, "risk_tier?"]
    output: Subaward
    side_effects: ["status = PROPOSED"]

  - method: GET
    path: "/subawards"
    description: "List subawards; filter by award_id."
    roles: [ProgramManager, AgencyOfficer, Auditor]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: Subaward[]
    side_effects: []

  - method: GET
    path: "/subawards/{id}"
    description: "Retrieve one subaward."
    roles: [ProgramManager, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: Subaward
    side_effects: []

  - method: POST
    path: "/subawards/{id}/approve"
    description: "Approve a PROPOSED subaward (parent award must be ACTIVE)."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Subaward
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/subawards/{id}/activate"
    description: "Activate an APPROVED subaward."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Subaward
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/subawards/{id}/terminate"
    description: "Terminate an APPROVED or ACTIVE subaward."
    roles: [ProgramManager]
    code: 200
    input: []
    output: Subaward
    side_effects: ["status -> TERMINATED"]

  # ---- RestrictedFund ----
  - method: POST
    path: "/restricted-funds"
    description: "Create a restricted budget category fund under an award."
    roles: [FinanceOfficer]
    code: 201
    input: [award_id, category, budgeted_cents, priority_order]
    output: RestrictedFund
    side_effects: ["allocated_cents = 0"]

  - method: GET
    path: "/restricted-funds"
    description: "List restricted funds; filter by award_id."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: ["award_id?", "limit?", "offset?"]
    output: RestrictedFund[]
    side_effects: []

  - method: GET
    path: "/restricted-funds/{id}"
    description: "Retrieve one restricted fund including allocated_cents."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: RestrictedFund
    side_effects: []

  # ---- Drawdown ----
  - method: POST
    path: "/drawdowns"
    description: "Create a REQUESTED drawdown with a proposed allocation_plan. Records initiated_by_user_id."
    roles: [FinanceOfficer]
    code: 201
    input: [award_id, amount_cents, allocation_plan]
    output: Drawdown
    side_effects: ["status = REQUESTED", "initiated_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/drawdowns"
    description: "List drawdowns; filter by award_id."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: Drawdown[]
    side_effects: []

  - method: GET
    path: "/drawdowns/{id}"
    description: "Retrieve one drawdown."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: Drawdown
    side_effects: []

  - method: GET
    path: "/drawdowns/{id}/allocations"
    description: "List FundAllocation lines produced by a disbursed drawdown (reverse-reachability for FundAllocation.drawdown_id)."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: FundAllocation[]
    side_effects: []

  - method: GET
    path: "/restricted-funds/{id}/allocations"
    description: "List FundAllocation lines posted to a restricted fund (reverse-reachability for FundAllocation.restricted_fund_id)."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: FundAllocation[]
    side_effects: []

  - method: POST
    path: "/drawdowns/{id}/disburse"
    description: "Disburse a REQUESTED drawdown: validate ceiling and per-fund budget, post the waterfall, debit the ledger."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Drawdown
    side_effects: ["status -> DISBURSED", "create FundAllocation per waterfall line", "RestrictedFund.allocated_cents += line", "Award.federal_drawn_cents += amount_cents", "increments Award.version by 1"]

  - method: POST
    path: "/drawdowns/{id}/return"
    description: "Return a DISBURSED drawdown: reverse all allocations and the ledger debit (compensation)."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Drawdown
    side_effects: ["status -> RETURNED", "RestrictedFund.allocated_cents -= line", "Award.federal_drawn_cents -= amount_cents", "increments Award.version by 1"]

  # ---- FinancialReport ----
  - method: POST
    path: "/financial-reports"
    description: "Create a DRAFT Federal Financial Report for an award."
    roles: [FinanceOfficer]
    code: 201
    input: [award_id, period_label, report_basis, direct_cost_lines, "disallowed_cents?"]
    output: FinancialReport
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/financial-reports"
    description: "List financial reports; filter by award_id."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: FinancialReport[]
    side_effects: []

  - method: GET
    path: "/financial-reports/{id}"
    description: "Retrieve one financial report including computed approved_direct_cents, indirect_cost_cents, reimbursable_cents."
    roles: [FinanceOfficer, AgencyOfficer, Auditor]
    code: 200
    input: []
    output: FinancialReport
    side_effects: []

  - method: POST
    path: "/financial-reports/{id}/certify"
    description: "FinanceOfficer certifies (submits) a DRAFT report; segregation-of-duties enforced against drawdown initiators."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status -> SUBMITTED", "certified_by_user_id = acting X-User-ID"]

  - method: POST
    path: "/financial-reports/{id}/accept"
    description: "AgencyOfficer accepts a SUBMITTED report; runs approval totals, indirect cost, reimbursement, and updates the award ledger."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status -> ACCEPTED", "compute approved_direct_cents, indirect_cost_cents, reimbursable_cents", "Award.federal_approved_expenditures_cents recomputed", "increments Award.version by 1"]

  - method: POST
    path: "/financial-reports/{id}/reject"
    description: "AgencyOfficer rejects a SUBMITTED report."
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/financial-reports/{id}/revise"
    description: "FinanceOfficer returns a REJECTED report to DRAFT for revision."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status -> DRAFT"]

  # ---- ProgressReport ----
  - method: POST
    path: "/progress-reports"
    description: "Submit a progress/performance narrative for an award."
    roles: [GrantWriter]
    code: 201
    input: [award_id, period_label, milestones_met, milestones_planned]
    output: ProgressReport
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/progress-reports"
    description: "List progress reports; filter by award_id."
    roles: [GrantWriter, ProgramManager, AgencyOfficer]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: ProgressReport[]
    side_effects: []

  - method: GET
    path: "/progress-reports/{id}"
    description: "Retrieve one progress report including period_label, milestones_met, milestones_planned, and status."
    roles: [GrantWriter, ProgramManager, AgencyOfficer]
    code: 200
    input: []
    output: ProgressReport
    side_effects: []

  - method: POST
    path: "/progress-reports/{id}/accept"
    description: "ProgramManager accepts a SUBMITTED progress report."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ProgressReport
    side_effects: ["status -> ACCEPTED"]

  - method: POST
    path: "/progress-reports/{id}/return"
    description: "ProgramManager returns a SUBMITTED progress report for rework."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ProgressReport
    side_effects: ["status -> RETURNED"]

  - method: POST
    path: "/progress-reports/{id}/resubmit"
    description: "GrantWriter resubmits a RETURNED progress report."
    roles: [GrantWriter]
    code: 200
    input: []
    output: ProgressReport
    side_effects: ["status -> SUBMITTED"]

  # ---- SingleAudit / AuditFinding ----
  - method: POST
    path: "/single-audits"
    description: "Create a Single Audit record for an award fiscal year; computes audit_required from the expenditure threshold."
    roles: [Auditor]
    code: 201
    input: [award_id, fiscal_year, federal_expenditures_cents]
    output: SingleAudit
    side_effects: ["compute audit_required", "status = OPEN"]

  - method: GET
    path: "/single-audits"
    description: "List single audits; filter by award_id."
    roles: [Auditor, AgencyOfficer]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: SingleAudit[]
    side_effects: []

  - method: GET
    path: "/single-audits/{id}"
    description: "Retrieve one single audit including audit_required."
    roles: [Auditor, AgencyOfficer]
    code: 200
    input: []
    output: SingleAudit
    side_effects: []

  - method: POST
    path: "/single-audits/{id}/submit"
    description: "Auditor submits an OPEN required audit."
    roles: [Auditor]
    code: 200
    input: []
    output: SingleAudit
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/single-audits/{id}/resolve"
    description: "Auditor resolves an audit (from SUBMITTED when all material findings closed, or directly from OPEN when not required)."
    roles: [Auditor]
    code: 200
    input: []
    output: SingleAudit
    side_effects: ["status -> RESOLVED"]

  - method: POST
    path: "/single-audits/{id}/findings"
    description: "Record an audit finding under a single audit."
    roles: [Auditor]
    code: 201
    input: [severity, "questioned_cost_cents?"]
    output: AuditFinding
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/single-audits/{id}/findings"
    description: "List findings for an audit (reverse-reachability for AuditFinding.single_audit_id)."
    roles: [Auditor, AgencyOfficer]
    code: 200
    input: []
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/audit-findings/{id}/resolve"
    description: "Auditor resolves an OPEN finding."
    roles: [Auditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["status -> RESOLVED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this operation per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or required FK) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_award_version does not match current Award.version."
  - id: ERR_AWARD_NOT_ACTIVE
    http: 409
    condition: "Operation requires the parent Award to be ACTIVE (disburse, subaward approve/activate) but it is not."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "FinancialReport certifier equals a Drawdown initiator on the same award."
  - id: ERR_AUDIT_UNRESOLVED
    http: 409
    condition: "Closeout attempted while a required SingleAudit is unresolved or a MATERIAL_WEAKNESS finding is OPEN."
  - id: ERR_CLOSEOUT_PRECONDITIONS
    http: 409
    condition: "Closeout attempted while a FinancialReport is DRAFT/SUBMITTED or a Subaward is ACTIVE."
  - id: ERR_ALLOCATION_MISMATCH
    http: 422
    condition: "Drawdown allocation_plan does not match the server-derived waterfall line-for-line."
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "period_end_date not strictly after period_start_date."
  - id: ERR_CEILING_EXCEEDED
    http: 409
    condition: "Drawdown would push Award.federal_drawn_cents over federal_ceiling_cents."
  - id: ERR_BUDGET_WOULD_EXCEED
    http: 409
    condition: "A waterfall line would push a RestrictedFund.allocated_cents over its budgeted_cents."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, invalid enum, negative cents, allocation_plan sum mismatch, or missing contextual required (negotiated_rate when NEGOTIATED)."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Duplicate FinancialReport.period_label (non-REJECTED) per award, or duplicate RestrictedFund.priority_order/category within an award."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrantWriter
    description: "Prepares and submits NOFO applications and progress narratives for the grantee."
    identity: opaque
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /progress-reports"
      - "POST /progress-reports/{id}/resubmit"
    shared_operations:
      - "GET /applications, GET /applications/{id}"
      - "GET /awards, GET /awards/{id}"
      - "GET /progress-reports"

  - name: FinanceOfficer
    description: "Manages the grantee's cash: indirect-cost rates, restricted funds, drawdowns, and financial reports."
    identity: opaque
    exclusive_operations:
      - "POST /indirect-cost-rates"
      - "POST /restricted-funds"
      - "POST /drawdowns"
      - "POST /drawdowns/{id}/disburse"
      - "POST /drawdowns/{id}/return"
      - "POST /financial-reports"
      - "POST /financial-reports/{id}/certify"
      - "POST /financial-reports/{id}/revise"
    shared_operations:
      - "GET /awards, GET /awards/{id}"
      - "GET /indirect-cost-rates, GET /restricted-funds, GET /restricted-funds/{id}"
      - "GET /drawdowns, GET /drawdowns/{id}, GET /drawdowns/{id}/allocations, GET /restricted-funds/{id}/allocations"
      - "GET /financial-reports, GET /financial-reports/{id}"

  - name: ProgramManager
    description: "Owns subaward and progress-report governance for the grantee."
    identity: opaque
    exclusive_operations:
      - "POST /subawards"
      - "POST /subawards/{id}/approve"
      - "POST /subawards/{id}/activate"
      - "POST /subawards/{id}/terminate"
      - "POST /progress-reports/{id}/accept"
      - "POST /progress-reports/{id}/return"
    shared_operations:
      - "GET /awards, GET /awards/{id}"
      - "GET /subawards, GET /subawards/{id}"
      - "GET /progress-reports"

  - name: AgencyOfficer
    description: "Federal awarding-agency operator: reviews/awards/rejects applications, accepts financial reports, and adjudicates award lifecycle and closeout."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/begin-review"
      - "POST /applications/{id}/request-revisions"
      - "POST /applications/{id}/award"
      - "POST /applications/{id}/reject"
      - "POST /awards/{id}/suspend"
      - "POST /awards/{id}/reinstate"
      - "POST /awards/{id}/initiate-closeout"
      - "POST /awards/{id}/close"
      - "POST /financial-reports/{id}/accept"
      - "POST /financial-reports/{id}/reject"
    shared_operations:
      - "GET on applications, awards, subawards, indirect-cost-rates, restricted-funds, drawdowns, financial-reports, progress-reports, single-audits, findings"

  - name: Auditor
    description: "Independent auditor: records Single Audits and findings and drives their resolution."
    identity: opaque
    exclusive_operations:
      - "POST /single-audits"
      - "POST /single-audits/{id}/submit"
      - "POST /single-audits/{id}/resolve"
      - "POST /single-audits/{id}/findings"
      - "POST /audit-findings/{id}/resolve"
    shared_operations:
      - "GET /awards, GET /awards/{id}"
      - "GET /single-audits, GET /single-audits/{id}, GET /single-audits/{id}/findings"
      - "GET /subawards, GET /restricted-funds, GET /drawdowns, GET /financial-reports, GET /indirect-cost-rates"

  - name: Anonymous
    description: "Unauthenticated caller; no operations. Present only so list/GET endpoints can declare a non-anonymous role set explicitly."
    identity: opaque
    exclusive_operations: []
    shared_operations: []
