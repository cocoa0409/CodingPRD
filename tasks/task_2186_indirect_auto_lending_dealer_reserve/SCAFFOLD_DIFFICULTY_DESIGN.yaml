      - name: funding_requires_all_required_documents_verified
        grounds:
          - state_machines.RetailContract.PENDING_DOCS_to_DOCS_VERIFIED
          - state_machines.RetailContract.DOCS_VERIFIED_to_PENDING_DOCS
