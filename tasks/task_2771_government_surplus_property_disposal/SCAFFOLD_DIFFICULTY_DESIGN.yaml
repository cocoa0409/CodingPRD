            - "ProceedsDistribution.${pd_cash}.net_to_agency_cents == 167500"
            - "ProceedsDistribution.${pd_accrual}.status == SUPERSEDED after the CASH row is created"
            - "ProceedsDistribution.${pd_cash}.beneficiary_agency_id == ${ag_st}"
            - "Agency.${ag_st}.proceeds_account_balance_cents == 0 — neither distribution has been posted"

  - rule_id: combinatorial_formula
    instances:

      - name: cf_fmv_nested_factor_product_single_rounding
        grounds:
          - calculations.asset_fair_market_value
          - calculations.asset_fair_market_value.precision
          - calculations.asset_fair_market_value.constants.CONDITION_FACTOR
          - calculations.asset_fair_market_value.constants.FLOOR_AGE_FACTOR
          - calculations.asset_fair_market_value.constants.NON_FUNCTIONAL_FACTOR
          - entities.SurplusAsset.fields.fair_market_value_cents
        distinguishing_aspect: |
          Mode (a) nested-rounding placement: three factors are multiplied and round_half_up is applied
          exactly once to the product, after which the repair deduction is subtracted from the already
          rounded integer and floored at 0. Rounding each factor product separately, or applying
          round_half_up after the repair subtraction, or letting the floor apply before the subtraction
          all produce different integers than 482618 / 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with one turn-in whose two assets were added while it was DRAFT and which is then SUBMITTED, because assessment requires TurnIn.status == SUBMITTED"
            - "asset H: acquisition_cost_cents 3217450, acquisition_date 2019-03-15 (full_years 7, age_factor 0.30), assessed C4 (0.50) / functional / repair 0 — the exact product is 482617.5"
            - "asset Z: acquisition_cost_cents 870401, acquisition_date 2020-06-30 (full_years 6, age_factor 0.40), assessed C5 (0.30) / non-functional (0.60) / repair 62700 — base 62669 is smaller than the repair estimate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag_st}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "VEHICLE", description: "2019 Ford F-250 half-tie unit", acquisition_cost_cents: 3217450, acquisition_date: "2019-03-15", vin: "1FT7W2BT9KEB90001", odometer_reading: 201455, title_number: "TX-90001" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { asset_h: "$.data.id", asset_h_v: "$.data.version" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "HEAVY_EQUIPMENT", description: "2020 Wacker roller, seized drum", acquisition_cost_cents: 870401, acquisition_date: "2020-06-30" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { asset_z: "$.data.id", asset_z_v: "$.data.version" }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
          trigger:
            - call: "POST /assets/${asset_h}/condition-assessments"
              payload: { condition_code: "C4", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-28", expected_asset_version: "${asset_h_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { ca_h: "$.data.id" }
            - call: "POST /assets/${asset_z}/condition-assessments"
              payload: { condition_code: "C5", functional: false, repair_cost_estimate_cents: 62700, assessed_on: "2026-07-28", expected_asset_version: "${asset_z_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { ca_z: "$.data.id" }
          assert:
            - "SurplusAsset.${asset_h}.fair_market_value_cents == 482618 — the exact product 3217450 * 0.50 * 0.30 * 1.00 is 482617.5 and round_half_up carries it up; 482617 indicates truncation or binary float drift"
            - "SurplusAsset.${asset_h}.condition_code == C4"
            - "SurplusAsset.${asset_h}.disposition_status == ASSESSED"
            - "SurplusAsset.${asset_z}.fair_market_value_cents == 0 — base_cents 62669 minus repair 62700 is -31 and the floor clamps it to 0, never a negative value"
            - "SurplusAsset.${asset_z}.condition_code == C5"
            - "ConditionAssessment.${ca_h}.superseded == false and ConditionAssessment.${ca_z}.superseded == false"
            - "SurplusAsset.${asset_h}.version == 2 and SurplusAsset.${asset_z}.version == 2"

      - name: cf_invoice_per_line_rounding_then_sum
        grounds:
          - calculations.auction_invoice_total
          - calculations.auction_invoice_total.precision
          - entities.SaleInvoice.fields.buyer_premium_cents
          - entities.SaleInvoice.fields.sales_tax_cents
          - entities.SaleInvoice.fields.total_due_cents
          - entities.SaleVenue.fields.buyer_premium_pct
          - state_machines.AuctionLot.OPEN_to_CLOSED_MET
        distinguishing_aspect: |
          Mode (b) evaluation order: the premium line and the tax line are each rounded to whole cents
          before they are summed, and the sum itself is never rounded. Collapsing the three lines into
          one compound product round_half_up(301500 * 1.105 * 1.0635) yields 354313, one cent below the
          normative 354314 — a different failure mode from the single-rounding nesting exercised by
          cf_fmv_nested_factor_product_single_rounding.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-09-01 -> 2026-09-05T00:00:00Z"
            - "venue AUS-01 with buyer_premium_pct 0.105 and sales_tax_pct 0.0635"
            - "one de-minimis FURNITURE asset (fair_market_value_cents 12540, screening-exempt, reserve 7524, required_deposit_cents 0) listed at AUS-01 and OPEN"
            - "bidder REGISTERED with no deposit; a single hammer bid of 301500 is accepted because the reserve is only 7524"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
