# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3498_mine_safety_inspection_mandates_citation_assessment
#
# Depth probe: 2+ instances per §0.5 Difficulty Rule, every instance grounded in
# SCAFFOLD.yaml §1.1–§1.7 and executable from empty-DB via §1.5 endpoints.
# All formula-derived assert values were computed by executing the pinned
# formulas in §1.3 (exact decimal arithmetic).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: penalty_proposed_vs_final_good_faith_divergence
        grounds:
          - calculations.penalty_dollar_pipeline
          - calculations.penalty_points
          - entities.PenaltyAssessment.fields.proposed_penalty_cents
          - entities.PenaltyAssessment.fields.final_penalty_cents
        distinguishing_aspect: |
          Entity domain PenaltyAssessment: identical citation data (15 points,
          repeat multiplier) yields proposed 194063 cents with NO good-faith
          discount at issuance, but final 174657 cents after on-time verified
          abatement — the two pipeline variants differ by exactly the 19406-cent
          discount step that only the final variant runs.
        test_recipe:
          setup:
            - "Operator (1000 tons, size tier 0), UNDERGROUND mine, two inspectors."
            - "SPOT inspection IN_PROGRESS; citation issued at 2026-02-10T09:00:00Z with negligence NONE, likelihood REASONABLY_LIKELY, severity NO_INJURY, persons 1, non-S&S, repeat_violation true -> 15 points, gross 168750c, x1.15 = 194062.50 -> half-up 194063."
            - "Abated 2026-02-11, verified 2026-02-12 by the second inspector, on time against deadline 2026-03-12T09:00:00Z (NO_INJURY base 30 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T08:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 4", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "T. Okafor", badge_number: "INSP-200", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i2: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "NONE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-11T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/abate"
              payload: { abatement_note: "rock-dusted the entry" }
              as: OperatorRep
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/verify-abatement"
              payload: { verification_note: "observed compliant" }
              as: Inspector
              as_user_id: "${i2}"
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm1: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-13T09:00:01Z" }
              as: MSHAAdmin
            - call: "POST /msha/penalty-assessments/${asm1}/finalize"
              payload: {}
              as: MSHAAdmin
          assert:
            - "PenaltyAssessment.${asm1}.proposed_penalty_cents == 194063 (proposed variant: no good-faith step)"
            - "PenaltyAssessment.${asm1}.final_penalty_cents == 174657 (final variant: 194063 - round_half_up(194063*0.10)=19406)"
            - "PenaltyAssessment.${asm1}.good_faith_applied == true and statutory_floor_applied == false"
            - "PenaltyAssessment.${asm1}.status == FINAL"
            - "proposed minus final == 19406 exactly; the variants diverge on identical citation data"

