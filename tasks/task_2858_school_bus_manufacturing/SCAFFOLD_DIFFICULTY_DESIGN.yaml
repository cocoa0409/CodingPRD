  - rule_id: boundary_precision_check
    instances:

      - name: route_range_inclusive_boundary_at_one_decimal_place
        grounds:
          - calculations.range_validation
          - calculations.spec_compliance_evaluation
          - validations[priority=33]
          - errors[ERR_ROUTE_RANGE_INSUFFICIENT]
          - entities.BusUnit.fields.derated_route_range_mi
          - entities.StateSpecProfile.fields.required_route_range_mi
        distinguishing_aspect: |
          The derated range truncates to one decimal place (79.7 from 79.79... on ROLLING terrain) and the
          gate is >=, so 79.7 against a required 79.7 passes while the same bus against a required 79.8
          — a tenth of a mile away — is refused at unit minting. Both orders exist and both profiles are
          PUBLISHED, so nothing but the tenth-of-a-mile comparison separates the two outcomes.
        test_recipe:
          setup:
            - "TYPE_C_CONV + ELEC-155, whose ROLLING-terrain derated range is exactly 79.7 mi"
            - "NY 2026-2027 PUBLISHED with required_route_range_mi 79.7 (ROLLING); Solicitation SOL-NY-001 for 1 unit awarded normally"
            - "CT 2026-2027 revision 1 PUBLISHED with required_route_range_mi 79.6 (ROLLING) — the CT bid submits CONFORMING against it"
