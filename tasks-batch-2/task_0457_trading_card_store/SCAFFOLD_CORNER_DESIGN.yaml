        test_recipe:
          setup: ["A REQUESTED pre-order on a fresh PRE_ORDER_OPEN release (pool 10), version captured at create."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "OCC OK", email: "occok@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "OCC Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 10, unit_price_cents: 1000, deposit_required_cents: 500 }
              as: StoreManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${cust}", release_product_id: "${rp}", requested_quantity: 2, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${cust}"
