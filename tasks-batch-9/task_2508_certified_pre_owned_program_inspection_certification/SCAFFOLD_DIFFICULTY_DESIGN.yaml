            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000172", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
