scenario: |
  SNAP/EBT Food Stamps: household composition and income, net income calculation,
  monthly allotment, EBT card issuance, eligible items, fraud monitoring, ABAWD
  work training waiver, Emergency Allotment.

domain_name: snap-ebt-food-stamps
api_prefix: /snap

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: input
        description: "Caseworker-assigned case identifier; unique across all households."
        constraints: "format ^[A-Z]{2}-[0-9]{6}$; uniqueness check at create time"
      - name: state_code
        type: enum
        source: input
        description: "US state issuing benefits."
        constraints: "enum {CA, TX, NY, FL, IL, PA, OH, GA, NC, MI}"
      - name: address_line
        type: string
        source: input
        description: "Mailing address (free text)."
      - name: size
        type: integer
        source: computed
        description: "Computed count of HouseholdMember rows whose status == ACTIVE under this Household; recomputed on every member add/remove or status flip."
        constraints: "0..16; values >16 not supported"
      - name: gross_income_cents
        type: integer
        source: computed
        description: "Sum of HouseholdMember.monthly_earned_income_cents + monthly_unearned_income_cents over ACTIVE members; recomputed on member income changes."
      - name: net_income_cents
        type: integer
        source: computed
        description: "Result of calculation net_monthly_income on this Household; refreshed by every calc trigger named in §1.3."
      - name: status
        type: enum
        source: system
        description: "Household lifecycle status; managed by §1.2 Household state machine."
        constraints: "enum {PENDING, CERTIFIED, ACTIVE, SUSPENDED, TERMINATED}"
      - name: certification_end_date
        type: datetime
        source: system
        description: "ISO 8601 UTC date when current certification period ends; set on CERTIFIED transition (=certified_at + 12 months)."
      - name: heap_recipient
        type: boolean
        source: input
        description: "Whether household received Low Income Home Energy Assistance Program benefits in the last 12 months; if true, Standard Utility Allowance applies in net income calc."
        default: false

  - name: HouseholdMember
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; immutable after create."
      - name: full_name
        type: string
        source: input
        description: "Member's legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 UTC date; used by age-derived rules (elderly, ABAWD)."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to head of household."
        constraints: "enum {HEAD, SPOUSE, CHILD, PARENT, OTHER}"
      - name: monthly_earned_income_cents
        type: integer
        source: input
        description: "Member's monthly earned income in cents."
        default: 0
        constraints: ">= 0"
      - name: monthly_unearned_income_cents
        type: integer
        source: input
        description: "Member's monthly unearned income (Social Security, child support, etc.) in cents."
        default: 0
        constraints: ">= 0"
      - name: disabled
        type: boolean
        source: input
        description: "Whether member is disabled per SSA criteria; bypasses ABAWD work requirement and qualifies for elderly/disabled medical deduction."
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE counts toward Household.size; REMOVED is a soft-delete (member retained for audit but excluded from calcs)."
        constraints: "enum {ACTIVE, REMOVED}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this application certifies."
      - name: applied_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the application was submitted; equals created_at."
      - name: status
        type: enum
        source: system
        description: "Application lifecycle; managed by §1.2 Application state machine."
        constraints: "enum {DRAFT, SUBMITTED, APPROVED, DENIED, EXPIRED}"
      - name: caseworker_id
        type: string
        source: system
        description: "X-User-ID of the Caseworker who APPROVED or DENIED this application; null while DRAFT/SUBMITTED."
      - name: decision_reason
        type: string
        source: input
        description: "Caseworker-supplied reason; required on APPROVE/DENY transitions."

  - name: EBTCard
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this card serves."
      - name: pan_last4
        type: string
        source: system
        description: "Last 4 digits of card PAN; remaining digits are NOT stored. Generated by the system on issuance."
        constraints: "exactly 4 numeric chars"
      - name: status
        type: enum
        source: system
        description: "Card lifecycle; managed by §1.2 EBTCard state machine."
        constraints: "enum {PENDING_ISSUE, ACTIVE, SUSPENDED, REPLACED, CANCELLED}"
      - name: replaced_by_card_id
        type: string
        source: system
        description: "When status == REPLACED, set to the id of the successor EBTCard issued via /replace; otherwise null."

  - name: MonthlyAllotment
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household receiving this month's benefit."
      - name: benefit_month
        type: string
        source: input
        description: "Calendar month the allotment covers, in YYYY-MM form."
        constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$; unique with household_id"
      - name: standard_allotment_cents
        type: integer
        source: computed
        description: "Result of monthly_allotment calculation variant=STANDARD on this Household for this benefit_month."
      - name: emergency_supplement_cents
        type: integer
        source: computed
        description: "Result of monthly_allotment calculation variant=EMERGENCY top-up; non-zero only when an Emergency Allotment is in effect for benefit_month, else 0."
        default: 0
      - name: issued_total_cents
        type: integer
        source: computed
        description: "standard_allotment_cents + emergency_supplement_cents; recomputed any time either component changes."
      - name: status
        type: enum
        source: system
        description: "Allotment issuance lifecycle; managed by §1.2 MonthlyAllotment state machine."
        constraints: "enum {DRAFT, ISSUED, EXPUNGED, ADJUSTED}"
      - name: issued_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of issuance; null until status == ISSUED."

  - name: EligibleItemCategory
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Stable category code (e.g., FRESH_PRODUCE, HOT_PREPARED, TOBACCO)."
        constraints: "unique; ^[A-Z][A-Z0-9_]{1,31}$"
      - name: name
        type: string
        source: input
        description: "Display name for the category."
      - name: eligible
        type: boolean
        source: input
        description: "Whether items in this category are SNAP-purchasable. TOBACCO/ALCOHOL/HOT_PREPARED/NON_FOOD == false; FRESH_PRODUCE/DAIRY/MEAT/BREAD == true."

  - name: PurchaseTransaction
    parent: null
    common_fields: true
    fields:
      - name: ebt_card_id
        type: string
        source: input
        description: "FK -> EBTCard.id; the card swiped at point-of-sale."
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; copied from EBTCard.household_id at create time."
      - name: merchant_id
        type: string
        source: input
        description: "Opaque merchant identifier."
      - name: total_cents
        type: integer
        source: computed
        description: "Sum of line_items[].amount_cents for lines where the line's category eligibility resolves to true; ineligible lines NEVER contribute and are listed in ineligible_line_codes."
      - name: line_items
        type: array
        source: input
        description: "List of objects {category_code, amount_cents, quantity}; quantity >= 1; amount_cents > 0."
      - name: ineligible_line_codes
        type: array
        source: computed
        description: "Subset of line_items[].category_code where EligibleItemCategory.eligible == false; informational only — those line amounts are excluded from total_cents."
      - name: status
        type: enum
        source: system
        description: "Transaction lifecycle; managed by §1.2 PurchaseTransaction state machine."
        constraints: "enum {AUTHORIZED, SETTLED, REVERSED}"
      - name: settled_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of settlement; null until status == SETTLED."

  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; household under investigation."
      - name: trigger_rule
        type: enum
        source: input
        description: "Which rule raised the flag."
        constraints: "enum {VELOCITY_SPIKE, OUT_OF_STATE, DUPLICATE_HH_MEMBER, CARD_REPLACE_ABUSE}"
      - name: status
        type: enum
        source: system
        description: "Flag lifecycle; managed by §1.2 FraudFlag state machine."
        constraints: "enum {OPEN, UNDER_REVIEW, SUBSTANTIATED, DISMISSED}"
      - name: investigator_id
        type: string
        source: system
        description: "X-User-ID of the FraudInvestigator who took the case from OPEN to UNDER_REVIEW; null while OPEN."
      - name: resolution_note
        type: string
        source: input
        description: "Required when transitioning to SUBSTANTIATED or DISMISSED."

  - name: ABAWDWaiver
    parent: null
    common_fields: true
    fields:
      - name: household_member_id
        type: string
        source: input
        description: "FK -> HouseholdMember.id; the ABAWD this waiver applies to."
      - name: quarter
        type: string
        source: input
        description: "Calendar quarter the waiver covers, in YYYY-Qn form (n in 1..4)."
        constraints: "^[0-9]{4}-Q[1-4]$; unique with household_member_id"
      - name: county_unemployment_pct
        type: number
        source: input
        description: "Reported unemployment rate for member's county, percent (e.g., 7.50)."
        constraints: ">= 0.00, <= 50.00; two decimal places"
      - name: monthly_work_hours
        type: integer
        source: input
        description: "Verified hours of work or work-training reported for the quarter (monthly average)."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Waiver lifecycle; managed by §1.2 ABAWDWaiver state machine."
        constraints: "enum {PENDING, APPROVED, DENIED, REVOKED}"
      - name: decision_reason
        type: string
        source: input
        description: "Caseworker note on approval/denial; required on APPROVE/DENY transitions."

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: "Server's logical wall clock for benefit issuance and certification expiry. Tests advance it via POST /_clock/set_current_utc."

  - name: EmergencyAllotmentProclamation
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: enum
        source: input
        description: "State to which the proclamation applies."
        constraints: "same enum as Household.state_code"
      - name: benefit_month
        type: string
        source: input
        description: "Calendar month the supplement is in effect, YYYY-MM. Unique with state_code (one proclamation per state per month)."
        constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: min_supplement_cents
        type: integer
        source: input
        description: "Federally mandated floor on the emergency supplement (95 USD = 9500 cents)."
        default: 9500
      - name: status
        type: enum
        source: system
        description: "Proclamation lifecycle."
        constraints: "enum {DRAFT, ACTIVE, EXPIRED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Household referenced by household_id exists and is in status PENDING"
          - "Household.size >= 1 (at least one ACTIVE HouseholdMember)"
        side_effects:
          - "applied_at := SystemClock.current_utc"
          - "Household.updated_at := SystemClock.current_utc"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: Caseworker
        preconditions:
          - "Application.status == SUBMITTED"
          - "Calculation net_monthly_income on Household evaluated under variant=LIMIT_CHECK yields a value <= NET_INCOME_LIMIT_BY_SIZE[Household.size] (see §1.3)"
          - "If Household.size includes any ABAWD (member 18<=age<=49, !disabled, no child<18 in household), the household has an APPROVED ABAWDWaiver for that member for the current quarter OR the ABAWD's monthly_work_hours in PENDING waiver >= 80; else reject"
          - "decision_reason is non-empty"
        side_effects:
          - "Household.status := CERTIFIED then ACTIVE in same request (CERTIFIED is intermediate; auto-advance documented in Household machine)"
          - "Household.certification_end_date := SystemClock.current_utc + 12 months"
          - "EBTCard is created with status PENDING_ISSUE for this household_id (cascade chain link 1 of rule_id=transitive_cascade::approval)"
          - "Application.caseworker_id := X-User-ID"
          - "Household.version increments by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /applications/{id}/deny"
        actor: Caseworker
        preconditions:
          - "Application.status == SUBMITTED"
          - "decision_reason is non-empty"
        side_effects:
          - "Household.status := TERMINATED (compensating action)"
          - "Application.caseworker_id := X-User-ID"
          - "Household.version increments by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system: SystemClock.current_utc advances past applied_at + 30 days"
        actor: system
        preconditions:
          - "Application.status == SUBMITTED"
          - "SystemClock.current_utc >= applied_at + 30 days"
        side_effects:
          - "Household.status := TERMINATED (no certification ever issued)"

  - entity: Household
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "system: side effect of POST /applications/{id}/approve"
        actor: system
        preconditions:
          - "An Application for this Household just transitioned SUBMITTED → APPROVED"
        side_effects:
          - "certification_end_date is set"
          - "Auto-advances to ACTIVE in the same request before response is returned"
      - from: CERTIFIED
        to: ACTIVE
        trigger: "auto, immediately after CERTIFIED is set in the same request"
        actor: system
        preconditions:
          - "Household.status == CERTIFIED"
        side_effects:
          - "EBTCard with status PENDING_ISSUE is created if none exists for this household_id (cascade link 1)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /households/{id}/suspend"
        actor: Caseworker
        preconditions:
          - "Household.status == ACTIVE"
          - "At least one FraudFlag with status == SUBSTANTIATED exists for this household_id"
        side_effects:
          - "All EBTCards for this household_id with status == ACTIVE transition to SUSPENDED (cascade link 2 of rule_id=transitive_cascade::fraud)"
          - "Any DRAFT MonthlyAllotment for this household_id with benefit_month == current month transitions to EXPUNGED (cascade link 3 of rule_id=transitive_cascade::fraud)"
          - "Household.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /households/{id}/reinstate"
        actor: Caseworker
        preconditions:
          - "Household.status == SUSPENDED"
        side_effects:
          - "All EBTCards for this household_id with status == SUSPENDED transition back to ACTIVE"
          - "Household.version increments by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /households/{id}/terminate"
        actor: Caseworker
        preconditions:
          - "Household.status IN {ACTIVE, SUSPENDED}"
          - "decision_reason supplied in request body"
        side_effects:
          - "All EBTCards for this household_id transition to CANCELLED"
          - "All future-dated MonthlyAllotments (benefit_month > current month) transition to EXPUNGED"
          - "Household.version increments by 1"

  - entity: EBTCard
    initial_state: PENDING_ISSUE
    terminal_states: [REPLACED, CANCELLED]
    transitions:
      - from: PENDING_ISSUE
        to: ACTIVE
        trigger: "POST /ebt-cards/{id}/activate"
        actor: Cardholder
        preconditions:
          - "EBTCard.status == PENDING_ISSUE"
          - "Household.status == ACTIVE"
          - "X-User-ID matches Household.id of the household this card belongs to"
        side_effects:
          - "pan_last4 is set (system-generated 4 numeric chars)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ebt-cards/{id}/suspend OR cascade from Household.suspend"
        actor: Caseworker
        preconditions:
          - "EBTCard.status == ACTIVE"
        side_effects:
          - "Any AUTHORIZED PurchaseTransaction for this ebt_card_id transitions to REVERSED (cascade link 2 of rule_id=transitive_cascade::card_suspend)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ebt-cards/{id}/reinstate OR cascade from Household.reinstate"
        actor: Caseworker
        preconditions:
          - "EBTCard.status == SUSPENDED"
          - "Household.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: REPLACED
        trigger: "POST /ebt-cards/{id}/replace"
        actor: Cardholder
        preconditions:
          - "EBTCard.status == ACTIVE"
          - "Household.status == ACTIVE"
        side_effects:
          - "A new EBTCard is created with status ACTIVE; its id is written to replaced_by_card_id of the predecessor (cascade link 2 of rule_id=transitive_cascade::replace)"
          - "If this is the >=3rd replacement of any EBTCard for the same household_id within a rolling 90-day window (window endpoint = SystemClock.current_utc, inclusive), a FraudFlag with trigger_rule=CARD_REPLACE_ABUSE and status=OPEN is created (cascade link 3)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "cascade from Household.terminate"
        actor: system
        preconditions:
          - "EBTCard.status IN {ACTIVE, SUSPENDED, PENDING_ISSUE}"
        side_effects: []
      - from: SUSPENDED
        to: CANCELLED
        trigger: "cascade from Household.terminate"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_ISSUE
        to: CANCELLED
        trigger: "cascade from Household.terminate"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MonthlyAllotment
    initial_state: DRAFT
    terminal_states: [ISSUED, EXPUNGED, ADJUSTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /monthly-allotments/{id}/issue"
        actor: BenefitIssuer
        preconditions:
          - "MonthlyAllotment.status == DRAFT"
          - "Household.status == ACTIVE"
          - "Household has an EBTCard with status == ACTIVE"
          - "SystemClock.current_utc is on or after the first day of benefit_month"
          - "expected_household_version matches Household.version"
        side_effects:
          - "issued_at := SystemClock.current_utc"
          - "standard_allotment_cents and emergency_supplement_cents are recomputed from §1.3 calculations and frozen at issuance"
          - "Household.version increments by 1"
      - from: DRAFT
        to: EXPUNGED
        trigger: "cascade from Household.suspend OR Household.terminate"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: ADJUSTED
        trigger: "POST /monthly-allotments/{id}/adjust"
        actor: BenefitIssuer
        preconditions:
          - "MonthlyAllotment.status == ISSUED"
          - "An EmergencyAllotmentProclamation became ACTIVE for (Household.state_code, MonthlyAllotment.benefit_month) after issued_at"
        side_effects:
          - "emergency_supplement_cents is re-derived and may increase; issued_total_cents is recomputed; standard_allotment_cents unchanged"

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /fraud-flags/{id}/claim"
        actor: FraudInvestigator
        preconditions:
          - "FraudFlag.status == OPEN"
        side_effects:
          - "investigator_id := X-User-ID"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /fraud-flags/{id}/substantiate"
        actor: FraudInvestigator
        preconditions:
          - "FraudFlag.status == UNDER_REVIEW"
          - "investigator_id == X-User-ID (only the claiming investigator may resolve)"
          - "resolution_note is non-empty"
        side_effects: []
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /fraud-flags/{id}/dismiss"
        actor: FraudInvestigator
        preconditions:
          - "FraudFlag.status == UNDER_REVIEW"
          - "investigator_id == X-User-ID"
          - "resolution_note is non-empty"
        side_effects: []
      - from: OPEN
        to: DISMISSED
        trigger: "POST /fraud-flags/{id}/dismiss"
        actor: FraudInvestigator
        preconditions:
          - "FraudFlag.status == OPEN"
          - "resolution_note is non-empty"
        side_effects: []

  - entity: ABAWDWaiver
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /abawd-waivers/{id}/approve"
        actor: Caseworker
        preconditions:
          - "ABAWDWaiver.status == PENDING"
          - "ABAWD eligibility: county_unemployment_pct >= 10.00 OR monthly_work_hours >= 80"
          - "decision_reason non-empty"
        side_effects: []
      - from: PENDING
        to: DENIED
        trigger: "POST /abawd-waivers/{id}/deny"
        actor: Caseworker
        preconditions:
          - "ABAWDWaiver.status == PENDING"
          - "decision_reason non-empty"
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /abawd-waivers/{id}/revoke"
        actor: Caseworker
        preconditions:
          - "ABAWDWaiver.status == APPROVED"
        side_effects: []

  - entity: PurchaseTransaction
    initial_state: AUTHORIZED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: AUTHORIZED
        to: SETTLED
        trigger: "POST /purchase-transactions/{id}/settle"
        actor: Merchant
        preconditions:
          - "PurchaseTransaction.status == AUTHORIZED"
          - "EBTCard.status == ACTIVE"
        side_effects:
          - "settled_at := SystemClock.current_utc"
          - "Trigger §1.3 fraud_velocity_score recomputation for household_id"
          - "If recomputed velocity exceeds threshold (see §1.3), a FraudFlag with trigger_rule=VELOCITY_SPIKE and status=OPEN is created (cascade link 2 of rule_id=transitive_cascade::velocity)"
      - from: AUTHORIZED
        to: REVERSED
        trigger: "POST /purchase-transactions/{id}/reverse OR cascade from EBTCard.suspend"
        actor: Merchant | system
        preconditions: []
        side_effects: []

  - entity: EmergencyAllotmentProclamation
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /emergency-allotments/{id}/activate"
        actor: PolicyAdmin
        preconditions:
          - "EmergencyAllotmentProclamation.status == DRAFT"
          - "benefit_month is the current month or a future month relative to SystemClock.current_utc"
        side_effects:
          - "All ISSUED MonthlyAllotments with matching (state_code, benefit_month) become eligible for /adjust (does NOT auto-adjust)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: SystemClock.current_utc advances past end of benefit_month"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: issue-allotment-stale-household
    parent_entity: Household
    write_endpoint: "POST /monthly-allotments/{id}/issue"
    occ_field: "expected_household_version"
    description: |
      Issuing a MonthlyAllotment for a Household whose version has advanced
      since the BenefitIssuer last observed it is rejected. The advance is
      legitimate (e.g., a HouseholdMember was added, recomputing
      gross_income_cents and net_income_cents), so the allotment amount the
      issuer was about to freeze is stale.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

  - rule_id: substantiate-fraud-stale-flag
    parent_entity: FraudFlag
    write_endpoint: "POST /fraud-flags/{id}/substantiate"
    occ_field: "expected_fraudflag_version"
    description: |
      Substantiating a FraudFlag whose version has advanced since the
      investigator last observed it is rejected. A concurrent /dismiss or
      /claim by another investigator would have bumped the version; the
      substantiation decision was made against an out-of-date case state.
    error_id: ERR_STALE_FRAUDFLAG_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_monthly_income
    trigger: "On HouseholdMember create/update/remove; on Household heap_recipient flip; on Application submit; on MonthlyAllotment compute"
    algorithm: forward_looking
    formula: |
      # All amounts in integer cents. round_half_up applied ONCE at the end.
      gross = sum(m.monthly_earned_income_cents + m.monthly_unearned_income_cents
                  for m in HouseholdMember where household_id == HH.id and status == ACTIVE)
      earned = sum(m.monthly_earned_income_cents for m in ACTIVE members)
      earned_income_deduction = floor(earned * EARNED_INCOME_DEDUCTION_PCT)   # 20% of earned
      standard_deduction = STANDARD_DEDUCTION_BY_SIZE[min(HH.size, 6)]        # tier table
      utility_allowance = SUA if HH.heap_recipient else 0
      shelter_deduction = 0    # excluded from this scaffold's net-income variant
      total_deductions = earned_income_deduction + standard_deduction + utility_allowance
      net = max(0, gross - total_deductions)
      HH.net_income_cents = net
      HH.gross_income_cents = gross
    input_set: "HouseholdMember rows with status == ACTIVE under this Household; HEAP flag is from Household."
    constants:
      EARNED_INCOME_DEDUCTION_PCT: 0.20
      STANDARD_DEDUCTION_BY_SIZE:
        1: 19800   # $198.00
        2: 19800
        3: 19800
        4: 21300   # $213.00
        5: 24900   # $249.00
        6: 28500   # $285.00 (used for size >= 6)
      SUA: 6700    # $67.00 Standard Utility Allowance
      NET_INCOME_LIMIT_BY_SIZE:
        1: 117500
        2: 158900
        3: 200300
        4: 241700
        5: 283100
        6: 324500
      NET_INCOME_LIMIT_EACH_ADDL: 41400
    precision: "integer cents; intermediate products use Python integer math; round_half_up applied ONCE at the floor() call on earned_income_deduction (truncation toward zero); no other rounding"
    variants:
      - name: BENEFIT_CALC
        when: "Computing net_income_cents that feeds the monthly_allotment formula (stored on Household.net_income_cents)."
        difference: "Includes utility_allowance (SUA) when Household.heap_recipient == true; this produces the SMALLER net income figure used to boost the benefit amount."
      - name: LIMIT_CHECK
        when: "Checking eligibility against NET_INCOME_LIMIT_BY_SIZE inside Application.approve preconditions."
        difference: "ALWAYS omits utility_allowance even when heap_recipient is true; this produces the LARGER net income figure used to test the income ceiling. Same household, same inputs → BENEFIT_CALC net < LIMIT_CHECK net when heap_recipient == true."

  - name: monthly_allotment
    trigger: "On MonthlyAllotment create OR /issue OR /adjust"
    algorithm: tiered_pricing
    formula: |
      # Variant STANDARD (always computed)
      hh_size = max(1, HH.size)
      max_allotment = MAX_ALLOTMENT_BY_SIZE[min(hh_size, 6)] + max(0, hh_size - 6) * EXTRA_PER_PERSON
      thirty_pct_net = floor(HH.net_income_cents * BENEFIT_REDUCTION_PCT)   # 30%
      standard = max(MIN_ALLOTMENT_1_2 if hh_size <= 2 else 0, max_allotment - thirty_pct_net)

      # Variant EMERGENCY (computed only when an ACTIVE proclamation exists for (HH.state_code, benefit_month))
      proc = lookup EmergencyAllotmentProclamation
             where state_code == HH.state_code AND benefit_month == MA.benefit_month
             AND status == ACTIVE
      if proc is None:
          emergency_supplement = 0
      else:
          gap = max_allotment - standard         # how far below the max the household is
          emergency_supplement = max(proc.min_supplement_cents, gap)

      MA.standard_allotment_cents = standard
      MA.emergency_supplement_cents = emergency_supplement
      MA.issued_total_cents = standard + emergency_supplement
    input_set: "Household.size (HouseholdMember.status == ACTIVE), Household.net_income_cents from net_monthly_income calc; EmergencyAllotmentProclamation rows with status == ACTIVE matching state_code and benefit_month."
    constants:
      BENEFIT_REDUCTION_PCT: 0.30
      MAX_ALLOTMENT_BY_SIZE:
        1: 29100   # $291
        2: 53500   # $535
        3: 76600   # $766
        4: 97300   # $973
        5: 115500  # $1155
        6: 13860   # placeholder, overridden below
        # Actual: 1-person 291, 2-person 535, 3-person 766, 4-person 973, 5-person 1155, 6-person 1386
      MAX_ALLOTMENT_BY_SIZE_OVERRIDES:
        6: 138600
      EXTRA_PER_PERSON: 21100   # +$211 per person above 6
      MIN_ALLOTMENT_1_2: 2300   # $23 minimum for size 1 or 2 households
    precision: "integer cents; floor(...) applies to the 30% net product; no other rounding; round-then-subtract order is mandatory (NOT subtract-then-round) — see §0.5 rule combinatorial_formula (mode b)"
    variants:
      - name: STANDARD
        when: "Always; written to standard_allotment_cents."
        difference: "Base SNAP allotment without disaster supplement."
      - name: EMERGENCY
        when: "When an ACTIVE EmergencyAllotmentProclamation exists for (state_code, benefit_month) at the moment of issuance or adjust."
        difference: "Top-up = max(proclamation.min_supplement_cents, max_allotment - standard); written to emergency_supplement_cents and added to issued_total_cents."

  - name: fraud_velocity_score
    trigger: "On PurchaseTransaction settle (computed AFTER the just-settled row's status is written to SETTLED and AFTER its settled_at is stamped — see evaluation_order)"
    algorithm: aggregation
    formula: |
      # All cents. Evaluation order is mandatory:
      #   step 1: write settled_at = SystemClock.current_utc AND status := SETTLED to the trigger row
      #   step 2: re-query the SETTLED set (the trigger row is therefore included in the window)
      #   step 3: evaluate the aggregate below
      # This is the pinned resolution of the circular-looking dependency
      # "settle → recompute velocity → uses the just-settled row".
      window_start = SystemClock.current_utc - 24h
      txs = PurchaseTransaction where household_id == HH.id
            AND status == SETTLED
            AND settled_at >= window_start AND settled_at <= SystemClock.current_utc
      txs_sorted = txs sorted by (settled_at ASC, created_at ASC)   # tie-break on created_at, NEVER on id
      total_24h = sum(t.total_cents for t in txs_sorted)
      count_24h = len(txs_sorted)
      velocity_score = total_24h + (count_24h * VELOCITY_COUNT_PENALTY_CENTS)
      flag = (velocity_score >= VELOCITY_THRESHOLD_CENTS) AND (count_24h >= MIN_TX_FOR_FLAG)
      return flag
    evaluation_order: "(1) write settled_at + status SETTLED → (2) include trigger row in window query → (3) evaluate aggregate. Without this pinning, the trigger row could be either excluded (if evaluated before the write) or double-counted; SNAP semantics require inclusion."
    input_set: "PurchaseTransaction rows with status==SETTLED under this Household within last 24h (settled_at-bounded)."
    constants:
      VELOCITY_THRESHOLD_CENTS: 80000    # $800
      VELOCITY_COUNT_PENALTY_CENTS: 5000  # $50 per transaction
      MIN_TX_FOR_FLAG: 4
    precision: "integer cents; no rounding; chronological accumulator with created_at tie-break (never id)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and value is one of the declared roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all (except POST /_clock/set_current_utc which is also gated by role)"

  - priority: 2
    category: auth
    check: "X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role is permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every {id} segment in the URL path resolves to a row in the corresponding entity table; checked left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all GET/PUT/PATCH/POST on /{id}/* paths"

  - priority: 5
    category: existence
    check: "Every FK field in the request body resolves to an existing row in the parent entity"
    error_id: ERR_PARENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /household-members, POST /ebt-cards, POST /monthly-allotments, POST /purchase-transactions, POST /fraud-flags, POST /abawd-waivers, POST /applications"

  - priority: 6
    category: state
    check: "The entity is in a from-state listed in §1.2 for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (POST /<entity>/{id}/<action>)"

  - priority: 7
    category: state
    check: "Cross-entity precondition: EBTCard.activate requires Household.status == ACTIVE"
    error_id: ERR_HOUSEHOLD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ebt-cards/{id}/activate, POST /monthly-allotments/{id}/issue, POST /ebt-cards/{id}/reinstate"

  - priority: 8
    category: state
    check: "Cross-entity precondition: PurchaseTransaction.settle requires EBTCard.status == ACTIVE"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /purchase-transactions/{id}/settle"

  - priority: 9
    category: business_safety
    check: "POST /fraud-flags/{id}/substantiate or /dismiss: investigator_id == X-User-ID (segregation of resolution to claimant)"
    error_id: ERR_NOT_CLAIMING_INVESTIGATOR
    http_status: 403
    applies_to: "POST /fraud-flags/{id}/substantiate, POST /fraud-flags/{id}/dismiss (UNDER_REVIEW only)"

  - priority: 10
    category: business_referential
    check: "Household.case_number is unique across all Households"
    error_id: ERR_DUPLICATE_CASE_NUMBER
    http_status: 409
    applies_to: "POST /households"

  - priority: 11
    category: business_referential
    check: "(household_id, benefit_month) is unique across MonthlyAllotment"
    error_id: ERR_DUPLICATE_ALLOTMENT_MONTH
    http_status: 409
    applies_to: "POST /monthly-allotments"

  - priority: 12
    category: business_referential
    check: "(household_member_id, quarter) is unique across ABAWDWaiver"
    error_id: ERR_DUPLICATE_WAIVER_QUARTER
    http_status: 409
    applies_to: "POST /abawd-waivers"

  - priority: 13
    category: business_referential
    check: "(state_code, benefit_month) is unique across EmergencyAllotmentProclamation"
    error_id: ERR_DUPLICATE_PROCLAMATION
    http_status: 409
    applies_to: "POST /emergency-allotments"

  - priority: 14
    category: business_temporal
    check: "MonthlyAllotment.benefit_month is the current month (YYYY-MM of SystemClock.current_utc) or a future month at create"
    error_id: ERR_BENEFIT_MONTH_IN_PAST
    http_status: 422
    applies_to: "POST /monthly-allotments"

  - priority: 15
    category: business_temporal
    check: "MonthlyAllotment.issue requires SystemClock.current_utc on or after the first UTC day of benefit_month"
    error_id: ERR_ISSUANCE_TOO_EARLY
    http_status: 409
    applies_to: "POST /monthly-allotments/{id}/issue"

  - priority: 16
    category: business_safety
    check: "Application.approve requires household has either (a) an APPROVED ABAWDWaiver for each ABAWD member for the current quarter, OR (b) the PENDING waiver's monthly_work_hours >= 80 for each ABAWD member; otherwise reject"
    error_id: ERR_ABAWD_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 17
    category: business_fiscal
    check: "Application.approve requires net_monthly_income calc evaluated under variant=LIMIT_CHECK (omits SUA even if heap_recipient=true) yields a value <= NET_INCOME_LIMIT_BY_SIZE[Household.size]"
    error_id: ERR_INCOME_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "PurchaseTransaction with ALL line items in ineligible categories is rejected (total_cents would be 0)"
    error_id: ERR_ALL_ITEMS_INELIGIBLE
    http_status: 422
    applies_to: "POST /purchase-transactions"

  - priority: 19
    category: business_constraint
    check: "line_items must be non-empty and each item must reference an existing EligibleItemCategory.code"
    error_id: ERR_INVALID_LINE_ITEMS
    http_status: 422
    applies_to: "POST /purchase-transactions"

  - priority: 20
    category: business_constraint
    check: "Household.state_code in PurchaseTransaction's merchant location must match Household.state_code (out-of-state purchases raise a FraudFlag with OUT_OF_STATE — non-blocking on first occurrence, blocking on second per request)"
    error_id: ERR_OUT_OF_STATE_BLOCKED
    http_status: 409
    applies_to: "POST /purchase-transactions (only when a prior OUT_OF_STATE flag exists OPEN/UNDER_REVIEW/SUBSTANTIATED for the household)"

  - priority: 21
    category: state
    check: "OCC: expected_<parent>_version in request body matches parent.version"
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412
    applies_to: "POST /monthly-allotments/{id}/issue (parent=Household), POST /fraud-flags/{id}/substantiate (parent=FraudFlag, ERR_STALE_FRAUDFLAG_VERSION)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Households
  - method: POST
    path: "/snap/households"
    description: "Create a new household record in PENDING state."
    roles: [Caseworker]
    code: 201
    input: ["case_number", "state_code", "address_line", "heap_recipient?"]
    output: Household
    side_effects: ["Household created with status=PENDING, size=0"]

  - method: GET
    path: "/snap/households/{id}"
    description: "Get household by id."
    roles: [Caseworker, Applicant, FraudInvestigator, BenefitIssuer]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/snap/households"
    description: "List households; supports filtering by case_number, status, state_code."
    roles: [Caseworker, FraudInvestigator, BenefitIssuer]
    code: 200
    input: ["case_number?", "status?", "state_code?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  - method: PATCH
    path: "/snap/households/{id}"
    description: "Update mutable household fields (address_line, heap_recipient). Triggers net_monthly_income recompute if heap_recipient changes."
    roles: [Caseworker]
    code: 200
    input: ["address_line?", "heap_recipient?"]
    output: Household
    side_effects: ["heap_recipient flip triggers net_monthly_income recompute and increments Household.version"]

  - method: POST
    path: "/snap/households/{id}/suspend"
    description: "Suspend an ACTIVE household (requires a SUBSTANTIATED FraudFlag)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Household
    side_effects: ["Cascade: ACTIVE EBTCards->SUSPENDED; DRAFT MonthlyAllotments for current month->EXPUNGED; Household.version += 1"]

  - method: POST
    path: "/snap/households/{id}/reinstate"
    description: "Reinstate a SUSPENDED household (requires zero SUBSTANTIATED flags)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Household
    side_effects: ["Cascade: SUSPENDED EBTCards->ACTIVE; Household.version += 1"]

  - method: POST
    path: "/snap/households/{id}/terminate"
    description: "Terminate a household (irreversible)."
    roles: [Caseworker]
    code: 200
    input: ["decision_reason"]
    output: Household
    side_effects: ["Cascade: All EBTCards->CANCELLED; future MonthlyAllotments->EXPUNGED; Household.version += 1"]

  # ---- HouseholdMembers
  - method: POST
    path: "/snap/household-members"
    description: "Add a member to a household."
    roles: [Caseworker]
    code: 201
    input: ["household_id", "full_name", "date_of_birth", "relationship", "monthly_earned_income_cents?", "monthly_unearned_income_cents?", "disabled?"]
    output: HouseholdMember
    side_effects: ["Household.size, gross_income_cents, net_income_cents recomputed; Household.version += 1"]

  - method: GET
    path: "/snap/household-members/{id}"
    description: "Get a household member."
    roles: [Caseworker, Applicant, FraudInvestigator]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []

  - method: GET
    path: "/snap/household-members"
    description: "List members; filter by household_id and status."
    roles: [Caseworker, Applicant, FraudInvestigator]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []

  - method: PATCH
    path: "/snap/household-members/{id}"
    description: "Update member income fields and status (status flip ACTIVE<->REMOVED triggers Household recompute)."
    roles: [Caseworker]
    code: 200
    input: ["monthly_earned_income_cents?", "monthly_unearned_income_cents?", "disabled?", "status?"]
    output: HouseholdMember
    side_effects: ["Household.size/gross/net recomputed; Household.version += 1"]

  # ---- Applications
  - method: POST
    path: "/snap/applications"
    description: "Create an application in DRAFT for a household."
    roles: [Caseworker, Applicant]
    code: 201
    input: ["household_id"]
    output: Application
    side_effects: []

  - method: GET
    path: "/snap/applications/{id}"
    description: "Get an application."
    roles: [Caseworker, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/snap/applications"
    description: "List applications; filter by household_id or status."
    roles: [Caseworker, Applicant]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/snap/applications/{id}/submit"
    description: "Submit a DRAFT application."
    roles: [Applicant, Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: ["applied_at stamped; Household.updated_at refreshed"]

  - method: POST
    path: "/snap/applications/{id}/approve"
    description: "Approve a SUBMITTED application; cascades to Household.status=ACTIVE and EBTCard creation."
    roles: [Caseworker]
    code: 200
    input: ["decision_reason"]
    output: Application
    side_effects: ["Household.status->CERTIFIED->ACTIVE (auto-advance); certification_end_date set; EBTCard with status PENDING_ISSUE created; Application.caseworker_id := X-User-ID; Household.version += 1"]

  - method: POST
    path: "/snap/applications/{id}/deny"
    description: "Deny a SUBMITTED application."
    roles: [Caseworker]
    code: 200
    input: ["decision_reason"]
    output: Application
    side_effects: ["Household.status -> TERMINATED; Application.caseworker_id := X-User-ID; Household.version += 1"]

  # ---- EBTCards
  - method: GET
    path: "/snap/ebt-cards/{id}"
    description: "Get an EBT card."
    roles: [Caseworker, Cardholder, FraudInvestigator]
    code: 200
    input: []
    output: EBTCard
    side_effects: []

  - method: GET
    path: "/snap/ebt-cards"
    description: "List EBT cards; filter by household_id and status."
    roles: [Caseworker, Cardholder, FraudInvestigator]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: EBTCard[]
    side_effects: []

  - method: POST
    path: "/snap/ebt-cards/{id}/activate"
    description: "Activate a PENDING_ISSUE card; mints pan_last4."
    roles: [Cardholder, Caseworker]
    code: 200
    input: []
    output: EBTCard
    side_effects: ["pan_last4 generated"]

  - method: POST
    path: "/snap/ebt-cards/{id}/suspend"
    description: "Suspend an ACTIVE card."
    roles: [Caseworker, FraudInvestigator]
    code: 200
    input: []
    output: EBTCard
    side_effects: ["Cascade: AUTHORIZED PurchaseTransactions->REVERSED"]

  - method: POST
    path: "/snap/ebt-cards/{id}/reinstate"
    description: "Reinstate a SUSPENDED card."
    roles: [Caseworker]
    code: 200
    input: []
    output: EBTCard
    side_effects: []

  - method: POST
    path: "/snap/ebt-cards/{id}/replace"
    description: "Replace an ACTIVE card; mints successor and may raise CARD_REPLACE_ABUSE fraud flag."
    roles: [Cardholder, Caseworker]
    code: 200
    input: []
    output: EBTCard
    side_effects: ["Successor EBTCard created with status=ACTIVE; predecessor.replaced_by_card_id set; if >=3rd replacement in 90d window for the household, FraudFlag(CARD_REPLACE_ABUSE) created OPEN"]

  # ---- MonthlyAllotments
  - method: POST
    path: "/snap/monthly-allotments"
    description: "Create a DRAFT monthly allotment for a household/month; computes standard_allotment_cents."
    roles: [BenefitIssuer, Caseworker]
    code: 201
    input: ["household_id", "benefit_month"]
    output: MonthlyAllotment
    side_effects: ["standard_allotment_cents and emergency_supplement_cents computed via §1.3"]

  - method: GET
    path: "/snap/monthly-allotments/{id}"
    description: "Get an allotment."
    roles: [BenefitIssuer, Caseworker, Applicant]
    code: 200
    input: []
    output: MonthlyAllotment
    side_effects: []

  - method: GET
    path: "/snap/monthly-allotments"
    description: "List allotments; filter by household_id, benefit_month, status."
    roles: [BenefitIssuer, Caseworker, Applicant]
    code: 200
    input: ["household_id?", "benefit_month?", "status?", "limit?", "offset?"]
    output: MonthlyAllotment[]
    side_effects: []

  - method: POST
    path: "/snap/monthly-allotments/{id}/issue"
    description: "Freeze and issue a DRAFT allotment to the household's ACTIVE EBT card."
    roles: [BenefitIssuer]
    code: 200
    input: ["expected_household_version"]
    output: MonthlyAllotment
    side_effects: ["standard_allotment_cents/emergency_supplement_cents/issued_total_cents frozen; issued_at stamped; Household.version += 1"]

  - method: POST
    path: "/snap/monthly-allotments/{id}/adjust"
    description: "Recompute emergency_supplement_cents after a new proclamation takes effect."
    roles: [BenefitIssuer]
    code: 200
    input: []
    output: MonthlyAllotment
    side_effects: ["emergency_supplement_cents and issued_total_cents recomputed; standard_allotment_cents unchanged"]

  # ---- EligibleItemCategories
  - method: POST
    path: "/snap/eligible-item-categories"
    description: "Create an item category (TOBACCO, FRESH_PRODUCE, etc.)."
    roles: [PolicyAdmin]
    code: 201
    input: ["code", "name", "eligible"]
    output: EligibleItemCategory
    side_effects: []

  - method: GET
    path: "/snap/eligible-item-categories/{id}"
    description: "Get an eligible item category by id (server-minted UUID; categories are also queryable by code via list)."
    roles: [PolicyAdmin, Merchant, Caseworker]
    code: 200
    input: []
    output: EligibleItemCategory
    side_effects: []

  - method: GET
    path: "/snap/eligible-item-categories"
    description: "List categories; filter by eligible flag and code."
    roles: [PolicyAdmin, Merchant, Caseworker]
    code: 200
    input: ["eligible?", "code?", "limit?", "offset?"]
    output: EligibleItemCategory[]
    side_effects: []

  # ---- PurchaseTransactions
  - method: POST
    path: "/snap/purchase-transactions"
    description: "Create a purchase transaction in AUTHORIZED status; total_cents excludes ineligible lines."
    roles: [Merchant]
    code: 201
    input: ["ebt_card_id", "merchant_id", "line_items"]
    output: PurchaseTransaction
    side_effects: ["total_cents and ineligible_line_codes computed; household_id copied from EBTCard"]

  - method: GET
    path: "/snap/purchase-transactions/{id}"
    description: "Get a purchase transaction."
    roles: [Merchant, Caseworker, FraudInvestigator]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: []

  - method: GET
    path: "/snap/purchase-transactions"
    description: "List purchase transactions; filter by ebt_card_id, household_id, status."
    roles: [Merchant, Caseworker, FraudInvestigator]
    code: 200
    input: ["ebt_card_id?", "household_id?", "status?", "limit?", "offset?"]
    output: PurchaseTransaction[]
    side_effects: []

  - method: POST
    path: "/snap/purchase-transactions/{id}/settle"
    description: "Settle an AUTHORIZED transaction; runs fraud_velocity_score."
    roles: [Merchant]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: ["settled_at stamped; fraud_velocity_score recomputed; may create VELOCITY_SPIKE FraudFlag"]

  - method: POST
    path: "/snap/purchase-transactions/{id}/reverse"
    description: "Reverse an AUTHORIZED transaction."
    roles: [Merchant]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: []

  # ---- FraudFlags
  - method: GET
    path: "/snap/fraud-flags/{id}"
    description: "Get a fraud flag."
    roles: [FraudInvestigator, Caseworker]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []

  - method: GET
    path: "/snap/fraud-flags"
    description: "List fraud flags; filter by household_id, status, trigger_rule."
    roles: [FraudInvestigator, Caseworker]
    code: 200
    input: ["household_id?", "status?", "trigger_rule?", "limit?", "offset?"]
    output: FraudFlag[]
    side_effects: []

  - method: POST
    path: "/snap/fraud-flags"
    description: "Manually raise a fraud flag (caseworker referral)."
    roles: [Caseworker, FraudInvestigator]
    code: 201
    input: ["household_id", "trigger_rule"]
    output: FraudFlag
    side_effects: []

  - method: POST
    path: "/snap/fraud-flags/{id}/claim"
    description: "Claim an OPEN flag; sets investigator_id."
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []

  - method: POST
    path: "/snap/fraud-flags/{id}/substantiate"
    description: "Substantiate an UNDER_REVIEW flag."
    roles: [FraudInvestigator]
    code: 200
    input: ["resolution_note", "expected_fraudflag_version"]
    output: FraudFlag
    side_effects: []

  - method: POST
    path: "/snap/fraud-flags/{id}/dismiss"
    description: "Dismiss an OPEN or UNDER_REVIEW flag."
    roles: [FraudInvestigator]
    code: 200
    input: ["resolution_note"]
    output: FraudFlag
    side_effects: []

  # ---- ABAWDWaivers
  - method: POST
    path: "/snap/abawd-waivers"
    description: "Request a waiver for an ABAWD member; status begins PENDING."
    roles: [Caseworker, Applicant]
    code: 201
    input: ["household_member_id", "quarter", "county_unemployment_pct", "monthly_work_hours"]
    output: ABAWDWaiver
    side_effects: []

  - method: GET
    path: "/snap/abawd-waivers/{id}"
    description: "Get a waiver."
    roles: [Caseworker, Applicant]
    code: 200
    input: []
    output: ABAWDWaiver
    side_effects: []

  - method: GET
    path: "/snap/abawd-waivers"
    description: "List waivers; filter by household_member_id, quarter, status."
    roles: [Caseworker, Applicant]
    code: 200
    input: ["household_member_id?", "quarter?", "status?", "limit?", "offset?"]
    output: ABAWDWaiver[]
    side_effects: []

  - method: POST
    path: "/snap/abawd-waivers/{id}/approve"
    description: "Approve a PENDING waiver."
    roles: [Caseworker]
    code: 200
    input: ["decision_reason"]
    output: ABAWDWaiver
    side_effects: []

  - method: POST
    path: "/snap/abawd-waivers/{id}/deny"
    description: "Deny a PENDING waiver."
    roles: [Caseworker]
    code: 200
    input: ["decision_reason"]
    output: ABAWDWaiver
    side_effects: []

  - method: POST
    path: "/snap/abawd-waivers/{id}/revoke"
    description: "Revoke an APPROVED waiver."
    roles: [Caseworker]
    code: 200
    input: []
    output: ABAWDWaiver
    side_effects: []

  # ---- EmergencyAllotmentProclamations
  - method: POST
    path: "/snap/emergency-allotments"
    description: "Create a DRAFT proclamation for a state/month."
    roles: [PolicyAdmin]
    code: 201
    input: ["state_code", "benefit_month", "min_supplement_cents?"]
    output: EmergencyAllotmentProclamation
    side_effects: []

  - method: GET
    path: "/snap/emergency-allotments/{id}"
    description: "Get a proclamation."
    roles: [PolicyAdmin, BenefitIssuer, Caseworker]
    code: 200
    input: []
    output: EmergencyAllotmentProclamation
    side_effects: []

  - method: GET
    path: "/snap/emergency-allotments"
    description: "List proclamations; filter by state_code, benefit_month, status."
    roles: [PolicyAdmin, BenefitIssuer, Caseworker]
    code: 200
    input: ["state_code?", "benefit_month?", "status?", "limit?", "offset?"]
    output: EmergencyAllotmentProclamation[]
    side_effects: []

  - method: POST
    path: "/snap/emergency-allotments/{id}/activate"
    description: "Activate a DRAFT proclamation."
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: EmergencyAllotmentProclamation
    side_effects: ["Issued MonthlyAllotments for matching (state, benefit_month) become eligible for /adjust"]

  # ---- Test-driving endpoint
  - method: POST
    path: "/snap/_clock/set_current_utc"
    description: "Test-only: set the server's logical clock. Used to drive certification expiry, benefit_month boundaries, and 24h velocity windows."
    roles: [PolicyAdmin]
    code: 200
    input: ["to_iso8601"]
    output: SystemClock
    side_effects: ["SystemClock.current_utc set; system transitions (Application EXPIRED, Proclamation EXPIRED) may fire"]

  - method: GET
    path: "/snap/_clock"
    description: "Test-only: read the server's logical clock."
    roles: [PolicyAdmin, Caseworker, BenefitIssuer, FraudInvestigator]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/invalid"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "URL path id segment does not resolve"
  - id: ERR_PARENT_NOT_FOUND
    http: 404
    condition: "Body FK does not resolve to an existing parent row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, type/enum violation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition's from-state does not match entity's current status"
  - id: ERR_HOUSEHOLD_NOT_ACTIVE
    http: 409
    condition: "Operation requires Household.status == ACTIVE"
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "PurchaseTransaction.settle requires EBTCard.status == ACTIVE"
  - id: ERR_NOT_CLAIMING_INVESTIGATOR
    http: 403
    condition: "FraudFlag resolve attempted by a non-claiming investigator"
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "Household.case_number not unique"
  - id: ERR_DUPLICATE_ALLOTMENT_MONTH
    http: 409
    condition: "(household_id, benefit_month) not unique for MonthlyAllotment"
  - id: ERR_DUPLICATE_WAIVER_QUARTER
    http: 409
    condition: "(household_member_id, quarter) not unique for ABAWDWaiver"
  - id: ERR_DUPLICATE_PROCLAMATION
    http: 409
    condition: "(state_code, benefit_month) not unique for EmergencyAllotmentProclamation"
  - id: ERR_BENEFIT_MONTH_IN_PAST
    http: 422
    condition: "MonthlyAllotment.benefit_month is before the current month"
  - id: ERR_ISSUANCE_TOO_EARLY
    http: 409
    condition: "Allotment /issue attempted before first day of benefit_month"
  - id: ERR_INCOME_LIMIT_EXCEEDED
    http: 409
    condition: "Net income exceeds NET_INCOME_LIMIT_BY_SIZE[Household.size]"
  - id: ERR_ABAWD_REQUIREMENT_UNMET
    http: 409
    condition: "Application approve attempted while an ABAWD member lacks an APPROVED waiver and reports <80 monthly_work_hours"
  - id: ERR_ALL_ITEMS_INELIGIBLE
    http: 422
    condition: "PurchaseTransaction with no eligible lines (total_cents would be 0)"
  - id: ERR_INVALID_LINE_ITEMS
    http: 422
    condition: "line_items empty or references unknown category code"
  - id: ERR_OUT_OF_STATE_BLOCKED
    http: 409
    condition: "Second OUT_OF_STATE purchase attempt blocked after first generated a flag"
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version != Household.version (OCC mismatch)"
  - id: ERR_STALE_FRAUDFLAG_VERSION
    http: 412
    condition: "expected_fraudflag_version != FraudFlag.version (OCC mismatch)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Caseworker
    description: "State agency caseworker responsible for household certification, member roster maintenance, application decisions, waiver decisions, and lifecycle controls (suspend/reinstate/terminate)."
    identity: opaque
    exclusive_operations:
      - "POST /snap/households"
      - "POST /snap/household-members"
      - "PATCH /snap/household-members/{id}"
      - "PATCH /snap/households/{id}"
      - "POST /snap/households/{id}/suspend"
      - "POST /snap/households/{id}/reinstate"
      - "POST /snap/households/{id}/terminate"
      - "POST /snap/applications/{id}/approve"
      - "POST /snap/applications/{id}/deny"
      - "POST /snap/abawd-waivers/{id}/approve"
      - "POST /snap/abawd-waivers/{id}/deny"
      - "POST /snap/abawd-waivers/{id}/revoke"
    shared_operations:
      - "POST /snap/applications"
      - "POST /snap/applications/{id}/submit"
      - "POST /snap/monthly-allotments (with BenefitIssuer)"
      - "POST /snap/ebt-cards/{id}/activate (with Cardholder)"
      - "POST /snap/ebt-cards/{id}/suspend (with FraudInvestigator)"
      - "POST /snap/ebt-cards/{id}/reinstate"
      - "POST /snap/ebt-cards/{id}/replace (with Cardholder)"
      - "POST /snap/fraud-flags (with FraudInvestigator)"
      - "GETs across Household/Application/EBTCard/MonthlyAllotment/FraudFlag/Member/Waiver/Proclamation/Category"

  - name: Applicant
    description: "Head-of-household applicant. Can submit own applications, request own waivers, and view own household."
    identity: entity_backed:Household
    exclusive_operations: []
    shared_operations:
      - "POST /snap/applications"
      - "POST /snap/applications/{id}/submit"
      - "GET /snap/households/{id} (own household)"
      - "GET /snap/household-members (filter to own household)"
      - "GET /snap/applications (filter to own household)"
      - "POST /snap/abawd-waivers (for own member)"
      - "GET /snap/abawd-waivers (own member)"
      - "GET /snap/monthly-allotments (own household)"

  - name: Cardholder
    description: "Holder of an EBT card; activates and replaces own card. Identified by Household.id (the household the card belongs to)."
    identity: entity_backed:Household
    exclusive_operations: []
    shared_operations:
      - "POST /snap/ebt-cards/{id}/activate"
      - "POST /snap/ebt-cards/{id}/replace"
      - "GET /snap/ebt-cards (own household filter)"
      - "GET /snap/ebt-cards/{id} (own household)"

  - name: BenefitIssuer
    description: "Backend role responsible for monthly allotment computation, issuance, and emergency adjustment."
    identity: opaque
    exclusive_operations:
      - "POST /snap/monthly-allotments/{id}/issue"
      - "POST /snap/monthly-allotments/{id}/adjust"
    shared_operations:
      - "POST /snap/monthly-allotments"
      - "GETs on MonthlyAllotment, Household, EmergencyAllotmentProclamation, SystemClock"

  - name: FraudInvestigator
    description: "Owns FraudFlag lifecycle; can suspend cards under investigation. Identified opaquely by operator id."
    identity: opaque
    exclusive_operations:
      - "POST /snap/fraud-flags/{id}/claim"
      - "POST /snap/fraud-flags/{id}/substantiate"
      - "POST /snap/fraud-flags/{id}/dismiss"
    shared_operations:
      - "POST /snap/fraud-flags"
      - "POST /snap/ebt-cards/{id}/suspend"
      - "GETs on Household, EBTCard, PurchaseTransaction, FraudFlag, Member"

  - name: Merchant
    description: "Point-of-sale processor; authorizes and settles transactions."
    identity: opaque
    exclusive_operations:
      - "POST /snap/purchase-transactions"
      - "POST /snap/purchase-transactions/{id}/settle"
      - "POST /snap/purchase-transactions/{id}/reverse"
    shared_operations:
      - "GET /snap/purchase-transactions"
      - "GET /snap/purchase-transactions/{id}"
      - "GET /snap/eligible-item-categories"
      - "GET /snap/eligible-item-categories/{id}"

  - name: PolicyAdmin
    description: "Administers reference data (eligible item categories), publishes emergency allotment proclamations, and (in tests) controls the system clock."
    identity: opaque
    exclusive_operations:
      - "POST /snap/eligible-item-categories"
      - "POST /snap/emergency-allotments"
      - "POST /snap/emergency-allotments/{id}/activate"
      - "POST /snap/_clock/set_current_utc"
    shared_operations:
      - "GET /snap/eligible-item-categories"
      - "GET /snap/eligible-item-categories/{id}"
      - "GET /snap/emergency-allotments"
      - "GET /snap/emergency-allotments/{id}"
      - "GET /snap/_clock"
