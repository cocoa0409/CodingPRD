        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-asset]", "errors[ERR_STALE_ASSET_VERSION]"]
        distinguishing_aspect: "Two strictly sequential plan creates: the second carries the pre-first-create Asset.version and is rejected 412 — deterministic OCC, no wall-clock or lock semantics."
        test_recipe:
          setup: ["BASE; plan FY2027 created (Asset.version advanced from a1_v)"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
