scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_create_duplicate_mrn_rejected
        claim_type: creation_uniqueness
        grounds: [entities.Patient.fields.mrn, "errors[ERR_DUPLICATE_MRN]"]
        distinguishing_aspect: "Second POST /patients reusing an existing mrn is rejected with ERR_DUPLICATE_MRN; the first record is untouched."
        test_recipe:
          setup: ["Patient MRN-DUP-01 registered"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-DUP-01", full_name: "Pat Dup", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-DUP-01", full_name: "Pat Dup Two", date_of_birth: "1971-01-01" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_DUPLICATE_MRN"
            - "GET /patients/${p1} returns full_name == 'Pat Dup' (original unchanged)"

      - name: get_patient_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"

      - name: defaults_applied_on_staffing_and_order_create
        claim_type: defaults
        grounds: [entities.StaffingAssignment.fields.patient_capacity, entities.ReferralOrder.fields.priority, entities.Bed.fields.titration_capable]
        distinguishing_aspect: "Omitting defaulted inputs yields patient_capacity 2, priority ROUTINE, titration_capable false, is_active true."
        test_recipe:
          setup: ["Technologist exists; patient exists"]
          setup_api_calls:
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "CPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "MRN-DEF-01", full_name: "Pat Def", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B-DEF" }, as: LabDirector, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-03" }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id } }
          assert:
            - "StaffingAssignment.${sa1}.patient_capacity == 2 and status == PLANNED"
            - "ReferralOrder.${o1}.priority == 'ROUTINE' and no_show_count == 0 and version == 1"
            - "Bed.${b1}.titration_capable == false and is_active == true (create response)"

      - name: hst_study_rejects_bed_id
        claim_type: conditional_constraint
        grounds: [entities.SleepStudy.fields.bed_id, "errors[ERR_BED_NOT_ALLOWED_FOR_HST]"]
        distinguishing_aspect: "HST study carrying bed_id is rejected ERR_BED_NOT_ALLOWED_FOR_HST (400)."
        test_recipe:
          setup: ["AUTHORIZED HST order; bed exists"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-ENT-01", full_name: "Pat Ent", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1" }, as: LabDirector, captures: { b1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
          trigger:
            - call: "POST /sleep-studies"
              payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01", bed_id: "${b1}" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_BED_NOT_ALLOWED_FOR_HST"
            - "GET /sleep-studies?order_id=${o1} total_count == 0"

      - name: psg_study_requires_bed_id
        claim_type: conditional_constraint
        grounds: [entities.SleepStudy.fields.bed_id, "errors[ERR_BED_REQUIRED_FOR_IN_LAB]"]
        distinguishing_aspect: "PSG_DIAGNOSTIC study without bed_id is rejected ERR_BED_REQUIRED_FOR_IN_LAB (400)."
        test_recipe:
          setup: ["AUTHORIZED PSG order"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-ENT-02", full_name: "Pat Ent Two", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
          trigger:
            - call: "POST /sleep-studies"
              payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-01" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_BED_REQUIRED_FOR_IN_LAB"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: create_task_on_terminal_study_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SleepStudy, "errors[ERR_STUDY_NOT_SCORABLE]"]
        distinguishing_aspect: "A REPORT_FINALIZED (terminal) study rejects new scoring task creation with ERR_STUDY_NOT_SCORABLE."
        test_recipe:
          setup: ["HST study fully scored, reported, signed, finalized"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-01", full_name: "Pat Sm", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer One", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 20, central_apneas: 0, mixed_apneas: 0, hypopneas: 20, reras: 0, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /sleep-studies/${st1}", payload: {}, as: LabDirector, captures: { st1_v: $.data.version } }
            - { call: "POST /interpretation-reports", payload: { study_id: "${st1}", primary_scoring_task_id: "${tk1}", diagnosis_code: "G47.33", expected_sleep_study_version: "${st1_v}" }, as: InterpretingPhysician, as_user_id: "${dr1}", captures: { r1: $.data.id } }
            - { call: "POST /interpretation-reports/${r1}/sign", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /interpretation-reports/${r1}/finalize", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
          trigger:
            - call: "POST /scoring-tasks"
              payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }
              as: LabDirector
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_STUDY_NOT_SCORABLE"
            - "SleepStudy.${st1}.status == REPORT_FINALIZED (unchanged)"

      - name: decision_on_decided_auth_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InsuranceAuthorization.SUBMITTED_to_APPROVED, "errors[ERR_AUTH_NOT_PENDING]"]
        distinguishing_aspect: "A second decision on an already APPROVED authorization is rejected ERR_AUTH_NOT_PENDING (idempotency of the decision action)."
        test_recipe:
          setup: ["Authorization APPROVED"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-02", full_name: "Pat Sm Two", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
          trigger:
            - call: "POST /authorizations/${a1}/decision"
              payload: { outcome: "DENIED" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_AUTH_NOT_PENDING"
            - "InsuranceAuthorization.${a1}.status remains APPROVED; ReferralOrder.${o1}.status remains AUTHORIZED"

      - name: sign_by_non_author_forbidden
        claim_type: precondition_enforcement
        grounds: [state_machines.InterpretationReport.DRAFT_to_SIGNED, "errors[ERR_NOT_REPORT_AUTHOR]"]
        distinguishing_aspect: "Sign by a different physician than report.physician_id is rejected ERR_NOT_REPORT_AUTHOR (403)."
        test_recipe:
          setup: ["HST study SCORED; report DRAFT authored by physician DR1; second physician DR2 exists"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-03", full_name: "Pat Sm Three", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer One", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc Two", npi: "NPI-P2" }, as: LabDirector, captures: { dr2: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 20, central_apneas: 0, mixed_apneas: 0, hypopneas: 20, reras: 0, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /sleep-studies/${st1}", payload: {}, as: LabDirector, captures: { st1_v: $.data.version } }
            - { call: "POST /interpretation-reports", payload: { study_id: "${st1}", primary_scoring_task_id: "${tk1}", diagnosis_code: "G47.33", expected_sleep_study_version: "${st1_v}" }, as: InterpretingPhysician, as_user_id: "${dr1}", captures: { r1: $.data.id } }
          trigger:
            - call: "POST /interpretation-reports/${r1}/sign"
              payload: {}
              as: InterpretingPhysician
              as_user_id: "${dr2}"
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_NOT_REPORT_AUTHOR"
            - "InterpretationReport.${r1}.status remains DRAFT and signed_at is null"

      - name: scorer_cannot_start_others_task
        claim_type: precondition_enforcement
        grounds: [state_machines.ScoringTask.ASSIGNED_to_IN_PROGRESS, "errors[ERR_NOT_TASK_OWNER]"]
        distinguishing_aspect: "Start with X-User-ID of a different scorer is rejected ERR_NOT_TASK_OWNER (403)."
        test_recipe:
          setup: ["HST study SCORING_QUEUED with PRIMARY task assigned to scorer S1; scorer S2 exists"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-04", full_name: "Pat Sm Four", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer One", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Two", credential: "RST", npi: "NPI-S2" }, as: LabDirector, captures: { s2: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
          trigger:
            - call: "POST /scoring-tasks/${tk1}/start"
              payload: {}
              as: Scorer
              as_user_id: "${s2}"
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_NOT_TASK_OWNER"
            - "ScoringTask.${tk1}.status remains ASSIGNED"

      - name: no_show_twice_triggers_provider_review_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.SleepStudy.SCHEDULED_to_NO_SHOW, state_machines.ReferralOrder.SCHEDULED_to_NEEDS_PROVIDER_REVIEW, state_machines.ReferralOrder.NEEDS_PROVIDER_REVIEW_to_AUTHORIZED]
        distinguishing_aspect: "First no-show: order returns to AUTHORIZED with no_show_count 1; second no-show: count 2 flips order to NEEDS_PROVIDER_REVIEW; provider-review REINSTATE restores AUTHORIZED and resets count to 0."
        test_recipe:
          setup: ["HST order with approved_nights 2, AUTHORIZED"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-05", full_name: "Pat Sm Five", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 2, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
          trigger:
            - { call: "POST /sleep-studies/${st1}/no-show", payload: {}, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-02" }, as: Scheduler, captures: { st2: $.data.id } }
            - { call: "POST /sleep-studies/${st2}/no-show", payload: {}, as: Scheduler }
            - { call: "POST /referral-orders/${o1}/provider-review", payload: { action: "REINSTATE" }, as: Scheduler }
            - { call: "GET /referral-orders/${o1}", payload: {}, as: Scheduler }
          assert:
            - "After first no-show: order.status == AUTHORIZED and no_show_count == 1"
            - "Second study ${st2} created 201 (order re-schedulable)"
            - "After second no-show: order.status == NEEDS_PROVIDER_REVIEW and no_show_count == 2"
            - "After REINSTATE: ReferralOrder.${o1}.status == AUTHORIZED and no_show_count == 0"

      - name: rescore_on_unscored_study_rejected
        claim_type: guarded_transition
        grounds: ["errors[ERR_STUDY_NOT_SCORABLE]", entities.ScoringTask.fields.assignment_kind]
        distinguishing_aspect: "RELIABILITY_RESCORE creation on a study not yet SCORED (no ACCEPTED PRIMARY exists) is rejected ERR_STUDY_NOT_SCORABLE."
        test_recipe:
          setup: ["HST study SCORING_QUEUED; pool scorer S2 exists; no scoring tasks yet"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-SM-06", full_name: "Pat Sm Six", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Two", credential: "RST", npi: "NPI-S2", reliability_pool: true }, as: LabDirector, captures: { s2: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
