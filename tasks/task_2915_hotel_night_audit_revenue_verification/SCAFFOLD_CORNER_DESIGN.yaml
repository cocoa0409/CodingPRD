              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_id}", business_date_id: "${bd1_id}", requested_amount: 200.00, reason_code: "MAINTENANCE_ISSUE", narrative: "Air handler failure." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { allowance_id: "$.data.id" }
            - call: "POST /night-audit/allowances/${allowance_id}/submit"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_v: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller"], expected_business_date_version: "${bd_v}", pace_basis: "CALENDAR_ALIGNED" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { report_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${report_id}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
          trigger: "POST /night-audit/allowances/${allowance_id}/approve with approved_amount 200.00 as NightAuditor (X-User-ID u_na_1), whose tier matches the allowance's required_approval_role."
          assert:
            - "The approve response itself already reads status == \"POSTED\", approved_amount == 200.00, approved_by_user_id == \"u_na_1\" and a non-null approved_at - no separate confirmation step exists."
            - "An immediate GET /night-audit/journal-postings?allowance_id=${allowance_id} returns exactly 1 row with charge_type ALLOWANCE and amount -200.00; there is no window in which the allowance is POSTED but its line is absent."
