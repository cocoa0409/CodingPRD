            - "Parcel.${parcel_id}.contained_line_ids has exactly 2 entries, one per event, and vendor_shipment_count == 2 because each event's line arrived on its own shipment"
            - "the fast event's 5-day quote does not shorten the ETA: the parcel's ETA is governed by the maximum over the contained lines"

