            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 1 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ciB_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ciB_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { caseB_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${caseB_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { cB_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${caseB_id}/assign"
              payload: { expected_case_version: "${cB_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/moderation-cases/${caseB_id}/decide"
              payload: { outcome: "WARN" }
              as: Reviewer
              as_user_id: "${r1_id}"
              captures: { pts_b: $.data.strike_points_applied }
            - call: "POST /moderation/appeals"
              payload: { case_id: "${caseA_id}", grounds_text: "Not a credible threat" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { apA_id: $.data.id }
            - call: "POST /moderation/appeals/${apA_id}/assign-reviewer"
              payload: { target_reviewer_id: "${r2_id}" }
              as: QAAuditor
              as_user_id: "${qa_id}"
          trigger:
            - call: "POST /moderation/appeals/${apA_id}/resolve"
              payload: { resolution: "OVERTURNED", resolution_note: "Rhetorical, not a threat" }
              as: Reviewer
              as_user_id: "${r2_id}"
          assert:
            - "the pre-state was ${pts_a} == 4 and ${pts_b} == 2 for a ledger of exactly 6 with standing SUSPENDED"
            - "invariant restored — Account.${acct_id}.strike_points == 2, the full sum over surviving decided cases (case B only), not 6 minus a remembered delta"
            - "Account.${acct_id}.standing == GOOD_STANDING (2 <= 2), having crossed both the SUSPENDED and LIMITED breakpoints in one recompute"
            - "Account.${acct_id}.lifetime_removed_count == 0 and appeal_credits_remaining == 3 (the filing debit is refunded)"
            - "ModerationCase.${caseA_id}.is_overturned == true while its stored strike_points_applied stays 4 — the case record is not rewritten, it is only excluded"
            - "ModerationCase.${caseB_id}.is_overturned == false and strike_points_applied == 2, unchanged"
            - "ContentItem.${ciA_id}.visibility_status == REINSTATED, reinstated_at == 2026-08-01T09:00:00Z, review_status == CLEAR"
            - "ContentItem.${ciB_id}.visibility_status == LIVE and review_status == ACTIONED (the WARN case is untouched)"
            - "Reviewer.${r1_id}.appealed_count == 1, upheld_appeal_count == 0, accuracy_score_audit_only == null, accuracy_score_blended == 0.0000, status == ACTIVE because the gate sample is 1 < MIN_GATE_SAMPLE 2"
            - "ReviewQueue.${q_id}.open_case_count == 0 and unassigned_case_count == 0"
