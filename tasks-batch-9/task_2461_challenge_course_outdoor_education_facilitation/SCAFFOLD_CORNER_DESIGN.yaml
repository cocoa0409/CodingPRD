              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/incidents"
              payload: { course_id: "${course_id}", reported_by_facilitator_id: "${f1_id}", occurred_at: "2026-08-10T09:15:00Z", severity: "MINOR", narrative: "Rope burn on the left palm, treated with first aid", ems_activated: false }
              as: Facilitator
              as_user_id: "${f1_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /challenge-course/incidents/${inc_id}/review"
              payload: {}
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "POST /challenge-course/incidents/${inc_id}/close"
              payload: { disposition: "CLOSED_NO_ACTION" }
