      - name: image_pixel_long_edge_exactly_at_standard_minimum_accepted
        grounds:
          - validations[priority=33]
          - errors[ERR_IMAGE_STANDARD_VIOLATION]
          - entities.ArtworkImage.fields.pixel_long_edge
          - entities.ArtworkImage.fields.file_bytes
          - entities.Artwork.fields.primary_image_count
        distinguishing_aspect: |
          Four-point boundary on the digital submission standard: 1200 long edge / 800 short edge /
          8388608 bytes are all exactly at their inclusive limits and are accepted, while 1199, 799
          and 8388609 are each rejected one unit outside — the standard uses >= and <=, not > and <.
