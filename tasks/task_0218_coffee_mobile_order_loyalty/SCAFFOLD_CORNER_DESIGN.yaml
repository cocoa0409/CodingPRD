# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Coffee Shop Mobile Order & Loyalty — breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Member.fields.email", "entities.Member.fields.star_balance", "entities.Member.fields.tier"]
        distinguishing_aspect: "POST /members with email/full_name/birth_month_day -> 201; star_balance 0, lifetime_stars 0, tier GREEN, status ACTIVE, version 1 system-set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { email: "new@x.com", full_name: "New", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id, sb: $.data.star_balance, tr: $.data.tier } }
          assert:
            - "Response status == 201"
            - "Member.star_balance == 0 and Member.lifetime_stars == 0"
            - "Member.tier == GREEN and Member.status == ACTIVE and Member.version == 1"

      - name: register_auto_creates_card
        claim_type: Creation
        grounds: ["entities.StoredValueCard.fields.member_id", "entities.StoredValueCard.fields.balance_cents"]
        distinguishing_aspect: "After POST /members, GET /members/{id}/card returns exactly one card with balance_cents 0 and auto_reload_enabled false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "card@x.com", full_name: "Card", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "GET /members/${mid}/card", payload: {}, as: Member, as_user_id: "${mid}", captures: { bal: "$.data[0].balance_cents" } }
          assert:
            - "data is an array of length 1"
            - "StoredValueCard.balance_cents == 0 and auto_reload_enabled == false"

      - name: get_member_nonexistent_returns_404
        claim_type: Not Found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /members/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_order_missing_required_store_id_returns_400
        claim_type: Required Fields
        grounds: ["entities.Order.fields.store_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members/{id}/orders without store_id -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Member and a pickup slot exist."]
          setup_api_calls:
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "rf@x.com", full_name: "RF", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/orders", payload: { pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_unknown_store_id_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Order.fields.store_id", "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /members/{id}/orders with a non-existent store_id -> 404 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["Member, a store, and a slot exist; body references a bogus store_id."]
          setup_api_calls:
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "ref@x.com", full_name: "Ref", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/orders", payload: { store_id: "11111111-1111-4111-8111-111111111111", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 404 and data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: menu_item_reward_eligible_default_true
        claim_type: Defaults
        grounds: ["entities.MenuItem.fields.reward_eligible"]
        distinguishing_aspect: "POST menu-item without reward_eligible -> stored reward_eligible == true (default) and available == true."
        test_recipe:
          setup: ["A store exists."]
          setup_api_calls:
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
          trigger:
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Drip", base_price_cents: 295, category: "BEVERAGE" }, as: PlatformAdmin, captures: { mi: $.data.id, re: $.data.reward_eligible, av: $.data.available } }
          assert:
            - "MenuItem.reward_eligible == true and MenuItem.available == true"

      - name: line_pricing_computed_field_correct
        claim_type: Computed Fields
        grounds: ["calculations.line_pricing", "entities.OrderLine.fields.unit_price_cents", "entities.OrderLine.fields.line_total_cents"]
        distinguishing_aspect: "Line of latte 545c + oat 70c modifier, qty 2 -> unit_price_cents 615, line_total_cents 1230."
        test_recipe:
          setup: ["Clock set; store, latte 545c with oat 70c modifier, member, slot, CART order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 545, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /menu-items/${latte_id}/modifiers", payload: { group_code: "MILK", name: "Oat", price_delta_cents: 70 }, as: PlatformAdmin, captures: { oat_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "lp@x.com", full_name: "LP", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 2, modifiers: [{ modifier_option_id: "${oat_id}", count: 1 }] }, as: Member, as_user_id: "${mid}", captures: { up: $.data.unit_price_cents, lt: $.data.line_total_cents } }
          assert:
            - "OrderLine.unit_price_cents == 615 and OrderLine.line_total_cents == 1230"

      - name: add_line_modifier_not_belonging_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.OrderLine.fields.modifiers", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A line referencing a modifier_option_id belonging to a different menu item -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock set; two menu items, modifier on item B, CART order; line references item A with item B's modifier."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "ItemA", base_price_cents: 400, category: "BEVERAGE" }, as: PlatformAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "ItemB", base_price_cents: 500, category: "BEVERAGE" }, as: PlatformAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /menu-items/${b_id}/modifiers", payload: { group_code: "SHOT", name: "Extra", price_delta_cents: 90 }, as: PlatformAdmin, captures: { bmod_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "mm@x.com", full_name: "MM", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${a_id}", quantity: 1, modifiers: [{ modifier_option_id: "${bmod_id}", count: 1 }] }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: store_id_immutable_on_walltxn_event_log
        claim_type: Immutability
        grounds: ["entities.WalletTransaction", "entities.WalletTransaction.fields.kind"]
        distinguishing_aspect: "WalletTransaction is common_fields:false (no version field); a RELOAD transaction has kind RELOAD and amount_cents == +reload amount, immutable."
        test_recipe:
          setup: ["Member exists; reload 1500c onto card."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "imm@x.com", full_name: "Imm", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/card/reload", payload: { amount_cents: 1500 }, as: Member, as_user_id: "${mid}", captures: { txk: $.data.kind, txa: $.data.amount_cents } }
          assert:
            - "WalletTransaction.kind == RELOAD and WalletTransaction.amount_cents == 1500"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: start_prep_from_cart_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Order.PLACED_to_IN_PREP", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-prep on an order still in CART (never placed) -> 409 ERR_INVALID_STATE; fulfillment_status stays CART."
        test_recipe:
          setup: ["Clock set; store, latte, member, a CART order with one line (unpaid, unplaced)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "is@x.com", full_name: "IS", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /stores/${store_id}/orders/${oid}/start-prep", payload: {}, as: StoreOperator, captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Order.${oid}.fulfillment_status == CART"

      - name: place_unpaid_order_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.CART_to_PLACED", "entities.Order.fields.payment_status", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "place on a CART order whose payment_status is UNPAID -> 409 ERR_INVALID_STATE (payment must be captured before placing)."
        test_recipe:
          setup: ["Clock set; store, latte, member, CART order with a line, not paid."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "pu@x.com", full_name: "PU", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: double_pay_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Order.UNPAID_to_PAID", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an already-PAID order a second time -> 409 ERR_INVALID_STATE (no second EARN, no double spend)."
        test_recipe:
          setup: ["Clock set; member, store, latte; order paid once already."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "dp@x.com", full_name: "DP", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Order.${oid}.stars_earned == 6 (unchanged, no second EARN)"

      - name: refund_picked_up_order_returns_refund_not_allowed
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Refund.(none)_to_SETTLED", "validations[priority=15]", "errors[ERR_REFUND_NOT_ALLOWED]"]
        distinguishing_aspect: "Refund on an order already PICKED_UP -> 409 ERR_REFUND_NOT_ALLOWED; payment_status stays PAID."
        test_recipe:
          setup: ["Clock set; order fully completed (PICKED_UP, PAID)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "rp@x.com", full_name: "RP", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders/${oid}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /stores/${store_id}/orders/${oid}/start-prep", payload: {}, as: StoreOperator }
            - { call: "POST /stores/${store_id}/orders/${oid}/ready", payload: {}, as: StoreOperator }
            - { call: "POST /stores/${store_id}/orders/${oid}/complete", payload: {}, as: StoreOperator }
          trigger:
            - { call: "POST /stores/${store_id}/orders/${oid}/refund", payload: { destination: "ORIGINAL_METHOD" }, as: StoreOperator, captures: { err: $.data.error_id } }
          assert:
            - "Response status == 409 and data.error_id == ERR_REFUND_NOT_ALLOWED"
            - "Order.${oid}.payment_status == PAID"

      - name: order_initial_state_cart_unpaid
        claim_type: Initial State
        grounds: ["state_machines.Order.CART_to_PLACED", "entities.Order.fields.fulfillment_status", "entities.Order.fields.payment_status"]
        distinguishing_aspect: "A freshly created order has fulfillment_status CART and payment_status UNPAID with zeroed money fields."
        test_recipe:
          setup: ["Clock set; store, slot, member."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "in@x.com", full_name: "IN", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status } }
          assert:
            - "Order.fulfillment_status == CART and Order.payment_status == UNPAID"
            - "Order.subtotal_cents == 0 and Order.total_cents == 0"

      - name: member_close_blocked_by_inflight_order
        claim_type: guarded transitions
        grounds: ["state_machines.Member.ACTIVE_to_CLOSED", "entities.Order.fields.fulfillment_status", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a member who owns a PLACED order -> 409 ERR_INVALID_STATE; member stays ACTIVE."
        test_recipe:
          setup: ["Clock set; member with a PLACED order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /members", payload: { email: "cl@x.com", full_name: "CL", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders/${oid}/place", payload: { expected_slot_version: "${slot_v}" }, as: Member, as_user_id: "${mid}" }
          trigger:
