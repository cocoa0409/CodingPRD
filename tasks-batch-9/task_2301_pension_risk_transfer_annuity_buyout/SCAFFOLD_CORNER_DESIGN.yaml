            - call: "POST /prt/participants/${pa_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /prt/participants/${pa_id}/benefit-audits"
              payload: { expected_participant_version: "${pa_v}" }
