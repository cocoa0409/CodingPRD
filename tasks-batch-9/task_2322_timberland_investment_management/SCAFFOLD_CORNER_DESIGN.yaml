      - name: the_acquire_response_already_shows_the_closed_position
        claim_type: immediate
        grounds:
          - "consistency_model: immediate"
          - "endpoints[POST /timberland/properties/{id}/acquire]"
          - "state_machines.Property.PROSPECT_to_OWNED"
          - "entities.Fund.fields.cash_balance_usd"
