scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_weighted_vs_flat_divergence
        grounds:
          - calculations.capital_credit_allocation_shares
          - entities.CapitalCreditAllocation.fields.method
        distinguishing_aspect: |
          Same pool and same member set produce different per-member shares
          depending on method: PATRONAGE_WEIGHTED is kWh-weighted while
          FLAT_PER_MEMBER is equal-division — a divergence on the
          CapitalCreditAllocation entity domain.
        test_recipe:
          setup:
            - "Cooperative with capital_credits_pool_cents == 100001 for fiscal year 2025"
            - "Three ACTIVE members: A (patronage_base_kwh=100), B (300), C (600), all created in order A,B,C"
            - "No irrigation usage"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST", "PRO_RATA_PERCENTAGE"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 100001 }
              as: MemberServicesRep
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_a: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "B", member_type: "RESIDENTIAL", district_id: 2 }
              as: MemberServicesRep
              captures: { m_b: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "C", member_type: "RESIDENTIAL", district_id: 3 }
              as: MemberServicesRep
              captures: { m_c: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1 A Rd", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_a: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_b}", address: "2 B Rd", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_b: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_c}", address: "3 C Rd", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_c: $.data.id }
            - call: "POST /coop/members/${m_a}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_b}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_c}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 100, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_b}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_b}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 300, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_c}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_c}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 600, demand_kw: 1.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_a}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_a: $.data.id }
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_b}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_b: $.data.id }
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_c}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_c: $.data.id }
            - call: "POST /coop/invoices/${inv_a}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/invoices/${inv_b}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/invoices/${inv_c}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "PATRONAGE_WEIGHTED" }
              as: MemberServicesRep
              captures: { alloc_w: $.data.id }
            - call: "GET /coop/capital-credit-allocations/${alloc_w}/lines"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              captures: { alloc_f: $.data.id }
            - call: "GET /coop/capital-credit-allocations/${alloc_f}/lines"
              payload: {}
              as: MemberServicesRep
          assert:
            - "PATRONAGE_WEIGHTED lines: A=10000, B=30000, C=60001 cents (weighted, remainder cent to largest fractional part)"
            - "FLAT_PER_MEMBER lines: A=33334, B=33334, C=33333 cents (floor(100001/3)=33333 each, remainder 2 cents distributed one at a time by created_at ASC to A then B)"
            - "The two methods disagree on every member's allocated_cents for identical pool and membership"

      - name: invoice_provisional_vs_final_divergence
        grounds:
          - calculations.provisional_vs_final_invoice_delta
          - entities.Invoice.fields.variant
        distinguishing_aspect: |
          The same billing period produces a different total_due_cents under the
          PROVISIONAL (forward-looking, prior-3-average estimate) variant than
          under the FINAL (register-true chronological delta) variant — a
          divergence on the Invoice entity domain, distinct from the allocation
          domain.
        test_recipe:
          setup:
            - "Cooperative, one ACTIVE member with a RESIDENTIAL ServiceLocation"
            - "PUBLISHED RateSchedule RS-1 for RESIDENTIAL with customer_charge 2000, tiers [{1000,12},{null,9}], demand 0, irrigation discount 0, lm credit 0"
            - "Register readings 1000 kwh at period start and 2500 kwh at period end (1500 kwh delta)"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "9 Farm Rd", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-1", rate_class: "RESIDENTIAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: 1000, cents_per_kwh: 12}, {up_to_kwh: null, cents_per_kwh: 9}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-07-01T00:00:00Z", kwh_register: 1000, demand_kw: 2.0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-08-01T00:00:00Z", kwh_register: 2500, demand_kw: 2.5, source: "AMR" }
              as: BillingClerk
          trigger:
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id, prov_total: $.data.total_due_cents, prov_variant: $.data.variant }
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { final_total: $.data.total_due_cents, final_variant: $.data.variant }
          assert:
            - "Provisional invoice variant == PROVISIONAL"
            - "After finalize, variant == FINAL and kwh_billed == 1500 (register delta 2500-1000)"
            - "final_total == 2000 + 1000*12 + 500*9 = 18500 cents"
            - "provisional estimate (prior-average based) != final register-true total"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: atc_multifactor_overhead_threshold
        grounds:
          - calculations.aid_to_construction_estimate
          - entities.ServiceOrder.fields.aid_to_construction_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (distance_ft, requires_road_bore, order_type) with
          non-linear interaction — a flat bore adder, a TEMPORARY minimum clamp,
          a free-allowance subtraction, and a conditional 10% overhead that only
          applies above a threshold.
        test_recipe:
          setup:
            - "Cooperative exists; one ACTIVE member with a PENDING_CONSTRUCTION RESIDENTIAL location"
            - "ServiceOrder NEW_SERVICE with distance_ft=400, requires_road_bore=true"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1 Ln", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/service-orders"
              payload: { service_location_id: "${loc_id}", order_type: "NEW_SERVICE", distance_ft: 400, requires_road_bore: true }
              as: MemberServicesRep
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /coop/service-orders/${so_id}/estimate"
              payload: {}
              as: FieldOpsCoordinator
              captures: { atc: $.data.aid_to_construction_cents }
          assert:
            - "ServiceOrder.${so_id}.aid_to_construction_cents == 343000 (base 630000 = 400*1200 + 150000 bore; allowance 300000; excess 330000; overhead 10% of 130000 = 13000; 330000+13000=343000)"

      - name: tiered_energy_charge_rounding_order
        grounds:
          - calculations.tiered_energy_charge
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          per-tier-line rounding HALF_UP then sum, which differs from sum-then-round
          whenever fractional cents arise (e.g. odd kwh at fractional-cent rates).
        test_recipe:
          setup:
            - "Cooperative; ACTIVE member with COMMERCIAL_GENERAL location"
            - "PUBLISHED schedule CG-X with tiers [{up_to 1 kwh, 7.5 c/kwh}, {null, 0.5 c/kwh}], customer_charge 0"
            - "Meter readings produce kwh_billed == 2"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "Biz", member_type: "COMMERCIAL", district_id: 2 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "5 Main", rate_class: "COMMERCIAL_GENERAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "CG-X", rate_class: "COMMERCIAL_GENERAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 0, tiers: [{up_to_kwh: 1, cents_per_kwh: 7.5}, {up_to_kwh: null, cents_per_kwh: 0.5}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-07-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-08-01T00:00:00Z", kwh_register: 2, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { energy: $.data.energy_charge_cents, total: $.data.total_due_cents }
          assert:
            - "Invoice.${inv_id}.energy_charge_cents == 9 (pinned per-line HALF_UP then sum: line1 round(1*7.5)=8, line2 round(1*0.5)=1, 8+1=9; the sum-then-round order would give round(8.0)=8 — the two orders disagree, and the scaffold pins per-line)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: right_of_way_contest_consent_cycle
        grounds:
          - state_machines.RightOfWayAgreement
        distinguishing_aspect: |
          RightOfWayAgreement exhibits a cycle REQUESTED -> CONTESTED ->
          MEMBER_CONSENTED -> RECORDED: the CONTESTED state loops back to
          MEMBER_CONSENTED, a non-linear revision loop on the ROW entity.
        test_recipe:
          setup:
            - "Cooperative; ACTIVE member M with a PENDING_CONSTRUCTION location and a RightOfWayAgreement in REQUESTED"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1 Ln", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/right-of-way-agreements"
              payload: { service_location_id: "${loc_id}", easement_width_ft: 30 }
              as: FieldOpsCoordinator
              captures: { row_id: $.data.id }
          trigger:
            - call: "POST /coop/right-of-way-agreements/${row_id}/contest"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/right-of-way-agreements/${row_id}/record"
              payload: {}
              as: FieldOpsCoordinator
              captures: { row_status: $.data.status }
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "RightOfWayAgreement.${row_id}.status == RECORDED after the contest->consent loop"
            - "The post-RECORDED consent returns error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: member_suspend_reinstate_cycle
        grounds:
          - state_machines.Member
        distinguishing_aspect: |
          Member exhibits a cycle ACTIVE -> SUSPENDED -> ACTIVE (and onward to
          TERMINATED), a non-linear loop distinct from the ROW entity's loop.
        test_recipe:
          setup:
            - "Cooperative; ACTIVE member with one location, no PROVISIONAL invoices, no unpaid FINALIZED invoices"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1 Ln", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /coop/members/${m_id}/suspend"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/reinstate"
              payload: {}
              as: MemberServicesRep
              captures: { status_after: $.data.status }
          assert:
            - "Member.${m_id}.status == ACTIVE after suspend->reinstate loop"
            - "Member.version has incremented twice since activation"

  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3 / >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: member_terminate_full_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_TERMINATED
          - state_machines.ServiceLocation
          - state_machines.LoadManagementDevice
        distinguishing_aspect: |
          Depth-3 cascade originating at Member terminate: Member ->
          ServiceLocation (DISCONNECTED) -> LoadManagementDevice (UNENROLLED),
          where the location's own disconnect would itself suspend devices —
          here termination forces the deeper UNENROLLED terminal form.
        test_recipe:
          setup:
            - "ACTIVE member with ENERGIZED location and an ACTIVE WATER_HEATER device, all invoices paid"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1 Ln", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/service-orders"
              payload: { service_location_id: "${loc_id}", order_type: "NEW_SERVICE", distance_ft: 100, requires_road_bore: false }
              as: MemberServicesRep
              captures: { so_id: $.data.id }
            - call: "POST /coop/service-orders/${so_id}/estimate"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/right-of-way-agreements"
              payload: { service_location_id: "${loc_id}", easement_width_ft: 30 }
              as: FieldOpsCoordinator
              captures: { row_id: $.data.id }
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/right-of-way-agreements/${row_id}/record"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-orders/${so_id}/mark-paid"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/service-orders/${so_id}/schedule"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-orders/${so_id}/construct"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-locations/${loc_id}/energize"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/load-management-devices"
              payload: { service_location_id: "${loc_id}", device_type: "WATER_HEATER" }
              as: MemberServicesRep
              captures: { lmd_id: $.data.id }
            - call: "POST /coop/load-management-devices/${lmd_id}/activate"
              payload: {}
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /coop/members/${m_id}/terminate"
              payload: {}
              as: MemberServicesRep
          assert:
            - "Member.${m_id}.status == TERMINATED"
            - "ServiceLocation.${loc_id}.status == DISCONNECTED"
            - "LoadManagementDevice.${lmd_id}.status == UNENROLLED"

      - name: outage_restore_duplicate_cascade
        grounds:
          - state_machines.OutageReport.CREW_DISPATCHED_to_RESTORED
        distinguishing_aspect: |
          Depth-2 cascade originating at outage restore: restoring the parent
          OutageReport propagates RESTORED to every DUPLICATE child folded into
          it — a different trigger than member terminate.
        test_recipe:
          setup:
            - "Parent outage REPORTED -> ACKNOWLEDGED -> CREW_DISPATCHED; a second report marked DUPLICATE with parent_outage_id == parent"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M1", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m1}", address: "1 A", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc1: $.data.id }
            - call: "POST /coop/members/${m1}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/outage-reports"
              payload: { service_location_id: "${loc1}", cause: "WEATHER" }
              as: Member
              as_user_id: "${m1}"
              captures: { out_parent: $.data.id }
            - call: "POST /coop/outage-reports/${out_parent}/acknowledge"
              payload: {}
              as: Dispatcher
            - call: "POST /coop/outage-reports/${out_parent}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /coop/outage-reports"
              payload: { service_location_id: "${loc1}", cause: "WEATHER" }
              as: Member
              as_user_id: "${m1}"
              captures: { out_dup: $.data.id }
            - call: "POST /coop/outage-reports/${out_dup}/mark-duplicate"
              payload: { parent_outage_id: "${out_parent}" }
              as: Dispatcher
          trigger:
            - call: "POST /coop/outage-reports/${out_parent}/restore"
              payload: {}
              as: FieldOpsCoordinator
          assert:
            - "OutageReport.${out_parent}.status == RESTORED"
            - "OutageReport.${out_dup}.status == RESTORED (cascaded from parent)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_allocation_approve
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ALLOCATION_POOL_MISMATCH]
        distinguishing_aspect: |
          Pair state vs business_fiscal: approving an allocation that is BOTH in
          the wrong state (already APPROVED) AND whose total mismatches the pool
          must surface the state error first (priority 5 beats 9).
        test_recipe:
          setup:
            - "Cooperative pool=100001; one ACTIVE member A with 100 kwh billed in 2025; allocation approved while pool matched, then pool topped up by +1 so it no longer matches the approved total"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_a: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1 A", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_a: $.data.id }
            - call: "POST /coop/members/${m_a}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 100, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_a}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_a: $.data.id }
            - call: "POST /coop/invoices/${inv_a}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 100001 }
              as: MemberServicesRep
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              captures: { alloc_id: $.data.id }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 1 }
              as: MemberServicesRep
          trigger:
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 wins over business_fiscal priority 9 even though the approved total 100001 no longer matches the current pool 100002)"

      - name: referential_vs_state_on_row_consent
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair business_referential vs state: a non-owner Member attempting
          consent on an agreement that is also already RECORDED must surface
          the ownership error (priority 4) before the state error (priority 5).
        test_recipe:
          setup:
            - "ROW agreement for member M1's location already RECORDED; a second member M2 attempts consent"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M1", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M2", member_type: "RESIDENTIAL", district_id: 2 }
              as: MemberServicesRep
              captures: { m2: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m1}", address: "1 A", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc1: $.data.id }
            - call: "POST /coop/members/${m1}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m2}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/right-of-way-agreements"
              payload: { service_location_id: "${loc1}", easement_width_ft: 30 }
              as: FieldOpsCoordinator
              captures: { row_id: $.data.id }
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /coop/right-of-way-agreements/${row_id}/record"
              payload: {}
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /coop/right-of-way-agreements/${row_id}/consent"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (business_referential priority 4 wins over state priority 5)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_at_threshold
        grounds:
          - calculations.quorum_check
          - state_machines.BoardElection
        distinguishing_aspect: |
          Numeric threshold boundary on quorum: with exactly 1 ACTIVE member and
          quorum_pct 0.05, quorum requires ceil(0.05*1)=1 distinct ballot;
          exactly 1 ballot meets it (>= boundary) while 0 ballots fails. Tests
          >= vs > on the quorum metric via the close-voting endpoint.
        test_recipe:
          setup:
            - "Cooperative quorum_pct=0.05; exactly 1 ACTIVE member; election VOTING_OPEN within window"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M01", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m1}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/members/${m1}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: ["Cand A"] }
              as: BoardSecretary
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: BoardSecretary
              captures: { coop_v: $.data.version }
            - call: "POST /coop/board-elections/${el_id}/open-voting"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardSecretary
            - call: "POST /coop/ballots"
              payload: { election_id: "${el_id}", district: 1, candidate_name: "Cand A", is_proxy: false }
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/board-elections/${el_id}/close-voting"
              payload: {}
              as: BoardSecretary
              captures: { quorum_met: $.data.quorum_met }
          assert:
            - "BoardElection.${el_id}.quorum_met == true with exactly 1 distinct ballot cast (>= boundary: 1 >= ceil(0.05*1)=1)"

      - name: write_off_exactly_180_days
        grounds:
          - state_machines.Invoice.FINALIZED_to_WRITTEN_OFF
          - errors[ERR_WRITE_OFF_TOO_EARLY]
        distinguishing_aspect: |
          Temporal boundary on write-off age: at exactly 180 days past
          billing_period_end the write-off is allowed (more than 180 required?
          scaffold pins 'more than 180 days' as strictly greater) — tested via
          the write-off endpoint with the logical clock at 179 vs 181 days.
        test_recipe:
          setup:
            - "FINALIZED invoice with billing_period_end 2026-02-01; logical clock set to 2026-07-30 (179 days) then 2026-08-01 (181 days)"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-1", rate_class: "RESIDENTIAL", effective_from: "2025-01-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: 1000, cents_per_kwh: 12}, {up_to_kwh: null, cents_per_kwh: 9}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_id: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_id}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_id}", reading_at: "2026-02-01T00:00:00Z", kwh_register: 100, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_id}", billing_period_start: "2026-01-01T00:00:00Z", billing_period_end: "2026-02-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /coop/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coop/invoices/${inv_id}/write-off"
              payload: {}
              as: BillingClerk
              captures: { err_early: $.data.error_id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/invoices/${inv_id}/write-off"
              payload: {}
              as: BillingClerk
              captures: { status_after: $.data.status }
          assert:
            - "At 179 days past period end, write-off rejected with ERR_WRITE_OFF_TOO_EARLY"
            - "At 181 days past period end, write-off succeeds and status == WRITTEN_OFF (boundary is strictly greater than 180 days)"

  # ===========================================================================
