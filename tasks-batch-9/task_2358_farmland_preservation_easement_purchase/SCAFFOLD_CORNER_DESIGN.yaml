        distinguishing_aspect: "Two parcels differ only in their 24 statewide-important acres: 120 prime of 160 acres alone scores 75.00, and adding the 24 important acres scores 84.00 — a gain of exactly 9.00 points = 100 * 0.6 * (24/160), which pins IMPORTANT_SOIL_WEIGHT at 0.6 rather than 0.5 or 1.0."
        test_recipe:
          setup:
