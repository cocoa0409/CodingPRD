  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict (>=2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.HomeAssessment.MEASURED_to_APPROVED
        distinguishing_aspect: |
          Category pair: state (priority 4) vs business_safety (priority 5).
          An approve call on a SCHEDULED (not MEASURED) assessment that ALSO fails
          stair-width safety must yield ERR_INVALID_STATE (state, higher priority),
          not ERR_STAIR_TOO_NARROW. Lower-priority safety error is masked.
        test_recipe:
          setup:
            - "HomeAssessment A1 in SCHEDULED state (never measured)"
            - " stair_width_mm would fail model minimum if it were measured"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 900, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Conflict Chris", date_of_birth: "1953-06-06", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-05" }
              as: Assessor
              captures: { assess_id: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 masks business_safety priority 5)"
            - "HomeAssessment.${assess_id}.status == SCHEDULED (unchanged)"

