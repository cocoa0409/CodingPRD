scenario: "770. Food-Hall & Shared-Vendor Management: stall/vendor lease & license, shared POS & order-routing, common-area & seating capacity, rent (base + % of sales) & settlement, marketing/event & footfall, health-permit & inspection, hours/availability, vendor onboarding/turnover。以 Expert 难度进行设计。"
domain_name: food-hall-vendor-mgmt
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (FoodHall, Vendor, Stall, Lease, ...) linked by explicit FK
  # fields carried in request bodies; no deep URL nesting except the two
  # sub-resource reverse-reachability GETs on Stall.

  state_machine_shape: branching
  # Vendor / Order / Inspection / MarketingEvent fork on outcome; Lease carries
  # an ACTIVE->ACTIVE renewal self-loop; Settlement has a dispute revert and a
  # supersede branch. HealthPermit is driven ISSUED<->SUSPENDED by inspection
  # cascade (a cycle). Not a single linear pipeline anywhere.

  relationship_patterns:
    - one_to_many          # FoodHall -> Stall/Order/Seating/Event; Stall -> Lease/Permit/Inspection
    - cross_aggregate      # Order routing reads Stall posture; Lease activation reads HealthPermit

  role_model: peer_roles
  # HallManager owns halls/stalls/leases/settlements/events; Vendor owns order
  # acceptance + settlement dispute on its own stalls; HealthInspector owns
  # permits/inspections; POSOperator owns orders + seating. Non-overlapping
  # resource ownership.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FoodHall
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the food hall venue.
      - name: total_seating_capacity
        type: integer
        source: input
        description: Total shared seats in the common seating area.
        constraints: ">= 1"
      - name: common_area_capacity
        type: integer
        source: input
        description: Max standing/event occupancy of the common area (used by MarketingEvent).
        constraints: ">= 1"
      - name: hall_open_minutes
        type: integer
        source: input
        description: Venue opening time as minutes-from-UTC-midnight (0..1439).
        constraints: "0 <= hall_open_minutes < hall_close_minutes <= 1440"
      - name: hall_close_minutes
        type: integer
        source: input
        description: Venue closing time as minutes-from-UTC-midnight (1..1440).
        constraints: "hall_open_minutes < hall_close_minutes <= 1440"
      - name: event_buffer_minutes
        type: integer
        source: input
        description: Mandatory setup/teardown gap required between two scheduled MarketingEvents on this hall's common area.
        default: 60
        constraints: ">= 0"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal business name of the vendor operator.
      - name: contact_email
        type: string
        source: input
        description: Primary contact email.
      - name: status
        type: enum
        source: system
        description: Onboarding/turnover lifecycle state.
        default: APPLIED
        constraints: "one of {APPLIED, ACTIVE, SUSPENDED}"

  - name: Stall
    parent: null
    common_fields: true
    fields:
      - name: food_hall_id
        type: string
        source: input
        description: "FK -> FoodHall.id; the hall this stall physically sits in."
      - name: stall_code
        type: string
        source: input
        description: Human label for the stall (e.g., "A-12").
      - name: size_sqft
        type: integer
        source: input
        description: Stall footprint in square feet.
        constraints: ">= 1"
      - name: open_minutes
        type: integer
        source: input
        description: Stall daily opening time, minutes-from-UTC-midnight.
        constraints: "0 <= open_minutes < close_minutes <= 1440"
      - name: close_minutes
        type: integer
        source: input
        description: Stall daily closing time, minutes-from-UTC-midnight.
        constraints: "open_minutes < close_minutes <= 1440"
      - name: operational_posture
        type: enum
        source: computed
        description: >-
          Compliance gate derived by calculation stall_operational_posture from
          the stall's active lease, that lease's vendor status, the stall's
          latest HealthPermit status, and the stall's latest conducted
          Inspection result. One of {OPEN, RESTRICTED, SUSPENDED}. Recomputed on
          any lease/vendor/permit/inspection change affecting the stall.
        constraints: "one of {OPEN, RESTRICTED, SUSPENDED}"
      - name: current_lease_id
        type: string
        source: computed
        description: >-
          Mirror of the stall's single ACTIVE Lease id;
          null when the stall is vacant. Derived, not a client-supplied FK.
      - name: current_vendor_id
        type: string
        source: computed
        description: >-
          Mirror of the vendor_id of the stall's active lease; null when vacant.
          Derived, not a client-supplied FK.

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: stall_id
        type: string
        source: input
        description: "FK -> Stall.id; the leased stall."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the leasing vendor."
      - name: start_date
        type: string
        source: input
        description: Lease term start (YYYY-MM-DD, inclusive).
      - name: end_date
        type: string
        source: input
        description: Lease term end (YYYY-MM-DD, inclusive). Must be > start_date.
      - name: base_rent_cents
        type: integer
        source: input
        description: Fixed monthly base rent in cents.
        constraints: ">= 0"
      - name: percentage_rate
        type: number
        source: input
        description: Percentage-rent rate applied to gross sales above the breakpoint (e.g., 0.08 = 8%).
        constraints: "0 <= percentage_rate <= 1"
      - name: natural_breakpoint_cents
        type: integer
        source: input
        description: Gross-sales natural breakpoint in cents; percentage rent applies only to sales strictly above this.
        constraints: ">= 0"
      - name: rent_cap_cents
        type: integer
        source: input
        description: Absolute monthly rent ceiling in cents; total rent is clamped at this value.
        constraints: ">= base_rent_cents"
      - name: security_deposit_cents
        type: integer
        source: input
        description: Refundable security deposit held for the term.
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: system
        description: Running ledger of finalized rent charged minus voided rent. Debited on Settlement finalize, credited back on void.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lease lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, TERMINATED}"

  - name: HealthPermit
    parent: null
    common_fields: true
    fields:
      - name: stall_id
        type: string
        source: input
        description: "FK -> Stall.id; the stall this permit authorizes."
      - name: permit_number
        type: string
        source: input
        description: External health-authority permit reference number.
      - name: issued_on
        type: string
        source: system
        description: Date the permit was issued (YYYY-MM-DD), set on issue.
      - name: expires_on
        type: string
        source: input
        description: Permit expiry date (YYYY-MM-DD).
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, ISSUED, SUSPENDED, REVOKED}"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: stall_id
        type: string
        source: input
        description: "FK -> Stall.id; the inspected stall."
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned inspection datetime (ISO 8601 UTC).
      - name: conducted_at
        type: datetime
        source: system
        description: Datetime the inspection was actually conducted (logical clock), set on conduct.
      - name: score
        type: integer
        source: input
        description: Hygiene score 0..100, supplied at conduct time.
        constraints: "0 <= score <= 100"
      - name: result
        type: enum
        source: system
        description: Derived from score at conduct - PASS if score >= 85, CONDITIONAL if 70 <= score < 85, FAIL if score < 70.
        constraints: "one of {PASS, CONDITIONAL, FAIL}"
      - name: status
        type: enum
        source: system
        description: Inspection lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONDUCTED}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: food_hall_id
        type: string
        source: input
        description: "FK -> FoodHall.id; hall the shared-POS order was placed in."
      - name: stall_id
        type: string
        source: input
        description: "FK -> Stall.id; the stall the order is routed to. Must belong to food_hall_id."
      - name: gross_amount_cents
        type: integer
        source: input
        description: Order gross sales value in cents; feeds rent settlement.
        constraints: ">= 1"
      - name: item_count
        type: integer
        source: input
        description: Number of line items in the order.
        constraints: ">= 1"
      - name: placed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the order was placed/routed.
      - name: status
        type: enum
        source: system
        description: Order lifecycle state.
        default: PLACED
        constraints: "one of {PLACED, ROUTED, ACCEPTED, FULFILLED, REJECTED}"

  - name: SeatingAllocation
    parent: null
    common_fields: true
    fields:
      - name: food_hall_id
        type: string
        source: input
        description: "FK -> FoodHall.id; hall whose shared seating is being reserved."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this seating serves (nullable for walk-in holds)."
      - name: seats
        type: integer
        source: input
        description: Number of seats reserved.
        constraints: ">= 1"
      - name: start_time
        type: datetime
        source: input
        description: Reservation window start (ISO 8601 UTC, inclusive).
      - name: end_time
        type: datetime
        source: input
        description: Reservation window end (ISO 8601 UTC, exclusive). Must be > start_time.
      - name: status
        type: enum
        source: system
        description: Allocation lifecycle state. Active status {RESERVED} occupies seats; RELEASED frees them.
        default: RESERVED
        constraints: "one of {RESERVED, RELEASED}"

  - name: MarketingEvent
    parent: null
    common_fields: true
    fields:
      - name: food_hall_id
        type: string
        source: input
        description: "FK -> FoodHall.id; hall hosting the event in its common area."
      - name: name
        type: string
        source: input
        description: Event name.
      - name: start_time
        type: datetime
        source: input
        description: Event window start (ISO 8601 UTC, inclusive).
      - name: end_time
        type: datetime
        source: input
        description: Event window end (ISO 8601 UTC, inclusive). Must be > start_time.
      - name: reserved_capacity
        type: integer
        source: input
        description: Common-area occupancy reserved for the event.
        constraints: ">= 1"
      - name: expected_footfall
        type: integer
        source: input
        description: Projected additional visitor footfall attributable to the event.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Event lifecycle state.
        default: PLANNED
        constraints: "one of {PLANNED, SCHEDULED, CANCELLED}"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease being settled."
      - name: period_start
        type: string
        source: input
        description: Settlement period start date (YYYY-MM-DD, inclusive).
      - name: period_end
        type: string
        source: input
        description: Settlement period end date (YYYY-MM-DD, inclusive).
      - name: gross_sales_cents
        type: integer
        source: computed
        description: Sum of Order.gross_amount_cents for the lease's stall in-period, filtered by variant (see calculation rent_settlement).
      - name: base_rent_charged_cents
        type: integer
        source: computed
        description: Base rent for the period, prorated by active lease days (see calculation prorated_base_rent).
      - name: percentage_rent_cents
        type: integer
        source: computed
        description: Percentage rent on gross sales above the breakpoint (see calculation rent_settlement).
      - name: total_rent_cents
        type: integer
        source: computed
        description: min(rent_cap_cents, base_rent_charged_cents + percentage_rent_cents).
      - name: status
        type: enum
        source: system
        description: Settlement lifecycle state.
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, DISPUTED, FINALIZED, VOIDED, SUPERSEDED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Vendor
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /vendors/{id}/activate"
        actor: HallManager
        preconditions: ["vendor.status == APPLIED"]
        side_effects: ["increments Vendor.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend"
        actor: HallManager
        preconditions: ["vendor.status == ACTIVE"]
        side_effects:
          - "increments Vendor.version by 1"
          - "CASCADE (depth>=2, vendor_suspension_cascade): for every Stall whose current_vendor_id == this vendor, recompute stall_operational_posture -> SUSPENDED (vendor no longer ACTIVE); each such posture flip to SUSPENDED then auto-rejects that stall's ROUTED/ACCEPTED Orders -> REJECTED, and each REJECTED order releases its RESERVED SeatingAllocation -> RELEASED (freeing seats)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/reinstate"
        actor: HallManager
        preconditions: ["vendor.status == SUSPENDED"]
        side_effects:
          - "increments Vendor.version by 1"
          - "recompute stall_operational_posture for the vendor's stalls (may return to OPEN/RESTRICTED)"
        note: "ACTIVE<->SUSPENDED forms a cycle (non-linear). Turnover exit (vendor leaving the hall) is modelled by terminating the vendor's leases, not by a distinct Vendor terminal state."

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leases/{id}/activate"
        actor: HallManager
        preconditions:
          - "lease.status == DRAFT"
          - "vendor.status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "CROSS-ENTITY (lease_activation_requires_permit): the stall's latest HealthPermit.status == ISSUED (else ERR_PERMIT_NOT_ISSUED)"
          - "no other Lease on this stall_id is in {ACTIVE} (else ERR_STALL_ALREADY_LEASED)"
          - "no other {ACTIVE} Lease on this stall has a term overlapping [start_date, end_date] (else ERR_LEASE_TERM_CONFLICT)"
        side_effects:
          - "increments Lease.version by 1"
          - "sets Stall.current_lease_id and Stall.current_vendor_id; recompute stall_operational_posture"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /leases/{id}/renew"
        actor: HallManager
        preconditions:
          - "lease.status == ACTIVE"
          - "new_end_date > lease.end_date"
        side_effects:
          - "extends Lease.end_date to new_end_date"
          - "increments Lease.version by 1"
        note: "ACTIVE->ACTIVE renewal self-loop (cyclic, non-linear)."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: HallManager
        preconditions: ["lease.status == ACTIVE"]
        side_effects:
          - "increments Lease.version by 1"
          - "clears Stall.current_lease_id and current_vendor_id; recompute stall_operational_posture -> SUSPENDED (now vacant)"
          - "computes deposit refund via calculation deposit_forfeiture; returned on the response, NOT applied to outstanding_balance_cents"

  - entity: HealthPermit
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: HealthInspector
        preconditions: ["permit.status == PENDING"]
        side_effects:
          - "sets issued_on to current logical date"
          - "increments HealthPermit.version by 1"
          - "recompute stall_operational_posture for permit.stall_id"
      - from: ISSUED
        to: SUSPENDED
        trigger: "system: Inspection conduct with result == FAIL (inspection_fail_cascade)"
        actor: system
        preconditions: ["permit.status == ISSUED"]
        side_effects:
          - "increments HealthPermit.version by 1"
          - "recompute stall_operational_posture -> SUSPENDED"
      - from: SUSPENDED
        to: ISSUED
        trigger: "system: subsequent Inspection conduct with result == PASS on the same stall"
        actor: system
        preconditions: ["permit.status == SUSPENDED"]
        side_effects:
          - "increments HealthPermit.version by 1"
          - "recompute stall_operational_posture"
        note: "ISSUED<->SUSPENDED cycle (non-linear), driven entirely by inspection cascade."
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: HealthInspector
        preconditions: ["permit.status IN {ISSUED, SUSPENDED}"]
        side_effects:
          - "increments HealthPermit.version by 1"
          - "recompute stall_operational_posture -> SUSPENDED (no valid permit)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /inspections/{id}/conduct"
        actor: HealthInspector
        preconditions: ["inspection.status == SCHEDULED"]
        side_effects:
          - "sets conducted_at to current logical clock; sets result from score (PASS>=85, 70<=CONDITIONAL<85, FAIL<70)"
          - "increments Inspection.version by 1"
          - "BRANCH on result: FAIL -> CASCADE (depth>=3, inspection_fail_cascade): the stall's latest ISSUED HealthPermit -> SUSPENDED; that permit suspension recomputes stall_operational_posture -> SUSPENDED; that posture flip auto-rejects the stall's ROUTED/ACCEPTED Orders -> REJECTED; each such REJECTED order releases its RESERVED SeatingAllocation -> RELEASED."
          - "BRANCH on result: PASS -> if the stall's latest permit is SUSPENDED, restore it to ISSUED and recompute posture; CONDITIONAL -> recompute posture -> RESTRICTED (no permit change)."

  - entity: Order
    initial_state: PLACED
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: PLACED
        to: ROUTED
        trigger: "POST /orders (placement auto-routes to stall_id)"
        actor: POSOperator
        preconditions:
          - "stall.food_hall_id == order.food_hall_id (else ERR_STALL_NOT_IN_HALL)"
          - "CROSS-ENTITY (order_routing_requires_posture): stall.operational_posture != SUSPENDED (else ERR_STALL_SUSPENDED)"
          - "placed_at minute-of-day within [max(stall.open_minutes, hall.hall_open_minutes), min(stall.close_minutes, hall.hall_close_minutes)) (else ERR_OUTSIDE_OPERATING_HOURS)"
        side_effects: ["sets placed_at from logical clock; status set to ROUTED in the same request"]
        note: "PLACED is transient; a successful POST /orders returns status ROUTED."
      - from: ROUTED
        to: ACCEPTED
        trigger: "POST /orders/{id}/accept"
        actor: Vendor
        preconditions:
          - "order.status == ROUTED"
          - "acting Vendor.id == stall.current_vendor_id (else ERR_UNAUTHORIZED)"
        side_effects: ["increments Order.version by 1"]
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: Vendor
        preconditions: ["order.status == ACCEPTED", "acting Vendor.id == stall.current_vendor_id"]
        side_effects: ["increments Order.version by 1"]
      - from: ROUTED
        to: REJECTED
        trigger: "POST /orders/{id}/reject"
        actor: Vendor
        preconditions: ["order.status IN {ROUTED, ACCEPTED}", "acting Vendor.id == stall.current_vendor_id"]
        side_effects:
          - "increments Order.version by 1"
          - "releases any RESERVED SeatingAllocation with order_id == this order -> RELEASED (frees seats)"

  - entity: SeatingAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /seating-allocations/{id}/release, OR system-driven when the linked Order is REJECTED (order reject / posture cascade)"
        actor: POSOperator | system
        preconditions: ["allocation.status == RESERVED"]
        side_effects:
          - "increments SeatingAllocation.version by 1"
          - "COMPENSATION (seat_conservation): frees `seats` back to the hall's available capacity for [start_time, end_time)"

  - entity: MarketingEvent
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /marketing-events/{id}/schedule"
        actor: HallManager
        preconditions:
          - "event.status == PLANNED"
          - "reserved_capacity <= hall.common_area_capacity (else ERR_COMMON_AREA_CAPACITY_EXCEEDED)"
          - "no other SCHEDULED MarketingEvent on this hall lies within hall.event_buffer_minutes of [start_time, end_time] (else ERR_EVENT_TIME_CONFLICT)"
        side_effects: ["increments MarketingEvent.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /marketing-events/{id}/cancel"
        actor: HallManager
        preconditions: ["event.status IN {PLANNED, SCHEDULED}"]
        side_effects: ["increments MarketingEvent.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /marketing-events/{id}/cancel"
        actor: HallManager
        preconditions: ["event.status == SCHEDULED"]
        side_effects:
          - "increments MarketingEvent.version by 1"
          - "frees its common-area slot (a CANCELLED event no longer blocks buffer checks)"

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, VOIDED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: HallManager
        preconditions:
          - "settlement.status == PROVISIONAL"
          - "CROSS-ENTITY: lease.status != TERMINATED is NOT required (terminated leases may still settle); no cross gate here"
        side_effects:
          - "recompute gross_sales_cents/percentage_rent_cents/total_rent_cents under the FINAL variant (FULFILLED-only sales)"
          - "increments Settlement.version by 1"
          - "LEDGER: debit Lease.outstanding_balance_cents += total_rent_cents (and increments Lease.version by 1)"
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /settlements/{id}/dispute"
        actor: Vendor
        preconditions:
          - "settlement.status == PROVISIONAL"
          - "acting Vendor.id == the lease's vendor_id (else ERR_UNAUTHORIZED)"
        side_effects: ["increments Settlement.version by 1"]
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /settlements/{id}/resolve-dispute"
        actor: HallManager
        preconditions: ["settlement.status == DISPUTED"]
        side_effects: ["increments Settlement.version by 1"]
        note: "PROVISIONAL<->DISPUTED cycle (non-linear)."
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /settlements/{id}/void"
        actor: HallManager
        preconditions: ["settlement.status == FINALIZED"]
        side_effects:
          - "increments Settlement.version by 1"
          - "COMPENSATION (rent_ledger_conservation): credit Lease.outstanding_balance_cents -= total_rent_cents (and increments Lease.version by 1), exactly reversing the finalize debit"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: a newer PROVISIONAL Settlement created for the same lease+period (concurrency rule settlement-supersede-stale-lease)"
        actor: system
        preconditions: ["settlement.status == PROVISIONAL"]
        side_effects: ["increments Settlement.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: settlement-supersede-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /settlements"
    occ_field: "expected_lease_version"
    description: |
      Creating a PROVISIONAL Settlement against a Lease whose version has
      advanced since the client last read it is rejected. A new provisional
      settlement legitimately supersedes any prior PROVISIONAL settlement for
      the same lease+period (marking the prior one SUPERSEDED), so a second
      create off a stale view of the lease would silently discard the sales and
      version state the first create already committed. The rule reduces this to
      a stale-version check: the create must carry the lease version the client
      observed, and the endpoint bumps Lease.version on success so the next
      stale-version create fails.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stall_operational_posture
    trigger: "recomputed on any lease/vendor/permit/inspection change touching the stall; read on order routing"
    algorithm: constraint_propagation
    formula: |
      let lease = the stall's Lease in status {ACTIVE} (at most one), else none
      let permit = the stall's most-recently-created HealthPermit (by created_at), else none
      let insp = the stall's most-recently-conducted Inspection (max conducted_at; tie-break created_at ASC), else none
      if lease is none: return SUSPENDED
      if lease.vendor.status != ACTIVE: return SUSPENDED
      if permit is none or permit.status != ISSUED: return SUSPENDED
      if insp is not none and insp.result == FAIL: return SUSPENDED
      if insp is not none and insp.result == CONDITIONAL: return RESTRICTED
      return OPEN
    input_set: "one active lease, latest permit, latest conducted inspection for the stall"
    precision: "n/a (enum)"

  - name: rent_settlement
    trigger: "POST /settlements (PROVISIONAL variant); POST /settlements/{id}/finalize (FINAL variant)"
    algorithm: threshold
    formula: |
      # gross_sales depends on VARIANT (see variants)
      S       = sum(Order.gross_amount_cents for orders on lease.stall_id whose
                    placed_at date in [period_start, period_end] and status in VARIANT_STATUS_SET)
      base    = prorated_base_rent(lease, period_start, period_end)      # see that rule
      pct     = round_half_up(lease.percentage_rate * max(0, S - lease.natural_breakpoint_cents))
      total   = min(lease.rent_cap_cents, base + pct)
      # evaluation order is fixed: compute S, then base (rounded), then pct (rounded),
      # then sum the two already-rounded figures, then clamp with min().
    input_set: "orders on the lease's stall in-period; status filter set by variant"
    constants:
      ROUNDING: round_half_up_to_cent
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at settlement creation (POST /settlements)"
        difference: "VARIANT_STATUS_SET = {ACCEPTED, FULFILLED} - counts in-flight accepted sales"
      - name: final
        when: "at finalize (POST /settlements/{id}/finalize)"
        difference: "VARIANT_STATUS_SET = {FULFILLED} only - accepted-but-unfulfilled and rejected sales drop out, changing S and therefore pct and total"

  - name: prorated_base_rent
    trigger: "invoked by rent_settlement for both variants"
    algorithm: aggregation
    formula: |
      period_days = (period_end - period_start) in days, inclusive (e.g., 2026-06-01..2026-06-30 = 30)
      active_days = number of days in [period_start, period_end] on which the lease was ACTIVE,
                    = days in [max(period_start, lease.start_date), min(period_end, lease.end_date)] inclusive, floored at 0
      base_charged = round_half_up(lease.base_rent_cents * active_days / period_days)
      # ROUNDING ORDER (pinned): prorate-and-round the base to a whole cent HERE, independently;
      # rent_settlement then rounds pct independently and SUMS the two already-rounded integers
      # (round-then-sum). Do NOT keep base and pct as unrounded reals and round their sum once.
    input_set: "single lease, single period"
    constants:
      ROUNDING: round_half_up_to_cent
      ORDER: round_then_sum
    precision: "integer cents, round_half_up"

  - name: stall_compliance_grade
    trigger: "GET /stalls/{id}/compliance-grade?method=..."
    algorithm: weighted_scoring
    formula: |
      insps = the stall's CONDUCTED inspections ordered by conducted_at DESC (tie-break created_at DESC), take up to last 3
      if method == LATEST:
          score = insps[0].score            # newest only
      if method == WEIGHTED:
          n = len(insps)
          if n == 1: weights = [1.0]
          elif n == 2: weights = [0.6, 0.4]
          else:        weights = [0.5, 0.3, 0.2]   # newest..oldest, only first 3 used
          score = round_half_up(sum(weights[i] * insps[i].score for i in range(min(n,3))))
      grade = A if score>=90 else B if score>=80 else C if score>=70 else D if score>=60 else F
    input_set: "the stall's conducted inspections"
    constants:
      WEIGHTS_2: [0.6, 0.4]
      WEIGHTS_3: [0.5, 0.3, 0.2]
      BANDS: "A>=90,B>=80,C>=70,D>=60,else F"
    precision: "integer score, round_half_up"
    variants:
      - name: latest
        when: "method == LATEST"
        difference: "uses only the newest conducted inspection's score"
      - name: weighted
        when: "method == WEIGHTED"
        difference: "weighted average over the last up-to-3 conducted inspections; for identical history produces a different score/grade than latest"

  - name: seating_available
    trigger: "POST /seating-allocations (capacity check); COMPENSATION invariant seat_conservation"
    algorithm: aggregation
    formula: |
      # For a requested window [start_time, end_time) (half-open) on hall H:
      concurrent(t) = sum(a.seats for a in SeatingAllocation
                          where a.food_hall_id == H and a.status == RESERVED
                          and a.start_time < end_time and start_time < a.end_time)   # half-open overlap
      # request admitted iff  concurrent + requested_seats <= H.total_seating_capacity
      # (adjacency a.end_time == start_time does NOT overlap)
    input_set: "RESERVED allocations on the hall overlapping the requested half-open window"
    constants:
      OVERLAP: half_open_[start,end)
      CAPACITY_BOUNDARY: "<= total_seating_capacity (equality admitted)"
    precision: "integer seats"

  - name: event_buffer_conflict
    trigger: "POST /marketing-events/{id}/schedule"
    algorithm: interval_merge
    formula: |
      # For candidate event C=[C.start, C.end] (closed) on hall H with buffer b = H.event_buffer_minutes:
      # conflict iff there exists a SCHEDULED event E on H (E != C) with
      #   C.start < E.end + b  AND  E.start < C.end + b
      # i.e., the two closed intervals, each dilated by b on both sides, intersect.
      # A gap of exactly b minutes between them (C.start == E.end + b) is ADMITTED (no conflict).
    input_set: "SCHEDULED events on the same hall"
    constants:
      INTERVAL: closed_[start,end]_dilated_by_buffer
      BUFFER_BOUNDARY: "gap == buffer admitted; gap < buffer rejected"
    precision: "minutes"

  - name: deposit_forfeiture
    trigger: "POST /leases/{id}/terminate"
    algorithm: tiered_pricing
    formula: |
      # Refundable portion of the security deposit on early termination.
      today = current logical date
      if today >= lease.end_date:
          refund = lease.security_deposit_cents          # full refund at/after natural expiry
      else:
          remaining_days = (lease.end_date - today) inclusive
          term_days      = (lease.end_date - lease.start_date) inclusive
          forfeit = round_half_up(lease.security_deposit_cents * remaining_days / term_days)
          refund  = lease.security_deposit_cents - forfeit
      # 'deposit_refund_cents' is returned on the terminate response; it is a
      # settlement figure, NOT applied to outstanding_balance_cents.
    input_set: "single lease, current clock"
    constants:
      ROUNDING: round_half_up_to_cent
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7 (and for entity_backed roles, X-User-ID owns the target resource where ownership is required)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
    note: "concrete ids: ERR_FOOD_HALL_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_STALL_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_SEATING_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND"

  - priority: 4
    category: existence
    check: "every FK in the request body references an existing resource (food_hall_id, stall_id, vendor_id, lease_id, order_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints carrying FKs"

  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, numeric ranges satisfied, start<end / start_date<end_date / period_start<=period_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
    note: "interval degeneracy (start_time >= end_time) -> ERR_INTERVAL_INVALID; lease end_date <= start_date -> ERR_LEASE_TERM_INVALID"

  - priority: 6
    category: state
    check: "OCC: expected_lease_version matches Lease.version on POST /settlements"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /settlements"

  - priority: 7
    category: state
    check: "target resource is in a state that admits the requested transition (state-machine from-state / status precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
    note: "domain ids: ERR_VENDOR_NOT_ACTIVE (lease activate), ERR_STALL_SUSPENDED (order routing), ERR_SETTLEMENT_NOT_PROVISIONAL (finalize/dispute)"

  - priority: 8
    category: business_safety
    check: "health gate: on lease activate, the stall's latest HealthPermit.status == ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /leases/{id}/activate"

  - priority: 9
    category: business_referential
    check: "stall not already leased: no other Lease on the stall is in {ACTIVE} on activate; order's stall belongs to the order's food hall on routing"
    error_id: ERR_STALL_ALREADY_LEASED
    http_status: 409
    applies_to: "POST /leases/{id}/activate, POST /orders"
    note: "order stall/hall mismatch -> ERR_STALL_NOT_IN_HALL"

  - priority: 10
    category: business_temporal
    check: "temporal windows: order placed within operating hours; scheduled event respects the buffer gap; lease term does not overlap another active lease's term"
    error_id: ERR_OUTSIDE_OPERATING_HOURS
    http_status: 409
    applies_to: "POST /orders, POST /marketing-events/{id}/schedule, POST /leases/{id}/activate"
    note: "event buffer collision -> ERR_EVENT_TIME_CONFLICT; lease-term overlap -> ERR_LEASE_TERM_CONFLICT"

  - priority: 11
    category: business_constraint
    check: "capacity: seating request keeps concurrent seats <= total_seating_capacity; event reserved_capacity <= common_area_capacity"
    error_id: ERR_SEATING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /seating-allocations, POST /marketing-events/{id}/schedule"
    note: "event over-capacity -> ERR_COMMON_AREA_CAPACITY_EXCEEDED"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [HallManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advances the logical clock used by placed_at, conducted_at, issued_on, deposit_forfeiture, lease auto-transitions"]

  # ---- FoodHall ----
  - method: POST
    path: "/food-halls"
    description: "Create a food hall venue."
    roles: [HallManager]
    code: 201
    input: [name, total_seating_capacity, common_area_capacity, hall_open_minutes, hall_close_minutes, "event_buffer_minutes?"]
    output: FoodHall
    side_effects: []
  - method: GET
    path: "/food-halls/{id}"
    description: "Fetch a food hall."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: FoodHall
    side_effects: []

  # ---- Vendor ----
  - method: POST
    path: "/vendors"
    description: "Register a vendor applicant (status APPLIED)."
    roles: [HallManager]
    code: 201
    input: [legal_name, contact_email]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/activate"
    description: "APPLIED -> ACTIVE (onboarding complete)."
    roles: [HallManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["increments Vendor.version"]
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; cascades stall posture -> order reject -> seating release (vendor_suspension_cascade)."
    roles: [HallManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["recompute posture for vendor's stalls", "auto-reject routed/accepted orders", "release their reservations"]
  - method: POST
    path: "/vendors/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE; recompute stall posture."
    roles: [HallManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["recompute posture for vendor's stalls"]

  # ---- Stall ----
  - method: POST
    path: "/stalls"
    description: "Create a stall in a hall."
    roles: [HallManager]
    code: 201
    input: [food_hall_id, stall_code, size_sqft, open_minutes, close_minutes]
    output: Stall
    side_effects: ["operational_posture initialized to SUSPENDED (vacant)"]
  - method: GET
    path: "/stalls/{id}"
    description: "Fetch a stall (includes computed operational_posture)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: Stall
    side_effects: []
  - method: GET
    path: "/stalls"
    description: "List stalls, optionally filtered by hall and/or posture."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["food_hall_id?", "operational_posture?", "limit?", "offset?"]
    output: Stall[]
    side_effects: []
  - method: GET
    path: "/stalls/{id}/permits"
    description: "List health permits for a stall (reverse-reachability for HealthPermit.stall_id)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: HealthPermit[]
    side_effects: []
  - method: GET
    path: "/stalls/{id}/inspections"
    description: "List inspections for a stall (reverse-reachability for Inspection.stall_id)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/stalls/{id}/compliance-grade"
    description: "Computed read - stall compliance grade under LATEST or WEIGHTED method (dual-variant)."
    roles: [HallManager, HealthInspector]
    code: 200
    input: [method]
    output: "{ stall_id: string, method: string, score: integer, grade: string }"
    side_effects: []

  # ---- Lease ----
  - method: POST
    path: "/leases"
    description: "Create a DRAFT lease binding a vendor to a stall with rent terms."
    roles: [HallManager]
    code: 201
    input: [stall_id, vendor_id, start_date, end_date, base_rent_cents, percentage_rate, natural_breakpoint_cents, rent_cap_cents, security_deposit_cents]
    output: Lease
    side_effects: []
  - method: GET
    path: "/leases/{id}"
    description: "Fetch a lease (includes outstanding_balance_cents, version)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/leases"
    description: "List leases filtered by stall, vendor, and/or status (reverse-reachability for Lease.stall_id and Lease.vendor_id)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["stall_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: POST
    path: "/leases/{id}/activate"
    description: "DRAFT -> ACTIVE; sets stall current lease + posture."
    roles: [HallManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["set Stall.current_lease_id/current_vendor_id", "recompute posture", "increments Lease.version"]
  - method: POST
    path: "/leases/{id}/renew"
    description: "ACTIVE -> ACTIVE renewal self-loop; extends end_date."
    roles: [HallManager]
    code: 200
    input: [new_end_date]
    output: Lease
    side_effects: ["extends end_date", "increments Lease.version"]
  - method: POST
    path: "/leases/{id}/terminate"
    description: "ACTIVE -> TERMINATED; vacates stall; returns deposit_refund_cents."
    roles: [HallManager]
    code: 200
    input: []
    output: "{ lease: Lease, deposit_refund_cents: integer }"
    side_effects: ["clear stall current lease/vendor", "recompute posture -> SUSPENDED", "increments Lease.version"]

  # ---- HealthPermit ----
  - method: POST
    path: "/permits"
    description: "Create a PENDING health permit for a stall."
    roles: [HealthInspector]
    code: 201
    input: [stall_id, permit_number, expires_on]
    output: HealthPermit
    side_effects: []
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a health permit."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: HealthPermit
    side_effects: []
  - method: POST
    path: "/permits/{id}/issue"
    description: "PENDING -> ISSUED; sets issued_on; recompute stall posture."
    roles: [HealthInspector]
    code: 200
    input: []
    output: HealthPermit
    side_effects: ["set issued_on", "recompute posture", "increments HealthPermit.version"]
  - method: POST
    path: "/permits/{id}/revoke"
    description: "ISSUED/SUSPENDED -> REVOKED; recompute stall posture -> SUSPENDED."
    roles: [HealthInspector]
    code: 200
    input: []
    output: HealthPermit
    side_effects: ["recompute posture -> SUSPENDED", "increments HealthPermit.version"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection for a stall (status SCHEDULED)."
    roles: [HealthInspector]
    code: 201
    input: [stall_id, scheduled_for]
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/conduct"
    description: "SCHEDULED -> CONDUCTED; sets result from score; FAIL cascades permit->posture->orders->seating (inspection_fail_cascade); PASS restores a SUSPENDED permit."
    roles: [HealthInspector]
    code: 200
    input: [score]
    output: Inspection
    side_effects: ["set result/conducted_at", "cascade on FAIL", "restore permit + posture on PASS", "increments Inspection.version"]

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Place a shared-POS order and auto-route it to the stall (PLACED->ROUTED). Enforces stall-in-hall, posture, operating hours."
    roles: [POSOperator]
    code: 201
    input: [food_hall_id, stall_id, gross_amount_cents, item_count]
    output: Order
    side_effects: ["set placed_at from clock", "status -> ROUTED"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders filtered by stall, hall, and/or status (reverse-reachability for Order.stall_id and Order.food_hall_id)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["stall_id?", "food_hall_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/accept"
    description: "ROUTED -> ACCEPTED by the stall's vendor."
    roles: [Vendor]
    code: 200
    input: []
    output: Order
    side_effects: ["increments Order.version"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "ACCEPTED -> FULFILLED by the stall's vendor; sales now count in the FINAL settlement variant."
    roles: [Vendor]
    code: 200
    input: []
    output: Order
    side_effects: ["increments Order.version"]
  - method: POST
    path: "/orders/{id}/reject"
    description: "ROUTED/ACCEPTED -> REJECTED by the stall's vendor; releases the linked seating reservation."
    roles: [Vendor]
    code: 200
    input: []
    output: Order
    side_effects: ["release RESERVED SeatingAllocation with this order_id", "increments Order.version"]

  # ---- SeatingAllocation ----
  - method: POST
    path: "/seating-allocations"
    description: "Reserve shared seats for a window; rejected if concurrent seats would exceed total_seating_capacity."
    roles: [POSOperator]
    code: 201
    input: [food_hall_id, "order_id?", seats, start_time, end_time]
    output: SeatingAllocation
    side_effects: ["occupy seats over [start_time, end_time)"]
  - method: GET
    path: "/seating-allocations/{id}"
    description: "Fetch a seating allocation."
    roles: [HallManager, POSOperator]
    code: 200
    input: []
    output: SeatingAllocation
    side_effects: []
  - method: GET
    path: "/seating-allocations"
    description: "List seating allocations filtered by hall and/or order (reverse-reachability for SeatingAllocation.food_hall_id and .order_id)."
    roles: [HallManager, POSOperator]
    code: 200
    input: ["food_hall_id?", "order_id?", "status?", "limit?", "offset?"]
    output: SeatingAllocation[]
    side_effects: []
  - method: POST
    path: "/seating-allocations/{id}/release"
    description: "RESERVED -> RELEASED; frees seats back to capacity (seat_conservation compensation)."
    roles: [POSOperator]
    code: 200
    input: []
    output: SeatingAllocation
    side_effects: ["free seats", "increments SeatingAllocation.version"]

  # ---- MarketingEvent ----
  - method: POST
    path: "/marketing-events"
    description: "Create a PLANNED common-area marketing event."
    roles: [HallManager]
    code: 201
    input: [food_hall_id, name, start_time, end_time, reserved_capacity, expected_footfall]
    output: MarketingEvent
    side_effects: []
  - method: GET
    path: "/marketing-events/{id}"
    description: "Fetch a marketing event."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: []
    output: MarketingEvent
    side_effects: []
  - method: GET
    path: "/marketing-events"
    description: "List marketing events filtered by hall (reverse-reachability for MarketingEvent.food_hall_id)."
    roles: [HallManager, Vendor, HealthInspector, POSOperator]
    code: 200
    input: ["food_hall_id?", "status?", "limit?", "offset?"]
    output: MarketingEvent[]
    side_effects: []
  - method: POST
    path: "/marketing-events/{id}/schedule"
    description: "PLANNED -> SCHEDULED; enforces common-area capacity and the inter-event buffer gap."
    roles: [HallManager]
    code: 200
    input: []
    output: MarketingEvent
    side_effects: ["increments MarketingEvent.version"]
  - method: POST
    path: "/marketing-events/{id}/cancel"
    description: "PLANNED/SCHEDULED -> CANCELLED; frees the common-area slot for buffer checks."
    roles: [HallManager]
    code: 200
    input: []
    output: MarketingEvent
    side_effects: ["increments MarketingEvent.version"]

  # ---- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Create a PROVISIONAL settlement for a lease+period (computes provisional totals). Requires expected_lease_version (OCC); supersedes any prior PROVISIONAL settlement for the same lease+period; bumps Lease.version."
    roles: [HallManager]
    code: 201
    input: [lease_id, period_start, period_end, expected_lease_version]
    output: Settlement
    side_effects: ["compute provisional gross_sales/percentage_rent/total", "mark prior PROVISIONAL same-period settlement SUPERSEDED", "increments Lease.version by 1"]
  - method: GET
    path: "/settlements/{id}"
    description: "Fetch a settlement (computed rent fields)."
    roles: [HallManager, Vendor]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements filtered by lease (reverse-reachability for Settlement.lease_id)."
    roles: [HallManager, Vendor]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/settlements/{id}/finalize"
    description: "PROVISIONAL -> FINALIZED; recompute under FINAL variant; debit Lease.outstanding_balance_cents by total_rent_cents."
    roles: [HallManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["recompute final totals", "debit lease.outstanding_balance_cents", "increments Lease.version", "increments Settlement.version"]
  - method: POST
    path: "/settlements/{id}/dispute"
    description: "PROVISIONAL -> DISPUTED by the lease's vendor."
    roles: [Vendor]
    code: 200
    input: []
    output: Settlement
    side_effects: ["increments Settlement.version"]
  - method: POST
    path: "/settlements/{id}/resolve-dispute"
    description: "DISPUTED -> PROVISIONAL (cycle)."
    roles: [HallManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["increments Settlement.version"]
  - method: POST
    path: "/settlements/{id}/void"
    description: "FINALIZED -> VOIDED; credit Lease.outstanding_balance_cents back by total_rent_cents (rent_ledger_conservation compensation)."
    roles: [HallManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["credit lease.outstanding_balance_cents", "increments Lease.version", "increments Settlement.version"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/malformed X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or entity_backed actor is not the owner of the target resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "generic path/FK resource not found (specialized ids below)"
  - id: ERR_FOOD_HALL_NOT_FOUND
    http: 404
    condition: "food_hall_id does not resolve"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor_id does not resolve"
  - id: ERR_STALL_NOT_FOUND
    http: 404
    condition: "stall_id does not resolve"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "lease_id does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id does not resolve"
  - id: ERR_SEATING_NOT_FOUND
    http: 404
    condition: "seating allocation id does not resolve"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "marketing event id does not resolve"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, illegal enum value, or numeric range violation"
  - id: ERR_INTERVAL_INVALID
    http: 422
    condition: "start_time >= end_time on a seating allocation or event window"
  - id: ERR_LEASE_TERM_INVALID
    http: 422
    condition: "lease end_date <= start_date, or rent_cap_cents < base_rent_cents"
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version on POST /settlements does not match Lease.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state that admits the requested transition"
  - id: ERR_VENDOR_NOT_ACTIVE
    http: 409
    condition: "lease activate while the vendor is not ACTIVE"
  - id: ERR_STALL_SUSPENDED
    http: 409
    condition: "order routing to a stall whose operational_posture == SUSPENDED"
  - id: ERR_SETTLEMENT_NOT_PROVISIONAL
    http: 409
    condition: "finalize/dispute a settlement not in PROVISIONAL, or void a settlement not FINALIZED"
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "lease activate while the stall's latest HealthPermit is not ISSUED"
  - id: ERR_STALL_ALREADY_LEASED
    http: 409
    condition: "lease activate while the stall already has an ACTIVE lease"
  - id: ERR_STALL_NOT_IN_HALL
    http: 409
    condition: "order stall_id does not belong to order food_hall_id"
  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 409
    condition: "order placed outside the stall∩hall operating window"
  - id: ERR_EVENT_TIME_CONFLICT
    http: 409
    condition: "scheduling an event within the buffer gap of another SCHEDULED event"
  - id: ERR_LEASE_TERM_CONFLICT
    http: 409
    condition: "lease activate whose term overlaps another active lease's term on the same stall"
  - id: ERR_SEATING_CAPACITY_EXCEEDED
    http: 409
    condition: "seating request would push concurrent seats above total_seating_capacity"
  - id: ERR_COMMON_AREA_CAPACITY_EXCEEDED
    http: 409
    condition: "event reserved_capacity exceeds common_area_capacity"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HallManager
    description: "Operator of the food hall; owns halls, stalls, leases, settlements, and events."
    identity: opaque
    exclusive_operations:
      - "POST /food-halls, POST /stalls"
      - "POST /vendors + activate/suspend/reinstate"
      - "POST /leases + activate/renew/terminate"
      - "POST /settlements + finalize/resolve-dispute/void"
      - "POST /marketing-events + schedule/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on halls/vendors/stalls/leases/permits/inspections/orders/settlements/events/seating"

  - name: Vendor
    description: "Stall operator; accepts/fulfills/rejects orders on its own stalls and disputes its own settlements."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /orders/{id}/accept, /fulfill, /reject (only on stalls whose current_vendor_id == X-User-ID)"
      - "POST /settlements/{id}/dispute (only when the settlement's lease.vendor_id == X-User-ID)"
    shared_operations:
      - "GET on halls/vendors/stalls/leases/permits/inspections/orders/settlements/events"

  - name: HealthInspector
    description: "Issues/revokes permits and conducts inspections."
    identity: opaque
    exclusive_operations:
      - "POST /permits + issue/revoke"
      - "POST /inspections + conduct"
      - "GET /stalls/{id}/compliance-grade"
    shared_operations:
      - "GET on halls/vendors/stalls/permits/inspections/orders/events"

  - name: POSOperator
    description: "Shared-POS terminal operator; places orders and manages seating."
    identity: opaque
    exclusive_operations:
      - "POST /orders"
      - "POST /seating-allocations + release"
    shared_operations:
      - "GET on halls/stalls/orders/seating"
