  - method: GET
    path: "/lab/kits"
    description: "List kits (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "KitDefinition[]"
    side_effects: []
  - method: GET
    path: "/lab/kits/{kitId}"
    description: "Get one kit"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: KitDefinition
    side_effects: []
  - method: POST
    path: "/lab/kits/{kitId}/activate"
    description: "Activate a kit: structural checks, recall/listing checks, computes kit_price_cents"
    roles: [CatalogManager]
    code: 200
    input: []
    output: KitDefinition
    side_effects: ["kit_price_rollup -> kit_price_cents", "status DRAFT -> ACTIVE", "increments KitDefinition.version by 1"]
  - method: POST
    path: "/lab/kits/{kitId}/retire"
    description: "Retire an ACTIVE kit (terminal)"
    roles: [CatalogManager]
    code: 200
    input: []
    output: KitDefinition
    side_effects: ["status ACTIVE -> RETIRED", "increments KitDefinition.version by 1"]

  # --- Kit Assembly Jobs ---
  - method: POST
    path: "/lab/kit-assembly-jobs"
    description: "Plan a kit assembly job"
    roles: [InventoryClerk]
    code: 201
    input: [kit_id, warehouse_id, quantity_to_build]
    output: KitAssemblyJob
    side_effects: ["status = PLANNED", "kits_built = 0"]
  - method: GET
    path: "/lab/kit-assembly-jobs"
    description: "List kit assembly jobs (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["kit_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: "KitAssemblyJob[]"
    side_effects: []
  - method: GET
    path: "/lab/kit-assembly-jobs/{jobId}"
    description: "Get one kit assembly job"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: KitAssemblyJob
    side_effects: []
  - method: POST
    path: "/lab/kit-assembly-jobs/{jobId}/execute"
    description: "Execute a planned job: FEFO-consumes component lots atomically or fails with ERR_KIT_COMPONENT_SHORTAGE leaving all stock untouched"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: KitAssemblyJob
    side_effects: ["per-component FEFO consumption", "DEPLETED auto-transition for emptied lots", "kits_built = quantity_to_build", "consumption_summary recorded", "increments KitAssemblyJob.version by 1"]
  - method: POST
    path: "/lab/kit-assembly-jobs/{jobId}/cancel"
    description: "Cancel a planned job"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: KitAssemblyJob
    side_effects: ["status PLANNED -> CANCELLED", "increments KitAssemblyJob.version by 1"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/lab/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs the lot expiry sweep (lots whose expiry_date is before the new current date become EXPIRED with the release cascade) and standing_order_run_generation."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, lots_expired: integer, standing_orders_run: integer, orders_generated: integer }"
    side_effects: ["expiry sweep per expiry_date_derivation", "standing_order_run_generation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth & context ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_RESOURCE_OWNERSHIP_VIOLATION, http: 403, condition: "Customer role acts on a resource whose customer_id differs from X-User-ID" }

  # --- Existence ---
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "warehouse id does not exist" }
  - { id: ERR_STORAGE_ZONE_NOT_FOUND, http: 404, condition: "storage zone id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not exist" }
  - { id: ERR_EXCURSION_NOT_FOUND, http: 404, condition: "excursion id does not exist" }
  - { id: ERR_STANDING_ORDER_NOT_FOUND, http: 404, condition: "standing order id does not exist" }
  - { id: ERR_CONSIGNMENT_AGREEMENT_NOT_FOUND, http: 404, condition: "consignment agreement id does not exist" }
  - { id: ERR_CONSUMPTION_RECORD_NOT_FOUND, http: 404, condition: "consumption record id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "recall id does not exist" }
  - { id: ERR_KIT_NOT_FOUND, http: 404, condition: "kit id does not exist" }
  - { id: ERR_KIT_ASSEMBLY_JOB_NOT_FOUND, http: 404, condition: "kit assembly job id does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, non-positive quantity, unparseable date, unknown field, or malformed lines/components array" }
  - { id: ERR_KIT_DUPLICATE_COMPONENT, http: 422, condition: "Kit components array contains the same product_id twice" }

  # --- OCC ---
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match the lot's current version" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match the order's current version" }
  - { id: ERR_STALE_CUSTOMER_VERSION, http: 412, condition: "expected_customer_version does not match the customer's current version" }

  # --- State ---
  - { id: ERR_WAREHOUSE_NOT_OPERATIONAL, http: 409, condition: "Warehouse not OPERATIONAL for suspend/dispatch" }
  - { id: ERR_WAREHOUSE_NOT_SUSPENDED, http: 409, condition: "Warehouse not SUSPENDED for resume" }
  - { id: ERR_PRODUCT_NOT_LISTED, http: 409, condition: "Product not LISTED for submit/kit-activate/discontinue" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Lot not AVAILABLE for quarantine" }
  - { id: ERR_LOT_NOT_QUARANTINED, http: 409, condition: "Lot not QUARANTINED for release-quarantine" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Customer not ACTIVE for submit/suspend" }
  - { id: ERR_CUSTOMER_NOT_SUSPENDED, http: 409, condition: "Customer not SUSPENDED for reactivate" }
  - { id: ERR_CUSTOMER_ALREADY_CLOSED, http: 409, condition: "Customer already CLOSED" }
  - { id: ERR_ORDER_NOT_SUBMITTABLE, http: 409, condition: "Order not DRAFT for submit" }
  - { id: ERR_ORDER_NOT_REALLOCATABLE, http: 409, condition: "Order not in {BACKORDERED, ALLOCATED} for reallocate" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order not in {DRAFT, BACKORDERED, ALLOCATED} for cancel" }
  - { id: ERR_ORDER_NOT_ALLOCATED, http: 409, condition: "Order not ALLOCATED for shipment creation or pack" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 409, condition: "Order has zero lines at submit" }
  - { id: ERR_RESERVATION_NOT_HELD, http: 409, condition: "Reservation not HELD for release" }
  - { id: ERR_SHIPMENT_NOT_PACKABLE, http: 409, condition: "Shipment not CREATED for pack" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHABLE, http: 409, condition: "Shipment not PACKED for dispatch" }
  - { id: ERR_SHIPMENT_NOT_IN_TRANSIT, http: 409, condition: "Shipment not IN_TRANSIT for record-temperature/deliver" }
  - { id: ERR_SHIPMENT_NOT_ON_HOLD, http: 409, condition: "Shipment not EXCURSION_HOLD for resume-transit" }
  - { id: ERR_DELIVERY_BLOCKED_OPEN_EXCURSION, http: 409, condition: "Shipment has an OPEN excursion blocking delivery" }
  - { id: ERR_EXCURSION_ALREADY_OPEN, http: 409, condition: "A second out-of-band reading while an excursion of the shipment is still OPEN" }
  - { id: ERR_EXCURSION_NOT_OPEN, http: 409, condition: "Excursion not OPEN for disposition" }
  - { id: ERR_EXCURSION_NOT_RESOLVED, http: 409, condition: "resume-transit attempted while the excursion is not ACCEPTED" }
  - { id: ERR_STANDING_ORDER_NOT_ACTIVE, http: 409, condition: "Standing order not ACTIVE for pause" }
  - { id: ERR_STANDING_ORDER_NOT_PAUSED, http: 409, condition: "Standing order not PAUSED for resume" }
  - { id: ERR_STANDING_ORDER_TERMINAL, http: 409, condition: "Standing order already CANCELLED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement not ACTIVE for suspend/consumption" }
  - { id: ERR_AGREEMENT_NOT_SUSPENDED, http: 409, condition: "Agreement not SUSPENDED for reactivate" }
  - { id: ERR_AGREEMENT_ALREADY_CLOSED, http: 409, condition: "Agreement already CLOSED" }
  - { id: ERR_RECALL_NOT_DRAFT, http: 409, condition: "Recall not DRAFT for issue" }
  - { id: ERR_RECALL_NOT_CLOSABLE, http: 409, condition: "Recall not ISSUED for close" }
  - { id: ERR_RECALL_LOTS_PENDING, http: 409, condition: "A covered lot is not yet QUARANTINED or still holds reserved quantity at recall close" }
  - { id: ERR_KIT_NOT_DRAFT, http: 409, condition: "Kit not DRAFT for activate" }
  - { id: ERR_KIT_NOT_ACTIVE, http: 409, condition: "Kit not ACTIVE for retire/assembly-job creation/execute" }
  - { id: ERR_JOB_NOT_EXECUTABLE, http: 409, condition: "Job not PLANNED for execute" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "Job not PLANNED for cancel" }

  # --- Business: safety ---
  - { id: ERR_HAZMAT_ENDORSEMENT_INSUFFICIENT, http: 403, condition: "Customer hazmat_endorsement does not cover a line product's hazard_class at submit" }
  - { id: ERR_COLD_CHAIN_NOT_CERTIFIED, http: 403, condition: "Customer not cold_chain_certified but a line product requires_cold_chain at submit" }
  - { id: ERR_HAZMAT_WAREHOUSE_NOT_CERTIFIED, http: 409, condition: "Warehouse lacks hazmat_certified for a hazardous lot receipt or shipment" }
  - { id: ERR_HAZMAT_PRODUCT_LIMIT_EXCEEDED, http: 409, condition: "A line's quantity exceeds its product's max_qty_per_shipment at shipment creation" }
  - { id: ERR_HAZMAT_CLASS_LIMIT_EXCEEDED, http: 409, condition: "Per-class hazmat load exceeds its cap at shipment creation" }
  - { id: ERR_HAZMAT_TOTAL_LIMIT_EXCEEDED, http: 409, condition: "Aggregate hazmat load exceeds 50 units at shipment creation" }
  - { id: ERR_DRY_ICE_LIMIT_EXCEEDED, http: 409, condition: "coolant_units exceeds 20 for DRY_ICE" }
  - { id: ERR_PRODUCT_UNDER_RECALL, http: 409, condition: "Referenced product is covered by an ISSUED recall (submit / kit activate / consumption)" }
  - { id: ERR_RECALL_ACTIVE_FOR_LOT, http: 409, condition: "release-quarantine attempted while an ISSUED recall covers the lot" }

  # --- Business: temporal / constraint / referential / fiscal ---
  - { id: ERR_SHELF_LIFE_TOO_SHORT, http: 409, condition: "Stock exists for a line's product at the order's warehouse but every AVAILABLE lot fails the min-remaining-shelf-life gate at submit" }
  - { id: ERR_STANDING_ORDER_WINDOW_CONFLICT, http: 409, condition: "New standing-order window fails the 7-day buffer against an existing ACTIVE or PAUSED standing order for the same (customer, product)" }
  - { id: ERR_CONSIGNMENT_WINDOW_OVERLAP, http: 409, condition: "New agreement window overlaps an existing ACTIVE or SUSPENDED agreement for the same (customer, product) under half-open semantics" }
  - { id: ERR_STORAGE_ZONE_INCOMPATIBLE, http: 409, condition: "Zone class is warmer than the product's storage_requirement at lot receipt" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "occupied_units + quantity would exceed capacity_units at lot receipt" }
  - { id: ERR_ZONE_WAREHOUSE_MISMATCH, http: 409, condition: "storage_zone_id belongs to a different warehouse than warehouse_id at lot receipt" }
  - { id: ERR_ADJUSTMENT_BELOW_ZERO, http: 409, condition: "Adjustment delta would drive quantity_on_hand below zero" }
  - { id: ERR_KIT_COMPONENTS_EMPTY, http: 422, condition: "Kit activation with an empty components array" }
  - { id: ERR_KIT_STORAGE_MIXED, http: 422, condition: "Kit activation whose components do not all share one storage_requirement" }
  - { id: ERR_SHIPMENT_ALREADY_EXISTS, http: 409, condition: "The order already has a Shipment row" }
  - { id: ERR_CONSIGNMENT_CEILING_EXCEEDED, http: 409, condition: "Consumption would push consumed_quantity above ceiling_quantity" }
  - { id: ERR_CONSUMPTION_EXCEEDS_STOCK, http: 409, condition: "Consumption exceeds stocked_quantity - consumed_quantity" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Credit pre-check fails at submit" }
  - { id: ERR_KIT_COMPONENT_SHORTAGE, http: 409, condition: "FEFO waterfall cannot cover a component's required quantity at job execute" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "Customer close blocked by orders with status IN {DRAFT, ALLOCATED, BACKORDERED, PACKED, SHIPPED}" }
  - { id: ERR_OPEN_AGREEMENTS_EXIST, http: 409, condition: "Customer close blocked by an agreement with status == ACTIVE" }
  - { id: ERR_OUTSTANDING_BALANCE_NONZERO, http: 409, condition: "Customer close blocked by outstanding_balance_cents != 0" }
  - { id: ERR_OUTSTANDING_ABOVE_LIMIT, http: 409, condition: "Reactivate blocked because outstanding_balance_cents > credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Distribution network operator: warehouses, zones, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /lab/warehouses; POST /lab/warehouses/{id}/suspend|resume"
      - "POST /lab/storage-zones"
      - "POST /lab/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: CatalogManager
    description: "Catalog steward: products and kit definitions"
    identity: opaque
    exclusive_operations:
      - "POST /lab/products; POST /lab/products/{id}/discontinue"
      - "POST /lab/kits; POST /lab/kits/{id}/activate|retire"
    shared_operations:
      - "All GET endpoints"
  - name: InventoryClerk
    description: "Warehouse operator: lot receipt/adjustment, shipments, kit assembly, reservation release"
    identity: opaque
    exclusive_operations:
      - "POST /lab/lots; POST /lab/lots/{id}/adjustments"
      - "POST /lab/shipments; POST /lab/shipments/{id}/pack|dispatch|record-temperature|resume-transit|deliver"
      - "POST /lab/kit-assembly-jobs; POST /lab/kit-assembly-jobs/{id}/execute|cancel"
    shared_operations:
      - "POST /lab/reservations/{id}/release (shared with Customer)"
      - "All GET endpoints"
  - name: QualityManager
    description: "Quality and compliance officer: quarantine, recalls, excursion disposition"
    identity: opaque
    exclusive_operations:
      - "POST /lab/lots/{id}/quarantine; POST /lab/lots/{id}/release-quarantine"
      - "POST /lab/recalls; POST /lab/recalls/{id}/issue|close"
      - "POST /lab/excursions/{id}/disposition"
    shared_operations:
      - "All GET endpoints"
  - name: AccountManager
    description: "Commercial account owner: customers, payments, consignment agreements"
    identity: opaque
    exclusive_operations:
      - "POST /lab/customers; PATCH /lab/customers/{id}"
      - "POST /lab/customers/{id}/suspend|reactivate|close|payments"
      - "POST /lab/consignment-agreements; POST /lab/consignment-agreements/{id}/suspend|reactivate|close"
    shared_operations:
      - "POST /lab/consignment-agreements/{id}/consumption (shared with Customer)"
      - "All GET endpoints"
  - name: Customer
    description: "Laboratory account placing and managing its own orders and standing orders; X-User-ID must equal the CustomerAccount id"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /lab/orders; POST /lab/orders/{id}/submit|reallocate|cancel (own orders only)"
      - "POST /lab/standing-orders; POST /lab/standing-orders/{id}/pause|resume|cancel (own rows only)"
    shared_operations:
      - "POST /lab/reservations/{id}/release (own orders' reservations; shared with InventoryClerk)"
      - "POST /lab/consignment-agreements/{id}/consumption (own agreements; shared with AccountManager)"
      - "All GET endpoints (rows scoped to own customer_id where the entity has one)"
