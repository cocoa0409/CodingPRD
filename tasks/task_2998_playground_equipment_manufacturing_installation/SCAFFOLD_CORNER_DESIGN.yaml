          - errors.ERR_MODEL_DISCONTINUED
          - entities.ComponentModel.fields.lifecycle_status
        distinguishing_aspect: "A LEGACY model is still placeable (the placement gate rejects only UNCERTIFIED and DISCONTINUED), while the very next lifecycle hop to DISCONTINUED makes an otherwise identical placement fail 409 - so the gate reads lifecycle_status, not 'anything other than ACTIVE'."
