  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dual_control_beats_inventory_shortfall_on_coin_release
        grounds:
          - validations[priority=50]
          - validations[priority=78]
          - errors[ERR_DUAL_CONTROL_VIOLATION]
          - errors[ERR_INSUFFICIENT_COIN_INVENTORY]
          - state_machines.CoinOrder.APPROVED_FULL_to_RELEASED
        distinguishing_aspect: |
          Error-category pair business_safety (priority 50) versus business_fiscal
          (priority 78) on POST /coin-orders/{id}/release: the caller is both the
          approving user and short of on-hand boxes, and the safety check must win with
          ERR_DUAL_CONTROL_VIOLATION rather than ERR_INSUFFICIENT_COIN_INVENTORY.
        test_recipe:
          setup:
            - "Vault CV-09 OPEN with QUARTER inventory on_hand_boxes 10 and reserved_boxes 0."
            - "CustomerAccount ACC-9001 ACTIVE; CoinOrder for 3 QUARTER boxes approved by u-mgr-1 to APPROVED_FULL, so reserved_boxes is 3 and charge_cents is 150000."
            - "A shrinkage adjustment of -8 boxes then leaves QUARTER on_hand_boxes at 2, below the 3 allocated, and the vault version is re-read afterwards so the OCC check will pass."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-09", name: "Dual Control Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-9001", customer_name: "Quarter Quick Mart", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/vaults/${vault_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 10 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "QUARTER", boxes_requested: 3 } ] }
              as: CustomerAccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /cash-vault/coin-orders/${order_id}/approve"
              payload: { allow_partial: false }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { order_status: $.data.status, order_charge: $.data.charge_cents }
            - call: "POST /cash-vault/vaults/${vault_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: -8 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { qtr_on_hand: $.data.on_hand_boxes }
            - call: "GET /cash-vault/vaults/${vault_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { vault_v: $.data.version }
          trigger:
            - call: "POST /cash-vault/coin-orders/${order_id}/release"
              payload: { expected_vault_version: "${vault_v}" }
              as: VaultTeller
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${order_status} == APPROVED_FULL"
            - "${order_charge} == 150000"
            - "${qtr_on_hand} == 2"
            - "${err} == ERR_DUAL_CONTROL_VIOLATION"
            - "HTTP status of the trigger response == 409"
            - "CoinOrder.${order_id}.status == APPROVED_FULL"
            - "CoinOrder.${order_id}.released_by_user_id == null"
            - "VaultInventory for (${vault_id}, QUARTER).on_hand_boxes == 2"
            - "VaultInventory for (${vault_id}, QUARTER).reserved_boxes == 3"

      - name: machine_type_mismatch_beats_window_conflict_on_count_session_create
        grounds:
          - validations[priority=56]
          - validations[priority=60]
          - errors[ERR_MACHINE_TYPE_MISMATCH]
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different error-category pair from the coin-release instance: business_referential
          (priority 56) versus business_constraint (priority 60) on POST /count-sessions.
          A CURRENCY bag is scheduled onto a COIN_COUNTER during a window that also collides
          with a live session on that machine, and ERR_MACHINE_TYPE_MISMATCH must win.
        test_recipe:
          setup:
            - "Vault CV-10 OPEN; CustomerAccount ACC-1101; machine COIN-A of type COIN_COUNTER, AVAILABLE."
            - "Ticket MAN-1101 with 2 bags: S-1101 of bag_type COIN and S-1102 of bag_type CURRENCY, both VAULT_RECEIVED."
            - "A SCHEDULED CountSession already occupies COIN-A from 2026-08-03T09:00:00Z to 2026-08-03T10:00:00Z counting the COIN bag."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-10", name: "Mismatch Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-1101", customer_name: "Laundromat Coin Co", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/counting-machines"
              payload: { vault_id: "${vault_id}", machine_code: "COIN-A", machine_type: "COIN_COUNTER", status: "AVAILABLE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { mach_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", courier_manifest_number: "MAN-1101", declared_bag_count: 2 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { ticket_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-1101", bag_type: "COIN", declared_amount_cents: 50000, declared_note_count: 0, declared_coin_weight_grams: 12000 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { coin_bag_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-1102", bag_type: "CURRENCY", declared_amount_cents: 100000, declared_note_count: 100, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { cur_bag_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${coin_bag_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-1101" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${coin_bag_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-10-DOCK", observed_seal_number: "S-1101" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/sealed-bags/${cur_bag_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-1102" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${cur_bag_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-10-DOCK", observed_seal_number: "S-1102" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "GET /cash-vault/sealed-bags/${coin_bag_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { coin_bag_v: $.data.version }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${coin_bag_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_sealed_bag_version: "${coin_bag_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { coin_sess_id: $.data.id }
            - call: "GET /cash-vault/sealed-bags/${cur_bag_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
