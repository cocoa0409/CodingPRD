  - method: POST
    path: "/appellate/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Server boots with logical clock pinned at 2026-05-01T00:00:00Z; this endpoint overrides it. The default sits at or before every default fixture date so an unset clock is a fixed 'earliest' instant rather than drifting wall-clock."
    roles: [CourtAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutation"]

  - method: GET
    path: "/appellate/_clock/current_utc"
    description: "Read the current logical clock"
    roles: [CourtAdmin, Attorney, CourtClerk, ParalegalStaff]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted to invoke this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template id not found" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body-supplied FK id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in valid state for this transition" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Brief approver must differ from brief author (segregation of duties)" }
  - { id: ERR_NOT_ADMITTED, http: 403, condition: "Attorney not admitted to the case's court" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Action attempted after its governing deadline" }
  - { id: ERR_BRIEF_OVER_LIMIT, http: 422, condition: "Brief exceeds page or word limit for its type" }
  - { id: ERR_TOA_UNVERIFIED, http: 422, condition: "TOA contains unverified citations when court mandates e-filing" }
  - { id: ERR_RECORD_NOT_COMPLETE, http: 409, condition: "Record not COMPLETE/FILED, blocking brief e-file" }
  - { id: ERR_ARGUMENT_OVERLAP, http: 409, condition: "Proposed argument interval overlaps an existing SCHEDULED/HELD argument on the same court (half-open intervals)" }
  - { id: ERR_ARGUMENT_NOTICE_TOO_SHORT, http: 422, condition: "Argument scheduled inside the court's minimum notice window" }
  - { id: ERR_GRANT_DAYS_INVALID, http: 422, condition: "granted_days must satisfy 0 < granted_days <= requested_days" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on expected_<parent>_version" }
  - { id: ERR_SERVICE_INCOMPLETE, http: 422, condition: "Filing must serve at least one party; notice-of-appeal must serve all adverse parties" }
  - { id: ERR_DECISION_NOT_ISSUED, http: 409, condition: "Cannot file petition before a decision issues" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (court code, bar number, 1:1 child)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, invalid enum, or failed type check" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource already in a terminal state; no further transitions" }
  - { id: ERR_PAGINATION, http: 400, condition: "limit/offset out of range (limit must be 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CourtAdmin
    description: "Platform administrator who registers courts and attorneys; can also drive the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /appellate/courts"
      - "POST /appellate/attorneys"
      - "POST /appellate/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /appellate/cases"
      - "POST /appellate/cases/{id}/events"
      - "POST /appellate/cases/{id}/decisions"
      - "POST /appellate/briefing-schedules/{id}/vacate"

  - name: Attorney
    description: "Admitted lawyer; drafts briefs, files motions, designates record, files petitions"
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /appellate/cases/{id}/briefs"
      - "POST /appellate/briefs/{id}/submit-review"
      - "POST /appellate/briefs/{id}/approve"
      - "POST /appellate/briefs/{id}/return-draft"
      - "POST /appellate/briefs/{id}/efile"
      - "POST /appellate/records/{id}/designate"
      - "POST /appellate/records/{id}/revoke-designation"
      - "POST /appellate/records/{id}/file"
      - "POST /appellate/transcript-orders/{id}/file"
      - "POST /appellate/cases/{id}/extension-motions"
      - "POST /appellate/extension-motions/{id}/withdraw"
      - "POST /appellate/cases/{id}/petitions"
      - "POST /appellate/petitions/{id}/file"
      - "POST /appellate/petitions/{id}/withdraw"
      - "POST /appellate/oral-arguments/{id}/waive"
    shared_operations:
      - "POST /appellate/cases"
      - "POST /appellate/cases/{id}/events"
      - "POST /appellate/records/{id}/transcript-orders"
      - "POST /appellate/transcript-orders/{id}/cancel"
      - "POST /appellate/cases/{id}/filings"
      - "POST /appellate/cases/{id}/oral-arguments"
      - "POST /appellate/oral-arguments/{id}/log-moot"
      - "POST /appellate/toas/{id}/citations"
      - "POST /appellate/citations/{id}/verify"
      - "PATCH /appellate/briefs/{id}"
      - "GET reads across all resources"

  - name: CourtClerk
    description: "Court staff; accepts/rejects filings, schedules arguments, decides motions, enters decisions"
    identity: opaque
    exclusive_operations:
      - "POST /appellate/filings/{id}/accept"
      - "POST /appellate/filings/{id}/reject"
      - "POST /appellate/extension-motions/{id}/grant"
      - "POST /appellate/extension-motions/{id}/deny"
      - "POST /appellate/transcript-orders/{id}/begin-preparation"
      - "POST /appellate/transcript-orders/{id}/deliver"
      - "POST /appellate/briefs/{id}/strike"
      - "POST /appellate/oral-arguments/{id}/schedule"
      - "POST /appellate/oral-arguments/{id}/mark-held"
      - "POST /appellate/oral-arguments/{id}/continue"
      - "POST /appellate/petitions/{id}/grant"
      - "POST /appellate/petitions/{id}/deny"
    shared_operations:
      - "POST /appellate/cases/{id}/events"
      - "POST /appellate/cases/{id}/decisions"
      - "POST /appellate/cases/{id}/oral-arguments"
      - "POST /appellate/briefing-schedules/{id}/vacate"
      - "GET reads across all resources"

  - name: ParalegalStaff
    description: "Support staff; manages transcripts, citations, filings; cannot approve or e-file briefs"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /appellate/records/{id}/transcript-orders"
      - "POST /appellate/transcript-orders/{id}/cancel"
      - "POST /appellate/cases/{id}/filings"
      - "POST /appellate/toas/{id}/citations"
      - "POST /appellate/citations/{id}/verify"
      - "POST /appellate/oral-arguments/{id}/log-moot"
      - "GET reads across all resources"
