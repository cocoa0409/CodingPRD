              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
