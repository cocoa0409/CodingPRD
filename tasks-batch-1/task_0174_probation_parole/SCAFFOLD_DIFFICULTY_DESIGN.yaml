# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances each. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; ${var} closed by earlier captures.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lsi_r_actuarial_vs_clinical_override_level
        grounds:
          - calculations.lsi_r_scoring
          - entities.RiskAssessment.fields.derived_level
          - entities.RiskAssessment.fields.override_level
          - entities.Supervisee.fields.supervision_level
        distinguishing_aspect: "Identical domain_scores summing to 28 yield derived_level=MEDIUM under the actuarial_band variant but an effective supervision_level=MAXIMUM under the clinical_override variant — two valid levels on the RiskAssessment entity domain for the same inputs."
        test_recipe:
          setup:
            - "An Officer of role_type PROBATION exists."
            - "A PROBATION Supervisee exists in INTAKE."
            - "Two DRAFT LSI-R assessments exist with the SAME domain_scores (total 28): one with no override, one with override_level=MAXIMUM."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O One", badge_number: "B-1001", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S One", docket_number: "DK-1001", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 4, education_employment: 3, financial: 2, family_marital: 3, accommodation: 2, leisure_recreation: 3, companions: 3, alcohol_drug: 3, emotional_personal: 2, attitudes_orientation: 3 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_base_id: $.data.id, ra_base_derived: $.data.derived_level }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 4, education_employment: 3, financial: 2, family_marital: 3, accommodation: 2, leisure_recreation: 3, companions: 3, alcohol_drug: 3, emotional_personal: 2, attitudes_orientation: 3 }, override_level: "MAXIMUM", override_reason: "documented absconding risk" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_ovr_id: $.data.id }
          trigger:
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_ovr_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { eff_level: $.data.derived_level }
          assert:
            - "RiskAssessment.${ra_base_id}.derived_level == MEDIUM"
            - "RiskAssessment.${ra_ovr_id}.derived_level == MEDIUM"
            - "RiskAssessment.${ra_ovr_id}.override_level == MAXIMUM"
            - "Supervisee.${sup_id}.supervision_level == MAXIMUM"

      - name: payoff_forward_looking_vs_chronological_ledger
        grounds:
          - calculations.restitution_payoff_quote
          - entities.Supervisee.fields.fee_balance_cents
          - entities.FinancialObligation.fields.monthly_accrual_cents
          - entities.FinancialObligation.fields.recurring
        distinguishing_aspect: "For one recurring FEE (principal 5000, monthly 5000, created 2026-01-01) the chronological fee_balance_cents at clock 2026-03-01 is 15000 while the forward-looking payoff-quote at as_of 2026-06-01 is 30000 — same obligation on the FinancialObligation/Supervisee ledger domain, two divergent figures."
        test_recipe:
          setup:
            - "Clock set to 2026-01-01 when the recurring FEE obligation is created (created_at=2026-01-01)."
            - "A PROBATION Supervisee is ACTIVE with one recurring FEE obligation (principal 5000, monthly_accrual 5000)."
            - "Clock advanced to 2026-03-01 so the chronological ledger reflects 2 accrued months."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Two", badge_number: "B-1002", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Two", docket_number: "DK-1002", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/obligations"
              payload: { obligation_type: "FEE", principal_cents: 5000, monthly_accrual_cents: 5000, recurring: true }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "GET /supervisees/${sup_id}/payoff-quote?as_of=2026-06-01T00:00:00.000Z"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { proj_fee: $.data.projected_fee_cents }
          assert:
            - "Supervisee.${sup_id}.fee_balance_cents == 15000"
            - "payoff-quote.projected_fee_cents == 30000"
            - "payoff-quote.projected_total_cents == 30000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sanction_matrix_class_x_tier_nonlinear_selection
        grounds:
          - calculations.sanction_matrix
          - entities.Sanction.fields.sanction_type
          - entities.Sanction.fields.imposed_days
          - entities.Supervisee.fields.cumulative_violation_points
        distinguishing_aspect: "Mode (a): sanction_type is a non-linear function of >=3 inputs (violation_class, resulting cumulative tier, jail-day step) — a FELONY(+6) then a MISDEMEANOR(+4) reaching cumulative 10 selects JAIL_SHOCK with imposed_days=2, not the curfew the FELONY alone produced."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with cumulative_violation_points 0."
            - "A separate filing Officer and a judge whose id differs from the filer."
            - "Two FILED violations: one FELONY, one MISDEMEANOR."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Filer A", badge_number: "B-2001", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Comb1", docket_number: "DK-2001", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 36, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 5, education_employment: 4, financial: 4, family_marital: 4, accommodation: 4, leisure_recreation: 3, companions: 4, alcohol_drug: 4, emotional_personal: 4, attitudes_orientation: 4 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "FELONY", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_fel_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "MISDEMEANOR", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_mis_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/violations/${v_fel_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-1"
          trigger:
            - call: "POST /supervisees/${sup_id}/violations/${v_mis_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-1"
          assert:
            - "Supervisee.${sup_id}.cumulative_violation_points == 10"
            - "the Sanction auto-created for Violation.${v_mis_id} has sanction_type == JAIL_SHOCK"
            - "that Sanction.imposed_days == 2"

      - name: compliance_rate_ratio_times_100_then_round
        grounds:
          - calculations.compliance_rate
          - entities.CheckIn.fields.status
          - entities.CheckIn.fields.punctuality
          - entities.CourtReport.fields.snapshot
        distinguishing_aspect: "Mode (b): rounding order is pinned ratio*100 THEN round_half_up to 1dp — 2 ON_TIME of 3 terminal check-ins yields 66.7, which differs from round(2/3,3)*100 = 66.7 only because the formula commits to (2/3)*100=66.666...->66.7 rather than rounding the ratio first."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with three non-overlapping check-ins, all terminal: 2 ATTENDED ON_TIME, 1 MISSED."
            - "Clock positioned so attendances are within window and the missed one is past window close."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Comp", badge_number: "B-2002", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Comp", docket_number: "DK-2002", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T09:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-02-01T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci1_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/check-ins/${ci1_id}/attend"
              payload: { attended_at: "2026-02-01T09:30:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-02-02T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci2_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/check-ins/${ci2_id}/attend"
              payload: { attended_at: "2026-02-02T09:15:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-02-03T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-03T11:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins/${ci3_id}/mark-missed"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "GET /supervisees/${sup_id}/compliance"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { rate: $.data.compliance_rate }
          assert:
            - "compliance.compliance_rate == 66.7"
            - "CheckIn.${ci1_id}.punctuality == ON_TIME"
            - "CheckIn.${ci3_id}.status == MISSED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: violation_branching_fork_join_sustain_vs_dismiss
        grounds:
          - state_machines.Violation.FILED_to_SUSTAINED
          - state_machines.Violation.FILED_to_DISMISSED
          - state_machines.Violation.SUSTAINED_to_APPEALED
        distinguishing_aspect: "Violation is a branching fork-join on the Violation entity: FILED forks to SUSTAINED (points + sanction side-effects) or DISMISSED (no side-effects), and SUSTAINED can re-enter via APPEALED — divergent side-effect sets per branch, not a linear pipeline."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with two FILED violations."
            - "A judge id distinct from the filing officer."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Br", badge_number: "B-3001", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Br", docket_number: "DK-3001", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "TECHNICAL", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_sus_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "TECHNICAL", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_dis_id: $.data.id }
          trigger:
            - call: "POST /supervisees/${sup_id}/violations/${v_sus_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-2"
            - call: "POST /supervisees/${sup_id}/violations/${v_dis_id}/dismiss"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-2"
          assert:
            - "Violation.${v_sus_id}.status == SUSTAINED"
            - "Violation.${v_sus_id}.points == 2"
            - "Violation.${v_dis_id}.status == DISMISSED"
            - "Violation.${v_dis_id}.points == 0"
            - "Supervisee.${sup_id}.cumulative_violation_points == 2"

      - name: supervisee_revocation_cycle_absconded_rebound
        grounds:
          - state_machines.Supervisee.ACTIVE_to_ABSCONDED
          - state_machines.Supervisee.ABSCONDED_to_ACTIVE
          - state_machines.Supervisee.REVOCATION_PENDING_to_ACTIVE
        distinguishing_aspect: "Supervisee lifecycle is cyclic on a different entity than Violation: ACTIVE->ABSCONDED->ACTIVE and ACTIVE->REVOCATION_PENDING->ACTIVE (reinstate) are revision loops back to ACTIVE, not a one-way pipeline."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Cyc", badge_number: "B-3002", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Cyc", docket_number: "DK-3002", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/abscond"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/return-to-supervision"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { st_after: $.data.status }
          assert:
            - "Supervisee.${sup_id}.status == ACTIVE"
            - "exactly one Violation with violation_class==ABSCOND exists for Supervisee.${sup_id} and its status == FILED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sustain_cascade_points_sanction_revocation_pending
        grounds:
          - state_machines.Violation.FILED_to_SUSTAINED
          - calculations.sanction_matrix
          - state_machines.Supervisee.ACTIVE_to_REVOCATION_PENDING
          - entities.Supervisee.fields.status
        distinguishing_aspect: "Depth-3 cascade from the sustain trigger: sustaining the violation assigns points (A->B), the new cumulative tier auto-creates a REVOCATION_REFERRAL Sanction (B->C), and that sanction creation itself flips Supervisee ACTIVE->REVOCATION_PENDING (C->D) — each link caused by the previous."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee with cumulative_violation_points 6 (one prior SUSTAINED FELONY)."
            - "A second FILED FELONY violation, filed by an officer distinct from the judge."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Casc", badge_number: "B-4001", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "S Casc", docket_number: "DK-4001", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 36, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 5, education_employment: 4, financial: 4, family_marital: 4, accommodation: 4, leisure_recreation: 3, companions: 4, alcohol_drug: 4, emotional_personal: 4, attitudes_orientation: 4 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "FELONY", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/violations/${v1_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-3"
            - call: "POST /supervisees/${sup_id}/violations"
              payload: { violation_class: "FELONY", filed_by_officer_id: "${off_id}" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /supervisees/${sup_id}/violations/${v2_id}/sustain"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-3"
              captures: { sup_status: $.data.status }
          assert:
            - "Supervisee.${sup_id}.cumulative_violation_points == 12"
            - "the Sanction for Violation.${v2_id} has sanction_type == REVOCATION_REFERRAL"
            - "Supervisee.${sup_id}.status == REVOCATION_PENDING"

      - name: adopt_supersede_level_drop_suspends_condition
        grounds:
          - state_machines.RiskAssessment.DRAFT_to_ADOPTED
          - state_machines.RiskAssessment.ADOPTED_to_SUPERSEDED
          - entities.Supervisee.fields.supervision_level
          - state_machines.SupervisionCondition.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Depth-3 cascade from a DIFFERENT trigger (adopt): adopting a lower-band assessment supersedes the prior ADOPTED one (A->B), the supersede recomputes Supervisee.supervision_level downward (B->C), and the lower level force-suspends an ACTIVE condition whose minimum_level_required now exceeds it (C->D)."
        test_recipe:
          setup:
            - "An ACTIVE PROBATION Supervisee whose first adopted assessment is MAXIMUM (total 40)."
            - "An ACTIVE SupervisionCondition with minimum_level_required=MEDIUM."
            - "A second DRAFT assessment scoring ADMINISTRATIVE (total 10)."
          setup_api_calls:
