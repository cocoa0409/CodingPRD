# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Escrow Holdback & Repair Escrow Administration
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: escrow_file_creation_defaults
        claim_type: creation
        grounds: [entities.EscrowFile, endpoints.POST /escrow/files]
        distinguishing_aspect: "Creating a file returns 201 with input fields echoed, status OPEN, version 1; GET re-read returns identical stored data."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
          trigger:
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1", insurer_user_id: "insurer_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id, f_status: $.data.status, f_version: $.data.version }
            - call: "GET /escrow/files/${file_id}"
              as: EscrowOfficer
              captures: { g_status: $.data.status }
          assert:
            - "f_status == OPEN and f_version == 1"
            - "g_status == OPEN and stored buyer_user_id == 'buyer_1', insurer_user_id == 'insurer_1'"
            - "meta.api_request_id present and response_type == 'object' in both responses"

      - name: holdback_creation_computes_amount_and_funding
        claim_type: computed_fields
        grounds: [entities.Holdback.fields.holdback_amount_cents, entities.Holdback.fields.trust_balance_cents, calculations.holdback_sizing]
        distinguishing_aspect: "Create recomputes the amount server-side (230000 from 200000 @15%), posts FUNDING ledger entry seq 1, and derives effective_deadline == work_deadline with zero granted days."
        test_recipe:
          setup: ["escrow file exists (lender only)"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id, amt: $.data.holdback_amount_cents, bal: $.data.trust_balance_cents }
            - call: "GET /escrow/holdbacks/${hb_id}/ledger-entries"
              as: EscrowOfficer
              captures: { le_type: "$.data[0].entry_type", le_amt: "$.data[0].amount_cents", le_run: "$.data[0].running_balance_cents", le_seq: "$.data[0].seq" }
          assert:
            - "amt == 230000 and bal == 230000 (input-supplied computed fields would be rejected/ignored)"
            - "le_type == FUNDING, le_amt == 230000, le_run == 230000, le_seq == 1"
            - "Holdback.${hb_id}: status == DRAFT, granted_extension_days == 0, effective_deadline_date == '2026-09-15', insurer_approval_required == false, lender_approval_required == true, disbursement_frozen == false, closeout_status == NOT_READY"

      - name: holdback_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent id yields 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
          trigger:
            - call: "GET /escrow/holdbacks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"
            - "response_type == 'error' and data.message is present"

      - name: holdback_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "funding_source outside its enum is rejected at input-shape priority before any state or business rule."
        test_recipe:
          setup: ["escrow file exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SIDE_POCKET", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (http 400)"

      - name: holdback_create_contingency_bounds
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.Holdback.fields.contingency_pct]
        distinguishing_aspect: "contingency_pct bounds are inclusive: 9 and 26 rejected, 10 accepted (boundary values 10 and 25 pass)."
        test_recipe:
          setup: ["escrow file exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 9, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { err_low: $.data.error_id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 26, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { err_high: $.data.error_id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 10, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { ok_amt: $.data.holdback_amount_cents }
          assert:
            - "err_low == ERR_VALIDATION and err_high == ERR_VALIDATION"
            - "ok_amt == 220000 (boundary value 10 accepted; 200000 x 1.10)"

      - name: holdback_create_deadline_after_hard_stop_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.Holdback.fields.hard_stop_date]
        distinguishing_aspect: "work_deadline_date > hard_stop_date is an input-shape error, not a temporal-window error."
        test_recipe:
          setup: ["escrow file exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-11-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: holdback_create_unknown_computed_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "Sending the server-computed trust_balance_cents in the create body is an unknown-field ERR_VALIDATION, not silently ignored — computed fields are server-owned."
        test_recipe:
          setup: ["escrow file exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true, trust_balance_cents: 1 }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (client may not set computed ledger fields)"

      - name: ledger_entry_immutable_shape
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields false: responses carry id and created_at but no version/updated_at, and the surface exposes no update/delete endpoint for it."
        test_recipe:
          setup: ["one funded holdback exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
          trigger:
            - call: "GET /escrow/holdbacks/${hb_id}/ledger-entries"
              as: EscrowOfficer
              captures: { le_id: "$.data[0].id" }
          assert:
            - "Entry ${le_id} JSON has keys subset of {id, created_at, holdback_id, seq, entry_type, amount_cents, running_balance_cents, memo} — no version, no updated_at"
            - "Entry order is seq ASC"

      - name: subresource_lists_scoped_to_parent
        claim_type: parent_relationships
        grounds: [entities.Holdback.fields.escrow_file_id, "endpoints.GET /escrow/files/{id}/holdbacks"]
        distinguishing_aspect: "The reverse-reachability list under a file returns exactly that file's holdbacks; a second file's holdback never leaks into the first file's listing."
        test_recipe:
          setup: ["two files, one holdback each"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_a: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_a}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_a: $.data.id }
            - call: "POST /escrow/files"
              payload: { property_address: "2 Cedar Ln", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_b: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_b}", repair_scope: "Fence", repair_estimate_cents: 50000, contingency_pct: 10, funding_source: "BUYER_DEPOSIT", overrun_responsibility: "SELLER", expiration_terms: "RELEASE_TO_BUYER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: false }
              as: EscrowOfficer
              captures: { hb_b: $.data.id }
          trigger:
            - call: "GET /escrow/files/${file_a}/holdbacks"
              as: EscrowOfficer
              captures: { first_id: "$.data[0].id", first_scope: "$.data[0].repair_scope" }
          assert:
            - "List for ${file_a} has total_count == 1 and first_id == ${hb_a} (scope 'Roof'); ${hb_b} absent"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_non_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Holdback.DRAFT_to_PENDING_APPROVALS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second submit on a PENDING_APPROVALS holdback is rejected; the first submit's approvals remain the only REQUESTED set."
        test_recipe:
          setup: ["holdback created and submitted once"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/submit"
              payload: {}
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET approvals shows exactly 1 REQUESTED approval (no duplicate fan-out)"

      - name: amend_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Holdback, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Amend is legal only from DRAFT/PENDING_APPROVALS; from ACTIVE it fails with ERR_INVALID_STATE even when the OCC version is current (proves OCC passes first and the state gate rejects)."
        test_recipe:
          setup: ["ACTIVE holdback (lender-only file)"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_l}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { hb_v: $.data.version }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/amend"
              payload: { expected_holdback_version: "${hb_v}", repair_scope: "Bigger scope" }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (not ERR_STALE_VERSION — version was current)"

      - name: expire_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Holdback.ACTIVE_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Expire requires ACTIVE; a DRAFT holdback past its deadline date still cannot be expired (clock is beyond deadline to isolate the state gate)."
        test_recipe:
          setup: ["DRAFT holdback; clock beyond its deadline"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: EscrowOfficer }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/expire"
              payload: {}
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (not ERR_NOT_EXPIRED — the date gate is satisfied, the state gate is not)"

      - name: close_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Holdback, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Close from DRAFT fails with ERR_INVALID_STATE rather than ERR_CLOSE_NOT_READY (close is only defined from ACTIVE/EXPIRED)."
        test_recipe:
          setup: ["DRAFT holdback"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/close"
              payload: {}
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: double_approval_decide_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Approval, "errors[ERR_APPROVAL_NOT_PENDING]"]
        distinguishing_aspect: "Deciding an already-APPROVED approval fails with ERR_APPROVAL_NOT_PENDING; the earlier decision's pinned version is untouched."
        test_recipe:
          setup: ["submitted holdback; lender approval APPROVED (holdback auto-ACTIVE, lender-only file)"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_id}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
