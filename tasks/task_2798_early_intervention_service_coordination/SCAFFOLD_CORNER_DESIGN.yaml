# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index)
# Task 2798 — Early Intervention Service Coordination
#
# Walks references/claim-extraction-guide.md section by section against
# SCAFFOLD.yaml §1.1-§1.7 and emits one instance per applicable claim row.
# Claims that are already asserted by a §1.8 instance carry an
# `excluded_because:` stub naming that instance and carry no test_recipe.
#
# Every setup chain starts from an empty database and drives state only through
# §1.5 endpoints. The logical clock reads 2026-08-01T00:00:00Z before the first
# POST /_clock/set_current_utc, so every chain sets it explicitly first.
#
# Recurring literals used below (all pre-computed from the §1.3 formulas):
#   child dob 2024-06-15            -> third_birthday_date 2027-06-15
#   referral received 2026-03-02    -> statutory_deadline_date 2026-04-16
#   PRE_PLAN stage weight           -> case_weight_points 1.50
#   ACTIVE_SERVICES stage weight    -> case_weight_points 1.00
#   household_size 4                -> fpl_threshold_cents 3245000
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: child_creation_returns_computed_third_birthday_and_zero_referrals
        claim_type: creation
        grounds:
          - entities.Child
          - entities.Child.fields.third_birthday_date
          - entities.Child.fields.active_referral_count
          - endpoints[POST /ei/children]
        distinguishing_aspect: |
          Plain creation of the root entity: all five input fields echo back, the two computed fields
          are derived at creation (third_birthday_date = dob + 3 years, active_referral_count = 0) and
          the common fields appear with version 1. No other instance asserts the fresh-row shape of
          Child.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.first_name == \"Ada\" and response.data.last_name == \"Nolan\""
            - "response.data.date_of_birth == \"2024-06-15\""
            - "response.data.county_code == \"CNT_A\" and response.data.primary_language == \"EN\""
            - "response.data.third_birthday_date == \"2027-06-15\""
            - "response.data.active_referral_count == 0"
            - "response.data.id is a non-empty string and response.data.version == 1"
            - "response.data.created_at and response.data.updated_at are present ISO-8601 timestamps"

      - name: child_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Child
          - endpoints[GET /ei/children/{childId}]
        distinguishing_aspect: |
          Read-back claim: GET /ei/children/{childId} returns exactly the row POST created, including
          the computed third_birthday_date and version 1 with no side effect on the row. The creation
          instance asserts the POST response only.
        test_recipe:
          setup:
            - "One child registered at clock 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /ei/children/${child_id}"
              as: IntakeSpecialist
          assert:
            - "HTTP status == 200"
            - "response.data.id == \"${child_id}\""
            - "response.data.last_name == \"Nolan\" and response.data.date_of_birth == \"2024-06-15\""
            - "response.data.third_birthday_date == \"2027-06-15\""
            - "response.data.active_referral_count == 0"
            - "response.data.version == 1, so a read never bumps the version counter"

      - name: child_third_birthday_leap_day_anniversary_falls_on_feb_28
        claim_type: computed_fields
        grounds:
          - entities.Child.fields.third_birthday_date
          - endpoints[POST /ei/children]
        distinguishing_aspect: |
          The one calendar edge in the third_birthday_date derivation: a child born on 2024-02-29 has
          no 2027-02-29, and §1.1 pins the anniversary to 2027-02-28 rather than 2027-03-01. A
          naive date-add library that rolls forward fails only this instance.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/children"
              payload: { first_name: "Rue", last_name: "Okafor", date_of_birth: "2024-02-29", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
            - call: "POST /ei/children"
              payload: { first_name: "Milo", last_name: "Okafor", date_of_birth: "2024-03-01", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
          assert:
            - "First trigger call: HTTP 201 and response.data.third_birthday_date == \"2027-02-28\", NOT \"2027-03-01\""
            - "Second trigger call: HTTP 201 and response.data.third_birthday_date == \"2027-03-01\""
            - "The two children therefore have third_birthday_date values one day apart even though their births are one day apart across a leap boundary"

      - name: referral_creation_applies_declared_defaults_and_statutory_deadline
        claim_type: defaults
        grounds:
          - entities.Referral.fields.interpreter_required
          - entities.Referral.fields.eligibility_status
          - entities.Referral.fields.initial_timeline_status
          - entities.Referral.fields.statutory_deadline_date
          - entities.Child.fields.active_referral_count
          - endpoints[POST /ei/referrals]
        distinguishing_aspect: |
          Every §1.1 Referral field carrying a `default:` is asserted after an intake that omits the
          only optional input: interpreter_required false, eligibility_status PENDING,
          initial_timeline_status IN_PROGRESS, coordinator_id null, case_weight_points 0 (no
          coordinator yet), monthly_contact_status NOT_APPLICABLE and service_gap_flag false, plus the
          45-day deadline 2026-03-02 + 45 = 2026-04-16.
        test_recipe:
          setup:
            - "One child (dob 2024-06-15) registered at clock 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit" }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "GET /ei/children/${child_id}"
              as: IntakeSpecialist
          assert:
            - "First trigger call: HTTP status == 201"
            - "response.data.interpreter_required == false (omitted input takes the declared default)"
            - "response.data.status == \"INTAKE\" and response.data.eligibility_status == \"PENDING\""
            - "response.data.initial_timeline_status == \"IN_PROGRESS\""
            - "response.data.statutory_deadline_date == \"2026-04-16\""
            - "response.data.coordinator_id == null and response.data.assignment_date == null"
            - "response.data.case_weight_points == 0 (no coordinator has been assigned yet)"
            - "response.data.excluded_delay_days == 0 and response.data.gross_elapsed_days == 0 and response.data.net_elapsed_days == 0"
            - "response.data.monthly_contact_status == \"NOT_APPLICABLE\" and response.data.service_gap_flag == false"
            - "response.data.version == 1"
            - "Second trigger call: response.data.active_referral_count == 1, so the parent counter was recomputed in the same request"

      - name: coordinator_creation_defaults_to_active_with_zero_aggregates
        claim_type: defaults
        grounds:
          - entities.ServiceCoordinator.fields.status
          - entities.ServiceCoordinator.fields.weighted_caseload_points
          - entities.ServiceCoordinator.fields.active_case_count
          - entities.ServiceCoordinator.fields.utilization_ratio
          - endpoints[POST /ei/service-coordinators]
        distinguishing_aspect: |
          The other defaults instance covers Referral; this one covers the only entity whose `status`
          is an INPUT with a default (ServiceCoordinator), and pins all three caseload aggregates to 0
          on a coordinator with no caseload, including utilization_ratio 0 rather than a division by
          the ceiling.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP status == 201 and response.data.status == \"ACTIVE\" (omitted optional input)"
            - "response.data.max_weighted_caseload_points == 12.00"
            - "response.data.weighted_caseload_points == 0 and response.data.active_case_count == 0"
            - "response.data.utilization_ratio == 0"
            - "Second trigger call: response.data.caseload_posture == \"OPEN\" and response.data.headroom_points == 12.00"

      - name: referral_listing_paginates_and_filters_by_child
        claim_type: listing
        grounds:
          - endpoints[GET /ei/referrals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The only instance that exercises the list envelope: three intakes, limit/offset paging with
          total_count and has_more, and the child_id filter narrowing the same collection to one row.
          Every other listing use in this file is a single-row filtered read.
        test_recipe:
          setup:
            - "Three children each with one INTAKE referral, all in county CNT_A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child1_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ben", last_name: "Oyelaran", date_of_birth: "2024-07-01", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Cai", last_name: "Petrov", date_of_birth: "2024-08-12", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child3_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay" }
              as: IntakeSpecialist
              captures: { ref1_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "HOSPITAL", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "NICU graduate follow-up" }
              as: IntakeSpecialist
              captures: { ref2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child3_id}", primary_referral_source: "PARENT", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Parent concern about motor milestones" }
              as: IntakeSpecialist
              captures: { ref3_id: $.data.id }
          trigger:
            - call: "GET /ei/referrals?limit=2&offset=0"
              as: ProgramAdmin
            - call: "GET /ei/referrals?limit=2&offset=2"
              as: ProgramAdmin
            - call: "GET /ei/referrals?child_id=${child2_id}"
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP 200, response.response_type == \"array\", len(response.data) == 2, response.meta.total_count == 3, response.meta.has_more == true, response.meta.limit == 2, response.meta.offset == 0"
            - "Second trigger call: len(response.data) == 1, response.meta.total_count == 3, response.meta.has_more == false"
            - "The two pages together contain exactly the three referral ids ${ref1_id}, ${ref2_id} and ${ref3_id} with no duplicates"
            - "Third trigger call: len(response.data) == 1, response.meta.total_count == 1 and response.data[0].id == \"${ref2_id}\""

      - name: referral_listing_with_zero_limit_returns_400
        claim_type: type_constraints
        grounds:
          - validations[priority 4 -> ERR_INVALID_PAGINATION]
          - endpoints[GET /ei/referrals]
        distinguishing_aspect: |
          The pagination guard is its own §1.4 rule (priority 4) separate from the body validator at
          priority 3: limit must be an integer of at least 1, so limit=0 is rejected with
          ERR_INVALID_PAGINATION (400) and not with ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One child with one INTAKE referral."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay" }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
          trigger:
            - call: "GET /ei/referrals?limit=0&offset=0"
              as: ProgramAdmin
            - call: "GET /ei/referrals?limit=1&offset=-1"
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP status == 400 and response.data.error_id == \"ERR_INVALID_PAGINATION\""
            - "Second trigger call: HTTP status == 400 and response.data.error_id == \"ERR_INVALID_PAGINATION\""
            - "No referral row is created, deleted or modified by either rejected read"

      - name: unknown_identifiers_return_entity_scoped_not_found
        claim_type: not_found
        grounds:
          - validations[priority 5 -> ERR_CHILD_NOT_FOUND]
          - validations[priority 6 -> ERR_REFERRAL_NOT_FOUND]
          - validations[priority 7 -> ERR_COORDINATOR_NOT_FOUND]
          - validations[priority 8 -> ERR_ASSESSMENT_NOT_FOUND]
          - validations[priority 9 -> ERR_IFSP_NOT_FOUND]
          - validations[priority 10 -> ERR_IFSP_SERVICE_NOT_FOUND]
          - validations[priority 11 -> ERR_PROVIDER_NOT_FOUND]
          - validations[priority 12 -> ERR_AUTHORIZATION_NOT_FOUND]
          - validations[priority 13 -> ERR_VISIT_NOT_FOUND]
          - validations[priority 14 -> ERR_COST_SHARE_NOT_FOUND]
          - validations[priority 15 -> ERR_TRANSITION_PLAN_NOT_FOUND]
        distinguishing_aspect: |
          Eleven entity types, eleven distinct 404 error ids from one unknown UUID: the implementation
          must not collapse them into a single generic ERR_NOT_FOUND, and the existence rules must run
          before the state, safety and fiscal families (an unknown assessment id returns
          ERR_ASSESSMENT_NOT_FOUND even though the body would also fail later rules).
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; every id below is a syntactically valid UUID that was never created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /ei/children/9f0c7a52-6b1e-4c8d-9a3f-000000000001"
              as: IntakeSpecialist
            - call: "GET /ei/referrals/9f0c7a52-6b1e-4c8d-9a3f-000000000002"
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/9f0c7a52-6b1e-4c8d-9a3f-000000000003"
              as: ProgramAdmin
            - call: "POST /ei/assessments/9f0c7a52-6b1e-4c8d-9a3f-000000000004/complete"
              payload: { completion_date: "2026-03-02", eligibility_recommendation: "ELIGIBLE" }
              as: Evaluator
            - call: "GET /ei/ifsps/9f0c7a52-6b1e-4c8d-9a3f-000000000005"
              as: ProgramAdmin
            - call: "GET /ei/ifsp-services/9f0c7a52-6b1e-4c8d-9a3f-000000000006"
              as: ProgramAdmin
            - call: "GET /ei/providers/9f0c7a52-6b1e-4c8d-9a3f-000000000007"
              as: ProgramAdmin
            - call: "GET /ei/provider-authorizations/9f0c7a52-6b1e-4c8d-9a3f-000000000008"
              as: ProgramAdmin
            - call: "GET /ei/service-visits/9f0c7a52-6b1e-4c8d-9a3f-000000000009"
              as: ProgramAdmin
            - call: "GET /ei/cost-shares/9f0c7a52-6b1e-4c8d-9a3f-00000000000a"
              as: FiscalOfficer
            - call: "POST /ei/transition-plans/9f0c7a52-6b1e-4c8d-9a3f-00000000000b/notify-lea"
              payload: { notification_date: "2026-03-02", family_opt_out: false, lea_code: "LEA_NORTH" }
              as: ServiceCoordinator
              as_user_id: "9f0c7a52-6b1e-4c8d-9a3f-0000000000ff"
          assert:
            - "Trigger 1: HTTP 404 with response.data.error_id == \"ERR_CHILD_NOT_FOUND\""
            - "Trigger 2: HTTP 404 with response.data.error_id == \"ERR_REFERRAL_NOT_FOUND\""
            - "Trigger 3: HTTP 404 with response.data.error_id == \"ERR_COORDINATOR_NOT_FOUND\""
            - "Trigger 4: HTTP 404 with response.data.error_id == \"ERR_ASSESSMENT_NOT_FOUND\""
            - "Trigger 5: HTTP 404 with response.data.error_id == \"ERR_IFSP_NOT_FOUND\""
            - "Trigger 6: HTTP 404 with response.data.error_id == \"ERR_IFSP_SERVICE_NOT_FOUND\""
            - "Trigger 7: HTTP 404 with response.data.error_id == \"ERR_PROVIDER_NOT_FOUND\""
            - "Trigger 8: HTTP 404 with response.data.error_id == \"ERR_AUTHORIZATION_NOT_FOUND\""
            - "Trigger 9: HTTP 404 with response.data.error_id == \"ERR_VISIT_NOT_FOUND\""
            - "Trigger 10: HTTP 404 with response.data.error_id == \"ERR_COST_SHARE_NOT_FOUND\""
            - "Trigger 11: HTTP 404 with response.data.error_id == \"ERR_TRANSITION_PLAN_NOT_FOUND\""
            - "Every response carries the §1.0 error envelope with response_type == \"error\" and a non-empty message"

      - name: child_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - validations[priority 3 -> ERR_INVALID_REQUEST]
          - entities.Child.fields.last_name
          - endpoints[POST /ei/children]
        distinguishing_aspect: |
          Each `source: input` field without a default is mandatory: omitting last_name on
          POST /ei/children returns ERR_INVALID_REQUEST (400) and creates nothing, while the optional
          referral field interpreter_required may be omitted (asserted by the defaults instance).
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z; no children exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ei/children"
              payload: { first_name: "Ada", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"] }
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP status == 400 with response.data.error_id == \"ERR_INVALID_REQUEST\" (last_name missing)"
            - "Second trigger call: HTTP status == 400 with response.data.error_id == \"ERR_INVALID_REQUEST\" (max_weighted_caseload_points missing)"
            - "GET /ei/children/{any id} still returns ERR_CHILD_NOT_FOUND: no partial row was written by either rejected call"

      - name: referral_invalid_enum_and_out_of_range_values_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority 3 -> ERR_INVALID_REQUEST]
          - entities.Referral.fields.primary_referral_source
          - entities.ServiceCoordinator.fields.max_weighted_caseload_points
          - entities.IFSPService.fields.unit_rate_cents
        distinguishing_aspect: |
          Domain enforcement rather than presence enforcement: an out-of-domain enum token, a numeric
          ceiling below the declared 1.00 minimum and an integer above the declared range each fail at
          priority 3 with the same error id, before any existence or business rule can run.
        test_recipe:
          setup:
            - "One child registered so that the referral body is otherwise valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "FRIEND_OF_FAMILY", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay" }
              as: IntakeSpecialist
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 0.50 }
              as: ProgramAdmin
          assert:
            - "First trigger call: HTTP status == 400 with response.data.error_id == \"ERR_INVALID_REQUEST\" because FRIEND_OF_FAMILY is outside the primary_referral_source enum"
            - "Second trigger call: HTTP status == 400 with response.data.error_id == \"ERR_INVALID_REQUEST\" because 0.50 is below the declared 1.00 floor for max_weighted_caseload_points"
            - "GET /ei/children/${child_id} still reports active_referral_count == 0 after the rejected intake"

      - name: computed_and_system_fields_supplied_by_the_caller_are_rejected
        claim_type: system_fields
        grounds:
          - validations[priority 3 -> ERR_INVALID_REQUEST]
          - entities.Child.fields.third_birthday_date
          - entities.Referral.fields.status
          - entities.Referral.fields.coordinator_id
          - endpoints[POST /ei/children]
          - endpoints[POST /ei/referrals]
        distinguishing_aspect: |
          §1.5 `input:` lists are closed: a caller cannot seed a computed field (third_birthday_date)
          or a system field (Referral.status, Referral.coordinator_id) because priority 3 rejects
          unknown body keys outright rather than silently ignoring them.
        test_recipe:
          setup:
            - "One child registered so that the referral body is otherwise valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/children"
