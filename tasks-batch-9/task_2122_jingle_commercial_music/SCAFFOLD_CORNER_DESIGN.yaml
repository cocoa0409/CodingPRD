# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_project_creation_seeds_the_full_budget_ledger
        claim_type: Creation
        grounds:
          - entities.Project.fields.available_cents
          - entities.Project.fields.budget_posture
          - endpoints[POST /projects]
        distinguishing_aspect: "A brand-new Project answers 201 with status DRAFT, version 1, committed_cents 0, spent_cents 0, available_cents equal to budget_cents, budget_posture HEALTHY and status_before_hold null."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default"
            - "One Client registered"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-001", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 1200000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Project.${pj}.status == DRAFT"
            - "Project.${pj}.version == 1"
            - "Project.${pj}.budget_cents == 1200000"
            - "Project.${pj}.available_cents == 1200000"
            - "Project.${pj}.committed_cents == 0"
            - "Project.${pj}.spent_cents == 0"
            - "Project.${pj}.budget_posture == HEALTHY"
            - "Project.${pj}.status_before_hold == null"

      - name: corner_unknown_project_id_returns_project_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=20]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no stored Project must produce ERR_PROJECT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-002", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
          trigger:
            - call: "GET /projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MusicHouseProducer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == 'ERR_PROJECT_NOT_FOUND'"

      - name: corner_project_create_without_budget_cents_is_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /projects]
        distinguishing_aspect: "budget_cents is source: input with no default, so omitting it must produce ERR_INVALID_REQUEST with HTTP 400 and create no Project row."
        test_recipe:
          setup:
            - "One Client registered, no Projects"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-003", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /projects?client_id=${cl} -> total_count == 0"

      - name: corner_studio_room_status_and_musician_clearance_defaults
        claim_type: Defaults
        grounds:
          - entities.StudioRoom.fields.status
          - entities.Musician.fields.afm_member_status
        distinguishing_aspect: "Omitting status on POST /studio-rooms stores ACTIVE, and a freshly created Musician always starts NON_UNION because afm_member_status is source: system with default NON_UNION."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /studio-rooms"
              payload: { name: "Room D", hourly_rate_cents: 25000, capacity_players: 4 }
              as: MusicHouseProducer
              captures: { rd: $.data.id }
            - call: "POST /musicians"
              payload: { full_name: "Ivo Blake", instrument: "CELLO", scale_hourly_cents: 7000 }
              as: MusicHouseProducer
              captures: { mi: $.data.id }
          assert:
            - "StudioRoom.${rd}.status == ACTIVE"
            - "Musician.${mi}.afm_member_status == NON_UNION"
            - "Musician.${mi}.version == 1"

      - name: corner_demo_list_paginates_and_filters_by_project
        claim_type: Listing
        grounds:
          - endpoints[GET /demos]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three demos on one Project, GET /demos filtered by project_id with limit 2 and offset 0 returns exactly 2 items, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Project in IN_DEMO with an APPROVED brief and budget_cents 4000000"
            - "Three composers, each holding one DRAFT demo of 100000 cents on that Project"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-004", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /composers"
              payload: { display_name: "Ben Cole", pro_affiliation: "BMI" }
              as: MusicHouseProducer
              captures: { cpb: $.data.id }
            - call: "POST /composers"
              payload: { display_name: "Cass Iver", pro_affiliation: "SESAC" }
              as: MusicHouseProducer
              captures: { cpc: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut Two", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpb}"
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut Three", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpc}"
          trigger:
            - call: "GET /demos"
              payload: { project_id: "${pj}", limit: 2, offset: 0 }
              as: MusicHouseProducer
          assert:
            - "HTTP status == 200 and response_type == 'array'"
            - "meta/pagination total_count == 3"
            - "has_more == true"
            - "len(data) == 2"
            - "GET /demos?composer_id=${cpb} -> total_count == 1"

      - name: corner_afm_clearance_with_unknown_enum_member_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Musician.fields.afm_member_status
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "afm_member_status accepts only SIGNATORY_CLEARED, NON_UNION or SUSPENDED, so 'GOLD_CARD' must return ERR_INVALID_REQUEST 400 and leave the stored value at NON_UNION."
        test_recipe:
          setup:
            - "One Musician 'Ivo Blake' at NON_UNION"
          setup_api_calls:
            - call: "POST /musicians"
              payload: { full_name: "Ivo Blake", instrument: "CELLO", scale_hourly_cents: 7000 }
              as: MusicHouseProducer
              captures: { mi: $.data.id }
          trigger:
            - call: "POST /musicians/${mi}/afm-clearance"
              payload: { afm_member_status: "GOLD_CARD" }
              as: AFMSteward
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == 'ERR_INVALID_REQUEST'"
            - "Musician.${mi}.afm_member_status == NON_UNION"

      - name: corner_license_deal_body_fk_to_unknown_demo_returns_demo_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=25]
          - errors[ERR_DEMO_NOT_FOUND]
          - entities.LicenseDeal.fields.demo_id
        distinguishing_aspect: "Body foreign keys are resolved at priority 25, before the priority-78 SELECTED check, so an unknown demo_id yields ERR_DEMO_NOT_FOUND 404 rather than ERR_DEMO_NOT_SELECTED."
        test_recipe:
          setup:
            - "Project in IN_PRODUCTION with its own SELECTED demo"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-005", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /demos/${dma}/shortlist"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "GET /projects/${pj}"
              payload: {}
              as: RightsAdmin
              as_user_id: "rights-admin-alpha"
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /license-deals"
              payload: { project_id: "${pj}", demo_id: "4c9f1a22-77bd-4d0e-9a11-5e3c0b7a2d90", license_structure: "BUYOUT", market_codes: ["US_LOCAL"], creative_fee_cents: 400000, expected_project_version: "${pv}" }
              as: RightsAdmin
              as_user_id: "rights-admin-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == 'ERR_DEMO_NOT_FOUND'"
            - "GET /license-deals?project_id=${pj} -> total_count == 0"

  - section: state_machines
    instances:

      - name: corner_submitting_an_already_submitted_demo_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Demo.DRAFT_to_SUBMITTED
          - errors[ERR_DEMO_INVALID_STATE]
          - validations[priority=40]
        distinguishing_aspect: "SUBMITTED is not a from-state of the submit edge, so a second POST /demos/{id}/submit returns ERR_DEMO_INVALID_STATE 409 and leaves revision_count at 0."
        test_recipe:
          setup:
            - "Project in IN_DEMO; one Demo already SUBMITTED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-006", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
          trigger:
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == 'ERR_DEMO_INVALID_STATE'"
            - "Demo.${dma}.status == SUBMITTED"
            - "Demo.${dma}.revision_count == 0"

      - name: corner_select_requires_shortlisted_not_merely_submitted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Demo.SHORTLISTED_to_SELECTED
          - errors[ERR_DEMO_INVALID_STATE]
        distinguishing_aspect: "SELECT has exactly one from-state, SHORTLISTED, so selecting a merely SUBMITTED demo returns ERR_DEMO_INVALID_STATE 409 and the Project stays in IN_DEMO with its committed cents untouched."
        test_recipe:
          setup:
            - "Project budget_cents 4000000 in IN_DEMO with one SUBMITTED Demo of 100000 cents"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-007", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
          trigger:
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == 'ERR_DEMO_INVALID_STATE'"
            - "Demo.${dma}.status == SUBMITTED"
            - "Project.${pj}.status == IN_DEMO"
            - "Project.${pj}.committed_cents == 100000"
            - "Project.${pj}.spent_cents == 0"

      - name: corner_terminal_selected_demo_cannot_be_sent_back_for_revision
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Demo.SUBMITTED_to_REVISION_REQUESTED
          - errors[ERR_DEMO_INVALID_STATE]
        distinguishing_aspect: "SELECTED is a terminal state of the Demo machine, so request-revision on it returns ERR_DEMO_INVALID_STATE 409 and books no surcharge on the Project ledger."
        test_recipe:
          setup:
            - "Project budget_cents 4000000 in IN_PRODUCTION with one SELECTED Demo of 100000 cents"
            - "Project ledger: committed 0, available 3900000, spent 100000"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-008", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /demos/${dma}/shortlist"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
          trigger:
            - call: "POST /demos/${dma}/request-revision"
              payload: { revision_note: "one more pass please" }
              as: ClientRep
              as_user_id: "${cl}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == 'ERR_DEMO_INVALID_STATE'"
            - "Demo.${dma}.status == SELECTED"
            - "Demo.${dma}.revision_count == 0"
            - "Demo.${dma}.accrued_fee_cents == 100000"
            - "Project.${pj}.committed_cents == 0"
            - "Project.${pj}.available_cents == 3900000"
            - "Project.${pj}.spent_cents == 100000"

      - name: corner_hold_freezes_then_resume_restores_status_and_unsuspends_calls
        claim_type: Cascade down
        grounds:
          - state_machines.Project.IN_PRODUCTION_to_ON_HOLD
          - state_machines.Project.ON_HOLD_to_IN_PRODUCTION
          - state_machines.SessionCall.SCHEDULED_to_SUSPENDED_BUDGET
          - state_machines.SessionCall.SUSPENDED_BUDGET_to_SCHEDULED
          - entities.Project.fields.status_before_hold
        distinguishing_aspect: "Hold stores status_before_hold = IN_PRODUCTION, forces budget_posture FROZEN and suspends the SCHEDULED call; resume restores exactly IN_PRODUCTION, recomputes the posture to HEALTHY, clears status_before_hold to null and returns the call to SCHEDULED."
        test_recipe:
          setup:
            - "Project budget_cents 4000000 in IN_PRODUCTION with one SCHEDULED SessionCall and no bookings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MusicHouseProducer
            - call: "POST /clients"
              payload: { name: "Harborline Foods", agency_code: "HLF-009", billing_email: "ap@harborline.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Winter Warmth", budget_cents: 4000000, delivery_deadline_utc: "2026-12-01T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 110, mood_tags: ["cosy"], target_markets: ["US_LOCAL"], required_lengths: [30] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Cut One", demo_fee_cents: 100000, submitted_length_seconds: 30 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /demos/${dma}/shortlist"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /studio-rooms"
              payload: { name: "Room A", hourly_rate_cents: 40000, capacity_players: 6, status: "ACTIVE" }
              as: MusicHouseProducer
              captures: { r1: $.data.id }
            - call: "POST /session-calls"
              payload: { project_id: "${pj}", studio_room_id: "${r1}", scheduled_start_utc: "2026-09-10T09:00:00Z", scheduled_end_utc: "2026-09-10T13:00:00Z" }
              as: MusicHouseProducer
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /projects/${pj}/hold"
              payload: { hold_reason: "client legal review" }
              as: MusicHouseProducer
            - call: "POST /projects/${pj}/resume"
              payload: {}
              as: MusicHouseProducer
          assert:
            - "After the hold call: Project.${pj}.status == ON_HOLD, status_before_hold == IN_PRODUCTION, budget_posture == FROZEN, SessionCall.${s1}.status == SUSPENDED_BUDGET"
            - "After the resume call: Project.${pj}.status == IN_PRODUCTION"
            - "Project.${pj}.status_before_hold == null"
            - "Project.${pj}.budget_posture == HEALTHY"
            - "SessionCall.${s1}.status == SCHEDULED"
            - "Project.${pj}.available_cents == 3900000"

      - name: corner_reject_master_reverts_dimension_and_clears_the_manifest
        claim_type: Compensation
        grounds:
          - state_machines.Deliverable.STEMS_DELIVERED_to_PENDING
          - calculations.deliverable_completeness
          - entities.Deliverable.fields.stem_manifest
        distinguishing_aspect: "Rejecting the master returns master_status to PENDING and empties both delivered_lengths and stem_manifest, while cuesheet_status and Project.status are untouched."
        test_recipe:
