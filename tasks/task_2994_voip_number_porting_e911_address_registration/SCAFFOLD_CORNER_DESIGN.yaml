          - validations[priority=2]
        distinguishing_aspect: "Each cross-role attempt is refused with ERR_ROLE_NOT_PERMITTED (403) at priority 2, before existence and before body parsing, so a fabricated but well-shaped id never leaks a 404 to the wrong role."
        test_recipe:
