          - entities.Bill.fields.late_fee_cents
        distinguishing_aspect: |
          Depth-3 chain originating from POST /billing-cycles/{id}/close: (1) cycle close mutates the
          unpaid POSTED Bill (late_fee_cents=949); (2) that bill mutation forces Account.billing_status
          -> PAST_DUE and (3) Account.past_due_cents/balance_due_cents recompute to 19929. Each link is
          caused by the prior link, not directly by the close call.
