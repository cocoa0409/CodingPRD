  # ===========================================================================
  - section: state_machines
    instances:

      - name: open_for_sale_moves_a_planned_sailing_and_bumps_version
        claim_type: valid_transition
        grounds:
          - state_machines.Sailing[PLANNED -> OPEN_FOR_SALE]
          - endpoints[POST /sailings/{id}/open-for-sale]
          - calculations.sailing_ralbd
          - calculations.sailing_occupancy_posture
        distinguishing_aspect: |
          The happy-path transition is more than a status flip: it re-runs both sailing
          calculations and bumps the version exactly once, so the response is the freshly
          derived Sailing rather than the stored PLANNED snapshot.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 in PLANNED at version 1 with one IA allotment and one IA fare window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id, v_created: $.data.version }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
          trigger:
