          assert:
            - "convert at day 30 (== due_at, still OPEN since sweep requires clock > due_at): charge_cents == 68000 (months_started 1 -> 8500bp)"
            - "U_A status CONVERTED; SAMPLE_CHARGE entry -68000 for ${r1}"
