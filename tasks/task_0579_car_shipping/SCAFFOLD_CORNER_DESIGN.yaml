# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Auto Transport & Car-Shipping Broker — Expert
# Breadth probe across claim-extraction-guide sections. Formula-derived asserts
# were computed by code against §1.3.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_shipment_order_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.ShipmentOrder, endpoints]
        distinguishing_aspect: "POST /shipment-orders with all required fields returns 201, status DRAFT, version 1, and a server-minted id."
        test_recipe:
          setup: ["A registered shipper."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Admin
              captures: { shipper_id: $.data.id }
          trigger:
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ShipmentOrder.${order_id}.status == DRAFT"
            - "ShipmentOrder.${order_id}.version == 1"
            - "ShipmentOrder.${order_id}.delivery_mode == DOOR_TO_DOOR"
            - "ShipmentOrder.${order_id}.service_level == STANDARD"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ShipmentOrder, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shipment-orders/{random uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shipment-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_order_missing_route_miles_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ShipmentOrder.fields.route_miles, "errors[ERR_INVALID_REQUEST]", "validations[priority=6]"]
        distinguishing_aspect: "POST /shipment-orders omitting required route_miles returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered shipper."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Admin
              captures: { shipper_id: $.data.id }
          trigger:
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: carrier_duplicate_mc_number_returns_409
        claim_type: Type Constraints
        grounds: [entities.Carrier.fields.mc_number, "errors[ERR_DUPLICATE_MC_NUMBER]"]
        distinguishing_aspect: "A second carrier reusing an existing mc_number returns ERR_DUPLICATE_MC_NUMBER (409)."
        test_recipe:
          setup: ["One carrier with mc_number MC-DUP registered."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "First Co", mc_number: "MC-DUP", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Second Co", mc_number: "MC-DUP", cargo_insurance_limit_cents: 2000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "ENCLOSED" }
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_MC_NUMBER"

      - name: shipper_duplicate_email_returns_409
        claim_type: Type Constraints
        grounds: [entities.Shipper.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "A second shipper reusing an existing email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One shipper with email dup@x.com registered."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "dup@x.com", full_name: "Dup A" }
              as: Admin
          trigger:
            - call: "POST /shippers"
              payload: { email: "dup@x.com", full_name: "Dup B" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: list_vehicles_by_order_returns_array
        claim_type: Retrieval
        grounds: [entities.Vehicle.fields.order_id, endpoints]
        distinguishing_aspect: "GET /vehicles?order_id={id} returns an array of the order's vehicles (FK reverse-reachability)."
        test_recipe:
          setup: ["A DRAFT order with 2 vehicles attached."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Toyota", model: "Camry", year: 2021, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
          trigger:
            - call: "GET /vehicles?order_id=${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
          assert:
            - "response.status == 200"
            - "response.data length == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_from_dispatched_returns_cancel_too_late
        claim_type: Invalid Transitions
        grounds: [state_machines.ShipmentOrder.DRAFT_to_CANCELLED, "errors[ERR_CANCEL_TOO_LATE]"]
        distinguishing_aspect: "Cancelling a DISPATCHED order returns ERR_CANCEL_TOO_LATE (409); cancel is only valid from DRAFT/QUOTED/LISTED."
        test_recipe:
          setup: ["An order DISPATCHED to a carrier."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 20000 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Ctl Carrier", mc_number: "MC-C707", cargo_insurance_limit_cents: 3000000, insurance_expiry_date: "2027-01-01T00:00:00Z", equipment_type: "OPEN" }
              as: Broker
              captures: { carrier_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers"
              payload: { ask_pay_cents: 50000, pickup_eta: "2026-06-02T09:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /listings/${listing_id}/offers/${offer_id}/accept"
              payload: {}
              as: Broker
          trigger:
            - call: "POST /shipment-orders/${order_id}/cancel"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CANCEL_TOO_LATE"

      - name: accept_quote_twice_returns_quote_not_offered
