# =============================================================================
# task_1032 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_estimated_vs_final_charge_diverge
        grounds:
          - calculations.rental_charge
          - entities.RentalAgreement.fields.estimated_charge_cents
          - entities.RentalAgreement.fields.final_charge_cents
          - state_machines.RentalAgreement.PICKED_UP_to_RETURNED
        distinguishing_aspect: "On the RentalAgreement domain, the estimated variant (10710, no late fee) and the final variant (16710, +6000 late fee) produce different charges for the identical rental — divergence lives on RentalAgreement, distinct from the TradeIn dual-variant."
        test_recipe:
          setup:
            - "PREMIER ACTIVE member; rentable SKU daily 2000; one unit; 7-day rental 2026-07-05T09:00Z→2026-07-12T09:00Z, no waiver; picked up; clock advanced 2 days past due."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "dv1@x.com", full_name: "DV One", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Sea Kayak", category: "KAYAK", retail_price_cents: 90000, rentable: true, daily_rental_rate_cents: 2000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "K-DV1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-12T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rental_id: $.data.id, est: $.data.estimated_charge_cents }
            - call: "POST /coop/rental-agreements/${rental_id}/pickup"
              payload: {}
              as: StoreStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-14T09:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /coop/rental-agreements/${rental_id}/return"
              payload: {}
              as: StoreStaff
              captures: { final: $.data.final_charge_cents }
          assert:
            - "RentalAgreement.${rental_id}.estimated_charge_cents == 10710"
            - "RentalAgreement.${rental_id}.final_charge_cents == 16710"
            - "RentalAgreement.${rental_id}.final_charge_cents != RentalAgreement.${rental_id}.estimated_charge_cents"

      - name: trade_in_instant_vs_consignment_payout_diverge
        grounds:
          - calculations.trade_in_payout
          - entities.TradeIn.fields.instant_credit_cents
          - entities.TradeIn.fields.payout_cents
          - state_machines.TradeIn.LISTED_to_SOLD
        distinguishing_aspect: "On the TradeIn domain, INSTANT_CREDIT pays 8000 (40% of appraised 20000) while CONSIGNMENT pays 15600 (65% of resale 24000) for the same appraised item — divergence on TradeIn, a different entity domain from RentalAgreement."
        test_recipe:
          setup:
            - "One member; one SKU; trade-in A INSTANT_CREDIT appraised 20000 accepted; trade-in B CONSIGNMENT appraised 20000 accepted then listed."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "dv2@x.com", full_name: "DV Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "3P Tent", category: "TENT", retail_price_cents: 30000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", gear_sku_id: "${sku_id}", described_condition: "GOOD", payout_method: "INSTANT_CREDIT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_a: $.data.id }
            - call: "POST /coop/trade-ins/${ti_a}/appraise"
              payload: { appraised_value_cents: 20000 }
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti_a}/respond"
              payload: { action: "ACCEPT" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", gear_sku_id: "${sku_id}", described_condition: "GOOD", payout_method: "CONSIGNMENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_b: $.data.id }
            - call: "POST /coop/trade-ins/${ti_b}/appraise"
              payload: { appraised_value_cents: 20000 }
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti_b}/respond"
              payload: { action: "ACCEPT" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /coop/trade-ins/${ti_b}/sell"
              payload: { resale_price_cents: 24000 }
              as: StoreStaff
              captures: { payout_b: $.data.payout_cents }
          assert:
            - "TradeIn.${ti_a}.payout_cents == 8000"
            - "TradeIn.${ti_a}.instant_credit_cents == 8000"
            - "TradeIn.${ti_b}.consignment_estimate_cents == 13000"
            - "TradeIn.${ti_b}.payout_cents == 15600"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_charge_tiered_nonlinear_mode_a
        grounds:
          - calculations.rental_charge
          - entities.RentalAgreement.fields.estimated_charge_cents
          - state_machines.RentalAgreement.create_to_QUOTED
        distinguishing_aspect: "Mode (a): estimated_charge_cents == 18165 comes from a ≥3-input non-linear formula — tiered multi-day discount (days≥7 → 15%), then member-tier discount (PREMIER 10%), then a conditional damage-waiver fee (10% of undiscounted subtotal) — nested selections, not a flat rate."
        test_recipe:
          setup:
            - "PREMIER ACTIVE member; rentable SKU daily 3000; 7-day rental with damage_waiver=true."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cf1@x.com", full_name: "CF One", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Expedition Pack", category: "BACKPACK", retail_price_cents: 40000, rentable: true, daily_rental_rate_cents: 3000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "BP-CF1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-12T09:00:00Z", damage_waiver: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { rental_id: $.data.id, est: $.data.estimated_charge_cents }
          assert:
            - "RentalAgreement.${rental_id}.rental_days == 7"
            - "RentalAgreement.${rental_id}.estimated_charge_cents == 18165"

      - name: order_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.order_total
          - entities.SalesOrder.fields.discount_cents
          - entities.SalesOrder.fields.total_cents
          - state_machines.SalesOrder.create_to_QUOTED
        distinguishing_aspect: "Mode (b): the pinned rounding ORDER — round each line's discount then sum — yields discount_cents == 206 (103+103), whereas sum-then-round would give 205; the two orders produce different cents, and the scaffold pins round-per-line-then-sum."
        test_recipe:
          setup:
            - "PREMIER member; two distinct SKUs each priced 1025; order of two single-quantity lines, one per SKU."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cf2@x.com", full_name: "CF Two", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Trail Socks A", category: "APPAREL", retail_price_cents: 1025 }
              as: StoreStaff
              captures: { sku_a: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Trail Socks B", category: "APPAREL", retail_price_cents: 1025 }
              as: StoreStaff
              captures: { sku_b: $.data.id }
          trigger:
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_a}", quantity: 1 }, { gear_sku_id: "${sku_b}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "SalesOrder.${o_id}.subtotal_cents == 2050"
            - "SalesOrder.${o_id}.discount_cents == 206"
            - "SalesOrder.${o_id}.total_cents == 1844"
            - "SalesOrder.${o_id}.loyalty_points_earned == 18"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sales_order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.SalesOrder.fulfill
          - state_machines.SalesOrder.pay
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: "On SalesOrder, fulfillment_status advances to FULFILLED while payment_status is still UNPAID, then payment advances to PAID with fulfillment unchanged — two independent parallel dimensions on one entity, non-linear."
        test_recipe:
          setup:
            - "Member; one SKU priced 5000; unpaid order for one unit (use_store_credit false)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "nl1@x.com", full_name: "NL One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Camp Stove", category: "STOVE", retail_price_cents: 5000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /coop/sales-orders/${o_id}/fulfill"
              payload: {}
              as: StoreStaff
              captures: { pay_after_fulfill: $.data.payment_status, ful_after_fulfill: $.data.fulfillment_status }
            - call: "POST /coop/sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "after fulfill: SalesOrder.${o_id}.fulfillment_status == FULFILLED and SalesOrder.${o_id}.payment_status == UNPAID (axes independent)"
            - "SalesOrder.${o_id}.payment_status == PAID"
            - "SalesOrder.${o_id}.fulfillment_status == FULFILLED"

      - name: trade_in_offer_counter_cycle
        grounds:
          - state_machines.TradeIn.OFFERED_to_COUNTERED
          - state_machines.TradeIn.COUNTERED_to_OFFERED
          - entities.TradeIn.fields.status
          - entities.TradeIn.fields.member_counter_cents
        distinguishing_aspect: "TradeIn returns to OFFERED after COUNTERED via a second appraisal (OFFERED→COUNTERED→OFFERED), a genuine A→B→A cycle on the TradeIn entity, distinct from SalesOrder's parallel axes."
        test_recipe:
          setup:
            - "Member; SKU; CONSIGNMENT trade-in appraised at 15000 (→OFFERED), member counters at 18000 (→COUNTERED)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "nl2@x.com", full_name: "NL Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Down Bag", category: "APPAREL", retail_price_cents: 25000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", gear_sku_id: "${sku_id}", described_condition: "LIKE_NEW", payout_method: "CONSIGNMENT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti: $.data.id }
            - call: "POST /coop/trade-ins/${ti}/appraise"
              payload: { appraised_value_cents: 15000 }
              as: StoreStaff
            - call: "POST /coop/trade-ins/${ti}/respond"
              payload: { action: "COUNTER", counter_cents: 18000 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /coop/trade-ins/${ti}/appraise"
              payload: { appraised_value_cents: 17000 }
              as: StoreStaff
              captures: { st: $.data.status }
          assert:
            - "TradeIn.${ti}.status == OFFERED"
            - "TradeIn.${ti}.appraised_value_cents == 17000"
            - "TradeIn.${ti}.member_counter_cents == 18000"
            - "TradeIn.${ti}.instant_credit_cents == 6800"
            - "TradeIn.${ti}.consignment_estimate_cents == 11050"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_promotes_waitlist_and_debits_promoted_member
        grounds:
          - state_machines.Booking.BOOKED_to_CANCELLED
          - state_machines.Booking.WAITLISTED_to_BOOKED
          - entities.Member.fields.store_credit_cents
          - entities.Booking.fields.booked_from_waitlist
        distinguishing_aspect: "Depth-3 cascade from booking cancel: cancel A (hop1) releases the seat which promotes waitlisted booking B to BOOKED (hop2) which debits promoted member B's store_credit by price (hop3) — each hop caused by the prior."
        test_recipe:
          setup:
            - "Trip capacity 1 price 3000; member A (credit 5000) BOOKED; member B (credit 5000) WAITLISTED behind A."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "tcA@x.com", full_name: "TC A" }
              as: Public
              captures: { ma: $.data.id }
            - call: "POST /coop/members/${ma}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/members"
              payload: { email: "tcB@x.com", full_name: "TC B" }
              as: Public
              captures: { mb: $.data.id }
            - call: "POST /coop/members/${mb}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Avalanche 1", category: "CLASS", start_at: "2026-07-20T08:00:00Z", end_at: "2026-07-20T12:00:00Z", capacity: 1, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${ma}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${ma}"
              captures: { ba: $.data.id }
            - call: "GET /coop/class-trips/${ct}"
              payload: {}
              as: StoreStaff
              captures: { ctv1: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${mb}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv1}" }
              as: Member
              as_user_id: "${mb}"
              captures: { bb: $.data.id }
          trigger:
            - call: "POST /coop/bookings/${ba}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ma}"
          assert:
            - "Booking.${bb}.status == BOOKED"
            - "Booking.${bb}.booked_from_waitlist == true"
            - "Member.${mb}.store_credit_cents == 2000"
            - "Member.${ma}.store_credit_cents == 5000"
            - "ClassTrip.${ct}.seats_reserved == 1"

      - name: order_return_reverses_member_ledger
        grounds:
          - state_machines.SalesOrder.return
          - entities.Member.fields.store_credit_cents
          - entities.Member.fields.loyalty_points_balance
          - entities.Member.fields.lifetime_eligible_spend_cents
        distinguishing_aspect: "Depth-2 cascade from a different trigger (order return): order→REFUNDED/RETURNED (hop1) reverses the member ledger — store_credit +1844, loyalty −18, lifetime −1844 (hop2)."
        test_recipe:
          setup:
            - "PREMIER member with 5000 store credit; two SKUs priced 1025; order paid-with-credit (total 1844) and fulfilled."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "tc2@x.com", full_name: "TC Two", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/gear-skus"
              payload: { name: "Sock A2", category: "APPAREL", retail_price_cents: 1025 }
              as: StoreStaff
              captures: { sku_a: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Sock B2", category: "APPAREL", retail_price_cents: 1025 }
              as: StoreStaff
              captures: { sku_b: $.data.id }
            - call: "POST /coop/sales-orders"
              payload: { member_id: "${m_id}", lines: [ { gear_sku_id: "${sku_a}", quantity: 1 }, { gear_sku_id: "${sku_b}", quantity: 1 } ], use_store_credit: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /coop/sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/sales-orders/${o_id}/fulfill"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/sales-orders/${o_id}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "SalesOrder.${o_id}.payment_status == REFUNDED"
            - "SalesOrder.${o_id}.fulfillment_status == RETURNED"
            - "Member.${m_id}.store_credit_cents == 5000"
            - "Member.${m_id}.loyalty_points_balance == 0"
            - "Member.${m_id}.lifetime_eligible_spend_cents == 0"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_booking_completed_trip
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.ClassTrip.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Category pair state (priority 4, ERR_TRIP_NOT_SCHEDULED) vs business_fiscal (priority 9, ERR_INSUFFICIENT_STORE_CREDIT): a booking on a COMPLETED trip by a 0-credit member returns the state error, proving state precedes fiscal."
        test_recipe:
          setup:
            - "Member with 0 store credit; trip capacity 5 price 3000 that has been COMPLETED."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "pp1@x.com", full_name: "PP One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/class-trips"
              payload: { title: "Map & Compass", category: "CLASS", start_at: "2026-07-22T08:00:00Z", end_at: "2026-07-22T10:00:00Z", capacity: 5, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id }
            - call: "POST /coop/class-trips/${ct}/complete"
              payload: {}
              as: StoreStaff
            - call: "GET /coop/class-trips/${ct}"
              payload: {}
              as: StoreStaff
              captures: { ctv: $.data.version }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRIP_NOT_SCHEDULED"
            - "state (priority 4) is returned instead of fiscal ERR_INSUFFICIENT_STORE_CREDIT (priority 9)"

      - name: temporal_beats_constraint_on_permit_issue
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - entities.PermitAllocation.fields.available_quota
        distinguishing_aspect: "Category pair business_temporal (priority 6, ERR_OUTSIDE_SEASON) vs business_constraint (priority 8, ERR_QUOTA_EXHAUSTED): a permit with entry_date outside season AND a fully-drawn pool returns the temporal error — a different error-category pair from the state/fiscal conflict."
        test_recipe:
          setup:
            - "Member with 10000 credit; allocation total_quota 1, season 2026-08-01..2026-08-31, price 2000; the single permit is already issued (quota 0)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "pp2@x.com", full_name: "PP Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 10000 }
              as: StoreStaff
            - call: "POST /coop/permit-allocations"
              payload: { park_name: "Enchantments", season_start: "2026-08-01T00:00:00Z", season_end: "2026-08-31T23:59:59Z", total_quota: 1, price_cents: 2000 }
              as: StoreStaff
              captures: { pa: $.data.id, pav0: $.data.version }
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${m_id}", permit_allocation_id: "${pa}", entry_date: "2026-08-10T00:00:00Z", expected_allocation_version: "${pav0}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /coop/permit-allocations/${pa}"
              payload: {}
              as: StoreStaff
              captures: { pav1: $.data.version }
          trigger:
            - call: "POST /coop/permit-passes"
              payload: { member_id: "${m_id}", permit_allocation_id: "${pa}", entry_date: "2026-09-15T00:00:00Z", expected_allocation_version: "${pav1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OUTSIDE_SEASON"
            - "temporal (priority 6) is returned instead of constraint ERR_QUOTA_EXHAUSTED (priority 8)"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rental_return_exactly_at_due_no_late_fee
        grounds:
          - calculations.rental_charge
          - entities.RentalAgreement.fields.final_charge_cents
          - state_machines.RentalAgreement.PICKED_UP_to_RETURNED
        distinguishing_aspect: "Metric = overdue time threshold on the rental-return endpoint: returned_at == due_at yields days_late 0 (strict `>` boundary), so final_charge_cents == estimated_charge_cents == 10710, no late fee."
        test_recipe:
          setup:
            - "PREMIER member; rentable SKU daily 2000; 7-day rental start 2026-07-05T09:00Z due 2026-07-12T09:00Z; picked up; clock set to exactly due_at."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "bp1@x.com", full_name: "BP One", membership_tier: "PREMIER" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Touring Kayak", category: "KAYAK", retail_price_cents: 88000, rentable: true, daily_rental_rate_cents: 2000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "K-BP1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-12T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rental_id: $.data.id }
            - call: "POST /coop/rental-agreements/${rental_id}/pickup"
              payload: {}
              as: StoreStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T09:00:00Z" }
              as: StoreStaff
          trigger:
            - call: "POST /coop/rental-agreements/${rental_id}/return"
              payload: {}
              as: StoreStaff
              captures: { final: $.data.final_charge_cents }
          assert:
            - "RentalAgreement.${rental_id}.final_charge_cents == 10710"
            - "RentalAgreement.${rental_id}.final_charge_cents == RentalAgreement.${rental_id}.estimated_charge_cents"

      - name: booking_capacity_zero_seats_waitlists
        grounds:
          - state_machines.Booking.create_to_WAITLISTED
          - state_machines.Booking.create_to_BOOKED
          - entities.ClassTrip.fields.seats_available
        distinguishing_aspect: "Metric = seat-count/empty-set boundary on the booking-create endpoint: seats_available == 1 → BOOKED, seats_available == 0 → WAITLISTED (over-capacity is not an error) — a different metric and endpoint from the rental time boundary."
        test_recipe:
          setup:
            - "Two members each with 5000 credit; trip capacity 1 price 3000; member A already BOOKED (seats_available now 0)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "bp2a@x.com", full_name: "BP2 A" }
              as: Public
              captures: { ma: $.data.id }
            - call: "POST /coop/members/${ma}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/members"
              payload: { email: "bp2b@x.com", full_name: "BP2 B" }
              as: Public
              captures: { mb: $.data.id }
            - call: "POST /coop/members/${mb}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Ice Axe 1", category: "CLASS", start_at: "2026-07-25T08:00:00Z", end_at: "2026-07-25T12:00:00Z", capacity: 1, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${ma}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${ma}"
              captures: { ba: $.data.id, ba_status: $.data.status }
            - call: "GET /coop/class-trips/${ct}"
              payload: {}
              as: StoreStaff
              captures: { ctv1: $.data.version }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${mb}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv1}" }
              as: Member
              as_user_id: "${mb}"
              captures: { bb: $.data.id, bb_status: $.data.status }
          assert:
            - "Booking.${ba}.status == BOOKED"
            - "Booking.${bb}.status == WAITLISTED"
            - "ClassTrip.${ct}.seats_available == 0"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_trip_scheduled
        grounds:
          - state_machines.Booking.create_to_BOOKED
          - state_machines.ClassTrip.SCHEDULED_to_CANCELLED
          - entities.ClassTrip.fields.status
        distinguishing_aspect: "Entity pair Booking→ClassTrip: a booking is rejected with ERR_TRIP_NOT_SCHEDULED because the referenced ClassTrip is CANCELLED — Booking's valid create depends on ClassTrip.status."
        test_recipe:
          setup:
            - "Member with 5000 credit; trip capacity 5 price 1000 that has been CANCELLED."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ce1@x.com", full_name: "CE One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Nav Basics", category: "CLASS", start_at: "2026-07-28T08:00:00Z", end_at: "2026-07-28T10:00:00Z", capacity: 5, price_cents: 1000 }
              as: StoreStaff
              captures: { ct: $.data.id }
            - call: "POST /coop/class-trips/${ct}/cancel"
              payload: {}
              as: StoreStaff
            - call: "GET /coop/class-trips/${ct}"
              payload: {}
              as: StoreStaff
              captures: { ctv: $.data.version }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRIP_NOT_SCHEDULED"

      - name: rental_pickup_requires_unit_available
        grounds:
          - state_machines.RentalAgreement.QUOTED_to_PICKED_UP
          - entities.GearUnit.fields.status
          - errors[ERR_UNIT_NOT_READY]
        distinguishing_aspect: "Entity pair RentalAgreement→GearUnit: picking up rental R2 is rejected with ERR_UNIT_NOT_READY because the shared unit is RENTED_OUT by R1 — R2's pickup depends on GearUnit.status, a different entity pair from Booking→ClassTrip."
        test_recipe:
          setup:
            - "One member (ACTIVE); one rentable unit; two non-overlapping rentals R1 (07-05→07-06) and R2 (07-20→07-21); R1 picked up so the unit is RENTED_OUT."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ce2@x.com", full_name: "CE Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Bivy Sack", category: "TENT", retail_price_cents: 20000, rentable: true, daily_rental_rate_cents: 1500 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "BV-CE2" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-06T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-20T09:00:00Z", due_at: "2026-07-21T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r2: $.data.id }
            - call: "POST /coop/rental-agreements/${r1}/pickup"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/rental-agreements/${r2}/pickup"
              payload: {}
              as: StoreStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNIT_NOT_READY"
            - "GearUnit.${unit_id}.status == RENTED_OUT"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_unit_overlap_within_service_buffer
        grounds:
          - state_machines.RentalAgreement.create_to_QUOTED
          - calculations.rental_charge
          - errors[ERR_UNIT_UNAVAILABLE]
        distinguishing_aspect: "GearUnit interval semantics: occupation is [start_at, due_at + 24h SERVICE_BUFFER) half-open; R2 starting 2026-07-06T20:00Z falls inside R1's buffer (due 07-06T09:00 + 24h = 07-07T09:00) and is rejected — buffered half-open arithmetic on GearUnit."
        test_recipe:
          setup:
            - "One member; one rentable unit; R1 rental 2026-07-05T09:00Z→2026-07-06T09:00Z (QUOTED)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "to1@x.com", full_name: "TO One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/gear-skus"
              payload: { name: "Packraft", category: "KAYAK", retail_price_cents: 120000, rentable: true, daily_rental_rate_cents: 4000 }
              as: StoreStaff
              captures: { sku_id: $.data.id }
            - call: "POST /coop/gear-units"
              payload: { gear_sku_id: "${sku_id}", serial_number: "PR-TO1" }
              as: StoreStaff
              captures: { unit_id: $.data.id }
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-05T09:00:00Z", due_at: "2026-07-06T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /coop/rental-agreements"
              payload: { member_id: "${m_id}", gear_unit_id: "${unit_id}", start_at: "2026-07-06T20:00:00Z", due_at: "2026-07-08T09:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNIT_UNAVAILABLE"

      - name: member_booking_overlap_closed_interval
        grounds:
          - state_machines.Booking.create_to_BOOKED
          - errors[ERR_MEMBER_SCHEDULE_CONFLICT]
          - entities.ClassTrip.fields.start_at
        distinguishing_aspect: "Member schedule interval semantics: trip windows are closed with NO buffer and shared endpoints allowed; trip2 [11:00,15:00] strictly overlaps the member's trip1 [08:00,12:00] booking and is rejected — no-buffer closed-interval arithmetic on the Member's schedule, distinct from the buffered GearUnit rule."
        test_recipe:
          setup:
            - "Member with 5000 credit; trip1 [2026-07-20T08:00Z,12:00Z] and trip2 [2026-07-20T11:00Z,15:00Z] both capacity 5 price 1000; member already BOOKED on trip1."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "to2@x.com", full_name: "TO Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Rock 1", category: "CLASS", start_at: "2026-07-20T08:00:00Z", end_at: "2026-07-20T12:00:00Z", capacity: 5, price_cents: 1000 }
              as: StoreStaff
              captures: { ct1: $.data.id, ct1v: $.data.version }
            - call: "POST /coop/class-trips"
              payload: { title: "Rock 2", category: "CLASS", start_at: "2026-07-20T11:00:00Z", end_at: "2026-07-20T15:00:00Z", capacity: 5, price_cents: 1000 }
              as: StoreStaff
              captures: { ct2: $.data.id, ct2v: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct1}", expected_classtrip_version: "${ct1v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct2}", expected_classtrip_version: "${ct2v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_SCHEDULE_CONFLICT"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: store_credit_conserved_on_booking_book_then_cancel
        grounds:
          - state_machines.Booking.create_to_BOOKED
          - state_machines.Booking.BOOKED_to_CANCELLED
          - entities.Member.fields.store_credit_cents
          - entities.Booking.fields.price_paid_cents
        distinguishing_aspect: "Conserved quantity = money: booking a seat debits store_credit by price_paid_cents (3000) and cancelling refunds exactly that, so store_credit_before == store_credit_after == 3000; net drift zero."
        test_recipe:
          setup:
            - "Member with exactly 3000 credit; trip capacity 5 price 3000; member BOOKED (credit debited to 0)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ci1@x.com", full_name: "CI One" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 3000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Wilderness FA", category: "CLASS", start_at: "2026-07-30T08:00:00Z", end_at: "2026-07-30T16:00:00Z", capacity: 5, price_cents: 3000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /coop/bookings/${b}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.store_credit_cents == 3000"
            - "Booking.${b}.status == CANCELLED"

      - name: seats_conserved_on_booking_book_then_cancel
        grounds:
          - calculations.class_trip_seats
          - state_machines.Booking.create_to_BOOKED
          - state_machines.Booking.BOOKED_to_CANCELLED
          - entities.ClassTrip.fields.seats_reserved
        distinguishing_aspect: "Conserved quantity = seats: seats_reserved + seats_available == capacity (2) holds invariantly; booking reserves one seat and cancel releases it, returning seats_reserved to 0 — a different conserved quantity from store_credit."
        test_recipe:
          setup:
            - "Member with 5000 credit; trip capacity 2 price 1000; member BOOKED (seats_reserved 1, seats_available 1)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "ci2@x.com", full_name: "CI Two" }
              as: Public
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/store-credit"
              payload: { amount_cents: 5000 }
              as: StoreStaff
            - call: "POST /coop/class-trips"
              payload: { title: "Kayak Roll", category: "CLASS", start_at: "2026-08-02T08:00:00Z", end_at: "2026-08-02T11:00:00Z", capacity: 2, price_cents: 1000 }
              as: StoreStaff
              captures: { ct: $.data.id, ctv0: $.data.version }
            - call: "POST /coop/bookings"
              payload: { member_id: "${m_id}", class_trip_id: "${ct}", expected_classtrip_version: "${ctv0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /coop/bookings/${b}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ClassTrip.${ct}.seats_reserved == 0"
            - "ClassTrip.${ct}.seats_available == 2"
            - "ClassTrip.${ct}.seats_reserved + ClassTrip.${ct}.seats_available == 2"
