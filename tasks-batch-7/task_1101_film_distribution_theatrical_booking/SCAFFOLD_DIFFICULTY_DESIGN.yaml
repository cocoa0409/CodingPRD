            - call: "GET /distributors/${did}/booking-agreements/${baid}/holdover-decisions"
              payload: {}
              as: Booker
              captures: { auto_decision: "$.data[0].decision" }
          assert:
            - "Threshold = 2 * 100000 = 200000 cents"
            - "prior_week_gross == 199999 < 200000 → HoldoverDecision.decision == AUTO_RELEASE"
            - "At exactly 200000: decision would be AUTO_HOLD (boundary uses >=)"
            - "At 200001: decision would be AUTO_HOLD"

      - name: coop_budget_cap_lte_boundary
        grounds:
          - calculations.coop_market_cap_check
          - entities.Market.fields.coop_committed_cents
        distinguishing_aspect: |
