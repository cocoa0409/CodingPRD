  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: school_completion_requires_citation_paid
        grounds:
          - state_machines.TrafficSchoolEnrollment.ENROLLED_to_COMPLETED
          - entities.Citation.fields.financial_status
          - validations[priority=10]
          - errors[ERR_FINE_UNPAID]
        distinguishing_aspect: |
          Entity pair TrafficSchoolEnrollment -> Citation: the ENROLLED->COMPLETED
          transition is gated by the OTHER entity's state (Citation.financial_status
          must be PAID). An enrollment on an unpaid (ASSESSED) citation is refused
          with ERR_FINE_UNPAID.
        test_recipe:
          setup:
            - "Jurisdiction A; citation assessed (balance 29000, NOT paid); a school enrollment opened (ENROLLED)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
