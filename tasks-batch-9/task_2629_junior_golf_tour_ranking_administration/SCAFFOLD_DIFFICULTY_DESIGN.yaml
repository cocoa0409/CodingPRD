            - "http_status == 200"
            - "${st} == FIELD_SET"
            - "${acc} == 0"
            - "${wl} == 0"
            - "${open} == 2"
            - "${fq} == 1.00"
            - "Tournament.${t1_id}.applied_count == 0"
            - "Tournament.${t1_id}.closed_count == 0"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: submit_score_requires_tournament_in_progress
        grounds:
          - validations.priority_30
          - state_machines.Round.SCHEDULED_to_SUBMITTED
          - endpoints.POST_rounds_roundId_submit_score
          - errors.ERR_INVALID_TOURNAMENT_STATE
        distinguishing_aspect: |
          A guarded transition whose guard lives on a GRANDPARENT entity. Round -> SUBMITTED is
          legal from the Round's own point of view (status SCHEDULED) and legal from the Entry's
          (status ACCEPTED), yet must be refused because the Tournament is only FIELD_SET and never
          started. An implementation that validates only the round's own status accepts the card.
          The assertion also proves nothing was half-written: gross_strokes stays null.
        test_recipe:
          setup:
            - "One season, two VERIFIED U17 members, one REGIONAL 2-round tournament driven only as far as FIELD_SET - close-entries and set-field are called, but start is deliberately NOT called."
            - "m1's round 1 is scheduled (POST /rounds is legal at FIELD_SET), leaving a SCHEDULED round under a tournament that is not yet IN_PROGRESS."
            - "Both entries are paid, so no fee rule can mask the state rule."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
