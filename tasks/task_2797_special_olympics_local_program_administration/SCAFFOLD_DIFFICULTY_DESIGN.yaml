              as: ProgramManager
              captures: { sess1: $.data.id }
          trigger:
            - call: "POST /practice-sessions"
              payload: { season_id: "${season}", coach_credential_id: "${cred}", scheduled_start: "2026-09-10T11:10:00Z", duration_minutes: 30, capacity_slots: 10 }
              as: ProgramManager
            - call: "POST /practice-sessions"
