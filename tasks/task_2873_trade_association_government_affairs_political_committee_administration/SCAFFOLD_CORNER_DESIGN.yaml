          assert:
            - "HTTP 409 with error_id ERR_INVALID_PRIOR_APPROVAL_STATE"
            - "GET /advocacy/members/${m1_id}/prior-approvals: ${pa_id} is still REQUESTED with revoked_at null"
            - "A subsequent grant by ${m1_id} succeeds, proving the rejected revoke left the row usable"
