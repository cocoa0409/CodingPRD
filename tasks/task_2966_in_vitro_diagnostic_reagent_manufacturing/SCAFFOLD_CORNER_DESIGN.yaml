            - call: "POST /test-results"
              payload: { subject_type: "REAGENT_LOT", reagent_lot_id: "${rlq_id}", test_code: "ACTIVITY", measured_value: 101.0, reference_measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { q_act_bias: $.data.bias_pct }
            - call: "POST /test-results"
