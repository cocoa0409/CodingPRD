    output: CodificationSubmission[]
    side_effects: []
  - method: POST
    path: "/clerk/codification-submissions/{submission_id}/decide"
    description: "Accepts or rejects a submission that is IN_REVIEW inside a LOCKED cycle."
    roles: [CodificationEditor]
    code: 200
    input: [decision]
    output: CodificationSubmission
    side_effects:
      - "submission.status IN_REVIEW -> ACCEPTED when decision == ACCEPT, -> REJECTED when decision == REJECT"
  - method: POST
    path: "/clerk/codification-submissions/{submission_id}/resolve-conflict"
    description: "Resolves an old-versus-new provision conflict between two CONFLICT_HELD submissions under the requested precedence basis."
    roles: [CodificationEditor]
    code: 200
    input: [resolution_basis, "winning_submission_id?"]
    output: CodificationSubmission
    side_effects:
      - "calculation supplement_conflict_precedence picks the winner; winner -> ACCEPTED, loser -> REJECTED"
      - "both rows record resolution_basis and resolved_by_user_id = X-User-ID, and clear conflict_with_submission_id"
      - "cycle.conflict_count -= 1"
      - "the response body is the submission named in the path, whatever side of the conflict it landed on"

  # ---- public records requests --------------------------------------
  - method: POST
    path: "/clerk/records-requests"
    description: "Intakes a public records request and computes its statutory response deadline. Open to the public."
    roles: [Anonymous, CityClerk, DeputyClerk]
    code: 201
    input: [requester_name, requester_email, subject_description, "target_series_id?", "commercial_purpose?"]
    output: PublicRecordsRequest
    side_effects:
      - "request.intake_on = logical clock date; request.due_on = calculation records_request_due_date"
      - "request.fulfillment_status = RECEIVED and request.fee_status = NOT_ASSESSED (independent axes)"
      - "the request's own id becomes the X-User-ID a Requester authenticates with"
  - method: GET
    path: "/clerk/records-requests/{request_id}"
    description: "Reads one request, including both status axes and the fee ledger. A Requester may only read its own request."
    roles: [Requester, CityClerk, DeputyClerk, RecordsOfficer]
    code: 200
    input: []
    output: PublicRecordsRequest
    side_effects: []
  - method: GET
    path: "/clerk/records-requests"
    description: "Lists requests, optionally filtered by target series or either status axis."
    roles: [CityClerk, DeputyClerk, RecordsOfficer]
    code: 200
    input: ["target_series_id?", "fulfillment_status?", "fee_status?", "limit?", "offset?"]
    output: PublicRecordsRequest[]
    side_effects: []
  - method: POST
    path: "/clerk/records-requests/{request_id}/begin-review"
    description: "Moves the disclosure axis from RECEIVED into UNDER_REVIEW."
    roles: [CityClerk, DeputyClerk]
    code: 200
    input: []
    output: PublicRecordsRequest
    side_effects:
      - "request.fulfillment_status RECEIVED -> UNDER_REVIEW; fee_status untouched"
  - method: POST
    path: "/clerk/records-requests/{request_id}/exemption-review"
    description: "Records the statutory exemptions asserted over the responsive records."
    roles: [RecordsOfficer]
    code: 200
    input: [exemption_claims]
    output: PublicRecordsRequest
    side_effects:
      - "request.fulfillment_status UNDER_REVIEW -> EXEMPTION_REVIEW; request.exemption_count = len(exemption_claims)"
  - method: POST
    path: "/clerk/records-requests/{request_id}/assess-fee"
    description: "Assesses the copy and staff-time fee under the requested fee schedule. Assessable exactly once."
    roles: [CityClerk, DeputyClerk]
    code: 200
    input: [fee_schedule_variant, fee_lines]
    output: PublicRecordsRequest
    side_effects:
      - "request.total_assessed_cents = calculation records_request_fee_assessment; request.fee_schedule_variant recorded"
      - "request.fee_balance_cents and net_cash_cents = calculation records_request_fee_ledger; fee_status NOT_ASSESSED -> ASSESSED"
      - "fulfillment_status untouched"
  - method: POST
    path: "/clerk/records-requests/{request_id}/waive-fee"
    description: "Waives part or all of the outstanding balance."
    roles: [RecordsOfficer]
    code: 200
    input: [waived_cents, waiver_reason]
    output: PublicRecordsRequest
    side_effects:
      - "request.total_waived_cents += waived_cents; the ledger is recomputed from the four counters"
      - "fee_status -> WAIVED when the balance reaches 0 with net_cash_cents == 0, -> PAID when the balance reaches 0 with net_cash_cents > 0"
  - method: POST
    path: "/clerk/records-requests/{request_id}/payments"
    description: "Records a payment against the assessed fee. A Requester may only pay its own request."
    roles: [Requester, CityClerk]
    code: 200
    input: [amount_cents]
    output: PublicRecordsRequest
    side_effects:
      - "request.total_collected_cents += amount_cents; the ledger is recomputed"
      - "fee_status ASSESSED -> DEPOSIT_HELD on a partial payment, -> PAID when the balance reaches 0"
  - method: POST
    path: "/clerk/records-requests/{request_id}/disposition"
    description: "Releases, partially releases or denies the records."
    roles: [CityClerk, RecordsOfficer]
    code: 200
    input: [disposition, "denial_basis?"]
    output: PublicRecordsRequest
    side_effects:
      - "request.fulfillment_status -> RELEASED | PARTIALLY_RELEASED | DENIED"
      - "PARTIAL_RELEASE and DENIAL both require exemption_count >= 1; DENIAL also requires denial_basis"
  - method: POST
    path: "/clerk/records-requests/{request_id}/withdraw"
    description: "Withdraws the request and unwinds the entire fee ledger to zero. A Requester may only withdraw its own request."
    roles: [Requester, CityClerk]
    code: 200
    input: []
    output: PublicRecordsRequest
    side_effects:
      - "request.fulfillment_status -> WITHDRAWN"
      - "compensating action: total_waived_cents = total_assessed_cents and refunded_cents = total_collected_cents, driving fee_balance_cents and net_cash_cents to exactly 0"
      - "fee_status -> REFUNDED when money had been collected, -> WAIVED when a fee was assessed but never paid, otherwise unchanged"
  - method: POST
    path: "/clerk/records-requests/{request_id}/close"
    description: "Closes a disposed request; requires a zero fee balance and may release a retention anchor."
    roles: [CityClerk]
    code: 200
    input: []
    output: PublicRecordsRequest
    side_effects:
      - "request.fulfillment_status -> CLOSED; request.closed_on = logical clock date"
      - "validation 40 (ERR_REQUEST_NOT_CLOSABLE) is evaluated BEFORE validation 80 (ERR_FEE_BALANCE_OUTSTANDING)"
      - "recomputes eligible_through_on on the target RecordSeries when its retention_trigger == REQUEST_CLOSURE"

  # ---- retention: record series, accessions, destruction ------------
  - method: POST
    path: "/clerk/record-series"
    description: "Adds an item to the retention schedule."
    roles: [RecordsOfficer]
    code: 201
    input: [series_code, name, retention_years, retention_trigger, "permanent?", "legal_hold_status?"]
    output: RecordSeries
    side_effects:
      - "counts start at zero and eligible_through_on is null until the first accession or request closure supplies an anchor"
  - method: GET
    path: "/clerk/record-series/{series_id}"
    description: "Reads one retention series, including the custody counters and eligible_through_on."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: []
    output: RecordSeries
    side_effects: []
  - method: PUT
    path: "/clerk/record-series/{series_id}"
    description: "Places or lifts a legal hold, or flags the series permanent."
    roles: [RecordsOfficer]
    code: 200
    input: ["legal_hold_status?", "permanent?"]
    output: RecordSeries
    side_effects:
      - "increments RecordSeries.version by 1"
      - "recomputes eligible_through_on (permanent forces it to null)"
  - method: POST
    path: "/clerk/record-series/{series_id}/accessions"
    description: "Accessions items into custody, moving the retention anchor forward."
    roles: [RecordsOfficer, DeputyClerk]
    code: 201
    input: [item_count, accessioned_on]
    output: RecordSeries
    side_effects:
      - "series.total_accessioned_count += item_count and series.active_item_count += item_count (invariant record_custody_conservation)"
      - "series.last_accessioned_on = max(existing, input accessioned_on)"
      - "recomputes eligible_through_on from calculation destruction_eligibility_date"
  - method: POST
    path: "/clerk/destruction-batches"
    description: "Proposes a batch for destruction under the retention schedule."
    roles: [RecordsOfficer, DeputyClerk]
    code: 201
    input: [series_id, item_count, cutoff_on]
    output: DestructionBatch
    side_effects:
      - "batch.proposed_by_officer_id = X-User-ID; batch.eligible_through_on snapshots series.eligible_through_on"
      - "batch.blocking_request_id = the earliest-created PublicRecordsRequest on this series outside CLOSED and WITHDRAWN, else null"
      - "validation 52 (ERR_SERIES_UNDER_LEGAL_HOLD, ERR_SERIES_PERMANENT_RETENTION) is evaluated BEFORE validation 62 (ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE)"
  - method: GET
    path: "/clerk/destruction-batches/{batch_id}"
    description: "Reads one destruction batch, including its blocking request and certification signatures."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: []
    output: DestructionBatch
    side_effects: []
  - method: GET
    path: "/clerk/destruction-batches"
    description: "Lists destruction batches, optionally filtered by series, blocking request or status."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: ["series_id?", "blocking_request_id?", "status?", "limit?", "offset?"]
    output: DestructionBatch[]
    side_effects: []
  - method: POST
    path: "/clerk/destruction-batches/{batch_id}/certify"
    description: "Signs the certificate of destruction. The certifier must not be the officer who proposed the batch."
    roles: [CityClerk, RecordsOfficer]
    code: 200
    input: [certified_on]
    output: DestructionBatch
    side_effects:
      - "batch.status PROPOSED -> CERTIFIED; batch.certifying_officer_id = X-User-ID; batch.certified_on = input certified_on"
      - "batch.blocking_request_id is recomputed; a non-null value raises ERR_SERIES_HAS_OPEN_REQUEST"
      - "series.active_item_count -= batch.item_count and series.destroyed_item_count += batch.item_count; total_accessioned_count is unchanged"
  - method: POST
    path: "/clerk/destruction-batches/{batch_id}/rescind"
    description: "Rescinds a certificate of destruction, restoring the custody counters exactly."
    roles: [RecordsOfficer]
    code: 200
    input: [rescind_reason]
    output: DestructionBatch
    side_effects:
      - "batch.status CERTIFIED -> RESCINDED; batch.rescind_reason = input rescind_reason"
      - "series.active_item_count += batch.item_count and series.destroyed_item_count -= batch.item_count, returning the custody triple to its pre-certify values with zero drift"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:

  # ---- authentication and authorization ------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent from the request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Requester acts on a PublicRecordsRequest whose id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the paired earlier step (proposed the destruction batch, or resolved a conflict in the cycle being certified)"

  # ---- existence -----------------------------------------------------
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "no Venue with the given id"
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "no Meeting with the given id"
  - id: ERR_PACKET_NOT_FOUND
    http: 404
    condition: "no AgendaPacket with the given id"
  - id: ERR_AGENDA_ITEM_NOT_FOUND
    http: 404
    condition: "no AgendaItem with the given id"
  - id: ERR_MOTION_NOT_FOUND
    http: 404
    condition: "no Motion with the given id"
  - id: ERR_MINUTES_NOT_FOUND
    http: 404
    condition: "no MinutesRecord with the given id"
  - id: ERR_NUMBER_SERIES_NOT_FOUND
    http: 404
    condition: "no NumberSeries with the given id"
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "no LegislativeInstrument with the given id"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "no PublicationNotice with the given id"
  - id: ERR_CODE_TITLE_NOT_FOUND
    http: 404
    condition: "no CodeTitle with the given id"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no SupplementCycle with the given id"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no CodificationSubmission with the given id"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "no PublicRecordsRequest with the given id"
  - id: ERR_SERIES_NOT_FOUND
    http: 404
    condition: "no RecordSeries with the given id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no DestructionBatch with the given id"

  # ---- request shape -------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required field is missing, an enum value is outside its set, a numeric range is violated, a date is malformed, or a conditional field pairing is broken"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset below 0"

  # ---- optimistic concurrency ----------------------------------------
  - id: ERR_STALE_MEETING_VERSION
    http: 412
    condition: "expected_meeting_version does not equal the Meeting's current version"
  - id: ERR_STALE_CODE_TITLE_VERSION
    http: 412
    condition: "expected_code_title_version does not equal the CodeTitle's current version"
  - id: ERR_STALE_MINUTES_VERSION
    http: 412
    condition: "expected_minutes_version does not equal the MinutesRecord's current version"

  # ---- state preconditions -------------------------------------------
  - id: ERR_INVALID_MEETING_STATE
    http: 409
    condition: "the Meeting is not in a state from which the requested transition is declared"
  - id: ERR_INVALID_PACKET_STATE
    http: 409
    condition: "the AgendaPacket is not DRAFT for item addition or posting, nor DRAFT/POSTED for withdrawal"
  - id: ERR_INVALID_MOTION_STATE
    http: 409
    condition: "the Motion is not SECONDED when a tally is submitted"
  - id: ERR_INVALID_MINUTES_STATE
    http: 409
    condition: "the MinutesRecord is not DRAFT for edit or submit, nor APPROVED for a correction"
  - id: ERR_INVALID_INSTRUMENT_STATE
    http: 409
    condition: "the LegislativeInstrument is not in a state from which the requested reading or veto is declared"
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "the PublicationNotice is not DRAFT for order, nor ORDERED for certification"
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "the CodificationSubmission is not IN_REVIEW for decide, nor CONFLICT_HELD for resolve-conflict"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "the DestructionBatch is not PROPOSED for certify, nor CERTIFIED for rescind"
  - id: ERR_INVALID_REQUEST_STATE
    http: 409
    condition: "the PublicRecordsRequest is not on the declared from-state of the requested disclosure- or fee-axis transition"
  - id: ERR_MEETING_NOT_IN_SESSION
    http: 409
    condition: "a motion is recorded or tallied, or a reading is advanced, while the meeting is not IN_SESSION"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "a submission is filed into a cycle that is not OPEN"
  - id: ERR_CYCLE_NOT_LOCKED
    http: 409
    condition: "a submission decision, a conflict resolution or a certification is attempted on a cycle that is not LOCKED"
  - id: ERR_NUMBER_SERIES_CLOSED
    http: 409
    condition: "an instrument is introduced against a CLOSED series, or an adoption cascade must mint from one"
  - id: ERR_CYCLE_HAS_OPEN_SUBMISSIONS
    http: 409
    condition: "certification is attempted while a submission of the cycle is still PENDING or IN_REVIEW"
  - id: ERR_UNRESOLVED_CONFLICTS
    http: 409
    condition: "certification is attempted while cycle.conflict_count is above 0 or a submission is still CONFLICT_HELD"
  - id: ERR_REQUEST_NOT_CLOSABLE
    http: 409
    condition: "close is attempted on a request that is not RELEASED, PARTIALLY_RELEASED or DENIED"

  # ---- safety, compliance, regulatory --------------------------------
  - id: ERR_NOTICE_DEADLINE_MISSED
    http: 409
    condition: "convene is attempted with notice_compliant false, or a reschedule would move the posted packet's recomputed notice_deadline_at to at or before the logical clock"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "present_member_count is below meeting.quorum_required at convene"
  - id: ERR_VOTE_TALLY_MISMATCH
    http: 422
    condition: "yes + no + abstain + recused does not equal meeting.present_member_count"
  - id: ERR_NO_VOTING_MEMBERS
    http: 422
    condition: "every present member is recused, leaving an effective_base of 0"
  - id: ERR_SERIES_UNDER_LEGAL_HOLD
    http: 409
    condition: "a destruction batch is proposed or certified on a series whose legal_hold_status is not NONE"
  - id: ERR_SERIES_PERMANENT_RETENTION
    http: 409
    condition: "a destruction batch is proposed or certified on a series flagged permanent"
  - id: ERR_SERIES_HAS_OPEN_REQUEST
    http: 409
    condition: "certification is attempted while a PublicRecordsRequest on the series sits outside CLOSED and WITHDRAWN"

  # ---- capacity, uniqueness, aggregate limits ------------------------
  - id: ERR_CYCLE_SUBMISSION_CAPACITY
    http: 422
    condition: "a fourth client-origin submission is filed into one cycle (MAX_CLIENT_SUBMISSIONS_PER_CYCLE is 3; origin CASCADE is exempt)"
  - id: ERR_PACKET_REVISION_LIMIT
    http: 422
    condition: "a fourth agenda packet revision is created for one meeting (MAX_PACKET_REVISIONS is 3)"
  - id: ERR_NUMBER_SERIES_EXHAUSTED
    http: 422
    condition: "an adoption cascade must mint a sequence above MAX_SEQUENCE (999)"
  - id: ERR_DUPLICATE_NUMBER_SERIES
    http: 422
    condition: "(series_year, instrument_class) already exists on another NumberSeries"
  - id: ERR_DUPLICATE_SUPPLEMENT_NUMBER
    http: 422
    condition: "(code_title_id, supplement_number) already exists on another SupplementCycle"
  - id: ERR_DUPLICATE_SEQUENCE_NUMBER
    http: 422
    condition: "(packet_id, sequence_number) already exists on another AgendaItem"
  - id: ERR_DUPLICATE_SERIES_CODE
    http: 422
    condition: "series_code already exists on another RecordSeries"
  - id: ERR_DUPLICATE_CODE_TITLE
    http: 422
    condition: "title_number already exists on another CodeTitle"
  - id: ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE
    http: 422
    condition: "the batch's item_count exceeds the series' active_item_count"

  # ---- temporal constraints ------------------------------------------
  - id: ERR_VENUE_WINDOW_CONFLICT
    http: 409
    condition: "the buffered venue occupation overlaps another SCHEDULED, NOTICED or IN_SESSION meeting on the same venue"
  - id: ERR_VENUE_CLOSED
    http: 409
    condition: "a meeting is scheduled or rescheduled into a venue whose status is CLOSED"
  - id: ERR_SUPPLEMENT_WINDOW_CONFLICT
    http: 409
    condition: "the cycle's inclusive submission window overlaps or abuts an OPEN or LOCKED cycle on the same code title"
  - id: ERR_PUBLICATION_COUNT_MISMATCH
    http: 409
    condition: "len(publication_dates) does not equal notice.required_publication_count"
  - id: ERR_PUBLICATION_DEADLINE_MISSED
    http: 409
    condition: "the last supplied publication date falls after notice.publication_deadline_on"
  - id: ERR_PUBLICATION_INTERVAL_TOO_SHORT
    http: 409
    condition: "two consecutive publication dates are out of order or closer than PUBLICATION_MIN_GAP_DAYS"
  - id: ERR_OUTSIDE_SUBMISSION_WINDOW
    http: 409
    condition: "a client-origin submission is filed while the logical clock date lies outside the cycle's inclusive window"
  - id: ERR_RETENTION_ANCHOR_UNRESOLVED
    http: 409
    condition: "the series' retention anchor cannot be resolved, so eligible_through_on is null"
  - id: ERR_RETENTION_PERIOD_NOT_ELAPSED
    http: 409
    condition: "eligible_through_on lies after the logical clock date, or cutoff_on lies after eligible_through_on"

  # ---- fiscal --------------------------------------------------------
  - id: ERR_FEE_BALANCE_OUTSTANDING
    http: 409
    condition: "close is attempted while fee_balance_cents is above 0"
  - id: ERR_FEE_NOT_ASSESSED
    http: 422
    condition: "a payment is recorded before any fee has been assessed"
  - id: ERR_FEE_ALREADY_ASSESSED
    http: 422
    condition: "a second assessment is attempted on a request whose fee_status is no longer NOT_ASSESSED"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds the request's current fee_balance_cents"
  - id: ERR_WAIVER_EXCEEDS_BALANCE
    http: 422
    condition: "waived_cents exceeds the request's current fee_balance_cents"

  # ---- referential and configuration ---------------------------------
  - id: ERR_CODE_SECTION_UNKNOWN
    http: 422
    condition: "the submission's code_section_ref does not match its instrument's, or the instrument's code_title_id does not match the cycle's"
  - id: ERR_SERIES_CLASS_MISMATCH
    http: 422
    condition: "the NumberSeries instrument_class or series_year does not match the instrument being introduced"
  - id: ERR_MOTION_TARGET_INVALID
    http: 422
    condition: "the motion_type and its target pairing are inconsistent, including a minutes motion whose target minutes belong to the motion's own meeting"
  - id: ERR_EMPTY_AGENDA_PACKET
    http: 422
    condition: "a packet with item_count 0 is posted"
  - id: ERR_DENIAL_WITHOUT_EXEMPTION
    http: 422
    condition: "a denial or partial release is recorded while exemption_count is 0"
  - id: ERR_NO_OPEN_SUPPLEMENT_CYCLE
    http: 409
    condition: "the certify-publication cascade finds no OPEN SupplementCycle on the code title whose window contains the logical clock date"

# =====================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =====================================================================
roles:

  - name: CityClerk
    description: "The elected or appointed clerk: custodian of the official record. Runs notice, minutes, numbering, publication and the destruction certificate."
    identity: opaque
    exclusive_operations:
      - "POST /clerk/venues"
      - "PUT /clerk/venues/{venue_id}"
      - "POST /clerk/number-series"
      - "POST /clerk/number-series/{series_id}/close"
      - "POST /clerk/meetings"
      - "POST /clerk/meetings/{meeting_id}/reschedule"
      - "POST /clerk/meetings/{meeting_id}/cancel"
      - "POST /clerk/meetings/{meeting_id}/agenda-packets"
      - "POST /clerk/agenda-packets/{packet_id}/post"
      - "POST /clerk/agenda-packets/{packet_id}/withdraw"
      - "POST /clerk/minutes/{minutes_id}/submit"
      - "POST /clerk/motions/{motion_id}/tally"
      - "POST /clerk/instruments"
      - "POST /clerk/instruments/{instrument_id}/advance-reading"
      - "POST /clerk/publication-notices/{notice_id}/certify-publication"
      - "POST /clerk/records-requests/{request_id}/close"
    shared_operations:
      - "every GET endpoint on the clerk surface"
      - "POST /clerk/_clock/set_current_utc"
      - "POST /clerk/agenda-packets/{packet_id}/agenda-items"
      - "PUT /clerk/minutes/{minutes_id}"
      - "POST /clerk/minutes/{minutes_id}/corrections"
      - "POST /clerk/motions"
      - "POST /clerk/publication-notices/{notice_id}/order"
      - "POST /clerk/records-requests"
      - "POST /clerk/records-requests/{request_id}/begin-review"
      - "POST /clerk/records-requests/{request_id}/assess-fee"
      - "POST /clerk/records-requests/{request_id}/payments"
      - "POST /clerk/records-requests/{request_id}/disposition"
      - "POST /clerk/records-requests/{request_id}/withdraw"
      - "POST /clerk/destruction-batches/{batch_id}/certify"

  - name: DeputyClerk
    description: "Deputy clerk: prepares the record but cannot notice a meeting, tally a vote, certify a publication or close a request."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint on the clerk surface"
      - "POST /clerk/_clock/set_current_utc"
      - "POST /clerk/agenda-packets/{packet_id}/agenda-items"
      - "PUT /clerk/minutes/{minutes_id}"
      - "POST /clerk/minutes/{minutes_id}/corrections"
      - "POST /clerk/motions"
      - "POST /clerk/publication-notices/{notice_id}/order"
      - "POST /clerk/records-requests"
      - "POST /clerk/records-requests/{request_id}/begin-review"
      - "POST /clerk/records-requests/{request_id}/assess-fee"
      - "POST /clerk/record-series/{series_id}/accessions"
      - "POST /clerk/destruction-batches"

  - name: PresidingOfficer
    description: "Mayor or chair: calls the meeting to order, adjourns it, breaks ties and exercises the veto. Never touches the record itself."
    identity: opaque
    exclusive_operations:
      - "POST /clerk/meetings/{meeting_id}/convene"
      - "POST /clerk/meetings/{meeting_id}/adjourn"
      - "POST /clerk/instruments/{instrument_id}/veto"
    shared_operations:
      - "every GET endpoint on the clerk surface"
      - "POST /clerk/_clock/set_current_utc"

  - name: RecordsOfficer
    description: "Records and public-disclosure officer: owns the retention schedule, exemption review, fee waivers and the rescission of destruction certificates."
    identity: opaque
    exclusive_operations:
      - "POST /clerk/record-series"
      - "PUT /clerk/record-series/{series_id}"
      - "POST /clerk/records-requests/{request_id}/exemption-review"
      - "POST /clerk/records-requests/{request_id}/waive-fee"
      - "POST /clerk/destruction-batches/{batch_id}/rescind"
    shared_operations:
      - "every GET endpoint on the clerk surface"
      - "POST /clerk/_clock/set_current_utc"
      - "POST /clerk/record-series/{series_id}/accessions"
      - "POST /clerk/destruction-batches"
      - "POST /clerk/destruction-batches/{batch_id}/certify"
      - "POST /clerk/records-requests/{request_id}/disposition"

  - name: CodificationEditor
    description: "Code publisher's editor: opens supplement cycles, files and decides submissions, resolves old-versus-new provision conflicts and certifies the supplement."
    identity: opaque
    exclusive_operations:
      - "POST /clerk/code-titles"
      - "POST /clerk/code-titles/{title_id}/supplement-cycles"
      - "POST /clerk/supplement-cycles/{cycle_id}/lock"
      - "POST /clerk/supplement-cycles/{cycle_id}/certify"
      - "POST /clerk/codification-submissions"
      - "POST /clerk/codification-submissions/{submission_id}/decide"
      - "POST /clerk/codification-submissions/{submission_id}/resolve-conflict"
    shared_operations:
      - "every GET endpoint on the clerk surface"
      - "POST /clerk/_clock/set_current_utc"

  - name: Requester
    description: "A member of the public who has filed a records request and acts on it thereafter. X-User-ID is the PublicRecordsRequest.id returned at intake."
    identity: "entity_backed:PublicRecordsRequest"
    exclusive_operations: []
    shared_operations:
      - "GET /clerk/records-requests/{request_id} (own request only)"
      - "POST /clerk/records-requests/{request_id}/payments (own request only)"
      - "POST /clerk/records-requests/{request_id}/withdraw (own request only)"

  - name: Anonymous
    description: "An unauthenticated member of the public. May only file a new records request; the response carries the id it must present as a Requester thereafter."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /clerk/records-requests"
