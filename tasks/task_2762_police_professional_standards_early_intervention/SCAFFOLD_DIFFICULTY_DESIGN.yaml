              captures: { alert_id: "$.data[0].id", alert_v1: "$.data[0].version", alert_status_initial: "$.data[0].status", alert_score: "$.data[0].composite_score" }
            - call: "POST /eis-alerts/${alert_id}/intervention-plans"
              payload: { expected_alert_version: "${alert_v1}", supervisor_officer_id: "${sup_id}", required_checkin_count: 2, duration_days: 30, interventions: ["RETRAINING", "COUNSELING"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { plan1_id: $.data.id }
            - call: "POST /intervention-plans/${plan1_id}/activate"
              payload: { activation_note: "Monitoring begins." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /intervention-plans/${plan1_id}/check-ins"
