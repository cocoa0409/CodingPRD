              payload: { reservation_id: "${res2}", amount_cents: 1000, expected_goodwill_credit_version: "${gcv}" }
              as: GuestServices
              as_user_id: "cs_9"
              captures: { ptx_kind: $.data.kind, ptx_memo: $.data.memo_code }
            - call: "GET /goodwill-credits/${gc_id}"
              payload: {}
              as: GuestServices
              as_user_id: "cs_3"
              captures: { gc_status1: $.data.status, gc_rem1: $.data.remaining_cents }
            - call: "POST /goodwill-credits/${gc_id}/revoke"
              payload: { reason_code: "POLICY_REVIEW" }
              as: GuestServices
              as_user_id: "cs_3"
              captures: { gc_status2: $.data.status, gc_revoked: $.data.revoked_cents }
            - call: "GET /guests"
              payload: {}
              as: GuestServices
              as_user_id: "cs_3"
              captures: { guest_first: "$.data[0].id" }
          assert:
            - "${pay_status} == DEPOSIT_PAID: GuestServices may settle the deposit on a guest's reservation, and the DEPOSIT_CHARGE row of 7722 is booked against ${res1}"
            - "${forf} == 4361 and ${refd} == 3361: cancelling at exactly the 48 hour mark retains 5000 bp of the 7722 deposit (3861) plus the 500 rebook fee and refunds the rest"
            - "${rx_filer} == cs_9: the filer is recorded from X-User-ID even though the acting role is GuestServices rather than the owning guest"
            - "${rx_status} == APPROVED and ${rx_short} == 3361 == 4361 - 1000; ${res1} gains a FORFEITURE_REVERSAL and a REFUND row of 1000 each with memo_code REFUND_EXCEPTION, and Guest.${g1_id}.lifetime_refunded_cents becomes 4361"
            - "Guest.${g1_id}.refund_scrutiny_flag stays false because 4361 is below the restaurant's 300000 scrutiny threshold"
            - "${gc_issuer} == cs_2 with issued_cents 3361, remaining_cents 3361 and status ISSUED — a different operator from the decider cs_1, so priority 9 is satisfied"
            - "${ptx_kind} == GOODWILL_REDEMPTION and ${ptx_memo} == CREDIT_APPLIED: the redemption endpoint is shared, and cs_9 may redeem on the guest's behalf even though cs_9 filed the exception, because priority 9 does not police the redemption step"
            - "${gc_status1} == PARTIALLY_REDEEMED and ${gc_rem1} == 2361 after the 1000 redemption; Reservation.${res2}.amount_paid_cents == 1000 with balance_due_cents 24740 and payment_status still UNPAID"
            - "${gc_status2} == REVOKED and ${gc_revoked} == 2361: the revoker cs_3 differs from the issuer cs_2, remaining_cents falls to 0, and the already-redeemed 1000 stays with the guest — no PaymentTransaction is written by the revoke"
            - "${guest_first} == ${g1_id} with total_count 1: GuestServices reads across every restaurant and guest, unlike the entity_backed roles"
            - "all four GuestServices shared operations (payments, cancel, file exception, redeem) and all three exclusive operations (decide, issue, revoke) returned success; no call returned 403"

