              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/day-plans/${day_id}/weather"
              payload: { wind_speed_mph: 30.0, wet_bulb_f: 30.0, new_snow_in: 0.0 }
              as: SnowmakingSupervisor
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/day-plans/${day_id}"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/day-plans/${day_id}/close-day"
              payload: { season_final: false }
