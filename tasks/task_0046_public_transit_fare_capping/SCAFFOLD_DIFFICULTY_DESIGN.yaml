      - name: not_found_beats_tap_week_mismatch_existence_vs_referential
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_TAP_WEEK_MISMATCH]
        distinguishing_aspect: |
          Error-category pair existence (ERR_NOT_FOUND, priority 4) vs business_referential
          (ERR_TAP_WEEK_MISMATCH, priority 8): a POST /taps that BOTH cites a non-existent funding_source_id
          AND carries an out-of-range tapped_at returns ERR_NOT_FOUND, not ERR_TAP_WEEK_MISMATCH.
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z."
            - "Rider R_pp with an OPEN FareWeek W (week_start 2026-06-01, covers 06-01..06-07)."
