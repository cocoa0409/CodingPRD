            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "6109100012", customs_value_cents: 400000, quantity: 1, preference_claim: "USMCA" }
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
