            - "all nine triggers return HTTP 403 with data.error_id == ERR_UNAUTHORIZED: ${d_co_assign}, ${d_sc_cred}, ${d_pa_renew}, ${d_pa_checkin}, ${d_int_approve}, ${d_fo_review}, ${d_qr_adjudicate}, ${d_int_hearing} and ${d_sc_clock} are all ERR_UNAUTHORIZED"
            - "${d_pa_renew} and ${d_pa_checkin} prove there is no hierarchical override: ProgramAdmin owns configuration and discipline but cannot renew a credential or check an interpreter in"
            - "${d_pa_checkin} is ERR_UNAUTHORIZED and not ERR_NOT_RESOURCE_OWNER — priority 2 decides before the ownership rule at priority 6 ever runs"
