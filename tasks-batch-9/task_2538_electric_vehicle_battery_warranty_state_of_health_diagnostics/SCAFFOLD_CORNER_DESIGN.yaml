              captures: { ship1_id: $.data.id }
            - call: "POST /battery-warranty/pack-shipments"
              payload: { pack_id: "${pack2_id}", origin_service_center_id: "${center_id}", certifying_technician_id: "${tech_a_id}", shipment_contents: "FULL_PACK", packaging_spec: "SP376_STRONG_OUTER", state_of_charge_pct: 30.00 }
              as: ServiceTechnician
