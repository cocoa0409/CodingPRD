  - rule_id: transitive_cascade
    instances:

      - name: curing_payment_cascades_five_hops_from_window_to_loyalty_tier
        grounds:
          - endpoints["POST /agreements/{id}/renewal-payments"]
          - state_machines.ReinstatementWindow.OPEN_to_USED
          - state_machines.Agreement.DELINQUENT_to_CURRENT
          - calculations.loyalty_points_accrual
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          One POST fires a five-hop chain in which every hop is a different
          entity and each hop's input is the previous hop's output: payment
          allocation (RenewalPayment) -> ReinstatementWindow OPEN -> USED ->
          Agreement DELINQUENT -> CURRENT with periods_paid 0 -> 5 ->
          LoyaltyLedgerEntry of +253 points -> Customer loyalty_tier STANDARD ->
          SILVER. Stopping the cascade at hop 3 leaves loyalty_tier STANDARD;
          crossing the 200-point lifetime threshold is only reachable through
          the whole chain.
        test_recipe:
          setup:
            - "TX StateRtoRule (grace 3 days, late_fee_pct 0.10, reinstatement_fee_cents 500, short window 5 days, long window 15 days, reinstate_threshold_months 2)"
            - "a VERIFIED customer with a WEEKLY x 52 agreement on a NEW 120000-cent unit (renewal_rate_cents 5077, monthly_equivalent_rate_cents 22000, total_of_payments_cents 269004) DELIVERED at 2026-08-01T00:00:00Z, period 1 due 2026-08-08T00:00:00Z"
            - "the logical clock at 2026-08-12T00:00:00Z with one day-close already run, so the agreement is DELINQUENT with late_fee_balance_cents 508, reinstatement_fee_balance_cents 500 and an OPEN 5-day window (rent_applied_cents 0 is below the 44000-cent two-month threshold) expiring 2026-08-17T00:00:00Z"
            - "the customer is loyalty_tier STANDARD with loyalty_points_lifetime 0"
