# SCAFFOLD_CORNER_DESIGN - 1.9 breadth walk of references/claim-extraction-guide.md
# Scenario 2342 Development Impact Fee Study & Nexus Analysis
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: fee_program_creation_echoes_every_declared_constant
        claim_type: creation
        grounds:
          - entities.FeeProgram
          - endpoints[POST /fee-programs]
          - response_envelope
        distinguishing_aspect: |
          Creates a FeeProgram supplying ALL fifteen input fields with values that differ
          from every declared default, so an implementation that silently substitutes its
          own defaults cannot pass. Also pins the system/computed fields that must be
          present in the create response: version 1, effective_fee_study_id null and
          last_report_status NOT_FILED.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock set to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /fee-programs"
              payload: { name: "City of Seagate Impact Fee Program", jurisdiction_code: "SEAGATE", fiscal_year_start_month: 10, statutory_expenditure_deadline_years: 7, notice_min_days: 21, protest_threshold_bp: 6000, effective_delay_days: 45, admin_charge_bp: 250, credit_cap_bp: 4000, los_policy: "PLANNED_STANDARD_ALLOWED", discount_rate_bp: 500, max_deferral_days: 540, default_penalty_bp: 750, at_risk_window_days: 180, report_grace_days: 90 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 with envelope { success: true, data: {...}, error_id: null, message: null }."
            - "data.name == 'City of Seagate Impact Fee Program' and data.jurisdiction_code == 'SEAGATE'."
            - "All thirteen supplied constants are echoed unchanged: fiscal_year_start_month 10, statutory_expenditure_deadline_years 7, notice_min_days 21, protest_threshold_bp 6000, effective_delay_days 45, admin_charge_bp 250, credit_cap_bp 4000, los_policy 'PLANNED_STANDARD_ALLOWED', discount_rate_bp 500, max_deferral_days 540, default_penalty_bp 750, at_risk_window_days 180, report_grace_days 90."
            - "data.id is a server-generated non-empty string and data.version == 1."
            - "data.created_at == data.updated_at == '2026-01-05T00:00:00Z' (the logical clock, not wall time)."
            - "data.effective_fee_study_id is null, data.last_report_fiscal_year is null, data.last_report_filed_at is null, data.last_report_filed_by_user_id is null and data.last_report_status == 'NOT_FILED'."

      - name: fee_program_omitted_constants_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.FeeProgram
          - endpoints[POST /fee-programs]
        distinguishing_aspect: |
          The mirror image of the creation claim: only the two fields without defaults are
          supplied, and every one of the thirteen defaulted policy constants must appear in
          the response at its declared default. Pins the exact default values the rest of
          the suite depends on (admin_charge_bp 300, credit_cap_bp 5000, notice_min_days 14,
          protest_threshold_bp 5000, effective_delay_days 60, deadline 5 years).
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock set to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.fiscal_year_start_month == 7, data.statutory_expenditure_deadline_years == 5, data.notice_min_days == 14, data.protest_threshold_bp == 5000, data.effective_delay_days == 60."
            - "data.admin_charge_bp == 300, data.credit_cap_bp == 5000, data.los_policy == 'EXISTING_DEFICIENCY_EXCLUDED', data.discount_rate_bp == 400."
            - "data.max_deferral_days == 730, data.default_penalty_bp == 1000, data.at_risk_window_days == 365, data.report_grace_days == 180."
            - "data.version == 1 and data.last_report_status == 'NOT_FILED'."

      - name: facility_category_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.FacilityCategory
          - endpoints[POST /facility-categories]
        distinguishing_aspect: |
          Posts a FacilityCategory whose body also carries client-chosen values for the
          system and computed fields (id, version, created_at, fund_balance_cents,
          fund_posture). Those keys are not declared inputs, so they must be ignored
          rather than honoured: the row is created with server-minted identity, version 1,
          the logical clock as timestamps and every derived fund field at its zero value.
        test_recipe:
          setup:
            - "FeeProgram HARBOR exists (all defaults)."
            - "Logical clock set to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000, id: "cat-forced-1", version: 99, created_at: "2001-01-01T00:00:00Z", fund_balance_cents: 777777, fund_posture: "REFUND_DUE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
          assert:
            - "HTTP 201 - the undeclared keys are ignored, not rejected."
            - "data.id != 'cat-forced-1'; it is a server-generated identifier."
            - "data.version == 1 (NOT 99) and data.created_at == data.updated_at == '2026-01-05T00:00:00Z' (NOT 2001-01-01)."
            - "data.fund_balance_cents == 0, data.fund_posture == 'COMPLIANT', data.refund_due_cents == 0, data.committed_demand_units == 0, data.deferred_receivable_cents == 0 and data.oldest_unexpended_vintage_at is null."
            - "data.existing_deficiency_demand_units == 0 (its declared default) and the four supplied standard fields are echoed."

      - name: nexus_component_growth_demand_units_computed_at_creation
        claim_type: computed_fields
        grounds:
          - entities.NexusComponent.fields.growth_demand_units
          - entities.NexusComponent.fields.allocation_status
          - calculations.growth_demand_units
          - endpoints[POST /nexus-components]
        distinguishing_aspect: |
          growth_demand_units is source: computed and must be evaluated the moment the
          component is created - before any allocate call - while the three
          allocation-derived money fields stay null and allocation_status stays PENDING.
          The ROADS mix (1200 dwellings x 1.0100 plus 200000 nonres sqft / 1000 x 3.7500)
          exercises BOTH terms of the growth formula: 1212.0000 + 750.0000 == 1962.0000.
        test_recipe:
          setup:
            - "FeeProgram HARBOR with defaults; FacilityCategory ROADS; DRAFT FeeStudy (PLAN_BASED)."
            - "Logical clock set to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000.0000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.growth_demand_units == 1962.0000 (1200 * 1.0100 = 1212.0000 plus 200000/1000 * 3.7500 = 750.0000), carried at 4 decimal places."
            - "data.allocation_status == 'PENDING' and data.allocated_at is null."
            - "data.plan_based_cost_per_unit_cents, data.standard_based_cost_per_unit_cents, data.adopted_cost_per_unit_cents and data.nexus_ratio are all null - creation computes growth only, never the allocation."
            - "data.version == 1."

      - name: get_fee_study_returns_the_stored_certification_record
        claim_type: retrieval
        grounds:
          - entities.FeeStudy
          - endpoints[GET /fee-studies/{id}]
          - state_machines.FeeStudy.DRAFT_to_NEXUS_CERTIFIED
        distinguishing_aspect: |
          Reads back a certified study by id and asserts the full stored record - not just
          status but the certification stamps (certified_by_user_id from X-User-ID,
          certified_at from the logical clock) and the still-null downstream notice,
          adoption and activation fields.
        test_recipe:
          setup:
            - "Program HARBOR, categories PARKS and ROADS, a PLAN_BASED study with both components allocated and one schedule line each, certified at 2026-01-05T00:00:00Z by analyst-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.0100 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fee-studies/${study_id}/certify-nexus"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /fee-studies/${study_id}"
              as: CouncilClerk
              as_user_id: "clerk-1"
          assert:
            - "HTTP 200."
            - "data.id == the created study id and data.fee_program_id == the HARBOR program id."
            - "data.title == '2026 Impact Fee Study', data.methodology == 'PLAN_BASED', data.status == 'NEXUS_CERTIFIED', data.revision_round == 0."
            - "data.certified_by_user_id == 'analyst-1' and data.certified_at == '2026-01-05T00:00:00Z'."
            - "data.notice_method, data.notice_days, data.notice_published_at, data.protest_window_ends_at, data.adopted_at, data.adopted_by_user_id, data.effective_at, data.activated_at and data.superseded_by_fee_study_id are all null."
            - "data.protest_weight_bp == 0 and data.protest_count == 0."

      - name: fee_study_listing_filters_by_status_and_reports_pagination_totals
        claim_type: listing
        grounds:
          - endpoints[GET /fee-studies]
          - response_envelope.pagination_fields
          - entities.FeeStudy.fields.status
        distinguishing_aspect: |
          Two studies of the same program in different statuses (one NEXUS_CERTIFIED, one
          DRAFT) are listed three ways: filtered by status, and unfiltered with limit 1 at
          offset 0 and offset 1. total_count must reflect the FILTERED population (1, then
          2) rather than the page size, and has_more must be derived from
          offset + limit < total_count, so page 1 of 2 reports true and page 2 reports false.
        test_recipe:
          setup:
            - "Program HARBOR with a certified study A (2026 Impact Fee Study)."
            - "A second DRAFT study B (2027 Impact Fee Study) created after re-reading the program version, since creating study A already bumped FeeProgram.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.0100 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fee-studies/${study_id}/certify-nexus"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "GET /fee-programs/${prog_id}"
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { prog_v2: $.data.version }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2027 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v2}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { studyb_id: $.data.id }
          trigger:
            - call: "GET /fee-studies"
              payload: { fee_program_id: "${prog_id}", status: "DRAFT", limit: 1, offset: 0 }
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /fee-studies"
              payload: { fee_program_id: "${prog_id}", limit: 1, offset: 0 }
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /fee-studies"
              payload: { fee_program_id: "${prog_id}", limit: 1, offset: 1 }
              as: Developer
              as_user_id: "dev-1"
          assert:
            - "Call 1: HTTP 200, data is an array of length 1, data[0].id == study B's id, data[0].status == 'DRAFT', total_count == 1, limit == 1, offset == 0, has_more == false."
            - "Call 2: total_count == 2 (the status filter is gone), data length 1, has_more == true because 0 + 1 < 2."
            - "Call 3: total_count == 2, data length 1, offset == 1, has_more == false because 1 + 1 == 2."
            - "Calls 2 and 3 together return both study ids exactly once - the offset window does not repeat or skip a row."

      - name: filtering_and_paging_stay_consistent_across_a_mutation
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints[GET /development-applications]
          - entities.DevelopmentApplication.fields.assessment_status
        distinguishing_aspect: |
          Filter, page and mutation interact on the same collection: with two of three
          applications assessed, the ASSESSED filter must report total_count 2 and page
          correctly at limit 1, and the two pages together must return the two ids exactly
          once. Assessing the third row then changes total_count to 3 and empties the
          UNASSESSED filter, proving total_count tracks the filtered population rather than
          the table.
        test_recipe:
          setup:
            - "HARBOR program with an EFFECTIVE study."
            - "Three applications BP-1001, BP-1002 and BP-1003, all SINGLE_FAMILY with 10 dwellings and PERMIT trigger."
            - "BP-1001 and BP-1002 are assessed on 2026-05-01; BP-1003 is still UNASSESSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
