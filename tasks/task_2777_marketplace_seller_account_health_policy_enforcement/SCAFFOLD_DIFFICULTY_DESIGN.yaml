          Error-category pair: state (85) versus business_fiscal (140). One single request breaks
          BOTH rules — the seller is in disbursement_state NORMAL and the CLAIM_EXPOSURE reserve
          (189000) is far above the available balance (100000). The 409 state error must win; only
          after the posture is fixed does the same request expose the 422 capacity error, which
          proves the lower-priority violation was live all along.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Seller S credited 100000 cents; disbursement_state NORMAL because nothing is under investigation and enforcement_state is ACTIVE."
            - "One MetricSnapshot with defect_claims_pending 21 -> open_defect_claim_units 21; no health evaluation is ever run, so metric_tier stays null and risk_tier resolves to TIER_1."
            - "CLAIM_EXPOSURE reserve = 21 x 9000 x EXPOSURE_MULTIPLIER[TIER_1] 1.00 = 189000 > available 100000."
            - "PolicyRule LA-CONF-1 (LISTING_ACCURACY, base 1.00, ACCOUNT, requires_poa false) and one REPORTED violation are staged so the posture can be fixed later without changing the money."
            - "expected_seller_version is re-read immediately before each attempt so the priority-90 OCC rule never fires and cannot mask either error."
