          trigger:
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-12T09:00:00Z", occurred_at: "2026-04-12T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

