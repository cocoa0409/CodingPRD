              captures: { blocked_err: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING"
            - "the ESCALATED item belongs to rating ${rating_id}, a different entity than the engagement ${eng2} being scheduled (cross-entity gate)"
            - "engagement ${eng2} itself is in COMMITTEE_READY with an ACTIVE criteria version — every same-entity precondition passes; only the sibling-entity escalation blocks"

      - name: affirm_blocked_when_posture_delinquent
        grounds:
          - state_machines.Rating.PUBLISHED_to_PUBLISHED
          - calculations.surveillance_posture_derivation
          - errors[ERR_AFFIRM_BLOCKED_BY_POSTURE]
        distinguishing_aspect: "Rating x DisclosureObligation pair: the AFFIRM action on a PUBLISHED rating is rejected because the rating's obligation (a different entity) is DELINQUENT — the derived surveillance_posture axis gates the publication-axis action; DOWNGRADE remains legal from the same state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED 2026-09-08T00:00:00Z, notch A; clock advanced to 2028-02-26T00:00:00Z so obligation period 1 (due 2028-01-26T00:00:00Z) is DELINQUENT (2028-02-26 > due+30d 2028-02-25) and posture == DELINQUENT."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { rating_v_now: $.data.version, posture_now: $.data.surveillance_posture }
          trigger:
            - call: "POST /muni/ratings/${rating_id}/actions"
              payload: { action: "AFFIRM", rationale: "annual surveillance affirm", expected_rating_version: "${rating_v_now}" }
              as: SurveillanceOfficer
              captures: { affirm_err: "$.data.error_id" }
            - call: "POST /muni/ratings/${rating_id}/actions"
              payload: { action: "DOWNGRADE", new_notch: "BBB", rationale: "non-disclosure downgrade", expected_rating_version: "${rating_v_now}" }
              as: SurveillanceOfficer
              captures: { down_notch: $.data.notch, down_version: $.data.version }
          assert:
            - "AFFIRM is rejected 409 with error_id == ERR_AFFIRM_BLOCKED_BY_POSTURE (posture == DELINQUENT; AFFIRM requires CURRENT or GRACE)"
            - "DOWNGRADE from the identical state succeeds: notch == BBB (exactly one step) and version incremented by 1 — the gate is action-specific, not a blanket lock"
            - "Rating remains PUBLISHED throughout; only the posture axis (derived from DisclosureObligation.${..} status DELINQUENT) gated the AFFIRM"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: chair_calendar_half_open_adjacency
        grounds:
          - errors[ERR_SESSION_WINDOW_OVERLAP]
          - endpoints.POST_/muni/engagements/{id}/committee-sessions
        distinguishing_aspect: "Half-open [start_at, end_at) interval semantics on the chair-calendar resource: a session starting exactly when another ends is permitted (12:00 == 12:00 adjacency), while one overlapping by one hour is rejected — adjacency is NOT overlap under half-open semantics."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Three GO engagements (same issuer) all at COMMITTEE_READY with indicative A; single chair-1."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_b: $.data.id }
            - call: "POST /muni/engagements/${eng_b}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_b}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_b}/documents"
              payload: { document_code: "ADOPTED_BUDGET" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_b}/documents"
              payload: { document_code: "TAX_BASE_REPORT" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_b}/documents"
              payload: { document_code: "DEBT_STATEMENT" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_b_v: $.data.version }
            - call: "POST /muni/engagements/${eng_b}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 4, score_debt_profile: 2, expected_engagement_version: "${eng_b_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_c: $.data.id }
            - call: "POST /muni/engagements/${eng_c}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_c}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_c}/documents"
              payload: { document_code: "ADOPTED_BUDGET" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_c}/documents"
              payload: { document_code: "TAX_BASE_REPORT" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng_c}/documents"
              payload: { document_code: "DEBT_STATEMENT" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_c_v: $.data.version }
            - call: "POST /muni/engagements/${eng_c}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 4, score_debt_profile: 2, expected_engagement_version: "${eng_c_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_a: $.data.id }
            - call: "POST /muni/engagements/${eng_b}/committee-sessions"
              payload: { start_at: "2026-09-02T12:00:00Z", end_at: "2026-09-02T14:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_b: $.data.id, sess_b_status: $.data.status }
            - call: "POST /muni/engagements/${eng_c}/committee-sessions"
              payload: { start_at: "2026-09-02T11:00:00Z", end_at: "2026-09-02T13:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { overlap_err: "$.data.error_id" }
          assert:
            - "session A [10:00,12:00) created 201; session B [12:00,14:00) created 201 (B.start == A.end is adjacency, permitted under half-open semantics)"
            - "session C [11:00,13:00) rejected 409 with error_id == ERR_SESSION_WINDOW_OVERLAP (intersects both A and B interiors)"
            - "all three engagements are distinct — the 24h same-engagement cooling-off rule is not in play; the chair calendar alone drove the rejection"

      - name: engagement_cooling_off_buffer_24h
        grounds:
          - errors[ERR_SESSION_COOLING_OFF]
          - endpoints.POST_/muni/engagements/{id}/committee-sessions
        distinguishing_aspect: "Buffered interval semantics on the engagement resource (different resource AND different semantics than the chair calendar): a second same-engagement session must start at least 24h after the prior session's end — an 8h gap is rejected while exactly 24h is permitted (inclusive boundary)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One GO engagement at COMMITTEE_READY with indicative A; chair-1; no other sessions exist, so the chair calendar never conflicts."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
          trigger:
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_1: $.data.id }
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T20:00:00Z", end_at: "2026-09-02T22:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { cooling_err: "$.data.error_id" }
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-03T12:00:00Z", end_at: "2026-09-03T14:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_3: $.data.id }
          assert:
            - "session 1 [2026-09-02T10:00,12:00) created 201"
            - "session 2 starting 2026-09-02T20:00 (8h after session 1 end) rejected 409 with error_id == ERR_SESSION_COOLING_OFF even though the chair calendar is free at that time"
            - "session 3 starting exactly 2026-09-03T12:00:00Z (== session 1 end + 24h) created 201 — the buffer boundary is inclusive-permitting (gap >= 24h)"
            - "the rejected session 2 leaves no residue: session 3's cooling-off base is still session 1's end_at"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: withdraw_reengage_fee_credit_conservation
        grounds:
          - calculations.engagement_fee_and_refund
          - entities.Issuer.fields.credit_balance_cents
          - state_machines.RatingEngagement.ENGAGED_to_WITHDRAWN
        distinguishing_aspect: "Conserved monetary quantity: the withdrawal refund (forward action) credits 2250000 cents and the re-engagement credit application (compensating action) debits exactly that amount, returning issuer.credit_balance_cents to its pre-withdrawal value 0 while both engagements settle their fees in full (4500000 cash + 0 credit, then 2250000 cash + 2250000 credit)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One issuer, credit_balance_cents 0. Engagement 1 (GO) created and accepted with a full cash payment of 4500000."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng1: $.data.id }
            - call: "POST /muni/engagements/${eng1}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
          trigger:
            - call: "POST /muni/engagements/${eng1}/withdraw"
              payload: {}
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng1_status: $.data.status, eng1_refund: $.data.refund_cents }
            - call: "GET /muni/issuers/${iss}"
              payload: {}
              as: PlatformAdmin
              captures: { credit_mid: $.data.credit_balance_cents }
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng2: $.data.id }
            - call: "POST /muni/engagements/${eng2}/accept-terms"
              payload: { fee_payment_cents: 2250000, apply_credit_cents: 2250000 }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng2_status: $.data.status, eng2_paid: $.data.fee_paid }
            - call: "GET /muni/issuers/${iss}"
              payload: {}
              as: PlatformAdmin
              captures: { credit_end: $.data.credit_balance_cents }
          assert:
            - "withdrawal: eng1 status == WITHDRAWN and refund_cents == 2250000 (round_half_up(4500000 * 0.5))"
            - "invariant midpoint: Issuer.credit_balance_cents == 2250000 (refund moved money from retained fees into issuer credit; nothing created or destroyed)"
            - "compensating re-engagement: eng2 accept with fee_payment_cents 2250000 + apply_credit_cents 2250000 == fee_cents 4500000 -> status ENGAGED, fee_paid == true"
            - "invariant restored: Issuer.credit_balance_cents == 0 — the withdraw-then-reengage pair conserves the credit balance exactly"
            - "no ERR_INSUFFICIENT_ISSUER_CREDIT: applied credit 2250000 == balance 2250000 at application time"

      - name: recusal_alternate_pool_conservation
        grounds:
          - calculations.committee_outcome_tally
          - entities.CommitteeSession.fields.eligible_voter_count
          - endpoints.POST_/muni/committee-sessions/{id}/alternates
        distinguishing_aspect: "Conserved count quantity (different conserved quantity than money): a recusal drops the eligible voter pool 5 -> 4 and the chair's alternate appointment restores it 4 -> 5, so len(voter_ids) - len(recused) + len(alternates) == COMMITTEE_SIZE 5 holds before and after the recusal/appointment pair."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY (indicative A); session scheduled 2026-09-02T10:00-12:00Z with pool voter-1..voter-5, opened at 10:30."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
          trigger:
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", recusal_reason: "conflict of interest" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - call: "GET /muni/committee-sessions/${sess}"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { pool_after_recusal: $.data.eligible_voter_count }
            - call: "POST /muni/committee-sessions/${sess}/alternates"
              payload: { recused_voter_id: "voter-1", alternate_voter_id: "voter-6" }
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "GET /muni/committee-sessions/${sess}"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { pool_after_alternate: $.data.eligible_voter_count }
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-4", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-4"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-6", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-6"
            - call: "POST /muni/committee-sessions/${sess}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_status: $.data.status, sess_outcome: $.data.outcome_notch }
          assert:
            - "eligible_voter_count == 4 after the recusal (5 - 1 recused + 0 alternates)"
            - "eligible_voter_count == 5 after the alternate appointment (5 - 1 + 1) — pool cardinality restored to COMMITTEE_SIZE"
            - "alternate voter-6 votes legally; close COMPLETED with outcome BBB (even-count median of A,A,BBB,BBB picks the worse middle)"
            - "invariant: len(voter_ids) - len(recused_voter_ids) + len(appointed_alternate_ids) == 5 at close, identical to the value at scheduling"
