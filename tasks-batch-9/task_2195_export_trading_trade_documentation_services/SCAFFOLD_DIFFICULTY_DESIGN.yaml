  # ===========================================================================
  # RULE 3 — Non-linear state machines: parallel dimensions, then an in-place cycle
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: export_order_settlement_walks_four_states_while_fulfillment_pinned_at_shipped
        grounds:
          - state_machines.ExportOrder.LC_ACCEPTED_to_DOCS_PRESENTED
          - state_machines.ExportOrder.DOCS_PRESENTED_to_DISHONORED
          - state_machines.ExportOrder.DISHONORED_to_CLAIM_FILED
          - state_machines.DocumentPresentation.COMPLIED_to_REFUSED
          - entities.ExportOrder.fields.fulfillment_status
          - entities.ExportOrder.fields.settlement_status
        distinguishing_aspect: |
          Shape targeted here is the PARALLEL-DIMENSION shape: settlement_status advances
          LC_ACCEPTED -> DOCS_PRESENTED -> DISHONORED -> CLAIM_FILED across four calls while
          fulfillment_status stays exactly SHIPPED for all four, proving the two dimensions
          are independent fields rather than one merged status; a single-status
          implementation cannot hold SHIPPED and CLAIM_FILED simultaneously.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted) with one CreditInsurancePolicy POL-C: credit_limit_usd 30000.00, insured_pct 90.00, deductible_usd 5000.00, effective 2026-08-01 -> 2026-12-31, exposure_tier TIER_1, premium_usd 229.50."
            - "ExportOrder FOB / ZONE_1 / USD with one line 100.000 @ 250.0000 (ordered_goods_value_usd 25000.00); screened NLR; LCL booking 1000.000 kg on a ZONE_1 sailing with tariff 300.00; COMMERCIAL_INVOICE and PACKING_LIST ISSUED; booking CONFIRMED; BILL_OF_LADING ISSUED on_board_date 2026-08-01 so fulfillment_status is SHIPPED and stays SHIPPED for the rest of the recipe."
            - "LetterOfCredit LC-2195-003 (26000.00, tolerance 5.00 -> max_drawable_usd 27300.00, min_drawable_usd 24700.00, SIGHT, expiry 2026-10-15, presentation_period_days 21) reviewed by rev_1 and ACCEPTED, which charged POL-C with the 25000.00 exposure."
            - "The DocumentPresentation was examined with zero findings so it is COMPLIED, then dishonoured, then a NON_PAYMENT DisputeCase was opened for the order."
            - "The logical clock never moves from 2026-08-01T00:00:00Z, so days_after_on_board is 0 and no sweep interferes."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Kanto Machine Works", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /credit-insurance-policies"
              payload: { buyer_id: "${buyer_id}", policy_number: "POL-C-2195", credit_limit_usd: 30000.00, insured_pct: 90.00, deductible_usd: 5000.00, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { policy_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Stainless couplings", hs_code: "732290", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { line1_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Han River", voyage_no: "H401", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 20000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v: "$.data.version" }
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 1000.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_id: "$.data.id" }
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "COMMERCIAL_INVOICE" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { inv_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${inv_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /trade-documents"
              payload: { export_order_id: "${order_id}", doc_type: "PACKING_LIST" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { pl_doc_id: "$.data.id" }
            - call: "POST /trade-documents/${pl_doc_id}/issue"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /freight-bookings/${booking_id}/confirm"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /freight-bookings/${booking_id}/bill-of-lading"
              payload: { on_board_date: "2026-08-01T00:00:00Z", shipped_lines: [ { shipment_line_id: "${line1_id}", shipped_quantity: 100.000 } ] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { bl_doc_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              payload: { export_order_id: "${order_id}", lc_number: "LC-2195-003", issuing_bank_swift: "SMBCJPJT", amount_usd: 26000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-10-15T00:00:00Z", latest_shipment_date: "2026-09-30T00:00:00Z", presentation_period_days: 21, partial_shipment_allowed: false, transshipment_allowed: false, required_document_types: ["COMMERCIAL_INVOICE", "BILL_OF_LADING"] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { review_id: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              payload: { recommendation: "ACCEPT" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
            - call: "GET /export-orders/${order_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_v: "$.data.version" }
            - call: "POST /document-presentations"
              payload: { letter_of_credit_id: "${lc_id}", export_order_id: "${order_id}", trade_document_ids: ["${inv_doc_id}", "${bl_doc_id}"], expected_export_order_version: "${order_v}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { pres_id: "$.data.id" }
            - call: "POST /document-presentations/${pres_id}/examine"
              payload: { findings: [] }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
            - call: "POST /document-presentations/${pres_id}/dishonour"
              payload: { refusal_reason: "Issuing bank refused payment at maturity" }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
            - call: "POST /dispute-cases"
              payload: { export_order_id: "${order_id}", dispute_type: "NON_PAYMENT", claimed_amount_usd: 25000.00 }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { dispute_id: "$.data.id" }
            - call: "GET /credit-insurance-policies/${policy_id}"
              payload: {}
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { policy_v: "$.data.version" }
          trigger:
            - call: "POST /credit-insurance-policies/${policy_id}/claims"
              payload: { dispute_case_id: "${dispute_id}", expected_credit_insurance_policy_version: "${policy_v}" }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
          assert:
            - "ExportOrder.${order_id}.settlement_status == CLAIM_FILED"
            - "ExportOrder.${order_id}.fulfillment_status == SHIPPED (unchanged by all four settlement-dimension moves)"
            - "DocumentPresentation.${pres_id}.status == REFUSED"
            - "DisputeCase.${dispute_id}.credit_insurance_policy_id == ${policy_id} and DisputeCase.${dispute_id}.status == OPEN"
            - "CreditInsurancePolicy.${policy_id}.utilized_usd == 25000.00 and CreditInsurancePolicy.${policy_id}.available_limit_usd == 5000.00 and CreditInsurancePolicy.${policy_id}.status == ACTIVE"
            - "CreditInsurancePolicy.${policy_id}.exposure_tier == TIER_1 and CreditInsurancePolicy.${policy_id}.premium_usd == 229.50"
            - "ExportOrder.${order_id}.insured_exposure_usd == 25000.00 (still held: CLAIM_FILED is not a release state)"
            - "LetterOfCredit.${lc_id}.status == ACCEPTED and LetterOfCredit.${lc_id}.drawn_amount_usd == 0.00"

      - name: lc_amendment_cycle_returns_accepted_credit_to_received_and_supersedes_its_review
        grounds:
          - state_machines.LetterOfCredit.ACCEPTED_to_RECEIVED
          - state_machines.LetterOfCredit.RECEIVED_to_UNDER_REVIEW
          - state_machines.LetterOfCredit.UNDER_REVIEW_to_ACCEPTED
          - state_machines.ExportOrder.LC_ACCEPTED_to_UNSECURED
          - entities.LetterOfCredit.fields.amendment_round
          - entities.LCTermsReview.fields.status
        distinguishing_aspect: |
          Shape targeted here is the IN-PLACE CYCLE, not parallel dimensions: the same
          LetterOfCredit row visits RECEIVED -> UNDER_REVIEW -> ACCEPTED -> RECEIVED ->
          UNDER_REVIEW -> ACCEPTED, so amendment_round reaches 1 while the first
          LCTermsReview is left SUBMITTED-then-SUPERSEDED and its TERMS finding is force-CURED,
          and the tolerance change recomputes max_drawable_usd 27300.00 -> 27810.00; a DAG
          implementation that treats ACCEPTED as terminal cannot re-enter RECEIVED at all.
        test_recipe:
