            - "GET /halls/${hall_id} as FacilityPlanner -> 200, release_posture == OPEN, at_risk_rack_count == 0"
            - "accept_release_packet_after_close_succeeds -> 200, status == ACCEPTED, accepted_by_user_id == u-om-1, released_kw == 15.68"
            - "GET /racks/${rack_id} as FacilityPlanner -> 200, status == RELEASED"
            - "GET /cages/${cage_id} as FacilityPlanner -> 200, operational_status == RELEASED"
            - "execute_pdu_mop -> 200, status == IN_EXECUTION, target_resource_type == PDU"
            - "live_pdu_derate_under_covering_mop_succeeds -> 200, measured_derate_factor == 0.98, status == COMMISSIONED"
            - "GET /busways/${bw_a} as FacilityPlanner -> 200, usable_variant == COMMISSIONED, usable_kw == 192.72 (min(273.136 * 0.80 * 0.90, 240.000) == 196.65792, times 0.98, rounded once)"

      - name: busway_energize_before_pdu_commissioning_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PDU_NOT_COMMISSIONED] (409, a busway is energized while its parent PDU is still PLANNED)"
          - "validations[17] priority 17 on POST /busways/{busway_id}/energize"
        distinguishing_aspect: "The energize gate reads the PARENT PDU's status, not the busway's own, so a perfectly installed busway is refused while its upstream PDU has no measured derate on file."
        excluded_because:
          difficulty_instance: rack_power_on_requires_both_feed_busways_energized
          rationale: "That §1.8 cross_entity_state_dependency instance already drives POST /busways/{id}/energize against an uncommissioned PDU and asserts 409 ERR_PDU_NOT_COMMISSIONED as part of its per-side matrix, so a separate §1.9 recipe would duplicate the same trigger and setup."

      - name: mop_window_collision_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MOP_WINDOW_CONFLICT] (409, the MOP's buffered window collides with another SCHEDULED or IN_EXECUTION MOP on the same target resource)"
          - "validations[21] priority 21 on POST /mops/{mop_id}/schedule"
        distinguishing_aspect: "Collision is evaluated on the BUFFERED window (each side padded by the change-control buffer) against MOPs on the same target resource only, so windows that look disjoint by their raw instants still collide."
        excluded_because:
          difficulty_instance: mop_window_buffer_collision_on_same_busway
          rationale: "The §1.8 resource_temporal_overlap instance already schedules a second MOP whose raw window is disjoint but whose buffered window overlaps and asserts 409 ERR_MOP_WINDOW_CONFLICT, including the adjacent-but-legal control case."

      - name: load_bank_concurrency_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOADBANK_CONCURRENCY_EXCEEDED] (409, a third load bank run would overlap two already-occupying runs in the same white space)"
          - "validations[22] priority 22 on POST /load-bank-tests"
        distinguishing_aspect: "Occupancy is counted over overlapping windows in the same hall regardless of which package owns each run, and the limit is two."
        excluded_because:
          difficulty_instance: loadbank_aggregate_reserve_and_concurrency_on_hall
          rationale: "The §1.8 resource_temporal_overlap instance already creates two overlapping runs and asserts 409 ERR_LOADBANK_CONCURRENCY_EXCEEDED on the third, together with the non-overlapping control run that is admitted."

      - name: commissioning_reserve_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COMMISSIONING_RESERVE_EXCEEDED] (422, overlapping load bank runs would demand more kW than Hall.commissioning_reserve_kw)"
          - "validations[46] priority 46 on POST /load-bank-tests"
        distinguishing_aspect: "The reserve ceiling is the hall's tier-derived commissioning_reserve_kw and the demand is the SUM of target_kw over time-overlapping runs, so two individually affordable runs can be collectively unaffordable."
        excluded_because:
          difficulty_instance: loadbank_aggregate_reserve_and_concurrency_on_hall
          rationale: "The same §1.8 instance already asserts 422 ERR_COMMISSIONING_RESERVE_EXCEEDED for the overlapping-sum case and contrasts it with the concurrency-count error on the same endpoint."

      - name: thermal_posture_gate_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_THERMAL_POSTURE_NOT_NOMINAL] (409, script execution, witnessing or a load bank start is attempted while hall.thermal_posture != NOMINAL)"
          - "validations[33] priority 33 on execute-script, witness and load bank start"
        distinguishing_aspect: "A containment leakage FAIL elsewhere in the hall can freeze commissioning of an unrelated package, because the gate reads the hall-level thermal posture rather than anything on the package."
        excluded_because:
          difficulty_instance: package_witness_requires_hall_thermal_posture_nominal
          rationale: "The §1.8 cross_entity_state_dependency instance already fails a leakage test to drive the hall to CONSTRAINED and asserts 409 ERR_THERMAL_POSTURE_NOT_NOMINAL on witnessing, then restores NOMINAL and completes the witness."

      - name: mop_revision_limit_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MOP_REVISION_LIMIT_REACHED] (409, a third revision of the same MOP is attempted, revision_count == MAX_MOP_REVISIONS)"
          - "validations[36] priority 36 on POST /mops/{mop_id}/revise"
        distinguishing_aspect: "The counter is monotonic across review rounds and is never reset by a fresh REVISION_REQUESTED, so the third revise is refused even though the MOP is in a legal from-state."
        excluded_because:
          difficulty_instance: mop_revision_cycle_returns_to_under_review
          rationale: "The §1.8 non_linear_state_machine instance already walks two full revise cycles and asserts 409 ERR_MOP_REVISION_LIMIT_REACHED on the third, including the revision_count reading after each loop."

      - name: busway_capacity_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BUSWAY_CAPACITY_EXCEEDED] (422, the reservation would drive busway.committed_kw above busway.usable_kw)"
          - "validations[44] priority 44 on POST /rack-feeds"
        distinguishing_aspect: "The ceiling is the variant-selected usable_kw (DESIGN vs COMMISSIONED), so the same reservation is legal in FIT_OUT and refused after the phase advance when a derate below 1.00 shrinks the trunk."
        excluded_because:
          difficulty_instance: busway_capacity_equality_admits_feed_at_exact_usable_kw
          rationale: "The §1.8 boundary_precision_check instance already admits a feed at exactly usable_kw and asserts 422 ERR_BUSWAY_CAPACITY_EXCEEDED one cent above it, which is the tightest possible trigger for this code."

  # =========================================================================
  # SECTION: rbac  (§1.7 — nine roles, segregation of duties, peer approvers)
  # =========================================================================
  - section: rbac
    instances:
      - name: facility_planner_layout_surface_is_exclusive
        claim_type: unauthorized_denial
        grounds:
          - "roles[FacilityPlanner].exclusive_operations = [POST /halls, POST /tenants, POST /halls/{hall_id}/advance-phase, POST /racks, PATCH /racks/{rack_id}, POST /racks/{rack_id}/install]"
          - "validations[2] priority 2: the acting role must appear in the target endpoint's roles list, error ERR_UNAUTHORIZED 403"
        distinguishing_aspect: "The whole white-space LAYOUT surface belongs to FacilityPlanner alone, including as-built asset tagging (PATCH /racks/{rack_id}) which reads like an operations or electrical task; no other staff role may touch any of the six operations, while every staff role keeps its read access. The 403 is returned even when the request would also fail a state or prerequisite rule, because auth sits at priority 2."
        test_recipe:
          setup: "Hall CX80 in PLANNING with containment zone CA-1 and one PLANNED rack R-1-1."
          setup_api_calls:
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
