      - name: record_segment_three_dimensions_with_redaction_rework_cycle
        grounds:
          - state_machines.RecordSegment.redaction_status
          - state_machines.RecordSegment.retrieval_status
          - state_machines.RecordSegment.sensitivity_status
          - state_machines.Request.REDACTION_to_RELEASE_READY
        distinguishing_aspect: >
          Three independent state dimensions on one entity plus a genuine cycle in
          the third: APPLIED -> REWORK -> APPLIED -> APPROVED. The rework edge also
          clears redaction_applied_by_user_id, so the second pass may legitimately
          be applied by a different analyst, and only the APPROVED visit moves the
          parent's page ledger.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility with the default sensitive-category list; patient; ATTORNEY requester authorized for BEHAVIORAL_HEALTH."
            - "Third-party SECURE_PORTAL request accepted; two segments retrieved: GENERAL_MEDICAL 40 pages, BEHAVIORAL_HEALTH 22 pages."
