        claim_type: cascading_side_effects
        grounds: [state_machines.Member.ACTIVE_to_WITHDRAWN, state_machines.Enrollment.ACTIVE_to_DROPPED, state_machines.Contract.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Withdrawing a member with one enrollment and one ACTIVE contract drops the enrollment and terminates the contract with a BUYOUT invoice."
        test_recipe:
