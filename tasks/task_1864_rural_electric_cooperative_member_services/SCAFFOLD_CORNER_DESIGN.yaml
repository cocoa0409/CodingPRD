        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.CapitalCreditAllocation.APPROVED_to_POSTED"
        distinguishing_aspect: "Immediate consistency: the post endpoint's own response and a subsequent GET reflect the credited balances in the same request sequence with no lag."
        test_recipe:
          setup: ["APPROVED allocation for one member with 100 kwh and pool 10000"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
