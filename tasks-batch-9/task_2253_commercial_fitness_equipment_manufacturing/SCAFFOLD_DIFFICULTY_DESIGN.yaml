- rule_id: cross_entity_state_dependency
  instances:
  - name: connected_release_blocked_until_firmware_certification_certified
    grounds:
    - validations[priority=14]
    - state_machines.ModelRevision.QUALIFIED_to_RELEASED
    - state_machines.FirmwareCertification.SUBMITTED_to_CERTIFIED
    - errors[ERR_FIRMWARE_NOT_CERTIFIED]
    - entities.EquipmentModel.fields.connected
    - entities.FirmwareRelease.fields.certified_revision_count
    - validations[priority=6]
    distinguishing_aspect: 'The QUALIFIED -> RELEASED edge of a CONNECTED model depends on the cert_status of a different entity: release is rejected with ERR_FIRMWARE_NOT_CERTIFIED both when no FirmwareCertification
      exists and when one exists in SUBMITTED, and succeeds only once a ComplianceOfficer whose X-User-ID differs from the submitter''s flips it to CERTIFIED.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - C700 Connected Bike (CONNECTED / FULL_COMMERCIAL / CONSOLE_T2) has revision C700-R1 in QUALIFIED with verified_cycle_count 500000.
      - FirmwareRelease FW-2.1.0 targets CONSOLE_T2 and is ACTIVE.
      - FirmwareCertification c1 pairs FW-2.1.0 with C700-R1 and was submitted by X-User-ID pe-01.
      - No CERTIFIED certification exists for the revision until the ComplianceOfficer co-01 certifies c1.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: C700 Connected Bike, category: CONNECTED, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 561325, shipping_weight_kg: 96.5, allowed_finish_codes: [GRAPHITE, CUSTOM_BRAND_DECAL],
          console_platform: CONSOLE_T2}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: C700-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-C, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
        captures: {err_no_cert: $.data.error_id}
      - call: POST /firmware-releases
        payload: {version_string: FW-2.1.0, console_platform: CONSOLE_T2}
        as: ProductEngineer
        captures: {fw1: $.data.id}
      - call: POST /firmware-certifications
        payload: {firmware_release_id: '${fw1}', model_revision_id: '${r1}', test_report_ref: RPT-C700-1}
        as: ProductEngineer
        as_user_id: pe-01
        captures: {c1: $.data.id}
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
        captures: {err_submitted_cert: $.data.error_id}
      - call: POST /firmware-certifications/${c1}/certify
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      trigger:
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: GET /firmware-releases/${fw1}
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      assert:
      - The first release attempt (no FirmwareCertification at all) returned 409 with error_id ERR_FIRMWARE_NOT_CERTIFIED
      - The second release attempt (certification present but cert_status SUBMITTED) returned 409 with error_id ERR_FIRMWARE_NOT_CERTIFIED
      - POST /firmware-certifications/${c1}/certify returned 200 with FirmwareCertification.${c1}.cert_status == CERTIFIED, certified_by_user_id == co-01 and certified_at == 2026-08-01T00:00:00Z
      - FirmwareCertification.${c1}.submitted_by_user_id == pe-01, so the segregation-of-duties check of validations[priority=6] passed
      - POST /model-revisions/${r1}/release returns 200 with ModelRevision.${r1}.status == RELEASED and released_at == 2026-08-01T00:00:00Z
      - EquipmentModel.${m1}.connected == true, released_revision_count == 1 and lifecycle_status == ACTIVE
      - FirmwareRelease.${fw1}.certified_revision_count == 1 and status == ACTIVE
      - ModelRevision.${r1}.verified_cycle_count == 500000 and min_required_cycles == 500000
  - name: failed_run_forces_test_failed_only_when_verified_below_gate
    grounds:
    - state_machines.DurabilityTestRun.RUNNING_to_COMPLETED
    - state_machines.ModelRevision.IN_TESTING_to_TEST_FAILED
    - calculations.revision_cycle_qualification
    - entities.ModelRevision.fields.min_required_cycles
    - concurrency_rules[revision-create-against-stale-model]
    - endpoints[POST /test-runs/{id}/complete]
    distinguishing_aspect: 'Completing a FAILED run drives the owning revision to TEST_FAILED only when the recomputed verified_cycle_count is below min_required_cycles: revision T900-RA stays IN_TESTING
      at 560000 after its failure while revision T900-RB on the same model flips to TEST_FAILED at 190000, so the transition is conditioned on the cross-entity recount rather than on the failure itself.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - T900 Treadmill is FULL_COMMERCIAL, so both of its revisions have min_required_cycles 500000.
      - Revision T900-RA (target 600000) has COMPLETED runs PASSED 180000, PASSED 240000 and then FAILED at 140000, so verified_cycle_count == 560000.
      - Revision T900-RB (target 600000) was created after re-reading EquipmentModel.version and has one COMPLETED PASSED run of 100000 cycles.
      - Rig RIG-A supports FULL_COMMERCIAL and has 2 stations; the runs never overlap.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
