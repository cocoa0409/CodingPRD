            - "CardAccuracyAudit.${aud_7}.waste_pct == 19.98 and waste_flag == false (19.98 < 20.0)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_blocked_when_pinned_card_superseded
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_PICKING_RELEASED
          - state_machines.PreferenceCard.ACTIVE_to_SUPERSEDED
          - errors[ERR_PINNED_CARD_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair SurgicalCase -> PreferenceCard: publishing card version 2
          supersedes version 1, and the case pinned to version 1 can no longer
          release its pick list until it is re-pinned — the case's valid
          transitions depend on the pinned card's state.
        test_recipe:
          setup:
            - "Surgeon S; card v1 (1x GLOVE-PR OPEN) published ACTIVE; case pinned to v1 (SCHEDULED)"
            - "Card v2 for the same surgeon+procedure created and published; v1 becomes SUPERSEDED"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Pin", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_v1: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_v1}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_v1}", as: Any, captures: { v1_ver: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_v1}/publish", payload: { expected_card_version: "${v1_ver}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_v1}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 60, room: "OR-9" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_v2: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_v2}", supply_item_id: "${item_a}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_v2}", as: Any, captures: { v2_ver: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_v2}/publish", payload: { expected_card_version: "${v2_ver}" }, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "GET /perioperative/cases/${case_id}", as: Any }
            - { call: "GET /perioperative/preference-cards/${card_v1}", as: Any, captures: { v1_status: "$.data.status" } }
          assert:
            - "${err} == ERR_PINNED_CARD_NOT_ACTIVE"
            - "PreferenceCard.${card_v1}.status == SUPERSEDED (${v1_status} == SUPERSEDED)"
            - "SurgicalCase.${case_id}.status remains SCHEDULED and pinned_card_version_number == 1 (pin not auto-advanced)"
            - "no PickList exists for the case (GET /perioperative/pick-lists?case_id=... returns total_count 0)"

      - name: approve_blocked_when_requester_deactivated
        grounds:
          - state_machines.ProductRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.Surgeon.ACTIVE_to_INACTIVE
          - errors[ERR_REQUESTER_INACTIVE]
        distinguishing_aspect: |
          Entity pair ProductRequest -> Surgeon: quorum is met and the approver
          differs from the reviewer, but approval still fails because the
          requesting surgeon's state flipped to INACTIVE mid-review — the
          request's valid transitions depend on the requester's state.
        test_recipe:
          setup:
            - "Surgeon S_Q (ACTIVE) submits a product request; officer-1 opens review; officer-1 and officer-2 endorse (quorum 2 met)"
            - "SupplyChainAnalyst deactivates surgeon S_Q"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Req", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2" }
            - { call: "POST /perioperative/surgeons/${s_id}/deactivate", payload: {}, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/approve", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_REQUESTER_INACTIVE"
            - "ProductRequest.${req_id}.status remains UNDER_REVIEW; no SupplyItem with sku VALVE-INTRO-1 was created"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource = room, interval semantics = half-open [start, start+duration):
          a case starting at exactly 10:00 after one ending at 10:00 is allowed
          (touching endpoints), while 09:59 overlaps and is rejected.
        test_recipe:
          setup:
            - "Surgeons S_A and S_B, each with a published 1-line card; case 1 occupies OR-1 [2026-09-02T08:00Z, 10:00Z) for S_A"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. A", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_a: "$.data.id" } }
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. B", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_b: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_a}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_a}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_a}", as: Any, captures: { card_a_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_a}/publish", payload: { expected_card_version: "${card_a_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_b}", procedure_name: "CATH" }, as: SupplyChainAnalyst, captures: { card_b: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_b}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_b}", as: Any, captures: { card_b_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_b}/publish", payload: { expected_card_version: "${card_b_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_a}", card_id: "${card_a}", scheduled_start: "2026-09-02T08:00:00Z", expected_duration_min: 120, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_1: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_b}", card_id: "${card_b}", scheduled_start: "2026-09-02T10:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_2: "$.data.id" } }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_b}", card_id: "${card_b}", scheduled_start: "2026-09-02T09:59:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent case created (${case_2} present): 10:00 start touches the 10:00 end — half-open semantics allow it"
            - "overlapping case: ${err} == ERR_ROOM_DOUBLE_BOOKED (09:59 start intersects [08:00, 10:00))"

      - name: surgeon_turnover_buffer_gap_required
        grounds:
          - validations[priority=9]
          - errors[ERR_SURGEON_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = surgeon, interval semantics = mandatory 30-minute turnover
          gap (different from the room's half-open rule): a gap of exactly 30
          minutes between the same surgeon's cases is allowed (>= 30), while a
          15-minute gap is rejected even though the rooms differ.
        test_recipe:
          setup:
            - "Surgeon S_C with a published 1-line card; case 1 occupies [2026-09-03T08:00Z, 10:00Z) in OR-3"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. C", specialty: "NEURO" }, as: SupplyChainAnalyst, captures: { s_c: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_c}", procedure_name: "LAMINECTOMY" }, as: SupplyChainAnalyst, captures: { card_c: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_c}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_c}", as: Any, captures: { card_c_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_c}/publish", payload: { expected_card_version: "${card_c_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_c}", card_id: "${card_c}", scheduled_start: "2026-09-03T08:00:00Z", expected_duration_min: 120, room: "OR-3" }, as: SupplyChainAnalyst, captures: { case_1: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_c}", card_id: "${card_c}", scheduled_start: "2026-09-03T10:30:00Z", expected_duration_min: 60, room: "OR-4" }, as: SupplyChainAnalyst, captures: { case_2: "$.data.id" } }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_c}", card_id: "${card_c}", scheduled_start: "2026-09-03T10:15:00Z", expected_duration_min: 60, room: "OR-5" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "exactly-30-minute gap case created (${case_2} present): >= semantics allow the boundary"
            - "15-minute gap: ${err} == ERR_SURGEON_SCHEDULE_CONFLICT (different rooms do not rescue it — the surgeon is the constrained resource)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: pick_then_cancel_restock_conserves_on_hand
        grounds:
          - state_machines.SurgicalCase.PICKING_RELEASED_to_CANCELLED
          - state_machines.PickListLine.PENDING_to_PICKED
          - entities.SupplyItem.fields.on_hand_quantity
        distinguishing_aspect: |
          Conserved quantity = physical stock units: pick (2 units out) paired
          with its compensating case-cancel restock (2 units back) must leave
          SupplyItem.on_hand_quantity exactly at its pre-pick value of 10.
        test_recipe:
          setup:
            - "Surgeon S; item KIT-BASIC 500c group KIT on_hand 10; card 2x KIT-BASIC OPEN published; case released, picking started"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Inv", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "KIT-BASIC", name: "Basic kit", unit_cost_cents: 500, substitute_group: "KIT", initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_k: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "BIOPSY" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_k}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 30, room: "OR-10" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_k: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_k}/pick", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/cancel", payload: {}, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/supply-items/${item_k}", as: Any, captures: { on_hand_final: "$.data.on_hand_quantity" } }
            - { call: "GET /perioperative/pick-lists/${pl_id}", as: Any, captures: { pl_status: "$.data.status" } }
          assert:
            - "invariant: SupplyItem.${item_k}.on_hand_quantity == 10 (pick removed 2 -> 8; cancel restocked 2 -> 10; no drift)"
            - "SurgicalCase.${case_id}.status == CANCELLED"
            - "PickList.${pl_id}.status == CANCELLED (${pl_status})"

      - name: capture_then_void_conserves_billed_total
        grounds:
          - state_machines.ConsignmentCharge.PENDING_to_CAPTURED
          - state_machines.ConsignmentCharge.CAPTURED_to_VOIDED
          - calculations.consignment_charge_amount
        distinguishing_aspect: |
          Conserved quantity = the monetary captured-billing sum (different
          type than physical stock): capture (+10000c) paired with its
          compensating void (-10000c) returns the sum of amount_cents over
          CAPTURED charges to its pre-capture value of 0.
        test_recipe:
          setup:
            - "Surgeon S; consignment item ROD-TI 5000c on_hand 10; card 2x ROD-TI OPEN published; case completed with both units used, producing one PENDING charge of 10000c"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Bill", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "SPINE" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_d}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-01T08:00:00Z", expected_duration_min: 120, room: "OR-6" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_d: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_d}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_d}", qty_used: 2 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/consignment-charges?case_id=${case_id}", as: Any, captures: { chg_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /perioperative/consignment-charges/${chg_id}/capture", payload: {}, as: MaterialsManager }
            - { call: "POST /perioperative/consignment-charges/${chg_id}/void", payload: {}, as: MaterialsManager, captures: { chg_status: "$.data.status" } }
            - { call: "GET /perioperative/consignment-charges?case_id=${case_id}&status=CAPTURED", as: Any }
          assert:
            - "charge after completion: ConsignmentCharge.${chg_id}.amount_cents == 10000 (qty_billed 2 x 5000c; consignment bills on open)"
            - "invariant: after capture then void, ${chg_status} == VOIDED and the CAPTURED-filtered list for the case returns total_count 0 (billed sum back to 0, no drift)"
