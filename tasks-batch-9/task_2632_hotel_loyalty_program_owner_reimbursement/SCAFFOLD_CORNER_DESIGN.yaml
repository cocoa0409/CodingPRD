              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-08-10", checkout_date: "2026-08-12", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-08-20", checkout_date: "2026-08-22", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
            - call: "POST /loyalty/redemptions/${r_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { r_confirmed: $.data.fulfillment_status }
          trigger:
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_stay: $.data.error_id }
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_elapsed: $.data.error_id }
            - call: "POST /loyalty/redemptions/${r_id}/no-show"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_arrived: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T11:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { r_stayed: $.data.fulfillment_status, r_reimb: $.data.reimbursement_status, r_est: $.data.estimated_reimbursement_cents }
          assert:
            - "${r_confirmed} == CONFIRMED before the triggers run"
            - "${e_stay} == ERR_STAY_NOT_COMPLETED with http 422 - checkout 2026-08-12 is after the 2026-08-01 clock"
            - "${e_elapsed} == ERR_REDEMPTION_NOT_ELAPSED with http 422 and ${e_arrived} == ERR_REDEMPTION_NOT_ARRIVED with http 422"
            - "Stay.${s_id}.status is still PENDING_POSTING and Redemption.${r_id}.fulfillment_status is still CONFIRMED after the three refusals"
            - "after the clock advance the same completion succeeds: ${r_stayed} == STAYED, ${r_reimb} == ACCRUED"
            - "${r_est} == 45000 - occupancy 0.82 is in the STRONG band, so round_half_up(30000 * 0.75) = 22500 per night times 2 nights"
            - "Hotel.${h_id}.reimbursement_owed_cents == 45000"

      - name: hotel_posture_cycles_between_active_and_fee_delinquent
        claim_type: cyclic
        excluded_because:
          difficulty_instance: hotel_cycles_active_to_fee_delinquent_and_back_on_batch_payment
          rationale: |
            That §1.8 instance already drives the Hotel ACTIVE -> FEE_DELINQUENT -> ACTIVE cycle
            with the fee ledger crossing 250000 and then being cleared by a paid batch, and asserts
            the version bump on each system transition. A breadth-level repeat of the same cycle
            would add no new claim.

      - name: redemption_fulfillment_and_reimbursement_advance_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: redemption_parallel_dimensions_move_independently_under_batch_rejection
          rationale: |
            The independence of the two Redemption dimensions - fulfillment reaching STAYED while
            reimbursement walks NOT_DUE -> ACCRUED -> BATCHED -> ACCRUED under a batch rejection -
            is exactly what that §1.8 instance asserts, including that the rejection never touches
            fulfillment_status.

      - name: voiding_a_posted_stay_cascades_to_ledger_tier_and_benefits
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: stay_void_reverses_ledger_then_drops_tier_then_waives_benefit_obligations
          rationale: |
            The five-hop POSTED_QUALIFYING -> VOID cascade (reversal entries, balance, fee ledger,
            tier drop, benefit waiver) is asserted hop by hop by that §1.8 instance, which also
            pins the order dependency between the tier recompute and the waiver.

      - name: terminating_a_property_cascades_into_batches_and_redemptions
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: hotel_termination_rejects_batch_then_voids_the_rows_that_batch_held
          rationale: |
            The cross-entity fan-out of termination - rejecting OPEN and RELEASED batches, then
            voiding both the ACCRUED rows and the BATCHED rows the rejected batch had captured, and
            waiving OBLIGATED deliveries - is that §1.8 instance's whole subject.

      - name: refunding_a_settled_purchase_compensates_points_and_cash
        claim_type: compensation
        excluded_because:
          difficulty_instance: purchase_refund_returns_program_cash_partner_volume_and_the_annual_purchase_cap
          rationale: |
            The SETTLED -> REFUNDED compensating hop, its per-entry REVERSAL rows, the cash
            withdrawal and the release of both the partner monthly volume and the member's annual
            purchase cap are all asserted there, including the scoped-sum-returns-to-zero invariant.

      - name: cancelling_a_held_award_returns_points_and_inventory
        claim_type: compensation
        excluded_because:
          difficulty_instance: award_cancellation_restores_member_points_and_releases_the_last_award_room
          rationale: |
            That §1.8 instance already asserts the CANCELLED compensation: the REVERSAL entry that
            returns points_charged, the balance restored to its pre-booking value, and the released
            night immediately re-bookable because CANCELLED rows leave the occupancy set.

  # ===========================================================================
  - section: calculations
    instances:
      - name: rate_category_table_maps_six_categories_to_four_derived_flags
        claim_type: constants_applied
        grounds:
          - calculations.rate_plan_derivation
          - entities.RatePlan.fields.base_earn_rate_per_dollar
          - entities.RatePlan.fields.is_qualifying
          - entities.RatePlan.fields.counts_toward_elite
          - entities.RatePlan.fields.program_fee_eligible
        distinguishing_aspect: |
          All six rate categories are created on one property and every one of the four derived
          fields is read back, pinning the whole EARN_RATE_BY_CATEGORY table (10 / 8 / 6 / 0 / 0 / 0)
          and the three set memberships - including GROUP, the only category that is qualifying and
          fee-bearing yet does not count toward elite status.
        test_recipe:
          setup:
            - "One ONBOARDING property (rate plans may be filed before activation)."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Ratecard Hotel", brand_code: "RCH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_tr: $.data.id, tr_rate: $.data.base_earn_rate_per_dollar }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "CORP", rate_category: "CORPORATE_NEGOTIATED" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { rp_co: $.data.id, co_rate: $.data.base_earn_rate_per_dollar }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "GRP", rate_category: "GROUP" }
              as: ProgramAdministrator
              captures: { rp_gr: $.data.id, gr_rate: $.data.base_earn_rate_per_dollar, gr_elite: $.data.counts_toward_elite, gr_qual: $.data.is_qualifying, gr_fee: $.data.program_fee_eligible }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "OPQ", rate_category: "OPAQUE_WHOLESALE" }
              as: ProgramAdministrator
              captures: { rp_op: $.data.id, op_rate: $.data.base_earn_rate_per_dollar, op_qual: $.data.is_qualifying }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "COMP", rate_category: "EMPLOYEE_COMP" }
              as: ProgramAdministrator
              captures: { rp_em: $.data.id, em_rate: $.data.base_earn_rate_per_dollar }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "AWD", rate_category: "AWARD" }
              as: ProgramAdministrator
              captures: { rp_aw: $.data.id, aw_rate: $.data.base_earn_rate_per_dollar }
            - call: "GET /loyalty/rate-plans"
              payload: { hotel_id: "${h_id}" }
              as: ProgramAuditor
              captures: { list_first: "$.data[0].id" }
          assert:
            - "${tr_rate} == 10 with RatePlan.${rp_tr} is_qualifying true, counts_toward_elite true, program_fee_eligible true"
            - "${co_rate} == 8 with RatePlan.${rp_co} is_qualifying true, counts_toward_elite true, program_fee_eligible true"
            - "${gr_rate} == 6, ${gr_qual} == true, ${gr_fee} == true and ${gr_elite} == false - GROUP earns and pays a fee but never lifts a tier"
            - "${op_rate} == 0 and ${op_qual} == false; RatePlan.${rp_op} counts_toward_elite false and program_fee_eligible false"
            - "${em_rate} == 0 and ${aw_rate} == 0, with all three booleans false on RatePlan.${rp_em} and RatePlan.${rp_aw}"
            - "the hotel_id ${h_id} rate-plan list returns total_count == 6"

      - name: group_stay_earns_floored_points_on_room_revenue_alone_and_lifts_no_tier
        claim_type: input_set_filtering
        grounds:
          - calculations.stay_base_points
          - calculations.program_fee_assessment
          - calculations.elite_tier_recompute
          - calculations.rate_plan_derivation
        distinguishing_aspect: |
          A 10-night GROUP stay with 12345 cents of room revenue and 50000 cents of incidentals
          earns floor(12345 * 6 / 100) = 740 points and is assessed round_half_up(12345 * 0.05) =
          617 cents - both computed on room revenue only, with the far larger incidental figure
          excluded from every formula - and although the stay is POSTED_QUALIFYING and moves
          qualifying_revenue_cents_ytd, its 10 nights leave qualifying_nights_ytd at 0 and the tier
          at BASE because GROUP does not count toward elite.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.05 and a GROUP rate plan."
            - "One BASE member with no history."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Groupblock Hotel", brand_code: "GBH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 220, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "GRP", rate_category: "GROUP" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "gb1@example.com", full_name: "Tobias Reuter", enrollment_date: "2026-01-11" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-11", room_revenue_cents: 12345, incidental_revenue_cents: 50000 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s_id: $.data.id, s_nights: $.data.nights }
          trigger:
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s_status: $.data.status, s_base: $.data.base_points_awarded, s_bonus: $.data.bonus_points_awarded, s_fee: $.data.program_fee_assessed_cents }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_tier: $.data.elite_tier, m_nights: $.data.qualifying_nights_ytd, m_rev: $.data.qualifying_revenue_cents_ytd, m_bal: $.data.point_balance }
          assert:
            - "${s_nights} == 10 and ${s_status} == POSTED_QUALIFYING"
            - "${s_base} == 740 - floor(12345 * 6 / 100) = floor(740.7), never 741"
            - "${s_fee} == 617 - round_half_up(12345 * 0.05) = round_half_up(617.25); the 50000 cents of incidentals are outside the fee base"
            - "${s_bonus} == 0 and Stay.${s_id}.bonus_multiplier_applied == 0.0 - a BASE tier_at_checkin multiplies to nothing"
            - "${m_rev} == 12345 - the qualifying revenue counter also excludes incidentals"
            - "${m_nights} == 0 and ${m_tier} == BASE - GROUP has counts_toward_elite false, so ten nights lift nothing"
            - "${m_bal} == 740 and Hotel.${h_id}.fee_ledger_balance_cents == 617"

      - name: benefit_recovery_caps_the_upgrade_and_scales_breakfast_by_night_count
        claim_type: constants_applied
        grounds:
          - calculations.benefit_cost_recovery
          - calculations.benefit_entitlement_matrix
          - state_machines.EliteBenefitDelivery.transitions.OBLIGATED_to_DELIVERED
        distinguishing_aspect: |
          On a property with an 80000-cent ADR the three benefit types recover on three different
          rules: the upgrade's 15 percent would be 12000 but is capped to 9000 by a hard min(), the
          breakfast is 1800 per night times the stay's 3 nights = 5400, and the late checkout is a
          flat 1200 that ignores both ADR and nights - summing to 15600 owed to the property.
        test_recipe:
          setup:
            - "One ACTIVE URBAN property with trailing ADR 80000 and program_fee_pct 0.05, TRANSIENT rate plan."
            - "The member reaches PLATINUM on a posted 50-night stay, then a 3-night stay is posted whose tier_at_checkin is PLATINUM, synthesizing all three OBLIGATED benefit rows."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Recovery Regent", brand_code: "RRG", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 240, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 80000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "rr1@example.com", full_name: "Selma Aune", enrollment_date: "2026-01-04" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-07-21", room_revenue_cents: 500000 }
              as: ProgramAdministrator
              captures: { sA_id: $.data.id }
            - call: "POST /loyalty/stays/${sA_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-22", checkout_date: "2026-07-25", room_revenue_cents: 30000 }
              as: ProgramAdministrator
              captures: { sB_id: $.data.id, sB_nights: $.data.nights }
            - call: "POST /loyalty/stays/${sB_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "UPGRADE" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { d_up: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "BREAKFAST" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { d_bf: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "LATE_CHECKOUT" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { d_lc: "$.data[0].id" }
          trigger:
            - call: "POST /loyalty/elite-benefit-deliveries/${d_up}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { up_status: $.data.status, up_recovery: $.data.cost_recovery_cents }
            - call: "POST /loyalty/elite-benefit-deliveries/${d_bf}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { bf_recovery: $.data.cost_recovery_cents }
            - call: "POST /loyalty/elite-benefit-deliveries/${d_lc}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { lc_recovery: $.data.cost_recovery_cents }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { h_recovery: $.data.benefit_recovery_owed_cents, h_denials: $.data.benefit_denial_count }
          assert:
            - "${sB_nights} == 3 and all three deliveries were OBLIGATED before the triggers"
            - "${up_status} == DELIVERED and ${up_recovery} == 9000 - min(round_half_up(80000 * 0.15) = 12000, cap 9000)"
            - "${bf_recovery} == 5400 - 1800 per night times 3 nights, so the night count matters here and nowhere else"
            - "${lc_recovery} == 1200 - a flat constant, indifferent to both the 80000 ADR and the 3 nights"
            - "${h_recovery} == 15600 and ${h_denials} == 0"

      - name: peak_window_outranks_a_standard_window_covering_the_same_arrival
        claim_type: variant_selection
        grounds:
          - calculations.redemption_pricing_selection
          - calculations.redemption_points_price
          - entities.Redemption.fields.season
          - entities.Redemption.fields.cash_copay_cents
        distinguishing_aspect: |
          Two pricing rows of the same property cover 2026-12-22 - a year-long STANDARD row and a
          narrow PEAK row - and the selector takes the PEAK row purely on SEASON_RANK, not on
          window width, creation order or row id. Every downstream field then comes from the
          selected row: 50000 points per night rather than 20000, allotment 1 rather than 2, and a
          copay of 2500 times 2 nights.
        test_recipe:
          setup:
            - "One ACTIVE URBAN property with two pricing rows: STANDARD 2026-01-01..2026-12-31 at 20000 points, copay 0, allotment 2; PEAK 2026-12-20..2026-12-27 at 50000 points, copay 2500, allotment 1. Both permit BASE."
            - "One BASE member funded with 200000 points by a settled DIRECT_PURCHASE, so program cash is 220000 and the fund is HEALTHY rather than IMPAIRED (peak inventory would otherwise be closed)."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Seasonal Spire", brand_code: "SSP", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 130, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_std: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "PEAK", window_start_date: "2026-12-20", window_end_date: "2026-12-27", points_per_night: 50000, cash_copay_cents: 2500, min_tier_required: "BASE", award_allotment_per_night: 1 }
              as: ProgramAdministrator
              captures: { pr_peak: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "ss1@example.com", full_name: "Rafal Kowal", enrollment_date: "2026-01-06" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 200000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id, pp_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-12-22", checkout_date: "2026-12-24", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, r_season: $.data.season, r_ppn: $.data.points_per_night_applied, r_allot: $.data.award_allotment_applied, r_charged: $.data.points_charged, r_copay: $.data.cash_copay_cents }
          assert:
            - "${pp_cash} == 220000 - the 200000-point purchase takes the HIGH volume tier"
            - "${r_season} == PEAK - rank 1 beats the STANDARD row's rank 0 even though the STANDARD window is 365 days wide and was created first"
            - "${r_ppn} == 50000 and ${r_allot} == 1 - both snapshotted from the selected PEAK row"
            - "${r_copay} == 5000 - the selected row's 2500 copay times the redemption's 2 nights"
            - "${r_charged} == 125000 - gross 100000 plus the URBAN peak surcharge ceil(100000 * 0.25) = 25000; had the STANDARD row been selected the charge would have been 40000"
            - "Member.${m_id}.point_balance == 75000 and Redemption.${r_id}.nights == 2"

      - name: purchase_volume_discount_switches_at_exactly_the_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.point_purchase_pricing
          - entities.PointPurchase.fields.volume_discount_pct
          - entities.PointPurchase.fields.cash_due_cents
          - entities.PointPurchase.fields.bonus_points
        distinguishing_aspect: |
          Both volume boundaries are >= comparisons, so 24000 points takes no discount while exactly
          25000 takes the MID tier, and 99000 stays on MID while exactly 100000 jumps to HIGH. The
          25000-point case also pins the single round_half_up on the fully discounted amount:
          31250 * 0.95 = 29687.5 becomes 29688, not 29687.
        test_recipe:
          setup:
            - "Two members with no purchase history; no partner exists, so every purchase uses the 1250-cent direct list price."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "vt1@example.com", full_name: "Nadia Farouk", enrollment_date: "2026-01-09" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "vt2@example.com", full_name: "Emre Kaplan", enrollment_date: "2026-01-10" }
              as: ProgramAdministrator
