              as: Agent
              captures: { ba_ch: $.data.id }
          trigger:
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 403 with error_id ERR_FORBIDDEN_ROLE"

      - name: underwriter_cannot_bind_quote
        claim_type: role_exclusive_denial
        grounds: [roles]
        distinguishing_aspect: "Bind is Policyholder-exclusive: even the Underwriter who approved the referral cannot bind the resulting quote."
        test_recipe:
          setup: ["REFERRED quote approved by underwriter uw-1; quote now QUOTED."]
