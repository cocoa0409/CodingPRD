        source: input
        description: Account holder name.
      - name: email
        type: string
        source: input
        description: Contact email; unique across Customers.
      - name: billing_terms
        type: enum
        source: input
        description: Billing relationship for this account.
        default: PER_VISIT
        constraints: one of {PER_VISIT, MONTHLY_ACCRUAL}
      - name: account_status
