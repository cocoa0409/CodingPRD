            - "StreamValuation.${val_1}.discount_rate_bps == 700"
            - "StreamValuation.${val_1}.value_cents == 64151290"
            - "StreamValuation.${val_1}.status == STALE"
            - "CarrierTenancy.${t_drop}.status == TERMINATED"
            - "CarrierTenancy.${t_drop}.quality_points == 40"
            - "LeaseStream.${ls_id}.tenancy_quality_score == 40"
            - "LeaseStream.${ls_id}.active_tenancy_count == 1"
            - "LeaseStream.${ls_id}.anchor_carrier_name == Vantage Wireless"
            - "StreamValuation.${val_2}.tenancy_quality_score_snapshot == 40"
            - "StreamValuation.${val_2}.discount_rate_bps == 1000"
            - "StreamValuation.${val_2}.value_cents == 44627011"
