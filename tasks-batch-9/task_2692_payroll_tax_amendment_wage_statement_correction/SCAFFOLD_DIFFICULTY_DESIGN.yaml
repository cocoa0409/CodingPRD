              payload: {}
              as: TaxPreparer
              captures: { case_ver3: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver3}", supersedes_amended_return_id: "${ar1_id}" }
              as: TaxPreparer
