scenario: |
  Generate task harder than expert level!

  2622. Airline Passenger Rights & Refund Compliance (airline customer compliance office):
  cancellation and significant delay definitions triggering automatic refund obligations,
  refund processing timelines by payment method with proactive versus request-based issuance,
  travel credit versus cash refund election rules and prohibited default practices,
  baggage fee refund on delayed bag delivery with delivery time tracking, ancillary service
  refund when a service is not provided such as seat selection or entertainment, denied
  boarding compensation calculation with voluntary and involuntary categories, tarmac delay
  contingency plan compliance with deplaning deadlines and reporting, disability accommodation
  complaints with response deadlines, consumer complaint tracking and regulator reporting

domain_name: airline-passenger-rights-refund-compliance
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities joined by explicit foreign keys. Resource URLs are two segments
  # deep under the api_prefix (`/compliance/<collection>/{id}`); no entity id is
  # ever nested inside another entity's path. Reverse lookups are exposed either
  # as read-only sub-resource collections or as filtered lists.

  state_machine_shape: parallel
  # RefundObligation carries two independently advancing status axes on one row:
  # `election_status` (cash-vs-credit election) and `settlement_status` (money
  # movement, with a FAILED -> INITIATED retry loop). TarmacDelayEvent adds a
  # fork-join (DELAY_ACTIVE -> {DEPLANED | EXEMPTION_INVOKED} -> REPORT_FILED),
  # FlightSegment adds a cycle (SCHEDULED -> DELAYED -> SCHEDULED via RESTORED),
  # ConsumerComplaint adds a cycle (ANSWERED -> ACKNOWLEDGED via reopen), and
  # RegulatorReport adds a cycle (SUBMITTED -> AMENDING -> SUBMITTED).

  relationship_patterns:
    - one_to_many          # Booking -> FlightSegment / CheckedBag / ConsumerComplaint
    - polymorphic          # RefundObligation carries four mutually exclusive nullable source FKs selected by `basis`
    - cross_aggregate      # RegulatorReport metrics reach ConsumerComplaint through Booking.policy_profile_id
    - self_referential     # FlightSegment.sequence_index orders siblings; a cancellation propagates to later siblings of the same Booking

  role_model: segregation_of_duties
  # The officer who books a request-based RefundObligation may not initiate its
  # settlement, and the officer who initiates a settlement may not complete it.
  # Both checks compare X-User-ID against a persisted actor id on the obligation.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 50 endpoints / 8 state machines / 16 calculations / 59 error codes.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: PolicyProfile
    parent: null
    common_fields: true
    description: |
      Carrier-level compliance configuration. Every threshold that the customer
      compliance office is allowed to tune lives here; statutory constants that the
      carrier may not tune live in §1.3 `constants:`. Configuration entity: created
      once, never updated through the public surface, but its `version` advances
      whenever the compliance sweep recomputes `open_violation_count` or a
      RegulatorReport is created against it.
    fields:
      - name: carrier_code
        type: string
        source: input
        description: IATA carrier code that owns this policy profile.
        constraints: exactly 2 uppercase alphanumeric characters; unique across PolicyProfile
      - name: domestic_significant_delay_minutes
        type: integer
        source: input
        default: 180
        description: Arrival-delay minutes at or above which a DOMESTIC itinerary delay is a significant delay.
        constraints: ">= 1"
      - name: international_significant_delay_minutes
        type: integer
        source: input
        default: 360
        description: Arrival-delay minutes at or above which an INTERNATIONAL itinerary delay is a significant delay.
        constraints: ">= 1"
      - name: credit_card_refund_deadline_days
        type: integer
        source: input
        default: 7
        description: Days allowed to settle a refund when Booking.payment_method is CREDIT_CARD.
        constraints: ">= 1"
      - name: other_method_refund_deadline_days
        type: integer
        source: input
        default: 20
        description: Days allowed to settle a refund for every other Booking.payment_method value.
        constraints: ">= 1"
      - name: bag_delay_threshold_hours_domestic
        type: integer
        source: input
        default: 12
        description: Bag delivery delay hours at or above which the checked-bag fee must be refunded on a DOMESTIC itinerary.
        constraints: ">= 1"
      - name: bag_delay_threshold_hours_international
        type: integer
        source: input
        default: 30
        description: Bag delivery delay hours at or above which the checked-bag fee must be refunded on an INTERNATIONAL itinerary.
        constraints: ">= 1"
      - name: tarmac_deplane_deadline_minutes_domestic
        type: integer
        source: input
        default: 180
        description: Tarmac minutes a DOMESTIC flight may occupy before deplaning must be complete.
        constraints: ">= 1"
      - name: tarmac_deplane_deadline_minutes_international
        type: integer
        source: input
        default: 240
        description: Tarmac minutes an INTERNATIONAL flight may occupy before deplaning must be complete.
        constraints: ">= 1"
      - name: complaint_ack_deadline_days
        type: integer
        source: input
        default: 30
        description: Days allowed to acknowledge a consumer complaint after ConsumerComplaint.received_at_utc.
        constraints: ">= 1"
      - name: complaint_answer_deadline_days_general
        type: integer
        source: input
        default: 60
        description: Days allowed to substantively answer a non-DISABILITY complaint.
        constraints: ">= 1"
      - name: complaint_answer_deadline_days_disability
        type: integer
        source: input
        default: 30
        description: Days allowed to substantively answer a DISABILITY complaint.
        constraints: ">= 1"
      - name: travel_credit_default_permitted
        type: boolean
        source: input
        default: false
        description: |
          When false, the system may never write election_status = ELECTED_CREDIT without an
          affirmative election recorded through POST /compliance/refund-obligations/{id}/elect;
          the auto-default sweep must fall back to ELECTED_CASH. Prohibited-default-practice flag.
      - name: travel_credit_election_bonus_pct
        type: number
        source: input
        default: 0.10
        description: Goodwill bonus fraction added on top of a refund that the passenger elects to take as travel credit.
        constraints: 0 <= value <= 0.5
      - name: report_count
        type: integer
        source: computed
        default: 0
        description: Count of RegulatorReport rows created against this profile.
      - name: open_violation_count
        type: integer
        source: computed
        default: 0
        description: Open compliance violations recomputed by POST /compliance/compliance-sweeps per §1.3 compliance_sweep_recount.

  - name: Passenger
    parent: null
    common_fields: true
    description: Person holding bookings; identity subject for the Passenger role.
    fields:
      - name: email
        type: string
        source: input
        description: Contact address, also the natural key.
        constraints: unique across Passenger; must contain '@'
      - name: full_name
        type: string
        source: input
        description: Passenger name as printed on the ticket.
        constraints: 1..120 characters
      - name: requires_disability_assistance
        type: boolean
        source: input
        default: false
        description: Marks the passenger as having requested disability accommodation on file.
      - name: travel_credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: |
          Conserved ledger. Equals the sum of RefundObligation.payable_total_cents over all
          obligations of this passenger's bookings whose settlement_status = SETTLED and
          settlement_method = TRAVEL_CREDIT. Never negative.
      - name: open_complaint_count
        type: integer
        source: computed
        default: 0
        description: Count of ConsumerComplaint rows of this passenger's bookings whose status IN {RECEIVED, ACKNOWLEDGED, INFO_REQUESTED}.

  - name: Booking
    parent: null
    common_fields: true
    description: |
      One ticketed itinerary (record locator). Ledger parent for every refund obligation and
      the only entity whose `version` is used for optimistic concurrency (§1.2.1).
    fields:
      - name: passenger_id
        type: string
        source: input
        description: FK -> Passenger.id
      - name: policy_profile_id
        type: string
        source: input
        description: FK -> PolicyProfile.id; pins which thresholds govern this itinerary
      - name: record_locator
        type: string
        source: input
        description: Six-character PNR locator.
        constraints: exactly 6 uppercase alphanumeric characters; unique across Booking
      - name: total_fare_cents
        type: integer
        source: input
        description: Fare actually collected for the whole itinerary, excluding ancillaries and bag fees.
        constraints: ">= 1"
      - name: payment_method
        type: enum
        source: input
        description: Form of payment collected; drives the refund settlement deadline.
        constraints: "enum: {CREDIT_CARD, CASH_OR_CHECK, TRAVEL_CREDIT, MILES}"
      - name: itinerary_scope
        type: enum
        source: computed
        default: DOMESTIC
        description: INTERNATIONAL when at least one FlightSegment of this booking has is_international = true, else DOMESTIC. Recomputed on every FlightSegment create.
        constraints: "enum: {DOMESTIC, INTERNATIONAL}"
      - name: collected_total_cents
        type: integer
        source: computed
        default: 0
        description: total_fare_cents + sum(AncillaryPurchase.amount_cents) + sum(CheckedBag.fee_cents) for this booking, all rows regardless of status.
      - name: total_refund_obligated_cents
        type: integer
        source: computed
        default: 0
        description: Sum of RefundObligation.amount_cents for this booking whose settlement_status != VOIDED. Conserved quantity of §1.3 obligated_cents_conservation.
      - name: earliest_refund_deadline_utc
        type: datetime
        source: computed
        description: Minimum RefundObligation.deadline_utc over obligations of this booking whose settlement_status IN {UNSETTLED, INITIATED, FAILED}; null when that set is empty.
      - name: disruption_posture
        type: enum
        source: computed
        default: NORMAL
        description: |
          Derived rollup. REFUND_OBLIGATED when at least one obligation has settlement_status IN
          {UNSETTLED, INITIATED, FAILED}; CLOSED_OUT when at least one obligation exists and all of
          them have settlement_status IN {SETTLED, VOIDED}; DISRUPTED when no obligation exists but
          at least one FlightSegment has status IN {DELAYED, CANCELLED, DISRUPTED_UNUSED}; NORMAL otherwise.
        constraints: "enum: {NORMAL, DISRUPTED, REFUND_OBLIGATED, CLOSED_OUT}"
      - name: segment_count
        type: integer
        source: computed
        default: 0
        description: Count of FlightSegment rows of this booking.
      - name: unused_segment_count
        type: integer
        source: computed
        default: 0
        description: Count of FlightSegment rows of this booking whose status IN {SCHEDULED, DELAYED, CANCELLED, DISRUPTED_UNUSED}.
      - name: travel_commenced
        type: boolean
        source: computed
        default: false
        description: True when at least one FlightSegment of this booking has status IN {DEPARTED, ARRIVED}.
      - name: suppressed_obligation_count
        type: integer
        source: computed
        default: 0
        description: Count of proactive obligations the cascade declined to create because §1.3 booking_refund_headroom clamped the amount to 0.

  - name: FlightSegment
    parent: null
    common_fields: true
    description: One marketed leg of a Booking. Carries the disruption facts that trigger refund obligations.
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: sequence_index
        type: integer
        source: input
        description: 1-based position of this leg inside the itinerary; also the cascade propagation order.
        constraints: ">= 1; unique per booking_id"
      - name: flight_number
        type: string
        source: input
        description: Operating flight designator.
        constraints: 3..7 characters
      - name: origin_iata
        type: string
        source: input
        description: Departure airport code.
        constraints: exactly 3 uppercase letters
      - name: destination_iata
        type: string
        source: input
        description: Arrival airport code.
        constraints: exactly 3 uppercase letters
      - name: is_international
        type: boolean
        source: input
        default: false
        description: True when the leg crosses a national border; any true leg makes the whole Booking INTERNATIONAL.
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: Published departure instant.
      - name: scheduled_arrival_utc
        type: datetime
        source: input
        description: Published arrival instant; baseline for delay_minutes.
        constraints: must be strictly after scheduled_departure_utc
      - name: segment_fare_cents
        type: integer
        source: input
        description: Fare value allocated to this leg by the carrier's own proration table. The sum over legs need not equal Booking.total_fare_cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Operational lifecycle of the leg; see §1.2 FlightSegment.
        constraints: "enum: {SCHEDULED, DELAYED, CANCELLED, DISRUPTED_UNUSED, DEPARTED, ARRIVED}"
      - name: disruption_type
        type: enum
        source: computed
        default: NONE
        description: Kind of disruption last declared on this leg; reset to NONE by a RESTORED operation.
        constraints: "enum: {NONE, DELAY, CANCELLATION}"
      - name: revised_arrival_utc
        type: datetime
        source: computed
        description: Arrival instant last declared for a DELAY; null when disruption_type != DELAY.
      - name: delay_minutes
        type: integer
        source: computed
        default: 0
        description: whole minutes between scheduled_arrival_utc and revised_arrival_utc; 0 when disruption_type != DELAY.
      - name: is_significant_delay
        type: boolean
        source: computed
        default: false
        description: Result of §1.3 significant_delay_determination for this leg.
      - name: disruption_declared_at_utc
        type: datetime
        source: computed
        description: declared_at_utc of the most recent declare-disruption call; null once RESTORED.
      - name: actual_departure_utc
        type: datetime
        source: computed
        description: Set by a DEPARTED operation.
      - name: actual_arrival_utc
        type: datetime
        source: computed
        description: Set by an ARRIVED operation.
      - name: cumulative_tarmac_minutes
        type: integer
        source: computed
        default: 0
        description: Sum of TarmacDelayEvent.tarmac_minutes over events of this leg whose status IN {DEPLANED, REPORT_FILED} (exemption-closed events excluded).
      - name: exempted_tarmac_event_count
        type: integer
        source: computed
        default: 0
        description: Count of TarmacDelayEvent rows of this leg whose exemption_reason is not null.

  - name: AncillaryPurchase
    parent: null
    common_fields: true
    description: A paid optional service attached to one leg (seat selection, wifi, entertainment, priority boarding, lounge).
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: flight_segment_id
        type: string
        source: input
        description: FK -> FlightSegment.id; must belong to the same booking_id
      - name: service_type
        type: enum
        source: input
        description: Which optional service was sold.
        constraints: "enum: {SEAT_SELECTION, WIFI, ENTERTAINMENT, PRIORITY_BOARDING, LOUNGE_ACCESS}"
      - name: amount_cents
        type: integer
        source: input
        description: Price collected for the service.
        constraints: ">= 1"
      - name: delivery_status
        type: enum
        source: computed
        default: PENDING_DELIVERY
        description: Whether the service was actually rendered; see §1.2 AncillaryPurchase.
        constraints: "enum: {PENDING_DELIVERY, DELIVERED, NOT_PROVIDED}"
      - name: non_provision_reason
        type: enum
        source: computed
        description: Why the service was not rendered; null unless delivery_status = NOT_PROVIDED.
        constraints: "enum: {EQUIPMENT_SWAP, SYSTEM_OUTAGE, SEAT_REASSIGNED, SERVICE_CANCELLED}"
      - name: refund_obligation_created
        type: boolean
        source: computed
        default: false
        description: True while a non-VOIDED RefundObligation with basis = ANCILLARY points at this row.

  - name: CheckedBag
    parent: null
    common_fields: true
    description: A checked bag with a collected fee and a tracked delivery time.
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: tag_number
        type: string
        source: input
        description: Bag tag identifier.
        constraints: exactly 10 characters; unique across CheckedBag
      - name: fee_cents
        type: integer
        source: input
        description: Checked-bag fee collected from the passenger.
        constraints: ">= 0"
      - name: checked_at_utc
        type: datetime
        source: input
        description: Instant the bag was accepted at the counter.
      - name: scheduled_delivery_utc
        type: datetime
        source: input
        description: Contractual delivery instant (published arrival of the final leg); baseline for delivery_delay_hours.
        constraints: must be strictly after checked_at_utc
      - name: delivered_at_utc
        type: datetime
        source: computed
        description: Instant delivery was completed; set by the resolve action with resolution = DELIVERED.
      - name: loss_declared_at_utc
        type: datetime
        source: computed
        description: Instant the bag was declared lost; set by the resolve action with resolution = DECLARED_LOST.
      - name: status
        type: enum
        source: computed
        default: IN_TRANSIT
        description: Delivery outcome; see §1.2 CheckedBag.
        constraints: "enum: {IN_TRANSIT, DELIVERED_ON_TIME, DELIVERED_LATE, DECLARED_LOST}"
      - name: delivery_delay_hours
        type: number
        source: computed
        default: 0
        description: Result of §1.3 baggage_delivery_delay; 2 decimal places.
      - name: fee_refund_obligated
        type: boolean
        source: computed
        default: false
        description: True while a non-VOIDED RefundObligation with basis = BAGGAGE_FEE points at this row.

  - name: DeniedBoardingRecord
    parent: null
    common_fields: true
    description: One denied-boarding incident on one leg, voluntary or involuntary.
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: flight_segment_id
        type: string
        source: input
        description: FK -> FlightSegment.id; must belong to the same booking_id
      - name: category
        type: enum
        source: input
        description: How the passenger left the flight. VOLUNTARY requires voluntary_agreed_amount_cents.
        constraints: "enum: {VOLUNTARY, INVOLUNTARY}"
      - name: oversale_confirmed
        type: boolean
        source: input
        default: true
        description: Whether the carrier confirmed the leg was oversold.
      - name: written_disclosure_provided
        type: boolean
        source: input
        default: false
        description: |
          Whether the passenger received the written statement of denied-boarding rights before
          agreeing. A VOLUNTARY record finalized with this false is recategorized to INVOLUNTARY.
      - name: one_way_fare_cents
        type: integer
        source: input
        description: One-way fare to the passenger's first stopover or destination; the compensation base.
        constraints: ">= 1"
      - name: substitute_arrival_utc
        type: datetime
        source: input
        description: Arrival instant of the substitute transportation actually offered.
      - name: voluntary_agreed_amount_cents
        type: integer
        source: input
        description: Amount the volunteer agreed to accept; required when category = VOLUNTARY, forbidden when INVOLUNTARY.
        constraints: ">= 0"
      - name: substitute_delay_minutes
        type: integer
        source: computed
        default: 0
        description: whole minutes between FlightSegment.scheduled_arrival_utc and substitute_arrival_utc; floor 0.
      - name: statutory_compensation_cents
        type: integer
        source: computed
        default: 0
        description: Output of §1.3 denied_boarding_compensation variant INVOLUNTARY_STATUTORY, always computed even for volunteers (disclosure floor baseline).
      - name: compensation_cents
        type: integer
        source: computed
        default: 0
        description: Amount actually payable after §1.3 denied_boarding_compensation selects the variant.
      - name: effective_category
        type: enum
        source: computed
        description: Category after finalize applies the disclosure rule; equals category unless recategorized.
        constraints: "enum: {VOLUNTARY, INVOLUNTARY}"
      - name: status
        type: enum
        source: computed
        default: RECORDED
        description: See §1.2 DeniedBoardingRecord.
        constraints: "enum: {RECORDED, FINALIZED, RECATEGORIZED}"
      - name: finalized_at_utc
        type: datetime
        source: computed
        description: finalized_at_utc supplied to the finalize action.

  - name: TarmacDelayEvent
    parent: null
    common_fields: true
    description: One tarmac-delay occurrence on one leg, closed either by deplaning or by an invoked exemption, then reported.
    fields:
      - name: flight_segment_id
        type: string
        source: input
        description: FK -> FlightSegment.id
      - name: tarmac_start_utc
        type: datetime
        source: input
        description: Instant the aircraft door closed (DEPARTURE phase) or touched down (ARRIVAL phase).
      - name: phase
        type: enum
        source: input
        description: Which side of the flight the tarmac delay occurred on.
        constraints: "enum: {DEPARTURE, ARRIVAL}"
      - name: status
        type: enum
        source: computed
        default: DELAY_ACTIVE
        description: See §1.2 TarmacDelayEvent (fork-join).
        constraints: "enum: {DELAY_ACTIVE, DEPLANED, EXEMPTION_INVOKED, REPORT_FILED}"
      - name: interval_end_utc
        type: datetime
        source: computed
        description: |
          Exclusive end of the interval this event occupies on its leg: deplane_completed_utc when
          DEPLANED, exemption_declared_at_utc when EXEMPTION_INVOKED, null while DELAY_ACTIVE
          (an active event occupies [tarmac_start_utc, +infinity) for overlap purposes).
      - name: deplane_completed_utc
        type: datetime
        source: computed
        description: Instant the last passenger was off the aircraft; set only on the DEPLANED branch.
      - name: exemption_reason
        type: enum
        source: computed
        description: Statutory ground for exceeding the deadline; set only on the EXEMPTION_INVOKED branch.
        constraints: "enum: {SAFETY, SECURITY, ATC_DIRECTIVE}"
      - name: exemption_declared_at_utc
        type: datetime
        source: computed
        description: Instant the exemption was invoked; set only on the EXEMPTION_INVOKED branch.
      - name: tarmac_minutes
        type: integer
        source: computed
        default: 0
        description: whole minutes between tarmac_start_utc and interval_end_utc; 0 while DELAY_ACTIVE.
      - name: deadline_minutes
        type: integer
        source: computed
        default: 0
        description: "Deplaning deadline that applied to this event, resolved at event creation from the parent FlightSegment.is_international flag per §1.3 tarmac_compliance_evaluation."
      - name: is_violation
        type: boolean
        source: computed
        default: false
        description: Result of §1.3 tarmac_compliance_evaluation; always false on the EXEMPTION_INVOKED branch.
      - name: report_reference
        type: string
        source: computed
        description: Regulator filing reference recorded by the file-report action.
      - name: corrective_action_summary
        type: string
        source: computed
        description: Narrative required when filing a report for a violating deplaned event.
      - name: report_filed_at_utc
        type: datetime
        source: computed
        description: Instant the contingency-plan report was filed.

  - name: RefundObligation
    parent: null
    common_fields: true
    description: |
      One refund the carrier owes for one cause. Polymorphic source: exactly one of
      flight_segment_id / checked_bag_id / ancillary_purchase_id / denied_boarding_record_id is
      non-null, selected by `basis` (a GOODWILL_GRANT obligation created from a complaint answer
      has all four null). Carries two independently advancing status axes: `election_status` and
      `settlement_status`.
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; ledger parent and optimistic-concurrency subject
      - name: flight_segment_id
        type: string
        source: input
        description: FK -> FlightSegment.id; non-null only when basis = FARE
      - name: checked_bag_id
        type: string
        source: input
        description: FK -> CheckedBag.id; non-null only when basis = BAGGAGE_FEE
      - name: ancillary_purchase_id
        type: string
        source: input
        description: FK -> AncillaryPurchase.id; non-null only when basis = ANCILLARY
      - name: denied_boarding_record_id
        type: string
        source: input
        description: FK -> DeniedBoardingRecord.id; non-null only when basis = DENIED_BOARDING
      - name: basis
        type: enum
        source: input
        description: Which category of money is owed; selects which source FK must be present.
        constraints: "enum: {FARE, ANCILLARY, BAGGAGE_FEE, DENIED_BOARDING, GOODWILL_GRANT}"
      - name: issuance_mode
        type: enum
        source: computed
        description: |
          PROACTIVE when the obligation was created by a cascade side effect (the carrier owes it
          without being asked); REQUEST_BASED when created by POST /compliance/refund-obligations
          or by a complaint answer granting a refund.
        constraints: "enum: {PROACTIVE, REQUEST_BASED}"
      - name: variant_applied
        type: enum
        source: computed
        description: Which §1.3 variant produced gross_entitlement_cents.
        constraints: "enum: {PROACTIVE_FULL_ITINERARY, REQUEST_BASED_UNUSED_PRORATION, FEE_FACE_VALUE, INVOLUNTARY_STATUTORY, VOLUNTARY_NEGOTIATED, GOODWILL_GRANT_AMOUNT}"
      - name: gross_entitlement_cents
        type: integer
        source: computed
        default: 0
        description: Entitlement before the headroom clamp of §1.3 booking_refund_headroom.
      - name: headroom_at_creation_cents
        type: integer
        source: computed
        default: 0
        description: Remaining headroom observed at creation time, evaluated over strictly pre-existing non-VOIDED obligations of the booking.
      - name: amount_cents
        type: integer
        source: computed
        default: 0
        description: Refund principal actually owed = min(gross_entitlement_cents, headroom_at_creation_cents). Summand of Booking.total_refund_obligated_cents.
      - name: credit_bonus_cents
        type: integer
        source: computed
        default: 0
        description: Goodwill bonus added when election_status = ELECTED_CREDIT, per §1.3 travel_credit_bonus. Outside the headroom ledger.
      - name: payable_total_cents
        type: integer
        source: computed
        default: 0
        description: amount_cents + credit_bonus_cents. Summand of Passenger.travel_credit_balance_cents when settled as TRAVEL_CREDIT.
      - name: election_status
        type: enum
        source: computed
        default: PENDING_ELECTION
        description: Cash-versus-credit election axis; see §1.2 RefundObligation.
        constraints: "enum: {PENDING_ELECTION, ELECTED_CASH, ELECTED_CREDIT}"
      - name: election_source
        type: enum
        source: computed
        description: Who recorded the election; AUTO_DEFAULT is only ever paired with ELECTED_CASH.
        constraints: "enum: {PASSENGER, OFFICER_ON_BEHALF, AUTO_DEFAULT}"
      - name: credit_consent_reference
        type: string
        source: computed
        description: ConsumerComplaint id documenting the passenger's written consent, recorded when an officer elects credit on the passenger's behalf.
      - name: settlement_status
        type: enum
        source: computed
        default: UNSETTLED
        description: Money-movement axis; see §1.2 RefundObligation. FAILED returns to INITIATED on retry.
        constraints: "enum: {UNSETTLED, INITIATED, SETTLED, FAILED, VOIDED}"
      - name: settlement_method
        type: enum
        source: computed
        description: Instrument used to pay, derived from the election and Booking.payment_method per §1.3 settlement_method_resolution.
        constraints: "enum: {ORIGINAL_PAYMENT, CASH_OR_CHECK, TRAVEL_CREDIT, MILES}"
      - name: obligation_start_utc
        type: datetime
        source: computed
        description: |
          Clock start for the settlement deadline: FlightSegment.disruption_declared_at_utc for a
          PROACTIVE fare/ancillary obligation, CheckedBag.delivered_at_utc for a PROACTIVE baggage
          obligation, DeniedBoardingRecord.finalized_at_utc for a denied-boarding obligation, the
          request_received_utc payload value for a REQUEST_BASED obligation, and the
          ConsumerComplaint answered_at_utc for a GOODWILL_GRANT obligation.
      - name: deadline_utc
        type: datetime
        source: computed
        description: Output of §1.3 refund_deadline_resolution.
      - name: election_deadline_utc
        type: datetime
        source: computed
        description: obligation_start_utc + ELECTION_WINDOW_DAYS (§1.3 constants); after this instant the sweep applies the cash default.
      - name: deadline_breached
        type: boolean
        source: computed
        default: false
        description: Set true by the compliance sweep when the settlement deadline elapsed with the obligation still unsettled.
      - name: settlement_attempt_count
        type: integer
        source: computed
        default: 0
        description: Number of times settlement has been initiated, including retries after failure.
      - name: settlement_initiated_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent initiate-settlement call.
      - name: settled_at_utc
        type: datetime
        source: computed
        description: Logical-clock instant settlement succeeded.
      - name: last_failure_reason
        type: enum
        source: computed
        description: Reason recorded by the most recent failed settlement.
        constraints: "enum: {CARD_DECLINED, ACCOUNT_CLOSED, PROCESSOR_TIMEOUT}"
      - name: void_reason
        type: enum
        source: computed
        description: Why the obligation was voided; null unless settlement_status = VOIDED.
        constraints: "enum: {CREATED_IN_ERROR, DUPLICATE, PASSENGER_WITHDREW, SETTLEMENT_REVERSED}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who created this obligation via POST /compliance/refund-obligations; null for cascade-created obligations. Segregation-of-duties subject.
      - name: settlement_initiated_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who initiated the current settlement attempt. Segregation-of-duties subject.

  - name: ConsumerComplaint
    parent: null
    common_fields: true
    description: One written consumer complaint against a booking, with acknowledgement and substantive-answer deadlines that depend on its category.
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: category
        type: enum
        source: input
        description: Subject matter; DISABILITY shortens the substantive-answer deadline and requires an accessibility resolution code in the answer.
        constraints: "enum: {REFUND, BAGGAGE, ANCILLARY_SERVICE, DENIED_BOARDING, DISABILITY, OTHER}"
      - name: channel
        type: enum
        source: input
        description: How the complaint arrived.
        constraints: "enum: {WEB, EMAIL, PHONE, MAIL}"
      - name: received_at_utc
        type: datetime
        source: input
        description: Instant the complaint was received; baseline for both deadlines and the RegulatorReport window filter.
      - name: summary
        type: string
        source: input
        description: Passenger's stated grievance.
        constraints: 1..500 characters
      - name: status
        type: enum
        source: computed
        default: RECEIVED
        description: See §1.2 ConsumerComplaint (cyclic).
        constraints: "enum: {RECEIVED, ACKNOWLEDGED, INFO_REQUESTED, ANSWERED, CLOSED}"
      - name: ack_due_utc
        type: datetime
        source: computed
        description: received_at_utc + PolicyProfile.complaint_ack_deadline_days.
      - name: answer_due_utc
        type: datetime
        source: computed
        description: Output of §1.3 complaint_deadline_resolution; extended by each reopen.
      - name: acknowledged_at_utc
        type: datetime
        source: computed
        description: acknowledged_at_utc supplied to the acknowledge action.
      - name: answered_at_utc
        type: datetime
        source: computed
        description: answered_at_utc supplied to the most recent answer action.
      - name: info_requested_count
        type: integer
        source: computed
        default: 0
        description: Number of times additional information was requested from the passenger.
      - name: reopen_count
        type: integer
        source: computed
        default: 0
        description: Number of times the answered complaint was reopened; capped by REOPEN_LIMIT (§1.3 constants).
      - name: ack_breached
        type: boolean
        source: computed
        default: false
        description: Set true by the compliance sweep when the acknowledgement deadline elapsed while status was RECEIVED.
      - name: answer_breached
        type: boolean
        source: computed
        default: false
        description: Set true by the compliance sweep when the substantive-answer deadline elapsed while status IN {ACKNOWLEDGED, INFO_REQUESTED}.
      - name: disposition
        type: enum
        source: computed
        description: Outcome recorded by the answer action.
        constraints: "enum: {REFUND_GRANTED, REFUND_DENIED, POLICY_EXPLAINED, ACCOMMODATION_PROVIDED}"
      - name: accessibility_resolution_code
        type: enum
        source: computed
        description: Disability-specific resolution code; mandatory when category = DISABILITY.
        constraints: "enum: {ASSISTANCE_PROVIDED, EQUIPMENT_REPAIRED, TRAINING_ISSUED, ESCALATED_TO_CRO}"
      - name: granted_amount_cents
        type: integer
        source: computed
        default: 0
        description: Goodwill amount granted by the answer; 0 unless disposition = REFUND_GRANTED.

  - name: ComplaintActivity
    parent: null
    common_fields: false
    description: Append-only audit trail of everything that happened to a complaint. Immutable; created only as a side effect.
    fields:
      - name: complaint_id
        type: string
        source: system
        description: FK -> ConsumerComplaint.id
      - name: activity_type
        type: enum
        source: system
        description: Which lifecycle event this row records.
        constraints: "enum: {RECEIVED, ACKNOWLEDGED, INFO_REQUESTED, ANSWERED, REOPENED, AUTO_CLOSED, DEADLINE_BREACH_FLAGGED}"
      - name: occurred_at_utc
        type: datetime
        source: system
        description: Domain instant of the event, taken from the triggering payload timestamp or from the logical clock for sweep-generated rows.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the caller, or "system" for sweep-generated rows.
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the caller; null for sweep-generated rows.
      - name: detail
        type: string
        source: system
        description: Short machine-readable note (e.g. the disposition, the reopen reason, or the breached deadline field name).

  - name: RegulatorReport
    parent: null
    common_fields: true
    description: |
      Periodic filing to the regulator covering one closed reporting period for one policy profile.
      Metrics are frozen at submit time; amending reopens the row and refreezes them on resubmit.
    fields:
      - name: policy_profile_id
        type: string
        source: input
        description: FK -> PolicyProfile.id
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive start of the reporting period.
      - name: period_end_utc
        type: datetime
        source: input
        description: Inclusive end of the reporting period.
        constraints: must be strictly after period_start_utc
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: See §1.2 RegulatorReport (cyclic SUBMITTED -> AMENDING -> SUBMITTED).
        constraints: "enum: {DRAFT, SUBMITTED, AMENDING}"
      - name: complaint_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: disability_complaint_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: late_answer_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: tarmac_violation_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: involuntary_denied_boarding_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: refund_obligation_cents_total
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: overdue_refund_count
        type: integer
        source: computed
        default: 0
        description: Frozen metric from §1.3 regulator_report_metrics.
      - name: policy_version_pinned
        type: integer
        source: computed
        default: 0
        description: PolicyProfile.version observed at the moment of the most recent submit; 0 while DRAFT.
      - name: submitted_at_utc
        type: datetime
        source: computed
        description: submitted_at_utc of the most recent submit action.
      - name: amendment_count
        type: integer
        source: computed
        default: 0
        description: Number of times this report was moved back to AMENDING.
      - name: amendment_reason
        type: string
        source: computed
        description: Reason recorded by the most recent amend action.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the administrator who last submitted this report.

state_machines:
  - entity: FlightSegment
    initial_state: SCHEDULED
    terminal_states: [ARRIVED]
    shape: cyclic
    note: |
      SCHEDULED -> DELAYED -> SCHEDULED is a real cycle (a declared delay can be walked back by a
      RESTORED operation). DISRUPTED_UNUSED is reached only by cascade from a sibling cancellation.
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = CANCELLATION"
        actor: OpsController
        preconditions:
          - "segment.status IN {SCHEDULED, DELAYED}"
          - "payload revised_arrival_utc is absent"
          - "declared_at_utc >= segment.scheduled_departure_utc - 30 days and declared_at_utc <= segment.scheduled_arrival_utc + 7 days"
        side_effects:
          - "LINK 1: segment.status = CANCELLED, disruption_type = CANCELLATION, disruption_declared_at_utc = declared_at_utc, segment.version += 1."
          - "LINK 2a (caused by LINK 1): every sibling FlightSegment of the same booking with sequence_index > this segment's and status = SCHEDULED becomes DISRUPTED_UNUSED, processed in sequence_index ASC order. Each such sibling keeps disruption_type = NONE but copies disruption_declared_at_utc from the cancelled segment, so a refund obligation naming the sibling still has a well-defined obligation_start_utc."
          - "LINK 2b (caused by LINK 1): every AncillaryPurchase whose flight_segment_id = this segment and delivery_status = PENDING_DELIVERY becomes NOT_PROVIDED with non_provision_reason = SERVICE_CANCELLED, processed in created_at ASC order."
          - "LINK 3a (caused by LINK 1): one RefundObligation with basis = FARE, issuance_mode = PROACTIVE, flight_segment_id = this segment is created per §1.3 fare_refund_entitlement variant PROACTIVE_FULL_ITINERARY, clamped by §1.3 booking_refund_headroom; skipped (booking.suppressed_obligation_count += 1) when the clamp yields 0."
          - "LINK 3b (caused by LINK 2b): one RefundObligation with basis = ANCILLARY, issuance_mode = PROACTIVE, variant FEE_FACE_VALUE is created for each ancillary that just became NOT_PROVIDED, in the same created_at ASC order, each clamped against the headroom left by every obligation created before it in this request; ancillary.refund_obligation_created = true. An ancillary whose clamp yields 0 is skipped instead: no obligation row is written, ancillary.refund_obligation_created stays false, and booking.suppressed_obligation_count += 1."
          - "LINK 4 (caused by LINK 3a/3b): booking.total_refund_obligated_cents, earliest_refund_deadline_utc, unused_segment_count, disruption_posture (-> REFUND_OBLIGATED) are recomputed and booking.version += 1 exactly once for the whole request."
        note: "Ordering is fixed: LINK 1, LINK 2a, LINK 2b, LINK 3a, LINK 3b, LINK 4."
      - from: DELAYED
        to: CANCELLED
        trigger: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = CANCELLATION"
        actor: OpsController
        preconditions:
          - "segment.status = DELAYED"
        side_effects:
          - "Same LINK 1..LINK 4 chain as SCHEDULED -> CANCELLED; delay_minutes resets to 0, revised_arrival_utc to null, is_significant_delay to false."
          - "If a non-VOIDED FARE obligation already points at this segment, no second FARE obligation is created (ERR_DUPLICATE_OBLIGATION_FOR_SOURCE does not fire for cascades; the cascade simply skips it and booking.suppressed_obligation_count += 1)."
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY"
        actor: OpsController
        preconditions:
          - "segment.status IN {SCHEDULED, DELAYED}"
          - "payload revised_arrival_utc is present and strictly after segment.scheduled_arrival_utc"
        side_effects:
          - "segment.status = DELAYED, disruption_type = DELAY, revised_arrival_utc set, delay_minutes and is_significant_delay recomputed per §1.3 significant_delay_determination, disruption_declared_at_utc = declared_at_utc, segment.version += 1."
          - "When is_significant_delay becomes true and no non-VOIDED FARE obligation points at this segment: a RefundObligation (basis FARE, PROACTIVE, variant PROACTIVE_FULL_ITINERARY) is created, then booking ledger fields are recomputed and booking.version += 1."
          - "When is_significant_delay is false: no obligation is created; booking.disruption_posture is recomputed (-> DISRUPTED when no obligation exists) and booking.version += 1."
      - from: DELAYED
        to: DELAYED
        trigger: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY (re-declaration with a later revised_arrival_utc)"
        actor: OpsController
        preconditions:
          - "segment.status = DELAYED"
          - "payload revised_arrival_utc strictly after the stored revised_arrival_utc"
        side_effects:
          - "delay_minutes and is_significant_delay recomputed; if the delay newly crosses the threshold a FARE obligation is created exactly as in SCHEDULED -> DELAYED; if a FARE obligation already exists its amount_cents is NOT recomputed."
        note: "Self-cycle. Re-declaring a shorter delay is rejected with ERR_DELAY_NOT_WORSENED."
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /compliance/flight-segments/{id}/record-operation with operation = RESTORED"
        actor: OpsController
        preconditions:
          - "segment.status = DELAYED"
          - "segment.disruption_type = DELAY"
        side_effects:
          - "segment.status = SCHEDULED, disruption_type = NONE, revised_arrival_utc = null, delay_minutes = 0, is_significant_delay = false, disruption_declared_at_utc = null, segment.version += 1."
          - "Existing obligations are NOT voided; instead their settlement is blocked by the cross-entity precondition on initiate-settlement (ERR_SOURCE_DISRUPTION_RESCINDED)."
          - "booking.disruption_posture and unused_segment_count recomputed; booking.version += 1."
        note: "Closes the cycle SCHEDULED -> DELAYED -> SCHEDULED."
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /compliance/flight-segments/{id}/record-operation with operation = DEPARTED"
        actor: OpsController
        preconditions:
          - "segment.status IN {SCHEDULED, DELAYED}"
          - "every sibling segment with a smaller sequence_index has status IN {DEPARTED, ARRIVED, CANCELLED, DISRUPTED_UNUSED}"
        side_effects:
          - "segment.status = DEPARTED, actual_departure_utc = occurred_at_utc, segment.version += 1."
          - "booking.travel_commenced = true, unused_segment_count and disruption_posture recomputed, booking.version += 1."
      - from: DELAYED
        to: DEPARTED
        trigger: "POST /compliance/flight-segments/{id}/record-operation with operation = DEPARTED"
        actor: OpsController
        preconditions:
          - "segment.status = DELAYED"
        side_effects:
          - "Same as SCHEDULED -> DEPARTED."
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /compliance/flight-segments/{id}/record-operation with operation = ARRIVED"
        actor: OpsController
        preconditions:
          - "segment.status = DEPARTED"
          - "occurred_at_utc strictly after actual_departure_utc"
        side_effects:
          - "segment.status = ARRIVED, actual_arrival_utc = occurred_at_utc, segment.version += 1."
          - "Every AncillaryPurchase of this segment with delivery_status = PENDING_DELIVERY becomes DELIVERED (bubble side effect; a service flown as sold is delivered)."
          - "booking.unused_segment_count and disruption_posture recomputed, booking.version += 1."

  - entity: AncillaryPurchase
    initial_state: PENDING_DELIVERY
    terminal_states: [DELIVERED]
    shape: branching
    transitions:
      - from: PENDING_DELIVERY
        to: NOT_PROVIDED
        trigger: "POST /compliance/ancillary-purchases/{id}/mark-not-provided"
        actor: "ComplianceOfficer | ComplianceAdmin"
        preconditions:
          - "ancillary.delivery_status = PENDING_DELIVERY"
          - "the parent FlightSegment.status != ARRIVED (a flown leg's services are settled by the ARRIVED bubble)"
        side_effects:
          - "delivery_status = NOT_PROVIDED, non_provision_reason = payload value, version += 1."
          - "A RefundObligation (basis ANCILLARY, issuance_mode PROACTIVE, variant FEE_FACE_VALUE, gross_entitlement_cents = ancillary.amount_cents) is created and clamped by §1.3 booking_refund_headroom; refund_obligation_created = true."
          - "booking.total_refund_obligated_cents, earliest_refund_deadline_utc, disruption_posture recomputed; booking.version += 1."
      - from: PENDING_DELIVERY
        to: NOT_PROVIDED
        trigger: "system cascade LINK 2b of FlightSegment SCHEDULED_to_CANCELLED"
        actor: system
        preconditions:
          - "the parent segment just entered CANCELLED"
        side_effects:
          - "Same field writes as the manual action, with non_provision_reason = SERVICE_CANCELLED."
      - from: PENDING_DELIVERY
        to: DELIVERED
        trigger: "system bubble from FlightSegment DEPARTED_to_ARRIVED"
        actor: system
        preconditions:
          - "the parent segment just entered ARRIVED"
        side_effects:
          - "delivery_status = DELIVERED, version += 1. No obligation is created."
      - from: NOT_PROVIDED
        to: PENDING_DELIVERY
        trigger: "system compensation from RefundObligation void with void_reason = CREATED_IN_ERROR"
        actor: system
        preconditions:
          - "the voided obligation has basis = ANCILLARY and ancillary_purchase_id = this row"
        side_effects:
          - "delivery_status = PENDING_DELIVERY, non_provision_reason = null, refund_obligation_created = false, version += 1."
        note: "Compensating transition; restores the pre-cascade state so §1.3 obligated_cents_conservation holds exactly."

  - entity: CheckedBag
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED_ON_TIME, DELIVERED_LATE, DECLARED_LOST]
    shape: branching
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED_ON_TIME
        trigger: "POST /compliance/checked-bags/{id}/resolve with resolution = DELIVERED"
        actor: "ComplianceOfficer | ComplianceAdmin"
        preconditions:
          - "bag.status = IN_TRANSIT"
          - "payload delivered_at_utc present and >= bag.checked_at_utc"
          - "§1.3 baggage_delivery_delay yields delivery_delay_hours < the scope threshold"
        side_effects:
          - "status = DELIVERED_ON_TIME, delivered_at_utc set, delivery_delay_hours recomputed, version += 1. No obligation is created."
      - from: IN_TRANSIT
        to: DELIVERED_LATE
        trigger: "POST /compliance/checked-bags/{id}/resolve with resolution = DELIVERED"
        actor: "ComplianceOfficer | ComplianceAdmin"
        preconditions:
          - "bag.status = IN_TRANSIT"
          - "§1.3 baggage_delivery_delay yields delivery_delay_hours >= the scope threshold"
        side_effects:
          - "LINK 1: status = DELIVERED_LATE, delivered_at_utc set, delivery_delay_hours recomputed, version += 1."
          - "LINK 2 (caused by LINK 1): a RefundObligation (basis BAGGAGE_FEE, issuance_mode PROACTIVE, variant FEE_FACE_VALUE, gross_entitlement_cents = bag.fee_cents) is created and clamped by §1.3 booking_refund_headroom; bag.fee_refund_obligated = true. Skipped with booking.suppressed_obligation_count += 1 when fee_cents = 0 or the clamp yields 0."
          - "LINK 3 (caused by LINK 2): booking.total_refund_obligated_cents, earliest_refund_deadline_utc and disruption_posture (-> REFUND_OBLIGATED) are recomputed and booking.version += 1."
      - from: IN_TRANSIT
        to: DECLARED_LOST
        trigger: "POST /compliance/checked-bags/{id}/resolve with resolution = DECLARED_LOST"
        actor: "ComplianceOfficer | ComplianceAdmin"
        preconditions:
          - "bag.status = IN_TRANSIT"
          - "payload loss_declared_at_utc present and >= bag.checked_at_utc"
        side_effects:
          - "status = DECLARED_LOST, loss_declared_at_utc set, delivery_delay_hours left at 0, version += 1."
          - "A RefundObligation (basis BAGGAGE_FEE, PROACTIVE, FEE_FACE_VALUE) is created exactly as on the DELIVERED_LATE branch — a lost bag always owes the fee back regardless of elapsed hours."
          - "booking ledger fields recomputed; booking.version += 1."

  - entity: DeniedBoardingRecord
    initial_state: RECORDED
    terminal_states: [FINALIZED, RECATEGORIZED]
    shape: branching
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /compliance/denied-boarding-records/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "record.status = RECORDED"
          - "record.category = INVOLUNTARY, or record.category = VOLUNTARY with written_disclosure_provided = true"
          - "when category = VOLUNTARY: voluntary_agreed_amount_cents >= round_half_up(statutory_compensation_cents * VOLUNTARY_DISCLOSURE_FLOOR_PCT) (else ERR_VOLUNTARY_BELOW_DISCLOSURE_FLOOR)"
        side_effects:
          - "substitute_delay_minutes, statutory_compensation_cents and compensation_cents computed per §1.3 denied_boarding_compensation; effective_category = category; status = FINALIZED; finalized_at_utc set; version += 1."
          - "A RefundObligation (basis DENIED_BOARDING, issuance_mode PROACTIVE, variant = INVOLUNTARY_STATUTORY or VOLUNTARY_NEGOTIATED, gross_entitlement_cents = compensation_cents) is created and clamped by §1.3 booking_refund_headroom; skipped when compensation_cents = 0 (delay at or below INVOLUNTARY_NO_COMP_MAX_MINUTES) with booking.suppressed_obligation_count += 1."
          - "booking ledger fields recomputed; booking.version += 1."
      - from: RECORDED
        to: RECATEGORIZED
        trigger: "POST /compliance/denied-boarding-records/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "record.status = RECORDED"
          - "record.category = VOLUNTARY and written_disclosure_provided = false"
        side_effects:
          - "effective_category = INVOLUNTARY (the volunteer never received the written statement, so the waiver is void), status = RECATEGORIZED, compensation_cents = statutory_compensation_cents (the agreed amount is ignored), finalized_at_utc set, version += 1."
          - "A RefundObligation (basis DENIED_BOARDING, variant INVOLUNTARY_STATUTORY) is created with the statutory amount; the disclosure floor check is NOT applied on this branch."
          - "booking ledger fields recomputed; booking.version += 1."
        note: "Divergent side-effect set versus the FINALIZED branch: different variant, different amount, and no floor validation."

  - entity: TarmacDelayEvent
    initial_state: DELAY_ACTIVE
    terminal_states: [REPORT_FILED]
    shape: fork_join
    note: "DELAY_ACTIVE forks into DEPLANED or EXEMPTION_INVOKED with divergent side effects, and both branches join at REPORT_FILED."
    transitions:
      - from: DELAY_ACTIVE
        to: DEPLANED
        trigger: "POST /compliance/tarmac-delay-events/{id}/deplane"
        actor: OpsController
        preconditions:
          - "event.status = DELAY_ACTIVE"
          - "payload deplane_completed_utc strictly after event.tarmac_start_utc"
        side_effects:
          - "status = DEPLANED, deplane_completed_utc set, interval_end_utc = deplane_completed_utc, tarmac_minutes and is_violation computed per §1.3 tarmac_compliance_evaluation, version += 1."
          - "segment.cumulative_tarmac_minutes += tarmac_minutes; segment.version += 1."
      - from: DELAY_ACTIVE
        to: EXEMPTION_INVOKED
        trigger: "POST /compliance/tarmac-delay-events/{id}/claim-exemption"
        actor: OpsController
        preconditions:
          - "event.status = DELAY_ACTIVE"
          - "exemption_declared_at_utc strictly after tarmac_start_utc and <= tarmac_start_utc + event.deadline_minutes (else ERR_EXEMPTION_AFTER_DEADLINE)"
        side_effects:
          - "status = EXEMPTION_INVOKED, exemption_reason and exemption_declared_at_utc set, interval_end_utc = exemption_declared_at_utc, tarmac_minutes computed, is_violation forced to false, version += 1."
          - "segment.exempted_tarmac_event_count += 1; segment.cumulative_tarmac_minutes is NOT increased; segment.version += 1."
        note: "Divergent side effects versus the DEPLANED branch: no cumulative minutes, violation suppressed."
      - from: DEPLANED
        to: REPORT_FILED
        trigger: "POST /compliance/tarmac-delay-events/{id}/file-report"
        actor: ComplianceAdmin
        preconditions:
          - "event.status = DEPLANED"
          - "the parent FlightSegment.status IN {DEPARTED, ARRIVED, CANCELLED} (a contingency-plan report may only be filed once the leg is operationally closed out)"
          - "corrective_action_summary present when event.is_violation = true (else ERR_CORRECTIVE_ACTION_REQUIRED)"
        side_effects:
          - "status = REPORT_FILED, report_reference, corrective_action_summary and report_filed_at_utc set, version += 1."
      - from: EXEMPTION_INVOKED
        to: REPORT_FILED
        trigger: "POST /compliance/tarmac-delay-events/{id}/file-report"
        actor: ComplianceAdmin
        preconditions:
          - "event.status = EXEMPTION_INVOKED"
          - "the parent FlightSegment.status IN {DEPARTED, ARRIVED, CANCELLED}"
        side_effects:
          - "status = REPORT_FILED, report_reference and report_filed_at_utc set, version += 1. corrective_action_summary is never required on this branch."
        note: "Join point: both fork branches converge here."

  - entity: RefundObligation
    initial_state: "PENDING_ELECTION | UNSETTLED"
    terminal_states: [SETTLED, VOIDED]
    shape: parallel_dimensions
    note: |
      One row carries two status axes that advance independently. Axis A is `election_status`
      (PENDING_ELECTION -> ELECTED_CASH | ELECTED_CREDIT). Axis B is `settlement_status`
      (UNSETTLED -> INITIATED -> SETTLED | FAILED, FAILED -> INITIATED retry loop, and
      VOIDED reachable from UNSETTLED / FAILED / SETTLED). The auto-default sweep advances axis A
      while axis B stays UNSETTLED; a FAILED -> INITIATED retry advances axis B without touching
      axis A. Axis B's UNSETTLED -> INITIATED transition reads axis A as a precondition, which is a
      gate, not a merge of the two axes.
    transitions:
      - from: PENDING_ELECTION
        to: ELECTED_CASH
        trigger: "POST /compliance/refund-obligations/{id}/elect with election = CASH"
        actor: "Passenger | ComplianceOfficer"
        axis: election_status
        preconditions:
          - "obligation.election_status = PENDING_ELECTION"
          - "obligation.settlement_status = UNSETTLED"
          - "when the caller role is Passenger: booking.passenger_id = X-User-ID"
        side_effects:
          - "election_status = ELECTED_CASH, election_source = PASSENGER when the caller role is Passenger else OFFICER_ON_BEHALF, settlement_method resolved per §1.3 settlement_method_resolution, credit_bonus_cents = 0, payable_total_cents = amount_cents, version += 1."
      - from: PENDING_ELECTION
        to: ELECTED_CREDIT
        trigger: "POST /compliance/refund-obligations/{id}/elect with election = TRAVEL_CREDIT"
        actor: "Passenger | ComplianceOfficer"
        axis: election_status
        preconditions:
          - "obligation.election_status = PENDING_ELECTION"
          - "obligation.settlement_status = UNSETTLED"
          - "when the caller role is ComplianceOfficer: consent_complaint_id is present (ERR_CREDIT_CONSENT_REQUIRED) and resolves to a ConsumerComplaint whose booking_id = obligation.booking_id (ERR_CONSENT_REFERENCE_MISMATCH)"
        side_effects:
          - "election_status = ELECTED_CREDIT, election_source set as above, credit_consent_reference = consent_complaint_id when supplied, settlement_method = TRAVEL_CREDIT, credit_bonus_cents per §1.3 travel_credit_bonus, payable_total_cents = amount_cents + credit_bonus_cents, version += 1."
          - "Booking.total_refund_obligated_cents is NOT changed — the goodwill bonus sits outside the headroom ledger."
      - from: PENDING_ELECTION
        to: ELECTED_CASH
        trigger: "POST /compliance/compliance-sweeps (auto-default when the election window elapsed)"
        actor: system
        axis: election_status
        preconditions:
          - "obligation.election_status = PENDING_ELECTION"
          - "logical clock now > obligation.election_deadline_utc"
        side_effects:
          - "election_status = ELECTED_CASH, election_source = AUTO_DEFAULT, settlement_method resolved per §1.3 settlement_method_resolution, version += 1."
          - "ELECTED_CREDIT is never the auto-default, regardless of PolicyProfile.travel_credit_default_permitted — defaulting a passenger into travel credit is the prohibited practice this transition exists to prevent."
        note: "Processed in created_at ASC order across the swept obligations."
      - from: UNSETTLED
        to: INITIATED
        trigger: "POST /compliance/refund-obligations/{id}/initiate-settlement"
        actor: ComplianceOfficer
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status IN {UNSETTLED, FAILED}"
          - "obligation.election_status != PENDING_ELECTION (ERR_ELECTION_REQUIRED)"
          - "when basis = FARE: the referenced FlightSegment.status IN {CANCELLED, DISRUPTED_UNUSED} or (status = DELAYED and is_significant_delay = true) — else ERR_SOURCE_DISRUPTION_RESCINDED"
          - "X-User-ID != obligation.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "settlement_status = INITIATED, settlement_attempt_count += 1, settlement_initiated_at_utc = logical clock now, settlement_initiated_by_user_id = X-User-ID, version += 1."
      - from: FAILED
        to: INITIATED
        trigger: "POST /compliance/refund-obligations/{id}/initiate-settlement (retry)"
        actor: ComplianceOfficer
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status = FAILED"
          - "same election, cross-entity and segregation preconditions as UNSETTLED -> INITIATED"
        side_effects:
          - "settlement_status = INITIATED, settlement_attempt_count += 1, last_failure_reason retained, version += 1. election_status and election_source are untouched."
        note: "Retry loop: the settlement axis cycles FAILED -> INITIATED -> FAILED without ever moving the election axis."
      - from: INITIATED
        to: SETTLED
        trigger: "POST /compliance/refund-obligations/{id}/complete-settlement with outcome = SUCCEEDED"
        actor: "ComplianceOfficer | ComplianceAdmin"
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status = INITIATED"
          - "X-User-ID != obligation.settlement_initiated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "settlement_status = SETTLED, settled_at_utc = logical clock now, version += 1."
          - "When settlement_method = TRAVEL_CREDIT: passenger.travel_credit_balance_cents += payable_total_cents, passenger.version += 1."
          - "booking.earliest_refund_deadline_utc and disruption_posture recomputed (-> CLOSED_OUT when every obligation of the booking is SETTLED or VOIDED); booking.version += 1."
      - from: INITIATED
        to: FAILED
        trigger: "POST /compliance/refund-obligations/{id}/complete-settlement with outcome = FAILED"
        actor: "ComplianceOfficer | ComplianceAdmin"
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status = INITIATED"
          - "failure_reason present (ERR_FAILURE_REASON_REQUIRED)"
          - "X-User-ID != obligation.settlement_initiated_by_user_id"
        side_effects:
          - "settlement_status = FAILED, last_failure_reason = failure_reason, settlement_initiated_by_user_id cleared to null, version += 1."
          - "Booking.total_refund_obligated_cents is unchanged — a failed settlement still owes the money."
      - from: UNSETTLED
        to: VOIDED
        trigger: "POST /compliance/refund-obligations/{id}/void with void_reason IN {CREATED_IN_ERROR, DUPLICATE, PASSENGER_WITHDREW}"
        actor: ComplianceAdmin
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status IN {UNSETTLED, FAILED}"
          - "void_reason != SETTLEMENT_REVERSED"
        side_effects:
          - "settlement_status = VOIDED, void_reason set, version += 1."
          - "booking.total_refund_obligated_cents recomputed excluding VOIDED rows, earliest_refund_deadline_utc and disruption_posture recomputed, booking.version += 1 — restoring §1.3 obligated_cents_conservation exactly."
          - "When void_reason = CREATED_IN_ERROR and basis = ANCILLARY: the referenced AncillaryPurchase returns to PENDING_DELIVERY with non_provision_reason = null and refund_obligation_created = false."
          - "When basis = BAGGAGE_FEE: the referenced CheckedBag.fee_refund_obligated = false; its status is left untouched."
      - from: FAILED
        to: VOIDED
        trigger: "POST /compliance/refund-obligations/{id}/void with void_reason IN {CREATED_IN_ERROR, DUPLICATE, PASSENGER_WITHDREW}"
        actor: ComplianceAdmin
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status = FAILED"
        side_effects:
          - "Same as UNSETTLED -> VOIDED."
      - from: SETTLED
        to: VOIDED
        trigger: "POST /compliance/refund-obligations/{id}/void with void_reason = SETTLEMENT_REVERSED"
        actor: ComplianceAdmin
        axis: settlement_status
        preconditions:
          - "obligation.settlement_status = SETTLED"
          - "void_reason = SETTLEMENT_REVERSED (any other reason is ERR_OBLIGATION_NOT_VOIDABLE)"
        side_effects:
          - "settlement_status = VOIDED, void_reason = SETTLEMENT_REVERSED, settled_at_utc retained for audit, version += 1."
          - "When settlement_method = TRAVEL_CREDIT: passenger.travel_credit_balance_cents -= payable_total_cents, passenger.version += 1 — restoring §1.3 travel_credit_conservation exactly."
          - "booking.total_refund_obligated_cents, earliest_refund_deadline_utc and disruption_posture recomputed; booking.version += 1."
        note: "Compensating transition for a settled refund that the processor clawed back."

  - entity: ConsumerComplaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /compliance/consumer-complaints/{id}/acknowledge"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status = RECEIVED"
          - "acknowledged_at_utc >= complaint.received_at_utc"
        side_effects:
          - "status = ACKNOWLEDGED, acknowledged_at_utc set, version += 1."
          - "A ComplaintActivity row (activity_type = ACKNOWLEDGED) is appended."
          - "passenger.open_complaint_count is unchanged (still open)."
      - from: ACKNOWLEDGED
        to: INFO_REQUESTED
        trigger: "POST /compliance/consumer-complaints/{id}/request-info"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status = ACKNOWLEDGED"
          - "requested_at_utc >= complaint.acknowledged_at_utc"
        side_effects:
          - "status = INFO_REQUESTED, info_requested_count += 1, version += 1. answer_due_utc is NOT extended — requesting information does not buy the carrier time."
          - "A ComplaintActivity row (activity_type = INFO_REQUESTED) is appended."
      - from: ACKNOWLEDGED
        to: ANSWERED
        trigger: "POST /compliance/consumer-complaints/{id}/answer"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status IN {ACKNOWLEDGED, INFO_REQUESTED}"
          - "answered_at_utc >= complaint.received_at_utc"
          - "accessibility_resolution_code present when complaint.category = DISABILITY (ERR_ACCESSIBILITY_RESOLUTION_REQUIRED)"
          - "granted_amount_cents present and >= 1 when disposition = REFUND_GRANTED (ERR_GRANT_AMOUNT_REQUIRED)"
        side_effects:
          - "LINK 1: status = ANSWERED, disposition, answered_at_utc, accessibility_resolution_code and granted_amount_cents set, version += 1; a ComplaintActivity row (activity_type = ANSWERED) is appended; passenger.open_complaint_count recomputed."
          - "LINK 2 (caused by LINK 1, only when disposition = REFUND_GRANTED): a RefundObligation (basis GOODWILL_GRANT, issuance_mode REQUEST_BASED, variant GOODWILL_GRANT_AMOUNT, gross_entitlement_cents = granted_amount_cents, all four source FKs null, obligation_start_utc = answered_at_utc) is created and clamped by §1.3 booking_refund_headroom."
          - "LINK 3 (caused by LINK 2): booking.total_refund_obligated_cents, earliest_refund_deadline_utc and disruption_posture recomputed; booking.version += 1."
      - from: INFO_REQUESTED
        to: ANSWERED
        trigger: "POST /compliance/consumer-complaints/{id}/answer"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status = INFO_REQUESTED"
        side_effects:
          - "Same LINK 1..LINK 3 chain as ACKNOWLEDGED -> ANSWERED."
      - from: ANSWERED
        to: ACKNOWLEDGED
        trigger: "POST /compliance/consumer-complaints/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status = ANSWERED"
          - "complaint.reopen_count < REOPEN_LIMIT (§1.3 constants; else ERR_REOPEN_LIMIT_REACHED)"
          - "reopened_at_utc >= complaint.answered_at_utc"
        side_effects:
          - "status = ACKNOWLEDGED, reopen_count += 1, answer_due_utc = reopened_at_utc + the category's answer-deadline days per §1.3 complaint_deadline_resolution, answer_breached reset to false, disposition and accessibility_resolution_code retained, version += 1."
          - "A ComplaintActivity row (activity_type = REOPENED) is appended; passenger.open_complaint_count recomputed."
        note: "Closes the cycle ACKNOWLEDGED -> ANSWERED -> ACKNOWLEDGED. The already-created GOODWILL_GRANT obligation is not duplicated on the second answer (ERR_DUPLICATE_OBLIGATION_FOR_SOURCE guards a second grant on the same complaint)."
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /compliance/compliance-sweeps (auto-close once the reopen window elapsed)"
        actor: system
        preconditions:
          - "complaint.status = ANSWERED"
          - "logical clock now > complaint.answered_at_utc + AUTO_CLOSE_DAYS (§1.3 constants)"
        side_effects:
          - "status = CLOSED, version += 1; a ComplaintActivity row (activity_type = AUTO_CLOSED) is appended; passenger.open_complaint_count recomputed."
        note: "Processed in received_at_utc ASC order, tie-broken by created_at ASC."

  - entity: RegulatorReport
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance/regulator-reports/{id}/submit"
        actor: ComplianceAdmin
        preconditions:
          - "report.status IN {DRAFT, AMENDING}"
          - "every ConsumerComplaint whose booking's policy_profile_id = report.policy_profile_id and whose received_at_utc falls inside [period_start_utc, period_end_utc] has status IN {ANSWERED, CLOSED} (else ERR_OPEN_COMPLAINT_IN_PERIOD)"
          - "submitted_at_utc >= report.period_end_utc (a period cannot be filed before it closes)"
        side_effects:
          - "All seven metrics are computed per §1.3 regulator_report_metrics and frozen onto the row; policy_version_pinned = PolicyProfile.version as observed now; status = SUBMITTED; submitted_at_utc and submitted_by_user_id set; version += 1."
      - from: SUBMITTED
        to: AMENDING
        trigger: "POST /compliance/regulator-reports/{id}/amend"
        actor: ComplianceAdmin
        preconditions:
          - "report.status = SUBMITTED"
          - "amended_at_utc >= report.submitted_at_utc"
        side_effects:
          - "status = AMENDING, amendment_count += 1, amendment_reason set, version += 1. Frozen metrics and policy_version_pinned are retained until the next submit refreezes them."
      - from: AMENDING
        to: SUBMITTED
        trigger: "POST /compliance/regulator-reports/{id}/submit"
        actor: ComplianceAdmin
        preconditions:
          - "report.status = AMENDING"
          - "same open-complaint and submitted_at_utc preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "Metrics are recomputed from current data and refrozen; policy_version_pinned refreshed; status = SUBMITTED; version += 1."
        note: "Closes the cycle SUBMITTED -> AMENDING -> SUBMITTED; a report can be amended repeatedly."

concurrency_rules:
  - rule_id: obligation-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /compliance/refund-obligations"
    occ_field: "expected_booking_version"
    description: |
      Creating a request-based RefundObligation against a Booking whose version has advanced since
      the client last read it is rejected with 412. The amount a request-based obligation may claim
      is bounded by the booking's remaining headroom (§1.3 booking_refund_headroom), and that
      headroom moves every time a disruption cascade mints a proactive obligation or an
      administrator voids one. A client whose view of the booking predates such a cascade would
      compute its claim against superseded totals, so the stale view is refused outright rather
      than silently clamped.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
  - rule_id: report-create-stale-policy
    parent_entity: PolicyProfile
    write_endpoint: "POST /compliance/regulator-reports"
    occ_field: "expected_policy_profile_version"
    description: |
      Opening a RegulatorReport against a PolicyProfile whose version has advanced since the client
      last read it is rejected with 412. The compliance sweep rewrites PolicyProfile.open_violation_count
      (advancing the profile's version), and every prior report creation increments report_count, so a
      client holding an older profile version is provably filing against a superseded compliance
      picture. The stale version is refused rather than accepted with recomputed counts.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

calculations:
  - name: significant_delay_determination
    trigger: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY"
    algorithm: threshold
    formula: |
      scope_threshold_minutes =
        if segment.is_international = true
          then policy.international_significant_delay_minutes
          else policy.domestic_significant_delay_minutes
      delay_minutes = floor((revised_arrival_utc - segment.scheduled_arrival_utc) / 60 seconds)
      is_significant_delay = (delay_minutes >= scope_threshold_minutes)
    input_set: |
      The single FlightSegment named in the path, joined to PolicyProfile through
      Booking.policy_profile_id (FlightSegment.booking_id -> Booking.policy_profile_id).
      The per-segment `is_international` flag, not the booking-level itinerary_scope, selects
      the threshold, so a domestic leg inside an international itinerary uses 180 minutes.
    constants: {}
    precision: "delay_minutes is a whole number of minutes, truncated toward zero (floor); the comparison is >= so a delay of exactly the threshold IS significant"

  - name: fare_refund_entitlement
    trigger: "POST /compliance/refund-obligations with basis = FARE"
    algorithm: aggregation
    formula: |
      # gross_entitlement_cents before any headroom clamp (see booking_refund_headroom)
      if issuance_mode = PROACTIVE:
        if booking.travel_commenced = false:
          gross_entitlement_cents = booking.total_fare_cents
        else:
          gross_entitlement_cents = sum of FlightSegment.segment_fare_cents
            over segments where booking_id = booking.id
              and status IN {SCHEDULED, DELAYED, CANCELLED, DISRUPTED_UNUSED}
            (summed in sequence_index ASC order; no intermediate rounding — the
             per-segment fares are already whole cents)
      if issuance_mode = REQUEST_BASED:
        if booking.segment_count = 0:
          gross_entitlement_cents = 0          # empty-set guard; no division is performed
        else:
          per_segment_cents = round_half_up(booking.total_fare_cents / booking.segment_count)
          gross_entitlement_cents = per_segment_cents * booking.unused_segment_count
    input_set: |
      (a) source entity: FlightSegment rows whose booking_id = the target Booking, filtered to
      status IN {SCHEDULED, DELAYED, CANCELLED, DISRUPTED_UNUSED} (DEPARTED and ARRIVED segments
      are flown value and are excluded); (b) index window: sequence_index 1..booking.segment_count
      inclusive on both ends; (c) tie-break: sequence_index ASC is unique per booking
      (ERR_DUPLICATE_SEQUENCE_INDEX), so no further tie-break is needed.
      `unused_segment_count` is maintained by the same status filter.
    constants: {}
    precision: |
      Whole cents. **Pinned rounding order for REQUEST_BASED: round per segment FIRST, then
      multiply by the unused-segment count** — round_half_up(total_fare_cents / segment_count)
      then `* unused_segment_count`. Multiplying first and rounding once
      (round_half_up(total_fare_cents * unused_segment_count / segment_count)) is explicitly
      NOT the rule and yields a different cent value on non-divisible fares.
    variants:
      - name: PROACTIVE_FULL_ITINERARY
        when: "issuance_mode = PROACTIVE — the carrier mints the obligation itself off a CANCELLED or significantly-delayed segment, without a passenger request"
        difference: "Values the whole remaining itinerary: the full fare when travel has not commenced, otherwise the sum of the un-flown segments' own fares. Never prorates by segment count."
      - name: REQUEST_BASED_UNUSED_PRORATION
        when: "issuance_mode = REQUEST_BASED — the passenger (or an officer on their behalf) asked for the refund"
        difference: "Prorates the total fare evenly across segment_count and pays only unused_segment_count shares, so an unevenly-priced itinerary yields a different number than PROACTIVE_FULL_ITINERARY on identical data."

  - name: non_fare_refund_entitlement
    trigger: "POST /compliance/refund-obligations with basis IN {ANCILLARY, BAGGAGE_FEE, GOODWILL_GRANT} and POST /compliance/consumer-complaints/{id}/answer with disposition = REFUND_GRANTED"
    algorithm: aggregation
    formula: |
      if basis = ANCILLARY:      gross_entitlement_cents = ancillary_purchase.amount_cents
      if basis = BAGGAGE_FEE:    gross_entitlement_cents = checked_bag.fee_cents
      if basis = GOODWILL_GRANT: gross_entitlement_cents = complaint.granted_amount_cents
    input_set: |
      Exactly one source row, resolved by the basis-matched FK on RefundObligation
      (ancillary_purchase_id / checked_bag_id / none for GOODWILL_GRANT, whose amount comes from
      the answering ConsumerComplaint). Partial refunds of a fee are not representable: the
      obligation is always the face value of the collected charge.
    constants: {}
    precision: "Whole cents, no rounding — the face value is copied."
    variants:
      - name: FEE_FACE_VALUE
        when: "basis IN {ANCILLARY, BAGGAGE_FEE}"
        difference: "Copies the collected charge; ignores segment_count, travel_commenced and every fare field."
      - name: GOODWILL_GRANT_AMOUNT
        when: "basis = GOODWILL_GRANT"
        difference: "Copies the officer-entered granted_amount_cents from the complaint answer; no source charge exists."

  - name: booking_refund_headroom
    trigger: "POST /compliance/refund-obligations (any basis) and the GOODWILL_GRANT obligation created by POST /compliance/consumer-complaints/{id}/answer"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER — the five steps run in exactly this sequence.
      # The dependency looks circular (amount_cents is bounded by headroom, and headroom is
      # a function of the amounts already persisted) and is made well-defined by the order.
      #
      # STEP 1 — gross:
      gross_entitlement_cents = fare_refund_entitlement(...) or non_fare_refund_entitlement(...)
      #
      # STEP 2 — headroom over STRICTLY PRE-EXISTING obligations only. The row being created is
      #          not yet persisted and therefore contributes nothing to this sum.
      collected_total_cents = booking.total_fare_cents
                            + sum of AncillaryPurchase.amount_cents where booking_id = booking.id
                            + sum of CheckedBag.fee_cents  where booking_id = booking.id
      consumed_cents = sum of RefundObligation.amount_cents
        over obligations where booking_id = booking.id
          and settlement_status != VOIDED
          and basis != DENIED_BOARDING          # statutory DBC is compensation, not a refund of money collected
        processed in created_at ASC order (created_at is unique per booking under the
        single-writer request model; no further tie-break required)
      headroom_at_creation_cents = collected_total_cents - consumed_cents
      #
      # STEP 3 — clamp or reject, by issuance_mode:
      if basis = DENIED_BOARDING:
        amount_cents = gross_entitlement_cents        # exempt from headroom entirely
      else if issuance_mode = PROACTIVE:
        amount_cents = min(gross_entitlement_cents, headroom_at_creation_cents)
        if headroom_at_creation_cents <= 0: reject with ERR_NO_REFUND_HEADROOM
      else:  # REQUEST_BASED
        if gross_entitlement_cents > headroom_at_creation_cents: reject with ERR_REFUND_EXCEEDS_HEADROOM
        amount_cents = gross_entitlement_cents
      #
      # STEP 4 — persist the obligation with amount_cents, headroom_at_creation_cents,
      #          gross_entitlement_cents, credit_bonus_cents = 0 and
      #          payable_total_cents = amount_cents (the bonus is added later, at election).
      #
      # STEP 5 — only now recompute booking_ledger_recompute, which re-reads the persisted rows
      #          INCLUDING the one just written.
    input_set: |
      (a) source entities: the target Booking, all of its AncillaryPurchase and CheckedBag rows
      (all statuses — the money was collected regardless of delivery outcome), and its
      RefundObligation rows filtered to settlement_status != VOIDED and basis != DENIED_BOARDING;
      (b) window: every such row created strictly before this request, ordered created_at ASC;
      (c) tie-break: created_at ASC, never `id`.
    constants: {}
    precision: "Whole cents. A PROACTIVE obligation is silently clamped down to the remaining headroom; a REQUEST_BASED one is rejected instead of clamped, so the two issuance modes react differently to the same exhausted ledger."

  - name: denied_boarding_compensation
    trigger: "POST /compliance/denied-boarding-records/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      substitute_delay_minutes = floor((record.substitute_arrival_utc
                                        - segment.scheduled_arrival_utc) / 60 seconds)
      tier1_max_minutes = if segment.is_international = true
                            then TIER1_MAX_MINUTES_INTERNATIONAL
                            else TIER1_MAX_MINUTES_DOMESTIC
      # statutory ladder — nested min over a capped multiple of the one-way fare
      if substitute_delay_minutes <= INVOLUNTARY_NO_COMP_MAX_MINUTES:
        statutory_compensation_cents = 0
      else if substitute_delay_minutes <= tier1_max_minutes:
        statutory_compensation_cents = min(
          round_half_up(record.one_way_fare_cents * INVOLUNTARY_TIER1_MULTIPLIER),
          INVOLUNTARY_TIER1_CAP_CENTS)
      else:
        statutory_compensation_cents = min(
          round_half_up(record.one_way_fare_cents * INVOLUNTARY_TIER2_MULTIPLIER),
          INVOLUNTARY_TIER2_CAP_CENTS)
      # effective category: an unconfirmed oversale or a missing written disclosure demotes a
      # VOLUNTARY record to INVOLUNTARY treatment, because the passenger could not have given
      # informed consent.
      effective_category =
        if record.category = VOLUNTARY
             and record.oversale_confirmed = true
             and record.written_disclosure_provided = true
          then VOLUNTARY
          else INVOLUNTARY
      if effective_category = INVOLUNTARY:
        compensation_cents = statutory_compensation_cents
      else:
        voluntary_floor_cents = round_half_up(statutory_compensation_cents
                                              * VOLUNTARY_DISCLOSURE_FLOOR_PCT)
        if record.voluntary_agreed_amount_cents < voluntary_floor_cents:
          reject with ERR_VOLUNTARY_BELOW_DISCLOSURE_FLOOR
        compensation_cents = record.voluntary_agreed_amount_cents
    input_set: |
      The single DeniedBoardingRecord named in the path plus the FlightSegment it references
      (flight_segment_id) for `is_international` and `scheduled_arrival_utc`. The record's own
      one_way_fare_cents is used, never Booking.total_fare_cents.
    constants:
      INVOLUNTARY_NO_COMP_MAX_MINUTES: 60
      TIER1_MAX_MINUTES_DOMESTIC: 120
      TIER1_MAX_MINUTES_INTERNATIONAL: 240
      INVOLUNTARY_TIER1_MULTIPLIER: 2.0
      INVOLUNTARY_TIER2_MULTIPLIER: 4.0
      INVOLUNTARY_TIER1_CAP_CENTS: 77500
      INVOLUNTARY_TIER2_CAP_CENTS: 155000
      VOLUNTARY_DISCLOSURE_FLOOR_PCT: 0.50
    precision: |
      Whole cents, round_half_up applied to the fare multiple BEFORE the cap comparison and to the
      voluntary floor. Tier boundaries are inclusive on the upper edge: a substitute delay of
      exactly 60 minutes pays 0, exactly tier1_max_minutes pays the tier-1 amount, and
      tier1_max_minutes + 1 pays the tier-2 amount.
    variants:
      - name: INVOLUNTARY_STATUTORY
        when: "effective_category = INVOLUNTARY (declared INVOLUNTARY, or declared VOLUNTARY but oversale_confirmed = false or written_disclosure_provided = false)"
        difference: "Pays the capped statutory ladder; the negotiated amount on the row is ignored entirely."
      - name: VOLUNTARY_NEGOTIATED
        when: "effective_category = VOLUNTARY"
        difference: "Pays voluntary_agreed_amount_cents, which may sit anywhere at or above 50% of the statutory ladder — so identical fare and delay data yields a different compensation_cents than INVOLUNTARY_STATUTORY."

  - name: baggage_delivery_delay
    trigger: "POST /compliance/checked-bags/{id}/resolve with resolution = DELIVERED"
    algorithm: threshold
    formula: |
      delivery_delay_hours = round_half_up(
        (bag.delivered_at_utc - bag.scheduled_delivery_utc) / 3600 seconds, 2)
      scope_threshold_hours = if booking.itinerary_scope = INTERNATIONAL
                                then policy.bag_delay_threshold_hours_international
                                else policy.bag_delay_threshold_hours_domestic
      fee_refund_obligated = (delivery_delay_hours >= scope_threshold_hours)
      status = if fee_refund_obligated then DELIVERED_LATE else DELIVERED_ON_TIME
    input_set: |
      The single CheckedBag named in the path, its Booking (booking_id) for itinerary_scope, and
      that booking's PolicyProfile. Unlike significant_delay_determination this rule uses the
      BOOKING-level itinerary_scope, not a per-segment flag — a bag travels the whole itinerary.
    constants: {}
    precision: |
      Hours to 2 decimal places, round_half_up, computed from the raw second difference. A
      negative difference is impossible: ERR_DELIVERY_BEFORE_CHECKIN rejects
      delivered_at_utc < checked_at_utc. The comparison is >=, so a delay of exactly the
      threshold (12.00 h domestic) IS late.

  - name: tarmac_compliance_evaluation
    trigger: "POST /compliance/tarmac-delay-events/{id}/deplane, POST /compliance/tarmac-delay-events/{id}/claim-exemption"
    algorithm: interval_merge
    formula: |
      # Each TarmacDelayEvent occupies the half-open interval
      #   [tarmac_start_utc, interval_end_utc)
      # on its FlightSegment, where interval_end_utc is set to deplane_completed_utc on the
      # DEPLANED branch and to exemption_declared_at_utc on the EXEMPTION_INVOKED branch.
      # While an event is DELAY_ACTIVE its interval is open-ended: it occupies
      #   [tarmac_start_utc, +infinity)
      # and therefore blocks every later event on the same segment (ERR_TARMAC_INTERVAL_OVERLAP).
      tarmac_minutes = floor((interval_end_utc - tarmac_start_utc) / 60 seconds)
      deadline_minutes = if segment.is_international = true
                           then policy.tarmac_deplane_deadline_minutes_international
                           else policy.tarmac_deplane_deadline_minutes_domestic
      if event.status = EXEMPTION_INVOKED:
        is_violation = false                      # a valid safety/security/ATC exemption cures it
      else:
        is_violation = (tarmac_minutes > deadline_minutes)
      # segment-level accumulation, recomputed after every event closes:
      segment.cumulative_tarmac_minutes = sum of TarmacDelayEvent.tarmac_minutes
        over events where flight_segment_id = segment.id
          and status IN {DEPLANED, EXEMPTION_INVOKED, REPORT_FILED}
        (summed in tarmac_start_utc ASC order; ties impossible because intervals cannot overlap)
      segment.exempted_tarmac_event_count = count of those events with
        status IN {EXEMPTION_INVOKED, REPORT_FILED} and exemption_reason != null
    input_set: |
      (a) source entity: TarmacDelayEvent rows whose flight_segment_id = the segment, filtered to
      status IN {DEPLANED, EXEMPTION_INVOKED, REPORT_FILED} (DELAY_ACTIVE events contribute no
      minutes because their interval has not closed); (b) window: interval
      [tarmac_start_utc, interval_end_utc), start inclusive, end exclusive — an event may start at
      the exact instant the previous one ended; (c) ordering: tarmac_start_utc ASC.
    constants: {}
    precision: |
      Whole minutes, floored. The violation comparison is STRICT `>`: exactly
      deadline_minutes on the tarmac is compliant, deadline_minutes + 1 is a violation. This is
      deliberately the opposite edge convention from significant_delay_determination and
      baggage_delivery_delay, which both use `>=`.

  - name: refund_deadline_resolution
    trigger: "POST /compliance/refund-obligations, and the GOODWILL_GRANT obligation created by POST /compliance/consumer-complaints/{id}/answer"
    algorithm: chronological
    formula: |
      deadline_days = if booking.payment_method = CREDIT_CARD
                        then policy.credit_card_refund_deadline_days
                        else policy.other_method_refund_deadline_days
      deadline_utc          = obligation.obligation_start_utc + deadline_days days
      election_deadline_utc = obligation.obligation_start_utc + ELECTION_WINDOW_DAYS days
      # obligation_start_utc by basis:
      #   FARE            -> the referenced FlightSegment.disruption_declared_at_utc
      #   BAGGAGE_FEE     -> the referenced CheckedBag.delivered_at_utc, or, when the bag's
      #                      status = DECLARED_LOST (delivered_at_utc is null), its loss_declared_at_utc
      #   ANCILLARY       -> the referenced AncillaryPurchase's mark-not-provided occurred_at_utc
      #   DENIED_BOARDING -> the referenced DeniedBoardingRecord.finalized_at_utc
      #   GOODWILL_GRANT  -> the answering ConsumerComplaint.answered_at_utc
      deadline_breached = (logical clock now > obligation.deadline_utc
                           and obligation.settlement_status NOT IN {SETTLED, VOIDED})
    input_set: "The obligation being created, its Booking (payment_method), that booking's PolicyProfile, and the one basis-matched source row that supplies obligation_start_utc."
    constants:
      ELECTION_WINDOW_DAYS: 5
    precision: |
      Day arithmetic is exact 24-hour addition on the UTC instant — no calendar-month or
      business-day logic, no truncation to midnight. `deadline_breached` uses STRICT `>`: at the
      exact deadline instant the obligation is still timely.

  - name: travel_credit_bonus
    trigger: "POST /compliance/refund-obligations/{id}/elect with election = TRAVEL_CREDIT"
    algorithm: aggregation
    formula: |
      credit_bonus_cents   = round_half_up(obligation.amount_cents
                                           * policy.travel_credit_election_bonus_pct)
      payable_total_cents  = obligation.amount_cents + credit_bonus_cents
      # For election = CASH: credit_bonus_cents = 0 and payable_total_cents = amount_cents.
    input_set: "The single RefundObligation named in the path plus its Booking's PolicyProfile for the bonus percentage."
    constants: {}
    precision: |
      Whole cents, round_half_up on the percentage product. The bonus is deliberately EXCLUDED
      from Booking.total_refund_obligated_cents and from booking_refund_headroom's
      `consumed_cents`, so electing credit never shrinks the headroom available to later
      obligations.

  - name: settlement_method_resolution
    trigger: "POST /compliance/refund-obligations/{id}/elect"
    algorithm: projection
    formula: |
      if election = TRAVEL_CREDIT:
        settlement_method = TRAVEL_CREDIT
      else:  # election = CASH
        if booking.payment_method = CREDIT_CARD:  settlement_method = ORIGINAL_PAYMENT
        if booking.payment_method = CASH_OR_CHECK: settlement_method = CASH_OR_CHECK
        if booking.payment_method = MILES:         settlement_method = MILES
        if booking.payment_method = TRAVEL_CREDIT: settlement_method = TRAVEL_CREDIT
    input_set: "The obligation named in the path and its Booking's payment_method."
    constants: {}
    precision: "Exact enum mapping; no rounding. A booking originally paid in travel credit resolves a CASH election back to TRAVEL_CREDIT — the passenger cannot convert credit into cash by electing CASH."

  - name: complaint_deadline_resolution
    trigger: "POST /compliance/consumer-complaints, POST /compliance/consumer-complaints/{id}/reopen, POST /compliance/compliance-sweeps"
    algorithm: threshold
    formula: |
      answer_days = if complaint.category = DISABILITY
                      then policy.complaint_answer_deadline_days_disability
                      else policy.complaint_answer_deadline_days_general
      # on create:
      ack_due_utc    = complaint.received_at_utc + policy.complaint_ack_deadline_days days
      answer_due_utc = complaint.received_at_utc + answer_days days
      # on reopen:
      answer_due_utc = reopened_at_utc + answer_days days     # ack_due_utc is NOT re-derived
      # on sweep (breach flags):
      ack_breached    = (logical clock now > complaint.ack_due_utc
                         and complaint.acknowledged_at_utc is null)
      answer_breached = (logical clock now > complaint.answer_due_utc
                         and complaint.status NOT IN {ANSWERED, CLOSED})
    input_set: "The single ConsumerComplaint plus the PolicyProfile reached through Booking.policy_profile_id."
    constants: {}
    precision: |
      Exact 24-hour day addition on the UTC instant. Both breach comparisons use STRICT `>`, so a
      complaint answered at the exact answer_due_utc instant is NOT breached. A DISABILITY
      complaint's answer window (30 days) is shorter than its acknowledgement window is long
      (30 days), so both due instants coincide for disability matters.

  - name: booking_ledger_recompute
    trigger: "Every RefundObligation create, elect, complete-settlement and void; every FlightSegment declare-disruption, record-operation and RESTORED transition; every CheckedBag resolve; every AncillaryPurchase mark-not-provided"
    algorithm: aggregation
    formula: |
      # (1) itinerary scope and segment counters
      itinerary_scope = if any FlightSegment of the booking has is_international = true
                          then INTERNATIONAL else DOMESTIC
      segment_count = count of FlightSegment where booking_id = booking.id
      unused_segment_count = count of those with
        status IN {SCHEDULED, DELAYED, CANCELLED, DISRUPTED_UNUSED}
      travel_commenced = (any FlightSegment of the booking has status IN {DEPARTED, ARRIVED})
      # (2) collected money
      collected_total_cents = booking.total_fare_cents
                            + sum of AncillaryPurchase.amount_cents where booking_id = booking.id
                            + sum of CheckedBag.fee_cents where booking_id = booking.id
      # (3) obligated money — the conserved ledger
      total_refund_obligated_cents = sum of RefundObligation.amount_cents
        over obligations where booking_id = booking.id and settlement_status != VOIDED
        (summed in created_at ASC order)
      # (4) earliest open deadline
      earliest_refund_deadline_utc = min RefundObligation.deadline_utc
        over obligations where booking_id = booking.id
          and settlement_status NOT IN {SETTLED, VOIDED}
        (null when that set is empty; ties resolved by created_at ASC, never by id)
      # (5) posture
      disruption_posture =
        if segment_count = 0:                                                   NORMAL
        else if there exists a non-VOIDED RefundObligation for this booking:
                if every RefundObligation of the booking has
                     settlement_status IN {SETTLED, VOIDED}:                    CLOSED_OUT
                else:                                                           REFUND_OBLIGATED
        else if any FlightSegment has disruption_type != NONE:                   DISRUPTED
        else:                                                                   NORMAL
      # (6) suppressed obligations — proactive obligations the cascade wanted to mint but
      #     could not, because headroom_at_creation_cents was <= 0
      suppressed_obligation_count = running counter, incremented by the cascade, never recomputed
    input_set: |
      (a) source entities: all FlightSegment, AncillaryPurchase, CheckedBag and RefundObligation
      rows whose booking_id = this Booking, with the status filters written inline above;
      (b) window: every such row that exists at the end of the current request, including rows
      written earlier in this same request; (c) ordering/tie-break: created_at ASC for the money
      sums, sequence_index ASC for segment counters, created_at ASC for the deadline minimum.
    constants: {}
    precision: "Whole cents; the sums are exact integer additions with no intermediate rounding. Booking.version is incremented once per request in which any of these fields changes value."

  - name: regulator_report_metrics
    trigger: "POST /compliance/regulator-reports/{id}/submit"
    algorithm: aggregation
    formula: |
      # Scope: every Booking whose policy_profile_id = report.policy_profile_id, and the rows
      # hanging off those bookings. The window is CLOSED on BOTH ends:
      #   domain_timestamp >= report.period_start_utc AND domain_timestamp <= report.period_end_utc
      complaint_count = count of ConsumerComplaint in scope with received_at_utc in the window
      disability_complaint_count = count of those with category = DISABILITY
      late_answer_count = count of those with answer_breached = true
      tarmac_violation_count = count of TarmacDelayEvent in scope
        with tarmac_start_utc in the window and is_violation = true
      involuntary_denied_boarding_count = count of DeniedBoardingRecord in scope
        with status IN {FINALIZED, RECATEGORIZED}, finalized_at_utc in the window
        and effective_category = INVOLUNTARY
      refund_obligation_cents_total = sum of RefundObligation.amount_cents in scope
        with obligation_start_utc in the window and settlement_status != VOIDED
        (summed in created_at ASC order)
      overdue_refund_count = count of RefundObligation in scope
        with obligation_start_utc in the window and deadline_breached = true
      policy_version_pinned = PolicyProfile.version as observed during this submit
    input_set: |
      (a) source entities as listed inline, each reached through Booking.policy_profile_id
      (ConsumerComplaint.booking_id, TarmacDelayEvent -> FlightSegment.booking_id,
      DeniedBoardingRecord.booking_id, RefundObligation.booking_id); (b) window: the report's
      [period_start_utc, period_end_utc] interval, INCLUSIVE on both ends, evaluated against each
      entity's own domain timestamp (received_at_utc / tarmac_start_utc / finalized_at_utc /
      obligation_start_utc) — never against created_at; (c) ordering: created_at ASC for the sum.
    constants: {}
    precision: |
      Whole cents and whole counts. The closed-closed window is deliberately a different interval
      geometry from tarmac_compliance_evaluation's half-open
      [tarmac_start_utc, interval_end_utc) interval, so two consecutive reporting periods must not
      share a boundary instant (ERR_REPORT_PERIOD_OVERLAP) while two consecutive tarmac events may.

  - name: compliance_sweep_recount
    trigger: "POST /compliance/compliance-sweeps"
    algorithm: chronological
    formula: |
      # PINNED PHASE ORDER — the sweep runs these five phases in exactly this sequence, and
      # within each phase processes rows in created_at ASC order.
      # PHASE 1 — refund deadline breach flags:
      #   for each RefundObligation of every Booking with policy_profile_id = the swept profile,
      #   deadline_breached = (now > deadline_utc and settlement_status NOT IN {SETTLED, VOIDED})
      # PHASE 2 — election auto-default:
      #   for each RefundObligation with election_status = PENDING_ELECTION and
      #   now > election_deadline_utc: election_status = ELECTED_CASH,
      #   election_source = AUTO_DEFAULT, settlement_method per settlement_method_resolution
      # PHASE 3 — complaint breach flags per complaint_deadline_resolution
      # PHASE 4 — complaint auto-close:
      #   for each ConsumerComplaint with status = ANSWERED and
      #   now > answered_at_utc + AUTO_CLOSE_DAYS: status = CLOSED (+ ComplaintActivity row)
      # PHASE 5 — profile rollup:
      #   policy.open_violation_count =
      #       count of TarmacDelayEvent in scope with is_violation = true
      #     + count of RefundObligation in scope with deadline_breached = true
      #     + count of ConsumerComplaint in scope with (ack_breached = true or answer_breached = true)
      #   policy.version += 1 whenever open_violation_count changes value
      # Phases 1 and 3 must precede phase 5 because phase 5 counts the flags they set.
    input_set: |
      (a) source entities: every Booking with policy_profile_id = the swept profile and all
      RefundObligation / ConsumerComplaint / TarmacDelayEvent rows reachable from them;
      (b) window: unbounded — the sweep considers all history up to the logical clock's current
      instant; (c) ordering: phase order as pinned above, then created_at ASC within each phase.
    constants:
      AUTO_CLOSE_DAYS: 30
      REOPEN_LIMIT: 2
    precision: "All comparisons against the logical clock use STRICT `>`. The sweep is idempotent: running it twice at the same clock instant produces no additional field changes and no additional version increments."

  - name: obligated_cents_conservation
    trigger: "Invariant — asserted after every RefundObligation void (POST /compliance/refund-obligations/{id}/void)"
    algorithm: aggregation
    formula: |
      # Conserved quantity Q1 — the booking's obligated-money ledger.
      Q1(booking) = booking.total_refund_obligated_cents
                  - sum of RefundObligation.amount_cents
                      over obligations where booking_id = booking.id
                        and settlement_status != VOIDED
      # Q1 MUST equal 0 at the end of every request. Consequently, for a forward action that
      # creates an obligation of amount A followed by its compensating void of the same row:
      #   booking.total_refund_obligated_cents_after_void
      #     == booking.total_refund_obligated_cents_before_create
      # exactly, with no residual drift, and booking.disruption_posture returns to the value it
      # held before the create.
    input_set: "The Booking and all of its RefundObligation rows, all statuses, ordered created_at ASC."
    constants: {}
    precision: "Exact integer cents; zero tolerance. Voiding does not delete the row — the row persists with settlement_status = VOIDED and is excluded from the sum."

  - name: travel_credit_conservation
    trigger: "Invariant — asserted after every credit settlement and its reversal (POST /compliance/refund-obligations/{id}/complete-settlement, POST /compliance/refund-obligations/{id}/void with void_reason = SETTLEMENT_REVERSED)"
    algorithm: aggregation
    formula: |
      # Conserved quantity Q2 — the passenger's travel-credit balance.
      Q2(passenger) = passenger.travel_credit_balance_cents
                    - sum of RefundObligation.payable_total_cents
                        over obligations where the obligation's booking.passenger_id = passenger.id
                          and settlement_method = TRAVEL_CREDIT
                          and settlement_status = SETTLED
      # Q2 MUST equal 0 at the end of every request. Consequently, for a credit obligation that
      # is settled (balance += payable_total_cents) and then reversed
      # (balance -= payable_total_cents):
      #   passenger.travel_credit_balance_cents_after_reversal
      #     == passenger.travel_credit_balance_cents_before_settlement
      # exactly, including the credit_bonus_cents portion.
    input_set: "The Passenger, all of their Bookings, and every RefundObligation on those bookings with settlement_method = TRAVEL_CREDIT, ordered created_at ASC."
    constants: {}
    precision: "Exact integer cents; zero tolerance. Q2 is a different conserved quantity from Q1: Q1 tracks money the carrier still owes, Q2 tracks credit already issued to the passenger, and the credit bonus is inside Q2 but deliberately outside Q1."

validations:
  # ---- 1..5 authentication, authorization, ownership ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7 (ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor, Passenger)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "X-User-Role appears in the called endpoint's `roles:` list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: |
      Passenger ownership. When X-User-Role = Passenger, the addressed resource must belong to that
      passenger: for GET /compliance/passengers/{id}, {id} = X-User-ID; for
      GET /compliance/bookings and GET /compliance/bookings/{id} and their sub-resources,
      booking.passenger_id = X-User-ID; for
      POST /compliance/refund-obligations/{id}/elect and
      GET /compliance/refund-obligations{,/{id}}, the obligation's booking.passenger_id = X-User-ID;
      for POST /compliance/consumer-complaints, the body's booking_id resolves to a booking whose
      passenger_id = X-User-ID. Checked BEFORE existence of nested resources so a passenger cannot
      probe another passenger's ids.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /compliance/passengers/{id}, GET /compliance/bookings, GET /compliance/bookings/{id}, GET /compliance/bookings/{id}/flight-segments, GET /compliance/bookings/{id}/checked-bags, GET /compliance/bookings/{id}/consumer-complaints, GET /compliance/bookings/{id}/refund-exposure, GET /compliance/refund-obligations, GET /compliance/refund-obligations/{id}, POST /compliance/refund-obligations/{id}/elect, POST /compliance/consumer-complaints"

  # ---- 10..15 existence ----
  - priority: 10
    category: existence
    check: "Every id in the request path resolves to a stored row, validated left-to-right. Each entity has its own error: PolicyProfile -> ERR_POLICY_PROFILE_NOT_FOUND, Passenger -> ERR_PASSENGER_NOT_FOUND, Booking -> ERR_BOOKING_NOT_FOUND, FlightSegment -> ERR_FLIGHT_SEGMENT_NOT_FOUND, AncillaryPurchase -> ERR_ANCILLARY_PURCHASE_NOT_FOUND, CheckedBag -> ERR_CHECKED_BAG_NOT_FOUND, DeniedBoardingRecord -> ERR_DENIED_BOARDING_RECORD_NOT_FOUND, TarmacDelayEvent -> ERR_TARMAC_DELAY_EVENT_NOT_FOUND, RefundObligation -> ERR_REFUND_OBLIGATION_NOT_FOUND, ConsumerComplaint -> ERR_CONSUMER_COMPLAINT_NOT_FOUND, RegulatorReport -> ERR_REGULATOR_REPORT_NOT_FOUND."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 15
    category: existence
    check: "Every foreign-key id supplied in the request BODY resolves to a stored row, validated in the order the fields are listed in the endpoint's `input:`. Same per-entity error codes as priority 10."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /compliance/bookings, POST /compliance/bookings/{id}/flight-segments, POST /compliance/ancillary-purchases, POST /compliance/checked-bags, POST /compliance/denied-boarding-records, POST /compliance/tarmac-delay-events, POST /compliance/refund-obligations, POST /compliance/refund-obligations/{id}/elect, POST /compliance/consumer-complaints, POST /compliance/regulator-reports, POST /compliance/compliance-sweeps"

  # ---- 20..30 request shape ----
  - priority: 20
    category: business_constraint
    check: "Request body carries every required field from the endpoint's `input:`, no unknown fields, correct JSON types, enum values inside the declared constraint set, integer cent amounts >= 0, ISO-8601 UTC datetimes, carrier_code exactly 2 uppercase alphanumeric characters, record_locator exactly 6 uppercase alphanumerics, tag_number exactly 10 characters, sequence_index >= 1, email syntactically valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 22
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /compliance/bookings, GET /compliance/policy-profiles/{id}/regulator-reports, GET /compliance/bookings/{id}/flight-segments, GET /compliance/bookings/{id}/checked-bags, GET /compliance/bookings/{id}/consumer-complaints, GET /compliance/flight-segments/{id}/tarmac-delay-events, GET /compliance/ancillary-purchases, GET /compliance/denied-boarding-records, GET /compliance/refund-obligations, GET /compliance/consumer-complaints/{id}/activities"
  - priority: 30
    category: business_constraint
    check: "Conditionally required fields. POST /compliance/refund-obligations/{id}/complete-settlement with outcome = FAILED requires failure_reason (ERR_FAILURE_REASON_REQUIRED). POST /compliance/consumer-complaints/{id}/answer with disposition = REFUND_GRANTED requires granted_amount_cents >= 1 (ERR_GRANT_AMOUNT_REQUIRED). POST /compliance/checked-bags/{id}/resolve with resolution = DELIVERED requires delivered_at_utc, and with resolution = DECLARED_LOST requires loss_declared_at_utc (ERR_INVALID_REQUEST). POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY requires revised_arrival_utc (ERR_INVALID_REQUEST)."
    error_id: "ERR_FAILURE_REASON_REQUIRED | ERR_GRANT_AMOUNT_REQUIRED | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /compliance/refund-obligations/{id}/complete-settlement, POST /compliance/consumer-complaints/{id}/answer, POST /compliance/checked-bags/{id}/resolve, POST /compliance/flight-segments/{id}/declare-disruption"

  # ---- 35 optimistic concurrency ----
  - priority: 35
    category: state
    check: "expected_booking_version equals the current Booking.version (§1.2.1 obligation-create-stale-booking); expected_policy_profile_version equals the current PolicyProfile.version (§1.2.1 report-create-stale-policy)"
    error_id: "ERR_STALE_BOOKING_VERSION | ERR_STALE_POLICY_VERSION"
    http_status: 412
    applies_to: "POST /compliance/refund-obligations, POST /compliance/regulator-reports"

  # ---- 40 state of the path resource ----
  - priority: 40
    category: state
    check: |
      The resource named in the path is in a state from which the requested transition exists in §1.2.
      Per-entity errors: FlightSegment -> ERR_SEGMENT_STATE_INVALID; AncillaryPurchase ->
      ERR_ANCILLARY_STATE_INVALID; CheckedBag -> ERR_BAG_STATE_INVALID; DeniedBoardingRecord ->
      ERR_DENIED_BOARDING_STATE_INVALID; TarmacDelayEvent -> ERR_TARMAC_EVENT_STATE_INVALID;
      RefundObligation -> ERR_OBLIGATION_STATE_INVALID (wrong election_status or settlement_status
      for the requested action); ConsumerComplaint -> ERR_COMPLAINT_STATE_INVALID; RegulatorReport
      -> ERR_REPORT_STATE_INVALID.
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints (POST /compliance/**/{id}/<action>)"
  - priority: 41
    category: state
    check: "POST /compliance/refund-obligations/{id}/initiate-settlement requires election_status != PENDING_ELECTION"
    error_id: ERR_ELECTION_REQUIRED
    http_status: 409
    applies_to: "POST /compliance/refund-obligations/{id}/initiate-settlement"
  - priority: 42
    category: state
    check: "POST /compliance/refund-obligations/{id}/void from settlement_status = SETTLED requires void_reason = SETTLEMENT_REVERSED; from UNSETTLED or FAILED requires void_reason != SETTLEMENT_REVERSED"
    error_id: ERR_OBLIGATION_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /compliance/refund-obligations/{id}/void"
  - priority: 43
    category: state
    check: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY on a segment already in status = DELAYED requires the new delay_minutes to be strictly greater than the stored delay_minutes"
    error_id: ERR_DELAY_NOT_WORSENED
    http_status: 409
    applies_to: "POST /compliance/flight-segments/{id}/declare-disruption"

  # ---- 45 cross-entity state ----
  - priority: 45
    category: state
    check: "POST /compliance/refund-obligations/{id}/initiate-settlement on an obligation with basis = FARE requires the referenced FlightSegment.status IN {CANCELLED, DISRUPTED_UNUSED} or (status = DELAYED and is_significant_delay = true) — a rescinded disruption blocks settlement of the obligation it produced"
    error_id: ERR_SOURCE_DISRUPTION_RESCINDED
    http_status: 409
    applies_to: "POST /compliance/refund-obligations/{id}/initiate-settlement"
  - priority: 46
    category: state
    check: "POST /compliance/regulator-reports/{id}/submit requires every ConsumerComplaint in the report's scope and period (per §1.3 regulator_report_metrics) to have status IN {ANSWERED, CLOSED}"
    error_id: ERR_OPEN_COMPLAINT_IN_PERIOD
    http_status: 409
    applies_to: "POST /compliance/regulator-reports/{id}/submit"
  - priority: 47
    category: state
    check: "POST /compliance/tarmac-delay-events/{id}/file-report requires the parent FlightSegment.status IN {DEPARTED, ARRIVED, CANCELLED} — a report cannot be filed while the flight is still SCHEDULED or DELAYED"
    error_id: ERR_SEGMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/tarmac-delay-events/{id}/file-report"

  # ---- 50 business_safety (regulatory) ----
  - priority: 50
    category: business_safety
    check: "Segregation of duties. On POST /compliance/refund-obligations/{id}/initiate-settlement, X-User-ID must differ from obligation.created_by_user_id. On POST /compliance/refund-obligations/{id}/complete-settlement, X-User-ID must differ from obligation.settlement_initiated_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance/refund-obligations/{id}/initiate-settlement, POST /compliance/refund-obligations/{id}/complete-settlement"
  - priority: 51
    category: business_safety
    check: "POST /compliance/refund-obligations/{id}/elect with election = TRAVEL_CREDIT issued by a ComplianceOfficer (not the Passenger) requires consent_complaint_id — an officer may never move a passenger onto travel credit without a recorded consent artifact"
    error_id: ERR_CREDIT_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/refund-obligations/{id}/elect"
  - priority: 52
    category: business_safety
    check: "POST /compliance/consumer-complaints/{id}/answer on a complaint with category = DISABILITY requires accessibility_resolution_code"
    error_id: ERR_ACCESSIBILITY_RESOLUTION_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/consumer-complaints/{id}/answer"
  - priority: 53
    category: business_safety
    check: "POST /compliance/denied-boarding-records/{id}/finalize on a record whose effective_category resolves to VOLUNTARY requires voluntary_agreed_amount_cents >= round_half_up(statutory_compensation_cents * VOLUNTARY_DISCLOSURE_FLOOR_PCT) (§1.3 denied_boarding_compensation)"
    error_id: ERR_VOLUNTARY_BELOW_DISCLOSURE_FLOOR
    http_status: 422
    applies_to: "POST /compliance/denied-boarding-records/{id}/finalize"
  - priority: 54
    category: business_safety
    check: "POST /compliance/tarmac-delay-events/{id}/file-report on an event with is_violation = true requires corrective_action_summary"
    error_id: ERR_CORRECTIVE_ACTION_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/tarmac-delay-events/{id}/file-report"

  # ---- 55 business_temporal ----
  - priority: 55
    category: business_temporal
    check: "POST /compliance/tarmac-delay-events requires tarmac_start_utc >= the parent FlightSegment.scheduled_departure_utc for phase = DEPARTURE, and tarmac_start_utc >= scheduled_departure_utc for phase = ARRIVAL as well; a start instant before the scheduled departure is never a tarmac occupation"
    error_id: ERR_TARMAC_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /compliance/tarmac-delay-events"
  - priority: 56
    category: business_temporal
    check: "POST /compliance/tarmac-delay-events/{id}/deplane requires deplane_completed_utc > event.tarmac_start_utc; POST /compliance/tarmac-delay-events/{id}/claim-exemption requires exemption_declared_at_utc > event.tarmac_start_utc"
    error_id: ERR_TARMAC_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /compliance/tarmac-delay-events/{id}/deplane, POST /compliance/tarmac-delay-events/{id}/claim-exemption"
  - priority: 57
    category: business_temporal
    check: "POST /compliance/tarmac-delay-events/{id}/claim-exemption requires floor((exemption_declared_at_utc - event.tarmac_start_utc)/60) <= deadline_minutes — an exemption cannot be invoked after the deplaning deadline has already elapsed"
    error_id: ERR_EXEMPTION_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /compliance/tarmac-delay-events/{id}/claim-exemption"
  - priority: 58
    category: business_temporal
    check: "POST /compliance/checked-bags/{id}/resolve requires delivered_at_utc >= bag.checked_at_utc (resolution = DELIVERED) and loss_declared_at_utc >= bag.checked_at_utc (resolution = DECLARED_LOST)"
    error_id: ERR_DELIVERY_BEFORE_CHECKIN
    http_status: 422
    applies_to: "POST /compliance/checked-bags/{id}/resolve"
  - priority: 59
    category: business_temporal
    check: "Complaint chronology: acknowledged_at_utc >= received_at_utc, requested_at_utc >= acknowledged_at_utc, answered_at_utc >= received_at_utc, reopened_at_utc >= answered_at_utc"
    error_id: ERR_ANSWER_BEFORE_RECEIPT
    http_status: 422
    applies_to: "POST /compliance/consumer-complaints/{id}/acknowledge, POST /compliance/consumer-complaints/{id}/request-info, POST /compliance/consumer-complaints/{id}/answer, POST /compliance/consumer-complaints/{id}/reopen"
  - priority: 60
    category: business_temporal
    check: "POST /compliance/regulator-reports requires period_start_utc < period_end_utc; POST /compliance/regulator-reports/{id}/submit requires submitted_at_utc >= report.period_end_utc; POST /compliance/regulator-reports/{id}/amend requires amended_at_utc >= report.submitted_at_utc"
    error_id: ERR_PERIOD_BOUNDS_INVALID
    http_status: 422
    applies_to: "POST /compliance/regulator-reports, POST /compliance/regulator-reports/{id}/submit, POST /compliance/regulator-reports/{id}/amend"
  - priority: 61
    category: business_temporal
    check: "POST /compliance/denied-boarding-records requires substitute_arrival_utc >= the referenced FlightSegment.scheduled_arrival_utc"
    error_id: ERR_SUBSTITUTE_BEFORE_SCHEDULED
    http_status: 422
    applies_to: "POST /compliance/denied-boarding-records"
  - priority: 62
    category: business_temporal
    check: "POST /compliance/flight-segments/{id}/declare-disruption with disruption_type = DELAY requires revised_arrival_utc > segment.scheduled_arrival_utc, and declared_at_utc >= segment.scheduled_departure_utc is NOT required (a disruption may be declared in advance)"
    error_id: ERR_REVISED_ARRIVAL_INVALID
    http_status: 422
    applies_to: "POST /compliance/flight-segments/{id}/declare-disruption"

  # ---- 65 business_constraint (uniqueness, overlap, limits) ----
  - priority: 65
    category: business_constraint
    check: "POST /compliance/tarmac-delay-events: the new event's interval must not overlap any existing TarmacDelayEvent on the same FlightSegment. Closed events occupy [tarmac_start_utc, interval_end_utc); a DELAY_ACTIVE event occupies [tarmac_start_utc, +infinity). Touching intervals (new start == existing interval_end_utc) are permitted."
    error_id: ERR_TARMAC_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/tarmac-delay-events"
  - priority: 66
    category: business_constraint
    check: "POST /compliance/regulator-reports: the new [period_start_utc, period_end_utc] closed interval must not intersect any existing RegulatorReport period for the same policy_profile_id. Sharing a single boundary instant IS an intersection, because both ends are inclusive."
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/regulator-reports"
  - priority: 67
    category: business_constraint
    check: "Uniqueness: PolicyProfile.carrier_code globally (ERR_DUPLICATE_CARRIER_CODE), Passenger.email globally (ERR_DUPLICATE_PASSENGER_EMAIL), Booking.record_locator globally (ERR_DUPLICATE_RECORD_LOCATOR), CheckedBag.tag_number globally (ERR_DUPLICATE_TAG_NUMBER), FlightSegment.sequence_index within a booking (ERR_DUPLICATE_SEQUENCE_INDEX)"
    error_id: "ERR_DUPLICATE_CARRIER_CODE | ERR_DUPLICATE_PASSENGER_EMAIL | ERR_DUPLICATE_RECORD_LOCATOR | ERR_DUPLICATE_TAG_NUMBER | ERR_DUPLICATE_SEQUENCE_INDEX"
    http_status: 409
    applies_to: "POST /compliance/policy-profiles, POST /compliance/passengers, POST /compliance/bookings, POST /compliance/checked-bags, POST /compliance/bookings/{id}/flight-segments"
  - priority: 68
    category: business_constraint
    check: "POST /compliance/refund-obligations: at most one non-VOIDED RefundObligation may exist per (basis, source row) pair — per flight_segment_id for basis = FARE, per checked_bag_id for BAGGAGE_FEE, per ancillary_purchase_id for ANCILLARY, per denied_boarding_record_id for DENIED_BOARDING, and per answering complaint for GOODWILL_GRANT"
    error_id: ERR_DUPLICATE_OBLIGATION_FOR_SOURCE
    http_status: 409
    applies_to: "POST /compliance/refund-obligations, POST /compliance/consumer-complaints/{id}/answer"
  - priority: 69
    category: business_constraint
    check: "POST /compliance/consumer-complaints/{id}/reopen requires complaint.reopen_count < REOPEN_LIMIT (§1.3 compliance_sweep_recount constants)"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /compliance/consumer-complaints/{id}/reopen"

  # ---- 75 business_referential ----
  - priority: 75
    category: business_referential
    check: "POST /compliance/ancillary-purchases, POST /compliance/denied-boarding-records and POST /compliance/refund-obligations: when flight_segment_id is supplied, the referenced FlightSegment.booking_id must equal the supplied booking_id"
    error_id: ERR_SEGMENT_BOOKING_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/ancillary-purchases, POST /compliance/denied-boarding-records, POST /compliance/refund-obligations"
  - priority: 76
    category: business_referential
    check: "POST /compliance/refund-obligations: exactly one source FK matching the declared basis must be supplied and the others omitted (FARE -> flight_segment_id, BAGGAGE_FEE -> checked_bag_id, ANCILLARY -> ancillary_purchase_id, DENIED_BOARDING -> denied_boarding_record_id, GOODWILL_GRANT -> none), and the supplied source row's booking_id must equal the request's booking_id"
    error_id: ERR_BASIS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/refund-obligations"
  - priority: 77
    category: business_referential
    check: "POST /compliance/refund-obligations/{id}/elect: when consent_complaint_id is supplied, the referenced ConsumerComplaint.booking_id must equal the obligation's booking_id"
    error_id: ERR_CONSENT_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/refund-obligations/{id}/elect"

  # ---- 80 business_fiscal (money last) ----
  - priority: 80
    category: business_fiscal
    check: "POST /compliance/refund-obligations with issuance_mode resolved to PROACTIVE requires headroom_at_creation_cents > 0 (§1.3 booking_refund_headroom step 3)"
    error_id: ERR_NO_REFUND_HEADROOM
    http_status: 422
    applies_to: "POST /compliance/refund-obligations"
  - priority: 81
    category: business_fiscal
    check: "POST /compliance/refund-obligations with issuance_mode resolved to REQUEST_BASED requires gross_entitlement_cents <= headroom_at_creation_cents; a request-based claim is rejected rather than clamped (§1.3 booking_refund_headroom step 3)"
    error_id: ERR_REFUND_EXCEEDS_HEADROOM
    http_status: 422
    applies_to: "POST /compliance/refund-obligations, POST /compliance/consumer-complaints/{id}/answer"

endpoints:
  # ============================ READS (19) ============================
  - method: GET
    path: "/compliance/policy-profiles/{id}"
    description: "Read one carrier compliance policy profile, including its computed report_count and open_violation_count."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor]
    code: 200
    input: []
    output: PolicyProfile
    side_effects: []
  - method: GET
    path: "/compliance/policy-profiles/{id}/regulator-reports"
    description: "List the regulator reports filed under one policy profile, newest period first."
    roles: [ComplianceAdmin, RegulatorAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RegulatorReport[]
    side_effects: []
  - method: GET
    path: "/compliance/passengers/{id}"
    description: "Read one passenger, including the computed travel_credit_balance_cents and open_complaint_count."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: Passenger
    side_effects: []
  - method: GET
    path: "/compliance/bookings"
    description: "List bookings, filterable by passenger, policy profile and disruption posture. A Passenger caller sees only their own bookings."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor, Passenger]
    code: 200
    input: ["passenger_id?", "policy_profile_id?", "disruption_posture?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/compliance/bookings/{id}"
    description: "Read one booking with its computed ledger fields (collected_total_cents, total_refund_obligated_cents, earliest_refund_deadline_utc, disruption_posture, segment_count, unused_segment_count, travel_commenced, suppressed_obligation_count) and its version for OCC."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/compliance/bookings/{id}/flight-segments"
    description: "List the flight segments of one booking in sequence_index ASC order."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor, Passenger]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FlightSegment[]
    side_effects: []
  - method: GET
    path: "/compliance/bookings/{id}/checked-bags"
    description: "List the checked bags of one booking in created_at ASC order."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CheckedBag[]
    side_effects: []
  - method: GET
    path: "/compliance/bookings/{id}/consumer-complaints"
    description: "List the consumer complaints filed against one booking in received_at_utc ASC order."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: ConsumerComplaint[]
    side_effects: []
  - method: GET
    path: "/compliance/bookings/{id}/refund-exposure"
    description: "Computed read: evaluates BOTH variants of §1.3 fare_refund_entitlement against the booking's current state without persisting anything, so an officer can compare proactive full-itinerary value against request-based proration before minting an obligation."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor]
    code: 200
    input: []
    output: "{ booking_id: string, proactive_full_itinerary_cents: integer, request_based_proration_cents: integer, variant_delta_cents: integer, obligated_total_cents: integer, remaining_headroom_cents: integer, collected_total_cents: integer, segment_count: integer, unused_segment_count: integer, travel_commenced: boolean }"
    side_effects: []
  - method: GET
    path: "/compliance/flight-segments/{id}"
    description: "Read one flight segment, including delay_minutes, is_significant_delay, cumulative_tarmac_minutes and exempted_tarmac_event_count."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: FlightSegment
    side_effects: []
  - method: GET
    path: "/compliance/flight-segments/{id}/tarmac-delay-events"
    description: "List the tarmac delay events recorded on one flight segment in tarmac_start_utc ASC order."
    roles: [ComplianceAdmin, OpsController, RegulatorAuditor]
    code: 200
    input: ["status?", "phase?", "limit?", "offset?"]
    output: TarmacDelayEvent[]
    side_effects: []
  - method: GET
    path: "/compliance/ancillary-purchases"
    description: "List ancillary service purchases, filterable by booking, segment, service type and delivery status."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: ["booking_id?", "flight_segment_id?", "service_type?", "delivery_status?", "limit?", "offset?"]
    output: AncillaryPurchase[]
    side_effects: []
  - method: GET
    path: "/compliance/ancillary-purchases/{id}"
    description: "Read one ancillary service purchase."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: AncillaryPurchase
    side_effects: []
  - method: GET
    path: "/compliance/denied-boarding-records"
    description: "List denied boarding records, filterable by booking, segment, declared category and status."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor]
    code: 200
    input: ["booking_id?", "flight_segment_id?", "category?", "status?", "limit?", "offset?"]
    output: DeniedBoardingRecord[]
    side_effects: []
  - method: GET
    path: "/compliance/denied-boarding-records/{id}"
    description: "Read one denied boarding record, including statutory_compensation_cents, compensation_cents and effective_category."
    roles: [ComplianceAdmin, ComplianceOfficer, OpsController, RegulatorAuditor]
    code: 200
    input: []
    output: DeniedBoardingRecord
    side_effects: []
  - method: GET
    path: "/compliance/refund-obligations"
    description: "List refund obligations, filterable by booking, by any of the four basis-source foreign keys, and by basis, issuance mode, election status and settlement status. This is the only discovery channel for obligations minted by a cascade rather than by a direct create."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: ["booking_id?", "flight_segment_id?", "checked_bag_id?", "ancillary_purchase_id?", "denied_boarding_record_id?", "basis?", "issuance_mode?", "election_status?", "settlement_status?", "limit?", "offset?"]
    output: RefundObligation[]
    side_effects: []
  - method: GET
    path: "/compliance/refund-obligations/{id}"
    description: "Read one refund obligation with both status axes, the amount trail (gross_entitlement_cents, headroom_at_creation_cents, amount_cents, credit_bonus_cents, payable_total_cents) and both deadlines."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: RefundObligation
    side_effects: []
  - method: GET
    path: "/compliance/consumer-complaints/{id}"
    description: "Read one consumer complaint with its deadlines, breach flags and disposition."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor, Passenger]
    code: 200
    input: []
    output: ConsumerComplaint
    side_effects: []
  - method: GET
    path: "/compliance/consumer-complaints/{id}/activities"
    description: "List the append-only activity log of one complaint in occurred_at_utc ASC order, tie-broken by created_at ASC."
    roles: [ComplianceAdmin, ComplianceOfficer, RegulatorAuditor]
    code: 200
    input: ["activity_type?", "limit?", "offset?"]
    output: ComplaintActivity[]
    side_effects: []

  # ============================ WRITES (31) ============================
  - method: POST
    path: "/compliance/policy-profiles"
    description: "Create a carrier compliance policy profile. Every threshold and deadline used by §1.3 lives here; omitted fields take the regulatory defaults declared in §1.1."
    roles: [ComplianceAdmin]
    code: 201
    input: [carrier_code, "domestic_significant_delay_minutes?", "international_significant_delay_minutes?", "credit_card_refund_deadline_days?", "other_method_refund_deadline_days?", "bag_delay_threshold_hours_domestic?", "bag_delay_threshold_hours_international?", "tarmac_deplane_deadline_minutes_domestic?", "tarmac_deplane_deadline_minutes_international?", "complaint_ack_deadline_days?", "complaint_answer_deadline_days_general?", "complaint_answer_deadline_days_disability?", "travel_credit_default_permitted?", "travel_credit_election_bonus_pct?"]
    output: PolicyProfile
    side_effects: ["report_count = 0, open_violation_count = 0, version = 1"]
  - method: POST
    path: "/compliance/passengers"
    description: "Register a passenger. X-User-ID for the Passenger role equals the id returned here."
    roles: [ComplianceAdmin, ComplianceOfficer]
    code: 201
    input: [email, full_name, "requires_disability_assistance?"]
    output: Passenger
    side_effects: ["travel_credit_balance_cents = 0, open_complaint_count = 0, version = 1"]
  - method: POST
    path: "/compliance/bookings"
    description: "Create a booking (ticketed itinerary) for a passenger under one policy profile. Segments, bags and ancillaries are added afterwards."
    roles: [ComplianceAdmin, ComplianceOfficer]
    code: 201
    input: [passenger_id, policy_profile_id, record_locator, total_fare_cents, payment_method]
    output: Booking
    side_effects:
      - "itinerary_scope = DOMESTIC, collected_total_cents = total_fare_cents, total_refund_obligated_cents = 0, earliest_refund_deadline_utc = null, disruption_posture = NORMAL, segment_count = 0, unused_segment_count = 0, travel_commenced = false, suppressed_obligation_count = 0, version = 1"
  - method: POST
    path: "/compliance/bookings/{id}/flight-segments"
    description: "Add a flight segment to a booking at an explicit sequence_index."
    roles: [ComplianceAdmin, OpsController]
    code: 201
    input: [sequence_index, flight_number, origin_iata, destination_iata, is_international, scheduled_departure_utc, scheduled_arrival_utc, segment_fare_cents]
    output: FlightSegment
    side_effects:
      - "status = SCHEDULED, disruption_type = NONE, delay_minutes = 0, is_significant_delay = false, cumulative_tarmac_minutes = 0, exempted_tarmac_event_count = 0, version = 1"
      - "recomputes booking.segment_count, booking.unused_segment_count and booking.itinerary_scope per §1.3 booking_ledger_recompute; increments Booking.version by 1"
  - method: POST
    path: "/compliance/flight-segments/{id}/declare-disruption"
    description: "Declare a cancellation or a delay on a segment. A CANCELLATION fires the depth-4 cascade in §1.2 FlightSegment SCHEDULED -> CANCELLED; a DELAY that reaches the scope threshold mints a proactive fare obligation."
    roles: [OpsController, ComplianceAdmin]
    code: 200
    input: [disruption_type, declared_at_utc, "revised_arrival_utc?"]
    output: FlightSegment
    side_effects:
      - "applies §1.3 significant_delay_determination"
      - "runs the §1.2 FlightSegment cancellation or delay cascade, including §1.3 fare_refund_entitlement, §1.3 booking_refund_headroom, §1.3 refund_deadline_resolution and §1.3 booking_ledger_recompute"
      - "increments Booking.version by 1"
  - method: POST
    path: "/compliance/flight-segments/{id}/record-operation"
    description: "Record an operational event on a segment: DEPARTED, ARRIVED, or RESTORED (walk back a previously declared delay)."
    roles: [OpsController, ComplianceAdmin]
    code: 200
    input: [operation, occurred_at_utc]
    output: FlightSegment
    side_effects:
      - "DEPARTED sets booking.travel_commenced = true; ARRIVED bubbles PENDING_DELIVERY ancillaries of this segment to DELIVERED; RESTORED clears the delay fields"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/ancillary-purchases"
    description: "Record a paid ancillary service (seat selection, wifi, entertainment, priority boarding, lounge access) attached to a booking and a segment."
    roles: [ComplianceAdmin, ComplianceOfficer]
    code: 201
    input: [booking_id, flight_segment_id, service_type, amount_cents]
    output: AncillaryPurchase
    side_effects:
      - "delivery_status = PENDING_DELIVERY, refund_obligation_created = false, version = 1"
      - "recomputes booking.collected_total_cents per §1.3 booking_ledger_recompute; increments Booking.version by 1"
  - method: POST
    path: "/compliance/ancillary-purchases/{id}/mark-not-provided"
    description: "Record that a paid ancillary service was not delivered, which mints a proactive face-value refund obligation."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [non_provision_reason, occurred_at_utc]
    output: AncillaryPurchase
    side_effects:
      - "delivery_status = NOT_PROVIDED, non_provision_reason set, refund_obligation_created = true, version += 1"
      - "creates a RefundObligation (basis ANCILLARY, PROACTIVE, variant FEE_FACE_VALUE) per §1.3 non_fare_refund_entitlement clamped by §1.3 booking_refund_headroom, with obligation_start_utc = occurred_at_utc"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/checked-bags"
    description: "Record a checked bag and the fee collected for it, with the promised delivery instant."
    roles: [ComplianceAdmin, ComplianceOfficer]
    code: 201
    input: [booking_id, tag_number, fee_cents, checked_at_utc, scheduled_delivery_utc]
    output: CheckedBag
    side_effects:
      - "status = IN_TRANSIT, delivery_delay_hours = 0, fee_refund_obligated = false, version = 1"
      - "recomputes booking.collected_total_cents per §1.3 booking_ledger_recompute; increments Booking.version by 1"
  - method: POST
    path: "/compliance/checked-bags/{id}/resolve"
    description: "Close out a checked bag as DELIVERED (with the actual delivery instant) or DECLARED_LOST. A late delivery fires the depth-3 cascade in §1.2 CheckedBag IN_TRANSIT -> DELIVERED_LATE."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [resolution, "delivered_at_utc?", "loss_declared_at_utc?"]
    output: CheckedBag
    side_effects:
      - "applies §1.3 baggage_delivery_delay; sets status, delivery_delay_hours and fee_refund_obligated"
      - "when fee_refund_obligated becomes true, creates a RefundObligation (basis BAGGAGE_FEE, PROACTIVE, variant FEE_FACE_VALUE) with obligation_start_utc = delivered_at_utc"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/denied-boarding-records"
    description: "Record a denied boarding event, declaring it VOLUNTARY or INVOLUNTARY together with the oversale confirmation, the written-disclosure flag, the one-way fare and the substitute arrival instant."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 201
    input: [booking_id, flight_segment_id, category, oversale_confirmed, written_disclosure_provided, one_way_fare_cents, substitute_arrival_utc, "voluntary_agreed_amount_cents?"]
    output: DeniedBoardingRecord
    side_effects:
      - "status = RECORDED, substitute_delay_minutes computed per §1.3 denied_boarding_compensation, statutory_compensation_cents = 0, compensation_cents = 0, effective_category = null, version = 1"
  - method: POST
    path: "/compliance/denied-boarding-records/{id}/finalize"
    description: "Finalize a denied boarding record: resolves effective_category, evaluates the statutory ladder and mints the compensation obligation."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [finalized_at_utc]
    output: DeniedBoardingRecord
    side_effects:
      - "applies §1.3 denied_boarding_compensation; sets statutory_compensation_cents, effective_category, compensation_cents, finalized_at_utc and status (FINALIZED when the declared and effective categories agree, RECATEGORIZED when they differ)"
      - "creates a RefundObligation (basis DENIED_BOARDING, PROACTIVE, variant INVOLUNTARY_STATUTORY or VOLUNTARY_NEGOTIATED) with obligation_start_utc = finalized_at_utc, exempt from §1.3 booking_refund_headroom"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/tarmac-delay-events"
    description: "Open a tarmac delay occupation on a flight segment. The new interval must not collide with any existing event on the same segment."
    roles: [OpsController, ComplianceAdmin]
    code: 201
    input: [flight_segment_id, tarmac_start_utc, phase]
    output: TarmacDelayEvent
    side_effects:
      - "status = DELAY_ACTIVE, interval_end_utc = null, tarmac_minutes = 0, deadline_minutes resolved from the segment's is_international and the booking's PolicyProfile, is_violation = false, version = 1"
  - method: POST
    path: "/compliance/tarmac-delay-events/{id}/deplane"
    description: "Close a tarmac delay by deplaning passengers. Evaluates the deplaning deadline with a strict `>` comparison."
    roles: [OpsController, ComplianceAdmin]
    code: 200
    input: [deplane_completed_utc]
    output: TarmacDelayEvent
    side_effects:
      - "status = DEPLANED, interval_end_utc = deplane_completed_utc, applies §1.3 tarmac_compliance_evaluation to set tarmac_minutes and is_violation"
      - "recomputes FlightSegment.cumulative_tarmac_minutes and increments FlightSegment.version by 1"
  - method: POST
    path: "/compliance/tarmac-delay-events/{id}/claim-exemption"
    description: "Close a tarmac delay by invoking a safety, security or ATC exemption. The exemption must be declared at or before the deplaning deadline."
    roles: [OpsController, ComplianceAdmin]
    code: 200
    input: [exemption_reason, exemption_declared_at_utc]
    output: TarmacDelayEvent
    side_effects:
      - "status = EXEMPTION_INVOKED, interval_end_utc = exemption_declared_at_utc, exemption_reason and exemption_declared_at_utc set, is_violation = false regardless of tarmac_minutes"
      - "recomputes FlightSegment.cumulative_tarmac_minutes and exempted_tarmac_event_count; increments FlightSegment.version by 1"
  - method: POST
    path: "/compliance/tarmac-delay-events/{id}/file-report"
    description: "File the contingency-plan report for a closed tarmac delay event. A violating event requires a corrective_action_summary."
    roles: [ComplianceAdmin]
    code: 200
    input: [report_reference, filed_at_utc, "corrective_action_summary?"]
    output: TarmacDelayEvent
    side_effects: ["status = REPORT_FILED, report_reference, report_filed_at_utc and corrective_action_summary set, version += 1"]
  - method: POST
    path: "/compliance/refund-obligations"
    description: "Mint a refund obligation against a booking. issuance_mode = PROACTIVE values the whole remaining itinerary and is clamped to the remaining headroom; issuance_mode = REQUEST_BASED prorates by unused segments and is rejected when it exceeds the headroom. Requires the booking's observed version for OCC."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 201
    input: [booking_id, basis, issuance_mode, expected_booking_version, "flight_segment_id?", "checked_bag_id?", "ancillary_purchase_id?", "denied_boarding_record_id?"]
    output: RefundObligation
    side_effects:
      - "applies §1.3 fare_refund_entitlement or §1.3 non_fare_refund_entitlement, then §1.3 booking_refund_headroom, then §1.3 refund_deadline_resolution"
      - "election_status = PENDING_ELECTION, settlement_status = UNSETTLED, settlement_attempt_count = 0, credit_bonus_cents = 0, payable_total_cents = amount_cents, created_by_user_id = X-User-ID, version = 1"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/refund-obligations/{id}/elect"
    description: "Elect cash or travel credit for a pending obligation. A ComplianceOfficer electing travel credit on the passenger's behalf must cite a consent complaint; travel credit is never the automatic default."
    roles: [Passenger, ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [election, "consent_complaint_id?"]
    output: RefundObligation
    side_effects:
      - "applies §1.3 settlement_method_resolution and, for TRAVEL_CREDIT, §1.3 travel_credit_bonus"
      - "election_status, election_source, settlement_method, credit_bonus_cents, payable_total_cents and credit_consent_reference set; version += 1"
  - method: POST
    path: "/compliance/refund-obligations/{id}/initiate-settlement"
    description: "Initiate money movement for an elected obligation. The officer who created the obligation may not initiate it, and a fare obligation whose source disruption was rescinded is blocked."
    roles: [ComplianceOfficer]
    code: 200
    input: [processor_reference]
    output: RefundObligation
    side_effects: ["settlement_status = INITIATED, settlement_attempt_count += 1, settlement_initiated_at_utc = the logical clock's current instant, settlement_initiated_by_user_id = X-User-ID, version += 1"]
  - method: POST
    path: "/compliance/refund-obligations/{id}/complete-settlement"
    description: "Report the processor outcome for an in-flight settlement. The officer who initiated it may not complete it. A SUCCEEDED credit settlement posts the payable total to the passenger's travel-credit balance."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [outcome, "failure_reason?"]
    output: RefundObligation
    side_effects:
      - "SUCCEEDED: settlement_status = SETTLED, settled_at_utc set; when settlement_method = TRAVEL_CREDIT, Passenger.travel_credit_balance_cents += payable_total_cents and Passenger.version += 1 (§1.3 travel_credit_conservation)"
      - "FAILED: settlement_status = FAILED, last_failure_reason set, settlement_initiated_by_user_id cleared"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/refund-obligations/{id}/void"
    description: "Void an obligation. From UNSETTLED or FAILED the reason must be CREATED_IN_ERROR, DUPLICATE or PASSENGER_WITHDREW; from SETTLED only SETTLEMENT_REVERSED is accepted, which also claws back any credit posted."
    roles: [ComplianceAdmin]
    code: 200
    input: [void_reason]
    output: RefundObligation
    side_effects:
      - "settlement_status = VOIDED, void_reason set, version += 1"
      - "restores §1.3 obligated_cents_conservation and, on SETTLEMENT_REVERSED of a credit settlement, §1.3 travel_credit_conservation"
      - "CREATED_IN_ERROR on an ANCILLARY obligation returns the AncillaryPurchase to PENDING_DELIVERY; a BAGGAGE_FEE obligation clears CheckedBag.fee_refund_obligated"
      - "recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
  - method: POST
    path: "/compliance/consumer-complaints"
    description: "File a consumer complaint against a booking. DISABILITY complaints get the short answer deadline. A Passenger may file only on their own booking."
    roles: [Passenger, ComplianceOfficer, ComplianceAdmin]
    code: 201
    input: [booking_id, category, channel, received_at_utc, summary]
    output: ConsumerComplaint
    side_effects:
      - "status = RECEIVED, ack_due_utc and answer_due_utc per §1.3 complaint_deadline_resolution, info_requested_count = 0, reopen_count = 0, ack_breached = false, answer_breached = false, version = 1"
      - "appends a ComplaintActivity row with activity_type = RECEIVED"
      - "recomputes Passenger.open_complaint_count and increments Passenger.version by 1"
  - method: POST
    path: "/compliance/consumer-complaints/{id}/acknowledge"
    description: "Acknowledge receipt of a complaint within the acknowledgement deadline."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [acknowledged_at_utc]
    output: ConsumerComplaint
    side_effects: ["status = ACKNOWLEDGED, acknowledged_at_utc set, version += 1", "appends a ComplaintActivity row with activity_type = ACKNOWLEDGED"]
  - method: POST
    path: "/compliance/consumer-complaints/{id}/request-info"
    description: "Ask the complainant for more information. Does not extend answer_due_utc."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [info_request_note, requested_at_utc]
    output: ConsumerComplaint
    side_effects: ["status = INFO_REQUESTED, info_requested_count += 1, answer_due_utc unchanged, version += 1", "appends a ComplaintActivity row with activity_type = INFO_REQUESTED"]
  - method: POST
    path: "/compliance/consumer-complaints/{id}/answer"
    description: "Answer a complaint with a disposition. A DISABILITY complaint requires an accessibility resolution code; a REFUND_GRANTED disposition mints a goodwill-grant refund obligation."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [disposition, answered_at_utc, "accessibility_resolution_code?", "granted_amount_cents?"]
    output: ConsumerComplaint
    side_effects:
      - "status = ANSWERED, disposition, answered_at_utc, accessibility_resolution_code and granted_amount_cents set, version += 1"
      - "appends a ComplaintActivity row with activity_type = ANSWERED"
      - "REFUND_GRANTED creates a RefundObligation (basis GOODWILL_GRANT, REQUEST_BASED, variant GOODWILL_GRANT_AMOUNT) per §1.3 non_fare_refund_entitlement and §1.3 booking_refund_headroom, then recomputes §1.3 booking_ledger_recompute and increments Booking.version by 1"
      - "recomputes Passenger.open_complaint_count and increments Passenger.version by 1"
  - method: POST
    path: "/compliance/consumer-complaints/{id}/reopen"
    description: "Reopen an answered complaint, resetting the answer deadline from the reopen instant. Capped at REOPEN_LIMIT reopens."
    roles: [ComplianceOfficer, ComplianceAdmin]
    code: 200
    input: [reopen_reason, reopened_at_utc]
    output: ConsumerComplaint
    side_effects:
      - "status = ACKNOWLEDGED, reopen_count += 1, answer_due_utc re-derived per §1.3 complaint_deadline_resolution, answer_breached = false, version += 1"
      - "appends a ComplaintActivity row with activity_type = REOPENED"
      - "recomputes Passenger.open_complaint_count and increments Passenger.version by 1"
  - method: POST
    path: "/compliance/regulator-reports"
    description: "Open a draft regulator report for a closed reporting period on one policy profile. Requires the profile's observed version for OCC; periods may not overlap, and both period bounds are inclusive."
    roles: [ComplianceAdmin]
    code: 201
    input: [policy_profile_id, period_start_utc, period_end_utc, expected_policy_profile_version]
    output: RegulatorReport
    side_effects:
      - "status = DRAFT, all seven metrics = 0, policy_version_pinned = 0 (the declared default; the real profile version is pinned at submit), amendment_count = 0, version = 1"
      - "increments PolicyProfile.report_count and PolicyProfile.version by 1"
  - method: POST
    path: "/compliance/regulator-reports/{id}/submit"
    description: "Freeze and submit the report. Blocked while any complaint in the period is still open."
    roles: [ComplianceAdmin]
    code: 200
    input: [submitted_at_utc]
    output: RegulatorReport
    side_effects: ["applies §1.3 regulator_report_metrics, freezing all seven metrics and policy_version_pinned", "status = SUBMITTED, submitted_at_utc and submitted_by_user_id set, version += 1"]
  - method: POST
    path: "/compliance/regulator-reports/{id}/amend"
    description: "Reopen a submitted report for amendment. Metrics stay frozen until the next submit refreezes them."
    roles: [ComplianceAdmin]
    code: 200
    input: [amendment_reason, amended_at_utc]
    output: RegulatorReport
    side_effects: ["status = AMENDING, amendment_count += 1, amendment_reason set, version += 1"]
  - method: POST
    path: "/compliance/compliance-sweeps"
    description: "Run the compliance sweep for one policy profile: flag breached refund deadlines, auto-default pending elections to cash (never to travel credit), flag complaint deadline breaches, auto-close long-answered complaints and roll up the profile's open_violation_count. Idempotent at a fixed clock instant."
    roles: [ComplianceAdmin]
    code: 200
    input: [policy_profile_id]
    output: "{ policy_profile_id: string, deadline_breach_flagged_count: integer, election_auto_defaulted_count: integer, complaint_ack_breach_flagged_count: integer, complaint_answer_breach_flagged_count: integer, complaint_auto_closed_count: integer, open_violation_count: integer, policy_profile_version: integer }"
    side_effects:
      - "applies §1.3 compliance_sweep_recount in its five pinned phases"
      - "increments PolicyProfile.version by 1 when open_violation_count changes value; increments the version of every RefundObligation and ConsumerComplaint it mutates"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to an explicit instant, so deadline, election-window, auto-close and breach rules are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); the server never falls back to real wall-clock time."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; all subsequent deadline, breach, election-window and auto-close evaluations read this instant"]

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the five roles declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's X-User-Role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Passenger caller addressed a passenger, booking, obligation or complaint that does not belong to X-User-ID"
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown field, wrong JSON type, enum value outside the declared set, negative cent amount, malformed ISO-8601 datetime, malformed carrier_code / record_locator / tag_number / email, sequence_index < 1, or a conditionally required field absent (resolution-specific bag timestamps, DELAY without revised_arrival_utc)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset < 0 on a list endpoint"
  # ---- existence ----
  - id: ERR_POLICY_PROFILE_NOT_FOUND
    http: 404
    condition: "A PolicyProfile id in the path or body does not resolve"
  - id: ERR_PASSENGER_NOT_FOUND
    http: 404
    condition: "A Passenger id in the path or body does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "A Booking id in the path or body does not resolve"
  - id: ERR_FLIGHT_SEGMENT_NOT_FOUND
    http: 404
    condition: "A FlightSegment id in the path or body does not resolve"
  - id: ERR_ANCILLARY_PURCHASE_NOT_FOUND
    http: 404
    condition: "An AncillaryPurchase id in the path or body does not resolve"
  - id: ERR_CHECKED_BAG_NOT_FOUND
    http: 404
    condition: "A CheckedBag id in the path or body does not resolve"
  - id: ERR_DENIED_BOARDING_RECORD_NOT_FOUND
    http: 404
    condition: "A DeniedBoardingRecord id in the path or body does not resolve"
  - id: ERR_TARMAC_DELAY_EVENT_NOT_FOUND
    http: 404
    condition: "A TarmacDelayEvent id in the path does not resolve"
  - id: ERR_REFUND_OBLIGATION_NOT_FOUND
    http: 404
    condition: "A RefundObligation id in the path does not resolve"
  - id: ERR_CONSUMER_COMPLAINT_NOT_FOUND
    http: 404
    condition: "A ConsumerComplaint id in the path or body (consent_complaint_id) does not resolve"
  - id: ERR_REGULATOR_REPORT_NOT_FOUND
    http: 404
    condition: "A RegulatorReport id in the path does not resolve"
  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version on POST /compliance/refund-obligations does not equal the current Booking.version"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_profile_version on POST /compliance/regulator-reports does not equal the current PolicyProfile.version"
  # ---- state of the addressed resource ----
  - id: ERR_SEGMENT_STATE_INVALID
    http: 409
    condition: "The FlightSegment is not in a state from which the requested disruption or operation transition exists (e.g. declare-disruption on a CANCELLED or ARRIVED segment, ARRIVED operation on a segment that has not DEPARTED, RESTORED on a segment that is not DELAYED), or file-report was called while the parent segment is still SCHEDULED or DELAYED"
  - id: ERR_DELAY_NOT_WORSENED
    http: 409
    condition: "declare-disruption with disruption_type = DELAY on an already DELAYED segment supplied a revised_arrival_utc that is not strictly later than the stored one"
  - id: ERR_ANCILLARY_STATE_INVALID
    http: 409
    condition: "mark-not-provided called on an AncillaryPurchase whose delivery_status is not PENDING_DELIVERY"
  - id: ERR_BAG_STATE_INVALID
    http: 409
    condition: "resolve called on a CheckedBag whose status is not IN_TRANSIT"
  - id: ERR_DENIED_BOARDING_STATE_INVALID
    http: 409
    condition: "finalize called on a DeniedBoardingRecord whose status is not RECORDED"
  - id: ERR_TARMAC_EVENT_STATE_INVALID
    http: 409
    condition: "deplane or claim-exemption called on an event that is not DELAY_ACTIVE, or file-report called on an event that is not DEPLANED or EXEMPTION_INVOKED"
  - id: ERR_OBLIGATION_STATE_INVALID
    http: 409
    condition: "elect called on an obligation whose election_status is not PENDING_ELECTION or whose settlement_status is not UNSETTLED; initiate-settlement called on an obligation whose settlement_status is not UNSETTLED or FAILED; complete-settlement called on an obligation whose settlement_status is not INITIATED"
  - id: ERR_ELECTION_REQUIRED
    http: 409
    condition: "initiate-settlement called on an obligation still in election_status = PENDING_ELECTION"
  - id: ERR_OBLIGATION_NOT_VOIDABLE
    http: 409
    condition: "void called with void_reason = SETTLEMENT_REVERSED on a non-SETTLED obligation, or with any other reason on a SETTLED obligation, or on an already VOIDED obligation"
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "acknowledge on a complaint that is not RECEIVED, request-info on one that is not ACKNOWLEDGED, answer on one that is neither ACKNOWLEDGED nor INFO_REQUESTED, or reopen on one that is not ANSWERED"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "submit on a report that is not DRAFT or AMENDING, or amend on a report that is not SUBMITTED"
  # ---- cross-entity state ----
  - id: ERR_SOURCE_DISRUPTION_RESCINDED
    http: 409
    condition: "initiate-settlement on a basis = FARE obligation whose referenced FlightSegment is no longer CANCELLED, DISRUPTED_UNUSED, or significantly DELAYED"
  - id: ERR_OPEN_COMPLAINT_IN_PERIOD
    http: 409
    condition: "submit on a report whose scope and period still contain a ConsumerComplaint with status NOT IN {ANSWERED, CLOSED}"
  # ---- business safety / regulatory ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals obligation.created_by_user_id on initiate-settlement, or equals obligation.settlement_initiated_by_user_id on complete-settlement"
  - id: ERR_CREDIT_CONSENT_REQUIRED
    http: 422
    condition: "A ComplianceOfficer or ComplianceAdmin elected TRAVEL_CREDIT without supplying consent_complaint_id"
  - id: ERR_ACCESSIBILITY_RESOLUTION_REQUIRED
    http: 422
    condition: "answer on a complaint with category = DISABILITY without accessibility_resolution_code"
  - id: ERR_VOLUNTARY_BELOW_DISCLOSURE_FLOOR
    http: 422
    condition: "finalize on a record whose effective_category resolves to VOLUNTARY with voluntary_agreed_amount_cents below 50% of the statutory ladder amount"
  - id: ERR_CORRECTIVE_ACTION_REQUIRED
    http: 422
    condition: "file-report on a tarmac event with is_violation = true without corrective_action_summary"
  # ---- business temporal ----
  - id: ERR_TARMAC_WINDOW_INVALID
    http: 422
    condition: "tarmac_start_utc earlier than the segment's scheduled_departure_utc, or a deplane/exemption instant not strictly after tarmac_start_utc"
  - id: ERR_EXEMPTION_AFTER_DEADLINE
    http: 422
    condition: "claim-exemption whose exemption_declared_at_utc sits more than deadline_minutes after tarmac_start_utc"
  - id: ERR_DELIVERY_BEFORE_CHECKIN
    http: 422
    condition: "resolve with delivered_at_utc or loss_declared_at_utc earlier than the bag's checked_at_utc"
  - id: ERR_ANSWER_BEFORE_RECEIPT
    http: 422
    condition: "A complaint timestamp violates the chronology acknowledged_at_utc >= received_at_utc >= ..., requested_at_utc >= acknowledged_at_utc, answered_at_utc >= received_at_utc, or reopened_at_utc >= answered_at_utc"
  - id: ERR_PERIOD_BOUNDS_INVALID
    http: 422
    condition: "period_start_utc >= period_end_utc on report creation, submitted_at_utc earlier than period_end_utc on submit, or amended_at_utc earlier than submitted_at_utc on amend"
  - id: ERR_SUBSTITUTE_BEFORE_SCHEDULED
    http: 422
    condition: "substitute_arrival_utc earlier than the referenced FlightSegment.scheduled_arrival_utc"
  - id: ERR_REVISED_ARRIVAL_INVALID
    http: 422
    condition: "declare-disruption with disruption_type = DELAY whose revised_arrival_utc is not strictly after the segment's scheduled_arrival_utc"
  # ---- business constraint (uniqueness, overlap, limits) ----
  - id: ERR_TARMAC_INTERVAL_OVERLAP
    http: 409
    condition: "The new tarmac interval intersects an existing event's [tarmac_start_utc, interval_end_utc) occupation on the same segment, or any DELAY_ACTIVE event's open-ended occupation"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "The new report's inclusive [period_start_utc, period_end_utc] interval intersects an existing report period for the same policy profile, including sharing a single boundary instant"
  - id: ERR_DUPLICATE_CARRIER_CODE
    http: 409
    condition: "A PolicyProfile with the same carrier_code already exists"
  - id: ERR_DUPLICATE_PASSENGER_EMAIL
    http: 409
    condition: "A Passenger with the same email already exists"
  - id: ERR_DUPLICATE_RECORD_LOCATOR
    http: 409
    condition: "A Booking with the same record_locator already exists"
  - id: ERR_DUPLICATE_TAG_NUMBER
    http: 409
    condition: "A CheckedBag with the same tag_number already exists"
  - id: ERR_DUPLICATE_SEQUENCE_INDEX
    http: 409
    condition: "A FlightSegment with the same sequence_index already exists on that booking"
  - id: ERR_DUPLICATE_OBLIGATION_FOR_SOURCE
    http: 409
    condition: "A non-VOIDED RefundObligation already exists for the same (basis, source row) pair"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "reopen called on a complaint whose reopen_count already equals REOPEN_LIMIT (2)"
  # ---- business referential ----
  - id: ERR_SEGMENT_BOOKING_MISMATCH
    http: 422
    condition: "The supplied flight_segment_id belongs to a different Booking than the supplied booking_id"
  - id: ERR_BASIS_REFERENCE_MISMATCH
    http: 422
    condition: "The set of source foreign keys supplied does not match the declared basis (wrong FK, more than one FK, or none where one is required), or the supplied source row belongs to a different booking"
  - id: ERR_CONSENT_REFERENCE_MISMATCH
    http: 422
    condition: "consent_complaint_id resolves to a ConsumerComplaint on a different Booking than the obligation"
  # ---- business fiscal ----
  - id: ERR_NO_REFUND_HEADROOM
    http: 422
    condition: "A PROACTIVE obligation was requested on a booking whose headroom_at_creation_cents is <= 0"
  - id: ERR_REFUND_EXCEEDS_HEADROOM
    http: 422
    condition: "A REQUEST_BASED obligation's gross_entitlement_cents exceeds the booking's headroom_at_creation_cents"
  - id: ERR_GRANT_AMOUNT_REQUIRED
    http: 422
    condition: "answer with disposition = REFUND_GRANTED omitted granted_amount_cents or supplied a value below 1"
  - id: ERR_FAILURE_REASON_REQUIRED
    http: 422
    condition: "complete-settlement with outcome = FAILED omitted failure_reason"

roles:
  - name: ComplianceAdmin
    description: "Head of the customer compliance office. Owns policy configuration, voids, tarmac contingency-plan reporting, regulator filings and the compliance sweep. Can perform every ComplianceOfficer and OpsController write as an override, except initiate-settlement, which is reserved to ComplianceOfficer so the segregation-of-duties chain cannot be collapsed by one person."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/policy-profiles"
      - "POST /compliance/refund-obligations/{id}/void"
      - "POST /compliance/tarmac-delay-events/{id}/file-report"
      - "POST /compliance/regulator-reports"
      - "POST /compliance/regulator-reports/{id}/submit"
      - "POST /compliance/regulator-reports/{id}/amend"
      - "POST /compliance/compliance-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /compliance/passengers, POST /compliance/bookings, POST /compliance/bookings/{id}/flight-segments, POST /compliance/ancillary-purchases, POST /compliance/checked-bags (with ComplianceOfficer or OpsController)"
      - "POST /compliance/flight-segments/{id}/declare-disruption, POST /compliance/flight-segments/{id}/record-operation, POST /compliance/tarmac-delay-events, POST /compliance/tarmac-delay-events/{id}/deplane, POST /compliance/tarmac-delay-events/{id}/claim-exemption (with OpsController)"
      - "POST /compliance/ancillary-purchases/{id}/mark-not-provided, POST /compliance/checked-bags/{id}/resolve, POST /compliance/denied-boarding-records, POST /compliance/denied-boarding-records/{id}/finalize, POST /compliance/refund-obligations, POST /compliance/refund-obligations/{id}/elect, POST /compliance/refund-obligations/{id}/complete-settlement, all consumer-complaint actions (with ComplianceOfficer)"
      - "every GET except GET /compliance/bookings/{id}/refund-exposure is shared with RegulatorAuditor"
  - name: ComplianceOfficer
    description: "Case worker in the compliance office. Mints refund obligations, records elections, initiates settlements, and works consumer complaints. Cannot void, cannot file tarmac reports, cannot submit regulator filings, and cannot complete a settlement they themselves initiated."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/refund-obligations/{id}/initiate-settlement"
    shared_operations:
      - "POST /compliance/passengers, POST /compliance/bookings, POST /compliance/ancillary-purchases, POST /compliance/checked-bags (with ComplianceAdmin)"
      - "POST /compliance/ancillary-purchases/{id}/mark-not-provided, POST /compliance/checked-bags/{id}/resolve, POST /compliance/denied-boarding-records, POST /compliance/denied-boarding-records/{id}/finalize, POST /compliance/refund-obligations, POST /compliance/refund-obligations/{id}/complete-settlement (with ComplianceAdmin)"
      - "POST /compliance/refund-obligations/{id}/elect, POST /compliance/consumer-complaints (with Passenger and ComplianceAdmin)"
      - "POST /compliance/consumer-complaints/{id}/acknowledge, /request-info, /answer, /reopen (with ComplianceAdmin)"
      - "GET /compliance/policy-profiles/{id}, /compliance/passengers/{id}, /compliance/bookings, /compliance/bookings/{id} and its sub-resources, /compliance/flight-segments/{id}, /compliance/ancillary-purchases{,/{id}}, /compliance/denied-boarding-records{,/{id}}, /compliance/refund-obligations{,/{id}}, /compliance/consumer-complaints/{id}{,/activities}, /compliance/bookings/{id}/refund-exposure"
  - name: OpsController
    description: "Airline operations controller. Owns the operational truth about flights: segment creation, disruption declarations, departure/arrival/restore events, and tarmac delay occupation records. Has no authority over money, complaints, or filings."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /compliance/bookings/{id}/flight-segments, POST /compliance/flight-segments/{id}/declare-disruption, POST /compliance/flight-segments/{id}/record-operation, POST /compliance/tarmac-delay-events, POST /compliance/tarmac-delay-events/{id}/deplane, POST /compliance/tarmac-delay-events/{id}/claim-exemption (with ComplianceAdmin)"
      - "GET /compliance/policy-profiles/{id}, /compliance/bookings, /compliance/bookings/{id}, /compliance/bookings/{id}/flight-segments, /compliance/flight-segments/{id}, /compliance/flight-segments/{id}/tarmac-delay-events, /compliance/denied-boarding-records{,/{id}}"
  - name: RegulatorAuditor
    description: "External regulator auditor. Strictly read-only across the whole compliance surface, including the filed reports and the complaint activity log. Holds no write capability of any kind."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint in §1.5, including GET /compliance/policy-profiles/{id}/regulator-reports, GET /compliance/consumer-complaints/{id}/activities and GET /compliance/bookings/{id}/refund-exposure"
  - name: Passenger
    description: "The travelling consumer. Reads only their own bookings, obligations and complaints, elects cash or travel credit on their own obligations, and files complaints on their own bookings. X-User-ID equals the Passenger.id returned by POST /compliance/passengers."
    identity: "entity_backed:Passenger"
    exclusive_operations: []
    shared_operations:
      - "POST /compliance/refund-obligations/{id}/elect, POST /compliance/consumer-complaints (with ComplianceOfficer and ComplianceAdmin, but restricted to their own resources by the priority-5 ownership check)"
      - "GET /compliance/passengers/{id}, /compliance/bookings, /compliance/bookings/{id}, /compliance/bookings/{id}/flight-segments, /compliance/bookings/{id}/checked-bags, /compliance/bookings/{id}/consumer-complaints, /compliance/flight-segments/{id}, /compliance/ancillary-purchases{,/{id}}, /compliance/refund-obligations{,/{id}}, /compliance/consumer-complaints/{id} (own resources only)"
