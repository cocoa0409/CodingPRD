              payload: { element_code: "3020", element_name: "Slope 45", theme: "Town", unit_mass_grams: 1.4, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3020: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_cycle@example.com", display_name: "Cycle Member", home_store_id: "${store6_id}" }
              as: PlatformAdmin
              captures: { mem_cycle: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store6_id}", element_id: "${elem_3020}", bin_label: "F01", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_f01: $.data.id }
          trigger:
            - call: "POST /stores/members/{id}/suspend"
              payload: { reason_code: "POLICY_REVIEW" }
              as: StoreAssociate
              captures: { first_susp: $.data.stage, mem_cycle_v2: $.data.version }
            - call: "POST /stores/members/{id}/reinstate"
              payload: {}
              as: StoreAssociate
              captures: { first_reinstate: $.data.stage, mem_cycle_v3: $.data.version }
            - call: "POST /stores/members/{id}/suspend"
              payload: { reason_code: "SECOND_REVIEW" }
              as: StoreAssociate
              captures: { second_susp: $.data.stage, mem_cycle_v4: $.data.version }
            - call: "POST /stores/members/{id}/reinstate"
              payload: {}
              as: StoreAssociate
              captures: { second_reinstate: $.data.stage }
          assert:
            - "the first suspend returns stage SUSPENDED and Member.${mem_cycle}.stage == SUSPENDED"
            - "the first reinstate returns stage ACTIVE"
            - "the second suspend returns stage SUSPENDED again, proving the ACTIVE → SUSPENDED edge re-fires"
            - "Member.${mem_cycle}.stage == ACTIVE after the second reinstate"
            - "Member.${mem_cycle}.passed_mb_reservations == 0"
            - "Member.${mem_cycle}.version == 5"

