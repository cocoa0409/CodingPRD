      - name: admit_at_window_end_is_exclusive
        grounds:
          - calculations.calc_access_window
          - state_machines.ORAccessPass.APPROVED_to_ADMITTED
          - state_machines.ORAccessPass.APPROVED_to_EXPIRED
        distinguishing_aspect: |
          Metric: access-admit instant vs pass window (different metric than delivery deadline;
          different endpoint: admit vs verify). window_end 2026-08-03T12:30:00Z is EXCLUSIVE:
          admit at 12:29 succeeds; the clock sweep at exactly 12:30 expires an APPROVED pass
          (now >= window_end), and a subsequent admit fails ERR_PASS_INVALID_STATE.
        test_recipe:
          setup:
            - "Two APPROVED passes (p1, p2) for the same rep on case 2026-08-03 09:00-12:00 -> window [07:00, 12:30)"
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
