# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Aircraft Management & Owner Services
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: statement_accrual_vs_cash_variant_totals
        grounds:
          - calculations.statement_accrual_cash_totals
          - entities.MonthlyStatement.fields.accrual_total_cents
          - entities.MonthlyStatement.fields.cash_total_cents
        distinguishing_aspect: |
          Dual-variant logic on the MonthlyStatement (financial-statement
          domain): with identical expense data, the accrual variant (keyed on
          service_date) yields 430000 while the cash variant (keyed on
          paid_date) yields 300000, because E2 is incurred in August but paid
          in September and E3 is incurred in July but paid in August.
        test_recipe:
          setup:
            - "Agreement ACTIVE with monthly_management_fee_cents=500000, variable_fee_pct=0.10, charter_owner_share_pct=0.85, tax_allocation_method=FLIGHT_HOURS"
            - "Expense E1 FUEL 250000 service_date 2026-08-05 paid_date 2026-08-07"
            - "Expense E2 CREW 180000 service_date 2026-08-15 paid_date 2026-09-02"
            - "Expense E3 HANGAR 50000 service_date 2026-07-28 paid_date 2026-08-03"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N100JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: FUEL, amount_cents: 250000, service_date: "2026-08-05", paid_date: "2026-08-07", vendor_name: "Meridian Fuel", tax_use: OWNER_USE }
              as: FinanceController
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: CREW, amount_cents: 180000, service_date: "2026-08-15", paid_date: "2026-09-02", vendor_name: "Crew Leasing Co", tax_use: OWNER_USE }
              as: FinanceController
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: HANGAR, amount_cents: 50000, service_date: "2026-07-28", paid_date: "2026-08-03", vendor_name: "Teterboro Hangars", tax_use: OWNER_USE }
              as: FinanceController
          trigger:
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
              as: AccountExecutive
              captures: { stmt_id: $.data.id }
          assert:
            - "MonthlyStatement.${stmt_id}.accrual_total_cents == 430000"
            - "MonthlyStatement.${stmt_id}.cash_total_cents == 300000"
            - "MonthlyStatement.${stmt_id}.management_fee_cents == 543000"
            - "MonthlyStatement.${stmt_id}.status == DRAFT"

      - name: tax_allocation_flight_hours_vs_trip_legs
        grounds:
          - calculations.tax_use_allocation
          - entities.MonthlyStatement.fields.mixed_owner_share_cents
          - entities.ManagementAgreement.fields.tax_allocation_method
        distinguishing_aspect: |
          Dual-variant logic on the tax-allocation domain (distinct from the
          statement-totals domain): with the same completed trips (one 4.0h
          OWNER_USE, one 6.0h CHARTER) and the same 100000-cent MIXED expense,
          FLIGHT_HOURS allocates 40000/60000 while TRIP_LEGS allocates
          50000/50000.
        test_recipe:
          setup:
            - "Agreement ACTIVE with tax_allocation_method=FLIGHT_HOURS, charter_owner_share_pct=0.85"
            - "QUALIFIED captain C1 and QUALIFIED first officer C2; ACCEPTED INSURANCE_COI valid_until 2027-01-01"
            - "Trip T1 OWNER_USE COMPLETED with block_hours_actual 4.0"
            - "Trip T2 CHARTER (quote 900000) COMPLETED with block_hours_actual 6.0; no CHARTER_DIRECT expenses"
            - "Expense M1 MIXED 100000 service_date 2026-08-20 paid_date 2026-08-21"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N200JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
              captures: { ag_v: $.data.version }
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-1001", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-04T08:00:00Z", block_hours_est: 4.0 }
              as: FlightOpsManager
              captures: { t1_id: $.data.id }
            - call: "POST /assignments"
              payload: { trip_id: "${t1_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-04T06:00:00Z", duty_end_at: "2026-08-04T12:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t1_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-04T06:00:00Z", duty_end_at: "2026-08-04T12:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t1_id}/schedule"
              as: FlightOpsManager
            - call: "POST /trips/${t1_id}/complete"
              payload: { block_hours_actual: 4.0 }
              as: FlightOpsManager
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 6.0, charter_quote_cents: 900000 }
              as: FlightOpsManager
              captures: { t2_id: $.data.id }
            - call: "POST /trips/${t2_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
            - call: "POST /assignments"
              payload: { trip_id: "${t2_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t2_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t2_id}/schedule"
              as: FlightOpsManager
            - call: "POST /trips/${t2_id}/complete"
              payload: { block_hours_actual: 6.0 }
              as: FlightOpsManager
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: OTHER, amount_cents: 100000, service_date: "2026-08-20", paid_date: "2026-08-21", vendor_name: "Catering Shared", tax_use: MIXED }
              as: FinanceController
          trigger:
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
              as: AccountExecutive
              captures: { stmt_id: $.data.id }
            - call: "PATCH /agreements/${ag_id}/terms"
              payload: { expected_agreement_version: "${ag_v}", tax_allocation_method: TRIP_LEGS }
              as: AccountExecutive
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
              as: AccountExecutive
          assert:
            - "first generation: MonthlyStatement.${stmt_id}.tax_method_used == FLIGHT_HOURS"
            - "first generation: MonthlyStatement.${stmt_id}.mixed_owner_share_cents == 40000"
            - "first generation: MonthlyStatement.${stmt_id}.mixed_charter_share_cents == 60000"
            - "second generation (TRIP_LEGS, same underlying data): MonthlyStatement.${stmt_id}.mixed_owner_share_cents == 50000"
            - "second generation: MonthlyStatement.${stmt_id}.mixed_charter_share_cents == 50000"
            - "first generation: MonthlyStatement.${stmt_id}.charter_offset_cents == 765000"

  - rule_id: combinatorial_formula
    instances:
      - name: charter_credit_net_share_with_floor
        grounds:
          - calculations.charter_owner_credit
        distinguishing_aspect: |
          Mode (a) combinatorial formula: three-plus inputs (charter_quote_cents,
          summed CHARTER_DIRECT costs, charter_owner_share_pct) interact
          non-linearly through a conditional branch and a max() floor —
          credit = round_half_up(max(0, quote - direct_costs) x 0.85).
        test_recipe:
          setup:
            - "Agreement ACTIVE with charter_owner_share_pct=0.85"
            - "QUALIFIED captain C1 and first officer C2; ACCEPTED INSURANCE_COI valid_until 2027-01-01"
            - "CHARTER trip T (quote 900000) APPROVED with CHARTER_DIRECT expenses 200000 and 50000 posted against it"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N300JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-3001", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 6.0, charter_quote_cents: 900000 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
            - call: "POST /trips/${t_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: CHARTER_DIRECT, amount_cents: 200000, service_date: "2026-08-06", vendor_name: "JetFuel Co", tax_use: CHARTER_USE, trip_id: "${t_id}" }
              as: FinanceController
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: CHARTER_DIRECT, amount_cents: 50000, service_date: "2026-08-06", vendor_name: "Signature Landing", tax_use: CHARTER_USE, trip_id: "${t_id}" }
              as: FinanceController
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/schedule"
              as: FlightOpsManager
          trigger:
            - call: "POST /trips/${t_id}/complete"
              payload: { block_hours_actual: 6.0 }
              as: FlightOpsManager
          assert:
            - "TripRequest.${t_id}.owner_credit_cents == 552500"
            - "TripRequest.${t_id}.charter_shortfall_cents == 0"
            - "TripRequest.${t_id}.status == COMPLETED"

      - name: mixed_expense_per_line_rounding_then_sum
        grounds:
          - calculations.tax_use_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round_half_up
          BEFORE summation. Two MIXED lines of 33333 and 66667 cents at an
          owner ratio of exactly 0.5 yield 16667 + 33334 = 50001 to the owner,
          whereas sum-then-round would yield 50000 — the rounding order is the
          observable distinction.
        test_recipe:
          setup:
            - "Agreement ACTIVE with tax_allocation_method=TRIP_LEGS"
            - "QUALIFIED captain C1 and first officer C2; ACCEPTED INSURANCE_COI valid_until 2027-01-01"
            - "One OWNER_USE trip COMPLETED (4.0h) and one CHARTER trip COMPLETED (6.0h, quote 900000): trip-count ratio exactly 1/2"
            - "MIXED expenses 33333 and 66667 with service_date in 2026-08"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N400JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: TRIP_LEGS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-4001", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-04T08:00:00Z", block_hours_est: 4.0 }
              as: FlightOpsManager
              captures: { t1_id: $.data.id }
            - call: "POST /assignments"
              payload: { trip_id: "${t1_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-04T06:00:00Z", duty_end_at: "2026-08-04T12:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t1_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-04T06:00:00Z", duty_end_at: "2026-08-04T12:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t1_id}/schedule"
              as: FlightOpsManager
            - call: "POST /trips/${t1_id}/complete"
              payload: { block_hours_actual: 4.0 }
              as: FlightOpsManager
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 6.0, charter_quote_cents: 900000 }
              as: FlightOpsManager
              captures: { t2_id: $.data.id }
            - call: "POST /trips/${t2_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
            - call: "POST /assignments"
              payload: { trip_id: "${t2_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t2_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t2_id}/schedule"
              as: FlightOpsManager
            - call: "POST /trips/${t2_id}/complete"
              payload: { block_hours_actual: 6.0 }
              as: FlightOpsManager
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: OTHER, amount_cents: 33333, service_date: "2026-08-10", vendor_name: "Shared Services A", tax_use: MIXED }
              as: FinanceController
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: OTHER, amount_cents: 66667, service_date: "2026-08-11", vendor_name: "Shared Services B", tax_use: MIXED }
              as: FinanceController
          trigger:
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
