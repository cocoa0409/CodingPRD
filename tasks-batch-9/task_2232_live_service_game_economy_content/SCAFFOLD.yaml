scenario: "2232. Live Service Game Economy & Content Cadence (game live operations team): season and content roadmap with episode cadence, feature releases and event calendars, virtual economy design with currency sinks and faucets, pricing tiers and inflation monitoring, monetization offers including battle passes, bundles and limited-time items with personalization and fairness constraints, player progression pacing with retention and engagement metric targets, live balance changes with data-driven tuning and community communication, event operations with server capacity planning and rollback readiness, player spend monitoring with responsible spending safeguards and refund policy, disclosure requirements for randomized item probabilities and minor purchase protections"
domain_name: live-service-game-economy
api_prefix: ""   # flat topology: every entity owns a top-level collection segment (/seasons, /offers, /players, ...)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by FK fields carried in request bodies; only a handful of
  # genuinely-owned children (Episode, ProbabilityDisclosure, CommsNotice, adjustments)
  # are addressed through a parent path segment.

  state_machine_shape: parallel
  # Offer carries two independent state dimensions (approval_status x availability_status);
  # Episode (LIVE -> ROLLED_BACK -> SCHEDULED -> LIVE), BalanceChange (LIVE -> REVERTED -> SHADOW)
  # and Player.spend_state (UNRESTRICTED <-> COOLDOWN) are cyclic; Purchase / RefundRequest /
  # MonitoringRun / LiveEvent branch; Season is compound over Episode + Offer + Purchase children.

  relationship_patterns:
    - one_to_many          # Season -> Episode / Offer / LiveEvent / BalanceChange / MonitoringRun
    - self_referential     # EconomyLedgerEntry.reversal_of_entry_id -> EconomyLedgerEntry.id
    - cross_aggregate      # Purchase spans Player x Offer; EconomyLedgerEntry spans CurrencyAccount x Season x Purchase

  role_model: segregation_of_duties
  # The EconomyDesigner user id that authored a BalanceChange may not be the user id that
  # publishes its CommsNotice, and the ComplianceOfficer that reviews an Offer is never the
  # EconomyDesigner that authored it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 66 endpoints / 44 error codes / 10 calculation rules (4 with variants) /
  # 11 state machines (parallel + 3 cyclic + 4 branching + 1 compound) / 3 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable season code, unique across all seasons"
        constraints: "1..16 chars; unique (ERR_SEASON_CODE_DUPLICATE)"
      - name: title
        type: string
        source: input
        description: "Marketing title of the season"
      - name: starts_at
        type: datetime
        source: input
        description: "Season window start (inclusive)"
      - name: ends_at
        type: datetime
        source: input
        description: "Season window end (inclusive); must be > starts_at"
      - name: planned_episode_count
        type: integer
        source: input
        description: "Roadmap target number of episodes"
        constraints: ">= 1"
      - name: target_xp_total
        type: integer
        source: input
        description: "Full-season XP target used as the pacing denominator"
        constraints: ">= 1"
      - name: pass_price_minor
        type: integer
        source: input
        description: "Battle-pass reference price in minor currency units"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Season lifecycle state"
        default: PLANNED
        constraints: "PLANNED | LIVE | CONCLUDED | ARCHIVED"
      - name: economy_health
        type: enum
        source: computed
        description: "Inflation posture; written only by MonitoringRun compute / void cascades"
        default: HEALTHY
        constraints: "HEALTHY | WATCH | INFLATED"
      - name: content_posture
        type: enum
        source: computed
        description: "Cadence posture derived from cadence_debt_days (BEHIND when > 14)"
        default: ON_TRACK
        constraints: "ON_TRACK | BEHIND"
      - name: scheduled_episode_count
        type: integer
        source: computed
        description: "Count of Episodes of this season with status == SCHEDULED"
        default: 0
      - name: released_episode_count
        type: integer
        source: computed
        description: "Count of Episodes of this season with status IN {LIVE, CONCLUDED}"
        default: 0
      - name: cadence_debt_days
        type: integer
        source: computed
        description: "Accumulated slip days per calculations.season_cadence_debt_days"
        default: 0
      - name: gross_faucet_minor
        type: integer
        source: computed
        description: "Sum of EconomyLedgerEntry.amount_minor with direction == FAUCET and season_id == this season (gross, reversals included)"
        default: 0
      - name: gross_sink_minor
        type: integer
        source: computed
        description: "Sum of EconomyLedgerEntry.amount_minor with direction == SINK and season_id == this season (gross, reversals included)"
        default: 0
      - name: lifetime_ratio_bp
        type: integer
        source: computed
        description: "calculations.season_sink_faucet_ratio_bp variant LIFETIME_CUMULATIVE"
        default: 10000
      - name: pending_revenue_minor
        type: integer
        source: computed
        description: "Sum of Purchase.quoted_price_minor for purchases of this season's offers with status == PENDING"
        default: 0
      - name: settled_revenue_minor
        type: integer
        source: computed
        description: "Sum of Purchase.price_paid_minor for purchases of this season's offers with status == SETTLED"
        default: 0
      - name: live_offer_count
        type: integer
        source: computed
        description: "Count of Offers of this season with availability_status == LIVE"
        default: 0
      - name: effective_sink_rate_bp
        type: integer
        source: computed
        description: "Current sink-rate tuning multiplier; mutated only by BalanceChange CANARY->LIVE and restored by LIVE->REVERTED"
        default: 10000
      - name: active_tuning_count
        type: integer
        source: computed
        description: "Count of BalanceChanges of this season with stage IN {SHADOW, CANARY, LIVE}"
        default: 0
      - name: tuning_stage_epoch
        type: integer
        source: computed
        description: "Monotonic counter incremented on every accepted BalanceChange advance or revert"
        default: 0

  - name: Episode
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this episode drops in"
      - name: sequence_no
        type: integer
        source: input
        description: "1-based episode order within the season; must equal max(sequence_no) + 1"
        constraints: ">= 1; unique per season"
      - name: title
        type: string
        source: input
        description: "Episode title"
      - name: planned_release_at
        type: datetime
        source: input
        description: "Scheduled drop instant; must fall inside [season.starts_at, season.ends_at]"
      - name: actual_release_at
        type: datetime
        source: system
        description: "Clock instant at which the episode went LIVE; cleared on reschedule"
        default: null
      - name: xp_grant
        type: integer
        source: input
        description: "Claimable XP this episode contributes to pacing projections"
        constraints: ">= 0"
      - name: soft_currency_grant_minor
        type: integer
        source: input
        description: "SOFT_COIN faucet granted per eligible CurrencyAccount at release"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Episode lifecycle state"
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | LIVE | CONCLUDED | ROLLED_BACK"
      - name: rollback_count
        type: integer
        source: computed
        description: "Number of times this episode has gone LIVE -> ROLLED_BACK"
        default: 0
      - name: grant_batch_size
        type: integer
        source: computed
        description: "Number of CurrencyAccounts credited by the most recent release of this episode"
        default: 0

  - name: CapacityCluster
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Operator-facing cluster name"
      - name: region_code
        type: enum
        source: input
        description: "Serving region"
        constraints: "NA | EU | LATAM | APAC"
      - name: ccu_capacity
        type: integer
        source: input
        description: "Concurrent-user ceiling available to live events"
        constraints: ">= 1"
      - name: maintenance_buffer_minutes
        type: integer
        source: input
        description: "Cool-down minutes appended to the END of every occupied window on this cluster"
        default: 30
        constraints: "0..240"
      - name: status
        type: enum
        source: system
        description: "Cluster availability"
        default: ACTIVE
        constraints: "ACTIVE | DRAINING | RETIRED"
      - name: reserved_ccu
        type: integer
        source: computed
        description: "Sum of LiveEvent.reserved_ccu_at_approval over events on this cluster with status IN {APPROVED, RUNNING}"
        default: 0

  - name: LiveEvent
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season the event belongs to"
      - name: capacity_cluster_id
        type: string
        source: input
        description: "FK -> CapacityCluster.id; cluster whose CCU the event occupies"
      - name: code
        type: string
        source: input
        description: "Event code, unique per season"
      - name: window_start
        type: datetime
        source: input
        description: "Event window start (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Event window end (exclusive); must be > window_start"
      - name: forecast_ccu
        type: integer
        source: input
        description: "Forecast peak concurrent users for the event"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state"
        default: PLANNED
        constraints: "PLANNED | APPROVED | RUNNING | COMPLETED | ROLLED_BACK | CANCELLED"
      - name: reserved_ccu_at_approval
        type: integer
        source: system
        description: "forecast_ccu snapshotted at approval; the exact quantity released on complete/rollback"
        default: 0
      - name: rollback_reason
        type: string
        source: system
        description: "Reason recorded when the event is rolled back"
        default: null

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: handle
        type: string
        source: input
        description: "Player handle, unique across players"
        constraints: "unique (ERR_PLAYER_HANDLE_DUPLICATE)"
      - name: region_code
        type: enum
        source: input
        description: "Price-region of the player"
        constraints: "NA | EU | LATAM | APAC"
      - name: active_season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this player is progressing through"
      - name: is_minor
        type: boolean
        source: input
        description: "True when the account is flagged as a minor"
        default: false
      - name: guardian_verified
        type: boolean
        source: input
        description: "True when guardian consent has been recorded for a minor account"
        default: false
      - name: spend_state
        type: enum
        source: system
        description: "Responsible-spending gate on the player"
        default: UNRESTRICTED
        constraints: "UNRESTRICTED | COOLDOWN | LOCKED"
      - name: season_xp_total
        type: integer
        source: computed
        description: "Cumulative XP ingested for the active season"
        default: 0
      - name: session_count
        type: integer
        source: computed
        description: "Cumulative ingested session count for the active season"
        default: 0
      - name: last_active_at
        type: datetime
        source: system
        description: "occurred_at of the most recent engagement-event ingest"
        default: null
      - name: pacing_bp_realized
        type: integer
        source: computed
        description: "calculations.player_pacing_bp variant REALIZED as of the last mutation-time recompute"
        default: 10000
      - name: retention_band
        type: enum
        source: computed
        description: "Band derived from pacing_bp_realized; read by the personalization branch of the quote calculation"
        default: HEALTHY
        constraints: "HEALTHY | AT_RISK | CHURN_RISK"
      - name: spend_30d_minor
        type: integer
        source: computed
        description: "calculations.player_rolling_spend_minor over the trailing 30 days, net of executed refunds"
        default: 0
      - name: pending_spend_minor
        type: integer
        source: computed
        description: "Sum of Purchase.quoted_price_minor for this player's purchases with status == PENDING"
        default: 0
      - name: lifetime_spend_minor
        type: integer
        source: computed
        description: "Sum of Purchase.price_paid_minor for this player's purchases with status IN {SETTLED, REFUNDED}"
        default: 0

  - name: CurrencyAccount
    parent: Player
    common_fields: true
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; owner of the account"
      - name: currency_code
        type: enum
        source: input
        description: "Virtual currency held by this account; one account per (player, currency)"
        constraints: "HARD_GEM | SOFT_COIN | EVENT_TOKEN"
      - name: balance_minor
        type: integer
        source: computed
        description: "lifetime_faucet_minor - lifetime_sink_minor; never negative"
        default: 0
      - name: lifetime_faucet_minor
        type: integer
        source: computed
        description: "Sum of EconomyLedgerEntry.amount_minor for this account with direction == FAUCET"
        default: 0
      - name: lifetime_sink_minor
        type: integer
        source: computed
        description: "Sum of EconomyLedgerEntry.amount_minor for this account with direction == SINK"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE normally; FROZEN while the owning player's spend_state == LOCKED"
        default: ACTIVE
        constraints: "ACTIVE | FROZEN"

  - name: EconomyLedgerEntry
    parent: CurrencyAccount
    common_fields: false
    fields:
      - name: currency_account_id
        type: string
        source: input
        description: "FK -> CurrencyAccount.id; account whose balance this entry moves"
      - name: season_id
        type: string
        source: system
        description: "FK -> Season.id; season the flow is attributed to (episode/offer season, else player.active_season_id)"
      - name: purchase_id
        type: string
        source: system
        description: "FK -> Purchase.id; set when the flow is a purchase grant, a purchase-attributed spend, or a refund reversal"
        default: null
      - name: direction
        type: enum
        source: input
        description: "FAUCET mints currency into the account; SINK removes it"
        constraints: "FAUCET | SINK"
      - name: amount_minor
        type: integer
        source: input
        description: "Absolute magnitude of the flow"
        constraints: ">= 1"
      - name: source_kind
        type: enum
        source: input
        description: "Economic source of the flow"
        constraints: "EPISODE_GRANT | PURCHASE_GRANT | OFFER_SPEND | EVENT_REWARD | ADMIN_ADJUSTMENT | REFUND_REVERSAL | EPISODE_ROLLBACK_REVERSAL"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the entry was appended"
      - name: reversal_of_entry_id
        type: string
        source: system
        description: "FK -> EconomyLedgerEntry.id; set on compensating entries, pointing at the entry being undone"
        default: null

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season the offer is merchandised in"
      - name: offer_type
        type: enum
        source: input
        description: "Monetization archetype"
        constraints: "BATTLE_PASS | BUNDLE | LIMITED_TIME | LOOT_BOX"
      - name: sku
        type: string
        source: input
        description: "Storefront SKU, unique per season"
      - name: price_tier
        type: enum
        source: input
        description: "Pricing tier selecting the tier discount in basis points"
        constraints: "T1 | T2 | T3 | T4"
      - name: list_price_minor
        type: integer
        source: input
        description: "NA reference price; must equal sum(line_items[].base_price_minor)"
        constraints: ">= 1"
      - name: line_items
        type: array
        source: input
        description: "Contents: objects {sku, base_price_minor, declared_value_minor, granted_currency_code, granted_amount_minor}"
        constraints: "1..8 entries; item skus unique within the offer"
      - name: personalization_discount_bp
        type: integer
        source: input
        description: "Discount in basis points applied only to players whose retention_band == AT_RISK"
        default: 0
        constraints: "0..2000"
      - name: minor_purchasable
        type: boolean
        source: input
        description: "True when minor accounts may purchase this offer"
        default: false
      - name: window_start
        type: datetime
        source: input
        description: "Merchandising window start (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "Merchandising window end (inclusive); must be > window_start"
      - name: approval_status
        type: enum
        source: system
        description: "Governance dimension, independent of availability_status"
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | APPROVED"
      - name: availability_status
        type: enum
        source: system
        description: "Storefront dimension, independent of approval_status"
        default: OFFLINE
        constraints: "OFFLINE | LIVE | SUSPENDED | WITHDRAWN"
      - name: fairness_index_bp
        type: integer
        source: computed
        description: "calculations.offer_fairness_index_bp; recomputed on create, submit and publish"
        default: 0
      - name: disclosure_state
        type: enum
        source: computed
        description: "NOT_REQUIRED unless offer_type == LOOT_BOX; REQUIRED_MISSING until a PUBLISHED ProbabilityDisclosure exists"
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | REQUIRED_MISSING | PUBLISHED"
      - name: units_sold
        type: integer
        source: computed
        description: "Count of Purchases of this offer with status IN {SETTLED, REFUNDED}"
        default: 0
      - name: pending_purchase_count
        type: integer
        source: computed
        description: "Count of Purchases of this offer with status == PENDING"
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EconomyDesigner that created the offer"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that last reviewed the offer"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of IN_REVIEW -> DRAFT revise decisions taken on this offer"
        default: 0

  - name: ProbabilityDisclosure
    parent: Offer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; randomized offer this table discloses"
      - name: entries
        type: array
        source: input
        description: "Objects {item_sku, probability_bp, item_value_minor, is_rare}"
        constraints: "1..20 entries; probability_bp >= 1; item_sku unique within the table"
      - name: total_probability_bp
        type: integer
        source: computed
        description: "Sum of entries[].probability_bp; must equal exactly 10000"
      - name: expected_value_minor
        type: integer
        source: computed
        description: "round_half_up(sum(entries[].probability_bp * entries[].item_value_minor) / 10000)"
      - name: status
        type: enum
        source: system
        description: "Disclosure lifecycle state"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        description: "Clock instant of publication"
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that published the table"
        default: null

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; buyer"
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; offer being bought"
      - name: quoted_price_minor
        type: integer
        source: computed
        description: "calculations.personalized_offer_quote_minor evaluated at purchase creation"
      - name: applied_personalization_bp
        type: integer
        source: computed
        description: "Personalization discount actually applied (0 unless player.retention_band == AT_RISK)"
        default: 0
      - name: price_paid_minor
        type: integer
        source: computed
        description: "quoted_price_minor copied on settlement; 0 while PENDING or DENIED"
        default: 0
      - name: granted_total_minor
        type: integer
        source: computed
        description: "Sum of line_items[].granted_amount_minor minted at settlement"
        default: 0
      - name: granted_consumed_minor
        type: integer
        source: computed
        description: "Sum of SINK EconomyLedgerEntry.amount_minor with source_kind == OFFER_SPEND attributed to this purchase"
        default: 0
      - name: is_minor_purchase
        type: boolean
        source: computed
        description: "Player.is_minor snapshotted at purchase creation"
        default: false
      - name: status
        type: enum
        source: system
        description: "Purchase lifecycle state"
        default: PENDING
        constraints: "PENDING | SETTLED | DENIED | REFUNDED"
      - name: settled_at
        type: datetime
        source: system
        description: "Clock instant of settlement; anchors the 14-day refund window"
        default: null
      - name: deny_reason
        type: string
        source: system
        description: "Reason recorded when the purchase is denied"
        default: null

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "FK -> Purchase.id; settled purchase being refunded"
      - name: reason_code
        type: enum
        source: input
        description: "Player-stated refund reason"
        constraints: "ACCIDENTAL | MINOR_UNAUTHORIZED | DISSATISFIED | TECHNICAL_FAILURE"
      - name: status
        type: enum
        source: system
        description: "Refund lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | EXECUTED"
      - name: consumed_ratio_bp
        type: integer
        source: computed
        description: "Step 1 of calculations.refund_settlement_minor, pinned at decision time"
        default: 0
      - name: refund_base_minor
        type: integer
        source: computed
        description: "Step 2 of calculations.refund_settlement_minor; the ONLY input to the fee-tier lookup"
        default: 0
      - name: restock_fee_minor
        type: integer
        source: computed
        description: "Step 4 of calculations.refund_settlement_minor"
        default: 0
      - name: refund_amount_minor
        type: integer
        source: computed
        description: "Step 5 of calculations.refund_settlement_minor; cash returned on execution"
        default: 0
      - name: goodwill_credit_minor
        type: integer
        source: computed
        description: "Step 6: SOFT_COIN goodwill faucet; 0 when the player has no SOFT_COIN account or spend_state == LOCKED"
        default: 0
      - name: decision_note
        type: string
        source: input
        description: "Reviewer note captured with the decision"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that decided the request"
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Clock instant at which the compensating cascade ran"
        default: null

  - name: BalanceChange
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season whose tuning is changed"
      - name: target_kind
        type: enum
        source: input
        description: "Tuning target; only SINK_RATE mutates Season.effective_sink_rate_bp"
        constraints: "SINK_RATE | FAUCET_RATE | DROP_RATE | PRICE"
      - name: delta_bp
        type: integer
        source: input
        description: "Signed tuning delta in basis points"
        constraints: "-3000..3000, non-zero"
      - name: rationale
        type: string
        source: input
        description: "Data-driven justification recorded for the change"
      - name: canary_cohort_pct
        type: integer
        source: input
        description: "Percentage of players exposed while in CANARY"
        default: 5
        constraints: "1..50"
      - name: stage
        type: enum
        source: system
        description: "Rollout stage of the tuning change"
        default: DRAFT
        constraints: "DRAFT | SHADOW | CANARY | LIVE | REVERTED | RETIRED"
      - name: comms_state
        type: enum
        source: computed
        description: "MISSING until a CommsNotice exists, DRAFTED once one exists, PUBLISHED once one is published"
        default: MISSING
        constraints: "MISSING | DRAFTED | PUBLISHED"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EconomyDesigner that authored the change (segregation-of-duties subject)"
      - name: promoted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LiveOpsCommander that last advanced the stage"
        default: null
      - name: pre_live_sink_rate_bp
        type: integer
        source: system
        description: "Season.effective_sink_rate_bp snapshotted at CANARY -> LIVE; the exact value restored on revert"
        default: null

  - name: CommsNotice
    parent: BalanceChange
    common_fields: true
    fields:
      - name: balance_change_id
        type: string
        source: input
        description: "FK -> BalanceChange.id; change being communicated"
      - name: channel
        type: enum
        source: input
        description: "Community channel"
        constraints: "PATCH_NOTES | IN_GAME | SOCIAL"
      - name: headline
        type: string
        source: input
        description: "Notice headline"
      - name: body
        type: string
        source: input
        description: "Notice body copy"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle state"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: published_at
        type: datetime
        source: system
        description: "Clock instant of publication"
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID that published the notice; must differ from the change's authored_by_user_id"
        default: null

  - name: MonitoringRun
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season under inflation monitoring"
      - name: epoch_no
        type: integer
        source: input
        description: "Monitoring epoch index; must equal max(epoch_no) for the season + 1"
        constraints: ">= 1; unique per season"
      - name: window_start
        type: datetime
        source: input
        description: "Epoch window start (inclusive) for ledger inclusion"
      - name: window_end
        type: datetime
        source: input
        description: "Epoch window end (exclusive) for ledger inclusion; must be > window_start"
      - name: gross_faucet_minor
        type: integer
        source: computed
        description: "Net-of-reversal FAUCET total inside the epoch window"
        default: 0
      - name: gross_sink_minor
        type: integer
        source: computed
        description: "Net-of-reversal SINK total inside the epoch window"
        default: 0
      - name: sink_faucet_ratio_bp
        type: integer
        source: computed
        description: "calculations.season_sink_faucet_ratio_bp variant EPOCH_WINDOWED"
        default: null
      - name: resulting_health
        type: enum
        source: computed
        description: "Health band derived from sink_faucet_ratio_bp and copied onto Season.economy_health"
        default: null
        constraints: "HEALTHY | WATCH | INFLATED"
      - name: suspended_offer_count
        type: integer
        source: computed
        description: "Number of LOOT_BOX offers suspended by this run's cascade"
        default: 0
      - name: denied_purchase_count
        type: integer
        source: computed
        description: "Number of PENDING purchases denied by this run's cascade"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Run lifecycle state"
        default: OPEN
        constraints: "OPEN | COMPUTED | CERTIFIED | VOIDED"
      - name: computed_at
        type: datetime
        source: system
        description: "Clock instant at which compute ran"
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LiveOpsCommander that certified or voided the run"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNED
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNED
        to: LIVE
        trigger: "POST /seasons/{season_id}/status with to_status=LIVE"
        actor: ContentProducer
        preconditions: ["season.status == PLANNED"]
        side_effects: ["Season.version += 1"]
      - from: LIVE
        to: CONCLUDED
        trigger: "POST /seasons/{season_id}/status with to_status=CONCLUDED"
        actor: ContentProducer
        preconditions:
          - "season.status == LIVE"
          - "clock >= season.ends_at OR every Episode of the season has status IN {CONCLUDED, ROLLED_BACK}"
        side_effects:
          - "every Episode with status == LIVE -> CONCLUDED; Season.released_episode_count unchanged"
          - "every Offer with availability_status IN {LIVE, SUSPENDED} -> WITHDRAWN (ordered by Offer.created_at ASC); Season.live_offer_count set to 0"
          - "each Offer that just became WITHDRAWN denies its purchases with status == PENDING (deny_reason 'SEASON_CONCLUDED'), decrementing Season.pending_revenue_minor by each Purchase.quoted_price_minor"
          - "every LiveEvent with status == PLANNED -> CANCELLED"
          - "Season.version += 1"
      - from: CONCLUDED
        to: ARCHIVED
        trigger: "POST /seasons/{season_id}/status with to_status=ARCHIVED"
        actor: LiveOpsCommander
        preconditions:
          - "season.status == CONCLUDED"
          - "no Purchase of this season's offers has status == PENDING"
          - "every MonitoringRun of the season has status IN {CERTIFIED, VOIDED}"
        side_effects: ["Season.version += 1"]
        note: "ARCHIVED is terminal; no further mutation of the season or its children is accepted."

  - entity: Episode
    initial_state: DRAFT
    terminal_states: [CONCLUDED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /episodes/{episode_id}/schedule"
        actor: ContentProducer
        preconditions:
          - "episode.status == DRAFT"
          - "season.status IN {PLANNED, LIVE}"
          - "effective planned_release_at (body override or stored value) inside [season.starts_at, season.ends_at]"
          - "the Episode of the same season with sequence_no == this.sequence_no - 1 (if any) has status != DRAFT"
        side_effects:
          - "Season.scheduled_episode_count += 1"
          - "Season.cadence_debt_days and Season.content_posture recomputed per calculations.season_cadence_debt_days"
          - "Season.version += 1"
      - from: ROLLED_BACK
        to: SCHEDULED
        trigger: "POST /episodes/{episode_id}/schedule with planned_release_at"
        actor: ContentProducer
        preconditions:
          - "episode.status == ROLLED_BACK"
          - "season.status == LIVE"
          - "planned_release_at is present in the body, >= clock, and inside [season.starts_at, season.ends_at]"
        side_effects:
          - "Episode.actual_release_at = null; Episode.planned_release_at = body value"
          - "Season.scheduled_episode_count += 1"
          - "Season.cadence_debt_days and Season.content_posture recomputed"
          - "Season.version += 1"
        note: "Cycle: LIVE -> ROLLED_BACK -> SCHEDULED -> LIVE. rollback_count is never reset."
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /episodes/{episode_id}/release"
        actor: ContentProducer
        preconditions:
          - "episode.status == SCHEDULED"
          - "season.status == LIVE"
          - "clock >= episode.planned_release_at"
          - "season.economy_health != INFLATED"
        side_effects:
          - "Episode.actual_release_at = clock; Season.scheduled_episode_count -= 1; Season.released_episode_count += 1"
          - "any Episode of the same season with status == LIVE and sequence_no < this.sequence_no auto-transitions LIVE -> CONCLUDED"
          - "CASCADE L1: for every CurrencyAccount in the eligibility set of calculations.episode_grant_recipient_set (ordered created_at ASC) an EconomyLedgerEntry {direction: FAUCET, source_kind: EPISODE_GRANT, amount_minor: episode.soft_currency_grant_minor, season_id: episode.season_id} is appended; Episode.grant_batch_size = number of entries appended"
          - "CASCADE L2: because those entries exist, each recipient CurrencyAccount.lifetime_faucet_minor += amount and balance_minor = lifetime_faucet_minor - lifetime_sink_minor (account.version += 1)"
          - "CASCADE L3: because those account totals changed, Season.gross_faucet_minor += grant_batch_size * soft_currency_grant_minor"
          - "CASCADE L4: because Season.gross_faucet_minor changed, Season.lifetime_ratio_bp is recomputed via calculations.season_sink_faucet_ratio_bp variant LIFETIME_CUMULATIVE"
          - "Season.cadence_debt_days and Season.content_posture recomputed; Season.version += 1"
        note: "When the eligibility set is empty the release still succeeds with grant_batch_size = 0 and no ledger entries."
      - from: LIVE
        to: CONCLUDED
        trigger: "system — a later-sequence Episode of the same season transitions SCHEDULED -> LIVE, or the Season transitions LIVE -> CONCLUDED"
        actor: system
        preconditions: ["episode.status == LIVE"]
        side_effects: ["Season.released_episode_count unchanged (CONCLUDED still counts as released)"]
      - from: LIVE
        to: ROLLED_BACK
        trigger: "POST /episodes/{episode_id}/rollback"
        actor: LiveOpsCommander
        preconditions:
          - "episode.status == LIVE"
          - "season.status == LIVE"
        side_effects:
          - "Episode.rollback_count += 1; Season.released_episode_count -= 1"
          - "COMPENSATION L1: for every EconomyLedgerEntry with source_kind == EPISODE_GRANT appended by this episode's most recent release (ordered created_at ASC) a compensating entry {direction: SINK, source_kind: EPISODE_ROLLBACK_REVERSAL, amount_minor: same amount, reversal_of_entry_id: original entry id} is appended"
          - "COMPENSATION L2: because those entries exist, each affected CurrencyAccount.lifetime_sink_minor += amount and balance_minor recomputed (account.version += 1)"
          - "COMPENSATION L3: because those account totals changed, Season.gross_sink_minor += grant_batch_size * soft_currency_grant_minor and Season.lifetime_ratio_bp recomputed"
          - "Season.cadence_debt_days recomputed (each rollback adds ROLLBACK_DEBT_DAYS); Season.content_posture recomputed; Season.version += 1"
        note: "Invariant: after rollback the affected accounts' balance_minor equals their pre-release balance_minor."

  - entity: CapacityCluster
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: DRAINING
        trigger: "POST /capacity-clusters/{cluster_id}/status with to_status=DRAINING"
        actor: LiveOpsCommander
        preconditions: ["cluster.status == ACTIVE"]
        side_effects: ["CapacityCluster.version += 1"]
        note: "Existing APPROVED/RUNNING events keep their reservation; new approvals are refused."
      - from: DRAINING
        to: ACTIVE
        trigger: "POST /capacity-clusters/{cluster_id}/status with to_status=ACTIVE"
        actor: LiveOpsCommander
        preconditions: ["cluster.status == DRAINING"]
        side_effects: ["CapacityCluster.version += 1"]
      - from: DRAINING
        to: RETIRED
        trigger: "POST /capacity-clusters/{cluster_id}/status with to_status=RETIRED"
        actor: LiveOpsCommander
        preconditions: ["cluster.status == DRAINING", "cluster.reserved_ccu == 0"]
        side_effects: ["CapacityCluster.version += 1"]

  - entity: LiveEvent
    initial_state: PLANNED
    terminal_states: [COMPLETED, ROLLED_BACK, CANCELLED]
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /live-events/{event_id}/approve"
        actor: LiveOpsCommander
        preconditions:
          - "event.status == PLANNED"
          - "season.status == LIVE"
          - "cluster.status == ACTIVE"
          - "clock < event.window_end"
          - "calculations.cluster_ccu_overlap_load(event) <= cluster.ccu_capacity"
        side_effects:
          - "LiveEvent.reserved_ccu_at_approval = event.forecast_ccu"
          - "CapacityCluster.reserved_ccu += event.forecast_ccu; CapacityCluster.version += 1"
      - from: APPROVED
        to: RUNNING
        trigger: "POST /live-events/{event_id}/start"
        actor: LiveOpsCommander
        preconditions:
          - "event.status == APPROVED"
          - "clock >= event.window_start"
          - "cluster.status IN {ACTIVE, DRAINING}"
        side_effects: ["LiveEvent.version += 1"]
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /live-events/{event_id}/complete"
        actor: LiveOpsCommander
        preconditions: ["event.status == RUNNING"]
        side_effects:
          - "CapacityCluster.reserved_ccu -= LiveEvent.reserved_ccu_at_approval; LiveEvent.reserved_ccu_at_approval = 0; CapacityCluster.version += 1"
      - from: APPROVED
        to: ROLLED_BACK
        trigger: "POST /live-events/{event_id}/rollback"
        actor: LiveOpsCommander
        preconditions: ["event.status == APPROVED"]
        side_effects:
          - "LiveEvent.rollback_reason = body reason"
          - "CapacityCluster.reserved_ccu -= LiveEvent.reserved_ccu_at_approval; LiveEvent.reserved_ccu_at_approval = 0; CapacityCluster.version += 1"
        note: "Invariant: cluster.reserved_ccu returns exactly to its pre-approval value."
      - from: RUNNING
        to: ROLLED_BACK
        trigger: "POST /live-events/{event_id}/rollback"
        actor: LiveOpsCommander
        preconditions: ["event.status == RUNNING"]
        side_effects:
          - "LiveEvent.rollback_reason = body reason"
          - "CapacityCluster.reserved_ccu -= LiveEvent.reserved_ccu_at_approval; LiveEvent.reserved_ccu_at_approval = 0; CapacityCluster.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system — Season transitions LIVE -> CONCLUDED"
        actor: system
        preconditions: ["event.status == PLANNED"]
        side_effects: ["LiveEvent.version += 1"]

  - entity: Offer
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /offers/{offer_id}/submit"
        actor: EconomyDesigner
        preconditions:
          - "offer.approval_status == DRAFT"
          - "offer.availability_status == OFFLINE"
          - "season.status == LIVE"
        side_effects:
          - "Offer.fairness_index_bp recomputed per calculations.offer_fairness_index_bp"
          - "Offer.version += 1"
        note: "approval_status dimension only; availability_status is untouched."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /offers/{offer_id}/review with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "offer.approval_status == IN_REVIEW"
          - "acting X-User-ID != offer.created_by_user_id"
        side_effects: ["Offer.reviewed_by_user_id = acting X-User-ID", "Offer.version += 1"]
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /offers/{offer_id}/review with decision=REVISE"
        actor: ComplianceOfficer
        preconditions:
          - "offer.approval_status == IN_REVIEW"
          - "acting X-User-ID != offer.created_by_user_id"
        side_effects:
          - "Offer.revision_count += 1; Offer.reviewed_by_user_id = acting X-User-ID"
          - "Offer.version += 1"
        note: "Revision cycle DRAFT -> IN_REVIEW -> DRAFT; availability_status stays OFFLINE throughout."

  - entity: Offer
    initial_state: OFFLINE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OFFLINE
        to: LIVE
        trigger: "POST /offers/{offer_id}/publish"
        actor: EconomyDesigner
        preconditions:
          - "offer.availability_status == OFFLINE"
          - "offer.approval_status == APPROVED"
          - "season.status == LIVE"
          - "expected_season_version == season.version (else ERR_STALE_SEASON_VERSION)"
          - "clock <= offer.window_end"
          - "offer.disclosure_state != REQUIRED_MISSING"
          - "offer.fairness_index_bp >= FAIRNESS_FLOOR_BP"
          - "no sku-window conflict per calculations.offer_sku_window_conflict"
          - "season.economy_health != INFLATED"
          - "season.content_posture != BEHIND when offer.offer_type == LIMITED_TIME"
        side_effects:
          - "Offer.fairness_index_bp recomputed before the floor check"
          - "Season.live_offer_count += 1; Season.version += 1"
          - "Offer.version += 1"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /offers/{offer_id}/availability with to_status=SUSPENDED, or system cascade from MonitoringRun compute"
        actor: LiveOpsCommander | ComplianceOfficer | system
        preconditions: ["offer.availability_status == LIVE"]
        side_effects:
          - "Season.live_offer_count -= 1; Season.version += 1"
          - "Offer.version += 1"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /offers/{offer_id}/availability with to_status=LIVE"
        actor: LiveOpsCommander | ComplianceOfficer
        preconditions:
          - "offer.availability_status == SUSPENDED"
          - "clock <= offer.window_end"
          - "season.economy_health != INFLATED"
        side_effects:
          - "Season.live_offer_count += 1; Season.version += 1"
          - "Offer.version += 1"
        note: "Availability cycle LIVE -> SUSPENDED -> LIVE runs independently of approval_status."
      - from: OFFLINE
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/availability with to_status=WITHDRAWN"
        actor: LiveOpsCommander | ComplianceOfficer
        preconditions: ["offer.availability_status == OFFLINE"]
        side_effects: ["Offer.version += 1"]
      - from: LIVE
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/availability with to_status=WITHDRAWN, or system cascade from Season LIVE -> CONCLUDED"
        actor: LiveOpsCommander | ComplianceOfficer | system
        preconditions: ["offer.availability_status == LIVE"]
        side_effects:
          - "Season.live_offer_count -= 1"
          - "every Purchase of this offer with status == PENDING -> DENIED (deny_reason 'OFFER_WITHDRAWN'); Season.pending_revenue_minor -= each Purchase.quoted_price_minor; Player.pending_spend_minor -= each Purchase.quoted_price_minor"
          - "Season.version += 1; Offer.version += 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/availability with to_status=WITHDRAWN, or system cascade from Season LIVE -> CONCLUDED"
        actor: LiveOpsCommander | ComplianceOfficer | system
        preconditions: ["offer.availability_status == SUSPENDED"]
        side_effects:
          - "every Purchase of this offer with status == PENDING -> DENIED (deny_reason 'OFFER_WITHDRAWN'); Season.pending_revenue_minor and Player.pending_spend_minor decremented by each Purchase.quoted_price_minor"
          - "Offer.version += 1"

  - entity: ProbabilityDisclosure
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /offers/{offer_id}/disclosures/{disclosure_id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "disclosure.status == DRAFT"
          - "disclosure.total_probability_bp == 10000"
          - "offer.availability_status != WITHDRAWN"
        side_effects:
          - "ProbabilityDisclosure.published_at = clock; published_by_user_id = acting X-User-ID"
          - "any other ProbabilityDisclosure of the same offer with status == PUBLISHED -> SUPERSEDED"
          - "Offer.disclosure_state = PUBLISHED; Offer.version += 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a newer ProbabilityDisclosure of the same offer is published"
        actor: system
        preconditions: ["disclosure.status == PUBLISHED"]
        side_effects: ["ProbabilityDisclosure.version += 1"]

  - entity: Player
    initial_state: UNRESTRICTED
    terminal_states: []
    transitions:
      - from: UNRESTRICTED
        to: COOLDOWN
        trigger: "system — POST /purchases/{purchase_id}/settlement with outcome=SETTLED, or POST /monitoring-runs/{run_id}/compute recompute"
        actor: system
        preconditions:
          - "player.spend_state == UNRESTRICTED"
          - "recomputed spend_30d_minor >= SPEND_COOLDOWN_THRESHOLD_MINOR and < SPEND_LOCK_THRESHOLD_MINOR"
        side_effects: ["Player.version += 1"]
        note: "Boundary: exactly SPEND_COOLDOWN_THRESHOLD_MINOR triggers COOLDOWN (>=)."
      - from: UNRESTRICTED
        to: LOCKED
        trigger: "system — settlement recompute pushes spend_30d_minor >= SPEND_LOCK_THRESHOLD_MINOR; or POST /players/{player_id}/spend-guard with action=LOCK"
        actor: system | ComplianceOfficer
        preconditions: ["player.spend_state == UNRESTRICTED"]
        side_effects:
          - "every CurrencyAccount of the player -> status FROZEN (account.version += 1)"
          - "every Purchase of the player with status == PENDING -> DENIED (deny_reason 'SPEND_LOCKED'); Season.pending_revenue_minor and Player.pending_spend_minor decremented by each Purchase.quoted_price_minor"
          - "Player.version += 1"
      - from: COOLDOWN
        to: LOCKED
        trigger: "system — settlement recompute pushes spend_30d_minor >= SPEND_LOCK_THRESHOLD_MINOR; or POST /players/{player_id}/spend-guard with action=LOCK"
        actor: system | ComplianceOfficer
        preconditions: ["player.spend_state == COOLDOWN"]
        side_effects:
          - "every CurrencyAccount of the player -> status FROZEN"
          - "every Purchase of the player with status == PENDING -> DENIED (deny_reason 'SPEND_LOCKED')"
          - "Player.version += 1"
      - from: COOLDOWN
        to: UNRESTRICTED
        trigger: "system — POST /refund-requests/{request_id}/execute or POST /monitoring-runs/{run_id}/compute recompute"
        actor: system
        preconditions:
          - "player.spend_state == COOLDOWN"
          - "recomputed spend_30d_minor < SPEND_COOLDOWN_THRESHOLD_MINOR"
        side_effects: ["Player.version += 1"]
        note: "Cycle UNRESTRICTED -> COOLDOWN -> UNRESTRICTED; refund execution is the compensating trigger."
      - from: LOCKED
        to: UNRESTRICTED
        trigger: "POST /players/{player_id}/spend-guard with action=UNLOCK"
        actor: ComplianceOfficer
        preconditions: ["player.spend_state == LOCKED"]
        side_effects:
          - "every CurrencyAccount of the player -> status ACTIVE (account.version += 1)"
          - "Player.version += 1"
        note: "A LOCKED player never falls back to COOLDOWN; unlock always lands on UNRESTRICTED."

  - entity: Purchase
    initial_state: PENDING
    terminal_states: [DENIED, REFUNDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /purchases/{purchase_id}/settlement with outcome=SETTLED"
        actor: LiveOpsCommander
        preconditions:
          - "purchase.status == PENDING"
          - "offer.availability_status == LIVE"
          - "player.spend_state != LOCKED"
          - "every CurrencyAccount required by offer.line_items[].granted_currency_code exists for the player and has status == ACTIVE"
        side_effects:
          - "Purchase.price_paid_minor = Purchase.quoted_price_minor; settled_at = clock"
          - "for each offer.line_items entry (ordered by line sku ASC) an EconomyLedgerEntry {direction: FAUCET, source_kind: PURCHASE_GRANT, amount_minor: granted_amount_minor, purchase_id, season_id: offer.season_id} is appended; Purchase.granted_total_minor = sum of those amounts"
          - "each credited CurrencyAccount.lifetime_faucet_minor and balance_minor updated; Season.gross_faucet_minor += Purchase.granted_total_minor; Season.lifetime_ratio_bp recomputed"
          - "Offer.units_sold += 1; Offer.pending_purchase_count -= 1; Offer.version += 1"
          - "Season.pending_revenue_minor -= quoted_price_minor; Season.settled_revenue_minor += price_paid_minor; Season.version += 1"
          - "Player.pending_spend_minor -= quoted_price_minor; Player.lifetime_spend_minor += price_paid_minor; Player.spend_30d_minor recomputed per calculations.player_rolling_spend_minor; spend_state re-evaluated against thresholds; Player.pacing_bp_realized and retention_band recomputed; Player.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /purchases/{purchase_id}/settlement with outcome=DENIED, or system cascade (offer withdrawn/suspended by monitoring, player LOCKED, season concluded)"
        actor: LiveOpsCommander | system
        preconditions: ["purchase.status == PENDING"]
        side_effects:
          - "Purchase.deny_reason set; Season.pending_revenue_minor -= quoted_price_minor; Player.pending_spend_minor -= quoted_price_minor"
          - "Offer.pending_purchase_count -= 1; Offer.version += 1; Season.version += 1; Player.version += 1"
      - from: SETTLED
        to: REFUNDED
        trigger: "system — POST /refund-requests/{request_id}/execute"
        actor: system
        preconditions: ["purchase.status == SETTLED"]
        side_effects: ["Purchase.version += 1"]

  - entity: RefundRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXECUTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /refund-requests/{request_id}/decision with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "purchase.status == SETTLED"
        side_effects:
          - "consumed_ratio_bp, refund_base_minor, restock_fee_minor, refund_amount_minor and goodwill_credit_minor pinned per calculations.refund_settlement_minor using the purchase's granted_consumed_minor AT DECISION TIME"
          - "RefundRequest.decided_by_user_id = acting X-User-ID; RefundRequest.version += 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /refund-requests/{request_id}/decision with decision=DENY"
        actor: ComplianceOfficer
        preconditions: ["request.status == SUBMITTED"]
        side_effects: ["RefundRequest.decided_by_user_id = acting X-User-ID; amounts stay 0; RefundRequest.version += 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /refund-requests/{request_id}/execute"
        actor: LiveOpsCommander
        preconditions:
          - "request.status == APPROVED"
          - "purchase.status == SETTLED"
        side_effects:
          - "COMPENSATION L1: for each EconomyLedgerEntry with source_kind == PURCHASE_GRANT and purchase_id == request.purchase_id (ordered created_at ASC) a compensating entry {direction: SINK, source_kind: REFUND_REVERSAL, amount_minor: max(0, original amount - the share of granted_consumed_minor already attributed to that entry, allocated in the same created_at ASC order), reversal_of_entry_id: original entry id, purchase_id} is appended; entries whose allocated reversal amount is 0 are skipped"
          - "COMPENSATION L2: because those entries exist, each affected CurrencyAccount.lifetime_sink_minor and balance_minor are updated (account.version += 1)"
          - "COMPENSATION L3: because those account totals changed, Season.gross_sink_minor += total reversed amount and Season.lifetime_ratio_bp recomputed"
          - "COMPENSATION L4: because the purchase is refunded, Season.settled_revenue_minor -= Purchase.price_paid_minor, Player.spend_30d_minor recomputed net of refund_amount_minor, and Player.spend_state re-evaluated (COOLDOWN -> UNRESTRICTED when it falls below SPEND_COOLDOWN_THRESHOLD_MINOR)"
          - "Purchase -> REFUNDED; goodwill_credit_minor (when > 0) appended as an EconomyLedgerEntry {direction: FAUCET, source_kind: ADMIN_ADJUSTMENT} on the player's SOFT_COIN account"
          - "RefundRequest.executed_at = clock; RefundRequest.version += 1"
        note: "Invariant: with granted_consumed_minor == 0 the affected accounts' balance_minor and Season.gross_faucet_minor - Season.gross_sink_minor both return to their pre-settlement values."

  - entity: BalanceChange
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: SHADOW
        trigger: "POST /balance-changes/{change_id}/advance with to_stage=SHADOW"
        actor: LiveOpsCommander
        preconditions:
          - "change.stage == DRAFT"
          - "season.status == LIVE"
          - "expected_season_version == season.version (else ERR_STALE_SEASON_VERSION)"
        side_effects:
          - "BalanceChange.promoted_by_user_id = acting X-User-ID"
          - "Season.active_tuning_count += 1; Season.tuning_stage_epoch += 1; Season.version += 1"
      - from: SHADOW
        to: CANARY
        trigger: "POST /balance-changes/{change_id}/advance with to_stage=CANARY"
        actor: LiveOpsCommander
        preconditions:
          - "change.stage == SHADOW"
          - "change.comms_state IN {DRAFTED, PUBLISHED}"
          - "expected_season_version == season.version"
        side_effects:
          - "BalanceChange.promoted_by_user_id = acting X-User-ID"
          - "Season.tuning_stage_epoch += 1; Season.version += 1"
      - from: CANARY
        to: LIVE
        trigger: "POST /balance-changes/{change_id}/advance with to_stage=LIVE"
        actor: LiveOpsCommander
        preconditions:
          - "change.stage == CANARY"
          - "change.comms_state == PUBLISHED (else ERR_COMMS_NOTICE_REQUIRED)"
          - "season.economy_health != INFLATED"
          - "expected_season_version == season.version"
        side_effects:
          - "BalanceChange.pre_live_sink_rate_bp = Season.effective_sink_rate_bp"
          - "when target_kind == SINK_RATE: Season.effective_sink_rate_bp += change.delta_bp"
          - "Season.tuning_stage_epoch += 1; Season.version += 1"
      - from: LIVE
        to: REVERTED
        trigger: "POST /balance-changes/{change_id}/revert"
        actor: LiveOpsCommander
        preconditions: ["change.stage == LIVE"]
        side_effects:
          - "when target_kind == SINK_RATE: Season.effective_sink_rate_bp = change.pre_live_sink_rate_bp (exact restore)"
          - "Season.active_tuning_count -= 1; Season.tuning_stage_epoch += 1; Season.version += 1"
        note: "Invariant: effective_sink_rate_bp after revert equals its value before the CANARY -> LIVE advance."
      - from: CANARY
        to: REVERTED
        trigger: "POST /balance-changes/{change_id}/revert"
        actor: LiveOpsCommander
        preconditions: ["change.stage == CANARY"]
        side_effects:
          - "Season.effective_sink_rate_bp unchanged (never applied at CANARY)"
          - "Season.active_tuning_count -= 1; Season.tuning_stage_epoch += 1; Season.version += 1"
      - from: REVERTED
        to: SHADOW
        trigger: "POST /balance-changes/{change_id}/advance with to_stage=SHADOW"
        actor: LiveOpsCommander
        preconditions:
          - "change.stage == REVERTED"
          - "season.status == LIVE"
          - "expected_season_version == season.version"
        side_effects:
          - "BalanceChange.pre_live_sink_rate_bp = null"
          - "Season.active_tuning_count += 1; Season.tuning_stage_epoch += 1; Season.version += 1"
        note: "Cycle: CANARY/LIVE -> REVERTED -> SHADOW -> CANARY -> LIVE."
      - from: LIVE
        to: RETIRED
        trigger: "POST /balance-changes/{change_id}/advance with to_stage=RETIRED"
        actor: LiveOpsCommander
        preconditions:
          - "change.stage == LIVE"
          - "expected_season_version == season.version"
        side_effects:
          - "Season.active_tuning_count -= 1; Season.tuning_stage_epoch += 1; Season.version += 1"
        note: "RETIRED bakes the tuning in permanently: effective_sink_rate_bp is NOT restored."

  - entity: CommsNotice
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /balance-changes/{change_id}/comms-notices/{notice_id}/publish"
        actor: ComplianceOfficer | LiveOpsCommander
        preconditions:
          - "notice.status == DRAFT"
          - "balance_change.stage IN {DRAFT, SHADOW, CANARY, LIVE}"
          - "acting X-User-ID != balance_change.authored_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CommsNotice.published_at = clock; published_by_user_id = acting X-User-ID"
          - "BalanceChange.comms_state = PUBLISHED; BalanceChange.version += 1"

  - entity: MonitoringRun
    initial_state: OPEN
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /monitoring-runs/{run_id}/compute"
        actor: LiveOpsCommander
        preconditions:
          - "run.status == OPEN"
          - "season.status IN {LIVE, CONCLUDED}"
        side_effects:
          - "run.gross_faucet_minor / gross_sink_minor / sink_faucet_ratio_bp computed per calculations.season_sink_faucet_ratio_bp variant EPOCH_WINDOWED over [run.window_start, run.window_end); run.resulting_health derived; run.computed_at = clock"
          - "CASCADE L1: Season.economy_health = run.resulting_health; Season.cadence_debt_days and Season.content_posture recomputed; Season.version += 1"
          - "CASCADE L2: because Season.economy_health became INFLATED, every Offer with season_id == run.season_id, offer_type == LOOT_BOX and availability_status == LIVE transitions LIVE -> SUSPENDED (ordered by Offer.created_at ASC); run.suspended_offer_count = number suspended; Season.live_offer_count decremented per offer"
          - "CASCADE L3: because those offers became SUSPENDED, every Purchase of them with status == PENDING -> DENIED (deny_reason 'OFFER_SUSPENDED_BY_MONITORING'); run.denied_purchase_count = number denied"
          - "CASCADE L4: because those purchases were denied, Season.pending_revenue_minor and each buyer's Player.pending_spend_minor are decremented by the denied Purchase.quoted_price_minor"
          - "for every Player with active_season_id == run.season_id (ordered created_at ASC): spend_30d_minor, pacing_bp_realized and retention_band recomputed; spend_state re-evaluated (COOLDOWN -> UNRESTRICTED when spend_30d_minor < SPEND_COOLDOWN_THRESHOLD_MINOR)"
      - from: COMPUTED
        to: CERTIFIED
        trigger: "POST /monitoring-runs/{run_id}/decision with decision=CERTIFY"
        actor: LiveOpsCommander
        preconditions: ["run.status == COMPUTED"]
        side_effects: ["run.certified_by_user_id = acting X-User-ID; run.version += 1"]
      - from: COMPUTED
        to: VOIDED
        trigger: "POST /monitoring-runs/{run_id}/decision with decision=VOID"
        actor: LiveOpsCommander
        preconditions: ["run.status == COMPUTED"]
        side_effects:
          - "Season.economy_health = resulting_health of the MonitoringRun of this season with status == CERTIFIED and the highest epoch_no, or HEALTHY when no CERTIFIED run exists; Season.version += 1"
          - "already-suspended offers and already-denied purchases are NOT restored (void only rolls back the posture)"
          - "run.certified_by_user_id = acting X-User-ID; run.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-publish-stale-season
    parent_entity: Season
    write_endpoint: "POST /offers/{offer_id}/publish"
    occ_field: "expected_season_version"
    description: |
      Publishing an Offer against a Season whose version has advanced since the
      client last read it is rejected. This captures the case where an inflation
      monitoring run has meanwhile rewritten Season.economy_health, or another
      publish has changed Season.live_offer_count, so the publisher's view of the
      season posture that gated the decision is stale.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412
  - rule_id: purchase-create-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /purchases"
    occ_field: "expected_offer_version"
    description: |
      Creating a Purchase against an Offer whose version has advanced since the
      client last read it is rejected. This captures the case where a newer
      ProbabilityDisclosure has been published or the offer has been re-reviewed
      (both legitimately supersede the priced terms the buyer was shown).
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: balance-change-advance-stale-season
    parent_entity: Season
    write_endpoint: "POST /balance-changes/{change_id}/advance"
    occ_field: "expected_season_version"
    description: |
      Advancing a BalanceChange stage against a Season whose version has advanced
      since the client last read it is rejected. This captures the case where a
      different tuning change has meanwhile gone LIVE and legitimately superseded
      the effective_sink_rate_bp baseline this advance was reasoned against.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: personalized_offer_quote_minor
    trigger: "GET /offers/{offer_id}/quote and POST /purchases (stored as Purchase.quoted_price_minor and Purchase.applied_personalization_bp)"
    algorithm: tiered_pricing
    formula: |
      region_bp = REGION_PRICE_MULTIPLIER_BP[player.region_code]
      tier_bp   = TIER_DISCOUNT_BP[offer.price_tier]
      pers_bp   = min(PERSONALIZATION_CAP_BP, offer.personalization_discount_bp)
                    if player.retention_band == AT_RISK else 0
      # ROUNDING ORDER IS PINNED: round each line twice, THEN sum.
      # "sum the gross lines, then apply the discount once, then round" is FORBIDDEN
      # and produces a different total (e.g. 1740 instead of 1741).
      quote_minor = 0
      for line in offer.line_items ordered by line.sku ASC:
          gross_line = round_half_up(line.base_price_minor * region_bp / 10000)
          net_line   = round_half_up(gross_line * (10000 - tier_bp - pers_bp) / 10000)
          quote_minor += net_line
      applied_personalization_bp = pers_bp
    input_set: "All offer.line_items entries; player.retention_band is read from the STORED Player field (last mutation-time recompute), never recomputed inside the quote"
    constants:
      REGION_PRICE_MULTIPLIER_BP: { NA: 10000, EU: 11000, LATAM: 6500, APAC: 8500 }
      TIER_DISCOUNT_BP: { T1: 0, T2: 500, T3: 1200, T4: 2000 }
      PERSONALIZATION_CAP_BP: 1500
    precision: "integer minor units; round_half_up at each of the two per-line steps"

  - name: offer_fairness_index_bp
    trigger: "POST /offers, POST /offers/{offer_id}/submit and POST /offers/{offer_id}/publish (stored as Offer.fairness_index_bp)"
    algorithm: weighted_scoring
    formula: |
      declared_value_minor = sum(line.declared_value_minor for line in offer.line_items)
      value_ratio_bp       = round_half_up(declared_value_minor * 10000 / offer.list_price_minor)
      window_hours         = floor((offer.window_end - offer.window_start) / 3600)
      scarcity_penalty_bp  = 0    if window_hours >= 72
                             else 500  if window_hours >= 24
                             else 1200
      minor_safety_penalty_bp = 800 if (offer.offer_type == LOOT_BOX and offer.minor_purchasable == true) else 0
      personalization_penalty_bp = min(600, round_half_up(offer.personalization_discount_bp / 5))
      fairness_index_bp = max(0, min(15000,
          value_ratio_bp - scarcity_penalty_bp - minor_safety_penalty_bp - personalization_penalty_bp))
    input_set: "Only the offer's own line_items and configuration; no cross-offer or cohort data"
    constants:
      FAIRNESS_FLOOR_BP: 8000
      FAIRNESS_CEILING_BP: 15000
    precision: "integer basis points; round_half_up"

  - name: season_sink_faucet_ratio_bp
    trigger: "POST /monitoring-runs/{run_id}/compute (variant EPOCH_WINDOWED), every EconomyLedgerEntry append (variant LIFETIME_CUMULATIVE -> Season.lifetime_ratio_bp), and GET /seasons/{season_id}/economy-summary (both variants, computed on read without persisting)"
    algorithm: aggregation
    formula: |
      # Candidate rows: EconomyLedgerEntry with season_id == season.id (immutable, never deleted).
      # ratio_bp(sinks, faucets):
      #     10000 if faucets == 0 and sinks == 0
      #     20000 if faucets == 0 and sinks > 0
      #     min(20000, round_half_up(sinks * 10000 / faucets)) otherwise
      health_band(ratio_bp) = HEALTHY if ratio_bp >= ECONOMY_HEALTHY_FLOOR_BP
                              else WATCH   if ratio_bp >= ECONOMY_WATCH_FLOOR_BP
                              else INFLATED
    input_set: "See variants: the two variants differ on the time window AND on the treatment of compensating (reversal) rows"
    constants:
      ECONOMY_HEALTHY_FLOOR_BP: 6000
      ECONOMY_WATCH_FLOOR_BP: 4000
      RATIO_CEILING_BP: 20000
    precision: "integer basis points; round_half_up"
    variants:
      - name: EPOCH_WINDOWED
        when: "MonitoringRun compute; GET /seasons/{season_id}/economy-summary?variant=EPOCH_WINDOWED (window = the run window of the MonitoringRun of this season with the highest epoch_no whose status IN {COMPUTED, CERTIFIED}, or [season.starts_at, clock] when none exists, or the run with epoch_no == the epoch_no query param when supplied)"
        difference: "NET semantics: rows with occurred_at in [window_start, window_end) only, AND both members of every compensating pair are excluded — a row whose reversal_of_entry_id is set is dropped together with the row it points at."
      - name: LIFETIME_CUMULATIVE
        when: "Season.lifetime_ratio_bp maintenance and GET /seasons/{season_id}/economy-summary?variant=LIFETIME_CUMULATIVE"
        difference: "GROSS semantics: every row of the season counts regardless of occurred_at, including compensating rows and the rows they reverse. Identical ledger data therefore yields a different ratio than EPOCH_WINDOWED whenever any reversal exists."

  - name: player_pacing_bp
    trigger: "POST /players/{player_id}/engagement-events, POST /purchases/{purchase_id}/settlement and POST /monitoring-runs/{run_id}/compute persist variant REALIZED into Player.pacing_bp_realized and Player.retention_band; GET /players/{player_id}/pacing computes either variant on read without persisting"
    algorithm: forward_looking
    formula: |
      season_total_days = floor((season.ends_at - season.starts_at) / 86400)
      elapsed_days      = min(season_total_days, max(0, floor((clock - season.starts_at) / 86400)))
      expected_to_date_xp = round_half_up(season.target_xp_total * elapsed_days / season_total_days)
      eligible_scheduled_xp = sum(e.xp_grant for e in Episode
                                  where e.season_id == season.id
                                    and e.status == SCHEDULED
                                    and e.planned_release_at >= clock)      # overdue drops are EXCLUDED
      retention_band(bp) = HEALTHY   if bp >= RETENTION_HEALTHY_FLOOR_BP
                           else AT_RISK if bp >= RETENTION_AT_RISK_FLOOR_BP
                           else CHURN_RISK
    input_set: "player.season_xp_total (ingested engagement XP only — episode releases grant currency, never XP) plus, for PROJECTED, the SCHEDULED episodes of the player's active season whose planned_release_at is not in the past"
    constants:
      RETENTION_HEALTHY_FLOOR_BP: 9000
      RETENTION_AT_RISK_FLOOR_BP: 6000
      PACING_CEILING_BP: 20000
    precision: "integer basis points; round_half_up; ceiling PACING_CEILING_BP"
    variants:
      - name: REALIZED
        when: "Persisted into Player.pacing_bp_realized and Player.retention_band; the ONLY band the personalization branch of personalized_offer_quote_minor reads"
        difference: "Attainment against the schedule to date: 10000 when expected_to_date_xp == 0, else min(20000, round_half_up(player.season_xp_total * 10000 / expected_to_date_xp))."
      - name: PROJECTED
        when: "GET /players/{player_id}/pacing?variant=PROJECTED only; never persisted, never used for pricing"
        difference: "Full-season forecast including unreleased content: min(20000, round_half_up((player.season_xp_total + eligible_scheduled_xp) * 10000 / season.target_xp_total)). Identical player data yields a different number than REALIZED because the denominator is the full-season target and the numerator absorbs scheduled-but-unreleased XP."

  - name: refund_settlement_minor
    trigger: "POST /refund-requests/{request_id}/decision with decision=APPROVE (values pinned onto the RefundRequest and reused verbatim by execute)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The fee tier is keyed on the Step-2 output
      # (refund_base_minor) and MUST NOT be re-keyed on the Step-5 output
      # (refund_amount_minor), even though the fee is subtracted from the base.
      # Step 1
      consumed_ratio_bp = min(10000, round_half_up(
          purchase.granted_consumed_minor * 10000 / max(1, purchase.granted_total_minor)))
      # Step 2
      refund_base_minor = round_half_up(purchase.price_paid_minor * (10000 - consumed_ratio_bp) / 10000)
      # Step 3 — tier lookup on refund_base_minor ONLY
      fee_tier_bp = 0    if refund_base_minor <  RESTOCK_TIER1_CEILING_MINOR
                    else 500  if refund_base_minor <  RESTOCK_TIER2_CEILING_MINOR
                    else 1000
      # Step 4
      restock_fee_minor = round_half_up(refund_base_minor * fee_tier_bp / 10000)
      # Step 5
      refund_amount_minor = max(0, refund_base_minor - restock_fee_minor)
      # Step 6
      goodwill_credit_minor = round_half_up(restock_fee_minor * GOODWILL_SHARE_BP / 10000)
          if (player has a CurrencyAccount with currency_code == SOFT_COIN
              and player.spend_state != LOCKED) else 0
    input_set: "purchase.price_paid_minor, purchase.granted_total_minor and purchase.granted_consumed_minor as of the APPROVE decision; later consumption does not re-price the refund"
    constants:
      RESTOCK_TIER1_CEILING_MINOR: 1000
      RESTOCK_TIER2_CEILING_MINOR: 5000
      GOODWILL_SHARE_BP: 5000
      REFUND_WINDOW_DAYS: 14
    precision: "integer minor units; round_half_up at Steps 1, 2, 4 and 6"

  - name: player_rolling_spend_minor
    trigger: "POST /purchases/{purchase_id}/settlement, POST /refund-requests/{request_id}/execute and POST /monitoring-runs/{run_id}/compute (stored as Player.spend_30d_minor); also evaluated inside the minor-cap check of POST /purchases"
    algorithm: threshold
    formula: |
      window_start = clock - ROLLING_SPEND_WINDOW_DAYS * 86400
      settled = sum(p.price_paid_minor for p in Purchase
                    where p.player_id == player.id
                      and p.status IN {SETTLED, REFUNDED}
                      and p.settled_at >= window_start and p.settled_at <= clock)
      refunded = sum(r.refund_amount_minor for r in RefundRequest
                     where r.status == EXECUTED
                       and r.purchase.player_id == player.id
                       and r.executed_at >= window_start and r.executed_at <= clock)
      spend_30d_minor = max(0, settled - refunded)
      # gate used by POST /purchases (aggregate, includes not-yet-settled demand):
      projected = player.spend_30d_minor + player.pending_spend_minor + quoted_price_minor
      minor cap breach  <=> player.is_minor and projected >  MINOR_MONTHLY_CAP_MINOR
      cooldown band     <=> spend_30d_minor >= SPEND_COOLDOWN_THRESHOLD_MINOR and < SPEND_LOCK_THRESHOLD_MINOR
      lock band         <=> spend_30d_minor >= SPEND_LOCK_THRESHOLD_MINOR
    input_set: "Purchases with status IN {SETTLED, REFUNDED} whose settled_at is inside the trailing window (inclusive both ends), minus refund_amount_minor of EXECUTED refunds inside the same window"
    constants:
      ROLLING_SPEND_WINDOW_DAYS: 30
      MINOR_MONTHLY_CAP_MINOR: 5000
      SPEND_COOLDOWN_THRESHOLD_MINOR: 40000
      SPEND_LOCK_THRESHOLD_MINOR: 75000
    precision: "integer minor units; boundary is strictly `>` for the minor cap (exact equality is allowed) and `>=` for the cooldown/lock bands"

  - name: cluster_ccu_overlap_load
    trigger: "POST /live-events/{event_id}/approve"
    algorithm: interval_merge
    formula: |
      # Half-open intervals with the maintenance buffer appended to the END only.
      buffer_s = cluster.maintenance_buffer_minutes * 60
      occupied(ev) = [ev.window_start, ev.window_end + buffer_s)
      overlaps(a, b) = a.start < b.end_with_buffer and b.start < a.end_with_buffer
      neighbours = [ev for ev in LiveEvent
                    where ev.capacity_cluster_id == candidate.capacity_cluster_id
                      and ev.id != candidate.id
                      and ev.status IN {APPROVED, RUNNING}
                      and overlaps(candidate, ev)]
      # PINNED: the load is the SUM of every pairwise-overlapping neighbour's
      # forecast plus the candidate's own forecast — NOT a true timeline peak.
      overlap_load_ccu = candidate.forecast_ccu + sum(ev.forecast_ccu for ev in neighbours)
      admissible <=> overlap_load_ccu <= cluster.ccu_capacity
    input_set: "Only events on the same cluster in status APPROVED or RUNNING; PLANNED, COMPLETED, ROLLED_BACK and CANCELLED events are ignored"
    constants: {}
    precision: "integer CCU; boundary is inclusive (exactly ccu_capacity is admissible, capacity + 1 is not)"

  - name: offer_sku_window_conflict
    trigger: "POST /offers/{offer_id}/publish"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a SYMMETRIC cooldown buffer on BOTH sides — deliberately
      # different interval arithmetic from cluster_ccu_overlap_load, and there is no
      # aggregate-capacity notion here: a single collision is fatal.
      cooldown_s = SKU_COOLDOWN_HOURS * 3600
      candidate_skus = { line.sku for line in candidate.line_items }
      siblings = [o for o in Offer
                  where o.season_id == candidate.season_id
                    and o.id != candidate.id
                    and o.availability_status IN {LIVE, SUSPENDED}
                    and ({ line.sku for line in o.line_items } & candidate_skus) != {}]
      conflict(o) = candidate.window_start <= o.window_end   + cooldown_s
                and o.window_start        <= candidate.window_end + cooldown_s
      admissible <=> no sibling satisfies conflict(o)
    input_set: "Offers of the same season with availability_status IN {LIVE, SUSPENDED} sharing at least one line item sku; OFFLINE and WITHDRAWN offers never conflict"
    constants:
      SKU_COOLDOWN_HOURS: 24
    precision: "second resolution; adjacency and any gap shorter than SKU_COOLDOWN_HOURS both count as a conflict"

  - name: season_cadence_debt_days
    trigger: "every Episode transition (schedule / release / rollback) and POST /monitoring-runs/{run_id}/compute (stored as Season.cadence_debt_days and Season.content_posture); GET endpoints return the stored value without recomputing"
    algorithm: chronological
    formula: |
      debt = 0
      for e in Episode where e.season_id == season.id ordered by e.sequence_no ASC:
          if e.status IN {LIVE, CONCLUDED}:
              debt += max(0, floor((e.actual_release_at - e.planned_release_at) / 86400))
          elif e.status == SCHEDULED and e.planned_release_at < clock:
              debt += floor((clock - e.planned_release_at) / 86400)
          debt += ROLLBACK_DEBT_DAYS * e.rollback_count      # applies in every status
      cadence_debt_days = debt
      content_posture   = BEHIND if debt > CADENCE_DEBT_LIMIT_DAYS else ON_TRACK
    input_set: "Every Episode of the season; DRAFT episodes contribute only their rollback debt (which is 0 for an episode that has never gone LIVE)"
    constants:
      ROLLBACK_DEBT_DAYS: 3
      CADENCE_DEBT_LIMIT_DAYS: 14
    precision: "whole days, floor; sequence_no ASC is the pinned order and is unique per season so no tie-break is reachable"

  - name: episode_grant_recipient_set
    trigger: "POST /episodes/{episode_id}/release (selector for CASCADE L1)"
    algorithm: constraint_propagation
    formula: |
      # Eligibility filter (candidate set):
      candidates = [a for a in CurrencyAccount
                    where a.currency_code == SOFT_COIN
                      and a.status == ACTIVE
                      and a.player.active_season_id == episode.season_id
                      and a.player.spend_state != LOCKED]
      # Ranking / processing order: created_at ASC (pinned; never account id).
      order = sort(candidates, key = a.created_at ASC)
      # Tie-break when two accounts share created_at: player.handle ASC (unique).
      # Empty-pool fallback: no error — the release succeeds with
      # Episode.grant_batch_size = 0 and zero ledger entries appended.
      grant_per_account = episode.soft_currency_grant_minor
    input_set: "SOFT_COIN accounts only; HARD_GEM and EVENT_TOKEN accounts are never episode-grant recipients"
    constants: {}
    precision: "integer minor units; every recipient receives exactly grant_per_account (no proration)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-addressed resources exist, validated left to right (season, then episode / offer / disclosure / balance-change / notice, ...)"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_CLUSTER_NOT_FOUND | ERR_LIVE_EVENT_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_CURRENCY_ACCOUNT_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_PURCHASE_NOT_FOUND | ERR_REFUND_REQUEST_NOT_FOUND | ERR_BALANCE_CHANGE_NOT_FOUND | ERR_COMMS_NOTICE_NOT_FOUND | ERR_MONITORING_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 4
    category: existence
    check: "Body foreign keys resolve (season_id, capacity_cluster_id, active_season_id, player_id, offer_id, purchase_id)"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_CLUSTER_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_PURCHASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /episodes, POST /live-events, POST /players, POST /offers, POST /purchases, POST /refund-requests, POST /balance-changes, POST /monitoring-runs, POST /currency-accounts/{account_id}/adjustments"
  - priority: 5
    category: business_constraint
    check: "Request body conforms to the declared schema: required fields present, enums in range, integers within declared bounds, window_end > window_start, ends_at > starts_at, list_price_minor == sum(line_items[].base_price_minor), line item skus unique, delta_bp non-zero, disclosure entries well-formed, pagination limit 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: auth
    check: "A Player role acts only on its own resources: X-User-ID == player_id (POST /purchases, GET /players/{player_id}*), == purchase.player_id (POST /refund-requests, GET /purchases/{purchase_id}), == refund.purchase.player_id (GET /refund-requests/{request_id}), and quote player_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /purchases, POST /refund-requests, GET /players/{player_id}, GET /players/{player_id}/currency-accounts, GET /players/{player_id}/pacing, GET /purchases/{purchase_id}, GET /refund-requests/{request_id}, GET /offers/{offer_id}/quote"
  - priority: 7
    category: state
    check: "OCC: expected_season_version == season.version / expected_offer_version == offer.version"
    error_id: "ERR_STALE_SEASON_VERSION | ERR_STALE_OFFER_VERSION"
    http_status: 412
    applies_to: "POST /offers/{offer_id}/publish, POST /balance-changes/{change_id}/advance, POST /purchases"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: "ERR_SEASON_INVALID_STATE | ERR_EPISODE_INVALID_STATE | ERR_CLUSTER_INVALID_STATE | ERR_EVENT_INVALID_STATE | ERR_OFFER_INVALID_APPROVAL_STATE | ERR_OFFER_INVALID_AVAILABILITY_STATE | ERR_DISCLOSURE_INVALID_STATE | ERR_PURCHASE_INVALID_STATE | ERR_REFUND_INVALID_STATE | ERR_BALANCE_CHANGE_INVALID_STATE | ERR_COMMS_NOTICE_INVALID_STATE | ERR_MONITORING_RUN_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "Cross-entity state gates: owning Season.status (LIVE required for episode release, offer submit/publish, live-event approve, balance-change SHADOW entry), CapacityCluster.status == ACTIVE for approval, CurrencyAccount.status == ACTIVE for adjustments and settlement, Offer.availability_status == LIVE for purchase creation, offer merchandising window still open"
    error_id: "ERR_SEASON_NOT_LIVE | ERR_CLUSTER_NOT_ACTIVE | ERR_CURRENCY_ACCOUNT_FROZEN | ERR_OFFER_NOT_PURCHASABLE | ERR_OFFER_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/release, POST /offers/{offer_id}/submit, POST /offers/{offer_id}/publish, POST /offers/{offer_id}/availability, POST /live-events/{event_id}/approve, POST /purchases, POST /purchases/{purchase_id}/settlement, POST /currency-accounts/{account_id}/adjustments, POST /balance-changes/{change_id}/advance"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: the X-User-ID publishing a CommsNotice differs from balance_change.authored_by_user_id; the X-User-ID reviewing an Offer differs from offer.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /balance-changes/{change_id}/comms-notices/{notice_id}/publish, POST /offers/{offer_id}/review"
  - priority: 11
    category: business_safety
    check: "A minor account may transact only with guardian consent on record"
    error_id: ERR_GUARDIAN_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /purchases"
  - priority: 12
    category: business_safety
    check: "A minor account may only buy offers with minor_purchasable == true"
    error_id: ERR_MINOR_OFFER_FORBIDDEN
    http_status: 422
    applies_to: "POST /purchases"
  - priority: 13
    category: business_safety
    check: "A LOOT_BOX offer may not be published or resumed while disclosure_state == REQUIRED_MISSING, and may not be purchased unless disclosure_state == PUBLISHED"
    error_id: ERR_DISCLOSURE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /offers/{offer_id}/publish, POST /offers/{offer_id}/availability, POST /purchases"
  - priority: 14
    category: business_safety
    check: "Disclosure entries sum to exactly 10000 basis points"
    error_id: ERR_DISCLOSURE_PROBABILITY_SUM
    http_status: 422
    applies_to: "POST /offers/{offer_id}/disclosures, POST /offers/{offer_id}/disclosures/{disclosure_id}/publish"
  - priority: 15
    category: business_safety
    check: "fairness_index_bp >= FAIRNESS_FLOOR_BP at publish time"
    error_id: ERR_FAIRNESS_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /offers/{offer_id}/publish"
  - priority: 16
    category: business_safety
    check: "A tuning change reaches LIVE only after a CommsNotice for it has been published"
    error_id: ERR_COMMS_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /balance-changes/{change_id}/advance"
  - priority: 17
    category: business_constraint
    check: "Season.economy_health != INFLATED for episode release, offer publish, offer resume and balance-change go-live"
    error_id: ERR_ECONOMY_INFLATED_BLOCK
    http_status: 409
    applies_to: "POST /episodes/{episode_id}/release, POST /offers/{offer_id}/publish, POST /offers/{offer_id}/availability, POST /balance-changes/{change_id}/advance"
  - priority: 18
    category: business_constraint
    check: "Season.content_posture != BEHIND when publishing a LIMITED_TIME offer"
    error_id: ERR_CADENCE_DEBT_BLOCK
    http_status: 409
    applies_to: "POST /offers/{offer_id}/publish"
  - priority: 19
    category: business_constraint
    check: "Episode.sequence_no == max(sequence_no of the season's episodes) + 1 at creation, and the predecessor episode is out of DRAFT before scheduling"
    error_id: ERR_EPISODE_SEQUENCE_GAP
    http_status: 422
    applies_to: "POST /episodes, POST /episodes/{episode_id}/schedule"
  - priority: 20
    category: business_constraint
    check: "MonitoringRun.epoch_no == max(epoch_no of the season's runs) + 1 and no other run of the season has status == OPEN"
    error_id: ERR_MONITORING_EPOCH_SEQUENCE
    http_status: 422
    applies_to: "POST /monitoring-runs"
  - priority: 21
    category: business_constraint
    check: "BalanceChange stage advances one step along DRAFT -> SHADOW -> CANARY -> LIVE -> RETIRED (or REVERTED -> SHADOW); no stage may be skipped"
    error_id: ERR_BALANCE_CHANGE_STAGE_SKIP
    http_status: 422
    applies_to: "POST /balance-changes/{change_id}/advance"
  - priority: 22
    category: business_temporal
    check: "Episode.planned_release_at (creation, scheduling and rescheduling) lies inside [season.starts_at, season.ends_at]"
    error_id: ERR_SEASON_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /episodes, POST /episodes/{episode_id}/schedule"
  - priority: 23
    category: business_temporal
    check: "clock >= episode.planned_release_at at release"
    error_id: ERR_EPISODE_NOT_DUE
    http_status: 422
    applies_to: "POST /episodes/{episode_id}/release"
  - priority: 24
    category: business_temporal
    check: "clock <= purchase.settled_at + REFUND_WINDOW_DAYS * 86400 at refund submission"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /refund-requests"
  - priority: 25
    category: business_temporal
    check: "No sku-window conflict per calculations.offer_sku_window_conflict"
    error_id: ERR_OFFER_SKU_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /offers/{offer_id}/publish"
  - priority: 26
    category: business_referential
    check: "Every granted_currency_code in offer.line_items has a CurrencyAccount for the buyer"
    error_id: ERR_CURRENCY_ACCOUNT_MISSING
    http_status: 422
    applies_to: "POST /purchases, POST /purchases/{purchase_id}/settlement"
  - priority: 27
    category: business_referential
    check: "No RefundRequest with status IN {SUBMITTED, APPROVED, EXECUTED} already exists for the purchase"
    error_id: ERR_REFUND_ALREADY_REQUESTED
    http_status: 409
    applies_to: "POST /refund-requests"
  - priority: 28
    category: business_referential
    check: "One CurrencyAccount per (player_id, currency_code)"
    error_id: ERR_DUPLICATE_CURRENCY_ACCOUNT
    http_status: 409
    applies_to: "POST /players/{player_id}/currency-accounts"
  - priority: 29
    category: business_referential
    check: "Season.code unique across seasons; Player.handle unique across players; Offer.sku unique per season; LiveEvent.code unique per season"
    error_id: "ERR_SEASON_CODE_DUPLICATE | ERR_PLAYER_HANDLE_DUPLICATE | ERR_OFFER_SKU_DUPLICATE | ERR_EVENT_CODE_DUPLICATE"
    http_status: 409
    applies_to: "POST /seasons, POST /players, POST /offers, POST /live-events"
  - priority: 30
    category: business_fiscal
    check: "calculations.cluster_ccu_overlap_load <= cluster.ccu_capacity"
    error_id: ERR_CLUSTER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /live-events/{event_id}/approve"
  - priority: 31
    category: business_fiscal
    check: "player.spend_state != LOCKED"
    error_id: ERR_SPEND_LOCKED
    http_status: 422
    applies_to: "POST /purchases, POST /purchases/{purchase_id}/settlement"
  - priority: 32
    category: business_fiscal
    check: "player.spend_state != COOLDOWN when offer.offer_type == LOOT_BOX"
    error_id: ERR_SPEND_COOLDOWN_RESTRICTED
    http_status: 422
    applies_to: "POST /purchases"
  - priority: 33
    category: business_fiscal
    check: "For a minor: spend_30d_minor + pending_spend_minor + quoted_price_minor <= MINOR_MONTHLY_CAP_MINOR (exact equality allowed)"
    error_id: ERR_MINOR_SPEND_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /purchases"
  - priority: 34
    category: business_fiscal
    check: "A SINK adjustment never exceeds the account's balance_minor"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /currency-accounts/{account_id}/adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Seasons -------------------------------------------------------------
  - method: POST
    path: "/seasons"
    description: "Create a season roadmap shell in PLANNED"
    roles: [ContentProducer]
    code: 201
    input: [code, title, starts_at, ends_at, planned_episode_count, target_xp_total, pass_price_minor]
    output: Season
    side_effects: ["Season created with status PLANNED, economy_health HEALTHY, content_posture ON_TRACK, version 1"]
  - method: GET
    path: "/seasons/{season_id}"
    description: "Read one season including all derived economy and cadence fields"
    roles: [ContentProducer, EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/seasons/{season_id}/status"
    description: "Drive the season lifecycle (LIVE / CONCLUDED / ARCHIVED)"
    roles: [ContentProducer, LiveOpsCommander]
    code: 200
    input: [to_status]
    output: Season
    side_effects: ["Season status transition per §1.2 including the CONCLUDED fan-out over episodes, offers, purchases and planned live events", "increments Season.version by 1"]
  - method: GET
    path: "/seasons/{id}/episodes"
    description: "List the episodes of a season (reverse lookup for Episode.season_id)"
    roles: [ContentProducer, EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []
  - method: GET
    path: "/seasons/{season_id}/economy-summary"
    description: "Computed read of the sink/faucet ratio under either variant; never persists"
    roles: [EconomyDesigner, LiveOpsCommander, ComplianceOfficer, ContentProducer]
    code: 200
    input: [variant, "epoch_no?"]
    output: { season_id: string, variant: string, window_start: string, window_end: string, gross_faucet_minor: integer, gross_sink_minor: integer, sink_faucet_ratio_bp: integer, health_band: string, economy_health: string, cadence_debt_days: integer, content_posture: string, effective_sink_rate_bp: integer }
    side_effects: []

  # ---- Episodes ------------------------------------------------------------
  - method: POST
    path: "/episodes"
    description: "Create the next episode of a season in DRAFT"
    roles: [ContentProducer]
    code: 201
    input: [season_id, sequence_no, title, planned_release_at, xp_grant, soft_currency_grant_minor]
    output: Episode
    side_effects: ["sequence gap and season-window checks applied"]
  - method: GET
    path: "/episodes/{episode_id}"
    description: "Read one episode"
    roles: [ContentProducer, EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: []
    output: Episode
    side_effects: []
  - method: POST
    path: "/episodes/{episode_id}/schedule"
    description: "Schedule a DRAFT episode, or reschedule a ROLLED_BACK one (planned_release_at required from ROLLED_BACK)"
    roles: [ContentProducer]
    code: 200
    input: ["planned_release_at?"]
    output: Episode
    side_effects: ["Season.scheduled_episode_count, cadence_debt_days and content_posture recomputed", "increments Season.version by 1"]
  - method: POST
    path: "/episodes/{episode_id}/release"
    description: "Take a scheduled episode LIVE and run the faucet-grant cascade"
    roles: [ContentProducer, LiveOpsCommander]
    code: 200
    input: []
    output: Episode
    side_effects: ["EPISODE_GRANT ledger entries for the selector set, account balances, Season.gross_faucet_minor, Season.lifetime_ratio_bp, previous LIVE episode auto-CONCLUDED", "increments Season.version by 1"]
  - method: POST
    path: "/episodes/{episode_id}/rollback"
    description: "Roll a LIVE episode back and reverse every grant it minted"
    roles: [LiveOpsCommander]
    code: 200
    input: [reason]
    output: Episode
    side_effects: ["EPISODE_ROLLBACK_REVERSAL ledger entries, account balances restored, Season.gross_sink_minor and lifetime_ratio_bp updated, rollback debt added to cadence_debt_days", "increments Season.version by 1"]

  # ---- Capacity clusters ---------------------------------------------------
  - method: POST
    path: "/capacity-clusters"
    description: "Register a serving cluster available to live events"
    roles: [LiveOpsCommander]
    code: 201
    input: [name, region_code, ccu_capacity, "maintenance_buffer_minutes?"]
    output: CapacityCluster
    side_effects: ["Cluster created ACTIVE with reserved_ccu 0"]
  - method: GET
    path: "/capacity-clusters/{cluster_id}"
    description: "Read one cluster including its live reservation total"
    roles: [LiveOpsCommander, ContentProducer, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: []
    output: CapacityCluster
    side_effects: []
  - method: POST
    path: "/capacity-clusters/{cluster_id}/status"
    description: "Drain, reactivate or retire a cluster"
    roles: [LiveOpsCommander]
    code: 200
    input: [to_status]
    output: CapacityCluster
    side_effects: ["increments CapacityCluster.version by 1"]

  # ---- Live events ---------------------------------------------------------
  - method: POST
    path: "/live-events"
    description: "Place an event on the season calendar in PLANNED"
    roles: [ContentProducer]
    code: 201
    input: [season_id, capacity_cluster_id, code, window_start, window_end, forecast_ccu]
    output: LiveEvent
    side_effects: ["No capacity is reserved until approval"]
  - method: GET
    path: "/live-events/{event_id}"
    description: "Read one live event"
    roles: [ContentProducer, LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: []
    output: LiveEvent
    side_effects: []
  - method: GET
    path: "/live-events"
    description: "Filtered list of live events (reverse lookup for season_id and capacity_cluster_id)"
    roles: [ContentProducer, LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: ["season_id?", "capacity_cluster_id?", "status?", "limit?", "offset?"]
    output: LiveEvent[]
    side_effects: []
  - method: POST
    path: "/live-events/{event_id}/approve"
    description: "Reserve cluster CCU for the event after the overlap-load check"
    roles: [LiveOpsCommander]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["CapacityCluster.reserved_ccu += forecast_ccu; reserved_ccu_at_approval snapshotted", "increments CapacityCluster.version by 1"]
  - method: POST
    path: "/live-events/{event_id}/start"
    description: "Move an approved event into RUNNING"
    roles: [LiveOpsCommander]
    code: 200
    input: []
    output: LiveEvent
    side_effects: []
  - method: POST
    path: "/live-events/{event_id}/complete"
    description: "Finish a running event and release its reservation"
    roles: [LiveOpsCommander]
    code: 200
    input: []
    output: LiveEvent
    side_effects: ["CapacityCluster.reserved_ccu -= reserved_ccu_at_approval", "increments CapacityCluster.version by 1"]
  - method: POST
    path: "/live-events/{event_id}/rollback"
    description: "Abort an approved or running event and release its reservation exactly"
    roles: [LiveOpsCommander]
    code: 200
    input: [reason]
    output: LiveEvent
    side_effects: ["CapacityCluster.reserved_ccu -= reserved_ccu_at_approval; reserved_ccu_at_approval = 0", "increments CapacityCluster.version by 1"]

  # ---- Players, accounts, ledger ------------------------------------------
  - method: POST
    path: "/players"
    description: "Provision a player record attached to an active season"
    roles: [LiveOpsCommander]
    code: 201
    input: [handle, region_code, active_season_id, "is_minor?", "guardian_verified?"]
    output: Player
    side_effects: ["Player created with spend_state UNRESTRICTED, retention_band HEALTHY, pacing_bp_realized 10000"]
  - method: GET
    path: "/players/{player_id}"
    description: "Read one player including spend and pacing fields"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner, Player]
    code: 200
    input: []
    output: Player
    side_effects: []
  - method: GET
    path: "/players"
    description: "Filtered list of players (reverse lookup for Player.active_season_id)"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner]
    code: 200
    input: ["active_season_id?", "spend_state?", "retention_band?", "limit?", "offset?"]
    output: Player[]
    side_effects: []
  - method: POST
    path: "/players/{id}/currency-accounts"
    description: "Open a currency account for the player"
    roles: [LiveOpsCommander]
    code: 201
    input: [currency_code]
    output: CurrencyAccount
    side_effects: ["Account created ACTIVE with zero balance"]
  - method: GET
    path: "/players/{id}/currency-accounts"
    description: "List the player's currency accounts (reverse lookup for CurrencyAccount.player_id)"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner, Player]
    code: 200
    input: ["currency_code?", "limit?", "offset?"]
    output: CurrencyAccount[]
    side_effects: []
  - method: POST
    path: "/players/{player_id}/engagement-events"
    description: "Ingest engagement telemetry (XP and sessions) for the player's active season"
    roles: [LiveOpsCommander]
    code: 200
    input: [xp_delta, "sessions_delta?", "occurred_at?"]
    output: Player
    side_effects: ["season_xp_total, session_count, last_active_at updated; pacing_bp_realized and retention_band recomputed (variant REALIZED)", "increments Player.version by 1"]
  - method: POST
    path: "/players/{player_id}/spend-guard"
    description: "Compliance lock or unlock of a player's spending"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: Player
    side_effects: ["LOCK freezes every currency account and denies pending purchases; UNLOCK reactivates the accounts and lands on UNRESTRICTED", "increments Player.version by 1"]
  - method: GET
    path: "/players/{player_id}/pacing"
    description: "Computed read of progression pacing under either variant; never persists"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner, Player]
    code: 200
    input: [variant]
    output: { player_id: string, variant: string, elapsed_days: integer, season_total_days: integer, expected_to_date_xp: integer, eligible_scheduled_xp: integer, season_xp_total: integer, pacing_bp: integer, retention_band: string }
    side_effects: []
  - method: GET
    path: "/currency-accounts/{account_id}"
    description: "Read one currency account with its faucet/sink lifetime totals"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner, Player]
    code: 200
    input: []
    output: CurrencyAccount
    side_effects: []
  - method: POST
    path: "/currency-accounts/{account_id}/adjustments"
    description: "Append an operator faucet or sink flow to the account"
    roles: [LiveOpsCommander]
    code: 201
    input: [direction, amount_minor, source_kind, "purchase_id?"]
    output: CurrencyAccount
    side_effects: ["EconomyLedgerEntry appended (season_id = player.active_season_id); account balance and lifetime totals updated; Season.gross_faucet_minor/gross_sink_minor and lifetime_ratio_bp updated; when purchase_id is supplied with direction SINK and source_kind OFFER_SPEND the purchase's granted_consumed_minor increases", "increments CurrencyAccount.version by 1"]
  - method: GET
    path: "/ledger-entries"
    description: "Filtered ledger read (reverse lookup for currency_account_id, season_id, purchase_id and reversal_of_entry_id)"
    roles: [LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: ["currency_account_id?", "season_id?", "purchase_id?", "reversal_of_entry_id?", "direction?", "source_kind?", "limit?", "offset?"]
    output: EconomyLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/ledger-entries/{entry_id}"
    description: "Read one immutable ledger entry"
    roles: [LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: []
    output: EconomyLedgerEntry
    side_effects: []

  # ---- Offers and disclosures ---------------------------------------------
  - method: POST
    path: "/offers"
    description: "Author a monetization offer in DRAFT / OFFLINE"
    roles: [EconomyDesigner]
    code: 201
    input: [season_id, offer_type, sku, price_tier, list_price_minor, line_items, "personalization_discount_bp?", "minor_purchasable?", window_start, window_end]
    output: Offer
    side_effects: ["fairness_index_bp computed; disclosure_state set to NOT_REQUIRED or REQUIRED_MISSING by offer_type; created_by_user_id recorded"]
  - method: GET
    path: "/offers/{offer_id}"
    description: "Read one offer with both status dimensions and the fairness index"
    roles: [EconomyDesigner, ComplianceOfficer, LiveOpsCommander, ContentProducer, Player]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/offers"
    description: "Filtered offer list (reverse lookup for Offer.season_id)"
    roles: [EconomyDesigner, ComplianceOfficer, LiveOpsCommander, ContentProducer, Player]
    code: 200
    input: ["season_id?", "offer_type?", "approval_status?", "availability_status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/offers/{offer_id}/submit"
    description: "Send a DRAFT offer into compliance review"
    roles: [EconomyDesigner]
    code: 200
    input: []
    output: Offer
    side_effects: ["fairness_index_bp recomputed", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{offer_id}/review"
    description: "Compliance decision on an offer under review (APPROVE or REVISE)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: Offer
    side_effects: ["APPROVE sets approval_status APPROVED; REVISE returns to DRAFT and increments revision_count", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{offer_id}/publish"
    description: "Take an approved offer LIVE on the storefront (OCC on the season)"
    roles: [EconomyDesigner, LiveOpsCommander]
    code: 200
    input: [expected_season_version]
    output: Offer
    side_effects: ["fairness floor, disclosure, sku-window, economy and cadence gates applied; Season.live_offer_count += 1", "increments Season.version by 1", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{offer_id}/availability"
    description: "Suspend, resume or withdraw an offer on the storefront"
    roles: [LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: [to_status, "reason?"]
    output: Offer
    side_effects: ["Season.live_offer_count adjusted; WITHDRAWN denies the offer's pending purchases", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{id}/disclosures"
    description: "Draft a randomized-item probability table for the offer"
    roles: [EconomyDesigner]
    code: 201
    input: [entries]
    output: ProbabilityDisclosure
    side_effects: ["total_probability_bp and expected_value_minor computed; Offer.disclosure_state unchanged until publication"]
  - method: GET
    path: "/offers/{id}/disclosures"
    description: "List the offer's disclosure tables (reverse lookup for ProbabilityDisclosure.offer_id)"
    roles: [EconomyDesigner, ComplianceOfficer, LiveOpsCommander, Player]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProbabilityDisclosure[]
    side_effects: []
  - method: POST
    path: "/offers/{id}/disclosures/{disclosure_id}/publish"
    description: "Publish a probability table, superseding the previous published one"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ProbabilityDisclosure
    side_effects: ["previous PUBLISHED table -> SUPERSEDED; Offer.disclosure_state = PUBLISHED", "increments Offer.version by 1"]
  - method: GET
    path: "/offers/{offer_id}/quote"
    description: "Personalized price quote for one player without creating a purchase"
    roles: [Player, EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: [player_id]
    output: { offer_id: string, player_id: string, region_multiplier_bp: integer, tier_discount_bp: integer, applied_personalization_bp: integer, retention_band: string, quote_minor: integer, line_breakdown: array }
    side_effects: []

  # ---- Purchases -----------------------------------------------------------
  - method: POST
    path: "/purchases"
    description: "Create a PENDING purchase at the personalized quote (OCC on the offer)"
    roles: [Player]
    code: 201
    input: [player_id, offer_id, expected_offer_version]
    output: Purchase
    side_effects: ["quoted_price_minor and applied_personalization_bp pinned; Offer.pending_purchase_count += 1; Season.pending_revenue_minor and Player.pending_spend_minor increased", "increments Offer.version by 1"]
  - method: GET
    path: "/purchases/{purchase_id}"
    description: "Read one purchase"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner, Player]
    code: 200
    input: []
    output: Purchase
    side_effects: []
  - method: GET
    path: "/purchases"
    description: "Filtered purchase list (reverse lookup for Purchase.player_id and Purchase.offer_id)"
    roles: [LiveOpsCommander, ComplianceOfficer, EconomyDesigner]
    code: 200
    input: ["player_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: Purchase[]
    side_effects: []
  - method: POST
    path: "/purchases/{purchase_id}/settlement"
    description: "Settle or deny a pending purchase"
    roles: [LiveOpsCommander]
    code: 200
    input: [outcome, "deny_reason?"]
    output: Purchase
    side_effects: ["SETTLED mints PURCHASE_GRANT ledger entries, updates account balances, Season revenue and ratio fields, Offer.units_sold, Player spend fields and spend_state", "increments Offer.version by 1", "increments Season.version by 1", "increments Player.version by 1"]

  # ---- Refunds -------------------------------------------------------------
  - method: POST
    path: "/refund-requests"
    description: "Player-initiated refund request against a settled purchase"
    roles: [Player]
    code: 201
    input: [purchase_id, reason_code]
    output: RefundRequest
    side_effects: ["refund window and duplicate-request checks applied"]
  - method: GET
    path: "/refund-requests/{request_id}"
    description: "Read one refund request with its pinned settlement amounts"
    roles: [LiveOpsCommander, ComplianceOfficer, Player]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: GET
    path: "/refund-requests"
    description: "Filtered refund list (reverse lookup for RefundRequest.purchase_id)"
    roles: [LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: ["purchase_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: POST
    path: "/refund-requests/{request_id}/decision"
    description: "Compliance approves or denies the refund, pinning the settlement amounts"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: RefundRequest
    side_effects: ["APPROVE pins consumed_ratio_bp, refund_base_minor, restock_fee_minor, refund_amount_minor and goodwill_credit_minor", "increments RefundRequest.version by 1"]
  - method: POST
    path: "/refund-requests/{request_id}/execute"
    description: "Execute an approved refund and run the compensating ledger cascade"
    roles: [LiveOpsCommander]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["REFUND_REVERSAL ledger entries, account balances restored, Season.gross_sink_minor and settled_revenue_minor adjusted, Purchase -> REFUNDED, player spend recomputed and spend_state possibly relaxed", "increments Season.version by 1", "increments Player.version by 1"]

  # ---- Balance changes and comms ------------------------------------------
  - method: POST
    path: "/balance-changes"
    description: "Author a data-driven tuning change in DRAFT"
    roles: [EconomyDesigner]
    code: 201
    input: [season_id, target_kind, delta_bp, rationale, "canary_cohort_pct?"]
    output: BalanceChange
    side_effects: ["authored_by_user_id recorded; comms_state MISSING"]
  - method: GET
    path: "/balance-changes/{change_id}"
    description: "Read one tuning change"
    roles: [EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: []
    output: BalanceChange
    side_effects: []
  - method: GET
    path: "/balance-changes"
    description: "Filtered tuning-change list (reverse lookup for BalanceChange.season_id)"
    roles: [EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: ["season_id?", "stage?", "limit?", "offset?"]
    output: BalanceChange[]
    side_effects: []
  - method: POST
    path: "/balance-changes/{change_id}/advance"
    description: "Advance the rollout stage one step (OCC on the season)"
    roles: [LiveOpsCommander]
    code: 200
    input: [to_stage, expected_season_version]
    output: BalanceChange
    side_effects: ["stage-skip, comms and economy gates applied; CANARY -> LIVE applies delta_bp to Season.effective_sink_rate_bp for SINK_RATE changes; Season.active_tuning_count and tuning_stage_epoch updated", "increments Season.version by 1"]
  - method: POST
    path: "/balance-changes/{change_id}/revert"
    description: "Revert a canary or live tuning change, restoring the pinned baseline"
    roles: [LiveOpsCommander]
    code: 200
    input: [reason]
    output: BalanceChange
    side_effects: ["Season.effective_sink_rate_bp restored to pre_live_sink_rate_bp for LIVE SINK_RATE changes; Season.active_tuning_count -= 1", "increments Season.version by 1"]
  - method: POST
    path: "/balance-changes/{id}/comms-notices"
    description: "Draft a community notice for the tuning change"
    roles: [EconomyDesigner, LiveOpsCommander]
    code: 201
    input: [channel, headline, body]
    output: CommsNotice
    side_effects: ["BalanceChange.comms_state = DRAFTED", "increments BalanceChange.version by 1"]
  - method: GET
    path: "/balance-changes/{id}/comms-notices"
    description: "List the notices of a tuning change (reverse lookup for CommsNotice.balance_change_id)"
    roles: [EconomyDesigner, LiveOpsCommander, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommsNotice[]
    side_effects: []
  - method: POST
    path: "/balance-changes/{id}/comms-notices/{notice_id}/publish"
    description: "Publish a community notice (segregation of duties against the change author)"
    roles: [ComplianceOfficer, LiveOpsCommander]
    code: 200
    input: []
    output: CommsNotice
    side_effects: ["BalanceChange.comms_state = PUBLISHED", "increments BalanceChange.version by 1"]

  # ---- Inflation monitoring ----------------------------------------------
  - method: POST
    path: "/monitoring-runs"
    description: "Open the next inflation-monitoring epoch for a season"
    roles: [LiveOpsCommander]
    code: 201
    input: [season_id, epoch_no, window_start, window_end]
    output: MonitoringRun
    side_effects: ["epoch sequence and single-OPEN-run checks applied"]
  - method: GET
    path: "/monitoring-runs/{run_id}"
    description: "Read one monitoring run"
    roles: [LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: []
    output: MonitoringRun
    side_effects: []
  - method: GET
    path: "/monitoring-runs"
    description: "Filtered monitoring-run list (reverse lookup for MonitoringRun.season_id)"
    roles: [LiveOpsCommander, EconomyDesigner, ComplianceOfficer]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: MonitoringRun[]
    side_effects: []
  - method: POST
    path: "/monitoring-runs/{run_id}/compute"
    description: "Run the epoch checkpoint: recompute the ratio, rewrite the season posture and cascade"
    roles: [LiveOpsCommander]
    code: 200
    input: []
    output: MonitoringRun
    side_effects: ["Season.economy_health rewritten; INFLATED suspends LIVE LOOT_BOX offers, denies their pending purchases and decrements pending revenue; every player of the season has spend and pacing fields recomputed", "increments Season.version by 1"]
  - method: POST
    path: "/monitoring-runs/{run_id}/decision"
    description: "Certify or void a computed monitoring run"
    roles: [LiveOpsCommander]
    code: 200
    input: [decision]
    output: MonitoringRun
    side_effects: ["VOID restores Season.economy_health from the latest CERTIFIED run (or HEALTHY) without un-suspending offers", "increments Season.version by 1 on VOID"]

  # ---- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. The startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the clock reads that instant and never falls back to real wall-clock time."
    roles: [LiveOpsCommander]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No entity is mutated; all subsequent clock reads use the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Player role acting on or reading a resource that does not belong to the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "CommsNotice publisher equals the change's authored_by_user_id, or offer reviewer equals created_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: missing required field, unknown enum member, out-of-range integer, non-positive window, list_price_minor != sum of line base prices, duplicate line sku, pagination out of bounds"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season_id in path or body does not resolve"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "episode_id does not resolve"
  - id: ERR_CLUSTER_NOT_FOUND
    http: 404
    condition: "capacity_cluster_id in path or body does not resolve"
  - id: ERR_LIVE_EVENT_NOT_FOUND
    http: 404
    condition: "event_id does not resolve"
  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "player_id in path or body does not resolve"
  - id: ERR_CURRENCY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id does not resolve, or is not owned by the player in the path"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "entry_id does not resolve"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer_id in path or body does not resolve"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosure_id does not resolve, or belongs to another offer"
  - id: ERR_PURCHASE_NOT_FOUND
    http: 404
    condition: "purchase_id in path or body does not resolve"
  - id: ERR_REFUND_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id does not resolve"
  - id: ERR_BALANCE_CHANGE_NOT_FOUND
    http: 404
    condition: "change_id does not resolve"
  - id: ERR_COMMS_NOTICE_NOT_FOUND
    http: 404
    condition: "notice_id does not resolve, or belongs to another balance change"
  - id: ERR_MONITORING_RUN_NOT_FOUND
    http: 404
    condition: "run_id does not resolve"
  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_season_version != season.version on offer publish or balance-change advance"
  - id: ERR_STALE_OFFER_VERSION
    http: 412
    condition: "expected_offer_version != offer.version on purchase creation"
  - id: ERR_SEASON_INVALID_STATE
    http: 409
    condition: "Requested season status transition does not exist from the current status"
  - id: ERR_EPISODE_INVALID_STATE
    http: 409
    condition: "Episode is not in a state from which the requested schedule / release / rollback exists"
  - id: ERR_CLUSTER_INVALID_STATE
    http: 409
    condition: "Requested cluster status transition does not exist, or retirement attempted with reserved_ccu > 0"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "Live event is not in a state from which the requested approve / start / complete / rollback exists"
  - id: ERR_OFFER_INVALID_APPROVAL_STATE
    http: 409
    condition: "Offer approval dimension is not in DRAFT for submit or IN_REVIEW for review, or publish attempted while approval_status != APPROVED"
  - id: ERR_OFFER_INVALID_AVAILABILITY_STATE
    http: 409
    condition: "Offer availability dimension does not permit the requested publish / suspend / resume / withdraw"
  - id: ERR_DISCLOSURE_INVALID_STATE
    http: 409
    condition: "Disclosure is not DRAFT when publication is attempted"
  - id: ERR_PURCHASE_INVALID_STATE
    http: 409
    condition: "Purchase is not PENDING for settlement, or not SETTLED when a refund is requested or executed"
  - id: ERR_REFUND_INVALID_STATE
    http: 409
    condition: "Refund request is not SUBMITTED for a decision or not APPROVED for execution"
  - id: ERR_BALANCE_CHANGE_INVALID_STATE
    http: 409
    condition: "Tuning change is not in a stage from which the requested advance or revert exists"
  - id: ERR_COMMS_NOTICE_INVALID_STATE
    http: 409
    condition: "Notice is already PUBLISHED, or the owning change is RETIRED/REVERTED"
  - id: ERR_MONITORING_RUN_INVALID_STATE
    http: 409
    condition: "Run is not OPEN for compute or not COMPUTED for a decision"
  - id: ERR_SEASON_NOT_LIVE
    http: 409
    condition: "Owning season is not LIVE for episode release, offer submit/publish, live-event approval or balance-change SHADOW entry"
  - id: ERR_CLUSTER_NOT_ACTIVE
    http: 409
    condition: "Capacity cluster is DRAINING or RETIRED when an event approval is attempted"
  - id: ERR_CURRENCY_ACCOUNT_FROZEN
    http: 409
    condition: "Currency account status is FROZEN when an adjustment or settlement grant is attempted"
  - id: ERR_OFFER_NOT_PURCHASABLE
    http: 409
    condition: "Offer availability_status is not LIVE when a purchase is created"
  - id: ERR_OFFER_WINDOW_CLOSED
    http: 409
    condition: "clock is past offer.window_end at publish, resume or purchase"
  - id: ERR_GUARDIAN_VERIFICATION_REQUIRED
    http: 422
    condition: "Minor account purchasing without guardian_verified"
  - id: ERR_MINOR_OFFER_FORBIDDEN
    http: 422
    condition: "Minor account purchasing an offer with minor_purchasable == false"
  - id: ERR_DISCLOSURE_NOT_PUBLISHED
    http: 422
    condition: "LOOT_BOX offer published, resumed or purchased while disclosure_state != PUBLISHED"
  - id: ERR_DISCLOSURE_PROBABILITY_SUM
    http: 422
    condition: "Disclosure entries do not sum to exactly 10000 basis points"
  - id: ERR_FAIRNESS_FLOOR_BREACH
    http: 422
    condition: "fairness_index_bp < 8000 at publish"
  - id: ERR_COMMS_NOTICE_REQUIRED
    http: 422
    condition: "Advance to LIVE attempted while comms_state != PUBLISHED"
  - id: ERR_ECONOMY_INFLATED_BLOCK
    http: 409
    condition: "Season.economy_health == INFLATED blocks episode release, offer publish, offer resume or go-live"
  - id: ERR_CADENCE_DEBT_BLOCK
    http: 409
    condition: "Season.content_posture == BEHIND blocks publishing a LIMITED_TIME offer"
  - id: ERR_EPISODE_SEQUENCE_GAP
    http: 422
    condition: "sequence_no is not max + 1, or the predecessor episode is still DRAFT at scheduling"
  - id: ERR_MONITORING_EPOCH_SEQUENCE
    http: 422
    condition: "epoch_no is not max + 1 for the season, or another run of the season is still OPEN"
  - id: ERR_BALANCE_CHANGE_STAGE_SKIP
    http: 422
    condition: "to_stage is not the single next stage from the current stage"
  - id: ERR_SEASON_WINDOW_VIOLATION
    http: 422
    condition: "planned_release_at outside [season.starts_at, season.ends_at]"
  - id: ERR_EPISODE_NOT_DUE
    http: 422
    condition: "Release attempted before episode.planned_release_at"
  - id: ERR_REFUND_WINDOW_EXPIRED
    http: 422
    condition: "Refund requested more than 14 days after settled_at"
  - id: ERR_OFFER_SKU_WINDOW_CONFLICT
    http: 422
    condition: "Publishing would collide with a LIVE or SUSPENDED offer sharing a line item sku within the 24-hour cooldown on either side"
  - id: ERR_CURRENCY_ACCOUNT_MISSING
    http: 422
    condition: "Buyer has no CurrencyAccount for a granted_currency_code required by the offer"
  - id: ERR_REFUND_ALREADY_REQUESTED
    http: 409
    condition: "A SUBMITTED, APPROVED or EXECUTED refund request already exists for the purchase"
  - id: ERR_DUPLICATE_CURRENCY_ACCOUNT
    http: 409
    condition: "The player already holds an account in that currency"
  - id: ERR_SEASON_CODE_DUPLICATE
    http: 409
    condition: "Season code already exists"
  - id: ERR_PLAYER_HANDLE_DUPLICATE
    http: 409
    condition: "Player handle already exists"
  - id: ERR_OFFER_SKU_DUPLICATE
    http: 409
    condition: "Offer sku already exists inside the season"
  - id: ERR_EVENT_CODE_DUPLICATE
    http: 409
    condition: "Live event code already exists inside the season"
  - id: ERR_CLUSTER_CAPACITY_EXCEEDED
    http: 422
    condition: "Overlap load would exceed cluster.ccu_capacity at approval"
  - id: ERR_SPEND_LOCKED
    http: 422
    condition: "Player spend_state is LOCKED at purchase creation or settlement"
  - id: ERR_SPEND_COOLDOWN_RESTRICTED
    http: 422
    condition: "Player spend_state is COOLDOWN and the offer_type is LOOT_BOX"
  - id: ERR_MINOR_SPEND_CAP_EXCEEDED
    http: 422
    condition: "Minor's rolling spend plus pending spend plus this quote would exceed 5000 minor units"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "SINK adjustment amount exceeds the account's balance_minor"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContentProducer
    description: "Owns the season and content roadmap: seasons, episode cadence and the event calendar"
    identity: opaque
    exclusive_operations:
      - "POST /seasons"
      - "POST /episodes"
      - "POST /episodes/{episode_id}/schedule"
      - "POST /live-events"
    shared_operations:
      - "POST /seasons/{season_id}/status (with LiveOpsCommander)"
      - "POST /episodes/{episode_id}/release (with LiveOpsCommander)"
      - "GET season, episode, live-event, cluster, offer and economy-summary reads"
  - name: EconomyDesigner
    description: "Designs the virtual economy: offers, pricing tiers, disclosure tables and tuning changes"
    identity: opaque
    exclusive_operations:
      - "POST /offers"
      - "POST /offers/{offer_id}/submit"
      - "POST /offers/{offer_id}/disclosures"
      - "POST /balance-changes"
    shared_operations:
      - "POST /offers/{offer_id}/publish (with LiveOpsCommander)"
      - "POST /balance-changes/{change_id}/comms-notices (with LiveOpsCommander)"
      - "GET offer, disclosure, quote, ledger, player, purchase, balance-change and monitoring reads"
  - name: LiveOpsCommander
    description: "Runs live operations: capacity, event execution, settlements, refund execution, tuning rollout and inflation monitoring"
    identity: opaque
    exclusive_operations:
      - "POST /capacity-clusters"
      - "POST /capacity-clusters/{cluster_id}/status"
      - "POST /live-events/{event_id}/approve"
      - "POST /live-events/{event_id}/start"
      - "POST /live-events/{event_id}/complete"
      - "POST /live-events/{event_id}/rollback"
      - "POST /episodes/{episode_id}/rollback"
      - "POST /players"
      - "POST /players/{player_id}/currency-accounts"
      - "POST /players/{player_id}/engagement-events"
      - "POST /currency-accounts/{account_id}/adjustments"
      - "POST /purchases/{purchase_id}/settlement"
      - "POST /refund-requests/{request_id}/execute"
      - "POST /balance-changes/{change_id}/advance"
      - "POST /balance-changes/{change_id}/revert"
      - "POST /monitoring-runs"
      - "POST /monitoring-runs/{run_id}/compute"
      - "POST /monitoring-runs/{run_id}/decision"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /seasons/{season_id}/status (with ContentProducer)"
      - "POST /episodes/{episode_id}/release (with ContentProducer)"
      - "POST /offers/{offer_id}/publish (with EconomyDesigner)"
      - "POST /offers/{offer_id}/availability (with ComplianceOfficer)"
      - "POST /balance-changes/{change_id}/comms-notices (with EconomyDesigner)"
      - "POST /balance-changes/{change_id}/comms-notices/{notice_id}/publish (with ComplianceOfficer)"
      - "all GET reads except the Player-scoped quote path restrictions"
  - name: ComplianceOfficer
    description: "Owns player protection: offer review, disclosure publication, refund decisions and spend guards"
    identity: opaque
    exclusive_operations:
      - "POST /offers/{offer_id}/review"
      - "POST /offers/{offer_id}/disclosures/{disclosure_id}/publish"
      - "POST /players/{player_id}/spend-guard"
      - "POST /refund-requests/{request_id}/decision"
    shared_operations:
      - "POST /offers/{offer_id}/availability (with LiveOpsCommander)"
      - "POST /balance-changes/{change_id}/comms-notices/{notice_id}/publish (with LiveOpsCommander)"
      - "GET player, purchase, refund, offer, disclosure, ledger, balance-change and monitoring reads"
  - name: Player
    description: "The buying player; may transact and read only its own resources"
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /purchases"
      - "POST /refund-requests"
    shared_operations:
      - "GET /players/{player_id} and /players/{player_id}/currency-accounts and /players/{player_id}/pacing (own id only)"
      - "GET /purchases/{purchase_id} and /refund-requests/{request_id} (own purchases only)"
      - "GET /offers, /offers/{offer_id}, /offers/{offer_id}/disclosures, /offers/{offer_id}/quote (own player_id only)"
