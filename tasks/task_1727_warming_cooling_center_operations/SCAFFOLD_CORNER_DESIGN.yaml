  - section: rbac
    instances:
      - name: transport_coordinator_cannot_open_site
        claim_type: rbac_denial
        grounds: ["roles[TransportCoordinator]", "roles[SiteLead]"]
        distinguishing_aspect: "open is SiteLead-exclusive; TransportCoordinator gets ERR_FORBIDDEN even when the activation would otherwise be openable."
        test_recipe:
          setup: ["Episode STANDBY; SiteActivation OPENING"]
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "WARMING", threshold_f: 32.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Armory", address: "9 Oak Ave", bed_capacity: 10, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - { call: "POST /api/episodes/${ep}/site-activations", payload: { site_id: "${site}" }, as: EOCManager }
            - call: "GET /api/site-activations"
              as: TransportCoordinator
              captures: { sa: "$.data[0].id" }
          trigger:
            - call: "POST /api/site-activations/${sa}/open"
              payload: {}
              as: TransportCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403"
      - name: outreach_worker_cancels_own_requested_dispatch
        claim_type: rbac_allowed
        grounds: ["roles[OutreachWorker]", state_machines.TransportDispatch.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "cancel is a shared operation (OutreachWorker + TransportCoordinator); cancelling a REQUESTED (never assigned) dispatch creates no stay side effects and reserved_bed_count stays 0."
        test_recipe:
          setup: ["Episode ACTIVE; SiteActivation OPEN; dispatch REQUESTED for one guest"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Outreach One", skills: ["OUTREACH"] }
              as: EOCManager
              captures: { out1: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${lead1}", role_on_shift: "SITE_LEAD", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-11T06:00:00Z" }
              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/guests"
              payload: { alias: "rider" }
              as: IntakeStaff
              as_user_id: "${lead1}"
              captures: { g1: $.data.id }
            - call: "POST /api/transport-dispatches"
              payload: { site_activation_id: "${sa}", guest_ids: ["${g1}"], pickup_window_start: "2026-08-10T14:00:00Z", pickup_window_end: "2026-08-10T15:00:00Z" }
              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { disp: $.data.id }
          trigger:
            - call: "POST /api/transport-dispatches/${disp}/cancel"
              payload: {}
              as: OutreachWorker
              as_user_id: "${out1}"
              captures: { st: $.data.status }
            - call: "GET /api/stays?transport_dispatch_id=${disp}"
              as: EOCManager
          assert:
