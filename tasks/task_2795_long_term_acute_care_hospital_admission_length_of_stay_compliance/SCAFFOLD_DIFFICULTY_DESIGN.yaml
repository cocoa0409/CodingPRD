  - rule_id: priority_pair_validation_conflict
    instances:
      - name: admit_rejected_with_not_eligible_outranking_already_admitted
        grounds:
          - validations.priority_9_ERR_REFERRAL_NOT_ELIGIBLE
          - validations.priority_10_ERR_PATIENT_ALREADY_ADMITTED
          - validations.priority_6_ERR_INVALID_STATE
        distinguishing_aspect: |
          The conflicting pair is safety-versus-referential on ONE admit call: the patient already has
          an ADMITTED stay (priority 10) AND the referral being admitted screened CRITERIA_NOT_MET
          (priority 9). Priority 6's carve-out deliberately hands the CRITERIA_NOT_MET status to
          priority 9, so the response must be ERR_REFERRAL_NOT_ELIGIBLE (422) - the clinical reason -
          and never ERR_PATIENT_ALREADY_ADMITTED (409) or ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded."
            - "Patient Cora Twice is admitted on referral A (PMV track: vent 240h, ICU 5d) and her stay is still ADMITTED."
            - "Referral B is then created for the SAME patient with complete but non-qualifying data (vent 10h, ICU 0d, wound stage 1, count 0) and screens CRITERIA_NOT_MET."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
