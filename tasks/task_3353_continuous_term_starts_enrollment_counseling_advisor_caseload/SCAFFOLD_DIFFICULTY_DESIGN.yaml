            - call: "POST /api/enrollments/${enr_id}/defer"
              payload: { to_state: "REGISTERED" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "REGISTERED -> DEFERRED succeeds (cycle first leg)"
            - "at clock 2026-10-20 (> census 2026-10-19) with package still PACKAGED, Enrollment.financial_hold == true"
            - "DEFERRED -> REGISTERED rejected ERR_FINANCIAL_HOLD"

  # ------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cascades_package_return_schedule_cancel_section_reopen
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.FinancialAidPackage.DISBURSING_to_RETURNED
          - state_machines.CourseSection.LOCKED_to_OPEN
        distinguishing_aspect: |
          Depth-3 chain from POST /api/enrollments/{id}/withdraw: Enrollment ->
          WITHDRAWN (link 1) mutates CourseSection seats (enrolled_count 1 -> 0,
          LOCKED -> OPEN — link 2 caused by the enrollment mutation) and mutates
          FinancialAidPackage DISBURSING -> RETURNED (link 2') which itself
          flips schedule entries SCHEDULED -> CANCELLED and DISBURSED ->
          RETURNED (link 3 caused by the package mutation, not the withdraw).
        test_recipe:
          setup:
            - "Term IN_SESSION (clock 2026-10-19); E FULL_TIME REGISTERED->ACTIVE; package CERTIFIED efc 0 (certified 739500, schedule 369750@10-19 + 369750@11-09); on IN_SESSION advance entry 1 DISBURSED, disbursed 369750, package DISBURSING"
            - "Section S (cap 1, forecast 1) OPEN with E rostered -> LOCKED"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
