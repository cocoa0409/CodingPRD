              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 9999 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b_id: $.data.id }
            - call: "GET /marketplace/charges?booking_id=${b_id}"
              payload: {}
              as: OpsAdmin
              captures: { c_fee: "$.data[0].marketplace_fee_cents", c_proc: "$.data[0].processing_cents", c_net: "$.data[0].net_to_practice_cents" }
          assert:
            - "captured marketplace_fee_cents == 1500"
            - "captured processing_cents == 320"
            - "captured net_to_practice_cents == 8179"

      - name: invoice_tier_evaluation_order
        grounds:
          - calculations.calc_invoice_aggregate
          - entities.Invoice.fields.discount_tier
          - entities.Invoice.fields.discount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the tier depends on charge_count,
          the discount depends on fee_total (sum of per-charge ROUNDED fees), and
          the discount must NOT flow back into per-charge fees — pinned order
          count -> tier -> discount on fee_total. 11 charges of copay 20000 give
          fee_total 33000, discount 3300, amount_due 29700.
        test_recipe:
          setup:
            - "PER_BOOKING practice (ACTIVE) with one ACTIVE provider"
            - "Appointment type copay 20000; 11 non-overlapping OPEN slots"
            - "One patient books all 11 slots (all ATTRIBUTED)"
            - "Invoice generated for period 2026-09"
