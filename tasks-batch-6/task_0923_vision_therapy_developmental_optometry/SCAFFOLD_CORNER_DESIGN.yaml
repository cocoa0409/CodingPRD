      - name: referral_re_refer_cap_writes_abandoned_then_rejects
        claim_type: cyclic
        grounds:
          - state_machines.Referral.DECLINED_to_ABANDONED
          - validations[priority=33]
          - errors[ERR_REFERRAL_ATTEMPT_LIMIT]
          - entities.Referral.fields.attempt_count
        distinguishing_aspect: "The second mutate-then-reject rung: at attempt_count 3 the re-refer first commits status ABANDONED and only then raises ERR_REFERRAL_ATTEMPT_LIMIT, so the durable state is ABANDONED even though the response is a 409."
        test_recipe:
          setup:
            - "One INBOUND ROUTINE referral that has been declined, re-referred, declined, re-referred and declined again, so attempt_count is 3 and status is DECLINED."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
