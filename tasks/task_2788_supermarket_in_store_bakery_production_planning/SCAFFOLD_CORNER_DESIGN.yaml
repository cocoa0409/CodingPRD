              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
          trigger:
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MORNING", forecasted_units: 40 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MIDDAY", forecasted_units: 40 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v2: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v2}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "GET /bakery/production-runs?bake_day_id=${bd_id}&product_id=${crois_id}"
