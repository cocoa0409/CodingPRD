      - name: suspend_with_open_claim_blocked_then_succeeds
        claim_type: conditional_action
        grounds:
          - validations[priority=20]
          - errors[ERR_OPEN_CLAIMS_BLOCK_TRANSITION]
        distinguishing_aspect: "Suspending a provider with a SUBMITTED claim fails with ERR_OPEN_CLAIMS_BLOCK_TRANSITION; after the claim is denied, the same suspend succeeds."
        test_recipe:
          setup: ["Receiver R has one claim UNDER_REVIEW for a completed referral"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord", network_escrow_cents: 100000 }
