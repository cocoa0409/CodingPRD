              as: Seller
              as_user_id: "${s_id}"
              captures: { pr_on_boundary: $.data.id }
            - call: "POST /marketplace/leases/${lease_id}/payment-records"
              payload: { due_date: "2026-02-01T00:00:00Z", paid_date: "2026-02-06T00:00:01Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { pr_past: $.data.id }
          assert:
            - "PaymentRecord.${pr_on_boundary}.late == false (exactly at due+5d boundary; strict >)"
            - "PaymentRecord.${pr_past}.late == true (one second past the boundary)"

