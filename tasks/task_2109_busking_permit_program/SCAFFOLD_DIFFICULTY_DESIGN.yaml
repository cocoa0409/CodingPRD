          setup:
            - "Zone OT has quiet hours from minute 1260 (21:00Z) to minute 480 (08:00Z) and holds pitch OT-01 with max_session_minutes 120 and daily_session_cap 2."
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit with the 5400-cent invoice paid."
