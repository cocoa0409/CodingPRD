      - name: high_cycle_rate_needs_a_predecessor_and_fires_only_above_the_tolerance
        claim_type: Constants Applied
        grounds:
          - calculations.telemetry_alert_evaluation
          - entities.MachineModel.fields.racks_per_hour
        distinguishing_aspect: |
          CYCLE_RATE_TOLERANCE turns 60 racks/hour into a 66/hour trip point, and all three cases are
          probed on one machine: the first reading can never fire the alert (no predecessor), 66 racks in
          exactly one hour is NOT a breach because the comparison is strictly greater, and 67 racks in
          one hour is. A fourth reading at 167 racks/hour then proves the alert is de-duplicated rather
          than re-raised.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement with initial_cycle_count 0, installed at 2026-08-01T00:00:00Z."
            - "The first reading is posted while the clock is at 00:00; the clock is then advanced to 03:00 so the later reading_at values are not in the future."
            - "All temperatures and pressures are compliant, and 300 cycles stay far below max_cycles_between_calibrations."
