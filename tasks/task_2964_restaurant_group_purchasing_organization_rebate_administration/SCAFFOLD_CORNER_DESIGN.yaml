      - name: supersede_without_an_approved_incumbent_is_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - endpoints["POST /rate-cards"]
        distinguishing_aspect: |
          The supersede flag decides WHICH check runs: with supersede == true the
          priority-20 overlap check is skipped, so the identical window that
          would otherwise return ERR_RATE_CARD_PERIOD_OVERLAP instead reaches
          priority 21 and returns ERR_NO_INCUMBENT_RATE_CARD because the only
          existing card is still PROPOSED. Approving that card then makes the very
          same supersede call succeed.
        test_recipe:
          setup:
            - "Deal PBC-2026 is DRAFT with item BEEF-PATTY-4OZ-CS40."
            - "One card rc1 exists for 2026-01-01..2028-12-31 at PER_CASE 100 and is still PROPOSED — it has never been approved."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 100, effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc1_id: $.data.id }
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v2: $.data.version }
          trigger:
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-06-01", effective_to: "2028-12-31", supersede: true }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-06-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /rate-cards/${rc1_id}/approve"
              as: GpoAdmin
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v3: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v3}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-06-01", effective_to: "2028-12-31", supersede: true }
              as: GpoAdmin
              captures: { rc2_id: $.data.id }
          assert:
            - "call 1: 409 with error_id == ERR_NO_INCUMBENT_RATE_CARD — supersede suppressed the overlap check, so the failure is about the missing APPROVED incumbent"
            - "call 2: 409 with error_id == ERR_RATE_CARD_PERIOD_OVERLAP — the SAME window without supersede fails the earlier check instead, proving the two rules are ordered by the flag"
            - "neither rejected call bumped the parent: ContractedItem.${item_id}.version == ${item_v2} still, and GET /rate-cards returns total_count == 1"
            - "call 5: 201 with status == PROPOSED and supersedes_rate_card_id == ${rc1_id}"
            - "RateCard.${rc1_id}.status == SUPERSEDED with effective_to == 2026-05-31, and ContractedItem.${item_id}.approved_rate_card_count == 0 after the truncation"
            - "ContractedItem.${item_id}.version == ${item_v3} + 1 — exactly one increment for the successful create, whether or not supersede fired"

      - name: child_writes_are_blocked_while_the_parent_deal_is_suspended
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - state_machines.ManufacturerDeal.ACTIVE_to_SUSPENDED
          - errors.ERR_DEAL_NOT_OPEN_FOR_CHANGES
        distinguishing_aspect: |
          The legality of a ContractedItem or RateCard write depends entirely on a
          DIFFERENT row's state: identical payloads succeed while the deal is
          DRAFT or ACTIVE, fail while it is SUSPENDED, and succeed again after
          resume. Both child endpoints must be gated, and the gate admits DRAFT as
          well as ACTIVE, so an implementation that only allows ACTIVE is wrong at
          setup time.
        test_recipe:
          setup:
            - "Deal PBC-2026 was created DRAFT, given item PBC-PATTY-4OZ with an APPROVED PER_CASE 150 card, then activated."
            - "The deal is then suspended, so its status is SUSPENDED while all of its children remain ACTIVE/APPROVED."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/suspend"
              as: GpoAdmin
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v2: $.data.version }
          trigger:
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-BRISKET-WHOLE", normalized_item_key: "BEEF-BRISKET-CS20", pack_size: 20, baseline_unit_cost_cents: 14200, contract_unit_cost_cents: 13100 }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 175, effective_from: "2029-01-01", effective_to: "2029-12-31" }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /manufacturer-deals/${deal_id}/resume"
              as: GpoAdmin
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-BRISKET-WHOLE", normalized_item_key: "BEEF-BRISKET-CS20", pack_size: 20, baseline_unit_cost_cents: 14200, contract_unit_cost_cents: 13100 }
              as: GpoAdmin
              captures: { item2_id: $.data.id }
          assert:
            - "call 1: 409 with error_id == ERR_DEAL_NOT_OPEN_FOR_CHANGES — the payload is perfectly valid, only the parent's state is wrong"
            - "call 2: 409 with error_id == ERR_DEAL_NOT_OPEN_FOR_CHANGES — the same gate covers the grandchild write, and the window 2029-01-01..2029-12-31 overlaps nothing, so overlap is not the reason"
            - "neither rejected call stored anything: GET /contracted-items with deal_id == ${deal_id} returns total_count == 1, GET /rate-cards returns total_count == 1, and ContractedItem.${item_id}.version == ${item_v2}"
            - "call 3: 200 with ManufacturerDeal.${deal_id}.status == ACTIVE"
            - "call 4: 201 — the identical payload now succeeds, so the rejection was purely the parent state"
            - "ContractedItem.${item2_id}.status == ACTIVE with approved_rate_card_count == 0, and the item created while the deal was DRAFT (${item_id}) is untouched"

      - name: a_reconciled_period_refuses_a_restated_claim
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - state_machines.ManufacturerClaim.SUBMITTED_to_SUPERSEDED
          - errors.ERR_CLAIM_PERIOD_ALREADY_RECONCILED
        distinguishing_aspect: |
          Restatement is legal only while the incumbent claim is still open: once a
          claim for (deal, period) has reached RECONCILED, a new claim for the
          SAME period is refused outright rather than superseding it, while a
          claim for a different period is still accepted. The rejected call must
          also leave ManufacturerDeal.version alone, even though a successful
          claim create bumps it.
        test_recipe:
          setup:
            - "Member Harbor Grill ACTIVE, Deal PBC-2026 ACTIVE with an APPROVED PER_CASE 150 card."
            - "The June batch holds one 30-case line, has been normalized and accrued (gross 4500), so nothing overlapping June is left in RECEIVED or NORMALIZED."
            - "Claim cl1 for 2026-06-01..2026-06-30 with claimed_units 30 and claimed_amount_cents 4500 has been reconciled at variance_bps 0."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
