    roles: [Pro]
    code: 201
    input: ["description", "unit_cost_cents", "quantity", "from_truck_stock?"]
    output: PartLine
    side_effects: ["computes line_total_cents per part_line_pricing"]
  - method: GET
    path: "/jobs/{id}/part-lines"
    description: "list part lines for a job (FK reverse-reachability for PartLine.job_id)"
