  - section: state_machines
    instances:

      - name: hall_initial_state_is_planning
        claim_type: initial_state
        grounds:
          - state_machines.Hall
          - entities.Hall.fields.status
        distinguishing_aspect: "A newly created Hall starts in the declared initial_state PLANNING, which is the one phase in which rack-feed reservation is refused."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /halls"
              payload: { name: "Corner Hall 20", code: "CX20", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
          assert:
            - "Hall.${hall_id}.status == PLANNING"
            - "GET /halls?status=PLANNING returns total_count == 1"

      - name: hall_advance_phase_to_non_successor_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Hall.PLANNING_to_FIT_OUT
          - validations[priority=16]
          - errors[ERR_HALL_PHASE_INVALID]
        distinguishing_aspect: "advance-phase accepts only the immediate successor: from PLANNING the target COMMISSIONING is refused with ERR_HALL_PHASE_INVALID 409 even though every FIT_OUT prerequisite is already satisfied, and the hall stays PLANNING."
        test_recipe:
          setup:
            - "Hall CX21 in PLANNING has PDU-A1 (side A), PDU-B1 (side B), busway BW-A1 and containment zone CA-1 — every PLANNING -> FIT_OUT prerequisite is met."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 21", code: "CX21", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
          trigger:
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "COMMISSIONING" }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_HALL_PHASE_INVALID"
            - "Hall.${hall_id}.status == PLANNING"

      - name: hall_advance_phase_to_live_is_never_accepted
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Hall.COMMISSIONING_to_LIVE
          - validations[priority=16]
          - errors[ERR_HALL_PHASE_INVALID]
        distinguishing_aspect: "LIVE is reachable only through the system transition fired by a witness decision: naming target_status LIVE on advance-phase is refused with ERR_HALL_PHASE_INVALID 409 from FIT_OUT, so no operator can hand a hall over manually."
        test_recipe:
          setup:
            - "Hall CX22 has advanced to FIT_OUT (PDU-A1, PDU-B1, BW-A1, CA-1 present)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 22", code: "CX22", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
          trigger:
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "LIVE" }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_HALL_PHASE_INVALID"
            - "Hall.${hall_id}.status == FIT_OUT"

      - name: hall_phase_prereq_missing_b_side_pdu_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Hall.PLANNING_to_FIT_OUT
          - validations[priority=34]
          - errors[ERR_PHASE_PREREQ_NOT_MET]
        distinguishing_aspect: "PLANNING -> FIT_OUT needs a PDU on each feed side; a hall holding only the A-side PDU (plus busway and zone) is refused with ERR_PHASE_PREREQ_NOT_MET 409, distinguishing the prerequisite check from the successor check of validation 16."
        test_recipe:
          setup:
            - "Hall CX23 in PLANNING owns PDU-A1 (side A only), busway BW-A1 and containment zone CA-1."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 23", code: "CX23", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
          trigger:
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_PHASE_PREREQ_NOT_MET"
            - "Hall.${hall_id}.status == PLANNING"

      - name: pdu_patch_commissions_and_recomputes_busway_under_design_variant
        claim_type: side_effect_execution
        grounds:
          - state_machines.PowerDistributionUnit.PLANNED_to_COMMISSIONED
          - calculations.busway_usable_kw
          - entities.Busway.fields.usable_kw
        distinguishing_aspect: "PATCH /pdus stores measured_derate_factor 0.94, flips status to COMMISSIONED and re-runs busway_usable_kw for every child busway — under the DESIGN variant the derate is ignored, so BW-A1 stays at 196.66 while PDU usable_cap_kw stays 240.000."
        test_recipe:
          setup:
            - "Hall CX24 in PLANNING owns PDU-A1 (rated 300.00 kW, PLANNED) and busway BW-A1 (400 A / 415 V / N_PLUS_1, usable_variant DESIGN, usable_kw 196.66)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 24", code: "CX24", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
          trigger:
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 0.94 }
              as: ElectricalContractor
          assert:
            - "HTTP status is 200"
            - "PowerDistributionUnit.${pdu_a_id}.status == COMMISSIONED"
            - "PowerDistributionUnit.${pdu_a_id}.measured_derate_factor == 0.94"
            - "PowerDistributionUnit.${pdu_a_id}.usable_cap_kw == 240.000"
            - "Busway.${bw_a_id}.usable_variant == DESIGN"
            - "Busway.${bw_a_id}.usable_kw == 196.66 (the DESIGN variant ignores measured_derate_factor entirely)"

      - name: pdu_second_patch_from_commissioned_rejected
        claim_type: idempotency
        grounds:
          - state_machines.PowerDistributionUnit.PLANNED_to_COMMISSIONED
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PLANNED -> COMMISSIONED is the PDU's only transition, so a second PATCH /pdus on the same unit is refused with ERR_INVALID_STATE 409 and the stored measured_derate_factor 0.94 is not overwritten by the 0.80 of the retry."
        test_recipe:
          setup:
            - "Hall CX25 owns PDU-A1, already COMMISSIONED at measured_derate_factor 0.94."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 25", code: "CX25", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 0.94 }
              as: ElectricalContractor
          trigger:
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 0.80 }
              as: ElectricalContractor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_INVALID_STATE"
            - "PowerDistributionUnit.${pdu_a_id}.measured_derate_factor == 0.94"
            - "PowerDistributionUnit.${pdu_a_id}.status == COMMISSIONED"

      - name: busway_energize_then_second_energize_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Busway.INSTALLED_to_ENERGIZED
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The first energize moves BW-A1 INSTALLED -> ENERGIZED and returns 200; the immediate repeat is refused with ERR_INVALID_STATE 409 rather than being silently absorbed, and status stays ENERGIZED."
        test_recipe:
          setup:
