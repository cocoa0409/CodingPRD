      - name: the_whole_happy_path_passes_every_rule_including_the_ones_sitting_on_their_boundary
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=14]", "validations[priority=22]", "validations[priority=23]", "validations[priority=28]", "validations[priority=29]"]
        distinguishing_aspect: "A single walk from project creation to an executed agreement must not trip any of the 31 rules even though several are exactly satisfied rather than comfortably satisfied: the commitment window sits inside the construction period, not_to_exceed_cents is exactly the 45,000,000 floor demanded by priority 28 (estimated_cost_cents * 1.125), the 29,070,000 committed share is exactly inside the 100,000,000 authority, and the clearance posture is CLEARANCE_PENDING rather than FUNDING_BLOCKED. An implementation with an off-by-one comparison in any of these rules fails the happy path itself."
        test_recipe:
          setup: ["A project, one owner, one facility and one conflict with the resolution already selected."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
