              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_v1: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_v1}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an1_verdict: $.data.verdict }
          trigger:
            - call: "POST /bin-designs/${d1_id}/seal"
              payload: {}
              as: SealingEngineer
              as_user_id: "${eng_b_id}"
              captures: { e_seal_from_draft: $.data.error_id }
            - call: "POST /bin-designs/${d1_id}/request-revision"
