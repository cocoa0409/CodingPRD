          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): the student violates both rules
          at once — NOT in SUSPENSION (reinstated at T3) and past the T2 appeal deadline; the
          state check (priority 9) must win, yielding ERR_STUDENT_NOT_SUSPENDED, not
          ERR_APPEAL_WINDOW_CLOSED. Sibling instance exercises the pair
          (business_temporal, business_constraint).
        test_recipe:
          setup:
            - "Program required_credits=120 (appeal_window_days 14); T1, T2, T3; Student S"
            - "T1: attempted 6 earned 3 QP 6.0 gh 6 -> WARNING; T2: attempted 6 earned 3 QP 6.0 gh 6 -> SUSPENSION at clock 2026-08-01 (deadline 2026-08-15)"
