# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2429 — Colocation Provisioning & Cross-Connect Management
#
# Walks references/claim-extraction-guide.md section by section against
# §1.1–§1.7 of SCAFFOLD.yaml. Corners already asserted by §1.8 are emitted as
# `excluded_because:` stubs naming the covering difficulty instance.
# Logical clock default: 2026-08-01T00:00:00Z.
#
# §1.5 audit findings raised while writing these chains (all folded back into
# SCAFFOLD.yaml before this file was finalised):
#   * §1.4 priority 38 / ERR_CREDIT_HOLD_ACTIVE now lists
#     POST /colocation/contracts/{contract_id}/state — the §1.2 SUSPENDED→ACTIVE
#     precondition needed the gate to be reachable from the validation table.
#   * §1.4 priority 18 / ERR_CONTRACT_NOT_ACTIVE now lists
#     POST /colocation/cabinets/{cabinet_id}/state (RESERVED→INSTALLED).
#   * §1.4 priority 20 / ERR_CABINET_NOT_OPERATIONAL and priority 26 /
#     ERR_CABINET_BREAKER_OVERSUBSCRIBED now list
#     POST /colocation/power-circuits/{circuit_id}/state, which is where the
#     DESIGNED→APPROVED gates in §1.2 actually fire.
#   * POST /colocation/cross-connect-orders now declares the §1.2.1 parent bump
#     "increments Contract.version by 1" in its §1.5 side_effects.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - endpoints.POST_/colocation/customers
          - entities.Customer.fields.legal_name
          - entities.Customer.fields.account_code
          - entities.Customer.fields.account_status
        distinguishing_aspect: "A bare POST with the two input fields returns 201 and a Customer whose account_status is the system default ACTIVE — account_status is never client-supplied."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/customers"
              payload: { legal_name: "Alder Peak Systems", account_code: "APS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
          assert:
            - "Response is 201 with response_type object and meta.api_request_id present"
            - "data.legal_name == Alder Peak Systems and data.account_code == APS"
            - "data.account_status == ACTIVE"
            - "data.id, data.created_at, data.updated_at and data.version are all present (common_fields: true)"

      - name: contract_retrieval_returns_stored_commitments_and_zeroed_rollups
        claim_type: retrieval
        grounds:
          - endpoints.GET_/colocation/contracts/{contract_id}
          - entities.Contract.fields.remote_hands_remaining_minutes
          - entities.Contract.fields.provisioned_power_kw
          - entities.Contract.fields.commit_utilization_pct
          - entities.Contract.fields.status
        distinguishing_aspect: "A freshly created contract reads back every stored commitment verbatim while all eight computed rollups are zero and remote_hands_remaining_minutes mirrors remote_hands_included_minutes (60), not 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One customer with one DRAFT contract: power_commit_kw 20.0, committed_cabinet_count 2, remote_hands_included_minutes 60."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Alder Peak Systems", account_code: "APS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9101", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 60 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "GET /colocation/contracts/${ctr_id}"
              as: BillingOperator
          assert:
            - "Response is 200 and data.id == ${ctr_id}"
            - "data.status == DRAFT and data.credit_hold == false"
            - "data.power_commit_kw == 20.0, data.committed_cabinet_count == 2, data.cross_connect_cap == 4"
            - "data.remote_hands_included_minutes == 60 and data.remote_hands_remaining_minutes == 60"
            - "data.provisioned_power_kw == 0.000, data.stranded_commit_kw == 0.000, data.commit_utilization_pct == 0.0"
            - "data.active_cross_connect_count == 0, data.billed_total_usd == 0.00, data.cross_connect_billed_usd == 0.00, data.last_closed_period_end == null"

      - name: cabinet_listing_default_page_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/colocation/cabinets
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 11 cabinets in one row and no limit/offset supplied, the default page is exactly 10 rows with total_count 11 and has_more true — the default limit is 10, not unbounded."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One row H2/R1 with cabinet_slot_count 12 holding 11 AVAILABLE cabinets C01..C11."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R1", cabinet_slot_count: 12, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C03", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C04", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C05", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C06", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C07", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C08", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C09", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C10", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C11", rated_power_kw: 20.0 }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/cabinets"
              payload: { row_id: "${row_id}" }
              as: FacilityManager
          assert:
            - "Response is 200 with response_type array"
            - "data holds exactly 10 Cabinet rows"
            - "pagination limit == 10, offset == 0, total_count == 11, has_more == true"

      - name: cabinet_listing_filtered_by_status_excludes_available_positions
        claim_type: listing
        grounds:
          - endpoints.GET_/colocation/cabinets
          - entities.Cabinet.fields.status
        distinguishing_aspect: "Of three cabinets in one row exactly one is RESERVED; the status filter returns that single row with total_count 1 and has_more false, proving the filter is applied before pagination."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PENDING_ACTIVATION contract, one row H2/R2 holding C01 (RESERVED to the contract), C02 and C03 (AVAILABLE)."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Alder Peak Systems", account_code: "APS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R2", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9102", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C03", rated_power_kw: 20.0 }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/cabinets"
              payload: { row_id: "${row_id}", status: "RESERVED" }
              as: FacilityManager
          assert:
            - "Response is 200 with exactly 1 Cabinet row whose id == ${cab1_id}"
            - "data[0].status == RESERVED and data[0].contract_id == ${ctr_id}"
            - "pagination total_count == 1 and has_more == false"

      - name: contract_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unstored contract id returns 404 ERR_CONTRACT_NOT_FOUND from the path-existence check (priority 3), not 200 with an empty body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Contract rows exist."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/contracts/11111111-1111-4111-8111-111111111111"
              as: BillingOperator
          assert:
            - "Response is 404 with response_type error"
            - "data.error_id == ERR_CONTRACT_NOT_FOUND"

      - name: power_circuit_creation_without_phase_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/colocation/power-circuits
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_11_ERR_INVALID_REQUEST
        distinguishing_aspect: "phase carries no default in §1.1, so omitting it is ERR_INVALID_REQUEST (400) — the server must not silently assume SINGLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One row H2/R3 with one AVAILABLE cabinet C01 rated 20.0 kW."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R3", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
          trigger:
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240 }
              as: ProvisioningEngineer
          assert:
            - "Response is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /colocation/power-circuits?cabinet_id=${cab_id} returns 0 rows — nothing was persisted"

      - name: cabinet_creation_defaults_apply_when_optional_fields_are_omitted
        claim_type: defaults
        grounds:
          - endpoints.POST_/colocation/cabinets
          - entities.Cabinet.fields.footprint_type
          - entities.Cabinet.fields.u_height
          - entities.Cabinet.fields.status
        distinguishing_aspect: "Omitting footprint_type and u_height yields CABINET / 42, and the new cabinet is AVAILABLE with contract_id null so it does NOT enter the row's occupied_slot_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One empty row H2/R4."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R4", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
          trigger:
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
          assert:
            - "Response is 201 with data.footprint_type == CABINET and data.u_height == 42"
            - "data.status == AVAILABLE, data.contract_id == null"
            - "data.allocated_power_kw == 0.000, data.cooling_load_kw == 0.000, data.energized_primary_circuit_count == 0"
            - "GET /colocation/rows/${row_id} shows occupied_slot_count == 0, density_ceiling_kw == 0.000 and row_status == OPEN"

      - name: power_circuit_derated_kw_computed_client_supplied_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.circuit_allocated_kw
          - entities.PowerCircuit.fields.derated_kw
          - entities.PowerCircuit.fields.allocated_kw
          - entities.PowerCircuit.fields.cooling_contribution_kw
        distinguishing_aspect: "A 60A/415V/THREE breaker plate derates to 34.501 kW (60*415*1.732/1000*0.80) regardless of any derated_kw/allocated_kw the client sends, and both energization outputs stay 0.000 while the circuit is DESIGNED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One row H2/R5 with one AVAILABLE cabinet C01 rated 40.0 kW."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R5", cabinet_slot_count: 8, design_density_kw_per_cabinet: 40.0, max_row_power_kw: 200.0, cooling_capacity_kw: 80.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 40.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
          trigger:
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 60, volts: 415, phase: "THREE", derated_kw: 99.999, allocated_kw: 99.999 }
              as: ProvisioningEngineer
          assert:
            - "Response is 201 and data.derated_kw == 34.501 — the client-supplied 99.999 is ignored"
            - "data.allocated_kw == 0.000 and data.cooling_contribution_kw == 0.000 because status == DESIGNED"
            - "data.status == DESIGNED and data.energized_at == null and data.meter_intervals == []"

      - name: contract_system_fields_are_server_seeded_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Contract.fields.status
          - entities.Contract.fields.credit_hold
          - entities.Contract.fields.last_closed_period_end
          - endpoints.POST_/colocation/contracts
        distinguishing_aspect: "status, credit_hold and every rollup are source: system or computed, so a body that supplies status ACTIVE and credit_hold true still yields DRAFT / false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one customer exists."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Alder Peak Systems", account_code: "APS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9103", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", status: "ACTIVE", credit_hold: true, billed_total_usd: 500.00 }
              as: BillingOperator
          assert:
            - "Response is 201 with data.status == DRAFT, NOT ACTIVE"
            - "data.credit_hold == false and data.billed_total_usd == 0.00"
            - "data.last_closed_period_end == null and data.id is a server-minted identifier"

      - name: row_creation_with_zero_cooling_capacity_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.FloorRow.fields.cooling_capacity_kw
          - validations.priority_11_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "cooling_capacity_kw carries constraint `> 0`, so 0 is refused at priority 11 before any posture arithmetic can divide by it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R6", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 0 }
              as: FacilityManager
          assert:
            - "Response is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /colocation/rows?hall_code=H2 returns 0 rows"

      - name: invoice_line_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.InvoiceLine
          - endpoints.GET_/colocation/invoice-lines/{invoice_line_id}
          - calculations.contract_power_billing
        distinguishing_aspect: "InvoiceLine is declared common_fields: false, so the POWER_COMMIT line read back after a close exposes no version field and §1.5 offers no POST/PATCH/DELETE on /colocation/invoice-lines — compensation is only possible through a REVERSAL line."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with power_commit_kw 20.0, one RESERVED cabinet, no meter intervals at all."
            - "One billing close over July 2026 appended exactly one POWER_COMMIT line of 3500.00 (20.0 * 175.00) with no POWER_OVERAGE line because billable_kwh 0.000 < included_kwh 14600.000."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Alder Peak Systems", account_code: "APS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H2", row_code: "R7", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9104", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 2, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/billing-close"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: BillingOperator
            - call: "GET /colocation/invoice-lines"
              payload: { contract_id: "${ctr_id}" }
              as: BillingOperator
              captures: { line_id: "$.data[0].id" }
          trigger:
            - call: "GET /colocation/invoice-lines/${line_id}"
              as: BillingOperator
          assert:
            - "Response is 200 with data.line_type == POWER_COMMIT, data.amount_usd == 3500.00, data.quantity == 20.0, data.unit_rate_usd == 175.0000"
            - "data.period_start == 2026-07-01T00:00:00Z and data.period_end == 2026-08-01T00:00:00Z"
            - "data.reversed == false and data.included_minutes_consumed == 0"
            - "data contains NO version key — InvoiceLine declares common_fields: false"
            - "§1.5 declares no POST, PATCH or DELETE on /colocation/invoice-lines or /colocation/invoice-lines/{invoice_line_id}; the only mutation path is POST /colocation/contracts/{contract_id}/invoice-adjustments"
            - "GET /colocation/invoice-lines?contract_id=${ctr_id} returns exactly 1 line — no POWER_OVERAGE line was appended"

      - name: cabinet_creation_against_unknown_row_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4_existence
          - errors[ERR_ROW_NOT_FOUND]
          - entities.Cabinet.fields.row_id
        distinguishing_aspect: "row_id is a body FK, so an unstored row is rejected at priority 4 with the row's own code ERR_ROW_NOT_FOUND (404) — flat topology still validates cross-references."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no FloorRow rows exist."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/cabinets"
              payload: { row_id: "22222222-2222-4222-8222-222222222222", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
          assert:
            - "Response is 404 and data.error_id == ERR_ROW_NOT_FOUND"
            - "GET /colocation/cabinets returns 0 rows"

      - name: contact_creation_against_unknown_customer_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4_existence
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - entities.AuthorizedContact.fields.customer_id
        distinguishing_aspect: "An authorization-list entry cannot be created for a customer that does not exist; the body FK resolves to ERR_CUSTOMER_NOT_FOUND (404), not ERR_CONTACT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Customer rows exist."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SecurityOfficer
          trigger:
            - call: "POST /colocation/contacts"
              payload: { customer_id: "33333333-3333-4333-8333-333333333333", full_name: "Nobody", authorization_scopes: ["SITE_ACCESS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
          assert:
            - "Response is 404 and data.error_id == ERR_CUSTOMER_NOT_FOUND"
            - "GET /colocation/contacts returns 0 rows"

  # ===========================================================================
  # From Table 2 (State Machines) — shape: cyclic, guarded transitions
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_starts_in_draft_with_no_bundle_armed
        claim_type: initial_state
        grounds:
          - state_machines.Contract.initial_state
          - state_machines.Contract.transitions[DRAFT->PENDING_ACTIVATION]
        distinguishing_aspect: "A brand-new contract is DRAFT, and remote_hands_remaining_minutes is only armed by the DRAFT→PENDING_ACTIVATION transition — before it the bundle mirrors the input but no version bump has occurred."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one customer."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9201", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", remote_hands_included_minutes: 120 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
          assert:
            - "Response is 201 with data.status == DRAFT"
            - "data.version == 1 — no transition has been applied yet"
            - "data.remote_hands_remaining_minutes == 120 and data.remote_hands_included_minutes == 120"

      - name: contract_activation_without_any_assigned_cabinet_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Contract.transitions[PENDING_ACTIVATION->ACTIVE].preconditions
          - errors[ERR_NO_CABINET_ASSIGNED]
          - validations.priority_24
        distinguishing_aspect: "The guard is cross-entity: a PENDING_ACTIVATION contract with zero Cabinets in {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE} cannot activate, and the refusal leaves it in PENDING_ACTIVATION rather than rolling back to DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One contract moved DRAFT→PENDING_ACTIVATION with no cabinet ever reserved to it."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9202", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
          assert:
            - "Response is 409 and data.error_id == ERR_NO_CABINET_ASSIGNED"
            - "GET /colocation/contracts/${ctr_id} still shows status == PENDING_ACTIVATION and version == 2 (unchanged by the refusal)"

      - name: draft_to_pending_activation_arms_the_bundled_minutes_and_bumps_version
        claim_type: side_effect_execution
        grounds:
          - state_machines.Contract.transitions[DRAFT->PENDING_ACTIVATION].side_effects
          - entities.Contract.fields.remote_hands_remaining_minutes
        distinguishing_aspect: "The arming side effect is observable even when remote_hands_included_minutes was defaulted: the contract created without the optional field reports remaining 0 and version 2 after the transition, and status is PENDING_ACTIVATION not ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one DRAFT contract created without remote_hands_included_minutes."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9203", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
          assert:
            - "Response is 200 with data.status == PENDING_ACTIVATION"
            - "data.remote_hands_included_minutes == 0 and data.remote_hands_remaining_minutes == 0"
            - "data.version == 2 — exactly one increment"

      - name: terminated_contract_refuses_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Contract.terminal_states
          - validations.priority_13_ERR_INVALID_STATE
        distinguishing_aspect: "TERMINATED is reachable only after the last cabinet has been released; once there, even the otherwise legal ACTIVE target is refused with ERR_INVALID_STATE and the version does not move."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract driven DRAFT→PENDING_ACTIVATION→(cabinet reserved)→ACTIVE→WIND_DOWN, the cabinet released back to AVAILABLE, then →TERMINATED."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9204", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "WIND_DOWN" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "AVAILABLE" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "TERMINATED" }
              as: FacilityManager
              captures: { term_version: $.data.version }
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: BillingOperator
          assert:
            - "The TERMINATED transition itself returned 200 with data.status == TERMINATED"
            - "The trigger returns 409 and data.error_id == ERR_INVALID_STATE"
            - "GET /colocation/contracts/${ctr_id} still shows status == TERMINATED and version == ${term_version}"

      - name: suspended_reinstatement_is_refused_while_the_credit_hold_stands
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Contract.transitions[SUSPENDED->ACTIVE].preconditions
          - errors[ERR_CREDIT_HOLD_ACTIVE]
          - endpoints.POST_/colocation/contracts/{contract_id}/credit-hold
        distinguishing_aspect: "The fiscal gate also guards the lifecycle endpoint, not just order intake: SUSPENDED + credit_hold true returns 402 on POST /state, and clearing the hold makes the very same call succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with one RESERVED cabinet, then SUSPENDED, then credit_hold set true."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R2", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9205", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "SUSPENDED" }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_id}/credit-hold"
              payload: { credit_hold: true }
              as: BillingOperator
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_id}/credit-hold"
              payload: { credit_hold: false }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: BillingOperator
          assert:
            - "First trigger call returns 402 with data.error_id == ERR_CREDIT_HOLD_ACTIVE and the contract stays SUSPENDED"
            - "Second call returns 200 with data.credit_hold == false and data.status still SUSPENDED — clearing the hold is not itself a transition"
            - "Third call returns 200 with data.status == ACTIVE, proving the reinstatement cycle SUSPENDED→ACTIVE is open once the fiscal gate clears"

      - name: cabinet_release_returns_the_row_slot_and_clears_the_contract_link
        claim_type: side_effect_execution
        grounds:
          - state_machines.Cabinet.transitions[RESERVED->AVAILABLE].side_effects
          - calculations.row_capacity_posture
          - entities.FloorRow.fields.occupied_slot_count
        distinguishing_aspect: "Releasing the only reserved cabinet is a ledger-sync compensation: occupied_slot_count returns to 0, density_ceiling_kw collapses to 0.000, row_status returns to OPEN and cabinet.contract_id becomes null in the same response."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row H3/R3 (design_density 25.0) with C01 RESERVED to a PENDING_ACTIVATION contract."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R3", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9206", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv_reserved: $.data.version }
          trigger:
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "AVAILABLE" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
          assert:
            - "After the reservation the row showed occupied_slot_count == 1 and density_ceiling_kw == 25.000"
            - "First trigger call returns 200 with data.status == AVAILABLE and data.contract_id == null"
            - "Second call shows occupied_slot_count == 0, density_ceiling_kw == 0.000, effective_ceiling_kw == 0.000, row_status == OPEN"
            - "Row version is ${rv_reserved} + 1 — the release bumps FloorRow.version exactly once"

      - name: cabinet_install_before_the_contract_is_active_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Cabinet.transitions[RESERVED->INSTALLED].preconditions
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - validations.priority_18
        distinguishing_aspect: "RESERVED→INSTALLED demands contract.status == ACTIVE while AVAILABLE→RESERVED accepted PENDING_ACTIVATION — the same endpoint applies a different accepted set per target state."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract left in PENDING_ACTIVATION with C01 already RESERVED to it."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Grid", account_code: "BGR" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R4", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9207", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
          assert:
            - "First trigger call returns 409 with data.error_id == ERR_CONTRACT_NOT_ACTIVE and the cabinet stays RESERVED"
            - "Second call returns 200 with data.status == ACTIVE (the reservation satisfied ERR_NO_CABINET_ASSIGNED)"
            - "Third call returns 200 with data.status == INSTALLED"

      - name: circuit_approval_against_an_available_cabinet_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PowerCircuit.transitions[DESIGNED->APPROVED].preconditions
          - errors[ERR_CABINET_NOT_OPERATIONAL]
          - validations.priority_20
        distinguishing_aspect: "The approval gate accepts {RESERVED, INSTALLED, ACTIVE} — strictly wider than the energize gate's {INSTALLED, ACTIVE} — so an AVAILABLE cabinet is the only cabinet state that blocks design approval."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row H3/R5 with an AVAILABLE cabinet C01 rated 40.0 kW carrying one DESIGNED 50A/240V/SINGLE PRIMARY circuit (derated 9.600, well inside the 50.000 breaker ceiling)."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/rows"
              payload: { hall_code: "H3", row_code: "R5", cabinet_slot_count: 8, design_density_kw_per_cabinet: 40.0, max_row_power_kw: 200.0, cooling_capacity_kw: 80.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 40.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
          trigger:
            - call: "POST /colocation/power-circuits/${cir_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
          assert:
            - "Response is 409 and data.error_id == ERR_CABINET_NOT_OPERATIONAL"
            - "GET /colocation/power-circuits/${cir_id} still shows status == DESIGNED and derated_kw == 9.600"

      - name: repeated_energize_on_an_already_energized_circuit_is_refused
        claim_type: idempotency
        grounds:
          - state_machines.PowerCircuit.transitions[APPROVED->ENERGIZED]
          - validations.priority_13_ERR_INVALID_STATE
          - concurrency_rules.circuit-energize-stale-row
