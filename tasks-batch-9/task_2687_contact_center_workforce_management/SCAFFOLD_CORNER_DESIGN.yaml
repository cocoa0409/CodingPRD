      - name: all_planning_roles_can_read_planning_cycle
        claim_type: exclusive_and_shared_operations_permitted
        grounds:
          - endpoints[GET /planning-cycles/{planning_cycle_id}]
          - roles
        distinguishing_aspect: |
          The cycle read is the one shared surface across all seven planning-side roles, and every
          one of them -- including entity_backed Agent, whose X-User-ID must be an Agent row id --
          must get the identical 200 payload. This is the positive complement to the
          ERR_UNAUTHORIZED instance: an implementation that guards the read with a
          CapacityPlanner-only check, or that applies Agent's ownership scoping to a read that has
          no agent_id to scope by, fails here. The read is side-effect free, so version stays 1
          across all seven calls.
        test_recipe:
          setup:
