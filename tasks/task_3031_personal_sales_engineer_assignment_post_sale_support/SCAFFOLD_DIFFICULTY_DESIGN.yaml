          - errors[ERR_BOOK_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A dual-failure request carrying a role that is not permitted on accept while the engineer's book is also at capacity returns the auth error ERR_UNAUTHORIZED, proving the auth category pair outranks business_constraint and differs from the safety-versus-state pairing above."
        test_recipe:
          setup:
