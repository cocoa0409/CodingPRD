  - rule_id: transitive_cascade
    instances:
      - name: incident_review_modality_to_feed_to_station_to_observer_depth_four
        cascade_depth: 4
        grounds:
          - state_machines.SafetyEvent.status.REPORTED_to_INCIDENT_REVIEW
          - state_machines.VideoFeed.status.ACTIVE_to_RELEASED
          - state_machines.MonitoringStation.status.ACTIVE_MONITORING_to_IDLE
          - state_machines.Staff.status.ON_ASSIGNMENT_to_AVAILABLE
          - state_machines.Staff.status.to_SUSPENDED
        distinguishing_aspect: |
          Trigger is POST /observation/safety-events/{id}/open-incident-review. Every link is caused
          by the previous one, not by the trigger: hop 1 rewrites ObservationOrder.required_modality;
          the feed is released ONLY because the order's modality left VIDEO_MONITORING (hop 2); the
          station recounts and idles ONLY because that feed left ACTIVE (hop 3); the console observer
          is freed ONLY because the station reached IDLE (hop 4). The ordering rule is also visible:
          the sitter named by the event is suspended AFTER the four hops, and the observer freed by
          hop 4 is a different Staff row, so the two Staff outcomes (AVAILABLE vs SUSPENDED) can be
          read independently in the same response cycle.
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-G, budget 100000; admitted patient age 60."
            - "Order for FALL + ELOPEMENT with required_modality VIDEO_MONITORING; baseline score 4.0, interval 12h, next due 2026-08-01T12:00:00Z."
            - "Console CONSOLE-G1 declared_max_span 2, observer staff S_OBS; one ACTIVE feed for the order on that console (acuity weight 1.0 + 2.0 = 3.0, no penalty, effective_span_limit 2)."
            - "A belt-and-braces sitter watch also exists on the same order (nothing forbids a sitter watch under a video order) and it is ON_WATCH at clock 2026-08-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-G", name: "Neuro Unit G", observation_cost_budget_cents: 100000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { unit_g: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_g}", mrn: "MRN-7001", full_name: "Pat Eight", age_years: 60 }
              as: NurseManager
              captures: { p8: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_g}", full_name: "Observer Gee", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s_obs: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_g}", full_name: "Sitter Gee", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2400, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s_sit: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p8}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Wandering with unsteady gait; remote observation acceptable" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o8: $.data.id, o8_v1: $.data.version }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_obs}", station_label: "CONSOLE-G1", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { st1: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st1}", order_id: "${o8}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T12:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_obs}"
              captures: { f1: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o8}", staff_id: "${s_sit}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o8_v1}" }
              as: StaffingCoordinator
              captures: { a8: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a8}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${s_sit}"
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o8}", event_kind: "FALL_WITH_INJURY", narrative: "Unwitnessed fall from chair, forehead laceration", assignment_id: "${a8}" }
              as: Sitter
              as_user_id: "${s_sit}"
              captures: { ev8: $.data.id }
          trigger:
            - call: "POST /observation/safety-events/${ev8}/open-incident-review"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
          assert:
            - "SafetyEvent.${ev8}.status == INCIDENT_REVIEW and review_opened_by_user_id == safety-1"
            - "HOP 1: ObservationOrder.${o8}.required_modality == ONE_TO_ONE_SITTER (was VIDEO_MONITORING)"
            - "HOP 2: VideoFeed.${f1}.status == RELEASED, release_reason == MODALITY_FORCED_TO_SITTER, released_at == 2026-08-01T08:00:00Z"
            - "HOP 3: MonitoringStation.${st1}.status == IDLE, active_feed_count == 0, active_acuity_weight == 0.0, effective_span_limit == 2"
            - "HOP 4: Staff.${s_obs}.status == AVAILABLE and suspension_reason == null"
            - "AFTER the hops: Staff.${s_sit}.status == SUSPENDED and suspension_reason == INCIDENT_REVIEW_OPENED (the last write wins; it is not left AVAILABLE)"
            - "ObservationOrder.${o8}.elopement_risk_score == 6.0 and risk_score_variant == ROLLING_EVENT_WEIGHTED (base 4.0 + HARM_EVENT_POINTS 2.0)"
            - "ObservationOrder.${o8}.reassessment_interval_hours == 8 and next_reassessment_due_at == 2026-08-01T08:00:00Z"
            - "ObservationOrder.${o8}.status == ACTIVE (a FALL_WITH_INJURY event never escalates the order)"
            - "SitterAssignment.${a8}.watch_status == ON_WATCH (the cascade touches no watch dimension) and documentation_status == PENDING"
            - "Unit.${unit_g}.observed_cost_to_date_cents == 19200 (only the PROVISIONAL entry; the cascade posts no ledger row)"

      - name: patient_discharge_order_to_assignment_to_ledger_depth_three
        cascade_depth: 3
        grounds:
          - state_machines.Patient.status.ADMITTED_to_DISCHARGED
          - state_machines.ObservationOrder.status.to_DISCONTINUED
          - state_machines.SitterAssignment.watch_status.ON_WATCH_to_COMPLETED
          - calculations.assignment_labor_cost.variants.final
          - calculations.unit_cost_ledger_head
        distinguishing_aspect: |
          A different triggering transition (POST /observation/patients/{id}/discharge, i.e. the
          Patient state machine rather than the SafetyEvent one) and a different propagation
          pattern: instead of walking the monitoring topology it walks the billing spine —
          patient -> order -> assignment -> ledger. Depth 3 of caused links, and the declared
          fourth hop (unit budget re-evaluation) is exercised as an explicit no-op because the
          recomputed head 7200 is far below the 100000 budget, which is only observable because
          hop 3 actually ran.
        test_recipe:
          setup:
            - "Unit UNIT-H budget 100000, video disabled; admitted patient age 60; ACTIVE order for FALL only (score 1.5, interval 24h)."
            - "One INTERNAL_FLOAT sitter at 2400 cents/hour assigned 2026-08-01T08:00Z -> 16:00Z (PROVISIONAL 19200), watch started at 08:00Z."
            - "The clock is advanced to 2026-08-01T11:00:00Z before the discharge, so exactly 180 whole minutes are billable."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-H", name: "Med-Surg Unit H", observation_cost_budget_cents: 100000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_h: $.data.id }
