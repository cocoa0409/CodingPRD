scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_full_vs_prorated_diverge_ticket_domain
        grounds:
          - calculations.refund_amount
          - state_machines.Ticket.PURCHASED_to_REFUNDED
          - state_machines.Ticket.ACTIVATED_to_REFUNDED
        distinguishing_aspect: |
          The refund_amount calculation lives on the Ticket/RefundRequest domain: the FULL
          variant of an unactivated SINGLE ticket (price 1300 -> 1100) and the PRORATED
          variant of an activated MONTHLY ticket (price 20000, 20/31 days -> 12703) yield
          different amounts, a distinct entity domain from the revenue_apportionment dual-variant.
        test_recipe:
          setup:
            - "Clock at 2026-03-01. FareProduct SINGLE (1->3, base 1000, peak 300). Passenger with no eligibility, wallet 0."
            - "Passenger buys a SINGLE PEAK ticket (price 1300), status PURCHASED, then requests a WALLET refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp_s13: $.data.id }
            - call: "POST /passengers"
              payload: { email: "a@x.com", full_name: "A", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp_s13}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt}", reason: "changed plans", refund_destination: "WALLET" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: FareAdmin
          assert:
            - "RefundRequest.${rr}.refund_amount_cents == 1100"
            - "RefundRequest.${rr}.status == APPROVED"
            - "Ticket.${tkt}.status == REFUNDED"
            - "Ticket.${tkt}.refund_amount_cents == 1100"
            - "Passenger.${pax}.wallet_credit_cents == 1100"

      - name: apportionment_zone_count_vs_distance_diverge_revenue_domain
        grounds:
          - calculations.revenue_apportionment
          - entities.Ticket.revenue_allocations
          - entities.Agency.zones_served
        distinguishing_aspect: |
          The revenue_apportionment calculation lives on the Agency/revenue domain: for the same
          $1000 ticket over zones {1,2,3} with agencies A[1],B[2],C[3], the DISTANCE variant gives
          A=166,B=333,C=501 versus the ZONE_COUNT variant A=334,B=333,C=333 — a distinct domain
          from the refund dual-variant.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Agencies A[1],B[2],C[3] created in that order. FareProduct SINGLE (1->3, base 1000, peak 300) with apportionment_method DISTANCE."
            - "Passenger buys OFF_PEAK (price 1000); allocations computed by the DISTANCE variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "A", zones_served: [1] }
              as: FareAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /agencies"
              payload: { code: "B", zones_served: [2] }
              as: FareAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /agencies"
              payload: { code: "C", zones_served: [3] }
              as: FareAdmin
              captures: { ag_c: $.data.id }
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "DISTANCE" }
              as: FareAdmin
              captures: { fp_dist: $.data.id }
            - call: "POST /passengers"
              payload: { email: "b@x.com", full_name: "B", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp_dist}", travel_period: "OFF_PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
          assert:
            - "Ticket.${tkt}.purchase_price_cents == 1000"
            - "Ticket.${tkt}.apportionment_method == DISTANCE"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'A' has amount_cents == 166"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'B' has amount_cents == 333"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'C' has amount_cents == 501"
            - "sum of Ticket.${tkt}.revenue_allocations[].amount_cents == 1000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_price_nonlinear_reduced_peak_cap_mode_a
        grounds:
          - calculations.ticket_purchase_price
          - entities.Ticket.reduced_fare_applied
          - validations[priority=6]
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base_fare, peak_surcharge selected by travel_period, reduced
          discount branch) with a min() cap — base 1000 + peak 300 = 1300 subtotal, minus
          round_half_up(1300*0.5)=650 reduced discount -> 650, capped at 5000 -> 650.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3, base 1000, peak 300). Passenger approved STUDENT (eligibility valid)."
            - "Passenger buys PEAK with use_reduced_fare true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp_s13: $.data.id }
            - call: "POST /passengers"
              payload: { email: "c@x.com", full_name: "C", date_of_birth: "2005-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "doc1", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app: $.data.id }
            - call: "POST /reduced-fare-applications/${app}/approve"
              payload: {}
              as: FareAdmin
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp_s13}", travel_period: "PEAK", use_reduced_fare: true }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
          assert:
            - "Ticket.${tkt}.reduced_fare_applied == true"
            - "Ticket.${tkt}.purchase_price_cents == 650"

      - name: apportionment_rounding_floor_then_remainder_mode_b
        grounds:
          - calculations.revenue_apportionment
          - entities.Agency.zones_served
          - entities.Ticket.revenue_allocations
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — floor each agency share then distribute
          the leftover cent by weight DESC, tie-break Agency.created_at ASC. Price 1000 over
          A[1],B[2],C[3] equal weights: floor 333 each (sum 999), the 1-cent remainder goes to the
          earliest-created tying agency A -> A=334,B=333,C=333.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Agencies A[1],B[2],C[3] created in that order. FareProduct SINGLE (1->3, base 1000, peak 300) ZONE_COUNT. Passenger buys OFF_PEAK (price 1000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "A", zones_served: [1] }
              as: FareAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /agencies"
              payload: { code: "B", zones_served: [2] }
              as: FareAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /agencies"
              payload: { code: "C", zones_served: [3] }
              as: FareAdmin
              captures: { ag_c: $.data.id }
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp_zc: $.data.id }
            - call: "POST /passengers"
              payload: { email: "d@x.com", full_name: "D", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp_zc}", travel_period: "OFF_PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
          assert:
            - "Ticket.${tkt}.purchase_price_cents == 1000"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'A' has amount_cents == 334"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'B' has amount_cents == 333"
            - "Ticket.${tkt}.revenue_allocations entry for agency_code 'C' has amount_cents == 333"
            - "sum of Ticket.${tkt}.revenue_allocations[].amount_cents == 1000"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_branches_purchased_to_exchanged
        grounds:
          - state_machines.Ticket.PURCHASED_to_EXCHANGED
          - state_machines.Ticket.PURCHASED_to_ACTIVATED
          - state_machines.Ticket.PURCHASED_to_REFUNDED
        distinguishing_aspect: |
          On Ticket, PURCHASED forks to three divergent terminal/next states; exercising the
          EXCHANGED branch (old ticket EXCHANGED, a new PURCHASED ticket minted) proves the branch
          is distinct from the ACTIVATED and REFUNDED branches — non-linear shape on the Ticket entity.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Two FareProducts SINGLE (1->3 base 1000 peak 300) and SINGLE (1->2 base 700 peak 200). Passenger buys the pricier PEAK ticket (1300), then exchanges for the cheaper OFF_PEAK product (700)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp_hi: $.data.id }
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 2, ticket_type: "SINGLE", base_fare_cents: 700, peak_surcharge_cents: 200, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp_lo: $.data.id }
            - call: "POST /passengers"
              payload: { email: "e@x.com", full_name: "E", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp_hi}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { old_tkt: $.data.id }
          trigger:
            - call: "POST /tickets/${old_tkt}/exchange"
              payload: { new_fare_product_id: "${fp_lo}", travel_period: "OFF_PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { new_tkt: $.data.id }
          assert:
            - "Ticket.${old_tkt}.status == EXCHANGED"
            - "Ticket.${new_tkt}.status == PURCHASED"
            - "Ticket.${new_tkt}.purchase_price_cents == 700"
            - "Passenger.${pax}.wallet_credit_cents == 600"

      - name: citation_branches_contested_to_dismissed
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - state_machines.Citation.CONTESTED_to_UPHELD
        distinguishing_aspect: |
          On Citation, CONTESTED forks to UPHELD and DISMISSED with divergent side-effects — only
          DISMISSED reverses passenger.evasion_count (1 -> 0). Exercising the DISMISSED branch proves
          non-linear shape on a second, distinct entity (Citation).
        test_recipe:
          setup:
            - "Clock 2026-03-01. Passenger with one EVASION inspection and one ISSUED citation (evasion_count 1). Passenger contests; admin dismisses."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "f@x.com", full_name: "F", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp: $.data.id }
            - call: "POST /citations"
              payload: { inspection_id: "${insp}", passenger_id: "${pax}" }
              as: Conductor
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/contest"
              payload: { grounds: "valid ticket shown" }
              as: Passenger
              as_user_id: "${pax}"
          trigger:
            - call: "POST /citations/${cit}/resolve"
              payload: { decision: "DISMISSED" }
              as: FareAdmin
          assert:
            - "Citation.${cit}.status == DISMISSED"
            - "Citation.${cit}.resolution_decision == DISMISSED"
            - "Passenger.${pax}.evasion_count == 0"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: citation_issue_to_evasion_count_to_eligibility_revoked_depth3
        grounds:
          - state_machines.Citation.null_to_ISSUED
          - entities.Passenger.evasion_count
          - state_machines.ReducedFareApplication.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Depth-3 cascade from POST /citations: issuing the 3rd citation (A) increments
          passenger.evasion_count to 3 (B), which because it reaches EVASION_REVOCATION_THRESHOLD
          triggers the passenger's APPROVED ReducedFareApplication to REVOKED and clears eligibility (C).
        test_recipe:
          setup:
            - "Clock 2026-03-01. Passenger approved STUDENT (eligibility valid). Two prior EVASION citations already raised evasion_count to 2."
            - "A third EVASION inspection is standing; issuing its citation crosses the revocation threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "g@x.com", full_name: "G", date_of_birth: "2005-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "doc", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app: $.data.id }
            - call: "POST /reduced-fare-applications/${app}/approve"
              payload: {}
              as: FareAdmin
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp1: $.data.id }
            - call: "POST /citations"
              payload: { inspection_id: "${insp1}", passenger_id: "${pax}" }
              as: Conductor
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp2: $.data.id }
            - call: "POST /citations"
              payload: { inspection_id: "${insp2}", passenger_id: "${pax}" }
              as: Conductor
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp3: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { inspection_id: "${insp3}", passenger_id: "${pax}" }
              as: Conductor
              captures: { cit3: $.data.id }
          assert:
            - "Passenger.${pax}.evasion_count == 3"
            - "Passenger.${pax}.reduced_fare_category == NONE"
            - "Passenger.${pax}.reduced_fare_valid_until == null"
            - "ReducedFareApplication.${app}.status == REVOKED"
            - "Citation.${cit3}.total_penalty_cents == 11000"

      - name: service_credit_create_to_wallet_credit_depth2
        grounds:
          - state_machines.ServiceCredit.null_to_ISSUED
          - entities.Passenger.wallet_credit_cents
          - calculations.service_credit_amount
        distinguishing_aspect: |
          Depth-2 cascade from POST /service-credits: creating the ServiceCredit (A) computes
          credit_amount_cents=325 on ISSUED (B), whose side-effect increments the ticket owner's
          passenger.wallet_credit_cents to 325 (C) — a different originating trigger than the citation cascade.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3 base 1000 peak 300). Passenger buys PEAK (price 1300), wallet 0."
            - "Disruption on line L1 with 45-minute delay recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "h@x.com", full_name: "H", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /service-disruptions"
              payload: { line_code: "L1", scheduled_departure: "2026-03-01T08:00:00Z", actual_departure: "2026-03-01T08:45:00Z", window_start: "2026-03-01T08:00:00Z", window_end: "2026-03-01T09:00:00Z" }
              as: FareAdmin
              captures: { dis: $.data.id }
          trigger:
            - call: "POST /service-credits"
              payload: { disruption_id: "${dis}", ticket_id: "${tkt}" }
              as: FareAdmin
              captures: { sc: $.data.id }
          assert:
            - "ServiceCredit.${sc}.credit_amount_cents == 325"
            - "ServiceCredit.${sc}.status == ISSUED"
            - "Passenger.${pax}.wallet_credit_cents == 325"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: a ticket that is already ACTIVATED AND
          past its activation deadline fails both the state check (priority 5) and the temporal check
          (priority 7); the lower-priority state error ERR_INVALID_TICKET_STATE must win.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys and activates a ticket (now ACTIVATED). Clock advanced to 2026-07-01 (>90 days past purchase)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "i@x.com", full_name: "I", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: FareAdmin
          trigger:
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_TICKET_STATE"
            - "HTTP status == 409"

      - name: purchase_referential_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_fiscal}: a purchase requesting
          reduced fare without eligibility (priority 6) AND applying wallet credit beyond a zero
          balance (priority 9) fails both; the reduced-fare error ERR_REDUCED_FARE_NOT_ELIGIBLE must win.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger with reduced_fare_category NONE and wallet 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "j@x.com", full_name: "J", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK", use_reduced_fare: true, wallet_apply_cents: 100 }
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_REDUCED_FARE_NOT_ELIGIBLE"
            - "HTTP status == 422"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: service_credit_delay_at_30_minutes_issues
        grounds:
          - calculations.service_credit_amount
          - validations[priority=8]
          - entities.ServiceDisruption.delay_minutes
        distinguishing_aspect: |
          Boundary on the delay-minutes metric via POST /service-credits: delay_minutes >= 30 issues
          a credit while 29 is rejected. At exactly 30 (scheduled 08:00, actual 08:30) the credit is
          issued at floor(1300*0.25)=325.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys PEAK (1300). Disruption with exactly 30-minute delay."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "k@x.com", full_name: "K", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /service-disruptions"
              payload: { line_code: "L2", scheduled_departure: "2026-03-01T08:00:00Z", actual_departure: "2026-03-01T08:30:00Z", window_start: "2026-03-01T08:00:00Z", window_end: "2026-03-01T09:00:00Z" }
              as: FareAdmin
              captures: { dis: $.data.id }
          trigger:
            - call: "POST /service-credits"
              payload: { disruption_id: "${dis}", ticket_id: "${tkt}" }
              as: FareAdmin
              captures: { sc: $.data.id }
          assert:
            - "ServiceDisruption.${dis}.delay_minutes == 30"
            - "ServiceCredit.${sc}.credit_amount_cents == 325"
            - "ServiceCredit.${sc}.status == ISSUED"

      - name: upgrade_rejected_when_observed_zone_equals_destination
        grounds:
          - entities.Inspection.result
          - validations[priority=8]
        distinguishing_aspect: |
          Boundary on the zone-difference metric via POST /upgrades: an inspection whose
          observed_destination_zone (3) equals the ticket destination (3) has result VALID (zero
          zone gap), so the upgrade is rejected with ERR_UPGRADE_NOT_REQUIRED — a distinct metric and
          endpoint from the delay-minutes boundary.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys and activates a ticket (dest 3). Conductor inspects with observed zone 3 -> result VALID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "l@x.com", full_name: "L", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", ticket_id: "${tkt}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /upgrades"
              payload: { inspection_id: "${insp}", ticket_id: "${tkt}" }
              as: Conductor
              captures: { err: $.data.error_id }
          assert:
            - "Inspection.${insp}.result == VALID"
            - "response data.error_id == ERR_UPGRADE_NOT_REQUIRED"
            - "HTTP status == 409"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_reduced_fare_depends_on_passenger_eligibility
        grounds:
          - validations[priority=6]
          - entities.Passenger.reduced_fare_category
          - entities.Ticket.reduced_fare_applied
        distinguishing_aspect: |
          Entity pair Ticket->Passenger: a reduced-fare ticket purchase is permitted only because the
          Passenger's reduced_fare_category is APPROVED (STUDENT) and valid; the discount fires
          (price 500) — the transition on Ticket depends on Passenger state.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3 base 1000 peak 300). Passenger approved STUDENT."
            - "Passenger buys OFF_PEAK reduced (subtotal 1000, discount 500 -> price 500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "m@x.com", full_name: "M", date_of_birth: "2005-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "STUDENT", proof_document_ref: "doc", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app: $.data.id }
            - call: "POST /reduced-fare-applications/${app}/approve"
              payload: {}
              as: FareAdmin
          trigger:
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "OFF_PEAK", use_reduced_fare: true }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
          assert:
            - "Ticket.${tkt}.reduced_fare_applied == true"
            - "Ticket.${tkt}.purchase_price_cents == 500"

      - name: upgrade_depends_on_inspection_result
        grounds:
          - entities.Inspection.result
          - validations[priority=8]
          - calculations.upgrade_fare
        distinguishing_aspect: |
          Entity pair Upgrade->Inspection: an Upgrade may be created only because the referenced
          Inspection.result is UPGRADE_REQUIRED (observed zone 5 beyond ticket destination 3);
          the upgrade fare 1100 is charged and the ticket destination extends to 5.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProducts SINGLE (1->3 base 1000 peak 300) and SINGLE (1->5 base 1800 peak 400). Passenger buys+activates the 1->3 PEAK ticket. Conductor inspects observed zone 5 -> UPGRADE_REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp13: $.data.id }
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 5, ticket_type: "SINGLE", base_fare_cents: 1800, peak_surcharge_cents: 400, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp15: $.data.id }
            - call: "POST /passengers"
              payload: { email: "n@x.com", full_name: "N", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp13}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", ticket_id: "${tkt}", observed_destination_zone: 5 }
              as: Conductor
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /upgrades"
              payload: { inspection_id: "${insp}", ticket_id: "${tkt}" }
              as: Conductor
              captures: { upg: $.data.id }
          assert:
            - "Inspection.${insp}.result == UPGRADE_REQUIRED"
            - "Upgrade.${upg}.upgrade_fare_cents == 1100"
            - "Ticket.${tkt}.destination_zone == 5"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: monthly_pass_same_month_overlap_rejected
        grounds:
          - validations[priority=8]
          - state_machines.Ticket.PURCHASED_to_ACTIVATED
        distinguishing_aspect: |
          Interval semantics: half-open calendar-month validity on the Passenger resource. Two MONTHLY
          tickets for the same (1->3) zone pair activated in the same March month overlap; activating the
          second is rejected with ERR_PASS_PERIOD_OVERLAP. (Adjacent months would touch at the boundary
          and be allowed.)
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct MONTHLY (1->3 base 20000). Passenger buys two such passes; first is activated (validity March)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "MONTHLY", base_fare_cents: 20000, peak_surcharge_cents: 0, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fpm: $.data.id }
            - call: "POST /passengers"
              payload: { email: "o@x.com", full_name: "O", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fpm}", travel_period: "OFF_PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt1: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fpm}", travel_period: "OFF_PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt2: $.data.id }
            - call: "POST /tickets/${tkt1}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
          trigger:
            - call: "POST /tickets/${tkt2}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PASS_PERIOD_OVERLAP"
            - "HTTP status == 409"
            - "Ticket.${tkt2}.status == PURCHASED"

      - name: disruption_window_within_buffer_rejected
        grounds:
          - validations[priority=8]
          - entities.ServiceDisruption.window_start
        distinguishing_aspect: |
          Interval semantics: closed windows with a 15-minute buffer on the line resource. A second
          disruption on line L3 whose window starts 10 minutes after the first window ends (< 15-minute
          buffer) is rejected with ERR_DISRUPTION_WINDOW_CONFLICT — different interval arithmetic (buffer,
          not adjacency) and a different resource entity than the monthly-pass overlap.
        test_recipe:
          setup:
            - "Clock 2026-03-01. One disruption on line L3, window [10:00,10:30]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /service-disruptions"
              payload: { line_code: "L3", scheduled_departure: "2026-03-05T10:00:00Z", actual_departure: "2026-03-05T10:40:00Z", window_start: "2026-03-05T10:00:00Z", window_end: "2026-03-05T10:30:00Z" }
              as: FareAdmin
              captures: { dis1: $.data.id }
          trigger:
            - call: "POST /service-disruptions"
              payload: { line_code: "L3", scheduled_departure: "2026-03-05T10:40:00Z", actual_departure: "2026-03-05T11:20:00Z", window_start: "2026-03-05T10:40:00Z", window_end: "2026-03-05T11:00:00Z" }
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_DISRUPTION_WINDOW_CONFLICT"
            - "HTTP status == 409"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_agency_revenue_to_zero
        grounds:
          - calculations.revenue_apportionment
          - state_machines.Ticket.PURCHASED_to_REFUNDED
          - state_machines.RefundRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity = sum of Ticket.revenue_allocations[].amount_cents (recognized agency
          revenue). Forward purchase makes the allocations sum to 1300; the compensating refund of the
          unactivated SINGLE ticket zeroes every allocation so the sum returns to 0 — no revenue drift.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Agencies A[1],B[2],C[3]. FareProduct SINGLE (1->3 base 1000 peak 300) ZONE_COUNT. Passenger buys PEAK (1300, allocations sum 1300), then WALLET refund requested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /agencies"
              payload: { code: "A", zones_served: [1] }
              as: FareAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /agencies"
              payload: { code: "B", zones_served: [2] }
              as: FareAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /agencies"
              payload: { code: "C", zones_served: [3] }
              as: FareAdmin
              captures: { ag_c: $.data.id }
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "p@x.com", full_name: "P", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt}", reason: "err", refund_destination: "WALLET" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: FareAdmin
          assert:
            - "Ticket.${tkt}.status == REFUNDED"
            - "sum of Ticket.${tkt}.revenue_allocations[].amount_cents == 0"
            - "Passenger.${pax}.wallet_credit_cents == 1100"

      - name: void_conserves_wallet_balance
        grounds:
          - state_machines.ServiceCredit.ISSUED_to_VOIDED
          - entities.Passenger.wallet_credit_cents
          - calculations.service_credit_amount
        distinguishing_aspect: |
          Conserved quantity = Passenger.wallet_credit_cents (store-credit balance, a different
          conserved quantity than agency revenue). Issuing a 325-cent service credit raises the wallet
          to 325; the compensating void subtracts 325, returning the wallet to its pre-issue value 0.
        test_recipe:
          setup:
            - "Clock 2026-03-01. FareProduct SINGLE (1->3 base 1000 peak 300). Passenger buys PEAK (1300), wallet 0. Disruption 45-min delay. Service credit issued (325, wallet 325)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "q@x.com", full_name: "Q", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /service-disruptions"
              payload: { line_code: "L4", scheduled_departure: "2026-03-01T08:00:00Z", actual_departure: "2026-03-01T08:45:00Z", window_start: "2026-03-01T08:00:00Z", window_end: "2026-03-01T09:00:00Z" }
              as: FareAdmin
              captures: { dis: $.data.id }
            - call: "POST /service-credits"
              payload: { disruption_id: "${dis}", ticket_id: "${tkt}" }
              as: FareAdmin
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /service-credits/${sc}/void"
              payload: { reason: "recorded in error" }
              as: FareAdmin
          assert:
            - "ServiceCredit.${sc}.status == VOIDED"
            - "Passenger.${pax}.wallet_credit_cents == 0"
