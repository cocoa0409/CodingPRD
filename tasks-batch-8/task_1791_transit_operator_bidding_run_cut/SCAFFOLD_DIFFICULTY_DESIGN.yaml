          trigger:
            - call: "POST /api/daily-assignments/${asg_id}/close-out"
              payload: { actual_platform_minutes: 480 }
              as: PayrollClerk
            - call: "GET /api/daily-assignments/${asg_id}/pay-records"
              payload: {}
              as: PayrollClerk
          assert:
            - "FINAL PayRecord.overtime_minutes == 0 (480 == threshold, NOT above)"
            - "FINAL PayRecord.straight_minutes == 480"
            - "FINAL PayRecord.gross_cents == 24000"

      - name: vacation_slot_capacity_full_boundary
        grounds:
          - calculations.vacation_allocation_order
          - entities.VacationSlot.fields.allocated_count
        distinguishing_aspect: |
          Empty-set / count metric: granting when allocated_count == capacity
          (count boundary, not a numeric threshold crossing) MUST fail with
          ERR_VACATION_SLOT_FULL, reachable via POST /api/vacation-slots/{id}/grant.
        test_recipe:
          setup:
            - "VacationSlot V capacity 1, already allocated to operator X"
            - "operator Y has sufficient balance 200"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "VB", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EX", full_name: "Op X", hire_date: "2000-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { opx_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EY", full_name: "Op Y", hire_date: "2001-01-01", vacation_hours_balance: 200 }
