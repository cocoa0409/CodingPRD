      - call: POST /emergency/patient-records/${p1}/transfer
        payload:
          site_id: ${site_id}
        as: PlanningChief
      trigger:
      - call: POST /emergency/alternate-care-sites/${site_id}/demobilize
        as: IncidentCommander
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_PATIENTS_STILL_ON_SITE (HTTP 409)
      - AlternateCareSite.${site_id}.status remains ACTIVATED with current_census
        == 1
  - name: acs_activate_outside_commit_window_rejected
    claim_type: violation_to_error
    grounds:
    - state_machines.AlternateCareSite.COMMITTED_to_ACTIVATED
    - errors[ERR_OUTSIDE_COMMIT_WINDOW]
    distinguishing_aspect: Activation requires the logical clock to fall inside a
      committed window; a September window cannot be activated in August.
    test_recipe:
      setup:
      - Incident ACTIVATED; site committed for 2026-09-01 to 2026-09-02 while the
        clock reads 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-window
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/alternate-care-sites
        payload:
          site_name: Hall-5
          address: 19 Hall Rd
          bed_capacity: 20
        as: LogisticsChief
        captures:
          site_id: $.data.id
      - call: POST /emergency/alternate-care-sites/${site_id}/commit
        payload:
          incident_id: ${inc_id}
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2026-09-02T00:00:00Z'
        as: IncidentCommander
      trigger:
      - call: POST /emergency/alternate-care-sites/${site_id}/activate
        as: IncidentCommander
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_OUTSIDE_COMMIT_WINDOW (HTTP 422)
      - AlternateCareSite.${site_id}.status remains COMMITTED
  - name: transfer_state_vs_capacity_priority
    claim_type: priority_ordering
    grounds:
    - validations[priority=8]
    - validations[priority=10]
    excluded_because:
      difficulty_instance: transfer_discharged_patient_to_full_site_state_beats_safety
      rationale: Dual-failure priority (state beats business_safety) asserted in the
        named §1.8 instance.
  - name: match_referential_vs_constraint_priority
    claim_type: priority_ordering
    grounds:
    - validations[priority=12]
    - validations[priority=14]
    excluded_because:
      difficulty_instance: match_cross_incident_referential_beats_ref_mismatch_constraint
      rationale: Dual-failure priority (referential beats constraint) asserted in
        the named §1.8 instance.
