        distinguishing_aspect: |
          residual_stromal_bed_um == MIN_RESIDUAL_BED_UM (exactly 350) APPROVES (>=, inclusive), while 349 rejects with THIN_BED;
          numeric-threshold metric reached via POST /screenings/{id}/adjudicate. Inputs: thickness 496, error 3.0 -> ablation 36 -> residual 350.
        test_recipe:
