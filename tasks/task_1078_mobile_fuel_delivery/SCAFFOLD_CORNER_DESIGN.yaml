  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_fleet_account_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fleet-account-update-stale-version]"
          - "errors[ERR_STALE_FLEET_ACCOUNT_VERSION]"
        distinguishing_aspect: "After one PATCH bumps FleetAccount.version 1->2, a second PATCH still carrying expected_fleet_account_version=1 is rejected with ERR_STALE_FLEET_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["FLEET customer + FleetAccount (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "OccFleet", email: "ops@occfleet.com", customer_type: "FLEET" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { customer_id: "${cust_id}", monthly_budget_cap_cents: 100000, allowed_fuel_types: ["REGULAR"], allowed_addons: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_id: $.data.id, fa_v1: $.data.version }
            - call: "PATCH /fleet-accounts/${fa_id}"
              payload: { expected_fleet_account_version: "${fa_v1}", monthly_budget_cap_cents: 120000 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_v2: $.data.version }
          trigger:
            - call: "PATCH /fleet-accounts/${fa_id}"
              payload: { expected_fleet_account_version: "${fa_v1}", monthly_budget_cap_cents: 130000 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_FLEET_ACCOUNT_VERSION"
            - "response.http_status == 412"
            - "FleetAccount.${fa_id}.version == 2"
            - "FleetAccount.${fa_id}.monthly_budget_cap_cents == 120000"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fleet-account-update-stale-version]"
          - "entities.FleetAccount.fields.monthly_budget_cap_cents"
        distinguishing_aspect: "A PATCH carrying the current expected_fleet_account_version succeeds, applies the field, and increments version 1->2."
        test_recipe:
          setup: ["FLEET customer + FleetAccount (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "OkFleet", email: "ops@okfleet.com", customer_type: "FLEET" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { customer_id: "${cust_id}", monthly_budget_cap_cents: 100000, allowed_fuel_types: ["REGULAR"], allowed_addons: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_id: $.data.id, fa_v1: $.data.version }
          trigger:
            - call: "PATCH /fleet-accounts/${fa_id}"
              payload: { expected_fleet_account_version: "${fa_v1}", allowed_fuel_types: ["REGULAR", "DIESEL"] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_v2: $.data.version }
          assert:
            - "FleetAccount.${fa_id}.version == 2"

