            - "${app_status_after} == \"REVISION_REQUESTED\" with revision_count 1 and revision_reason \"PLEDGE_CAMPAIGN_UNDERPERFORMING\" — the dollar compensation does NOT auto-reverse the application cascade; only a fresh submit-underwriting can"
