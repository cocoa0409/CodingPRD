            - "${e_clip} == ERR_SHARED_CLIP_NOT_FOUND"
            - "${e_post} == ERR_POST_NOT_FOUND"
            - "${e_case} == ERR_MODERATION_CASE_NOT_FOUND"
            - "${e_report} == ERR_TRANSPARENCY_REPORT_NOT_FOUND"
            - "the nine captured error_ids are pairwise distinct"

      - name: missing_or_empty_auth_headers_return_unauthenticated
        claim_type: error_triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - endpoints[POST /neighborhood-safety/devices]
        distinguishing_aspect: "Authentication is checked before existence and before role: a call with no X-Role at all, a call with an unrecognised role string, and a Resident-role call whose X-User-ID is an empty string all return 401 ERR_UNAUTHENTICATED — even when the referenced resident id in the body does not exist."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "No headers at all", grid_x_m: 0, grid_y_m: 10 }
              as: NoRoleHeader
              captures: { e_missing: "$.data.error_id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Unknown role", grid_x_m: 0, grid_y_m: 11 }
              as: NotARealRole
              as_user_id: "someone"
              captures: { e_bogus: "$.data.error_id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "00000000-0000-4000-8000-000000000099", label: "Empty user id", grid_x_m: 0, grid_y_m: 12 }
              as: Resident
              as_user_id: ""
              captures: { e_empty: "$.data.error_id" }
            - call: "GET /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { list_total: "$.meta.total_count" }
          assert:
            - "all three writes return HTTP 401"
            - "${e_missing} == ERR_UNAUTHENTICATED"
            - "${e_bogus} == ERR_UNAUTHENTICATED"
            - "${e_empty} == ERR_UNAUTHENTICATED — the 401 wins over the 404 the unknown owner id would otherwise cause"
            - "${list_total} == 0 — no Device row was created by any of the three attempts"

      - name: audit_review_before_the_request_is_flagged_returns_audit_not_pending
        claim_type: error_triggerability
        grounds:
          - errors.ERR_AUDIT_NOT_PENDING
          - validations[priority=17]
          - state_machines.VideoRequest.compliance_state.AUDIT_FLAGGED_to_AUDIT_CLEARED
          - endpoints[POST /neighborhood-safety/video-requests/{id}/audit-review]
        distinguishing_aspect: "With radius 500 and only three eligible cameras neither AUDIT trigger fires, so the request stays at JUSTIFICATION_LOGGED after submit; an AUDITOR's review is then refused with 409 ERR_AUDIT_NOT_PENDING and the auditor's audits_completed_count stays 0."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer O1 REQUESTER (B-100) and officer O2 AUDITOR (B-200); three cameras at (0,10), (0,20), (0,30); the area at (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED with a roster of 3 and its request has been justified and submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
