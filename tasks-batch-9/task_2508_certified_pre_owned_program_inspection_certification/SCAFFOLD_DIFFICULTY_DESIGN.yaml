      - name: reconditioning_reimbursement_round_per_item_then_sum
        grounds:
          - calculations.reconditioning_reimbursement
          - entities.ProgramConfig.fields.recon_reimbursement_share
          - entities.ReconditioningItem.fields.reimbursable_cents
          - entities.Inspection.fields.total_reimbursable_cents
