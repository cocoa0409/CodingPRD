              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token, loy_id: $.data.loyalty_account_id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /cycles/${c1}/lock"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/charge"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/dispatch"
              payload: { service_level: "STANDARD" }
              as: OpsAdmin
            - call: "POST /cycles/${c1}/deliver"
              payload: {}
              as: OpsAdmin
            - call: "POST /loyalty-accounts/${loy_id}/redemptions"
              payload: { points: 500 }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /cycles/${c1}/return"
              payload: {}
              as: OpsAdmin
            - call: "GET /refunds"
              payload: { cycle_id: "${c1}" }
              as: OpsAdmin
              captures: { refund_id: "$.data[0].id" }
            - call: "POST /refunds/${refund_id}/approve"
