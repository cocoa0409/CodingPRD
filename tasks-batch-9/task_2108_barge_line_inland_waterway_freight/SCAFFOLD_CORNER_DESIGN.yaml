      - name: lock_closure_cancels_live_slots_and_charges_the_closure_delay
        claim_type: Cross-entity
        grounds:
          - state_machines.Lock.OPEN_to_CLOSED
          - calculations.lock_delay_attribution
          - entities.Tow.fields.accrued_delay_minutes
          - errors[ERR_LOCK_CLOSED]
        distinguishing_aspect: "Closing a chamber is a different cascade trigger from clearing one: every REQUESTED and GRANTED slot moves to CANCELLED and each affected tow takes the flat 240-minute closure delay, and a fresh reservation at the closed chamber is then refused with ERR_LOCK_CLOSED."
        test_recipe:
          setup: ["Lock Chain of Rocks OPEN; two empty tows, one holding a GRANTED slot at 08:00 and one a REQUESTED slot at 12:00."]
          setup_api_calls:
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock_id: $.data.id }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Foxtrot", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Golf", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { t2_id: $.data.id, t2_v: $.data.version }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t1_id}", requested_start_at: "2026-08-15T08:00:00Z", expected_tow_version: "${t1_v}" }
              as: TowboatDispatcher
              captures: { r1_id: $.data.id }
            - call: "POST /lock-reservations/${r1_id}/grant"
              payload: {}
              as: LockMaster
              as_user_id: "${lock_id}"
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t2_id}", requested_start_at: "2026-08-15T12:00:00Z", expected_tow_version: "${t2_v}" }
              as: TowboatDispatcher
              captures: { r2_id: $.data.id }
            - call: "GET /tows/${t2_id}"
              payload: {}
              as: TowboatDispatcher
              captures: { t2_v2: $.data.version }
          trigger:
            - call: "POST /locks/${lock_id}/set-status"
              payload: { status: "CLOSED" }
              as: LockMaster
              as_user_id: "${lock_id}"
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t2_id}", requested_start_at: "2026-08-16T08:00:00Z", expected_tow_version: "${t2_v2}" }
              as: TowboatDispatcher
              captures: { closed_error: $.data.error_id }
          assert:
            - "Lock.${lock_id}.status == CLOSED and granted_reservation_count == 0"
            - "LockReservation.${r1_id}.status == CANCELLED and LockReservation.${r2_id}.status == CANCELLED"
            - "Tow.${t1_id}.accrued_delay_minutes == 240 and Tow.${t2_id}.accrued_delay_minutes == 240"
            - "Tow.${t1_id}.status == BUILDING - the DELAYED flip only applies to UNDERWAY tows"
            - "Tow.${t1_id}.pending_lock_reservation_count == 0 and Tow.${t2_id}.pending_lock_reservation_count == 0"
            - "${closed_error} == ERR_LOCK_CLOSED with HTTP 409"

