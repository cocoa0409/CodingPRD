      - name: shared_operations_accept_either_owning_role
        claim_type: role_allowed
        grounds:
          - roles.TalentBuyer.shared_operations
          - roles.BusinessAffairs.shared_operations
          - endpoints[POST /festival-ops/bookings/{id}/cancel]
          - endpoints[POST /festival-ops/announcement-waves/{id}/lock]
        distinguishing_aspect: |
          Four operations are declared shared, and sharing means the two roles are
          interchangeable rather than that one leads: BusinessAffairs cancels one
          booking and TalentBuyer cancels the other with identical effects, and the
          wave lock succeeds for BusinessAffairs even though every other wave endpoint
          is TalentBuyer-exclusive. The competing-performance report is filed by
          TalentBuyer here, the role usually associated with buying rather than
          enforcement.
        test_recipe:
