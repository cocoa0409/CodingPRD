  - name: calc_bioload_ledger_holds_through_transfer_pending_and_releases_on_completion
    claim_type: aggregation
    grounds:
    - §1.3 exhibit_bioload_ledger (TRANSFER_PENDING still contributes)
    - §1.2 TransferRequest DRAFT -> SUBMITTED (specimen -> TRANSFER_PENDING with pre_transfer_disposition recorded)
    - §1.2 TransferRequest SUBMITTED -> APPROVED
    - §1.2 TransferRequest APPROVED -> COMPLETED
    - §1.4 priority 36 (ERR_TRANSFER_DATE_NOT_REACHED)
    - §1.6 ERR_TRANSFER_DATE_NOT_REACHED (409)
    - §1.1 Specimen.pre_transfer_disposition
    - §1.3 transfer_condition_requirement
