            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "WEEKLY", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "MEMBERSHIP", expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /enrollments/${e1}/cancel"
              payload: {}
              as: Guardian
