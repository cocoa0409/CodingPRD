  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: anchor_certification_changes_required_cycle
        grounds:
          - state_machines.AnchorCertification.SUBMITTED_to_CHANGES_REQUIRED
          - state_machines.AnchorCertification.CHANGES_REQUIRED_to_SUBMITTED
          - state_machines.AnchorCertification.SUBMITTED_to_CERTIFIED
          - calculations.anchor_certification_evaluation
          - entities.AnchorCertification.fields.revision_round
          - validations[priority=27]
        distinguishing_aspect: |
          The SAME AnchorCertification row re-enters SUBMITTED after
          CHANGES_REQUIRED, so its status is not monotonic: a linear implementation
          that treats CHANGES_REQUIRED as terminal (or that creates a fresh row per
          revision) cannot show revision_round advancing 1 -> 2 on one id while
          hud_pass flips false -> true, and the cycle is bounded by
          MAX_ANCHOR_REVISIONS rather than by state ordering.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one licensed SetCrew, one single-section AZ order in wind zone I (required_anchors = 8)"
            - "a set job booked for that order"
            - "an anchoring package submitted with only 6 anchors and 6 straps, so both hud_pass and state_pass are false, then sent back with REQUEST_CHANGES"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v}" }
              as: NetworkAdmin
              captures: { job_id: $.data.id }
            - call: "POST /installations/anchor-certifications"
              payload: { set_job_id: "${job_id}", anchor_count: 6, avg_torque_ft_lb: 180, strap_count: 6, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "REQUEST_CHANGES", findings: "anchor count short of zone I requirement" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
          trigger:
            - call: "POST /installations/anchor-certifications/${cert_id}/resubmit"
              payload: { anchor_count: 8, avg_torque_ft_lb: 175, strap_count: 8, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "CERTIFY", findings: "corrected package accepted" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
          assert:
            - "after trigger step 1: AnchorCertification.${cert_id}.status == SUBMITTED"
            - "after trigger step 1: AnchorCertification.${cert_id}.revision_round == 2"
            - "after trigger step 1: AnchorCertification.${cert_id}.hud_pass == true"
            - "after trigger step 1: AnchorCertification.${cert_id}.state_pass == true"
            - "after trigger step 2: AnchorCertification.${cert_id}.status == CERTIFIED"
            - "after trigger step 2: AnchorCertification.${cert_id}.certifier_user_id == \"insp-anchor-1\""
            - "the cycle stays on one row: the id returned by every call equals ${cert_id}"

      - name: set_job_parallel_dimensions_advance_independently
        grounds:
          - state_machines.SetJob.scope_status_SCOPE_PENDING_to_SCOPE_SPLIT
          - state_machines.SetJob.scope_status_SCOPE_SPLIT_to_SCOPE_DELIVERED
          - entities.SetJob.fields.progress_status
          - entities.SetJob.fields.scope_status
          - entities.SetJob.fields.crossover_recorded
          - calculations.installation_invoice_total
        distinguishing_aspect: |
          SetJob carries two orthogonal status dimensions: the scope dimension walks
          SCOPE_PENDING -> SCOPE_SPLIT -> SCOPE_DELIVERED while progress_status
          remains exactly SCHEDULED, so the observable state is the cross-product
          (SCHEDULED, SCOPE_DELIVERED) - a single-enum implementation that folds the
          two dimensions together cannot represent it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one licensed SetCrew, one single-section AZ order"
            - "a set job booked with labor_base_cents 480000 and never dispatched"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v}" }
              as: NetworkAdmin
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /installations/set-jobs/${job_id}/scope-split"
              payload: { skirting_owner: "INSTALLER", steps_owner: "INSTALLER", skirting_linear_ft: 52, steps_count: 1 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
            - call: "POST /installations/set-jobs/${job_id}/utility-crossover"
              payload: { crossover_count: 3 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
          assert:
            - "after trigger step 1: SetJob.${job_id}.scope_status == SCOPE_SPLIT"
            - "after trigger step 1: SetJob.${job_id}.progress_status == SCHEDULED"
            - "after trigger step 1: SetJob.${job_id}.skirting_fee_cents == 96200"
            - "after trigger step 1: SetJob.${job_id}.steps_fee_cents == 42000"
            - "after trigger step 2: SetJob.${job_id}.scope_status == SCOPE_DELIVERED"
            - "after trigger step 2: SetJob.${job_id}.progress_status == SCHEDULED"
            - "after trigger step 2: SetJob.${job_id}.crossover_fee_cents == 114000"
            - "after trigger step 2: SetJob.${job_id}.crossover_recorded == true"
            - "after trigger step 2: SetJob.${job_id}.invoice_total_cents == null"
            - "after trigger step 2: SetJob.${job_id}.closure_status == NOT_ASSESSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: permit_revoke_five_level_transport_cascade
        grounds:
          - state_machines.TransportPermit.ISSUED_to_REVOKED
          - state_machines.RouteLeg.SCHEDULED_to_CANCELLED
          - state_machines.EscortAssignment.RESERVED_to_RELEASED
          - state_machines.HomeSection.IN_TRANSIT_to_PERMIT_REVOKED_HOLD
          - calculations.escort_reserved_minutes
          - calculations.order_posture
        distinguishing_aspect: |
          One revoke call propagates five levels - permit -> its SCHEDULED legs ->
          their RESERVED escort assignments -> the escort crew's reserved_minutes
          ledger -> the section's transit_status -> the order's posture - and the
          cascade is conditional at level 2: the already-IN_TRANSIT leg 1 is left
          untouched while only the SCHEDULED leg 2 is cancelled.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one EscortCrew with buffer_minutes 45 and max_reserved_minutes 1200"
            - "a single-section AZ order, section 168 in wide, released, with an AZ permit for 2 planned legs"
            - "two route legs created; an 8-hour escort reservation placed on leg 2 (480 minutes)"
            - "the permit fee of 21000 paid and the permit ISSUED; leg 1 has departed so the section is IN_TRANSIT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
