              payload: { email: "rb1@x.com", full_name: "RB1", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /api/plans"
              payload: { code: "LOW_INCOME", unlock_fee_cents: 50, per_minute_cents: 15, daily_cap_cents: 500, slow_zone_discount_pct: 0.50 }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE (403)"

      - name: technician_cannot_complete_task_they_do_not_own
        claim_type: peer_roles
        grounds: ["roles", "state_machines.RebalancingTask.ASSIGNED_to_COMPLETED", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Technician completing a task assigned to a DIFFERENT technician is rejected; the acting technician is not RebalancingTask.technician_id, yielding ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["a task ASSIGNED to technician A; technician B attempts to complete it"]
          setup_api_calls:
            - call: "POST /api/zones"
              payload: { name: "Z23", zone_type: "RIDE_OK", priority: 5 }
