          setup:
            - "One STRAWBERRY block with one passing water sample (posture CLEARED)."
            - "One DOMESTIC crew of two pickers, support plan complete, CERTIFIED then ACTIVE."
            - "One OPEN harvest window on 2026-08-03, piece rate 45, clamshell 1.00 lb."
            - "Picker One's session tallied 3.00 h / 20 clamshells / 0 culled and APPROVED, so Crew.accrued_wage_cents is 4950."
            - "Picker Two's session created and left OPEN (never tallied)."
            - "One grade-A lot of 50 clamshells packed against the window, UNCOMMITTED and off hold."
