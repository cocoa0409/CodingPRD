  - rule_id: resource_temporal_overlap
    instances:
      - name: account_case_slot_half_open
        grounds:
          - validations[priority=8]
          - errors[ERR_OPEN_CASE_EXISTS]
        distinguishing_aspect: |
          Resource: Account (processing slot). Interval semantics: half-open occupation —
          a case occupies its source account from creation until it reaches a terminal
          state; a second submit on the same account fails ERR_OPEN_CASE_EXISTS while the
          first is non-terminal, and succeeds immediately after the first turns CANCELLED
          (the occupation interval end is excluded).
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01; P1 SEPARATED SINGLE; account A1 PRE_TAX 500,000"
            - "case1 INDIRECT on A1 submitted (DOCS_PENDING, non-terminal); case2 INDIRECT on A1 created (DRAFT allowed)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "DIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust" }, as: Participant, as_user_id: "${p1}", captures: { c2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c2}/submit", payload: {}, as: Participant, as_user_id: "${p1}", captures: { err_open: "$.data.error_id" } }
            - { call: "POST /v1/rollover-cases/${c1}/cancel", payload: {}, as: Participant, as_user_id: "${p1}", captures: { c1_status: "$.data.status" } }
            - { call: "POST /v1/rollover-cases/${c2}/submit", payload: {}, as: Participant, as_user_id: "${p1}", captures: { c2_status: "$.data.status" } }
          assert:
            - "while case1 occupies the slot: submit of case2 -> ERR_OPEN_CASE_EXISTS (${err_open})"
            - "case1 cancelled -> CANCELLED (${c1_status}), occupation interval closes (half-open end)"
            - "identical submit of case2 now succeeds: status DOCS_PENDING (${c2_status})"

      - name: freeze_window_closed_interval_collision
        grounds:
          - validations[priority=7]
          - errors[ERR_FREEZE_WINDOW_OVERLAP]
          - errors[ERR_WINDOW_RANGE_INVALID]
        distinguishing_aspect: |
          Resource: Plan (freeze calendar). Interval semantics differ from the sibling's
          half-open occupation: freeze windows are CLOSED inclusive date intervals, so
          [2026-06-20, 2026-06-30] collides with [2026-06-10, 2026-06-20] (shared inclusive
          endpoint), while the adjacent [2026-06-21, 2026-06-30] is accepted; a range with
          start > end is separately rejected ERR_WINDOW_RANGE_INVALID.
        test_recipe:
          setup:
            - "Plan A exists; one freeze window [2026-06-10, 2026-06-20] already created"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/plans/${plan_a}/freeze-windows", payload: { start_date: "2026-06-10", end_date: "2026-06-20", reason: "conversion blackout" }, as: PlanSponsorAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/plans/${plan_a}/freeze-windows", payload: { start_date: "2026-06-20", end_date: "2026-06-30", reason: "overlap at inclusive endpoint" }, as: PlanSponsorAdmin, captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /v1/plans/${plan_a}/freeze-windows", payload: { start_date: "2026-06-21", end_date: "2026-06-30", reason: "adjacent is allowed" }, as: PlanSponsorAdmin, captures: { w3: "$.data.id" } }
            - { call: "POST /v1/plans/${plan_a}/freeze-windows", payload: { start_date: "2026-08-01", end_date: "2026-07-15", reason: "inverted range" }, as: PlanSponsorAdmin, captures: { err_range: "$.data.error_id" } }
          assert:
            - "shared inclusive endpoint 2026-06-20 collides: error_id == ERR_FREEZE_WINDOW_OVERLAP (${err_overlap})"
            - "adjacent window starting 2026-06-21 accepted: id ${w3} (adjacency is not overlap under closed-interval semantics)"
            - "inverted range rejected: error_id == ERR_WINDOW_RANGE_INVALID (${err_range})"

  - rule_id: compensating_invariant
    instances:
      - name: transfer_balance_basis_conservation
        grounds:
          - state_machines.RolloverCase.ACCEPTANCE_PENDING_to_COMPLETED
          - calculations.vested_balance
        distinguishing_aspect: |
          Conserved quantity: aggregate money across accounts. A plan-to-plan transfer must
          leave SUM(balance_cents) == 11,600,000 AND SUM(basis_cents) == 1,300,000 across
          source + receiving accounts unchanged, with per-source rows mirrored exactly
          (including the unvested employer remainder and the 60% vesting) — no drift, no
          forfeiture, and zero tax forms produced for the case.
        test_recipe:
          setup:
            - "Plans A and B, clock 2026-05-01; P1 SEPARATED SINGLE; canonical A1; empty receiving account A1B in Plan B; no loans"
            - "PLAN_TRANSFER case A1 -> Plan B approved (ACCEPTANCE_PENDING)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/plans", payload: { plan_name: "Plan B", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_b: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
