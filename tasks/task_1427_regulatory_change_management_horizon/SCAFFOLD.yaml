# =============================================================================
# SCAFFOLD: Regulatory Change Management & Horizon Scanning (corporate compliance)
# Difficulty calibration: Expert+ (requester: harder than expert)
# =============================================================================

scenario: |
  Regulatory Change Management & Horizon Scanning (corporate compliance office): regulatory feed monitoring & applicability triage, impact assessment assignment to business owner, gap analysis against current controls/policies, implementation plan & deadline tracking, policy/procedure update & training rollout, evidence of implementation for examiners, obligation register maintenance & mapping to controls, board/committee reporting

domain_name: regulatory-change-management
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency      # OCC on RegulatoryChange / ObligationRegister / Control versions
    - cascading_side_effects      # accept -> gap creation -> zero-coverage escalation; seal -> plan VERIFIED -> change CLOSED
    - dual_variant_calculation    # provisional vs confirmed impact rating; calendar vs business-day deadlines
    - scheduled_actions           # logical clock drives deadline postures, escalations, retract windows
  entity_topology: flat           # peer collections joined by FK references; filtered lists for reverse lookup
  state_machine_shape: compound   # cyclic re-triage + parallel plan dimensions + bubble-up change closure
  relationship_patterns:
    - one_to_many
    - many_to_many                # Obligation <-> Control via ObligationControlMapping
    - self_referential            # RegulatoryChange.supersedes_change_id / ImpactAssessment.supersedes_assessment_id
    - polymorphic                 # Escalation.target_id -> ImplementationPlan | Obligation
    - cross_aggregate             # plans pin register versions; gaps snapshot obligation criticality
  role_model: segregation_of_duties  # user-level SoD on triage / mapping approval / policy approval
  consistency_model: immediate    # every mutation + cascades visible in the same request's reads

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessOwner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business owner full name" }
      - { name: department, type: string, source: input, description: "Owning department label (free-form, e.g. 'ENG', 'OPS')" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: active_assessment_count, type: integer, source: computed, default: 0, description: "Count of ImpactAssessments with business_owner_id == this owner and status IN {ASSIGNED, IN_PROGRESS, RETURNED, SUBMITTED}" }
      - { name: open_escalation_count, type: integer, source: computed, default: 0, description: "Count of Escalations with business_owner_id == this owner and status IN {OPEN, ACKNOWLEDGED}" }
      - { name: assignment_suspended, type: boolean, source: computed, default: false, description: "True when open_escalation_count >= 3; blocks new ImpactAssessment assignment" }

  - name: RegulatoryChange
    parent: null
    common_fields: true
    fields:
      - { name: citation, type: string, source: input, description: "Regulatory citation identifier (e.g. '12 CFR Part 1005')" }
      - { name: title, type: string, source: input, description: "Change title" }
      - { name: summary, type: string, source: input, description: "Change summary text" }
      - { name: feed_source, type: enum, source: input, description: "FED_REGISTER | STATE_BULLETIN | INT_JOURNAL | MANUAL_ENTRY" }
      - { name: jurisdiction, type: string, source: input, description: "Jurisdiction code (e.g. 'US-FED', 'US-CA', 'EU')" }
      - { name: regulator, type: string, source: input, description: "Issuing regulator name" }
      - { name: published_at, type: datetime, source: input, description: "Publication timestamp (ISO 8601 UTC)" }
      - { name: effective_date, type: datetime, source: input, description: "Date the regulation becomes effective" }
      - { name: comment_deadline, type: datetime, source: input, required: false, description: "Optional comment-period deadline" }
      - { name: severity_hint, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL — analyst hint feeding the provisional rating" }
      - { name: supersedes_change_id, type: string, source: input, required: false, description: "FK -> RegulatoryChange.id; set when this record is a newer revision of an existing change" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> RegulatoryChange.id; newer revision that superseded this change; null otherwise" }
      - { name: status, type: enum, source: system, description: "PENDING_TRIAGE | TRIAGED_APPLICABLE | TRIAGED_NOT_APPLICABLE | CLOSED | SUPERSEDED" }
      - { name: applicability, type: enum, source: system, default: "UNDETERMINED", description: "UNDETERMINED | APPLICABLE | NOT_APPLICABLE — set by triage" }
      - { name: triage_rationale, type: string, source: system, description: "Rationale captured from the most recent triage/retriage call" }
      - { name: triage_round, type: integer, source: system, default: 0, description: "Increments by 1 on every triage decision" }
      - { name: provisional_risk_tier, type: enum, source: system, description: "LOW | MEDIUM | HIGH | CRITICAL — impact_rating provisional variant, computed at triage" }
      - { name: risk_tier, type: enum, source: system, description: "Tier of the latest ACCEPTED ImpactAssessment; null until first acceptance" }
      - { name: business_owner_id, type: string, source: system, description: "FK -> BusinessOwner.id; most recently assigned owner; null until first assessment" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ingesting ComplianceOfficer" }
      - { name: triaged_by_user_id, type: string, source: system, description: "X-User-ID of the most recent triage actor; null until first triage" }

  - name: Obligation
    parent: null
    common_fields: true
    fields:
      - { name: obligation_code, type: string, source: input, description: "Register-unique obligation code (e.g. 'OBL-2026-001'); unique across all obligations ever created" }
      - { name: title, type: string, source: input, description: "Obligation title" }
      - { name: regulatory_change_id, type: string, source: input, description: "FK -> RegulatoryChange.id; change that introduced this obligation (must be TRIAGED_APPLICABLE)" }
      - { name: criticality, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL — drives requirement_points and deadline mandate" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED (RETIRED -> ACTIVE reinstatement allowed)" }

  - name: Control
    parent: null
    common_fields: true
    fields:
      - { name: control_code, type: string, source: input, description: "Unique control code (e.g. 'CTL-AML-014')" }
      - { name: title, type: string, source: input, description: "Control title" }
      - { name: owner_department, type: string, source: input, description: "Department owning the control" }
      - { name: review_frequency_days, type: integer, source: input, description: "Review cadence in days (> 0)" }
      - { name: last_reviewed_at, type: datetime, source: input, required: false, description: "Last review timestamp; updated by record-review to the logical clock" }
      - { name: effectiveness_factor, type: number, source: computed, default: 0.5, description: "1.0 if reviewed <= 90 days ago; 0.8 if 91-180 days; 0.5 if > 180 days or never reviewed" }
      - { name: next_review_due, type: datetime, source: computed, description: "last_reviewed_at + review_frequency_days; null when never reviewed" }
      - { name: policy_version, type: integer, source: computed, default: 1, description: "Current published policy version; bumped by policy publish, restored by retract" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: ObligationControlMapping
    parent: null
    common_fields: true
    fields:
      - { name: obligation_id, type: string, source: input, description: "FK -> Obligation.id; obligation must be ACTIVE" }
      - { name: control_id, type: string, source: input, description: "FK -> Control.id; control must be ACTIVE" }
      - { name: coverage_weight, type: integer, source: input, description: "Coverage weight 1..10 contributed when APPROVED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | RETIRED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of proposing ComplianceOfficer" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; SoD: must differ from created_by_user_id" }

  - name: ObligationRegister
    parent: null
    common_fields: true
    fields:
      - { name: current_version_number, type: integer, source: computed, default: 0, description: "Latest published register version number; 0 before first publish" }
      - { name: singleton_note, type: string, source: system, default: "SINGLETON", description: "Exactly one ObligationRegister row exists, auto-created at server boot" }

  - name: ObligationRegisterVersion
    parent: null
    common_fields: false
    fields:
      - { name: version_number, type: integer, source: system, description: "Sequential register version number (1, 2, ...)" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock value at publish" }
      - { name: obligation_codes, type: array, source: system, description: "Sorted snapshot of obligation_code values of all ACTIVE obligations at publish time" }
      - { name: obligation_count, type: integer, source: computed, description: "Length of obligation_codes" }
      - { name: register_checksum, type: string, source: computed, description: "sha256 hex of ('v' + version_number + '|' + join(',', sorted obligation_codes))" }

  - name: ImpactAssessment
    parent: null
    common_fields: true
    fields:
      - { name: regulatory_change_id, type: string, source: input, description: "FK -> RegulatoryChange.id; change must be TRIAGED_APPLICABLE" }
      - { name: business_owner_id, type: string, source: input, description: "FK -> BusinessOwner.id; assignee" }
      - { name: due_date, type: datetime, source: input, description: "Assessment due date; must be strictly after the logical clock at creation" }
      - { name: likelihood_score, type: integer, source: input, required: false, description: "1..5, supplied at submit" }
      - { name: severity_score, type: integer, source: input, required: false, description: "1..5, supplied at submit" }
      - { name: affected_business_lines, type: integer, source: input, required: false, description: ">= 1, supplied at submit" }
      - { name: findings_summary, type: string, source: input, required: false, description: "Free-text findings, supplied at submit" }
      - { name: impact_rating_raw, type: number, source: computed, description: "likelihood x severity x scope_multiplier; null until submit" }
      - { name: impact_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL; null until submit" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True when the logical clock at submit is strictly after due_date" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | IN_PROGRESS | SUBMITTED | RETURNED | ACCEPTED | SUPERSEDED" }
      - { name: supersedes_assessment_id, type: string, source: system, description: "FK -> ImpactAssessment.id; prior non-terminal assessment superseded by this creation; null when none" }
      - { name: return_count, type: integer, source: system, default: 0, description: "Number of times this assessment was RETURNED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submit; null until submitted" }

  - name: GapAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: impact_assessment_id, type: string, source: system, description: "FK -> ImpactAssessment.id; the ACCEPTED assessment that spawned this gap analysis" }
      - { name: obligation_id, type: string, source: system, description: "FK -> Obligation.id; obligation under analysis" }
      - { name: requirement_points, type: integer, source: computed, description: "Snapshot of obligation criticality points at creation: LOW=4, MEDIUM=8, HIGH=16, CRITICAL=32" }
      - { name: covered_points, type: number, source: computed, default: 0, description: "Sum over APPROVED mappings of (coverage_weight x control.effectiveness_factor); recomputed on mapping approve/retire and control record-review while status IN {OPEN, IN_REVIEW}" }
      - { name: residual_gap_points, type: number, source: computed, description: "max(0, requirement_points - covered_points), 2 decimals round_half_up; frozen at confirm" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | CONFIRMED" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of confirming ComplianceOfficer; null until confirmed" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock at confirm; null until confirmed" }

  - name: ImplementationPlan
    parent: null
    common_fields: true
    fields:
      - { name: gap_analysis_id, type: string, source: input, description: "FK -> GapAnalysis.id; gap must be CONFIRMED" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: target_completion_date, type: datetime, source: input, description: "Committed completion date; > clock and <= mandated deadline" }
      - { name: obligation_id, type: string, source: system, description: "FK -> Obligation.id; denormalized from the gap analysis" }
      - { name: regulatory_change_id, type: string, source: system, description: "FK -> RegulatoryChange.id; denormalized via gap -> assessment" }
      - { name: business_owner_id, type: string, source: system, description: "FK -> BusinessOwner.id; denormalized from the accepted assessment" }
      - { name: execution_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | IN_EXECUTION | COMPLETED | VERIFIED" }
      - { name: deadline_posture, type: enum, source: system, default: "ON_TRACK", description: "ON_TRACK | AT_RISK | OVERDUE — recomputed by clock/approve/extend while execution_status IN {APPROVED, IN_EXECUTION}" }
      - { name: pinned_register_version_number, type: integer, source: system, description: "ObligationRegister.current_version_number captured at approve; null until approved" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of granted deadline extensions (max 2)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting BusinessOwner" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ComplianceManager; null until approved" }
      - { name: verification_evidence_id, type: string, source: system, description: "FK -> EvidencePackage.id; set when sealing evidence verifies this plan; null until then" }

  - name: PolicyUpdate
    parent: null
    common_fields: true
    fields:
      - { name: control_id, type: string, source: input, description: "FK -> Control.id; control must be ACTIVE" }
      - { name: implementation_plan_id, type: string, source: input, required: false, description: "FK -> ImplementationPlan.id; optional linkage, plan must be in APPROVED | IN_EXECUTION | COMPLETED" }
      - { name: title, type: string, source: input, description: "Policy update title" }
      - { name: change_summary, type: string, source: input, description: "What the policy/procedure change contains" }
      - { name: effective_date, type: datetime, source: input, description: "Date the new policy takes effect; publish requires >= clock + 7 days" }
      - { name: new_policy_version, type: integer, source: system, description: "control.policy_version + 1 snapshotted at approve; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFTING | PENDING_APPROVAL | APPROVED | REJECTED | PUBLISHED | RETRACTED" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of drafting ComplianceOfficer" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving ComplianceManager; SoD: must differ from drafted_by_user_id" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock at publish; null until published" }

  - name: TrainingRollout
    parent: null
    common_fields: true
    fields:
      - { name: policy_update_id, type: string, source: system, description: "FK -> PolicyUpdate.id; the published update being rolled out" }
      - { name: control_id, type: string, source: system, description: "FK -> Control.id; denormalized from the policy update" }
      - { name: window_start, type: datetime, source: system, description: "Equals policy_update.published_at" }
      - { name: window_end, type: datetime, source: system, description: "Equals policy_update.effective_date; training must complete by then" }
      - { name: attestation_records, type: array, source: system, default: [], description: "Upserted attestation items {person_ref, department, completed, updated_at}; keyed by person_ref" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Distinct person_ref count in attestation_records" }
      - { name: completed_count, type: integer, source: computed, default: 0, description: "Records with completed == true" }
      - { name: completion_pct, type: number, source: computed, default: 0, description: "Per-department rounded mean, 1 decimal round_half_up (see training_completion_pct); 0.0 when no records" }
      - { name: past_due, type: boolean, source: computed, default: false, description: "True when logical clock > window_end and status == IN_PROGRESS" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED | CLOSED_WITH_EXCEPTIONS | CANCELLED" }

  - name: EvidencePackage
    parent: null
    common_fields: true
    fields:
      - { name: implementation_plan_id, type: string, source: input, description: "FK -> ImplementationPlan.id; plan must be COMPLETED; at most one package per plan" }
      - { name: artifacts, type: array, source: system, default: [], description: "Items {artifact_id (server-minted), artifact_type, uri, attached_at}; mutable only while ASSEMBLING" }
      - { name: artifact_count, type: integer, source: computed, default: 0, description: "Length of artifacts" }
      - { name: status, type: enum, source: system, description: "ASSEMBLING | SEALED | SUBMITTED_TO_EXAMINER" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical clock at seal; null until sealed" }
      - { name: examiner_reference, type: string, source: system, description: "Examiner reference supplied at submit-to-examiner; null until then" }

  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: system, description: "IMPLEMENTATION_PLAN | OBLIGATION" }
      - { name: target_id, type: string, source: system, description: "ID of the escalation target (polymorphic: ImplementationPlan.id when target_type=IMPLEMENTATION_PLAN, Obligation.id when OBLIGATION)" }
      - { name: trigger_rule, type: enum, source: system, description: "DEADLINE_BREACH | ZERO_COVERAGE" }
      - { name: business_owner_id, type: string, source: system, description: "FK -> BusinessOwner.id; set for DEADLINE_BREACH escalations (plan owner); null for ZERO_COVERAGE" }
      - { name: level, type: integer, source: system, default: 1, description: "Escalation level (1 on open)" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED" }
      - { name: resolution_code, type: enum, source: system, description: "EXTENSION_GRANTED | MANUAL_RESOLUTION; null until resolved" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock at resolution; null until resolved" }

  - name: CommitteeReport
    parent: null
    common_fields: true
    fields:
      - { name: committee_name, type: enum, source: input, description: "BOARD_RISK_COMMITTEE | AUDIT_COMMITTEE | EXECUTIVE_COMPLIANCE_COMMITTEE" }
      - { name: period_start, type: datetime, source: input, description: "Reporting window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting window end (exclusive); half-open [period_start, period_end)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PRESENTED" }
      - { name: metrics, type: object, source: computed, description: "Frozen at finalize: { overdue_plan_count, pending_triage_count, open_escalation_count, compliance_index, sla_compliance_pct }" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock at finalize; null until finalized" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: sequence_number, type: integer, source: system, description: "Strictly increasing from 1; replay order key" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the mutating call" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating call" }
      - { name: action, type: string, source: system, description: "Endpoint + transition label (e.g. 'POST /compliance/impact-assessments/{id}/accept')" }
      - { name: entity_type, type: string, source: system, description: "Primary mutated entity type" }
      - { name: entity_id, type: string, source: system, description: "Primary mutated entity id" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock at append" }
      - { name: prev_event_hash, type: string, source: system, description: "event_hash of the previous AuditEvent; 'GENESIS' for the first" }
      - { name: event_hash, type: string, source: computed, description: "sha256(prev_event_hash + '|' + sequence_number + '|' + actor_user_id + '|' + action + '|' + entity_type + '|' + entity_id + '|' + occurred_at)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RegulatoryChange
    initial_state: PENDING_TRIAGE
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: PENDING_TRIAGE
        to: TRIAGED_APPLICABLE
        trigger: "POST /compliance/regulatory-changes/{id}/triage with verdict=APPLICABLE"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING_TRIAGE (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "applicability = APPLICABLE; triage_rationale stored; triage_round += 1; triaged_by_user_id = actor"
          - "provisional_risk_tier computed via impact_rating (provisional variant)"
          - "AuditEvent appended"
      - from: PENDING_TRIAGE
        to: TRIAGED_NOT_APPLICABLE
        trigger: "POST /compliance/regulatory-changes/{id}/triage with verdict=NOT_APPLICABLE"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING_TRIAGE (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "applicability = NOT_APPLICABLE; triage_rationale stored; triage_round += 1; triaged_by_user_id = actor"
          - "provisional_risk_tier computed via impact_rating (provisional variant)"
          - "AuditEvent appended"
      - from: TRIAGED_NOT_APPLICABLE
        to: PENDING_TRIAGE
        trigger: "POST /compliance/regulatory-changes/{id}/retriage"
        actor: ComplianceOfficer
        preconditions:
          - "status == TRIAGED_NOT_APPLICABLE (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "applicability = UNDETERMINED; triage_rationale overwritten with retriage rationale; triaged_by_user_id unchanged"
          - "AuditEvent appended"
        note: "Cycle: a change initially ruled not applicable can be pulled back into triage any number of times."
      - from: PENDING_TRIAGE
        to: SUPERSEDED
        trigger: "system (side effect of POST /compliance/regulatory-changes carrying supersedes_change_id == this id)"
        actor: system
        preconditions:
          - "this change's status IN {PENDING_TRIAGE, TRIAGED_NOT_APPLICABLE} (else ERR_CHANGE_NOT_SUPERSEDABLE on the creating call)"
        side_effects:
          - "superseded_by_id = new change id"
          - "AuditEvent appended"
      - from: TRIAGED_NOT_APPLICABLE
        to: SUPERSEDED
        trigger: "system (side effect of POST /compliance/regulatory-changes carrying supersedes_change_id == this id)"
        actor: system
        preconditions:
          - "this change's status IN {PENDING_TRIAGE, TRIAGED_NOT_APPLICABLE} (else ERR_CHANGE_NOT_SUPERSEDABLE on the creating call)"
        side_effects:
          - "superseded_by_id = new change id"
          - "AuditEvent appended"
      - from: TRIAGED_APPLICABLE
        to: CLOSED
        trigger: "system (evaluated on every EvidencePackage seal touching a plan of this change)"
        actor: system
        preconditions:
          - "Every ACTIVE obligation with regulatory_change_id == this change has >= 1 ImplementationPlan, and no plan of those obligations is in {DRAFT, SUBMITTED, REJECTED, APPROVED, IN_EXECUTION, COMPLETED} (i.e., all their plans are VERIFIED)"
        side_effects:
          - "AuditEvent appended"
        note: "Bubble-up compound transition driven by the seal cascade."

  - entity: ImpactAssessment
    initial_state: ASSIGNED
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /compliance/impact-assessments/{id}/start"
        actor: BusinessOwner
        preconditions:
          - "status IN {ASSIGNED, RETURNED} (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["AuditEvent appended"]
      - from: RETURNED
        to: IN_PROGRESS
        trigger: "POST /compliance/impact-assessments/{id}/start"
        actor: BusinessOwner
        preconditions:
          - "status IN {ASSIGNED, RETURNED} (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["AuditEvent appended"]
        note: "Revision loop: RETURNED assessments re-enter IN_PROGRESS; cycle count tracked by return_count."
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /compliance/impact-assessments/{id}/submit"
        actor: BusinessOwner
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "impact_rating_raw and impact_tier computed via impact_rating (confirmed variant)"
          - "submitted_at = logical clock; sla_breached = (clock > due_date)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance/impact-assessments/{id}/accept"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "RegulatoryChange.risk_tier = this assessment's impact_tier (bumps change version)"
          - "CASCADE link 1: for every ACTIVE Obligation with regulatory_change_id == assessment.regulatory_change_id, create a GapAnalysis in OPEN with requirement_points snapshotted from obligation criticality"
          - "CASCADE link 2: each created GapAnalysis immediately computes covered_points / residual_gap_points via residual_gap_score"
          - "CASCADE link 3: any created GapAnalysis with residual_gap_points == requirement_points AND obligation.criticality IN {HIGH, CRITICAL} spawns an Escalation (target_type=OBLIGATION, trigger_rule=ZERO_COVERAGE, business_owner_id=null, status=OPEN)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /compliance/impact-assessments/{id}/return"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "return_count += 1"
          - "AuditEvent appended"
      - from: ASSIGNED
        to: SUPERSEDED
        trigger: "system (a newer ImpactAssessment for the same change is created)"
        actor: system
        preconditions: []
        side_effects: ["new assessment's supersedes_assessment_id = this id", "AuditEvent appended"]
      - from: IN_PROGRESS
        to: SUPERSEDED
        trigger: "system (a newer ImpactAssessment for the same change is created)"
        actor: system
        preconditions: []
        side_effects: ["new assessment's supersedes_assessment_id = this id", "AuditEvent appended"]
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system (a newer ImpactAssessment for the same change is created)"
        actor: system
        preconditions: []
        side_effects: ["new assessment's supersedes_assessment_id = this id", "AuditEvent appended"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer ImpactAssessment for the same change is created)"
        actor: system
        preconditions: []
        side_effects: ["new assessment's supersedes_assessment_id = this id", "AuditEvent appended"]

  - entity: GapAnalysis
    initial_state: OPEN
    terminal_states: [CONFIRMED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /compliance/gap-analyses/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: IN_REVIEW
        to: CONFIRMED
        trigger: "POST /compliance/gap-analyses/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "status == IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "covered_points and residual_gap_points recomputed once via residual_gap_score, then frozen"
          - "confirmed_by_user_id = actor; confirmed_at = logical clock"
          - "AuditEvent appended"

  - entity: Obligation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /compliance/obligations/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /compliance/obligations/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "No GapAnalysis with obligation_id == this id and status IN {OPEN, IN_REVIEW} (ERR_OBLIGATION_IN_USE)"
          - "No ImplementationPlan with obligation_id == this id and execution_status IN {DRAFT, SUBMITTED, REJECTED, APPROVED, IN_EXECUTION, COMPLETED} (ERR_OBLIGATION_IN_USE)"
        side_effects:
          - "All ObligationControlMappings with obligation_id == this id and status == APPROVED transition to RETIRED"
          - "AuditEvent appended"
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /compliance/obligations/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "status == RETIRED (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
        note: "Cycle: reinstatement does NOT resurrect retired mappings; coverage must be rebuilt explicitly."

  - entity: Control
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /compliance/controls/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "No ObligationControlMapping with control_id == this id and status IN {PROPOSED, APPROVED} (ERR_CONTROL_IN_USE)"
        side_effects: ["AuditEvent appended"]

  - entity: ObligationControlMapping
    initial_state: PROPOSED
    terminal_states: [REJECTED, RETIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /compliance/obligation-control-mappings/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "approved_by_user_id = actor"
          - "Recompute covered_points / residual_gap_points on every GapAnalysis with obligation_id == mapping.obligation_id and status IN {OPEN, IN_REVIEW} via residual_gap_score"
          - "AuditEvent appended"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /compliance/obligation-control-mappings/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: RETIRED
        trigger: "POST /compliance/obligation-control-mappings/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute covered_points / residual_gap_points on every GapAnalysis with obligation_id == mapping.obligation_id and status IN {OPEN, IN_REVIEW} via residual_gap_score"
          - "AuditEvent appended"

  - entity: ImplementationPlan
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      # --- dimension 1: execution_status ---
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance/implementation-plans/{id}/submit"
        actor: BusinessOwner
        preconditions:
          - "execution_status IN {DRAFT, REJECTED} (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["submitted_by_user_id = actor", "AuditEvent appended"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /compliance/implementation-plans/{id}/submit"
        actor: BusinessOwner
        preconditions:
          - "execution_status IN {DRAFT, REJECTED} (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["submitted_by_user_id = actor", "AuditEvent appended"]
        note: "Revision cycle: REJECTED plans can be resubmitted."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compliance/implementation-plans/{id}/approve"
        actor: ComplianceManager
        preconditions:
          - "execution_status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "Obligation with id == plan.obligation_id has status == ACTIVE (ERR_OBLIGATION_NOT_ACTIVE)"
        side_effects:
          - "pinned_register_version_number = ObligationRegister.current_version_number (version pinning on approval)"
          - "approved_by_user_id = actor"
          - "deadline_posture recomputed via deadline_posture calculation"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/implementation-plans/{id}/reject"
        actor: ComplianceManager
        preconditions:
          - "execution_status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /compliance/implementation-plans/{id}/begin-execution"
        actor: BusinessOwner
        preconditions:
          - "execution_status == APPROVED (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["AuditEvent appended"]
      - from: IN_EXECUTION
        to: COMPLETED
        trigger: "POST /compliance/implementation-plans/{id}/complete"
        actor: BusinessOwner
        preconditions:
          - "execution_status == IN_EXECUTION (ERR_INVALID_STATE)"
          - "X-User-ID == business_owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "deadline_posture frozen at its current value (late completion is allowed and remains visible)"
          - "AuditEvent appended"
      - from: COMPLETED
        to: VERIFIED
        trigger: "system (EvidencePackage for this plan is sealed)"
        actor: system
        preconditions: []
        side_effects:
          - "verification_evidence_id = sealed package id"
          - "CASCADE link 2: re-evaluate RegulatoryChange closure for plan.regulatory_change_id (TRIAGED_APPLICABLE -> CLOSED when every ACTIVE obligation has all plans VERIFIED)"
          - "AuditEvent appended"
      # --- dimension 2: deadline_posture (parallel axis; recomputed while execution_status IN {APPROVED, IN_EXECUTION}) ---
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system (POST /compliance/_clock/set_current_utc recompute, plan approve, or extend-deadline)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and 0 <= (target_completion_date - clock) <= 14 days"
        side_effects: ["AuditEvent appended"]
      - from: AT_RISK
        to: OVERDUE
        trigger: "system (POST /compliance/_clock/set_current_utc recompute)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and (target_completion_date - clock) < 0"
        side_effects:
          - "CASCADE link 2: if no Escalation with target_id == plan.id and status IN {OPEN, ACKNOWLEDGED} exists, create one (target_type=IMPLEMENTATION_PLAN, trigger_rule=DEADLINE_BREACH, business_owner_id = plan.business_owner_id, status=OPEN, opened_at = clock)"
          - "CASCADE link 3: that Escalation creation recomputes BusinessOwner.open_escalation_count; when it reaches >= 3, assignment_suspended flips to true"
          - "AuditEvent appended"
      - from: ON_TRACK
        to: OVERDUE
        trigger: "system (POST /compliance/_clock/set_current_utc recompute)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and (target_completion_date - clock) < 0"
        side_effects:
          - "CASCADE link 2: create DEADLINE_BREACH Escalation if none open (same as AT_RISK -> OVERDUE)"
          - "CASCADE link 3: BusinessOwner.open_escalation_count recompute; >= 3 flips assignment_suspended"
          - "AuditEvent appended"
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system (extend-deadline or clock recompute moves remaining window above 14 days)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and (target_completion_date - clock) > 14 days"
        side_effects: ["AuditEvent appended"]
      - from: OVERDUE
        to: AT_RISK
        trigger: "system (extend-deadline moves remaining window into [0, 14] days)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and 0 <= (target_completion_date - clock) <= 14 days"
        side_effects: ["AuditEvent appended"]
        note: "Deadline recovery: extend-deadline can pull a plan out of OVERDUE; execution_status is untouched."
      - from: OVERDUE
        to: ON_TRACK
        trigger: "system (extend-deadline moves remaining window above 14 days)"
        actor: system
        preconditions:
          - "execution_status IN {APPROVED, IN_EXECUTION} and (target_completion_date - clock) > 14 days"
        side_effects: ["AuditEvent appended"]

  - entity: PolicyUpdate
    initial_state: DRAFTING
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFTING
        to: PENDING_APPROVAL
        trigger: "POST /compliance/policy-updates/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFTING (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /compliance/policy-updates/{id}/approve"
        actor: ComplianceManager
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "OCC: expected_control_version == Control.version (ERR_STALE_CONTROL_VERSION)"
        side_effects:
          - "new_policy_version = Control.policy_version + 1 (snapshot at approve)"
          - "approved_by_user_id = actor"
          - "increments Control.version by 1"
          - "AuditEvent appended"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /compliance/policy-updates/{id}/reject"
        actor: ComplianceManager
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: REJECTED
        to: DRAFTING
        trigger: "POST /compliance/policy-updates/{id}/revise"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
        note: "Cycle: rejected updates return to drafting."
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /compliance/policy-updates/{id}/publish"
        actor: ComplianceManager
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
          - "effective_date >= logical clock + 7 days (ERR_TRAINING_WINDOW_TOO_SHORT)"
          - "No non-CANCELLED TrainingRollout of the same Control whose window [window_start, window_end] lies within 7 days before or after this rollout's new window [clock, effective_date] (ERR_ROLLOUT_WINDOW_CONFLICT)"
        side_effects:
          - "Control.policy_version = new_policy_version; increments Control.version by 1"
          - "published_at = logical clock"
          - "Create TrainingRollout (status=IN_PROGRESS, window_start = published_at, window_end = effective_date)"
          - "AuditEvent appended"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /compliance/policy-updates/{id}/retract"
        actor: ComplianceManager
        preconditions:
          - "status == PUBLISHED (ERR_INVALID_STATE)"
          - "logical clock < effective_date (ERR_RETRACT_WINDOW_CLOSED)"
        side_effects:
          - "Control.policy_version = new_policy_version - 1 (compensating action); increments Control.version by 1"
          - "TrainingRollout of this update: IN_PROGRESS -> CANCELLED"
          - "AuditEvent appended"

  - entity: TrainingRollout
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, CLOSED_WITH_EXCEPTIONS, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /compliance/training-rollouts/{id}/complete"
        actor: BusinessOwner
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "completion_pct >= 95.0 (ERR_COMPLETION_THRESHOLD_NOT_MET)"
          - "logical clock <= window_end (ERR_TRAINING_WINDOW_CLOSED)"
        side_effects: ["AuditEvent appended"]
      - from: IN_PROGRESS
        to: CLOSED_WITH_EXCEPTIONS
        trigger: "POST /compliance/training-rollouts/{id}/close-with-exceptions"
        actor: ComplianceManager
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "completion_pct >= 80.0 (ERR_EXCEPTION_THRESHOLD_NOT_MET)"
        side_effects: ["AuditEvent appended"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (parent PolicyUpdate is retracted)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent appended"]

  - entity: EvidencePackage
    initial_state: ASSEMBLING
    terminal_states: [SUBMITTED_TO_EXAMINER]
    transitions:
      - from: ASSEMBLING
        to: SEALED
        trigger: "POST /compliance/evidence-packages/{id}/seal"
        actor: ComplianceManager
        preconditions:
          - "status == ASSEMBLING (ERR_PACKAGE_SEALED)"
          - "artifact_count >= 1 (ERR_NO_ARTIFACTS)"
        side_effects:
          - "sealed_at = logical clock"
          - "CASCADE link 1: ImplementationPlan COMPLETED -> VERIFIED with verification_evidence_id = this package"
          - "CASCADE link 2: RegulatoryChange closure re-evaluated (TRIAGED_APPLICABLE -> CLOSED when all ACTIVE obligations' plans are VERIFIED)"
          - "AuditEvent appended"
      - from: SEALED
        to: SUBMITTED_TO_EXAMINER
        trigger: "POST /compliance/evidence-packages/{id}/submit-to-examiner"
        actor: ComplianceManager
        preconditions:
          - "status == SEALED (ERR_INVALID_STATE)"
        side_effects:
          - "examiner_reference stored"
          - "AuditEvent appended"

  - entity: Escalation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /compliance/escalations/{id}/acknowledge"
        actor: ComplianceManager
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
      - from: OPEN
        to: RESOLVED
        trigger: "POST /compliance/escalations/{id}/resolve"
        actor: ComplianceManager
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED} (ERR_INVALID_STATE)"
        side_effects:
          - "resolution_code = MANUAL_RESOLUTION; resolved_at = logical clock"
          - "BusinessOwner.open_escalation_count recomputed; assignment_suspended flips false when count drops below 3"
          - "AuditEvent appended"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /compliance/escalations/{id}/resolve"
        actor: ComplianceManager
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED} (ERR_INVALID_STATE)"
        side_effects:
          - "resolution_code = MANUAL_RESOLUTION; resolved_at = logical clock"
          - "BusinessOwner.open_escalation_count recomputed; assignment_suspended flips false when count drops below 3"
          - "AuditEvent appended"
      - from: OPEN
        to: RESOLVED
        trigger: "system (extend-deadline on the target ImplementationPlan)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_code = EXTENSION_GRANTED; resolved_at = logical clock"
          - "BusinessOwner.open_escalation_count recomputed; assignment_suspended flips false when count drops below 3"
          - "AuditEvent appended"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "system (extend-deadline on the target ImplementationPlan)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_code = EXTENSION_GRANTED; resolved_at = logical clock"
          - "BusinessOwner.open_escalation_count recomputed; assignment_suspended flips false when count drops below 3"
          - "AuditEvent appended"

  - entity: CommitteeReport
    initial_state: DRAFT
    terminal_states: [PRESENTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /compliance/committee-reports/{id}/finalize"
        actor: BoardSecretary
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "metrics snapshot computed via compliance_index and sla_compliance_pct at the finalize clock; frozen afterwards"
          - "finalized_at = logical clock"
          - "AuditEvent appended"
      - from: FINALIZED
        to: PRESENTED
        trigger: "POST /compliance/committee-reports/{id}/present"
        actor: BoardSecretary
        preconditions:
          - "status == FINALIZED (ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-change
    parent_entity: RegulatoryChange
    write_endpoint: "POST /compliance/impact-assessments"
    occ_field: "expected_regulatory_change_version"
    description: |
      Creating an ImpactAssessment against a RegulatoryChange whose version has
      advanced since the client last observed it is rejected. Product semantics
      legitimately allow a fresh assessment to supersede the prior non-terminal
      one without altering the change's status, so a second sequential create
      observes identical state fields and would otherwise succeed; only the
      stale version marks the caller's view of the change as out of date.
    error_id: ERR_STALE_CHANGE_VERSION
    http_status: 412
  - rule_id: register-publish-stale-version
    parent_entity: ObligationRegister
    write_endpoint: "POST /compliance/obligation-register/publish"
    occ_field: "expected_register_version"
    description: |
      Publishing a new ObligationRegisterVersion while carrying an
      expected_register_version that no longer matches the register's current
      version is rejected. Publishing twice in a row is a legitimate product
      operation (the register may advance whenever obligations change), so a
      second sequential publish observes no blocking state field; only the
      stale version distinguishes it.
    error_id: ERR_STALE_REGISTER_VERSION
    http_status: 412
  - rule_id: policy-approve-stale-control
    parent_entity: Control
    write_endpoint: "POST /compliance/policy-updates/{id}/approve"
    occ_field: "expected_control_version"
    description: |
      Approving a PolicyUpdate against a Control whose version has advanced
      since the client last observed it is rejected. Approving a second,
      distinct PolicyUpdate for the same ACTIVE control is legitimate under
      product semantics (each approval snapshots the next policy_version), so
      a second sequential approval observes identical state fields and would
      otherwise succeed; only the stale control version marks the approval as
      based on an out-of-date control snapshot.
    error_id: ERR_STALE_CONTROL_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: impact_rating
    trigger: "triage of a RegulatoryChange (provisional variant); submit of an ImpactAssessment (confirmed variant)"
    algorithm: weighted_scoring
    formula: |
      scope_multiplier(lines) = 1.0 if lines == 1; 1.2 if 2 <= lines <= 3; 1.5 if lines >= 4
      raw = likelihood_score * severity_score * scope_multiplier(affected_business_lines)
      tier: raw < 5 -> LOW; 5 <= raw < 12 -> MEDIUM; 12 <= raw < 20 -> HIGH; raw >= 20 -> CRITICAL
    input_set: "The single ImpactAssessment being submitted (confirmed) or the RegulatoryChange.severity_hint (provisional)"
    constants:
      TIER_LOW_MAX: 5
      TIER_MEDIUM_MAX: 12
      TIER_HIGH_MAX: 20
      PROVISIONAL_ASSUMED_LIKELIHOOD: 3
      SEVERITY_HINT_MAP: "{ LOW: 1, MEDIUM: 2, HIGH: 4, CRITICAL: 5 }"
    precision: "raw kept at 1 decimal place (inputs are integers; multiplier has 1 decimal)"
    variants:
      - name: provisional
        when: "On RegulatoryChange triage — no assessment inputs exist yet"
        difference: "raw = SEVERITY_HINT_MAP[severity_hint] * 3 * 1.0 (scope multiplier fixed at 1.0); result stored as RegulatoryChange.provisional_risk_tier"
      - name: confirmed
        when: "On ImpactAssessment submit — full analyst inputs available"
        difference: "raw = likelihood_score * severity_score * scope_multiplier(affected_business_lines); result stored as ImpactAssessment.impact_rating_raw / impact_tier"

  - name: implementation_deadline
    trigger: "ImplementationPlan creation — computes the mandated latest target_completion_date"
    algorithm: chronological
    formula: |
      mandate_days(criticality) = LOW: 180, MEDIUM: 90, HIGH: 45, CRITICAL: 15
      base = gap_analysis.confirmed_at (day 0; the confirmation day itself is not counted)
      CALENDAR variant: deadline = base + N calendar days (never rolled for weekends)
      BUSINESS variant: deadline = base + N business days, counting only Monday-Friday
        starting from the day after base; if the landing day is Sat/Sun it rolls forward
        to the next Monday.
      Reference points (base = 2026-08-01T00:00:00Z, a Saturday):
        CRITICAL (15 calendar)  -> 2026-08-16T00:00:00Z
        HIGH     (45 business)  -> 2026-10-02T00:00:00Z
        MEDIUM   (90 business)  -> 2026-12-08T00:00:00Z
    input_set: "The GapAnalysis being planned (confirmed_at, obligation.criticality)"
    constants:
      MANDATE_DAYS: "{ LOW: 180, MEDIUM: 90, HIGH: 45, CRITICAL: 15 }"
    precision: "date-level (UTC midnight semantics on the logical clock)"
    variants:
      - name: calendar_days
        when: "obligation.criticality == CRITICAL"
        difference: "Adds N calendar days; weekend landing dates are NOT adjusted"
      - name: business_days
        when: "obligation.criticality IN {LOW, MEDIUM, HIGH}"
        difference: "Adds N business days (Mon-Fri), rolling weekend landings forward to Monday"

  - name: residual_gap_score
    trigger: "GapAnalysis creation; mapping approve/retire; control record-review; gap confirm (final freeze)"
    algorithm: aggregation
    formula: |
      requirement_points = snapshot of obligation criticality at gap creation:
        LOW=4, MEDIUM=8, HIGH=16, CRITICAL=32
      effectiveness_factor(control) per current logical clock:
        reviewed <= 90 days ago -> 1.0; 91-180 days -> 0.8; > 180 days or never -> 0.5
      covered_points = SUM over mappings m where m.obligation_id == gap.obligation_id
                       AND m.status == APPROVED of (m.coverage_weight * effectiveness_factor(m.control))
      residual_gap_points = max(0, requirement_points - covered_points)
    input_set: "ObligationControlMappings with status == APPROVED only (PROPOSED/REJECTED/RETIRED excluded); effectiveness evaluated at the current logical clock"
    constants:
      CRITICALITY_POINTS: "{ LOW: 4, MEDIUM: 8, HIGH: 16, CRITICAL: 32 }"
      REVIEW_FULL_DAYS: 90
      REVIEW_STALE_DAYS: 180
    precision: "2 decimal places, round_half_up"

  - name: training_completion_pct
    trigger: "Every attestation upsert on a TrainingRollout; read of TrainingRollout.completion_pct"
    algorithm: aggregation
    formula: |
      Group attestation_records by department.
      For each department d: pct_d = round_half_up(100.0 * completed_d / assigned_d, 1 decimal)
      completion_pct = round_half_up( mean over departments of pct_d, 1 decimal )
      (unweighted mean across departments — each department counts equally)
      PINNED ORDER: round each department FIRST, then average the rounded values.
      Pooling all persons before rounding is a different, rejected interpretation
      (e.g. 20/20 + 9/10 yields 95.0 under the pinned order vs 96.7 pooled).
      completion_pct = 0.0 when attestation_records is empty.
    input_set: "All attestation_records of the rollout (latest upsert per person_ref)"
    constants:
      COMPLETE_THRESHOLD: 95.0
      EXCEPTION_THRESHOLD: 80.0
    precision: "1 decimal place, round_half_up, applied per department first"

  - name: deadline_posture
    trigger: "POST /compliance/_clock/set_current_utc; plan approve; extend-deadline; plan creation (initial ON_TRACK)"
    algorithm: threshold
    formula: |
      Applies only while execution_status IN {APPROVED, IN_EXECUTION}
      (DRAFT/SUBMITTED/REJECTED hold ON_TRACK; COMPLETED/VERIFIED freeze the last value).
      remaining = target_completion_date - clock
      remaining < 0            -> OVERDUE   (strictly past the deadline; exactly at it is NOT overdue)
      0 <= remaining <= 14d    -> AT_RISK
      remaining > 14d          -> ON_TRACK
    input_set: "ImplementationPlans with execution_status IN {APPROVED, IN_EXECUTION}"
    constants:
      AT_RISK_WINDOW_DAYS: 14
    precision: "day-granularity comparison on the logical clock (strict < for OVERDUE, inclusive <= 14 for AT_RISK)"

  - name: register_checksum
    trigger: "ObligationRegister publish"
    algorithm: chronological
    formula: |
      codes = obligation_code values of all Obligations with status == ACTIVE,
              sorted lexicographically (ascending, byte-wise)
      register_checksum = sha256_hex('v' + version_number + '|' + join(',', codes))
    input_set: "Obligations with status == ACTIVE at publish time"
    precision: "sha256 hex string"
    note: "Sort key is obligation_code (a business field), never entity id."

  - name: audit_chain_hash
    trigger: "Every AuditEvent append; verified wholesale by GET /compliance/audit-events/verify"
    algorithm: projection
    formula: |
      genesis: prev_event_hash = 'GENESIS' for sequence_number 1
      event_hash_n = sha256_hex(prev_event_hash + '|' + sequence_number + '|' + actor_user_id
                     + '|' + action + '|' + entity_type + '|' + entity_id + '|' + occurred_at)
      Verification replays events in sequence_number ASC order recomputing each hash;
      any mismatch yields chain_valid = false.
    input_set: "All AuditEvents, ordered by sequence_number ASC"
    precision: "sha256 hex string"

  - name: compliance_index
    trigger: "CommitteeReport finalize (snapshot frozen on the report)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the shares depend on the total, so tiers must be
      derived only after all counts are final):
      1. c1 = count of ImplementationPlans with execution_status NOT IN {VERIFIED}
              and deadline_posture == OVERDUE at the finalize clock
      2. c2 = count of RegulatoryChanges with status == PENDING_TRIAGE and created_at < period_end
      3. c3 = count of Escalations with status IN {OPEN, ACKNOWLEDGED} at the finalize clock
      4. T = c1 + c2 + c3; if T == 0 -> compliance_index = 100.0 exactly
      5. share_i = c_i / T
      6. tier_weight(share): share < 0.2 -> 10; 0.2 <= share < 0.5 -> 20; share >= 0.5 -> 35
      7. compliance_index = max(0, 100 - (tier_weight(share_1) + tier_weight(share_2) + tier_weight(share_3)))
    input_set: "System-wide counts at the finalize clock, per the filters above"
    constants:
      TIER_LOW_WEIGHT: 10
      TIER_MID_WEIGHT: 20
      TIER_HIGH_WEIGHT: 35
    precision: "1 decimal place; shares evaluated as exact rationals before tier lookup"

  - name: sla_compliance_pct
    trigger: "CommitteeReport finalize (snapshot frozen on the report)"
    algorithm: aggregation
    formula: |
      Window = [period_start, period_end) on ImpactAssessment.submitted_at.
      numerator   = assessments with submitted_at in window AND sla_breached == false
      denominator = assessments with submitted_at in window
      sla_compliance_pct = round_half_up(100.0 * numerator / denominator, 1)
      denominator == 0 -> sla_compliance_pct = 100.0 (vacuous compliance)
    input_set: "ImpactAssessments with submitted_at IN [period_start, period_end)"
    precision: "1 decimal place, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles; entity_backed ownership (X-User-ID == business_owner_id on the target) for BusinessOwner-only actions"
    error_id: "ERR_UNAUTHORIZED_ROLE / ERR_NOT_RESOURCE_OWNER"
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: business_constraint
    check: "Request body shape: required fields present, types and enum members valid, datetimes parseable ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK references (regulatory_change_id, business_owner_id, obligation_id, control_id, gap_analysis_id, implementation_plan_id, supersedes_change_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "State-machine preconditions of the target transition (per §1.2: triage only from PENDING_TRIAGE, submit only from IN_PROGRESS, approve plan only from SUBMITTED, gap confirm only from IN_REVIEW, seal only from ASSEMBLING, etc.)"
    error_id: "ERR_INVALID_STATE / ERR_PLAN_NOT_SUBMITTED / ERR_PLAN_NOT_COMPLETED / ERR_PACKAGE_SEALED / ERR_CHANGE_NOT_SUPERSEDABLE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: triage/retriage actor != change creator; mapping approver != mapping creator; policy approver != policy drafter. Owner suspension: ImpactAssessment creation blocked when assignee.assignment_suspended == true"
    error_id: "ERR_SEGREGATION_OF_DUTIES_VIOLATION / ERR_OWNER_SUSPENDED"
    http_status: 403
    applies_to: "triage, retriage, mapping approve, policy approve, assessment create"
  - priority: 6
    category: business_temporal
    check: "Clock-relative rules: assessment due_date > clock; plan target > clock and <= implementation_deadline mandate; policy publish effective_date >= clock + 7d; retract requires clock < effective_date; rollout complete requires clock <= window_end; extension new target > old target and <= old target + 90d; report period_end > period_start"
    error_id: "ERR_DEADLINE_IN_PAST / ERR_DEADLINE_EXCEEDS_MANDATE / ERR_TRAINING_WINDOW_TOO_SHORT / ERR_RETRACT_WINDOW_CLOSED / ERR_TRAINING_WINDOW_CLOSED / ERR_INVALID_EXTENSION / ERR_INVALID_REPORT_PERIOD"
    http_status: 422
    applies_to: "assessment create, plan create, extend-deadline, policy publish, policy retract, rollout complete, report create"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and structural caps: obligation_code and control_code globally unique; one non-terminal mapping per (obligation_id, control_id); one non-terminal plan per gap_analysis; one EvidencePackage per plan; register publish requires >= 1 ACTIVE obligation; extension_count < 2; report windows for the same committee never overlap (half-open [start,end), adjacency allowed); rollout windows on one control separated by >= 7 days from non-CANCELLED siblings; seal requires artifact_count >= 1; completion thresholds 95.0 / 80.0; supersedes_change_id != new change's own id"
    error_id: "ERR_DUPLICATE_OBLIGATION_CODE / ERR_DUPLICATE_CONTROL_CODE / ERR_DUPLICATE_MAPPING / ERR_PLAN_ALREADY_EXISTS / ERR_PACKAGE_ALREADY_EXISTS / ERR_REGISTER_EMPTY / ERR_MAX_EXTENSIONS_REACHED / ERR_REPORT_PERIOD_OVERLAP / ERR_ROLLOUT_WINDOW_CONFLICT / ERR_NO_ARTIFACTS / ERR_COMPLETION_THRESHOLD_NOT_MET / ERR_EXCEPTION_THRESHOLD_NOT_MET"
    http_status: 409
    applies_to: "obligation create, control create, mapping create, plan create, package create, register publish, extend-deadline, report create, policy publish, package seal, rollout complete, rollout close-with-exceptions, change create"
  - priority: 8
    category: business_referential
    check: "Cross-entity state of referenced objects: change TRIAGED_APPLICABLE for obligation/assessment create; obligation ACTIVE for mapping create and plan approve; control ACTIVE for mapping create and policy create; gap CONFIRMED for plan create; plan COMPLETED for package create"
    error_id: "ERR_CHANGE_NOT_TRIAGED_APPLICABLE / ERR_OBLIGATION_NOT_ACTIVE / ERR_CONTROL_NOT_ACTIVE / ERR_GAP_NOT_CONFIRMED"
    http_status: 409
    applies_to: "obligation create, assessment create, mapping create, plan create, plan approve, policy create, package create"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Side effects recompute deadline postures system-wide."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Recompute deadline_posture on every ImplementationPlan with execution_status IN {APPROVED, IN_EXECUTION} via deadline_posture"
      - "OVERDUE entries spawn DEADLINE_BREACH Escalations (one open per plan) which recompute BusinessOwner.open_escalation_count / assignment_suspended"
      - "Recompute Control.effectiveness_factor consumers: covered_points / residual_gap_points on GapAnalyses IN {OPEN, IN_REVIEW}"
      - "Recompute TrainingRollout.past_due"
      - "AuditEvent appended"

  # --- Business owners ---
  - method: POST
    path: "/compliance/business-owners"
    description: "Register a business owner"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, department, email]
    output: BusinessOwner
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/compliance/business-owners/{id}"
    description: "Get one business owner (computed counts included)"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: BusinessOwner
    side_effects: []

  # --- Regulatory changes ---
  - method: POST
    path: "/compliance/regulatory-changes"
    description: "Ingest a regulatory change; optionally supersedes an existing change"
    roles: [ComplianceOfficer]
    code: 201
    input: [citation, title, summary, feed_source, jurisdiction, regulator, published_at, effective_date, "comment_deadline?", severity_hint, "supersedes_change_id?"]
    output: RegulatoryChange
    side_effects:
      - "status = PENDING_TRIAGE; applicability = UNDETERMINED; triage_round = 0; created_by_user_id = X-User-ID"
      - "When supersedes_change_id present: target must exist (ERR_NOT_FOUND), and and be IN {PENDING_TRIAGE, TRIAGED_NOT_APPLICABLE} (ERR_CHANGE_NOT_SUPERSEDABLE); target -> SUPERSEDED with superseded_by_id = new id"
      - "AuditEvent appended"
  - method: GET
    path: "/compliance/regulatory-changes"
    description: "List regulatory changes with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["status?", "jurisdiction?", "severity_hint?", "business_owner_id?", "supersedes_change_id?", "superseded_by_id?", "limit?", "offset?"]
    output: "RegulatoryChange[]"
    side_effects: []
  - method: GET
    path: "/compliance/regulatory-changes/{id}"
    description: "Get one regulatory change"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: RegulatoryChange
    side_effects: []
  - method: POST
    path: "/compliance/regulatory-changes/{id}/triage"
    description: "Triage a pending change (APPLICABLE / NOT_APPLICABLE)"
    roles: [ComplianceOfficer]
    code: 200
    input: [verdict, rationale]
    output: RegulatoryChange
    side_effects:
      - "status PENDING_TRIAGE -> TRIAGED_APPLICABLE | TRIAGED_NOT_APPLICABLE; applicability set; triage_round += 1; provisional_risk_tier computed"
      - "increments RegulatoryChange.version by 1"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/regulatory-changes/{id}/retriage"
    description: "Pull a not-applicable change back into triage"
    roles: [ComplianceOfficer]
    code: 200
    input: [rationale]
    output: RegulatoryChange
    side_effects:
      - "status TRIAGED_NOT_APPLICABLE -> PENDING_TRIAGE; applicability = UNDETERMINED"
      - "increments RegulatoryChange.version by 1"
      - "AuditEvent appended"

  # --- Impact assessments ---
  - method: POST
    path: "/compliance/impact-assessments"
    description: "Assign an impact assessment to a business owner (OCC on the change)"
    roles: [ComplianceOfficer]
    code: 201
    input: [regulatory_change_id, business_owner_id, due_date, expected_regulatory_change_version]
    output: ImpactAssessment
    side_effects:
      - "OCC: expected_regulatory_change_version must equal RegulatoryChange.version (ERR_STALE_CHANGE_VERSION)"
      - "Change must be TRIAGED_APPLICABLE (ERR_CHANGE_NOT_TRIAGED_APPLICABLE); assignee must not be assignment_suspended (ERR_OWNER_SUSPENDED); due_date > clock (ERR_DEADLINE_IN_PAST)"
      - "Any existing assessment of this change IN {ASSIGNED, IN_PROGRESS, RETURNED, SUBMITTED} -> SUPERSEDED; new.supersedes_assessment_id set"
      - "RegulatoryChange.business_owner_id = assignee; increments RegulatoryChange.version by 1"
      - "status = ASSIGNED; AuditEvent appended"
  - method: GET
    path: "/compliance/impact-assessments"
    description: "List impact assessments with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["regulatory_change_id?", "business_owner_id?", "status?", "supersedes_assessment_id?", "limit?", "offset?"]
    output: "ImpactAssessment[]"
    side_effects: []
  - method: GET
    path: "/compliance/impact-assessments/{id}"
    description: "Get one impact assessment"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects: []
  - method: POST
    path: "/compliance/impact-assessments/{id}/start"
    description: "Owner begins (or resumes after return) an assessment"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects: ["status -> IN_PROGRESS", "AuditEvent appended"]
  - method: POST
    path: "/compliance/impact-assessments/{id}/submit"
    description: "Owner submits findings and scoring inputs"
    roles: [BusinessOwner]
    code: 200
    input: [likelihood_score, severity_score, affected_business_lines, findings_summary]
    output: ImpactAssessment
    side_effects:
      - "status -> SUBMITTED; impact_rating_raw / impact_tier computed (confirmed variant)"
      - "submitted_at = clock; sla_breached = (clock > due_date)"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/impact-assessments/{id}/accept"
    description: "Compliance manager accepts a submitted assessment"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ImpactAssessment
    side_effects:
      - "status -> ACCEPTED; RegulatoryChange.risk_tier = impact_tier (bumps change version)"
      - "Cascade: GapAnalysis created OPEN per ACTIVE obligation of the change; zero-coverage HIGH/CRITICAL gaps spawn ZERO_COVERAGE Escalations"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/impact-assessments/{id}/return"
    description: "Compliance manager returns a submitted assessment for rework"
    roles: [ComplianceManager]
    code: 200
    input: [comments]
    output: ImpactAssessment
    side_effects: ["status -> RETURNED; return_count += 1", "AuditEvent appended"]

  # --- Gap analyses ---
  - method: GET
    path: "/compliance/gap-analyses"
    description: "List gap analyses with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["impact_assessment_id?", "obligation_id?", "status?", "limit?", "offset?"]
    output: "GapAnalysis[]"
    side_effects: []
  - method: GET
    path: "/compliance/gap-analyses/{id}"
    description: "Get one gap analysis"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: GapAnalysis
    side_effects: []
  - method: POST
    path: "/compliance/gap-analyses/{id}/begin-review"
    description: "Move a gap analysis into review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GapAnalysis
    side_effects: ["status -> IN_REVIEW", "AuditEvent appended"]
  - method: POST
    path: "/compliance/gap-analyses/{id}/confirm"
    description: "Confirm a gap analysis, freezing its residual score"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GapAnalysis
    side_effects:
      - "status -> CONFIRMED; covered_points / residual_gap_points recomputed once and frozen; confirmed_by_user_id / confirmed_at set"
      - "AuditEvent appended"

  # --- Obligation register entries ---
  - method: POST
    path: "/compliance/obligations"
    description: "Create an obligation register entry for an applicable change"
    roles: [ComplianceOfficer]
    code: 201
    input: [obligation_code, title, regulatory_change_id, criticality]
    output: Obligation
    side_effects:
      - "status = DRAFT; change must be TRIAGED_APPLICABLE (ERR_CHANGE_NOT_TRIAGED_APPLICABLE); obligation_code unique (ERR_DUPLICATE_OBLIGATION_CODE)"
      - "AuditEvent appended"
  - method: GET
    path: "/compliance/obligations"
    description: "List obligations with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["regulatory_change_id?", "status?", "criticality?", "limit?", "offset?"]
    output: "Obligation[]"
    side_effects: []
  - method: GET
    path: "/compliance/obligations/{id}"
    description: "Get one obligation"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: Obligation
    side_effects: []
  - method: POST
    path: "/compliance/obligations/{id}/activate"
    description: "Activate a drafted obligation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Obligation
    side_effects: ["status DRAFT -> ACTIVE", "AuditEvent appended"]
  - method: POST
    path: "/compliance/obligations/{id}/retire"
    description: "Retire an active obligation (blocked while in use)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Obligation
    side_effects:
      - "status ACTIVE -> RETIRED; precondition: no OPEN/IN_REVIEW gaps and no non-terminal plans (ERR_OBLIGATION_IN_USE)"
      - "APPROVED mappings of this obligation -> RETIRED"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/obligations/{id}/reinstate"
    description: "Reinstate a retired obligation"
    roles: [ComplianceOfficer]
    code: 200
    input: [rationale]
    output: Obligation
    side_effects: ["status RETIRED -> ACTIVE", "AuditEvent appended"]

  # --- Controls ---
  - method: POST
    path: "/compliance/controls"
    description: "Create a compliance control"
    roles: [ComplianceOfficer]
    code: 201
    input: [control_code, title, owner_department, review_frequency_days, "last_reviewed_at?"]
    output: Control
    side_effects:
      - "status = ACTIVE; policy_version = 1; effectiveness_factor computed; control_code unique (ERR_DUPLICATE_CONTROL_CODE)"
      - "AuditEvent appended"
  - method: GET
    path: "/compliance/controls"
    description: "List controls with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["status?", "owner_department?", "limit?", "offset?"]
    output: "Control[]"
    side_effects: []
  - method: GET
    path: "/compliance/controls/{id}"
    description: "Get one control"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: Control
    side_effects: []
  - method: POST
    path: "/compliance/controls/{id}/record-review"
    description: "Record a control review at the current logical clock"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Control
    side_effects:
      - "last_reviewed_at = clock; effectiveness_factor / next_review_due recomputed; increments Control.version by 1"
      - "Recompute covered_points / residual_gap_points on GapAnalyses IN {OPEN, IN_REVIEW} whose obligation has an APPROVED mapping to this control"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/controls/{id}/retire"
    description: "Retire a control (blocked while mapped)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Control
    side_effects: ["status ACTIVE -> RETIRED; precondition: no PROPOSED/APPROVED mappings (ERR_CONTROL_IN_USE)", "AuditEvent appended"]

  # --- Obligation <-> Control mappings ---
  - method: POST
    path: "/compliance/obligation-control-mappings"
    description: "Propose a mapping between an active obligation and an active control"
    roles: [ComplianceOfficer]
    code: 201
    input: [obligation_id, control_id, coverage_weight]
    output: ObligationControlMapping
    side_effects:
      - "status = PROPOSED; obligation ACTIVE (ERR_OBLIGATION_NOT_ACTIVE); control ACTIVE (ERR_CONTROL_NOT_ACTIVE); no non-terminal mapping for the pair (ERR_DUPLICATE_MAPPING)"
      - "created_by_user_id = X-User-ID; AuditEvent appended"
  - method: GET
    path: "/compliance/obligation-control-mappings"
    description: "List mappings with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["obligation_id?", "control_id?", "status?", "limit?", "offset?"]
    output: "ObligationControlMapping[]"
    side_effects: []
  - method: GET
    path: "/compliance/obligation-control-mappings/{id}"
    description: "Get one mapping"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: ObligationControlMapping
    side_effects: []
  - method: POST
    path: "/compliance/obligation-control-mappings/{id}/approve"
    description: "Approve a proposed mapping (segregated from its creator)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ObligationControlMapping
    side_effects:
      - "status PROPOSED -> APPROVED; SoD enforced (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
      - "Recompute covered_points / residual_gap_points on OPEN/IN_REVIEW gaps of the obligation"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/obligation-control-mappings/{id}/reject"
    description: "Reject a proposed mapping"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ObligationControlMapping
    side_effects: ["status PROPOSED -> REJECTED", "AuditEvent appended"]
  - method: POST
    path: "/compliance/obligation-control-mappings/{id}/retire"
    description: "Retire an approved mapping, dropping its coverage"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ObligationControlMapping
    side_effects:
      - "status APPROVED -> RETIRED"
      - "Recompute covered_points / residual_gap_points on OPEN/IN_REVIEW gaps of the obligation"
      - "AuditEvent appended"

  # --- Obligation register versioning ---
  - method: GET
    path: "/compliance/obligation-register"
    description: "Get the singleton obligation register (auto-created at boot: current_version_number 0, version 1)"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: ObligationRegister
    side_effects: []
  - method: POST
    path: "/compliance/obligation-register/publish"
    description: "Publish a new register version snapshotting all ACTIVE obligations (OCC on register)"
    roles: [ComplianceOfficer]
    code: 201
    input: [expected_register_version]
    output: ObligationRegisterVersion
    side_effects:
      - "OCC: expected_register_version must equal ObligationRegister.version (ERR_STALE_REGISTER_VERSION)"
      - ">= 1 ACTIVE obligation required (ERR_REGISTER_EMPTY)"
      - "Create ObligationRegisterVersion (version_number = current + 1, sorted obligation_codes snapshot, register_checksum)"
      - "ObligationRegister.current_version_number += 1; increments ObligationRegister.version by 1"
      - "AuditEvent appended"
  - method: GET
    path: "/compliance/obligation-register-versions"
    description: "List published register versions"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ObligationRegisterVersion[]"
    side_effects: []

  # --- Implementation plans ---
  - method: POST
    path: "/compliance/implementation-plans"
    description: "Draft an implementation plan against a confirmed gap analysis"
    roles: [BusinessOwner]
    code: 201
    input: [gap_analysis_id, title, target_completion_date]
    output: ImplementationPlan
    side_effects:
      - "gap must be CONFIRMED (ERR_GAP_NOT_CONFIRMED); no non-terminal plan for the gap (ERR_PLAN_ALREADY_EXISTS)"
      - "target > clock (ERR_DEADLINE_IN_PAST) and <= implementation_deadline mandate (ERR_DEADLINE_EXCEEDS_MANDATE)"
      - "obligation_id / regulatory_change_id / business_owner_id denormalized from gap -> assessment; caller must equal the assessment owner (ERR_NOT_RESOURCE_OWNER)"
      - "execution_status = DRAFT; deadline_posture = ON_TRACK; AuditEvent appended"
  - method: GET
    path: "/compliance/implementation-plans"
    description: "List implementation plans with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["gap_analysis_id?", "obligation_id?", "regulatory_change_id?", "business_owner_id?", "verification_evidence_id?", "execution_status?", "deadline_posture?", "limit?", "offset?"]
    output: "ImplementationPlan[]"
    side_effects: []
  - method: GET
    path: "/compliance/implementation-plans/{id}"
    description: "Get one implementation plan"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: ImplementationPlan
    side_effects: []
  - method: POST
    path: "/compliance/implementation-plans/{id}/submit"
    description: "Submit (or resubmit after rejection) a plan"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: ImplementationPlan
    side_effects: ["execution_status DRAFT|REJECTED -> SUBMITTED; submitted_by_user_id set", "AuditEvent appended"]
  - method: POST
    path: "/compliance/implementation-plans/{id}/approve"
    description: "Approve a submitted plan, pinning the current register version"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ImplementationPlan
    side_effects:
      - "execution_status SUBMITTED -> APPROVED; obligation must be ACTIVE (ERR_OBLIGATION_NOT_ACTIVE)"
      - "pinned_register_version_number = ObligationRegister.current_version_number; approved_by_user_id set"
      - "deadline_posture recomputed; AuditEvent appended"
  - method: POST
    path: "/compliance/implementation-plans/{id}/reject"
    description: "Reject a submitted plan"
    roles: [ComplianceManager]
    code: 200
    input: [reason]
    output: ImplementationPlan
    side_effects: ["execution_status SUBMITTED -> REJECTED", "AuditEvent appended"]
  - method: POST
    path: "/compliance/implementation-plans/{id}/begin-execution"
    description: "Start executing an approved plan"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: ImplementationPlan
    side_effects: ["execution_status APPROVED -> IN_EXECUTION; ownership enforced", "AuditEvent appended"]
  - method: POST
    path: "/compliance/implementation-plans/{id}/complete"
    description: "Mark an in-execution plan complete (late completion allowed)"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: ImplementationPlan
    side_effects: ["execution_status IN_EXECUTION -> COMPLETED; deadline_posture frozen; ownership enforced", "AuditEvent appended"]
  - method: POST
    path: "/compliance/implementation-plans/{id}/extend-deadline"
    description: "Extend the plan deadline (max 2 extensions, <= 90 days each)"
    roles: [BusinessOwner]
    code: 200
    input: [new_target_completion_date, rationale]
    output: ImplementationPlan
    side_effects:
      - "execution_status IN {APPROVED, IN_EXECUTION} (ERR_INVALID_STATE); extension_count < 2 (ERR_MAX_EXTENSIONS_REACHED)"
      - "new target > current target and <= current target + 90 days (ERR_INVALID_EXTENSION); ownership enforced"
      - "target_completion_date updated; extension_count += 1; deadline_posture recomputed (OVERDUE may recover to AT_RISK/ON_TRACK)"
      - "OPEN/ACKNOWLEDGED DEADLINE_BREACH escalations of this plan -> RESOLVED with resolution_code = EXTENSION_GRANTED; owner open_escalation_count recomputed"
      - "AuditEvent appended"

  # --- Policy updates ---
  - method: POST
    path: "/compliance/policy-updates"
    description: "Draft a policy/procedure update for a control"
    roles: [ComplianceOfficer]
    code: 201
    input: [control_id, "implementation_plan_id?", title, change_summary, effective_date]
    output: PolicyUpdate
    side_effects:
      - "control ACTIVE (ERR_CONTROL_NOT_ACTIVE); linked plan, when given, IN {APPROVED, IN_EXECUTION, COMPLETED} (ERR_INVALID_STATE); effective_date > clock (ERR_DEADLINE_IN_PAST)"
      - "status = DRAFTING; drafted_by_user_id = X-User-ID; AuditEvent appended"
  - method: GET
    path: "/compliance/policy-updates"
    description: "List policy updates with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["control_id?", "implementation_plan_id?", "status?", "limit?", "offset?"]
    output: "PolicyUpdate[]"
    side_effects: []
  - method: GET
    path: "/compliance/policy-updates/{id}"
    description: "Get one policy update"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: PolicyUpdate
    side_effects: []
  - method: POST
    path: "/compliance/policy-updates/{id}/submit"
    description: "Submit a drafted policy update for approval"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PolicyUpdate
    side_effects: ["status DRAFTING -> PENDING_APPROVAL", "AuditEvent appended"]
  - method: POST
    path: "/compliance/policy-updates/{id}/approve"
    description: "Approve a policy update (OCC on the control; SoD vs drafter)"
    roles: [ComplianceManager]
    code: 200
    input: [expected_control_version]
    output: PolicyUpdate
    side_effects:
      - "OCC: expected_control_version == Control.version (ERR_STALE_CONTROL_VERSION); SoD: actor != drafted_by_user_id"
      - "status -> APPROVED; new_policy_version = Control.policy_version + 1"
      - "increments Control.version by 1; AuditEvent appended"
  - method: POST
    path: "/compliance/policy-updates/{id}/reject"
    description: "Reject a pending policy update"
    roles: [ComplianceManager]
    code: 200
    input: [reason]
    output: PolicyUpdate
    side_effects: ["status PENDING_APPROVAL -> REJECTED", "AuditEvent appended"]
  - method: POST
    path: "/compliance/policy-updates/{id}/revise"
    description: "Return a rejected policy update to drafting"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PolicyUpdate
    side_effects: ["status REJECTED -> DRAFTING", "AuditEvent appended"]
  - method: POST
    path: "/compliance/policy-updates/{id}/publish"
    description: "Publish an approved policy update, spawning its training rollout"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: PolicyUpdate
    side_effects:
      - "status APPROVED -> PUBLISHED; effective_date >= clock + 7d (ERR_TRAINING_WINDOW_TOO_SHORT)"
      - "Rollout-window conflict check on the same control with >= 7 day buffer (ERR_ROLLOUT_WINDOW_CONFLICT)"
      - "Control.policy_version = new_policy_version; increments Control.version by 1; published_at = clock"
      - "TrainingRollout created (IN_PROGRESS, window [published_at, effective_date]); AuditEvent appended"
  - method: POST
    path: "/compliance/policy-updates/{id}/retract"
    description: "Retract a published update before its effective date (compensating action)"
    roles: [ComplianceManager]
    code: 200
    input: [reason]
    output: PolicyUpdate
    side_effects:
      - "status PUBLISHED -> RETRACTED; clock < effective_date (ERR_RETRACT_WINDOW_CLOSED)"
      - "Control.policy_version = new_policy_version - 1; increments Control.version by 1"
      - "TrainingRollout IN_PROGRESS -> CANCELLED; AuditEvent appended"

  # --- Training rollouts ---
  - method: GET
    path: "/compliance/training-rollouts"
    description: "List training rollouts with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["policy_update_id?", "control_id?", "status?", "limit?", "offset?"]
    output: "TrainingRollout[]"
    side_effects: []
  - method: GET
    path: "/compliance/training-rollouts/{id}"
    description: "Get one training rollout"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: TrainingRollout
    side_effects: []
  - method: POST
    path: "/compliance/training-rollouts/{id}/attestations"
    description: "Bulk upsert attestation records keyed by person_ref (re-posting the same person_ref updates, never duplicates)"
    roles: [BusinessOwner]
    code: 200
    input: [records]
    output: TrainingRollout
    side_effects:
      - "status must be IN_PROGRESS (ERR_INVALID_STATE); each record {person_ref, department, completed} upserted by person_ref"
      - "assigned_count / completed_count / completion_pct recomputed via training_completion_pct"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/training-rollouts/{id}/complete"
    description: "Complete a rollout when the 95.0 completion threshold is met within the window"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: TrainingRollout
    side_effects: ["status IN_PROGRESS -> COMPLETED; thresholds per §1.2", "AuditEvent appended"]
  - method: POST
    path: "/compliance/training-rollouts/{id}/close-with-exceptions"
    description: "Close a rollout with documented exceptions (>= 80.0 completion)"
    roles: [ComplianceManager]
    code: 200
    input: [exception_rationale]
    output: TrainingRollout
    side_effects: ["status IN_PROGRESS -> CLOSED_WITH_EXCEPTIONS", "AuditEvent appended"]

  # --- Evidence packages ---
  - method: POST
    path: "/compliance/evidence-packages"
    description: "Open an evidence package for a completed plan"
    roles: [BusinessOwner]
    code: 201
    input: [implementation_plan_id]
    output: EvidencePackage
    side_effects:
      - "plan COMPLETED (ERR_PLAN_NOT_COMPLETED); one package per plan (ERR_PACKAGE_ALREADY_EXISTS); ownership enforced"
      - "status = ASSEMBLING; AuditEvent appended"
  - method: GET
    path: "/compliance/evidence-packages"
    description: "List evidence packages with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["implementation_plan_id?", "status?", "limit?", "offset?"]
    output: "EvidencePackage[]"
    side_effects: []
  - method: GET
    path: "/compliance/evidence-packages/{id}"
    description: "Get one evidence package"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: EvidencePackage
    side_effects: []
  - method: POST
    path: "/compliance/evidence-packages/{id}/artifacts"
    description: "Attach an artifact to an assembling package"
    roles: [BusinessOwner]
    code: 201
    input: [artifact_type, uri]
    output: EvidencePackage
    side_effects:
      - "status must be ASSEMBLING (ERR_PACKAGE_SEALED); artifact appended with server-minted artifact_id and attached_at = clock; artifact_count recomputed"
      - "AuditEvent appended"
  - method: DELETE
    path: "/compliance/evidence-packages/{id}/artifacts/{artifactId}"
    description: "Remove an artifact while the package is still assembling"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: EvidencePackage
    side_effects:
      - "status must be ASSEMBLING (ERR_PACKAGE_SEALED); artifact removed (ERR_NOT_FOUND if unknown artifactId); artifact_count recomputed"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/evidence-packages/{id}/seal"
    description: "Seal the package (immutable afterwards), verifying the plan and possibly closing the change"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: EvidencePackage
    side_effects:
      - "status ASSEMBLING -> SEALED; artifact_count >= 1 (ERR_NO_ARTIFACTS); sealed_at = clock"
      - "Cascade link 1: plan COMPLETED -> VERIFIED (verification_evidence_id set)"
      - "Cascade link 2: RegulatoryChange closure re-evaluated (TRIAGED_APPLICABLE -> CLOSED)"
      - "AuditEvent appended"
  - method: POST
    path: "/compliance/evidence-packages/{id}/submit-to-examiner"
    description: "Record submission of a sealed package to an examiner"
    roles: [ComplianceManager]
    code: 200
    input: [examiner_reference]
    output: EvidencePackage
    side_effects: ["status SEALED -> SUBMITTED_TO_EXAMINER; examiner_reference stored", "AuditEvent appended"]

  # --- Escalations ---
  - method: GET
    path: "/compliance/escalations"
    description: "List escalations with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["status?", "target_type?", "target_id?", "business_owner_id?", "trigger_rule?", "limit?", "offset?"]
    output: "Escalation[]"
    side_effects: []
  - method: GET
    path: "/compliance/escalations/{id}"
    description: "Get one escalation"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: Escalation
    side_effects: []
  - method: POST
    path: "/compliance/escalations/{id}/acknowledge"
    description: "Acknowledge an open escalation"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Escalation
    side_effects: ["status OPEN -> ACKNOWLEDGED", "AuditEvent appended"]
  - method: POST
    path: "/compliance/escalations/{id}/resolve"
    description: "Manually resolve an escalation"
    roles: [ComplianceManager]
    code: 200
    input: [resolution_note]
    output: Escalation
    side_effects:
      - "status OPEN|ACKNOWLEDGED -> RESOLVED; resolution_code = MANUAL_RESOLUTION; resolved_at = clock"
      - "BusinessOwner.open_escalation_count recomputed; assignment_suspended may clear"
      - "AuditEvent appended"

  # --- Committee reports ---
  - method: POST
    path: "/compliance/committee-reports"
    description: "Create a draft committee report for a half-open [start, end) period"
    roles: [BoardSecretary]
    code: 201
    input: [committee_name, period_start, period_end]
    output: CommitteeReport
    side_effects:
      - "period_end > period_start (ERR_INVALID_REPORT_PERIOD); no overlap with existing reports of the same committee (ERR_REPORT_PERIOD_OVERLAP; adjacency allowed)"
      - "status = DRAFT; metrics null until finalize; AuditEvent appended"
  - method: GET
    path: "/compliance/committee-reports"
    description: "List committee reports with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["committee_name?", "status?", "limit?", "offset?"]
    output: "CommitteeReport[]"
    side_effects: []
  - method: GET
    path: "/compliance/committee-reports/{id}"
    description: "Get one committee report"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: []
    output: CommitteeReport
    side_effects: []
  - method: POST
    path: "/compliance/committee-reports/{id}/finalize"
    description: "Freeze the metrics snapshot on a draft report"
    roles: [BoardSecretary]
    code: 200
    input: []
    output: CommitteeReport
    side_effects: ["status DRAFT -> FINALIZED; metrics computed via compliance_index + sla_compliance_pct and frozen", "AuditEvent appended"]
  - method: POST
    path: "/compliance/committee-reports/{id}/present"
    description: "Mark a finalized report as presented"
    roles: [BoardSecretary]
    code: 200
    input: []
    output: CommitteeReport
    side_effects: ["status FINALIZED -> PRESENTED", "AuditEvent appended"]

  # --- Audit trail ---
  - method: GET
    path: "/compliance/audit-events"
    description: "List audit events (replay order: sequence_number ASC) with filters and pagination"
    roles: [ComplianceOfficer, ComplianceManager, BusinessOwner, BoardSecretary, PlatformAdmin]
    code: 200
    input: ["entity_type?", "entity_id?", "actor_user_id?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []
  - method: GET
    path: "/compliance/audit-events/verify"
    description: "Recompute the hash chain over all events in sequence order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { chain_valid: boolean, events_checked: integer }
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum member, or invalid datetime" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role is not in the endpoint's role list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "BusinessOwner action attempted on a resource whose business_owner_id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same user attempts two segregated steps (triage vs create, mapping approve vs propose, policy approve vs draft)" }
  - { id: ERR_OWNER_SUSPENDED, http: 403, condition: "Assignee BusinessOwner has assignment_suspended == true (open_escalation_count >= 3)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist (checked left-to-right, path before body)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure for the attempted transition" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "Plan approve/reject attempted when execution_status != SUBMITTED" }
  - { id: ERR_PLAN_NOT_COMPLETED, http: 409, condition: "Evidence package creation attempted for a plan not in COMPLETED" }
  - { id: ERR_PACKAGE_SEALED, http: 409, condition: "Artifact attach/remove or seal attempted on a package no longer ASSEMBLING" }
  - { id: ERR_CHANGE_NOT_SUPERSEDABLE, http: 409, condition: "supersedes_change_id targets a change not IN {PENDING_TRIAGE, TRIAGED_NOT_APPLICABLE}" }
  - { id: ERR_CHANGE_NOT_TRIAGED_APPLICABLE, http: 409, condition: "Referenced change is not TRIAGED_APPLICABLE (obligation create, assessment create)" }
  - { id: ERR_OBLIGATION_NOT_ACTIVE, http: 409, condition: "Referenced obligation is not ACTIVE (mapping create, plan approve)" }
  - { id: ERR_OBLIGATION_IN_USE, http: 409, condition: "Obligation retire blocked by open gap analyses or non-terminal plans" }
  - { id: ERR_CONTROL_NOT_ACTIVE, http: 409, condition: "Referenced control is not ACTIVE (mapping create, policy create)" }
  - { id: ERR_CONTROL_IN_USE, http: 409, condition: "Control retire blocked by PROPOSED/APPROVED mappings" }
  - { id: ERR_GAP_NOT_CONFIRMED, http: 409, condition: "Plan creation attempted against a gap analysis not CONFIRMED" }
  - { id: ERR_DUPLICATE_OBLIGATION_CODE, http: 409, condition: "obligation_code already exists" }
  - { id: ERR_DUPLICATE_CONTROL_CODE, http: 409, condition: "control_code already exists" }
  - { id: ERR_DUPLICATE_MAPPING, http: 409, condition: "A PROPOSED or APPROVED mapping already exists for the (obligation_id, control_id) pair" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "A non-terminal implementation plan already exists for the gap analysis" }
  - { id: ERR_PACKAGE_ALREADY_EXISTS, http: 409, condition: "An evidence package already exists for the implementation plan" }
  - { id: ERR_REGISTER_EMPTY, http: 409, condition: "Register publish attempted with zero ACTIVE obligations" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report window overlaps an existing report of the same committee (half-open windows; adjacency allowed)" }
  - { id: ERR_ROLLOUT_WINDOW_CONFLICT, http: 409, condition: "New rollout window on the same control is not separated by >= 7 days from a non-CANCELLED sibling window" }
  - { id: ERR_STALE_CHANGE_VERSION, http: 412, condition: "expected_regulatory_change_version != current RegulatoryChange.version" }
  - { id: ERR_STALE_REGISTER_VERSION, http: 412, condition: "expected_register_version != current ObligationRegister.version" }
  - { id: ERR_STALE_CONTROL_VERSION, http: 412, condition: "expected_control_version != current Control.version" }
  - { id: ERR_DEADLINE_IN_PAST, http: 422, condition: "due_date / target_completion_date / effective_date is not strictly after the logical clock" }
  - { id: ERR_DEADLINE_EXCEEDS_MANDATE, http: 422, condition: "Plan target_completion_date exceeds the implementation_deadline mandate for the obligation criticality" }
  - { id: ERR_INVALID_EXTENSION, http: 422, condition: "Extension target not strictly after current target or more than 90 days beyond it" }
  - { id: ERR_MAX_EXTENSIONS_REACHED, http: 422, condition: "extension_count already == 2" }
  - { id: ERR_TRAINING_WINDOW_TOO_SHORT, http: 422, condition: "Policy publish with effective_date < logical clock + 7 days" }
  - { id: ERR_RETRACT_WINDOW_CLOSED, http: 422, condition: "Retract attempted at or after the policy effective_date" }
  - { id: ERR_TRAINING_WINDOW_CLOSED, http: 422, condition: "Rollout complete attempted after window_end" }
  - { id: ERR_COMPLETION_THRESHOLD_NOT_MET, http: 422, condition: "Rollout complete with completion_pct < 95.0" }
  - { id: ERR_EXCEPTION_THRESHOLD_NOT_MET, http: 422, condition: "Close-with-exceptions with completion_pct < 80.0" }
  - { id: ERR_NO_ARTIFACTS, http: 422, condition: "Seal attempted with artifact_count == 0" }
  - { id: ERR_INVALID_REPORT_PERIOD, http: 422, condition: "period_end <= period_start" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Compliance office analyst: horizon intake, triage, obligation register, controls, mappings, gap analysis, policy drafting"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/business-owners"
      - "POST /compliance/regulatory-changes, .../triage, .../retriage (SoD: triage actor != change creator)"
      - "POST /compliance/obligations, .../activate, .../retire, .../reinstate"
      - "POST /compliance/controls, .../record-review, .../retire"
      - "POST /compliance/obligation-control-mappings, .../approve (SoD: approver != creator), .../reject, .../retire"
      - "POST /compliance/obligation-register/publish"
      - "POST /compliance/gap-analyses/{id}/begin-review, .../confirm"
      - "POST /compliance/policy-updates, .../submit, .../revise"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: ComplianceManager
    description: "Compliance manager: assessment acceptance, plan/policy approval, evidence sealing, examiner submission, escalation handling"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/impact-assessments/{id}/accept, .../return"
      - "POST /compliance/implementation-plans/{id}/approve, .../reject"
      - "POST /compliance/policy-updates/{id}/approve (SoD: approver != drafter), .../reject, .../publish, .../retract"
      - "POST /compliance/evidence-packages/{id}/seal, .../submit-to-examiner"
      - "POST /compliance/training-rollouts/{id}/close-with-exceptions"
      - "POST /compliance/escalations/{id}/acknowledge, .../resolve"
    shared_operations:
