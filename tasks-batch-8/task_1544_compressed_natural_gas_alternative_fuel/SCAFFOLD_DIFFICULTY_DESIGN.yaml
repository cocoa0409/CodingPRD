            - "FuelingSession.${s4}.total_amount_cents == 2000  (8.000 x 250)"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_rejected_reopen_cycle
        grounds:
          - state_machines.TaxCreditClaim.REJECTED_to_DRAFT
          - state_machines.TaxCreditClaim.DRAFT_to_FINALIZED
          - state_machines.TaxCreditClaim.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on TaxCreditClaim: SUBMITTED -> REJECTED -> DRAFT ->
          FINALIZED -> SUBMITTED -> APPROVED traverses the reject/reopen loop
          once and still reaches the terminal APPROVED with identical final
          amounts (504 cents), proving the cycle re-computes rather than
          corrupts claim data.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), DSP-C CNG calibrated +0.50% (factor 0.995), PRIVATE CNG policy 289"
            - "Account + card; one July session of 26.0 kg (settled 10.078) swept to SETTLED by the August clock advance"
            - "Claim over 2026-07-01..2026-08-01 created in August"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Foxtrot", station_code: "ST-FOX", access_mode: "DUAL", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.50 }, as: StationManager }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Foxtrot Freight", billing_email: "ap@fox.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-6001", vehicle_plate: "2MNO345", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-K1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 26.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: NetworkOperator }
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager, captures: { fin1: $.data.claim_amount_final_cents } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/decision", payload: { outcome: "REJECTED", reason: "missing manifest attestation" }, as: NetworkOperator }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/reopen", payload: {}, as: StationManager, captures: { st_reopen: $.data.status } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager, captures: { fin2: $.data.claim_amount_final_cents } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/decision", payload: { outcome: "APPROVED" }, as: NetworkOperator, captures: { st_final: $.data.status } }
          assert:
            - "fin1 == 504  (SETTLED-only settled GGE 10.078 x 50 = 503.9 -> half-up 504)"
            - "st_reopen == DRAFT (cycle REJECTED -> DRAFT traversed)"
            - "fin2 == 504  (re-finalize after reopen recomputes to the identical amount; own prior capture does not self-exclude)"
            - "st_final == APPROVED (terminal reached after the loop)"

      - name: account_suspend_resume_cycle_gates_fueling
        grounds:
          - state_machines.FleetAccount.ACTIVE_to_SUSPENDED
          - state_machines.FleetAccount.SUSPENDED_to_ACTIVE
          - "validations[priority=6]"
        distinguishing_aspect: |
          Cyclic machine on FleetAccount (different entity than TaxCreditClaim):
          ACTIVE -> SUSPENDED -> ACTIVE; the SUSPENDED midpoint blocks new
          authorizations with ERR_ACCOUNT_NOT_ACTIVE while the resumed account
          authorizes again with its balance and cards intact.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), DSP-C CNG, PRIVATE CNG policy 289; account credit 1000000 with card FC-7001"
            - "One successful authorize (session S1, hold 5780) proves the ACTIVE state admits fueling"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Golf", station_code: "ST-GOLF", access_mode: "DUAL", backup_capacity_gge: 10000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Golf Logistics", billing_email: "ap@golf.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-7001", vehicle_plate: "1PQR678", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-A1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /cng/fleet-accounts/${acct_id}/suspend", payload: {}, as: NetworkOperator, captures: { st_susp: $.data.status } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { av2: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-A2", estimated_gge: 20.0, expected_fleet_account_version: "${av2}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cng/fleet-accounts/${acct_id}/resume", payload: {}, as: NetworkOperator, captures: { st_res: $.data.status } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { av3: $.data.version, bal3: $.data.outstanding_balance_cents } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-A3", estimated_gge: 20.0, expected_fleet_account_version: "${av3}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s3: $.data.id } }
          assert:
            - "st_susp == SUSPENDED (cycle midpoint reached)"
            - "err == ERR_ACCOUNT_NOT_ACTIVE (suspended account blocks authorize even though card is ACTIVE and funds suffice)"
            - "st_res == ACTIVE (cycle closed)"
            - "bal3 == 5780 (first session's hold survived the suspend/resume round trip)"
            - "FuelingSession.${s3}.status == AUTHORIZED and its hold_amount_cents == 5780"

  - rule_id: transitive_cascade
    instances:
      - name: maintenance_window_start_outage_cascade
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS
          - state_machines.Compressor.ONLINE_to_UNDER_MAINTENANCE
          - calculations.uptime_posture_derivation
          - state_machines.FuelingSession.AUTHORIZED_to_VOIDED
          - calculations.hold_amount_and_credit_check
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (window start): window IN_PROGRESS
          -> compressor UNDER_MAINTENANCE -> posture OUTAGE -> AUTHORIZED session
          VOIDED(STATION_OUTAGE) -> account hold released (balance 5780 -> 0).
          Each hop is caused by the previous mutation, not by the original call.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL) with a SINGLE compressor CMP-1 ONLINE and DSP-C IN_SERVICE; PRIVATE CNG policy 289"
            - "Backup arrangement BA committed 1000 GGE available 2026-08-10T00:00..2026-08-20T00:00, ACTIVATED (required to start maintenance on the last online compressor)"
            - "PREVENTIVE window W on CMP-1 for 2026-08-10T09:00..17:00; logical clock at 2026-08-10T09:30"
            - "Account (credit 1000000) + card; session S AUTHORIZED at 09:30 with hold 5780"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Hotel", station_code: "ST-HOTEL", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager, captures: { cmp_id: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-PARTNER", available_from: "2026-08-10T00:00:00Z", available_until: "2026-08-20T00:00:00Z", committed_gge: 1000 }, as: StationManager, captures: { ba_id: $.data.id } }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T17:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { win_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: NetworkOperator }
            - { call: "POST /cng/backup-arrangements/${ba_id}/activate", payload: {}, as: StationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:30:00Z" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Hotel Freight", billing_email: "ap@hotel.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-8001", vehicle_plate: "9STU901", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-M1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { sess_id: $.data.id } }
          trigger:
            - { call: "POST /cng/maintenance-windows/${win_id}/start", payload: {}, as: StationManager, captures: { win_status: $.data.status } }
            - { call: "GET /cng/compressors/${cmp_id}", payload: {}, as: StationManager, captures: { cmp_cond: $.data.condition } }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: StationManager, captures: { posture: $.data.uptime_posture } }
            - { call: "GET /cng/fueling-sessions/${sess_id}", payload: {}, as: StationManager, captures: { sess_status: $.data.status, sess_reason: $.data.void_reason } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "win_status == IN_PROGRESS (hop 0: the triggering mutation)"
            - "cmp_cond == UNDER_MAINTENANCE (hop 1: caused by the window start)"
            - "posture == OUTAGE (hop 2: caused by the compressor mutation — zero online compressors remain)"
            - "sess_status == VOIDED and sess_reason == STATION_OUTAGE (hop 3: caused by the posture change, not by the window start directly)"
            - "bal == 0 (hop 4: hold release caused by the void — 5780 hold fully reversed)"

      - name: inspection_fail_approval_cascade
        grounds:
          - state_machines.SafetyInspection.COMPLETED_to_APPROVED
          - state_machines.Station.ACTIVE_to_SUSPENDED
          - state_machines.FuelingSession.AUTHORIZED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger than the maintenance cascade
          (inspection approval of a FAIL): inspection APPROVED -> station
          SUSPENDED -> AUTHORIZED session VOIDED(INSPECTION_FAIL) -> hold
          released (balance 5780 -> 0).
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), CMP-1 ONLINE, DSP-C IN_SERVICE, PRIVATE CNG policy 289"
            - "Account (credit 1000000) + card; session S AUTHORIZED with hold 5780 (clock never advances, so no timeout sweep)"
            - "ODORIZATION_CHECK inspection scheduled_for 2026-08-20T10:00 (still SCHEDULED at the default clock), COMPLETED with result FAIL by station manager sm-100"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "India", station_code: "ST-INDIA", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "India Transport", billing_email: "ap@india.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-8002", vehicle_plate: "8VWX234", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-I1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { sess_id: $.data.id } }
            - { call: "POST /cng/safety-inspections", payload: { station_id: "${st_id}", inspection_type: "ODORIZATION_CHECK", scheduled_for: "2026-08-20T10:00:00Z" }, as: StationManager, captures: { insp_id: $.data.id } }
            - { call: "POST /cng/safety-inspections/${insp_id}/complete", payload: { result: "FAIL", findings: "odorant not detectable at outlet" }, as: StationManager, as_user_id: "sm-100" }
          trigger:
            - { call: "POST /cng/safety-inspections/${insp_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-100", captures: { insp_status: $.data.status } }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: ComplianceOfficer, captures: { st_status: $.data.status } }
            - { call: "GET /cng/fueling-sessions/${sess_id}", payload: {}, as: StationManager, captures: { sess_status: $.data.status, sess_reason: $.data.void_reason } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "insp_status == APPROVED (hop 0: triggering approval of a FAIL result)"
            - "st_status == SUSPENDED (hop 1: caused by the FAIL approval)"
            - "sess_status == VOIDED and sess_reason == INSPECTION_FAIL (hop 2: caused by the suspension)"
            - "bal == 0 (hop 3: hold released by the void)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: authorize_dispenser_down_over_credit_state_beats_fiscal
        grounds:
          - "validations[priority=6]"
          - "validations[priority=10]"
          - "errors[ERR_DISPENSER_NOT_IN_SERVICE]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Pair {state vs business_fiscal}: one authorize request violates both
          ERR_DISPENSER_NOT_IN_SERVICE (p6, dispenser OUT_OF_SERVICE after a FAIL
          calibration) and ERR_CREDIT_LIMIT_EXCEEDED (p10, credit_limit 100 <<
          hold 5780); the state error must win.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), CMP-1 ONLINE, DSP-C calibrated at +0.51% -> FAIL -> OUT_OF_SERVICE"
            - "Account credit_limit_cents 100 (any hold exceeds it), card ACTIVE; NO pricing policy needed (fiscal layer never reached)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Juliett", station_code: "ST-JUL", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.51 }, as: StationManager, captures: { cal_res: $.data.result } }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Juliett Freight", billing_email: "ap@juliett.example", credit_limit_cents: 100 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-9001", vehicle_plate: "7YZA567", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-P1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err: $.data.error_id } }
          assert:
            - "cal_res == FAIL (0.51 > 0.50 tolerance)"
            - "err == ERR_DISPENSER_NOT_IN_SERVICE with HTTP 409 (state priority 6 beats fiscal priority 10; credit would have failed too)"

      - name: window_create_overdue_inspection_beats_overlap
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "errors[ERR_OVERDUE_INSPECTION]"
          - "errors[ERR_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Pair {business_safety vs business_constraint} (different categories
          than instance 1): one window-create violates both the overdue-
          inspection safety gate (p7) and the pairwise overlap rule against an
          existing window (p8); the safety error must win.
        test_recipe:
          setup:
            - "ACTIVE station ST with CMP-1; window W1 SCHEDULED for 2026-08-20T10:00..12:00 on CMP-1"
            - "ODORIZATION_CHECK scheduled_for 2026-08-02T10:00; clock advanced to 2026-08-03 so the sweep marks it OVERDUE"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Kilo", station_code: "ST-KILO", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager, captures: { cmp_id: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { w1: $.data.id } }
            - { call: "POST /cng/safety-inspections", payload: { station_id: "${st_id}", inspection_type: "ODORIZATION_CHECK", scheduled_for: "2026-08-02T10:00:00Z" }, as: StationManager, captures: { insp_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T11:00:00Z", ends_at: "2026-08-20T13:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { err: $.data.error_id } }
          assert:
            - "SafetyInspection.${insp_id}.status == OVERDUE after the clock sweep"
            - "err == ERR_OVERDUE_INSPECTION with HTTP 409 (safety priority 7 beats constraint priority 8; the window also directly overlaps W1)"

  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_exact_equality_authorized
        grounds:
          - calculations.hold_amount_and_credit_check
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
          - entities.FleetAccount.fields.credit_limit_cents
        distinguishing_aspect: |
          Money metric on the authorize endpoint: hold exactly equal to the
          remaining credit (5780 == 5780) is ALLOWED (<= semantics); one cent
          less headroom (limit 5779) rejects with ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), DSP-C IN_SERVICE, PRIVATE CNG policy 289 (so hold on est 20.0 GGE is exactly 5780)"
            - "Account A1 with credit_limit_cents 5780 and card C1; account A2 with credit_limit_cents 5779 and card C2"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Lima", station_code: "ST-LIMA", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Lima Exact", billing_email: "ap@lima1.example", credit_limit_cents: 5780 }, as: NetworkOperator, captures: { a1: $.data.id, a1v: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${a1}", card_number: "FC-9101", vehicle_plate: "6BCD890", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${a1}", captures: { c1: $.data.id } }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Lima Short", billing_email: "ap@lima2.example", credit_limit_cents: 5779 }, as: NetworkOperator, captures: { a2: $.data.id, a2v: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${a2}", card_number: "FC-9102", vehicle_plate: "6BCD891", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${a2}", captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${c1}", dispenser_id: "${dsp_c}", client_ref: "CR-B1", estimated_gge: 20.0, expected_fleet_account_version: "${a1v}" }, as: FleetDriver, as_user_id: "${c1}", captures: { s1: $.data.id, hold1: $.data.hold_amount_cents } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${c2}", dispenser_id: "${dsp_c}", client_ref: "CR-B2", estimated_gge: 20.0, expected_fleet_account_version: "${a2v}" }, as: FleetDriver, as_user_id: "${c2}", captures: { err: $.data.error_id } }
          assert:
            - "hold1 == 5780 and FuelingSession.${s1}.status == AUTHORIZED (equality at the credit limit is allowed)"
            - "FleetAccount.${a1}.outstanding_balance_cents == 5780"
            - "err == ERR_CREDIT_LIMIT_EXCEEDED with HTTP 402 (5780 > 5779 by exactly one cent)"

      - name: calibration_tolerance_exact_boundary
        grounds:
          - calculations.calibration_outcome
          - "errors[ERR_INVALID_REQUEST]"
          - entities.CalibrationRecord.fields.result
        distinguishing_aspect: |
          Different metric (percentage, not money) on a different endpoint
          (calibration create, not authorize): abs(error) == 0.50 exactly PASSES
          and refreshes the correction factor, while 0.51 FAILS and knocks the
          dispenser OUT_OF_SERVICE.
        test_recipe:
          setup:
            - "Station ST with CMP-1 and two CNG dispensers DSP-1, DSP-2 (no activation needed — calibration is ungated)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Mike", station_code: "ST-MIKE", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-1", fuel_type: "CNG" }, as: StationManager, captures: { d1: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-2", fuel_type: "CNG" }, as: StationManager, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${d1}", measured_error_pct: 0.50 }, as: StationManager, captures: { r1: $.data.result, f1: $.data.applied_correction_factor } }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${d2}", measured_error_pct: 0.51 }, as: StationManager, captures: { r2: $.data.result, f2: $.data.applied_correction_factor } }
            - { call: "GET /cng/dispensers/${d1}", payload: {}, as: StationManager, captures: { d1_status: $.data.status } }
            - { call: "GET /cng/dispensers/${d2}", payload: {}, as: StationManager, captures: { d2_status: $.data.status } }
          assert:
            - "r1 == PASS and f1 == 0.995 (exactly 0.50 passes; factor = 1 - 0.50/100)"
            - "r2 == FAIL and f2 == null (0.51 exceeds tolerance)"
            - "d1_status == IN_SERVICE (unchanged)"
            - "d2_status == OUT_OF_SERVICE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorize_requires_dispenser_in_service
        grounds:
          - state_machines.FuelingSession.AUTHORIZED_to_COMPLETED
          - entities.FuelingSession.fields.dispenser_id
          - "validations[priority=6]"
        distinguishing_aspect: |
          Pair FuelingSession -> Dispenser: authorization on an OUT_OF_SERVICE
          dispenser is rejected even though the station posture is OPERATIONAL
          (a second dispenser keeps the station up), isolating the per-dispenser
          dependency from the posture gate.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), CMP-1 ONLINE, DSP-1 FAIL-calibrated (OUT_OF_SERVICE), DSP-2 IN_SERVICE; posture remains OPERATIONAL"
            - "PRIVATE CNG policy 289; account credit 1000000; card FC-9201"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "November", station_code: "ST-NOV", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-1", fuel_type: "CNG" }, as: StationManager, captures: { d1: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-2", fuel_type: "CNG" }, as: StationManager, captures: { d2: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${d1}", measured_error_pct: 0.51 }, as: StationManager }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "November Freight", billing_email: "ap@nov.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-9201", vehicle_plate: "5EFG123", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${d1}", client_ref: "CR-X1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${d2}", client_ref: "CR-X2", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s2: $.data.id } }
          assert:
            - "err == ERR_DISPENSER_NOT_IN_SERVICE (DSP-1 OUT_OF_SERVICE blocks its own authorization)"
            - "FuelingSession.${s2}.status == AUTHORIZED and unit_price_cents == 289 (same station, healthy dispenser succeeds)"
            - "Station.${st_id}.uptime_posture == OPERATIONAL throughout (one IN_SERVICE dispenser suffices)"

      - name: contract_activate_requires_account_and_station_active
        grounds:
          - state_machines.SupplyContract.DRAFT_to_ACTIVE
          - state_machines.FleetAccount.ACTIVE_to_SUSPENDED
          - state_machines.Station.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair SupplyContract -> FleetAccount/Station (different entities than
          FuelingSession -> Dispenser): activation is gated first by a SUSPENDED
          account (ERR_ACCOUNT_NOT_ACTIVE), then by a SUSPENDED station
          (ERR_STATION_NOT_ACTIVE), and succeeds only when both are ACTIVE.
        test_recipe:
          setup:
            - "ACTIVE station ST; ACTIVE account A; DRAFT contract C over (A, ST)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Oscar", station_code: "ST-OSCAR", access_mode: "PRIVATE", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Oscar Logistics", billing_email: "ap@oscar.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 100.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-07", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/fleet-accounts/${acct_id}/suspend", payload: {}, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /cng/fleet-accounts/${acct_id}/resume", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/stations/${st_id}/suspend", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /cng/stations/${st_id}/resume", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator, captures: { c_status: $.data.status } }
          assert:
            - "err1 == ERR_ACCOUNT_NOT_ACTIVE (account SUSPENDED blocks activation)"
            - "err2 == ERR_STATION_NOT_ACTIVE (station SUSPENDED blocks activation once the account is healthy)"
            - "c_status == ACTIVE (both dependencies ACTIVE -> activation succeeds)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: window_pairwise_half_open_with_turnaround_buffer
        grounds:
          - calculations.window_overlap_check
          - "errors[ERR_WINDOW_OVERLAP]"
          - entities.MaintenanceWindow.fields.starts_at
        distinguishing_aspect: |
          Pairwise half-open semantics WITH a 2-hour turnaround buffer on the
          Compressor resource: [10:00,12:00) blocks a directly adjacent
          [12:00,14:00) window (gap 0 < 2h) and a partially overlapping
          [11:00,13:00) window, while [14:00,16:00) at exactly a 2-hour gap is
          allowed (>= buffer, half-open so no shared instant).
        test_recipe:
          setup:
            - "Station ST with CMP-1 (equipment state irrelevant to scheduling)"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Papa", station_code: "ST-PAPA", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager, captures: { cmp_id: $.data.id } }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T12:00:00Z", ends_at: "2026-08-20T14:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { err_adj: $.data.error_id } }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T11:00:00Z", ends_at: "2026-08-20T13:00:00Z", window_type: "CORRECTIVE" }, as: StationManager, captures: { err_ovl: $.data.error_id } }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T14:00:00Z", ends_at: "2026-08-20T16:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { w4: $.data.id, w4_status: $.data.status } }
          assert:
            - "err_adj == ERR_WINDOW_OVERLAP (adjacent with zero turnaround buffer rejected)"
            - "err_ovl == ERR_WINDOW_OVERLAP (direct half-open overlap rejected)"
            - "w4_status == SCHEDULED (gap of exactly 2 hours >= TURNAROUND_HOURS is allowed)"
            - "MaintenanceWindow.${w1}.status == SCHEDULED and remains unaffected"

      - name: backup_aggregate_capacity_with_equality
        grounds:
          - calculations.backup_capacity_check
          - "errors[ERR_BACKUP_CAPACITY_EXCEEDED]"
          - entities.Station.fields.backup_capacity_gge
        distinguishing_aspect: |
          Different interval semantics than the window rule — AGGREGATE capacity
          on the Station resource rather than pairwise exclusion: overlapping
          reservations are allowed while their summed committed_gge stays within
          backup_capacity_gge; 3000 + 2000 == 5000 passes exactly, but a further
          1 GGE overlapping both pushes the aggregate to 5001 and is rejected.
        test_recipe:
          setup:
            - "Station ST with backup_capacity_gge 5000"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Quebec", station_code: "ST-QUEBEC", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-P1", available_from: "2026-08-10T00:00:00Z", available_until: "2026-08-20T00:00:00Z", committed_gge: 3000 }, as: StationManager, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-P2", available_from: "2026-08-15T00:00:00Z", available_until: "2026-08-25T00:00:00Z", committed_gge: 2000 }, as: StationManager, captures: { b2: $.data.id, b2_status: $.data.status } }
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-P3", available_from: "2026-08-16T00:00:00Z", available_until: "2026-08-18T00:00:00Z", committed_gge: 1 }, as: StationManager, captures: { err: $.data.error_id } }
          assert:
            - "b2_status == RESERVED (aggregate 3000 + 2000 == 5000 fits the cap exactly — equality allowed)"
            - "err == ERR_BACKUP_CAPACITY_EXCEEDED (aggregate would be 5001 > 5000)"
            - "BackupFuelingArrangement.${b1}.used_gge == 0"

  - rule_id: compensating_invariant
    instances:
      - name: authorize_void_balance_conservation
        grounds:
          - calculations.hold_amount_and_credit_check
          - state_machines.FuelingSession.AUTHORIZED_to_VOIDED
          - state_machines.FuelingSession.COMPLETED_to_VOIDED
          - entities.FleetAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = account MONEY: outstanding_balance_cents must
          satisfy balance == sum(holds of AUTHORIZED) + sum(totals of
          COMPLETED/SETTLED non-voided) + sum(penalties). Both compensating
          paths (authorize+void releasing the 5780 hold; complete+void refunding
          the 2815 total) return the balance to exactly 0.
        test_recipe:
          setup:
            - "ACTIVE station ST (DUAL), DSP-C IN_SERVICE (uncalibrated, factor 1.0), PRIVATE CNG policy 289"
            - "Account credit 1000000, balance 0; card FC-9301 daily 500"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Romeo", station_code: "ST-ROMEO", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Romeo Freight", billing_email: "ap@romeo.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-9301", vehicle_plate: "4HIJ456", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-V1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { sa: $.data.id } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal_hold: $.data.outstanding_balance_cents, av2: $.data.version } }
            - { call: "POST /cng/fueling-sessions/${sa}/void", payload: { reason: "CUSTOMER_REQUEST" }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal_void1: $.data.outstanding_balance_cents, av3: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-V2", estimated_gge: 20.0, expected_fleet_account_version: "${av3}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { sb: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${sb}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}", captures: { tot: $.data.total_amount_cents } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal_done: $.data.outstanding_balance_cents } }
            - { call: "POST /cng/fueling-sessions/${sb}/void", payload: { reason: "CUSTOMER_REQUEST" }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal_void2: $.data.outstanding_balance_cents } }
            - { call: "GET /cng/fleet-cards/${card_id}", payload: {}, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { day_gge: $.data.current_day_gge } }
          assert:
            - "bal_hold == 5780 (hold posted: 20.0 x 289)"
            - "bal_void1 == 0 (authorize+void leaves the conserved balance unchanged)"
            - "tot == 2815 (settled 9.739 x 289, factor 1.0)"
            - "bal_done == 2815 (completion replaced hold with actual)"
            - "bal_void2 == 0 (complete+void refund leaves the conserved balance unchanged — zero drift across both round trips)"
            - "day_gge == 0 (the voided completion's 9.739 GGE was backed out of the daily rollup)"

      - name: complete_void_delivered_volume_conservation
        grounds:
          - calculations.minimum_volume_settlement
          - state_machines.FuelingSession.COMPLETED_to_VOIDED
          - entities.MonthlySettlement.fields.delivered_gge
        distinguishing_aspect: |
          Conserved quantity = delivered VOLUME (not money): a session that is
          completed and then voided before month close must contribute nothing
          to MonthlySettlement.delivered_gge; settling the month afterwards
          yields exactly 0.000 delivered (full 1000.000 shortfall) rather than
          8.000, proving void compensation reaches the settlement aggregate.
        test_recipe:
          setup:
            - "ACTIVE station ST (PRIVATE); account credit 1000000; card FC-9302"
            - "ACTIVE contract committed 1000.0 GGE/month, price 275, tiers 30/55, span 2026-07..2026-12"
            - "One August session of 20.536 kg (8.000 GGE) completed then voided by the station manager; clock advanced to 2026-09-01"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Sierra", station_code: "ST-SIERRA", access_mode: "PRIVATE", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Sierra Shippers", billing_email: "ap@sierra.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-9302", vehicle_plate: "3KLM789", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 1000.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-07", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-W1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 20.536 }, as: FleetDriver, as_user_id: "${card_id}", captures: { gge1: $.data.settled_gge } }
            - { call: "POST /cng/fueling-sessions/${s1}/void", payload: { reason: "MANAGER_VOID" }, as: StationManager, captures: { s1_status: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/supply-contracts/${contract_id}/settle-month", payload: { month: "2026-08" }, as: NetworkOperator, captures: { setl_id: $.data.id } }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: NetworkOperator, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "gge1 == 8.000 (the session did complete before the void)"
            - "s1_status == VOIDED"
            - "MonthlySettlement.${setl_id}.delivered_gge == 0.000 (void compensation reached the settlement aggregate — the completed-then-voided session contributes nothing)"
            - "MonthlySettlement.${setl_id}.shortfall_gge == 1000.000"
            - "MonthlySettlement.${setl_id}.penalty_cents == 52500 (min(1000,100)*30 + max(0,1000-100)*55 = 3000 + 49500)"
            - "bal == 52500 (balance conserved at 0 by the void, then +52500 penalty)"
