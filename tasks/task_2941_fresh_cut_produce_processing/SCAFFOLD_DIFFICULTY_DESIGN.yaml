# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2941 - Fresh-Cut Produce Processing
#
# Every instance grounds only in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7. Deleting this file leaves the declared behaviour identical.
#
# Shared fixture vocabulary used by the chains below (all literals pinned):
#   clock default before any /_clock call ......... 2026-08-01T00:00:00Z
#   Product P_ROMAINE ... RML-SHRED, LEAFY, allergen NONE, min_dwell 90,
#                         min_spin_rpm 800, min_ppm 20.0, base_shelf_life 16,
#                         min_yield 55.00, hold_and_release_required true
#   CustomerSpec S_FS ... FOODSERVICE, offered 14, min_remaining 10,
#                         MAP_LOW_O2, case 20.0 lb, JULIAN
#   Line L1 ............. 12 disassembly components, max_atp_rlu 200
#   WashSystem W1 ....... 4000 gal, max_concurrent_runs 2
#   GrowerLot G1 ........ LEAFY, harvest 2026-08-01T08:00:00Z, WELL,
#                         no adjacent animal operation, NEGATIVE, 0 priors
#                         -> PREHARVEST risk 100
#   RawReceipt R1 ....... pulp 3.1 C (IN_SPEC), gross 42000, tare 2000,
#                         trim 4000 -> accepted_lb 36000.00
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: run_shelf_life_provisional_vs_final_diverges
        grounds:
          - calculations.run_shelf_life_and_code_date
          - state_machines.ProcessRun.RUNNING_to_CLOSED
          - state_machines.HoldRecord.UNDER_TEST_to_RELEASED
          - entities.ProcessRun.fields.provisional_shelf_life_days
          - entities.ProcessRun.fields.final_shelf_life_days
          - entities.FinishedCase.fields.code_date_label
        distinguishing_aspect: |
          The PROVISIONAL variant anchors the harvest-lag deduction on started_at and
          carries no micro penalty, while the FINAL variant anchors on the later
          closed_at and adds MICRO_PENALTY_DAYS once the released hold's APC is at or
          above APC_ELEVATED_CFU_G; the same run therefore yields 14 days / 2026-08-17
          provisionally and 11 days / 2026-08-14 finally, a 3-day divergence made of
          one extra harvest-lag day plus two micro-penalty days.
        test_recipe:
          setup:
            - "P_ROMAINE, S_FS (FOODSERVICE, offered 14, JULIAN), L1, W1 exist"
            - "G1 is APPROVED and R1 is ACCEPTED with accepted_lb 36000.00"
            - "L1 carries one VALIDATED sanitation event, so its posture is OPEN"
            - "run RUN1 is CLOSED at 2026-08-03T11:00:00Z having started at 07:00:00Z with 30000.00 lb of R1 consumed and 900 cases packed"
            - "because P_ROMAINE.hold_and_release_required is true, the close opened a HOLD_AND_RELEASE_TESTING hold and moved all 900 cases to ON_HOLD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred 1/4 inch", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
              captures: { prod_id: "$.data.id", prod_v: "$.data.version" }
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 14, min_remaining_shelf_life_days_at_ship: 10, atmosphere_required: "MAP_LOW_O2", case_net_weight_lb: 20.0, code_date_format: "JULIAN", expected_product_version: "${prod_v}" }
              as: PlantAdmin
              captures: { spec_id: "$.data.id" }
            - call: "POST /lines"
              payload: { line_code: "L1", required_disassembly_component_count: 12, max_atp_rlu: 200 }
              as: PlantAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /wash-systems"
              payload: { system_code: "W1", water_volume_gal: 4000, max_concurrent_runs: 2 }
              as: PlantAdmin
              captures: { ws_id: "$.data.id" }
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-100", ranch_block: "B7", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 0 }
              as: QATechnician
              captures: { lot_id: "$.data.id" }
            - call: "POST /grower-lots/${lot_id}/approve"
              as: QAManager
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot_id}", received_at: "2026-08-02T05:10:00Z", pulp_temp_c: 3.1, gross_weight_lb: 42000.00, tare_weight_lb: 2000.00 }
              as: ReceivingClerk
              captures: { rcpt_id: "$.data.id" }
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 4000.00 }
              as: QATechnician
            - call: "POST /lines/${line_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-02T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { san_id: "$.data.id" }
            - call: "POST /sanitation-events/${san_id}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${san_id}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 120, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${san_id}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:30:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.2 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { run_v2: "$.data.version" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 30000.00, expected_process_run_version: "${run_v2}" }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T09:00:00Z", free_chlorine_ppm: 22.0, ph: 6.7, orp_mv: 690, turbidity_ntu: 2.4 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { prov_days: "$.data.provisional_shelf_life_days", prov_code: "$.data.provisional_code_date" }
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { hold_id: "$.data[0].id", hold_reason: "$.data[0].reason" }
          trigger:
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 1200000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { fin_days: "$.data.final_shelf_life_days", fin_code: "$.data.final_code_date" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              as: QAManager
              captures: { case1_code_date: "$.data[0].code_date", case1_label: "$.data[0].code_date_label" }
          assert:
            - "${hold_reason} == HOLD_AND_RELEASE_TESTING (the close opened the hold automatically)"
            - "${prov_days} == 14: base min(16, 14) = 14, temp penalty 0 (R1 is IN_SPEC), harvest lag at started_at = floor(47h/24) = 1 day less the 1-day grace = 0, spin penalty 0, micro penalty 0"
            - "${prov_code} == 2026-08-17 (2026-08-03 + 14 days)"
            - "${fin_days} == 11: same base 14, harvest lag at closed_at = floor(51h/24) = 2 days less the grace = 1, plus micro penalty 2 because 1200000 >= 1000000"
            - "${fin_code} == 2026-08-14 (2026-08-03 + 11 days)"
            - "the two variants diverge by exactly 3 days from two independent causes: 1 harvest-lag day (started_at 07:00 vs closed_at 11:00 crossing the 48-hour mark) and 2 micro-penalty days"
            - "${case1_code_date} == 2026-08-14 and ${case1_label} == 2026226: the release re-dated every non-shipped case to the FINAL code date, rendered JULIAN per S_FS"
            - "GET /process-runs/${run_id} shows disposition_status == RELEASED, run_status == CLOSED, cases_available == 900 and cases_on_hold == 0"

      - name: grower_lot_preharvest_vs_trailing_risk_diverges
        grounds:
          - calculations.grower_lot_risk_score
          - state_machines.GrowerLot.PENDING_APPROVAL_to_APPROVED
          - state_machines.RawReceipt.PENDING_INSPECTION_to_ACCEPTED
          - entities.GrowerLot.fields.preharvest_risk_score
          - entities.GrowerLot.fields.trailing_risk_score
          - validations[priority=38]
        distinguishing_aspect: |
          PREHARVEST scores only the lot's static field evidence and is frozen at
          approval (100 - 25 SURFACE water - min(20, 5 x 1 prior reject) = 70), while
          TRAILING starts from that frozen 70 and subtracts operating evidence
          (10 per OUT_OF_SPEC receipt), so accepting one over-temperature load leaves
          preharvest_risk_score at 70 and drops trailing_risk_score to 60 - the two
          variants disagree about the same lot at the same instant.
        test_recipe:
          setup:
            - "grower lot G2 exists with water_source SURFACE, no adjacent animal operation, preharvest_test_result NEGATIVE and prior_rejected_receipt_count 1"
            - "G2 has been approved, freezing preharvest_risk_score at 70 and copying it into trailing_risk_score"
            - "one load of G2 arrived at 4.6 C, which grades OUT_OF_SPEC, and is still PENDING_INSPECTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-200", ranch_block: "B12", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T20:00:00Z", water_source: "SURFACE", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 1 }
              as: QATechnician
              captures: { lot2_id: "$.data.id" }
            - call: "POST /grower-lots/${lot2_id}/approve"
              as: QAManager
              captures: { pre_score: "$.data.preharvest_risk_score", trail_at_approval: "$.data.trailing_risk_score", lot2_status: "$.data.status" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot2_id}", received_at: "2026-08-02T05:20:00Z", pulp_temp_c: 4.6, gross_weight_lb: 18000.00, tare_weight_lb: 1000.00 }
              as: ReceivingClerk
              captures: { rcpt2_id: "$.data.id", rcpt2_grade: "$.data.temp_grade" }
          trigger:
            - call: "POST /raw-receipts/${rcpt2_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 2000.00, override_justification: "QA manager override: product tempered to 3.2 C within 30 minutes, documented on CCP log 8842" }
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /grower-lots/${lot2_id}"
              as: QAManager
              captures: { pre_after: "$.data.preharvest_risk_score", trail_after: "$.data.trailing_risk_score", status_after: "$.data.status", oos_count: "$.data.out_of_spec_receipt_count" }
          assert:
            - "${pre_score} == 70 and ${trail_at_approval} == 70 and ${lot2_status} == APPROVED (70 >= the 50 suspension threshold)"
            - "${rcpt2_grade} == OUT_OF_SPEC (4.6 > 4.4)"
            - "${oos_count} == 1"
            - "${pre_after} == 70: the PREHARVEST variant is frozen and never re-derived from operating evidence"
            - "${trail_after} == 60: the TRAILING variant subtracts 10 per OUT_OF_SPEC receipt from the frozen 70"
            - "${status_after} == APPROVED: 60 is still at or above the 50 threshold, so no suspension fires yet"
            - "one single GET response carries two different scores for the same evidence set, which is only possible because TRAILING is anchored on the frozen PREHARVEST value instead of re-deriving it"

  # ---------------------------------------------------------------------------
  # CONVENTION - "the BASE chain"
  # Instances below whose setup says "execute the BASE chain" mean the 23 numbered
  # setup_api_calls of run_shelf_life_provisional_vs_final_diverges verbatim, which
  # end with a CLOSED run of 900 cases and bind ${prod_id} ${prod_v} ${spec_id}
  # ${line_id} ${ws_id} ${lot_id} ${rcpt_id} ${run_id} ${run_v2}. "BASE steps 1..N"
  # means only the first N of those calls. Each instance then lists the calls that
  # are specific to it, so no instance depends on another instance's trigger.
  # ---------------------------------------------------------------------------

  - rule_id: combinatorial_formula
    instances:

      - name: run_cost_allocation_rounding_order_and_remainder_waterfall
        grounds:
          - calculations.run_cost_allocation_per_case
          - entities.ProcessRun.fields.total_run_cost_cents
          - entities.ProcessRun.fields.per_case_cost_cents
          - entities.ProcessRun.fields.cost_remainder_cents
          - entities.FinishedCase.fields.allocated_cost_cents
          - state_machines.ProcessRun.RUNNING_to_CLOSED
        distinguishing_aspect: |
          The close composes four independently rounded cost components into a total and
          then splits that total by floor division plus a remainder waterfall keyed on
          case_sequence, so the 900 cases of the BASE run carry 792 cases at 99 cents and
          108 cases at 98 cents summing to exactly 88992; allocating round_half_up(total /
          cases) to every case instead would bill 89100, and rounding the components after
          summing them instead of before would move the total off 88992 as well.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23), which closes ${run_id} at 2026-08-03T11:00:00Z with water_gal_used 12345.00, crew_size 6, spin_seconds 45 and 900 cases"
            - "the latest in-window antimicrobial reading is the 09:00 reading at 22.0 ppm against a 35.0 ppm tier, so closing_topup_ppm is 13.0"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { total_cents: "$.data.total_run_cost_cents", per_case: "$.data.per_case_cost_cents", remainder: "$.data.cost_remainder_cents" }
          trigger:
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 2, offset: 791 }
              as: LineOperator
              captures: { seq_792: "$.data[0].case_sequence", cost_792: "$.data[0].allocated_cost_cents", seq_793: "$.data[1].case_sequence", cost_793: "$.data[1].allocated_cost_cents" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: LineOperator
              captures: { seq_1: "$.data[0].case_sequence", cost_1: "$.data[0].allocated_cost_cents" }
          assert:
            - "${total_cents} == 88992, built from four independently rounded components: water round_half_up(12345.00 x 0.37) = round_half_up(4567.65) = 4568; sanitizer round_half_up(13.0 x 12345.00 x 0.0021) = round_half_up(337.0185) = 337; labor round_half_up(240 x 6 x 58) = 83520; energy round_half_up(45 x 900 x 0.014) = round_half_up(567.0) = 567; 4568 + 337 + 83520 + 567 = 88992"
            - "${per_case} == 98 because floor(88992 / 900) = 98, not round_half_up(88992 / 900) = 99"
            - "${remainder} == 792 because 88992 - 98 x 900 = 792"
            - "${seq_1} == 1 and ${cost_1} == 99 (case_sequence 1 <= 792 absorbs an extra cent)"
            - "${seq_792} == 792 and ${cost_792} == 99: the last case inside the waterfall"
            - "${seq_793} == 793 and ${cost_793} == 98: the first case outside it"
            - "conservation holds exactly: 792 x 99 + 108 x 98 = 78408 + 10584 = 88992 == ${total_cents}"
            - "the naive per-case rounding would give 900 x 99 = 89100, which is 108 cents more than the run actually cost"
            - "the composition order is what makes 88992 reachable: the four components are rounded to whole cents before the sum, and only then is the sum split"

      - name: wash_target_ppm_then_dwell_evaluation_order_pinned
        grounds:
          - calculations.wash_water_load_and_target_ppm
          - entities.ProcessRun.fields.target_ppm_at_start
          - entities.ProcessRun.fields.required_dwell_seconds_at_start
          - entities.WashSystem.fields.organic_load_index
          - state_machines.ProcessRun.SETUP_to_RUNNING
          - validations[priority=48]
        distinguishing_aspect: |
          The dwell requirement is a two-stage composition: the organic load index of the
          shared wash system (0.750 from another run's 30000 lb of LEAFY product) picks the
          35.0 ppm tier, and only then is the dwell derived as
          max(90, ceil(90 x tier_ppm / measured_ppm)) = max(90, ceil(90 x 35.0 / 21.0)) = 150,
          so a second run on the same water freezes 150 seconds; deriving the dwell from the
          measured 21.0 ppm on both sides of the ratio would freeze 90 seconds instead.
        test_recipe:
          setup:
            - "execute BASE steps 1-19, leaving ${run_id} RUNNING on L1 with 30000.00 lb of LEAFY product consumed and R1 holding 6000.00 lb of balance"
            - "a second line L2 exists with a VALIDATED sanitation event so its posture is OPEN"
            - "a second run RUN_B is planned on L2 for the same wash system W1 (max_concurrent_runs 2, so two overlapping runs are allowed)"
          setup_api_calls:
            - call: "POST /lines"
              payload: { line_code: "L2", required_disassembly_component_count: 10, max_atp_rlu: 200 }
              as: PlantAdmin
              captures: { line2_id: "$.data.id" }
            - call: "POST /lines/${line2_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-03T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { san2_id: "$.data.id" }
            - call: "POST /sanitation-events/${san2_id}/start"
              as: SanitationTech
              as_user_id: "sant-2"
            - call: "POST /sanitation-events/${san2_id}/submit"
              payload: { disassembled_component_count: 10, atp_rlu: 90, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-2"
            - call: "POST /sanitation-events/${san2_id}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
            - call: "POST /process-runs"
              payload: { line_id: "${line2_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 4 }
              as: LineOperator
              captures: { runb_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T09:00:00Z", free_chlorine_ppm: 21.0, ph: 6.6, orp_mv: 680, turbidity_ntu: 2.6 }
              as: SanitationTech
              captures: { load_index: "$.data.organic_load_index_at_reading", target_at_reading: "$.data.target_free_chlorine_ppm_at_reading", topup: "$.data.topup_ppm_required" }
          trigger:
            - call: "POST /process-runs/${runb_id}/start"
              as: LineOperator
              captures: { b_target: "$.data.target_ppm_at_start", b_dwell: "$.data.required_dwell_seconds_at_start", runb_v: "$.data.version" }
            - call: "POST /process-runs/${runb_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 3000.00, expected_process_run_version: "${runb_v}" }
              as: LineOperator
            - call: "POST /process-runs/${runb_id}/close"
              payload: { actual_dwell_seconds: 149, spin_rpm: 900, spin_seconds: 30, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 3000.00, cases_produced: 90 }
              as: LineOperator
            - call: "POST /process-runs/${runb_id}/close"
              payload: { actual_dwell_seconds: 150, spin_rpm: 900, spin_seconds: 30, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 3000.00, cases_produced: 90 }
              as: LineOperator
              captures: { b_status: "$.data.run_status", b_yield: "$.data.yield_pct" }
          assert:
            - "${load_index} == 0.750 == round_half_up(30000.00 x 1.0 / (4000 x 10), 3), counted from the OTHER run's consumption because that run is RUNNING and the consumption is after last_changeout_at"
            - "${target_at_reading} == 35.0: 0.750 is at or above the 0.500 breakpoint and below 1.500"
            - "${topup} == 14.0 == round_half_up(35.0 - 21.0, 1)"
            - "${b_target} == 35.0 (frozen from the tier, not from the measured 21.0)"
            - "${b_dwell} == 150 == max(90, ceil(90 x 35.0 / 21.0)) == max(90, ceil(150.0)); using the measured ppm as the numerator would give max(90, ceil(90 x 21.0 / 21.0)) == 90"
            - "the first close (actual_dwell_seconds 149) fails with ERR_DWELL_TIME_INSUFFICIENT (priority 48), proving the frozen 150 is the gate"
            - "the second close (actual_dwell_seconds 150) succeeds: ${b_status} == CLOSED and ${b_yield} == 60.00 == round_half_up(90 x 20.0 / 3000.00 x 100, 2)"
            - "RUN_B's own 3000.00 lb consumption raises the wash index to round_half_up(33000.00 / 40000, 3) == 0.825 afterwards, but ${b_dwell} stays 150 because the start-time values are frozen"

  - rule_id: non_linear_state_machine
    instances:

      - name: hold_record_retest_cycle_then_release
        grounds:
          - state_machines.HoldRecord.UNDER_TEST_to_RETEST_REQUIRED
          - state_machines.HoldRecord.RETEST_REQUIRED_to_UNDER_TEST
          - state_machines.HoldRecord.UNDER_TEST_to_UNDER_TEST
          - entities.HoldRecord.fields.test_round
          - calculations.run_shelf_life_and_code_date
          - validations[priority=37]
        distinguishing_aspect: |
          The hold traverses the cycle UNDER_TEST -> RETEST_REQUIRED -> UNDER_TEST twice
          before a NEGATIVE result on the third round releases it, and only submit-sample
          moves the loop counter: two INDETERMINATE results leave test_round at 1 then 2
          rather than 3, so the record reaches RELEASED on exactly the third submitted
          sample with test_round == 3 and a FINAL shelf life of 13 days.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23); the close opened the automatic HOLD_AND_RELEASE_TESTING hold in state HELD with test_round 0"
            - "the logical clock stays at 2026-08-03T11:00:00Z, which is the run's closed_at"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { hold_id: "$.data[0].id", start_round: "$.data[0].test_round", start_status: "$.data[0].status" }
          trigger:
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r1_round: "$.data.test_round", r1_status: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "INDETERMINATE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { i1_round: "$.data.test_round", i1_status: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r2_round: "$.data.test_round", r2_status: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "INDETERMINATE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { i2_round: "$.data.test_round", i2_status: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r3_round: "$.data.test_round", r3_status: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 400000 }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { i3_round: "$.data.test_round", i3_status: "$.data.status", resulted_by: "$.data.resulted_by_user_id" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { final_status: "$.data.status", final_round: "$.data.test_round" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { fin_days: "$.data.final_shelf_life_days", fin_code: "$.data.final_code_date", disp: "$.data.disposition_status", avail: "$.data.cases_available", onhold: "$.data.cases_on_hold" }
          assert:
            - "${start_status} == HELD and ${start_round} == 0"
            - "${r1_round} == 1 and ${r1_status} == UNDER_TEST"
            - "${i1_round} == 1 and ${i1_status} == RETEST_REQUIRED: an INDETERMINATE result does NOT consume a round"
            - "${r2_round} == 2 and ${r2_status} == UNDER_TEST (the cycle closed back to UNDER_TEST)"
            - "${i2_round} == 2 and ${i2_status} == RETEST_REQUIRED (second lap of the same cycle)"
            - "${r3_round} == 3 and ${r3_status} == UNDER_TEST"
            - "${i3_round} == 3 and ${i3_status} == UNDER_TEST: a NEGATIVE result is the UNDER_TEST self-loop, not a state change, and ${resulted_by} == qat-2"
            - "${final_status} == RELEASED and ${final_round} == 3: three laps of a bounded cycle, MAX_TEST_ROUNDS is exactly exhausted without ever tripping ERR_MAX_RETEST_ROUNDS_EXCEEDED"
            - "the release is accepted because qam-1 differs from ${resulted_by} (priority 37 segregation of duties)"
            - "${fin_days} == 13: base 14, harvest-lag penalty 1 at closed_at, micro penalty 0 because 400000 < 1000000"
            - "${fin_code} == 2026-08-16 and every non-shipped case now carries code_date_label 2026228 (JULIAN)"
            - "${disp} == RELEASED, ${avail} == 900 and ${onhold} == 0"

      - name: process_run_parallel_run_and_disposition_dimensions
        grounds:
          - state_machines.ProcessRun.SETUP_to_RUNNING
          - state_machines.ProcessRun.RUNNING_to_CLOSED
          - state_machines.ProcessRun.UNRESTRICTED_to_HELD
          - entities.ProcessRun.fields.disposition_status
          - entities.HoldRecord.fields.cases_held_count
          - calculations.case_disposition_counts
          - validations[priority=34]
        distinguishing_aspect: |
          run_status and disposition_status advance on independent axes: a run that is still
          RUNNING can be moved to HELD, that hold captures zero cases because none have been
          packed yet, and the later close still runs its full cascade - producing a second
          hold that captures all 900 cases - so the run ends at the combined state
          (CLOSED, HELD) with two holds whose cases_held_count values are 0 and 900.
        test_recipe:
          setup:
            - "execute BASE steps 1-21, leaving ${run_id} RUNNING with 30000.00 lb consumed, an in-window 09:00 reading, and zero FinishedCase rows"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { pre_run_status: "$.data.run_status", pre_disp: "$.data.disposition_status" }
          trigger:
            - call: "POST /process-runs/${run_id}/hold-records"
              payload: { reason: "SANITATION_FAILURE" }
              as: QATechnician
              as_user_id: "qat-3"
              captures: { hold_a: "$.data.id", hold_a_held: "$.data.cases_held_count", hold_a_shipped: "$.data.shipped_case_count", hold_a_status: "$.data.status" }
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { mid_run_status: "$.data.run_status", mid_disp: "$.data.disposition_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { post_run_status: "$.data.run_status", post_disp: "$.data.disposition_status", post_avail: "$.data.cases_available", post_onhold: "$.data.cases_on_hold" }
            - call: "GET /process-runs/${run_id}/hold-records"
              payload: { reason: "HOLD_AND_RELEASE_TESTING" }
              as: QATechnician
              captures: { hold_b: "$.data[0].id", hold_b_held: "$.data[0].cases_held_count", hold_b_reason: "$.data[0].reason" }
          assert:
            - "${pre_run_status} == RUNNING and ${pre_disp} == UNRESTRICTED"
            - "${hold_a_status} == HELD, ${hold_a_held} == 0 and ${hold_a_shipped} == 0: a RUNNING run has no cases to capture"
            - "${mid_run_status} == RUNNING and ${mid_disp} == HELD: the disposition axis moved while the run axis did not"
            - "${post_run_status} == CLOSED and ${post_disp} == HELD: the run axis reached its terminal state without disturbing the disposition axis"
            - "${post_avail} == 0 and ${post_onhold} == 900: the close packed 900 cases and its auto-hold branch moved every one of them to ON_HOLD"
            - "${hold_b} != ${hold_a}, ${hold_b_reason} == HOLD_AND_RELEASE_TESTING and ${hold_b_held} == 900"
            - "${hold_a_held} stays 0 after the close: cases_held_count is captured at hold time and is never back-filled"
            - "conservation per case_disposition_counts holds: 0 available + 900 on hold + 0 shipped + 0 destroyed == 900 cases_produced"
            - "a release of ${hold_b} at this point is refused with ERR_HOLD_INVALID_STATE (priority 34) because ${hold_a} is still in the non-terminal state HELD, even though it captured no cases"

  - rule_id: transitive_cascade
    instances:

      - name: grower_lot_recall_cascades_to_cases_and_rework_runs
        grounds:
          - state_machines.GrowerLot.APPROVED_to_RECALLED
          - state_machines.RawReceipt.ACCEPTED_to_QUARANTINED
          - state_machines.ProcessRun.RELEASED_to_HELD
          - state_machines.FinishedCase.IN_INVENTORY_to_ON_HOLD
          - entities.HoldRecord.fields.shipped_case_count
          - calculations.grower_lot_risk_score
          - validations[priority=53]
        distinguishing_aspect: |
          Recalling lot G1 reaches a run that never touched G1: hop 2 quarantines R1, hop 3
          finds run1 but skips it because its disposition is already REJECTED, and hop 5 then
          walks the rework edge down from that skipped run to run2 - which consumed only G2
          product - holding it with a RECALL hold whose cases_held_count is 179 and
          shipped_case_count is 1, while run1's 900 destroyed cases and G2's trailing score of
          100 both stay untouched. Cutting the cascade at hop 4 leaves run2 RELEASED and
          shippable.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23): G1 approved at risk 100, R1 accepted with 36000.00 lb, run1 (${run_id}) CLOSED at 11:00 with 900 cases and an automatic hold"
            - "a second grower lot G2 (GRW-300, MUNICIPAL water, harvest 2026-08-01T18:00:00Z) is approved at risk 100 and its load R2 is accepted with 7000.00 lb"
            - "run1's hold is REJECTED, which moves run1's disposition to REJECTED and destroys all 900 of its cases"
            - "run2 is created as a rework of run1, consumes 6000.00 lb of R2 only, closes with 180 cases, is released, and one of its cases is shipped"
          setup_api_calls:
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-300", ranch_block: "B3", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T18:00:00Z", water_source: "MUNICIPAL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 0 }
              as: QATechnician
              captures: { lot2_id: "$.data.id" }
            - call: "POST /grower-lots/${lot2_id}/approve"
              as: QAManager
              captures: { lot2_pre: "$.data.preharvest_risk_score" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot2_id}", received_at: "2026-08-03T11:00:00Z", pulp_temp_c: 3.0, gross_weight_lb: 8000.00, tare_weight_lb: 500.00 }
              as: ReceivingClerk
              captures: { rcpt2_id: "$.data.id" }
            - call: "POST /raw-receipts/${rcpt2_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 500.00 }
              as: QATechnician
              captures: { rcpt2_accepted: "$.data.accepted_lb" }
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { hold1_id: "$.data[0].id" }
            - call: "POST /hold-records/${hold1_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/record-result"
              payload: { latest_test_result: "POSITIVE" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/reject"
              as: QAManager
              as_user_id: "qam-1"
              captures: { run1_disp_after_reject: "$.data.status" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T13:00:00Z", planned_end_at: "2026-08-03T16:00:00Z", crew_size: 5, rework_source_run_id: "${run_id}" }
              as: LineOperator
              captures: { run2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T13:00:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.8 }
              as: SanitationTech
            - call: "POST /process-runs/${run2_id}/start"
              as: LineOperator
              captures: { run2_v: "$.data.version", run2_dwell: "$.data.required_dwell_seconds_at_start" }
            - call: "POST /process-runs/${run2_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt2_id}", consumed_lb: 6000.00, expected_process_run_version: "${run2_v}" }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T15:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run2_id}/close"
              payload: { actual_dwell_seconds: 140, spin_rpm: 900, spin_seconds: 30, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 6000.00, cases_produced: 180 }
              as: LineOperator
              captures: { run2_yield: "$.data.yield_pct" }
            - call: "GET /process-runs/${run2_id}/hold-records"
              as: QATechnician
              captures: { hold2_id: "$.data[0].id" }
            - call: "POST /hold-records/${hold2_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold2_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 200000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold2_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run2_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: ShippingClerk
              captures: { case1_id: "$.data[0].id", case1_code_date: "$.data[0].code_date" }
            - call: "POST /finished-cases/${case1_id}/ship"
              as: ShippingClerk
              captures: { case1_status: "$.data.status" }
          trigger:
            - call: "POST /grower-lots/${lot_id}/recall"
              as: QAManager
              captures: { lot1_status: "$.data.status", lot1_recalled_at: "$.data.recalled_at" }
            - call: "GET /raw-receipts/${rcpt_id}"
              as: QATechnician
              captures: { r1_status: "$.data.status", r1_remaining: "$.data.remaining_lb" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { run1_disp: "$.data.disposition_status", run1_destroyed: "$.data.cases_destroyed", run1_onhold: "$.data.cases_on_hold" }
            - call: "GET /process-runs/${run2_id}"
              as: QAManager
              captures: { run2_disp: "$.data.disposition_status", run2_status: "$.data.run_status", run2_avail: "$.data.cases_available", run2_onhold: "$.data.cases_on_hold", run2_shipped: "$.data.cases_shipped" }
            - call: "GET /process-runs/${run2_id}/hold-records"
              payload: { reason: "RECALL" }
              as: QAManager
              captures: { recall_hold_reason: "$.data[0].reason", recall_hold_held: "$.data[0].cases_held_count", recall_hold_shipped: "$.data[0].shipped_case_count", recall_hold_status: "$.data[0].status" }
            - call: "GET /grower-lots/${lot2_id}"
              as: QAManager
              captures: { lot2_status: "$.data.status", lot2_trailing: "$.data.trailing_risk_score", lot2_env: "$.data.env_positive_run_count" }
            - call: "GET /process-runs/${run2_id}/traceability"
              as: QAManager
              captures: { trace_rework_src: "$.data.rework_source_run_id", trace_shipped: "$.data.shipped_case_count", trace_onhold: "$.data.on_hold_case_count", trace_lots: "$.data.grower_lot_ids" }
          assert:
            - "setup sanity: ${lot2_pre} == 100, ${rcpt2_accepted} == 7000.00, ${run2_dwell} == 132 == max(90, ceil(90 x 35.0 / 24.0)), ${run2_yield} == 60.00, ${case1_code_date} == 2026-08-17 and ${case1_status} == SHIPPED"
            - "hop 1: ${lot1_status} == RECALLED and ${lot1_recalled_at} == 2026-08-03T15:00:00Z (the logical clock, not the harvest or receipt time)"
            - "hop 2: ${r1_status} == QUARANTINED while ${r1_remaining} == 6000.00 - the pounds are unusable but the balance is not rewritten"
            - "hop 3 skips run1: ${run1_disp} == REJECTED (unchanged, REJECTED is terminal), ${run1_destroyed} == 900 and ${run1_onhold} == 0, and no RECALL hold is opened on run1"
            - "hop 5 still reaches run2 by walking the rework edge down from the run hop 3 skipped: ${run2_disp} == HELD, reverting the non-monotonic disposition axis RELEASED -> HELD, while ${run2_status} == CLOSED is untouched"
            - "hop 4 applied to run2's cases: ${run2_avail} == 0, ${run2_onhold} == 179, ${run2_shipped} == 1 - the already-shipped case is left alone (conditional cascade)"
            - "${recall_hold_reason} == RECALL, ${recall_hold_status} == HELD, ${recall_hold_held} == 179 and ${recall_hold_shipped} == 1: the recall-effectiveness number is the one case that escaped"
            - "hop 6 leaves G2 alone: ${lot2_status} == APPROVED, ${lot2_trailing} == 100 and ${lot2_env} == 0, because env_positive_run_count counts only ENVIRONMENTAL_POSITIVE holds, never RECALL holds"
            - "${trace_rework_src} == ${run_id}, ${trace_shipped} == 1, ${trace_onhold} == 179 and ${trace_lots} contains ${lot2_id} but not ${lot_id}: run2's own traceability never names the recalled lot, so only the transitive rework walk can explain the hold"
            - "the reach is 4 caused hops beyond the trigger and crosses three entity types plus a self-referential edge; removing the rework edge from the walk changes ${run2_disp} to RELEASED"

      - name: env_swab_confirmation_freezes_line_and_holds_runs
        grounds:
          - state_machines.EnvironmentalSwab.PRESUMPTIVE_POSITIVE_to_CONFIRMED_POSITIVE
          - state_machines.Line.OPEN_to_FROZEN
          - state_machines.ProcessRun.SETUP_to_CANCELLED
          - state_machines.ProcessRun.RELEASED_to_HELD
          - calculations.line_posture
          - calculations.grower_lot_risk_score
          - entities.Line.fields.open_corrective_action_count
        distinguishing_aspect: |
          One swab result propagates five hops into four other entity types: it opens a
          CRITICAL corrective action, that action alone freezes the line, the freeze cancels
          the SETUP run while leaving its disposition at UNRESTRICTED, holds the already
          RELEASED run closed one hour inside the 24-hour lookback, moves that run's 900 cases
          to ON_HOLD, and finally depresses grower lot G1's trailing score from 100 to 88;
          verifying the corrective action afterwards restores the posture to OPEN but reverses
          none of hops 4 and 5.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23), then release the automatic hold so run1 (${run_id}) is CLOSED / RELEASED with 900 cases IN_INVENTORY and a FINAL code date of 2026-08-16"
            - "a second run run2 is planned on the same line for 13:00-16:00 and is still in SETUP"
            - "a ZONE_1 drain swab collected at 2026-08-03T10:00:00Z has already been resulted PRESUMPTIVE_POSITIVE, which made the line RESTRICTED without opening any corrective action"
            - "the logical clock is 2026-08-03T11:00:00Z"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { hold1_id: "$.data[0].id" }
            - call: "POST /hold-records/${hold1_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 200000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { run1_disp_before: "$.data.disposition_status", run1_avail_before: "$.data.cases_available", run1_final_days: "$.data.final_shelf_life_days" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T13:00:00Z", planned_end_at: "2026-08-03T16:00:00Z", crew_size: 5 }
              as: LineOperator
              captures: { run2_id: "$.data.id", run2_status_before: "$.data.run_status", run2_disp_before: "$.data.disposition_status" }
            - call: "POST /lines/${line_id}/environmental-swabs"
              payload: { zone: "ZONE_1", site_code: "L1-DRAIN-04", organism: "LISTERIA_SPP", collected_at: "2026-08-03T10:00:00Z" }
              as: QATechnician
              as_user_id: "qat-3"
              captures: { swab_id: "$.data.id", swab_result_initial: "$.data.result" }
            - call: "POST /environmental-swabs/${swab_id}/result"
              payload: { result: "PRESUMPTIVE_POSITIVE" }
              as: QATechnician
              as_user_id: "qat-3"
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture_presumptive: "$.data.posture", ca_count_presumptive: "$.data.open_corrective_action_count" }
          trigger:
            - call: "POST /environmental-swabs/${swab_id}/result"
              payload: { result: "CONFIRMED_POSITIVE" }
              as: QATechnician
              as_user_id: "qat-3"
              captures: { swab_final: "$.data.result", swab_resulted_at: "$.data.resulted_at" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture_after: "$.data.posture", ca_count_after: "$.data.open_corrective_action_count" }
            - call: "GET /lines/${line_id}/corrective-actions"
              as: QAManager
              captures: { ca_id: "$.data[0].id", ca_severity: "$.data[0].severity", ca_source: "$.data[0].source_type", ca_status: "$.data[0].status", ca_ref: "$.data[0].source_ref_id" }
            - call: "GET /process-runs/${run2_id}"
              as: QAManager
              captures: { run2_status_after: "$.data.run_status", run2_disp_after: "$.data.disposition_status" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { run1_status_after: "$.data.run_status", run1_disp_after: "$.data.disposition_status", run1_avail_after: "$.data.cases_available", run1_onhold_after: "$.data.cases_on_hold" }
            - call: "GET /process-runs/${run_id}/hold-records"
              payload: { reason: "ENVIRONMENTAL_POSITIVE" }
              as: QAManager
              captures: { env_hold_reason: "$.data[0].reason", env_hold_held: "$.data[0].cases_held_count", env_hold_shipped: "$.data[0].shipped_case_count" }
            - call: "GET /grower-lots/${lot_id}"
              as: QAManager
              captures: { g1_trailing: "$.data.trailing_risk_score", g1_env_count: "$.data.env_positive_run_count", g1_status: "$.data.status", g1_pre: "$.data.preharvest_risk_score" }
            - call: "POST /corrective-actions/${ca_id}/start"
              as: QATechnician
              as_user_id: "qat-3"
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { action_taken: "Drain 4 dismantled, foamed with peracetic acid, re-swabbed NEGATIVE on three consecutive shifts" }
              as: QATechnician
              as_user_id: "qat-3"
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "PASS" }
              as: QAManager
              as_user_id: "qam-1"
              captures: { ca_status_final: "$.data.status" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture_final: "$.data.posture", ca_count_final: "$.data.open_corrective_action_count" }
            - call: "GET /process-runs/${run2_id}"
              as: QAManager
              captures: { run2_status_final: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { run1_disp_final: "$.data.disposition_status", run1_onhold_final: "$.data.cases_on_hold" }
          assert:
            - "setup sanity: ${run1_disp_before} == RELEASED, ${run1_avail_before} == 900, ${run1_final_days} == 13, ${run2_status_before} == SETUP, ${run2_disp_before} == UNRESTRICTED and ${swab_result_initial} == PENDING"
            - "the presumptive stage is deliberately inert: ${posture_presumptive} == RESTRICTED and ${ca_count_presumptive} == 0"
            - "hop 1: ${swab_final} == CONFIRMED_POSITIVE and ${swab_resulted_at} == 2026-08-03T11:00:00Z"
            - "hop 2: exactly one corrective action exists with ${ca_severity} == CRITICAL (because zone == ZONE_1), ${ca_source} == ENV_SWAB, ${ca_status} == OPEN, ${ca_ref} == ${swab_id} and ${ca_count_after} == 1"
            - "hop 3: ${posture_after} == FROZEN - the CRITICAL branch of line_posture wins over the VALIDATED sanitation that is still the newest event on the line"
            - "hop 4a: ${run2_status_after} == CANCELLED while ${run2_disp_after} == UNRESTRICTED, proving the freeze touches only the run_status axis of a SETUP run"
            - "hop 4b: ${run1_status_after} == CLOSED and ${run1_disp_after} == HELD - a run already RELEASED is re-held because closed_at 2026-08-03T11:00:00Z is inside the 24-hour lookback from collected_at 2026-08-03T10:00:00Z"
            - "hop 5a: ${run1_avail_after} == 0, ${run1_onhold_after} == 900, ${env_hold_reason} == ENVIRONMENTAL_POSITIVE, ${env_hold_held} == 900 and ${env_hold_shipped} == 0"
            - "hop 5b: ${g1_env_count} == 1 and ${g1_trailing} == 88 == 100 - 12 x 1, while ${g1_pre} == 100 stays frozen and ${g1_status} == APPROVED because 88 >= 50"
            - "the cascade is not self-reversing: after ${ca_status_final} == VERIFIED, ${ca_count_final} == 0 and ${posture_final} == OPEN, yet ${run2_status_final} == CANCELLED, ${run1_disp_final} == HELD and ${run1_onhold_final} == 900"
            - "five caused hops reach EnvironmentalSwab -> CorrectiveAction -> Line -> ProcessRun (both axes) -> FinishedCase -> GrowerLot, and no single-hop implementation can produce ${g1_trailing} == 88"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: run_start_state_beats_antimicrobial_safety
        grounds:
          - validations[priority=28]
          - validations[priority=44]
          - state_machines.ProcessRun.SETUP_to_RUNNING
          - entities.ProcessRun.fields.run_status
        distinguishing_aspect: |
          A start call against an already RUNNING run whose latest wash-water reading is 150
          minutes old violates both priority 28 and priority 44, and the response must be
          ERR_RUN_NOT_IN_SETUP; the control call - the same instant, the same stale reading,
          but a run that really is in SETUP - returns ERR_ANTIMICROBIAL_READING_STALE, proving
          both rules are live and that only their order decides the answer.
        test_recipe:
          setup:
            - "execute BASE steps 1-18: run1 (${run_id}) is RUNNING, started at 07:00 against the 06:30 reading"
            - "a second run run2 is created on the same line for the touching window 12:00-13:00 and is still in SETUP"
            - "the clock is moved to 09:00 and NO new reading is taken, so the newest reading for W1 is 150 minutes old against a 60-minute limit"
          setup_api_calls:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T12:00:00Z", planned_end_at: "2026-08-03T13:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run2_id: "$.data.id", run2_status: "$.data.run_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { conflict_error: "$.data.error_id" }
            - call: "POST /process-runs/${run2_id}/start"
              as: LineOperator
              captures: { control_error: "$.data.error_id" }
          assert:
            - "${run2_status} == SETUP (the control run is genuinely startable except for the stale reading)"
            - "${conflict_error} == ERR_RUN_NOT_IN_SETUP with HTTP 409: priority 28 outranks priority 44"
            - "${control_error} == ERR_ANTIMICROBIAL_READING_STALE with HTTP 409: the freshness rule really is violated at 09:00, 150 minutes after the 06:30 reading"
            - "neither call changes any state: run1 stays RUNNING and run2 stays SETUP"
            - "an implementation that checked wash-water freshness before the run state would answer ERR_ANTIMICROBIAL_READING_STALE to both calls, which is the failure this pair detects"

      - name: consumption_receipt_safety_beats_balance_fiscal
        grounds:
          - validations[priority=40]
          - validations[priority=64]
          - calculations.run_mass_balance_and_yield
          - entities.RawReceipt.fields.remaining_lb
        distinguishing_aspect: |
          Drawing 99999.00 lb from a load that is still PENDING_INSPECTION violates the
          food-safety rule (priority 40) and the pound-balance rule (priority 64) at once, and
          the answer must be ERR_RECEIPT_NOT_ACCEPTED; once the same load is accepted with
          5000.00 lb the identical request returns ERR_INSUFFICIENT_RECEIPT_BALANCE, and a
          request for exactly 5000.00 lb succeeds and drives remaining_lb to 0.00.
        test_recipe:
          setup:
            - "execute BASE steps 1-18: run1 (${run_id}) is RUNNING with no consumptions yet and its current version is ${run_v2}"
            - "a third load R3 of the approved lot G1 exists with gross 5000.00 lb, tare 0.00 lb and pulp 3.0 C, still PENDING_INSPECTION"
          setup_api_calls:
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot_id}", received_at: "2026-08-03T07:30:00Z", pulp_temp_c: 3.0, gross_weight_lb: 5000.00, tare_weight_lb: 0.00 }
              as: ReceivingClerk
              captures: { rcpt3_id: "$.data.id", rcpt3_status: "$.data.status", rcpt3_net: "$.data.net_weight_lb" }
          trigger:
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt3_id}", consumed_lb: 99999.00, expected_process_run_version: "${run_v2}" }
              as: LineOperator
              captures: { conflict_error: "$.data.error_id" }
            - call: "POST /raw-receipts/${rcpt3_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 0.00 }
              as: QATechnician
              captures: { rcpt3_accepted: "$.data.accepted_lb", rcpt3_remaining: "$.data.remaining_lb" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt3_id}", consumed_lb: 99999.00, expected_process_run_version: "${run_v2}" }
              as: LineOperator
              captures: { control_error: "$.data.error_id" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt3_id}", consumed_lb: 5000.00, expected_process_run_version: "${run_v2}" }
              as: LineOperator
              captures: { ok_status: "$.data.status" }
            - call: "GET /raw-receipts/${rcpt3_id}"
              as: LineOperator
              captures: { remaining_after: "$.data.remaining_lb" }
          assert:
            - "${rcpt3_status} == PENDING_INSPECTION and ${rcpt3_net} == 5000.00"
            - "${conflict_error} == ERR_RECEIPT_NOT_ACCEPTED with HTTP 409: priority 40 outranks priority 64, so an unusable load never reports a balance number"
            - "the two failed calls leave ProcessRun.version unchanged, which is why the same ${run_v2} placeholder is still current for the later calls"
            - "${rcpt3_accepted} == 5000.00 and ${rcpt3_remaining} == 5000.00"
            - "${control_error} == ERR_INSUFFICIENT_RECEIPT_BALANCE with HTTP 409: with the state rule satisfied, the fiscal rule finally speaks"
            - "${ok_status} == ACTIVE and ${remaining_after} == 0.00: exactly equal to the balance passes and drives it to zero"

  - rule_id: boundary_precision_check
    instances:

      - name: receipt_pulp_temp_at_exact_max_is_marginal
        grounds:
          - calculations.receipt_temperature_grade_and_accepted_weight
          - validations[priority=38]
          - validations[priority=3]
          - entities.RawReceipt.fields.temp_grade
          - entities.RawReceipt.fields.shelf_life_deduction_days
          - calculations.grower_lot_risk_score
        distinguishing_aspect: |
          Both temperature breakpoints are strict greater-than, so 3.3 C is IN_SPEC, 3.4 C is
          MARGINAL, 4.4 C is still MARGINAL and acceptable by a QATechnician with no override,
          and only 4.5 C becomes OUT_OF_SPEC; an implementation using >= at either breakpoint
          flips the 3.3 and 4.4 loads and changes both their deduction days and the lot's
          trailing risk score.
        test_recipe:
          setup:
            - "the logical clock is 2026-08-02T05:00:00Z"
            - "grower lot GB (GRW-400, MUNICIPAL water, no adjacent animal operation, NEGATIVE preharvest, 0 prior rejects) is APPROVED at preharvest risk 100"
            - "four loads of GB arrive at 3.3, 3.4, 4.4 and 4.5 C, each 10000.00 lb gross with 0.00 lb tare"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-400", ranch_block: "B1", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T22:00:00Z", water_source: "MUNICIPAL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 0 }
              as: QATechnician
              captures: { lotb_id: "$.data.id" }
            - call: "POST /grower-lots/${lotb_id}/approve"
              as: QAManager
              captures: { lotb_pre: "$.data.preharvest_risk_score" }
          trigger:
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lotb_id}", received_at: "2026-08-02T05:01:00Z", pulp_temp_c: 3.3, gross_weight_lb: 10000.00, tare_weight_lb: 0.00 }
              as: ReceivingClerk
              captures: { a_grade: "$.data.temp_grade", a_ded: "$.data.shelf_life_deduction_days" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lotb_id}", received_at: "2026-08-02T05:02:00Z", pulp_temp_c: 3.4, gross_weight_lb: 10000.00, tare_weight_lb: 0.00 }
              as: ReceivingClerk
              captures: { b_grade: "$.data.temp_grade", b_ded: "$.data.shelf_life_deduction_days" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lotb_id}", received_at: "2026-08-02T05:03:00Z", pulp_temp_c: 4.4, gross_weight_lb: 10000.00, tare_weight_lb: 0.00 }
              as: ReceivingClerk
              captures: { c_id: "$.data.id", c_grade: "$.data.temp_grade", c_ded: "$.data.shelf_life_deduction_days" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lotb_id}", received_at: "2026-08-02T05:04:00Z", pulp_temp_c: 4.5, gross_weight_lb: 10000.00, tare_weight_lb: 0.00 }
              as: ReceivingClerk
              captures: { d_id: "$.data.id", d_grade: "$.data.temp_grade", d_ded: "$.data.shelf_life_deduction_days" }
            - call: "POST /raw-receipts/${c_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 1000.00 }
              as: QATechnician
              captures: { c_status: "$.data.status", c_accepted: "$.data.accepted_lb" }
            - call: "POST /raw-receipts/${d_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 1000.00 }
              as: QATechnician
              captures: { d_error: "$.data.error_id" }
            - call: "POST /raw-receipts/${d_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 1000.00, override_justification: "Load tempered to 3.1 C in 20 minutes under CCP-2 deviation log 9107" }
              as: QAManager
              as_user_id: "qam-1"
              captures: { d_status: "$.data.status", d_accepted: "$.data.accepted_lb" }
            - call: "GET /grower-lots/${lotb_id}"
              as: QAManager
              captures: { lotb_oos: "$.data.out_of_spec_receipt_count", lotb_trailing: "$.data.trailing_risk_score", lotb_status: "$.data.status" }
          assert:
            - "${lotb_pre} == 100"
            - "${a_grade} == IN_SPEC and ${a_ded} == 0: exactly 3.3 is NOT above WARN_RECEIVING_TEMP_C"
            - "${b_grade} == MARGINAL and ${b_ded} == 1: one tenth of a degree higher crosses the warn breakpoint"
            - "${c_grade} == MARGINAL and ${c_ded} == 1: exactly 4.4 is NOT above MAX_RECEIVING_TEMP_C"
            - "${d_grade} == OUT_OF_SPEC and ${d_ded} == 2: one tenth of a degree higher crosses the max breakpoint"
            - "${c_status} == ACCEPTED and ${c_accepted} == 9000.00 with no override supplied at all, which only holds because 4.4 is MARGINAL"
            - "${d_error} == ERR_RECEIPT_TEMP_OUT_OF_SPEC with HTTP 409 for the QATechnician attempt on the 4.5 C load"
            - "${d_status} == ACCEPTED and ${d_accepted} == 9000.00 for the QAManager attempt carrying override_justification"
            - "${lotb_oos} == 1 counting only the 4.5 C load, so ${lotb_trailing} == 90 == 100 - 10 x 1 and ${lotb_status} == APPROVED"

      - name: yield_at_exact_product_minimum_passes
        grounds:
          - calculations.run_mass_balance_and_yield
          - validations[priority=62]
          - entities.ProcessRun.fields.yield_pct
          - entities.ProcessRun.fields.output_lb
          - state_machines.ProcessRun.RUNNING_to_CLOSED
        distinguishing_aspect: |
          The tolerance is compared against the 2-decimal rounded yield with a strict less-than,
          so 824 cases give round_half_up(54.9333, 2) = 54.93 and are refused while 825 cases
          give exactly 55.00 and are accepted; comparing the unrounded quotient, or using <=
          against the product minimum, moves the accept/reject line by one case.
        test_recipe:
          setup:
            - "execute BASE steps 1-22: run1 (${run_id}) is RUNNING with exactly 30000.00 lb of ACTIVE consumption, an in-window 09:00 reading, and the clock at 2026-08-03T11:00:00Z"
            - "the product minimum yield is 55.00 percent and the customer spec case weight is 20.0 lb"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { input_lb: "$.data.input_lb" }
          trigger:
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 824 }
              as: LineOperator
              captures: { low_error: "$.data.error_id" }
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 825 }
              as: LineOperator
              captures: { ok_status: "$.data.run_status", ok_yield: "$.data.yield_pct", ok_output: "$.data.output_lb", ok_cases: "$.data.cases_produced" }
          assert:
            - "${input_lb} == 30000.00"
            - "${low_error} == ERR_YIELD_OUT_OF_TOLERANCE with HTTP 409: 824 x 20.0 = 16480.00 lb, and round_half_up(16480.00 / 30000.00 x 100, 2) == 54.93 which is strictly below 55.00"
            - "the refused close leaves the run RUNNING with no FinishedCase rows and no closed_at, so the second attempt is a legal RUNNING -> CLOSED transition"
            - "${ok_status} == CLOSED, ${ok_cases} == 825, ${ok_output} == 16500.00 and ${ok_yield} == 55.00 exactly: equal to the product minimum passes"
            - "the one-case difference is 0.07 percentage points, so only a 2-decimal round_half_up comparison against the stored minimum reproduces both answers"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_start_requires_validated_sanitation_on_line
        grounds:
          - calculations.line_posture
          - validations[priority=41]
          - validations[priority=37]
          - state_machines.SanitationEvent.AWAITING_VALIDATION_to_VALIDATED
          - state_machines.Line.RESTRICTED_to_OPEN
          - state_machines.ProcessRun.SETUP_to_RUNNING
        distinguishing_aspect: |
          Whether a ProcessRun may start is decided entirely by the state of a different
          entity tree - the newest SanitationEvent on its Line - so the identical start call
          fails with ERR_LINE_NOT_OPEN while that event sits at AWAITING_VALIDATION and
          succeeds the moment a QATechnician who is not the performer validates it; the run,
          the wash water and the reading are unchanged between the two attempts.
        test_recipe:
          setup:
            - "execute BASE steps 1-9: product, spec, L1, W1, approved lot G1 and accepted receipt R1 exist, and L1 has never had a validated clean"
            - "a sanitation event on L1 has been started by sant-1 and submitted with 12 components and atp_rlu 120, so it sits at AWAITING_VALIDATION"
            - "a run is planned on L1 for 07:00-12:00 and a fresh 24.0 ppm reading exists at 06:30; the clock is 2026-08-03T07:00:00Z"
          setup_api_calls:
            - call: "POST /lines/${line_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-02T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { san_id: "$.data.id" }
            - call: "POST /sanitation-events/${san_id}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${san_id}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 120, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { san_status: "$.data.status", san_performer: "$.data.performed_by_user_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_c_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:30:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.2 }
              as: SanitationTech
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
            - call: "GET /lines/${line_id}"
              as: LineOperator
              captures: { posture_before: "$.data.posture", validated_before: "$.data.last_validated_sanitation_at" }
          trigger:
            - call: "POST /process-runs/${run_c_id}/start"
              as: LineOperator
              captures: { blocked_error: "$.data.error_id" }
            - call: "POST /sanitation-events/${san_id}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "sant-1"
              captures: { sod_error: "$.data.error_id" }
            - call: "POST /sanitation-events/${san_id}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
              captures: { san_final: "$.data.status", san_validated_at: "$.data.validated_at" }
            - call: "GET /lines/${line_id}"
              as: LineOperator
              captures: { posture_after: "$.data.posture", validated_after: "$.data.last_validated_sanitation_at" }
            - call: "POST /process-runs/${run_c_id}/start"
              as: LineOperator
              captures: { run_status_after: "$.data.run_status", frozen_target: "$.data.target_ppm_at_start", frozen_dwell: "$.data.required_dwell_seconds_at_start" }
          assert:
            - "${san_status} == AWAITING_VALIDATION, ${san_performer} == sant-1, ${posture_before} == RESTRICTED and ${validated_before} is null"
            - "${blocked_error} == ERR_LINE_NOT_OPEN with HTTP 409, produced by a rule that reads no field of the ProcessRun itself"
            - "${sod_error} == ERR_SEGREGATION_OF_DUTIES with HTTP 409: the performer sant-1 cannot validate their own clean even wearing the QATechnician role, so the line stays RESTRICTED"
            - "${san_final} == VALIDATED and ${san_validated_at} == 2026-08-03T07:00:00Z once qat-1 validates"
            - "${posture_after} == OPEN and ${validated_after} == 2026-08-03T07:00:00Z: the Line has no posture endpoint of its own, the value is purely derived"
            - "${run_status_after} == RUNNING on the identical start call, with ${frozen_target} == 20.0 (no consumption yet, so organic_load_index is 0.000) and ${frozen_dwell} == 90 == max(90, ceil(90 x 20.0 / 24.0))"
            - "no field of the run, the wash system or the reading changed between the two start attempts; only the sibling entity's state did"

      - name: case_ship_requires_released_hold_on_run
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - state_machines.FinishedCase.IN_INVENTORY_to_SHIPPED
          - state_machines.HoldRecord.UNDER_TEST_to_RELEASED
          - entities.ProcessRun.fields.disposition_status
        distinguishing_aspect: |
          A case's shippability is decided by its grandparent run's disposition, not by the
          case row: the first ship attempt returns ERR_HOLD_NOT_RELEASED while the run is HELD,
          the very same case ships once an unrelated QAManager releases the hold, and a third
          attempt on the now-SHIPPED case returns ERR_CASE_NOT_IN_INVENTORY - the two errors
          are ordered so a held case never reports its own status as the cause.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23): run1 (${run_id}) is CLOSED with disposition HELD and all 900 cases ON_HOLD"
            - "the clock is 2026-08-03T11:00:00Z"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: ShippingClerk
              captures: { case1_id: "$.data[0].id", case1_status_before: "$.data[0].status", case1_code_before: "$.data[0].code_date" }
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { hold1_id: "$.data[0].id" }
          trigger:
            - call: "POST /finished-cases/${case1_id}/ship"
              as: ShippingClerk
              captures: { held_error: "$.data.error_id" }
            - call: "POST /hold-records/${hold1_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 200000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold1_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { hold_status: "$.data.status" }
            - call: "POST /finished-cases/${case1_id}/ship"
              as: ShippingClerk
              captures: { ship_status: "$.data.status", shipped_at: "$.data.shipped_at", case1_code_after: "$.data.code_date" }
            - call: "POST /finished-cases/${case1_id}/ship"
              as: ShippingClerk
              captures: { repeat_error: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: ShippingClerk
              captures: { avail_after: "$.data.cases_available", shipped_after: "$.data.cases_shipped", onhold_after: "$.data.cases_on_hold" }
          assert:
            - "${case1_status_before} == ON_HOLD and ${case1_code_before} == 2026-08-17 (still the PROVISIONAL code date)"
            - "${held_error} == ERR_HOLD_NOT_RELEASED with HTTP 409: priority 35 runs before priority 36, so the run-level cause is reported even though the case itself is not IN_INVENTORY either"
            - "${hold_status} == RELEASED and ${case1_code_after} == 2026-08-16, because the release re-dated the case from the FINAL variant before it shipped"
            - "${ship_status} == SHIPPED and ${shipped_at} == 2026-08-03T11:00:00Z; the remaining life of 13 whole days clears the spec's 10-day minimum"
            - "${repeat_error} == ERR_CASE_NOT_IN_INVENTORY with HTTP 409: with the run RELEASED the higher-priority rule is satisfied and the case's own state finally speaks"
            - "${avail_after} == 899, ${shipped_after} == 1 and ${onhold_after} == 0, so the conservation invariant 899 + 0 + 1 + 0 == 900 still holds"

  - rule_id: resource_temporal_overlap
    instances:

      - name: line_run_interval_pairwise_exclusion_with_allergen_buffer
        grounds:
          - validations[priority=54]
          - validations[priority=55]
          - entities.ProcessRun.fields.planned_start_at
          - entities.Line.fields.last_run_allergen_group
          - entities.Product.fields.allergen_group
        distinguishing_aspect: |
          The line's occupancy rule is pairwise and half-open, so a window starting exactly
          when the incumbent ends is accepted while a window overlapping it by one hour is
          refused; layered on top, a following run whose product carries a different allergen
          group needs a gap of at least 45 minutes from the preceding run's planned_end_at, so
          the touching celery window is refused and the same window pushed to exactly 45
          minutes later is accepted.
        test_recipe:
          setup:
            - "execute BASE steps 1-14: run1 (${run_id}) occupies L1 for 07:00-12:00 in SETUP, packing the allergen-free romaine product"
            - "a second product P_CELERY (CELR-DICE, ROOT, allergen_group CELERY) and its FOODSERVICE spec exist"
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "CELR-DICE", name: "Celery Dice 3/8 inch", commodity_class: "ROOT", allergen_group: "CELERY", min_dwell_seconds: 120, min_spin_rpm: 800, min_antimicrobial_ppm: 25.0, base_shelf_life_days: 12, min_yield_pct: 60.00, hold_and_release_required: false }
              as: PlantAdmin
              captures: { cel_id: "$.data.id", cel_v: "$.data.version" }
            - call: "POST /products/${cel_id}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 12, min_remaining_shelf_life_days_at_ship: 8, atmosphere_required: "AIR", case_net_weight_lb: 25.0, code_date_format: "CALENDAR", expected_product_version: "${cel_v}" }
              as: PlantAdmin
              captures: { cel_spec_id: "$.data.id" }
          trigger:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T11:00:00Z", planned_end_at: "2026-08-03T14:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T12:00:00Z", planned_end_at: "2026-08-03T15:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { touch_id: "$.data.id", touch_status: "$.data.run_status" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${cel_id}", customer_spec_id: "${cel_spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T15:00:00Z", planned_end_at: "2026-08-03T18:00:00Z", crew_size: 4 }
              as: LineOperator
              captures: { buffer_error: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${cel_id}", customer_spec_id: "${cel_spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T15:45:00Z", planned_end_at: "2026-08-03T18:00:00Z", crew_size: 4 }
              as: LineOperator
              captures: { cel_run_id: "$.data.id", cel_changeover: "$.data.allergen_changeover_required" }
          assert:
            - "${overlap_error} == ERR_LINE_INTERVAL_CONFLICT with HTTP 409: [11:00, 14:00) overlaps the incumbent [07:00, 12:00) by one hour"
            - "${touch_id} exists with ${touch_status} == SETUP: [12:00, 15:00) touches the incumbent's end and half-open windows do not overlap"
            - "${buffer_error} == ERR_CHANGEOVER_BUFFER_REQUIRED with HTTP 409: the preceding non-terminal run ends at 15:00 and packs allergen_group NONE, so a CELERY run needs a 45-minute gap and got 0"
            - "${cel_run_id} exists at [15:45, 18:00) because the gap is exactly 45 minutes, which passes the >= comparison"
            - "${cel_changeover} == true: the changeover requirement is recorded at creation from the differing allergen groups and will gate the start until a validated allergen clean exists"
            - "the interval rule ignores the CLOSED and CANCELLED runs entirely and counts only SETUP and RUNNING occupants, so the two accepted windows coexist on one line"

      - name: wash_system_aggregate_concurrency_capacity
        grounds:
          - validations[priority=65]
          - validations[priority=54]
          - entities.WashSystem.fields.max_concurrent_runs
          - entities.ProcessRun.fields.wash_system_id
        distinguishing_aspect: |
          The wash system's rule is an aggregate count over overlapping windows on three
          different lines rather than a pairwise exclusion: two overlapping occupants of W1
          are accepted, a third window that overlaps both is refused with
          ERR_WASH_SYSTEM_CAPACITY_EXCEEDED even though its own line is completely free, and
          the same line's non-overlapping window is accepted immediately afterwards.
        test_recipe:
          setup:
            - "execute BASE steps 1-14: run1 (${run_id}) occupies L1 for 07:00-12:00 in SETUP on wash system W1, whose max_concurrent_runs is 2"
            - "two further lines L2 and L3 exist and carry no runs at all"
          setup_api_calls:
            - call: "POST /lines"
              payload: { line_code: "L2", required_disassembly_component_count: 10, max_atp_rlu: 200 }
              as: PlantAdmin
              captures: { line2_id: "$.data.id" }
            - call: "POST /lines"
              payload: { line_code: "L3", required_disassembly_component_count: 14, max_atp_rlu: 150 }
              as: PlantAdmin
              captures: { line3_id: "$.data.id" }
          trigger:
            - call: "POST /process-runs"
              payload: { line_id: "${line2_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T08:00:00Z", planned_end_at: "2026-08-03T13:00:00Z", crew_size: 5 }
              as: LineOperator
              captures: { second_id: "$.data.id", second_status: "$.data.run_status" }
            - call: "POST /process-runs"
              payload: { line_id: "${line3_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T10:00:00Z", crew_size: 5 }
              as: LineOperator
              captures: { third_error: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line3_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T13:00:00Z", planned_end_at: "2026-08-03T14:00:00Z", crew_size: 5 }
              as: LineOperator
              captures: { fourth_id: "$.data.id", fourth_status: "$.data.run_status" }
          assert:
            - "${second_status} == SETUP: [08:00, 13:00) on L2 overlaps exactly one other W1 occupant, and 1 < 2"
            - "${third_error} == ERR_WASH_SYSTEM_CAPACITY_EXCEEDED with HTTP 409: [09:00, 10:00) on L3 overlaps both W1 occupants, so the new run would be the third, and 2 is not < 2"
            - "the refusal is NOT ERR_LINE_INTERVAL_CONFLICT: L3 has no runs at all, which is what makes this an aggregate rule rather than a pairwise one"
            - "${fourth_id} exists with ${fourth_status} == SETUP: [13:00, 14:00) touches L2's end and overlaps nothing, so the count is 0"
            - "the capacity count spans lines but is scoped to one wash system, so an identical third window naming a different wash system would be accepted"

  - rule_id: compensating_invariant
    instances:

      - name: consumption_void_restores_receipt_pound_balance
        grounds:
          - calculations.run_mass_balance_and_yield
          - calculations.wash_water_load_and_target_ppm
          - concurrency_rules[consumption-create-stale-run]
          - state_machines.ProcessRun.RUNNING_to_CLOSED
          - entities.LotConsumption.fields.status
          - validations[priority=61]
        distinguishing_aspect: |
          Voiding the only consumption reverses every derived quantity it produced, in three
          different entities and in both directions: the receipt's remaining_lb climbs back to
          exactly 36000.00, the run's input_lb returns to 0.00, and the wash system's organic
          load falls back to 0.000 with its target ppm back at 20.0 - after which the run can
          no longer be closed at all, because no ACTIVE consumption is left.
        test_recipe:
          setup:
            - "execute BASE steps 1-21: run1 (${run_id}) is RUNNING with one ACTIVE consumption of 30000.00 lb from R1, readings at 06:30 and 09:00, and the clock at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/lot-consumptions"
              as: LineOperator
              captures: { cons_id: "$.data[0].id", cons_status_before: "$.data[0].status", cons_lb: "$.data[0].consumed_lb" }
            - call: "GET /raw-receipts/${rcpt_id}"
              as: LineOperator
              captures: { receipt_remaining_before: "$.data.remaining_lb", receipt_accepted: "$.data.accepted_lb" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { input_before: "$.data.input_lb", run_v3: "$.data.version" }
            - call: "GET /wash-systems/${ws_id}"
              as: LineOperator
              captures: { load_before: "$.data.weighted_load_lb", index_before: "$.data.organic_load_index", target_before: "$.data.target_free_chlorine_ppm" }
          trigger:
            - call: "POST /lot-consumptions/${cons_id}/void"
              payload: { expected_process_run_version: "${run_v3}" }
              as: LineOperator
              captures: { cons_status_after: "$.data.status", voided_at: "$.data.voided_at" }
            - call: "GET /raw-receipts/${rcpt_id}"
              as: LineOperator
              captures: { receipt_remaining_after: "$.data.remaining_lb" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { input_after: "$.data.input_lb", run_v4: "$.data.version" }
            - call: "GET /wash-systems/${ws_id}"
              as: LineOperator
              captures: { load_after: "$.data.weighted_load_lb", index_after: "$.data.organic_load_index", target_after: "$.data.target_free_chlorine_ppm", ws_status_after: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { close_error: "$.data.error_id" }
          assert:
            - "pre-state: ${cons_status_before} == ACTIVE, ${cons_lb} == 30000.00, ${receipt_accepted} == 36000.00, ${receipt_remaining_before} == 6000.00, ${input_before} == 30000.00, ${load_before} == 30000.00, ${index_before} == 0.750 and ${target_before} == 35.0"
            - "${cons_status_after} == VOIDED and ${voided_at} == 2026-08-03T09:00:00Z"
            - "${receipt_remaining_after} == 36000.00, exactly the pre-consumption balance, with no residue and no double credit"
            - "${input_after} == 0.00: the run-side aggregate excludes VOIDED rows entirely rather than storing a negative correction"
            - "${load_after} == 0.00, ${index_after} == 0.000, ${target_after} == 20.0 and ${ws_status_after} == IN_SERVICE: the wash tier walked back down a threshold it had crossed"
            - "${run_v4} == ${run_v3} + 1: the compensation is a write, so the optimistic-concurrency counter still advances even though every balance returned to its original value"
            - "${close_error} == ERR_NO_LOTS_CONSUMED with HTTP 409: the run is left in exactly the state it was in before the consumption, unable to close"
            - "the VOIDED row is still listed by GET /process-runs/{id}/lot-consumptions with status VOIDED, so the reversal is auditable rather than a deletion"

      - name: hold_then_release_restores_case_disposition_counts
        grounds:
          - calculations.case_disposition_counts
          - state_machines.FinishedCase.ON_HOLD_to_IN_INVENTORY
          - state_machines.ProcessRun.RELEASED_to_HELD
          - entities.HoldRecord.fields.cases_held_count
          - entities.HoldRecord.fields.shipped_case_count
        distinguishing_aspect: |
          A hold opened after two cases have already shipped captures exactly the 898 cases
          still in inventory and records shipped_case_count 2, and releasing it restores
          cases_available to exactly 898 rather than to the original 900 - the shipped pair is
          never recalled and never double-counted, so the four-way partition sums to 900 after
          every single step.
        test_recipe:
          setup:
            - "execute the BASE chain (steps 1-23), then release the automatic hold so run1 (${run_id}) holds 900 IN_INVENTORY cases at code date 2026-08-16"
            - "cases 1 and 2 are then shipped, leaving 898 available and 2 shipped"
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { auto_hold_id: "$.data[0].id" }
            - call: "POST /hold-records/${auto_hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${auto_hold_id}/record-result"
              payload: { latest_test_result: "NEGATIVE", latest_apc_cfu_g: 200000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${auto_hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 2, offset: 0 }
              as: ShippingClerk
              captures: { case1_id: "$.data[0].id", case2_id: "$.data[1].id" }
            - call: "POST /finished-cases/${case1_id}/ship"
              as: ShippingClerk
            - call: "POST /finished-cases/${case2_id}/ship"
              as: ShippingClerk
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { avail_before: "$.data.cases_available", shipped_before: "$.data.cases_shipped", onhold_before: "$.data.cases_on_hold", destroyed_before: "$.data.cases_destroyed", produced: "$.data.cases_produced" }
          trigger:
            - call: "POST /process-runs/${run_id}/hold-records"
              payload: { reason: "SANITATION_FAILURE" }
              as: QATechnician
              as_user_id: "qat-4"
              captures: { hold2_id: "$.data.id", hold2_held: "$.data.cases_held_count", hold2_shipped: "$.data.shipped_case_count" }
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { avail_held: "$.data.cases_available", onhold_held: "$.data.cases_on_hold", shipped_held: "$.data.cases_shipped", disp_held: "$.data.disposition_status" }
            - call: "POST /hold-records/${hold2_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-4"
            - call: "POST /hold-records/${hold2_id}/record-result"
              payload: { latest_test_result: "NEGATIVE" }
              as: QATechnician
              as_user_id: "qat-4"
            - call: "POST /hold-records/${hold2_id}/release"
              as: QAManager
              as_user_id: "qam-2"
              captures: { hold2_status: "$.data.status" }
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { avail_after: "$.data.cases_available", onhold_after: "$.data.cases_on_hold", shipped_after: "$.data.cases_shipped", destroyed_after: "$.data.cases_destroyed", disp_after: "$.data.disposition_status", final_days_after: "$.data.final_shelf_life_days" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { status: "SHIPPED" }
              as: ShippingClerk
              captures: { shipped_case_status: "$.data[0].status", shipped_case_code: "$.data[0].code_date" }
          assert:
            - "pre-state: ${produced} == 900, ${avail_before} == 898, ${shipped_before} == 2, ${onhold_before} == 0 and ${destroyed_before} == 0"
            - "${hold2_held} == 898 and ${hold2_shipped} == 2: the hold captures only what is still in the plant and records what escaped"
            - "${avail_held} == 0, ${onhold_held} == 898, ${shipped_held} == 2 and ${disp_held} == HELD: a RELEASED run reverted to HELD, and the shipped pair was left alone"
            - "conservation holds while held: 0 + 898 + 2 + 0 == 900"
            - "${hold2_status} == RELEASED and ${disp_after} == RELEASED"
            - "${avail_after} == 898 exactly - not 900 - with ${onhold_after} == 0, ${shipped_after} == 2 and ${destroyed_after} == 0: the compensation restores the pre-hold pair (898, 0), never the pre-shipment pair (900, 0)"
            - "conservation holds after the release: 898 + 0 + 2 + 0 == 900"
            - "${final_days_after} == 13: the second release recomputed the FINAL variant from the same closed_at with no APC value on the releasing hold, so the code date did not move"
            - "${shipped_case_status} == SHIPPED and ${shipped_case_code} == 2026-08-16: the re-dating pass skips SHIPPED cases, so a case that already left the plant is never rewritten"
            - "the release is accepted because qam-2 differs from the resulting technician qat-4, and because no other hold on the run is non-terminal"
