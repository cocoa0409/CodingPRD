          A different pair in a different category order - temporal (15) versus constraint (16), both
          422, so the HTTP status cannot disambiguate them and only the error_id can. The request is
          engineered to sit on BOTH thresholds at once: it is the 4th interruption (cap is 3) and its
          left_at falls exactly 24h after the previous return, which priority 15 rejects because the
          buffer is STRICTLY greater than 24h.
