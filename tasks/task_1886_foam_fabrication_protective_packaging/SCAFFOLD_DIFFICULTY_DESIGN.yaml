            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "CURRENT", max_stock_qty: 1000, reorder_point_qty: 200, min_release_qty: 50 }, as: SalesEngineer, captures: { prog: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs/${prog}/replenish", payload: { qty: 1000 }, as: PlantManager, captures: { rpo: $.data.id } }
            - { call: "POST /api/production-orders/${rpo}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo}/complete", payload: {}, as: PlantManager }
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 850, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel: $.data.id } }
            - { call: "POST /api/release-orders/${rel}/allocate", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /api/release-orders/${rel}/ship", payload: {}, as: PlantManager, captures: { rel_status: $.data.status } }
            - { call: "GET /api/inventory-programs/${prog}", as: PlantManager, captures: { on_hand: $.data.on_hand_qty, shipped: $.data.shipped_qty } }
            - { call: "GET /api/production-orders?inventory_program_id=${prog}&fab_status=QUOTED", as: PlantManager, captures: { auto_qty: "$.data[0].qty", auto_kind: "$.data[0].order_kind", auto_fab: "$.data[0].fab_status" } }
          assert:
