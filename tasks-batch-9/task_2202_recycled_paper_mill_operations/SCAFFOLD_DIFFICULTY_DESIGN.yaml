      - name: purchase_order_confirmation_gated_by_supplier_probation_tonnage_cap
        grounds:
          - validations.priority_51
          - errors.ERR_SUPPLIER_NOT_QUALIFIED
          - calculations.supplier_qualification_posture
          - state_machines.FiberPurchaseOrder.PRICED_to_CONFIRMED
          - state_machines.FiberReceipt.SAMPLED_to_REJECTED
        distinguishing_aspect: |
          Entity pair FiberPurchaseOrder <-> Supplier: the two orders under test are identical
          PRICED orders differing by one hundredth of a ton, and what decides them is a counter
          that lives on the Supplier and was moved by dispositions on a THIRD entity
          (FiberReceipt). At PROBATION the cap is 500.00 inclusive, so 500.00 confirms and 500.01
          raises ERR_SUPPLIER_NOT_QUALIFIED — and note the supplier is not SUSPENDED, so
          priority 50 never fires and creation plus pricing both succeed for the rejected order.
        test_recipe:
          setup:
            - "FiberGrades MIX_54, OCC_11 and DLK_37 (max_contamination 2.00, no downgrade target) declared with PPI_OCC and PPI_DLK quotes for 2026-07."
            - "Supplier Northgate starts QUALIFIED and gets a CONFIRMED 150.00-ton DLK_37 order whose two trucks both weigh net 5.00 at contamination 4.00 and are both REJECTED, leaving contamination_strike_count 2 and qualification_status PROBATION."
            - "Two further OCC_11 orders are created and PRICED while the supplier is on PROBATION: PO_ok for exactly 500.00 tons and PO_over for 500.01 tons."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 3 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 150.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Northgate Recovered", freight_per_ton: 18.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "DLK_37", contracted_tons: 150.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_dlk: "$.data.id", po_dlk_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/price", payload: { expected_purchase_order_version: "${po_dlk_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/receipts", payload: { truck_reference: "TRK-P-001", sublots: [ { sublot_no: 1, gross_tons: 6.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 4.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_1: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_1}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/receipts", payload: { truck_reference: "TRK-P-002", sublots: [ { sublot_no: 1, gross_tons: 6.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 4.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_2: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_2}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 500.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_ok: "$.data.id", po_ok_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_ok}/price", payload: { expected_purchase_order_version: "${po_ok_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 500.01, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_over: "$.data.id", po_over_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_over}/price", payload: { expected_purchase_order_version: "${po_over_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_ok}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /fiber-purchase-orders/${po_over}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
          assert:
            - "Supplier.${sup_id}.contamination_strike_count == 2 AND Supplier.${sup_id}.qualification_status == PROBATION"
            - "FiberPurchaseOrder.${po_ok}.contracted_tons == 500.00 AND FiberPurchaseOrder.${po_ok}.status == CONFIRMED"
            - "response_type == error with HTTP 409 and data.error_id == \"ERR_SUPPLIER_NOT_QUALIFIED\""
            - "data.error_id != \"ERR_SUPPLIER_SUSPENDED\""
            - "FiberPurchaseOrder.${po_over}.contracted_tons == 500.01 AND FiberPurchaseOrder.${po_over}.status == PRICED"
            - "FiberPurchaseOrder.${po_over}.received_net_tons == 0.00"

      - name: land_application_manifest_gated_by_permit_posture_at_creation
        grounds:
          - validations.priority_41
          - errors.ERR_LAND_APPLICATION_BARRED
          - calculations.effluent_rolling_compliance
          - state_machines.EffluentPermit.compliance_posture
          - entities.SludgeManifest.fields.destination
          - entities.SludgeManifest.fields.total_dry_solids_tons
        distinguishing_aspect: |
          Entity pair SludgeManifest <-> EffluentPermit: the manifest's own inputs are fully
          valid — a unique manifest_number and one PENDING PULP_REJECT row of 4.500 dry tons —
          and the blocking condition lives entirely on the permit, which is why the same
          LAND_APPLICATION request that returns ERR_LAND_APPLICATION_BARRED succeeds unchanged
          once a single EffluentReading is voided and the posture falls to WATCH. This is the
          only rule-7 pair where the dependency is on an enum VALUE in the body rather than on
          the addressed entity's lifecycle.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 / OCC_11 and PaperGradeSpec TL_140 declared; a CLEANED PulpBatch with measured_reject_tons 4.500 has left exactly one PENDING PULP_REJECT RejectStream row in the ledger."
            - "EffluentPermit MILL-NPDES-01 holds readings dated 2026-07-28 / 07-29 / 07-30 at 90.00 / 110.00 / 130.00 kg BOD, so rolling_bod_kg_per_day is 110.000 and posture is EXCEEDANCE; the newest reading's id is captured."
            - "The manifest is prepared by env_prep, a different EnvironmentalOfficer from the reading logger eo_log, so the signing segregation rule is not what is being probed here."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
