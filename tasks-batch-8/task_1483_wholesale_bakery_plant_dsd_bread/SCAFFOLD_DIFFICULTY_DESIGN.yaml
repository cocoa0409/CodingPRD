            - { call: "GET /bakery/production-plans/${pl}", as: Any, captures: { shortfall: $.data.shortfall_units } }
            - { call: "GET /bakery/route-stops/${stp}", as: Any, captures: { flag: $.data.shortfall_flag } }
            - { call: "GET /bakery/store-orders/${ord}", as: Any, captures: { ostat: $.data.status } }
          assert:
            - "Batch.${bt}.status == REJECTED"
            - "ProductionPlan.${pl}.shortfall_units == 100  # hop 1"
            - "RouteStop.${stp}.shortfall_flag == true  # hop 2"
            - "StoreOrder.${ord}.status == SHORTED  # hop 3"

      - name: index_publish_cascade_schedule_product
        grounds:
          - state_machines.IngredientIndex.FORECAST_to_PUBLISHED
          - state_machines.SurchargeSchedule.PROVISIONAL_to_FINALIZED
          - entities.Product.fields.current_surcharge_cents
        distinguishing_aspect: |
          Depth-2 cascade from POST /bakery/ingredient-indices/{id}/publish
          (different trigger than the batch-reject cascade): publishing the
          last required index finalizes the SurchargeSchedule (hop 1), and the
          finalization writes Product.current_surcharge_cents = 19 (hop 2).
        test_recipe:
          setup:
            - "Plant baselines 400/600; product C 249c (flour 0.30, butter 0.10); FORECAST FLOUR 440 + BUTTER 600 for 2026-08; PROVISIONAL schedule exists"
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant Kappa", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-C", name: "Brioche 250", allergen_class: "NONE", unit_weight_g: 250, shelf_life_hours: 48, base_price_cents: 249, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 200 }, as: PlantAdmin, captures: { pc: $.data.id } }
            - { call: "POST /bakery/ingredient-indices", payload: { plant_id: "${p}", ingredient: "FLOUR", period: "2026-08", forecast_value: 440 }, as: PricingAnalyst, captures: { ifl: $.data.id } }
            - { call: "POST /bakery/ingredient-indices", payload: { plant_id: "${p}", ingredient: "BUTTER", period: "2026-08", forecast_value: 600 }, as: PricingAnalyst, captures: { ibt: $.data.id } }
            - { call: "POST /bakery/surcharge-schedules", payload: { product_id: "${pc}", period: "2026-08" }, as: PricingAnalyst, captures: { sch: $.data.id } }
            - { call: "POST /bakery/ingredient-indices/${ifl}/publish", payload: { published_value: 500 }, as: PricingAnalyst }
          trigger:
            - { call: "POST /bakery/ingredient-indices/${ibt}/publish", payload: { published_value: 606 }, as: PricingAnalyst }
            - { call: "GET /bakery/surcharge-schedules/${sch}", as: Any, captures: { sstat: $.data.status, sfin: $.data.final_surcharge_cents } }
            - { call: "GET /bakery/products/${pc}", as: Any, captures: { psur: $.data.current_surcharge_cents } }
          assert:
            - "SurchargeSchedule.${sch}.status == FINALIZED  # hop 1"
            - "SurchargeSchedule.${sch}.final_surcharge_cents == 19"
            - "Product.${pc}.current_surcharge_cents == 19  # hop 2"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_violation_beats_shrink_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Route.COMPLETED_to_SETTLED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SHRINK_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: settling a DISPATCHED route
          whose shrink would be 100% violates both priority 5 (state) and
          priority 9 (fiscal); the state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Baseline chain: order 100 LOCKED, batch RELEASED, route DISPATCHED with one PENDING stop (nothing delivered -> shrink would be 100%)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Lambda", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
          trigger:
            - call: "POST /bakery/routes/${rt}/settle"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  # priority 5 state beats priority 9 fiscal even though shrink would be 100%"
            - "Route.${rt}.status == DISPATCHED  # unchanged"

      - name: allergen_violation_beats_schedule_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ALLERGEN_SEGREGATION_VIOLATION]
          - errors[ERR_LINE_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair
          than state-vs-fiscal): scheduling a NONE-allergen batch on a
          SESAME-DIRTY line in a window that also overlaps an existing batch
          must return ERR_ALLERGEN_SEGREGATION_VIOLATION, not the overlap error.
        test_recipe:
          setup:
            - "Plant, products A (NONE) and B (SESAME), line L1, plan LOCKED+RELEASED"
            - "Batch A SCHEDULED 07:00-09:00; batch B (SESAME) SCHEDULED 09:00-10:00 and run to COOLING -> line DIRTY with SESAME"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Mu", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-B", name: "Sesame 300", allergen_class: "SESAME", unit_weight_g: 300, shelf_life_hours: 48, base_price_cents: 299, flour_share_pct: 0.25, butter_share_pct: 0.05, batch_capacity_units: 400 }, as: PlantAdmin, captures: { pb: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bta: $.data.id } }
            - { call: "GET /bakery/production-plans/${pl}", as: Any, captures: { plv2: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pb}", qty_units: 100, scheduled_start_at: "2026-08-09T09:00:00Z", scheduled_end_at: "2026-08-09T10:00:00Z", expected_production_plan_version: "${plv2}" }, as: Planner, captures: { btb: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${btb}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btb}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T10:10:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${btb}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${btb}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "GET /bakery/production-plans/${pl}", as: Any, captures: { plv3: $.data.version } }
          trigger:
            - call: "POST /bakery/batches"
              payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 50, scheduled_start_at: "2026-08-09T08:30:00Z", scheduled_end_at: "2026-08-09T09:30:00Z", expected_production_plan_version: "${plv3}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALLERGEN_SEGREGATION_VIOLATION  # safety (p6) beats temporal overlap (p7)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: order_cutoff_exact_equality
        grounds:
          - calculations.order_cutoff_window
          - state_machines.StoreOrder.PLACED_to_CONFIRMED
          - errors[ERR_ORDER_CUTOFF_PASSED]
        distinguishing_aspect: |
          Metric: hours-remaining-to-cutoff on POST .../confirm. Clock exactly
          at delivery_instant - lead_time (2026-08-08T08:00:00Z) is ALLOWED
          (<= semantics); one second later is rejected.
        test_recipe:
          setup:
            - "Plant, product A, store lead_time_hours 48; two PLACED orders for delivery 2026-08-10 (delivery instant 2026-08-10T08:00:00Z, cutoff 2026-08-08T08:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T08:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Nu", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 10 } ] }, as: Planner, captures: { o1: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 20 } ] }, as: Planner, captures: { o2: $.data.id } }
          trigger:
            - call: "POST /bakery/store-orders/${o1}/confirm"
              payload: {}
              as: Planner
              captures: { st1: $.data.status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T08:00:01Z" }, as: PlantAdmin }
            - call: "POST /bakery/store-orders/${o2}/confirm"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "st1 == CONFIRMED  # exactly at cutoff: allowed (clock <= cutoff)"
            - "err == ERR_ORDER_CUTOFF_PASSED  # one second past: rejected"
            - "StoreOrder.${o2}.status == PLACED"

      - name: stale_age_tier_24h_boundary
        grounds:
          - calculations.stale_credit
          - errors[ERR_RETURN_WINDOW_CLOSED]
        distinguishing_aspect: |
          Metric: bread age in hours on POST /bakery/stale-returns (different
          metric and endpoint than the cutoff instance). Age exactly 24h ->
          rate 1.00 (credit 398); age 25h -> rate 0.50 (credit 199).
        test_recipe:
          setup:
            - "Baseline distribution chain; batch A baked 2026-08-09T09:00:00Z; stop DELIVERED; clock 2026-08-10T09:00:00Z (age exactly 24h)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Xi", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/route-stops/${stp}/deliver", payload: { delivered_units: 100, on_shelf_units_observed: 0 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - call: "POST /bakery/stale-returns"
              payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 2 } ] }
              as: Driver
              as_user_id: "${drv}"
              captures: { r1: $.data.id, prov1: $.data.provisional_credit_cents }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: PlantAdmin }
            - call: "POST /bakery/stale-returns"
              payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 2 } ] }
              as: Driver
              as_user_id: "${drv}"
              captures: { r2: $.data.id, prov2: $.data.provisional_credit_cents }
          assert:
            - "StaleReturn.${r1}.provisional_credit_cents == 398  # age exactly 24h -> rate 1.00: 2*199"
            - "StaleReturn.${r2}.provisional_credit_cents == 199  # age 25h -> rate 0.50: round_half_up(2*199*0.5)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_schedule_gated_by_line_cleanliness
        grounds:
          - state_machines.Line
          - errors[ERR_ALLERGEN_SEGREGATION_VIOLATION]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair Batch -> Line: on a DIRTY line with SESAME residue, another
          SESAME batch is schedulable but a NONE batch is rejected — the
          valid transition set of Batch creation depends on Line state.
        test_recipe:
          setup:
            - "Plant, products A (NONE) and B (SESAME), line L1 DIRTY with SESAME (batch B completed); plan RELEASED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Omicron", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
