              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/park-build"
              payload: { features: [{ feature_type: "JUMP", size_class: "L" }, { feature_type: "JUMP", size_class: "M" }, { feature_type: "RAIL", size_class: "M" }, { feature_type: "RAIL", size_class: "S" }, { feature_type: "JIB", size_class: "S" }, { feature_type: "HALFPIPE", size_class: "S" }] }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/park-build"
              payload: { features: [{ feature_type: "JUMP", size_class: "L" }, { feature_type: "JUMP", size_class: "M" }, { feature_type: "RAIL", size_class: "M" }, { feature_type: "RAIL", size_class: "S" }, { feature_type: "JIB", size_class: "S" }, { feature_type: "HALFPIPE", size_class: "S" }, { feature_type: "HALFPIPE", size_class: "L" }] }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/park-build"
              payload: { features: [{ feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }, { feature_type: "HALFPIPE", size_class: "L" }] }
              as: GroomingLead
          assert:
