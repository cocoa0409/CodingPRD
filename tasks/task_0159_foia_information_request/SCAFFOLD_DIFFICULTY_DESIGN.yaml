scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc
  # Two calculations on different entity domains where two valid approaches
  # produce different results.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_estimate_vs_final_pages_excluded
        grounds:
          - calculations.calc_fee_estimate
          - calculations.calc_fee_final
          - entities.FeeAssessment.fields.estimate_total_cents
          - entities.FeeAssessment.fields.final_total_cents
          - entities.ResponsiveRecord.fields.disposition
        distinguishing_aspect: |
          Operates on FeeAssessment cost accounting: estimate uses estimated_pages straight (commercial 4h
          search + 2h review + 150 pages -> 31500 cents); final excludes WITHHELD_FULL pages (100 RELEASED_FULL
          + 30 RELEASED_REDACTED + 20 WITHHELD_FULL -> 31300 cents). Same inputs, different outputs, on the
          same entity (FeeAssessment) — establishes a numeric divergence between provisional and final cost.
        test_recipe:
          setup:
            - "POST /foia/requesters -> Requester R (requester_tier=COMMERCIAL)"
            - "POST /foia/requests -> Request Q (requester_id=R.id, fee_waiver_requested=false)"
            - "POST /foia/requests/{Q.id}/acknowledge"
            - "POST /foia/fee-assessments -> F (estimated_pages=150, estimated_search_hours=4, estimated_review_hours=2)"
            - "POST /foia/fee-assessments/{F.id}/estimate"
            - "POST /foia/fee-assessments/{F.id}/accept (as Requester R)"
            - "POST /foia/requests/{Q.id}/start-search"
            - "Create 3 ResponsiveRecords totaling 150 pages: rec_a page_count=100, rec_b page_count=30, rec_c page_count=20"
            - "PATCH disposition: rec_a=RELEASED_FULL, rec_b=RELEASED_REDACTED, rec_c=WITHHELD_FULL"
            - "POST /foia/exemption-claims for rec_c with exemption_code=B5"
          trigger:
            - "POST /foia/requests/{Q.id}/close-search"
          assert:
            - "FeeAssessment.estimate_total_cents == 31500"
            - "FeeAssessment.final_total_cents == 31300"
            - "FeeAssessment.estimate_total_cents != FeeAssessment.final_total_cents"

      - name: tier_dependent_estimate_commercial_vs_educational
        grounds:
          - calculations.calc_fee_estimate
          - entities.Requester.fields.requester_tier
          - entities.FeeAssessment.fields.tier_at_assessment
          - entities.FeeAssessment.fields.estimate_total_cents
        distinguishing_aspect: |
          Operates on the Requester domain (tier classification) rather than ResponsiveRecord page accounting:
          identical (search=4h, review=2h, pages=150) inputs yield 31500 cents for COMMERCIAL but 0 cents for
          EDUCATIONAL_NONCOMMERCIAL (150 pages - 100 free = 50 page-cents = 500 < FREE_THRESHOLD 1400).
          This is a different entity domain from the estimate-vs-final dual variant: the divergence here is
          Requester-driven, not ResponsiveRecord-disposition-driven.
        test_recipe:
          setup:
            - "POST /foia/requesters -> R_comm (tier=COMMERCIAL)"
            - "POST /foia/requesters -> R_edu (tier=EDUCATIONAL_NONCOMMERCIAL, tier_justification='University study')"
            - "POST /foia/requests -> Q_comm (requester_id=R_comm.id)"
            - "POST /foia/requests -> Q_edu (requester_id=R_edu.id)"
            - "POST /foia/requests/{Q_comm.id}/acknowledge ; POST /foia/requests/{Q_edu.id}/acknowledge"
            - "POST /foia/fee-assessments F_comm (request_id=Q_comm.id, est_pages=150, est_search=4, est_review=2)"
            - "POST /foia/fee-assessments F_edu  (request_id=Q_edu.id,  est_pages=150, est_search=4, est_review=2)"
          trigger:
            - "POST /foia/fee-assessments/{F_comm.id}/estimate"
            - "POST /foia/fee-assessments/{F_edu.id}/estimate"
          assert:
            - "F_comm.estimate_total_cents == 31500"
            - "F_edu.estimate_total_cents == 0"
            - "F_comm.tier_at_assessment == 'COMMERCIAL'"
            - "F_edu.tier_at_assessment == 'EDUCATIONAL_NONCOMMERCIAL'"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # Two combinatorial-complexity formulas from different modes among
  # (a) >=3 inputs with non-linear interaction, (b) order-sensitive rounding,
  # (c) pinned evaluation order in a circular-looking dependency.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tier_tiered_pricing_three_inputs   # mode (a)
        grounds:
          - calculations.calc_fee_estimate
          - calculations.calc_fee_final
          - entities.FeeAssessment.fields.estimated_search_hours
          - entities.FeeAssessment.fields.estimated_review_hours
          - entities.FeeAssessment.fields.estimated_pages
        distinguishing_aspect: |
          Mode (a): three inputs (search_hours, review_hours, pages) interact non-linearly through tier-specific
          chargeable-quantity selection followed by tier-specific summation. PUBLIC_INTEREST with
          search=4h, review=2h, pages=150 -> chargeable_search = max(0, 4-2) = 2, chargeable_pages =
          max(0, 150-100) = 50, review ignored entirely -> 2*4500 + 50*10 = 9500 cents. Changing any one of the
          three inputs alters which tier subterms dominate.
        test_recipe:
          setup:
            - "POST /foia/requesters -> R_pub (tier=PUBLIC_INTEREST, tier_justification='Newsroom')"
            - "POST /foia/requests -> Q (requester_id=R_pub.id)"
            - "POST /foia/requests/{Q.id}/acknowledge"
            - "POST /foia/fee-assessments F (request_id=Q.id, est_pages=150, est_search=4, est_review=2)"
          trigger:
            - "POST /foia/fee-assessments/{F.id}/estimate"
          assert:
            - "F.estimate_total_cents == 9500"
            - "F.tier_at_assessment == 'PUBLIC_INTEREST'"

      - name: deadline_then_threshold_evaluation_order   # mode (c)
        grounds:
          - calculations.calc_fee_estimate
          - calculations.calc_fee_final
          - calculations.calc_response_deadline
        distinguishing_aspect: |
          Mode (c): pinned evaluation order in a circular-looking dependency. The fee pipeline runs
          (1) compute tier-specific chargeable quantities -> (2) multiply by rates -> (3) sum to subtotal_cents
          -> (4) apply free-threshold collapse to zero; reversing steps (3) and (4) would treat per-component
          totals as separately thresholdable and collapse PUBLIC_INTEREST(2h,_,250p)=1500 to 0 (since each
          component alone is < 1400). The scaffold pins the order so 1500 cents survives, whereas reversed
          order would yield 0.
        test_recipe:
          setup:
            - "POST /foia/requesters -> R_pub (tier=PUBLIC_INTEREST, tier_justification='research')"
            - "POST /foia/requests -> Q (requester_id=R_pub.id)"
            - "POST /foia/requests/{Q.id}/acknowledge"
            - "POST /foia/fee-assessments F (request_id=Q.id, est_pages=250, est_search=2, est_review=0)"
          trigger:
            - "POST /foia/fee-assessments/{F.id}/estimate"
          assert:
            - "F.estimate_total_cents == 1500"
            # subtotal = 0*4500 + 150*10 = 1500 ; 1500 >= 1400 -> survives the threshold.
            # If evaluation order were reversed (threshold-then-sum), 0 search + 1500 pages individually
            # both fail the threshold and the answer would be 0 — explicit divergence proves the pin.

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # Two state machines on different entities with non-linear shape.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: request_remand_cycle
        grounds:
          - state_machines.Request.DENIED_to_REOPENED_BY_APPEAL
          - state_machines.Request.REOPENED_BY_APPEAL_to_SEARCH
          - state_machines.Request.SEARCH_to_DETERMINATION_PENDING
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
        distinguishing_aspect: |
          Request entity exhibits a cycle: DENIED -> REOPENED_BY_APPEAL -> SEARCH -> DETERMINATION_PENDING
          -> (potentially DENIED again). A REMANDED appeal returns a Request from a previously-terminal
          determination state back into SEARCH; a second determination can then occur. This is a true cycle
          on the Request entity (not a linear pipeline).
        test_recipe:
          setup:
            - "Drive a Request Q to DENIED with one record disposition=WITHHELD_FULL and an ExemptionClaim"
            - "POST /foia/appeals -> A (request_id=Q.id, appellant_role=REQUESTER, grounds='disagree')"
            - "POST /foia/appeals/{A.id}/accept-for-review  (as AppealAuthority distinct from Officer)"
          trigger:
            - "POST /foia/appeals/{A.id}/decide  (decision=REMANDED)"
            - "POST /foia/requests/{Q.id}/resume-search"
          assert:
            - "After /decide REMANDED: Request.status == 'REOPENED_BY_APPEAL'"
            - "After /resume-search: Request.status == 'SEARCH'"
            - "AuditEntry exists with event_code='REMANDED' and subject_id == Q.id"
            - "Cycle proven: Request visited DENIED -> REOPENED_BY_APPEAL -> SEARCH"

      - name: third_party_notice_branching_with_override
        grounds:
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_OBJECTED
          - state_machines.ThirdPartyNotice.OBJECTED_to_OVERRIDDEN
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_EXPIRED
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_CONSENTED
        distinguishing_aspect: |
          ThirdPartyNotice exhibits fork-join branching from PENDING_RESPONSE into FOUR divergent paths
          (CONSENTED, OBJECTED, EXPIRED, OVERRIDDEN), AND a follow-on edge OBJECTED -> OVERRIDDEN that
          reconverges objecting-then-overridden into the same downstream effect as CONSENTED on the linked
          ResponsiveRecord. Different entity than Request — this satisfies the "different entities" clause.
        test_recipe:
          setup:
            - "Drive a Request Q into SEARCH with rec_x.contains_third_party_info=true, third_party_id='tp_001'"
            - "POST /foia/third-party-notices -> N (request_id=Q.id, record_id=rec_x.id)"
          trigger:
            - "POST /foia/third-party-notices/{N.id}/object (as ThirdParty tp_001, objection_grounds='trade secret')"
            - "POST /foia/appeals -> A (request_id=Q.id, appellant_role=THIRD_PARTY, grounds='...')"
            - "POST /foia/appeals/{A.id}/accept-for-review (AppealAuthority distinct from Officer)"
            - "POST /foia/appeals/{A.id}/decide (decision=UPHELD)  # against the third party"
            - "POST /foia/third-party-notices/{N.id}/override (as AppealAuthority)"
          assert:
            - "Notice transitioned PENDING_RESPONSE -> OBJECTED -> OVERRIDDEN (non-linear branching with rejoin)"
            - "Final ThirdPartyNotice.status == 'OVERRIDDEN'"

  # =====================================================================
  # Rule 4 — transitive_cascade
  # Two transitive cascades originating from different triggers.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_search_cascade_depth_3
        grounds:
          - state_machines.Request.SEARCH_to_DETERMINATION_PENDING
          - state_machines.FeeAssessment.ACCEPTED_to_FINALIZED
          - calculations.calc_fee_final
          - entities.FeeAssessment.fields.final_total_cents
          - entities.FeeAssessment.fields.status
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /foia/requests/{id}/close-search:
          (link 1) Request transitions SEARCH -> DETERMINATION_PENDING; that mutation itself causes
          (link 2) FeeAssessment to transition ACCEPTED -> FINALIZED; the FINALIZED transition itself causes
          (link 3) FeeAssessment.final_total_cents to be written via calc_fee_final, snapshotting
          ResponsiveRecord.page_count aggregation excluding WITHHELD_FULL pages. Each link is caused by the
          previous link, not by the original API call.
        test_recipe:
          setup:
            - "COMMERCIAL Requester R; Request Q acknowledged with FeeAssessment F.status=ACCEPTED, estimate=31500"
            - "Q started SEARCH; created records of page_count 100 (RELEASED_FULL), 30 (RELEASED_REDACTED), 20 (WITHHELD_FULL with ExemptionClaim B5)"
          trigger:
            - "POST /foia/requests/{Q.id}/close-search"
          assert:
            - "Request.status == 'DETERMINATION_PENDING'         # link 1"
            - "FeeAssessment.status == 'FINALIZED'                # link 2"
            - "FeeAssessment.final_total_cents == 31300           # link 3 (130 chargeable pages -> 18000+12000+1300)"

      - name: remand_cascade_depth_2
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.Request.GLOMAR_ISSUED_to_REOPENED_BY_APPEAL
          - entities.Request.fields.glomar_invoked
          - entities.Request.fields.glomar_exemption_basis
        distinguishing_aspect: |
          Depth-2 cascade originating from a different trigger (POST /foia/appeals/{id}/decide with
          decision=REMANDED on a Glomar appeal):
          (link 1) Appeal transitions UNDER_REVIEW -> REMANDED; that mutation itself causes
          (link 2) the underlying Request to transition GLOMAR_ISSUED -> REOPENED_BY_APPEAL AND clears
          glomar_invoked back to false AND empties glomar_exemption_basis. Distinct cascade from instance #1
          (different triggering transition, different conserved fields touched).
        test_recipe:
          setup:
            - "Drive a Request Q to GLOMAR_ISSUED via /issue-glomar with basis=['B1']"
            - "POST /foia/appeals -> A (request_id=Q.id, appellant_role=REQUESTER, grounds='Glomar invalid')"
            - "POST /foia/appeals/{A.id}/accept-for-review (AppealAuthority distinct from Officer)"
          trigger:
            - "POST /foia/appeals/{A.id}/decide (decision=REMANDED)"
          assert:
            - "Appeal.status == 'REMANDED'                                  # link 1"
            - "Request.status == 'REOPENED_BY_APPEAL'                       # link 2"
            - "Request.glomar_invoked == false                              # link 2 (field clearing)"
            - "Request.glomar_exemption_basis == []"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict
  # Two priority conflicts across different error-category pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_glomar_basis
        grounds:
          - validations[priority=6]   # ERR_INVALID_STATE
          - validations[priority=8]   # ERR_INVALID_GLOMAR_BASIS
        distinguishing_aspect: |
          Error-category pair: state vs business_safety. POST /foia/requests/{id}/issue-glomar on a Request
          already DETERMINED (status RELEASED) WITH an invalid glomar_exemption_basis=['B4'] simultaneously
          fails (a) state precondition (priority 6 -> ERR_INVALID_STATE) and (b) glomar basis rule (priority 8
          -> ERR_INVALID_GLOMAR_BASIS). The scaffold's priority ordering forces ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Drive a Request Q all the way to RELEASED"
          trigger:
            - "POST /foia/requests/{Q.id}/issue-glomar with body.glomar_exemption_basis=['B4']"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "ERR_INVALID_GLOMAR_BASIS NOT returned (priority 6 wins over priority 8)"

      - name: business_fiscal_vs_business_constraint_tolling
        grounds:
          - validations[priority=10]  # ERR_TOLLING_LIMIT_EXCEEDED (business_constraint)
          - validations[priority=16]  # ERR_FEE_NOT_RESOLVED (business_fiscal)
        distinguishing_aspect: |
          Error-category pair: business_constraint vs business_fiscal — distinct from the state/business_safety
          pair above. POST /foia/requests/{Q.id}/start-tolling on an ACKNOWLEDGED Request with
          tolling_days_consumed already at MAX_TOLL_DAYS triggers ERR_TOLLING_LIMIT_EXCEEDED, even when the
          same Request has an unaccepted estimate > FREE_THRESHOLD (which would block /start-search). The
          scaffold pins priority 10 ahead of 16, so the tolling-limit error wins under simultaneous failure
          when /start-tolling is the operation under test.
        test_recipe:
          setup:
            - "POST /foia/requesters R (COMMERCIAL)"
            - "POST /foia/requests Q (requester_id=R.id) ; acknowledge"
            - "POST /foia/fee-assessments F (est_pages=150, est_search=4, est_review=2) ; /estimate  (estimate=31500 cents)"
            - "Drive Q.tolling_days_consumed to MAX_TOLL_DAYS=30 via repeated /start-tolling + /resume-clock cycles using /_clock/advance"
          trigger:
            - "POST /foia/requests/{Q.id}/start-tolling (would push to 31 days)"
          assert:
            - "HTTP 422"
            - "response.data.error_id == 'ERR_TOLLING_LIMIT_EXCEEDED'"
            - "ERR_FEE_NOT_RESOLVED NOT returned (this endpoint is /start-tolling, not /start-search)"
            - "tolling_days_consumed unchanged at 30"

  # =====================================================================
  # Rule 6 — boundary_precision_check
  # Two boundaries on different metrics through distinct endpoints.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fee_threshold_boundary_239_vs_240_pages
        grounds:
          - calculations.calc_fee_estimate
          - calculations.calc_fee_estimate.constants.FREE_THRESHOLD_CENTS
          - calculations.calc_fee_estimate.constants.FREE_PAGES
        distinguishing_aspect: |
          Numeric threshold metric on POST /foia/fee-assessments/{id}/estimate. EDUCATIONAL tier with 239
          pages: subtotal = 139 * 10 = 1390 < FREE_THRESHOLD 1400 -> 0. With 240 pages: subtotal = 140 * 10 =
          1400 >= FREE_THRESHOLD 1400 -> 1400. The boundary is `>=` (1400 survives). Same endpoint, distinct
          input values, asserts the exact > vs >= behavior.
        test_recipe:
          setup:
            - "Two EDUCATIONAL_NONCOMMERCIAL Requesters R_a and R_b (tier_justification supplied)"
            - "Requests Q_a and Q_b, both acknowledged"
            - "FeeAssessment F_a (est_pages=239), F_b (est_pages=240); both est_search=0, est_review=0"
          trigger:
            - "POST /foia/fee-assessments/{F_a.id}/estimate"
            - "POST /foia/fee-assessments/{F_b.id}/estimate"
          assert:
            - "F_a.estimate_total_cents == 0    # 1390 cents < 1400 -> collapsed to 0"
            - "F_b.estimate_total_cents == 1400 # exactly 1400 -> survives the >= boundary"

      - name: empty_responsive_record_set_on_determine
        grounds:
          - validations[priority=18]   # ERR_NO_RESPONSIVE_RECORDS
          - state_machines.Request.DETERMINATION_PENDING_to_RELEASED
          - entities.ResponsiveRecord
        distinguishing_aspect: |
          Empty-set boundary on a different endpoint (POST /foia/requests/{id}/determine) AND a different
          metric (collection size, not numeric threshold). A non-Glomar Request with zero ResponsiveRecords
          must fail /determine with ERR_NO_RESPONSIVE_RECORDS, even though every other precondition is met;
          adding exactly one record allows /determine to proceed. This sits on a different endpoint and metric
          from the page-threshold boundary above.
        test_recipe:
          setup:
            - "Drive Request Q to DETERMINATION_PENDING-eligible state (acknowledged, fee resolved, search closed)"
            - "Q has glomar_invoked=false AND zero ResponsiveRecords"
          trigger:
            - "POST /foia/requests/{Q.id}/determine"
          assert:
            - "HTTP 422; error_id == 'ERR_NO_RESPONSIVE_RECORDS'"
            - "Request.status remains 'DETERMINATION_PENDING' (no transition)"
            - "After creating one ResponsiveRecord with disposition=RELEASED_FULL and retrying /determine, Request.status == 'RELEASED'"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency
  # Two cross-entity state dependencies on different entity pairs.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: close_search_requires_all_third_party_notices_resolved
        grounds:
          - state_machines.Request.SEARCH_to_DETERMINATION_PENDING
          - state_machines.ThirdPartyNotice
          - validations[priority=9]
          - entities.ResponsiveRecord.fields.contains_third_party_info
        distinguishing_aspect: |
          Entity pair: Request <-> ThirdPartyNotice. Request.SEARCH -> DETERMINATION_PENDING is gated by the
          aggregate state of all ThirdPartyNotices linked to its records: every notice whose record has
          contains_third_party_info=true must be in {CONSENTED, OBJECTED, EXPIRED, OVERRIDDEN}. A single
          PENDING_RESPONSE notice forces the close-search call to fail with ERR_MISSING_THIRD_PARTY_NOTICE.
        test_recipe:
          setup:
            - "Drive Request Q to SEARCH with one record rec_x.contains_third_party_info=true, third_party_id='tp_001'"
            - "POST /foia/third-party-notices N (record_id=rec_x.id); notice stays PENDING_RESPONSE"
          trigger:
            - "POST /foia/requests/{Q.id}/close-search"
          assert:
            - "HTTP 422; error_id == 'ERR_MISSING_THIRD_PARTY_NOTICE'"
            - "Request.status remains 'SEARCH'"
            - "After /_clock/advance past N.response_deadline -> N.status becomes 'EXPIRED' and /close-search succeeds"

      - name: appeal_accept_requires_segregation_from_request_officer
        grounds:
          - state_machines.Appeal.SUBMITTED_to_UNDER_REVIEW
          - validations[priority=7]
          - entities.AuditEntry.fields.actor_id
          - entities.Appeal.fields.deciding_officer_id
        distinguishing_aspect: |
          Entity pair: Appeal <-> AuditEntry (the audit entry attributing the original determination on the
          underlying Request) — a different pair from Request<->ThirdPartyNotice above. Appeal cannot
          transition SUBMITTED -> UNDER_REVIEW if X-User-ID of the accepting AppealAuthority equals the
          actor_id of the DETERMINATION_ISSUED AuditEntry on Appeal.request_id (segregation-of-duties).
        test_recipe:
          setup:
            - "Drive Request Q to DENIED — determination issued by AppealAuthority A1 acting as Officer (capture A1's id in audit)"
            - "POST /foia/appeals -> Apl (request_id=Q.id, appellant_role=REQUESTER)"
          trigger:
            - "POST /foia/appeals/{Apl.id}/accept-for-review  with X-User-ID == A1's id, X-User-Role=AppealAuthority"
          assert:
            - "HTTP 403; error_id == 'ERR_SEGREGATION_OF_DUTIES'"
            - "Appeal.status remains 'SUBMITTED'"
            - "Retry with a distinct AppealAuthority X-User-ID succeeds; Appeal.status == 'UNDER_REVIEW'"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # Two overlap-detection rules differing in interval semantics on
  # different resource entities.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tolling_window_aggregate_cap
        grounds:
          - calculations.calc_response_deadline
          - validations[priority=10]
          - entities.Request.fields.tolling_days_consumed
          - calculations.calc_response_deadline.constants.MAX_TOLL_DAYS
        distinguishing_aspect: |
          Interval semantics: **aggregate-capacity** across non-adjacent tolling intervals. Multiple
          /start-tolling + /resume-clock pairs occupy non-overlapping business-day intervals on the Request
          resource; their sum is capped at MAX_TOLL_DAYS=30. A new /start-tolling is rejected when the
          cumulative occupied days would exceed the cap — even though the new interval would not overlap any
          prior interval in geometric terms. This is aggregate-capacity overlap rejection, distinct from
          point-overlap.
        test_recipe:
          setup:
            - "Drive Q to ACKNOWLEDGED; alternating /start-tolling + /_clock/advance + /resume-clock until tolling_days_consumed == 30"
          trigger:
            - "POST /foia/requests/{Q.id}/start-tolling   # would push cumulative to 31"
          assert:
            - "HTTP 422; error_id == 'ERR_TOLLING_LIMIT_EXCEEDED'"
            - "Request.tolling_days_consumed remains 30"

      - name: third_party_response_window_half_open_deadline
        grounds:
          - calculations.calc_third_party_deadline
          - validations[priority=11]
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_EXPIRED
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_OBJECTED
        distinguishing_aspect: |
          Interval semantics: **half-open instant boundary** on the ThirdPartyNotice resource (different
          entity from Request). The window is "now() < response_deadline" for /consent and /object (strict
          inequality on the inclusive end), and "now() >= response_deadline" for the system EXPIRED sweep.
          Different geometry from aggregate-capacity overlap above: a single instant decides which side of
          the open/closed boundary the notice falls on, with one strict-less-than admit rule and one
          greater-or-equal reject rule.
        test_recipe:
          setup:
            - "Drive Q to SEARCH with record rec_x.contains_third_party_info=true and ThirdPartyNotice N (response_deadline = T_d)"
          trigger:
            - "POST /foia/_clock/advance to T_d - 1 second; POST /foia/third-party-notices/{N.id}/object (with grounds)"
            - "Reset scenario, drive a second notice N2 with deadline T_d2; POST /foia/_clock/advance to T_d2 exactly; POST /object"
          assert:
            - "First /object succeeds (now() < deadline): N.status == 'OBJECTED'"
            - "Second /object at exact deadline: HTTP 422; error_id == 'ERR_THIRD_PARTY_DEADLINE_PASSED'"
            - "After sweep runs at T_d2, N2.status == 'EXPIRED' (>= boundary)"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # Two invariants on different conserved quantities.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: glomar_then_remand_preserves_fee_balance
        grounds:
          - state_machines.Request.DETERMINATION_PENDING_to_GLOMAR_ISSUED
          - state_machines.Request.GLOMAR_ISSUED_to_REOPENED_BY_APPEAL
          - calculations.calc_fee_estimate
          - calculations.calc_fee_final
          - entities.FeeAssessment.fields.estimate_total_cents
          - entities.FeeAssessment.fields.final_total_cents
        distinguishing_aspect: |
          Conserved quantity: **FeeAssessment.estimate_total_cents** (cost-account snapshot at the
          DETERMINATION_PENDING boundary). Issuing Glomar (forward action) followed by a REMANDED appeal
          (compensating action) MUST leave FeeAssessment.estimate_total_cents unchanged — pinned as:
          `FeeAssessment.estimate_total_cents_after == FeeAssessment.estimate_total_cents_before`. A
          divergent implementation that recomputes the estimate on REMAND would violate this invariant.
        test_recipe:
          setup:
            - "Drive Request Q to DETERMINATION_PENDING with FeeAssessment.estimate_total_cents=31500, then /issue-glomar (basis=['B1'])"
            - "POST /foia/appeals -> A (request_id=Q.id, appellant_role=REQUESTER); accept-for-review (distinct AppealAuthority)"
            - "Record estimate_before := FeeAssessment.estimate_total_cents == 31500"
          trigger:
            - "POST /foia/appeals/{A.id}/decide (decision=REMANDED)"
          assert:
            - "Request.status == 'REOPENED_BY_APPEAL'"
            - "FeeAssessment.estimate_total_cents == estimate_before == 31500   (invariant preserved)"
            - "FeeAssessment.status NOT in {WAIVED} (remand does not waive fees)"

      - name: third_party_object_then_override_preserves_record_count
        grounds:
          - state_machines.ThirdPartyNotice.PENDING_RESPONSE_to_OBJECTED
          - state_machines.ThirdPartyNotice.OBJECTED_to_OVERRIDDEN
          - entities.ResponsiveRecord
          - entities.AuditEntry
        distinguishing_aspect: |
          Different conserved quantity from the fee invariant above:
          **count(ResponsiveRecord WHERE request_id == Q.id) is conserved across an OBJECT-then-OVERRIDE
          cycle**. The forward action (POST /object) and its compensating override (POST /override) MUST
          NOT delete, create, or merge ResponsiveRecords — only AuditEntries grow. Pinned as:
          `len(records_after) == len(records_before)`. This is a record-count conservation, structurally
          different from the cents-conservation invariant.
        test_recipe:
          setup:
            - "Drive Request Q to SEARCH with exactly 2 ResponsiveRecords (rec_x with third_party_info, rec_y plain)"
            - "POST /foia/third-party-notices N (record_id=rec_x.id); record records_before := 2"
            - "POST /foia/third-party-notices/{N.id}/object (grounds='trade secret')"
            - "POST /foia/appeals -> A (appellant_role=THIRD_PARTY); accept-for-review; decide UPHELD against third party"
          trigger:
            - "POST /foia/third-party-notices/{N.id}/override (as AppealAuthority)"
          assert:
            - "GET /foia/responsive-records list filtered by request_id == Q.id has total_count == 2 (conserved)"
            - "ThirdPartyNotice.status == 'OVERRIDDEN'"
            - "AuditEntry count strictly increased (events emitted) but ResponsiveRecord count unchanged"
