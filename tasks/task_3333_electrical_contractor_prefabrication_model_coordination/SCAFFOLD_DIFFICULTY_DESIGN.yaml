scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: revision_memo_ceiling_versus_negotiated_change_order
        grounds:
          - calculations.revision_cost_impact
          - entities.Revision.fields.impact_qualified_hours
          - entities.Revision.fields.direct_shop_cost_cents
          - entities.Revision.fields.negotiated_rate_per_hour_cents
        distinguishing_aspect: |
          On the Revision domain the two variants produce different cents for identical inputs because variant (a) is
          capped by the memo headroom while variant (b) is not: with engineering_hours 30.00, direct_shop_cost_cents
          200000 and negotiated_rate_per_hour_cents 7800 x 1.18, rework_value_cents is 200000 but
          negotiated_value_cents is 276120.
        test_recipe:
          setup:
            - "one project in jurisdiction J1 with the default FIRST_ACCEPTED credit policy"
            - "a coordinated model version MV-A holding one takeoff line of quantity 100 for assembly A-RACK, and a successor model version MV-B as the revision target"
            - "one Revision in DRAFT carrying impact_qualified_hours 40, revision_quantity 3, direct_shop_cost_cents 200000, kludge_rate_per_hour_cents 8500, negotiated_rate_per_hour_cents 7800 and submitted_markup_pct 0.18"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-A", project_name: "Deck A", jurisdiction_key: "J1", planned_value_cents: 500000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 4, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 400, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_a_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-alpha", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mva_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-alpha", revision_letter: "B", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mvb_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mva_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 100, prefab_share_pct: 0.6 }
              as: ModelCoordinator
              captures: { hash_1: $.data.takeoff_hash }
            - call: "POST /model-versions/${mva_id}/coordinate"
              payload: {}
              as: ModelCoordinator
              captures: { mva_coord_version: $.data.version }
            - call: "POST /revisions"
              payload: { project_id: "${proj_a_id}", model_version_id: "${mva_id}", revised_version_id: "${mvb_id}", revision_kind: "DESIGN_CHANGE", impact_keys: ["${hash_1}"], maintenance_hours: 4, buffer_before_hours: 2, momentum_before_hours: 1, base_service_hours: 120, paid_service_hours: 0, billed_service_hours: 0, percent_complete_mode: "FLOW", label_percent_complete: 40, label_codes: ["FAB_CONTENT"], fabricated_content_codes: ["FAB_CONTENT"], shop_parts_value_cents: 250000, shop_parts_quantity: 5, revision_quantity: 3, impact_qualified_hours: 40, effort_hours: 12, kludge_rate_per_hour_cents: 8500, negotiated_rate_per_hour_cents: 7800, submitted_markup_pct: 0.18, direct_shop_cost_cents: 200000, replacement_lifecycle_percent: 100, prior_lifecycle_percent: 60, safety_gate_status: "PASSED", label_verified_status: "VERIFIED", safety_verified_status: "VERIFIED", label_percentage: 40, qualified_lifecycle_percent: 25, proposed_waiver: false }
              as: ProjectManager
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /revisions/${rev_id}/approve"
              payload: { expected_model_version_version: "${mva_coord_version}", resolution: "APPROVED" }
              as: ProjectManager
          assert:
            - "engineering_hours == round_half_up(40 * 3 / 4, 2) == 30.00"
            - "variant (a) rework_value_cents == min(30.00 * 8500, 200000) == 200000"
            - "variant (b) negotiated_value_cents == round_half_up(30.00 * 7800 * 1.18, 0) == 276120"
            - "Revision.${rev_id}.impact_values[0].negotiated_value_cents == 276120 while impact_values[0].rework_value_cents == 200000 for the identical inputs"
      - name: crew_day_first_accepted_versus_highest_total_credit
        grounds:
          - calculations.field_credit_policy
          - entities.Project.fields.credit_policy
          - entities.CrewDay.fields.report_sequence
          - entities.CrewDay.fields.credited_hours
        distinguishing_aspect: |
          On the CrewDay domain the two variants disagree for identical reported hours: the same two reports
          (sequence 1 with 8.0 regular hours, sequence 2 with 10.0 regular hours) credit 8.0 under FIRST_ACCEPTED
          but 10.0 under HIGHEST_TOTAL.
        test_recipe:
          setup:
            - "project P-FIRST with credit_policy FIRST_ACCEPTED and project P-HIGH with credit_policy HIGHEST_TOTAL"
            - "each project has one journeyman worker, one ACTIVE electrical activity and two CrewDay reports for the same worker and work date: sequence 1 with 8.0 hours, sequence 2 with 10.0 hours"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-FIRST", project_name: "Deck F", jurisdiction_key: "J1", planned_value_cents: 100000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 100, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_f_id: $.data.id }
            - call: "POST /projects"
              payload: { project_code: "P-3333-HIGH", project_name: "Deck H", jurisdiction_key: "J1", planned_value_cents: 100000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "HIGHEST_TOTAL", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 100, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_h_id: $.data.id }
            - call: "POST /trade-contract-rates"
              payload: { jurisdiction_key: "J1", classification: "JOURNEYMAN", apprentice_period: null, hourly_rate_cents: 6800, burden_pct: 0.42, apprentice_ratio_max: 1.0, wait_ratio_max: 1.0, effective_from_iso: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rate_j1_id: $.data.id }
            - call: "POST /workers"
              payload: { worker_code: "W-JM-1", full_name: "J. Wireman", classification: "JOURNEYMAN", apprentice_period: null, home_jurisdiction_key: "J1", qualification_state_code: "JW-1", percent_complete_certified: 50, percent_complete_verified: 50, safety_verified_status: "VERIFIED", safety_verification_code: "SAFE-JM-1" }
              as: GeneralForeman
              captures: { w_jm_id: $.data.id }
            - call: "POST /trade-activities"
              payload: { project_id: "${proj_f_id}", trade_key: "ELECTRICAL", activity_kind: "ELECTRICAL_INSTALL", work_front_code: "WF-1", bay_code: "BAY-A", planned_start_iso: "2026-10-01T00:00:00Z", planned_duration_days: 4, written_sequence_index: 1, revision_id: null, rate_id: "${rate_j1_id}", permit_id: null }
              as: GeneralForeman
              captures: { act_f_id: $.data.id, act_f_version: $.data.version }
            - call: "POST /trade-activities"
              payload: { project_id: "${proj_h_id}", trade_key: "ELECTRICAL", activity_kind: "ELECTRICAL_INSTALL", work_front_code: "WF-1", bay_code: "BAY-A", planned_start_iso: "2026-10-01T00:00:00Z", planned_duration_days: 4, written_sequence_index: 1, revision_id: null, rate_id: "${rate_j1_id}", permit_id: null }
              as: GeneralForeman
              captures: { act_h_id: $.data.id }
            - call: "PATCH /trade-activities/${act_f_id}/status"
              payload: { status: "PERMITTED" }
              as: GeneralForeman
            - call: "PATCH /trade-activities/${act_f_id}/status"
              payload: { status: "ACTIVE" }
              as: GeneralForeman
            - call: "PATCH /trade-activities/${act_h_id}/status"
              payload: { status: "PERMITTED" }
              as: GeneralForeman
            - call: "PATCH /trade-activities/${act_h_id}/status"
              payload: { status: "ACTIVE" }
              as: GeneralForeman
            - call: "POST /crew-days"
              payload: { project_id: "${proj_f_id}", worker_id: "${w_jm_id}", foreman_id: "${w_jm_id}", trade_activity_id: "${act_f_id}", work_date_iso: "2026-10-01T00:00:00Z", regular_hours: 8.0, overtime_hours: 0.0, report_sequence: 1, acknowledge_mode: "RELEASE" }
              as: GeneralForeman
              captures: { cd_f1_id: $.data.id }
            - call: "POST /crew-days"
              payload: { project_id: "${proj_f_id}", worker_id: "${w_jm_id}", foreman_id: "${w_jm_id}", trade_activity_id: "${act_f_id}", work_date_iso: "2026-10-01T00:00:00Z", regular_hours: 10.0, overtime_hours: 0.0, report_sequence: 2, acknowledge_mode: "FINAL" }
              as: GeneralForeman
              captures: { cd_f2_id: $.data.id, cd_f2_version: $.data.version }
            - call: "POST /crew-days"
              payload: { project_id: "${proj_h_id}", worker_id: "${w_jm_id}", foreman_id: "${w_jm_id}", trade_activity_id: "${act_h_id}", work_date_iso: "2026-10-01T00:00:00Z", regular_hours: 8.0, overtime_hours: 0.0, report_sequence: 1, acknowledge_mode: "RELEASE" }
              as: GeneralForeman
              captures: { cd_h1_id: $.data.id }
            - call: "POST /crew-days"
              payload: { project_id: "${proj_h_id}", worker_id: "${w_jm_id}", foreman_id: "${w_jm_id}", trade_activity_id: "${act_h_id}", work_date_iso: "2026-10-01T00:00:00Z", regular_hours: 10.0, overtime_hours: 0.0, report_sequence: 2, acknowledge_mode: "FINAL" }
              as: GeneralForeman
              captures: { cd_h2_id: $.data.id, cd_h2_version: $.data.version }
          trigger:
            - call: "POST /crew-days/${cd_f2_id}/acknowledge"
              payload: { expected_crew_day_version: "${cd_f2_version}", acknowledge_mode: "FINAL" }
              as: GeneralForeman
            - call: "POST /crew-days/${cd_h2_id}/acknowledge"
              payload: { expected_crew_day_version: "${cd_h2_version}", acknowledge_mode: "FINAL" }
              as: GeneralForeman
          assert:
            - "under FIRST_ACCEPTED the winning report is sequence 1: CrewDay.${cd_f1_id}.credited_hours == 8.0 and CrewDay.${cd_f2_id}.credited_hours == 0.0"
            - "under HIGHEST_TOTAL the winning report is sequence 2: CrewDay.${cd_h2_id}.credited_hours == 10.0 and CrewDay.${cd_h1_id}.credited_hours == 0.0"
            - "the two projects report different credited hours for the identical pair of reports"
  - rule_id: combinatorial_formula
    instances:
      - name: hoisting_window_ladder_with_chain_depth_and_shop_capacity
        grounds:
          - calculations.hoisting_window_derivation
          - entities.PrefabOrder.fields.hoisting_start_iso
          - entities.Project.fields.installed_pct
        distinguishing_aspect: |
          Mode (a) - four inputs with a non-linear ladder: with stage FIRST_STAGE (clash_slots 4, trade_count 2),
          one unmet chain predecessor (chain_depth 1), installed_pct 0.20 so the productivity penalty is 1, and
          shop_utilization_pct 0.90 selecting the 1.2 multiplier, base_days is ceil((4+2+1+1)*1.2) = 10 so
          hoisting_duration_days is 10; dropping shop_utilization_pct to 0.80 flips the multiplier to 1.0 and yields 8.
        test_recipe:
          setup:
            - "project P-HOIST with power_on_iso 2026-12-01T00:00:00Z, shop_utilization_pct 0.90 and zero installed content"
            - "one coordinated model version with a takeoff line of quantity 100 for assembly A-RACK, one rack R-H1 and one work package O-H1 in stage FIRST_STAGE holding two chained components"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-HOIST", project_name: "Deck H", jurisdiction_key: "J1", planned_value_cents: 400000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.90, total_quantity: 200, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_hoist_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-hoist", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_hoist_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_hoist_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 100, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_hoist: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_hoist_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /racks"
              payload: { model_version_id: "${mv_hoist_id}", rack_code: "R-H1", zone_code: "Z-1", top_elevation_ft: 12.0, rack_hoist_date: "2026-11-15T00:00:00Z", value_capacity_cf: 400.0, direct_assignment: true, ordering_strength_rule: "HOLD_WINDOW" }
              as: ModelCoordinator
              captures: { rack_h1_id: $.data.id }
            - call: "POST /prefab-orders"
              payload: { project_id: "${proj_hoist_id}", model_version_id: "${mv_hoist_id}", stage_code: "FIRST_STAGE", zone_code: "Z-1", transport_kind: "FLATBED", hoisting_window_id: "HW-1", required_on_site_iso: "2026-11-20T00:00:00Z", installation_window_start_iso: "2026-11-21T00:00:00Z", fabricate_quantity: 2, shop_utilisation_basis_pct: 0.90 }
              as: ProjectManager
              captures: { order_hoist_id: $.data.id, order_hoist_version: $.data.version }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_hoist_id}", rack_id: "${rack_h1_id}", takeoff_line_id: "${hash_hoist}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 50, chain_mode: "CHAIN_DEPENDENT", chain_dependency_link: "LNK-1" }
              as: ShopForeman
              captures: { comp_h1_id: $.data.id }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_hoist_id}", rack_id: "${rack_h1_id}", takeoff_line_id: "${hash_hoist}", predecessor_component_id: "${comp_h1_id}", assembly_code: "A-RACK", quantity: 50, chain_mode: "CHAIN_DEPENDENT", chain_dependency_link: "LNK-2" }
              as: ShopForeman
          trigger:
            - call: "POST /prefab-orders/${order_hoist_id}/release"
              payload: { expected_prefab_order_version: "${order_hoist_version}" }
              as: ProjectManager
          assert:
            - "PrefabOrder.${order_hoist_id}.hoisting_duration_days == 10 from base_days ceil((4 + 2 + 1 + 1) * 1.2)"
            - "PrefabOrder.${order_hoist_id}.hoisting_start_iso == 2026-11-17T00:00:00Z: power_on 2026-12-01 shifted back by base_days 10 plus ceil(2 * 3) = 16 days"
            - "PrefabOrder.${order_hoist_id}.hoisting_end_iso == 2026-11-27T00:00:00Z"
            - "the same inputs with shop_utilization_pct 0.80 instead select the 1.0 multiplier and yield base_days 8, so the ladder placement alone changes the window"
      - name: project_aggregation_round_then_divide_versus_divide_then_round
        grounds:
          - calculations.project_pipeline_balance
          - calculations.idle_capacity_writeoff
          - entities.Project.fields.installed_pct
          - entities.Project.fields.effective_flow_pct
        distinguishing_aspect: |
          Mode (b) - the scaffold pins the rounding order: effective_flow_pct rounds the total work volume to a
          whole percent BEFORE dividing, so with man_hours_total 600 and installed_pct 0.0 the pinned order yields
          round(600 * 16) / 600 = 9600 / 600 = 16.0 exactly, while the reverse order (derive the factor per
          component then divide) drifts; the identical inputs produce different values.
        test_recipe:
          setup:
            - "project P-AGG in jurisdiction J2 with shop_utilization_pct 0.90 and total_quantity 200"
            - "one coordinated model version, one takeoff line of quantity 100 for A-RACK, one rack and one released work package holding two components of quantity 50"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-AGG", project_name: "Deck G", jurisdiction_key: "J2", planned_value_cents: 400000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.90, total_quantity: 200, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_agg_id: $.data.id }
            - call: "POST /trade-contract-rates"
              payload: { jurisdiction_key: "J2", classification: "JOURNEYMAN", apprentice_period: null, hourly_rate_cents: 7000, burden_pct: 0.40, apprentice_ratio_max: 1.0, wait_ratio_max: 1.0, effective_from_iso: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_id: "mdl-agg", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_agg_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_agg_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 100, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_agg: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_agg_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /racks"
              payload: { model_version_id: "${mv_agg_id}", rack_code: "R-G1", zone_code: "Z-1", top_elevation_ft: 12.0, rack_hoist_date: "2026-11-15T00:00:00Z", value_capacity_cf: 400.0, direct_assignment: true, ordering_strength_rule: "HOLD_WINDOW" }
              as: ModelCoordinator
              captures: { rack_g1_id: $.data.id }
            - call: "POST /prefab-orders"
              payload: { project_id: "${proj_agg_id}", model_version_id: "${mv_agg_id}", stage_code: "FIRST_STAGE", zone_code: "Z-1", transport_kind: "FLATBED", hoisting_window_id: "HW-1", required_on_site_iso: "2026-11-20T00:00:00Z", installation_window_start_iso: "2026-11-21T00:00:00Z", fabricate_quantity: 2, shop_utilisation_basis_pct: 0.90 }
              as: ProjectManager
              captures: { order_agg_id: $.data.id, order_agg_version: $.data.version }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_agg_id}", rack_id: "${rack_g1_id}", takeoff_line_id: "${hash_agg}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 50, chain_mode: "PARALLEL_FABRICATION", chain_dependency_link: "LNK-G1" }
              as: ShopForeman
              captures: { comp_g1_id: $.data.id }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_agg_id}", rack_id: "${rack_g1_id}", takeoff_line_id: "${hash_agg}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 50, chain_mode: "PARALLEL_FABRICATION", chain_dependency_link: "LNK-G2" }
              as: ShopForeman
              captures: { comp_g2_id: $.data.id }
          trigger:
            - call: "POST /prefab-components/${comp_g2_id}/fabricate"
              payload: {}
              as: ShopForeman
            - call: "POST /prefab-orders/${order_agg_id}/release"
              payload: { expected_prefab_order_version: "${order_agg_version}" }
              as: ProjectManager
          assert:
            - "project_pipeline_balance: Project.${proj_agg_id}.man_hours_total == 600.0 and Project.${proj_agg_id}.pipeline_value_cents == 5880000"
            - "Project.${proj_agg_id}.installed_pct == 0.0 because no component is SET, so completed_value_cents stays 0"
            - "the pinned rounding order yields Project.${proj_agg_id}.effective_flow_pct == 16.0 (round(600 * 16) / 600); dividing first and rounding per component drifts off that literal"
            - "Project.${proj_agg_id}.craft_hours_credit == 600.0 because released_quantity is 0 at the release instant"
  - rule_id: non_linear_state_machine
    instances:
      - name: prefab_order_parallel_dimensions_with_manual_reverts
        grounds:
          - state_machines.PrefabOrder.PLANNED_to_RELEASED
          - state_machines.PrefabOrder.FABRICATED_to_PLANNED
          - state_machines.PrefabOrder.LOADED_to_AWAITING
          - state_machines.PrefabOrder.IN_TRANSIT_to_LOADED
        distinguishing_aspect: |
          On PrefabOrder the machine is parallel, not linear: fabricate_status and deliver_status evolve
          independently on the same row, so FABRICATED_to_PLANNED (a revert) is reachable while deliver_status
          still reads AWAITING, and LOADED_to_AWAITING is reachable while fabricate_status still reads
          IN_FABRICATION - neither pair can be ordered into a single A-to-B-to-C pipeline.
        test_recipe:
          setup:
            - "project P-PAR with one coordinated model version, one takeoff line, one rack and one work package O-PAR"
            - "O-PAR is IN_FABRICATION with deliver_status AWAITING and one component already FABRICATED"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-PAR", project_name: "Deck P", jurisdiction_key: "J1", planned_value_cents: 100000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 100, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
              as: PlatformAdmin
              captures: { proj_par_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-par", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_par_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_par_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 100, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_par: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_par_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /racks"
              payload: { model_version_id: "${mv_par_id}", rack_code: "R-P1", zone_code: "Z-1", top_elevation_ft: 12.0, rack_hoist_date: "2026-11-15T00:00:00Z", value_capacity_cf: 400.0, direct_assignment: true, ordering_strength_rule: "HOLD_WINDOW" }
              as: ModelCoordinator
