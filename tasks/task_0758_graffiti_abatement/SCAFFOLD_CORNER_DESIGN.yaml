scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "POST /abatement/sites with all required fields returns 201 and a Site whose status is NORMAL and counters are 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Site.${site_id}.status == NORMAL"
            - "Site.${site_id}.report_count_90d == 0"
            - "Site.${site_id}.version == 1"

      - name: get_site_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "GET /abatement/sites/{id} with an unknown UUID returns 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /abatement/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SITE_NOT_FOUND"

      - name: create_report_missing_severity_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Report.fields.severity, "validations[priority=3]"]
        distinguishing_aspect: "POST /abatement/reports omitting the required severity field returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "WALL", description: "no severity" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: report_is_offensive_defaults_false
        claim_type: Defaults
        grounds: [entities.Report.fields.is_offensive]
        distinguishing_aspect: "Creating a report without is_offensive yields is_offensive == false."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "WALL", severity: "LOW", description: "x" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
          assert:
            - "Report.${rep_id}.is_offensive == false"

      - name: material_status_computed_from_quantities
        claim_type: Computed Fields
        grounds: [entities.Material.fields.status]
        distinguishing_aspect: "A material created with quantity_available 5.0 and reorder_threshold 5.0 has computed status LOW (available <= threshold)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /abatement/materials"
              payload: { name: "Low Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1000, quantity_available: 5.0, reorder_threshold: 5.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
          assert:
            - "Material.${mat_id}.status == LOW"

      - name: report_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Report.fields.status, entities.Report.fields.priority_score]
        distinguishing_aspect: "A freshly created report has server-minted id/created_at, status SUBMITTED, and priority_score null regardless of any client-supplied values."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "WALL", severity: "LOW", description: "x" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
          assert:
            - "Report.${rep_id}.status == SUBMITTED"
            - "Report.${rep_id}.priority_score == null"

      - name: site_invalid_ownership_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Site.fields.ownership_type, "validations[priority=3]"]
        distinguishing_aspect: "POST /abatement/sites with ownership_type 'MUNICIPAL' (not in {PUBLIC,PRIVATE}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "MUNICIPAL", address: "5 Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: report_references_missing_site_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Report.fields.site_id, "errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "POST /abatement/reports whose site_id references no site returns 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "00000000-0000-4000-8000-000000000001", reported_via: "WEB", surface_type: "WALL", severity: "LOW", description: "x" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SITE_NOT_FOUND"

  # =================================================================
  - section: state_machines
    instances:
      - name: new_report_initial_state_submitted
        claim_type: Initial State
        grounds: [state_machines.Report, entities.Report.fields.status]
        distinguishing_aspect: "A newly created report begins in the Report state machine's initial_state SUBMITTED."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "WALL", severity: "LOW", description: "x" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
          assert:
            - "Report.${rep_id}.status == SUBMITTED"

      - name: triage_already_triaged_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Report.SUBMITTED_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Triaging a report that is already TRIAGED returns 409 ERR_INVALID_STATE (no second priority computation)."
        test_recipe:
          setup: ["A report has been triaged once (status TRIAGED)."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "WALL", severity: "LOW", description: "x" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_completed_workorder_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) work order returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A work order fully completed (terminal COMPLETED)."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0 }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 2.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/cancel"
              payload: { reason: "late" }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: workorder_completion_cascade_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / completion_cascade_workorder_report_costrecovery_site
          rationale: "The complete transition's full side-effect chain (Report REMEDIATED, CostRecovery ASSESSED, site ledger credit) is asserted by the named §1.8 depth-3 cascade instance."

  # =================================================================
  - section: validations
    instances:
      - name: private_site_without_owner_returns_private_site_requires_owner
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_PRIVATE_SITE_REQUIRES_OWNER]"]
        distinguishing_aspect: "POST /abatement/sites with ownership_type PRIVATE and no property_owner_id returns 422 ERR_PRIVATE_SITE_REQUIRES_OWNER."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1 }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PRIVATE_SITE_REQUIRES_OWNER"

      - name: public_site_with_owner_returns_private_site_requires_owner
        claim_type: Conditional validation
        grounds: ["validations[priority=15]", "errors[ERR_PRIVATE_SITE_REQUIRES_OWNER]"]
        distinguishing_aspect: "POST /abatement/sites with ownership_type PUBLIC but a property_owner_id present returns 422 ERR_PRIVATE_SITE_REQUIRES_OWNER."
        test_recipe:
          setup: ["A property owner exists."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Way", latitude: 41.0, longitude: -73.0, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PRIVATE_SITE_REQUIRES_OWNER"

      - name: start_without_before_photo_returns_before_photo_required
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_BEFORE_PHOTO_REQUIRED]"]
        distinguishing_aspect: "Starting a SCHEDULED work order that has no BEFORE photo returns 422 ERR_BEFORE_PHOTO_REQUIRED."
        test_recipe:
          setup: ["A report is dispatched (WorkOrder SCHEDULED) with no photos yet."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0 }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_BEFORE_PHOTO_REQUIRED"

      - name: complete_without_after_photo_returns_after_photo_required
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_AFTER_PHOTO_REQUIRED]"]
        distinguishing_aspect: "Completing an IN_PROGRESS work order that has no AFTER photo returns 422 ERR_AFTER_PHOTO_REQUIRED."
        test_recipe:
          setup: ["A work order is IN_PROGRESS with only a BEFORE photo."]
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0 }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 2.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_AFTER_PHOTO_REQUIRED"

      - name: expire_before_cure_deadline_returns_cure_window_not_elapsed
        claim_type: Temporal validation
        grounds: ["validations[priority=9]", "errors[ERR_CURE_WINDOW_NOT_ELAPSED]"]
        distinguishing_aspect: "Expiring a SENT notice while clock_now (default 2026-03-01) is before its cure_deadline (2026-03-31) returns 409 ERR_CURE_WINDOW_NOT_ELAPSED."
        test_recipe:
          setup: ["A site fully remediated (CostRecovery ASSESSED) with a COST_RECOVERY_NOTICE issued at the default clock (cure_deadline 2026-03-31); clock left at default."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.5, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "GET /abatement/sites/${site_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { site_v: $.data.version }
            - call: "POST /abatement/sites/${site_id}/notices"
              payload: { notice_type: "COST_RECOVERY_NOTICE", cure_days: 30, expected_site_version: "${site_v}", cost_recovery_id: "${cr_id}" }
              as: AbatementCoordinator
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /abatement/notices/${notice_id}/expire"
              payload: {}
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CURE_WINDOW_NOT_ELAPSED"

      - name: dispatch_insufficient_material_single_returns_insufficient_material
        claim_type: Aggregate validation
        grounds: ["validations[priority=17]", "errors[ERR_INSUFFICIENT_MATERIAL]"]
        distinguishing_aspect: "Dispatching a work order requesting 4.0 of a material with only 3.0 available returns 409 ERR_INSUFFICIENT_MATERIAL (no reservation created)."
        test_recipe:
          setup: ["PRIVATE site with owner, certified crew, material quantity_available 3.0; a HIGH report triaged."]
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy", mailing_address: "1 Elm", contact_email: "i@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Scarce", category: "PAINT", unit: "LITERS", unit_cost_cents: 1000, quantity_available: 3.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat_id}", quantity: 4.0 } ] }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_MATERIAL"

      - name: workorder_scheduled_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=3]", entities.WorkOrder.fields.scheduled_end]
