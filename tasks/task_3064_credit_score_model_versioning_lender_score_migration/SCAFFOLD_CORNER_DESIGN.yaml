          - errors.ERR_STALE_VERSION
          - concurrency_rules[score-post-stale-license]
        distinguishing_aspect: "A posting carrying an expected_license_version captured before a settlement is refused with 412 ERR_STALE_VERSION, which is a distinct status from the 409 used by every business check in this scaffold."
