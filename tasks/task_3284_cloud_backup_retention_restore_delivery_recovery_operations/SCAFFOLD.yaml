# =============================================================================
# PRD Benchmark Scaffold — Cloud Backup Retention, Restore Delivery &
# Recovery Operations (Backblaze-shaped backup provider)
# =============================================================================

scenario: |
  Cloud Backup Retention, Restore Delivery & Recovery Operations (Backblaze): client agent installation with initial full backup throttling and continuous incremental change capture, retention policies determining how long deleted and changed files remain recoverable with extended history options, restore workflows including selective file download, full archive preparation and physical drive shipment with return credit, versioning and ransomware recovery scenarios requiring point-in-time restore before an encryption event, storage tier products with per-gigabyte pricing, egress fees and transaction charges, account and license management for personal, business and enterprise deployments with group policies, data durability engineering across storage pods with erasure coding, deletion and account closure data handling

domain_name: cloud-backup-recovery
api_prefix: /backup-provider

complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: event sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 9
  calculation_count: 11
  validation_layers: 7
  endpoint_count: 50
  error_code_count: 30
  role_count: 5

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer-facing account name" }
      - { name: account_type, type: enum, source: input, description: "PERSONAL | BUSINESS | ENTERPRISE" }
      - { name: region, type: enum, source: input, description: "US_WEST | US_EAST | EU_CENTRAL" }
      - { name: storage_tier, type: enum, source: input, default: "BASIC", description: "BASIC | PLUS | PRO; selects the per-GB storage rate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | CLOSED" }
      - { name: encryption_key_id, type: string, source: input, description: "Server-side encryption key handle for the account" }
      - { name: usage_gb, type: number, source: input, default: 0, description: "Total stored volume in GB for the current billing period" }
      - { name: restore_download_gb, type: number, source: system, default: 0, description: "Egress GB consumed by restores in the current period" }
      - { name: transaction_count, type: integer, source: system, default: 0, description: "Billable API transactions accrued in the current period" }
      - { name: peak_usage_gb, type: number, source: computed, description: "High-water mark of usage_gb during the current period" }
      - { name: retention_days, type: integer, source: computed, description: "Effective retention window in days for the account" }
      - { name: has_extended_history, type: boolean, source: computed, description: "True when retention_days > BASE_RETENTION_DAYS" }
      - { name: group_count, type: integer, source: computed, description: "Number of BackupGroup rows under this account" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Refundable drive deposits currently held; credited on shipment close, debited on ship" }
      - { name: initial_full_backup_gb, type: number, source: computed, description: "Volume of the account's first initial full backup; the basis of the one-time upload credit" }
      - { name: first_closed_period_utc, type: datetime, source: system, description: "period_end_utc of the account's earliest closed BillingPeriod; the one-time upload credit is consumed only while this is null" }

  - name: BackupGroup
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: name, type: string, source: input, description: "Group display name" }
      - { name: tier, type: enum, source: input, description: "STANDARD | HIGH_FREQUENCY; selects the collection cadence" }
      - { name: retention_days_override, type: integer, source: input, description: "Optional group-level retention window; null means inherit the account default" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: group_retention_days, type: integer, source: computed, description: "Effective retention window for the group after inheritance and policy floors" }
      - { name: agent_count, type: integer, source: computed, description: "Number of Agent rows in this group" }
      - { name: expected_daily_transactions, type: integer, source: computed, description: "Projected incrementals per day for the whole group" }
      - { name: member_transaction_share, type: number, source: computed, description: "Fraction of a storage pod's repair workload this group is responsible for" }
      - { name: created_seq, type: integer, source: system, description: "Account-scoped monotonic sequence; the sole chronological tie-break" }

  - name: GroupPolicy
    parent: BackupGroup
    common_fields: true
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> BackupGroup.id; group the policy constrains" }
      - { name: policy_kind, type: enum, source: input, description: "RETENTION | VERSIONING | RANSOMWARE" }
      - { name: min_retention_days, type: integer, source: input, default: 0, description: "Floor applied to group_retention_days" }
      - { name: max_extended_history_days, type: integer, source: input, description: "Ceiling on extended-histoire retention the group may request" }
      - { name: min_restore_point_age_hours, type: integer, source: input, default: 0, description: "Cooling-off before a point-in-time restore point may be named" }
      - { name: require_mfa_for_restore, type: boolean, source: input, default: true, description: "When true, restore requests need a valid requester_mfa_ticket" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Instant the policy becomes binding" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: Agent
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: group_id, type: string, source: system, description: "FK -> BackupGroup.id; group the agent is enrolled in" }
      - { name: hostname, type: string, source: input, description: "Client machine hostname; unique inside the account" }
      - { name: os_type, type: enum, source: input, description: "WINDOWS | MACOS | LINUX" }
      - { name: license_type, type: enum, source: input, description: "PERSONAL | BUSINESS | ENTERPRISE; must not exceed the account_type ceiling" }
      - { name: status, type: enum, source: system, description: "PENDING_AUTH | ACTIVE | RETIRED | BLOCKED" }
      - { name: throttle_month, type: integer, source: input, description: "YYYYMM of the initial-backup throttle reservation" }
      - { name: data_stored_gb, type: number, source: input, default: 0, description: "Volume the agent has reported for the current period" }
      - { name: last_change_sequence, type: integer, source: system, default: 0, description: "Highest FileVersion.version_number recorded for this agent's sets" }
      - { name: in_throttle_window, type: boolean, source: computed, description: "True while the initial full backup is rate-limited" }
      - { name: data_stored_share, type: number, source: computed, description: "This agent's fraction of the group's stored volume" }

  - name: BackupSet
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; owning agent" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; denormalized owning account" }
      - { name: state, type: enum, source: system, description: "PROVISIONING | INITIAL_RUNNING | ACTIVE | SUSPENDED | DELETED" }
      - { name: durability_class, type: enum, source: input, description: "STANDARD | DEEP_ARCHIVE" }
      - { name: initial_started_at, type: datetime, source: system, description: "Instant the initial full backup began" }
      - { name: last_backup_at, type: datetime, source: system, description: "Instant of the most recent recorded change" }
      - { name: storage_gb, type: number, source: computed, description: "Sum of live (non-deleted) FileVersion sizes divided by GB_BYTES, floor to 2dp" }
      - { name: version_chain_depth, type: integer, source: computed, description: "Number of live recoverable versions currently held" }
      - { name: retention_floor_utc, type: datetime, source: computed, description: "Oldest change instant still recoverable" }
      - { name: recovery_points, type: integer, source: computed, description: "Distinct event_utc instants that can serve as point-in-time restore points" }
      - { name: is_initial_flush, type: boolean, source: computed, description: "True while state is INITIAL_RUNNING" }
      - { name: created_seq, type: integer, source: system, description: "Agent-scoped monotonic sequence" }

  - name: FileVersion
    parent: BackupSet
    common_fields: false
    fields:
      - { name: backup_set_id, type: string, source: system, description: "FK -> BackupSet.id; owning backup set" }
      - { name: file_path, type: string, source: input, description: "Absolute client path of the changed file" }
      - { name: version_number, type: integer, source: input, description: "Monotonic per (backup_set, file_path) version counter, starting at 1" }
      - { name: operation, type: enum, source: input, description: "CREATE | MODIFY | DELETE" }
      - { name: size_bytes, type: integer, source: input, description: "Size of the stored blob for this version; 0 for DELETE" }
      - { name: content_hash, type: string, source: input, description: "Content hash used to decide whether a MODIFY is a real change" }
      - { name: event_utc, type: datetime, source: input, description: "Instant the change happened on the client" }
      - { name: recoverable_until_utc, type: datetime, source: computed, description: "event_utc plus the effective retention window" }
      - { name: is_deleted, type: boolean, source: computed, description: "True when operation is DELETE" }
      - { name: is_expired, type: boolean, source: computed, description: "True when the logical clock is at or past recoverable_until_utc" }

  - name: RestoreRequest
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; requesting account" }
      - { name: subject_agent_id, type: string, source: input, description: "FK -> Agent.id; the agent whose data is restored" }
      - { name: restore_point_in_utc, type: datetime, source: input, description: "Point-in-time instant the restore must reconstruct" }
      - { name: restore_type, type: enum, source: input, description: "FILE_DOWNLOAD | ZIP_ARCHIVE | DRIVE_SHIPMENT" }
      - { name: requested_file_count, type: integer, source: input, description: "Number of files requested; 0 means every live file in the set" }
      - { name: requested_size_gb, type: number, source: input, description: "Requested restore volume in GB" }
      - { name: requester_mfa_ticket, type: string, source: input, description: "Optional MFA ticket; required when the group policy demands it" }
      - { name: drive_capacity_gb, type: number, source: input, description: "Usable capacity of one drive; required when restore_type == DRIVE_SHIPMENT" }
      - { name: drive_count, type: integer, source: input, description: "Number of drives to ship; required when restore_type == DRIVE_SHIPMENT" }
      - { name: deposit_fee_cents, type: integer, source: input, description: "Refundable deposit per drive; required when restore_type == DRIVE_SHIPMENT" }
      - { name: restore_transaction_count, type: integer, source: input, default: 0, description: "Metadata transactions the restore issues; feeds the transaction component of the egress fee" }
      - { name: state, type: enum, source: system, description: "REQUESTED | VALIDATING | IN_PROGRESS | READY | COMPLETED | FAILED | CANCELLED" }
      - { name: is_ransomware_recovery, type: boolean, source: computed, description: "True when the restore point predates at least one stored DELETE event" }
      - { name: egress_gb, type: number, source: computed, description: "Billable egress volume of this restore after the free allowance" }
      - { name: egress_fee_cents, type: integer, source: computed, description: "Egress charge in cents for this restore" }
      - { name: archive_entry_count, type: integer, source: computed, description: "Entries the prepared archive must contain" }

  - name: DriveShipment
    parent: RestoreRequest
    common_fields: true
    fields:
      - { name: restore_request_id, type: string, source: system, description: "FK -> RestoreRequest.id; source restore request" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; denormalized owning account" }
      - { name: drive_capacity_gb, type: number, source: input, description: "Usable capacity of one shipped drive in GB" }
      - { name: drive_count, type: integer, source: input, description: "Number of physical drives shipped" }
      - { name: deposit_fee_cents, type: integer, source: input, description: "Refundable deposit charged per drive" }
      - { name: state, type: enum, source: system, description: "PREPARING | SHIPPED | DELIVERED | AWAITING_RETURN | RETURNED | CLOSED | DELINQUENT" }
      - { name: shipped_at, type: datetime, source: system, description: "Instant the drives left the facility" }
      - { name: return_deadline_utc, type: datetime, source: computed, description: "shipped_at plus the return window in days" }
      - { name: return_credit_cents, type: integer, source: computed, description: "Deposit credit released back to the account on return" }
      - { name: was_delinquent, type: boolean, source: system, description: "Set true the first time this shipment entered DELINQUENT; retains the late penalty after return" }

  - name: BillingPeriod
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; billed account" }
      - { name: period_start_utc, type: datetime, source: input, description: "Inclusive start of the billing window" }
      - { name: period_end_utc, type: datetime, source: input, description: "Exclusive end of the billing window" }
      - { name: restore_active_days, type: integer, source: input, default: 0, description: "Number of days in the window during which a restore was in progress; weights peak_usage_gb in the storage charge" }
      - { name: state, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: usage_gb_avg, type: number, source: computed, description: "Period-average stored volume in GB; primary input to the base storage charge" }
      - { name: peak_usage_gb, type: number, source: computed, description: "Period peak stored volume in GB" }
      - { name: egress_gb, type: number, source: computed, description: "Total billable egress in the period" }
      - { name: transaction_count, type: integer, source: computed, description: "Total transactions in the period" }
      - { name: storage_fee_cents, type: integer, source: computed, description: "Storage charge before the one-time initial-upload credit" }
      - { name: initial_upload_credit_cents, type: integer, source: computed, description: "One-time credit applied against the first closed period" }
      - { name: storage_credit_applied_cents, type: integer, source: computed, description: "Portion of initial_upload_credit_cents actually consumed" }
      - { name: egress_fee_cents, type: integer, source: computed, description: "Egress charge for the period" }
      - { name: transaction_fee_cents, type: integer, source: computed, description: "Transaction charge for the period" }
      - { name: total_cents, type: computed, source: computed, description: "storage_fee + egress_fee + transaction_fee after credits" }

  - name: StoragePod
    parent: null
    common_fields: true
    fields:
      - { name: region, type: enum, source: input, description: "US_WEST | US_EAST | EU_CENTRAL" }
      - { name: status, type: enum, source: system, description: "HEALTHY | DEGRADED | REPAIRING | FAILED" }
      - { name: total_shards, type: integer, source: input, description: "Total erasure-coded shards written per object" }
      - { name: data_shards, type: integer, source: input, description: "Data shards required to reconstruct" }
      - { name: parity_shards, type: integer, source: input, description: "Parity shards; equals total_shards - data_shards" }
      - { name: failed_shards, type: integer, source: input, default: 0, description: "Shards currently unreadable" }
      - { name: reliability_pct, type: number, source: computed, description: "Durability percentage derived from the erasure-coding geometry" }
      - { name: is_reconstructable, type: boolean, source: computed, description: "True while failed_shards <= parity_shards" }
      - { name: last_repair_utc, type: datetime, source: system, description: "Instant of the most recent completed repair" }
      - { name: created_seq, type: integer, source: system, description: "Global monotonic sequence for pod registration order" }

  - name: RetentionChangeRequest
    parent: BackupGroup
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: group_id, type: string, source: system, description: "FK -> BackupGroup.id; group whose retention changes" }
      - { name: requested_retention_days, type: integer, source: input, description: "Retention window the operator asked for" }
      - { name: reason_code, type: enum, source: input, description: "UPGRADE | DOWNGRADE | LITIGATION_HOLD | POLICY_ALIGNMENT" }
      - { name: state, type: enum, source: system, description: "SUBMITTED | COOLING_OFF | APPLIED | REJECTED | EXPIRED" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Instant the request was submitted" }
      - { name: cooling_off_until_utc, type: datetime, source: computed, description: "submitted_at_utc plus COOLING_OFF_DAYS" }
      - { name: original_retention_days, type: integer, source: computed, description: "group_retention_days captured at submission time" }

  - name: DataDeletionRequest
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account the deletion applies to" }
      - { name: deletion_scope, type: enum, source: input, description: "DELETED_FILES | ACCOUNT_CLOSURE" }
      - { name: authorization_ref, type: string, source: input, description: "Opaque ticket reference proving the customer authorized deletion" }
      - { name: state, type: enum, source: system, description: "SUBMITTED | APPROVED | EXECUTING | COMPLETED | REJECTED" }
      - { name: approved_at_utc, type: datetime, source: system, description: "Instant the request was approved" }
      - { name: executability_utc, type: datetime, source: computed, description: "approved_at_utc plus the deletion cooling-off window" }
      - { name: files_purged, type: integer, source: computed, description: "Number of FileVersion rows purged on execution" }
      - { name: bytes_purged, type: integer, source: computed, description: "Total bytes released on execution" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- 1. BackupSet: ACTIVE self-loop for incremental capture (cyclic) --------
  - entity: BackupSet
    initial_state: PROVISIONING
    terminal_states: [DELETED]
    transitions:
      - from: PROVISIONING
        to: INITIAL_RUNNING
        trigger: "POST /backup-sets/{id}/file-versions with this set's first non-DELETE version"
        actor: BackupOperator
        preconditions:
          - "Agent.status == ACTIVE (else ERR_AGENT_NOT_ACTIVE)"
          - "the agent's BackupGroup has an ACTIVE GroupPolicy of policy_kind RETENTION (else ERR_POLICY_REQUIRED)"
          - "Agent.throttle_month == the logical clock's YYYYMM (else ERR_THROTTLE_WINDOW_CLOSED)"
        side_effects:
          - "BackupSet.initial_started_at = logical clock"
          - "BackupSet.is_initial_flush = true; the initial full backup is rate-limited"
          - "Agent.in_throttle_window = true"
          - "recompute Account.initial_full_backup_gb = max over the account's sets of storage_gb while this set has is_initial_flush true"
          - "recompute BackupSet.storage_gb, BackupSet.version_chain_depth, BackupSet.recovery_points, BackupSet.retention_floor_utc and BackupSet.last_backup_at from the new version"
          - "recompute the new FileVersion's recoverable_until_utc = event_utc + group_retention_days and is_expired = (logical clock >= recoverable_until_utc)"
      - from: INITIAL_RUNNING
        to: ACTIVE
        trigger: "POST /backup-sets/{id}/complete-initial"
        actor: BackupOperator
        preconditions:
          - "the set has at least one non-DELETE FileVersion (else ERR_INITIAL_BACKUP_EMPTY)"
        side_effects:
          - "BackupSet.is_initial_flush = false; Agent.in_throttle_window = false"
          - "recompute BackupSet.storage_gb, BackupSet.version_chain_depth, BackupSet.recovery_points, BackupSet.retention_floor_utc"
          - "recompute Account.usage_gb and Account.peak_usage_gb"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /backup-sets/{id}/file-versions"
        actor: BackupOperator
        preconditions:
          - "version_number == 1 + max(existing version_number for the same file_path) (else ERR_VERSION_CONFLICT)"
          - "operation == MODIFY requires content_hash to differ from the prior version's content_hash (else ERR_NO_CHANGE_DETECTED)"
        side_effects:
          - "BackupSet.last_backup_at = FileVersion.event_utc"
          - "recompute BackupSet.storage_gb, BackupSet.version_chain_depth, BackupSet.recovery_points, BackupSet.retention_floor_utc"
          - "recompute Account.usage_gb and Account.peak_usage_gb"
          - "recompute Agent.last_change_sequence and Agent.data_stored_gb"
          - "recompute BackupGroup.group_retention_days, BackupGroup.expected_daily_transactions, BackupGroup.member_transaction_share"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /backup-sets/{id}/suspend"
        actor: BackupOperator
        preconditions:
          - "the account has an OPEN BillingPeriod whose total_cents >= DELINQUENCY_THRESHOLD_CENTS (else ERR_INVALID_STATE)"
        side_effects:
          - "Agent.status = BLOCKED"
          - "recompute Account.usage_gb (the suspended set keeps its stored volume)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: the account's outstanding BillingPeriod is closed with total_cents < DELINQUENCY_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "the account has no OPEN BillingPeriod with total_cents >= DELINQUENCY_THRESHOLD_CENTS"
        side_effects:
          - "Agent.status = ACTIVE"
      - from: ACTIVE
        to: DELETED
        trigger: "POST /backup-sets/{id}/delete"
        actor: BackupOperator
        preconditions:
          - "every FileVersion in the set has an elapsed grace window, OR Account.status == CLOSED (else ERR_RETENTION_HOLD_ACTIVE)"
        side_effects:
          - "purge every FileVersion row in the set"
          - "recompute Account.usage_gb and Account.peak_usage_gb (the set no longer contributes)"
      - from: SUSPENDED
        to: DELETED
        trigger: "POST /backup-sets/{id}/delete"
        actor: BackupOperator
        preconditions:
          - "Account.status == CLOSED (else ERR_RETENTION_HOLD_ACTIVE)"
        side_effects:
          - "purge every FileVersion row in the set"
          - "recompute Account.usage_gb"

  # --- 2. RestoreRequest: branching with compensation -----------------------
  - entity: RestoreRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, FAILED, CANCELLED, REVERSED]
    transitions:
      - from: REQUESTED
        to: VALIDATING
        trigger: "POST /restore-requests/{id}/validate"
        actor: AccountOwner
        preconditions:
          - "restore_type == DRIVE_SHIPMENT requires Account.account_type IN {BUSINESS, ENTERPRISE} (else ERR_DRIVE_SHIPMENT_NOT_PERMITTED)"
          - "when the subject group's ACTIVE GroupPolicy has require_mfa_for_restore true, requester_mfa_ticket must be non-empty (else ERR_MFA_REQUIRED)"
          - "logical clock >= subject set's created_at + GroupPolicy.min_restore_point_age_hours (else ERR_RESTORE_POINT_TOO_RECENT)"
        side_effects:
          - "recompute RestoreRequest.is_ransomware_recovery"
          - "recompute RestoreRequest.archive_entry_count"
      - from: VALIDATING
        to: REQUESTED
        trigger: "POST /restore-requests/{id}/return-to-draft"
        actor: AccountOwner
        preconditions: []
        side_effects:
          - "clears the previously computed is_ransomware_recovery and archive_entry_count"
      - from: VALIDATING
        to: IN_PROGRESS
        trigger: "POST /restore-requests/{id}/begin"
        actor: AccountOwner
        preconditions:
          - "requested_size_gb <= drive_capacity_gb * drive_count when restore_type == DRIVE_SHIPMENT (else ERR_DRIVE_CAPACITY_EXCEEDED)"
        side_effects:
          - "recompute RestoreRequest.egress_gb and RestoreRequest.egress_fee_cents"
          - "when restore_type == DRIVE_SHIPMENT, create a DriveShipment row in PREPARING (synthesized; discoverable only via GET /drive-shipments?restore_request_id=)"
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /restore-requests/{id}/prepare"
        actor: AccountOwner
        preconditions:
          - "every requested FileVersion is non-expired at the restore point (else ERR_RESTORE_POINT_EXPIRED)"
        side_effects:
          - "recompute RestoreRequest.archive_entry_count"
          - "DriveShipment.state PREPARING -> SHIPPED for DRIVE_SHIPMENT requests"
      - from: READY
        to: COMPLETED
        trigger: "POST /restore-requests/{id}/complete"
        actor: AccountOwner
        preconditions: []
        side_effects:
          - "Account.restore_download_gb += RestoreRequest.egress_gb"
          - "Account.transaction_count += 1"
          - "CASCADE HOP 1 of the restore-side chain: for a DRIVE_SHIPMENT restore whose DriveShipment is in RETURNED, that DriveShipment takes the RETURNED -> CLOSED edge"
          - "BackupSet state is unchanged; Account.status is unchanged"
      - from: READY
        to: FAILED
        trigger: "POST /restore-requests/{id}/fail"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "DriveShipment.state -> DELINQUENT for DRIVE_SHIPMENT requests"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /restore-requests/{id}/cancel"
        actor: AccountOwner
        preconditions: []
        side_effects: []
      - from: VALIDATING
        to: CANCELLED
        trigger: "POST /restore-requests/{id}/cancel"
        actor: AccountOwner
        preconditions: []
        side_effects: []
      - from: READY
        to: REVERSED
        trigger: "POST /restore-requests/{id}/reverse"
        actor: SystemOperator
        preconditions:
          - "the linked DriveShipment, when present, is in a state other than CLOSED (else ERR_SHIPMENT_ALREADY_CLOSED)"
        side_effects:
          - "Account.restore_download_gb -= RestoreRequest.egress_gb (the compensating action; see calculations.restore_egress_compensation)"
          - "Account.transaction_count -= 1"

  # --- 3. DriveShipment: linear with a delinquency branch --------------------
  - entity: DriveShipment
    initial_state: PREPARING
    terminal_states: [CLOSED]
    transitions:
      - from: PREPARING
        to: SHIPPED
        trigger: "POST /drive-shipments/{id}/ship"
        actor: SystemOperator
        preconditions:
          - "deposit_fee_cents >= 0 and drive_count >= 1 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "DriveShipment.shipped_at = logical clock"
          - "recompute DriveShipment.return_deadline_utc = shipped_at + RETURN_WINDOW_DAYS"
          - "recompute Account.deposit_held_cents = sum over the account's shipments of (drive_count * deposit_fee_cents) plus sum over shipments with was_delinquent of (drive_count * LATE_RETURN_PENALTY_CENTS_PER_DRIVE)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /drive-shipments/{id}/deliver"
        actor: SystemOperator
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: AWAITING_RETURN
        trigger: "POST /drive-shipments/{id}/open-return-window"
        actor: AccountOwner
        preconditions: []
        side_effects: []
      - from: AWAITING_RETURN
        to: RETURNED
        trigger: "POST /drive-shipments/{id}/receive-return"
        actor: SystemOperator
        preconditions:
          - "logical clock <= DriveShipment.return_deadline_utc (else the caller must target DELINQUENT)"
        side_effects:
          - "recompute DriveShipment.return_credit_cents = drive_count * deposit_fee_cents"
      - from: AWAITING_RETURN
        to: DELINQUENT
        trigger: "POST /drive-shipments/{id}/mark-delinquent"
        actor: SystemOperator
        preconditions:
          - "logical clock > DriveShipment.return_deadline_utc (else ERR_RETURN_WINDOW_OPEN)"
        side_effects:
          - "DriveShipment.was_delinquent = true"
          - "recompute DriveShipment.return_credit_cents = max(0, drive_count * deposit_fee_cents - drive_count * LATE_RETURN_PENALTY_CENTS_PER_DRIVE)"
          - "recompute Account.deposit_held_cents (the forfeited late penalty is now held)"
      - from: DELINQUENT
        to: RETURNED
        trigger: "POST /drive-shipments/{id}/receive-return"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "recompute DriveShipment.return_credit_cents with the late penalty applied"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /drive-shipments/{id}/close"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "CASCADE HOP 2: recompute Account.deposit_held_cents (this shipment's refundable deposit is released and, when was_delinquent, its forfeited late penalty is now included)"
          - "CASCADE HOP 3: every BillingPeriod of the account still in state OPEN is closed — recompute egress_fee_cents, transaction_fee_cents and total_cents, then set state = CLOSED"
          - "mark this DriveShipment CLOSED"

  # --- 4. RetentionChangeRequest: cyclic (reject -> resubmit -> cooling) -----
  - entity: RetentionChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPLIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: COOLING_OFF
        trigger: "POST /retention-change-requests/{id}/begin-cooling-off"
        actor: RetentionOfficer
        preconditions:
          - "requested_retention_days >= the group's ACTIVE GroupPolicy.min_retention_days (else ERR_RETENTION_BELOW_POLICY_FLOOR)"
          - "requested_retention_days <= the group's ACTIVE GroupPolicy.max_extended_history_days (else ERR_RETENTION_ABOVE_POLICY_CEILING)"
        side_effects:
          - "RetentionChangeRequest.submitted_at_utc = logical clock"
          - "recompute RetentionChangeRequest.cooling_off_until_utc and original_retention_days"
      - from: COOLING_OFF
        to: APPLIED
        trigger: "POST /retention-change-requests/{id}/apply"
        actor: RetentionOfficer
        preconditions:
          - "reason_code == DOWNGRADE requires logical clock >= cooling_off_until_utc (else ERR_COOLING_OFF_ACTIVE)"
          - "no other ACTIVE RetentionChangeRequest exists for the same group (else ERR_RETENTION_CHANGE_CONFLICT)"
        side_effects:
          - "BackupGroup.retention_days_override = requested_retention_days"
          - "recompute BackupGroup.group_retention_days"
          - "recompute Account.retention_days and Account.has_extended_history"
          - "recompute recoverable_until_utc and is_expired on every FileVersion of the group's sets"
      - from: COOLING_OFF
        to: REJECTED
        trigger: "POST /retention-change-requests/{id}/reject"
        actor: RetentionOfficer
        preconditions: []
        side_effects:
          - "BackupGroup.group_retention_days is unchanged"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /retention-change-requests/{id}/resubmit"
        actor: RetentionOfficer
        preconditions:
          - "the replacement requested_retention_days differs from the rejected value (else ERR_DUPLICATE_REQUEST)"
        side_effects:
          - "clears cooling_off_until_utc"
      - from: COOLING_OFF
        to: EXPIRED
        trigger: "POST /retention-change-requests/{id}/expire"
        actor: SystemOperator
        preconditions:
          - "logical clock >= cooling_off_until_utc + COOLING_OFF_EXPIRY_DAYS (else ERR_COOLING_OFF_ACTIVE)"
        side_effects: []

  # --- 5. DataDeletionRequest: compliance cooling-off ------------------------
  - entity: DataDeletionRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /data-deletion-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "authorization_ref must be non-empty (else ERR_DELETION_AUTHORIZATION_MISSING)"
          - "no RetentionChangeRequest for the account's groups is in state IN {SUBMITTED, COOLING_OFF, APPLIED} with reason_code LITIGATION_HOLD (else ERR_LITIGATION_HOLD_ACTIVE)"
        side_effects:
          - "DataDeletionRequest.approved_at_utc = logical clock"
          - "recompute DataDeletionRequest.executability_utc"
          - "when deletion_scope == ACCOUNT_CLOSURE: every BackupSet of the account transitions to SUSPENDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /data-deletion-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "when deletion_scope == ACCOUNT_CLOSURE: every BackupSet of the account returns to ACTIVE"
      - from: APPROVED
        to: EXECUTING
        trigger: "POST /data-deletion-requests/{id}/execute"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock >= DataDeletionRequest.executability_utc (else ERR_DELETION_COOLING_OFF_ACTIVE)"
        side_effects:
          - "purge FileVersion rows per deletion_scope (DELETED_FILES: every is_deleted or is_expired row; ACCOUNT_CLOSURE: every row of the account)"
          - "CASCADE HOP 1 of the deletion-side chain: recompute BackupSet.storage_gb, BackupSet.version_chain_depth, BackupSet.recovery_points, BackupSet.retention_floor_utc"
          - "CASCADE HOP 2: recompute Account.usage_gb and Account.peak_usage_gb from the surviving sets"
          - "when deletion_scope == ACCOUNT_CLOSURE: Account.status = CLOSED; every Agent of the account -> RETIRED; every BackupSet -> DELETED"
      - from: EXECUTING
        to: COMPLETED
        trigger: "POST /data-deletion-requests/{id}/complete"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "set DataDeletionRequest.files_purged and DataDeletionRequest.bytes_purged"

  # --- 6. BackupGroup --------------------------------------------------------
  - entity: BackupGroup
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /backup-groups/{id}/suspend followed by POST /backup-groups/{id}/resume"
        actor: RetentionOfficer
        preconditions:
          - "suspend requires the group's effective group_retention_days < the account's retention_days (else ERR_POLICY_FLOOR_SATISFIED)"
          - "resume requires the group's ACTIVE GroupPolicy.min_retention_days <= BackupGroup.retention_days_override (else ERR_RETENTION_BELOW_POLICY_FLOOR)"
        side_effects:
          - "suspend: every Agent of the group -> BLOCKED"
          - "resume: every Agent of the group -> ACTIVE"
        note: "The group suspension state is modeled as a self-loop on the ACTIVE status because group suspension is reversible and the group has no other persistent status."

  # --- 7. Agent --------------------------------------------------------------
  - entity: Agent
    initial_state: PENDING_AUTH
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING_AUTH
        to: ACTIVE
        trigger: "POST /agents/{id}/activate"
        actor: BackupOperator
        preconditions:
          - "license_type must not exceed the account ceiling: PERSONAL on a PERSONAL account, BUSINESS on BUSINESS or ENTERPRISE, ENTERPRISE only on ENTERPRISE (else ERR_LICENSE_TIER_EXCEEDED)"
          - "hostname is unique within the account (else ERR_AGENT_HOSTNAME_TAKEN)"
        side_effects:
          - "BackupGroup.agent_count += 1"
          - "recompute BackupGroup.expected_daily_transactions and BackupGroup.member_transaction_share"
      - from: PENDING_AUTH
        to: RETIRED
        trigger: "POST /agents/{id}/retire"
        actor: BackupOperator
        preconditions: []
        side_effects:
          - "BackupGroup.agent_count is unchanged (the agent never became ACTIVE)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /agents/{id}/retire"
        actor: BackupOperator
        preconditions:
          - "the agent has no BackupSet in state IN {INITIAL_RUNNING, ACTIVE, SUSPENDED} (else ERR_ACTIVE_BACKUP_SET_PRESENT)"
        side_effects:
          - "BackupGroup.agent_count -= 1"
          - "recompute BackupGroup.expected_daily_transactions and BackupGroup.member_transaction_share"
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /agents/{id}/block"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "every BackupSet of the agent -> SUSPENDED"
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /agents/{id}/unblock"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "every BackupSet of the agent in SUSPENDED -> ACTIVE"

  # --- 8. StoragePod: cyclic repair loop, gated by the account posture ------
  - entity: StoragePod
    initial_state: HEALTHY
    terminal_states: []
    transitions:
      - from: HEALTHY
        to: DEGRADED
        trigger: "POST /storage-pods/{id}/shards/fail"
        actor: SystemOperator
        preconditions:
          - "failed_shards after the increment is >= 1 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "recompute StoragePod.reliability_pct and StoragePod.is_reconstructable"
      - from: DEGRADED
        to: REPAIRING
        trigger: "POST /storage-pods/{id}/begin-repair"
        actor: SystemOperator
        preconditions:
          - "StoragePod.is_reconstructable == true (else ERR_POD_UNRECOVERABLE)"
        side_effects:
          - "recompute StoragePod.reliability_pct"
      - from: REPAIRING
        to: HEALTHY
        trigger: "POST /storage-pods/{id}/complete-repair"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "StoragePod.failed_shards = 0"
          - "StoragePod.last_repair_utc = logical clock"
          - "recompute StoragePod.reliability_pct and StoragePod.is_reconstructable"
      - from: DEGRADED
        to: FAILED
        trigger: "POST /storage-pods/{id}/shards/fail"
        actor: SystemOperator
        preconditions:
          - "failed_shards after the increment is > parity_shards (else the pod stays DEGRADED)"
        side_effects:
          - "recompute StoragePod.reliability_pct and StoragePod.is_reconstructable"
      - from: FAILED
        to: REPAIRING
        trigger: "POST /storage-pods/{id}/begin-repair"
        actor: SystemOperator
        preconditions:
          - "failed_shards has been reduced to <= parity_shards via POST /storage-pods/{id}/shards/restore (else ERR_POD_UNRECOVERABLE)"
        side_effects:
          - "recompute StoragePod.reliability_pct"

  # --- 9. Account ------------------------------------------------------------
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system event: billing-period close produces total_cents >= DELINQUENCY_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "the closing BillingPeriod's total_cents >= DELINQUENCY_THRESHOLD_CENTS (else the account stays ACTIVE)"
        side_effects:
          - "every BackupSet of the account in ACTIVE -> SUSPENDED"
          - "BackupGroup.group_retention_days is unchanged; retention continues to run while the account is delinquent"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /accounts/{id}/reinstate"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "every BackupSet of the account in SUSPENDED -> ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "every DataDeletionRequest of the account is in state IN {COMPLETED} with deletion_scope == ACCOUNT_CLOSURE (else ERR_CLOSURE_DELETION_REQUIRED)"
          - "every BackupSet of the account is in state IN {DELETED} (else ERR_CLOSURE_SETS_REMAIN)"
        side_effects:
          - "every Agent of the account -> RETIRED"
          - "recompute Account.usage_gb = 0"
      - from: DELINQUENT
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "every DataDeletionRequest of the account is in state IN {COMPLETED} with deletion_scope == ACCOUNT_CLOSURE (else ERR_CLOSURE_DELETION_REQUIRED)"
          - "every BackupSet of the account is in state IN {DELETED} (else ERR_CLOSURE_SETS_REMAIN)"
        side_effects:
          - "every Agent of the account -> RETIRED"
          - "recompute Account.usage_gb = 0"

# =============================================================================
# §1.2.1 Concurrency Rules (true races, resolved by OCC on the parent version)
# =============================================================================
concurrency_rules:
  - rule_id: restore-request-stale-account
    parent_entity: Account
    write_endpoint: "POST /restore-requests"
    occ_field: "expected_account_version"
    description: |
      Creating a RestoreRequest against an Account whose version has advanced
      since the client last observed it is rejected. Any earlier restore that
      completed, reversed, or triggered a shipment close legitimately advances
      Account.version, so the client's carried version is stale even though a
      fresh create would otherwise be valid.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: retention-change-stale-group
    parent_entity: BackupGroup
    write_endpoint: "POST /retention-change-requests"
    occ_field: "expected_group_version"
    description: |
      Submitting a RetentionChangeRequest against a BackupGroup whose version
      has advanced since the client last observed it is rejected. Applying a
      prior change legitimately supersedes the observed group state, so the
      carried version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deletion-request-stale-account
    parent_entity: Account
    write_endpoint: "POST /data-deletion-requests"
    occ_field: "expected_account_version"
    description: |
      Submitting a DataDeletionRequest against an Account whose version has
      advanced since the client last observed it is rejected. A concurrently
      applied retention change or a completed restore advances the account
      version, making the carried value stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 instance A: retention window, provisional vs effective --------
  - name: effective_retention_days
    trigger: "group creation, retention-change apply, policy create, backup-set create"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned; each step consumes the previous result.
        1. base            = Account has_extended_history ? EXTENDED_RETENTION_DAYS : BASE_RETENTION_DAYS
        2. account_window  = Account.retention_days == null ? base : Account.retention_days
        3. group_request   = BackupGroup.retention_days_override
        4. active_policy   = the group's ACTIVE GroupPolicy of policy_kind RETENTION
        5. floor           = active_policy == null ? 0 : active_policy.min_retention_days
        6. ceiling         = active_policy == null ? NONE : active_policy.max_extended_history_days
        7. requested       = group_request == null ? account_window : group_request
        8. capped          = ceiling == NONE ? requested : min(requested, ceiling)
        9. group_retention_days = max(capped, floor)
       10. Account.retention_days = max over its groups of group_retention_days (0 when the account has no group)
       11. Account.has_extended_history = (Account.retention_days > BASE_RETENTION_DAYS)
    input_set: "Every ACTIVE BackupGroup of the account; a SUPERSEDED GroupPolicy is excluded from steps 4-6."
    constants:
      BASE_RETENTION_DAYS: 30
      EXTENDED_RETENTION_DAYS: 365
    precision: "integer days, no rounding"
    variants:
      - name: provisional_account_window
        when: "Account.retention_days was never written by an explicit retention change"
        difference: "Steps 1-2 return the tier default (30 or 365); the group request alone decides the effective window."

  # --- Rule 1 instance B: egress volume, metered vs protected ---------------
  - name: billable_egress_gb
    trigger: "restore-request begin, restore-request prepare, restore-request complete, billing-period close"
    algorithm: threshold
    formula: |
      raw_egress_gb        = RestoreRequest.requested_size_gb
      free_allowance_gb    = min(raw_egress_gb, FREE_EGRESS_GB)
      billable_partial_gb  = raw_egress_gb - free_allowance_gb
      overage_gb           = max(0, raw_egress_gb - OVERSIZE_THRESHOLD_GB)
      billable_egress_gb   = billable_partial_gb + overage_gb * OPERATOR_SURCHARGE_RATE
    input_set: "FILE_DOWNLOAD, ZIP_ARCHIVE and DRIVE_SHIPMENT restores all accrue egress; a CANCELLED or REVERSED request accrues none."
    constants:
      FREE_EGRESS_GB: 1.0
      OVERSIZE_THRESHOLD_GB: 500
      OPERATOR_SURCHARGE_RATE: 0.25
      RANSOMWARE_PROTECTED_GB: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: protected_allowance
        when: "the restore is a ransomware recovery (is_ransomware_recovery == true)"
        difference: "billable_egress_gb = max(0, raw_egress_gb - RANSOMWARE_PROTECTED_GB); the free allowance and the oversize surcharge do not apply. For a single 700 GB restore the metered variant yields 749.00 GB while this variant yields 600.00 GB."

  # --- Rule 2 mode (a): erasure-coding geometry -----------------------------
  - name: delinquency_threshold
    trigger: "billing-period close"
    algorithm: threshold
    formula: |
      Account.status ACTIVE -> DELINQUENT when the closing BillingPeriod.total_cents
      is >= DELINQUENCY_THRESHOLD_CENTS; the comparison is inclusive.
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 5000
    precision: "integer cents"

  - name: pod_reliability_pct
    trigger: "storage-pod shard failure, shard restore, repair completion"
    algorithm: weighted_scoring
    formula: |
      parity_shards            = total_shards - data_shards
      failure_tolerance        = parity_shards
      unrecoverable_probability= C(total_shards, parity_shards + 1) * ANNUAL_SHARD_FAILURE_RATE ^ (parity_shards + 1)
      reliability_pct          = round_half_up(100 * (1 - unrecoverable_probability), 6)
      is_reconstructable       = (failed_shards <= parity_shards)
    input_set: "One StoragePod row; failed_shards is an instantaneous counter, not cumulative."
    constants:
      ANNUAL_SHARD_FAILURE_RATE: 0.01
    precision: "6 decimal places, round_half_up"

  # --- Rule 2 mode (b): billing total, pinned rounding order ----------------
  - name: storage_charge_cents
    trigger: "billing-period close"
    algorithm: tiered_pricing
    formula: |
      Rounding order is pinned: every per-term value is floored to integer cents
      BEFORE the terms are summed; there is no final rounding pass.
      period_days       = integer days from period_start_utc to period_end_utc
      active_days       = clamp(restore_active_days, 0, period_days)
      weighted_avg_gb   = (usage_gb_avg * (period_days - active_days) + peak_usage_gb * active_days) / period_days
      gross_storage_cents = floor(weighted_avg_gb * STORAGE_TIER_RATE_CENTS_PER_GB_MONTH[Account.storage_tier] * period_days / DAYS_PER_MONTH)
      credit_observed_cents = floor(initial_full_backup_gb * STORAGE_TIER_RATE_CENTS_PER_GB_MONTH[Account.storage_tier])
      initial_upload_credit_cents = min(credit_observed_cents, CREDIT_CAP_CENTS)
      storage_credit_applied_cents = min(gross_storage_cents, initial_upload_credit_cents)
      storage_fee_cents = gross_storage_cents - storage_credit_applied_cents
      egress_fee_cents  = floor(egress_gb * EGRESS_TIER_RATES_CENTS_PER_GB[Account.storage_tier])
      transaction_fee_cents = transaction_count * PER_TRANSACTION_CENTS
      total_cents = storage_fee_cents + egress_fee_cents + transaction_fee_cents
    input_set: "Exactly one account, one open BillingPeriod; the initial-upload credit is consumed by the FIRST closed period of the account and is 0 for every later period."
    constants:
      DAYS_PER_MONTH: 30
      STORAGE_TIER_RATE_CENTS_PER_GB_MONTH: { BASIC: 6, PLUS: 5, PRO: 4 }
      EGRESS_TIER_RATES_CENTS_PER_GB: { BASIC: 1, PLUS: 1, PRO: 1 }
      PER_TRANSACTION_CENTS: 1
      CREDIT_CAP_CENTS: 20000
    precision: "integer cents; floor after each term"
    variants:
      - name: straight_average
        when: "the account requested no restore in the period (restore_active_days == 0)"
        difference: "weighted_avg_gb collapses to usage_gb_avg, so a peak-heavy month bills lower than the metered variant: with usage_gb_avg 100, peak_usage_gb 300, restore_active_days 3 and 30 period days the gross_storage_cents is 720 under the metered variant and 600 under this variant, before the one-time upload credit."

  # --- Rule 3+4 mode (c): circular-looking egress fee -----------------------
  - name: restore_egress_fee_cents
    trigger: "restore-request validate, restore-request begin, restore-request prepare"
    algorithm: threshold
    formula: |
      Evaluation order is pinned so the circular term is well-defined.
        1. per_gb_rate_cents    = EGRESS_TIER_RATES_CENTS_PER_GB[Account.storage_tier]
        2. transaction_fee_cents= restore_transaction_count * PER_TRANSACTION_CENTS
        3. raw_fee_cents        = billable_egress_gb * per_gb_rate_cents
        4. wallet_discount_pct  = 0.10 if raw_fee_cents >= DISCOUNT_HIGH_MIN_CENTS
                                  0.05 if raw_fee_cents >= DISCOUNT_LOW_MIN_CENTS
                                  0.00 otherwise
        5. discount_cents       = raw_fee_cents * wallet_discount_pct
        6. net_fee_cents        = raw_fee_cents - discount_cents + transaction_fee_cents
        7. egress_fee_cents     = smallest integer >= net_fee_cents (ceiling)
      The discount tier is keyed on raw_fee_cents, which is itself derived from
      billable_egress_gb; the pinned order above resolves the apparent circularity.
    input_set: "One RestoreRequest; restore_transaction_count is the number of metadata transactions the restore issued."
    constants:
      DISCOUNT_LOW_MIN_CENTS: 10000
      DISCOUNT_HIGH_MIN_CENTS: 20000
      PER_TRANSACTION_CENTS: 5
    precision: "ceiling to integer cents"

  # --- Rule 2 mode (b) companion: aggregation with pinned order ------------
  - name: group_transaction_share
    trigger: "backup-set file-version create, agent activate, agent retire"
    algorithm: chronological
    formula: |
      Walk the account's groups in ascending BackupGroup.created_seq.
      For each group:
        increments_day           = (tier == HIGH_FREQUENCY) ? 96 : 24
        deduplicated_transactions= count of distinct (backup_set_id, file_path) pairs in the group
                                   that recorded a CREATE or MODIFY version in the last completed day
        marginal_transactions    = max(0, increments_day - deduplicated_transactions)
        member_transaction_share = marginal_transactions / max(1, total_marginal_transactions)
      total_marginal_transactions = sum of marginal_transactions over all groups of the account.
      Ties in created_seq are broken by earliest created_at; id is never consulted.
    input_set: "All ACTIVE BackupGroups of the account; groups in SUSPENDED are excluded from both numerator and denominator."
    precision: "2 decimal places, round_half_up"

  # --- Rule 5: retention floor ----------------------------------------------
  - name: retention_floor_utc
    trigger: "backup-set file-version create, data-deletion execute, retention-change apply"
    algorithm: chronological
    formula: |
      candidates = every FileVersion of the set with is_expired == false and is_deleted == false
      retention_floor_utc = min(event_utc over candidates)
      When candidates is empty the floor is null and recovery_points == 0.
      Equal event_utc values are broken by earliest FileVersion.created_at; id is never consulted.
    input_set: "One BackupSet; expired and DELETE versions are excluded."
    precision: "ISO 8601 UTC, second precision"

  # --- Rule 6: version chain ------------------------------------------------
  - name: version_chain_depth
    trigger: "backup-set file-version create, data-deletion execute"
    algorithm: projection
    formula: |
      Walk every FileVersion of the set in ascending (event_utc, created_at).
      Maintain depth = 0 and open = false.
        operation == CREATE  -> open = true;  depth = 1
        operation == MODIFY  -> open = true;  depth = depth + 1
        operation == DELETE  -> open = false; depth = 0
      version_chain_depth = depth after the final version.
      A DELETE therefore collapses the chain to 0; a later MODIFY restarts it at 1,
      it does not resume the pre-delete count.
    input_set: "All FileVersion rows of one BackupSet, expired or not."
    precision: "integer count"

  # --- Rule 3 companion: recovery points ------------------------------------
  - name: recovery_points
    trigger: "backup-set file-version create, retention-change apply"
    algorithm: aggregation
    formula: |
      RESTORE_POINT_ELIGIBLE  = versions with is_expired == false.
      recovery_points = count of distinct event_utc values in RESTORE_POINT_ELIGIBLE.
      Version rows sharing an event_utc collapse to one recovery point; the
      representative row is the one with the smallest created_at.
    input_set: "One BackupSet; expired versions are excluded."
    precision: "integer count"

  # --- Rule 2 mode (a) companion: account usage ----------------------------
  - name: account_usage_gb
    trigger: "backup-set file-version create, backup-set delete, data-deletion execute, billing-period close"
    algorithm: aggregation
    formula: |
      live_bytes   = sum of FileVersion.size_bytes over the account's sets where is_expired == false
                     and is_deleted == false
      staged_bytes = sum of FileVersion.size_bytes over the account's sets where is_expired == false
                     and is_deleted == true
      Account.usage_gb  = round_half_up(live_bytes / GB_BYTES, 2)
      Account.peak_usage_gb = max(Account.peak_usage_gb, Account.usage_gb)
      The staged DELETE rows do not contribute to usage_gb, which is why a
      ransomware-deleted file that is still recoverable does not change billing.
    input_set: "All BackupSets of the account that are in state IN {INITIAL_RUNNING, ACTIVE, SUSPENDED}; DELETED sets contribute 0."
    constants:
      GB_BYTES: 1073741824.0
    precision: "2 decimal places, round_half_up"

  # --- Rule 1 companion: ransomware detection ------------------------------
  - name: ransomware_recovery_flag
    trigger: "restore-request validate"
    algorithm: threshold
    formula: |
      del_events = distinct event_utc values among the subject set's FileVersion rows with operation == DELETE
      is_ransomware_recovery = (count of del_events strictly AFTER restore_point_in_utc) >= 1
      The restore point must lie BEFORE the destructive event: a restore point that
      precedes at least one DELETE is recovering data the encryption wiped. An equal
      event_utc does not count; the comparison is strict.
    input_set: "One RestoreRequest against one BackupSet."
    precision: "boolean"

  # --- Rule 9 instance B: deletion purge conservation ----------------------
  - name: deletion_purge_conservation
    trigger: "data-deletion execute, data-deletion complete"
    algorithm: conservation_law
    formula: |
      Let target = the set of FileVersion rows the scope selects:
        DELETED_FILES  -> every row of the account with is_deleted == true OR is_expired == true
        ACCOUNT_CLOSURE-> every row of the account
      files_purged = count(target)
      bytes_purged = sum(FileVersion.size_bytes for r in target)
      Invariant: Account.usage_gb_before - Account.usage_gb_after
                 == round_half_up(sum of size_bytes of purged rows that were live / GB_BYTES, 2)
                 - round_half_up(sum of size_bytes of purged rows that were staged / GB_BYTES, 2)
      The DELETED_FILES scope conserves usage_gb exactly (its targets are all
      already staged and therefore already excluded from usage_gb).
    input_set: "One DataDeletionRequest in state EXECUTING."
    precision: "2 decimal places, round_half_up"

  # --- Rule 9 companion: deposit conservation ------------------------------
  - name: deposit_conservation
    trigger: "drive-shipment ship, mark-delinquent, close"
    algorithm: conservation_law
    formula: |
      Account.deposit_held_cents = sum over the account's driveshipping shipments d of
          ( d.state IN {PREPARING, SHIPPED, DELIVERED, AWAITING_RETURN} ? d.drive_count * d.deposit_fee_cents : 0 )
        + sum over d with d.was_delinquent of ( d.drive_count * LATE_RETURN_PENALTY_CENTS_PER_DRIVE )
      A CLOSED shipment contributes nothing refundable but keeps its forfeited penalty outstanding.
      The invariant holds at every state of the shipment lifecycle.
    constants:
      LATE_RETURN_PENALTY_CENTS_PER_DRIVE: 2500
    input_set: "All DriveShipment rows of one account."
    precision: "integer cents"

  # --- Rule 6 companion: pod shard geometry --------------------------------
  - name: pod_shard_geometry
    trigger: "storage-pod shards/fail, storage-pod shards/restore, storage-pod begin-repair, storage-pod complete-repair"
    algorithm: constraint_propagation
    formula: |
      parity_shards   = total_shards - data_shards
      is_reconstructable = (failed_shards <= parity_shards)
      pod_status:
        failed_shards == 0                    -> HEALTHY
        1 <= failed_shards <= parity_shards   -> DEGRADED
        failed_shards >  parity_shards        -> FAILED
      evaluated in that order; the first matching branch wins.
    input_set: "One StoragePod row."
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and parse to a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The acting role must be permitted for this operation; AccountOwner must own the referenced account"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints
    note: "Role mismatch and cross-account ownership violations both land here."

  - priority: 3
    category: existence
    check: "Path and body resource ids must exist, validated left-to-right in path order then in input-declaration order"
    error_id: "ERR_ACCOUNT_NOT_FOUND / ERR_GROUP_NOT_FOUND / ERR_AGENT_NOT_FOUND / ERR_BACKUP_SET_NOT_FOUND / ERR_RESTORE_REQUEST_NOT_FOUND / ERR_SHIPMENT_NOT_FOUND / ERR_RETENTION_CHANGE_NOT_FOUND / ERR_DELETION_REQUEST_NOT_FOUND / ERR_STORAGE_POD_NOT_FOUND / ERR_FILE_VERSION_NOT_FOUND / ERR_POLICY_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints carrying resource ids

  - priority: 4
    category: state
    check: "The target resource must be in a state that admits the requested operation"
    error_id: "ERR_INVALID_STATE / ERR_AGENT_NOT_ACTIVE / ERR_ACCOUNT_DELINQUENT / ERR_INITIAL_BACKUP_EMPTY"
    http_status: 409
    applies_to: state-dependent operations

  - priority: 5
    category: business_safety
    check: "Compliance and safety gates: cooling-off windows, litigation holds, MFA for restore, retention floors and ceilings"
    error_id: "ERR_COOLING_OFF_ACTIVE / ERR_LITIGATION_HOLD_ACTIVE / ERR_MFA_REQUIRED / ERR_DELETION_AUTHORIZATION_MISSING / ERR_DELETION_COOLING_OFF_ACTIVE / ERR_RETENTION_BELOW_POLICY_FLOOR / ERR_RETENTION_ABOVE_POLICY_CEILING / ERR_RESTORE_POINT_TOO_RECENT"
    http_status: 422
    applies_to: retention, deletion and restore operations

  - priority: 6
    category: business_referential
    check: "Referential and uniqueness constraints: version sequencing, hostname uniqueness, account ceiling, durability geometry"
    error_id: "ERR_VERSION_CONFLICT / ERR_AGENT_HOSTNAME_TAKEN / ERR_LICENSE_TIER_EXCEEDED / ERR_RETENTION_HOLD_ACTIVE / ERR_POD_UNRECOVERABLE / ERR_SHIPMENT_ALREADY_CLOSED / ERR_RETURN_WINDOW_OPEN"
    http_status: 409
    applies_to: create and transition operations

  - priority: 7
    category: business_fiscal
    check: "Capacity and billing-related limits: drive capacity, transaction ceilings, deposit limits"
    error_id: "ERR_DRIVE_CAPACITY_EXCEEDED / ERR_RESTORE_POINT_EXPIRED / ERR_CLOSURE_SETS_REMAIN / ERR_CLOSURE_DELETION_REQUIRED / ERR_NO_CHANGE_DETECTED"
    http_status: 402
    applies_to: restore, shipment and closure operations

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Clock (test-driving) and account ---
  - method: POST
    path: "/backup-provider/_clock/set_current_utc"
    description: "Set the logical clock. The server starts every process at the fixed default 2026-09-01T00:00:00Z and never consults real wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock reads exactly the supplied instant for every subsequent request"]

  - method: POST
    path: "/backup-provider/accounts"
    description: "Create an account"
    roles: [AccountOwner, SystemOperator]
    code: 201
    input: [name, account_type, region, "storage_tier?", encryption_key_id, "usage_gb?"]
    output: Account
    side_effects: ["status=ACTIVE; retention_days seeded to the tier default; deposit_held_cents=0"]

  - method: GET
    path: "/backup-provider/accounts"
    description: "List accounts"
    roles: [SystemOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "account_type?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/accounts/{id}"
    description: "Get one account"
    roles: [AccountOwner, SystemOperator, ComplianceOfficer, RetentionOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/backup-provider/accounts/{id}/reinstate"
    description: "Reinstate a delinquent account"
    roles: [SystemOperator]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status ACTIVE; every BackupSet in SUSPENDED -> ACTIVE", "increments Account.version by 1"]

  - method: POST
    path: "/backup-provider/accounts/{id}/close"
    description: "Close an account once all sets are deleted and the closure deletion is completed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status=CLOSED; every Agent -> RETIRED; Account.usage_gb=0", "increments Account.version by 1"]

  # --- Backup groups ---
  - method: POST
    path: "/backup-provider/backup-groups"
    description: "Create a backup group under an account"
    roles: [AccountOwner, SystemOperator]
    code: 201
    input: [account_id, name, tier, "retention_days_override?"]
    output: BackupGroup
    side_effects: ["status=ACTIVE; created_seq assigned; recompute group_retention_days, expected_daily_transactions, member_transaction_share"]
    note: "account_id is a parent reference, not an OCC target; no expected_account_version is required here."

  - method: GET
    path: "/backup-provider/backup-groups"
    description: "List backup groups"
    roles: [AccountOwner, SystemOperator, RetentionOfficer]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "BackupGroup[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/backup-groups/{id}"
    description: "Get one backup group"
    roles: [AccountOwner, SystemOperator, RetentionOfficer]
    code: 200
    input: []
    output: BackupGroup
    side_effects: []

  - method: POST
    path: "/backup-provider/backup-groups/{id}/suspend"
    description: "Suspend a group whose retention is below the account window"
    roles: [RetentionOfficer]
    code: 200
    input: []
    output: BackupGroup
    side_effects: ["every Agent of the group -> BLOCKED", "increments BackupGroup.version by 1"]

  - method: POST
    path: "/backup-provider/backup-groups/{id}/resume"
    description: "Resume a suspended group"
    roles: [RetentionOfficer]
    code: 200
    input: []
    output: BackupGroup
    side_effects: ["every Agent of the group -> ACTIVE", "increments BackupGroup.version by 1"]

  # --- Group policies ---
  - method: POST
    path: "/backup-provider/backup-groups/{id}/policies"
    description: "Create a group policy; supersedes the group's prior ACTIVE policy of the same kind"
    roles: [RetentionOfficer]
    code: 201
    input: [policy_kind, "min_retention_days?", max_extended_history_days, "min_restore_point_age_hours?", "require_mfa_for_restore?", effective_from_utc]
    output: GroupPolicy
    side_effects: ["status=ACTIVE; any prior ACTIVE policy of the same kind -> SUPERSEDED", "recompute the group's group_retention_days and the account's retention_days"]

  - method: GET
    path: "/backup-provider/backup-groups/{id}/policies"
    description: "List a group's policies, newest first"
    roles: [RetentionOfficer, AccountOwner, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GroupPolicy[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/group-policies/{id}"
    description: "Get one group policy"
    roles: [RetentionOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: GroupPolicy
    side_effects: []

  # --- Agents ---
  - method: POST
    path: "/backup-provider/agents"
    description: "Install a client agent into a group"
    roles: [BackupOperator]
    code: 201
    input: [account_id, group_id, hostname, os_type, license_type, throttle_month]
    output: Agent
    side_effects: ["status=PENDING_AUTH"]

  - method: GET
    path: "/backup-provider/agents"
    description: "List agents"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer]
    code: 200
    input: ["account_id?", "group_id?", "status?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/agents/{id}"
    description: "Get one agent"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: POST
    path: "/backup-provider/agents/{id}/activate"
    description: "Activate an installed agent after the license ceiling and hostname checks pass"
    roles: [BackupOperator]
    code: 200
    input: []
    output: Agent
    side_effects: ["Agent.status=ACTIVE; group agent_count += 1; recompute expected_daily_transactions and member_transaction_share", "increments Agent.version by 1"]

  - method: POST
    path: "/backup-provider/agents/{id}/retire"
    description: "Retire an agent that has no live backup set"
    roles: [BackupOperator]
    code: 200
    input: []
    output: Agent
    side_effects: ["Agent.status=RETIRED; group agent_count -= 1 when the agent was ACTIVE", "increments Agent.version by 1"]

  - method: POST
    path: "/backup-provider/agents/{id}/block"
    description: "Block an agent; suspends all its sets"
    roles: [SystemOperator]
    code: 200
    input: []
    output: Agent
    side_effects: ["Agent.status=BLOCKED; every BackupSet of the agent -> SUSPENDED", "increments Agent.version by 1"]

  - method: POST
    path: "/backup-provider/agents/{id}/unblock"
    description: "Unblock an agent; reactivates its suspended sets"
    roles: [SystemOperator]
    code: 200
    input: []
    output: Agent
    side_effects: ["Agent.status=ACTIVE; every BackupSet of the agent in SUSPENDED -> ACTIVE", "increments Agent.version by 1"]

  # --- Backup sets and file versions ---
  - method: POST
    path: "/backup-provider/backup-sets"
    description: "Provision a backup set for an agent"
    roles: [BackupOperator]
    code: 201
    input: [agent_id, account_id, durability_class]
    output: BackupSet
    side_effects: ["state=PROVISIONING; created_seq assigned"]

  - method: GET
    path: "/backup-provider/backup-sets"
    description: "List backup sets"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer]
    code: 200
    input: ["agent_id?", "account_id?", "state?", "limit?", "offset?"]
    output: "BackupSet[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/backup-sets/{id}"
    description: "Get one backup set"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer, AccountOwner]
    code: 200
    input: []
    output: BackupSet
    side_effects: []

  - method: POST
    path: "/backup-provider/backup-sets/{id}/file-versions"
    description: "Record a file change; on a PROVISIONING set this also starts the throttled initial full backup"
    roles: [BackupOperator]
    code: 201
    input: [file_path, version_number, operation, size_bytes, content_hash, event_utc]
    output: FileVersion
    side_effects:
      - "state PROVISIONING -> INITIAL_RUNNING on the first non-DELETE version"
      - "recompute BackupSet.storage_gb, version_chain_depth, recovery_points, retention_floor_utc, last_backup_at"
      - "recompute Account.usage_gb, Account.peak_usage_gb, Account.initial_full_backup_gb"
      - "recompute Agent.last_change_sequence, Agent.data_stored_gb"
      - "recompute BackupGroup.group_retention_days, expected_daily_transactions, member_transaction_share"
      - "increments BackupSet.version by 1"

  - method: GET
    path: "/backup-provider/backup-sets/{id}/file-versions"
    description: "List a set's file versions, optionally filtered by path, operation or liveness"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer, AccountOwner]
    code: 200
    input: ["file_path?", "operation?", "is_expired?", "is_deleted?", "include_expired?", "limit?", "offset?"]
    output: "FileVersion[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/file-versions/{id}"
    description: "Get one file version"
    roles: [BackupOperator, SystemOperator, ComplianceOfficer, AccountOwner]
    code: 200
    input: []
    output: FileVersion
    side_effects: []

  - method: POST
    path: "/backup-provider/backup-sets/{id}/complete-initial"
    description: "End the throttled initial full backup and promote the set to continuous incremental capture"
    roles: [BackupOperator]
    code: 200
    input: []
    output: BackupSet
    side_effects: ["state INITIAL_RUNNING -> ACTIVE; is_initial_flush=false; Agent.in_throttle_window=false", "increments BackupSet.version by 1"]

  - method: POST
    path: "/backup-provider/backup-sets/{id}/suspend"
    description: "Suspend a set while the account carries an overdue open billing period"
    roles: [BackupOperator]
    code: 200
    input: []
    output: BackupSet
    side_effects: ["state ACTIVE -> SUSPENDED; Agent.status=BLOCKED", "increments BackupSet.version by 1"]

  - method: POST
    path: "/backup-provider/backup-sets/{id}/delete"
    description: "Delete a set and purge its versions"
    roles: [BackupOperator, ComplianceOfficer]
    code: 200
    input: []
    output: BackupSet
    side_effects: ["state -> DELETED; every FileVersion purged; recompute Account.usage_gb and peak_usage_gb", "increments BackupSet.version by 1"]

  # --- Restore requests ---
  - method: POST
    path: "/backup-provider/restore-requests"
    description: "Create a restore request; the OCC guard rejects a stale expected_account_version"
    roles: [AccountOwner]
    code: 201
    input: [account_id, subject_agent_id, restore_point_in_utc, restore_type, requested_file_count, requested_size_gb, "restore_transaction_count?", "requester_mfa_ticket?", "drive_capacity_gb?", "drive_count?", "deposit_fee_cents?", expected_account_version]
    output: RestoreRequest
    side_effects: ["state=REQUESTED", "increments Account.version by 1"]

  - method: GET
    path: "/backup-provider/restore-requests"
    description: "List restore requests"
    roles: [AccountOwner, SystemOperator, ComplianceOfficer]
    code: 200
    input: ["account_id?", "subject_agent_id?", "state?", "restore_type?", "limit?", "offset?"]
    output: "RestoreRequest[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/restore-requests/{id}"
    description: "Get one restore request"
    roles: [AccountOwner, SystemOperator, ComplianceOfficer]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: []

  - method: POST
    path: "/backup-provider/restore-requests/{id}/validate"
    description: "Move a restore request into validation, computing the ransomware flag and archive entry count"
    roles: [AccountOwner]
    code: 200
    input: ["requester_mfa_ticket?"]
    output: RestoreRequest
    side_effects: ["state REQUESTED -> VALIDATING; recompute is_ransomware_recovery and archive_entry_count", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/return-to-draft"
    description: "Send a validating request back to REQUESTED, clearing the computed flags"
    roles: [AccountOwner]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state VALIDATING -> REQUESTED; clear is_ransomware_recovery and archive_entry_count", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/begin"
    description: "Begin a restore; for a drive shipment this synthesizes the DriveShipment row"
    roles: [AccountOwner]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state VALIDATING -> IN_PROGRESS; recompute egress_gb and egress_fee_cents", "create a DriveShipment in PREPARING when restore_type == DRIVE_SHIPMENT", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/prepare"
    description: "Prepare the restore payload; refuses when any requested version has expired"
    roles: [AccountOwner]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state IN_PROGRESS -> READY; recompute archive_entry_count", "a linked DriveShipment in PREPARING -> SHIPPED", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/complete"
    description: "Complete a restore and accrue its egress against the account"
    roles: [AccountOwner]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state READY -> COMPLETED; Account.restore_download_gb += egress_gb; Account.transaction_count += 1", "a linked DriveShipment in RETURNED -> CLOSED (cascade hop 1)", "increments RestoreRequest.version by 1; increments Account.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/fail"
    description: "Fail a ready restore"
    roles: [SystemOperator]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state READY -> FAILED; a linked DriveShipment -> DELINQUENT", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/cancel"
    description: "Cancel a restore before it starts producing output"
    roles: [AccountOwner]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state REQUESTED or VALIDATING -> CANCELLED; no egress accrues", "increments RestoreRequest.version by 1"]

  - method: POST
    path: "/backup-provider/restore-requests/{id}/reverse"
    description: "Reverse a completed restore; the compensating action debits the egress it accrued"
    roles: [SystemOperator]
    code: 200
    input: []
    output: RestoreRequest
    side_effects: ["state READY -> REVERSED; Account.restore_download_gb -= egress_gb; Account.transaction_count -= 1", "increments RestoreRequest.version by 1; increments Account.version by 1"]

  # --- Drive shipments ---
  - method: GET
    path: "/backup-provider/drive-shipments"
    description: "List drive shipments"
    roles: [SystemOperator, AccountOwner, ComplianceOfficer]
    code: 200
    input: ["restore_request_id?", "account_id?", "state?", "limit?", "offset?"]
    output: "DriveShipment[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/drive-shipments/{id}"
    description: "Get one drive shipment"
    roles: [SystemOperator, AccountOwner, ComplianceOfficer]
    code: 200
    input: []
    output: DriveShipment
    side_effects: []

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/ship"
    description: "Ship the drives and start the return window"
    roles: [SystemOperator]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state PREPARING -> SHIPPED; shipped_at=logical clock; recompute return_deadline_utc and Account.deposit_held_cents", "increments DriveShipment.version by 1"]

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/deliver"
    description: "Mark the drives as delivered"
    roles: [SystemOperator]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state SHIPPED -> DELIVERED", "increments DriveShipment.version by 1"]

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/open-return-window"
    description: "Open the return window once the customer has the drives"
    roles: [AccountOwner]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state DELIVERED -> AWAITING_RETURN", "increments DriveShipment.version by 1"]

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/receive-return"
    description: "Receive returned drives; from DELINQUENT the late penalty stays applied"
    roles: [SystemOperator]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state AWAITING_RETURN or DELINQUENT -> RETURNED; recompute return_credit_cents", "increments DriveShipment.version by 1"]

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/mark-delinquent"
    description: "Mark a shipment delinquent once the return deadline has passed"
    roles: [SystemOperator]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state AWAITING_RETURN -> DELINQUENT; was_delinquent=true; recompute return_credit_cents and Account.deposit_held_cents", "increments DriveShipment.version by 1"]

  - method: POST
    path: "/backup-provider/drive-shipments/{id}/close"
    description: "Close a shipment; releases or forfeits the deposit and closes the account's open billing period"
    roles: [SystemOperator]
    code: 200
    input: []
    output: DriveShipment
    side_effects: ["state RETURNED -> CLOSED; recompute Account.deposit_held_cents", "every OPEN BillingPeriod of the account is recomputed and closed (cascade hops 2-3)", "increments DriveShipment.version by 1"]

  # --- Billing periods ---
  - method: POST
    path: "/backup-provider/billing-periods"
    description: "Open a billing period for an account"
    roles: [SystemOperator]
    code: 201
    input: [account_id, period_start_utc, period_end_utc, "restore_active_days?"]
    output: BillingPeriod
    side_effects: ["state=OPEN; recompute usage_gb_avg and peak_usage_gb from the account's sets"]

  - method: GET
    path: "/backup-provider/billing-periods"
    description: "List billing periods"
    roles: [SystemOperator, AccountOwner]
    code: 200
    input: ["account_id?", "state?", "limit?", "offset?"]
    output: "BillingPeriod[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/billing-periods/{id}"
    description: "Get one billing period"
    roles: [SystemOperator, AccountOwner]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []

  - method: POST
    path: "/backup-provider/billing-periods/{id}/close"
    description: "Close a billing period, computing every charge term"
    roles: [SystemOperator]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["state OPEN -> CLOSED; recompute storage_fee_cents, initial_upload_credit_cents, storage_credit_applied_cents, egress_fee_cents, transaction_fee_cents and total_cents", "an account still ACTIVE whose total_cents >= DELINQUENCY_THRESHOLD_CENTS -> DELINQUENT with all its ACTIVE sets suspended", "increments BillingPeriod.version by 1"]

  # --- Retention change requests ---
  - method: POST
    path: "/backup-provider/retention-change-requests"
    description: "Submit a retention change; the OCC guard rejects a stale expected_group_version"
    roles: [RetentionOfficer]
    code: 201
    input: [account_id, group_id, requested_retention_days, reason_code, expected_group_version]
    output: RetentionChangeRequest
    side_effects: ["state=SUBMITTED", "increments BackupGroup.version by 1"]

  - method: GET
    path: "/backup-provider/retention-change-requests"
    description: "List retention change requests"
    roles: [RetentionOfficer, ComplianceOfficer, AccountOwner]
    code: 200
    input: ["account_id?", "group_id?", "state?", "reason_code?", "limit?", "offset?"]
    output: "RetentionChangeRequest[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/retention-change-requests/{id}"
    description: "Get one retention change request"
    roles: [RetentionOfficer, ComplianceOfficer, AccountOwner]
    code: 200
    input: []
    output: RetentionChangeRequest
    side_effects: []

  - method: POST
    path: "/backup-provider/retention-change-requests/{id}/begin-cooling-off"
    description: "Begin the cooling-off window, applying the policy floor and ceiling"
    roles: [RetentionOfficer]
    code: 200
    input: []
    output: RetentionChangeRequest
    side_effects: ["state SUBMITTED -> COOLING_OFF; recompute cooling_off_until_utc and original_retention_days", "increments RetentionChangeRequest.version by 1"]

  - method: POST
    path: "/backup-provider/retention-change-requests/{id}/apply"
    description: "Apply the retention change to the group"
    roles: [RetentionOfficer]
    code: 200
    input: []
    output: RetentionChangeRequest
    side_effects: ["state COOLING_OFF -> APPLIED (terminal); recompute the group's group_retention_days, the account's retention_days and has_extended_history", "recompute recoverable_until_utc and is_expired on every FileVersion of the group's sets", "increments RetentionChangeRequest.version by 1"]

  - method: POST
    path: "/backup-provider/retention-change-requests/{id}/reject"
    description: "Reject a retention change during cooling off"
    roles: [RetentionOfficer]
    code: 200
    input: []
    output: RetentionChangeRequest
    side_effects: ["state COOLING_OFF -> REJECTED; group retention unchanged", "increments RetentionChangeRequest.version by 1"]

  - method: POST
    path: "/backup-provider/retention-change-requests/{id}/resubmit"
    description: "Resubmit a rejected request with a different value, returning it to SUBMITTED"
    roles: [RetentionOfficer]
    code: 200
    input: [requested_retention_days]
    output: RetentionChangeRequest
    side_effects: ["state REJECTED -> SUBMITTED; clears cooling_off_until_utc", "increments RetentionChangeRequest.version by 1"]

  - method: POST
    path: "/backup-provider/retention-change-requests/{id}/expire"
    description: "Expire a cooling-off request whose window has long passed"
    roles: [SystemOperator]
    code: 200
    input: []
    output: RetentionChangeRequest
    side_effects: ["state COOLING_OFF -> EXPIRED (terminal)", "increments RetentionChangeRequest.version by 1"]

  # --- Data deletion requests ---
  - method: POST
    path: "/backup-provider/data-deletion-requests"
    description: "Submit a deletion request; the OCC guard rejects a stale expected_account_version"
    roles: [ComplianceOfficer, AccountOwner]
    code: 201
    input: [account_id, deletion_scope, authorization_ref, expected_account_version]
    output: DataDeletionRequest
    side_effects: ["state=SUBMITTED", "increments Account.version by 1"]

  - method: GET
    path: "/backup-provider/data-deletion-requests"
    description: "List data deletion requests"
    roles: [ComplianceOfficer, AccountOwner, SystemOperator]
    code: 200
    input: ["account_id?", "state?", "deletion_scope?", "limit?", "offset?"]
    output: "DataDeletionRequest[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/data-deletion-requests/{id}"
    description: "Get one data deletion request"
    roles: [ComplianceOfficer, AccountOwner, SystemOperator]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: []

  - method: POST
    path: "/backup-provider/data-deletion-requests/{id}/approve"
    description: "Approve a deletion request after the authorization and litigation-hold checks"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: ["state SUBMITTED -> APPROVED; approved_at_utc=logical clock; recompute executability_utc", "when deletion_scope == ACCOUNT_CLOSURE every BackupSet -> SUSPENDED", "increments DataDeletionRequest.version by 1"]

  - method: POST
    path: "/backup-provider/data-deletion-requests/{id}/reject"
    description: "Reject a deletion request"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: ["state SUBMITTED -> REJECTED (terminal); for ACCOUNT_CLOSURE every BackupSet returns to ACTIVE", "increments DataDeletionRequest.version by 1"]

  - method: POST
    path: "/backup-provider/data-deletion-requests/{id}/execute"
    description: "Execute the purge once the deletion cooling-off has elapsed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: ["state APPROVED -> EXECUTING; purge FileVersion rows per scope", "recompute BackupSet.storage_gb, version_chain_depth, recovery_points, retention_floor_utc (cascade hop 1)", "recompute Account.usage_gb and peak_usage_gb (cascade hop 2)", "for ACCOUNT_CLOSURE: Account.status=CLOSED, every Agent -> RETIRED, every BackupSet -> DELETED", "increments DataDeletionRequest.version by 1; increments Account.version by 1"]

  - method: POST
    path: "/backup-provider/data-deletion-requests/{id}/complete"
    description: "Mark an executing deletion complete and stamp the purge counters"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: ["state EXECUTING -> COMPLETED; set files_purged and bytes_purged", "increments DataDeletionRequest.version by 1"]

  # --- Storage pods ---
  - method: POST
    path: "/backup-provider/storage-pods"
    description: "Register a storage pod with its erasure-coding geometry"
    roles: [SystemOperator]
    code: 201
    input: [region, total_shards, data_shards, "failed_shards?"]
    output: StoragePod
    side_effects: ["status=HEALTHY; recompute parity_shards, reliability_pct and is_reconstructable"]

  - method: GET
    path: "/backup-provider/storage-pods"
    description: "List storage pods"
    roles: [SystemOperator, ComplianceOfficer]
    code: 200
    input: ["region?", "status?", "limit?", "offset?"]
    output: "StoragePod[]"
    side_effects: []

  - method: GET
    path: "/backup-provider/storage-pods/{id}"
    description: "Get one storage pod"
    roles: [SystemOperator, ComplianceOfficer]
    code: 200
    input: []
    output: StoragePod
    side_effects: []

  - method: POST
    path: "/backup-provider/storage-pods/{id}/shards/fail"
    description: "Record additional unreadable shards on a pod"
    roles: [SystemOperator]
    code: 200
    input: [failed_shards_delta]
    output: StoragePod
    side_effects: ["recompute failed_shards, reliability_pct, is_reconstructable and pod status", "increments StoragePod.version by 1"]

  - method: POST
    path: "/backup-provider/storage-pods/{id}/shards/restore"
    description: "Reduce a pod's unreadable shard count"
    roles: [SystemOperator]
    code: 200
    input: [failed_shards_delta]
    output: StoragePod
    side_effects: ["recompute failed_shards, reliability_pct, is_reconstructable and pod status", "increments StoragePod.version by 1"]

  - method: POST
    path: "/backup-provider/storage-pods/{id}/begin-repair"
    description: "Begin repairing a degraded pod whose geometry can still reconstruct"
    roles: [SystemOperator]
    code: 200
    input: []
    output: StoragePod
    side_effects: ["state DEGRADED or FAILED -> REPAIRING", "increments StoragePod.version by 1"]

  - method: POST
    path: "/backup-provider/storage-pods/{id}/complete-repair"
    description: "Complete a repair, restoring the pod to full health"
    roles: [SystemOperator]
    code: 200
    input: []
    output: StoragePod
    side_effects: ["state REPAIRING -> HEALTHY; failed_shards=0; last_repair_utc=logical clock", "increments StoragePod.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, unknown field, or out-of-range value" }
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or naming an undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not permitted for the operation, or an AccountOwner does not own the referenced account" }
  # --- Not found ---
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "The account id in the path or body does not exist" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "The backup group id does not exist" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "The agent id does not exist" }
  - { id: ERR_BACKUP_SET_NOT_FOUND, http: 404, condition: "The backup set id does not exist" }
  - { id: ERR_RESTORE_REQUEST_NOT_FOUND, http: 404, condition: "The restore request id does not exist" }
  - { id: ERR_RETENTION_CHANGE_NOT_FOUND, http: 404, condition: "The retention change request id does not exist" }
  - { id: ERR_DELETION_REQUEST_NOT_FOUND, http: 404, condition: "The data deletion request id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "The drive shipment id does not exist" }
  - { id: ERR_STORAGE_POD_NOT_FOUND, http: 404, condition: "The storage pod id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "The group policy id does not exist" }
  - { id: ERR_BILLING_PERIOD_NOT_FOUND, http: 404, condition: "The billing period id does not exist" }
  - { id: ERR_FILE_VERSION_NOT_FOUND, http: 404, condition: "The file version id does not exist" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state that admits the requested transition" }
  - { id: ERR_AGENT_NOT_ACTIVE, http: 409, condition: "A backup set cannot start against an agent whose status is not ACTIVE" }
  - { id: ERR_ACCOUNT_DELINQUENT, http: 409, condition: "The operation requires an account that is not DELINQUENT" }
  - { id: ERR_INITIAL_BACKUP_EMPTY, http: 409, condition: "The initial full backup has no non-DELETE version to promote" }
  - { id: ERR_SHIPMENT_ALREADY_CLOSED, http: 409, condition: "A restore cannot be reversed once its drive shipment has closed" }
  # --- Business safety / compliance ---
  - { id: ERR_COOLING_OFF_ACTIVE, http: 422, condition: "A retention downgrade or expiry was requested before its cooling-off window elapsed" }
  - { id: ERR_LITIGATION_HOLD_ACTIVE, http: 422, condition: "A deletion request was approved while a LITIGATION_HOLD retention request governs a group of the account" }
  - { id: ERR_MFA_REQUIRED, http: 422, condition: "The group policy requires MFA for restore and no requester_mfa_ticket was supplied" }
  - { id: ERR_DELETION_AUTHORIZATION_MISSING, http: 422, condition: "A deletion approval was attempted with an empty authorization_ref" }
  - { id: ERR_DELETION_COOLING_OFF_ACTIVE, http: 422, condition: "Deletion execution was attempted before the deletion cooling-off window elapsed" }
  - { id: ERR_RETENTION_BELOW_POLICY_FLOOR, http: 422, condition: "The requested retention window is below the group policy's min_retention_days" }
  - { id: ERR_RETENTION_ABOVE_POLICY_CEILING, http: 422, condition: "The requested retention window exceeds the group policy's max_extended_history_days" }
  - { id: ERR_RESTORE_POINT_TOO_RECENT, http: 422, condition: "The restore point predates the group policy's minimum restore-point age" }
  # --- Business referential / uniqueness ---
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "The supplied file version_number is not one greater than the current chain head for that path" }
  - { id: ERR_AGENT_HOSTNAME_TAKEN, http: 409, condition: "Another agent of the same account already uses this hostname" }
  - { id: ERR_LICENSE_TIER_EXCEEDED, http: 409, condition: "The agent licence type exceeds the account type ceiling" }
  - { id: ERR_RETENTION_HOLD_ACTIVE, http: 409, condition: "A backup set cannot be deleted while its versions are within the retention grace window" }
  - { id: ERR_POD_UNRECOVERABLE, http: 409, condition: "A storage pod cannot begin repair while failed_shards exceeds parity_shards" }
  - { id: ERR_RETURN_WINDOW_OPEN, http: 409, condition: "A shipment cannot be marked delinquent while its return deadline is still open" }
  - { id: ERR_POLICY_FLOOR_SATISFIED, http: 409, condition: "The group cannot be suspended because its retention already meets the account window" }
  - { id: ERR_THROTTLE_WINDOW_CLOSED, http: 409, condition: "The initial full backup cannot start outside the agent's reserved throttle month" }
  - { id: ERR_POLICY_REQUIRED, http: 409, condition: "The agent's group has no ACTIVE RETENTION policy, so a backup set cannot start" }
  - { id: ERR_ACTIVE_BACKUP_SET_PRESENT, http: 409, condition: "An agent with a live backup set cannot be retired" }
  - { id: ERR_RETENTION_CHANGE_CONFLICT, http: 409, condition: "The group already has another in-flight retention change request" }
  - { id: ERR_DUPLICATE_REQUEST, http: 409, condition: "A rejected retention request was resubmitted with an unchanged value" }
  # --- Business fiscal / capacity ---
  - { id: ERR_DRIVE_SHIPMENT_NOT_PERMITTED, http: 402, condition: "Drive shipment restores require a BUSINESS or ENTERPRISE account" }
  - { id: ERR_DRIVE_CAPACITY_EXCEEDED, http: 402, condition: "The requested restore volume exceeds drive_capacity_gb times drive_count" }
  - { id: ERR_RESTORE_POINT_EXPIRED, http: 402, condition: "At least one file requested by the restore has expired at the requested restore point" }
  - { id: ERR_CLOSURE_SETS_REMAIN, http: 402, condition: "Account closure was attempted while a backup set is not DELETED" }
  - { id: ERR_CLOSURE_DELETION_REQUIRED, http: 402, condition: "Account closure was attempted without a COMPLETED ACCOUNT_CLOSURE deletion request" }
  - { id: ERR_NO_CHANGE_DETECTED, http: 402, condition: "A MODIFY version was recorded whose content_hash equals the prior version's" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "An expected_*_version payload field does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountOwner
    description: "The customer whose account owns the backups; drives restore and retention workflows on their own account."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /restore-requests"
      - "POST /restore-requests/{id}/validate"
      - "POST /restore-requests/{id}/return-to-draft"
      - "POST /restore-requests/{id}/begin"
      - "POST /restore-requests/{id}/prepare"
      - "POST /restore-requests/{id}/complete"
      - "POST /restore-requests/{id}/cancel"
      - "POST /drive-shipments/{id}/open-return-window"
    shared_operations: ["GET /restore-requests", "GET /drive-shipments", "GET /backup-sets", "GET /billing-periods"]

  - name: BackupOperator
    description: "Operates the client agents: installs them, manages backup sets and records file changes."
    identity: "opaque"
    exclusive_operations:
      - "POST /agents"
      - "POST /agents/{id}/activate"
      - "POST /agents/{id}/retire"
      - "POST /backup-sets"
      - "POST /backup-sets/{id}/file-versions"
      - "POST /backup-sets/{id}/complete-initial"
      - "POST /backup-sets/{id}/suspend"
    shared_operations: ["GET /agents", "GET /backup-sets", "GET /agents/{id}", "GET /backup-sets/{id}"]

  - name: RetentionOfficer
    description: "Owns retention policy: writes group policies and adjudicates retention change requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /backup-groups/{id}/policies"
      - "POST /backup-groups/{id}/suspend"
      - "POST /backup-groups/{id}/resume"
      - "POST /retention-change-requests"
      - "POST /retention-change-requests/{id}/begin-cooling-off"
      - "POST /retention-change-requests/{id}/apply"
      - "POST /retention-change-requests/{id}/reject"
      - "POST /retention-change-requests/{id}/resubmit"
    shared_operations: ["GET /retention-change-requests", "GET /backup-groups", "GET /group-policies/{id}"]

  - name: ComplianceOfficer
    description: "Adjudicates data deletion requests and account closure; may not perform any operation reserved to AccountOwner."
    identity: "opaque"
    exclusive_operations:
      - "POST /data-deletion-requests/{id}/approve"
      - "POST /data-deletion-requests/{id}/reject"
      - "POST /data-deletion-requests/{id}/execute"
      - "POST /data-deletion-requests/{id}/complete"
      - "POST /accounts/{id}/close"
    shared_operations: ["GET /data-deletion-requests", "GET /accounts", "GET /storage-pods"]

  - name: SystemOperator
    description: "Runs the storage fabric and the plumbing transitions the automated billing path cannot perform itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /storage-pods"
      - "POST /storage-pods/{id}/shards/fail"
      - "POST /storage-pods/{id}/shards/restore"
      - "POST /storage-pods/{id}/begin-repair"
      - "POST /storage-pods/{id}/complete-repair"
      - "POST /billing-periods"
      - "POST /billing-periods/{id}/close"
      - "POST /accounts/{id}/reinstate"
      - "POST /drive-shipments/{id}/ship"
      - "POST /drive-shipments/{id}/deliver"
      - "POST /drive-shipments/{id}/receive-return"
      - "POST /drive-shipments/{id}/mark-delinquent"
      - "POST /drive-shipments/{id}/close"
      - "POST /restore-requests/{id}/fail"
      - "POST /restore-requests/{id}/reverse"
      - "POST /agents/{id}/block"
      - "POST /agents/{id}/unblock"
      - "POST /retention-change-requests/{id}/expire"
    shared_operations: ["GET /storage-pods", "GET /drive-shipments", "GET /agents"]