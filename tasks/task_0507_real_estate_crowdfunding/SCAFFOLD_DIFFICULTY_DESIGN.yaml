          - errors[ERR_OFFERING_NOT_OPEN]
        distinguishing_aspect: "A POST /subscriptions that BOTH carries a stale expected_fund_version AND targets a fund now CLOSED_TO_NEW fails the OCC state check (priority 6, state) before the offering referential check (priority 7, business_referential): ERR_STALE_FUND_VERSION wins — a state-vs-business_referential pair distinct from the safety-vs-fiscal conflict above."
        test_recipe:
          setup:
