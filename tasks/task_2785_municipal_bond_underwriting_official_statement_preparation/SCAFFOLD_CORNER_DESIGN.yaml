              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: { starts_at: "2026-08-03T12:00:00.000Z", ends_at: "2026-08-03T13:00:00.000Z", attendee_count: 4 }
              as: MunicipalAdvisor
