# =============================================================================
# SCAFFOLD CORNER DESIGN — task_2779_live_video_commerce_operations (§1.9)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; corners it already asserts appear here as
# `excluded_because:` stubs with no test_recipe.
#
# Reusable setup fragments are YAML anchors named `k_*`, each defined at its
# first use and aliased afterwards (`- *k_show`). The canonical base chain and
# the state it produces:
#   k_clock_t0      logical clock -> 2026-08-01T00:00:00Z
#   k_host          Host ada-vance, commission_pct 0.08            -> ${h1}
#   k_cert          host certified until 2026-12-31T23:59:59Z
#   k_viewer1/2     Viewers                                        -> ${v1} ${v2}
#   k_product       Product SKU-ROBE base 4000 cost 1500 on_hand 50 -> ${p1}
#   k_substantiate  claim SUBSTANTIATED by X-User-ID co-claims-1
#   k_show          Show 2026-08-10T18:00Z-20:00Z                  -> ${sh1}
#   k_booking       PRIMARY booking 17:00Z-20:30Z                  -> ${b1}
#   k_disclosure    PAID_ENDORSEMENT disclosure, PENDING           -> ${d1}
#   k_confirm/k_ack booking CONFIRMED, disclosure ACKNOWLEDGED
#   k_slot          LineupSlot seq 1 on ${p1}                      -> ${sl1}
#   k_offer         FlashOffer 3500 cents, 18:00Z-19:00Z, max 10   -> ${o1}
#   k_channel       StreamChannel FLAGSHIP_APP target 1500 primary -> ${ch1}
#   k_provision     channel PROVISIONED
#   k_health_ok     report 1500 ms / 0.0 frames -> channel index 100
#   k_ready         Show READY, simulcast_readiness_index 100
#   k_clock_prelive 2026-08-10T17:50:00Z   (inside the go-live window)
#   k_golive        Show LIVE, went_live_at 2026-08-10T17:50:00Z
#   k_clock_live    2026-08-10T18:10:00Z   (inside the offer window)
#   k_activate      FlashOffer ${o1} ACTIVE
#   k_cart1/k_cart2 OPEN carts of ${v1} / ${v2}                    -> ${ct1} ${ct2}
# Cart.version is never a literal: POST /carts/{id}/items returns a CartItem, so
# every checkout captures the version from a preceding GET /carts/{cart_id}.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: product_creation_initialises_inventory_pool
        claim_type: creation
        grounds:
          - entities.Product.fields.available_qty
          - entities.Product.fields.claim_substantiation_status
          - endpoints[POST /products]
        distinguishing_aspect: "POST /products returns 201 with the three-way inventory pool initialised (available_qty == on_hand_qty, reserved_qty == 0, committed_qty == 0) and the claim posture at UNSUBSTANTIATED with no substantiating officer recorded."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &k_clock_t0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_product
              call: "POST /products"
              payload: { sku: "SKU-ROBE", title: "Silk Wrap Robe", base_price_cents: 4000, unit_cost_cents: 1500, on_hand_qty: 50, claim_text: "Machine washable mulberry silk" }
              as: MerchandisingManager
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201; Product.${p1}.on_hand_qty == 50, reserved_qty == 0, committed_qty == 0, available_qty == 50"
            - "Product.${p1}.claim_substantiation_status == UNSUBSTANTIATED, substantiated_by_user_id == null, substantiated_at == null"
            - "Product.${p1}.base_price_cents == 4000 and unit_cost_cents == 1500 and claim_text == 'Machine washable mulberry silk'"

      - name: lineup_slots_listing_paginates_by_show
        claim_type: listing
        grounds:
          - endpoints[GET /lineup-slots]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /lineup-slots?show_id=...&limit=2 returns exactly 2 of the show's 3 slots with total_count 3 and has_more true, and offset 2 returns the remaining 1 with has_more false."
        test_recipe:
          setup:
            - "One DRAFT show with three lineup slots (sequences 1, 2, 3) on the same product."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - &k_show
              call: "POST /shows"
              payload: { title: "Silk Sunday", scheduled_start_at: "2026-08-10T18:00:00Z", scheduled_end_at: "2026-08-10T20:00:00Z" }
              as: ShowProducer
              captures: { sh1: $.data.id }
            - &k_slot
              call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "${p1}", slot_sequence: 1, planned_start_at: "2026-08-10T18:05:00Z", planned_end_at: "2026-08-10T18:35:00Z", planned_qty: 20 }
              as: MerchandisingManager
              captures: { sl1: $.data.id, sl1_v: $.data.version }
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "${p1}", slot_sequence: 2, planned_start_at: "2026-08-10T18:40:00Z", planned_end_at: "2026-08-10T18:50:00Z", planned_qty: 5 }
              as: MerchandisingManager
              captures: { sl1b: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "${p1}", slot_sequence: 3, planned_start_at: "2026-08-10T18:55:00Z", planned_end_at: "2026-08-10T19:05:00Z", planned_qty: 5 }
              as: MerchandisingManager
              captures: { sl1c: $.data.id }
          trigger:
            - call: "GET /lineup-slots"
              payload: { show_id: "${sh1}", limit: 2, offset: 0 }
              as: MerchandisingManager
            - call: "GET /lineup-slots"
              payload: { show_id: "${sh1}", limit: 2, offset: 2 }
              as: MerchandisingManager
          assert:
            - "First page: HTTP 200, response_type == array, 2 items, meta pagination total_count == 3 and has_more == true"
            - "Second page: 1 item, total_count == 3, has_more == false"
            - "Every returned row has show_id == ${sh1}; the three ids ${sl1}, ${sl1b}, ${sl1c} appear exactly once across the two pages"

      - name: flash_offer_allotment_ledger_computed_at_creation
        claim_type: computed_fields
        grounds:
          - entities.FlashOffer.fields.remaining_qty
          - entities.FlashOffer.fields.held_qty
          - endpoints[POST /flash-offers]
        distinguishing_aspect: "A freshly created FlashOffer reports held_qty 0, sold_qty 0 and remaining_qty == max_qty (10) with status SCHEDULED and activated_at null — the ledger is derived, never supplied by the client."
        test_recipe:
          setup:
            - "A DRAFT show with one lineup slot on SKU-ROBE; the slot version is captured for the OCC input."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - *k_show
            - *k_slot
          trigger:
            - &k_offer
              call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3500, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 10, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { o1: $.data.id }
          assert:
            - "HTTP 201; FlashOffer.${o1}.status == SCHEDULED, activated_at == null, superseded_by_offer_id == null"
            - "FlashOffer.${o1}.max_qty == 10, held_qty == 0, sold_qty == 0, remaining_qty == 10"
            - "LineupSlot.${sl1}.version is one greater than the value captured in ${sl1_v} (offer creation bumps the parent slot)"

      - name: stream_channel_is_primary_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.StreamChannel.fields.is_primary
          - entities.StreamChannel.fields.readiness_index
          - endpoints[POST /stream-channels]
        distinguishing_aspect: "Omitting the optional is_primary field yields is_primary == false, and the new channel starts DRAFT with latency_ms null, dropped_frame_pct 0.0, readiness_index 0 and health_report_count 0."
        test_recipe:
          setup:
            - "One DRAFT show."
          setup_api_calls:
            - *k_clock_t0
            - *k_show
          trigger:
            - call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "SOCIAL_A", target_latency_ms: 2000 }
              as: ShowProducer
              captures: { chD: $.data.id }
          assert:
            - "HTTP 201; StreamChannel.${chD}.is_primary == false"
            - "StreamChannel.${chD}.status == DRAFT, latency_ms == null, dropped_frame_pct == 0.0, readiness_index == 0, health_report_count == 0"
            - "Show.${sh1}.simulcast_readiness_index == 0 (a DRAFT channel is outside the {PROVISIONED, LIVE} input set)"

      - name: stream_channel_target_latency_below_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.StreamChannel.fields.target_latency_ms
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "target_latency_ms == 400 is below the declared 500..8000 range, so POST /stream-channels returns 400 ERR_INVALID_REQUEST and no channel row is created."
        test_recipe:
          setup:
            - "One DRAFT show with no channels."
          setup_api_calls:
            - *k_clock_t0
            - *k_show
          trigger:
            - call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "SOCIAL_B", target_latency_ms: 400 }
              as: ShowProducer
              captures: { err_lat: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_lat} == ERR_INVALID_REQUEST"
            - "GET /stream-channels?show_id=${sh1} returns 0 items"

      - name: host_booking_missing_call_time_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.HostBooking.fields.call_time_at
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "call_time_at has source input with no default, so a POST /host-bookings body omitting it returns 400 ERR_INVALID_REQUEST rather than defaulting the interval."
        test_recipe:
          setup:
            - "One certified host and one DRAFT show."
          setup_api_calls:
            - *k_clock_t0
            - &k_host
              call: "POST /hosts"
              payload: { full_name: "Ada Vance", handle: "ada-vance", commission_pct: 0.08 }
              as: ShowProducer
              captures: { h1: $.data.id }
            - *k_show
          trigger:
            - call: "POST /host-bookings"
              payload: { show_id: "${sh1}", host_id: "${h1}", role: "PRIMARY", release_time_at: "2026-08-10T20:30:00Z", fee_cents: 50000 }
              as: ShowProducer
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_req} == ERR_INVALID_REQUEST"
            - "GET /host-bookings?show_id=${sh1} returns 0 items"

      - name: lineup_slot_unknown_product_returns_not_found
        claim_type: foreign_key_validated
        grounds:
          - entities.LineupSlot.fields.product_id
          - validations[priority=5]
          - errors[ERR_PRODUCT_NOT_FOUND]
        distinguishing_aspect: "entity_topology is flat, so LineupSlot.product_id is validated as a body foreign key: an unknown product id returns 404 ERR_PRODUCT_NOT_FOUND and no slot is created."
        test_recipe:
          setup:
            - "One DRAFT show; no product with the probed id exists."
          setup_api_calls:
            - *k_clock_t0
            - *k_show
          trigger:
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "00000000-0000-4000-8000-0000000000a1", slot_sequence: 1, planned_start_at: "2026-08-10T18:05:00Z", planned_end_at: "2026-08-10T18:35:00Z", planned_qty: 5 }
              as: MerchandisingManager
              captures: { err_prod: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_prod} == ERR_PRODUCT_NOT_FOUND"
            - "GET /lineup-slots?show_id=${sh1} returns 0 items"

      - name: cart_viewer_id_input_ignored_system_assigns_from_header
        claim_type: system_fields
        grounds:
          - entities.Cart.fields.viewer_id
          - endpoints[POST /carts]
        distinguishing_aspect: "Cart.viewer_id has source system and is taken from X-User-ID: a body that names the other viewer's id is ignored and the cart is owned by the acting viewer ${v1}, not ${v2}."
        test_recipe:
          setup:
            - "Two registered viewers and one DRAFT show."
          setup_api_calls:
            - *k_clock_t0
            - &k_viewer1
              call: "POST /viewers"
              payload: { display_name: "Vera One", email: "vera.one@example.com" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
            - &k_viewer2
              call: "POST /viewers"
              payload: { display_name: "Val Two", email: "val.two@example.com" }
              as: PlatformAdmin
              captures: { v2: $.data.id }
            - *k_show
          trigger:
            - call: "POST /carts"
              payload: { show_id: "${sh1}", viewer_id: "${v2}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctX: $.data.id }
          assert:
            - "HTTP 201; Cart.${ctX}.viewer_id == ${v1} (the header identity), never ${v2}"
            - "Cart.${ctX}.status == OPEN, recovered_count == 0, held_item_count == 0, pre_discount_subtotal_cents == 0, bundle_discount_pct == 0.0"
            - "GET /carts?viewer_id=${v2} returns 0 items"

      - name: flash_offer_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_FLASH_OFFER_NOT_FOUND]
        distinguishing_aspect: "GET /flash-offers/{offer_id} with an id no row carries returns 404 ERR_FLASH_OFFER_NOT_FOUND, not an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty database with the clock pinned; no flash offers exist."
          setup_api_calls:
            - *k_clock_t0
          trigger:
            - call: "GET /flash-offers/00000000-0000-4000-8000-0000000000b2"
              payload: {}
              as: MerchandisingManager
              captures: { err_off: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_off} == ERR_FLASH_OFFER_NOT_FOUND"
            - "response_type == error and data carries a human-readable message"

      - name: flash_offers_filtered_by_superseded_by_offer_id
        claim_type: listing
        grounds:
          - entities.FlashOffer.fields.superseded_by_offer_id
          - state_machines.FlashOffer.SCHEDULED_to_SUPERSEDED
          - endpoints[GET /flash-offers]
        distinguishing_aspect: "The self-referential FK is reverse-reachable: after a second, non-overlapping offer is created on the same slot, GET /flash-offers?superseded_by_offer_id=${oB} returns exactly the older offer ${oA} with status SUPERSEDED."
        test_recipe:
          setup:
            - "One slot on SKU-ROBE carrying a SCHEDULED offer for 18:00Z-18:30Z; the slot version is re-read before the second create because the first create bumped it."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - *k_show
            - *k_slot
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3500, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T18:30:00Z", max_qty: 10, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { oA: $.data.id }
            - call: "GET /lineup-slots/${sl1}"
              payload: {}
              as: MerchandisingManager
              captures: { sl1_v2: $.data.version }
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3300, window_start_at: "2026-08-10T18:35:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 8, expected_lineup_slot_version: "${sl1_v2}" }
              as: MerchandisingManager
              captures: { oB: $.data.id }
          trigger:
            - call: "GET /flash-offers"
              payload: { superseded_by_offer_id: "${oB}" }
              as: MerchandisingManager
            - call: "GET /flash-offers"
              payload: { lineup_slot_id: "${sl1}", status: "SCHEDULED" }
              as: MerchandisingManager
          assert:
            - "First list: HTTP 200 with exactly 1 item whose id == ${oA}, status == SUPERSEDED and superseded_by_offer_id == ${oB}"
            - "Second list: exactly 1 item whose id == ${oB}, status == SCHEDULED, remaining_qty == 8"
            - "The two windows do not overlap (18:00-18:30 then 18:35-19:00), so validations priority 15 never fires and the supersede path is reachable"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: show_ready_transition_stamps_readiness_index_and_timestamp
        claim_type: valid_transition
        grounds:
          - state_machines.Show.DRAFT_to_READY
          - entities.Show.fields.readiness_checked_at
          - calculations.simulcast_readiness_index
        distinguishing_aspect: "The DRAFT->READY trigger both moves the status and stamps readiness_checked_at with the logical clock while writing the recomputed simulcast_readiness_index (100 for one channel reporting exactly its target latency and zero dropped frames)."
        test_recipe:
          setup:
            - "Show with a CONFIRMED PRIMARY booking by a certified host, one lineup slot on a SUBSTANTIATED product, and one PROVISIONED channel that has reported a perfect health sample."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - &k_cert
              call: "POST /hosts/${h1}/disclosure-certifications"
              payload: { certified_until: "2026-12-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co-cert-1"
            - *k_product
            - &k_substantiate
              call: "POST /products/${p1}/claim-substantiations"
              payload: { decision: "SUBSTANTIATED", evidence_ref: "LAB-88" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
            - *k_show
            - &k_booking
              call: "POST /host-bookings"
              payload: { show_id: "${sh1}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T17:00:00Z", release_time_at: "2026-08-10T20:30:00Z", fee_cents: 50000 }
              as: ShowProducer
              captures: { b1: $.data.id }
            - &k_confirm
              call: "POST /host-bookings/${b1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - *k_slot
            - &k_channel
              call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "FLAGSHIP_APP", target_latency_ms: 1500, is_primary: true }
              as: ShowProducer
              captures: { ch1: $.data.id }
            - &k_provision
              call: "POST /stream-channels/${ch1}/provision"
              payload: {}
              as: ShowProducer
            - &k_health_ok
              call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 1500, dropped_frame_pct: 0.0 }
              as: ShowProducer
          trigger:
            - &k_ready
              call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
          assert:
            - "HTTP 200; Show.${sh1}.status == READY"
            - "Show.${sh1}.readiness_checked_at == 2026-08-01T00:00:00Z (the pinned logical clock, not wall time)"
            - "Show.${sh1}.simulcast_readiness_index == 100 and StreamChannel.${ch1}.readiness_index == 100, status still PROVISIONED"

      - name: interaction_initial_state_differs_by_kind
        claim_type: initial_state
        grounds:
          - state_machines.Interaction.initial_state
          - entities.Interaction.fields.state
          - entities.Interaction.fields.tallies
        distinguishing_aspect: "Interaction has a kind-dependent initial_state: a host POLL is created OPEN with a zero-filled tally map, while a viewer CHAT on the same live show is created PENDING_MODERATION."
        test_recipe:
          setup:
            - "Show LIVE at 2026-08-10T18:10:00Z with one registered viewer."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - &k_clock_prelive
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:50:00Z" }
              as: PlatformAdmin
            - &k_golive
              call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
            - &k_clock_live
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "POLL", body: "Pick a colour", options: ["Ivory", "Onyx"] }
              as: Host
              as_user_id: "${h1}"
              captures: { pollA: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "Loving this robe" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chatA: $.data.id }
          assert:
            - "Interaction.${pollA}.state == OPEN, host_id == ${h1}, viewer_id == null, vote_count == 0, tallies == {\"0\": 0, \"1\": 0}"
            - "Interaction.${chatA}.state == PENDING_MODERATION, viewer_id == ${v1}, host_id == null, tallies == {} and defer_count == 0"
            - "Both rows carry show_id == ${sh1} and created_at == 2026-08-10T18:10:00Z"

      - name: ready_without_lineup_slots_returns_lineup_empty
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Show.DRAFT_to_READY.preconditions
          - validations[priority=22]
          - errors[ERR_LINEUP_EMPTY]
        distinguishing_aspect: "The DRAFT->READY precondition 'at least one lineup slot' is enforced ahead of the simulcast precondition: a show with a confirmed primary host and a PROVISIONED channel but no slots returns 422 ERR_LINEUP_EMPTY and stays DRAFT."
        test_recipe:
          setup:
            - "Show with a CONFIRMED PRIMARY booking and a PROVISIONED channel, but zero lineup slots."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_channel
            - *k_provision
          trigger:
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
              captures: { err_empty: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_empty} == ERR_LINEUP_EMPTY"
            - "Show.${sh1}.status == DRAFT and readiness_checked_at == null"

      - name: second_confirm_on_confirmed_booking_returns_invalid_booking_state
        claim_type: idempotency
        grounds:
          - state_machines.HostBooking.PENDING_to_CONFIRMED
          - validations[priority=8]
          - errors[ERR_INVALID_BOOKING_STATE]
        distinguishing_aspect: "confirm is not idempotent: replaying it on an already CONFIRMED booking returns 409 ERR_INVALID_BOOKING_STATE and leaves confirmed_at at its first value."
        test_recipe:
          setup:
            - "One CONFIRMED PRIMARY booking; the confirmed_at stamp is read before the replay."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_show
            - *k_booking
            - *k_confirm
            - call: "GET /host-bookings/${b1}"
              payload: {}
              as: ShowProducer
              captures: { b1_conf_at: $.data.confirmed_at, b1_v: $.data.version }
          trigger:
            - call: "POST /host-bookings/${b1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { err_bstate: $.data.error_id }
          assert:
            - "HTTP 409 with ${err_bstate} == ERR_INVALID_BOOKING_STATE"
            - "HostBooking.${b1}.status == CONFIRMED, confirmed_at == ${b1_conf_at} and version == ${b1_v} (the rejected write bumps nothing)"

      - name: booking_cancel_voids_pending_disclosure
        claim_type: side_effect_execution
        grounds:
          - state_machines.DisclosureRecord.PENDING_to_VOIDED
          - state_machines.HostBooking.PENDING_to_CANCELLED
        distinguishing_aspect: "Cancelling a still-PENDING booking cascades onto its PENDING disclosure record, which becomes VOIDED with acknowledged_at left null — the cascade targets the disclosure, not the show, because the booking never reached CONFIRMED."
        test_recipe:
          setup:
            - "A PENDING PRIMARY booking with one PENDING PAID_ENDORSEMENT disclosure attached."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_show
            - *k_booking
            - &k_disclosure
              call: "POST /disclosure-records"
              payload: { show_id: "${sh1}", host_booking_id: "${b1}", disclosure_type: "PAID_ENDORSEMENT", required_script_code: "SCRIPT-PAID-01" }
              as: ShowProducer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /host-bookings/${b1}/cancel"
              payload: { cancel_reason: "HOST_ILLNESS" }
              as: ShowProducer
          assert:
            - "HTTP 200; HostBooking.${b1}.status == CANCELLED and cancel_reason == 'HOST_ILLNESS'"
            - "DisclosureRecord.${d1}.status == VOIDED, acknowledged_at == null, acknowledged_late == false"
            - "Show.${sh1}.status == DRAFT (it was never READY, so no show-level revert applies)"

      - name: primary_booking_cancel_reverts_ready_show_and_cancels_scheduled_offer
        claim_type: cascade_down
        grounds:
          - state_machines.Show.READY_to_DRAFT
          - state_machines.FlashOffer.SCHEDULED_to_CANCELLED
          - state_machines.HostBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Cancelling the CONFIRMED PRIMARY booking of a READY show reverts the show to DRAFT and that revert cancels the slot's SCHEDULED offer, while the already ACKNOWLEDGED disclosure is left untouched (only PENDING disclosures are voided)."
        test_recipe:
          setup:
            - "Show READY with a CONFIRMED PRIMARY booking, an ACKNOWLEDGED disclosure, and a SCHEDULED flash offer."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_disclosure
            - *k_confirm
            - &k_ack
              call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-01" }
              as: Host
              as_user_id: "${h1}"
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
          trigger:
            - call: "POST /host-bookings/${b1}/cancel"
              payload: { cancel_reason: "HOST_ILLNESS" }
              as: ShowProducer
          assert:
            - "HTTP 200; HostBooking.${b1}.status == CANCELLED"
            - "Show.${sh1}.status == DRAFT (READY->DRAFT revert) and simulcast_readiness_index still 100"
            - "FlashOffer.${o1}.status == CANCELLED with activated_at == null"
            - "DisclosureRecord.${d1}.status == ACKNOWLEDGED — the VOID cascade only touches PENDING records"

      - name: channel_failure_reverts_ready_show_and_reprovision_closes_the_cycle
        claim_type: conditional_cascade
        grounds:
          - state_machines.StreamChannel.PROVISIONED_to_FAILED
          - state_machines.StreamChannel.FAILED_to_PROVISIONED
          - state_machines.Show.READY_to_DRAFT
          - calculations.channel_readiness_index
        distinguishing_aspect: "A health report that drives the channel's readiness_index below CHANNEL_FAIL_INDEX fails the show's only channel and reverts READY->DRAFT; re-provisioning plus a healthy report walks the FAILED->PROVISIONED edge and lets the show reach READY again — the cyclic path both opens and closes."
        test_recipe:
          setup:
            - "Show READY with exactly one PROVISIONED channel at readiness_index 100 and no flash offers."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
          trigger:
            - call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 5000, dropped_frame_pct: 0.5 }
              as: ShowProducer
            - call: "POST /stream-channels/${ch1}/provision"
              payload: {}
              as: ShowProducer
            - call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 1500, dropped_frame_pct: 0.0 }
              as: ShowProducer
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
          assert:
            - "After the bad report: StreamChannel.${ch1}.status == FAILED, readiness_index == 0, health_report_count == 2; Show.${sh1}.status == DRAFT and simulcast_readiness_index == 0"
            - "After the re-provision: StreamChannel.${ch1}.status == PROVISIONED with readiness_index still 0; Show.${sh1}.status remains DRAFT (provisioning alone never promotes the show)"
            - "After the healthy report: readiness_index == 100 and Show.${sh1}.simulcast_readiness_index == 100"
            - "The final ready call returns 200 and Show.${sh1}.status == READY, health_report_count == 3"

      - name: settled_show_rejects_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Show.terminal_states
          - validations[priority=8]
          - errors[ERR_INVALID_SHOW_STATE]
        distinguishing_aspect: "SETTLED is terminal: end, ready and a second compliance-signoff each return 409 ERR_INVALID_SHOW_STATE, and settled_at is not rewritten."
        test_recipe:
          setup:
            - "Show driven to SETTLED: LIVE at 17:50Z, ended at 19:00Z, signed off by a compliance officer who did not substantiate the product."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
            - call: "POST /shows/${sh1}/compliance-signoff"
              payload: { attestation_note: "All claims reviewed" }
              as: ComplianceOfficer
              as_user_id: "co-signoff-1"
            - call: "GET /shows/${sh1}"
              payload: {}
              as: ShowProducer
              captures: { sh1_settled_at: $.data.settled_at }
          trigger:
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
              captures: { err_e1: $.data.error_id }
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
              captures: { err_e2: $.data.error_id }
            - call: "POST /shows/${sh1}/compliance-signoff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-signoff-1"
              captures: { err_e3: $.data.error_id }
          assert:
            - "All three calls return 409 and ${err_e1} == ${err_e2} == ${err_e3} == ERR_INVALID_SHOW_STATE"
            - "Show.${sh1}.status == SETTLED and settled_at == ${sh1_settled_at}"
            - "HostBooking.${b1}.status == COMPLETED and StreamChannel.${ch1}.status == ENDED (both already terminal from the show-end cascade)"

      - name: poll_close_freezes_tallies_and_rejects_later_votes
        claim_type: side_effect_execution
        grounds:
          - state_machines.Interaction.OPEN_to_CLOSED
          - validations[priority=25]
          - errors[ERR_POLL_NOT_OPEN]
        distinguishing_aspect: "CLOSE_POLL freezes the tally snapshot: the vote recorded before the close is retained and a vote arriving after it returns 409 ERR_POLL_NOT_OPEN without changing vote_count."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an OPEN two-option poll that viewer 1 has already voted on (option 0)."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_viewer2
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "POLL", body: "Pick a colour", options: ["Ivory", "Onyx"] }
              as: Host
              as_user_id: "${h1}"
              captures: { pollB: $.data.id }
            - call: "POST /interactions/${pollB}/votes"
              payload: { option_index: 0 }
              as: Viewer
              as_user_id: "${v1}"
          trigger:
            - call: "POST /interactions/${pollB}/host-action"
              payload: { action: "CLOSE_POLL" }
              as: Host
              as_user_id: "${h1}"
            - call: "POST /interactions/${pollB}/votes"
              payload: { option_index: 1 }
              as: Viewer
              as_user_id: "${v2}"
              captures: { err_poll: $.data.error_id }
          assert:
            - "Close returns 200; Interaction.${pollB}.state == CLOSED, vote_count == 1, tallies == {\"0\": 1, \"1\": 0}"
            - "The later vote returns 409 with ${err_poll} == ERR_POLL_NOT_OPEN"
            - "Interaction.${pollB}.vote_count is still 1 and tallies unchanged after the rejected vote"

      - name: question_deferral_loop_terminates_at_the_declared_limit
        claim_type: cyclic_loop
        grounds:
          - state_machines.Interaction.ROUTED_to_DEFERRED
          - state_machines.Interaction.DEFERRED_to_QUEUED
          - validations[priority=26]
          - errors[ERR_DEFERRAL_LIMIT_REACHED]
        distinguishing_aspect: "The QUEUED->ROUTED->DEFERRED->QUEUED cycle is walked twice (defer_count 1 then 2) and the third DEFER is refused with 409 ERR_DEFERRAL_LIMIT_REACHED, leaving the question ROUTED and answerable."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with a viewer QUESTION approved into the queue."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "QUESTION", body: "Does it shrink?" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { qA: $.data.id }
            - call: "POST /interactions/${qA}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
          trigger:
            - call: "POST /interactions/${qA}/route"
              payload: {}
              as: Moderator
            - call: "POST /interactions/${qA}/host-action"
              payload: { action: "DEFER" }
              as: Host
              as_user_id: "${h1}"
            - call: "POST /interactions/${qA}/route"
              payload: {}
              as: Moderator
            - call: "POST /interactions/${qA}/host-action"
              payload: { action: "DEFER" }
              as: Host
              as_user_id: "${h1}"
            - call: "POST /interactions/${qA}/route"
              payload: {}
              as: Moderator
            - call: "POST /interactions/${qA}/host-action"
              payload: { action: "DEFER" }
              as: Host
              as_user_id: "${h1}"
              captures: { err_defer: $.data.error_id }
            - call: "POST /interactions/${qA}/host-action"
              payload: { action: "ANSWER", answer_body: "It does not shrink" }
              as: Host
              as_user_id: "${h1}"
          assert:
            - "After the approve the state is QUEUED (not APPROVED — kind QUESTION forks to the queue)"
            - "Each DEFER returns 200 and lands the row back in QUEUED in the same response, with defer_count == 1 then == 2"
            - "The third DEFER returns 409 with ${err_defer} == ERR_DEFERRAL_LIMIT_REACHED; state stays ROUTED and defer_count stays 2"
            - "The final ANSWER returns 200 with state == ANSWERED and answer_body == 'It does not shrink'"

      - name: abandoned_cart_past_its_deadline_expires_at_compliance_signoff
        claim_type: side_effect_execution
        grounds:
          - state_machines.Cart.ABANDONED_to_EXPIRED
          - state_machines.Show.ENDED_to_SETTLED
          - entities.Cart.fields.recovery_deadline_at
        distinguishing_aspect: "compliance-signoff sweeps abandoned carts: a cart abandoned at 18:10Z (recovery_deadline_at 18:30Z) is EXPIRED when the show settles at 18:35Z, and the show's abandonment_rate_bp reads 10000 with margin_final_cents 0 because no order was ever captured."
