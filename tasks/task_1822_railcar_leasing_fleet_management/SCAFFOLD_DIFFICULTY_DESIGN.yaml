            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 6000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance-directives", payload: { directive_code: "DOT-117P", description: "Pressure retrofit", applies_to_car_types: ["TANK_GENERAL"], retrofit_deadline: "2026-12-31", grace_days: 30, daily_penalty_cents: 25000, penalty_cap_cents: 500000 }, as: ComplianceOfficer, captures: { dir: "$.data.id" } }
            - { call: "POST /compliance-directives/${dir}/promote", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "ETHANOL", scheduled_start: "2026-08-10", scheduled_end: "2026-09-10" }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
            - { call: "POST /retrofit-orders", payload: { railcar_id: "${car}", directive_id: "${dir}", scheduled_date: "2026-08-10" }, as: MaintenanceController, captures: { ro: "$.data.id" } }
            - { call: "POST /retrofit-orders/${ro}/start", payload: {}, as: MaintenanceController }
            - { call: "POST /retrofit-orders/${ro}/complete", payload: {}, as: MaintenanceController }
            - { call: "POST /retrofit-orders/${ro}/certify", payload: { certification_ref: "CERT-9203" }, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "ETHANOL", scheduled_start: "2026-08-10", scheduled_end: "2026-09-10" }, as: FleetPlanner, captures: { ok_asg: "$.data.id" } }
          assert:
            - "first create: 422 ERR_TANK_CAR_NONCOMPLIANT while posture NON_COMPLIANT"
            - "after CERTIFIED: Railcar.${car}.compliance_posture == COMPLIANT"
            - "second create: 201, LeaseAssignment.${ok_asg}.status == SCHEDULED, pinned_car_hire_daily_cents == 12000, pinned_mileage_credit_cents == 60"

  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_inclusive_overlap_and_turnaround_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - errors[ERR_CLEANING_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Resource Railcar under inclusive window semantics plus a 3-day turnaround buffer: a
          new window starting exactly on the prior window's end date collides (inclusive ends),
          and a commodity change additionally pushes the earliest start to prior_end + 3 days
          even with a CERTIFIED cleaning on file.
        test_recipe:
          setup:
            - "Tariffs 9000/55; lessee; lease ACTIVE 2026-08-01..2027-07-31; car GATX9301 (built 2015)"
            - "Assignment A GRAIN 2026-08-05..2026-08-15 delivered 08-05 and returned 08-15 (last_commodity GRAIN)"
            - "Cleaning GRAIN -> COAL completed (WASH, 50000) and CERTIFIED after the return"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9301", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-05", scheduled_end: "2026-08-15" }, as: FleetPlanner, captures: { asgA: "$.data.id" } }
            - { call: "POST /lease-assignments/${asgA}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /lease-assignments/${asgA}/return", payload: {}, as: FleetPlanner }
            - { call: "POST /cleaning-records", payload: { railcar_id: "${car}", prior_commodity: "GRAIN", next_commodity: "COAL", planned_date: "2026-08-16" }, as: MaintenanceController, captures: { cl: "$.data.id" } }
            - { call: "POST /cleaning-records/${cl}/complete", payload: { cleaning_grade_performed: "WASH", cost_cents: 50000 }, as: MaintenanceController }
            - { call: "POST /cleaning-records/${cl}/certify", payload: { certificate_ref: "CLN-1" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-15", scheduled_end: "2026-08-25" }, as: FleetPlanner, captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "COAL", scheduled_start: "2026-08-16", scheduled_end: "2026-08-25" }, as: FleetPlanner, captures: { err_buffer: "$.data.error_id" } }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "COAL", scheduled_start: "2026-08-18", scheduled_end: "2026-08-25" }, as: FleetPlanner, captures: { ok_asg: "$.data.id" } }
          assert:
            - "start == prior end (2026-08-15) collides: 422 ERR_ASSIGNMENT_OVERLAP (inclusive window ends)"
            - "commodity change at 2026-08-16 with certified cleaning still fails: 422 ERR_CLEANING_BUFFER_VIOLATION (earliest start 2026-08-18 = end + 3)"
            - "start 2026-08-18 succeeds: 201, LeaseAssignment.${ok_asg}.status == SCHEDULED"
      - name: tariff_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_TARIFF_WINDOW_OVERLAP]
          - entities.TariffRate.fields.effective_to
        distinguishing_aspect: |
          Resource TariffRate (car_type, rate_kind) key space under half-open [from, to)
          semantics — a different interval geometry than the assignment's inclusive windows:
          a window starting exactly at the predecessor's effective_to is legal adjacency, while
          starting one day earlier is an overlap.
        test_recipe:
          setup:
            - "Existing tariff W1: COVERED_HOPPER CAR_HIRE_BASE 9000, [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2026-06-01", unit_rate_cents: 9000 }, as: LeaseAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-06-01", effective_to: "2027-01-01", unit_rate_cents: 9500 }, as: LeaseAdmin, captures: { w2: "$.data.id" } }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-05-31", effective_to: "2026-12-01", unit_rate_cents: 9100 }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent window [2026-06-01, 2027-01-01) created: 201 (half-open end is exclusive, so adjacency is not overlap)"
            - "window from 2026-05-31 rejected: 422 ERR_TARIFF_WINDOW_OVERLAP (one-day intersection with W1)"

  - rule_id: compensating_invariant
    instances:
      - name: pool_commit_cancel_restores_available
        grounds:
          - calculations.calc_capital_pool_available
          - state_machines.PurchaseCommitment.COMMITTED_to_CANCELLED
          - concurrency_rules[pool-commit-stale-version]
        distinguishing_aspect: |
          Conserved quantity capital-pool funds: available_cents = opening + replenishment -
          committed - delivered_spend must return to exactly 100000000 after a commit(30000000)
          + cancel round trip, with the pool version advancing on each mutation.
        test_recipe:
          setup:
            - "CapitalPool fiscal_year 2026, opening_balance_cents 100000000"
          setup_api_calls:
            - { call: "POST /capital-pools", payload: { fiscal_year: 2026, opening_balance_cents: 100000000 }, as: SystemAdmin, captures: { pool: "$.data.id", pool_v: "$.data.version" } }
          trigger:
            - { call: "POST /capital-pools/${pool}/commitments", payload: { car_type: "COVERED_HOPPER", unit_cost_cents: 30000000, expected_pool_version: "${pool_v}" }, as: FleetPlanner, captures: { com: "$.data.id" } }
            - { call: "GET /capital-pools/${pool}", payload: {}, as: FleetPlanner, captures: { avail_mid: "$.data.available_cents" } }
            - { call: "POST /capital-pools/${pool}/commitments/${com}/cancel", payload: {}, as: FleetPlanner }
            - { call: "GET /capital-pools/${pool}", payload: {}, as: FleetPlanner }
          assert:
            - "after commit: available_cents == 70000000 and committed_cents == 30000000"
            - "after cancel: available_cents == 100000000 (== opening_balance_cents; invariant restored exactly)"
            - "PurchaseCommitment.${com}.status == CANCELLED"
      - name: lessee_balance_finalize_settle_round_trip
        grounds:
          - state_machines.CarHireStatement.PROVISIONAL_to_FINALIZED
          - state_machines.CarHireStatement.FINALIZED_to_SETTLED
          - entities.Lessee.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity lessee receivables (different quantity than pool funds): a
          finalize(+224000)/settle(224000) round trip returns outstanding_balance_cents to
          exactly its pre-finalize value 0, and the statement lands in terminal SETTLED.
        test_recipe:
          setup:
            - "Tariffs 9000/55; lessee limit 10000000 balance 0; lease ACTIVE; car GATX9401 delivered 2026-08-01"
            - "August report 1000/200 validated; statement generated PROVISIONAL (net 224000)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 10000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX9401", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
