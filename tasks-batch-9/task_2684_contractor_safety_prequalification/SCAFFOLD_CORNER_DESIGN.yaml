      - name: variance_approval_with_a_non_future_expiry_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /variances/{id}/decision]
          - state_machines.Variance.REQUESTED_to_APPROVED
          - errors.ERR_INVALID_FIELD_VALUE
        distinguishing_aspect: "APPROVE requires expires_at STRICTLY after the logical clock, so an expiry in the past and an expiry exactly equal to the clock both fail with 422, while DENY needs no expires_at at all - the conditional input requirement attaches to one decision value only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification."
            - "Two REQUESTED variances on that row: EMR (requested_value 1.05) and TRIR (requested_value 3.5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/variances"
              payload: { requirement_code: "EMR", requested_value: 1.05, justification: "Carrier restated the 2025 modifier" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { var_emr_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/variances"
              payload: { requirement_code: "TRIR", requested_value: 3.5, justification: "Two recordables came from a single acquired crew" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { var_trir_id: $.data.id }
          trigger:
            - call: "POST /variances/${var_emr_id}/decision"
              payload: { decision: "APPROVE", expires_at: "2026-07-01T00:00:00Z" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /variances/${var_emr_id}/decision"
              payload: { decision: "APPROVE", expires_at: "2026-08-01T00:00:00Z" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /variances/${var_emr_id}/decision"
              payload: { decision: "APPROVE", expires_at: "2026-12-01T00:00:00Z" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /variances/${var_trir_id}/decision"
              payload: { decision: "DENY" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "expires_at in the past: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE and Variance.${var_emr_id}.status still REQUESTED"
            - "expires_at exactly equal to the clock 2026-08-01T00:00:00Z: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE (the comparison is strict)"
            - "expires_at 2026-12-01T00:00:00Z: HTTP 200 with data.status == APPROVED and data.expires_at == 2026-12-01T00:00:00Z"
            - "DENY without expires_at: HTTP 200 with Variance.${var_trir_id}.status == DENIED and expires_at == null"
            - "GET /prequalifications/${pq_id}/variances?status=APPROVED returns exactly 1 row (${var_emr_id})"

      - name: resubmit_written_program_after_deficient_review_returns_it_to_submitted
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /written-programs/{id}/resubmit]
          - state_machines.WrittenProgram.DEFICIENT_to_SUBMITTED
          - calculations.document_review_status
        distinguishing_aspect: "Resubmit is the review loop's only reverse edge: it replaces document_ref and revision_date, CLEARS reviewer_note and reviewed_by_user_id, and drags Prequalification.document_review_status back from DEFICIENT to IN_PROGRESS - and it is legal only from DEFICIENT, so the same call against an ACCEPTED program is refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification."
            - "HAZCOM program reviewed DEFICIENT with a reviewer_note; DISCIPLINE_POLICY program reviewed ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "DEFICIENT", reviewer_note: "Section 5 omits the SDS index" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "DISCIPLINE_POLICY", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-DISC-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_disc_id: $.data.id }
            - call: "POST /written-programs/${wp_disc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /written-programs/${wp_hazcom_id}/resubmit"
              payload: { document_ref: "DOC-HAZCOM-2", revision_date: "2026-07-20T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /written-programs/${wp_disc_id}/resubmit"
              payload: { document_ref: "DOC-DISC-2", revision_date: "2026-07-20T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "before resubmit: Prequalification.${pq_id}.document_review_status == DEFICIENT"
            - "resubmit of the DEFICIENT program: HTTP 200 with data.review_status == SUBMITTED, data.document_ref == \"DOC-HAZCOM-2\", data.revision_date == 2026-07-20T00:00:00Z, data.reviewer_note == null, data.reviewed_by_user_id == null"
            - "after resubmit: Prequalification.${pq_id}.document_review_status == IN_PROGRESS"
            - "resubmit of the ACCEPTED program: HTTP 409 with data.error_id == ERR_TRANSITION_NOT_ALLOWED and WrittenProgram.${wp_disc_id}.document_ref still \"DOC-DISC-1\""

  - section: errors
    instances:
      - name: unknown_path_ids_return_their_entity_specific_not_found_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_PREQUALIFICATION_NOT_FOUND
          - errors.ERR_SITE_NOT_FOUND
          - errors.ERR_WORKER_NOT_FOUND
          - errors.ERR_INSURANCE_CERTIFICATE_NOT_FOUND
          - errors.ERR_IMPROVEMENT_PLAN_NOT_FOUND
          - errors.ERR_RECORD_NOT_FOUND
        distinguishing_aspect: "Priority 5 maps each path segment to ITS OWN 404 code - the same bogus uuid yields five different error_ids depending on the segment it occupies, and only entities without a dedicated code (WrittenProgram) fall through to ERR_RECORD_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the database contains no rows of any of the probed entity types."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /prequalifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /workers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "POST /insurance-certificates/00000000-0000-4000-8000-000000000000/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /improvement-plans/00000000-0000-4000-8000-000000000000/submit"
              payload: { evidence_ref: "EVID-1" }
              as: ContractorAdmin
              as_user_id: "00000000-0000-4000-8000-000000000001"
            - call: "POST /written-programs/00000000-0000-4000-8000-000000000000/resubmit"
              payload: { document_ref: "DOC-X", revision_date: "2026-07-20T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "00000000-0000-4000-8000-000000000001"
          assert:
            - "GET /prequalifications/{bogus}: HTTP 404 with data.error_id == ERR_PREQUALIFICATION_NOT_FOUND"
            - "GET /sites/{bogus}: HTTP 404 with data.error_id == ERR_SITE_NOT_FOUND"
            - "GET /workers/{bogus}: HTTP 404 with data.error_id == ERR_WORKER_NOT_FOUND"
            - "POST /insurance-certificates/{bogus}/verify: HTTP 404 with data.error_id == ERR_INSURANCE_CERTIFICATE_NOT_FOUND"
            - "POST /improvement-plans/{bogus}/submit: HTTP 404 with data.error_id == ERR_IMPROVEMENT_PLAN_NOT_FOUND - the 404 precedes the priority-7 ownership check, so an unknown plan never reports ERR_NOT_RESOURCE_OWNER"
            - "POST /written-programs/{bogus}/resubmit: HTTP 404 with data.error_id == ERR_RECORD_NOT_FOUND"

      - name: site_access_grant_body_fks_resolve_in_the_declared_input_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - endpoints[POST /site-access-grants]
        distinguishing_aspect: "Priority 6 walks the body FKs in the endpoint's declared input order worker_id, site_id, prequalification_id, so a request with ALL THREE bogus returns ERR_WORKER_NOT_FOUND specifically; each subsequent probe fixes one id and shifts the reported code down the list."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults with Site PLANT-7; Contractor Acme with Worker Dana and a DRAFT 2026 prequalification (no grading needed - priority 6 precedes every business gate)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sites"
              payload: { site_code: "PLANT-7", required_hazard_classes: ["GENERAL"] }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { site_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /contractors/${con_id}/workers"
              payload: { full_name: "Dana Ruiz", employee_ref: "EMP-1001", trade_code: "MECHANICAL_TRADE" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { worker_id: $.data.id }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /site-access-grants"
              payload: { worker_id: "00000000-0000-4000-8000-000000000000", site_id: "00000000-0000-4000-8000-000000000000", prequalification_id: "00000000-0000-4000-8000-000000000000", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /site-access-grants"
              payload: { worker_id: "${worker_id}", site_id: "00000000-0000-4000-8000-000000000000", prequalification_id: "00000000-0000-4000-8000-000000000000", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /site-access-grants"
              payload: { worker_id: "${worker_id}", site_id: "${site_id}", prequalification_id: "00000000-0000-4000-8000-000000000000", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "all three bogus: HTTP 404 with data.error_id == ERR_WORKER_NOT_FOUND"
            - "worker real, site and prequalification bogus: HTTP 404 with data.error_id == ERR_SITE_NOT_FOUND"
            - "worker and site real, prequalification bogus: HTTP 404 with data.error_id == ERR_PREQUALIFICATION_NOT_FOUND"
            - "Site.${site_id}.granted_worker_count == 0 after all three attempts and GET /site-access-grants?site_id=${site_id} returns 0 rows"

      - name: suspended_contractor_cannot_open_a_new_prequalification
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - endpoints[PATCH /contractors/{id}]
          - errors.ERR_CONTRACTOR_NOT_ACTIVE
        distinguishing_aspect: "Priority 11 reads the CURRENT Contractor.status, and the OCC check at priority 9 runs first: the request therefore carries the post-PATCH version 2 and still fails with ERR_CONTRACTOR_NOT_ACTIVE (409), and restoring status ACTIVE with a third PATCH lets the identical request through."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults."
            - "Contractor Acme created (version 1) then PATCHed to status SUSPENDED (version 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
            - call: "PATCH /contractors/${con_id}"
              payload: { status: "SUSPENDED" }
              as: NetworkAdmin
              captures: { con_v2: $.data.version }
          trigger:
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v2}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "HTTP 409 with data.error_id == ERR_CONTRACTOR_NOT_ACTIVE"
            - "GET /prequalifications?contractor_id=${con_id} returns total_count == 0"
            - "Contractor.${con_id}.version == 2 - the rejected create bumped nothing"

      - name: second_open_prequalification_for_the_same_client_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_DUPLICATE_PREQUALIFICATION
        distinguishing_aspect: "The duplicate rule has two arms: an in-flight row in {DRAFT, SUBMITTED, UNDER_REVIEW} blocks a new row for the same (contractor_id, client_id) REGARDLESS of cycle_year - so even cycle 2027 is refused - while a second client is unaffected, proving the scope is per client pair and not global per contractor."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; two clients: Northwind Facilities and Southgate Industrial, both on defaults."
            - "Contractor Acme holding one DRAFT 2026 prequalification with Northwind."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_a_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Southgate Industrial", industry_code: "2362" }
              as: NetworkAdmin
              captures: { client_b_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_a_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_a_id: $.data.id }
            - call: "GET /contractors/${con_id}"
              payload: {}
              as: NetworkAdmin
              captures: { con_v2: $.data.version }
          trigger:
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_a_id}", cycle_year: 2027, expected_contractor_version: "${con_v2}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_b_id}", cycle_year: 2026, expected_contractor_version: "${con_v2}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_b_id: $.data.id }
          assert:
            - "same client, different cycle_year: HTTP 409 with data.error_id == ERR_DUPLICATE_PREQUALIFICATION"
            - "different client, same cycle_year: HTTP 201 with data.status == DRAFT"
            - "GET /prequalifications?contractor_id=${con_id} returns total_count == 2 (${pq_a_id} and ${pq_b_id})"

      - name: submit_without_a_governing_statistic_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - state_machines.SafetyStatistic.PENDING_to_REJECTED
          - errors.ERR_STATISTICS_UNVERIFIED
        distinguishing_aspect: "A REJECTED statistic is NOT a governing statistic: with the only 2025 row rejected the row's statistics_verification_status falls back to NOT_SUBMITTED and submit fails at priority 14 BEFORE the missing-program check at 15 - and a fresh PENDING 2024 row is enough to submit, because the provisional variant admits PENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification."
            - "Its only statistic (reporting_year 2025) was REJECTED by the analyst; no written programs exist yet."
          setup_api_calls:
