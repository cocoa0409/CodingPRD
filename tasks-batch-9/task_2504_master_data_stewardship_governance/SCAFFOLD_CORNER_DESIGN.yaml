          setup:
            - "Domain CUSTOMER (DRAFT) with DATA_OWNER + DATA_STEWARD assignments and an ACTIVE AUTHORITATIVE registration on CERTIFIED source ERP; ACTIVE rules QR1 (40 pts, threshold 90.00, HIGH) and QR2 (60 pts, threshold 80.00, LOW)."
