      - name: corner_consistency_response_envelope_shape_on_success_and_error
        claim_type: immediate
        grounds: ["response_envelope.success", "response_envelope.error"]
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; a successful single-resource read sets response_type object, while a not-found read sets response_type error and puts error_id and message under data."
        test_recipe:
          setup: ["One ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { z2_plan: $.data.id }
          trigger:
            - call: "GET /kidswear/plans/${z2_plan}"
              payload: {}
              as: PlatformAdmin
              captures: { z2_tier: $.data.tier }
            - call: "GET /kidswear/plans/99999999-8888-7777-6666-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { z2_err: $.data.error_id, z2_msg: $.data.message }
          assert:
            - "the first call returns HTTP 200 with response_type object and meta.api_request_id present"
            - "the captured z2_tier equals CORE"
            - "the second call returns HTTP 404 with response_type error"
            - "the captured z2_err equals ERR_PLAN_NOT_FOUND"
            - "the captured z2_msg is a non-empty string"

