          - entities.PolicyStateAllocation
        distinguishing_aspect: "GET /policies/{id}/allocations returns nothing at all before calculate-tax runs, then exactly the three persisted rows in state_code ASC order afterwards — the endpoint reads stored PolicyStateAllocation rows rather than recomputing on the fly, and each row carries both its pinned rates and its money fields."
