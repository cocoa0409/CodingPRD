            - "Dispense.${ds1}.gross_fee_cents == Dispense.${ds1}.subsidy_cents + Dispense.${ds1}.payer_due_cents"
            - "after the first fill GET /milk-bank/subsidy-programs/${sp1} returns consumed_cents == 288 and status == EXHAUSTED"
            - "${e1} == ERR_SUBSIDY_PROGRAM_EXHAUSTED with http_status 402"
            - "Prescription.${rx2}.status == QUEUED and Prescription.${rx2}.cumulative_dispensed_ml == 0"
            - "fourth response: http_status == 201 and data.gross_fee_cents == 480 and data.subsidy_cents == 0 and data.payer_due_cents == 480"
            - "Dispense.${ds2}.tier_discount_pct == 0.00 and Dispense.${ds2}.status == DISPENSED"
            - "after the fourth fill GET /milk-bank/subsidy-programs/${sp1} still returns consumed_cents == 288 and status == EXHAUSTED"
            - "MilkLot.${l1}.dispensed_ml == 200 and MilkLot.${l1}.available_ml == 1000 and MilkLot.${l1}.release_status == RELEASED"
            - "Prescription.${rx1}.status == PARTIALLY_FILLED and Prescription.${rx1}.remaining_ml == 100"
            - "Prescription.${rx3}.status == FILLED and Prescription.${rx3}.remaining_ml == 0"

      - name: fill_time_guards_reject_a_back_dated_order_a_cancelled_order_and_a_second_release
        claim_type: violation_to_error
        grounds:
          - validations[priority=56]
          - validations[priority=26]
          - validations[priority=25]
          - errors[ERR_PRESCRIPTION_PAST_NEEDED_BY]
          - errors[ERR_PRESCRIPTION_STATE_INVALID]
          - errors[ERR_LOT_STATE_INVALID]
          - state_machines.Prescription.transitions[QUEUED->CANCELLED]
        distinguishing_aspect: "A prescription written with a needed_by_date already behind the clock is accepted at creation (the sweep only fires on a clock move) and is refused only at fill time with ERR_PRESCRIPTION_PAST_NEEDED_BY, while needed_by_date equal to the clock date is filled; cancelling twice and dispensing against the cancelled order both return ERR_PRESCRIPTION_STATE_INVALID, and re-releasing the RELEASED lot returns ERR_LOT_STATE_INVALID rather than succeeding idempotently."
        test_recipe:
          setup:
            - "Clock 2026-08-10T10:05:00Z; donors DNR-0001..DNR-0003 each gave 1200 ml TERM at 20.0 expressed 2026-07-10, pool POOL-0001 committed at 3600 ml, run PAST-01 thermally PASSED with a 0 CFU culture by u-qa-1."
            - "1200 ml was bottled as lot 20260810-001-01 and u-qa-2 released it; the lot is RELEASED with available_ml 1200."
            - "Three unsubsidised NICU_INPATIENT/CRITICAL prescriptions of 200 ml each were written after the clock move: RX-5001 needed_by 2026-08-05 (behind the clock), RX-5002 needed_by 2026-08-10 (equal to the clock date), RX-5003 needed_by 2026-09-01."
