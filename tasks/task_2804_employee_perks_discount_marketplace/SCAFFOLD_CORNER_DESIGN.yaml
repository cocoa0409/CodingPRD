  - section: endpoints
    instances:
      - name: merchant_crud_creates_reads_lists_and_patches_the_two_mutable_fields
        claim_type: standard_crud
        grounds:
          - endpoints[POST /perks/merchants]
          - endpoints[GET /perks/merchants/{id}]
          - endpoints[GET /perks/merchants]
          - endpoints[PATCH /perks/merchants/{id}]
          - entities.Merchant.fields.region_codes
        distinguishing_aspect: |
          PATCH /perks/merchants/{id} accepts only contact_email and region_codes, so the update
          bumps version to 2 and replaces the region list wholesale while legal_name,
          primary_category, status PROSPECT and every computed counter stay exactly as created;
          the collection read is filterable by status and primary_category.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA", "TX"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id, created_status: $.data.status, created_version: $.data.version, created_regions: $.data.region_codes, created_payable: $.data.accrued_commission_payable_cents, created_agreements: $.data.active_agreement_count, created_score: $.data.fulfillment_failure_score }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Zen Spa", contact_email: "hi@zenspa.example", primary_category: "WELLNESS", region_codes: ["NY"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { other_merchant_id: $.data.id }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { read_name: $.data.legal_name, read_email: $.data.contact_email, read_category: $.data.primary_category }
            - call: "GET /perks/merchants"
              payload: { primary_category: "DINING", status: "PROSPECT", limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { listed_first_id: "$.data[0].id" }
            - call: "PATCH /perks/merchants/${merchant_id}"
              payload: { contact_email: "partners@bistrouno.example", region_codes: ["CA", "NV"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { patched_email: $.data.contact_email, patched_regions: $.data.region_codes, patched_version: $.data.version, patched_status: $.data.status, patched_name: $.data.legal_name }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { reread_email: $.data.contact_email, reread_regions: $.data.region_codes, reread_version: $.data.version }
          assert:
            - "the creation returns HTTP 201 with ${created_status} == PROSPECT, ${created_version} == 1, ${created_regions} == [CA, TX], ${created_payable} == 0, ${created_agreements} == 0 and ${created_score} == 0"
            - "${read_name} == Bistro Uno, ${read_email} == ops@bistrouno.example and ${read_category} == DINING"
            - "${listed_first_id} == ${merchant_id} and the list reports meta.total_count == 1: ${other_merchant_id} is excluded by the primary_category filter"
            - "${patched_email} == partners@bistrouno.example, ${patched_regions} == [CA, NV], ${patched_version} == 2, ${patched_status} == PROSPECT and ${patched_name} == Bistro Uno"
            - "${reread_email} == partners@bistrouno.example, ${reread_regions} == [CA, NV] and ${reread_version} == 2: the region list is replaced, not merged, and TX is gone"

      - name: offer_resume_is_conditional_on_the_window_still_being_open
        claim_type: conditional_action
        grounds:
          - endpoints[POST /perks/offers/{id}/pause]
          - endpoints[POST /perks/offers/{id}/resume]
          - state_machines.Offer.status.PAUSED_to_ACTIVE
          - validations[priority=70]
          - errors[ERR_OFFER_WINDOW_CLOSED]
          - state_machines.Offer.status.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          The identical resume call succeeds at 2026-08-06 and is refused with
          ERR_OFFER_WINDOW_CLOSED at 2026-09-01T00:00:00Z, because the precondition is
          window_end > clock_now and window_end is exactly that instant; the offer stays PAUSED
          until the epoch expires it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with an ACTIVE DINING/CA agreement."
            - "One ACTIVE offer with window 2026-08-01T00:00:00Z .. 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /perks/offers/${offer_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { active_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/offers/${offer_id}/pause"
              payload: { paused_reason: "STOCK_OUTAGE" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { paused_status_1: $.data.status, paused_reason_1: $.data.paused_reason }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/offers/${offer_id}/resume"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { resumed_status: $.data.status, resumed_reason: $.data.paused_reason }
            - call: "POST /perks/offers/${offer_id}/pause"
              payload: { paused_reason: "STOCK_OUTAGE" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { paused_status_2: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/offers/${offer_id}/resume"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_window: $.data.error_id }
            - call: "GET /perks/offers/${offer_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { status_after_refusal: $.data.status, reason_after_refusal: $.data.paused_reason }
            - call: "POST /_ops/run-epoch"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { expired_count: $.data.expired_offer_count }
            - call: "GET /perks/offers/${offer_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { final_status: $.data.status, final_expired_at: $.data.expired_at }
          assert:
            - "${active_status} == ACTIVE"
            - "${paused_status_1} == PAUSED and ${paused_reason_1} == STOCK_OUTAGE"
            - "${resumed_status} == ACTIVE and ${resumed_reason} is null: resuming clears paused_reason"
            - "${paused_status_2} == PAUSED"
            - "${e_window} == ERR_OFFER_WINDOW_CLOSED with HTTP 409 at exactly window_end"
            - "${status_after_refusal} == PAUSED and ${reason_after_refusal} == STOCK_OUTAGE: the refused resume changed nothing"
            - "${expired_count} == 1, ${final_status} == EXPIRED and ${final_expired_at} == 2026-09-01T00:00:00Z: the epoch expires PAUSED offers too"

      - name: engagement_report_suppresses_the_thin_category_row_but_still_totals_it
        claim_type: computed_read
        grounds:
          - endpoints[GET /perks/employers/{id}/engagement-report]
          - calculations.engagement_analytics
          - entities.Employer.fields.privacy_min_cohort_size
        distinguishing_aspect: |
          With privacy_min_cohort_size 3 the DINING row (3 distinct redeemers) is reported in full
          while the WELLNESS row (2 distinct redeemers) comes back with redemption_count,
          discount_amount_cents and distinct_redeemer_count all null, yet the period totals still
          include the suppressed redemptions: 5 redemptions and 4600 discount cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno (DINING/CA) and merchant Zen Spa (WELLNESS/CA) each hold an ACTIVE agreement and one ACTIVE offer at PERCENT 2000 bps with min_spend_cents 1000."
            - "Employer Northwind Co is LIVE with privacy_min_cohort_size 3 and three ELIGIBLE memberships E-001, E-002 and E-003."
            - "At 2026-08-10T00:00:00Z all three members redeem and verify the DINING offer at gross 5000 (discount 1000 each) and E-001 and E-002 also redeem and verify the WELLNESS offer at gross 4000 (discount 800 each)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
