            - "captured p2 == 10 and s2 == PROBATION (>= 10 boundary inclusive)"
      - name: medication_zero_doses_auto_complete_and_reject
        grounds:
          - calculations.medication_dose_ledger
          - state_machines.MedicationOrder.ACTIVE_to_COMPLETED
        distinguishing_aspect: "Zero-quantity boundary on a different metric and endpoint than demerit points: an order with doses_total 2 completes after exactly 2 ADMINISTERED rows; the 3rd administration is rejected with ERR_ORDER_NOT_ACTIVE; low_stock flips true exactly at doses_remaining == refill_threshold."
