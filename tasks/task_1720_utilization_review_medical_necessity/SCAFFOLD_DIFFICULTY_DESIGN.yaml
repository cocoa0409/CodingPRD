              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/concurrent-reviews"
              payload: { clinical_update: "Day 2: persistent hypoxia, continued monitoring required.", requested_additional_day_count: 2 }
              as: URNurse
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /api/concurrent-reviews/${cr_id}/payer-decision"
              payload: { decision: "APPROVE", approved_day_count: 2, certified_day_start: 3 }
