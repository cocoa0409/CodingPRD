            - "GET /enrollments?field_id=${f14_id} returns exactly 2 enrollments"

  - rule_id: compensating_invariant
    instances:
      - name: batch_cancellation_compensates_everything_except_serial_counter
        grounds:
          - state_machines.CreditBatch.ISSUED_to_CANCELLED
          - entities.BufferAccount.fields.released_total
          - entities.BufferAccount.fields.next_serial_number
          - entities.Grower.fields.lifetime_credits_issued
          - concurrency_rules[batch-cancel-stale-batch]
          - endpoints[POST /credit-batches/{credit_batch_id}/cancel]
        distinguishing_aspect: |
          Cancellation is a compensation that must undo four things (buffer balance, outstanding
          issuance, enrollment issuance total, accrued payment) while deliberately NOT undoing
          two others: BufferAccount.next_serial_number stays at 233 because serial numbers are
          never reused, and Grower.lifetime_credits_issued stays at 232 because it counts every
          batch ever issued. contributed_total also stays at 51 while released_total rises to 51,
          so the pool's lifetime ledger still reconciles to a zero balance - a naive
          decrement-everything implementation drifts on exactly those three fields.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1; grower G1 with field F1 (1000.00 acres) and the standard 2021-2025 history."
            - "Enrollment E1 is ACTIVE, PER_CREDIT at 60.00 pct, commitment_years 5, start_crop_year 2026, with an APPROVED HISTORICAL_DATA baseline and one PASSED EQUIPMENT_TELEMETRY packet for 2026."
            - "MODEL run R1 is VERIFIED with net_removals_t 283.360 and has been issued as CreditBatch CB1: gross_credits 283, risk_tier HIGH, buffer_pct 18.00, buffer_credits 51, issued_credits 232, serials 1..232."
            - "The issuance cascade left BufferAccount contributed_total 51, balance_credits 51, outstanding_issued_credits 232, required_reserve_credits 12, next_serial_number 233, pool_status HEALTHY."
            - "The issuance cascade also accrued the PER_CREDIT payment: gross 382800, holdback 76560, net 306240, status ACCRUED, so Enrollment.accrued_payment_cents is 306240."
            - "CB1 was never listed, so registry_status is UNLISTED, and the caller holds CB1's current version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_cc_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Northfield Farms LLC", operator_type: "LLC", tax_id: "91-1122334", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "North Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "IA-113" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-2026-0001" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
