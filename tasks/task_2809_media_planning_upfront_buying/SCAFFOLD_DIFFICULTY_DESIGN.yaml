# §1.8 Scaffold Difficulty Design - Test Targeting Index for
# task_2809_media_planning_upfront_buying. Every instance grounds in elements
# already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file would leave
# the declared behaviour identical. All numeric assertions are literals that
# were computed by executing the §1.3 formulas against the pinned fixtures.
#
# Shared fixture conventions used across instances:
#   * the logical clock starts at its declared default 2026-08-01T00:00:00Z and
#     is only ever moved forward with POST /_clock/set_current_utc
#   * opaque agency identities are pinned as "planner-01", "buyer-01",
#     "controller-01" and "controller-02" so segregation-of-duties assertions
#     are deterministic
#   * entity_backed roles always send as_user_id equal to the owning
#     Seller.id / Advertiser.id
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_delivery_index_diverge_on_same_reports
        grounds:
          - calculations.post_buy_delivery_index
          - entities.Buy.fields.provisional_delivery_index
          - entities.Buy.fields.final_delivery_index
          - entities.Buy.fields.credited_impressions_provisional
          - entities.Buy.fields.credited_impressions_final
          - entities.DeliveryReport.fields.delivered_demo_impressions
          - state_machines.DeliveryReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          The two variants of post_buy_delivery_index read a different report status set
          AND a different impression column on exactly the same two DeliveryReports, so a
          single buy row carries provisional_delivery_index 1.0250 while its
          final_delivery_index is 0.4500 - a 0.5750 gap that no single-variant reading of
          the same rows can produce.
        test_recipe:
          setup:
            - "one BEVERAGE advertiser, one seller, one APPROVED campaign with a 60/40 LINEAR_TV / DIGITAL_VIDEO allocation split over a 200,000,000 cent budget"
            - "a PLACED linear buy guaranteeing 40,000,000 impressions at an agreed CPM of 2200 cents (net 88,000,000, commission rate 0.0400, gross 91,520,000)"
            - "two SUBMITTED delivery reports on that buy: November (gross 20,000,000 / demo 18,000,000, is_post_buy_final false) and December (gross 21,000,000 / demo 19,200,000, is_post_buy_final true)"
            - "exactly one of the two reports has been accepted when the assertions are taken"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 45, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Reach Push", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 200000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 60.00, planned_cpm_cents: 1800, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al1_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "DIGITAL_VIDEO", allocation_pct: 40.00, planned_cpm_cents: 2500, planned_market: "SCATTER", primary_daypart: "DIGITAL_ANY" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al2_id: $.data.id }
            - call: "POST /upfront/campaigns/${c_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/campaigns/${c_id}/approve-plan"
              payload: {}
              as: AdvertiserClient
              as_user_id: "${adv_id}"
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 60000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f1_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c_id}", seller_id: "${sel_id}", channel_allocation_id: "${al1_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 40000000, opening_cpm_cents: 2000, guarantee_pct: 100, make_good_provision: "MAKE_GOOD_UNITS", option_pct_ceiling: 25 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n1_id: $.data.id, n1_v1: $.data.version }
            - call: "POST /upfront/negotiations/${n1_id}/counter"
              payload: { expected_negotiation_version: "${n1_v1}", counter_cpm_cents: 2200, counter_impressions: 40000000 }
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations/${n1_id}/accept"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { b1_id: $.data.id }
            - call: "POST /upfront/buys/${b1_id}/units"
              payload: { forecast_id: "${f1_id}", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", units: 40, unit_rate_cents: 2200000, projected_impressions: 40000000, air_window_start: "2026-11-02T00:00:00Z", air_window_end: "2026-11-30T23:59:59Z" }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { u1_id: $.data.id }
            - call: "GET /upfront/campaigns/${c_id}"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { c_v5: $.data.version }
            - call: "POST /upfront/buys/${b1_id}/place"
              payload: { expected_campaign_version: "${c_v5}" }
              as: AgencyBuyer
              as_user_id: "buyer-01"
            - call: "POST /upfront/delivery-reports"
              payload: { buy_id: "${b1_id}", measurement_basis: "LINEAR_C3", period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-30T23:59:59Z", delivered_impressions: 20000000, delivered_demo_impressions: 18000000 }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /upfront/delivery-reports"
              payload: { buy_id: "${b1_id}", measurement_basis: "LINEAR_C3", period_start: "2026-12-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", delivered_impressions: 21000000, delivered_demo_impressions: 19200000 }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { dr2_id: $.data.id }
          trigger:
            - call: "POST /upfront/delivery-reports/${dr1_id}/accept"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
            - call: "GET /upfront/buys/${b1_id}"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
          assert:
            - "DeliveryReport.${dr1_id}.status == ACCEPTED and DeliveryReport.${dr1_id}.is_post_buy_final == false"
            - "DeliveryReport.${dr2_id}.status == SUBMITTED and DeliveryReport.${dr2_id}.is_post_buy_final == true"
            - "Buy.${b1_id}.credited_impressions_provisional == 41000000"
            - "Buy.${b1_id}.provisional_delivery_index == 1.0250"
            - "Buy.${b1_id}.credited_impressions_final == 18000000"
            - "Buy.${b1_id}.final_delivery_index == 0.4500"
            - "Buy.${b1_id}.stewardship_status == ON_TRACK"
            - "Buy.${b1_id}.buy_status == IN_FLIGHT"
            - "Buy.${b1_id}.open_shortfall_impressions == 22000000"
            - "GET /upfront/make-goods?buy_id=${b1_id} returns 0 items - the interim report never opens a make-good"

      - name: sequential_vs_aggregate_dedup_diverge_on_same_delivery
        grounds:
          - calculations.campaign_unduplicated_reach
          - entities.ReconciliationRun.fields.unduplicated_reach_pct
          - entities.ReconciliationRun.fields.implied_frequency
          - entities.ReconciliationRun.fields.dedup_method
          - entities.ReconciliationRun.fields.group_reach_pct
        distinguishing_aspect: |
          Both runs read the identical set of ACCEPTED reports on the identical two placed
          buys, yet SEQUENTIAL_DEDUP walks the ordered LINEAR->DIGITAL pair and yields
          unduplicated_reach_pct 11.2500 with implied_frequency 1.13 while AGGREGATE_DEDUP
          applies one blanket factor and yields 10.2000 with implied_frequency 1.25; the
          pairwise inputs are ignored by one variant and the aggregate input by the other.
        test_recipe:
          setup:
            - "the APPROVED 200,000,000 cent campaign of the previous instance with both its LINEAR_TV and DIGITAL_VIDEO allocations LOCKED"
            - "a PLACED linear buy guaranteeing 40,000,000 impressions whose two delivery reports are both ACCEPTED, so credited_impressions_final is 37,200,000 demo impressions"
            - "a PLACED digital buy guaranteeing 24,000,000 impressions at CPM 1250 whose single post-buy report is ACCEPTED with 24,000,000 demo impressions"
            - "universe_thousands 120000 and frequency_goal 4.0, so linear group reach is 7.7500 percent, digital group reach is 5.0000 percent and gross reach is 12.7500 percent"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 45, sequential_liability_enabled: true }
              as: AgencyController
