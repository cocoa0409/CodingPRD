            - "CourtEvent.${ce3}.status == SCHEDULED"
            - "CourtEvent.${ce3}.start_utc == 2026-09-01T12:00:00Z"
            - "CourtEvent.${ce3}.notice_days == 31"
            - "the final listing returns total_count == 2"

      - name: vendor_closed_window_capacity_refuses_a_touching_endpoint
        grounds:
          - validations[priority=17]
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
          - entities.Vendor.fields.concurrent_case_capacity
          - entities.VendorEngagement.fields.window_start_utc
          - entities.VendorEngagement.fields.window_end_utc
          - state_machines.ExaminationRequest.QUEUED_to_OUTSOURCED
        distinguishing_aspect: |
          The opposite interval convention to the testimony calendar, on purpose: a vendor's contracted
          custody window is CLOSED on both ends, so a second award whose window_start_utc equals the
          incumbent window_end_utc still overlaps at that single instant and is refused against a
          concurrent_case_capacity of 1, while shifting the start one second later is admitted. The
          refusal must also leave Vendor.encumbered_cents untouched at 90000 rather than encumbering
          and unwinding.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Vendor V1: accredited_disciplines [CHEMISTRY], accreditation_expires_at_utc 2027-01-01T00:00:00Z, concurrent_case_capacity 1, unit_price_cents 45000, rush_surcharge_pct 0.00, contract_ceiling_cents 10000000, status ACTIVE."
