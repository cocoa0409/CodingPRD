  - rule_id: resource_temporal_overlap
    instances:
      - name: remittance_period_overlap_rejected_while_next_day_adjacency_is_accepted
        grounds:
          - validations.priority_120.ERR_REMITTANCE_PERIOD_OVERLAP
          - entities.RemittanceStatement.fields.period_start
          - entities.RemittanceStatement.fields.period_end
          - errors.ERR_REMITTANCE_PERIOD_OVERLAP
