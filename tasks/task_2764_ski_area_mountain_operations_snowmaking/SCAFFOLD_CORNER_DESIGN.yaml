          setup:
            - "A season OPERATING with one avalanche-terrain area T1, OPEN, served by an OPEN lift on a PUBLISHED_FULL day plan."
            - "Mission AV-1 (SKI_CUT, clearance_valid_hours 8) was executed by P1 and cleared by P2 at 2026-08-01T00:00:00Z, so the clearance expires at 2026-08-01T08:00:00Z."
