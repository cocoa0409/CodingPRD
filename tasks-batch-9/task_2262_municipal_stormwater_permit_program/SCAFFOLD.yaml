  - id: ERR_OUTFALL_RETIRED
    http_status: 409
    condition: "the Outfall status is RETIRED"
    applies_to: ["POST /stormwater/outfalls/{id}/retire", "POST /stormwater/outfalls/{id}/observations", "POST /stormwater/outfalls/{id}/sweeping-runs", "POST /stormwater/outfalls/{id}/load-assessments"]

  - id: ERR_OUTFALL_HAS_OPEN_CASES
