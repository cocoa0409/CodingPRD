      - name: listing_properties_as_property_owner_returns_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - endpoints[GET /properties]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The portfolio-wide list is deliberately not an owner operation even though the single read
          is: the same actor that may GET /properties/{id} must be refused 403 on GET /properties, so
          the role check has to be per endpoint and not per entity.
        test_recipe:
          setup:
            - "Property Cedar Walk exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /properties?limit=10&offset=0"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "the trigger returns HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "GET /properties/${prop_id} as the same PropertyOwner returns HTTP 200"

      - name: notice_issued_by_a_foreign_property_owner_is_rejected_as_not_owner
        claim_type: unauthorized_operation
        grounds:
          - errors[ERR_FORBIDDEN_NOT_OWNER]
          - validations[priority=7]
          - endpoints[POST /sample-selections/{id}/notice]
        distinguishing_aspect: |
          Role alone is not enough: a PropertyOwner whose X-User-ID is a different property's id holds
          the right role and must still be refused with ERR_FORBIDDEN_NOT_OWNER, which is distinct
          from ERR_UNAUTHORIZED and leaves the slot NOT_NOTIFIED.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026; two properties Cedar Walk (with unit 101) and Birch Row."
            - "The Cedar Walk inspection has drawn its single slot, still NOT_NOTIFIED."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Birch Row", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@birch.example" }
              as: PlatformAdmin
              captures: { other_prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
          trigger:
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T17:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${other_prop_id}"
          assert:
            - "the trigger returns HTTP 403 with error_id ERR_FORBIDDEN_NOT_OWNER"
            - "SampleSelection.${sel1_id}.access_status == NOT_NOTIFIED"
            - "SampleSelection.${sel1_id}.notified_at is null and SampleSelection.${sel1_id}.notice_lead_hours is null"
            - "Inspection.${insp_id}.status == SAMPLED"

      - name: reading_a_property_with_a_missing_x_user_id_header_is_unauthenticated
        claim_type: unauthenticated_request
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          Authentication is checked before authorisation: a request carrying a valid X-User-Role but
          no X-User-ID must return 401 ERR_UNAUTHENTICATED, not the 403 that a wrong role would
          produce, even on an endpoint every role may read.
        test_recipe:
          setup:
            - "Property Cedar Walk exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: HousingAgencyInspector
              as_user_id: null
          assert:
            - "the request is sent with X-User-Role: HousingAgencyInspector and no X-User-ID header at all"
            - "the trigger returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "a request with an X-User-Role that is not one of the six declared roles also returns HTTP 401 ERR_UNAUTHENTICATED"

      - name: verifying_closure_under_the_completer_user_id_is_rejected_by_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=8]
          - state_machines.WorkOrder.UNVERIFIED_to_VERIFIED
        distinguishing_aspect: |
          The gate is on the user, not the role: the same X-User-ID qa-1 that recorded the repair as a
          MaintenanceTechnician must be refused when it comes back as a QualityAssuranceReviewer to
          verify the same work order, and a different reviewer must then succeed - so the check reads
          completed_by_user_id rather than the role header.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW; Property Cedar Walk, unit 101, an IN_PROGRESS sweep with one work order."
            - "The repair is recorded by X-User-ID qa-1 acting as MaintenanceTechnician, so completed_by_user_id == qa-1."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, d1_id: $.data.deficiency_id }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completed_at: "2026-08-04T09:00:00.000Z", resolution_note: "Sash mechanism replaced" }
              as: MaintenanceTechnician
              as_user_id: "qa-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/verify-closure"
              payload: { verification_result: "VERIFIED", verified_at: "2026-08-05T09:00:00.000Z" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "WorkOrder.${wo_id}.completed_by_user_id == qa-1 and WorkOrder.${wo_id}.repair_status == REPAIRED"
            - "the trigger returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "WorkOrder.${wo_id}.verification_status == UNVERIFIED and WorkOrder.${wo_id}.verified_at is null"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 0.00"
            - "the same call repeated with X-User-ID qa-2 returns HTTP 200 and drives verification_status to VERIFIED with closure_verified_rate 100.00"

  # ---------------------------------------------------------------------------
  # cross_cutting_complexity_layers: one instance per active layer of
  # complexity_profile.complexity_layers. The declared selector_policy layer has
  # no row in the claim-extraction guide, so it is covered through the sampling
  # rank claims in the state_machines and calculations sections instead.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: second_deficiency_with_the_pre_cascade_inspection_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deficiency-record-stale-inspection]
          - errors[ERR_STALE_INSPECTION_VERSION]
          - entities.Deficiency.fields.inspection_version_after_record
        distinguishing_aspect: |
          Two successive findings on one IN_PROGRESS inspection are both legitimate, so only the
          version check can catch a writer working from the pre-cascade view: replaying the first
          call's expected_inspection_version must fail with 412 while the same call with the value
          returned in inspection_version_after_record succeeds.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW; Property Cedar Walk with unit 101."
            - "The single slot is noticed and GRANTED, the inspection is IN_PROGRESS, and one SEV_WINDOW deficiency has already been recorded with expected_inspection_version ${v1}."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T17:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /inspections/${insp_id}/start"
              payload: { started_at: "2026-09-10T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel1_id}/access"
              payload: { access_result: "GRANTED", recorded_at: "2026-09-10T09:05:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /inspections/${insp_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { v1: $.data.version }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:00:00.000Z" }
              as: HousingAgencyInspector
              captures: { d1_id: $.data.id, v2: $.data.inspection_version_after_record }
          trigger:
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:05:00.000Z" }
              as: HousingAgencyInspector
          assert:
            - "${v2} == ${v1} + 1"
            - "the trigger returns HTTP 412 with error_id ERR_STALE_INSPECTION_VERSION"
            - "Inspection.${insp_id}.version == ${v2} and Inspection.${insp_id}.unit_area_points == 16.00"
            - "GET /deficiencies?inspection_id=${insp_id} has total_count == 1"
            - "the identical call replayed with expected_inspection_version ${v2} returns HTTP 201 and takes unit_area_points to 32.00"

      - name: second_sweep_finding_with_the_pre_cascade_sweep_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[sweep-finding-stale-sweep]
          - errors[ERR_STALE_SWEEP_VERSION]
          - entities.SelfAssessmentSweep.fields.generated_work_order_count
        distinguishing_aspect: |
          Every finding bumps the sweep's own version through the work-order counter cascade, so the
          version captured before the first finding is already stale for the second: the replay must
          fail with 412 and generated_work_order_count must stay 1.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW; Property Cedar Walk, unit 101, an IN_PROGRESS sweep whose version was captured as ${sw_v1} at start."
            - "One finding has already been filed with expected_sweep_version ${sw_v1}."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo1_id: $.data.id }
            - call: "GET /self-assessment-sweeps/${sw_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v2: $.data.version }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:30:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "${sw_v2} == ${sw_v1} + 1"
            - "the trigger returns HTTP 412 with error_id ERR_STALE_SWEEP_VERSION"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 1"
            - "SelfAssessmentSweep.${sw_id}.version == ${sw_v2}"
            - "GET /work-orders?sweep_id=${sw_id} has total_count == 1"
            - "the identical call replayed with expected_sweep_version ${sw_v2} returns HTTP 201 and takes generated_work_order_count to 2"

      - name: capital_recompute_with_the_pre_patch_property_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capital-recompute-stale-property]
          - errors[ERR_STALE_PROPERTY_VERSION]
          - endpoints[POST /capital-needs/recompute]
        distinguishing_aspect: |
          A recompute always looks legitimate because superseding the previous generation is the
          endpoint's whole job, so only the property version can stop a writer that never saw the
          reserve change: the reserve is halved by a PATCH between the read and the recompute, and the
          stale call must fail with 412 leaving no CapitalNeedItem behind.
        test_recipe:
          setup:
            - "Property Birch Row exists with capital_reserve_cents 1000000; its version is captured as ${pv1} and then a PATCH lowers the reserve to 500000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Birch Row", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@birch.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id, pv1: $.data.version }
            - call: "PATCH /properties/${prop_id}"
              payload: { capital_reserve_cents: 500000 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /capital-needs/recompute"
              payload: { property_id: "${prop_id}", expected_property_version: "${pv1}", recurrence_basis: "CALENDAR_SCOPED" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "${pv2} == ${pv1} + 1"
            - "the trigger returns HTTP 412 with error_id ERR_STALE_PROPERTY_VERSION"
            - "Property.${prop_id}.version == ${pv2} and Property.${prop_id}.capital_reserve_cents == 500000"
            - "Property.${prop_id}.allocated_reserve_total_cents == 0"
            - "GET /capital-needs?property_id=${prop_id} has total_count == 0"
            - "the identical call replayed with expected_property_version ${pv2} returns HTTP 200"

      - name: corner_layer_cascading_side_effects_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_life_threatening_record_reaches_sweep_urgency_five_links
          rationale: "The five-link chain, its ordering and its intermediate states are asserted end-to-end by the named §1.8 instance."

      - name: corner_layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / inspection_score_provisional_vs_final_diverge_on_unreplaced_refusal
          rationale: "Both variants and the delta between them on one data set are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: sweep_finding_response_already_carries_every_derived_consequence
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /self-assessment-sweeps/{id}/findings]
          - entities.Property.fields.readiness_posture
        distinguishing_aspect: |
          The declared model is immediate, so the single finding call must expose all of its cascade
          in the same request: the created work order, the deficiency id, the bumped sweep version and
          the URGENT priority derived from the life-threatening severity - and a read issued right
          afterwards must show RESTRICTED with open_life_threatening_count 1, with no second call
          needed to settle anything.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS; Property Cedar Walk with OCCUPIED unit 101 and an IN_PROGRESS ALL_AREAS sweep at version ${sw_v1}."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, d1_id: $.data.deficiency_id, wo_priority: $.data.priority_tier, wo_due: $.data.due_at }
          assert:
            - "the trigger returns HTTP 201 with a non-null deficiency_id"
            - "${wo_priority} == URGENT"
            - "${wo_due} == 2026-08-04T09:00:00.000Z"
            - "Deficiency.${d1_id}.points_deducted == 36.00 and Deficiency.${d1_id}.status == OPEN"
            - "Deficiency.${d1_id}.correction_due_at == 2026-08-04T09:00:00.000Z"
            - "SelfAssessmentSweep.${sw_id}.version == ${sw_v1} + 1 and SelfAssessmentSweep.${sw_id}.generated_work_order_count == 1"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 0.00"
            - "GET /properties/${prop_id} issued immediately after the trigger reports readiness_posture RESTRICTED, open_life_threatening_count 1 and overdue_life_threatening_count 0"
            - "Unit.${u1_id}.open_deficiency_count == 1"
