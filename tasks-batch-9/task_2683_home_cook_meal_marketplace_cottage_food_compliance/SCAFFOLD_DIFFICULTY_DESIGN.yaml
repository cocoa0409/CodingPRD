              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-3121", issuing_authority: "CA DPH", issued_on: "2026-03-01", expires_on: "2028-03-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: $.data.id }
            - call: "GET /cooks/${cook_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { cook_v1: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_INSPECTED", inspection_date: "2026-06-20" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: $.data.id }
            - call: "POST /onboarding-documents/${cert_doc_id}/review"
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /onboarding-documents/${insp_doc_id}/review"
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: "rev-2"
            - call: "POST /cooks/${cook_id}/onboarding-decision"
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /menu-items"
              payload: { cook_id: "${cook_id}", name: "Congee Jar", food_category: "NON_TCS", allergens: ["SOY"], allergen_free_attested: false, shelf_life_days: 4, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 900, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
