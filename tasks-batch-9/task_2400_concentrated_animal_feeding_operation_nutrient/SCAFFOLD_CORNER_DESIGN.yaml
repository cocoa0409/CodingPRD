              as_user_id: "${op_id}"
              captures: { insp_id: $.data.id }
          assert:
            - "SoilTest.${soil_id} response carries id and created_at but no version and no updated_at field"
            - "SoilTest.${soil_id}.p_index == 43.68, p_index_category == MEDIUM and is_valid == true"
            - "StorageInspection.${insp_id} response carries id and created_at but no version and no updated_at field"
            - "StorageInspection.${insp_id}.measured_volume_gallons == 4263885.00, freeboard_deficit_in == 0.00 and alert_raised == false"
            - "ManureStorage.${st_id}.precipitation_adjustment_gallons == 4263885.00 and current_volume_gallons == 4263885.00, keeping the volume-balance invariant exact"
            - "ManureStorage.${st_id}.last_inspected_on == 2026-07-30T00:00:00Z and storage_status is STILL IN_SERVICE"
            - "no PATCH or DELETE endpoint exists in §1.5 for /cafo/soil-tests/{id} or /cafo/storage-inspections/{id}"
      - name: budget_rejects_soil_test_belonging_to_another_field
        claim_type: parent_relationships
        grounds:
          - validations[priority=34]
