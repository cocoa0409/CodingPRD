scaffold_corner_design:
  - section: entities
    instances:
      - name: member_create_defaults
        claim_type: default_value
        grounds:
          - entities.Member.fields.points_balance
          - entities.Member.fields.tier
          - entities.Member.fields.qualifying_segments_ytd
        distinguishing_aspect: "A freshly created Member has points_balance 0, tier BASE, qualifying_segments_ytd 0, status_match_used false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { email: "new@air.test", full_name: "New Member", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { tier: "$.data.tier", bal: "$.data.points_balance", qs: "$.data.qualifying_segments_ytd", smu: "$.data.status_match_used", ver: "$.data.version" }
          assert:
            - "${tier} == 'BASE'"
            - "${bal} == 0"
            - "${qs} == 0"
            - "${smu} == false"
            - "${ver} == 1"
      - name: member_duplicate_email_rejected
        claim_type: unique_constraint
        grounds:
          - entities.Member.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Registering a second Member with an email already in use returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup:
            - "One member already registered with email dup@air.test."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "dup@air.test", full_name: "First", home_airport: "SFO" }
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { email: "dup@air.test", full_name: "Second", home_airport: "LAX" }
              as: ProgramAdmin
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_DUPLICATE_EMAIL'"
      - name: segment_points_awarded_zero_until_accrued
        claim_type: computed_field
        grounds:
          - entities.FlightSegment.fields.points_awarded
          - entities.FlightSegment.fields.status
        distinguishing_aspect: "A BOOKED segment has points_awarded 0 and is_qualifying false before accrual."
        test_recipe:
          setup:
            - "A member with one booked segment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "seg@air.test", full_name: "Seg One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 200, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { pa: "$.data.points_awarded", st: "$.data.status", iq: "$.data.is_qualifying" }
          assert:
            - "${pa} == 0"
            - "${st} == 'BOOKED'"
            - "${iq} == false"

  - section: state_machines
    instances:
      - name: segment_fly_from_booked
        claim_type: valid_transition
        grounds:
          - state_machines.FlightSegment.BOOKED_to_FLOWN
        distinguishing_aspect: "A BOOKED segment at/after departure transitions to FLOWN."
        test_recipe:
          setup:
            - "Member with a booked segment, clock past departure."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "fly@air.test", full_name: "Fly One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 200, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
          trigger:
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
              captures: { st: "$.data.status" }
          assert:
            - "${st} == 'FLOWN'"
      - name: segment_accrue_from_booked_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
          - validations[priority=5]
        distinguishing_aspect: "Accruing a BOOKED (not FLOWN) segment fails with ERR_INVALID_STATE; points_balance unchanged."
        test_recipe:
          setup:
            - "Member with a booked (not flown) segment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "acc@air.test", full_name: "Acc One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 200, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'"
      - name: segment_cancel_after_accrued_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.FlightSegment.BOOKED_to_CANCELLED
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
        distinguishing_aspect: "Cancelling an ACCRUED (terminal) segment fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Member with an ACCRUED segment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "can@air.test", full_name: "Can One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 200, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/cancel"
              payload: {}
              as: OperationsAgent
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'"
      - name: award_fly_from_quoted_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AwardBooking.ISSUED_to_FLOWN
          - validations[priority=5]
        distinguishing_aspect: "Flying a QUOTED (not ISSUED) award fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Member with a QUOTED award."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "awf@air.test", full_name: "Awf One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { aw: "$.data.id" }
          trigger:
            - call: "POST /award-bookings/${aw}/fly"
              payload: {}
              as: OperationsAgent
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'"
      - name: gift_reverse_from_settled_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PointsGift.PENDING_to_REVERSED
          - state_machines.PointsGift.PENDING_to_SETTLED
        distinguishing_aspect: "Reversing an already-SETTLED gift fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Sender m1 (5000 pts) settled a 1000-pt gift to m2."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "gv1@air.test", full_name: "Gv One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "gv2@air.test", full_name: "Gv Two", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 5000 }
              as: ProgramAdmin
            - call: "POST /points-gifts"
              payload: { sender_id: "${m1}", recipient_id: "${m2}", amount: 1000 }
              as: Member
              as_user_id: "${m1}"
              captures: { gift: "$.data.id" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { mv: "$.data.version" }
            - call: "POST /points-gifts/${gift}/settle"
              payload: { expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /points-gifts/${gift}/reverse"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'"
      - name: upgrade_withdraw_after_cleared_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_WITHDRAWN
          - state_machines.UpgradeRequest.WAITLISTED_to_CLEARED
        distinguishing_aspect: "Owner withdrawing a CLEARED (terminal) upgrade request fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Member m1 with a CLEARED upgrade request."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "uw1@air.test", full_name: "Uw One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-pools"
              payload: { flight_number: "UA9", departure_at: "2026-04-10T08:00:00.000Z", premium_capacity: 1 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m1}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m1}"
              captures: { req: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-10T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /upgrade-requests/${req}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'"
      - name: status_match_grant_floors_effective_tier
        claim_type: valid_transition
        grounds:
          - state_machines.StatusMatch.GRANTED_to_EXPIRED
          - entities.Member.fields.status_match_active
          - entities.Member.fields.tier
        distinguishing_aspect: "Granting a StatusMatch (rival PLATINUM) sets status_match_active true and floors effective tier to GOLD."
        test_recipe:
          setup:
            - "A BASE member with 0 qualifying segments."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "sm@air.test", full_name: "Sm One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /status-matches"
              payload: { member_id: "${m1}", rival_tier: "PLATINUM", valid_until: "2026-12-31T23:59:59.000Z" }
              as: ProgramAdmin
              captures: { mt: "$.data.matched_tier", st: "$.data.status" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { active: "$.data.status_match_active", used: "$.data.status_match_used", tier: "$.data.tier" }
          assert:
            - "${mt} == 'GOLD'  # one rung below PLATINUM"
            - "${st} == 'GRANTED'"
            - "${active} == true"
            - "${used} == true"
            - "${tier} == 'GOLD'  # match-floored effective tier"
      - name: status_match_expires_on_clock_advance
        claim_type: auto_transition
        grounds:
          - state_machines.StatusMatch.GRANTED_to_EXPIRED
          - entities.Member.fields.status_match_active
        distinguishing_aspect: "Advancing the clock past valid_until expires the StatusMatch and clears status_match_active."
        test_recipe:
          setup:
            - "Member with a GRANTED status match valid until 2026-03-01."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "sx@air.test", full_name: "Sx One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /status-matches"
              payload: { member_id: "${m1}", rival_tier: "GOLD", valid_until: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { sm: "$.data.id" }
          trigger:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "GET /status-matches/${sm}"
              payload: {}
              as: ProgramAdmin
              captures: { st: "$.data.status" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { active: "$.data.status_match_active" }
          assert:
            - "${st} == 'EXPIRED'"
            - "${active} == false"
      - name: companion_cert_expires_on_clock_advance
        claim_type: auto_transition
        grounds:
          - state_machines.CompanionCertificate.ISSUED_to_EXPIRED
        distinguishing_aspect: "Advancing the clock past valid_until expires an ISSUED, unattached certificate."
        test_recipe:
          setup:
            - "Member with an ISSUED certificate valid until 2026-03-01, never attached."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "cx@air.test", full_name: "Cx One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /companion-certificates"
              payload: { member_id: "${m1}", valid_from: "2026-01-01T00:00:00.000Z", valid_until: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { cert: "$.data.id" }
          trigger:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "GET /companion-certificates/${cert}"
              payload: {}
              as: ProgramAdmin
              captures: { st: "$.data.status" }
          assert:
            - "${st} == 'EXPIRED'"
      - name: year_end_resets_qualifying_segments
        claim_type: auto_transition
        grounds:
          - state_machines.Member.ANY_TIER_to_BASE
          - entities.Member.fields.qualifying_segments_ytd
        distinguishing_aspect: "Advancing the clock into the next program_year resets qualifying_segments_ytd to 0 and recomputes tier to BASE (no active match)."
        test_recipe:
          setup:
            - "Member injected to 20 qualifying segments (SILVER) in program year 2026."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-06-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "yr@air.test", full_name: "Yr One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/qualifying_segments"
              payload: { member_id: "${m1}", count: 20 }
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2027-01-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { qs: "$.data.qualifying_segments_ytd", tier: "$.data.tier" }
          assert:
            - "${qs} == 0"
            - "${tier} == 'BASE'"

  - section: calculations
    instances:
      - name: award_pricing_fixed_first_class
        claim_type: formula_output
        grounds:
          - calculations.award_pricing
          - entities.AwardBooking.fields.points_price
        distinguishing_aspect: "FIXED FIRST award (no companion) prices at the chart value 100000 exactly."
        test_recipe:
          setup:
            - "A member quoting a FIXED FIRST award."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "fc@air.test", full_name: "Fc One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "FIRST", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { price: "$.data.points_price" }
          assert:
            - "${price} == 100000"
      - name: dynamic_load_factor_zero_floor
        claim_type: formula_output
        grounds:
          - calculations.award_pricing
        distinguishing_aspect: "DYNAMIC ECONOMY award with load_factor 0 prices at 0.8x chart = 20000 (lower bound)."
        test_recipe:
          setup:
            - "A member quoting a DYNAMIC ECONOMY award with load_factor 0."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "lf@air.test", full_name: "Lf One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "DYNAMIC", load_factor: 0 }
              as: Member
              as_user_id: "${m1}"
              captures: { price: "$.data.points_price" }
          assert:
            - "${price} == 20000  # 25000*(0.8+0)"
      - name: accrual_first_class_platinum_bonus
        claim_type: formula_output
        grounds:
          - calculations.segment_accrual
          - calculations.tier_recompute
        distinguishing_aspect: "A PLATINUM-matched member's FIRST fare-dominant segment earns base*class_mult*(1+100%) points."
        test_recipe:
          setup:
            - "Member with active PLATINUM status match; a FIRST segment base_fare 1000 flown."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "pf@air.test", full_name: "Pf One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /status-matches"
              payload: { member_id: "${m1}", rival_tier: "PLATINUM", valid_until: "2026-12-31T23:59:59.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "FIRST", distance_miles: 340, base_fare_usd: 1000, scheduled_departure: "2026-01-25T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { pa: "$.data.points_awarded" }
          assert:
            - "matched_tier GOLD floors effective_tier GOLD (bonus 50%); base=1000*2.0=2000; floor=ceil(340*0.5)=170; max=2000; ${pa} == 3000"
      - name: discount_fare_not_qualifying
        claim_type: formula_output
        grounds:
          - calculations.segment_accrual
          - entities.FlightSegment.fields.is_qualifying
        distinguishing_aspect: "A DISCOUNT fare segment, when accrued, sets is_qualifying false and does not increment qualifying_segments_ytd."
        test_recipe:
          setup:
            - "Member with a flown DISCOUNT segment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "dq@air.test", full_name: "Dq One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "DISCOUNT", distance_miles: 340, base_fare_usd: 100, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { iq: "$.data.points_awarded" }
            - call: "GET /flight-segments/${seg}"
              payload: {}
              as: OperationsAgent
              captures: { qf: "$.data.is_qualifying" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { qs: "$.data.qualifying_segments_ytd" }
          assert:
            - "${qf} == false"
            - "${qs} == 0"
