                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-c6"
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-c6"
            - call: "POST /orders/${ord_a}/start-preparation"
              payload: {}
              as: CrewMember
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-c7"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-c7"
              captures: { ord_b: $.data.id }
            - call: "POST /orders/${ord_b}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-c7"
            - call: "POST /orders/${ord_b}/start-preparation"
              payload: {}
              as: CrewMember
          trigger:
            - call: "POST /orders/${ord_a}/mark-ready"
              payload: {}
              as: CrewMember
              captures: { slot_a: $.data.locker_slot_id }
            - call: "POST /orders/${ord_b}/mark-ready"
              payload: {}
              as: CrewMember
              captures: { slot_b: $.data.locker_slot_id }
          assert:
