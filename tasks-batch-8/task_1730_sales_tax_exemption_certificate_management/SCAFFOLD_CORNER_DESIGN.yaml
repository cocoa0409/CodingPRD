              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert}/begin_review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co2"
            - call: "POST /tenants/${tid}/certificates/${cert}/approve"
              payload: { expected_customer_version: "${cv1}" }
              as: ComplianceOfficer
              as_user_id: "u_co2"
            - call: "POST /tenants/${tid}/drop_ship_links"
              payload: { retailer_customer_id: "${cid}", ship_to_state: "CA", resale_certificate_id: "${cert}" }
              as: ComplianceOfficer
              captures: { dsl: $.data.id }
          trigger:
            - call: "POST /tenants/${tid}/drop_ship_links/${dsl}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DROP_SHIP_STATE_MISMATCH"

      - name: cert_revoke_blocked_when_under_audit
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERT_UNDER_AUDIT]"]
        distinguishing_aspect: "Revoking a cert referenced by a non-terminal AuditSample -> ERR_CERT_UNDER_AUDIT"
        test_recipe:
          setup: ["Approved cert; campaign sampled and in DOC_REQUESTED state (non-terminal)"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
