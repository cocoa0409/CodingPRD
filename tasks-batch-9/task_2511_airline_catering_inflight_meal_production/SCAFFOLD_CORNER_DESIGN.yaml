# §1.9 Scaffold Corner Design — Airline Catering & Inflight Meal Production (task 2511)
#
# Breadth walk of references/claim-extraction-guide.md's nine sections against this scaffold's
# §1.1–§1.7. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe; everything here is a
# claim §1.8 does not already assert. Corners already asserted by a §1.8 instance appear as
# `excluded_because:` stubs naming that instance.
#
# Reusable call objects are declared once with a YAML anchor (&k_...) at their first point of use
# and aliased (*k_...) afterwards; an alias re-executes the identical call and re-binds the same
# `captures:` names inside the aliasing instance. Anchors are document-scoped, so this file
# carries its own library (k_ prefix) independent of the §1.8 file's (c_ prefix).
#
# Shared reference data pinned by the anchors (identical to the §1.8 fixture so the two files can
# share generated helpers):
#   Airline AN "AeroNordic"  BONDED, cost cap 6000, cutoff 720min, grace 10min,
#                            recovery 30.00%, deviation tolerance 5.00%
#   AN-F-STD  FIRST/STANDARD/HOT     4200c shelf 4h  load 0.00 portion 420 gross 900
#   AN-C-STD  BUSINESS/STANDARD/HOT  3900c shelf 4h  load 5.00 portion 380 gross 850
#   AN-Y-STD  ECONOMY/STANDARD/CHILL 1450c shelf 72h load 2.50 portion 320 gross 700
#   AN-Y-VGML ECONOMY/VGML/CHILL     1650c shelf 72h load 0.00 portion 310 gross 690
#   Truck HL-101 (OSL, buffer 20min); Stand A12 (OSL, max_concurrent_runs 2)
#   Flight AN411 std 2026-09-15T10:00:00Z, pax_economy 180 -> cutoff 2026-09-14T22:00:00Z,
#   planned at 04:00 -> CHILL release_deadline 2026-09-15T08:30:00Z
#
# Every chain starts from an empty database. Every numeric assert is a pre-computed literal.

scaffold_corner_design:

  # =========================================================================
  # Guide section 1 — From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: airline_creation_returns_the_persisted_row_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.Airline
          - endpoints.POST_/airlines
          - response_envelope.success
        distinguishing_aspect: |
          A create returns 201 with the whole persisted row wrapped in the §1.0 success envelope —
          meta + response_type "object" + data — and the four system/computed fields (status,
          open_finding_count, penalty_accrued_cents, version) are server-minted, not echoed input.
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at 2026-09-12T09:00:00Z."
          setup_api_calls:
            - &k_clk0    { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-12T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - &k_air_an  { call: "POST /airlines", payload: { name: "AeroNordic", iata_code: "AN", waste_regime: "BONDED", cost_cap_per_pax_cents: 6000 }, as: PlatformAdmin, captures: { an_id: $.data.id } }
          assert:
            - "HTTP 201 and the body has exactly the keys meta, response_type and data; response_type == \"object\""
            - "meta carries api_request_id and api_request_timestamp"
            - "data.name == \"AeroNordic\", data.iata_code == \"AN\", data.waste_regime == \"BONDED\", data.cost_cap_per_pax_cents == 6000"
            - "data.status == \"ACTIVE\", data.open_finding_count == 0, data.penalty_accrued_cents == 0"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"
            - "data.created_at == data.updated_at, both ISO-8601 UTC with three fractional digits"

      - name: omitted_optional_reference_fields_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Airline.fields.special_meal_cutoff_minutes
          - entities.MealSpecification.fields.load_factor_pct
          - entities.Truck.fields.buffer_minutes
          - entities.Stand.fields.max_concurrent_runs
        distinguishing_aspect: |
          Four different entities each carry `default:` fields; omitting them writes the declared
          default rather than null, and the airline defaults are the ones every downstream cutoff,
          grace, recovery and tolerance computation reads.
        test_recipe:
          setup:
            - "Airline AN exists, created with only its four required fields."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
          trigger:
            - { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-DEF", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"] }, as: PlatformAdmin, captures: { spec_def_id: $.data.id } }
            - { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-900" }, as: PlatformAdmin, captures: { truck_def_id: $.data.id } }
            - { call: "POST /stands", payload: { station_code: "OSL", stand_code: "B01" }, as: PlatformAdmin, captures: { stand_def_id: $.data.id } }
          assert:
            - "Airline.${an_id}.special_meal_cutoff_minutes == 720, late_delivery_grace_minutes == 10"
            - "Airline.${an_id}.unused_recovery_rate_pct == 30.00, spec_deviation_tolerance_pct == 5.00, status == \"ACTIVE\""
            - "MealSpecification.${spec_def_id}.load_factor_pct == 0.00 and status == \"ACTIVE\""
            - "Truck.${truck_def_id}.buffer_minutes == 20 and status == \"ACTIVE\""
            - "Stand.${stand_def_id}.max_concurrent_runs == 2 and status == \"ACTIVE\""

      - name: meal_specification_rejects_undeclared_enums_and_out_of_range_numbers
        claim_type: type_constraints
        grounds:
          - entities.MealSpecification.fields.cabin
          - entities.MealSpecification.fields.load_factor_pct
          - entities.MealSpecification.fields.required_haccp_steps
          - validations[priority=30]
        distinguishing_aspect: |
          Enum closure, the 0.00-25.00 load-factor range and the non-empty/no-duplicate constraint on
          required_haccp_steps are all priority-30 request-shape checks: each returns 400
          ERR_INVALID_REQUEST and persists nothing.
        test_recipe:
          setup:
            - "Airline AN exists; no specification has been created yet."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
          trigger:
            - { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-P-STD", cabin: "PREMIUM", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN"] }, as: PlatformAdmin }
            - { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-HI", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN"], load_factor_pct: 25.01 }, as: PlatformAdmin }
            - { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-EMPTY", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: [] }, as: PlatformAdmin }
            - { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-DUP", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["HOLD_TEMP", "HOLD_TEMP"] }, as: PlatformAdmin }
          assert:
            - "all four calls return HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "cabin \"PREMIUM\" is outside {FIRST, BUSINESS, ECONOMY}; load_factor_pct 25.01 is above the 25.00 ceiling"
            - "required_haccp_steps [] violates non-empty; [\"HOLD_TEMP\", \"HOLD_TEMP\"] violates no-duplicates"
            - "GET /meal-specifications with airline_id ${an_id} returns total_count == 0 — no partial row was written"

      - name: flight_creation_without_std_utc_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Flight.fields.std_utc
          - endpoints.POST_/flights
          - validations[priority=30]
        distinguishing_aspect: |
          std_utc has `source: input` and no `default:`, so it is required; every downstream instant
          (revised_std_utc, special_meal_cutoff_utc, slot band, release deadline) derives from it, and
          the request is refused at priority 30 before any of them is attempted.
        test_recipe:
          setup:
            - "Airline AN exists."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
          trigger:
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 180 }, as: ScheduleFeedOperator }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /flights with airline_id ${an_id} returns total_count == 0"

      - name: flight_creation_derives_total_pax_cutoff_and_provisional_units
        claim_type: computed_fields
        grounds:
          - entities.Flight.fields.total_pax
          - entities.Flight.fields.special_meal_cutoff_utc
          - entities.Flight.fields.units_planned_provisional
          - calculations.flight_meal_requirement
        distinguishing_aspect: |
          Five computed fields land in the create response itself: total_pax, revised_std_utc (== std_utc
          while delay_minutes is 0), special_meal_cutoff_utc (std minus the airline's 720 minutes) and
          units_planned_provisional == ceil(180 * 1.025) == 185, while units_planned stays 0 until the plan.
        test_recipe:
          setup:
            - "Airline AN and specification AN-Y-STD (ECONOMY/STANDARD/CHILL, load_factor_pct 2.50) exist."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - &k_spec_y { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-STD", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 2.50 }, as: PlatformAdmin, captures: { spec_y_id: $.data.id } }
          trigger:
            - &k_flt { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 180 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
          assert:
            - "data.total_pax == 180 (0 + 0 + 180) and data.status == \"SCHEDULED\""
            - "data.revised_std_utc == \"2026-09-15T10:00:00Z\" and data.delay_minutes == 0"
            - "data.special_meal_cutoff_utc == \"2026-09-14T22:00:00Z\" — revised_std minus 720 minutes"
            - "data.units_planned_provisional == 185 == ceil(180 * (1 + 2.50/100)); ceil is applied per cabin"
            - "data.units_planned == 0, units_produced == 0, units_loaded == 0, units_scrapped == 0, unit_balance == 0"
            - "data.cost_per_pax_cents == 0, data.counts_locked_at is null, data.production_hold == false, data.version == 1"

      - name: undeclared_status_field_on_flight_creation_is_rejected
        claim_type: system_fields
        grounds:
          - entities.Flight.fields.status
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          System fields are not silently ignored here: priority 30 rejects any unknown body key, so a
          client trying to seed Flight.status is refused with 400 rather than having the value dropped.
          The same flight, submitted without the key, gets id/created_at/updated_at/version minted server-side.
        test_recipe:
          setup:
            - "Airline AN and specification AN-Y-STD exist."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
          trigger:
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 180, status: "DEPARTED" }, as: ScheduleFeedOperator }
            - *k_flt
          assert:
            - "the first call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" and creates nothing"
            - "the second call returns 201 with data.status == \"SCHEDULED\", data.version == 1"
            - "data.id, data.created_at and data.updated_at are server-minted and were never supplied by the client"
            - "GET /flights with airline_id ${an_id} returns total_count == 1"

      - name: flight_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/flights/{id}
          - entities.Flight
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          A read-back immediately after the create returns byte-identical field values, including the
          derived cutoff and the provisional unit count — no lazy recomputation shifts them.
        test_recipe:
          setup:
            - "Flight AN411 was created at clock 2026-09-12T09:00:00Z with 180 ECONOMY passengers."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
          trigger:
            - { call: "GET /flights/${f_id}", payload: {}, as: ScheduleFeedOperator }
          assert:
            - "HTTP 200, response_type == \"object\", data.id == ${f_id}"
            - "data.total_pax == 180, data.units_planned_provisional == 185, data.version == 1"
            - "data.special_meal_cutoff_utc == \"2026-09-14T22:00:00Z\" and data.updated_at is unchanged from the create response"

      - name: flight_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/flights
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list envelope carries limit/offset/total_count/has_more; total_count counts the whole
          filtered set (3) not the page (2), and has_more flips to false only on the last page.
        test_recipe:
          setup:
            - "Airline AN owns three flights AN411, AN412 and AN413 on 2026-09-15."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN412", service_date: "2026-09-15", std_utc: "2026-09-15T12:00:00Z", tail_number: "LN-BBB", station_code: "OSL", pax_economy: 120 }, as: ScheduleFeedOperator }
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN413", service_date: "2026-09-15", std_utc: "2026-09-15T14:00:00Z", tail_number: "LN-CCC", station_code: "OSL", pax_economy: 90 }, as: ScheduleFeedOperator }
          trigger:
            - { call: "GET /flights", payload: { airline_id: "${an_id}", limit: 2, offset: 0 }, as: ScheduleFeedOperator }
            - { call: "GET /flights", payload: { airline_id: "${an_id}", limit: 2, offset: 2 }, as: ScheduleFeedOperator }
          assert:
            - "page 1: response_type == \"array\", len(data) == 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2: len(data) == 1, offset == 2, total_count == 3, has_more == false"
            - "the two pages together contain exactly the flight_numbers AN411, AN412, AN413 with no repeats"
            - "GET /flights with status \"COUNTS_LOCKED\" returns total_count == 0 — the filter is applied before pagination"

      - name: unknown_ids_return_the_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_FLIGHT_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_CART_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Priority 40 does not collapse into one code: Flight, ProductionBatch and Cart paths each
          raise their own 404, and every other entity falls back to ERR_RESOURCE_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clk0
          trigger:
            - { call: "GET /flights/00000000-0000-4000-8000-000000000000", payload: {}, as: ScheduleFeedOperator }
            - { call: "GET /production-batches/00000000-0000-4000-8000-000000000001", payload: {}, as: ProductionSupervisor }
            - { call: "GET /carts/00000000-0000-4000-8000-000000000002", payload: {}, as: LoadMaster }
            - { call: "GET /loading-manifests/00000000-0000-4000-8000-000000000003", payload: {}, as: LoadMaster }
          assert:
            - "call 1 -> HTTP 404 ERR_FLIGHT_NOT_FOUND"
            - "call 2 -> HTTP 404 ERR_BATCH_NOT_FOUND"
            - "call 3 -> HTTP 404 ERR_CART_NOT_FOUND"
            - "call 4 -> HTTP 404 ERR_RESOURCE_NOT_FOUND"

      - name: meal_specification_naming_an_unknown_airline_is_rejected_with_resource_not_found
        claim_type: parent_relationships
        grounds:
          - entities.MealSpecification.fields.airline_id
          - validations[priority=60]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          MealSpecification.parent is Airline and airline_id arrives in the BODY, so the miss is caught
          by priority 60 (body-ref existence in declared input order), not by the priority-40 path check.
        test_recipe:
          setup:
            - "Airline AN exists; the id in the payload belongs to no airline."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
          trigger:
            - { call: "POST /meal-specifications", payload: { airline_id: "11111111-1111-4111-8111-111111111111", spec_code: "AN-Y-STD", cabin: "ECONOMY", meal_code: "STANDARD", storage_class: "CHILL", portion_grams: 320, gross_weight_grams: 700, unit_cost_cents: 1450, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 2.50 }, as: PlatformAdmin }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_RESOURCE_NOT_FOUND\""
            - "GET /meal-specifications with airline_id ${an_id} returns total_count == 0"

      - name: one_released_batch_feeds_two_carts_through_the_cart_item_junction
        claim_type: graph
        grounds:
          - entities.CartItem
          - complexity_profile.entity_topology
          - endpoints.GET_/cart-items
          - calculations.cost_per_passenger_report
        distinguishing_aspect: |
          CartItem is a true many-to-many junction, not an ownership child: a single RELEASED
          ProductionBatch supplies two different Carts of the same flight, and the reverse lookup
          GET /cart-items?production_batch_id finds both rows from the batch side.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with one CHILL ProductionBatch of 180 AN-Y-STD units, produced and RELEASED."
            - "Cart CHL-01 (capacity 200) and cart CHL-02 (capacity 100) both belong to that flight."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - &k_clk_lock { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T03:00:00Z" }, as: PlatformAdmin }
            - &k_lock     { call: "POST /flights/${f_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - &k_clk_plan { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T04:00:00Z" }, as: PlatformAdmin }
            - &k_plan     { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_y_id: "$.data[0].id" } }
            - &k_clk_prod { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T04:30:00Z" }, as: PlatformAdmin }
            - &k_start    { call: "POST /production-batches/${b_y_id}/start", payload: {}, as: ProductionSupervisor }
            - &k_clk_qa   { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T05:00:00Z" }, as: PlatformAdmin }
            - &k_hc_ch    { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "CHILL_DOWN", measured_temp_c: 6.0 }, as: QaOfficer, captures: { hc_ch_id: $.data.id } }
            - &k_hc_hd    { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer, captures: { hc_hd_id: $.data.id } }
            - &k_clk_cmpl { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T05:30:00Z" }, as: PlatformAdmin }
            - &k_cmpl     { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 180 }, as: ProductionSupervisor }
            - &k_rel      { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor }
            - &k_clk_cart { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T06:10:00Z" }, as: PlatformAdmin }
            - &k_cart     { call: "POST /carts", payload: { flight_id: "${f_id}", cart_code: "CHL-01", cart_type: "STD_FULL", storage_class: "CHILL", capacity_units: 200, galley_position: "G1" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_id: $.data.id } }
            - &k_cart2    { call: "POST /carts", payload: { flight_id: "${f_id}", cart_code: "CHL-02", cart_type: "STD_HALF", storage_class: "CHILL", capacity_units: 100, galley_position: "G2" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart2_id: $.data.id } }
          trigger:
            - &k_item100a { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 100 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item100_id: $.data.id } }
            - &k_item80   { call: "POST /carts/${cart2_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 80 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item80_id: $.data.id } }
          assert:
            - "both items are created with status \"ACTIVE\" and meal_code \"STANDARD\" copied from AN-Y-STD"
            - "Cart.${cart_id}.loaded_units == 100 and build_status == \"BUILDING\"; Cart.${cart2_id}.loaded_units == 80 and build_status == \"BUILDING\""
            - "GET /cart-items with production_batch_id ${b_y_id} returns total_count == 2 — the junction is reverse-reachable from the batch"
            - "Flight.${f_id}.units_loaded == 180, units_produced == 180, unit_balance == 0"
            - "Flight.${f_id}.cost_per_pax_cents == 1624 — round_half_up((162400 + 129920) / 180)"

      - name: haccp_check_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.HaccpCheck
          - endpoints.GET_/haccp-checks/{id}
          - calculations.haccp_check_verdict
        distinguishing_aspect: |
          HaccpCheck is the scaffold's only `common_fields: false` entity: it exposes id and created_at
          but no version and no updated_at, and §1.5 declares no PATCH/PUT/DELETE for it — a correction
          can only ever be a NEW row, which is why sequence_no exists.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch is IN_PRODUCTION and one CHILL_DOWN check of 6.0 C has been recorded."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
          trigger:
            - { call: "GET /haccp-checks/${hc_ch_id}", payload: {}, as: QaOfficer }
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "CHILL_DOWN", measured_temp_c: 7.0 }, as: QaOfficer, captures: { hc_ch2_id: $.data.id } }
          assert:
            - "the GET body carries id, created_at, production_batch_id, step_code, measured_temp_c, measured_at_utc, verdict, sequence_no and recorded_by_user_id"
            - "the GET body contains NO `version` key and NO `updated_at` key"
            - "data.verdict == \"PASS\" (6.0 <= CHILL_DOWN_MAX_C 8.0), sequence_no == 1, measured_at_utc == \"2026-09-15T05:00:00Z\""
            - "the second check is a NEW row with sequence_no == 2 and verdict \"PASS\"; the first row is untouched"
            - "GET /haccp-checks with production_batch_id ${b_y_id} returns total_count == 2"

  # =========================================================================
  # Guide section 2 — From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: locking_the_counts_twice_returns_invalid_flight_state
        claim_type: idempotency
        grounds:
          - state_machines.Flight.SCHEDULED_to_COUNTS_LOCKED
          - errors[ERR_INVALID_FLIGHT_STATE]
        distinguishing_aspect: |
          lock-counts is not idempotent: the second call is refused at priority 70 and counts_locked_at
          keeps the FIRST instant, so a replayed schedule-feed message cannot re-stamp the lock.
        test_recipe:
          setup:
            - "Flight AN411 was locked at 2026-09-15T03:00:00Z, taking Flight.version from 1 to 2."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T03:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /flights/${f_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_FLIGHT_STATE\""
            - "Flight.${f_id}.status == \"COUNTS_LOCKED\" and counts_locked_at == \"2026-09-15T03:00:00Z\" (not 03:30)"
            - "Flight.${f_id}.version == 2 — the refused call bumped nothing"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ProductionBatch.initial_state
          - state_machines.Cart.initial_state
          - state_machines.LoadingManifest.initial_state
        distinguishing_aspect: |
          Three entities are born in three different initial states in the same chain: ProductionBatch
          PLANNED with zeroed counters, Cart EMPTY on the build axis AND UNSEALED on the seal axis at
          once, and LoadingManifest DRAFT with amendment_count 0.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with one CHILL batch of 180 units."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
          trigger:
            - { call: "GET /production-batches", payload: { flight_id: "${f_id}" }, as: ProductionSupervisor }
            - *k_cart
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { f_v_init: $.data.version } }
            - { call: "POST /flights/${f_id}/loading-manifests", payload: { expected_flight_version: "${f_v_init}" }, as: LoadMaster, as_user_id: "lm_bob", captures: { mf_init_id: $.data.id } }
          assert:
            - "total_count == 1; the batch has production_status \"PLANNED\", produced_qty 0, scrapped_qty 0"
            - "the batch has haccp_rework_rounds == 0, haccp_risk_score == 0.00, is_overflow == false, store_zone \"CHILL\", planned_qty 180"
            - "Cart.${cart_id}.build_status == \"EMPTY\" and seal_status == \"UNSEALED\" on the same row at once, with seal_count 0, seal_number null, loaded_units 0"
            - "LoadingManifest.${mf_init_id}.status == \"DRAFT\", amendment_count == 0, total_units == 0, issued_at null, manifest_number == \"MFST-AN411-1\""

      - name: completing_or_releasing_a_planned_batch_returns_invalid_batch_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_COMPLETED
          - state_machines.ProductionBatch.COMPLETED_to_RELEASED
          - errors[ERR_INVALID_BATCH_STATE]
        distinguishing_aspect: |
          From PLANNED the only legal trigger is /start; both /complete and /release are refused at
          priority 70 with ERR_INVALID_BATCH_STATE before their own payload or food-safety checks run,
          so produced_qty stays 0 rather than being written and then rolled back.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED; its CHILL batch of 180 units is still PLANNED (never started)."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
          trigger:
            - { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 10 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor }
          assert:
            - "both calls return HTTP 409 with data.error_id == \"ERR_INVALID_BATCH_STATE\""
            - "ProductionBatch.${b_y_id}.production_status == \"PLANNED\", produced_qty == 0, scrapped_qty == 0, released_at null"
            - "Flight.${f_id}.units_produced == 0 and units_scrapped == 0"

      - name: completing_a_batch_short_scraps_the_shortfall_and_syncs_the_flight_ledger
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_COMPLETED
          - entities.Flight.fields.units_produced
          - entities.Flight.fields.unit_balance
        distinguishing_aspect: |
          /complete writes TWO quantities from one input: produced_qty as submitted and scrapped_qty as
          planned_qty - produced_qty, then reconciles three Flight aggregates. 170 produced out of 180
          planned must give scrapped 10 and unit_balance 170 (produced minus the still-zero loaded).
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 units is IN_PRODUCTION with both required checks PASSing."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
          trigger:
            - { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 170 }, as: ProductionSupervisor }
          assert:
            - "ProductionBatch.${b_y_id}.production_status == \"COMPLETED\", produced_qty == 170, scrapped_qty == 10"
            - "Flight.${f_id}.units_produced == 170 and units_scrapped == 10"
            - "Flight.${f_id}.units_loaded == 0 and unit_balance == 170"
            - "Flight.${f_id}.units_planned == 180 — completing short never rewrites the plan"

      - name: cancelling_a_loaded_flight_cascades_to_batches_items_carts_manifest_and_runs
        claim_type: cascade_down
        grounds:
          - state_machines.Flight.SCHEDULED_to_CANCELLED
          - state_machines.LoadingManifest.ISSUED_to_VOID
          - state_machines.DeliveryRun.RESERVED_to_CANCELLED
          - state_machines.Cart.BUILT_to_BUILDING
        distinguishing_aspect: |
          One cancel fans out to five entity families in a single request: batch -> REJECTED with
          scrapped_qty forced to planned_qty, CartItem -> VOID, which in turn breaks the cart's seal and
          walks the build axis back, manifest -> VOID and the RESERVED run -> CANCELLED with
          miss_reason SLOT_LOST. Only non-terminal children are touched.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED: batch RELEASED with 180 produced units, cart CHL-01 BUILT and SEALED by lm_alice, manifest ISSUED by lm_bob, one RESERVED delivery run for 07:30-08:00."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - &k_truck1 { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-101", buffer_minutes: 20 }, as: PlatformAdmin, captures: { truck1_id: $.data.id } }
            - &k_stand1 { call: "POST /stands", payload: { station_code: "OSL", stand_code: "A12", max_concurrent_runs: 2 }, as: PlatformAdmin, captures: { stand1_id: $.data.id } }
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - &k_item     { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 180 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item_id: $.data.id } }
            - &k_build    { call: "POST /carts/${cart_id}/build-completion", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - &k_getcart  { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v1: $.data.version } }
            - &k_seal     { call: "POST /carts/${cart_id}/seals", payload: { expected_cart_version: "${cart_v1}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice" }
            - &k_clk_mfst { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:00:00Z" }, as: PlatformAdmin }
            - &k_getflt   { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { f_v1: $.data.version } }
            - &k_mfst     { call: "POST /flights/${f_id}/loading-manifests", payload: { expected_flight_version: "${f_v1}" }, as: LoadMaster, as_user_id: "lm_bob", captures: { mf_id: $.data.id } }
            - &k_issue    { call: "POST /loading-manifests/${mf_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - &k_run      { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T07:30:00Z", window_end_utc: "2026-09-15T08:00:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /flights/${f_id}/cancel", payload: { reason: "AIRCRAFT_SWAP" }, as: ScheduleFeedOperator }
          assert:
            - "Flight.${f_id}.status == \"CANCELLED\" (a terminal state)"
            - "ProductionBatch.${b_y_id}.production_status == \"REJECTED\" with scrapped_qty == 180"
            - "CartItem.${item_id}.status == \"VOID\" with voided_at == \"2026-09-15T07:00:00Z\""
            - "Cart.${cart_id}.build_status == \"BUILDING\", seal_status == \"BROKEN\", loaded_units == 0, seal_number still \"SEAL-AN411-01\" for audit"
            - "LoadingManifest.${mf_id}.status == \"VOID\""
            - "DeliveryRun.${run_id}.status == \"CANCELLED\" with miss_reason == \"SLOT_LOST\""
            - "Flight.${f_id}.units_loaded == 0, units_produced == 0 (REJECTED batches leave the produced set), units_scrapped == 180"

      - name: deleting_a_cart_item_breaks_the_seal_and_reverts_the_flight_to_planned
        claim_type: cross_entity
        grounds:
          - endpoints.DELETE_/carts/{id}/items/{cart_item_id}
          - state_machines.LoadingManifest.ISSUED_to_AMENDED
          - state_machines.Flight.LOADED_to_PLANNED
        distinguishing_aspect: |
          One DELETE walks four entities backwards in one request: CartItem -> VOID, Cart's build axis
          BUILT -> BUILDING and its seal axis SEALED -> BROKEN, manifest ISSUED -> AMENDED with
          amendment_count 1, and Flight LOADED -> PLANNED. The seal_number survives for audit.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED with one 180-unit CartItem in the sealed, manifested cart CHL-01."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
          trigger:
            - { call: "DELETE /carts/${cart_id}/items/${item_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "HTTP 200 with data.status == \"VOID\" and data.voided_at == \"2026-09-15T07:00:00Z\""
            - "Cart.${cart_id}.build_status == \"BUILDING\", seal_status == \"BROKEN\", loaded_units == 0, seal_count == 1, seal_number == \"SEAL-AN411-01\""
            - "LoadingManifest.${mf_id}.status == \"AMENDED\" with amendment_count == 1"
            - "Flight.${f_id}.status == \"PLANNED\", units_loaded == 0, unit_balance == 180, cost_per_pax_cents == 0"

      - name: delivering_or_recovering_a_reserved_run_returns_invalid_run_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.DeliveryRun.AT_AIRCRAFT_to_DELIVERED
          - state_machines.DeliveryRun.MISSED_to_RECOVERED
          - errors[ERR_INVALID_RUN_STATE]
        distinguishing_aspect: |
          From RESERVED the only legal event is DISPATCH: DELIVER cannot skip EN_ROUTE/AT_AIRCRAFT and a
          recovery run cannot be opened for a run that never MISSED. Both are 409 ERR_INVALID_RUN_STATE
          and neither stamps delivered_at_utc nor creates a second run row.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED with one RESERVED delivery run for the 07:30-08:00 window."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
          trigger:
            - { call: "POST /delivery-runs/${run_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /delivery-runs/${run_id}/recovery-runs", payload: { truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:20:00Z", window_end_utc: "2026-09-15T08:50:00Z" }, as: LoadMaster, as_user_id: "lm_bob" }
          assert:
            - "both calls return HTTP 409 with data.error_id == \"ERR_INVALID_RUN_STATE\""
            - "DeliveryRun.${run_id}.status == \"RESERVED\", dispatched_at_utc null, delivered_at_utc null, version == 1"
            - "GET /delivery-runs with loading_manifest_id ${mf_id} returns total_count == 1"
            - "Flight.${f_id}.status == \"LOADED\" — nothing advanced"

      - name: a_recovery_run_delivering_bubbles_the_missed_flight_up_to_departed
        claim_type: bubble_up
        grounds:
          - state_machines.DeliveryRun.EN_ROUTE_to_MISSED
          - state_machines.DeliveryRun.MISSED_to_RECOVERED
          - state_machines.Flight.LOADED_to_DEPARTED
          - calculations.delivery_lateness_penalty
        distinguishing_aspect: |
          A MISS does NOT advance the flight — it takes the 750000-cent flat penalty with
          lateness_minutes left at 0 and raises a LATE_DELIVERY MAJOR finding. The flight only bubbles
          to DEPARTED once the RECOVERED original and the DELIVERED replacement are both terminal, and
          the on-time replacement adds no second penalty.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED with one RESERVED run for 07:30-08:00 on truck HL-101 and stand A12."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
            - &k_clk_disp { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:25:00Z" }, as: PlatformAdmin }
            - &k_disp     { call: "POST /delivery-runs/${run_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:35:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run_id}/events", payload: { event_type: "MISS", miss_reason: "TRAFFIC" }, as: LoadMaster, as_user_id: "lm_bob" }
          trigger:
            - { call: "POST /delivery-runs/${run_id}/recovery-runs", payload: { truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:20:00Z", window_end_utc: "2026-09-15T08:50:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { rec_run_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:15:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${rec_run_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${rec_run_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:50:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${rec_run_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
          assert:
            - "after the MISS: DeliveryRun.${run_id}.status == \"MISSED\", penalty_cents == 750000, lateness_minutes == 0, miss_reason == \"TRAFFIC\", and Flight.${f_id}.status was still \"LOADED\""
            - "the recovery call sets DeliveryRun.${run_id}.status == \"RECOVERED\" and creates ${rec_run_id} in \"RESERVED\" with recovery_of_run_id == ${run_id} and loading_manifest_id == ${mf_id}"
            - "the replacement window 08:20-08:50 clears the 20-minute buffer of the 08:00 window end exactly (08:20 is not before 08:20) and ends before 09:15 == revised_std minus SLOT_LATEST_LEAD_MINUTES"
            - "DeliveryRun.${rec_run_id}.status == \"DELIVERED\", delivered_at_utc == \"2026-09-15T08:50:00Z\", lateness_minutes == 0, penalty_cents == 0"
            - "Flight.${f_id}.status == \"DEPARTED\" and Cart.${cart_id}.build_status == \"LOADED\""
            - "GET /audit-findings with flight_id ${f_id} returns total_count == 1: LATE_DELIVERY MAJOR, penalty_cents 200000, source SYSTEM"

      - name: a_delay_below_the_reslot_threshold_leaves_the_runs_alone_and_at_it_reslots_them
        claim_type: conditional_cascade
        grounds:
          - state_machines.Flight.COUNTS_LOCKED_to_COUNTS_LOCKED
          - state_machines.DeliveryRun.RESERVED_to_RESCHEDULED
          - validations[priority=110]
        distinguishing_aspect: |
          The delay cascade is conditional on the CUMULATIVE delay reaching
          DELAY_RESLOT_THRESHOLD_MINUTES 90: a first 60-minute delay moves revised_std_utc and the
          cutoff but leaves the run window and the manifest untouched; a further 30 minutes crosses the
          threshold and shifts the window by the full cumulative 90, amending the issued manifest.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED with an ISSUED manifest and one RESERVED run for 07:30-08:00."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
          trigger:
            - { call: "POST /flights/${f_id}/delays", payload: { delay_minutes: 60, reason: "ATC_SLOT" }, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f_id}/delays", payload: { delay_minutes: 30, reason: "ATC_SLOT" }, as: ScheduleFeedOperator }
          assert:
            - "after call 1: Flight.${f_id}.delay_minutes == 60, revised_std_utc == \"2026-09-15T11:00:00Z\", special_meal_cutoff_utc == \"2026-09-14T23:00:00Z\", status \"LOADED\""
            - "after call 1: DeliveryRun.${run_id}.status == \"RESERVED\" with window 07:30-08:00 unchanged and LoadingManifest.${mf_id}.status == \"ISSUED\", amendment_count 0"
            - "after call 2: Flight.${f_id}.delay_minutes == 90, revised_std_utc == \"2026-09-15T11:30:00Z\", special_meal_cutoff_utc == \"2026-09-14T23:30:00Z\""
            - "after call 2: DeliveryRun.${run_id}.status == \"RESCHEDULED\" with window_start_utc \"2026-09-15T09:00:00Z\" and window_end_utc \"2026-09-15T09:30:00Z\" — shifted by the cumulative 90, not by 30"
            - "after call 2: LoadingManifest.${mf_id}.status == \"AMENDED\" with amendment_count == 1 and Flight.${f_id}.status == \"PLANNED\""
            - "ProductionBatch.${b_y_id}.release_deadline_utc is still \"2026-09-15T08:30:00Z\" — deadlines are pinned at planning time"

      - name: a_reconciled_flight_refuses_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Flight.terminal_states
          - state_machines.Flight.DEPARTED_to_RECONCILED
          - errors[ERR_INVALID_FLIGHT_STATE]
        distinguishing_aspect: |
          RECONCILED is terminal for every one of the flight's four operator triggers — lock-counts,
          production-plan, delays and cancel all return 409 — which is what makes the billing snapshot
          on the UpliftRecord final.
        test_recipe:
          setup:
            - "Flight AN411 was delivered on time at 07:55 and reconciled at 13:00 with 170 consumed and 10 returned units."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
            - *k_clk_disp
            - *k_disp
            - &k_clk_arr  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:50:00Z" }, as: PlatformAdmin }
            - &k_arr      { call: "POST /delivery-runs/${run_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - &k_clk_del  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:55:00Z" }, as: PlatformAdmin }
            - &k_del      { call: "POST /delivery-runs/${run_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
            - &k_clk_upl  { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T13:00:00Z" }, as: PlatformAdmin }
            - &k_getflt2  { call: "GET /flights/${f_id}", payload: {}, as: ComplianceOfficer, captures: { f_v2: $.data.version } }
            - &k_upl      { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v2}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 170, returned_units: 10 }] }, as: ComplianceOfficer, captures: { upl_id: $.data.id } }
          trigger:
            - { call: "POST /flights/${f_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor }
            - { call: "POST /flights/${f_id}/delays", payload: { delay_minutes: 30 }, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f_id}/cancel", payload: { reason: "TOO_LATE" }, as: ScheduleFeedOperator }
          assert:
            - "all four calls return HTTP 409 with data.error_id == \"ERR_INVALID_FLIGHT_STATE\""
            - "Flight.${f_id}.status == \"RECONCILED\", delay_minutes == 0, units_planned == 180"
            - "UpliftRecord.${upl_id}.status == \"DRAFT\" with uplifted_units 180, gross_cost_cents 292320, late_penalty_cents 0"
            - "GET /production-batches with flight_id ${f_id} still returns exactly one batch, production_status \"RELEASED\""

      - name: waste_manifest_transitions_refuse_out_of_order_actions_and_close_the_uplift_record
        claim_type: invalid_transitions
        grounds:
          - state_machines.WasteManifest.DRAFT_to_SEALED
          - state_machines.WasteManifest.SEALED_to_DISPOSED
          - state_machines.UpliftRecord.DISPOSITIONED_to_CLOSED
          - errors[ERR_INVALID_RESOURCE_STATE]
        distinguishing_aspect: |
          DISPOSE is legal only from SEALED: attempting it on a DRAFT manifest returns 409, the SEAL
          then DISPOSE pair succeeds and drives the owning UpliftRecord DISPOSITIONED -> CLOSED, after
          which the terminal DISPOSED manifest refuses SEAL as well.
        test_recipe:
          setup:
            - "Flight AN411 is RECONCILED, its UpliftRecord is DISPOSITIONED with 10 destroyed units, and a BONDED WasteManifest exists in DRAFT."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
            - *k_clk_disp
            - *k_disp
            - *k_clk_arr
            - *k_arr
            - *k_clk_del
            - *k_del
            - *k_clk_upl
            - *k_getflt2
            - *k_upl
            - &k_dispo { call: "POST /uplift-records/${upl_id}/dispositions", payload: { dispositions: [{ meal_specification_id: "${spec_y_id}", reuse_units: 0, donate_units: 0, destroy_units: 10 }] }, as: ComplianceOfficer }
            - &k_waste { call: "POST /waste-manifests", payload: { uplift_record_id: "${upl_id}", disposal_method: "INCINERATION", seal_number: "WM-AN411-01" }, as: ComplianceOfficer, captures: { wm_id: $.data.id } }
          trigger:
            - { call: "POST /waste-manifests/${wm_id}/transitions", payload: { action: "DISPOSE" }, as: ComplianceOfficer }
            - { call: "POST /waste-manifests/${wm_id}/transitions", payload: { action: "SEAL" }, as: ComplianceOfficer }
            - { call: "POST /waste-manifests/${wm_id}/transitions", payload: { action: "DISPOSE" }, as: ComplianceOfficer }
            - { call: "POST /waste-manifests/${wm_id}/transitions", payload: { action: "SEAL" }, as: ComplianceOfficer }
          assert:
            - "call 1 -> HTTP 409 ERR_INVALID_RESOURCE_STATE and the manifest stays \"DRAFT\""
            - "call 2 -> status \"SEALED\"; call 3 -> status \"DISPOSED\"; call 4 -> HTTP 409 ERR_INVALID_RESOURCE_STATE"
            - "WasteManifest.${wm_id}.regime == \"BONDED\" and sealed_weight_grams == 7000 == 10 * 700"
            - "UpliftRecord.${upl_id}.status == \"CLOSED\" only after call 3"
            - "Cart.${cart_id}.build_status == \"RETURNED\" and seal_status == \"BROKEN\" — set when the manifest was created, not when it was disposed"

      - name: batch_cycles_back_into_production_and_the_rework_counter_climbs
        claim_type: cyclic
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD
          - state_machines.ProductionBatch.HACCP_HOLD_to_IN_PRODUCTION
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_cycles_twice_through_haccp_hold_and_is_then_barred_from_release
          rationale: "That §1.8 instance walks the full two-round cycle, asserts haccp_rework_rounds 1 then 2, the 40.00/55.00/95.00/100.00 risk ladder and the ERR_HACCP_REWORK_LIMIT termination condition."

      - name: cart_build_and_seal_axes_move_independently_on_one_row
        claim_type: parallel
        grounds:
          - state_machines.Cart.build_status
          - state_machines.Cart.seal_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / cart_build_axis_and_seal_axis_advance_without_touching_each_other
          rationale: "That §1.8 instance drives each axis while pinning the other and asserts the combined (build_status, seal_status) pair after every hop."

      - name: flight_status_is_auto_derived_from_its_delivery_runs
        claim_type: compound
        grounds:
          - state_machines.Flight.LOADED_to_DEPARTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / flight_departs_only_after_every_run_of_the_issued_manifest_is_terminal
          rationale: "That §1.8 instance proves the join condition: the flight stays LOADED while any run of the ISSUED manifest is non-terminal and auto-departs on the last one."
  # =========================================================================
  # Guide section 3 — From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:

      - name: zone_allocation_overflows_chill_into_dry_in_the_pinned_visit_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.production_plan_zone_allocation
          - calculations.flight_meal_requirement
          - entities.ProductionBatch.fields.is_overflow
        distinguishing_aspect: |
          The waterfall visits zones [HOT, CHILL, DRY], then cabins [FIRST, BUSINESS, ECONOMY], then
          spec_code ASCII, and spills only what does not fit: 297 CHILL standard units fill CHILL's 250
          and push 47 into DRY, after which the 3 VGML units find CHILL already full and go entirely to
          DRY. Overflow batches are flagged, the home-zone batch is not, and one (spec, zone) pair
          yields exactly one batch — so AN-Y-STD produces two batches, not one.
        test_recipe:
          setup:
            - "Airline AN with specifications AN-F-STD (HOT), AN-C-STD (HOT), AN-Y-STD (CHILL) and AN-Y-VGML (CHILL)."
            - "Flight AN421 std 2026-09-15T10:00:00Z with 8 FIRST, 24 BUSINESS and 300 ECONOMY passengers."
            - "Three ECONOMY VGML special meal orders were captured on 2026-09-14T12:00:00Z, before the 22:00 cutoff, and confirmed by the count lock."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - &k_spec_f { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-F-STD", cabin: "FIRST", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 420, gross_weight_grams: 900, unit_cost_cents: 4200, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_f_id: $.data.id } }
            - &k_spec_c { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-C-STD", cabin: "BUSINESS", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 380, gross_weight_grams: 850, unit_cost_cents: 3900, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 5.00 }, as: PlatformAdmin, captures: { spec_c_id: $.data.id } }
            - &k_spec_v { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-Y-VGML", cabin: "ECONOMY", meal_code: "VGML", storage_class: "CHILL", portion_grams: 310, gross_weight_grams: 690, unit_cost_cents: 1650, shelf_life_hours: 72, required_haccp_steps: ["CHILL_DOWN", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_v_id: $.data.id } }
            - &k_flt_wf { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN421", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-DDD", station_code: "OSL", pax_first: 8, pax_business: 24, pax_economy: 300 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-14T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-A1", seat_number: "21A" }, as: AirlineRep, as_user_id: "${an_id}" }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-A2", seat_number: "21B" }, as: AirlineRep, as_user_id: "${an_id}" }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-A3", seat_number: "21C" }, as: AirlineRep, as_user_id: "${an_id}" }
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
          trigger:
            - { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor }
          assert:
            - "before the plan, Flight.${f_id}.units_planned_provisional == 342 == 8 + ceil(24 * 1.05) + ceil(300 * 1.025) == 8 + 26 + 308"
            - "GET /special-meal-orders with flight_id ${f_id} shows all three orders CONFIRMED with cabin \"ECONOMY\""
            - "the trigger returns response_type \"array\" with len(data) == 5 and Flight.${f_id}.units_planned == 332 == 8 + 24 + 297 + 3"
            - "data[0]: meal_specification_id ${spec_f_id}, store_zone \"HOT\", planned_qty 8, is_overflow false"
            - "data[1]: meal_specification_id ${spec_c_id}, store_zone \"HOT\", planned_qty 24, is_overflow false"
            - "data[2]: meal_specification_id ${spec_y_id}, store_zone \"CHILL\", planned_qty 250, is_overflow false"
            - "data[3]: meal_specification_id ${spec_y_id}, store_zone \"DRY\", planned_qty 47, is_overflow true — CHILL was exhausted and AN-Y-STD's 72h shelf life clears OVERFLOW_MIN_SHELF_LIFE_HOURS[CHILL] == 72"
            - "data[4]: meal_specification_id ${spec_v_id}, store_zone \"DRY\", planned_qty 3, is_overflow true — VGML was visited after AN-Y-STD by spec_code ASCII order and found CHILL already full"
            - "GET /production-batches with flight_id ${f_id} and is_overflow true returns total_count == 2"
            - "the two HOT batches carry release_deadline_utc \"2026-09-15T08:00:00Z\" (ZONE_CUTOFF_HOURS[HOT] == 4 binds) and the CHILL and DRY batches carry \"2026-09-15T08:30:00Z\" (SLOT_PREP_LEAD_MINUTES 90 binds)"

      - name: each_release_deadline_term_binds_on_a_different_batch_of_one_plan
        claim_type: correct_result
        grounds:
          - calculations.batch_release_deadline
          - entities.ProductionBatch.fields.release_deadline_utc
        distinguishing_aspect: |
          batch_release_deadline is a three-way minimum and one plan makes all three terms bind at
          once: a 2-hour BUSINESS spec is capped by its shelf life (06:00), an 8-hour FIRST spec is
          capped by the HOT zone cutoff of 4 hours (08:00), and the 72-hour CHILL spec is capped by
          revised_std minus SLOT_PREP_LEAD_MINUTES (08:30).
        test_recipe:
          setup:
            - "Airline AN with AN-F-LNG (FIRST/HOT, 8h shelf), AN-C-SHT (BUSINESS/HOT, 2h shelf) and AN-Y-STD (ECONOMY/CHILL, 72h shelf)."
            - "Flight AN422 std 2026-09-15T10:00:00Z with 4 FIRST, 6 BUSINESS, 10 ECONOMY passengers; planning happens at 04:00."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - &k_spec_flng { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-F-LNG", cabin: "FIRST", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 430, gross_weight_grams: 910, unit_cost_cents: 4400, shelf_life_hours: 8, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_flng_id: $.data.id } }
            - &k_spec_csht { call: "POST /meal-specifications", payload: { airline_id: "${an_id}", spec_code: "AN-C-SHT", cabin: "BUSINESS", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 380, gross_weight_grams: 850, unit_cost_cents: 3900, shelf_life_hours: 2, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_csht_id: $.data.id } }
            - &k_flt_thr { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN422", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-EEE", station_code: "OSL", pax_first: 4, pax_business: 6, pax_economy: 10 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
          trigger:
            - { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_f_id: "$.data[0].id", b_c_id: "$.data[1].id", b_y_id: "$.data[2].id" } }
          assert:
            - "len(data) == 3 and Flight.${f_id}.units_planned == 20; units_planned_provisional had been 21 == 4 + 6 + ceil(10 * 1.025)"
            - "ProductionBatch.${b_f_id}.release_deadline_utc == \"2026-09-15T08:00:00Z\" — min(04:00+8h, 08:30, 04:00+4h) picks the HOT zone cutoff"
            - "ProductionBatch.${b_c_id}.release_deadline_utc == \"2026-09-15T06:00:00Z\" — min(04:00+2h, 08:30, 04:00+4h) picks the 2h shelf life"
            - "ProductionBatch.${b_y_id}.release_deadline_utc == \"2026-09-15T08:30:00Z\" — min(2026-09-18T04:00, 08:30, 2026-09-18T04:00) picks revised_std minus 90 minutes"
            - "all three batches have store_zone equal to their specification's storage_class and is_overflow false"

      - name: cook_temp_verdict_flips_one_tenth_of_a_degree_below_the_pinned_minimum
        claim_type: constants_applied
        grounds:
          - calculations.haccp_check_verdict
          - calculations.haccp_risk_score
          - state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD
        distinguishing_aspect: |
          COOK_TEMP is the only step with a MINIMUM: 75.0 exactly PASSes (the comparison is inclusive)
          and 74.9 FAILs, which fires the IN_PRODUCTION -> HACCP_HOLD edge and scores
          40.0 * 1 fail + 15.0 * 0 rework rounds == 40.00 on a batch that has not been reworked yet.
        test_recipe:
          setup:
            - "Flight AN422's HOT FIRST batch of 4 AN-F-LNG units is IN_PRODUCTION at 04:30."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_spec_flng
            - *k_spec_csht
            - *k_flt_thr
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_f_id: "$.data[0].id" } }
            - *k_clk_prod
            - { call: "POST /production-batches/${b_f_id}/start", payload: {}, as: ProductionSupervisor }
            - *k_clk_qa
          trigger:
            - { call: "POST /production-batches/${b_f_id}/haccp-checks", payload: { step_code: "COOK_TEMP", measured_temp_c: 75.0 }, as: QaOfficer }
            - { call: "POST /production-batches/${b_f_id}/haccp-checks", payload: { step_code: "COOK_TEMP", measured_temp_c: 74.9 }, as: QaOfficer }
          assert:
            - "call 1 -> verdict \"PASS\" with sequence_no == 1; COOK_TEMP_MIN_C 75.0 is inclusive"
            - "after call 1 ProductionBatch.${b_f_id}.production_status is still \"IN_PRODUCTION\" and haccp_risk_score == 0.00"
            - "call 2 -> verdict \"FAIL\" with sequence_no == 2 — sequence_no is per (batch, step_code)"
            - "after call 2 ProductionBatch.${b_f_id}.production_status == \"HACCP_HOLD\", haccp_rework_rounds == 0, haccp_risk_score == 40.00"

      - name: a_small_uplift_is_priced_in_the_lowest_handling_band
        claim_type: tiered_pricing
        grounds:
          - calculations.flight_billing_total
          - calculations.uplift_cost_reconciliation
          - entities.UpliftRecord.fields.handling_fee_cents
        distinguishing_aspect: |
          With every unit consumed there is nothing to credit, so net_cost_cents equals
          gross_cost_cents and the 162400-cent total sits in the first HANDLING_TIERS band: the whole
          amount is charged at 0.09 (average-rate, not marginal), and with no delivery penalty the
          billing total is exactly net + handling.
        test_recipe:
          setup:
            - "Flight AN411 carried 100 ECONOMY passengers, was delivered on time at 07:55 and is DEPARTED."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - &k_flt100 { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 100 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - &k_cmpl100 { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 100 }, as: ProductionSupervisor }
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - &k_item100 { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 100 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item_id: $.data.id } }
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
            - *k_clk_disp
            - *k_disp
            - *k_clk_arr
            - *k_arr
            - *k_clk_del
            - *k_del
            - *k_clk_upl
            - *k_getflt2
          trigger:
            - &k_upl100 { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v2}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 100, returned_units: 0 }] }, as: ComplianceOfficer, captures: { upl_id: $.data.id } }
          assert:
            - "UpliftRecord.${upl_id}.uplifted_units == 100, consumed_units == 100, returned_units == 0, unused_units == 0"
            - "gross_cost_cents == 162400 == round_half_up(100 * 1450 * 1.12)"
            - "net_cost_cents == 162400 — with no dispositions recorded net equals gross"
            - "handling_fee_cents == 14616 == round_half_up(162400 * 0.09); the 0.09 band covers 0..199999 and applies to the whole amount"
            - "late_penalty_cents == 0 and billing_total_cents == 177016 == 162400 + 14616 + 0"
            - "cost_per_pax_cents == 1624 == round_half_up(162400 / 100) and Flight.${f_id}.status == \"RECONCILED\""

      - name: a_forty_unit_shortfall_lands_in_the_critical_deviation_band
        claim_type: threshold
        grounds:
          - calculations.spec_compliance_deviation
          - calculations.audit_penalty
          - calculations.flight_billing_total
        distinguishing_aspect: |
          140 delivered against a required 180 is 22.22 %, past the 20.0 open-ended CRITICAL band, so
          reconciliation raises a SPEC_DEVIATION finding priced at 120000 * 5.0 and the airline's open
          finding counter moves — while the same reconciliation's smaller net cost drops into the
          middle 0.07 handling band.
        test_recipe:
          setup:
            - "Flight AN411 planned 180 AN-Y-STD units but produced only 140, all of which were loaded, delivered on time and are being reconciled."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
