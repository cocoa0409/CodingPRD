  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_historical_rate_rounds_each_failure_mode_before_summing
        claim_type: Precision
        grounds:
          - calculations.warranty_accrual_amount
          - calculations.warranty_accrual_amount.precision
          - calculations.history_maturity_classification
        distinguishing_aspect: "Two failure modes on one vintage: rate_ppm and ult_claims are rounded PER MODE (2333 ppm -> 17 claims, 1333 ppm -> 10 claims) so expected_claim_rate_ppm is 3666 and gross is 690000; summing the 11 raw claims first would give 3667 ppm and 28 claims."
        test_recipe:
          setup:
            - "AccrualPeriod 2026-Q3 (OPEN) exists so observation_period_code resolves."
            - "ProductFamily FAM-PR: standard_cost_per_claim_cents 25000, reserve_cap_cents 20000000; vintages V1 3000 units and V2 2500 units -> observed_exposure_units 5500."
            - "FailureMode FM-PR-01 cost_per_claim_cents 20000 and FM-PR-02 cost_per_claim_cents 35000."
            - "Observations on V1 only, both bucket [0,12) but on different failure modes so the half-open overlap check (keyed on vintage_id + failure_mode_id) does not fire: FM-PR-01 claim_count 7 paid 100000, FM-PR-02 claim_count 4 paid 80000. observed_history_months becomes 12 -> MATURE, so HISTORICAL_RATE is permitted."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_pr_id: $.data.id, p_pr_ver: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-PR", name: "Precision Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 25000, reserve_cap_cents: 20000000 }
              as: WarrantyAnalyst
              captures: { fam_pr_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_pr_id}", vintage_code: "PR-MY2024", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_pr1_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_pr_id}", vintage_code: "PR-MY2025", units_shipped: 2500, ship_period_code: "2025-Q1", warranty_expiry_date: "2029-12-31" }
              as: WarrantyAnalyst
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_pr_id}", mode_code: "FM-PR-01", description: "Precision bearing wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_pr1_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_pr_id}", mode_code: "FM-PR-02", description: "Precision control board fault", severity: "FUNCTIONAL", cost_per_claim_cents: 35000 }
              as: WarrantyAnalyst
              captures: { fm_pr2_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_pr1_id}", failure_mode_id: "${fm_pr1_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 12, claim_count: 7, paid_cost_cents: 100000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_pr1_id}", failure_mode_id: "${fm_pr2_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 12, claim_count: 4, paid_cost_cents: 80000 }
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty/accruals"
