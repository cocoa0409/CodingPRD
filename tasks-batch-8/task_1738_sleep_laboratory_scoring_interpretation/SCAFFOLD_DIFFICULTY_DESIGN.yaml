            - "GET /sleep-studies?bed_id=${bed1}&scheduled_date=2026-08-20 shows exactly 1 study (the pre-existing ${stc})"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
