            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
