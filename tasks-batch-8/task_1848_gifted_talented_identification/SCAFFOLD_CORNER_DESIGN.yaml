            - { call: "POST /gifted/students", payload: { student_number: "ST-Y", legal_name: "Stu Y", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-y" }, as: GiftedCoordinator, captures: { stu_y: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_y}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_y: $.data.id } }
