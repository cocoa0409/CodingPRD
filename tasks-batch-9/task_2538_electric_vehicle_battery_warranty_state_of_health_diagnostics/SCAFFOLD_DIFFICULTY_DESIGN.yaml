              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0051", pack_type: "NEW", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
