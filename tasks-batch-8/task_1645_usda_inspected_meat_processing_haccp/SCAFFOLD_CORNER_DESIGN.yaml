            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager, captures: { st1: $.data.status } }
            - { call: "POST /label-approvals/${label_id}/reject", payload: { rejection_reason: "Claim font too small" }, as: Inspector, as_user_id: "insp-01", captures: { st2: $.data.status } }
            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager, captures: { st3: $.data.status } }
          trigger:
