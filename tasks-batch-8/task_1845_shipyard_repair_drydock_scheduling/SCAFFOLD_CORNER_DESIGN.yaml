              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "A", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1, unit_price_cents: 100 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_a: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "B", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1, unit_price_cents: 100, depends_on_ids: ["${w_a}"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_b: $.data.id }
          trigger:
            - call: "PATCH /v1/work-items/${w_a}"
              payload: { depends_on_ids: ["${w_b}"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DEPENDENCY_CYCLE"

