              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "CAFE", outlet_name: "Harbor Cafe", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { cafe_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "BAR", outlet_name: "Harbor Bar", outlet_type: "REMOTE_POS", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { bar_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${cafe_id}", business_date_id: "${bd1_id}", ticket_number: "C-001", gross_amount: 120.00, settlement_type: "CASH", opened_at: "2026-08-01T17:30:00.000Z" }
              as: OutletManager
              as_user_id: "${cafe_id}"
              captures: { tk_cafe_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${bar_id}", business_date_id: "${bd1_id}", ticket_number: "B-001", gross_amount: 120.00, settlement_type: "CASH", opened_at: "2026-08-01T17:30:00.000Z" }
              as: OutletManager
