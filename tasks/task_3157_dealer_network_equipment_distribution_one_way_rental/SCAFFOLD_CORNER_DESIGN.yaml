      - name: allocation_round_ranks_by_score
        claim_type: bulk_action
        grounds:
          - "calculations.allocation_score"
          - "endpoints[POST /rental-network/dealers/allocate]"
        distinguishing_aspect: "Bulk allocation distributes a pool of unassigned units to requesting dealers in allocation_score DESC order with created_at tie-break; the response lists allocated pairs and skipped unit codes when the pool runs dry."
        test_recipe:
          setup: ["three dealers with performance scores 90, 90, 50 (created in that order so created_at breaks the 90-tie); three units registered to a holding dealer then offered for reallocation"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-E6", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-E6A", name: "Dealer E6A", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { d1: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-E6B", name: "Dealer E6B", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { d2: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-E6C", name: "Dealer E6C", location_id: "${loc}" }
              as: NetworkAdmin
              captures: { d3: $.data.id }
            - call: "POST /rental-network/performance-reviews"
              payload: { period: "2026-Q3", scores: [ { dealer_id: "${d1}", performance_score: 90 }, { dealer_id: "${d2}", performance_score: 90 }, { dealer_id: "${d3}", performance_score: 50 } ] }
              as: NetworkAdmin
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-E6-1", equipment_type: "TRUCK_10FT", dealer_id: "${d3}" }
              as: NetworkAdmin
              captures: { u1: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-E6-2", equipment_type: "TRUCK_10FT", dealer_id: "${d3}" }
              as: NetworkAdmin
              captures: { u2: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-E6-3", equipment_type: "TRUCK_10FT", dealer_id: "${d3}" }
              as: NetworkAdmin
              captures: { u3: $.data.id }
          trigger:
            - call: "POST /rental-network/dealers/allocate"
              payload: { unit_codes: ["U-E6-1", "U-E6-2"] }
              as: NetworkAdmin
          assert:
            - "Allocation order: ${d1} first (score 90, earlier created_at), ${d2} second (score 90, later created_at)"
            - "EquipmentUnit.${u1}.current_dealer_id == ${d1}"
            - "EquipmentUnit.${u2}.current_dealer_id == ${d2}"
            - "EquipmentUnit.${u3}.current_dealer_id == ${d3} (not in the round)"
            - "Dealer.${d1}.allocated_unit_count == 1 and Dealer.${d2}.allocated_unit_count == 1 and Dealer.${d3}.allocated_unit_count == 1"

