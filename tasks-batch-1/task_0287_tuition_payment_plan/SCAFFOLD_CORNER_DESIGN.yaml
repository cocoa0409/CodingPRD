      - name: aid_apply_reduces_latest_installment_first
        claim_type: Correct Result
        grounds: [calculations.balance_recalc_on_aid, entities.Installment.fields.amount_cents]
        distinguishing_aspect: "Applying 50000 aid to an ACTIVE [80000 x4] plan reduces the LATEST installment first: installment 4 -> 30000, installments 1-3 unchanged at 80000, scheduled_balance 270000."
        test_recipe:
          setup: ["Enrollment ACTIVE charges 400000 aid 0 -> [80000 x4] (down 80000 computed); then apply 50000 aid."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst AA", currency: "USD" }
