            - "the DURING captures are inv4_gross == 5200000, inv4_coop == 416000, inv4_net == 4784000, inv4_status_issued == \"ISSUED\", coop1_billed_mid == 416000, coop1_unbilled_mid == 84000 and d4_receivable_mid == 4784000"
            - "response status code == 200"
            - "response body data.status == \"VOID\" and data.paid_cents == 0 and data.net_due_cents == 4784000"
            - "GET /carriage/marketing-commitments/${coop1_id} returns billed_cents == 0, earned_unbilled_cents == 500000, earned_cents == 500000, remaining_cents == 500000, forfeited_cents == 0 and status == \"PARTIALLY_EARNED\" — every field back to its pre-issue value"
            - "GET /carriage/distributors/${d4_id} returns receivable_balance_cents == 0, status == \"ACTIVE\" and audit_recovery_balance_cents == 0"
            - "GET /carriage/subscriber-reports/${rep4_id} returns invoice_id == null and status == \"ACCEPTED\" with license_fee_due_cents == 5200000 (the captured rep4_fee)"
            - "GET /carriage/agreements/${a4_id} returns recognized_revenue_cents == 5200000 — the void is NOT a revenue reversal"
            - "GET /carriage/agreements/${a4_id}/settlement-summary returns marketing_conserved_identity_holds == true, revenue_identity_holds == true, open_receivable_cents == 0, invoiced_gross_total_cents == 0 and recognized_revenue_cents == 5200000"
            - "issuing a FRESH invoice for the same distributor, agreement and period_month 2026-06 succeeds with gross_license_fee_cents == 5200000, coop_offset_cents == 416000 and net_due_cents == 4784000, proving the released report and the restored co-op pool are both reusable"
            - "on a parallel fixture where RECORD_PAYMENT of 1,000,000 is applied before the void, the identical VOID call returns 409 ERR_INVALID_INVOICE_STATE and the ledger is left at billed_cents == 416000 — a partially collected invoice must be written off, never voided"

      - instance_id: CI-2
        name: agreement_reinstate_compensates_suspension_cascade
        grounds:
          - state_machines.CarriageAgreement.SUSPENDED_to_EXECUTED
          - state_machines.RightsWindow.BLOCKED_to_CLEARED
          - calculations.agreement_penetration_compliance
          - errors[ERR_BREACH_COUNT_NOT_CLEARED]
          - entities.CarriageAgreement.fields.recognized_revenue_cents
        title: "Reinstating a breach-suspended agreement undoes the window and title cascade, but never the recognized revenue"
        forward_operation: "Two accepted under-penetrated periods drive penetration_breach_count to PENETRATION_BREACH_SUSPEND_THRESHOLD, auto-suspending the agreement and cascading its CLEARED window to BLOCKED with block_reason AGREEMENT_SUSPENDED"
        compensating_operation: "POST /carriage/agreements/{agreementId}/lifecycle action=REINSTATE, admissible only after three consecutive compliant acceptances have reset penetration_breach_count to 0"
        invariant: >-
          After REINSTATE, lifecycle_status is EXECUTED, suspension_reason is
          NONE, every window blocked with block_reason == AGREEMENT_SUSPENDED is
          CLEARED again, and each affected ContentTitle's cleared_window_count and
          distribution_coverage_status equal their pre-suspension values. In the
          same breath recognized_revenue_cents is strictly monotone across the
          entire episode and equals the sum of all five accepted fees, 23,600,000.
        rationale: >-
          Suspension is a remedy, not a rescission: while suspended the operator
          keeps reporting and the network keeps recognizing revenue on the floor,
          so the cure must restore distribution rights without rewriting the
          ledger. The cure is also gated — reinstatement is refused until the
          breach counter is genuinely cleared by a three-period compliant run —
          which is why the compensation cannot be a simple inverse of the forward
          operation.
        distinguishing_aspect: >-
          The compensation is gated and partial, and both halves are asserted:
          REINSTATE before the cure returns 409 ERR_BREACH_COUNT_NOT_CLEARED,
          REINSTATE after exactly three compliant acceptances returns 200 and
          restores the window to CLEARED / block_reason NONE and the title to
          cleared_window_count 1 / LINEAR_ONLY, yet recognized_revenue_cents stays
          at 23,600,000 across the whole episode. An implementation that reinstates
          on the second compliant period, that leaves the window BLOCKED, or that
          reverses the two breach-period fees each fails a different assert.
        test_recipe:
          setup: >-
            Cliffside Telco has 200,000 homes and a 50% penetration floor, so the
            floor is 100,000 subscribers. Its agreement is executed and one LINEAR
            US window over October 2026 is cleared for a fully cleared title, so
            the title reads cleared_window_count 1 and LINEAR_ONLY. Then 2026-03
            and 2026-04 are each reported at 99,000 subscribers — 0.4950, under the
            floor — and accepted, each billing the floor at 4,000,000 and pushing
            the breach counter to 1 then 2, at which point the agreement
            auto-suspends and the window is blocked. Reinstatement is attempted
            immediately and refused. Then 2026-05, 2026-06 and 2026-07 are each
            reported at 130,000 (0.6500) and accepted for 5,200,000 each, taking
            consecutive_compliant_periods to 1, 2 and then — at the reset run of
            three — back to 0 with penetration_breach_count cleared to 0.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d5_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d5_id}"
                contract_code: "CT-2025-09"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a5_id: "id"
            - call: "POST /carriage/agreements/${a5_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a5_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Autumn Marquee Event"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                t5_id: "id"
            - call: "POST /carriage/content-titles/${t5_id}/rights-status"
              payload:
                rights_status: "OWNED_CLEARED"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${a5_id}"
