              as_user_id: "agent-1"
            - call: "POST /smart-home-support/tickets/${t_id}/close"
              payload: {}
              as: SupportAgent
              as_user_id: "agent-1"
          trigger:
            - call: "POST /smart-home-support/tickets/${t_id}/customer-reply"
              payload: { message: "One more thing" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_TICKET_CLOSED"
            - "Ticket.${t_id}.workflow_status == CLOSED"
            - "Ticket.${t_id}.sla_status == MET"
            - "Ticket.${t_id}.closed_at == 2026-05-01T00:20:00.000Z"

