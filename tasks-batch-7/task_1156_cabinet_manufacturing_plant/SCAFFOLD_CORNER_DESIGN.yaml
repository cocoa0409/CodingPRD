              as_user_id: ${d_id}
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fb_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
