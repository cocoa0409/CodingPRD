# =============================================================================
# Task 1970 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. Every setup_api_calls chain starts from empty DB.
# Logical clock default: 2026-08-01T00:00:00Z (no clock-set call needed unless
# the instance moves time).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: agreement_price_provisional_vs_final_at_close
        grounds:
          - calculations.agreement_pricing
          - entities.PurchaseAgreement.fields.provisional_total_cents
          - entities.PurchaseAgreement.fields.final_total_cents
        distinguishing_aspect: |
          Fiscal variant pair on the PurchaseAgreement: the provisional variant
          (snapshot sum frozen at signing) and the final variant (provisional +
          options + change fees - approved incentives, computed at close) yield
          different totals for the same agreement once options and incentives exist.
        test_recipe:
          setup:
            - "Community budget 1000000, SELLING; phase P1 uplift 0.03 window [2026-08-01, 2026-09-01) ACTIVE at default clock"
            - "Plan Maple 35000000 with elevations A(0)/B(250000); catalog Quartz Counters 800000 cutoff FOUNDATION install DRYWALL"
            - "Lot L-101 CORNER base 8000000 view 200000, RELEASED at 9991000; reserved by buyer; agreement signed (provisional 45241000)"
            - "One Quartz selection CONFIRMED free at PRE_CONSTRUCTION (options_total 800000); incentive 200000 auto-approved (incentives_total 200000)"
            - "Contingencies: financing/appraisal CLEARED, sale_of_home WAIVED at sign -> CONTINGENCIES_CLEARED; all 5 milestones COMPLETE"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/option-catalog-items", payload: { community_id: "${c_id}", option_name: "Quartz Counters", category: "KITCHEN", price_cents: 800000, cutoff_stage: "FOUNDATION", install_stage: "DRYWALL" }, as: SalesDirector, captures: { op_quartz: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_quartz}", quantity: 1 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_q: $.data.id } }
            - { call: "POST /homebuilder/option-selections/${sel_q}/confirm", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/incentive-requests", payload: { agreement_id: "${agr_id}", incentive_type: "RATE_BUYDOWN", amount_cents: 200000 }, as: SalesAgent }
            - { call: "GET /homebuilder/agreements/${agr_id}", payload: {}, as: SalesAgent, captures: { agr_v1: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v1}" }, as: SalesAgent, captures: { agr_v2: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "appraisal", action: "CLEARED", expected_agreement_version: "${agr_v2}" }, as: SalesAgent }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id", m5: "$.data[4].id" } }
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m2}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m3}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m4}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m5}/complete", payload: {}, as: ConstructionManager }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/close", payload: {}, as: SalesAgent }
          assert:
            - "PurchaseAgreement.${agr_id}.status == CLOSED"
            - "PurchaseAgreement.${agr_id}.provisional_total_cents == 45241000 (9991000 + 35000000 + 250000, frozen at signing)"
            - "PurchaseAgreement.${agr_id}.options_total_cents == 800000 and change_fees_total_cents == 0 and incentives_total_cents == 200000"
            - "PurchaseAgreement.${agr_id}.final_total_cents == 45841000 (45241000 + 800000 + 0 - 200000) — diverges from provisional by exactly the post-signing accruals"
            - "PurchaseAgreement.${agr_id}.warranty_status == ENROLLED and warranty_term_months == 12"

      - name: closing_estimate_standard_vs_padded_divergence
        grounds:
          - calculations.closing_date_estimate
          - calculations.slippage_flag
          - entities.PurchaseAgreement.fields.estimated_close_standard
          - entities.PurchaseAgreement.fields.estimated_close_padded
        distinguishing_aspect: |
          Temporal variant pair on the construction schedule (different entity
          domain than the pricing pair): the standard variant sums raw planned
          durations while the padded variant applies a per-stage 15% ceiling
          buffer, so at the same instant the two estimates differ and the
          padded one alone crosses the outside close date.
        test_recipe:
          setup:
            - "Community SELLING with phase P1 ACTIVE; plan Maple; lot L-101 RELEASED at 9991000 and reserved"
            - "Agreement signed at the default clock 2026-08-01T00:00:00Z with outside_close_date 2026-12-20T00:00:00Z (between the two estimate variants)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2026-12-20T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
          assert:
            - "PurchaseAgreement.${agr_id}.estimated_close_standard == 2026-12-14T00:00:00Z (128 remaining stage-days + 7 buffer days from 2026-08-01)"
            - "PurchaseAgreement.${agr_id}.estimated_close_padded == 2027-01-06T00:00:00Z (35+25+33+41+17=151 padded stage-days + 7 buffer days)"
            - "estimated_close_padded != estimated_close_standard for identical inputs at the same instant"
            - "PurchaseAgreement.${agr_id}.slippage_flag == true because padded 2027-01-06 > outside 2026-12-20, even though standard 2026-12-14 < outside"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: lot_release_price_pinned_component_rounding
        grounds:
          - calculations.lot_release_pricing
          - entities.Lot.fields.release_price_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: five inputs (base price, lot_type
          premium table lookup, view adjustment, PREMIUM_CAP via nested min,
          ACTIVE phase uplift with a conditional no-phase branch) and a pinned
          rounding order (round each uplifted component to integer cents, then
          sum) that yields 9991000 for the fixture lot.
        test_recipe:
          setup:
            - "Community SELLING; phase P1 uplift 0.03 window covering the default clock"
            - "Lot L-101 DRAFT: base 8000000, CORNER (premium 1500000), view_adjustment 200000 (raw premium 1700000 < cap 3000000)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
          assert:
            - "Lot.${lot_id}.release_price_cents == 9991000 = round_half_up(8000000*1.03) + round_half_up(min(3000000, 1500000+200000)*1.03) = 8240000 + 1751000"
            - "Lot.${lot_id}.status == RELEASED and release_count == 0"

      - name: incentive_cap_keyed_on_provisional_not_final
        grounds:
          - calculations.agreement_pricing
          - calculations.incentive_budget_ledger
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: incentives reduce the final
          price while the incentive cap is a percentage of price. The scaffold
          pins the cap base to the immutable provisional_total_cents (45241000
          -> cap 2714460) evaluated before incentive subtraction; an amount of
          2720000 fits under a final-price-based cap (6% of 46041000 = 2762460)
          but is rejected under the pinned order, proving the evaluation order.
        test_recipe:
          setup:
            - "Community budget 5000000, SELLING; phase P1 ACTIVE; plan Maple; lot L-101 RELEASED and reserved; agreement signed (provisional 45241000)"
            - "One Quartz selection (800000) CONFIRMED so a final-price-derived cap would differ from the provisional-derived cap"
            - "Incentive request 2720000 created as SUBMITTED (above the 300000 auto-approve limit, within budget at intake)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 5000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/option-catalog-items", payload: { community_id: "${c_id}", option_name: "Quartz Counters", category: "KITCHEN", price_cents: 800000, cutoff_stage: "FOUNDATION", install_stage: "DRYWALL" }, as: SalesDirector, captures: { op_quartz: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_quartz}", quantity: 1 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_q: $.data.id } }
            - { call: "POST /homebuilder/option-selections/${sel_q}/confirm", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/incentive-requests", payload: { agreement_id: "${agr_id}", incentive_type: "RATE_BUYDOWN", amount_cents: 2720000 }, as: SalesAgent, captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/incentive-requests/${inc_id}/decide", payload: { action: "APPROVE" }, as: SalesDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCENTIVE_CAP_EXCEEDED (2720000 > 2714460 = 6% of provisional 45241000)"
            - "IncentiveRequest.${inc_id}.status == SUBMITTED (unchanged)"
            - "Community.${c_id}.incentive_budget_remaining_cents == 5000000 (no debit)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_released_reserved_cycle_restores_inventory
        grounds:
          - state_machines.Lot.RELEASED_to_RESERVED
          - state_machines.Lot.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Cycle on the Lot entity (RELEASED -> RESERVED -> RELEASED): the lot
          returns to its prior state through a different transition than it
          entered, and the cycle must leave pricing state untouched
          (release_price_cents and release_count unchanged by hold churn).
        test_recipe:
          setup:
            - "Community SELLING; phase P1 ACTIVE; lot L-101 RELEASED at 9991000"
            - "Buyer Bea registered"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/release-reservation", payload: {}, as: Buyer, as_user_id: "${b_id}" }
          assert:
            - "Lot.${lot_id}.status == RELEASED (cycle RELEASED -> RESERVED -> RELEASED completed)"
            - "Lot.${lot_id}.release_price_cents == 9991000 (unchanged by hold churn)"
            - "Lot.${lot_id}.release_count == 0 (increments only on SOLD -> RELEASED)"
            - "Lot.${lot_id}.reserved_buyer_id == null and hold_expires_at == null"

      - name: option_selection_confirm_unconfirm_cycle
        grounds:
          - state_machines.OptionSelection.SELECTED_to_CONFIRMED
          - state_machines.OptionSelection.CONFIRMED_to_SELECTED
        distinguishing_aspect: |
          Cycle on the OptionSelection entity (SELECTED -> CONFIRMED -> SELECTED
          -> CONFIRMED): a buyer may re-open a confirmed selection inside the
          free cutoff window and re-confirm it, with no fee accruing and the
          agreement's options_total_cents staying constant across the loop.
        test_recipe:
          setup:
            - "Signed agreement at PRE_CONSTRUCTION (default fixtures: budget 1000000, phase P1, plan Maple, lot L-101 at 9991000, earnest 500000)"
            - "Catalog item EV Outlet 150000, cutoff DRYWALL, install FINAL_WALKTHROUGH"
            - "Selection of EV Outlet qty 1 in SELECTED (options_total 150000)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/option-catalog-items", payload: { community_id: "${c_id}", option_name: "EV Outlet", category: "ELECTRICAL", price_cents: 150000, cutoff_stage: "DRYWALL", install_stage: "FINAL_WALKTHROUGH" }, as: SalesDirector, captures: { op_ev: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_ev}", quantity: 1 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/option-selections/${sel_id}/confirm", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections/${sel_id}/unconfirm", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections/${sel_id}/confirm", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { fin_status: $.data.status } }
          assert:
            - "OptionSelection.${sel_id}.status == CONFIRMED after the SELECTED -> CONFIRMED -> SELECTED -> CONFIRMED loop"
            - "OptionSelection.${sel_id}.change_fee_cents == 0 (all transitions inside the free window: PRE_CONSTRUCTION ordinal 1 <= DRYWALL ordinal 4)"
            - "OptionSelection.${sel_id}.confirmed_at_stage == PRE_CONSTRUCTION"
            - "PurchaseAgreement.${agr_id}.options_total_cents == 150000 (constant across the cycle)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: milestone_completion_stage_lock_reprice_cascade
        grounds:
          - state_machines.ConstructionMilestone.NOT_STARTED_to_COMPLETE
          - state_machines.OptionSelection.SELECTED_to_CANCELLED
          - calculations.closing_date_estimate
        distinguishing_aspect: |
          Depth-3 cascade triggered by milestone completion: completing the
          FOUNDATION milestone (hop 1) advances PurchaseAgreement.current_stage
          to FRAMING and recomputes both closing estimates (hop 2); the stage
          advance auto-cancels the SELECTED Quartz selection whose cutoff_stage
          FOUNDATION is now passed (hop 3); the cancellation recomputes
          options_total_cents on the agreement (hop 4 / observable end-state).
        test_recipe:
          setup:
            - "Signed agreement at PRE_CONSTRUCTION (default fixtures; outside_close_date 2027-03-01)"
            - "Quartz selection (800000, cutoff FOUNDATION) SELECTED and EV Outlet selection (150000, cutoff DRYWALL) SELECTED; options_total 950000"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
