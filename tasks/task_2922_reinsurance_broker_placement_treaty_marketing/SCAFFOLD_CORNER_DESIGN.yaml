          - entities.ClaimAdvocacy.event_date
          - errors.ERR_EVENT_DATE_OUT_OF_PERIOD
          - errors.ERR_DUPLICATE_CLAIM_REFERENCE
        distinguishing_aspect: |
          The treaty period is half-open [inception, expiry): an event stamped exactly at inception is
          covered, an event stamped exactly at expiry is not, and one millisecond before expiry is.
          The obvious implementation uses a closed interval and accepts the expiry-instant loss. The
          same instance shows that claim_reference uniqueness is scoped to the layer, so the identical
          reference is refused on the same layer but accepted on a sibling layer of the same program.
