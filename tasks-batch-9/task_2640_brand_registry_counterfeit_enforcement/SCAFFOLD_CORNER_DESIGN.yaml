  - section: cross_cutting_complexity_layers
    instances:
      - name: enrollment_create_with_a_stale_brand_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enrollment-create-stale-brand]
          - errors[ERR_STALE_BRAND_VERSION]
        distinguishing_aspect: "The first enrollment bumps Brand.version, so the version the caller read before it is already stale: the second create quoting version 1 is ERR_STALE_BRAND_VERSION (412) with nothing persisted, and the identical body quoting the current version returns 201 — proving the refusal was the premise, not a duplicate-enrollment or capacity rule."
        test_recipe:
          setup:
            - "A brand at version 1 with one REGISTERED class-8 mark"
            - "One AMZ enrollment created quoting version 1, which leaves Brand.version at 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v1: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v1}" }
              as: BrandAdministrator
              captures: { enrA_id: $.data.id }
            - call: "GET /brand-protection/brands/${brand_id}"
              as: BrandAdministrator
              captures: { brand_v2: $.data.version }
          trigger:
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "EBY", requested_nice_class: 8, expected_brand_version: "${brand_v1}" }
              as: BrandAdministrator
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "EBY", requested_nice_class: 8, expected_brand_version: "${brand_v2}" }
              as: BrandAdministrator
              captures: { enrB_id: $.data.id }
          assert:
            - "the stale create returns HTTP 412 with data.error_id == ERR_STALE_BRAND_VERSION"
            - "immediately after the refusal GET /brand-protection/enrollments?brand_id=${brand_id} still reports total_count 1 and Brand.${brand_id}.version == ${brand_v2}"
            - "the retry quoting ${brand_v2} returns HTTP 201 with enrollment_status SUBMITTED and marketplace_code EBY"
            - "Brand.${brand_id}.version is ${brand_v2} + 1 after the successful create and its status is ENROLLMENT_PENDING (no enrollment is ACTIVE yet)"
            - "MarketplaceEnrollment.${enrA_id} is untouched by both calls"

      - name: evidence_package_create_with_a_stale_claim_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[evidence-package-create-stale-claim]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: "Opening the first package increments the claim's version, so the version captured at substantiation is stale for the second package: the resubmission-ready second package is ERR_STALE_CLAIM_VERSION (412) on the old version and 201 on the current one, even though a claim is allowed to hold several packages."
        test_recipe:
          setup:
            - "A SUBSTANTIATED TRADEMARK claim and one ASSEMBLING package opened against the version read at substantiation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
