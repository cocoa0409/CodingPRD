            - "The second credit does NOT net out the 1706 already credited this cycle; after applying it, Subscriber.credit_balance_cents == 1912"

      - name: the_soft_cap_bites_only_above_the_line_and_stickiness_survives_one_clean_cycle
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.usage_cycle_deprioritization
          - entities.Subscriber.fields.consecutive_breach_cycles
          - entities.Subscriber.fields.sticky_deprioritization_active
