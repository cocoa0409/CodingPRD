  - name: cal_retry_envelope_floors_at_one_attempt
    claim_type: correct_result
    grounds:
    - calculations.retry_envelope
    - state_machines.WorkflowAction.RUNNING_to_FAILED
    distinguishing_aspect: For a charge above 4 USD the retry envelope R = max(1, 5 - int(charged_cents/100)) floors at 1 attempt, so the action fails permanently instead of being held.
    test_recipe:
      setup:
      - TeamAccount with allowance 100 or more, opening cost 9 USD so a POLLING charge seeds a large envelope denominator
      setup_api_calls:
      - call: POST /zapier/accounts
        payload:
          name: C3b
          plan_code: TEAM_PRO
          task_allowance: 200
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 9
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: hold
          forced_failure: true
          max_retries: 1
        as: Member
        as_user_id: ${mem_id}
        captures:
          run: $.data
      assert:
      - run.status is HELD or FAILED according to the floor at 1 attempt
      - the action's terminal state is FAILED when R would floor at 1 after the envelope shrinks
  - name: cal_webhook_charge_uses_unit_metering_factor
    claim_type: constants_applied
    grounds:
    - calculations.metering_factor
    - calculations.metering_factor.constants.WEBHOOK
    distinguishing_aspect: A WEBHOOK trigger carries metering factor 1 and latency band 30 s (factor 1), so one successful action charges exactly 1 whole task.
    test_recipe:
