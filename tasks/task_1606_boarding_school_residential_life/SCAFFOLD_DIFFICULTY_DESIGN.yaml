            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Amoxicillin", dose_mg: 500, slot: "EVENING", doses_total: 2, refill_threshold: 1, is_controlled: false, prescriber_name: "Dr B" }, as: Nurse, as_user_id: "${nurse}", captures: { order: "$.data.id" } }
            - { call: "POST /reslife/medication-orders/${order}/administrations", payload: { scheduled_date: "2026-09-01", outcome: "ADMINISTERED" }, as: Nurse, as_user_id: "${nurse}" }
            - { call: "GET /reslife/medication-orders/${order}", payload: {}, as: Nurse, as_user_id: "${nurse}", captures: { rem1: "$.data.doses_remaining", low1: "$.data.low_stock", st1: "$.data.status" } }
          trigger:
