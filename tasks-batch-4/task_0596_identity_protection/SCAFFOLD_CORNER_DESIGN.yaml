            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "ssn hit" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
