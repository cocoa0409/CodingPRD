              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Riverbend Community Coalition", party_type: "PARTNER", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { partner: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${partner}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /partnership-agreements"
              payload: { cycle_id: "${cyc}", party_id: "${fac}", pledged_cents: 2000000, accountability_metric: "Screenings completed in partner sites", shared_accountability_pct: 40.00, term_start: "2026-09-01", term_end: "2027-08-31" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /partnership-agreements"
              payload: { cycle_id: "${cyc}", party_id: "${partner}", pledged_cents: 2000000, accountability_metric: "Screenings completed in partner sites", shared_accountability_pct: 40.00, term_start: "2026-09-01", term_end: "2027-08-31" }
              as: CommunityBenefitOfficer
          assert:
