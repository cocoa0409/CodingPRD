  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_slot_one_minute_inside_travel_buffer_is_rejected
        grounds:
          - calculations.visit_buffer_overlap
          - validations[priority=43]
          - errors[ERR_SLOT_BUFFER_CONFLICT]
          - entities.VisitSlot.fields.start_at
        distinguishing_aspect: |
          Interval semantics A: HALF-OPEN slot intervals [start, end) expanded by a
          45-minute travel buffer with STRICT inequalities, on the Technician resource.
          A candidate starting 11:44 after a slot ending 11:00 collides because
          11:44 < 11:45; exact 45-minute adjacency would not.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan; a household in NWA with an OWNER and an ACTIVE subscription."
            - "A technician in NWA with two slots: 2026-05-05T09:00:00Z -> 11:00:00Z and 2026-05-05T11:44:00Z -> 13:00:00Z, only 44 minutes apart."
            - "Two account-level P1 tickets, both escalated by a HARDWARE_FAULT verdict to DISPATCH_PENDING / REQUIRED."
            - "The first ticket already occupies the 09:00 slot, so that slot is BOOKED."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
