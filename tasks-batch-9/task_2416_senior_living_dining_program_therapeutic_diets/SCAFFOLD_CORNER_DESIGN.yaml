              captures: { t1_id: $.data.id, t1_amount: $.data.billed_amount_cents }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { r_balance1: $.data.guest_meal_charge_balance_cents }
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { cap_error: $.data.error_id, cap_message: $.data.message }
            - call: "POST /meal-tickets"
