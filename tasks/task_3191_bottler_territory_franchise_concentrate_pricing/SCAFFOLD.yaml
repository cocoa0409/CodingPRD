  # --- ConcentratePriceIndex ---
  - method: POST
    path: "/bottler/concentrate-price-indices"
    description: "Record a quarterly concentrate price index (at most one per brand+quarter)"
    roles: [BrandOwnerAdmin]
    code: 201
    input: [brand_owner_id, quarter, index_value]
    output: ConcentratePriceIndex
    side_effects: []
  - method: GET
    path: "/bottler/concentrate-price-indices/{id}"
