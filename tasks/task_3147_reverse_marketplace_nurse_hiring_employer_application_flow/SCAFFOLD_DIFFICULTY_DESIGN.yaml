              as_user_id: "${emp_id}"
          assert:
            - "after accept: Requisition.${reqc_id}.openings_filled == 1 and status == FILLED"
            - "after terminate: Requisition.${reqc_id}.openings_filled == 0 and status == OPEN (seat returned)"
            - "count(Placements of ${reqc_id} in PENDING_START|GUARANTEE_ACTIVE|COMPLETED) == 0 == openings_filled (TERMINATED_IN_GUARANTEE excluded from the invariant set)"
            - "0 <= openings_filled <= openings_total holds at every step"

      - name: fee_credit_conserved_through_provisional_and_refund
        grounds:
          - calculations.placement_fee_rule
          - entities.Invoice.fields.amount_due_cents
          - entities.Invoice.fields.amount_credited_cents
          - entities.Employer.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: billed dollars. For a PER_PLACEMENT invoice,
          amount_due_cents NEVER mutates after issuance, and after a
          guarantee refund the identity amount_due_cents ==
          (amount_due_cents - amount_credited_cents) + amount_credited_cents
          with credit_balance_cents == amount_credited_cents holds exactly —
          the refund moves cents from 'owed' to 'credited' without creating
          or destroying any, and settling draws the credit down against the
          residual so the employer's net out-of-pocket equals
          amount_due - amount_credited.
        test_recipe:
          setup:
            - "PER_PLACEMENT placement terminated 15 days into a 60-day guarantee: invoice due 3536000, credited 2652000, employer credit balance 2652000."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - *clock_iv_done
            - *iv_complete
            - *scr_open
            - *scr_cred
            - *scr_bg
            - *doc_sign
            - *doc_ok
            - *offer_issue
            - *offer_accept
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /marketplace/invoices"
              payload: { placement_id: "${placement_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /marketplace/invoices/${inv_id}/settle"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "Invoice.${inv_id}.amount_due_cents == 3536000 (unchanged through the refund)"
            - "Invoice.${inv_id}.amount_credited_cents == 2652000"
            - "residual owed 3536000 - 2652000 == 884000; settle draws Employer credit 2652000 down by min(2652000, 884000) == 884000"
            - "after settle: Employer.${emp_id}.credit_balance_cents == 1768000 (2652000 - 884000) and Invoice.status == SETTLED"
            - "total accounted cents: credited 2652000 + settled residual 884000 == 3536000 == amount_due_cents (zero drift)"
