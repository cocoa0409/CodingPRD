        grounds:
          - calculations.chamber_slot_occupancy
          - entities.BurnInChamber.fields.slot_capacity
          - entities.BurnInChamber.fields.turnaround_minutes
          - entities.BurnInRun.fields.occupied_until
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Interval semantics A: CLOSED-CLOSED intervals stretched by a
          turnaround buffer and resolved as an AGGREGATE slot budget. A run
          starting at exactly the previous run's occupied_until DOES collide
          (both endpoints inclusive), and collision is not fatal by itself —
          it is only fatal when the slot sum exceeds slot_capacity, so 3+1 == 4
          is accepted while 3+2 == 5 is refused. One millisecond past
          occupied_until the earlier run's slots are out of scope entirely.
