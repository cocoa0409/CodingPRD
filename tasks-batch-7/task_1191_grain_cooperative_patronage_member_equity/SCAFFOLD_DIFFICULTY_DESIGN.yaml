              as: CoopAccountant
              captures: { fy9: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m12}", fiscal_year_id: "${fy9}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m12: $.data.id }
            - call: "POST /coop/deliveries/${d_m12}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy9}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "POST /coop/fiscal_years/${fy9}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy9}"
              payload: {}
              as: CoopAccountant
              captures: { fy9_v_pre_final: $.data.version }
            - call: "POST /coop/fiscal_years/${fy9}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy9_v_pre_final}" }
              as: CoopAccountant
            - call: "GET /coop/members/${m12}/certificates"
              payload: {}
              as: Member
              as_user_id: "${m12}"
              captures: { cert12: "$.data[0].id", cert12_v: "$.data[0].version" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/redemption_requests"
              payload: { member_id: "${m12}", kind: "RETIREMENT", certificate_ids: ["${cert12}"], requested_amount_cents: 99999, appointment_at: "2031-09-15T10:00:00Z" }
              as: Member
