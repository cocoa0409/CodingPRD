  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_rest_gap_exactly_minimum_admitted_below_rejected
        grounds:
          - validations[priority=10]
          - calculations.fatigue_eligibility
          - errors[ERR_REST_PERIOD_VIOLATION]
        distinguishing_aspect: |
          Interval semantics: half-open shift intervals PLUS a mandatory rest
          buffer — a gap of exactly MIN_REST_HOURS (10h, equality) is ADMITTED
          while a 9h gap is REJECTED with ERR_REST_PERIOD_VIOLATION; the resource
          is the Worker.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with TWO BADGED workers W1, W2"
            - "Shifts: SA 2026-06-13T08:00Z-16:00Z, SB 2026-06-14T02:00Z-10:00Z (exactly 10h after SA), SC 2026-06-14T01:00Z-09:00Z (9h after SA, non-overlapping with SA)"
            - "W1 already ASSIGNED to SA; W2 already ASSIGNED to SA"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-RST", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
