  - section: validations
    instances:
      - name: p2_forbidden_role_beats_p3_missing_provider
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - rbac.roles.Coach
        distinguishing_aspect: "A Coach posting a staff credential under a provider id that does not exist violates both priority 2 and priority 3, and the response is ERR_FORBIDDEN_ROLE with HTTP 403 rather than the 404 ERR_PROVIDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database with only the logical clock pinned; no provider carries the id used in the trigger."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers/00000000-0000-0000-0000-0000000000ff/staff-credentials", payload: { staff_registry_id: "REG-X", role_type: "DIRECTOR", credential_level: 4, fte: 1.00, employment_status: "ACTIVE" }, as: Coach, as_user_id: "coach_1" }
          assert:
            - "HTTP status == 403"
            - "error.id == ERR_FORBIDDEN_ROLE"
            - "GET /staff-credentials returns total_count == 0"

      - name: p3_missing_provider_beats_p4_ownership
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_PROVIDER_NOT_FOUND]
        distinguishing_aspect: "A Provider acting on a provider id that does not exist violates priority 3 (existence) and priority 4 (ownership, since the acting id can never equal a nonexistent provider), and the answer is the 404 ERR_PROVIDER_NOT_FOUND, not the 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "One real APPLIED provider exists and acts as the caller; the path id belongs to no provider."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Real Provider", license_number: "LIC-6001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 20, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /providers/00000000-0000-0000-0000-0000000000ff/staff-credentials", payload: { staff_registry_id: "REG-X", role_type: "DIRECTOR", credential_level: 4, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}" }
          assert:
            - "HTTP status == 404"
            - "error.id == ERR_PROVIDER_NOT_FOUND"
            - "GET /staff-credentials?provider_id=${pid} returns total_count == 0"

      - name: p4_ownership_beats_p6_schema_violation
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - rbac.roles.Provider.entity_backed
        distinguishing_aspect: "Provider B posting a credential under Provider A's id with an out-of-range credential_level of 9 returns the 403 ERR_NOT_RESOURCE_OWNER, proving ownership is checked before the body schema that would otherwise raise ERR_VALIDATION."
        test_recipe:
          setup:
            - "Two APPLIED providers exist; the caller is provider B while the path names provider A."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Provider A", license_number: "LIC-6002", county_code: "DANE", region_code: "URBAN", licensed_capacity: 20, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pidA: $.data.id } }
            - { call: "POST /providers", payload: { legal_name: "Provider B", license_number: "LIC-6003", county_code: "ROCK", region_code: "RURAL", licensed_capacity: 25, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pidB: $.data.id } }
          trigger:
            - { call: "POST /providers/${pidA}/staff-credentials", payload: { staff_registry_id: "REG-X", role_type: "DIRECTOR", credential_level: 9, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pidB}" }
          assert:
            - "HTTP status == 403"
            - "error.id == ERR_NOT_RESOURCE_OWNER"
            - "GET /staff-credentials?provider_id=${pidA} returns total_count == 0"

      - name: p6_schema_beats_p7_body_foreign_key
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_VALIDATION]
          - endpoints[POST /providers/{provider_id}/improvement-grants]
        distinguishing_aspect: "A grant offer carrying awarded_amount_cents -5 and a rating_cycle_id that resolves to nothing returns the 422 ERR_VALIDATION from priority 6, not the 404 ERR_RATING_ARTIFACT_NOT_FOUND from priority 7."
        test_recipe:
          setup:
            - "One APPLIED provider exists; no rating cycle exists at all."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Grant Target", license_number: "LIC-6004", county_code: "DANE", region_code: "URBAN", licensed_capacity: 20, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /providers/${pid}/improvement-grants", payload: { rating_cycle_id: "00000000-0000-0000-0000-0000000000ff", awarded_amount_cents: -5, spend_deadline: "2026-12-31T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "HTTP status == 422"
            - "error.id == ERR_VALIDATION"
            - "GET /improvement-grants?provider_id=${pid} returns total_count == 0"

      - name: p8_stale_version_beats_p43_and_p50_cycle_rules
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=43]
          - validations[priority=50]
          - concurrency_rules.rating-cycle-create-stale-provider
        distinguishing_aspect: "Opening a RERATING cycle with expected_provider_version one behind the stored value, while a DRAFT cycle already exists and no rerating window is open, returns the 412 ERR_STALE_VERSION - the OCC check at priority 8 pre-empts both ERR_RERATING_WINDOW_NOT_OPEN (43) and ERR_ACTIVE_CYCLE_EXISTS (50)."
        test_recipe:
          setup:
            - "ENROLLED provider whose version was captured before its first cycle was created, so ${pver} - 1 is guaranteed stale; that first cycle is still DRAFT and the provider has no ACTIVE cycle, hence no rerating window."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Stale Test", license_number: "LIC-6005", county_code: "DANE", region_code: "URBAN", licensed_capacity: 20, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pver: $.data.version } }
            - { call: "POST /providers/${pid}/rating-cycles", payload: { cycle_type: "INITIAL", expected_provider_version: "${pver}" }, as: Provider, as_user_id: "${pid}", captures: { cid1: $.data.id } }
          trigger:
            - { call: "POST /providers/${pid}/rating-cycles", payload: { cycle_type: "RERATING", expected_provider_version: "${pver} - 1" }, as: Provider, as_user_id: "${pid}" }
          assert:
            - "HTTP status == 412"
            - "error.id == ERR_STALE_VERSION"
            - "RatingCycle.${cid1}.status == DRAFT"
            - "GET /rating-cycles?provider_id=${pid} returns total_count == 1 with data[0].id == ${cid1}"

      - name: p9_duplicate_self_assessment_beats_p10_cycle_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_DUPLICATE_RESOURCE]
          - state_machines.RatingCycle.DRAFT_to_SELF_ASSESSMENT_SUBMITTED
        distinguishing_aspect: "A second self-assessment on the same cycle violates both the one-per-cycle uniqueness rule and the DRAFT-only state rule, and the response is the 409 ERR_DUPLICATE_RESOURCE rather than ERR_CYCLE_STATE_INVALID."
        test_recipe:
          setup:
            - "Cycle in SELF_ASSESSMENT_SUBMITTED because one self-assessment already exists; the five standard domains are declared."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 20, block_min_points: 10, weight: 0.30, observation_linked: true, min_composite_for_block: 4.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 20, block_min_points: 8, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Dup SA", license_number: "LIC-6006", county_code: "DANE", region_code: "URBAN", licensed_capacity: 20, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
