          - validations[priority=8]
          - errors[ERR_DIAGNOSIS_NOT_COVERED]
          - errors[ERR_AUTH_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal) — different
