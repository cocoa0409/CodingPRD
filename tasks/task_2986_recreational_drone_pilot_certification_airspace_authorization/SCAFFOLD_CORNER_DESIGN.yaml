              as: Pilot
              as_user_id: "${r1}"
              captures: { e_commercial_flight: $.data.error_id }
            - call: "POST /drone-ops/pilots/${r2}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-04-02T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_commercial_test: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${r1}", aircraft_id: "${ar2}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-04-10T09:00:00Z", planned_end: "2026-04-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 59.91, launch_longitude: 10.75 }
              as: Pilot
              as_user_id: "${r1}"
              captures: { e_unregistered: $.data.error_id }
            - call: "POST /drone-ops/aircraft/${ar1}/ground"
              payload: { grounding_reason: "Propeller inspection overdue." }
              as: ComplianceOfficer
              captures: { grounded_state: $.data.registration_status }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${r1}", aircraft_id: "${ar1}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-04-10T09:00:00Z", planned_end: "2026-04-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 59.91, launch_longitude: 10.75 }
