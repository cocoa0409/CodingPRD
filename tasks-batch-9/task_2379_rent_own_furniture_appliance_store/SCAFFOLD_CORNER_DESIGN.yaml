      - name: agreement_creation_reads_the_customers_verification_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=30].ERR_CUSTOMER_NOT_VERIFIED
          - validations[priority=31].ERR_INSUFFICIENT_REFERENCES
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / agreement_creation_gated_by_customer_verification_state
          rationale: "That instance walks a customer from PENDING to REJECTED to VERIFIED and retries agreement creation at each stop, covering the cross-entity read completely."

      - name: delivery_window_overlap_is_temporal
        claim_type: temporal_validation
        grounds:
          - validations[priority=39].ERR_CREW_WINDOW_CONFLICT
          - calculations.crew_window_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_window_buffer_is_half_open_and_asymmetric
          rationale: "That instance probes both edges of the 45-minute asymmetric buffer (accepted at +45, refused at +44 and refused on the untouched head), which is the whole temporal rule."

  # ===========================================================================
  # 5. Endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: three_failed_delivery_attempts_release_the_reservation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /delivery-orders/{id}/fail-attempt]
          - state_machines.DeliveryOrder.SCHEDULED_to_FAILED_ATTEMPT
          - state_machines.InventoryUnit.RESERVED_to_AVAILABLE
          - validations[priority=15].ERR_DELIVERY_ORDER_STATE_INVALID
        distinguishing_aspect: |
          The action endpoint is a counter, not a switch: attempts 1 and 2 leave
          the order SCHEDULED and the unit RESERVED, and only the third attempt
          flips the order to FAILED_ATTEMPT and releases the unit back to
          AVAILABLE while the agreement stays PENDING_DELIVERY with
          cycle_anchor_at still null (no rent clock starts on a failed
          delivery). The now-terminal order refuses a completion with 409.
        test_recipe:
          setup:
            - "one TX StateRtoRule, one TX store, one NEW FURNITURE unit of 120000 and one VERIFIED customer"
            - "one WEEKLY x 52 agreement in possession_status PENDING_DELIVERY with a SCHEDULED DeliveryOrder at attempt_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_tx_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_tx_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${do_id}/fail-attempt"
              payload: { reason: "CUSTOMER_ABSENT" }
              as: ServiceTechnician
            - call: "POST /delivery-orders/${do_id}/fail-attempt"
              payload: { reason: "ACCESS_BLOCKED" }
              as: ServiceTechnician
            - call: "GET /inventory-units/${unit_tx_id}"
              as: StoreManager
            - call: "POST /delivery-orders/${do_id}/fail-attempt"
              payload: { reason: "VEHICLE_ISSUE" }
              as: ServiceTechnician
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "GET /agreements/${agr_id}"
              as: StoreManager
          assert:
            - "the three fail-attempt calls return 200 with attempt_count 1, 2 and 3 and status SCHEDULED, SCHEDULED, FAILED_ATTEMPT respectively"
            - "after the second attempt InventoryUnit.${unit_tx_id}.status is still RESERVED"
            - "after the third attempt InventoryUnit.${unit_tx_id}.status == AVAILABLE — the reservation is released only at the third strike"
            - "Agreement.${agr_id}.possession_status is still PENDING_DELIVERY, payment_status == CURRENT, cycle_anchor_at is null, periods_paid == 0 and Store.${store_tx_id}.units_on_rent_count == 0"
            - "the completion attempt returns 409 ERR_DELIVERY_ORDER_STATE_INVALID and DeliveryOrder.${do_id}.completed_at is still null with setup_completed == false"

      - name: agreement_disclosure_read_is_derived_not_stored
        claim_type: computed_read
        grounds:
          - endpoints[GET /agreements/{id}/disclosure]
        excluded_because:
          difficulty_instance: combinatorial_formula / pricing_ceil_rate_before_multiply_inflates_disclosed_subtotal
          rationale: "That instance reads the disclosure endpoint and asserts every disclosed figure (rate, subtotal, fee, total, monthly equivalent, cost of rental) against the pinned evaluation order."

      - name: quote_acceptance_is_conditional_on_the_quote_still_being_live
        claim_type: conditional_action
        grounds:
          - endpoints[POST /early-purchase-quotes/{id}/accept]
          - validations[priority=19].ERR_QUOTE_EXPIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / payoff_quote_expiry_is_inclusive_to_the_second
          rationale: "That instance accepts a quote at exactly expires_at and fails one second later, which is the conditional-action boundary in full."

      - name: swap_links_a_replacement_unit_across_agreements
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /service-tickets/{id}/issue-swap]
          - entities.InventoryUnit.fields.replaced_unit_id
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / swap_eligibility_gated_by_replacement_unit_state_on_another_agreement
          rationale: "That instance rejects a replacement unit that is ON_RENT on another agreement and then links an AVAILABLE one, asserting replaced_unit_id on the successful path."

  # ===========================================================================
  # 6. Errors
  # ===========================================================================
  # Audit note: every §1.6 code is reachable. The 401/403/404/400 cluster is
  # covered by the rbac and entities sections above; the state 409s by the
  # state_machines section; the fiscal and safety 422s by the calculations,
  # validations and difficulty instances. The delivery-dispatch cluster below is
  # the one group whose five codes share a single endpoint pair, so it is
  # probed end to end in one chain.
