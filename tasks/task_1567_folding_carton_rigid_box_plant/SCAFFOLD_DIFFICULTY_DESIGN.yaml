  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: route_selection_qty_threshold
        grounds:
          - calculations.route_selection
          - entities.Job.fields.route_type
        distinguishing_aspect: |
          Metric = quantity_ordered on POST /plant/jobs (inclusive <=): 2500 routes DIGITAL, 2501
          routes OFFSET; foil finish at qty 100 also forces OFFSET regardless of the numeric threshold.
        test_recipe:
          setup:
            - "One ACTIVE customer; three job creations"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Mu", brand_code: "MUU" }, as: PlantAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 2500, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { j2500_route: $.data.route_type, j2500_sub: $.data.provisional_subtotal_cents, j2500_tot: $.data.provisional_total_cents } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 2501, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { j2501_route: $.data.route_type, j2501_sub: $.data.provisional_subtotal_cents } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 100, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: true, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { j100_route: $.data.route_type } }
          assert:
            - "qty 2500 -> route_type == DIGITAL (${j2500_route}); provisional_subtotal_cents == 175215; total == 750000 (minimum recovery 574785)"
            - "qty 2501 -> route_type == OFFSET (${j2501_route}); provisional_subtotal_cents == 331814"
            - "qty 100 with finish_foil -> route_type == OFFSET (${j100_route}) despite 100 <= 2500 (finish flag overrides numeric threshold)"

      - name: delta_e_inclusive_tolerance
        grounds:
          - state_machines.PressApproval.SUBMITTED_to_APPROVED
          - validations[priority=7]
          - errors[ERR_DELTA_E_EXCEEDED]
        distinguishing_aspect: |
          Metric = measured_delta_e_milli on POST /plant/press-approvals/{id}/approve (different
          endpoint and different unit than the carton-count routing boundary): measured == tolerance
          (200) approves; tolerance + 1 (201) fails with ERR_DELTA_E_EXCEEDED and stays SUBMITTED.
        test_recipe:
          setup:
            - "Job qty 3000 PRESS_READY; standard tolerance 200; two SUBMITTED approvals: A1 measured 200, A2 measured 201"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Nu", brand_code: "NUU" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 200 }, as: PressOperator, captures: { a1: $.data.id } }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 201 }, as: PressOperator, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /plant/press-approvals/${a1}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { a1_st: $.data.status } }
            - { call: "POST /plant/press-approvals/${a2}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { a2_err: $.data.error_id } }
          assert:
            - "A1 (measured == tolerance == 200): status == APPROVED (${a1_st})"
            - "A2 (measured == 201): error_id == ERR_DELTA_E_EXCEEDED (${a2_err}), http 409"
            - "A2 remains SUBMITTED (failed approve does not move the machine)"

