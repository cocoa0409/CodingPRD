      - name: a_dependent_milestone_waits_for_its_predecessor_and_cannot_repeat_the_pair
        claim_type: cross_entity_validation
        grounds:
          - state_machines.TradeCoordination.REQUESTED_to_CONFIRMED
          - validations[priority=110]
          - errors[ERR_PREDECESSOR_NOT_RELEASED]
          - errors[ERR_COORDINATION_CYCLE]
        distinguishing_aspect: "Confirming the ELECTRICAL milestone is refused with 409 while its predecessor sits in CONFIRMED rather than RELEASED — a CONFIRMED predecessor is not enough — and once the chain exists a third coordination repeating the (CEILING, PATHWAY_ROUGH_IN) pair already present in that chain is refused with 422."
        test_recipe:
          setup: ["Project RVT1 with a CEILING / PATHWAY_ROUGH_IN coordination confirmed and an ELECTRICAL / POWER_ENERGIZE coordination whose predecessor is that CEILING row"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN" }
              as: ProjectManager
              captures: { c1: $.data.id }
            - call: "POST /cabling/trade-coordinations/${c1}/confirm"
              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "ELECTRICAL", milestone: "POWER_ENERGIZE", predecessor_coordination_id: "${c1}" }
              as: ProjectManager
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /cabling/trade-coordinations/${c2}/confirm"
              payload: { confirmed_date: "2026-08-10" }
              as: ProjectManager
              captures: { err1: $.data.error_id }
            - call: "POST /cabling/trade-coordinations/${c1}/release"
              payload: {}
              as: ProjectManager
            - call: "POST /cabling/trade-coordinations/${c2}/confirm"
              payload: { confirmed_date: "2026-08-10" }
              as: ProjectManager
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN", predecessor_coordination_id: "${c2}" }
              as: ProjectManager
              captures: { err2: $.data.error_id }
          assert:
            - "the confirm while the predecessor is CONFIRMED returns 409 with data.error_id == \"ERR_PREDECESSOR_NOT_RELEASED\""
            - "immediately after that refusal GET /cabling/trade-coordinations/${c2} returns coordination_state == \"REQUESTED\" and confirmed_date == null"
            - "the release of ${c1} returns 200 with coordination_state == \"RELEASED\""
            - "the retried confirm returns 200 with coordination_state == \"CONFIRMED\" and confirmed_date == \"2026-08-10\""
            - "the coordination repeating the (CEILING, PATHWAY_ROUGH_IN) pair already in the ${c2} -> ${c1} chain returns 422 with data.error_id == \"ERR_COORDINATION_CYCLE\""
            - "GET /cabling/trade-coordinations?project_id=${proj} returns total_count == 2, so the refused row was never created"

