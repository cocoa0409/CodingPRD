        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Miscellaneous metals package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '900000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 29}
        as: BuyoutManager
        captures: {pkg2_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg2_id}', supplier_id: '${sup_id}', base_price: '880000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q2_id: $.data.id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv1: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q2_id}', po_number: PO-2996-0002, expected_project_version: '${pv1}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc2_id: $.data.id}
      trigger:
      - call: GET /procurement/escalation-agreements/00000000-0000-4000-8000-000000000999
        payload: {}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv1}', escalation_agreement_id: 00000000-0000-4000-8000-000000000999, is_early_buyout: false}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: GET /procurement/projects/${proj_id}
