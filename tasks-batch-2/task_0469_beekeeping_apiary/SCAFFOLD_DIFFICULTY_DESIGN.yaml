  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: nuc_ship_then_void_conserves_apiary_colony_count
        grounds:
          - state_machines.QueenNucSale.RESERVED_to_SHIPPED
          - state_machines.QueenNucSale.SHIPPED_to_VOIDED
          - entities.Apiary.fields.active_colony_count
          - entities.Hive.fields.brood_frames
        distinguishing_aspect: "Conserved quantity = Apiary.active_colony_count (colony count): ship a NUC (count 1->0 with source brood 8->5) then void it (count 0->1, brood 5->8); the invariant active_colony_count == count(non-DEADOUT hives) holds before and after with zero drift."
        test_recipe:
          setup:
            - "Apiary CA with one hive H1 (brood 8); active_colony_count=1; nuc sale S1 RESERVED from H1 (frames_drawn=3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 8 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/queen-nuc-sales"
              payload: { source_hive_id: "${h1_id}", product_type: "NUC", frames_drawn: 3, price_cents: 18000 }
              as: ContractCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /queen-nuc-sales/${s1_id}/ship"
              payload: {}
              as: ContractCoordinator
          trigger:
            - call: "POST /queen-nuc-sales/${s1_id}/void"
              payload: {}
              as: ContractCoordinator
            - call: "GET /apiaries/${ap_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { acc: $.data.active_colony_count }
            - call: "GET /hives/${h1_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { bf: $.data.brood_frames }
          assert:
            - "Apiary.${ap_id}.active_colony_count == 1"
            - "Hive.${h1_id}.brood_frames == 8"
            - "QueenNucSale.${s1_id}.status == VOIDED"

      - name: harvest_void_conserves_lot_gross_weight_and_provisional_yield
        grounds:
          - state_machines.Harvest.RECORDED_to_VOID
          - entities.HoneyLot.fields.gross_weight_kg
          - entities.HoneyLot.fields.provisional_yield_kg
          - calculations.honey_yield
        distinguishing_aspect: "DIFFERENT conserved quantity = honey mass on the lot: recording a harvest (gross 0->12.0, provisional 0->10.0) then voiding it (gross 12.0->0, provisional 10.0->0) leaves gross_weight_kg==0 and provisional_yield_kg==0 with no drift — distinct from the colony-count invariant. Invariant: gross_weight_kg == sum(non-VOID Harvest.weight_kg)."
        test_recipe:
          setup:
            - "Apiary CA; clock 2026-05-10; Hive H1; HoneyLot L1 DRAFT with one RECORDED harvest (frames_pulled=4, weight=12.0) -> gross 12.0, provisional 10.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "WILDFLOWER" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 4, weight_kg: 12.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { hv1_id: $.data.id }
          trigger:
            - call: "POST /harvests/${hv1_id}/void"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "GET /honey-lots/${l1_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { gw: $.data.gross_weight_kg, prov: $.data.provisional_yield_kg }
          assert:
            - "HoneyLot.${l1_id}.gross_weight_kg == 0"
            - "HoneyLot.${l1_id}.provisional_yield_kg == 0"
            - "Harvest.${hv1_id}.status == VOID"
