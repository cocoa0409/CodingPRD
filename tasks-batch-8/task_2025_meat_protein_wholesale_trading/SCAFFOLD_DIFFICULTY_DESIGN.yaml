# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Meat & Protein Wholesale Trading (protein trading desk)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: po_cutout_booking_vs_grading_basis
        grounds:
          - calculations.cutout_value
          - entities.PurchaseOrder.fields.estimated_cutout_value_cents
          - entities.PurchaseOrder.fields.actual_cutout_value_cents
          - state_machines.PurchaseOrder.RECEIVED_to_GRADED
        distinguishing_aspect: |
          Two valid bases of the SAME cutout formula produce different cents on
          the PurchaseOrder (cost-accounting domain): booking uses ordered
          weight x the sheet latest-published at booking (S1: RIBEYE 900),
          grading uses received weight x the sheet covering the grading date
          (S2: RIBEYE 1000) — 398000 vs 399000 for identical yield specs.
        test_recipe:
          setup:
            - "Products: CARC-A (CARCASS), RIBEYE-A and CHUCK-A (PRIMAL); YieldSpecs CARC-A->RIBEYE-A 11.0% and CARC-A->CHUCK-A 25.0%"
            - "Supplier EST-1 ACTIVE; Warehouse WH-1 capacity 100000"
            - "Sheet S1 (week 2026-08-03, lines RIBEYE 900c / CHUCK 400c) PUBLISHED"
            - "PO-1 for 2000 lbs CARC-A is BOOKED while S1 is the latest PUBLISHED sheet (estimated cutout 398000)"
            - "Clock advanced to 2026-08-10; sheet S2 (week 2026-08-10, RIBEYE 1000c / CHUCK 400c, supersedes S1) PUBLISHED"
            - "PO-1 received at 1900 lbs producing LOT-1 IN_INSPECTION"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-A", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-A", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "CHUCK-A", kind: "PRIMAL", species: "BEEF", max_fat_pct: 18.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { chk_id: "$.data.id" } }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${rib_id}", expected_yield_pct: 11.0, min_yield_pct: 9.0, max_yield_pct: 13.0 }, as: DeskAdmin }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${chk_id}", expected_yield_pct: 25.0, min_yield_pct: 23.0, max_yield_pct: 27.0 }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-1", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 900, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${chk_id}", price_per_lb_cents: 400, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-1", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 2000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-05" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-10", supersedes_sheet_id: "${s1_id}" }, as: Trader, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s2_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 1000, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s2_id}/lines", payload: { product_id: "${chk_id}", price_per_lb_cents: 400, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s2_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1900, warehouse_id: "${wh_id}", lot_code: "LOT-1", production_date: "2026-08-09" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot1_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/inspection-certificates", payload: { lot_id: "${lot1_id}", certificate_type: "USDA_GRADE", grade_result: "CHOICE", certificate_number: "CERT-1", issued_by: "USDA-JW", issue_date: "2026-08-10" }, as: QualityGrader }
          assert:
            - "PurchaseOrder.${po_id}.estimated_cutout_value_cents == 398000 (2000 x 0.11 x 900 + 2000 x 0.25 x 400, S1 prices)"
            - "PurchaseOrder.${po_id}.actual_cutout_value_cents == 399000 (1900 x 0.11 x 1000 + 1900 x 0.25 x 400, S2 prices)"
            - "PurchaseOrder.${po_id}.estimated_cutout_value_cents != PurchaseOrder.${po_id}.actual_cutout_value_cents"
            - "PurchaseOrder.${po_id}.status == GRADED"
            - "PriceSheet.${s1_id}.status == SUPERSEDED"

      - name: claim_provisional_vs_final_settlement
        grounds:
          - calculations.claim_provisional_credit
          - calculations.claim_final_settlement
          - entities.Claim.fields.provisional_credit_cents
          - entities.Claim.fields.final_settlement_cents
          - state_machines.Claim.OFFER_MADE_to_SETTLED_PAID
        distinguishing_aspect: |
          The Claim (settlement domain, distinct from the PurchaseOrder cost
          domain of po_cutout_booking_vs_grading_basis) carries two valid
          valuations of the same loss: provisional min(claimed, value x 0.40)
          = 140000 at filing vs final min(offer, value x 0.80) = 160000 at
          acceptance — different formula shape, different anchor field.
        test_recipe:
          setup:
            - "Product RIBEYE-B PRIMAL (max_fat 12.0, shelf 21, temp max 40F); supplier; warehouse"
            - "Sheet S1 week 2026-08-03 with line RIBEYE-B 700c/lb, supply 100000, PUBLISHED"
            - "Customer CUST-1 credit_limit 100000000 TIER_1"
            - "Lot LOT-A: 1000 lbs RIBEYE-B received, inspected fat 10.0 -> AVAILABLE"
            - "Allocation of 500 lbs CONFIRMED at 700c; shipment of 500 lbs DELIVERED with one 38.0F reading (COMPLIANT)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-B", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-2", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer One", customer_code: "CUST-1", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-2", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-A", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-05T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /api/claims", payload: { shipment_id: "${ship_id}", claim_type: "QUALITY_DEFECT", claimed_amount_cents: 200000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { claim_id: "$.data.id", claim_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 160000, expected_claim_version: "${claim_v}" }, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${claim_id}/accept", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
          assert:
            - "Claim.${claim_id}.provisional_credit_cents == 140000 (min(200000, 350000 x 0.40))"
            - "Claim.${claim_id}.final_settlement_cents == 160000 (min(160000, 350000 x 0.80) + 0)"
            - "Claim.${claim_id}.provisional_credit_cents != Claim.${claim_id}.final_settlement_cents"
            - "Claim.${claim_id}.status == SETTLED_PAID"
            - "Customer.${cust_id}.outstanding_exposure_cents == 190000 (350000 - 160000)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: aging_value_grade_age_band_interaction
        grounds:
          - calculations.aging_adjusted_unit_value
          - entities.InventoryLot.fields.unit_value_cents_per_lb
          - entities.InventoryLot.fields.age_days
        distinguishing_aspect: |
          Mode (a): 3+ inputs (base price, grade multiplier, age band) with
          non-linear conditional interaction — SELECT grade band boundary at
          age_days 7 vs 8 changes unit value from 470 to 447
          (500 x 0.94 x 1.00 vs 500 x 0.94 x 0.95, single final round_half_up).
        test_recipe:
          setup:
            - "Product CHUCK-A2 PRIMAL max_fat 18.0 shelf 21 temp 40F; supplier; warehouse"
            - "Sheet week 2026-08-03 line CHUCK-A2 500c PUBLISHED"
            - "LOT-2: 100 lbs CHUCK-A2, production_date 2026-08-01, inspected fat 15.0 -> AVAILABLE, graded SELECT"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CHUCK-A2", kind: "PRIMAL", species: "BEEF", max_fat_pct: 18.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { chk_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-3", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${chk_id}", price_per_lb_cents: 500, weekly_supply_lbs: 50000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-3", supplier_id: "${sup_id}", product_id: "${chk_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 18000, required_delivery_date: "2026-08-03" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 100, warehouse_id: "${wh_id}", lot_code: "LOT-2", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 15.0 }, as: QualityGrader }
            - { call: "POST /api/inspection-certificates", payload: { lot_id: "${lot_id}", certificate_type: "USDA_GRADE", grade_result: "SELECT", certificate_number: "CERT-2", issued_by: "USDA-JW", issue_date: "2026-08-02" }, as: QualityGrader }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: DeskAdmin }
            - { call: "GET /api/inventory-lots/${lot_id}", payload: {}, as: DeskAdmin, captures: { val_age7: "$.data.unit_value_cents_per_lb", age7: "$.data.age_days" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: DeskAdmin }
            - { call: "GET /api/inventory-lots/${lot_id}", payload: {}, as: DeskAdmin, captures: { val_age8: "$.data.unit_value_cents_per_lb", age8: "$.data.age_days" } }
          assert:
            - "At 2026-08-08: InventoryLot.${lot_id}.age_days == 7 and unit_value_cents_per_lb == 470 (500 x 0.94 x 1.00)"
            - "At 2026-08-09: InventoryLot.${lot_id}.age_days == 8 and unit_value_cents_per_lb == 447 (round_half_up(500 x 0.94 x 0.95) = round_half_up(446.5))"
            - "InventoryLot.${lot_id}.status == AVAILABLE at both reads (age 8 <= shelf_life 21)"

      - name: cutout_per_line_rounding_order
        grounds:
          - calculations.cutout_value
          - entities.PurchaseOrder.fields.estimated_cutout_value_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each primal line to
          integer cents THEN sum. With two 12.5% yield lines at 202c and 206c
          on 10 lbs, per-line rounding gives 253 + 258 = 511; the forbidden
          sum-then-round order gives 510 (252.5 + 257.5 = 510.0). Distinct
          mode from aging_value_grade_age_band_interaction (mode a).
        test_recipe:
          setup:
            - "Product CARC-B CARCASS; products PA-B and PB-B PRIMAL"
            - "YieldSpecs CARC-B->PA-B 12.5% and CARC-B->PB-B 12.5%"
            - "Sheet week 2026-08-03 PUBLISHED with lines PA-B 202c and PB-B 206c"
            - "Supplier ACTIVE"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-B", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "PA-B", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { pa_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "PB-B", kind: "PRIMAL", species: "BEEF", max_fat_pct: 14.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { pb_id: "$.data.id" } }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${pa_id}", expected_yield_pct: 12.5, min_yield_pct: 10.0, max_yield_pct: 15.0 }, as: DeskAdmin }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${pb_id}", expected_yield_pct: 12.5, min_yield_pct: 10.0, max_yield_pct: 15.0 }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-4", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${pa_id}", price_per_lb_cents: 202, weekly_supply_lbs: 10000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${pb_id}", price_per_lb_cents: 206, weekly_supply_lbs: 10000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-4", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 10, contract_price_per_cwt_cents: 30000, required_delivery_date: "2026-08-06" }, as: Trader, captures: { po_id: "$.data.id" } }
          assert:
            - "PurchaseOrder.${po_id}.estimated_cutout_value_cents == 511 (round_half_up(1.25 x 202) + round_half_up(1.25 x 206) = 253 + 258)"
            - "PurchaseOrder.${po_id}.estimated_cutout_value_cents != 510 (the sum-then-round alternative is forbidden)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_offer_counter_cycle_bounded
        grounds:
          - state_machines.Claim.OFFER_MADE_to_COUNTERED
          - state_machines.Claim.COUNTERED_to_OFFER_MADE
          - errors[ERR_CLAIM_OFFER_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Claim is a cyclic machine (OFFER_MADE -> COUNTERED -> OFFER_MADE)
          bounded at 3 offer rounds — distinct entity and distinct non-linear
          shape from the Shipment parallel-axes machine. The 3rd counter
          attempt fails with ERR_CLAIM_OFFER_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Full pipeline as in claim_provisional_vs_final_settlement: 500 lbs RIBEYE-B at 700c DELIVERED; claim QUALITY_DEFECT for 200000 FILED (version 1)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-B", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-5", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer One", customer_code: "CUST-1", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-5", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-A", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-05T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /api/claims", payload: { shipment_id: "${ship_id}", claim_type: "QUALITY_DEFECT", claimed_amount_cents: 200000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { claim_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 100000, expected_claim_version: "${v1}" }, as: ClaimsAdjuster, captures: { v2: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/counter", payload: { counter_amount_cents: 180000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { v3: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 150000, expected_claim_version: "${v3}" }, as: ClaimsAdjuster, captures: { v4: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/counter", payload: { counter_amount_cents: 175000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { v5: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 170000, expected_claim_version: "${v5}" }, as: ClaimsAdjuster, captures: { v6: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/counter", payload: { counter_amount_cents: 179000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { counter_err: "$.data.error_id" } }
            - { call: "POST /api/claims/${claim_id}/accept", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
          assert:
            - "After three offers: Claim.${claim_id}.offer_round == 3 and current_offer_cents == 170000"
            - "Fourth counter rejected: ${counter_err} == ERR_CLAIM_OFFER_LIMIT_EXCEEDED (http 422)"
            - "Claim.${claim_id}.status == SETTLED_PAID and final_settlement_cents == 170000 (min(170000, 280000) + 0)"

      - name: shipment_parallel_temp_and_delivery_axes
        grounds:
          - state_machines.Shipment.STAGING_to_IN_TRANSIT
          - state_machines.Shipment.COMPLIANT_to_BREACHED
          - entities.Shipment.fields.temp_compliance
        distinguishing_aspect: |
          Shipment carries two independent state dimensions — delivery status
          (STAGING -> IN_TRANSIT -> DELIVERED) x temp_compliance (UNKNOWN ->
          COMPLIANT -> BREACHED, sticky) — a parallel-dimensions shape,
          distinct from the Claim cycle. A delivery-axis transition never
          mutates the temperature axis and vice versa.
        test_recipe:
          setup:
            - "500 lbs RIBEYE-B CONFIRMED allocation; shipment STAGING (product required_temp_max_f = 40)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-B", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-6", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer One", customer_code: "CUST-1", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-6", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-A", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-05T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 41.5, recorded_at: "2026-08-05T14:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /api/shipments/${ship_id}", payload: {}, as: DeskAdmin, captures: { fin_status: "$.data.status", fin_temp: "$.data.temp_compliance", max_t: "$.data.max_temp_f_reading" } }
          assert:
            - "After depart: Shipment.${ship_id}.status == IN_TRANSIT and temp_compliance == COMPLIANT (reading 38.0 <= 40)"
            - "After the 41.5F reading: status still IN_TRANSIT while temp_compliance == BREACHED (axes independent)"
            - "After deliver: ${fin_status} == DELIVERED and ${fin_temp} == BREACHED (delivery does not clear the breach) and ${max_t} == 41.5"
  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: publish_supersede_cascade_releases_credit_hold
        grounds:
          - state_machines.PriceSheet.DRAFT_to_PUBLISHED
          - state_machines.Allocation.CONFIRMED_to_CANCELLED
          - state_machines.Customer.CREDIT_HOLD_to_ACTIVE
          - calculations.customer_credit_exposure
        distinguishing_aspect: |
          Depth-3 chain triggered by publish: publishing S2 supersedes S1
          (link 1); S1's SUPERSEDED transition cancels its shipment-free
          CONFIRMED allocations (link 2, caused by link 1); each cancellation
          recomputes customer exposure, and the drop below credit_limit
          auto-releases CREDIT_HOLD (link 3, caused by link 2). Distinct
          trigger from claim_accept_credit_cascade.
        test_recipe:
          setup:
            - "Product RIBEYE-C PRIMAL; sheet S1 week 2026-08-03 line 700c supply 100000 PUBLISHED"
            - "Customer CUST-C credit_limit 350000 TIER_1"
            - "Allocation A1 500 lbs CONFIRMED (exposure 350000 == limit, still ACTIVE)"
            - "Allocation A2 100 lbs CONFIRMED (exposure 420000 > 350000 -> CREDIT_HOLD)"
            - "Sheet S2 week 2026-08-10 drafted with supersedes_sheet_id = S1 and one line"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-C", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer C", customer_code: "CUST-C", credit_limit_cents: 350000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { a2_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "GET /api/customers/${cust_id}", payload: {}, as: DeskAdmin, captures: { hold_status: "$.data.status" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-10", supersedes_sheet_id: "${s1_id}" }, as: Trader, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s2_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 720, weekly_supply_lbs: 100000 }, as: Trader }
          trigger:
            - { call: "POST /api/price-sheets/${s2_id}/publish", payload: {}, as: DeskAdmin }
          assert:
            - "Precondition held: ${hold_status} == CREDIT_HOLD"
            - "PriceSheet.${s1_id}.status == SUPERSEDED (link 1)"
            - "Allocation.${a1_id}.status == CANCELLED and cancel_reason == SHEET_SUPERSEDED (link 2)"
            - "Allocation.${a2_id}.status == CANCELLED and cancel_reason == SHEET_SUPERSEDED (link 2)"
            - "Customer.${cust_id}.outstanding_exposure_cents == 0 (link 3 recompute)"
            - "Customer.${cust_id}.status == ACTIVE (link 3 auto-release)"

      - name: claim_accept_credit_cascade
        grounds:
          - state_machines.Claim.OFFER_MADE_to_SETTLED_PAID
          - calculations.customer_credit_exposure
          - state_machines.Customer.CREDIT_HOLD_to_ACTIVE
        distinguishing_aspect: |
          Depth-2 chain with a DIFFERENT trigger (claim accept, not sheet
          publish): accept computes final_settlement 160000 (link 1); the
          settlement credit lowers outstanding_exposure from 350000 to 190000
          and the threshold crossing auto-releases CREDIT_HOLD (link 2, caused
          by link 1's exposure mutation).
        test_recipe:
          setup:
            - "Product RIBEYE-D PRIMAL; sheet week 2026-08-03 line 700c supply 100000 PUBLISHED"
            - "Customer CUST-D credit_limit 200000 TIER_1"
            - "Allocation 500 lbs CONFIRMED (exposure 350000 > 200000 -> CREDIT_HOLD)"
            - "Shipment of 500 lbs DELIVERED (allocation SHIPPED; exposure still 350000, still CREDIT_HOLD)"
            - "Claim QUALITY_DEFECT 200000 FILED (provisional 140000)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-D", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-7", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer D", customer_code: "CUST-D", credit_limit_cents: 200000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-7", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-D", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 38.0, recorded_at: "2026-08-05T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /api/customers/${cust_id}", payload: {}, as: DeskAdmin, captures: { hold_status: "$.data.status" } }
            - { call: "POST /api/claims", payload: { shipment_id: "${ship_id}", claim_type: "QUALITY_DEFECT", claimed_amount_cents: 200000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { claim_id: "$.data.id", claim_v: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 160000, expected_claim_version: "${claim_v}" }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /api/claims/${claim_id}/accept", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
          assert:
            - "Precondition held: ${hold_status} == CREDIT_HOLD (exposure 350000 > 200000)"
            - "Claim.${claim_id}.status == SETTLED_PAID and final_settlement_cents == 160000"
            - "Customer.${cust_id}.outstanding_exposure_cents == 190000 (350000 - 160000; link 1)"
            - "Customer.${cust_id}.status == ACTIVE (link 2: threshold crossing released the hold)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: receive_state_vs_capacity_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_PO_NOT_BOOKED]
          - errors[ERR_WAREHOUSE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair state x business_constraint: a receive against a CANCELLED PO
          that would also exceed warehouse capacity MUST fail with
          ERR_PO_NOT_BOOKED (priority 7 state), never
          ERR_WAREHOUSE_CAPACITY_EXCEEDED (priority 11 constraint).
        test_recipe:
          setup:
            - "Supplier ACTIVE; Warehouse WH-CAP capacity 100 lbs (occupied 0)"
            - "PO-8 for 200 lbs RIBEYE-E was BOOKED then CANCELLED"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-E", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-8", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-CAP", zone: "CHILLER", capacity_lbs: 100 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-8", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 200, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: Trader }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 500, warehouse_id: "${wh_id}", lot_code: "LOT-X", production_date: "2026-08-02" }, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PO_NOT_BOOKED (state priority 7 beats constraint priority 11; 500 lbs into capacity-100 warehouse also violates ERR_WAREHOUSE_CAPACITY_EXCEEDED but must NOT surface)"
            - "PurchaseOrder.${po_id}.status == CANCELLED (unchanged); no lot created"

      - name: shipment_safety_vs_referential_mismatch
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_LOT_NOT_AVAILABLE]
          - errors[ERR_SHIPMENT_EXCEEDS_ALLOCATION]
        distinguishing_aspect: |
          Pair business_safety x business_constraint (different categories from
          receive_state_vs_capacity_constraint): a load-out naming a
          QUARANTINED lot AND over-shipping the allocation (150 > 100
          remaining) MUST fail with ERR_LOT_NOT_AVAILABLE (priority 9 safety),
          never ERR_SHIPMENT_EXCEEDS_ALLOCATION (priority 10 constraint).
        test_recipe:
          setup:
            - "Product RIBEYE-F; sheet week 2026-08-03 line 700c PUBLISHED; customer with ample credit"
            - "LOT-Q: 1000 lbs received and inspected -> AVAILABLE, then manually quarantined (USDA_HOLD)"
            - "Allocation of 100 lbs CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-F", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-9", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer F", customer_code: "CUST-F", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-9", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-Q", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lotq_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lotq_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/inventory-lots/${lotq_id}/quarantine", payload: {}, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
          trigger:
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 150, lot_ids: ["${lotq_id}"] }, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_LOT_NOT_AVAILABLE (safety priority 9 beats constraint priority 10; shipped_lbs 150 > 100 remaining also violates ERR_SHIPMENT_EXCEEDS_ALLOCATION but must NOT surface)"
            - "Allocation.${alloc_id}.status == CONFIRMED (unchanged); no shipment persisted"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: temp_reading_exactly_at_max_stays_compliant
        grounds:
          - calculations.temp_compliance_eval
          - entities.Shipment.fields.temp_compliance
          - entities.Product.fields.required_temp_max_f
        distinguishing_aspect: |
          Metric Fahrenheit via POST /api/shipments/{id}/temperature-readings:
          breach iff reading STRICTLY > required_temp_max_f. 40.0 == max keeps
          COMPLIANT; the next 40.1 reading flips BREACHED. Distinct metric and
          endpoint from credit_exact_equality_boundary.
        test_recipe:
          setup:
            - "500 lbs RIBEYE-G (required_temp_max_f 40) CONFIRMED allocation; shipment STAGING"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-G", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-10", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer G", customer_code: "CUST-G", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-10", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-G", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 500 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 40.0, recorded_at: "2026-08-05T08:00:00Z" }, as: WarehouseOperator }
            - { call: "GET /api/shipments/${ship_id}", payload: {}, as: DeskAdmin, captures: { tc_eq: "$.data.temp_compliance", max_eq: "$.data.max_temp_f_reading" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 40.1, recorded_at: "2026-08-05T09:00:00Z" }, as: WarehouseOperator }
          assert:
            - "After reading exactly 40.0F (== max): ${tc_eq} == COMPLIANT and ${max_eq} == 40.0 (equality does NOT breach)"
            - "After reading 40.1F (> max): Shipment.${ship_id}.temp_compliance == BREACHED and max_temp_f_reading == 40.1"

      - name: credit_exact_equality_boundary
        grounds:
          - calculations.customer_credit_exposure
          - calculations.allocation_waterfall
          - entities.Customer.fields.outstanding_exposure_cents
        distinguishing_aspect: |
          Metric cents via POST /api/price-sheets/{id}/run-allocation: the
          auto-hold comparison is STRICT (>). Exposure exactly == credit_limit
          (350000 == 350000) leaves the customer ACTIVE; the identical grant
          against limit 349999 (exposure 350000 > 349999) forces CREDIT_HOLD.
          Distinct metric and endpoint from
          temp_reading_exactly_at_max_stays_compliant.
        test_recipe:
          setup:
            - "Product RIBEYE-H; sheet week 2026-08-03 line 700c supply 100000 PUBLISHED"
            - "Customer CEQ-1 credit_limit 350000; customer CEQ-2 credit_limit 349999; both TIER_1"
            - "Each customer has a REQUESTED allocation of 500 lbs (value 350000 each)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-H", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Equal", customer_code: "CEQ-1", credit_limit_cents: 350000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { c1_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Under", customer_code: "CEQ-2", credit_limit_cents: 349999, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { c2_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 100000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${c1_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${c1_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /api/allocations", payload: { customer_id: "${c2_id}", price_sheet_line_id: "${line_id}", requested_lbs: 500 }, as: CustomerRep, as_user_id: "${c2_id}", captures: { a2_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
          assert:
            - "Allocation.${a1_id}.status == CONFIRMED and allocated_lbs == 500"
            - "Customer.${c1_id}.outstanding_exposure_cents == 350000 and status == ACTIVE (equality does NOT hold)"
            - "Allocation.${a2_id}.status == CONFIRMED and allocated_lbs == 500"
            - "Customer.${c2_id}.outstanding_exposure_cents == 350000 and status == CREDIT_HOLD (350000 > 349999)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: po_create_blocked_when_supplier_suspended
        grounds:
          - state_machines.PurchaseOrder.transitions
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - validations[priority=8]
          - errors[ERR_SUPPLIER_SUSPENDED]
        distinguishing_aspect: |
          Pair PurchaseOrder x Supplier: PO booking is gated on the SUPPLIER's
          state, not the PO's — SUSPENDED supplier rejects with
          ERR_SUPPLIER_SUSPENDED; reinstate unblocks. Distinct pair from
          allocation_blocked_when_sheet_not_published (Allocation x PriceSheet).
        test_recipe:
          setup:
            - "Supplier SUP-S ACTIVE; product CARC-D exists; no POs yet"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-D", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo S", establishment_number: "EST-11", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "PUT /api/suppliers/${sup_id}/status", payload: { status: "SUSPENDED", reason: "audit hold" }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-11", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-12" }, as: Trader, captures: { err: "$.data.error_id" } }
            - { call: "PUT /api/suppliers/${sup_id}/status", payload: { status: "ACTIVE" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-11", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-12" }, as: Trader, captures: { po_id: "$.data.id" } }
          assert:
            - "While SUSPENDED: ${err} == ERR_SUPPLIER_SUSPENDED (http 409) and no PO persisted"
            - "After reinstate: POST succeeds, PurchaseOrder.${po_id}.status == BOOKED"

      - name: allocation_blocked_when_sheet_not_published
        grounds:
          - state_machines.Allocation.transitions
          - state_machines.PriceSheet.DRAFT_to_PUBLISHED
          - validations[priority=8]
          - errors[ERR_PRICE_SHEET_NOT_PUBLISHED]
        distinguishing_aspect: |
          Pair Allocation x PriceSheet: an allocation request is gated on the
          SHEET's state — a line on a DRAFT sheet rejects with
          ERR_PRICE_SHEET_NOT_PUBLISHED; after publish the identical request
          succeeds. Distinct pair from po_create_blocked_when_supplier_suspended.
        test_recipe:
          setup:
            - "Product RIBEYE-I; customer CUST-I TIER_1 ample credit; DRAFT sheet with one line (never published yet)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-I", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer I", customer_code: "CUST-I", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader, captures: { line_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
          assert:
            - "While DRAFT: ${err} == ERR_PRICE_SHEET_NOT_PUBLISHED (http 409)"
            - "After publish: Allocation.${alloc_id}.status == REQUESTED (created)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_sheet_week_half_open_overlap
        grounds:
          - state_machines.PriceSheet.DRAFT_to_PUBLISHED
          - validations[priority=10]
          - errors[ERR_PRICE_SHEET_WEEK_CONFLICT]
          - entities.PriceSheet.fields.week_start_date
        distinguishing_aspect: |
          Half-open 7-day week intervals on the PriceSheet resource: two
          non-terminal sheets covering the same Monday collide
          (ERR_PRICE_SHEET_WEEK_CONFLICT), while the immediately adjacent week
          (2026-08-10, gap 0 at the boundary) is accepted — adjacency is
          permitted because the interval is [start, start+7d). Distinct
          interval semantics and resource from warehouse_aggregate_capacity.
        test_recipe:
          setup:
            - "Product RIBEYE-J; sheet S1 week 2026-08-03 with a line, PUBLISHED"
            - "Sheet S2 also drafted for the SAME week 2026-08-03 (create allowed; conflict checked at publish), with a line"
            - "Sheet S3 drafted for the adjacent week 2026-08-10 superseding S1, with a line"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-J", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s2_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 701, weekly_supply_lbs: 10000 }, as: Trader }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-10", supersedes_sheet_id: "${s1_id}" }, as: Trader, captures: { s3_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s3_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 702, weekly_supply_lbs: 10000 }, as: Trader }
          trigger:
            - { call: "POST /api/price-sheets/${s2_id}/publish", payload: {}, as: DeskAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/price-sheets/${s3_id}/publish", payload: {}, as: DeskAdmin }
          assert:
            - "Same-week publish: ${err} == ERR_PRICE_SHEET_WEEK_CONFLICT (http 409); PriceSheet.${s2_id}.status == DRAFT"
            - "Adjacent-week publish succeeds: PriceSheet.${s3_id}.status == PUBLISHED (half-open adjacency is not a conflict)"
            - "PriceSheet.${s1_id}.status == SUPERSEDED after S3 publish"

      - name: warehouse_aggregate_capacity
        grounds:
          - calculations.warehouse_occupancy
          - validations[priority=11]
          - errors[ERR_WAREHOUSE_CAPACITY_EXCEEDED]
          - state_machines.PurchaseOrder.BOOKED_to_RECEIVED
        distinguishing_aspect: |
          Aggregate-capacity semantics on the Warehouse resource (not interval
          adjacency): occupancy is the SUM over co-located lots at an instant.
          Receiving 700 then 300 into capacity 1000 lands exactly ON the cap
          (occupied == capacity is allowed); the next 1 lb overflows ->
          ERR_WAREHOUSE_CAPACITY_EXCEEDED. Distinct semantics and resource
          from price_sheet_week_half_open_overlap.
        test_recipe:
          setup:
            - "Warehouse WH-AGG capacity 1000; supplier ACTIVE; product RIBEYE-K"
            - "POs PO-A (700), PO-B (300), PO-C (10) all BOOKED"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-K", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-12", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-AGG", zone: "CHILLER", capacity_lbs: 1000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-A", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 700, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { poa_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-B", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 300, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { pob_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-C", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 10, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { poc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/purchase-orders/${poa_id}/receive", payload: { received_weight_lbs: 700, warehouse_id: "${wh_id}", lot_code: "LOT-AGG-A", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "POST /api/purchase-orders/${pob_id}/receive", payload: { received_weight_lbs: 300, warehouse_id: "${wh_id}", lot_code: "LOT-AGG-B", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/warehouses/${wh_id}", payload: {}, as: DeskAdmin, captures: { occ: "$.data.occupied_lbs" } }
            - { call: "POST /api/purchase-orders/${poc_id}/receive", payload: { received_weight_lbs: 1, warehouse_id: "${wh_id}", lot_code: "LOT-AGG-C", production_date: "2026-08-02" }, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "After 700 + 300: ${occ} == 1000 (exactly at capacity; allowed)"
            - "Third receive of 1 lb: ${err} == ERR_WAREHOUSE_CAPACITY_EXCEEDED (http 409)"
            - "PurchaseOrder.${poc_id}.status == BOOKED (unchanged); Warehouse.${wh_id}.occupied_lbs still == 1000"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fabrication_post_void_mass_conservation
        grounds:
          - state_machines.FabricationBatch.DRAFT_to_POSTED
          - state_machines.FabricationBatch.POSTED_to_VOIDED
          - calculations.warehouse_occupancy
          - entities.Warehouse.fields.occupied_lbs
        distinguishing_aspect: |
          Conserved quantity is MASS (warehouse occupied_lbs and input-lot
          weight): post consumes the 1000-lb input and creates 950 lbs of
          outputs (50 loss) -> occupied 950; void depletes the untouched
          outputs and restores the input -> occupied returns to exactly the
          pre-post 1000. Distinct quantity from
          allocation_confirm_cancel_exposure_conservation (cents/lbs on the
          sheet line).
        test_recipe:
          setup:
            - "CARCASS product CARC-E with YieldSpecs to RIBEYE-E (20%, band 15-25) and CHUCK-E (75%, band 70-80)"
            - "Supplier ACTIVE; warehouse WH-F capacity 100000"
            - "LOT-F: 1000 lbs CARC-E received (production 2026-08-02), inspected -> AVAILABLE; occupied_lbs == 1000"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-E", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-E", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "CHUCK-E", kind: "PRIMAL", species: "BEEF", max_fat_pct: 18.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { chk_id: "$.data.id" } }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${rib_id}", expected_yield_pct: 20.0, min_yield_pct: 15.0, max_yield_pct: 25.0 }, as: DeskAdmin }
            - { call: "POST /api/yield-specs", payload: { carcass_product_id: "${carc_id}", output_product_id: "${chk_id}", expected_yield_pct: 75.0, min_yield_pct: 70.0, max_yield_pct: 80.0 }, as: DeskAdmin }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-13", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-F", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-13", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 1000, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-03" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 1000, warehouse_id: "${wh_id}", lot_code: "LOT-F", production_date: "2026-08-02" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 30.0 }, as: QualityGrader }
            - { call: "GET /api/warehouses/${wh_id}", payload: {}, as: DeskAdmin, captures: { occ_pre: "$.data.occupied_lbs" } }
          trigger:
            - { call: "POST /api/fabrication-batches", payload: { input_lot_id: "${lot_id}", loss_lbs: 50, outputs: [ { product_id: "${rib_id}", weight_lbs: 200 }, { product_id: "${chk_id}", weight_lbs: 750 } ] }, as: WarehouseOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /api/fabrication-batches/${batch_id}/post", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/warehouses/${wh_id}", payload: {}, as: DeskAdmin, captures: { occ_mid: "$.data.occupied_lbs" } }
            - { call: "POST /api/fabrication-batches/${batch_id}/void", payload: {}, as: DeskAdmin }
            - { call: "GET /api/warehouses/${wh_id}", payload: {}, as: DeskAdmin, captures: { occ_post: "$.data.occupied_lbs" } }
            - { call: "GET /api/inventory-lots?fabrication_batch_id=${batch_id}", payload: {}, as: DeskAdmin }
          assert:
            - "Pre-post: ${occ_pre} == 1000"
            - "After post: ${occ_mid} == 950 (1000 consumed, 950 outputs, 50 loss); input lot DEPLETED with current_weight_lbs == 0"
            - "After void: ${occ_post} == 1000 == ${occ_pre} (mass restored exactly)"
            - "Input InventoryLot.${lot_id}.status == AVAILABLE and current_weight_lbs == 1000"
            - "Both output lots (GET ?fabrication_batch_id=) are DEPLETED with current_weight_lbs == 0"
            - "FabricationBatch.${batch_id}.status == VOIDED"

      - name: allocation_confirm_cancel_exposure_conservation
        grounds:
          - state_machines.Allocation.REQUESTED_to_CONFIRMED
          - state_machines.Allocation.CONFIRMED_to_CANCELLED
          - calculations.customer_credit_exposure
          - entities.PriceSheetLine.fields.allocated_lbs
        distinguishing_aspect: |
          Conserved quantity is the FISCAL pair (PriceSheetLine.allocated_lbs
          and Customer.outstanding_exposure_cents): confirm moves them 0 ->
          300 / 0 -> 210000, and the compensating cancel returns both to
          exactly 0 / 0 with no drift. Distinct quantity from the mass
          invariant of fabrication_post_void_mass_conservation.
        test_recipe:
          setup:
            - "Product RIBEYE-L; sheet week 2026-08-03 line 700c supply 10000 PUBLISHED"
            - "Customer CUST-L credit_limit 100000000 TIER_1; REQUESTED allocation of 300 lbs"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-L", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer L", customer_code: "CUST-L", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 300 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "GET /api/price-sheet-lines/${line_id}", payload: {}, as: DeskAdmin, captures: { line_alloc_mid: "$.data.allocated_lbs" } }
            - { call: "GET /api/customers/${cust_id}", payload: {}, as: DeskAdmin, captures: { expo_mid: "$.data.outstanding_exposure_cents" } }
            - { call: "POST /api/allocations/${alloc_id}/cancel", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /api/price-sheet-lines/${line_id}", payload: {}, as: DeskAdmin, captures: { line_alloc_post: "$.data.allocated_lbs" } }
            - { call: "GET /api/customers/${cust_id}", payload: {}, as: DeskAdmin, captures: { expo_post: "$.data.outstanding_exposure_cents" } }
          assert:
            - "After confirm: ${line_alloc_mid} == 300 and ${expo_mid} == 210000 (300 x 700)"
            - "After cancel: ${line_alloc_post} == 0 and ${expo_post} == 0 (exact return to pre-confirm values)"
            - "Allocation.${alloc_id}.status == CANCELLED and cancel_reason == MANUAL"
            - "Customer.${cust_id}.status == ACTIVE throughout"
