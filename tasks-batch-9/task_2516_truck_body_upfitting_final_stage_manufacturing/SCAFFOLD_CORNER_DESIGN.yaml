            - "409 ERR_DUPLICATE_CONFIG_CODE — config_code uniqueness is global, not scoped to the chassis model or the tier"
            - "409 ERR_DUPLICATE_ORDER_NUMBER"
            - "422 ERR_CONFIG_NOT_PUBLISHED — a DRAFT configuration cannot be ordered against"
            - "409 ERR_CONFIG_INVALID_STATE — publishing an already PUBLISHED configuration"
            - "422 ERR_PTO_NOT_PROVISIONED — the F350 has pto_provision NONE, so no hoist can be planned on it even with a correct hydraulic_circuit"
            - "422 ERR_SLOT_DATE_RANGE_INVALID — end_date 2026-09-15 is before start_date 2026-09-20 and the range check runs before any capacity or availability check"
