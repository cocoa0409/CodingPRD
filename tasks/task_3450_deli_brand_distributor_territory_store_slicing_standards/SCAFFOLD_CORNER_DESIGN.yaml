        grounds: [calculations.weekly_allocation_waterfall, calculations.order_total_pricing]
        distinguishing_aspect: "PARTIAL prices only allocated units (10 of 15 requested -> merch 5000, no tier, 1500 fee -> total 6500); a fully unallocated order is SHORTED with all money fields 0."
