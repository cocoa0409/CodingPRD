# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Task 1166: Inpatient Coding & DRG Assignment
# §1.8 Test Targeting Index: 9 difficulty rules x 2 instances each = 18.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.6; every test_recipe
# chain replays from empty-DB using only §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: drg_severity_ms_vs_ap_variant
        grounds:
          - calculations.drg_grouping
          - calculations.expected_reimbursement
          - entities.CodedCase.fields.grouper_variant
        distinguishing_aspect: |
          Same chart line data (one MCC poa=Y + one CC poa=Y secondary) grouped under
          MS_DRG yields severity WITH_MCC / weight 2.1000 / expected 1365000, while the
          AP_DRG variant accumulates 2+1=3 SOI points -> SOI_3 / weight 1.8000 /
          expected 1170000 — a dual-variant calculation on the CodedCase/payment domain.
        test_recipe:
          setup:
            - "One DISCHARGED account (charges 2000000) with a MEDICAL_HIGH chart coded by an RHIA coder: principal I21.09 (poa Y), secondary N18.6 MCC poa Y, secondary E11.65 CC poa Y; assignment submitted so a CodedCase exists GROUPED under MS_DRG"
            - "Logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-DV1", full_name: "Dee Vee", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-DV1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true, cc_level: "NONE" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "Y", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "E11.65", poa: "Y", sequence: 3, cc_level: "CC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "GET /coded-cases", payload: {}, as: CodingManager, captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /coded-cases/${case_id}/regroup", payload: { expected_coded_case_version: "${case_v}", grouper_variant: "AP_DRG" }, as: Auditor, as_user_id: "${coder_id}" }
          assert:
            - "Before trigger: CodedCase.${case_id} under MS_DRG has severity_level == WITH_MCC, relative_weight == 2.1000, expected_reimbursement_cents == 1365000"
            - "After trigger: CodedCase.${case_id}.grouper_variant == AP_DRG"
            - "After trigger: CodedCase.${case_id}.severity_level == SOI_3"
            - "After trigger: CodedCase.${case_id}.relative_weight == 1.8000"
            - "After trigger: CodedCase.${case_id}.expected_reimbursement_cents == 1170000"
            - "1170000 != 1365000 — identical line data, two valid variants, different results"

      - name: audit_accuracy_code_vs_financial_variant
        grounds:
          - calculations.coder_accuracy_score
          - entities.CodingAudit.fields.accuracy_code_based
          - entities.CodingAudit.fields.accuracy_financial
        distinguishing_aspect: |
          One completed audit over the same findings yields accuracy_code_based == 0.7500
          (1 incorrect of 4 lines) and accuracy_financial == 0.7143 (delta 260000 over
          corrected expected 910000) — a dual-variant calculation on the audit/coder-
          performance domain, distinct from the CodedCase/payment domain of the sibling
          instance.
        test_recipe:
          setup:
            - "Subject coder has one ACCEPTED case (accepted at default clock 2026-05-01T00:00:00Z) whose chart holds 4 ACTIVE lines: principal I21.09, secondary E11.65 CC poa N, secondary J44.1 NONE, plus one procedure line; case grouped MS_DRG severity WITHOUT_CC_MCC expected 650000 (CC excluded because poa=N)"
            - "A separate RHIA coder acts as auditor; audit window [2026-04-01, 2026-06-01) samples the case; one POA_CORRECTION finding (poa N->Y on the CC line) is resolved APPLY, regrouping the case to WITH_CC / 910000 with delta 260000"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-DV2A", full_name: "Sub Ject", credential: "CCS" }, as: CodingManager, captures: { subj_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-DV2B", full_name: "Aud Itor", credential: "RHIA" }, as: CodingManager, captures: { auditor_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-DV2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${subj_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "E11.65", poa: "N", sequence: 2, cc_level: "CC" }, as: Coder, as_user_id: "${subj_id}", captures: { cc_line_id: $.data.id } }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "J44.1", poa: "Y", sequence: 3 }, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /procedure-lines", payload: { chart_id: "${chart_id}", pcs_code: "0DJ08ZZ", performed_at: "2026-04-22T09:00:00Z" }, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "GET /coded-cases", payload: {}, as: Auditor, as_user_id: "${auditor_id}", captures: { case_id: "$.data[0].id" } }
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", sample_size: 5 }, as: Auditor, as_user_id: "${auditor_id}", captures: { audit_id: $.data.id } }
            - { call: "POST /audits/${audit_id}/findings", payload: { coded_case_id: "${case_id}", finding_type: "POA_CORRECTION", target_diagnosis_id: "${cc_line_id}", corrected_poa: "Y" }, as: Auditor, as_user_id: "${auditor_id}", captures: { finding_id: $.data.id } }
            - { call: "POST /audit-findings/${finding_id}/resolve", payload: { resolution: "APPLY" }, as: Auditor, as_user_id: "${auditor_id}" }
          trigger:
            - { call: "POST /audits/${audit_id}/complete", payload: {}, as: Auditor, as_user_id: "${auditor_id}" }
          assert:
            - "CodingAudit.${audit_id}.accuracy_code_based == 0.7500"
            - "CodingAudit.${audit_id}.accuracy_financial == 0.7143"
            - "0.7500 != 0.7143 — same findings, two valid scoring variants, different results"
            - "Coder.${subj_id}.accuracy_running == 0.7500"
            - "Coder.${subj_id}.credential_review_required == true (0.7500 < 0.9500)"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: queue_priority_tiered_score
        grounds:
          - calculations.queue_priority_score
          - entities.CodingAssignment.fields.priority_score
        distinguishing_aspect: |
          Mode (a): priority_score combines 4 inputs with non-linear interaction —
          a 4-step tiered base on days_since_discharge (6 days -> 70), a floored and
          capped charge term (floor(2000000/100000)=20 capped by min(.,30)), an acuity
          term (MEDICAL_HIGH=10), and a conditional DNFB boost (0 while unflagged) —
          under an outer min(150, .) cap; result 100.
        test_recipe:
          setup:
            - "Account discharged 2026-04-25T10:00:00Z (6 days before the default clock 2026-05-01T00:00:00Z), total_charges_cents 2000000, chart acuity MEDICAL_HIGH, dnfb_flag false (no sweep run)"
            - "An RHIA coder exists to take the assignment"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CF1", full_name: "Prio Rita", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CF1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "COMMERCIAL", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
          assert:
            - "CodingAssignment.${asg_id}.priority_score == 100 (tier 70 + amount 20 + acuity 10 + boost 0, under cap 150)"

      - name: reimbursement_per_component_rounding
        grounds:
          - calculations.expected_reimbursement
        distinguishing_aspect: |
          Mode (b) nested rounding: drg_payment (650000 x 1.0000 = 650000) and
          outlier_payment (round_half_up((3000000 - 1150000) x 0.80) = 1480000) are each
          rounded to whole cents BEFORE summing; the pinned per-component-then-sum order
          yields expected_reimbursement_cents == 2130000 — a different order (sum then
          round) is forbidden by the formula.
        test_recipe:
          setup:
            - "DISCHARGED account with total_charges_cents 10000000 (cost estimate 3000000), MEDICAL_LOW chart coded with only a principal line (severity WITHOUT_CC_MCC, weight 1.0000), assignment submitted"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-CF2", full_name: "Round Er", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-CF2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 10000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "GET /coded-cases", payload: {}, as: CodingManager, captures: { case_id: "$.data[0].id" } }
          assert:
            - "CodedCase.${case_id}.severity_level == WITHOUT_CC_MCC"
            - "CodedCase.${case_id}.relative_weight == 1.0000"
            - "CodedCase.${case_id}.expected_reimbursement_cents == 2130000 (drg 650000 + outlier 1480000, each rounded per component then summed)"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_rework_cycle
        grounds:
          - state_machines.CodingAssignment.SUBMITTED_to_RETURNED
          - state_machines.CodingAssignment.RETURNED_to_IN_PROGRESS
          - state_machines.Chart.SUBMITTED_to_IN_CODING
        distinguishing_aspect: |
          CodingAssignment runs a rework cycle SUBMITTED -> RETURNED -> IN_PROGRESS ->
          SUBMITTED -> ACCEPTED with returned_count incrementing — a cyclic (non-linear)
          machine on the CodingAssignment entity, distinct from the Bill entity's cycle
          in the sibling instance.
        test_recipe:
          setup:
            - "MEDICAL_LOW chart coded by a CCS coder through first SUBMITTED (principal only), then returned with a reason; chart back IN_CODING"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-NL1", full_name: "Re Work", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-NL1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICAID", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/return", payload: { return_reason: "query physician on specificity" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
          assert:
            - "After return: CodingAssignment.${asg_id}.status == RETURNED and returned_count == 1 and Chart.${chart_id}.status == IN_CODING"
            - "Re-start from RETURNED succeeds (cycle re-entry): status == IN_PROGRESS"
            - "Final: CodingAssignment.${asg_id}.status == ACCEPTED, returned_count == 1"
            - "Chart.${chart_id}.status == CODED"

      - name: bill_post_payment_rebill_cycle
        grounds:
          - state_machines.Bill.PAID_to_POST_PAYMENT_REVIEW
          - state_machines.Bill.POST_PAYMENT_REVIEW_to_REBILL_REQUIRED
          - state_machines.Bill.REBILL_REQUIRED_to_PAID
        distinguishing_aspect: |
          Bill runs a post-payment cycle PAID -> POST_PAYMENT_REVIEW -> REBILL_REQUIRED
          -> PAID (rebill cancelled) — a cyclic machine on the Bill entity, distinct
          from the CodingAssignment rework cycle of the sibling instance.
        test_recipe:
          setup:
            - "Fully coded and accepted chart (principal + MCC poa=Y, expected 1365000); bill created (READY), finalized (billed 1365000), paid in full at 2026-05-01 (net 0); a post-payment review claims delta -200000"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-NL2", full_name: "Bill Cyc", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-NL2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "Y", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
            - { call: "POST /bills/${bill_id}/finalize", payload: {}, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/record-payment", payload: { paid_amount_cents: 1365000, paid_at: "2026-05-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/post-payment-reviews", payload: { payer_ref: "PR-NL2", claimed_delta_cents: -200000 }, as: BillingClerk, captures: { review_id: $.data.id } }
            - { call: "GET /bills/${bill_id}", payload: {}, as: BillingClerk, captures: { bill_v: $.data.version } }
            - { call: "POST /rebill-requests", payload: { review_id: "${review_id}", delta_cents: -200000, expected_bill_version: "${bill_v}" }, as: BillingClerk, captures: { rebill_id: $.data.id } }
          trigger:
            - { call: "POST /rebill-requests/${rebill_id}/cancel", payload: {}, as: ComplianceOfficer, as_user_id: "officer-nl2" }
          assert:
            - "Before trigger: Bill.${bill_id}.status == REBILL_REQUIRED, RebillRequest.${rebill_id}.status == PENDING"
            - "After trigger: RebillRequest.${rebill_id}.status == CANCELLED"
            - "After trigger: Bill.${bill_id}.status == PAID (cycle closed back to PAID)"
            - "Bill.${bill_id}.net_receivable_cents == 0"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: audit_apply_poa_cascade
        grounds:
          - state_machines.AuditFinding.OPEN_to_APPLIED
          - calculations.drg_grouping
          - calculations.expected_reimbursement
        distinguishing_aspect: |
          Depth-3 transitive cascade from trigger resolve(APPLY): hop 1 mutates the
          DiagnosisLine (poa N->Y); hop 2 — caused by the line mutation — regroups the
          CodedCase (WITHOUT_CC_MCC -> WITH_MCC, weight 1.0000 -> 2.1000, expected
          650000 -> 1365000, version +1); hop 3 — caused by the case recompute —
          refreshes Bill.expected_reimbursement_cents 650000 -> 1365000. Origin trigger
          differs from the sibling instance's assignment-accept trigger.
        test_recipe:
          setup:
            - "Coded+accepted chart with principal I21.09 and secondary N18.6 MCC poa=N (severity WITHOUT_CC_MCC, expected 650000); a Bill exists and is READY with expected_reimbursement_cents 650000"
            - "An audit on the subject coder samples the case; an OPEN POA_CORRECTION finding targets the MCC line with corrected_poa Y"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-TC1A", full_name: "Case Coder", credential: "CCS" }, as: CodingManager, captures: { subj_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-TC1B", full_name: "Case Auditor", credential: "RHIA" }, as: CodingManager, captures: { auditor_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-TC1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${subj_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "N", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${subj_id}", captures: { mcc_line_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${subj_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
            - { call: "GET /coded-cases", payload: {}, as: Auditor, as_user_id: "${auditor_id}", captures: { case_id: "$.data[0].id", case_v_pre: "$.data[0].version" } }
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", sample_size: 5 }, as: Auditor, as_user_id: "${auditor_id}", captures: { audit_id: $.data.id } }
            - { call: "POST /audits/${audit_id}/findings", payload: { coded_case_id: "${case_id}", finding_type: "POA_CORRECTION", target_diagnosis_id: "${mcc_line_id}", corrected_poa: "Y" }, as: Auditor, as_user_id: "${auditor_id}", captures: { finding_id: $.data.id } }
          trigger:
            - { call: "POST /audit-findings/${finding_id}/resolve", payload: { resolution: "APPLY" }, as: Auditor, as_user_id: "${auditor_id}" }
          assert:
            - "Hop 1: DiagnosisLine.${mcc_line_id}.poa == Y"
            - "Hop 2: CodedCase.${case_id}.severity_level == WITH_MCC and relative_weight == 2.1000 and expected_reimbursement_cents == 1365000 and version == ${case_v_pre} + 1"
            - "Hop 3: Bill.${bill_id}.expected_reimbursement_cents == 1365000 (was 650000) while bill.status == READY"
            - "Hop 4: AuditFinding.${finding_id}.delta_reimbursement_cents == 715000 and CodingAudit.${audit_id}.applied_findings_count == 1"

      - name: accept_cascades_chart_and_bill
        grounds:
          - state_machines.CodingAssignment.SUBMITTED_to_ACCEPTED
          - state_machines.Chart.SUBMITTED_to_CODED
          - state_machines.Bill.DRAFT_to_READY
        distinguishing_aspect: |
          Depth-2 transitive cascade from trigger assignment accept: hop 1 moves Chart
          SUBMITTED -> CODED; hop 2 — caused by the chart reaching CODED — moves the
          pre-existing Bill DRAFT -> READY and copies expected_reimbursement_cents
          650000 onto it. Origin trigger (accept) differs from the sibling instance's
          finding-resolve trigger.
        test_recipe:
          setup:
            - "MEDICAL_LOW chart coded through SUBMITTED (principal only; expected 650000); a Bill was created BEFORE acceptance so it sits DRAFT while the chart is SUBMITTED"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-TC2", full_name: "Casc Ade", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-TC2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "SELF_PAY", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
          assert:
            - "Before trigger: Bill.${bill_id}.status == DRAFT (chart was SUBMITTED, not CODED, at bill creation)"
            - "Hop 1: Chart.${chart_id}.status == CODED"
            - "Hop 2: Bill.${bill_id}.status == READY and Bill.expected_reimbursement_cents == 650000"
            - "Coder.${coder_id}.workload_units == 0 (weight 1 released) and accepted_count == 1 and accepted_weighted_units == 1"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_from_returned_state_beats_missing_principal
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRINCIPAL_DX_REQUIRED]
        distinguishing_aspect: |
          Category pair state vs business_constraint: a submit issued while the
          assignment is RETURNED (state violation) on a chart whose only principal was
          voided (business_constraint violation) MUST return ERR_INVALID_STATE (409) —
          priority 4 beats priority 7.
        test_recipe:
          setup:
            - "Chart coded through SUBMITTED with one principal line, then RETURNED (chart back IN_CODING); the coder then voids the principal line, so zero ACTIVE principal remains while the assignment sits RETURNED"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-PC1", full_name: "Prio One", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-PC1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}", captures: { pdx_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/return", payload: { return_reason: "rework" }, as: CodingManager }
            - { call: "PATCH /diagnosis-lines/${pdx_id}", payload: { status: "VOID" }, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_PRINCIPAL_DX_REQUIRED — the priority-4 state check fires before the priority-7 principal check even though both conditions hold"
            - "CodingAssignment.${asg_id}.status == RETURNED (unchanged)"

      - name: start_credential_beats_workload_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_CODER_CREDENTIAL_INSUFFICIENT]
          - errors[ERR_WORKLOAD_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: a start issued by a coder
          whose credential was downgraded below the chart requirement (safety violation)
          while the coder already holds another IN_PROGRESS assignment (temporal
          violation) MUST return ERR_CODER_CREDENTIAL_INSUFFICIENT (422) — priority 6
          beats priority 8.
        test_recipe:
          setup:
            - "CCS coder holds assignment A1 on a MEDICAL_HIGH chart already IN_PROGRESS; assignment A2 on a second MEDICAL_HIGH chart is ASSIGNED to the same coder; the coder's credential is then downgraded to CCA"
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-PC2", full_name: "Prio Two", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-PC2A", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_a: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-PC2B", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_b: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_a}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_a: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_b}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_b: $.data.id } }
            - { call: "POST /patient-accounts/${acct_a}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /patient-accounts/${acct_b}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_a}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_a: $.data.id } }
            - { call: "POST /assignments", payload: { chart_id: "${chart_b}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_b: $.data.id } }
            - { call: "POST /assignments/${asg_a}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "PATCH /coders/${coder_id}", payload: { credential: "CCA" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments/${asg_b}/start", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 422 and error_id == ERR_CODER_CREDENTIAL_INSUFFICIENT"
            - "error_id != ERR_WORKLOAD_OVERLAP — the priority-6 credential check fires before the priority-8 capacity check even though both conditions hold"
            - "CodingAssignment.${asg_b}.status == ASSIGNED (unchanged)"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: dnfb_threshold_exactly_3_days
        grounds:
          - calculations.dnfb_aging_scan
          - entities.PatientAccount.fields.dnfb_flag
        distinguishing_aspect: |
          Metric days-since-discharge via POST /dnfb-sweeps: an account discharged
          exactly 3.000 days before as_of IS flagged (>= threshold), while an account
          discharged 1 day before is not — boundary precision on the >= operator of the
          aging metric.
        test_recipe:
          setup:
            - "Account A discharged 2026-04-28T00:00:00Z (exactly 3 days before the default clock 2026-05-01T00:00:00Z), account B discharged 2026-04-30T00:00:00Z (1 day before); neither has any bill"
          setup_api_calls:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-BP1A", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_a: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-BP1B", admit_at: "2026-04-22T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_b: $.data.id } }
            - { call: "POST /patient-accounts/${acct_a}/discharge", payload: { discharge_at: "2026-04-28T00:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /patient-accounts/${acct_b}/discharge", payload: { discharge_at: "2026-04-30T00:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
          trigger:
            - { call: "POST /dnfb-sweeps", payload: { threshold_days: 3 }, as: CodingManager, captures: { sweep_id: $.data.id } }
            - { call: "GET /patient-accounts/${acct_a}", payload: {}, as: CodingManager, captures: { flag_a: $.data.dnfb_flag } }
            - { call: "GET /patient-accounts/${acct_b}", payload: {}, as: CodingManager, captures: { flag_b: $.data.dnfb_flag } }
          assert:
            - "PatientAccount.${acct_a}.dnfb_flag == true (3.000 days >= 3)"
            - "PatientAccount.${acct_b}.dnfb_flag == false (1 day < 3)"
            - "DnfbSweep.${sweep_id}.flagged_count == 1 and flagged_account_ids == [${acct_a}]"

      - name: accuracy_threshold_exactly_095
        grounds:
          - calculations.coder_accuracy_score
          - entities.Coder.fields.credential_review_required
        distinguishing_aspect: |
          Metric accuracy_code_based via POST /audits/{id}/complete: a subject scoring
          exactly 0.9500 (1 applied finding over 20 reviewed lines) is NOT flagged
          (flag iff strictly < 0.9500), while a second subject at 0.7500 (1 of 4) IS
          flagged — boundary precision on the strict < of the accuracy metric, on a
          different endpoint and metric than the sibling DNFB instance.
        test_recipe:
          setup:
            - "Subject coder S1 coded one case whose chart carries 20 ACTIVE lines (1 principal + 18 secondary + 1 procedure); audit A1 on S1 has exactly 1 APPLIED finding -> 0.9500"
            - "Subject coder S2 coded one case whose chart carries 4 ACTIVE lines (1 principal + 2 secondary + 1 procedure); audit A2 on S2 has exactly 1 APPLIED finding -> 0.7500"
            - "A separate RHIA auditor runs both audits; window [2026-04-01, 2026-06-01) covers both acceptances at the default clock"
