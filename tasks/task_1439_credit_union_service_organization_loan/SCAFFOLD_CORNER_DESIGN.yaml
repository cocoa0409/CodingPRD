# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Credit Union Service Organization & Loan Participation Network
# Clock default 2026-08-01T00:00:00Z unless set otherwise in the chain.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: credit_union_creation_defaults
        claim_type: creation
        grounds: ["entities.CreditUnion"]
        distinguishing_aspect: "POST /network/credit-unions with concentration_cap_pct omitted returns 201 with status ACTIVE, concentration_cap_pct 0.25, total_committed_principal_cents 0, and computed net_worth_ratio 0.1 for 2,000,000,000 / 20,000,000,000."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-1", legal_name: "First CU", cu_type: "DUAL", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { cu_status: "$.data.status", cu_cap: "$.data.concentration_cap_pct", cu_committed: "$.data.total_committed_principal_cents", cu_ratio: "$.data.net_worth_ratio" } }
          assert:
            - "cu_status == ACTIVE (initial state and default)"
            - "cu_cap == 0.25 (documented default applied)"
            - "cu_committed == 0"
            - "cu_ratio == 0.1 (computed net_worth_cents / total_assets_cents)"

      - name: credit_union_missing_required_charter_number
        claim_type: required_fields
        grounds: ["entities.CreditUnion.fields.charter_number", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field charter_number yields ERR_INVALID_REQUEST (400), not a 201."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/credit-unions", payload: { legal_name: "No Charter CU", cu_type: "BUYER", total_assets_cents: 1000, net_worth_cents: 100 }, as: NetworkAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: credit_union_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.CreditUnion.fields.cu_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "cu_type 'BANK' is not in {ORIGINATOR, BUYER, DUAL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-X", legal_name: "Bad Enum CU", cu_type: "BANK", total_assets_cents: 1000, net_worth_cents: 100 }, as: NetworkAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: commitment_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /network/commitments/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /network/commitments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: NetworkAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: certificate_buyer_id_stamped_from_header
        claim_type: system_fields
        grounds: ["entities.ParticipationCertificate.fields.buyer_id"]
        distinguishing_aspect: "buyer_id is system-stamped from X-User-ID (source: system); the creation response buyer_id equals the caller's CreditUnion id."
        test_recipe:
          setup:
            - "Agreement ACTIVE; offering OPEN (pool 100,000,000, min 0.01)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_buyer: "$.data.buyer_id", cert_status: "$.data.status" } }
          assert:
            - "cert_buyer == ${buyer_id} (stamped from the caller header)"
            - "cert_status == PENDING_DILIGENCE (initial state)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: offering_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.ParticipationOffering"]
        excluded_because:
          difficulty_instance: offering_creation_requires_active_agreement
          rationale: "The second trigger call asserts the newly created offering's status == DRAFT."

      - name: approve_diligence_on_active_certificate_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ParticipationCertificate.PENDING_DILIGENCE_to_COMMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve-diligence from ACTIVE (already funded) is not a declared transition -> ERR_INVALID_STATE; certificate remains ACTIVE."
        test_recipe:
          setup: ["Funded ACTIVE certificate under an ACTIVE agreement and OPEN offering"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /network/commitments/${cert_id} status == ACTIVE (unchanged)"

      - name: rescind_declined_certificate_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.ParticipationCertificate.PENDING_DILIGENCE_to_DECLINED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: rescind on a DECLINED certificate -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Certificate declined after diligence"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/decline", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/commitments/${cert_id}/rescind", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (DECLINED is terminal)"

      - name: certificate_paid_off_auto_transition
        claim_type: side_effect_execution
        grounds: ["state_machines.ParticipationCertificate.ACTIVE_to_PAID_OFF", "calculations.remittance_settlement"]
        distinguishing_aspect: "An on-time remittance whose principal portion exactly zeroes outstanding_principal_cents auto-transitions the certificate ACTIVE -> PAID_OFF."
        test_recipe:
          setup: ["Funded ACTIVE certificate 10,000,000 @600bps THIRTY_360, fee 25bps; remittance period 2026-08-01..2026-08-31 with collections 10,052,083 (interest 50,000 + fee 2,083 + principal 10,000,000)"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 10052083 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/remittances/${rem_id}/pay", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { pay_status: "$.data.status" } }
          assert:
            - "pay_status == PAID"
            - "GET /network/commitments/${cert_id} outstanding_principal_cents == 0 and status == PAID_OFF (auto-transition)"

      - name: offering_expiry_sweep_rescinds_pending_certificates
        claim_type: side_effect_execution
        grounds: ["state_machines.ParticipationOffering.OPEN_to_EXPIRED", "state_machines.ParticipationCertificate.PENDING_DILIGENCE_to_RESCINDED"]
        distinguishing_aspect: "Sweep with clock past close_at expires an OPEN offering with remaining principal and cascade-rescinds its PENDING_DILIGENCE certificates; sweep response reports offerings_expired == 1."
        test_recipe:
          setup: ["Offering OPEN with close_at 2026-09-01 and one PENDING_DILIGENCE certificate; clock moved to 2026-09-02"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/sweeps/run", payload: {}, as: NetworkAdmin, captures: { expired: "$.data.offerings_expired" } }
          assert:
            - "expired == 1"
            - "GET /network/offerings/${off_id} status == EXPIRED"
            - "GET /network/commitments/${cert_id} status == RESCINDED (cascade)"

      - name: delinquency_reinstatement_loop
        claim_type: side_effect_execution
        grounds: ["state_machines.ServicingAgreement.DELINQUENT_to_ACTIVE", "state_machines.Remittance.LATE_UNPAID_to_PAID_LATE"]
        distinguishing_aspect: "Paying the only LATE_UNPAID remittance (threshold 1) decrements late_remittance_count to 0, reinstates the agreement DELINQUENT -> ACTIVE, and reopens its SUSPENDED offering — the reverse direction of the delinquency cascade."
        test_recipe:
          setup:
            - "Agreement ACTIVE (threshold 1, grace 5, due day 15); offering OPEN; funded cert 10,000,000; remittance period 2026-08-01..2026-08-31 collections 100,000 (interest 50,000, fee 2,083, principal 47,917)"
            - "Clock 2026-09-21 (6 days past due, past grace); sweep already flipped the remittance LATE_UNPAID, agreement DELINQUENT, offering SUSPENDED"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, grace_period_days: 5, late_remittance_threshold: 1, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_id: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /network/sweeps/run", payload: {}, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/remittances/${rem_id}/pay", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { pay_status: "$.data.status", pay_penalty: "$.data.penalty_cents" } }
          assert:
            - "pay_status == PAID_LATE and pay_penalty == 176 (round_half_up(97,917 x 3bps x 6 days / 10000))"
            - "GET /network/servicing-agreements/${ag_id} status == ACTIVE and late_remittance_count == 0"
            - "GET /network/offerings/${off_id} status == OPEN (reopened by reinstatement cascade)"
            - "GET /network/commitments/${cert_id} outstanding_principal_cents == 9952083"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: remittance_due_at_derivation
        claim_type: correct_result
        grounds: ["entities.Remittance.fields.due_at"]
        distinguishing_aspect: "due_at equals the agreement's remittance_due_day (15) of the month following period_end's month: period_end 2026-08-31 -> due_at 2026-09-15T00:00:00Z."
        test_recipe:
          setup: ["Funded ACTIVE certificate under agreement with remittance_due_day 15"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { due: "$.data.due_at" } }
          assert:
            - "due == 2026-09-15T00:00:00Z"

      - name: concentration_declined_certificate_excluded
        claim_type: input_set_filtering
        grounds: ["calculations.concentration_share"]
        distinguishing_aspect: "A DECLINED certificate no longer counts toward the buyer's per-originator exposure: after committing 490,000,000 and declining it, a fresh 10,000,000 commitment passes the 500,000,000 cap and buyer.total_committed_principal_cents == 10,000,000."
        test_recipe:
          setup: ["Agreement ACTIVE; offering pool 1,000,000,000 min 0.01 OPEN; buyer cap 500,000,000"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool Big", pool_principal_cents: 1000000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 490000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /network/commitments/${c1_id}/decline", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { c2_id: "$.data.id" } }
          assert:
            - "Second commitment succeeds (DECLINED certificate excluded from exposure)"
            - "GET /network/credit-unions/${buyer_id} total_committed_principal_cents == 10000000"

      - name: interest_and_fee_values
        claim_type: correct_result
        grounds: ["calculations.accrued_interest", "calculations.remittance_settlement"]
        excluded_because:
          difficulty_instance: accrued_interest_day_count_variants
          rationale: "Both day-count variants' interest and fee outputs are asserted there as literals."

      - name: repurchase_price_stamped_on_complete
        claim_type: correct_result
        grounds: ["calculations.repurchase_price", "state_machines.RepurchaseCase.TRIGGERED_to_COMPLETED"]
        distinguishing_aspect: "Repurchase completed 2026-08-31 on a certificate funded 2026-08-15 with no remittances stamps repurchase_price_cents == 10,028,333 (outstanding 10,000,000 + round_half_up(10,000,000 x 0.06 x 17/360) = 28,333 under THIRTY_360, window funded_at..completion inclusive = 17 days); the certificate becomes REPURCHASED and the offering's committed_principal_cents drops to 90,000,000."
        test_recipe:
          setup: ["Funded ACTIVE certificate 10,000,000 funded at clock 2026-08-15 (no remittances); buyer-created repurchase case TRIGGERED; clock moved to 2026-08-31 for completion"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/repurchase-cases", payload: { certificate_id: "${cert_id}", trigger_reason: "MATERIAL_BREACH" }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { case_id: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/repurchase-cases/${case_id}/complete", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { price: "$.data.repurchase_price_cents", case_status: "$.data.status" } }
          assert:
            - "price == 10028333 (10,000,000 + round_half_up(10,000,000 x 0.06 x 17/360))"
            - "case_status == COMPLETED"
            - "GET /network/commitments/${cert_id} status == REPURCHASED and outstanding_principal_cents == 0"
            - "GET /network/offerings/${off_id} committed_principal_cents == 90000000 (REPURCHASED excluded)"
            - "GET /network/credit-unions/${buyer_id} total_committed_principal_cents == 0"

      - name: loss_allocation_rounding_values
        claim_type: precision
        grounds: ["calculations.loss_share_allocation"]
        excluded_because:
          difficulty_instance: loss_allocation_residual_rounding
          rationale: "Per-share round-then-residual order asserted with literal [34, 33, 33]."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: self_participation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_SELF_PARTICIPATION]"]
        distinguishing_aspect: "A DUAL credit union committing to its own originated offering -> ERR_SELF_PARTICIPATION."
        test_recipe:
          setup: ["DUAL credit union is both originator (owns the agreement) and prospective buyer; offering OPEN"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-DUAL", legal_name: "Dual CU", cu_type: "DUAL", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { dual_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${dual_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${dual_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${dual_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${dual_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SELF_PARTICIPATION"

      - name: duplicate_commitment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_COMMITMENT]"]
        distinguishing_aspect: "A buyer with an existing PENDING_DILIGENCE certificate in an offering cannot create a second commitment in the same offering -> ERR_DUPLICATE_COMMITMENT."
        test_recipe:
          setup: ["Offering OPEN; buyer already holds a PENDING_DILIGENCE certificate"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 5000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUPLICATE_COMMITMENT"

      - name: min_share_boundary_equality
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_MIN_SHARE_NOT_MET]"]
        distinguishing_aspect: "committed_amount exactly == min_share_pct x pool_principal_cents (10,000,000 = 0.01 x 1,000,000,000) is allowed; 9,999,999 is rejected with ERR_MIN_SHARE_NOT_MET."
        test_recipe:
          setup: ["Offering pool 1,000,000,000 min_share_pct 0.01 OPEN; two buyers"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B1", legal_name: "Buyer One", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B2", legal_name: "Buyer Two", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool Big", pool_principal_cents: 1000000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${b1_id}", captures: { ok_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 9999999 }, as: BuyerUser, as_user_id: "${b2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "First commitment (exactly the minimum share) succeeds"
            - "err == ERR_MIN_SHARE_NOT_MET (one cent below the minimum)"

      - name: pool_exhausted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_POOL_EXHAUSTED]"]
        distinguishing_aspect: "Commitment of 20,000,000 against remaining_principal_cents 10,000,000 -> ERR_POOL_EXHAUSTED."
        test_recipe:
          setup: ["Offering pool 100,000,000 min 0.01 OPEN; buyer1 committed 90,000,000"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B1", legal_name: "Buyer One", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B2", legal_name: "Buyer Two", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 90000000 }, as: BuyerUser, as_user_id: "${b1_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 20000000 }, as: BuyerUser, as_user_id: "${b2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_POOL_EXHAUSTED"

      - name: loss_exceeds_pool_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_LOSS_EXCEEDS_POOL]"]
        distinguishing_aspect: "Allocating a loss of 10,000,001 against a single certificate with outstanding 10,000,000 -> ERR_LOSS_EXCEEDS_POOL."
        test_recipe:
          setup: ["Funded ACTIVE certificate 10,000,000; loss event of 10,000,001 reported"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/loss-events", payload: { offering_id: "${off_id}", loss_amount_cents: 10000001, defaulted_at: "2026-08-10T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { loss_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/loss-events/${loss_id}/allocate", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_LOSS_EXCEEDS_POOL"

      - name: allocate_with_no_eligible_certificates_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_NO_ALLOCATABLE_CERTIFICATES]"]
        distinguishing_aspect: "Allocating a loss on an offering whose only certificate is COMMITTED (never funded) finds zero {ACTIVE, EXCEPTION} certificates -> ERR_NO_ALLOCATABLE_CERTIFICATES (checked before ERR_LOSS_EXCEEDS_POOL per the state machine's precondition order)."
        test_recipe:
          setup: ["Offering OPEN with one COMMITTED (unfunded) certificate; loss event of 1,000 reported"]
          setup_api_calls:
