# =============================================================================
# Task 1901 - Section 1.9 Scaffold Corner Design (Coverage Index)
# Breadth enumeration of every testable claim in SCAFFOLD.yaml sections
# 1.1-1.7 that section 1.8 does not already cover. Section/claim_type values
# follow references/claim-extraction-guide.md. Instances already exercised as
# the failure path of a section-1.8 instance are emitted as excluded_because
# stubs. Canonical fixtures match SCAFFOLD_DIFFICULTY_DESIGN.yaml (J1=US-DE,
# J3=US-NV, formation 2025-06-15, default clock 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: entity_create_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.LegalEntity.fields.fiscal_year_end_month"
          - "entities.LegalEntity.fields.authorized_shares"
          - "entities.LegalEntity.fields.status"
        distinguishing_aspect: "POST /api/entities omitting both defaulted fields persists 12 and 0, initializes status DRAFT, compliance_posture GOOD_STANDING, fees_accrued_cents 0, version 1."
        test_recipe:
          setup: ["Jurisdiction J1 exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
          trigger:
            - call: "POST /api/entities"
              payload: { legal_name: "Defaults LLC", entity_type: "LLC", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
          assert:
            - "response 201: data.fiscal_year_end_month == 12 and data.authorized_shares == 0 (defaults applied)"
            - "data.status == DRAFT (initial state) and data.compliance_posture == GOOD_STANDING"
            - "data.fees_accrued_cents == 0 and data.version == 1"
            - "data.id is a bare UUID and data.created_at / data.updated_at are server-stamped"

      - name: entity_create_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.LegalEntity.fields.compliance_posture"
          - "entities.LegalEntity.fields.fees_accrued_cents"
        distinguishing_aspect: "Client-supplied computed/system fields in the create body are ignored: the response shows the server-computed values, not the supplied ones."
        test_recipe:
          setup: ["Jurisdiction J1 exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
          trigger:
            - call: "POST /api/entities"
              payload: { legal_name: "Spoofed Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", compliance_posture: "FORFEITED", fees_accrued_cents: 999999, status: "ACTIVE" }
              as: CorporateSecretary
              as_user_id: "sec-01"
          assert:
            - "response 201: data.compliance_posture == GOOD_STANDING (client input FORFEITED ignored)"
            - "data.fees_accrued_cents == 0 and data.status == DRAFT (client inputs ignored)"

      - name: entity_create_missing_required_field
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required legal_name is rejected with ERR_INVALID_REQUEST (400) before any state or business evaluation."
        test_recipe:
          setup: ["Jurisdiction J1 exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
          trigger:
            - call: "POST /api/entities"
              payload: { entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: entity_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.LegalEntity.fields.entity_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "entity_type outside the declared enum (TRUST) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Jurisdiction J1 exists"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
          trigger:
            - call: "POST /api/entities"
              payload: { legal_name: "Trusty", entity_type: "TRUST", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_ENTITY_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but absent entity id returns 404 ERR_ENTITY_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/entities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 404 and data.error_id == ERR_ENTITY_NOT_FOUND"

      - name: officer_duplicate_email_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Officer.fields.email"
          - "errors[ERR_DUPLICATE_OFFICER]"
        distinguishing_aspect: "Second officer with an identical email is rejected with ERR_DUPLICATE_OFFICER (409); officer uniqueness is enforced on email."
        test_recipe:
          setup: ["Officer O1 exists with email oo@example.com"]
          setup_api_calls:
            - call: "POST /api/officers"
              payload: { full_name: "Olivia Ortiz", email: "oo@example.com" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { o1: "$.data.id" }
          trigger:
            - call: "POST /api/officers"
              payload: { full_name: "Other Olivia", email: "oo@example.com" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 and data.error_id == ERR_DUPLICATE_OFFICER"

      - name: certificate_fee_variants_computed
        claim_type: computed_fields
        grounds:
          - "calculations.certificate_fee"
          - "entities.GoodStandingCertificate.fields.fee_cents"
        distinguishing_aspect: "STANDARD request computes fee_cents == 5000 (jurisdiction.cert_fee_cents); EXPEDITED computes 7500 (round_half_up(5000 * 1.5))."
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1 with posture GOOD_STANDING at the default clock"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/registered-agents"
              payload: { name: "DE Agent Co", jurisdiction_id: "${j1}", address: "1 Agent Way" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ag1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Cert Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 10000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id", e_v: "$.data.version" }
            - call: "POST /api/entities/${e1}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_form: "$.data.id" }
            - call: "POST /api/resolutions/${r_form}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${r_form}/adopt"
              payload: { expected_entity_version: "${e_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
          trigger:
            - call: "POST /api/entities/${e1}/certificate-requests"
              payload: { jurisdiction_id: "${j1}", delivery_speed: "STANDARD" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { c_std: "$.data.id", c_std_fee: "$.data.fee_cents" }
            - call: "POST /api/entities/${e1}/certificate-requests"
              payload: { jurisdiction_id: "${j1}", delivery_speed: "EXPEDITED" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { c_exp: "$.data.id", c_exp_fee: "$.data.fee_cents" }
          assert:
            - "GoodStandingCertificate.${c_std}.fee_cents == 5000 (STANDARD variant)"
            - "GoodStandingCertificate.${c_exp}.fee_cents == 7500 (EXPEDITED variant: round_half_up(5000 * 1.5))"
            - "both certificates status == REQUESTED, requested_date == 2026-08-01"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: dissolved_entity_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.LegalEntity"
          - "errors[ERR_ENTITY_ALREADY_DISSOLVED]"
        distinguishing_aspect: "After DISSOLVED (terminal), both PATCH and commence-dissolution are rejected; the machine offers no outbound transitions."
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1 with AUTHORIZE_DISSOLUTION resolution ADOPTED; dissolution commenced and finalized at the default clock"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/registered-agents"
              payload: { name: "DE Agent Co", jurisdiction_id: "${j1}", address: "1 Agent Way" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ag1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Terminal Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 10000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id", e_v: "$.data.version" }
            - call: "POST /api/entities/${e1}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_form: "$.data.id" }
            - call: "POST /api/resolutions/${r_form}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${r_form}/adopt"
              payload: { expected_entity_version: "${e_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_DISSOLUTION", payload: {}, effective_date: "2026-08-01" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_dis: "$.data.id" }
            - call: "POST /api/resolutions/${r_dis}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "GET /api/entities/${e1}"
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e_v2: "$.data.version" }
            - call: "POST /api/resolutions/${r_dis}/adopt"
              payload: { expected_entity_version: "${e_v2}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/commence-dissolution"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/finalize-dissolution"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
          trigger:
            - call: "PATCH /api/entities/${e1}"
              payload: { legal_name: "Zombie Corp" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/entities/${e1}/commence-dissolution"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err2: "$.data.error_id" }
          assert:
            - "PATCH on DISSOLVED: 409 ERR_ENTITY_ALREADY_DISSOLVED"
            - "commence-dissolution on DISSOLVED: 409 ERR_ENTITY_NOT_ACTIVE (terminal state has no outbound commence transition)"

      - name: filing_accept_from_prepared_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.AnnualFiling.SUBMITTED_to_ACCEPTED"
          - "errors[ERR_FILING_NOT_SUBMITTED]"
        distinguishing_aspect: "accept on a PREPARED filing (never submitted) is rejected with ERR_FILING_NOT_SUBMITTED; the filing remains PREPARED."
        test_recipe:
          setup: ["J1, AG1, ACTIVE E1; FRANCHISE_TAX period-2026 filing PREPARED"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/registered-agents"
              payload: { name: "DE Agent Co", jurisdiction_id: "${j1}", address: "1 Agent Way" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ag1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Skipstep Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 10000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id", e_v: "$.data.version" }
            - call: "POST /api/entities/${e1}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_form: "$.data.id" }
            - call: "POST /api/resolutions/${r_form}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${r_form}/adopt"
              payload: { expected_entity_version: "${e_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "GET /api/filings?entity_id=${e1}&filing_type=FRANCHISE_TAX&period_year=2026"
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ft1: "$.data[0].id" }
            - call: "POST /api/filings/${ft1}/prepare"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
          trigger:
            - call: "POST /api/filings/${ft1}/accept"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 and data.error_id == ERR_FILING_NOT_SUBMITTED"
            - "AnnualFiling.${ft1}.status remains PREPARED"

      - name: withdrawn_resolution_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Resolution.DRAFT_to_WITHDRAWN"
          - "errors[ERR_RESOLUTION_NOT_DRAFT]"
        distinguishing_aspect: "A WITHDRAWN resolution (terminal) rejects a subsequent submit with ERR_RESOLUTION_NOT_DRAFT."
        test_recipe:
          setup: ["J1 and a DRAFT entity E1 (no formation needed); resolution R drafted and withdrawn"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Drafty Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id" }
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_QUALIFICATION", payload: { jurisdiction_id: "${j1}" }, effective_date: "2026-09-01" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r1: "$.data.id" }
            - call: "POST /api/resolutions/${r1}/withdraw"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
          trigger:
            - call: "POST /api/resolutions/${r1}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 and data.error_id == ERR_RESOLUTION_NOT_DRAFT"
            - "Resolution.${r1}.status remains WITHDRAWN"

      - name: qualification_abort_withdrawal_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.ForeignQualification.QUALIFIED_to_WITHDRAWAL_PENDING"
          - "state_machines.ForeignQualification.WITHDRAWAL_PENDING_to_QUALIFIED"
        distinguishing_aspect: "QUALIFIED -> WITHDRAWAL_PENDING -> QUALIFIED cycle completes; a finalize-withdrawal attempted from QUALIFIED (after abort) is rejected with ERR_QUALIFICATION_NOT_WITHDRAWAL_PENDING."
        test_recipe:
          setup:
            - "J1/AG1, ACTIVE E1; J3/AG3 with covering appointment AA3; AUTHORIZE_QUALIFICATION adopted; Q3 QUALIFIED"
            - "AUTHORIZE_WITHDRAWAL resolution for J3 ADOPTED"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
