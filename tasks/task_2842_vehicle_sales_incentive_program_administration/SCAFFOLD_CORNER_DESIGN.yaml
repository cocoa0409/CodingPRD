          assert:
            - "${rate1} == 20000 and ${r1_prev} == 20000 with ${r1_at} == 2026-08-18T00:00:00.000Z (the logical clock) and ${r1_month} == 2026-08-01T00:00:00.000Z"
            - "${err_stale} == ERR_STALE_PROGRAM_VERSION (412) — the second event was authored against version ${v1}, whose per_unit rate the first event has already replaced"
            - "${v2} == ${v1} + 1 and ${rate2} == 24000 — the refused event neither wrote the rate nor moved the version"
            - "${r2_prev} == 24000 — after re-reading, the second event records the FIRST event's outcome as its baseline, so the two RepricingEvent rows chain without a gap: 20000 -> 24000 -> 26000"
