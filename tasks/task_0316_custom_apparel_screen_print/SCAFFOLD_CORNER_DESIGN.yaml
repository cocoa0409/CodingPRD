# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Custom Apparel & Embroidery / Screen-Print Shop — EXPERT band.
# Breadth probe over §1.1-§1.7 per references/claim-extraction-guide.md.
# Every setup_api_calls chain drives empty-DB -> precondition using only §1.5
# endpoints; ${var} bound by an earlier captures: line. excluded_because stubs
# point to §1.8 instances that already cover the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_shop_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Shop.fields.spoilage_pct
          - entities.Shop.fields.rush_threshold_days
        distinguishing_aspect: "POST /shops with only name returns 201; spoilage_pct defaults 0.05, rush_threshold_days 7, rush_surcharge_pct 0.25, current_utc epoch."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id, sp: $.data.spoilage_pct, rt: $.data.rush_threshold_days }
          assert:
            - "HTTP 201; Shop.spoilage_pct == 0.05; Shop.rush_threshold_days == 7; Shop.rush_surcharge_pct == 0.25"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Order
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET an Order id that does not exist in the shop returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Shop exists; no orders."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_order_line_missing_required_size_run
        claim_type: Required Fields
        grounds:
          - entities.OrderLine.fields.size_run
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST .../lines without size_run (a required input field) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Shop, customer, method, style, sku, draft order."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: create_order_line_color_not_in_catalog
        claim_type: Type Constraints
        grounds:
          - entities.GarmentStyle.fields.available_colors
          - entities.OrderLine.fields.color
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A line color not in the style's available_colors yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Style available_colors [BLACK]; line requests RED."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "RED", num_locations: 1, num_colors: 1, size_run: { L: 10 } }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: order_line_empty_size_run_zero_qty
        claim_type: Type Constraints
        grounds:
          - entities.OrderLine.fields.size_run
          - calculations.line_qty
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An empty size_run ({}) — the zero-quantity edge on a different metric than the numeric tier boundary — is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Draft order; line with size_run {} (no sizes)."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1, size_run: {} }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: blanksku_on_hand_computed_on_create
        claim_type: Computed Fields
        grounds:
          - entities.BlankSku.fields.on_hand_qty
          - entities.BlankSku.fields.reserved_qty
          - entities.BlankSku.fields.total_stock_qty
        distinguishing_aspect: "Creating a BlankSku with total_stock_qty 200 yields on_hand_qty 200 and reserved_qty 0 (computed, not client-supplied)."
        test_recipe:
          setup: ["Shop, style."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
          trigger:
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { oh: $.data.on_hand_qty, rq: $.data.reserved_qty }
          assert:
            - "BlankSku.on_hand_qty == 200; BlankSku.reserved_qty == 0"

      - name: customer_soft_delete_excluded_from_list
        claim_type: Listing
        grounds:
          - entities.Customer.fields.archived
          - complexity_profile.complexity_layers
        distinguishing_aspect: "After archiving Customer Beta, GET /customers?shop_id=X (include_archived defaulting false) returns only Acme (total_count 1); GET /customers?shop_id=X&include_archived=true returns both (total_count 2). Default list excludes the soft-deleted customer."
        test_recipe:
          setup: ["Shop with two customers Acme and Beta; Beta then archived."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Beta", email: "b@x.com" }
              as: ShopManager
              captures: { cust_b: $.data.id }
            - call: "POST /customers/${cust_b}/archive"
              payload: {}
              as: ShopManager
              captures: { arch: $.data.archived }
          trigger:
            - call: "GET /customers?shop_id=${shop_id}"
              payload: {}
              as: ShopManager
            - call: "GET /customers?shop_id=${shop_id}&include_archived=true"
              payload: {}
              as: ShopManager
          assert:
            - "Customer.${cust_b}.archived == true after archive"
            - "Default GET /customers?shop_id excludes Beta: total_count == 1 (only Acme)"
            - "GET /customers?shop_id&include_archived=true: total_count == 2 (both)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: artproof_approve_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ArtProof.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a proof still in DRAFT (never submitted) is not a declared transition from DRAFT -> APPROVED; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Order with a DRAFT proof; read order version for OCC."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; ArtProof remains DRAFT"

      - name: artproof_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.ArtProof.initial_state
          - entities.ArtProof.fields.status
        distinguishing_aspect: "A newly created ArtProof has status DRAFT and revision_round 0."
        test_recipe:
          setup: ["Order with no proofs."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { st: $.data.status, rr: $.data.revision_round }
          assert:
            - "ArtProof.status == DRAFT; ArtProof.revision_round == 0"

      - name: order_invoice_before_fulfilled_returns_not_fulfilled
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.UNBILLED_to_INVOICED
          - validations[priority=15]
          - errors[ERR_ORDER_NOT_FULFILLED]
        distinguishing_aspect: "Invoicing a CONFIRMED (not yet FULFILLED) order returns ERR_ORDER_NOT_FULFILLED (409); the billing axis gate on fulfillment is enforced."
        test_recipe:
          setup: ["Order approved+CONFIRMED but not produced."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1, size_run: { L: 30 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ORDER_NOT_FULFILLED"

      - name: cancel_fulfilled_order_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling an order whose fulfillment_status is IN_PRODUCTION (outside {DRAFT, CONFIRMED}) returns ERR_ORDER_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["Order CONFIRMED then run scheduled -> Order IN_PRODUCTION (no longer cancellable)."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "GIL-5000", name: "Tee", blank_cost_cents: 350, available_colors: ["BLACK"], available_sizes: ["L"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, num_colors: 1, size_run: { L: 30 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "P1" }
              as: ShopManager
              captures: { press_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: confirm_proof_not_approved_excluded
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - errors[ERR_PROOF_NOT_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_confirm_depends_on_artproof_approved
          rationale: "The Order->ArtProof confirm gate is the asserted failure path of that §1.8 instance."

      - name: complete_fulfill_cascade_excluded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.IN_PRODUCTION_to_FULFILLED
        excluded_because:
          difficulty_instance: transitive_cascade / complete_fulfill_release_stock_depth3
          rationale: "The complete->fulfill->release->stock cascade is fully asserted by that §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: embroidery_run_cost_stitch_thousands
        claim_type: Correct Result
        grounds:
          - calculations.decoration_run_cost
          - entities.DecorationMethod.fields.stitch_run_per_1k_cents
          - entities.Quote.fields.decoration_subtotal_cents
        distinguishing_aspect: "EMBROIDERY branch: stitch_count 8500 -> ceil(8500/1000)=9 thousands -> per-unit 9*90=810; line {OS:30} 1 location -> decoration_subtotal 810*30=24300; setup = 1 location * digitizing_fee 5000 = 5000."
        test_recipe:
          setup: ["Embroidery order line {OS:30} stitch 8500, 1 location; approved+CONFIRMED; cap style blank 600."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "EMBROIDERY", name: "Tajima", digitizing_fee_cents: 5000, stitch_run_per_1k_cents: 90 }
              as: ShopManager
              captures: { method_id: $.data.id }
            - call: "POST /garment-styles"
              payload: { shop_id: "${shop_id}", sku_code: "CAP-100", name: "Cap", blank_cost_cents: 600, available_colors: ["BLACK"], available_sizes: ["OS"] }
              as: ShopManager
              captures: { style_id: $.data.id }
            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "OS", total_stock_qty: 100 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 1, stitch_count: 8500, size_run: { OS: 30 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Cap logo", art_hash: "h2" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
          trigger:
            - call: "GET /orders/${order_id}/quote"
              payload: {}
              as: ShopManager
          assert:
