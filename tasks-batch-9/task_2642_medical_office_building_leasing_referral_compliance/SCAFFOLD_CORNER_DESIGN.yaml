          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Five structurally different body defects collapse to the one 400-level code declared at priority 3 — three-decimal money, negative money, a reversed term, an out-of-range share percentage and a backwards clock — and each is rejected before any state or business rule runs, so nothing is persisted."
