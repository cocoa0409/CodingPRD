          setup_api_calls: *CH_REJECTED
          trigger:
            - call: "GET /rejection-reasons?submission_id=${sub_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /appeal-requests"
              payload: { submission_id: "${sub_id}", appeal_type: "GUIDELINE_INTERPRETATION", argument: "We disagree with the privacy label finding.", cited_rejection_reason_ids: ["${rr_id}"] }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
