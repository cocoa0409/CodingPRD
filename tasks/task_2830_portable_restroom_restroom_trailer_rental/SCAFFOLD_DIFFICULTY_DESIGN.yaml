          Resource: Route (truck time on one route-date). Interval semantics: HALF-OPEN minute
          intervals inflated by ROUTE_TURNAROUND_BUFFER_MINUTES = 20 on BOTH sides, so exact adjacency
          conflicts and a gap of exactly 20 minutes does not. Probes sit at gap 0, 15, 20 on each side
          of the incumbent window, which is the only arrangement that separates buffered-half-open
          from plain-half-open and from closed semantics.
