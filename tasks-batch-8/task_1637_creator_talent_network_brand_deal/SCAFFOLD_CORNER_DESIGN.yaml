scaffold_corner_design:
  - section: entities
    instances:
      - name: creator_create_initial_state_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Creator, state_machines.Creator]
        distinguishing_aspect: "POST /creators with all required fields returns 201 with status APPLIED, compliance_strikes 0, lifetime_billed_cents 0, pending_disclosure_count 0, version 1, and server-minted id plus created_at at the default logical clock."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /creators", payload: { handle: "ce1", email: "ce1@x.com", niche: "BEAUTY", primary_platform: "INSTAGRAM", followers: 5000, avg_views_30d: 2000, engagement_rate_bps: 300 }, as: TalentManager, captures: { c_id: $.data.id } }
          assert:
            - "Creator.${c_id}.status == APPLIED"
            - "Creator.${c_id}.compliance_strikes == 0 and lifetime_billed_cents == 0 and pending_disclosure_count == 0"
            - "Creator.${c_id}.version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: creator_create_missing_required_email_returns_validation
        claim_type: required_fields
        grounds: [entities.Creator.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field email yields ERR_VALIDATION (400); no creator persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /creators", payload: { handle: "ce2", niche: "BEAUTY", primary_platform: "INSTAGRAM", followers: 5000, avg_views_30d: 2000, engagement_rate_bps: 300 }, as: TalentManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: brief_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Brief, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent brief UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /briefs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: BrandManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: brief_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Brief.fields.revision_rounds_included, entities.Brief.fields.whitelisting_required]
        distinguishing_aspect: "Omitting optional whitelisting_required and revision_rounds_included applies defaults false and 2; brief starts DRAFT with slots_committed 0."
        test_recipe:
          setup: ["brand exists"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "BD", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "D", niche: "BEAUTY", min_followers: 100, min_engagement_bps: 10, slots_total: 1, budget_cents: 5000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
          assert:
            - "Brief.${br_id}.whitelisting_required == false and revision_rounds_included == 2"
            - "Brief.${br_id}.status == DRAFT and slots_committed == 0"

      - name: pitch_repitch_supersedes_prior
        claim_type: computed_fields
        grounds: [state_machines.Pitch.SUBMITTED_to_SUPERSEDED, entities.Pitch.fields.superseded_by_pitch_id]
        distinguishing_aspect: "Re-pitching the same creator on the same brief auto-supersedes the prior SUBMITTED pitch: prior.status == SUPERSEDED and superseded_by_pitch_id equals the new pitch id (self-referential link)."
        test_recipe:
          setup: ["ACTIVE creator; OPEN brief; one SUBMITTED pitch"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "ce3", email: "ce3@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BE", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 90000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /briefs/${br_id}", payload: {}, as: BrandManager, captures: { br_v2: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 95000, concept_note: "v2", expected_brief_version: "${br_v2}" }, as: TalentManager, captures: { p2: $.data.id } }
          assert:
            - "Pitch.${p1}.status == SUPERSEDED and Pitch.${p1}.superseded_by_pitch_id == ${p2}"
            - "Pitch.${p2}.status == SUBMITTED and proposed_fee_cents == 95000"

  - section: state_machines
    instances:
      - name: pitch_terminal_lockdown_after_reject
        claim_type: terminal_lockdown
        grounds: [state_machines.Pitch.SHORTLISTED_to_REJECTED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "From terminal REJECTED no further transition is possible: a SHORTLIST action on a rejected pitch returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["OPEN brief; pitch SHORTLISTED then REJECTED"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cs1", email: "cs1@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BS1", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 90000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "REJECT" }, as: BrandManager }
          trigger:
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL and Pitch.${p_id}.status == REJECTED"

      - name: brief_close_with_committed_slots_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Brief.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing an OPEN brief with slots_committed > 0 is rejected with ERR_INVALID_STATE; only empty OPEN briefs or fully-terminal AWARDED briefs may close."
        test_recipe:
          setup: ["OPEN brief with one ACCEPTED pitch (slots_committed == 1)"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cs2", email: "cs2@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BS2", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 2, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 90000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager }
          trigger:
            - { call: "POST /briefs/${br_id}/close", payload: {}, as: BrandManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and Brief.${br_id}.status == OPEN"

      - name: deal_auto_completes_when_all_deliverables_verified
        claim_type: side_effect_execution
        grounds: [state_machines.Deal.ACTIVE_to_COMPLETED, state_machines.Deliverable.PUBLISHED_to_VERIFIED]
        distinguishing_aspect: "Bubble-up compound transition: when the deal's only deliverable becomes VERIFIED via disclosure PASS, the deal auto-transitions ACTIVE -> COMPLETED in the same request."
        test_recipe:
          setup: ["ACTIVE deal, brief dps=1; deliverable PUBLISHED with QUEUED disclosure check"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cs3", email: "cs3@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BS3", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 90000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 90000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "YOUTUBE", due_date: "2026-08-10T00:00:00Z", scheduled_publish_date: "2026-08-03T10:00:00Z" }, as: BrandManager, captures: { dl_id: $.data.id } }
            - { call: "POST /deliverables/${dl_id}/submit", payload: {}, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deliverables/${dl_id}/review", payload: { action: "APPROVE" }, as: BrandManager, as_user_id: "bm_1" }
            - { call: "POST /deliverables/${dl_id}/publish", payload: { content_url: "https://yt/c1" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deliverables/${dl_id}/disclosure-checks", payload: {}, as: ComplianceOfficer, captures: { dc_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /disclosure-checks/${dc_id}/review", payload: { action: "PASS", has_ad_hashtag: true, verbal_disclosure: true, platform_tool_used: true }, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "Deliverable.${dl_id}.status == VERIFIED"
            - "Deal.${d_id}.status == COMPLETED (auto bubble-up, no manual call)"

      - name: dispute_hold_and_resume_payout_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.Deal.ACTIVE_to_IN_DISPUTE, state_machines.Payout.PAYABLE_to_HELD, state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_DISMISSED]
        distinguishing_aspect: "Cyclic payout dimension: raising a dispute on an ACTIVE deal flips deal to IN_DISPUTE and the PAYABLE payout to HELD; dismissing the dispute restores deal ACTIVE and payout PAYABLE with payout_due_at preserved."
        test_recipe:
          setup: ["ACTIVE deal (brief dps=2, one deliverable VERIFIED so deal stays ACTIVE); invoice ISSUED and PAID (total 223608 = 212960 fee + 10648 service); payout PAYABLE with due 2026-08-08T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cs4", email: "cs4@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BS4", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 2, usage_rights_days: 45, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "YOUTUBE", due_date: "2026-08-10T00:00:00Z", scheduled_publish_date: "2026-08-03T10:00:00Z" }, as: BrandManager, captures: { dl_id: $.data.id } }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "TIKTOK", due_date: "2026-08-12T00:00:00Z", scheduled_publish_date: "2026-08-05T10:00:00Z" }, as: BrandManager }
            - { call: "POST /deliverables/${dl_id}/submit", payload: {}, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deliverables/${dl_id}/review", payload: { action: "APPROVE" }, as: BrandManager, as_user_id: "bm_1" }
            - { call: "POST /deliverables/${dl_id}/publish", payload: { content_url: "https://yt/c2" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deliverables/${dl_id}/disclosure-checks", payload: {}, as: ComplianceOfficer, captures: { dc_id: "$.data[0].id" } }
            - { call: "POST /disclosure-checks/${dc_id}/review", payload: { action: "PASS", has_ad_hashtag: true, verbal_disclosure: true, platform_tool_used: true }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /deals/${d_id}/invoices", payload: {}, as: FinanceAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/issue", payload: {}, as: FinanceAdmin, as_user_id: "fin_1" }
            - { call: "POST /invoices/${inv_id}/record-payment", payload: { amount_cents: 223608 }, as: FinanceAdmin, as_user_id: "fin_1" }
            - { call: "GET /payouts", payload: { deal_id: "${d_id}" }, as: FinanceAdmin, captures: { po_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /deals/${d_id}/disputes", payload: { reason: "NON_PAYMENT", note: "late" }, as: Brand, as_user_id: "${b_id}", captures: { dp_id: $.data.id } }
            - { call: "GET /payouts/${po_id}", payload: {}, as: FinanceAdmin, captures: { po_held: $.data.status } }
            - { call: "POST /disputes/${dp_id}/review", payload: {}, as: BrandManager }
            - { call: "POST /disputes/${dp_id}/resolve", payload: { action: "DISMISS", resolution_note: "unfounded" }, as: BrandManager }
          assert:
            - "after dispute: Deal.${d_id}.status == IN_DISPUTE and Payout.${po_id}.status == HELD"
            - "after dismiss: Deal.${d_id}.status == ACTIVE and Payout.${po_id}.status == PAYABLE"
            - "Payout.${po_id}.payout_due_at == 2026-08-08T00:00:00Z (preserved across hold/unhold cycle)"

      - name: reshoot_accept_resets_and_limit_enforced
        claim_type: side_effect_execution
        grounds: [state_machines.Reshoot.REQUESTED_to_ACCEPTED, state_machines.Deliverable.VERIFIED_to_PENDING_SUBMISSION, "errors[ERR_RESHOOT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Accepting a reshoot resets a VERIFIED deliverable to PENDING_SUBMISSION, clears its publish fields, and increments reshoot_count; a second reshoot request after re-verification hits MAX_RESHOOTS_PER_DELIVERABLE = 1 with ERR_RESHOOT_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["ACTIVE deal (dps=2 so the deal stays ACTIVE); deliverable D1 VERIFIED; reshoot R1 REQUESTED on D1"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cs5", email: "cs5@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BS5", industry: "CPG" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "OTHER", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 2, usage_rights_days: 45, exclusivity_category: "NONE", exclusivity_days: 0, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "v1", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
