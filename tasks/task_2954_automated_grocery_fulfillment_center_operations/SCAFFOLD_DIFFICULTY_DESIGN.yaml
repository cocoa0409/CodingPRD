# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2954 — Automated Grocery Fulfillment Center Operations
#
# Nine rule_ids from §0.5, two instances each = 18 instances. Every instance
# grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7, and every
# setup_api_calls chain runs from an empty database using declared endpoints.
#
# Shared fixture conventions used by the chains below:
#   * The logical clock is left at its 2026-08-01T00:00:00.000Z boot default
#     unless a chain sets it explicitly, so every lead-time and expiry figure
#     is run-time independent.
#   * Delivery-slot windows are placed at 2026-08-05T10:00:00.000Z, i.e. more
#     than 36 h ahead of the boot clock, so slot_surge_multiplier's lead_add
#     is 0.00 in every chain.
#   * A DeliveryWave is always created AFTER the SlotBooking it will serve, so
#     route_active_wave_count is 0 at booking time and congestion_add is 0.00.
#     Every surge_multiplier_at_booking below is therefore the pre-booking
#     slot surge, deliberately pinned to 1.00 except in the one instance that
#     targets the utilization tier.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: catchweight_line_price_provisional_vs_final
        grounds:
          - calculations.order_line_catchweight_price
          - calculations.order_charge_waterfall
          - entities.OrderLine.fields.provisional_line_price_cents
          - entities.OrderLine.fields.final_line_price_cents
          - entities.InventorySku.fields.price_per_kg_cents
          - state_machines.OrderLine.PENDING_to_PICKED
          - state_machines.CustomerOrder.AUTHORIZED_to_ADJUSTED
        distinguishing_aspect: |
          The same OrderLine is priced twice from the SAME ordered quantity: the provisional
          variant multiplies price_per_kg_cents by the DECLARED nominal_weight_grams * ordered_qty
          (1250 cents), while the final variant multiplies it by the MEASURED actual_weight_grams
          (1300 cents) — a 50-cent divergence on identical order input that is impossible to
          produce with a single-variant formula and that forces billing_status to ADJUSTED.
        test_recipe:
          setup:
            - "One route R1 with base_delivery_fee_cents 599, one AMBIENT grid zone, one station handling all three temperature classes."
            - "One catchweight SKU: price_per_kg_cents 1250, nominal_weight_grams 500, weight_tolerance_pct 0.05, physical_units 100."
            - "One BASIC-tier customer on R1 with a DRAFT order carrying one line of ordered_qty 2 (provisional price 1250)."
            - "The order is booked and CONFIRMED on a slot whose surge is 1.00, so authorized_amount_cents is 1849."
            - "A wave has been formed and started, producing one QUEUED PickTask that is bound to an AMBIENT tote and already RETRIEVING."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT", "CHILLED", "FROZEN"], max_concurrent_totes: 4 }
              as: FulfillmentAdmin
              captures: { station_id: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "CW-BEEF", name: "Beef Joint", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "MEAT", is_catchweight: true, unit_price_cents: 625, price_per_kg_cents: 1250, nominal_weight_grams: 500, weight_tolerance_pct: 0.05, physical_units: 100 }
              as: FulfillmentAdmin
              captures: { sku_cw: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "ann@x.test", full_name: "Ann Basic", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 2.03 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_cw}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_id}", units: 1, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /slot-bookings/${booking_id}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_id}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_id: $.data.id }
            - call: "POST /delivery-waves/${wave_id}/slot-orders"
              payload: { customer_order_id: "${order_id}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_id}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_id}" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_id: "$.data[0].id" }
            - call: "POST /totes"
              payload: { wave_id: "${wave_id}", pick_station_id: "${station_id}", tote_code: "T1", temperature_zone: "AMBIENT" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { tote_id: $.data.id }
            - call: "POST /pick-tasks/${task_id}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_id}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
          trigger:
            - call: "POST /pick-tasks/${task_id}/complete"
              payload: { picked_units: 2, actual_weight_grams: 1040 }
              as: PickOperator
              as_user_id: "picker-1"
          assert:
            - "OrderLine.${line_id}.provisional_line_price_cents == 1250"
            - "OrderLine.${line_id}.final_line_price_cents == 1300"
            - "OrderLine.${line_id}.line_status == PICKED"
            - "OrderLine.${line_id}.picked_units == 2"
            - "OrderLine.${line_id}.picked_weight_grams == 1040"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 1300"
            - "CustomerOrder.${order_id}.delivery_fee_cents == 599"
            - "CustomerOrder.${order_id}.loyalty_discount_cents == 0"
            - "CustomerOrder.${order_id}.order_total_cents == 1899"
            - "CustomerOrder.${order_id}.authorized_amount_cents == 1849"
            - "CustomerOrder.${order_id}.billing_status == ADJUSTED"
            - "CustomerOrder.${order_id}.fulfillment_status == PICKING"
            - "InventorySku.${sku_cw}.physical_units == 98"
            - "InventorySku.${sku_cw}.allocated_units == 0"
            - "InventorySku.${sku_cw}.on_hand_units == 98"

      - name: zone_inventory_accuracy_unit_vs_sku_weighted
        grounds:
          - calculations.zone_inventory_accuracy
          - entities.GridZone.fields.accuracy_score_unit_weighted
          - entities.GridZone.fields.accuracy_score_sku_weighted
          - entities.InventorySku.fields.last_count_variance_units
          - state_machines.GridZone.OPERATIONAL_to_AUDIT_HOLD
        distinguishing_aspect: |
          One audit call produces two accuracy scores from EXACTLY the same two counted SKUs:
          the unit-weighted variant pools variance across units (0.9931) while the SKU-weighted
          variant averages per-SKU ratios (0.8975). The two variants land on OPPOSITE sides of
          ACCURACY_HOLD_THRESHOLD 0.9800, and only the unit-weighted variant drives the
          AUDIT_HOLD gate, so the zone stays OPERATIONAL despite an 0.8975 SKU-weighted score.
        test_recipe:
          setup:
            - "One AMBIENT grid zone holding exactly two SKUs, never audited (both accuracy scores and last_audited_at null, zone OPERATIONAL)."
            - "SKU_BIG physical_units 1000, SKU_SMALL physical_units 10."
            - "Logical clock left at its 2026-08-01T00:00:00.000Z boot default."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "BIG-1", name: "Bulk Rice", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "GRAIN", is_catchweight: false, unit_price_cents: 500, physical_units: 1000 }
              as: FulfillmentAdmin
              captures: { sku_big: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "SML-1", name: "Saffron Jar", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "SPICE", is_catchweight: false, unit_price_cents: 2500, physical_units: 10 }
              as: FulfillmentAdmin
              captures: { sku_small: $.data.id }
          trigger:
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_big}", counted_units: 995 }, { sku_id: "${sku_small}", counted_units: 8 }] }
              as: GridEngineer
              as_user_id: "grid-1"
          assert:
            - "GridZone.${zone_amb}.accuracy_score_unit_weighted == 0.9931"
            - "GridZone.${zone_amb}.accuracy_score_sku_weighted == 0.8975"
            - "GridZone.${zone_amb}.status == OPERATIONAL"
            - "GridZone.${zone_amb}.last_audited_at == 2026-08-01T00:00:00.000Z"
            - "InventorySku.${sku_big}.last_count_system_units == 1000"
            - "InventorySku.${sku_big}.last_count_counted_units == 995"
            - "InventorySku.${sku_big}.last_count_variance_units == -5"
            - "InventorySku.${sku_big}.physical_units == 995"
            - "InventorySku.${sku_big}.on_hand_units == 995"
            - "InventorySku.${sku_small}.last_count_variance_units == -2"
            - "InventorySku.${sku_small}.physical_units == 8"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: wave_transport_cost_round_per_stop_then_sum
        grounds:
          - calculations.wave_transport_cost
          - calculations.wave_loading_sequence
          - entities.DeliveryWave.fields.transport_cost_cents
          - entities.CustomerOrder.fields.stop_distance_km
          - state_machines.DeliveryWave.CONSOLIDATED_to_LOADING
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: with per_km_cost_cents 150 and stops 2.03 km and
          2.11 km, both per-stop products land exactly on a half cent (304.5 and 316.5). Rounding
          per stop first and then summing gives 305 + 317 = 622; summing the kilometres first
          (4.14 km) and rounding once gives 621. The scaffold pins round-per-stop-then-sum, so a
          621 result falsifies the implementation.
        test_recipe:
          setup:
            - "Route R1 with per_km_cost_cents 150 and base_delivery_fee_cents 599; one AMBIENT zone, one all-zone station, one dock bay with parallel_van_capacity 2."
            - "One non-catchweight AMBIENT SKU at unit_price_cents 700 with physical_units 100."
            - "One BASIC customer on R1 with TWO orders: order A at stop_distance_km 2.03 and order B at 2.11, each with one line of ordered_qty 2 (subtotal 1400 each)."
            - "Both orders are CONFIRMED on the same slot (surge 1.00) and slotted into one wave that already holds a dock reservation."
            - "Both PickTasks are complete (full picks), the single AMBIENT tote is SEALED, and the wave has been CONSOLIDATED."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              captures: { route_id: $.data.id }
            - call: "POST /dock-bays"
              payload: { bay_code: "B1", parallel_van_capacity: 2 }
              as: FulfillmentAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT", "CHILLED", "FROZEN"], max_concurrent_totes: 4 }
              as: FulfillmentAdmin
              captures: { station_id: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              captures: { sku_amb: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "ann@x.test", full_name: "Ann Basic", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 2.03 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /customer-orders/${order_a}/lines"
              payload: { sku_id: "${sku_amb}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "GET /customer-orders/${order_a}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_a}", units: 1, expected_order_version: "${order_a_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /slot-bookings/${booking_a}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 2.11 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /customer-orders/${order_b}/lines"
              payload: { sku_id: "${sku_amb}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "GET /customer-orders/${order_b}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b_v: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_b}", units: 1, expected_order_version: "${order_b_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_b: $.data.id }
            - call: "POST /slot-bookings/${booking_b}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_id}", wave_code: "W1", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_id: $.data.id }
            - call: "POST /delivery-waves/${wave_id}/slot-orders"
              payload: { customer_order_id: "${order_a}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_id}/slot-orders"
              payload: { customer_order_id: "${order_b}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_id}/assign-dock"
              payload: { dock_bay_id: "${bay_id}", load_start: "2026-08-05T08:00:00.000Z", load_end: "2026-08-05T09:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_id}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_a}" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_a: "$.data[0].id" }
            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_b}" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_b: "$.data[0].id" }
            - call: "POST /totes"
              payload: { wave_id: "${wave_id}", pick_station_id: "${station_id}", tote_code: "T1", temperature_zone: "AMBIENT" }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { tote_id: $.data.id }
            - call: "POST /pick-tasks/${task_a}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_a}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_a}/complete"
              payload: { picked_units: 2 }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_b}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_b}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_b}/complete"
              payload: { picked_units: 2 }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /totes/${tote_id}/seal"
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /delivery-waves/${wave_id}/consolidate"
              as: WavePlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /delivery-waves/${wave_id}/loading-sequence"
              as: WavePlanner
              as_user_id: "planner-1"
          assert:
            - "DeliveryWave.${wave_id}.transport_cost_cents == 622"
            - "DeliveryWave.${wave_id}.status == LOADING"
            - "DeliveryWave.${wave_id}.load_sequence == [${tote_id}]"
            - "Tote.${tote_id}.status == LOADED"
            - "CustomerOrder.${order_a}.fulfillment_status == LOADED"
            - "CustomerOrder.${order_b}.fulfillment_status == LOADED"
            - "CustomerOrder.${order_a}.order_total_cents == 1999"
            - "CustomerOrder.${order_b}.order_total_cents == 1999"

      - name: order_charge_evaluation_order_fee_then_tiered_discount
        grounds:
          - calculations.order_charge_waterfall
          - entities.CustomerAccount.fields.loyalty_tier
          - entities.CustomerOrder.fields.loyalty_discount_cents
          - entities.CustomerOrder.fields.order_total_cents
          - entities.SlotBooking.fields.surge_multiplier_at_booking
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the delivery fee
          is waived on merchandise_subtotal_cents alone (9800 < 10000, so the 599 fee stands),
          but the loyalty tier is keyed on subtotal + fee (10399 >= 5000). A PREMIER discount
          computed on the post-fee figure is 1040 and the total is 9359; computing it on the
          subtotal alone gives 980 and 9419. Only the pinned STEP 2 -> STEP 3 order reproduces 9359.
        test_recipe:
          setup:
            - "Route R1 with base_delivery_fee_cents 599; one AMBIENT zone; one non-catchweight SKU at unit_price_cents 4900 with physical_units 50."
            - "One PREMIER-tier customer on R1."
            - "A DRAFT order with one line of ordered_qty 2, giving merchandise_subtotal_cents 9800 and null fee / discount / total (no booking yet)."
            - "A slot on R1 opening 2026-08-05T10:00:00.000Z with total_capacity_units 10 and withheld_units 0, so its surge is 1.00."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-9", name: "Premium Hamper", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "GIFT", is_catchweight: false, unit_price_cents: 4900, physical_units: 50 }
              as: FulfillmentAdmin
              captures: { sku_amb: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "pat@x.test", full_name: "Pat Premier", loyalty_tier: "PREMIER", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 3.00 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /customer-orders/${order_id}/lines"
              payload: { sku_id: "${sku_amb}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "GET /customer-orders/${order_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_id}", units: 1, expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "SlotBooking.${booking_id}.status == HELD"
            - "SlotBooking.${booking_id}.surge_multiplier_at_booking == 1.00"
            - "SlotBooking.${booking_id}.quoted_fee_cents == 599"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 9800"
