        distinguishing_aspect: "Fulfill with the lot's last care log 13h old fails ERR_CARE_LOG_STALE; posting a fresh log (same clock) immediately unblocks the identical fulfill."
        test_recipe:
          setup:
            - "Spring store; lot ON_SALE; order BROODER_VERIFIED at 2026-03-10T10:00:00Z with a care log from the same instant; clock advanced to 2026-03-10T23:00:00Z (13h later, within 72h verification freshness)."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
            - *k_spring_account
            - *k_spring_order6
            - *k_verify_brooder_ok
            - *k_fresh_carelog
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T23:00:00Z" }
              as: RegionalAdmin
          trigger:
            - call: "POST /chick-orders/${k_order_id}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { stale_err: $.data.error_id }
            - call: "POST /livestock-lots/${k_lot_id}/care-logs"
              payload: { entry_type: "WATER" }
              as: StoreAssociate
            - call: "POST /chick-orders/${k_order_id}/fulfill"
              payload: {}
