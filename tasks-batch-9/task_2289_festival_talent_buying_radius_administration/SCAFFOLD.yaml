      - "status = REPORTED; reported_by_user_id = X-User-Id"
      - "Artist.reported_conflict_count += 1 and strict_risk_score re-derived when conflict_assessment == CONFLICT; adjudicated_risk_score is untouched"

  - method: GET
    path: /festival-ops/competing-performances/{id}
    description: "Read one competing-performance report and its adjudication outcome."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs]
