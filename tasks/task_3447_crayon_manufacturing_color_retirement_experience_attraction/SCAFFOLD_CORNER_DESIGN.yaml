            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
            - *k_run
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1000 }] }
              as: PlatformAdmin
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 10, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "ValueShop", priority_tier: GOLD, requested_boxes: 5, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION"
            - "RetailAllocation.${a1_id} exists REQUESTED; only one allocation was created"
            - "GET /crayon-works/assortment-specs/${spec_id} shows version == ${spec_v} + 1 (bumped exactly once by the successful create)"

      - name: stale_formula_version_on_line_transition_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[licensed-line-decision-stale-formula]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The licensed-line OCC gate fires on a stale formula view even for an otherwise legal transition: after L1's BRAND_APPROVE bumps the formula to version 4, L2's SUBMIT replaying version 3 is rejected 412."
