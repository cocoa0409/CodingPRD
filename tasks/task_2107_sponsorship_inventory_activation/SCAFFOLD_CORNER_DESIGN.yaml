# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because stubs and carry no test_recipe.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: property_create_applies_system_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.Property.fields.status
          - entities.Property.fields.committed_gross_value_cents
          - entities.Property.fields.sellout_pct
          - endpoints[POST /properties]
        distinguishing_aspect: "A freshly created Property is PLANNING with committed_gross_value_cents 0, delivered_media_value_cents 0, sellout_pct 0.00 and version 1, and its id is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its documented default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id, p_status: $.data.status, p_committed: $.data.committed_gross_value_cents, p_sellout: $.data.sellout_pct, p_version: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${p_status} == PLANNING"
            - "${p_committed} == 0"
            - "${p_sellout} == 0.00"
            - "${p_version} == 1"
            - "${prop_id} matches the bare UUID form 8-4-4-4-12 with no prefix"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: property_create_missing_required_field_returns_422
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION_FAILED]
          - endpoints[POST /properties]
        distinguishing_aspect: "Omitting season_end, a required input with no default, is rejected with ERR_VALIDATION_FAILED and no Property row is created."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", inventory_target_value_cents: 50000000 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION_FAILED"
            - "HTTP status is 422"
            - "response_type == error and data.message is a non-empty string"

      - name: inventory_asset_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.InventoryAsset.fields.changeover_buffer_minutes
          - entities.InventoryAsset.fields.requires_staffing
          - entities.InventoryAsset.fields.min_staff_count
          - entities.InventoryAsset.fields.status
        distinguishing_aspect: "Creating an asset with only name, asset_class and capacity_units yields changeover_buffer_minutes 0, requires_staffing false, min_staff_count 0, status AVAILABLE and reserved_units_total 0."
        test_recipe:
          setup:
            - "One Property in status PLANNING"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "South Fascia Board", asset_class: "SIGNAGE", capacity_units: 3 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { a_buffer: $.data.changeover_buffer_minutes, a_staffing: $.data.requires_staffing, a_min: $.data.min_staff_count, a_status: $.data.status, a_reserved: $.data.reserved_units_total }
          assert:
            - "${a_buffer} == 0"
            - "${a_staffing} == false"
            - "${a_min} == 0"
            - "${a_status} == AVAILABLE"
            - "${a_reserved} == 0"

      - name: rate_card_line_invalid_enum_returns_422
        claim_type: type_constraints
        grounds:
          - entities.RateCardLine.fields.asset_class
          - validations[priority=5]
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: "asset_class BILLBOARD is outside the declared enum, so the line is rejected with ERR_VALIDATION_FAILED and rate_card.line_count stays 0."
        test_recipe:
          setup:
            - "One Property with one DRAFT rate card carrying zero lines"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rate-cards/${rc_id}/lines"
              payload: { asset_class: "BILLBOARD", base_unit_price_cents: 100000 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { err: $.data.error_id }
            - call: "GET /rate-cards/${rc_id}"
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { lc: $.data.line_count }
          assert:
            - "${err} == ERR_VALIDATION_FAILED"
            - "HTTP status of the first trigger call is 422"
            - "${lc} == 0"

      - name: contract_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - endpoints[GET /contracts/{id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /contracts/{id} returns ERR_CONTRACT_NOT_FOUND with HTTP 404, never an empty 200."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "GET /contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTRACT_NOT_FOUND"
            - "HTTP status is 404"

      - name: contracts_list_paginates_and_filters_by_property
        claim_type: listing
        grounds:
          - endpoints[GET /contracts]
          - entities.Contract.fields.property_id
        distinguishing_aspect: "With three DRAFT contracts on one property, GET /contracts with property_id and limit 2 returns 2 rows, total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One Property SELLING with a PUBLISHED DIGITAL_BOARD line and one asset"
            - "Three DRAFT contracts for three different sponsors on that property"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { s1: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Nimbus Motors", category: "AUTOMOTIVE", contact_email: "ops@nimbus.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { s2: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Vega Telecom", category: "TELECOM", contact_email: "ops@vega.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { s3: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${s1}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "POST /contracts"
              payload: { sponsor_id: "${s2}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "POST /contracts"
              payload: { sponsor_id: "${s3}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
          trigger:
            - call: "GET /contracts"
              payload: { property_id: "${prop_id}", limit: 2, offset: 0 }
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /contracts"
              payload: { property_id: "${prop_id}", limit: 2, offset: 2 }
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { third_id: "$.data[0].id" }
          assert:
            - "first page returns 2 Contract rows with meta pagination total_count == 3 and has_more == true"
            - "second page returns 1 Contract row with total_count == 3 and has_more == false"
            - "${first_id} != ${third_id}"
            - "response_type == array on both reads"

      - name: sponsor_survey_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.SponsorSurvey.fields.composite_score
          - entities.SponsorSurvey.fields.submitted_by_user_id
          - endpoints[POST /contracts/{id}/surveys]
          - endpoints[GET /contracts/{id}/surveys]
        distinguishing_aspect: "SponsorSurvey is declared common_fields false, so the created row exposes id and created_at but no version and no updated_at, and there is no endpoint that mutates it."
        test_recipe:
          setup:
            - "Property IN_SEASON and a contract ACTIVE for sponsor 'Zephyr Cola' with one entitlement of 10 DIGITAL_BOARD units"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/lines"
              payload: { asset_class: "DIGITAL_BOARD", base_unit_price_cents: 250000, tier_breaks: [{ min_units: 10, unit_price_cents: 225000 }], exclusivity_multiplier: 1.25 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /rate-cards/${rc_id}/publish"
              payload: {}
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "SELLING" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "North LED Ribbon", asset_class: "DIGITAL_BOARD", capacity_units: 6, changeover_buffer_minutes: 30 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { asset_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { sponsor_id: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${sponsor_id}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", exclusivity_scope: "CATEGORY" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/entitlements"
              payload: { inventory_asset_id: "${asset_id}", clause_ref: "4.2(a)", promised_units: 10 }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "POST /contracts/${contract_id}/submit"
              payload: {}
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "GET /properties/${prop_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { prop_v: $.data.version }
            - call: "POST /contracts/${contract_id}/countersign"
              payload: { expected_property_version: "${prop_v}" }
              as: ContractApprover
              as_user_id: "u-approver-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "IN_SEASON" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractApprover
              as_user_id: "u-approver-01"
          trigger:
            - call: "POST /contracts/${contract_id}/surveys"
              payload: { satisfaction_score: 6, activation_quality_score: 6, reporting_quality_score: 6, renewal_intent: "MAYBE" }
              as: SponsorContact
              as_user_id: "${sponsor_id}"
              captures: { survey_id: $.data.id, composite: $.data.composite_score, submitter: $.data.submitted_by_user_id }
            - call: "GET /contracts/${contract_id}/surveys"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "HTTP status of the create is 201"
            - "${composite} == 60.00"
            - "${submitter} == ${sponsor_id}"
            - "${listed_id} == ${survey_id}"
            - "the survey payload exposes id and created_at but no version and no updated_at field"

      - name: entitlement_copies_asset_class_and_starts_pending
        claim_type: computed_fields
        grounds:
          - entities.Entitlement.fields.asset_class
          - entities.Entitlement.fields.status
          - entities.Entitlement.fields.unit_value_cents
          - endpoints[POST /contracts/{id}/entitlements]
        distinguishing_aspect: "Entitlement.asset_class is computed from the linked InventoryAsset (SIGNAGE here, not the contract's other asset class), status starts PENDING and unit_value_cents stays 0 until countersign."
        test_recipe:
          setup:
            - "Property SELLING with a PUBLISHED card and two assets, one DIGITAL_BOARD and one SIGNAGE"
            - "One DRAFT contract"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "South Fascia Board", asset_class: "SIGNAGE", capacity_units: 3 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { asset_sig_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { sponsor_id: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${sponsor_id}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/entitlements"
              payload: { inventory_asset_id: "${asset_sig_id}", clause_ref: "7.4", promised_units: 3 }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { e_class: $.data.asset_class, e_status: $.data.status, e_unit: $.data.unit_value_cents, e_delivered: $.data.delivered_units }
          assert:
            - "HTTP status is 201"
            - "${e_class} == SIGNAGE"
            - "${e_status} == PENDING"
            - "${e_unit} == 0"
            - "${e_delivered} == 0"

      - name: superseded_rate_card_is_reachable_by_self_reference_filter
        claim_type: parent_relationships
        grounds:
          - entities.RateCard.fields.superseded_by_rate_card_id
          - endpoints[GET /rate-cards]
          - state_machines.RateCard.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: "After a second card is published, the first card is SUPERSEDED with superseded_by_rate_card_id pointing at the second, and GET /rate-cards filtered by superseded_by_rate_card_id returns exactly the first card."
        test_recipe:
          setup:
            - "One Property with card A PUBLISHED (one DIGITAL_BOARD line) and card B DRAFT (one DIGITAL_BOARD line)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card A", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_a: $.data.id }
            - call: "POST /rate-cards/${rc_a}/lines"
              payload: { asset_class: "DIGITAL_BOARD", base_unit_price_cents: 250000 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /rate-cards/${rc_a}/publish"
              payload: {}
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card B", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_b: $.data.id }
            - call: "POST /rate-cards/${rc_b}/lines"
              payload: { asset_class: "DIGITAL_BOARD", base_unit_price_cents: 260000 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "POST /rate-cards/${rc_b}/publish"
              payload: {}
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { b_status: $.data.status }
            - call: "GET /rate-cards/${rc_a}"
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { a_status: $.data.status, a_ptr: $.data.superseded_by_rate_card_id }
            - call: "GET /rate-cards"
              payload: { superseded_by_rate_card_id: "${rc_b}" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { found_id: "$.data[0].id" }
          assert:
            - "${b_status} == PUBLISHED"
            - "${a_status} == SUPERSEDED"
            - "${a_ptr} == ${rc_b}"
            - "${found_id} == ${rc_a}"
            - "the filtered list returns exactly 1 RateCard row"

  - section: state_machines
    instances:
      - name: property_transition_skipping_selling_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Property.any_to_any
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PLANNING -> IN_SEASON is not a declared transition, so it fails with ERR_INVALID_STATE (priority 7) before the missing-published-card guard at priority 8 can be reached, and property.status stays PLANNING."
        test_recipe:
          setup:
            - "One Property in status PLANNING with no rate card at all"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "IN_SEASON" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { err_skip: $.data.error_id }
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "SELLING" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { err_card: $.data.error_id }
            - call: "GET /properties/${prop_id}"
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { st: $.data.status, v1: $.data.version }
          assert:
            - "${err_skip} == ERR_INVALID_STATE"
            - "${err_card} == ERR_NO_PUBLISHED_RATE_CARD"
            - "${st} == PLANNING"
            - "${v1} == ${v0}"

      - name: rate_card_publish_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.RateCard.PUBLISHED_to_PUBLISHED
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /rate-cards/{id}/publish]
        distinguishing_aspect: "The second publish of an already PUBLISHED card is rejected with ERR_INVALID_STATE, published_at keeps its first value and no supersession is recorded against the card itself."
        test_recipe:
          setup:
            - "One Property with a rate card that carries one DIGITAL_BOARD line and has already been published"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
