              captures: { h2: $.data.id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${c3}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:15:00Z", expected_case_version: "${c3_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "Hearing.${h1} occupies 10:00-10:30 and Hearing.${h2} at 10:30 was ACCEPTED (201) — half-open intervals treat exact adjacency as conflict-free"
            - "Hearing.${h2}.scheduled_end == \"2026-09-03T11:00:00Z\""
            - "the 10:15 hearing is rejected with 409 and error_id == ERR_JUDGE_SCHEDULE_CONFLICT ([10:15,10:45) overlaps [10:00,10:30))"
            - "Case.${c3} has no hearings: GET /eoir/hearings?case_id=${c3} returns 0 rows"

      - name: interpreter_buffer_blocks_gap_under_fifteen_minutes
        grounds:
          - calculations.interpreter_assignment_selector
          - errors.ERR_NO_INTERPRETER_AVAILABLE
        distinguishing_aspect: |
          Resource Interpreter with BUFFERED interval semantics (different
          resource and different geometry than the judge's half-open rule): a
          hearing starting exactly 15 minutes after the interpreter's previous
          hearing ends is accepted, but one starting 30 minutes after — which
          still falls inside the next hearing's trailing buffer — leaves the
          pool empty and is rejected with ERR_NO_INTERPRETER_AVAILABLE.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court, one judge (cap 5), ONE interpreter covering only 'spa' with daily cap 4. Three Spanish-speaking PRO_SE non-detained cases docketed to the judge."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-BUF", name: "Buffer Court", city: "Yuma", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Buffer", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/interpreters"
              payload: { court_id: "${court_id}", full_name: "Interp Solo", language_codes: ["spa"], daily_hearing_cap: 4 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { interp_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-1", respondent_full_name: "R Uno", custody_status: "NON_DETAINED", primary_language_code: "spa", representation_status: "PRO_SE", interpreter_required: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s1: $.data.id }
            - call: "POST /eoir/cases/${s1}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s1_v2: $.data.version }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-2", respondent_full_name: "R Dos", custody_status: "NON_DETAINED", primary_language_code: "spa", representation_status: "PRO_SE", interpreter_required: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s2: $.data.id }
            - call: "POST /eoir/cases/${s2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s2_v2: $.data.version }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-3", respondent_full_name: "R Tres", custody_status: "NON_DETAINED", primary_language_code: "spa", representation_status: "PRO_SE", interpreter_required: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s3: $.data.id }
            - call: "POST /eoir/cases/${s3}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s3_v2: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${s1}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${s1_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h1: $.data.id, h1_interp: $.data.interpreter_id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${s2}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:45:00Z", expected_case_version: "${s2_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h2: $.data.id, h2_interp: $.data.interpreter_id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${s3}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T11:15:00Z", expected_case_version: "${s3_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "Hearing.${h1}.interpreter_id == ${interp_id} (10:00-10:30)"
            - "Hearing.${h2}.interpreter_id == ${interp_id} — the 10:45 start leaves EXACTLY a 15-minute gap after the 10:30 end, which passes the strict-inequality buffer rule"
            - "the 11:15 hearing is rejected with 422 and error_id == ERR_NO_INTERPRETER_AVAILABLE: the buffered window [11:00, 12:00) collides with the interpreter's 10:45-11:15 hearing (11:00 < 11:15), emptying the single-member pool"
            - "Case.${s3} has no hearings: GET /eoir/hearings?case_id=${s3} returns 0 rows"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reassignment_conserves_global_pending_case_count
        grounds:
          - calculations.reassignment_target_selector
          - calculations.backlog_critical_flag
          - concurrency_rules[reassignment-stale-case]
        distinguishing_aspect: |
          Conserved quantity = global pending-case count: SUM over all courts of
          pending_case_count before the reassignment (1 + 0 = 1) must equal the
          sum after it (0 + 1 = 1) — the transfer out of the critical court is
          exactly compensated by the arrival at the destination, with no case
          created or destroyed.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Court A (goal 4, so ceil(0.25*4)=1 pending case makes it backlog-critical) holds one FILED non-detained case; court B (goal 100) is empty and eligible."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-SRC", name: "Source Court", city: "Laredo", annual_completion_goal: 4, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_a: $.data.id }
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-DST", name: "Dest Court", city: "Duluth", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_a}", case_number: "MV-1", respondent_full_name: "R Move", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "GET /eoir/courts/${court_a}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/courts/${court_b}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/case-reassignments"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v1}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { reassign_id: $.data.id }
          assert:
            - "precondition observed: Court A pending_case_count == 1 and is_backlog_critical == true (1 >= ceil(0.25*4)); Court B pending_case_count == 0"
            - "invariant: Court A pending_case_count + Court B pending_case_count == 1 after the reassignment, exactly as before"
            - "post: Court A pending_case_count == 0 and is_backlog_critical == false; Court B pending_case_count == 1"
            - "CaseReassignment.${reassign_id}.from_court_id == ${court_a} and to_court_id == ${court_b} and reason == BACKLOG_REBALANCE"
            - "Case.${case_id}.court_id == ${court_b}, assigned_judge_id is null, status == FILED"
            - "Case.${case_id}.version advanced (OCC bump), so a replay of the same expected_case_version would now fail with 412"

      - name: continuance_grant_conserves_single_scheduled_hearing
        grounds:
          - state_machines.Hearing.SCHEDULED_to_CONTINUED
          - calculations.continuance_caps_bumps_and_auto_hearing_offsets
        distinguishing_aspect: |
          Conserved quantity = per-case count of SCHEDULED hearings (a different
          conserved quantity than the global pending-case count): the grant marks
          the old hearing CONTINUED and creates exactly one SCHEDULED successor,
          so the case's SCHEDULED count is 1 both before and after the pair of
          compensating writes, while the total hearing count grows by one.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One PRO_SE English non-detained case docketed, with exactly one SCHEDULED master hearing at 2026-09-10T10:00 and a PENDING EVIDENCE_GATHERING continuance targeting it."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-INV", name: "Invariant Court", city: "Boise", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Invariant", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "I-1", respondent_full_name: "R Inv", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-10T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h1: $.data.id }
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h1}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont1: $.data.id }
          trigger:
            - call: "POST /eoir/continuance-requests/${cont1}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "before the grant: GET /eoir/hearings?case_id=${case_id}&status=SCHEDULED returned exactly 1 row (${h1})"
            - "after the grant: the same filtered GET still returns exactly 1 row — the compensating pair (CONTINUED + created) conserves the per-case SCHEDULED count"
            - "Hearing.${h1}.status == CONTINUED"
            - "GET /eoir/hearings?case_id=${case_id} returns exactly 2 rows in total (1 CONTINUED + 1 SCHEDULED): the invariant holds for the live count, not the historical count"
            - "the surviving SCHEDULED hearing has scheduled_start == \"2026-10-08T10:00:00Z\" (2026-09-10 + 28-day non-detained bump) and supersedes_hearing_id == ${h1}"
