  # =======================================================================
  - section: validations
    instances:

      - name: duplicate_policy_code_returns_conflict
        claim_type: Violation to Error
        grounds:
          - validations[priority=30]
          - errors[ERR_DUPLICATE_POLICY_CODE]
        distinguishing_aspect: "Policy.code is globally unique; a second policy claiming BP-4119 returns ERR_DUPLICATE_POLICY_CODE at HTTP 409 and no second row is created."
        test_recipe:
          setup: ["One policy BP-4119 exists."]
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Duplicate Code Attempt", category: "BUSINESS", legal_requirement_level: "RECOMMENDED", manual_section: "3000.19" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_POLICY_CODE"
            - "GET /governance/policies returns total_count == 1"

      - name: duplicate_seat_number_among_seated_trustees_returns_conflict
        claim_type: Violation to Error
        grounds:
          - validations[priority=30]
          - errors[ERR_DUPLICATE_SEAT_NUMBER]
          - entities.BoardMember.fields.seat_number
        distinguishing_aspect: "seat_number is unique only among trustees whose status is SEATED; a second SEATED trustee claiming seat 1 returns ERR_DUPLICATE_SEAT_NUMBER at HTTP 409."
        test_recipe:
          setup: ["One SEATED trustee occupies seat 1."]
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
          trigger:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_SEAT_NUMBER"
            - "BoardMember.${bm1}.seat_number == 1"

      - name: evaluation_weights_not_summing_to_one_returns_weights_not_normalized
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors[ERR_WEIGHTS_NOT_NORMALIZED]
        distinguishing_aspect: "Weights 0.40 / 0.30 / 0.20 / 0.20 sum to 1.10 and are rejected with ERR_WEIGHTS_NOT_NORMALIZED at HTTP 422 -- a business rule at priority 12, distinct from the shape check at priority 10 which only bounds each weight to 0.00..1.00."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /governance/superintendent-evaluations"
              payload: { cycle_year: 2027, window_start_date: "2026-08-01T00:00:00Z", window_end_date: "2027-06-30T00:00:00Z", midyear_checkpoint_date: "2027-01-15T00:00:00Z", goal_count: 4, weight_instructional: 0.40, weight_fiscal: 0.30, weight_community: 0.20, weight_governance: 0.20 }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_WEIGHTS_NOT_NORMALIZED"

      - name: notice_one_second_short_of_the_lead_time_is_rejected
        claim_type: Priority Ordering
        grounds:
          - validations[priority=50]
          - errors[ERR_NOTICE_PERIOD_TOO_SHORT]
        distinguishing_aspect: "The exclusive side of the 72-hour boundary: with the clock at 2026-08-01T00:00:01Z the lead is 71:59:59 and the notice is rejected with ERR_NOTICE_PERIOD_TOO_SHORT at HTTP 422, leaving status DRAFT and notice_posted_at null."
        test_recipe:
          setup:
            - "Meeting M is REGULAR, FULL_BOARD, scheduled 2026-08-04T00:00:00Z and still DRAFT."
            - "The clock has been advanced by one second to 2026-08-01T00:00:01Z."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "Boundary Notice Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-08-04T00:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_NOTICE_PERIOD_TOO_SHORT"
            - "Meeting.${m}.status == DRAFT"
            - "Meeting.${m}.notice_posted_at == null"
            - "Meeting.${m}.agenda_locked_at == null"

      - name: opening_a_meeting_before_its_scheduled_start_returns_not_yet_due
        claim_type: Temporal validation
        grounds:
          - validations[priority=61]
          - errors[ERR_MEETING_NOT_YET_DUE]
        distinguishing_aspect: "The open endpoint refuses to call a meeting to order while the logical clock is still before scheduled_start_utc, returning ERR_MEETING_NOT_YET_DUE at HTTP 422 with status still NOTICED and opened_at null."
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Meeting M (REGULAR, 2026-09-10T18:00:00Z) is NOTICED and the clock still rests at 2026-08-01T00:00:00Z."
