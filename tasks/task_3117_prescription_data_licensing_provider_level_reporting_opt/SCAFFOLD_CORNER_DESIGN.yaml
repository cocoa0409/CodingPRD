              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: { include_prescriber_ids: ["${p1_id}"] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /report-deliveries/${d_id}/compile"
