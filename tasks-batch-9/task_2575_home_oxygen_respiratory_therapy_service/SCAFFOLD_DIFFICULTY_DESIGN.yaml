              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_port: $.data.id }
          trigger:
            - call: "DELETE /home-oxygen/placements/${pl_port}"
              payload: {}
              as: RespiratoryTherapist
            - call: "DELETE /home-oxygen/placements/${pl_stat}"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_stat2: $.data.id }
          assert:
            - "Before the trigger: EquipmentUnit.${u_stat}.status == RESERVED AND EquipmentUnit.${u_port}.status == RESERVED AND GET /home-oxygen/equipment-units?branch_id=${br_id}&status=IN_STOCK reports total_count 0"
            - "After both DELETE calls: EquipmentUnit.${u_stat}.status == IN_STOCK AND EquipmentUnit.${u_port}.status == IN_STOCK AND GET /home-oxygen/equipment-units?branch_id=${br_id}&status=IN_STOCK reports total_count 2 — the exact pre-assignment pool"
            - "Placement.${pl_port}.status == REMOVED AND removal_reason == RELEASED AND removed_at == 2026-08-01T00:00:00Z; the same holds for Placement.${pl_stat}"
            - "RentalContract.${c_id}.monthly_allowable_cents is 0 before and after the releases (nothing was ever PLACED), and first_service_month is null throughout"
            - "The re-assignment creates a NEW placement ${pl_stat2} whose id differs from ${pl_stat}, and it selects EquipmentUnit.${u_stat} again — equipment_selection is deterministic over the restored pool"
            - "GET /home-oxygen/placements?contract_id=${c_id} reports total_count 3: two REMOVED rows and one RESERVED row; the released placements are retained as history rather than deleted"
            - "EquipmentUnit.${u_port}.status stays IN_STOCK after the re-assignment, because PRIMARY_STATIONARY cannot select a PORTABLE_CONCENTRATOR"

      - name: post_then_reverse_billing_month_restores_lifetime_paid_cents
        grounds:
          - state_machines.RentalContract[state_field=billing_status].ACCRUING_to_ACCRUING
          - endpoints[POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse]
          - entities.RentalContract.fields.lifetime_paid_cents
          - entities.RentalContract.fields.posted_months
          - entities.RentalContract.fields.last_posted_service_month
          - calculations.monthly_allowable_cents
          - calculations.cap_month_position
        distinguishing_aspect: |
          The conserved quantity is the money ledger — lifetime_paid_cents together with
          posted_months, posted_month_count and last_posted_service_month — a different conserved
          quantity from the equipment pool above: reversing the only posted month must return
          lifetime_paid_cents to exactly 0 and last_posted_service_month to null, with no residual
          drift of a single cent.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) with two IN_STOCK units: SC-1001 (STATIONARY_CONCENTRATOR, 5.0 LPM) and PC-2001 (PORTABLE_CONCENTRATOR, 3.0 LPM)."
            - "One ACTIVE patient (ACTIVE_AMBULATORY) with an ACTIVE certificate prescribing 3.0 LPM, 24 h/day, portable indicated, lifetime need."
            - "One RentalContract (COMPETITIVE_BID_SINGLE_PAYMENT, cap_month_limit 36) in (billing ACCRUING, service IN_SERVICE) after a passing setup on 2026-08-01: monthly_allowable_cents 6913, first_service_month 2026-08, lifetime_paid_cents 0, posted_months empty."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_port: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0170", full_name: "Tomas Iversen", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_stat: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_port: $.data.id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r_id: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r_id}", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 2 }
              as: BranchManager
              captures: { s_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r_id}/lock"
