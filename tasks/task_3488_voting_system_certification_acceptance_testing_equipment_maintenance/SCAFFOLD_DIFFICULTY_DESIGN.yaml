            - "U500 deploy fails: 422 ERR_BATTERY_CYCLE_LIMIT (500 is NOT < 500)"
            - "U500.operational_status remains IN_STORAGE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: procurement_acceptance_blocked_when_certificate_suspended
        grounds:
          - state_machines.Procurement.DELIVERED_to_ACCEPTANCE_TESTING
          - entities.Certificate.fields.status
        distinguishing_aspect: "Entity pair Procurement->Certificate: the DELIVERED->ACCEPTANCE_TESTING transition reads the pinned Certificate's CURRENT status — SUSPENDED blocks with ERR_CERTIFICATE_NOT_ACTIVE even though the certificate was ACTIVE at placement, and reinstate unblocks it."
        test_recipe:
          setup:
            - "Procurement DELIVERED; its pinned certificate then suspended by the CertificationAuthority."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_proc
            - *d_deliver
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "SUSPENDED", reason: "state review" }
              as: CertificationAuthority
          trigger:
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTANCE_TESTING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: CertificationAuthority
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTANCE_TESTING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "first begin-acceptance: 422 ERR_CERTIFICATE_NOT_ACTIVE while the certificate is SUSPENDED"
            - "after reinstate: the identical transition succeeds and Procurement.${proc_id}.status == ACCEPTANCE_TESTING"
            - "Procurement.certificate_version_pinned remains 1 — the pin records placement-time version, it does not freeze the status check"

      - name: definition_lock_blocked_until_procurement_accepted
        grounds:
          - state_machines.ElectionDefinition.LA_PASSED_to_LOCKED
          - entities.Procurement.fields.status
        distinguishing_aspect: "Entity pair ElectionDefinition->Procurement (different pair from Procurement->Certificate): an LA_PASSED definition whose procurement is still ACCEPTANCE_TESTING cannot lock (ERR_PROCUREMENT_NOT_ACCEPTED); completing acceptance on the sibling entity unlocks the transition."
        test_recipe:
          setup:
            - "Procurement in ACCEPTANCE_TESTING with passing HARDWARE and CALIBRATION tests; election definition programmed and LA-certified (LA_PASSED)."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_off2
            - *d_proc
            - *d_deliver
            - *d_beginacc
            - *d_ed
            - *d_layout
            - *d_program
            - *d_la
            - *d_la_cert
            - *d_lapass
            - *d_hwtest
            - *d_caltest
          trigger:
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LOCKED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
            - *d_accept
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LOCKED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "first lock: 422 ERR_PROCUREMENT_NOT_ACCEPTED while procurement.status == ACCEPTANCE_TESTING"
            - "after procurement ACCEPTED: the identical lock succeeds and ElectionDefinition.${ed_id}.status == LOCKED"
            - "the L&A certification alone is insufficient — the sibling procurement's terminal state is a separate gate"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: work_order_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_WORK_ORDER_OVERLAP]
          - entities.MaintenanceWorkOrder.fields.scheduled_start
        distinguishing_aspect: "Half-open interval semantics on EquipmentUnit maintenance windows: [09-11, 09-13) collides with the existing [09-10, 09-12) order, but [09-12, 09-14) is pure adjacency (start == other's end) and MUST be accepted."
        test_recipe:
          setup:
            - "Unit with one SCHEDULED work order covering [2026-09-10, 2026-09-12)."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_jur
            - *d_off1
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-W1", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { uw_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${uw_id}", work_type: "PREVENTIVE", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${uw_id}", work_type: "REPAIR", scheduled_start: "2026-09-11T00:00:00Z", scheduled_end: "2026-09-13T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${uw_id}", work_type: "REPAIR", scheduled_start: "2026-09-12T00:00:00Z", scheduled_end: "2026-09-14T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { wo_ok: $.data.id }
          assert:
            - "overlapping [09-11, 09-13): 409 ERR_WORK_ORDER_OVERLAP"
            - "adjacent [09-12, 09-14): 201 created — half-open intervals treat end == start as non-overlapping"
            - "the overlap check only considers SCHEDULED/IN_PROGRESS orders of the SAME unit"

      - name: lab_capacity_aggregate_count_blocks_third_campaign
        grounds:
          - validations[priority=14]
          - errors[ERR_LAB_CAPACITY_EXCEEDED]
          - state_machines.CertificationCampaign.SUBMITTED_to_IN_TEST
        distinguishing_aspect: "Aggregate-capacity interval semantics on TestLaboratory (different resource and different geometry from pairwise half-open overlap): with max_concurrent_campaigns=2 and two campaigns IN_TEST, a third begin-testing is rejected — the rule counts occupants, it does not intersect intervals."
        test_recipe:
          setup:
            - "Laboratory with max_concurrent_campaigns 2; three systems each with a SUBMITTED campaign at that lab."
          setup_api_calls:
            - *d_clock0901
            - call: "POST /evote/test-laboratories"
              payload: { lab_code: "LAB-CAP", lab_name: "Capacity Lab", accreditation_scope: "DUAL", max_concurrent_campaigns: 2 }
              as: PlatformAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /evote/voting-systems"
              payload: { vendor_name: "VendorOne", model_name: "M1", software_baseline_version: "1.0.0", hardware_class: "OPTICAL_SCANNER" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /evote/voting-systems"
              payload: { vendor_name: "VendorTwo", model_name: "M2", software_baseline_version: "1.0.0", hardware_class: "BALLOT_MARKING_DEVICE" }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /evote/voting-systems"
              payload: { vendor_name: "VendorThree", model_name: "M3", software_baseline_version: "1.0.0", hardware_class: "CENTRAL_TABULATOR" }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${s1}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_1_1" }
              as: VendorRep
              captures: { c1: $.data.id }
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${s2}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_1_1" }
              as: VendorRep
              captures: { c2: $.data.id }
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${s3}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0" }
              as: VendorRep
              captures: { c3: $.data.id }
            - call: "POST /evote/certification-campaigns/${c1}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${c2}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /evote/certification-campaigns/${c3}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
            - call: "POST /evote/certification-campaigns/${c1}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: CertificationAuthority
            - call: "POST /evote/certification-campaigns/${c3}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
          assert:
            - "third begin-testing while two campaigns are IN_TEST: 409 ERR_LAB_CAPACITY_EXCEEDED"
            - "after campaign C1 certifies (leaving IN_TEST), the identical begin-testing for C3 succeeds"
            - "capacity counts rows in state IN_TEST regardless of their calendar windows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_place_then_cancel_restores_ledger
        grounds:
          - calculations.jurisdiction_budget_ledger
          - entities.Jurisdiction.fields.available_cents
          - state_machines.Procurement.PLACED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity is money: place-then-cancel must restore (available_cents, encumbered_cents) exactly with zero drift, and budget_total_cents == available + encumbered + spent holds at every intermediate read."
        test_recipe:
          setup:
            - "Jurisdiction budget_total_cents 100000000; certified system; no procurements yet."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
          trigger:
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 10, unit_price_cents: 2500000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { proc_id: $.data.id }
            - call: "GET /evote/jurisdictions/${jur_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { av_mid: $.data.available_cents, enc_mid: $.data.encumbered_cents, sp_mid: $.data.spent_cents }
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "CANCELLED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "GET /evote/jurisdictions/${jur_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { av_end: $.data.available_cents, enc_end: $.data.encumbered_cents, sp_end: $.data.spent_cents }
          assert:
            - "after place: available_cents == 75000000 and encumbered_cents == 25000000 and spent_cents == 0"
            - "after cancel: available_cents == 100000000 and encumbered_cents == 0 and spent_cents == 0 (exact restoration)"
            - "invariant at both reads: 100000000 == available_cents + encumbered_cents + spent_cents"
            - "Procurement.${proc_id}.status == CANCELLED"

      - name: custody_round_trip_restores_single_custodian
        grounds:
          - calculations.custody_conservation
          - entities.EquipmentUnit.fields.current_custodian_id
          - endpoints.POST_/evote/equipment-units/{id}/custody-transfers
        distinguishing_aspect: "Conserved quantity is custodial identity (not money): a forward transfer off1->off2 and its compensating transfer off2->off1 restore current_custodian_id == off1, custody_status stays SECURED throughout, and the jurisdiction's unit count is unchanged."
        test_recipe:
          setup:
            - "Unit with custodian off1; off2 ACTIVE in the same jurisdiction."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_jur
            - *d_off1
            - *d_off2
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-C1", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { uc_id: $.data.id }
          trigger:
            - call: "POST /evote/equipment-units/${uc_id}/custody-transfers"
              payload: { to_official_id: "${off2_id}", seal_number: "SEAL-C1-A", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "GET /evote/equipment-units/${uc_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off2_id}"
              captures: { cust_mid: $.data.current_custodian_id, cs_mid: $.data.custody_status }
            - call: "POST /evote/equipment-units/${uc_id}/custody-transfers"
              payload: { to_official_id: "${off1_id}", seal_number: "SEAL-C1-B", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - call: "GET /evote/equipment-units/${uc_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { cust_end: $.data.current_custodian_id, cs_end: $.data.custody_status }
            - call: "GET /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}" }
              as: Auditor
          assert:
            - "after forward transfer: current_custodian_id == ${off2_id} and custody_status == SECURED"
            - "after compensating transfer: current_custodian_id == ${off1_id} and custody_status == SECURED"
            - "exactly one custodian at every read; the jurisdiction still owns exactly 1 unit (transfer conserves unit count)"
            - "chain continuity enforced: the second transfer was only possible because its actor WAS the then-current custodian"
