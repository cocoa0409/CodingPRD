              as: BranchAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/prepay-contracts"
              payload: { prepay_program_id: "${pg_id}", product_id: "${p_mop}", committed_tons: 20, expected_grower_version: "${g_v}" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /agronomy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T23:59:59Z" }
              as: BranchAdmin
          trigger:
            - call: "POST /agronomy/prepay-contracts/${pc_id}/fund"
              payload: { amount_cents: 253650 }
              as: CreditManager
              captures: { pc_funded: $.data.funded_cents, pc_st: $.data.status }
            - call: "POST /agronomy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T00:00:00Z" }
              as: BranchAdmin
            - call: "POST /agronomy/prepay-contracts/${pc_id}/fund"
              payload: { amount_cents: 1000 }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "pc_funded == 253650 and pc_st == PARTIALLY_FUNDED (funding at the exact deadline instant ADMITTED)"
            - "err == ERR_PREPAY_FUNDING_DEADLINE_PASSED (one second past the deadline REJECTED)"
            - "GET /agronomy/prepay-contracts/${pc_id}: funded_cents still 253650 (rejected funding left no trace)"

