            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_lot2
            - *c_accept2
            - *c_cycle1
            - *c_load1
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 500, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { e_occ_cyc: $.data.error_id } }
            - *c_get_cyc1
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 500, expected_cycle_version: "${cyc1_v1}" }, as: PlantScheduler, captures: { load2_id: $.data.id } }
          assert:
            - "trigger step 1: HTTP 412 with data.error_id == ERR_STALE_CYCLE_VERSION"
            - "after step 1: VesselCycle.${cyc1_id}.baskets_used_total == 2 and CapacityContract.${contract_id}.reserved_slots == 1"
            - "${cyc1_v1} == 2 (the accepted first load incremented version from 1)"
            - "trigger step 3: HTTP 201 with baskets_used_total == 3, utilization_pct == 75.00 and VesselCycle.${cyc1_id}.version == 3"
            - "CapacityContract.${contract_id}.reserved_slots == 2 and available_slots == 3"

      - name: corner_occ_stale_lot_version_blocks_a_release_authored_before_a_hold
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[release-decision-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
          - validations.p7[POST /lots/{id}/release-decision -> ERR_STALE_LOT_VERSION]
        distinguishing_aspect: "A RELEASE written against the pre-hold view of the pallet is refused with 412 even though NOT_RELEASED -> ON_HOLD_FOR_TEST -> RELEASED is a legal path; the same call with the post-hold version succeeds."
        test_recipe:
          setup:
            - "the standard world; C1 DISPOSITIONED and PAL-001 TREATED / NOT_RELEASED"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - *c_get_lot1
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "HOLD_FOR_TEST", expected_lot_version: "${lot1_v}", hold_reason: "micro plate pending" }, as: QualityManager, as_user_id: "qm_alice", captures: { held_state: $.data.release_state } }
          trigger:
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_v}" }, as: QualityManager, as_user_id: "qm_carol", captures: { e_occ_lot: $.data.error_id } }
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_carol", captures: { lot1_v3: $.data.version } }
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_v3}" }, as: QualityManager, as_user_id: "qm_carol", captures: { rel_state: $.data.release_state } }
          assert:
            - "the HOLD_FOR_TEST call moved release_state to ON_HOLD_FOR_TEST with hold_reason == micro plate pending and incremented Lot.version by 1"
            - "trigger step 1: HTTP 412 with data.error_id == ERR_STALE_LOT_VERSION and release_state still ON_HOLD_FOR_TEST"
            - "${lot1_v3} == ${lot1_v} + 1"
            - "trigger step 3: HTTP 200 with release_state == RELEASED, hold_reason == null, released_by_user_id == qm_carol and version == ${lot1_v} + 2"

      - name: corner_occ_stale_qualification_version_outranks_the_state_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[qualification-supersede-stale]
          - errors[ERR_STALE_QUALIFICATION_VERSION]
          - validations.p7[POST /product-qualifications/{id}/supersede -> ERR_STALE_QUALIFICATION_VERSION]
        distinguishing_aspect: "Superseding twice from the same read violates both the version guard (priority 7) and the QUALIFIED-only state gate (priority 8); the 412 wins and no second DRAFT revision is minted."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A is QUALIFIED and has already been superseded once by REV-B"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - { call: "GET /product-qualifications/${qual_id}", as: Customer, as_user_id: "${cust_id}", captures: { sup_v: $.data.version } }
            - { call: "POST /product-qualifications/${qual_id}/supersede", payload: { expected_qualification_version: "${sup_v}", sku_code: "GUAC-500", version_label: "REV-B", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { revb_id: $.data.id } }
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/supersede", payload: { expected_qualification_version: "${sup_v}", sku_code: "GUAC-500", version_label: "REV-C", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { e_occ_qual: $.data.error_id } }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_QUALIFICATION_VERSION"
            - "data.error_id != ERR_INVALID_QUALIFICATION_STATE even though the source is already SUPERSEDED"
            - "ProductQualification.${qual_id}.version == ${sup_v} + 1 (only the accepted supersede bumped it)"
            - "GET /product-qualifications?supersedes_qualification_id=${qual_id} returns exactly 1 row, ${revb_id}"

      - name: corner_layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / deviation_reject_cascades_to_cold_room_posture
          rationale: "That instance asserts a six-link chain from deviation adjudication down to the cold room's derived posture, link by link."

      - name: corner_layer_dual_variant_calculation_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / tolling_fee_estimated_vs_actual_same_cycle
          rationale: "Both variants and the delta on switching from the estimate to the actual are asserted there."

      - name: corner_layer_rate_threshold_boundary_and_reset
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / leaker_ppm_exactly_at_chargeback_threshold
          rationale: "The instantaneous 3000 ppm boundary and the just-below 2500 ppm case are asserted there; the trailing-window reset is asserted by corner_trailing_window_includes_the_ninetieth_day_and_drops_the_ninety_first."

  - section: consistency model
    instances:
      - name: corner_every_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.contract_slot_ledger
          - entities.ColdRoom.fields.capacity_state
          - entities.Vessel.fields.status
        distinguishing_aspect: "Nothing in this facility settles asynchronously: each write's own response already carries its recomputed fields, and an immediate read of every cascaded parent — contract ledger, cold-room posture, vessel status — agrees with it without any retry or sweep."
        test_recipe:
          setup:
            - "the standard world with PAL-001 and PAL-002 both accepted into CR-1 (capacity 2) and cycle C1 SCHEDULED"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_lot2
            - *c_accept2
            - *c_cycle1
          trigger:
            - { call: "GET /cold-rooms/${room_id}", as: PlantOperator, captures: { room_state: $.data.capacity_state } }
            - *c_load1
            - { call: "GET /capacity-contracts/${contract_id}", as: FacilityAdmin, captures: { avail_now: $.data.available_slots } }
            - *c_start1
            - { call: "GET /vessels/${vessel_id}", as: PlantOperator, captures: { ves_state: $.data.status } }
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { lot_custody: $.data.custody_state } }
          assert:
            - "trigger step 1: ColdRoom.${room_id}.occupied_pallets == 2 and capacity_state == AT_CAPACITY immediately after the second inspection"
            - "trigger step 2's own response already reports the cycle-side recomputation (the follow-up GET adds nothing new)"
            - "trigger step 3: CapacityContract.${contract_id}.reserved_slots == 1 and available_slots == 4 in the very next read"
            - "trigger step 5: Vessel.${vessel_id}.status == IN_USE"
            - "trigger step 6: Lot.${lot1_id}.custody_state == IN_VESSEL with units_in_vessel == 1000 and units_untreated == 0"

      - name: corner_saga_style_rollback_of_a_started_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: compensating_invariant / abort_returns_units_to_the_untreated_pool
          rationale: "The abort path's synchronous, fully-visible reversal of the unit ledger is asserted there."
