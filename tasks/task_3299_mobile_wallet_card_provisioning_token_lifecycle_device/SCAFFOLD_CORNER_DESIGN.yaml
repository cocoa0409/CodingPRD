              payload: { amount_cents: 9999, reason: "DUPLICATE" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 409 and e == ERR_DISPUTE_AMOUNT_MISMATCH"
            - "GET /payment-tokens/${tok_id}/disputes returns 0 rows"

      - name: close_account_with_open_dispute_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.CardAccount.OPEN_to_CLOSED
          - errors.ERR_CARD_HAS_OPEN_DISPUTES
        distinguishing_aspect: "Aggregate precondition: the close is valid for the account itself but invalid collectively while any OPEN dispute exists on its tokens."
        test_recipe:
          setup: ["Standard token; APPROVED auth 8000; OPEN dispute on it."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
