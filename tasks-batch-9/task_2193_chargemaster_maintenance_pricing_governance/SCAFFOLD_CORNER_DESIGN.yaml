            - "RevenueCode responses carry id and created_at but NO version and NO updated_at (common_fields false)"
            - "${dept2_allow} == [] (an omitted allowlist means unrestricted, not null)"
            - "${d_allow} == ['0300'] and ${d_hold} == false and ${d_unres} == 0 and ${d_rec} == 0 and ${d_open} == 0"
            - "the department listing returns exactly 2 rows with total_count 2 and has_more false"
            - "${rule_floor} == 12000 and ${rule_cap} == 11000 and ${rule_flat} == null and ${rule_to} == null and ${rule_status} == ACTIVE"
            - "${rc250_hcpcs} == true and ${rc250_class} == PHARMACY and ${rc250_status} == ACTIVE"
            - "${rc250_after} == RETIRED with HTTP 200"
            - "the RETIRED listing returns total_count 2 (0250 and 0637)"
            - "the PROCEDURE listing returns total_count 1 with ${proc0} == ${rc300}"
            - "${applied} == ${rule} and ${rule_count} == 1 and ${rule_super} == null"
            - "the ACTIVE price-rule listing returns total_count 1 with ${pr0} == ${rule}"
            - "${ct_a_status} == ACTIVE and ${ct_a_notice} == 30 and ${ct_b_pct} == null (CASE_RATE needs no percent)"
            - "${a_after} == EXPIRED (term_end_date 2026-09-30 < the new logical now 2026-10-01)"
            - "the ACTIVE contract listing returns total_count 1 with ${act0} == ${ct_b}"
            - "${a_rewound} == EXPIRED — rewinding the clock to 2026-09-15 does not resurrect the term"
            - "ChargeItem.${item}.gross_charge_cents == 240000 and ChargeItem.${item}.price_status == PRICED_CURRENT"
            - "Facility.${fac}.active_item_count == 0 (the item is still DRAFT) and Facility.${fac}.chargemaster_posture == OPEN"
      - name: every_governance_list_endpoint_filters_by_scope_status_and_pagination_window
        claim_type: standard_crud
        grounds:
          - endpoints[GET /chargemaster/change-requests]
          - endpoints[GET /chargemaster/code-update-cycles]
          - endpoints[GET /chargemaster/code-update-entries]
          - endpoints[GET /chargemaster/charge-capture-batches]
          - endpoints[GET /chargemaster/transparency-files]
          - endpoints[GET /chargemaster/captured-charges]
          - endpoints[GET /chargemaster/missing-charge-findings]
          - cross_cutting_complexity_layers[pagination_with_filtering]
        distinguishing_aspect: "Sweeps the five collection endpoints that are the ONLY discovery channel for cascade-mutated children (entries, captured charges, findings) and proves filter composition is AND-combined, that total_count reports the filtered population rather than the page, and that has_more flips with the offset window — a status filter that excludes every row still returns HTTP 200 with total_count 0 rather than a 404."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT); revenue code 0300; departments CC-100 (mgr_cath) and CC-200 (mgr_rad); COST_PLUS_MARKUP rule with the default tiers."
            - "Item CDM-1001 repriced to 240000 and left in DRAFT so the transparency build stays out of the FROZEN posture."
            - "Three change requests on that item from CC-100: cr1 left SUBMITTED, cr2 withdrawn, cr3 left SUBMITTED; one cycle 2027/CPT in LOADED with two PENDING entries; two batches (one per department) both INGESTED; one TransparencyFile in BUILDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Radiology", cost_center_code: "CC-200", manager_user_id: "mgr_rad" }
              as: SystemAdmin
              captures: { dept2: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              captures: { rule: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "First cost basis revision request", proposed_cost_basis_cents: 150000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr1: $.data.id }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Second cost basis revision request", proposed_cost_basis_cents: 160000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr2: $.data.id }
            - call: "POST /chargemaster/change-requests/${cr2}/decisions"
              payload: { decision: "WITHDRAW", decision_note: "Superseded by a later request" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr2_status: $.data.status }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Third cost basis revision request", proposed_cost_basis_cents: 170000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr3: $.data.id }
            - call: "POST /chargemaster/code-update-cycles"
              payload: { facility_id: "${fac}", cycle_year: 2027, code_set: "CPT" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { cycle: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/entries"
              payload: { action: "ADD", new_code_value: "0001U" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { en1: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/entries"
              payload: { action: "DELETE", old_code_value: "93458" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { en2: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", department_id: "${dept}", window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2026-09-07T23:59:59Z" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { b1: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", department_id: "${dept2}", window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2026-09-07T23:59:59Z" }
              as: DepartmentManager
              as_user_id: "mgr_rad"
              captures: { b2: $.data.id }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac}", file_format: "CSV", expected_facility_version: "${fac_v}" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { file1: $.data.id, file1_status: $.data.status }
          trigger:
            - call: "GET /chargemaster/change-requests"
              payload: { charge_item_id: "${item}", status: "SUBMITTED" }
              as: PricingCommitteeApprover
              captures: { sub0: "$.data[0].id" }
            - call: "GET /chargemaster/change-requests"
              payload: { department_id: "${dept}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { page0: "$.data[0].id", page1: "$.data[1].id" }
            - call: "GET /chargemaster/change-requests"
              payload: { department_id: "${dept}", limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { page2: "$.data[0].id" }
            - call: "GET /chargemaster/change-requests"
              payload: { charge_item_id: "${item}", status: "IMPLEMENTED" }
              as: SystemAdmin
            - call: "GET /chargemaster/code-update-cycles"
              payload: { facility_id: "${fac}", status: "LOADED", code_set: "CPT", cycle_year: 2027 }
              as: RevenueIntegrityAnalyst
              captures: { cyc0: "$.data[0].id" }
            - call: "GET /chargemaster/code-update-entries"
              payload: { cycle_id: "${cycle}", status: "PENDING", limit: 100 }
              as: ComplianceOfficer
              captures: { ent0: "$.data[0].id", ent1: "$.data[1].id" }
            - call: "GET /chargemaster/code-update-entries"
              payload: { cycle_id: "${cycle}", action: "DELETE" }
              as: RevenueIntegrityAnalyst
              captures: { del0: "$.data[0].id" }
            - call: "GET /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", status: "INGESTED" }
              as: RevenueIntegrityAnalyst
              captures: { batch0: "$.data[0].id" }
            - call: "GET /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac}", department_id: "${dept2}" }
              as: DepartmentManager
              as_user_id: "mgr_rad"
              captures: { rad0: "$.data[0].id" }
            - call: "GET /chargemaster/transparency-files"
              payload: { facility_id: "${fac}", status: "BUILDING" }
              as: ComplianceOfficer
              captures: { file0: "$.data[0].id" }
            - call: "GET /chargemaster/captured-charges"
              payload: { batch_id: "${b1}" }
              as: RevenueIntegrityAnalyst
            - call: "GET /chargemaster/missing-charge-findings"
              payload: { department_id: "${dept}", status: "OPEN" }
              as: RevenueIntegrityAnalyst
          assert:
            - "${cr2_status} == WITHDRAWN"
            - "the SUBMITTED request listing returns total_count 2 and ${sub0} is one of ${cr1} / ${cr3}; ${cr2} is absent"
            - "limit 2 offset 0 on the department listing returns 2 rows with has_more true and total_count 3; ${page0} and ${page1} are distinct"
            - "limit 2 offset 2 returns exactly 1 row with has_more false, total_count 3, and ${page2} is the remaining request id"
            - "the IMPLEMENTED filter returns HTTP 200 with 0 rows, total_count 0 and has_more false (an empty filtered set is not a 404)"
            - "the cycle listing with all four filters ANDed returns total_count 1 with ${cyc0} == ${cycle}"
            - "the PENDING entry listing returns total_count 2 with {${ent0}, ${ent1}} == {${en1}, ${en2}}"
            - "the action DELETE entry listing returns total_count 1 with ${del0} == ${en2}"
            - "the INGESTED batch listing returns total_count 2 (both departments) with ${batch0} in {${b1}, ${b2}}"
            - "the department-scoped batch listing returns total_count 1 with ${rad0} == ${b2}"
            - "${file1_status} == BUILDING and the BUILDING file listing returns total_count 1 with ${file0} == ${file1}"
            - "the captured-charges listing for ${b1} returns total_count 0 (no lines were appended)"
            - "the OPEN findings listing for ${dept} returns total_count 0"
            - "every list response carries limit, offset, total_count and has_more"

  - section: errors
    instances:
      - name: every_resource_family_has_its_own_not_found_code_on_reads_and_writes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHANGE_REQUEST_NOT_FOUND]
          - errors[ERR_CODE_UPDATE_NOT_FOUND]
          - errors[ERR_CAPTURE_RESOURCE_NOT_FOUND]
          - errors[ERR_GOVERNANCE_RESOURCE_NOT_FOUND]
          - errors[ERR_CHARGE_ITEM_NOT_FOUND]
          - errors[ERR_FACILITY_NOT_FOUND]
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: "The path-existence ladder is split by resource FAMILY, not by endpoint: the same non-resolving UUID yields six different error ids depending on which family the path segment names, cycles and entries share ERR_CODE_UPDATE_NOT_FOUND, batches/lines/findings share ERR_CAPTURE_RESOURCE_NOT_FOUND, and transparency-files / analyses / price-rules / payer-contracts / departments all collapse into ERR_GOVERNANCE_RESOURCE_NOT_FOUND. Writes and reads behave identically and nothing is created."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z and a single facility CCN-0001 so that the database is non-empty; no other resource of any family exists."
            - "Every call below uses the literal non-resolving UUID 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /chargemaster/facilities/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: SystemAdmin
              captures: { e_fac: $.data.error_id }
            - call: "GET /chargemaster/charge-items/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_item: $.data.error_id }
            - call: "POST /chargemaster/charge-items/00000000-0000-0000-0000-0000000000ff/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_item_w: $.data.error_id }
            - call: "GET /chargemaster/change-requests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_cr: $.data.error_id }
            - call: "POST /chargemaster/change-requests/00000000-0000-0000-0000-0000000000ff/decisions"
              payload: { decision: "REVIEW" }
