      - name: field_kitchen_inspection_action_overwrites_utilities_and_rescores
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /field-ops/field-kitchens/{id}/inspections
          - calculations.field_kitchen_food_safety_score
        distinguishing_aspect: "The inspection action is a conditional action on a live site: it overwrites the four observed utility fields, stamps last_inspection_at and re-scores the site, and it is accepted in any site_status including OPERATIONAL."
        test_recipe:
          setup: ["an OPERATIONAL field kitchen with refrigeration_hours_available 12"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
