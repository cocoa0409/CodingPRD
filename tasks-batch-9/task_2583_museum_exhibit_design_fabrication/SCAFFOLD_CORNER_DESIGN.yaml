            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
