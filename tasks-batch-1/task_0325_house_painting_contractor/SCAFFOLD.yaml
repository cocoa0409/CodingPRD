# =============================================================================
# Scaffold: House Painting Contractor (task_0325) — Expert difficulty
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  325. House Painting Contractor: interior/exterior scope & surface prep,
  room/sq-ft & coat estimate, color/paint selection, crew scheduling & weather,
  material/labor breakdown, change order, deposit & final walkthrough,
  touch-up warranty

domain_name: house-painting-contractor
api_prefix: /painting

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation      # estimate vs final/actual cost; provisional vs final warranty payout
    - cascading_side_effects        # change-order approval re-prices surfaces -> line items -> project totals
    - optimistic_concurrency        # OCC on Project.version when authoring a change order against a moving target
    - rate_threshold_triggers       # deposit %, weather suitability temp, warranty window boundary
    - derived_field_reconciliation  # project totals/deposit/balance kept consistent with line items

  entity_topology: flat
  # All entities are flat sibling collections under /painting/<collection>; parent/child links are
  # expressed by FK fields carried in request bodies (e.g. Surface.project_id, ColorSelection.surface_id),
  # NOT by nested URL paths. Children are discovered via filtered-list GETs (?project_id=, ?surface_id=).

  state_machine_shape: parallel
  # Project carries two independent axes (workflow_status x payment_status); ChangeOrder is cyclic;
  # Walkthrough is branching-with-revert; CrewAssignment/WarrantyClaim are short linear+branch machines.

  relationship_patterns:
    - one_to_many        # Project -> Surface, LineItem, ChangeOrder, Payment, WarrantyClaim
    - cross_aggregate    # CrewAssignment references both Project and CrewMember/Equipment
    - polymorphic        # ChangeOrderItem.target_surface_id references a Surface created or removed by the order

  role_model: peer_roles
  # Estimator authors scope/estimates; ProjectManager schedules crew/equipment and runs the lifecycle;
  # Customer signs off on colors, deposit and walkthrough; CrewMember reports work progress.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PaintProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catalog product name, e.g. 'PremiumMatte White'" }
      - { name: surface_kind, type: enum, source: input, description: "INTERIOR | EXTERIOR | BOTH — which surface scopes this product may be applied to", constraints: "one of {INTERIOR, EXTERIOR, BOTH}" }
      - { name: finish_type, type: enum, source: input, description: "FLAT | EGGSHELL | SATIN | SEMI_GLOSS | GLOSS", constraints: "one of {FLAT, EGGSHELL, SATIN, SEMI_GLOSS, GLOSS}" }
      - { name: price_per_gallon_cents, type: integer, source: input, description: "Material unit price in cents per gallon", constraints: ">= 1" }
      - { name: coverage_sqft_per_gallon_per_coat, type: integer, source: input, description: "Square feet one gallon covers for a single coat", constraints: ">= 1" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether this product may be selected on new surfaces; inactive products remain referenceable by existing surfaces" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Painter's full name" }
      - { name: skill_level, type: enum, source: input, description: "APPRENTICE | JOURNEYMAN | MASTER — gates which prep levels they may execute", constraints: "one of {APPRENTICE, JOURNEYMAN, MASTER}" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Crew member billing rate per scheduled day in cents", constraints: ">= 1" }
      - { name: scheduled_day_count, type: integer, source: computed, description: "Read-only: total distinct days occupied by this crew member's SCHEDULED or IN_PROGRESS CrewAssignments; conserved across assign->cancel (Rule 9)" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the crew member can take new assignments" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shared resource name, e.g. 'AirlessSprayer-A'" }
      - { name: equipment_kind, type: enum, source: input, description: "SPRAYER | SCAFFOLD | LIFT", constraints: "one of {SPRAYER, SCAFFOLD, LIFT}" }
      - { name: total_units, type: integer, source: input, description: "Number of identical physical units available for concurrent booking", constraints: ">= 1" }
      - { name: units_reserved, type: integer, source: computed, description: "Read-only: peak count of units held by overlapping SCHEDULED/IN_PROGRESS CrewAssignments; conserved across assign->cancel (Rule 9)" }

  - name: WeatherWindow
    parent: null
    common_fields: true
    fields:
      - { name: window_date, type: string, source: input, description: "Calendar date this forecast applies to, ISO date 'YYYY-MM-DD'", constraints: "unique across all WeatherWindow rows" }
      - { name: forecast_temp_f, type: integer, source: input, description: "Forecast daytime temperature in Fahrenheit" }
      - { name: precipitation_pct, type: integer, source: input, description: "Forecast precipitation probability, 0..100", constraints: "0..100" }
      - { name: exterior_suitable, type: boolean, source: computed, description: "Read-only: true iff forecast_temp_f >= MIN_EXTERIOR_TEMP_F AND precipitation_pct <= MAX_EXTERIOR_PRECIP_PCT (see calc weather_suitability)" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "Opaque customer account identifier (the X-User-ID a Customer authenticates with); not a persisted entity id" }
      - { name: site_address, type: string, source: input, description: "Street address of the job site" }
      - { name: scope, type: enum, source: input, description: "INTERIOR | EXTERIOR | BOTH — overall job scope", constraints: "one of {INTERIOR, EXTERIOR, BOTH}" }
      - { name: deposit_pct, type: integer, source: input, default: 30, description: "Deposit percentage of the estimate total, 0..100", constraints: "0..100" }
      - { name: workflow_status, type: enum, source: system, description: "Lifecycle axis: DRAFT -> ESTIMATED -> SCHEDULED -> IN_PROGRESS -> WALKTHROUGH_PENDING -> COMPLETED, plus CANCELLED", constraints: "one of {DRAFT, ESTIMATED, SCHEDULED, IN_PROGRESS, WALKTHROUGH_PENDING, COMPLETED, CANCELLED}" }
      - { name: payment_status, type: enum, source: system, description: "Independent money axis: UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL", constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL}" }
      - { name: estimate_material_cents, type: integer, source: computed, description: "Read-only: material component of the FROZEN estimate snapshot taken at finalize-estimate (sum over PLANNED LineItems of material_cost_cents at that instant); does NOT move on later change orders" }
      - { name: estimate_labor_cents, type: integer, source: computed, description: "Read-only: labor component of the FROZEN estimate snapshot (round-per-line THEN sum); does NOT move on later change orders" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Read-only: the FROZEN ESTIMATE variant = estimate_material_cents + estimate_labor_cents captured at finalize-estimate; 0 while DRAFT. The deposit is based on this contractual figure (calc project_totals, variant=estimate)" }
      - { name: revised_total_cents, type: integer, source: computed, description: "Read-only: the LIVE total = sum over non-REMOVED LineItems of (material_cost_cents + labor_cost_cents); equals estimate_total_cents at finalize and moves as approved change orders mutate surfaces" }
      - { name: final_total_cents, type: integer, source: computed, description: "Read-only: null until COMPLETED; the FINAL variant = sum over EXECUTED LineItems of (material_cost_cents + labor_cost_cents). Diverges from the frozen estimate_total_cents when change orders altered scope (calc project_totals, variant=final)" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Read-only: round_half_up(estimate_total_cents * deposit_pct / 100) using the FROZEN estimate_total_cents; fixed once the estimate is finalized (calc deposit_due)" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Read-only: sum of CAPTURED Payment.amount_cents for this project" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Read-only: revised_total_cents - amount_paid_cents (recomputed on every revised-total or payment change)" }
      - { name: warranty_months, type: integer, source: input, default: 12, description: "Touch-up warranty length in months from completion" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "Read-only: null until COMPLETED; completion timestamp + warranty_months months" }

  - name: Surface
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; supplied in the create body" }
      - { name: label, type: string, source: input, description: "Room or elevation name, e.g. 'Master Bedroom' or 'North Elevation'" }
      - { name: surface_kind, type: enum, source: input, description: "INTERIOR | EXTERIOR — must be compatible with the project scope and the selected product", constraints: "one of {INTERIOR, EXTERIOR}" }
      - { name: area_sqft, type: integer, source: input, description: "Paintable area in square feet", constraints: ">= 1" }
      - { name: coats, type: integer, source: input, description: "Number of coats to apply", constraints: "1..4" }
      - { name: prep_level, type: enum, source: input, description: "LIGHT | STANDARD | HEAVY | RESTORATION — drives the labor prep multiplier and minimum crew skill", constraints: "one of {LIGHT, STANDARD, HEAVY, RESTORATION}" }
      - { name: paint_product_id, type: string, source: input, description: "FK -> PaintProduct.id; product surface_kind must admit this surface's surface_kind" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | REMOVED — REMOVED when an approved change order deletes it", constraints: "one of {PLANNED, EXECUTED, REMOVED}" }
      - { name: color_locked, type: boolean, source: computed, description: "Read-only: true once a ColorSelection for this surface is APPROVED by the customer" }

  - name: ColorSelection
    parent: Surface
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; derived from the referenced surface" }
      - { name: surface_id, type: string, source: input, description: "FK -> Surface.id; supplied in the create body" }
      - { name: color_code, type: string, source: input, description: "Manufacturer color code, e.g. 'SW-7005'" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED — customer approval gates surface execution", constraints: "one of {PROPOSED, APPROVED, REJECTED}" }

  - name: LineItem
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: surface_id, type: string, source: system, description: "FK -> Surface.id; one LineItem per non-REMOVED Surface" }
      - { name: gallons_required, type: integer, source: computed, description: "Read-only: ceil(area_sqft * coats / coverage_sqft_per_gallon_per_coat) (calc material_estimate)" }
      - { name: material_cost_cents, type: integer, source: computed, description: "Read-only: gallons_required * price_per_gallon_cents (calc material_estimate)" }
      - { name: labor_hours, type: number, source: computed, description: "Read-only: area_sqft * coats * PREP_FACTOR[prep_level] / SQFT_PER_HOUR (calc labor_estimate)" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Read-only: round_half_up(labor_hours * LABOR_RATE_CENTS_PER_HOUR) (calc labor_estimate)" }
      - { name: executed, type: boolean, source: computed, description: "Read-only: true once the parent Surface.status == EXECUTED" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; supplied in the create body" }
      - { name: reason, type: string, source: input, description: "Why the scope is changing" }
      - { name: action, type: enum, source: input, description: "ADD_SURFACE | REMOVE_SURFACE | REVISE_SURFACE — what this order does", constraints: "one of {ADD_SURFACE, REMOVE_SURFACE, REVISE_SURFACE}" }
      - { name: target_surface_id, type: string, source: input, description: "FK -> Surface.id; required for REMOVE_SURFACE/REVISE_SURFACE, null for ADD_SURFACE", default: null }
      - { name: new_label, type: string, source: input, default: null, description: "Surface label for ADD_SURFACE" }
      - { name: new_surface_kind, type: enum, source: input, default: null, description: "INTERIOR | EXTERIOR for ADD_SURFACE", constraints: "one of {INTERIOR, EXTERIOR} when present" }
      - { name: new_area_sqft, type: integer, source: input, default: null, description: "area_sqft for ADD_SURFACE or the revised value for REVISE_SURFACE" }
      - { name: new_coats, type: integer, source: input, default: null, description: "coats for ADD_SURFACE or the revised value for REVISE_SURFACE", constraints: "1..4 when present" }
      - { name: new_prep_level, type: enum, source: input, default: null, description: "prep_level for ADD_SURFACE or REVISE_SURFACE", constraints: "one of {LIGHT, STANDARD, HEAVY, RESTORATION} when present" }
      - { name: new_paint_product_id, type: string, source: input, default: null, description: "FK -> PaintProduct.id for ADD_SURFACE/REVISE_SURFACE product change" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED; REJECTED -> DRAFT (revision loop)", constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED}" }
      - { name: delta_total_cents, type: integer, source: computed, description: "Read-only: signed change to estimate_total_cents this order applies on approval (calc change_order_delta)" }
      - { name: applied_project_version, type: integer, source: computed, description: "Read-only: Project.version at the moment this order was APPROVED; null otherwise" }

  - name: CrewAssignment
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; supplied in the create body" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: equipment_id, type: string, source: input, default: null, description: "FK -> Equipment.id; optional shared resource reserved for this assignment's window" }
      - { name: start_date, type: string, source: input, description: "First scheduled day, ISO date 'YYYY-MM-DD'" }
      - { name: end_date, type: string, source: input, description: "Last scheduled day inclusive, ISO date 'YYYY-MM-DD'", constraints: "end_date >= start_date" }
      - { name: requires_exterior_weather, type: boolean, source: input, default: false, description: "If true, every day in [start_date,end_date] must have an exterior_suitable WeatherWindow" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> DONE; SCHEDULED/IN_PROGRESS -> CANCELLED", constraints: "one of {SCHEDULED, IN_PROGRESS, DONE, CANCELLED}" }
      - { name: day_count, type: integer, source: computed, description: "Read-only: inclusive day span end_date - start_date + 1" }

  - name: Payment
    parent: Project
    common_fields: false   # append-only ledger row: id + created_at only
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; supplied in the create body" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | FINAL — deposit at scheduling, final at/after walkthrough", constraints: "one of {DEPOSIT, FINAL}" }
      - { name: amount_cents, type: integer, source: input, description: "Captured amount in cents", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "CAPTURED | REFUNDED — REFUNDED when a project is cancelled", constraints: "one of {CAPTURED, REFUNDED}" }

  - name: Walkthrough
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: punch_list_count, type: integer, source: input, default: 0, description: "Number of defects recorded at this walkthrough", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING -> PASSED | FAILED; FAILED -> PENDING (re-walkthrough loop)", constraints: "one of {PENDING, PASSED, FAILED}" }

  - name: WarrantyClaim
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; supplied in the create body" }
      - { name: surface_id, type: string, source: input, description: "FK -> Surface.id; the surface needing touch-up" }
      - { name: description, type: string, source: input, description: "Defect description" }
      - { name: filed_at, type: datetime, source: input, description: "Client-supplied claim filing timestamp, ISO 8601 UTC; must be <= Project.warranty_expires_at" }
      - { name: status, type: enum, source: system, description: "FILED -> APPROVED -> RESOLVED; FILED -> DENIED", constraints: "one of {FILED, APPROVED, RESOLVED, DENIED}" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "Read-only: estimated touch-up reimbursement at FILED time (PROVISIONAL variant; calc warranty_payout)" }
      - { name: final_payout_cents, type: integer, source: computed, description: "Read-only: null until RESOLVED; actual reimbursement from logged_touchup_hours (FINAL variant; calc warranty_payout)" }
      - { name: logged_touchup_hours, type: number, source: input, default: null, description: "Actual labor hours logged when resolving the claim" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Project: parallel axes (workflow_status x payment_status) ----
  - entity: Project
    initial_state: DRAFT          # workflow_status
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /painting/projects/{projectId}/finalize-estimate"
        actor: Estimator
        preconditions:
          - "workflow_status == DRAFT (ERR_PROJECT_NOT_DRAFT)"
          - "Project has >= 1 Surface with status==PLANNED (ERR_NO_SURFACES)"
        side_effects:
          - "Recompute every LineItem (material_estimate, labor_estimate)"
          - "FREEZE estimate_material_cents, estimate_labor_cents, estimate_total_cents (calc project_totals, variant=estimate)"
          - "Set revised_total_cents = estimate_total_cents (live total starts equal to the frozen estimate)"
          - "Set deposit_due_cents = round_half_up(estimate_total_cents * deposit_pct/100); balance_due_cents = revised_total_cents (calc deposit_due)"
          - "workflow_status -> ESTIMATED"
      - from: ESTIMATED
        to: SCHEDULED
        trigger: "POST /painting/projects/{projectId}/schedule"
        actor: ProjectManager
        preconditions:
          - "workflow_status == ESTIMATED (ERR_PROJECT_NOT_ESTIMATED)"
          - "payment_status == DEPOSIT_PAID or PAID_IN_FULL (ERR_DEPOSIT_NOT_PAID)"
          - "Every PLANNED Surface has an APPROVED ColorSelection (ERR_COLOR_NOT_APPROVED)"
          - "Project has >= 1 CrewAssignment with status==SCHEDULED (ERR_NO_CREW_SCHEDULED)"
        side_effects:
          - "workflow_status -> SCHEDULED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /painting/projects/{projectId}/start-work"
        actor: ProjectManager
        preconditions:
          - "workflow_status == SCHEDULED (ERR_PROJECT_NOT_SCHEDULED)"
        side_effects:
          - "workflow_status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: WALKTHROUGH_PENDING
        trigger: "POST /painting/projects/{projectId}/request-walkthrough"
        actor: ProjectManager
        preconditions:
          - "workflow_status == IN_PROGRESS (ERR_PROJECT_NOT_IN_PROGRESS)"
          - "Every CrewAssignment is DONE or CANCELLED (ERR_CREW_NOT_DONE)"
        side_effects:
          - "All non-REMOVED Surfaces -> EXECUTED; their LineItems.executed -> true"
          - "workflow_status -> WALKTHROUGH_PENDING"
          - "Create a Walkthrough row in PENDING (system)"
      - from: WALKTHROUGH_PENDING
        to: COMPLETED
        trigger: "system (cascade when a Walkthrough transitions to PASSED)"
        actor: system
        preconditions:
          - "The project's latest Walkthrough is PASSED"
          - "payment_status == PAID_IN_FULL (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Compute final_total_cents (FINAL variant of project_totals: sum over EXECUTED LineItems of material+labor)"
          - "Set warranty_expires_at = completion_time + warranty_months months"
          - "workflow_status -> COMPLETED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /painting/projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions:
          - "workflow_status in {DRAFT, ESTIMATED, SCHEDULED} (ERR_PROJECT_NOT_CANCELLABLE)"
        side_effects:
          - "All SCHEDULED/IN_PROGRESS CrewAssignments -> CANCELLED (releases CrewMember.scheduled_day_count and Equipment.units_reserved — compensating, Rule 9)"
          - "All CAPTURED Payments -> REFUNDED; amount_paid_cents recomputed to 0"
          - "workflow_status -> CANCELLED"
      - from: ESTIMATED
        to: CANCELLED
        trigger: "POST /painting/projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions:
          - "Same as DRAFT->CANCELLED"
        side_effects:
          - "Same cascade as DRAFT->CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /painting/projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions:
          - "Same as DRAFT->CANCELLED"
        side_effects:
          - "Same cascade as DRAFT->CANCELLED"
      # ---- payment_status axis (independent dimension) ----
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /painting/payments  (kind=DEPOSIT)"
        actor: Customer
        preconditions:
          - "payment_status == UNPAID (ERR_DEPOSIT_ALREADY_PAID)"
          - "workflow_status == ESTIMATED (ERR_PROJECT_NOT_ESTIMATED)"
          - "amount_cents == deposit_due_cents (ERR_DEPOSIT_AMOUNT_MISMATCH)"
        side_effects:
          - "Insert Payment(kind=DEPOSIT, status=CAPTURED)"
          - "amount_paid_cents += amount_cents; balance_due_cents recomputed"
          - "payment_status -> DEPOSIT_PAID"
        note: "Money axis evolves independently of workflow_status beyond the stated guards."
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /painting/payments  (kind=FINAL)"
        actor: Customer
        preconditions:
          - "payment_status == DEPOSIT_PAID (ERR_FINAL_BEFORE_DEPOSIT)"
          - "workflow_status == WALKTHROUGH_PENDING (ERR_PROJECT_NOT_IN_WALKTHROUGH)"
          - "amount_cents == balance_due_cents (ERR_FINAL_AMOUNT_MISMATCH)"
        side_effects:
          - "Insert Payment(kind=FINAL, status=CAPTURED)"
          - "amount_paid_cents += amount_cents; balance_due_cents recomputed to 0"
          - "payment_status -> PAID_IN_FULL"

  # ---- ChangeOrder: cyclic (REJECTED -> DRAFT revision loop) ----
  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /painting/change-orders/{changeOrderId}/submit"
        actor: Estimator
        preconditions:
          - "status == DRAFT (ERR_CHANGE_ORDER_NOT_DRAFT)"
          - "Parent Project.workflow_status in {ESTIMATED, SCHEDULED, IN_PROGRESS} (ERR_PROJECT_NOT_CHANGEABLE)"
        side_effects:
          - "Compute delta_total_cents from the order's surface change (calc change_order_delta)"
          - "status -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /painting/change-orders/{changeOrderId}/approve"
        actor: Customer
        preconditions:
          - "status == SUBMITTED (ERR_CHANGE_ORDER_NOT_SUBMITTED)"
          - "Parent Project.workflow_status in {ESTIMATED, SCHEDULED, IN_PROGRESS} (ERR_PROJECT_NOT_CHANGEABLE)"
        side_effects:
          - "ADD_SURFACE: create a PLANNED Surface from the new_* fields and its LineItem (link 1)"
          - "REMOVE_SURFACE: target Surface.status -> REMOVED; its LineItem dropped from the live total (link 1)"
          - "REVISE_SURFACE: overwrite target Surface fields with the new_* values; recompute its LineItem (link 1 -> 2)"
          - "The surface/LineItem mutation re-derives revised_total_cents = sum of non-REMOVED LineItems (link 2 -> 3)"
          - "balance_due_cents recomputed from the new revised_total_cents (link 3); deposit_due_cents and the FROZEN estimate_total_cents are NOT touched"
          - "applied_project_version = Project.version after the cascade; Project.version += 1"
          - "status -> APPROVED"
        note: "Approval is the depth>=3 cascade source: approve -> surface mutation -> line-item recompute -> revised_total/balance. The frozen estimate_total_cents and deposit_due_cents stay fixed."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /painting/change-orders/{changeOrderId}/reject"
        actor: Customer
        preconditions:
          - "status == SUBMITTED (ERR_CHANGE_ORDER_NOT_SUBMITTED)"
        side_effects:
          - "status -> REJECTED; no surface/total mutation occurs (revised_total_cents and estimate_total_cents unchanged — Rule 9 invariant)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /painting/change-orders/{changeOrderId}/revise"
        actor: Estimator
        preconditions:
          - "status == REJECTED (ERR_CHANGE_ORDER_NOT_REJECTED)"
        side_effects:
          - "Overwrite the order's editable new_*/action/target fields from the revise payload"
          - "delta_total_cents reset to 0 (recomputed on next submit)"
          - "status -> DRAFT"

  # ---- Walkthrough: branching with revert ----
  - entity: Walkthrough
    initial_state: PENDING
    terminal_states: [PASSED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /painting/walkthroughs/{walkthroughId}/pass"
        actor: Customer
        preconditions:
          - "status == PENDING (ERR_WALKTHROUGH_NOT_PENDING)"
          - "punch_list_count == 0 (ERR_PUNCH_LIST_OPEN)"
          - "Parent Project.workflow_status == WALKTHROUGH_PENDING (ERR_PROJECT_NOT_IN_WALKTHROUGH)"
        side_effects:
          - "If Project.payment_status == PAID_IN_FULL: cascade Project -> COMPLETED (compute final_total_cents, set warranty_expires_at); else Project stays WALKTHROUGH_PENDING awaiting final payment (Rule 4 cascade depth>=2)"
      - from: PENDING
        to: FAILED
        trigger: "POST /painting/walkthroughs/{walkthroughId}/fail"
        actor: Customer
        preconditions:
          - "status == PENDING (ERR_WALKTHROUGH_NOT_PENDING)"
        side_effects:
          - "status -> FAILED"
      - from: FAILED
        to: PENDING
        trigger: "POST /painting/walkthroughs/{walkthroughId}/reopen"
        actor: ProjectManager
        preconditions:
          - "status == FAILED (ERR_WALKTHROUGH_NOT_FAILED)"
        side_effects:
          - "punch_list_count reset to the value supplied in the reopen payload (defaults 0)"
          - "status -> PENDING"

  # ---- CrewAssignment: short linear + cancel branch ----
  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /painting/crew-assignments/{assignmentId}/begin"
        actor: CrewMember
        preconditions:
          - "status == SCHEDULED (ERR_ASSIGNMENT_NOT_SCHEDULED)"
          - "Parent Project.workflow_status == IN_PROGRESS (ERR_PROJECT_NOT_IN_PROGRESS) — cross-entity (Rule 7)"
        side_effects:
          - "status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /painting/crew-assignments/{assignmentId}/complete"
        actor: CrewMember
        preconditions:
          - "status == IN_PROGRESS (ERR_ASSIGNMENT_NOT_IN_PROGRESS)"
        side_effects:
          - "status -> DONE; the assignment's days leave CrewMember.scheduled_day_count (work finished) and release Equipment.units_reserved"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /painting/crew-assignments/{assignmentId}/cancel"
        actor: ProjectManager
        preconditions:
          - "status in {SCHEDULED, IN_PROGRESS} (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED; CrewMember.scheduled_day_count -= day_count; Equipment.units_reserved released (compensating, Rule 9 conserved count)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /painting/crew-assignments/{assignmentId}/cancel"
        actor: ProjectManager
        preconditions:
          - "Same as SCHEDULED->CANCELLED"
        side_effects:
          - "Same compensating release as SCHEDULED->CANCELLED"

  # ---- ColorSelection: customer approval ----
  - entity: ColorSelection
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /painting/color-selections/{colorSelectionId}/approve"
        actor: Customer
        preconditions:
          - "status == PROPOSED (ERR_COLOR_NOT_PROPOSED)"
          - "Parent Surface.status == PLANNED (ERR_SURFACE_NOT_PLANNED)"
        side_effects:
          - "status -> APPROVED; parent Surface.color_locked -> true"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /painting/color-selections/{colorSelectionId}/reject"
        actor: Customer
        preconditions:
          - "status == PROPOSED (ERR_COLOR_NOT_PROPOSED)"
        side_effects:
          - "status -> REJECTED"

  # ---- WarrantyClaim: FILED -> APPROVED -> RESOLVED | DENIED ----
  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /painting/warranty-claims/{claimId}/approve"
        actor: ProjectManager
        preconditions:
          - "status == FILED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "status -> APPROVED"
      - from: FILED
        to: DENIED
        trigger: "POST /painting/warranty-claims/{claimId}/deny"
        actor: ProjectManager
        preconditions:
          - "status == FILED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "status -> DENIED"
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /painting/warranty-claims/{claimId}/resolve"
        actor: ProjectManager
        preconditions:
          - "status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "logged_touchup_hours supplied and >= 0 (ERR_TOUCHUP_HOURS_REQUIRED)"
        side_effects:
          - "Compute final_payout_cents from logged_touchup_hours (FINAL variant; calc warranty_payout)"
          - "status -> RESOLVED"

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE-with-supersede race, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /painting/change-orders"
    occ_field: "expected_project_version"
    description: |
      Authoring a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. A change order is priced relative
      to the project's current surface set and estimate_total_cents; if another
      change order has just been APPROVED (legitimately superseding the prior
      surface set and bumping Project.version), the current author's view of the
      project is stale and the create is rejected on a stale-version check.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: material_estimate
    trigger: "Surface create, finalize-estimate, and on every approved change-order surface mutation"
    algorithm: aggregation
    formula: |
      # Per LineItem, drawn from its Surface and the Surface's PaintProduct.
      gallons_required = ceil( (area_sqft * coats) / coverage_sqft_per_gallon_per_coat )
      material_cost_cents = gallons_required * price_per_gallon_cents
    input_set: "The single Surface backing this LineItem; PaintProduct fields read from Surface.paint_product_id"
    constants: {}
    precision: "gallons_required is an exact integer via ceil; material_cost_cents is exact integer cents"
    note: "Rule 2 mode (a): >=3 inputs (area_sqft, coats, coverage) with non-linear ceil; Rule 6 boundary at exact-coverage divisibility."

  - name: labor_estimate
    trigger: "Surface create, finalize-estimate, and on every approved change-order surface mutation"
    algorithm: weighted_scoring
    formula: |
      labor_hours = (area_sqft * coats * PREP_FACTOR[prep_level]) / SQFT_PER_HOUR
      labor_cost_cents = round_half_up( labor_hours * LABOR_RATE_CENTS_PER_HOUR )
    input_set: "The single Surface backing this LineItem"
    constants:
      PREP_FACTOR: { LIGHT: 1.0, STANDARD: 1.25, HEAVY: 1.6, RESTORATION: 2.0 }
      SQFT_PER_HOUR: 160
      LABOR_RATE_CENTS_PER_HOUR: 6550
    precision: "labor_hours kept as exact rational; labor_cost_cents rounded half-up to whole cents per line item (raw cents can carry a .5 fraction, e.g. area=120,coats=1,LIGHT -> 4912.5 -> 4913)"
    note: "Tiered prep-multiplier selection. Rounding is per-line-item (see project_totals for the pinned sum order)."

  - name: project_totals
    trigger: "finalize-estimate (freeze ESTIMATE), approved change order (recompute LIVE revised), completion (compute FINAL)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: each LineItem's material_cost_cents and labor_cost_cents are already
      # whole-cent integers (rounded per line item in material_estimate / labor_estimate); the project
      # sums those integers directly. We round-per-line-item THEN sum — never sum raw rationals then round.
      #
      # ESTIMATE variant — runs ONCE at finalize-estimate and is then FROZEN:
      #   over LineItems whose Surface.status == PLANNED at that instant,
      #   estimate_material_cents = sum(li.material_cost_cents)
      #   estimate_labor_cents    = sum(li.labor_cost_cents)
      #   estimate_total_cents    = estimate_material_cents + estimate_labor_cents   # never recomputed afterward
      #
      # LIVE revised total — recomputed on every approved change order:
      #   revised_total_cents = sum over non-REMOVED LineItems of (material_cost_cents + labor_cost_cents)
      #
      # FINAL variant — runs ONCE at the COMPLETED transition:
      #   final_total_cents = sum over EXECUTED LineItems of (material_cost_cents + labor_cost_cents)
    input_set: "ESTIMATE: PLANNED LineItems at finalize. LIVE: non-REMOVED LineItems now. FINAL: EXECUTED LineItems at completion."
    constants: {}
    precision: "integer cents; rounding occurs only inside per-line-item calcs"
    variants:
      - name: estimate
        when: "at finalize-estimate (DRAFT -> ESTIMATED); the value is frozen thereafter"
        difference: "Snapshot of PLANNED-surface line items; pins the contractual estimate the deposit is based on."
      - name: final
        when: "at the COMPLETED transition"
        difference: "Sums EXECUTED-surface line items; diverges from the FROZEN estimate_total_cents whenever an approved change order added/removed/revised scope after finalize."
    note: "Rule 1 dual-variant on the Project domain (frozen estimate vs live final). Rule 2 mode (b) pins round-per-line-item THEN sum. Example divergence on the rounding axis: two LIGHT line items with raw labor 4912.5 and 8187.5 round to 4913+8188=13101 (pinned), whereas sum-then-round would give round_half_up(13100.0)=13100 — a 1-cent difference."

  - name: deposit_due
    trigger: "deposit_due at finalize-estimate (then fixed); balance_due on every revised-total or payment change"
    algorithm: threshold
    formula: |
      deposit_due_cents = round_half_up( estimate_total_cents * deposit_pct / 100 )   # uses FROZEN estimate_total_cents
      balance_due_cents = revised_total_cents - amount_paid_cents                      # uses LIVE revised_total_cents
    input_set: "deposit_due: frozen estimate_total_cents and deposit_pct. balance_due: live revised_total_cents and amount_paid_cents."
    constants: {}
    precision: "round_half_up to whole cents"
    note: "deposit_due is pinned to the frozen estimate; balance_due tracks the live revised total so change orders shift the final payment without re-opening the deposit."

  - name: change_order_delta
    trigger: "ChangeOrder submit (computes prospective delta); applied on approve"
    algorithm: aggregation
    formula: |
      # Build the prospective LineItem(s) for the order's surface change, then diff against current totals.
      ADD_SURFACE:    delta = new_material_cost_cents + new_labor_cost_cents
      REMOVE_SURFACE: delta = -(target.material_cost_cents + target.labor_cost_cents)
      REVISE_SURFACE: delta = (revised_material_cost_cents + revised_labor_cost_cents)
                              - (target.material_cost_cents + target.labor_cost_cents)
      # new/revised line-item costs use material_estimate + labor_estimate over the new_* fields.
    input_set: "The target Surface (for REMOVE/REVISE) and the new_* fields (for ADD/REVISE); PaintProduct via paint_product_id"
    constants: {}
    precision: "integer cents; per-line-item rounding identical to material_estimate/labor_estimate"
    note: "On approve, delta is the exact signed change that re-derives estimate_total_cents (Rule 9 invariant: reject leaves total unchanged)."

  - name: weather_suitability
    trigger: "WeatherWindow create; read on crew-assignment create when requires_exterior_weather"
    algorithm: threshold
    formula: |
      exterior_suitable = (forecast_temp_f >= MIN_EXTERIOR_TEMP_F) AND (precipitation_pct <= MAX_EXTERIOR_PRECIP_PCT)
    input_set: "The single WeatherWindow row"
    constants:
      MIN_EXTERIOR_TEMP_F: 50
      MAX_EXTERIOR_PRECIP_PCT: 30
    precision: "boolean"
    note: "Rule 6 boundary: forecast_temp_f == 50 is suitable (>=), 49 is not."

  - name: warranty_payout
    trigger: "WarrantyClaim file (provisional) and resolve (final)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at FILED): estimate the touch-up by re-pricing 20% of the affected surface's labor:
        provisional_payout_cents = round_half_up( target_surface.line_item.labor_cost_cents * TOUCHUP_LABOR_FRACTION )
      FINAL (at RESOLVED): price the actual logged labor:
        final_payout_cents = round_half_up( logged_touchup_hours * LABOR_RATE_CENTS_PER_HOUR )
    input_set: "PROVISIONAL: the target Surface's LineItem.labor_cost_cents. FINAL: logged_touchup_hours."
    constants:
      TOUCHUP_LABOR_FRACTION: 0.20
      LABOR_RATE_CENTS_PER_HOUR: 6550
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "claim is FILED"
        difference: "Derived from the original line-item labor cost (an estimate of rework scope)."
      - name: final
        when: "claim is RESOLVED"
        difference: "Derived from actually logged touch-up hours; diverges from provisional when real rework differs from the 20% estimate."
    note: "Rule 1 dual-variant on the WarrantyClaim domain — a different entity from project_totals."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7; for entity-backed ownership the X-User-ID must match the resource's owner field"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves and belongs to its parent, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND for the path id or for a body FK that does not resolve (ERR_PROJECT_NOT_FOUND, ERR_SURFACE_NOT_FOUND, ERR_LINE_ITEM_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND, ERR_CREW_MEMBER_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND, ERR_PAINT_PRODUCT_NOT_FOUND, ERR_WEATHER_WINDOW_NOT_FOUND, ERR_COLOR_SELECTION_NOT_FOUND, ERR_CREW_ASSIGNMENT_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_WALKTHROUGH_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with a path id or a body FK (e.g. project_id, surface_id, crew_member_id, equipment_id, paint_product_id)

  - priority: 4
    category: business_constraint
    check: "Request body present, types correct, enum values legal, required fields present, numeric ranges honored (area_sqft>=1, coats 1..4, deposit_pct 0..100, precipitation_pct 0..100, amount_cents>=1, end_date>=start_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "varies (ERR_PROJECT_NOT_DRAFT, ERR_PROJECT_NOT_ESTIMATED, ERR_PROJECT_NOT_SCHEDULED, ERR_PROJECT_NOT_IN_PROGRESS, ERR_PROJECT_NOT_IN_WALKTHROUGH, ERR_CHANGE_ORDER_NOT_DRAFT, ERR_CHANGE_ORDER_NOT_SUBMITTED, ERR_CHANGE_ORDER_NOT_REJECTED, ERR_WALKTHROUGH_NOT_PENDING, ERR_WALKTHROUGH_NOT_FAILED, ERR_ASSIGNMENT_NOT_SCHEDULED, ERR_ASSIGNMENT_NOT_IN_PROGRESS, ERR_ASSIGNMENT_NOT_CANCELLABLE, ERR_CLAIM_NOT_FILED, ERR_CLAIM_NOT_APPROVED, ERR_COLOR_NOT_PROPOSED, ERR_SURFACE_NOT_PLANNED, ERR_DEPOSIT_ALREADY_PAID, ERR_FINAL_BEFORE_DEPOSIT)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_project_version on change-order create matches current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /painting/change-orders"

  - priority: 7
    category: business_referential
    check: "Surface product compatibility: PaintProduct.surface_kind admits the Surface.surface_kind (BOTH admits either; INTERIOR product only on INTERIOR surface; EXTERIOR product only on EXTERIOR surface); and Surface.surface_kind is compatible with Project.scope"
    error_id: ERR_PRODUCT_SURFACE_MISMATCH
    http_status: 422
    applies_to: "POST surfaces, change-order surface mutations"

  - priority: 8
    category: business_constraint
    check: "Crew skill adequacy: CrewMember.skill_level meets the minimum for the project's heaviest PLANNED prep_level (RESTORATION needs MASTER; HEAVY needs JOURNEYMAN+; LIGHT/STANDARD any)"
    error_id: ERR_CREW_SKILL_INSUFFICIENT
    http_status: 422
    applies_to: "POST crew-assignments"

  - priority: 9
    category: business_temporal
    check: "CrewMember double-booking: assignment [start_date,end_date] must not overlap another SCHEDULED/IN_PROGRESS assignment of the same CrewMember, AND must leave a >=1-day buffer gap (back-to-back days for the same member are rejected)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST crew-assignments"

  - priority: 10
    category: business_temporal
    check: "Equipment capacity: across SCHEDULED/IN_PROGRESS assignments holding the same equipment_id, the peak count of date-overlapping assignments must not exceed Equipment.total_units (aggregate capacity; adjacency allowed — closed intervals, no buffer)"
    error_id: ERR_EQUIPMENT_OVERBOOKED
    http_status: 409
    applies_to: "POST crew-assignments"

  - priority: 11
    category: business_safety
    check: "Exterior weather: when requires_exterior_weather is true, every date in [start_date,end_date] must have a WeatherWindow with exterior_suitable==true"
    error_id: ERR_WEATHER_UNSUITABLE
    http_status: 422
    applies_to: "POST crew-assignments"

  - priority: 12
    category: business_fiscal
    check: "Deposit/final payment amount must equal the due figure (deposit_due_cents for DEPOSIT, balance_due_cents for FINAL)"
    error_id: "varies (ERR_DEPOSIT_AMOUNT_MISMATCH, ERR_FINAL_AMOUNT_MISMATCH)"
    http_status: 402
    applies_to: "POST payments"

  - priority: 13
    category: state
    check: "Warranty claim filing requires the parent Project.workflow_status == COMPLETED (checked before the warranty-window temporal check below)"
    error_id: ERR_PROJECT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST warranty-claims"

  - priority: 14
    category: business_temporal
    check: "Warranty window: filed_at must be <= Project.warranty_expires_at (inclusive at the exact expiry instant; one ms later is rejected)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST warranty-claims"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- PaintProduct ----------
  - method: POST
    path: "/painting/paint-products"
    description: "Create a paint product catalog entry"
    roles: [Estimator]
    code: 201
    input: [name, surface_kind, finish_type, price_per_gallon_cents, coverage_sqft_per_gallon_per_coat, "active?"]
    output: PaintProduct
    side_effects: []
  - method: GET
    path: "/painting/paint-products"
    description: "List paint products; optionally filter by surface_kind"
    roles: [Estimator, ProjectManager, Customer, CrewMember]
    code: 200
    input: ["surface_kind?", "limit?", "offset?"]
    output: PaintProduct[]
    side_effects: []
  - method: GET
    path: "/painting/paint-products/{paintProductId}"
    description: "Get a paint product"
    roles: [Estimator, ProjectManager, Customer, CrewMember]
    code: 200
    input: []
    output: PaintProduct
    side_effects: []

  # ---------- CrewMember ----------
  - method: POST
    path: "/painting/crew-members"
    description: "Create a crew member"
    roles: [ProjectManager]
    code: 201
    input: [full_name, skill_level, daily_rate_cents, "active?"]
    output: CrewMember
    side_effects: ["scheduled_day_count initialized to 0"]
  - method: GET
    path: "/painting/crew-members"
    description: "List crew members"
    roles: [ProjectManager, Estimator]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewMember[]
    side_effects: []
  - method: GET
    path: "/painting/crew-members/{crewMemberId}"
    description: "Get a crew member (includes scheduled_day_count)"
    roles: [ProjectManager, Estimator]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ---------- Equipment ----------
  - method: POST
    path: "/painting/equipment"
    description: "Create a shared equipment resource"
    roles: [ProjectManager]
    code: 201
    input: [name, equipment_kind, total_units]
    output: Equipment
    side_effects: ["units_reserved initialized to 0"]
  - method: GET
    path: "/painting/equipment"
    description: "List equipment"
    roles: [ProjectManager, Estimator]
    code: 200
    input: ["limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: GET
    path: "/painting/equipment/{equipmentId}"
    description: "Get an equipment resource (includes units_reserved)"
    roles: [ProjectManager, Estimator]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  # ---------- WeatherWindow ----------
  - method: POST
    path: "/painting/weather-windows"
    description: "Record a daily weather forecast (computes exterior_suitable)"
    roles: [ProjectManager]
    code: 201
    input: [window_date, forecast_temp_f, precipitation_pct]
    output: WeatherWindow
    side_effects: ["exterior_suitable computed (calc weather_suitability)"]
  - method: GET
    path: "/painting/weather-windows"
    description: "List weather windows; optionally filter by date"
    roles: [ProjectManager, Estimator, CrewMember]
    code: 200
    input: ["window_date?", "limit?", "offset?"]
    output: WeatherWindow[]
    side_effects: []
  - method: GET
    path: "/painting/weather-windows/{weatherWindowId}"
    description: "Get a weather window"
    roles: [ProjectManager, Estimator, CrewMember]
    code: 200
    input: []
    output: WeatherWindow
    side_effects: []

  # ---------- Project ----------
  - method: POST
    path: "/painting/projects"
    description: "Create a painting project in DRAFT/UNPAID"
    roles: [Estimator]
    code: 201
    input: [customer_id, site_address, scope, "deposit_pct?", "warranty_months?"]
    output: Project
    side_effects: ["workflow_status=DRAFT, payment_status=UNPAID, all computed totals 0, version=1"]
  - method: GET
    path: "/painting/projects"
    description: "List projects; optionally filter by customer_id"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/painting/projects/{projectId}"
    description: "Get a project (all computed totals and both status axes)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/painting/projects/{projectId}/finalize-estimate"
    description: "Finalize the estimate: recompute all line items, FREEZE the estimate, DRAFT->ESTIMATED"
    roles: [Estimator]
    code: 200
    input: []
    output: Project
    side_effects: ["recompute LineItems", "freeze estimate_total_cents; set revised_total_cents", "set deposit_due/balance", "workflow_status->ESTIMATED", "version+=1"]
  - method: POST
    path: "/painting/projects/{projectId}/schedule"
    description: "Move ESTIMATED->SCHEDULED (deposit paid, colors approved, crew scheduled)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["workflow_status->SCHEDULED", "version+=1"]
  - method: POST
    path: "/painting/projects/{projectId}/start-work"
    description: "Move SCHEDULED->IN_PROGRESS"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["workflow_status->IN_PROGRESS", "version+=1"]
  - method: POST
    path: "/painting/projects/{projectId}/request-walkthrough"
    description: "Move IN_PROGRESS->WALKTHROUGH_PENDING; mark surfaces EXECUTED; open a PENDING Walkthrough"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["non-REMOVED Surfaces->EXECUTED", "create PENDING Walkthrough", "workflow_status->WALKTHROUGH_PENDING", "version+=1"]
  - method: POST
    path: "/painting/projects/{projectId}/cancel"
    description: "Cancel a DRAFT/ESTIMATED/SCHEDULED project; refund payments; release crew/equipment"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["cascade CrewAssignments->CANCELLED", "Payments->REFUNDED", "workflow_status->CANCELLED", "version+=1"]

  # ---------- Surface ----------
  - method: POST
    path: "/painting/surfaces"
    description: "Add a PLANNED surface to a project; auto-creates its LineItem and computes material/labor estimate"
    roles: [Estimator]
    code: 201
    input: [project_id, label, surface_kind, area_sqft, coats, prep_level, paint_product_id]
    output: Surface
    side_effects: ["create LineItem; compute material_estimate, labor_estimate", "status=PLANNED, color_locked=false"]
  - method: GET
    path: "/painting/surfaces"
    description: "List surfaces; filter by project_id, paint_product_id, or status (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "paint_product_id?", "status?", "limit?", "offset?"]
    output: Surface[]
    side_effects: []
  - method: GET
    path: "/painting/surfaces/{surfaceId}"
    description: "Get a surface"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: Surface
    side_effects: []

  # ---------- LineItem (computed, read-only) ----------
  - method: GET
    path: "/painting/line-items"
    description: "List line items; filter by project_id or surface_id (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "surface_id?", "limit?", "offset?"]
    output: LineItem[]
    side_effects: []
  - method: GET
    path: "/painting/line-items/{lineItemId}"
    description: "Get a line item"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: LineItem
    side_effects: []

  # ---------- ColorSelection ----------
  - method: POST
    path: "/painting/color-selections"
    description: "Propose a color for a surface"
    roles: [Estimator, Customer]
    code: 201
    input: [surface_id, color_code]
    output: ColorSelection
    side_effects: ["status=PROPOSED; project_id derived from surface"]
  - method: GET
    path: "/painting/color-selections"
    description: "List color selections; filter by project_id or surface_id (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "surface_id?", "limit?", "offset?"]
    output: ColorSelection[]
    side_effects: []
  - method: GET
    path: "/painting/color-selections/{colorSelectionId}"
    description: "Get a color selection"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: ColorSelection
    side_effects: []
  - method: POST
    path: "/painting/color-selections/{colorSelectionId}/approve"
    description: "Customer approves a proposed color; locks the surface color"
    roles: [Customer]
    code: 200
    input: []
    output: ColorSelection
    side_effects: ["status->APPROVED; parent Surface.color_locked->true"]
  - method: POST
    path: "/painting/color-selections/{colorSelectionId}/reject"
    description: "Customer rejects a proposed color"
    roles: [Customer]
    code: 200
    input: []
    output: ColorSelection
    side_effects: ["status->REJECTED"]

  # ---------- ChangeOrder (OCC on create) ----------
  - method: POST
    path: "/painting/change-orders"
    description: "Author a change order against the project's current version (OCC)"
    roles: [Estimator]
    code: 201
    input: [project_id, expected_project_version, reason, action, "target_surface_id?", "new_label?", "new_surface_kind?", "new_area_sqft?", "new_coats?", "new_prep_level?", "new_paint_product_id?"]
    output: ChangeOrder
    side_effects: ["status=DRAFT, delta_total_cents=0", "validate expected_project_version == Project.version else ERR_STALE_PROJECT_VERSION"]
  - method: GET
    path: "/painting/change-orders"
    description: "List change orders; filter by project_id, target_surface_id, new_paint_product_id, status (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "target_surface_id?", "new_paint_product_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/painting/change-orders/{changeOrderId}"
    description: "Get a change order"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/painting/change-orders/{changeOrderId}/submit"
    description: "Submit a DRAFT change order (computes delta_total_cents)"
    roles: [Estimator]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["compute delta_total_cents (calc change_order_delta)", "status->SUBMITTED"]
  - method: POST
    path: "/painting/change-orders/{changeOrderId}/approve"
    description: "Customer approves; applies surface mutation and re-prices the live revised total (depth>=3 cascade)"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["apply surface mutation", "recompute LineItems and revised_total_cents", "recompute balance_due_cents", "applied_project_version set; Project.version+=1", "status->APPROVED"]
  - method: POST
    path: "/painting/change-orders/{changeOrderId}/reject"
    description: "Customer rejects a submitted change order (no totals change — Rule 9 invariant)"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status->REJECTED"]
  - method: POST
    path: "/painting/change-orders/{changeOrderId}/revise"
    description: "Estimator revises a rejected order back to DRAFT (cyclic loop)"
    roles: [Estimator]
    code: 200
    input: ["reason?", "action?", "target_surface_id?", "new_label?", "new_surface_kind?", "new_area_sqft?", "new_coats?", "new_prep_level?", "new_paint_product_id?"]
    output: ChangeOrder
    side_effects: ["overwrite editable fields", "delta_total_cents=0", "status->DRAFT"]

  # ---------- CrewAssignment ----------
  - method: POST
    path: "/painting/crew-assignments"
    description: "Schedule a crew member (and optional equipment) for a date window on a project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, crew_member_id, "equipment_id?", start_date, end_date, "requires_exterior_weather?"]
    output: CrewAssignment
    side_effects: ["status=SCHEDULED; compute day_count", "CrewMember.scheduled_day_count += day_count", "if equipment_id: Equipment.units_reserved reflects new peak overlap", "validations: skill, double-booking buffer, equipment capacity, weather"]
  - method: GET
    path: "/painting/crew-assignments"
    description: "List crew assignments; filter by project_id, crew_member_id, equipment_id, status (FK reverse-reachability)"
    roles: [ProjectManager, Estimator, CrewMember]
    code: 200
    input: ["project_id?", "crew_member_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/painting/crew-assignments/{assignmentId}"
    description: "Get a crew assignment"
    roles: [ProjectManager, Estimator, CrewMember]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/painting/crew-assignments/{assignmentId}/begin"
    description: "Crew begins work (project must be IN_PROGRESS — cross-entity guard)"
    roles: [CrewMember]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status->IN_PROGRESS"]
  - method: POST
    path: "/painting/crew-assignments/{assignmentId}/complete"
    description: "Crew completes work"
    roles: [CrewMember]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status->DONE; release scheduled_day_count and units_reserved"]
  - method: POST
    path: "/painting/crew-assignments/{assignmentId}/cancel"
    description: "Cancel an assignment; release crew/equipment (compensating — Rule 9)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status->CANCELLED", "CrewMember.scheduled_day_count -= day_count", "Equipment.units_reserved released"]

  # ---------- Payment (append-only) ----------
  - method: POST
    path: "/painting/payments"
    description: "Record a deposit or final payment (drives payment_status axis)"
    roles: [Customer]
    code: 201
    input: [project_id, kind, amount_cents]
    output: Payment
    side_effects: ["insert Payment CAPTURED", "amount_paid_cents/balance recomputed", "payment_status axis advances (DEPOSIT->DEPOSIT_PAID, FINAL->PAID_IN_FULL)"]
  - method: GET
    path: "/painting/payments"
    description: "List payments; filter by project_id or kind (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "kind?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/painting/payments/{paymentId}"
    description: "Get a payment"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---------- Walkthrough ----------
  - method: GET
    path: "/painting/walkthroughs"
    description: "List walkthroughs; filter by project_id or status (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Walkthrough[]
    side_effects: []
  - method: GET
    path: "/painting/walkthroughs/{walkthroughId}"
    description: "Get a walkthrough"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: Walkthrough
    side_effects: []
  - method: POST
    path: "/painting/walkthroughs/{walkthroughId}/pass"
    description: "Customer passes the walkthrough (cascades to COMPLETED iff paid in full)"
    roles: [Customer]
    code: 200
    input: []
    output: Walkthrough
    side_effects: ["status->PASSED", "if PAID_IN_FULL: cascade Project->COMPLETED (final_total_cents, warranty_expires_at)"]
  - method: POST
    path: "/painting/walkthroughs/{walkthroughId}/fail"
    description: "Customer fails the walkthrough (punch list outstanding)"
    roles: [Customer]
    code: 200
    input: []
    output: Walkthrough
    side_effects: ["status->FAILED"]
  - method: POST
    path: "/painting/walkthroughs/{walkthroughId}/reopen"
    description: "PM reopens a failed walkthrough after punch-list fixes"
    roles: [ProjectManager]
    code: 200
    input: ["punch_list_count?"]
    output: Walkthrough
    side_effects: ["punch_list_count reset", "status->PENDING"]

  # ---------- WarrantyClaim ----------
  - method: POST
    path: "/painting/warranty-claims"
    description: "File a touch-up warranty claim on a completed project within the warranty window"
    roles: [Customer]
    code: 201
    input: [project_id, surface_id, description, filed_at]
    output: WarrantyClaim
    side_effects: ["precondition Project.workflow_status==COMPLETED (ERR_PROJECT_NOT_COMPLETED) then filed_at<=warranty_expires_at (ERR_WARRANTY_EXPIRED)", "status=FILED; compute provisional_payout_cents (calc warranty_payout PROVISIONAL)"]
  - method: GET
    path: "/painting/warranty-claims"
    description: "List warranty claims; filter by project_id, surface_id, status (FK reverse-reachability)"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: ["project_id?", "surface_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/painting/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [Estimator, ProjectManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/painting/warranty-claims/{claimId}/approve"
    description: "PM approves a filed claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status->APPROVED"]
  - method: POST
    path: "/painting/warranty-claims/{claimId}/deny"
    description: "PM denies a filed claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status->DENIED"]
  - method: POST
    path: "/painting/warranty-claims/{claimId}/resolve"
    description: "PM resolves an approved claim with logged touch-up hours (final payout)"
    roles: [ProjectManager]
    code: 200
    input: [logged_touchup_hours]
    output: WarrantyClaim
    side_effects: ["compute final_payout_cents (calc warranty_payout FINAL)", "status->RESOLVED"]

  # ---------- Test-driving clock endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: pin the server clock used for completion timestamps and warranty_expires_at"
    roles: [ProjectManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server now() returns to_iso8601 until next set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for the endpoint, or entity-backed owner mismatch" }
  # --- existence ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "projectId does not resolve" }
  - { id: ERR_SURFACE_NOT_FOUND, http: 404, condition: "surfaceId does not resolve under the project" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "lineItemId does not resolve under the project" }
  - { id: ERR_COLOR_SELECTION_NOT_FOUND, http: 404, condition: "colorSelectionId does not resolve under the project" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "changeOrderId does not resolve under the project" }
  - { id: ERR_CREW_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId does not resolve under the project" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "paymentId does not resolve under the project" }
  - { id: ERR_WALKTHROUGH_NOT_FOUND, http: 404, condition: "walkthroughId does not resolve under the project" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "claimId does not resolve under the project" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "crew_member_id does not resolve" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "equipment_id does not resolve" }
  - { id: ERR_PAINT_PRODUCT_NOT_FOUND, http: 404, condition: "paint_product_id does not resolve" }
  - { id: ERR_WEATHER_WINDOW_NOT_FOUND, http: 404, condition: "weatherWindowId does not resolve" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid required field, bad enum, out-of-range numeric, or end_date < start_date" }
  # --- project state ---
  - { id: ERR_PROJECT_NOT_DRAFT, http: 409, condition: "finalize-estimate requires DRAFT" }
  - { id: ERR_NO_SURFACES, http: 409, condition: "finalize-estimate requires >=1 PLANNED surface" }
  - { id: ERR_PROJECT_NOT_ESTIMATED, http: 409, condition: "schedule or deposit requires ESTIMATED" }
  - { id: ERR_DEPOSIT_NOT_PAID, http: 409, condition: "schedule requires payment_status DEPOSIT_PAID or PAID_IN_FULL" }
  - { id: ERR_COLOR_NOT_APPROVED, http: 409, condition: "schedule requires every PLANNED surface to have an APPROVED ColorSelection" }
  - { id: ERR_NO_CREW_SCHEDULED, http: 409, condition: "schedule requires >=1 SCHEDULED CrewAssignment" }
  - { id: ERR_PROJECT_NOT_SCHEDULED, http: 409, condition: "start-work requires SCHEDULED" }
  - { id: ERR_PROJECT_NOT_IN_PROGRESS, http: 409, condition: "request-walkthrough or crew begin requires IN_PROGRESS" }
  - { id: ERR_CREW_NOT_DONE, http: 409, condition: "request-walkthrough requires every CrewAssignment DONE or CANCELLED" }
  - { id: ERR_PROJECT_NOT_IN_WALKTHROUGH, http: 409, condition: "final payment or pass requires WALKTHROUGH_PENDING" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "completion requires PAID_IN_FULL" }
  - { id: ERR_PROJECT_NOT_CANCELLABLE, http: 409, condition: "cancel requires DRAFT/ESTIMATED/SCHEDULED" }
  - { id: ERR_PROJECT_NOT_CHANGEABLE, http: 409, condition: "change-order submit/approve requires project ESTIMATED/SCHEDULED/IN_PROGRESS" }
  # --- payment state/fiscal ---
  - { id: ERR_DEPOSIT_ALREADY_PAID, http: 409, condition: "DEPOSIT payment when payment_status != UNPAID" }
  - { id: ERR_FINAL_BEFORE_DEPOSIT, http: 409, condition: "FINAL payment when payment_status != DEPOSIT_PAID" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 402, condition: "DEPOSIT amount_cents != deposit_due_cents" }
  - { id: ERR_FINAL_AMOUNT_MISMATCH, http: 402, condition: "FINAL amount_cents != balance_due_cents" }
  # --- change order state ---
  - { id: ERR_CHANGE_ORDER_NOT_DRAFT, http: 409, condition: "submit requires DRAFT" }
  - { id: ERR_CHANGE_ORDER_NOT_SUBMITTED, http: 409, condition: "approve/reject requires SUBMITTED" }
  - { id: ERR_CHANGE_ORDER_NOT_REJECTED, http: 409, condition: "revise requires REJECTED" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "change-order create expected_project_version != Project.version" }
  # --- color/surface state ---
  - { id: ERR_COLOR_NOT_PROPOSED, http: 409, condition: "approve/reject color requires PROPOSED" }
  - { id: ERR_SURFACE_NOT_PLANNED, http: 409, condition: "color approve requires parent Surface PLANNED" }
  - { id: ERR_PRODUCT_SURFACE_MISMATCH, http: 422, condition: "PaintProduct.surface_kind incompatible with surface, or surface incompatible with Project.scope" }
  # --- crew/equipment/weather ---
  - { id: ERR_ASSIGNMENT_NOT_SCHEDULED, http: 409, condition: "begin requires SCHEDULED" }
  - { id: ERR_ASSIGNMENT_NOT_IN_PROGRESS, http: 409, condition: "complete requires IN_PROGRESS" }
  - { id: ERR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires SCHEDULED or IN_PROGRESS" }
  - { id: ERR_CREW_SKILL_INSUFFICIENT, http: 422, condition: "crew skill below the project's heaviest prep_level requirement" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "assignment window overlaps or is back-to-back (no buffer) with another SCHEDULED/IN_PROGRESS assignment of the same crew member" }
  - { id: ERR_EQUIPMENT_OVERBOOKED, http: 409, condition: "equipment peak overlap would exceed total_units" }
  - { id: ERR_WEATHER_UNSUITABLE, http: 422, condition: "requires_exterior_weather and a date in the window has no exterior_suitable WeatherWindow" }
  # --- walkthrough/warranty state ---
  - { id: ERR_WALKTHROUGH_NOT_PENDING, http: 409, condition: "pass/fail requires PENDING" }
  - { id: ERR_WALKTHROUGH_NOT_FAILED, http: 409, condition: "reopen requires FAILED" }
  - { id: ERR_PUNCH_LIST_OPEN, http: 409, condition: "pass requires punch_list_count == 0" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "approve/deny requires FILED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "resolve requires APPROVED" }
  - { id: ERR_TOUCHUP_HOURS_REQUIRED, http: 422, condition: "resolve requires logged_touchup_hours >= 0" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "warranty claim filed_at is after Project.warranty_expires_at" }
  - { id: ERR_PROJECT_NOT_COMPLETED, http: 409, condition: "warranty claim requires Project COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Estimator
    description: "Authors scope: products, projects, surfaces, line items, color proposals, estimates, and change orders."
    identity: opaque
    exclusive_operations:
      - "POST /painting/paint-products"
      - "POST /painting/projects"
      - "POST /painting/surfaces"
      - "POST /painting/projects/{id}/finalize-estimate"
      - "POST /painting/change-orders"
      - "POST /painting/change-orders/{id}/submit"
      - "POST /painting/change-orders/{id}/revise"
    shared_operations:
      - "POST /painting/color-selections (shared with Customer)"
      - "GET endpoints (paint-products, projects, surfaces, line-items, color-selections, change-orders, crew-assignments, payments, walkthroughs, warranty-claims, weather-windows, crew-members, equipment)"

  - name: ProjectManager
    description: "Runs the project lifecycle, crew/equipment/weather logistics, walkthrough reopen, and warranty resolution."
    identity: opaque
    exclusive_operations:
      - "POST /painting/crew-members, POST /painting/equipment, POST /painting/weather-windows"
      - "POST /painting/projects/{id}/schedule, /start-work, /request-walkthrough, /cancel"
      - "POST /painting/crew-assignments"
      - "POST /painting/crew-assignments/{id}/cancel"
      - "POST /painting/walkthroughs/{id}/reopen"
      - "POST /painting/warranty-claims/{id}/approve, /deny, /resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"

  - name: Customer
    description: "The homeowner: approves colors, pays deposit/final, approves/rejects change orders, runs walkthroughs, files warranty claims."
    identity: opaque
    exclusive_operations:
      - "POST /painting/payments"
      - "POST /painting/change-orders/{id}/approve, /reject"
      - "POST /painting/color-selections/{id}/approve, /reject"
      - "POST /painting/walkthroughs/{id}/pass, /fail"
      - "POST /painting/warranty-claims"
    shared_operations:
      - "POST /painting/color-selections (shared with Estimator)"
      - "GET endpoints across all resources"

  - name: CrewMember
    description: "Field painter who reports assignment progress."
    identity: opaque
    exclusive_operations:
      - "POST /painting/crew-assignments/{id}/begin"
      - "POST /painting/crew-assignments/{id}/complete"
    shared_operations:
      - "GET endpoints (paint-products, weather-windows, crew-assignments)"
