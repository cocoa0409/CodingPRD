# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Hospital Laundry & Linen Distribution
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Facility.fields.monthly_cap_cents
          - entities.Facility.fields.surge_posture
          - entities.Facility.fields.credit_balance_cents
        distinguishing_aspect: "Omitting optional monthly_cap_cents yields null; computed fields initialize to NORMAL / 0 / version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "GET /facilities/${fac}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { cap: $.data.monthly_cap_cents, posture: $.data.surge_posture, bal: $.data.credit_balance_cents, v: $.data.version } }
          assert:
            - "monthly_cap_cents == null (default)"
            - "surge_posture == NORMAL and credit_balance_cents == 0"
            - "version == 1 and id is a server-minted UUID"

      - name: create_unit_with_invalid_tier_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.unit_tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Enum closure: unit_tier outside {CRITICAL, STANDARD} is rejected at priority 5."
        test_recipe:
          setup: ["one facility"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "4 West", unit_tier: "WARD" }, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: create_stock_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.LinenStock.fields.sku
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "sku is source:input with no default — omitting it is a 400, not a system-generated value."
        test_recipe:
          setup: ["one facility"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: get_cart_run_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["one facility (database otherwise empty of cart runs)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "GET /cart-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: create_facility_extra_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Facility.fields.surge_posture
          - entities.Facility.fields.credit_balance_cents
        distinguishing_aspect: "Client-supplied values for computed fields are ignored; server-computed defaults win."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25, surge_posture: "SURGE", credit_balance_cents: 999 }, as: LinenManager, as_user_id: "lm-1", captures: { posture: $.data.surge_posture, bal: $.data.credit_balance_cents } }
          assert:
            - "response surge_posture == NORMAL and credit_balance_cents == 0 (client input ignored)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_completed_run_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CartExchangeRun.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete is only valid from SCHEDULED; a second complete from COMPLETED fails with ERR_INVALID_STATE and applies no side effects twice."
        test_recipe:
          setup: ["facility, unit ICU, stock S1 par 20; run r1 completed once"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
          trigger:
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ParLevel.${p1}.on_hand == 20 (restock not applied twice)"

      - name: dispute_reconciled_run_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CartExchangeRun
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "RECONCILED is terminal for CartExchangeRun: dispute from RECONCILED fails with ERR_ALREADY_TERMINAL (distinct from ERR_INVALID_STATE)."
        test_recipe:
          setup: ["facility, unit, stock, par; run r1 completed and reconciled"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
          trigger:
            - { call: "POST /cart-runs/${r1}/dispute", payload: {}, as: UnitClerk, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL and http status 409"

      - name: settle_provisional_invoice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.VendorInvoice.FINALIZED_to_SETTLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "settle requires FINALIZED; from PROVISIONAL it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["facility, unit, stock, par; manifest m1 RETURNED; invoice PROVISIONAL over m1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r1}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/settle", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "VendorInvoice.${inv}.status == PROVISIONAL"

      - name: verify_rejected_complaint_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Complaint
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "REJECTED is terminal for Complaint; verify afterwards fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["facility, unit, stock, par, reconciled manifest m1; complaint c1 OPEN then REJECTED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r1}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 2 }, as: UnitClerk, as_user_id: "${u1}", captures: { c1: $.data.id } }
            - { call: "POST /complaints/${c1}/reject", payload: {}, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "POST /complaints/${c1}/verify", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"

      - name: close_closed_surge_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SurgeEvent
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CLOSED is terminal for SurgeEvent; a second close fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["facility; surge sg1 activated then closed"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_1", par_multiplier: 1.5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg1: $.data.id } }
            - { call: "POST /surge-events/${sg1}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /surge-events/${sg1}/close", payload: {}, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "POST /surge-events/${sg1}/close", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "Facility.${fac}.surge_posture == NORMAL (unchanged by the rejected close)"

      - name: manifest_return_applies_counts_and_status
        claim_type: valid_transition
        grounds:
          - state_machines.SoiledManifest.DISPATCHED_to_RETURNED
        distinguishing_aspect: "Happy-path return: status RETURNED, circulation += pieces, wash cycles += pieces, in_wash decremented by pieces + condemned + lost."
        test_recipe:
          setup: ["facility, unit, stock S1 par 20; fill run; collection run soiled 8; manifest m1 16.00 lbs (expected 8)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1", captures: { st: $.data.status } }
            - { call: "GET /linen-stocks/${s1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { circ: $.data.in_circulation, wash: $.data.in_wash, cyc: $.data.wash_cycles_completed } }
          assert:
            - "status == RETURNED"
            - "LinenStock.${s1}: in_circulation == 79 (72 + 7), in_wash == 0, wash_cycles_completed == 7"

      - name: complaint_auto_resolved_on_manifest_reconcile
        claim_type: side_effect_execution
        grounds:
          - state_machines.Complaint.VERIFIED_to_RESOLVED
          - state_machines.SoiledManifest.RETURNED_to_RECONCILED
        distinguishing_aspect: "System auto-transition: reconciling the linked manifest flips VERIFIED complaints to RESOLVED with no complaint endpoint call."
        test_recipe:
          setup: ["facility, unit, stock, par; manifest m1 RETURNED (7 of 8); verified complaint c1 on m1 (credit routed to facility credit balance since no invoice)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
