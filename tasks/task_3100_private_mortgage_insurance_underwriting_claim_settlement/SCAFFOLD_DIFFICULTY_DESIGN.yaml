            - "Loan.${loan_id}.delinquency_streak == 0 once the 2026-02 report is Class B, since a Class-B report terminates the streak"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # Two invariants over DIFFERENT conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancellation_preserves_the_loan_premium_schedule_total
        grounds:
          - calculations.premium_schedule_invariant
          - state_machines.Loan.ACTIVE_to_PENDING_CANCELLATION
          - entities.Loan.fields.annual_premium_cents
          - entities.CancellationNotice.fields.refund_cents
        distinguishing_aspect: "The conserved quantity is the loan's premium schedule total: filing a borrower-request cancellation and letting it take effect must leave the sum of paid, billed and voided instalments equal to the 52700-cent annual premium, so the refund moves value out of the schedule without changing the total and any drift is a violation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated BPM loan whose annual premium is 52700 cents, billed as eleven periods of 4392 and a final period of 4388."
