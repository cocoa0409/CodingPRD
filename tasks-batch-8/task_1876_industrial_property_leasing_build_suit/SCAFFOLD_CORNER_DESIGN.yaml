# =============================================================================
# Task 1876 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: requirement_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.TenantRequirement.fields.use_type, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "use_type has source input and no default — omitting it must fail with ERR_INVALID_REQUEST (400) before any state logic."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"

      - name: site_create_invalid_enum_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Site.fields.parcel_type, "errors[ERR_INVALID_ENUM]", "validations[priority=6]"]
        distinguishing_aspect: "parcel_type is enum {EXISTING, LAND_BANK}; the undeclared member 'SWAMP' must fail with ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { site_name: "Swamp Parcel", submarket: "High Desert", parcel_type: SWAMP, total_sf: 500000, clear_height_ft: 0, dock_doors: 0, power_amps: 0, yard_depth_ft: 0, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 2.00 }, as: LeasingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_ENUM and HTTP status 400"

      - name: site_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Site.fields.status, "validations[priority=5]"]
        distinguishing_aspect: "Client-supplied id/version/status on create are ignored: server mints a UUID id, sets version 1, status LISTED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { id: "00000000-0000-0000-0000-000000000099", version: 99, status: LEASED, site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id, site_v: $.data.version, site_status: $.data.status } }
          assert:
            - "site_id != '00000000-0000-0000-0000-000000000099' (server-minted UUID)"
            - "site_v == 1 and site_status == LISTED (client status input ignored)"

      - name: requirement_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404), not a 500 or empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/tenant-requirements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LeasingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"

      - name: site_available_sf_defaults_on_create
        claim_type: computed_fields
        grounds: [entities.Site.fields.available_sf, entities.Site.fields.reserved_sf]
        distinguishing_aspect: "Computed inventory fields initialize from total_sf: reserved_sf 0, available_sf == total_sf, status LISTED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { avail: $.data.available_sf, resv: $.data.reserved_sf, st: $.data.status } }
          assert:
            - "avail == 200000 and resv == 0 and st == LISTED"

      - name: sites_list_pagination_and_submarket_filter
        claim_type: listing
        grounds: [endpoints.GET_/api/sites, response_envelope]
        distinguishing_aspect: "Filter + paginate interact: submarket filter yields total_count 2; limit=1 page 0 has has_more true, page 1 has has_more false."
        test_recipe:
          setup: ["two Inland Empire sites and one Antelope Valley site exist"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager }
            - { call: "POST /api/sites", payload: { site_name: "Summit Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 150000, clear_height_ft: 32, dock_doors: 16, power_amps: 3000, yard_depth_ft: 150, zoning_designation: "M-1", environmental_phase: PHASE_II_REQUIRED, asking_rate_psf: 5.50 }, as: LeasingManager }
            - { call: "POST /api/sites", payload: { site_name: "Pacific BTS Site", submarket: "Antelope Valley", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-2", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 13.20 }, as: LeasingManager }
          trigger:
            - { call: "GET /api/sites?submarket=Inland%20Empire&limit=1&offset=0", as: TenantRep, as_user_id: rep-001 }
            - { call: "GET /api/sites?submarket=Inland%20Empire&limit=1&offset=1", as: TenantRep, as_user_id: rep-001 }
          assert:
            - "page 0 (limit=1, offset=0): total_count == 2, has_more == true, exactly 1 element with submarket == 'Inland Empire'"
            - "page 1 (limit=1, offset=1): total_count == 2, has_more == false, exactly 1 element"

  - section: state_machines
    instances:
      - name: requirement_initial_state_active
        claim_type: initial_state
        grounds: [state_machines.TenantRequirement]
        distinguishing_aspect: "Newly created TenantRequirement starts ACTIVE (there is no DRAFT state for requirements)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { st: $.data.status } }
          assert:
            - "st == ACTIVE"

      - name: requirement_withdraw_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TenantRequirement.ACTIVE_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: the second withdraw is rejected and no cascade re-fires."
        test_recipe:
          setup: ["REQ_A exists ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/tenant-requirements/${req_id}/withdraw", as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/tenant-requirements/${req_id}/withdraw", as: TenantRep, as_user_id: rep-001, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status 409"

      - name: counter_rejected_loi_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LOI.SUBMITTED_to_REJECTED, state_machines.LOI.SUBMITTED_to_COUNTERED]
        distinguishing_aspect: "REJECTED is terminal: countering a rejected LOI fails with ERR_INVALID_STATE even though SUBMITTED->COUNTERED exists for live LOIs."
        test_recipe:
          setup: ["LOI_A SUBMITTED on toured SITE_A, then rejected by LeasingManager"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001, captures: { loi_v2: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/reject", as: LeasingManager }
          trigger:
            - { call: "POST /api/lois/${loi_id}/counter", payload: { expected_loi_version: "${loi_v2}", base_rate_psf: 7.50, ti_allowance_psf: 12.00, free_rent_months: 6, escalation_pct: 0.03 }, as: LeasingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status 409"

      - name: tour_confirm_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Tour.REQUESTED_to_CANCELLED, state_machines.Tour.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "CANCELLED is terminal for tours: confirm after cancel fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["tour REQUESTED then cancelled by its rep"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/cancel", as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status 409"

      - name: milestone_complete_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.DeliveryMilestone.PENDING_to_COMPLETE]
        distinguishing_aspect: "COMPLETE is terminal for milestones: the same complete trigger twice fails the second time (ERR_INVALID_STATE); no double bubble-up fires."
        test_recipe:
          setup: ["EXECUTED LOI_B on SITE_B; plan exists SCHEMATIC; one SHELL milestone PENDING"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Bolt Manufacturing", use_type: MANUFACTURING, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Antelope Valley", required_delivery_date: "2027-06-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Pacific BTS Site", submarket: "Antelope Valley", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-2", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 13.20 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-11T10:00:00Z", end_at: "2026-08-11T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 12.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager }
            - { call: "GET /api/bts-plans?loi_id=${loi_id}", as: ProjectManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/delivery-milestones", payload: { plan_id: "${plan_id}", milestone_type: SHELL, planned_date: "2027-02-01T00:00:00Z" }, as: ProjectManager, captures: { ms_id: $.data.id } }
            - { call: "POST /api/delivery-milestones/${ms_id}/complete", payload: { actual_date: "2027-02-03T00:00:00Z" }, as: ProjectManager }
          trigger:
            - { call: "POST /api/delivery-milestones/${ms_id}/complete", payload: { actual_date: "2027-02-04T00:00:00Z" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status 409"
            - "DeliveryMilestone.${ms_id}.actual_date remains 2027-02-03T00:00:00Z (second write did not land)"

      - name: exercise_released_option_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExpansionOption.GRANTED_to_RELEASED, state_machines.ExpansionOption.GRANTED_to_EXERCISED]
        distinguishing_aspect: "RELEASED is terminal: exercise after release fails ERR_INVALID_STATE regardless of window/zoning."
        test_recipe:
          setup: ["LOI_A ACCEPTED; GRANTED option on SITE_L; option released by the tenant rep"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/sites", payload: { site_name: "Victorville Land Bank", submarket: "High Desert", parcel_type: LAND_BANK, total_sf: 500000, clear_height_ft: 0, dock_doors: 0, power_amps: 0, yard_depth_ft: 0, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 2.00 }, as: LeasingManager, captures: { land_id: $.data.id } }
            - { call: "POST /api/expansion-options", payload: { loi_id: "${loi_id}", land_site_id: "${land_id}", option_sf: 100000, window_open_date: "2026-09-01T00:00:00Z", window_close_date: "2026-12-01T00:00:00Z" }, as: LeasingManager, captures: { opt_id: $.data.id } }
            - { call: "POST /api/expansion-options/${opt_id}/release", as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/expansion-options/${opt_id}/exercise", as: TenantRep, as_user_id: rep-001, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status 409"
            - "Site.${land_id}.status remains LISTED (no reservation leaked)"

  - section: calculations
    instances:
      - name: aggregate_rent_escalation_compounding
        claim_type: correct_result
        grounds: [calculations.aggregate_rent, entities.LOI.fields.aggregate_rent_total]
        distinguishing_aspect: "Escalation compounds per year: 8.00*100000*sum(1.03^y, y=0..4) = 4247308.65, summed unrounded then rounded once; visible already on the DRAFT create response."
        test_recipe:
          setup: ["REQ_A toured on SITE_A (tour COMPLETED)"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { ar: $.data.aggregate_rent_total, ner: $.data.net_effective_rent_psf, round0: $.data.negotiation_round } }
          assert:
            - "ar == 4247308.65 (per-year compounding, sum-then-round)"
            - "ner == 5.69 and round0 == 0 on the DRAFT create response"

      - name: match_score_weighted_literal
        claim_type: constants_applied
        grounds: [calculations.site_match_scoring]
        distinguishing_aspect: "Weighted score with cap 1.25: over-specced SITE_A scores 97.00; an exactly-at-minimum site scores 80.00; a site 2ft short on clear height scores 78.50 AND flips hard_minimums_met to false."
        test_recipe:
          setup: ["REQ_A (ch32/dock16/pw3000/yd150, 90k-120k SF); three sites with known specs"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_over: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Exact Fit Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 100000, clear_height_ft: 32, dock_doors: 16, power_amps: 3000, yard_depth_ft: 150, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_exact: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Low Clear Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 100000, clear_height_ft: 30, dock_doors: 16, power_amps: 3000, yard_depth_ft: 150, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 5.00 }, as: LeasingManager, captures: { site_low: $.data.id } }
          trigger:
            - { call: "POST /api/match-evaluations", payload: { requirement_id: "${req_id}", site_id: "${site_over}" }, as: LeasingManager, captures: { s1: $.data.match_score, h1: $.data.hard_minimums_met } }
            - { call: "POST /api/match-evaluations", payload: { requirement_id: "${req_id}", site_id: "${site_exact}" }, as: LeasingManager, captures: { s2: $.data.match_score, h2: $.data.hard_minimums_met } }
            - { call: "POST /api/match-evaluations", payload: { requirement_id: "${req_id}", site_id: "${site_low}" }, as: LeasingManager, captures: { s3: $.data.match_score, h3: $.data.hard_minimums_met } }
          assert:
            - "s1 == 97.00 and h1 == true"
            - "s2 == 80.00 and h2 == true"
            - "s3 == 78.50 and h3 == false (clear height 30 < 32 fails the hard minimum even though the weighted score stays high)"

      - name: abatement_grace_boundary_30_days
        claim_type: boundary_edge
        grounds: [calculations.delivery_delay_abatement]
        distinguishing_aspect: "Threshold is a strict > over a 30-day grace: a 30-day-late substantial completion yields abatement_days == 0 (31 days would yield 1); §1.8's delivery instance covered the 45-day/15-day side."
        test_recipe:
          setup: ["EXECUTED LOI_B on SITE_B; plan APPROVED; SUBSTANTIAL_COMPLETION milestone planned 2027-03-01"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Bolt Manufacturing", use_type: MANUFACTURING, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Antelope Valley", required_delivery_date: "2027-06-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Pacific BTS Site", submarket: "Antelope Valley", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-2", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 13.20 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-11T10:00:00Z", end_at: "2026-08-11T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 12.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager }
            - { call: "GET /api/bts-plans?loi_id=${loi_id}", as: ProjectManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/bts-plans/${plan_id}/price", payload: { hard_cost_total: 10000000, soft_cost_total: 2000000, contingency_pct: 0.05, pricing_method: YIELD_ON_COST }, as: ProjectManager }
            - { call: "POST /api/bts-plans/${plan_id}/approve", as: AssetManager }
            - { call: "POST /api/delivery-milestones", payload: { plan_id: "${plan_id}", milestone_type: SUBSTANTIAL_COMPLETION, planned_date: "2027-03-01T00:00:00Z" }, as: ProjectManager, captures: { ms_id: $.data.id } }
          trigger:
            - { call: "POST /api/delivery-milestones/${ms_id}/complete", payload: { actual_date: "2027-03-31T00:00:00Z" }, as: ProjectManager }
          assert:
            - "BuildToSuitPlan.${plan_id}.status == DELIVERED"
            - "LOI.${loi_id}.abatement_days == 0 (delay 30 days - grace 30 = 0; boundary is strict-greater-than)"
            - "LOI.${loi_id}.rent_commencement_date == 2027-03-31T00:00:00Z"

      - name: loi_create_computed_field_input_ignored
