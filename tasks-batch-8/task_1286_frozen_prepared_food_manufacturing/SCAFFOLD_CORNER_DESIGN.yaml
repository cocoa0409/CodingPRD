      - name: batch_create_on_cancelled_order_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ProductionOrder, "errors[ERR_ORDER_NOT_OPEN]"]
        distinguishing_aspect: "After order cancellation, batch creation with the CURRENT (post-cancel) version passes OCC but fails state validation with ERR_ORDER_NOT_OPEN."
        test_recipe:
          setup: ["order O cancelled while still PLANNED (no batches)"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Ord", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id }
            - call: "POST /plant/production-orders/${o_id}/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { o_v_cancel: $.data.version }
          trigger:
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v_cancel}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_OPEN; http 409 (OCC passed because the version matches post-cancel state)"

      - name: void_in_progress_cycle_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FreezingCycle.RESERVED_to_VOIDED, "errors[ERR_CYCLE_STATE]"]
        distinguishing_aspect: "void is declared only from RESERVED; an IN_PROGRESS cycle rejects void with ERR_CYCLE_STATE."
