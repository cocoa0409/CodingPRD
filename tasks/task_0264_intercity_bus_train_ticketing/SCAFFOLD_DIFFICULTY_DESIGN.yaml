          - validations[priority=13]
          - state_machines.Booking.booking_status.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Pair {state (P6, ERR_INVALID_STATE) vs business_fiscal (P13, ERR_SOLD_OUT)}: a booking already
          CONFIRMED on a now-sold-out ServiceDate, re-confirmed, fails the lower-numbered state check
          first -> ERR_INVALID_STATE, not ERR_SOLD_OUT.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=1 base 4000; ECONOMY OPEN class."
            - "Passenger P confirms the only seat (booking CONFIRMED, seats_available=0)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
