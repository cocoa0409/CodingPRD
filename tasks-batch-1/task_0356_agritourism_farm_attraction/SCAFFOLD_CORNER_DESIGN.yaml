# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Agritourism & Farm Attraction — breadth probe over §1.1–§1.7.
# Sections/claim_types from references/claim-extraction-guide.md.
# Every error_id in §1.6 is triggered here or in §1.8 (stubbed). Every FK,
# computed field, RBAC denial, envelope, and consistency claim is covered.
# Shared pricing fixture identical to §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_farm_returns_201_with_open_posture_and_defaults
        claim_type: Creation
        grounds: [entities.Farm, endpoints]
        distinguishing_aspect: "POST /farms with name only -> 201; operational_status==OPEN, parking_fee_cents==1000 (default), window_buffer_minutes==30 (default), version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /farms"
              payload: { name: "Default Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
          assert:
            - "Farm.${farm_id}.operational_status == OPEN"
            - "Farm.${farm_id}.parking_fee_cents == 1000"
            - "Farm.${farm_id}.window_buffer_minutes == 30"
            - "Farm.${farm_id}.version == 1"

      - name: get_farm_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Farm"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /farms/{id} with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /farms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_reservation_missing_required_window_id_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Reservation"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /reservations omitting required window_id -> ERR_VALIDATION (422); no reservation created."
        test_recipe:
          setup: ["Farm OPEN with ACTIVE policy, a window, and a visitor."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Req Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "rq@x.com", full_name: "Req Visitor" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: reservation_participant_count_computed_from_adult_plus_child
        claim_type: Computed Fields
        grounds: [entities.Reservation.fields.participant_count]
        distinguishing_aspect: "participant_count is computed server-side as adult_count + child_count (2+3) == 5, independent of any client-supplied value."
        test_recipe:
          setup: ["Farm OPEN with ACTIVE policy; window capacity 10; a visitor."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Comp Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "cp@x.com", full_name: "Cap Visitor" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 2, child_count: 3, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id, pc: $.data.participant_count }
          assert:
            - "Reservation.${res_id}.participant_count == 5"

      - name: concession_parking_cents_computed_from_farm_fee
        claim_type: Computed Fields
        grounds: [entities.ConcessionOrder.fields.parking_cents, entities.ConcessionOrder.fields.total_cents, calculations.reservation_grand_total]
        distinguishing_aspect: "ConcessionOrder parking_cents == vehicle_count(3) * Farm.parking_fee_cents(1000) == 3000; total_cents == food_cents(500) + 3000 == 3500."
        test_recipe:
          setup: ["Farm OPEN (parking 1000) with ACTIVE policy; window; a PENDING reservation owned by a visitor."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Park Farm", parking_fee_cents: 1000 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "pk2@x.com", full_name: "Park Visitor" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/concession-orders"
              payload: { food_cents: 500, vehicle_count: 3 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { co_id: $.data.id, pc: $.data.parking_cents, tc: $.data.total_cents }
          assert:
            - "ConcessionOrder.${co_id}.parking_cents == 3000"
            - "ConcessionOrder.${co_id}.total_cents == 3500"

      - name: weather_event_is_immutable_log_no_version_field
        claim_type: Immutability
        grounds: [entities.WeatherEvent]
        distinguishing_aspect: "WeatherEvent has common_fields:false (append-only); GET /farms/{id}/weather-events lists it with id+created_at and no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Farm OPEN; one HOLD weather event recorded."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Log Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/weather-events"
              payload: { kind: "HOLD", note: "rain" }
              as: FarmManager
              captures: { we_id: $.data.id }
          trigger:
            - call: "GET /farms/${farm_id}/weather-events"
              payload: {}
              as: FarmManager
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response.data is an array containing the recorded WeatherEvent ${we_id}"
            - "WeatherEvent.${we_id}.resulting_status == WEATHER_HOLD"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_reservation_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Reservation.PENDING_to_CONFIRMED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second confirm on an already-CONFIRMED reservation -> ERR_INVALID_STATE (409); status stays CONFIRMED, no double seat move."
        test_recipe:
          setup: ["Farm OPEN; window capacity 5; a reservation confirmed once."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Dup Confirm Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "dc@x.com", full_name: "Dee Confirm" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.status == CONFIRMED"
            - "AdmissionWindow.${window_id}.seats_committed == 1"

      - name: cancel_settled_reservation_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Reservation"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A SETTLED reservation is terminal; cancel on it -> ERR_INVALID_STATE (409); status stays SETTLED."
        test_recipe:
          setup: ["A fully SETTLED reservation (confirmed, checked in with waiver, no pumpkins, settled)."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Settle Lock Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "sl@x.com", full_name: "Sol Lock" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Sol Lock" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/settle"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.status == SETTLED"

      - name: weigh_out_already_weighed_pumpkin_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.Reservation"
          - "errors[ERR_PUMPKIN_ALREADY_WEIGHED]"
          - "entities.PumpkinPurchase.fields.status"
        distinguishing_aspect: "Re-running weigh-out on a pumpkin already WEIGHED -> ERR_PUMPKIN_ALREADY_WEIGHED (409); charge_cents unchanged."
        test_recipe:
          setup: ["CHECKED_IN reservation with one pumpkin already weighed at 10 lb (charge 1500)."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Reweigh Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "rw@x.com", full_name: "Ray Weigh" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Ray Weigh" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 10 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk_id: $.data.id }
            - call: "POST /pumpkin-purchases/${pk_id}/weigh-out"
              payload: { scale_weight_lb: 10 }
              as: GateAgent
          trigger:
            - call: "POST /pumpkin-purchases/${pk_id}/weigh-out"
              payload: { scale_weight_lb: 15 }
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PUMPKIN_ALREADY_WEIGHED"
            - "PumpkinPurchase.${pk_id}.charge_cents == 1500"

      - name: revise_confirmed_group_rejected_not_revisable
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.GroupBooking.QUOTED_to_REVISING"
          - "errors[ERR_GROUP_NOT_REVISABLE]"
        distinguishing_aspect: "revise on a CONFIRMED group -> ERR_GROUP_NOT_REVISABLE (409); status stays CONFIRMED."
        test_recipe:
          setup: ["A CONFIRMED FIELD_TRIP group of headcount 10 on a capacity-20 window."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "GR Lock Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, group_rate_min_headcount: 15 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 20 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "gl@x.com", full_name: "Gail Lead" }
              as: FarmManager
              captures: { leader_id: $.data.id }
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "FIELD_TRIP", adult_count: 4, child_count: 6 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id }
            - call: "POST /group-bookings/${group_id}/confirm"
              payload: { expected_window_version: "${win_v0}" }
              as: GroupLeader
              as_user_id: "${leader_id}"
          trigger:
            - call: "POST /group-bookings/${group_id}/revise"
              payload: {}
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GROUP_NOT_REVISABLE"
            - "GroupBooking.${group_id}.status == CONFIRMED"

      - name: mark_no_shows_sweeps_confirmed_to_no_show_after_end
        claim_type: Valid Transition
        grounds: [state_machines.Reservation.CONFIRMED_to_NO_SHOW, entities.AdmissionWindow.fields.seats_committed]
        distinguishing_aspect: "After the clock passes ends_at, mark-no-shows moves a never-checked-in CONFIRMED reservation to NO_SHOW and releases its committed seats (seats_committed 0)."
        test_recipe:
          setup: ["Clock 2026-10-11T17:00Z (past window end 16:00); a CONFIRMED reservation never checked in on a capacity-5 window."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "NoShow Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "ns@x.com", full_name: "Nora Show" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T17:00:00Z" }
              as: FarmManager
          trigger:
            - call: "POST /admission-windows/${window_id}/mark-no-shows"
              payload: {}
              as: GateAgent
          assert:
            - "Reservation.${res_id}.status == NO_SHOW"
            - "AdmissionWindow.${window_id}.seats_committed == 0"

      - name: error_checkin_blocked_window_cancelled_already_covered
        claim_type: Invalid Transitions
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / checkin_blocked_when_window_cancelled
          rationale: "ERR_INVALID_STATE on check-in after a closure-cancelled window is the asserted failure path of that §1.8 instance."

      - name: error_settle_before_finalize_already_covered
        claim_type: Invalid Transitions
        grounds:
          - "errors[ERR_CHECKOUT_NOT_FINALIZED]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_forkjoin_settle_requires_both_legs
          rationale: "ERR_CHECKOUT_NOT_FINALIZED is the asserted failure path of the fork-join §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: season_pass_admission_is_zero
        claim_type: Correct Result
        grounds: [calculations.admission_charge, entities.Reservation.fields.admission_charge_cents, entities.SeasonPass.fields.status]
        distinguishing_aspect: "A reservation redeeming an ACTIVE season pass has admission_charge_cents == 0 (pass waives admission) regardless of adult/child counts."
        test_recipe:
          setup: ["Farm OPEN with ACTIVE policy; visitor holds an ACTIVE pass valid over the window; window capacity 5."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Free Pass Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
