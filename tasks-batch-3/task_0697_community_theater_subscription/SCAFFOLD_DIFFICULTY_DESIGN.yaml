              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "Performance.${perf_id}.capacity == 1"
            - "Performance.${perf_id}.available_seat_count == 0"
            - "response_type == error"
            - "error_id == ERR_PERFORMANCE_SOLD_OUT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: account_credit_refund_conservation
        grounds:
          - state_machines.Performance.ON_SALE_to_CANCELLED
          - calculations.account_credit
          - entities.Patron.fields.account_credit_cents
          - entities.Ticket.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity = cash credit: for the Patron, sum(price_cents of PAID tickets refunded by a
          cancellation) MUST equal the increase in account_credit_cents. Cancelling a performance with one PAID
          single ticket priced 6000 leaves account_credit_cents==6000 and the ticket REFUNDED — no cash drift.
        test_recipe:
          setup:
            - "An ON_SALE performance with one PAID single STANDARD ticket priced 6000 at demand 1.0"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S17", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Show K" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "Hall17" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "O", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "p17@x.com", full_name: "Pat Seventeen" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_id}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /box-office/performances/${perf_id}/cancel"
              payload: {}
              as: SeasonAdmin
          assert:
            - "Ticket.${ticket_id}.payment_status == REFUNDED"
            - "Patron.${patron_id}.account_credit_cents == 6000"

      - name: donor_lifetime_fulfill_refund_conservation
        grounds:
          - state_machines.Donation.PLEDGED_to_FULFILLED
          - calculations.lifetime_donation
          - entities.Patron.fields.lifetime_donation_cents
          - entities.Patron.fields.donor_level
        distinguishing_aspect: |
          Conserved quantity = donation principal: lifetime_donation_cents MUST equal sum(amount_cents over
          FULFILLED donations) at all times. Fulfilling a 25000 gift then refunding it returns
          lifetime_donation_cents to 0 and demotes donor_level FRIEND->NONE — the refund exactly compensates the
          fulfill, a different conserved quantity than account credit.
        test_recipe:
          setup:
            - "A patron whose single 25000 donation has been FULFILLED (donor_level FRIEND, lifetime 25000)"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/patrons"
              payload: { email: "p18@x.com", full_name: "Pat Eighteen" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/donations"
              payload: { patron_id: "${patron_id}", amount_cents: 25000 }
              as: BoxOfficeAgent
              captures: { don_id: $.data.id }
            - call: "POST /box-office/donations/${don_id}/fulfill"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /box-office/donations/${don_id}/refund"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Donation.${don_id}.status == REFUNDED"
            - "Patron.${patron_id}.lifetime_donation_cents == 0"
            - "Patron.${patron_id}.donor_level == NONE"
