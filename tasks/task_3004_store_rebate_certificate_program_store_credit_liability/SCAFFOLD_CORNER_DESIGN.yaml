  - section: roles
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role fails ERR_UNAUTHENTICATED (401) at priority 1 — before authorization, existence, or any business rule — even when the body is otherwise malformed."
        test_recipe:
          setup: ["Empty database; logical clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "S-AUTH1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: __NO_ROLE_HEADER__
              captures: { err: $.data.error_id }
          assert:
            - "the request fails with error_id ERR_UNAUTHENTICATED (HTTP 401) and no store row is created"
