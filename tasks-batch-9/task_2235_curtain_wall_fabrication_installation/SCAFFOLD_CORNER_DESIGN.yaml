  - name: cascading_side_effects_across_four_hops
    claim_type: cascading_side_effects
    grounds:
    - state_machines.ShopDrawingSubmittal.UNDER_REVIEW_to_REVISION_REQUIRED
    excluded_because:
      difficulty_instance: submittal_revision_cascade_revokes_release_holds_lot_reverts_zone_and_package
      rationale: 'The cascading-side-effects layer is exercised end to end by that instance: one review decision revokes
        the release, holds the eligible lots, reverts the weather-tight zone and recomputes the package aggregates and state.'
  - name: dual_variant_calculation_layer
    claim_type: dual_variant_calculation
    grounds:
    - calculations.zone_field_labor_cost
    excluded_because:
      difficulty_instance: zone_labor_provisional_forward_versus_final_chronological
      rationale: The dual-variant layer is the difficulty instance itself - the same zone priced 940800 forward-looking
        and 1149540 chronologically, with the variant chosen by the transition rather than by a request field.
- section: consistency_model
  instances:
  - name: every_effect_is_visible_in_the_same_response_and_to_the_next_read
    claim_type: immediate_visibility
    grounds:
    - complexity_profile.consistency_model
    - calculations.earned_value_certified_cents
    - state_machines.InstallationZone.NOT_TIGHT_to_WEATHER_TIGHT
    - endpoints[GET /facade-packages/{id}/earned-value]
    distinguishing_aspect: 'The consistency model is immediate: the certify-weather-tight response already carries the zone
      final_labor_cost_cents and certified_line_cents, and the very next read of the package and of the computed earned-value
      endpoint shows weather_tight_zone_count 1 and earned 55353057 - there is no lag, no background job and no re-read
      required to observe a cascade.'
    test_recipe:
      setup:
      - logical clock 2026-08-13T09:00:00Z; zone z1 is PANELS_HUNG with three POSTED crew days and both field tests PASSED
      setup_api_calls:
