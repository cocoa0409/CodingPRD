scaffold_corner_design:
- section: entities
  instances:
  - name: program_creation_computed_defaults
    claim_type: computed_fields
    grounds:
    - entities.AssistanceProgram
    distinguishing_aspect: 'New program: server-minted id, posture OPEN, all totals 0, version 1.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
          posture: $.data.posture
          committed: $.data.total_committed_cents
          ver: $.data.version
      trigger: []
      assert:
      - response 201; posture == 'OPEN'; total_committed_cents == 0; total_disbursed_cents == 0; total_allocated_cents == 0; version == 1; id is a bare UUID
  - name: patient_creation_missing_required_returns_400
    claim_type: required_fields
    grounds:
    - entities.Patient
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required field state_code is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /pap/patients
        payload:
          full_name: No State
          date_of_birth: '1990-01-01'
        as: CaseWorker
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST; http 400; no Patient persisted
  - name: screening_computed_field_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.EligibilityScreening.fields.fpl_percent
    - calculations.fpl_percent_and_eligibility
    distinguishing_aspect: Client-supplied fpl_percent is ignored; the server computes '191.69' for income 3000000 household 1.
    test_recipe:
      setup:
      - clock default; program exists
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/patients
        payload:
          full_name: Amy Ames
          date_of_birth: '1980-01-01'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      trigger:
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: PRIOR_YEAR
          prior_year_income_cents: 3000000
          insurance_status: UNINSURED
          fpl_percent: '1.00'
        as: Patient
        as_user_id: ${pat_id}
        captures:
          fpl: $.data.fpl_percent
          status: $.data.status
      assert:
      - response fpl_percent == '191.69' (computed), not the supplied '1.00'
      - initial status == DRAFT
  - name: screening_conditional_input_missing_returns_400
    claim_type: required_fields
    grounds:
    - entities.EligibilityScreening.fields.ytd_months_elapsed
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: income_basis YTD_ANNUALIZED without ytd_months_elapsed violates the conditional-input rule.
    test_recipe:
      setup:
      - program + patient exist
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/patients
        payload:
          full_name: Ben Bice
          date_of_birth: '1981-02-02'
          state_code: OH
        as: CaseWorker
        captures:
          pat_id: $.data.id
      trigger:
      - call: POST /pap/screenings
        payload:
          patient_id: ${pat_id}
          program_id: ${prog_id}
          household_size: 1
          income_basis: YTD_ANNUALIZED
          ytd_income_cents: 2000000
          insurance_status: UNINSURED
        as: Patient
        as_user_id: ${pat_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (ytd_months_elapsed required when income_basis == YTD_ANNUALIZED)
  - name: lot_duplicate_number_rejected
    claim_type: type_constraints
    grounds:
    - entities.InventoryLot.fields.lot_number
    - errors[ERR_LOT_NUMBER_DUPLICATE]
    distinguishing_aspect: lot_number is unique per program; second create with the same lot_number is rejected.
    test_recipe:
      setup:
      - program exists with one lot LOT-1
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
      - call: POST /pap/inventory-lots
        payload:
          program_id: ${prog_id}
          lot_number: LOT-1
          quantity_received: 10
          unit_cost_per_unit: '100.0000'
          expiry_date: '2027-01-01'
        as: ProgramAdministrator
      trigger:
      - call: POST /pap/inventory-lots
        payload:
          program_id: ${prog_id}
          lot_number: LOT-1
          quantity_received: 5
          unit_cost_per_unit: '90.0000'
          expiry_date: '2027-06-01'
        as: ProgramAdministrator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_LOT_NUMBER_DUPLICATE (409); second lot not persisted
  - name: program_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints.GET /pap/programs/{id}
    distinguishing_aspect: GET with a well-formed but unknown UUID returns the error envelope with ERR_NOT_FOUND.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /pap/programs/00000000-0000-0000-0000-000000000000
        payload: {}
        as: CaseWorker
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND; http 404; response_type == 'error'
  - name: programs_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints.GET /pap/programs
    distinguishing_aspect: '11 programs with limit 10: page 1 reports total_count 11 and has_more true; offset 10 returns exactly 1 row.'
