              as_user_id: "${lab_id}"
          assert:
            - "The first start returns 409 ERR_INVALID_LABORATORY_STATE - the blocker is the sibling laboratory, not the session"
            - "That refusal changes nothing: TestSession.${sess_id}.state == SCHEDULED, started_at is null, TestPlan.${plan_id}.state == ISSUED, TestLaboratory.${lab_id}.reserved_bench_minutes == 240"
            - "Booking a NEW session at the suspended laboratory is refused the same way: 409 ERR_INVALID_LABORATORY_STATE, and reserved_bench_minutes is still 240 (no minutes were reserved for the rejected booking)"
            - "REINSTATE returns 200 with TestLaboratory.${lab_id}.accreditation_status == AUTHORIZED"
            - "The second start of the SAME session now succeeds: TestSession.${sess_id}.state == IN_PROGRESS, started_at == \"2026-09-02T09:30:00Z\", reserved_minutes == 240"
            - "The dependency reaches through to the grandparent: TestPlan.${plan_id}.state == IN_EXECUTION"
            - "TestLaboratory.${lab_id}.reserved_bench_minutes is still 240 - starting a session neither reserves nor releases minutes"

