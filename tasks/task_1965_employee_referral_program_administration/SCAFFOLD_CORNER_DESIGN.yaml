              as: PayrollProcessor
              captures: { e6: $.data.error_id }
            - call: "GET /erp/payroll-batches/11111111-1111-1111-1111-111111111111"
              as: PayrollProcessor
              captures: { e7: $.data.error_id }
            - call: "GET /erp/abuse-cases/11111111-1111-1111-1111-111111111111"
              as: ComplianceOfficer
              captures: { e8: $.data.error_id }
          assert:
            - "All eight reads return 404 with error_id == ERR_NOT_FOUND"

