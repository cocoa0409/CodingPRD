  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suitability_safety_beats_annual_cap_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_SUITABILITY_NOT_APPROVED]
          - errors[ERR_ANNUAL_CAP_EXCEEDED]
        distinguishing_aspect: "On settle of a subscription whose investor is NOT approved AND whose funded amount would exceed the annual cap, the business_safety suitability check (priority 8) wins over the business_fiscal cap check (priority 15): ERR_SUITABILITY_NOT_APPROVED, not ERR_ANNUAL_CAP_EXCEEDED."
        test_recipe:
          setup:
            - "Non-accredited investor (cap 1200000) registered but NOT approved; a subscription funded 2000000 (would exceed cap) is PENDING_ACH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
