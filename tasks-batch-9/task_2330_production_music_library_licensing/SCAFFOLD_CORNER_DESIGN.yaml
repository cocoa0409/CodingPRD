        distinguishing_aspect: |
          Reproduces the worked example end-to-end through the API: one recently created AVAILABLE
          work scores above 100.00 because of the recency boost, an identically tagged RESTRICTED work
          is damped to 55.50, a poorly matching work lands on the renormalized tempo term alone, and
          an INGESTED work never enters the pool. Falsified by any implementation that applies the
