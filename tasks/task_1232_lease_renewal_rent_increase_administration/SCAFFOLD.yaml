# =============================================================================
# Task 1232: Lease Renewal & Rent Increase Administration (multifamily revenue
# management) — scaffold seed tables. Maximum-difficulty ("harder than expert").
# =============================================================================

scenario: |
  generate task hard than expert level! 1232. Lease Renewal & Rent Increase Administration (multifamily revenue management): renewal window & offer generation with rate strategy, statutory notice periods & rent cap compliance, resident response tracking & month-to-month conversion premium, negotiation authority & retention concession, lease term staggering to smooth expirations, non-renewal notice for cause, renewal document execution, retention rate reporting

domain_name: lease-renewal-administration
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - scheduled_deferred_actions
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FK references, no URL nesting under a single root
  state_machine_shape: cyclic      # RenewalOffer negotiation loop; Lease renewal loop
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: hierarchical_override  # RegionalDirector > PropertyManager > LeasingAgent; Resident is entity-backed
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities, flat topology)
# All date fields are ISO calendar dates "YYYY-MM-DD"; all datetimes ISO8601 UTC.
# =============================================================================
entities:
  - name: RentCapPolicy
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction code; unique across all policies", constraints: "unique" }
      - { name: base_cap_bps, type: integer, source: input, description: "Base annual rent-increase cap in basis points (>= 0)" }
      - { name: cpi_adjustment_bps, type: integer, source: input, description: "CPI pass-through added to base cap, basis points (>= 0)" }
      - { name: hard_ceiling_bps, type: integer, source: input, description: "Absolute statutory ceiling on the effective cap, basis points" }
      - { name: high_increase_threshold_bps, type: integer, source: input, description: "Increase strictly above this bps triggers the long notice period" }
      - { name: notice_days_low, type: integer, source: input, description: "Statutory notice days for increases <= high_increase_threshold_bps" }
      - { name: notice_days_high, type: integer, source: input, description: "Statutory notice days for increases > high_increase_threshold_bps" }
      - { name: non_renewal_notice_days, type: integer, source: input, description: "Statutory lead days required between serving a non-renewal notice and its effective_date" }
      - { name: effective_cap_bps, type: integer, source: computed, description: "= min(base_cap_bps + cpi_adjustment_bps, hard_ceiling_bps); recomputed on every PATCH" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: rent_cap_policy_id, type: string, source: input, description: "FK -> RentCapPolicy.id; governing rent-control jurisdiction" }
      - { name: min_term_months, type: integer, source: input, description: "Minimum offerable lease term (>= 1); staggering band lower bound" }
      - { name: max_term_months, type: integer, source: input, description: "Maximum offerable lease term; staggering band upper bound (>= min_term_months)" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: unit_number, type: string, source: input, description: "Unit number; unique within the property", constraints: "unique per (property_id, unit_number)" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count (>= 0)" }
      - { name: current_market_rent_cents, type: integer, source: input, description: "Current asking market rent in cents; input to the rate strategy gap" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Resident email" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; the primary resident (ownership anchor)" }
      - { name: property_id, type: string, source: computed, description: "FK -> Property.id; denormalized from Unit at creation for scoping" }
      - { name: term_start_date, type: string, source: input, description: "Lease term start date (inclusive), YYYY-MM-DD" }
      - { name: term_months, type: integer, source: input, description: "Fixed term length in whole months (>= 1)" }
      - { name: term_end_date, type: string, source: computed, description: "= term_start_date + term_months calendar months (day-of-month preserved, clamped to month length); half-open end — the lease occupies [term_start_date, term_end_date)" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Current contract rent in cents; mutated by renewal execution and MTM conversion" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RENEWAL_PENDING | MTM | NON_RENEWAL_NOTICED | ENDED" }
      - { name: status_before_offer, type: string, source: system, description: "Status captured when the lease first enters RENEWAL_PENDING in the current offer cycle (ACTIVE or MTM); null when no open offer cycle; used to revert on decline/expire/withdraw/supersede", default: null }
      - { name: mtm_converted_on, type: string, source: system, description: "Date the lease auto-converted to month-to-month; null unless status is/has been MTM", default: null }

  - name: RenewalOffer
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id (path parameter at creation)" }
      - { name: rate_strategy, type: enum, source: input, description: "AGGRESSIVE (100% of gap) | BALANCED (60%) | CONSERVATIVE (30%)", default: "BALANCED" }
      - { name: offer_round, type: integer, source: system, description: "Negotiation round; 1 at creation, +1 on each revise (COUNTERED -> ISSUED)" }
      - { name: base_rent_cents, type: integer, source: system, description: "Lease.monthly_rent_cents captured at offer creation" }
      - { name: proposed_rent_cents, type: integer, source: computed, description: "Provisional rent from proposed_rent_cents calculation at creation; recomputed and overwritten on each revise" }
      - { name: proposed_increase_bps, type: integer, source: computed, description: "Increase of proposed_rent_cents over base_rent_cents in bps" }
      - { name: cap_bps_snapshot, type: integer, source: system, description: "RentCapPolicy.effective_cap_bps snapshot at creation; used by the provisional variant" }
      - { name: offered_term_months, type: integer, source: computed, description: "Term selected by staggered_term_selection at creation" }
      - { name: notice_days_required, type: integer, source: computed, description: "Tiered statutory notice days per notice_days_required calculation" }
      - { name: latest_issue_date, type: string, source: computed, description: "= lease.term_end_date - notice_days_required days; null when the lease is MTM (no fixed term end, so no statutory issue window applies)" }
      - { name: issued_on_date, type: string, source: system, description: "Clock date when the offer was (re-)issued; null while DRAFT", default: null }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID that issued the current round; null while DRAFT", default: null }
      - { name: response_deadline_date, type: string, source: system, description: "= min(issued_on_date + 14 days, lease.term_end_date) for fixed-term leases; = issued_on_date + 14 days when the lease is MTM; null while DRAFT", default: null }
      - { name: counter_rent_cents, type: integer, source: system, description: "Resident's countered rent from the latest COUNTER response; null otherwise", default: null }
      - { name: counter_term_months, type: integer, source: system, description: "Resident's countered term from the latest COUNTER response; null otherwise", default: null }
      - { name: accepted_on_date, type: string, source: system, description: "Clock date of resident acceptance; null unless ACCEPTED/EXECUTED", default: null }
      - { name: execution_deadline_date, type: string, source: system, description: "= accepted_on_date + 10 days; null unless ACCEPTED/EXECUTED/VOIDED-after-accept", default: null }
      - { name: executed_rent_cents, type: integer, source: computed, description: "Final rent recomputed at countersign with the THEN-current policy cap and market rent (final variant); null until execution", default: null }
      - { name: supersedes_offer_id, type: string, source: system, description: "FK -> RenewalOffer.id; the most recently created open offer this offer superseded at creation; null if none", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | COUNTERED | ACCEPTED | EXECUTED | DECLINED | EXPIRED | WITHDRAWN | SUPERSEDED | VOIDED" }

  - name: ConcessionApproval
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> RenewalOffer.id (path parameter at creation)" }
      - { name: requested_rent_cents, type: integer, source: input, description: "The discounted rent the requester wants authority to offer (> 0)" }
      - { name: reason, type: string, source: input, description: "Retention justification", default: null }
      - { name: concession_bps, type: integer, source: computed, description: "= round_half_up((offer.proposed_rent_cents - requested_rent_cents) / offer.proposed_rent_cents * 10000) at submission" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the submitter" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the approver/denier; null while SUBMITTED", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | APPLIED | VOIDED" }

  - name: NonRenewalNotice
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id (path parameter at creation)" }
      - { name: cause_type, type: enum, source: input, description: "LEASE_VIOLATION | REPEATED_LATE_PAYMENT | PROPERTY_REPOSITIONING | OWNER_OCCUPANCY" }
      - { name: evidence_ref, type: string, source: input, description: "Evidence document reference; REQUIRED when cause_type = LEASE_VIOLATION, optional otherwise", default: null }
      - { name: effective_date, type: string, source: input, description: "Date the tenancy ends; must be >= lease.term_end_date" }
      - { name: served_on_date, type: string, source: system, description: "Clock date at serve; null while DRAFT", default: null }
      - { name: cure_deadline_date, type: string, source: computed, description: "= served_on_date + 10 days; null while DRAFT", default: null }
      - { name: prior_lease_status, type: string, source: system, description: "Lease.status captured at serve time; restored verbatim on rescind", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the DRAFT creator" }
      - { name: served_by_user_id, type: string, source: system, description: "X-User-ID of the server; must differ from created_by_user_id", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SERVED | CONFIRMED | ENFORCED | RESCINDED" }

  - name: RenewalDocument
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> RenewalOffer.id; created automatically when the offer is ACCEPTED (at most one document per offer)" }
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; denormalized from the offer at creation" }
      - { name: status, type: enum, source: system, description: "GENERATED | RESIDENT_SIGNED | COUNTERSIGNED | VOIDED | RESCINDED" }
      - { name: executed_rent_cents, type: integer, source: computed, description: "Final rent locked at countersign (final variant recompute); null until COUNTERSIGNED", default: null }
      - { name: countersigned_on_date, type: string, source: system, description: "Clock date of countersign; null until COUNTERSIGNED", default: null }
      - { name: rescind_deadline_date, type: string, source: computed, description: "= countersigned_on_date + 3 days; null until COUNTERSIGNED", default: null }
      - { name: prior_lease_status, type: string, source: system, description: "Lease snapshot for rescission restore", default: null }
      - { name: prior_monthly_rent_cents, type: integer, source: system, description: "Lease snapshot for rescission restore", default: null }
      - { name: prior_term_start_date, type: string, source: system, description: "Lease snapshot for rescission restore", default: null }
      - { name: prior_term_end_date, type: string, source: system, description: "Lease snapshot for rescission restore", default: null }
      - { name: prior_term_months, type: integer, source: system, description: "Lease snapshot for rescission restore", default: null }

# =============================================================================
# §1.2 State Machine Table
# Clock sweep: POST /_clock/set_current_utc synchronously applies every due
# time-based transition in this fixed order: (1) notice cure-lapse, (2) notice
# enforcement, (3) offer expiry/void (ISSUED/COUNTERED past response_deadline;
# ACCEPTED past execution_deadline), (4) lease MTM conversion.
# DRAFT offers never auto-expire: they remain DRAFT until issued, withdrawn, or
# superseded; a late issue attempt is rejected with ERR_NOTICE_WINDOW_MISSED.
# =============================================================================
state_machines:
  - entity: Lease
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: [ACTIVE, MTM]
        to: RENEWAL_PENDING
        trigger: "system side effect of POST /renewal-offers/{id}/issue"
        actor: system
        preconditions:
          - "Lease status in {ACTIVE, MTM} at issue time (ERR_LEASE_NOT_ISSUABLE otherwise)"
        side_effects:
          - "status_before_offer := prior status (ACTIVE or MTM)"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "system side effect of POST /renewal-documents/{id}/countersign (renewal execution)"
        actor: system
        preconditions: []
        side_effects:
          - "monthly_rent_cents := offer.executed_rent_cents (final variant)"
          - "term_start_date := max(old term_end_date, current clock date); term_months := offer.offered_term_months; term_end_date recomputed"
          - "status_before_offer := null"
          - "increments Lease.version by 1"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "system revert when the last open offer (DRAFT/ISSUED/COUNTERED/ACCEPTED) of the cycle leaves the open set (decline, expiry, withdraw, supersede) and status_before_offer == ACTIVE"
        actor: system
        preconditions: ["status_before_offer == ACTIVE", "no remaining open offer for the lease"]
        side_effects: ["status_before_offer := null"]
      - from: RENEWAL_PENDING
        to: MTM
        trigger: "system revert when the last open offer leaves the open set and status_before_offer == MTM"
        actor: system
        preconditions: ["status_before_offer == MTM", "no remaining open offer for the lease"]
        side_effects: ["status_before_offer := null"]
      - from: [ACTIVE, RENEWAL_PENDING]
        to: MTM
        trigger: "system clock sweep: current UTC date >= term_end_date (half-open term end)"
        actor: system
        preconditions: ["current clock date >= term_end_date"]
        side_effects:
          - "monthly_rent_cents := mtm_rent_cents calculation result"
          - "mtm_converted_on := current clock date"
          - "status_before_offer := MTM if an offer cycle remains open (else null)"
      - from: [ACTIVE, MTM, RENEWAL_PENDING]
        to: NON_RENEWAL_NOTICED
        trigger: "system side effect of POST /non-renewal-notices/{id}/serve"
        actor: system
        preconditions: []
        side_effects:
          - "notice.prior_lease_status := current lease status"
      - from: NON_RENEWAL_NOTICED
        to: ACTIVE
        trigger: "system side effect of POST /non-renewal-notices/{id}/rescind when prior_lease_status == ACTIVE"
        actor: system
        preconditions: ["notice.prior_lease_status == ACTIVE"]
        side_effects: []
      - from: NON_RENEWAL_NOTICED
        to: MTM
        trigger: "system side effect of POST /non-renewal-notices/{id}/rescind when prior_lease_status == MTM"
        actor: system
        preconditions: ["notice.prior_lease_status == MTM"]
        side_effects: []
      - from: NON_RENEWAL_NOTICED
        to: RENEWAL_PENDING
        trigger: "system side effect of POST /non-renewal-notices/{id}/rescind when prior_lease_status == RENEWAL_PENDING"
        actor: system
        preconditions: ["notice.prior_lease_status == RENEWAL_PENDING"]
        side_effects: []
      - from: NON_RENEWAL_NOTICED
        to: ENDED
        trigger: "system clock sweep: notice ENFORCED at effective_date"
        actor: system
        preconditions: ["linked notice reaches ENFORCED"]
        side_effects:
          - "status_before_offer := null (no offer can still be open at enforcement: non-accepted offers were withdrawn at serve, and an ACCEPTED offer's execution deadline always lapses before any statutorily valid effective_date)"

  - entity: RenewalOffer
    field: status
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN, SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /renewal-offers/{id}/issue"
        actor: "LeasingAgent | PropertyManager | RegionalDirector"
        preconditions:
          - "Lease status in {ACTIVE, MTM, RENEWAL_PENDING} (ERR_LEASE_NOT_ISSUABLE)"
          - "latest_issue_date is null (lease MTM) OR current clock date <= latest_issue_date (ERR_NOTICE_WINDOW_MISSED)"
        side_effects:
          - "issued_on_date := clock date; issued_by_user_id := X-User-ID"
          - "response_deadline_date := min(clock date + 14 days, lease.term_end_date)"
          - "Lease ACTIVE/MTM -> RENEWAL_PENDING (status_before_offer set on first entry)"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /renewal-offers/{id}/respond with response_type=ACCEPT"
        actor: Resident
        preconditions:
          - "X-User-ID == lease.resident_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "accepted_on_date := clock date; execution_deadline_date := clock date + 10 days"
          - "creates RenewalDocument (GENERATED) for this offer"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /renewal-offers/{id}/respond with response_type=DECLINE"
        actor: Resident
        preconditions:
          - "X-User-ID == lease.resident_id"
        side_effects:
          - "if no other open offer for the lease: Lease RENEWAL_PENDING reverts to status_before_offer"
      - from: ISSUED
        to: COUNTERED
        trigger: "POST /renewal-offers/{id}/respond with response_type=COUNTER"
        actor: Resident
        preconditions:
          - "X-User-ID == lease.resident_id"
          - "offer_round < 3 (ERR_MAX_NEGOTIATION_ROUNDS)"
          - "counter_term_months (if provided) within [property.min_term_months, property.max_term_months] (ERR_TERM_OUTSIDE_STAGGERING_BAND)"
        side_effects:
          - "counter_rent_cents / counter_term_months recorded"
      - from: COUNTERED
        to: ISSUED
        trigger: "POST /renewal-offers/{id}/revise"
        actor: "LeasingAgent | PropertyManager | RegionalDirector"
        preconditions:
          - "revised_rent_cents defaults to counter_rent_cents; revised_term_months defaults to offered_term_months"
          - "revised_term_months within property band (ERR_TERM_OUTSIDE_STAGGERING_BAND)"
          - "if revised rent < proposed_rent_cents: an APPROVED ConcessionApproval for this offer with requested_rent_cents == revised_rent_cents must exist (ERR_CONCESSION_APPROVAL_REQUIRED)"
          - "recomputed increase over base_rent_cents <= property policy effective_cap_bps (ERR_RENT_CAP_EXCEEDED)"
          - "if recomputed increase > high_increase_threshold_bps: current clock date <= term_end_date - notice_days_high (ERR_NOTICE_WINDOW_MISSED)"
        side_effects:
          - "offer_round += 1; proposed_rent_cents := revised rent; proposed_increase_bps / notice_days_required / latest_issue_date recomputed"
          - "offered_term_months := revised_term_months"
          - "issued_on_date := clock date; response_deadline_date := min(clock date + 14, term_end_date)"
          - "the consumed ConcessionApproval -> APPLIED"
      - from: [DRAFT, ISSUED, COUNTERED]
        to: WITHDRAWN
        trigger: "POST /renewal-offers/{id}/withdraw"
        actor: "LeasingAgent | PropertyManager | RegionalDirector"
        preconditions: []
        side_effects:
          - "SUBMITTED/APPROVED ConcessionApprovals for this offer -> VOIDED"
          - "if no other open offer for the lease: Lease RENEWAL_PENDING reverts to status_before_offer"
      - from: [DRAFT, ISSUED, COUNTERED]
        to: SUPERSEDED
        trigger: "system (a new RenewalOffer is created for the same lease)"
        actor: system
        preconditions: []
        side_effects:
          - "SUBMITTED/APPROVED ConcessionApprovals for this offer -> VOIDED"
          - "new offer.supersedes_offer_id := the most recently created superseded offer"
          - "if no other open offer for the lease: Lease RENEWAL_PENDING reverts to status_before_offer"
      - from: [ISSUED, COUNTERED]
        to: EXPIRED
        trigger: "system clock sweep: current date > response_deadline_date"
        actor: system
        preconditions: []
        side_effects:
          - "SUBMITTED/APPROVED ConcessionApprovals for this offer -> VOIDED"
          - "lease revert check as above"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "system side effect of POST /renewal-documents/{id}/countersign"
        actor: system
        preconditions: []
        side_effects:
          - "executed_rent_cents := final-variant recompute (current policy cap + current unit market rent)"
      - from: ACCEPTED
        to: VOIDED
        trigger: "system clock sweep: current date > execution_deadline_date"
        actor: system
        preconditions: []
        side_effects:
          - "GENERATED/RESIDENT_SIGNED RenewalDocument for this offer -> VOIDED"
          - "lease revert check as above"
      - from: EXECUTED
        to: VOIDED
        trigger: "system side effect of POST /renewal-documents/{id}/rescind"
        actor: system
        preconditions: []
        side_effects: ["lease economics restored from document snapshot (see RenewalDocument rescind)"]

  - entity: ConcessionApproval
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, APPLIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /concession-approvals/{id}/approve"
        actor: "LeasingAgent | PropertyManager | RegionalDirector"
        preconditions:
          - "linked offer status == COUNTERED (ERR_OFFER_NOT_COUNTERED)"
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "concession_bps <= approver tier cap: LeasingAgent 300, PropertyManager 800, RegionalDirector 2000 (ERR_CONCESSION_TIER_EXCEEDED)"
        side_effects: ["decided_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /concession-approvals/{id}/deny"
        actor: "LeasingAgent | PropertyManager | RegionalDirector"
        preconditions:
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by_user_id := X-User-ID"]
      - from: APPROVED
        to: APPLIED
        trigger: "system side effect of POST /renewal-offers/{id}/revise consuming the approval"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SUBMITTED, APPROVED]
        to: VOIDED
        trigger: "system cascade: linked offer becomes WITHDRAWN / SUPERSEDED / EXPIRED, or lease is ENDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: NonRenewalNotice
    field: status
    initial_state: DRAFT
    terminal_states: [RESCINDED, ENFORCED]
    transitions:
      - from: DRAFT
        to: SERVED
        trigger: "POST /non-renewal-notices/{id}/serve"
        actor: "PropertyManager | RegionalDirector"
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "lease status in {ACTIVE, MTM, RENEWAL_PENDING} (ERR_LEASE_NOT_ISSUABLE)"
          - "effective_date >= lease.term_end_date (ERR_INVALID_EFFECTIVE_DATE)"
          - "clock date <= effective_date - policy.non_renewal_notice_days (ERR_INSUFFICIENT_NOTICE_LEAD)"
          - "cause_type == PROPERTY_REPOSITIONING: fewer than 2 other notices with cause PROPERTY_REPOSITIONING in status {SERVED, CONFIRMED, ENFORCED} on the same property with effective_date in the same calendar quarter (ERR_REPOSITIONING_QUOTA_EXCEEDED)"
        side_effects:
          - "served_on_date := clock date; cure_deadline_date := clock date + 10 days; served_by_user_id := X-User-ID"
          - "Lease -> NON_RENEWAL_NOTICED with notice.prior_lease_status recorded (link 1)"
          - "the lease leaving an issuable status withdraws its open offers: DRAFT/ISSUED/COUNTERED offers for the lease -> WITHDRAWN (link 2, caused by the lease mutation); ACCEPTED offers survive until their own execution deadline"
          - "each withdrawn offer voids its SUBMITTED/APPROVED ConcessionApprovals -> VOIDED (link 3, caused by the offer withdrawal, not by the serve directly)"
      - from: SERVED
        to: RESCINDED
        trigger: "POST /non-renewal-notices/{id}/rescind (resident cured the cause within the cure window)"
        actor: "PropertyManager | RegionalDirector"
        preconditions:
          - "clock date <= cure_deadline_date (else the notice is already CONFIRMED and rescind returns ERR_NOTICE_NOT_SERVED)"
        side_effects:
          - "Lease status restored to notice.prior_lease_status verbatim (compensating action)"
          - "withdrawn offers are NOT resurrected"
      - from: SERVED
        to: CONFIRMED
        trigger: "system clock sweep: current date > cure_deadline_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: ENFORCED
        trigger: "system clock sweep: current date >= effective_date"
        actor: system
        preconditions: []
        side_effects:
          - "Lease -> ENDED"
          - "ACCEPTED offer (if any) -> VOIDED; its GENERATED/RESIDENT_SIGNED document -> VOIDED"

  - entity: RenewalDocument
    field: status
    initial_state: GENERATED
    terminal_states: [VOIDED, RESCINDED]
    transitions:
      - from: GENERATED
        to: RESIDENT_SIGNED
        trigger: "POST /renewal-documents/{id}/sign-resident"
        actor: Resident
        preconditions:
          - "X-User-ID == lease.resident_id (ERR_NOT_RESOURCE_OWNER)"
          - "document status == GENERATED (ERR_DOCUMENT_INVALID_STATE)"
        side_effects: []
      - from: RESIDENT_SIGNED
        to: COUNTERSIGNED
        trigger: "POST /renewal-documents/{id}/countersign"
        actor: "PropertyManager | RegionalDirector"
        preconditions:
          - "document status == RESIDENT_SIGNED (ERR_DOCUMENT_INVALID_STATE)"
          - "lease status != ENDED (unreachable in practice: enforcement voids the document first; documented for defense in depth)"
        side_effects:
          - "executed_rent_cents := final-variant recompute (current policy cap, current unit market rent, offer rate_strategy and offered_term_months)"
          - "prior_* snapshot fields captured from the lease; prior_lease_status := lease.status_before_offer if set, else lease.status"
          - "countersigned_on_date := clock date; rescind_deadline_date := clock date + 3 days"
          - "offer ACCEPTED -> EXECUTED (executed_rent_cents mirrored)"
          - "lease renewed: rent, term_start/term_months/term_end updated; status -> ACTIVE; version + 1"
      - from: COUNTERSIGNED
        to: RESCINDED
        trigger: "POST /renewal-documents/{id}/rescind"
        actor: Resident
        preconditions:
          - "X-User-ID == lease.resident_id"
          - "document status == COUNTERSIGNED (ERR_DOCUMENT_INVALID_STATE)"
          - "clock date <= rescind_deadline_date (ERR_RESCISSION_WINDOW_LAPSED)"
        side_effects:
          - "offer EXECUTED -> VOIDED"
          - "lease restored from prior_* snapshot: monthly_rent_cents, term_start_date, term_months, term_end_date; status := document.prior_lease_status; status_before_offer := null"
      - from: [GENERATED, RESIDENT_SIGNED]
        to: VOIDED
        trigger: "system cascade: offer becomes VOIDED (execution deadline lapsed or lease ended)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; both parents have common_fields: true)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /leases/{leaseId}/renewal-offers"
    occ_field: expected_lease_version
    description: |
      Creating a RenewalOffer against a Lease whose version has advanced since
      the client last observed it is rejected. Offer creation legitimately
      supersedes any open offer on the lease, so a writer holding a stale lease
      version would supersede offers it never observed; the stale-version check
      rejects the write.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
  - rule_id: property-config-stale-update
    parent_entity: Property
    write_endpoint: "PATCH /properties/{id}"
    occ_field: expected_property_version
    description: |
      Updating a Property's staggering band or name against a version the
      client has not observed is rejected; the client must re-read the property
      and resubmit with the current version.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_cap_bps
    trigger: "RentCapPolicy create and PATCH"
    algorithm: threshold
    formula: |
      effective_cap_bps = min(base_cap_bps + cpi_adjustment_bps, hard_ceiling_bps)
    input_set: "the policy row itself"
    precision: "integer bps, no rounding"

  - name: proposed_rent_cents
    trigger: "RenewalOffer creation (provisional variant) and revise; final variant recomputed at document countersign into executed_rent_cents"
    algorithm: tiered_pricing
    formula: |
      1. gap_bps = max(0, round_half_up((unit.current_market_rent_cents - lease.monthly_rent_cents) / lease.monthly_rent_cents * 10000))
      2. strategy_pct_bps = round_half_up(gap_bps * factor), factor by rate_strategy:
         AGGRESSIVE 1.0 | BALANCED 0.6 | CONSERVATIVE 0.3
      3. term_discount_bps = min((offered_term_months - 12) * TERM_DISCOUNT_PER_MONTH_BPS, MAX_TERM_DISCOUNT_BPS), floored at 0
      4. uncapped_bps = max(0, strategy_pct_bps - term_discount_bps)
      5. capped_bps = min(uncapped_bps, cap_bps)
      6. rent = round_half_up(lease.monthly_rent_cents * (1 + capped_bps / 10000)) to whole cents
      Provisional variant: cap_bps = offer.cap_bps_snapshot (policy at creation);
      market rent and base rent as of creation. Final variant (executed_rent_cents
      at countersign): cap_bps = policy.effective_cap_bps THEN current;
      unit.current_market_rent_cents THEN current; base rent = lease.monthly_rent_cents
      THEN current; rate_strategy and offered_term_months from the offer.
    input_set: "the offer, its lease, the lease's unit, the property's RentCapPolicy"
    constants:
      TERM_DISCOUNT_PER_MONTH_BPS: 10
      MAX_TERM_DISCOUNT_BPS: 180
    precision: "integer cents, round_half_up at each step that produces a stored value"
    variants:
      - name: provisional
        when: "offer creation and revise"
        difference: "uses cap_bps_snapshot frozen at creation and market rent at that moment; stored on proposed_rent_cents"
      - name: final
        when: "document countersign"
        difference: "recomputes with the THEN-current policy effective cap and THEN-current unit market rent; stored on executed_rent_cents; differs from provisional whenever the policy or market rent drifted between issue and execution"

  - name: notice_days_required
    trigger: "RenewalOffer creation and revise (recompute)"
    algorithm: threshold
    formula: |
      notice_days_required = notice_days_high if proposed_increase_bps > high_increase_threshold_bps else notice_days_low
      Boundary: proposed_increase_bps exactly equal to the threshold takes the LOW tier (strictly-greater comparison).
      latest_issue_date = lease.term_end_date - notice_days_required days.
    input_set: "the offer's proposed_increase_bps; the property's RentCapPolicy tier fields"
    precision: "integer days"

  - name: staggered_term_selection
    trigger: "RenewalOffer creation"
    algorithm: weighted_scoring
    formula: |
      Candidate set: every integer term t in [property.min_term_months, property.max_term_months].
      For each candidate t: projected_end(t) = lease.term_end_date + t calendar months
        (base = lease.term_end_date; if lease is MTM, base = current clock date).
      load(t) = count of the property's leases with status in {ACTIVE, RENEWAL_PENDING, NON_RENEWAL_NOTICED}
        whose term_end_date falls in the calendar month of projected_end(t)
        + count of the property's open offers (DRAFT/ISSUED/COUNTERED/ACCEPTED) whose
        own projected_end falls in that month.
      Exclusions: the subject lease itself and its own offers never contribute to load.
      Ranking: pick t minimizing load(t); tie-break: larger t wins (term_months DESC).
      Fallback: the band is validated non-empty at property write time, so a candidate always exists.
    input_set: "all leases and open offers of the property except the subject lease's own"
    precision: "integer months; deterministic"

  - name: mtm_rent_cents
    trigger: "system clock sweep converting a lease to MTM (current date >= term_end_date while status in {ACTIVE, RENEWAL_PENDING})"
    algorithm: tiered_pricing
    formula: |
      1. base_cents = proposed_rent_cents of the most recently created offer for the lease
         whose issued_on_date IS NOT NULL (tie-break: created_at DESC); if no such offer exists,
         base_cents = round_half_up(lease.monthly_rent_cents * (1 + policy.effective_cap_bps / 10000))
      2. mtm_rent_cents = round_half_up(base_cents * (1 + MTM_PREMIUM_BPS / 10000))
      Rounding order is pinned: the base is rounded to whole cents FIRST, the premium is
      applied to the rounded base, and the result is rounded again. Computing
      rent * (1 + cap) * (1 + premium) with a single final rounding is the FORBIDDEN
      variant and can differ by a cent.
    input_set: "the converting lease, its issued offers, the property's RentCapPolicy"
    constants:
      MTM_PREMIUM_BPS: 1500
    precision: "integer cents, round_half_up per step (two rounding steps, order pinned)"

  - name: retention_rate_bps
    trigger: "GET /properties/{id}/retention-metrics"
    algorithm: aggregation
    formula: |
      Cohort = leases of the property whose term_end_date falls in [cohort_start, cohort_end]
      inclusive, PLUS leases holding a RenewalDocument that reached COUNTERSIGNED whose
      prior_term_end_date falls in the window (an executed renewal moves the lease's own
      term_end_date out of the window; cohort membership must survive execution, so the
      document's prior_term_end_date anchors it).
      Double-count guard: a lease appears at most once per window.
      TRAILING variant: retained = cohort leases holding a RenewalDocument currently
        COUNTERSIGNED with prior_term_end_date in window.
        A document since RESCINDED does NOT count as retained — the renewal was undone.
      PIPELINE variant: retained = TRAILING-retained + cohort leases with an offer currently
        ACCEPTED (document not yet countersigned) + cohort leases currently MTM.
      retention_rate_bps = round_half_up(retained / cohort_size * 10000); null when cohort_size == 0.
      mtm_count, lost_count (ENDED without executed renewal), pending_count (open offer, not accepted) reported alongside.
    input_set: "leases of the property anchored to the cohort window as above; their offers and documents"
    precision: "integer bps, round_half_up; null on empty cohort"
    variants:
      - name: TRAILING
        when: "variant=TRAILING"
        difference: "counts only countersigned (and not rescinded) renewals as retained; MTM and merely-accepted offers are NOT retained"
      - name: PIPELINE
        when: "variant=PIPELINE"
        difference: "adds ACCEPTED-not-yet-executed offers and MTM conversions to retained; strictly >= TRAILING for the same cohort"

  - name: concession_bps
    trigger: "ConcessionApproval creation"
    algorithm: threshold
    formula: |
      concession_bps = round_half_up((offer.proposed_rent_cents - requested_rent_cents) / offer.proposed_rent_cents * 10000)
      Approval authority tiers (inclusive upper bounds):
        LeasingAgent <= AGENT_MAX_CONCESSION_BPS
        PropertyManager <= MANAGER_MAX_CONCESSION_BPS
        RegionalDirector <= ABSOLUTE_MAX_CONCESSION_BPS
      requested_rent_cents below the absolute floor (concession_bps > ABSOLUTE_MAX_CONCESSION_BPS) is rejected at submission.
    input_set: "the offer's current proposed_rent_cents; requested_rent_cents"
    constants:
      AGENT_MAX_CONCESSION_BPS: 300
      MANAGER_MAX_CONCESSION_BPS: 800
      ABSOLUTE_MAX_CONCESSION_BPS: 2000
    precision: "integer bps, round_half_up"

  - name: expiration_forecast_load
    trigger: "GET /properties/{id}/expiration-forecast"
    algorithm: aggregation
    formula: |
      For each calendar month m in [current clock month, current clock month + months_ahead):
        committed(m) = count of leases with status in {ACTIVE, RENEWAL_PENDING, NON_RENEWAL_NOTICED}
          whose term_end_date falls in m
        projected(m) = count of open offers (DRAFT/ISSUED/COUNTERED/ACCEPTED) whose
          projected_end (per staggered_term_selection's definition) falls in m
      Returns rows ordered by month ascending.
    input_set: "all leases and open offers of the property"
    precision: "integer counts; month granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum members valid, dates well-formed YYYY-MM-DD, integers in range (e.g., term_months >= 1, min_term_months <= max_term_months, response_type in {ACCEPT, DECLINE, COUNTER}, COUNTER requires counter_rent_cents > 0; LEASE_VIOLATION cause requires evidence_ref)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right; then body FK ids (unit_id, resident_id, rent_cap_policy_id)"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_CONCESSION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_POLICY_NOT_FOUND"
    http_status: 404
    applies_to: "all parameterized endpoints and FK-bearing creates"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: role Resident requires X-User-ID == lease.resident_id of the target resource chain (offer -> lease, document -> lease, lease)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /renewal-offers/{id}/respond, POST /renewal-documents/{id}/sign-resident, POST /renewal-documents/{id}/rescind, and any Resident-role read"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: "ERR_STALE_LEASE_VERSION | ERR_STALE_PROPERTY_VERSION"
    http_status: 412
    applies_to: "POST /leases/{leaseId}/renewal-offers, PATCH /properties/{id}"
  - priority: 7
    category: state
    check: "Target entity state permits the transition (offer/notice/document/concession/lease state preconditions per §1.2)"
    error_id: "ERR_LEASE_NOT_ISSUABLE | ERR_OFFER_NOT_DRAFT | ERR_OFFER_NOT_ISSUED | ERR_OFFER_NOT_COUNTERED | ERR_OFFER_NOT_WITHDRAWABLE | ERR_DOCUMENT_INVALID_STATE | ERR_NOTICE_NOT_DRAFT | ERR_NOTICE_NOT_SERVED | ERR_CONCESSION_NOT_SUBMITTED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "Statutory rent cap: recomputed increase over base_rent_cents <= property policy effective_cap_bps (checked on revise against the CURRENT policy)"
    error_id: ERR_RENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /renewal-offers/{id}/revise"
  - priority: 9
    category: business_temporal
    check: "Statutory notice windows: issue requires clock date <= latest_issue_date; revise into the high-notice tier re-checks the long window; notice serve requires clock date <= effective_date - non_renewal_notice_days and effective_date >= lease.term_end_date; document rescind requires clock date <= rescind_deadline_date"
    error_id: "ERR_NOTICE_WINDOW_MISSED | ERR_INSUFFICIENT_NOTICE_LEAD | ERR_INVALID_EFFECTIVE_DATE | ERR_RESCISSION_WINDOW_LAPSED"
    http_status: 422
    applies_to: "POST /renewal-offers/{id}/issue, POST /renewal-offers/{id}/revise, POST /non-renewal-notices/{id}/serve, POST /renewal-documents/{id}/rescind"
    note: "ERR_RESCISSION_WINDOW_LAPSED returns http 409 (state-and-time hybrid); the other three return 422"
  - priority: 10
    category: business_constraint
    check: "Domain constraints in this sub-order: (a) term within property staggering band (ERR_TERM_OUTSIDE_STAGGERING_BAND); (b) unit half-open term overlap (ERR_LEASE_TERM_OVERLAP); (c) uniqueness of jurisdiction_code and (property_id, unit_number) (ERR_DUPLICATE_JURISDICTION / ERR_DUPLICATE_UNIT_NUMBER); (d) negotiation round cap offer_round < 3 (ERR_MAX_NEGOTIATION_ROUNDS); (e) segregation of duties (ERR_SEGREGATION_OF_DUTIES); (f) concession tier vs approver role (ERR_CONCESSION_TIER_EXCEEDED); (g) repositioning quarterly quota (ERR_REPOSITIONING_QUOTA_EXCEEDED); (h) approved-concession gate on revise (ERR_CONCESSION_APPROVAL_REQUIRED)"
    error_id: "ERR_TERM_OUTSIDE_STAGGERING_BAND | ERR_LEASE_TERM_OVERLAP | ERR_DUPLICATE_JURISDICTION | ERR_DUPLICATE_UNIT_NUMBER | ERR_MAX_NEGOTIATION_ROUNDS | ERR_SEGREGATION_OF_DUTIES | ERR_CONCESSION_TIER_EXCEEDED | ERR_REPOSITIONING_QUOTA_EXCEEDED | ERR_CONCESSION_APPROVAL_REQUIRED"
    http_status: 409
    applies_to: "POST /leases, POST /units, POST /rent-cap-policies, POST /renewal-offers/{id}/respond, POST /renewal-offers/{id}/revise, POST /renewal-offers/{id}/concession-approvals, POST /concession-approvals/{id}/approve, POST /concession-approvals/{id}/deny, POST /non-renewal-notices/{id}/serve"
    note: "http varies per error: ERR_TERM_OUTSIDE_STAGGERING_BAND 422; ERR_SEGREGATION_OF_DUTIES 403; ERR_CONCESSION_TIER_EXCEEDED 403; ERR_REPOSITIONING_QUOTA_EXCEEDED 422; the rest 409"
  - priority: 11
    category: business_fiscal
    check: "Concession magnitude: concession_bps <= ABSOLUTE_MAX_CONCESSION_BPS (2000) at submission"
    error_id: ERR_CONCESSION_EXCEEDS_ABSOLUTE_MAX
    http_status: 422
    applies_to: "POST /renewal-offers/{offerId}/concession-approvals"

# =============================================================================
# §1.5 API Endpoint Table (41 endpoints)
# Staff = PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent.
# Logical clock default: 2026-05-01T00:00:00Z before any set_current_utc call.
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock; default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock). Synchronously applies all due time-based transitions in fixed sweep order: (1) notice cure-lapse, (2) notice enforcement, (3) offer expiry/void, (4) lease MTM conversion."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, transitions_applied: integer }
    side_effects: ["time-based transitions per sweep order; each mutated entity's version increments"]

  - method: POST
    path: "/rent-cap-policies"
    description: "Create a rent-cap policy for a jurisdiction"
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_code, base_cap_bps, cpi_adjustment_bps, hard_ceiling_bps, high_increase_threshold_bps, notice_days_low, notice_days_high, non_renewal_notice_days]
    output: RentCapPolicy
    side_effects: ["effective_cap_bps computed; ERR_DUPLICATE_JURISDICTION on duplicate jurisdiction_code"]

  - method: GET
    path: "/rent-cap-policies/{id}"
    description: "Get a rent-cap policy"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: RentCapPolicy
    side_effects: []

  - method: PATCH
    path: "/rent-cap-policies/{id}"
    description: "Update a rent-cap policy (e.g., annual CPI adjustment); does NOT alter existing offers' cap_bps_snapshot; final-variant execution uses the updated policy"
    roles: [PlatformAdmin]
    code: 200
    input: ["base_cap_bps?", "cpi_adjustment_bps?", "hard_ceiling_bps?", "high_increase_threshold_bps?", "notice_days_low?", "notice_days_high?", "non_renewal_notice_days?"]
    output: RentCapPolicy
    side_effects: ["effective_cap_bps recomputed; increments RentCapPolicy.version by 1"]

  - method: POST
    path: "/properties"
    description: "Create a property with its staggering band"
    roles: [PlatformAdmin]
    code: 201
    input: [name, rent_cap_policy_id, min_term_months, max_term_months]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["rent_cap_policy_id?", "limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/properties/{id}"
    description: "Get a property"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: PATCH
    path: "/properties/{id}"
    description: "Update property name / staggering band; OCC via expected_property_version"
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "min_term_months?", "max_term_months?", expected_property_version]
    output: Property
    side_effects: ["increments Property.version by 1"]

  - method: GET
    path: "/properties/{id}/retention-metrics"
    description: "Retention report for the lease-expiry cohort in [cohort_start, cohort_end] inclusive; variant selects TRAILING (executed only) vs PIPELINE (adds accepted offers and MTM)"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager]
    code: 200
    input: [cohort_start, cohort_end, variant]
    output: { cohort_size: integer, retained_count: integer, mtm_count: integer, lost_count: integer, pending_count: integer, retention_rate_bps: integer, variant: string }
    side_effects: []

  - method: GET
    path: "/properties/{id}/expiration-forecast"
    description: "Per-month committed and projected lease-expiration counts used by staggering"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["months_ahead?"]
    output: { window_start: string, months: array }
    side_effects: []

  - method: POST
    path: "/units"
    description: "Create a unit"
    roles: [PlatformAdmin]
    code: 201
    input: [property_id, unit_number, bedrooms, current_market_rent_cents]
    output: Unit
    side_effects: ["ERR_DUPLICATE_UNIT_NUMBER on duplicate (property_id, unit_number)"]

  - method: GET
    path: "/units"
    description: "List units"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/units/{id}"
    description: "Get a unit"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/residents"
    description: "Onboard a resident"
    roles: [PlatformAdmin, PropertyManager, LeasingAgent]
    code: 201
    input: [full_name, email]
    output: Resident
    side_effects: []

  - method: GET
    path: "/residents"
    description: "List residents"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Resident[]"
    side_effects: []

  - method: GET
    path: "/residents/{id}"
    description: "Get a resident"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: POST
    path: "/leases"
    description: "Create a lease; half-open term overlap with another non-ENDED lease on the same unit is rejected"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input: [unit_id, resident_id, term_start_date, term_months, monthly_rent_cents]
    output: Lease
    side_effects: ["term_end_date computed; property_id denormalized from unit; status ACTIVE"]

  - method: GET
    path: "/leases"
    description: "List leases with filters"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: ["unit_id?", "property_id?", "resident_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: []

  - method: GET
    path: "/leases/{id}"
    description: "Get a lease"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: POST
    path: "/leases/{leaseId}/renewal-offers"
    description: "Create a renewal offer (DRAFT) with system-selected term and provisional pricing; supersedes any open offers on the lease; OCC via expected_lease_version"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 201
    input: ["rate_strategy?", expected_lease_version]
    output: RenewalOffer
    side_effects:
      - "proposed_rent_cents / proposed_increase_bps / cap_bps_snapshot / offered_term_months / notice_days_required / latest_issue_date computed"
      - "open sibling offers (DRAFT/ISSUED/COUNTERED) -> SUPERSEDED; their SUBMITTED/APPROVED ConcessionApprovals -> VOIDED"
      - "supersedes_offer_id set to the most recently created superseded offer (null if none)"
      - "increments Lease.version by 1"

  - method: GET
    path: "/renewal-offers"
    description: "List renewal offers with filters"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: ["lease_id?", "status?", "supersedes_offer_id?", "limit?", "offset?"]
    output: "RenewalOffer[]"
    side_effects: []

  - method: GET
    path: "/renewal-offers/{id}"
    description: "Get a renewal offer"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []

  - method: POST
    path: "/renewal-offers/{id}/issue"
    description: "Issue a DRAFT offer to the resident (statutory notice window enforced)"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["offer DRAFT -> ISSUED; issued_on_date/response_deadline_date set; lease ACTIVE/MTM -> RENEWAL_PENDING"]

  - method: POST
    path: "/renewal-offers/{id}/respond"
    description: "Resident responds to an ISSUED offer: ACCEPT, DECLINE, or COUNTER (with counter_rent_cents and optional counter_term_months)"
    roles: [Resident]
    code: 200
    input: [response_type, "counter_rent_cents?", "counter_term_months?"]
    output: RenewalOffer
    side_effects: ["ACCEPT -> creates RenewalDocument GENERATED + execution_deadline_date; COUNTER -> stores counter terms; DECLINE -> lease revert check"]

  - method: POST
    path: "/renewal-offers/{id}/revise"
    description: "Agent issues a revised round on a COUNTERED offer; may consume an APPROVED ConcessionApproval"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 200
    input: ["revised_rent_cents?", "revised_term_months?"]
    output: RenewalOffer
    side_effects: ["offer_round + 1; pricing fields recomputed; consumed ConcessionApproval -> APPLIED; response_deadline_date reset"]

  - method: POST
    path: "/renewal-offers/{id}/withdraw"
    description: "Withdraw an open offer (DRAFT/ISSUED/COUNTERED)"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["offer -> WITHDRAWN; SUBMITTED/APPROVED ConcessionApprovals -> VOIDED; lease revert check"]

  - method: POST
    path: "/renewal-offers/{offerId}/concession-approvals"
    description: "Request authority to offer rent below the strategy-proposed rent (requires offer COUNTERED)"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 201
    input: [requested_rent_cents, "reason?"]
    output: ConcessionApproval
    side_effects: ["concession_bps computed; ERR_CONCESSION_EXCEEDS_ABSOLUTE_MAX when concession_bps > 2000"]

  - method: GET
    path: "/concession-approvals"
    description: "List concession approvals with filters"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["offer_id?", "status?", "limit?", "offset?"]
    output: "ConcessionApproval[]"
    side_effects: []

  - method: GET
    path: "/concession-approvals/{id}"
    description: "Get a concession approval"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: ConcessionApproval
    side_effects: []

  - method: POST
    path: "/concession-approvals/{id}/approve"
    description: "Approve a SUBMITTED concession within the approver's authority tier; approver must differ from requester"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: ConcessionApproval
    side_effects: ["status -> APPROVED; decided_by_user_id set"]

  - method: POST
    path: "/concession-approvals/{id}/deny"
    description: "Deny a SUBMITTED concession; denier must differ from requester"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: ConcessionApproval
    side_effects: ["status -> DENIED; decided_by_user_id set"]

  - method: POST
    path: "/leases/{leaseId}/non-renewal-notices"
    description: "Create a non-renewal notice (DRAFT) for cause"
    roles: [LeasingAgent, PropertyManager, RegionalDirector]
    code: 201
    input: [cause_type, effective_date, "evidence_ref?"]
    output: NonRenewalNotice
    side_effects: []

  - method: GET
    path: "/non-renewal-notices"
    description: "List non-renewal notices with filters"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "NonRenewalNotice[]"
    side_effects: []

  - method: GET
    path: "/non-renewal-notices/{id}"
    description: "Get a non-renewal notice"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent]
    code: 200
    input: []
    output: NonRenewalNotice
    side_effects: []

  - method: POST
    path: "/non-renewal-notices/{id}/serve"
    description: "Serve a DRAFT notice (statutory lead time, effective date, SoD, repositioning quota enforced)"
    roles: [PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: NonRenewalNotice
    side_effects: ["notice DRAFT -> SERVED; lease -> NON_RENEWAL_NOTICED; open offers -> WITHDRAWN cascade; their concessions -> VOIDED"]

  - method: POST
    path: "/non-renewal-notices/{id}/rescind"
    description: "Rescind a SERVED notice within the cure window; restores lease status verbatim"
    roles: [PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: NonRenewalNotice
    side_effects: ["notice SERVED -> RESCINDED; lease status restored from notice.prior_lease_status"]

  - method: GET
    path: "/renewal-documents"
    description: "List renewal documents with filters"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: ["offer_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: "RenewalDocument[]"
    side_effects: []

  - method: GET
    path: "/renewal-documents/{id}"
    description: "Get a renewal document"
    roles: [PlatformAdmin, RegionalDirector, PropertyManager, LeasingAgent, Resident]
    code: 200
    input: []
    output: RenewalDocument
    side_effects: []

  - method: POST
    path: "/renewal-documents/{id}/sign-resident"
    description: "Resident signs the renewal document"
    roles: [Resident]
    code: 200
    input: []
    output: RenewalDocument
    side_effects: ["GENERATED -> RESIDENT_SIGNED"]

  - method: POST
    path: "/renewal-documents/{id}/countersign"
    description: "Management countersigns: executes the renewal (final-variant rent recompute, lease term/rent update, offer EXECUTED)"
    roles: [PropertyManager, RegionalDirector]
    code: 200
    input: []
    output: RenewalDocument
    side_effects: ["RESIDENT_SIGNED -> COUNTERSIGNED; offer ACCEPTED -> EXECUTED; lease renewed (rent/term/status ACTIVE); prior_* snapshot captured"]

  - method: POST
    path: "/renewal-documents/{id}/rescind"
    description: "Resident rescinds an executed renewal within 3 days of countersign (compensating action restoring lease economics)"
    roles: [Resident]
    code: 200
    input: []
    output: RenewalDocument
    side_effects: ["COUNTERSIGNED -> RESCINDED; offer EXECUTED -> VOIDED; lease restored from prior_* snapshot"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Resident X-User-ID does not match the lease's resident_id for this resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, malformed date, term range invalid, COUNTER without counter_rent_cents > 0, or LEASE_VIOLATION without evidence_ref" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "RentCapPolicy id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist (path or body FK)" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit id does not exist" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "Resident id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "Lease id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "RenewalOffer id does not exist" }
  - { id: ERR_CONCESSION_NOT_FOUND, http: 404, condition: "ConcessionApproval id does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "NonRenewalNotice id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "RenewalDocument id does not exist" }
  - { id: ERR_STALE_LEASE_VERSION, http: 412, condition: "expected_lease_version does not match the lease's current version" }
  - { id: ERR_STALE_PROPERTY_VERSION, http: 412, condition: "expected_property_version does not match the property's current version" }
  - { id: ERR_LEASE_TERM_OVERLAP, http: 409, condition: "Unit already has a non-ENDED lease whose half-open [term_start_date, term_end_date) intersects the requested term" }
  - { id: ERR_DUPLICATE_JURISDICTION, http: 409, condition: "RentCapPolicy jurisdiction_code already exists" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "Unit number already exists within the property" }
  - { id: ERR_LEASE_NOT_ISSUABLE, http: 409, condition: "Lease is ENDED or NON_RENEWAL_NOTICED when creating or issuing an offer" }
  - { id: ERR_OFFER_NOT_DRAFT, http: 409, condition: "Issue requires the offer to be DRAFT" }
  - { id: ERR_OFFER_NOT_ISSUED, http: 409, condition: "Respond requires the offer to be ISSUED" }
  - { id: ERR_OFFER_NOT_COUNTERED, http: 409, condition: "Revise, concession submission, and concession approval require the offer to be COUNTERED" }
  - { id: ERR_OFFER_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw requires DRAFT, ISSUED, or COUNTERED; terminal offers reject" }
  - { id: ERR_DOCUMENT_INVALID_STATE, http: 409, condition: "Document transition precondition failed (sign requires GENERATED, countersign requires RESIDENT_SIGNED, rescind requires COUNTERSIGNED)" }
  - { id: ERR_NOTICE_NOT_DRAFT, http: 409, condition: "Serve requires the notice to be DRAFT" }
  - { id: ERR_NOTICE_NOT_SERVED, http: 409, condition: "Rescind requires the notice to be SERVED (also when the cure window lapsed and the notice auto-CONFIRMED)" }
  - { id: ERR_CONCESSION_NOT_SUBMITTED, http: 409, condition: "Approve/deny requires the concession to be SUBMITTED" }
  - { id: ERR_RENT_CAP_EXCEEDED, http: 422, condition: "Revised rent's increase over base_rent_cents exceeds the policy's current effective_cap_bps" }
  - { id: ERR_NOTICE_WINDOW_MISSED, http: 422, condition: "Issue (or revise into the high-notice tier) is later than the statutory latest_issue_date" }
  - { id: ERR_INSUFFICIENT_NOTICE_LEAD, http: 422, condition: "Serve date is later than effective_date - non_renewal_notice_days" }
  - { id: ERR_INVALID_EFFECTIVE_DATE, http: 422, condition: "Notice effective_date is earlier than the lease's term_end_date" }
  - { id: ERR_TERM_OUTSIDE_STAGGERING_BAND, http: 422, condition: "Countered or revised term outside [property.min_term_months, property.max_term_months]" }
  - { id: ERR_MAX_NEGOTIATION_ROUNDS, http: 409, condition: "COUNTER attempted when offer_round is already 3" }
  - { id: ERR_CONCESSION_APPROVAL_REQUIRED, http: 409, condition: "Revise below proposed_rent_cents without an APPROVED ConcessionApproval matching requested_rent_cents" }
  - { id: ERR_CONCESSION_TIER_EXCEEDED, http: 403, condition: "Approver's role tier does not cover the concession_bps (agent <= 300, manager <= 800, director <= 2000)" }
  - { id: ERR_CONCESSION_EXCEEDS_ABSOLUTE_MAX, http: 422, condition: "Requested concession exceeds 2000 bps at submission" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver equals requester on a concession decision, or notice server equals notice creator" }
  - { id: ERR_REPOSITIONING_QUOTA_EXCEEDED, http: 422, condition: "Third PROPERTY_REPOSITIONING notice with effective_date in the same calendar quarter on the same property" }
  - { id: ERR_RESCISSION_WINDOW_LAPSED, http: 409, condition: "Rescind attempted after countersigned_on_date + 3 days" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: policies, properties, units, resident onboarding, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /rent-cap-policies, PATCH /rent-cap-policies/{id}"
      - "POST /properties, PATCH /properties/{id}"
      - "POST /units"
    shared_operations:
      - "GET reads on all resources"
      - "POST /residents"
      - "POST /leases"
      - "GET retention-metrics and expiration-forecast"
  - name: RegionalDirector
    description: "Top staff tier; approves concessions up to 2000 bps; inherits all PropertyManager and LeasingAgent operations"
    identity: opaque
    exclusive_operations:
      - "Approve concessions with 800 < concession_bps <= 2000"
    shared_operations:
      - "All PropertyManager and LeasingAgent shared operations (offer lifecycle, notices, countersign, concession submit/decide)"
  - name: PropertyManager
    description: "Property-level manager: serves/rescinds notices, countersigns documents, approves concessions <= 800 bps, inherits LeasingAgent operations"
    identity: opaque
    exclusive_operations:
      - "POST /non-renewal-notices/{id}/serve, POST /non-renewal-notices/{id}/rescind"
      - "POST /renewal-documents/{id}/countersign"
      - "Approve concessions with 300 < concession_bps <= 800"
    shared_operations:
      - "All LeasingAgent shared operations (offer create/issue/revise/withdraw, concession submit/deny)"
      - "POST /leases, POST /residents, GET reads"
  - name: LeasingAgent
    description: "Leasing staff: creates and negotiates renewal offers, submits concessions, approves concessions <= 300 bps"
    identity: opaque
    exclusive_operations:
      - "Approve concessions with concession_bps <= 300 (jointly held with higher tiers; exclusive only in the sense that Resident/PlatformAdmin cannot)"
    shared_operations:
      - "POST /leases/{leaseId}/renewal-offers, POST /renewal-offers/{id}/issue, /revise, /withdraw"
      - "POST /renewal-offers/{offerId}/concession-approvals, POST /concession-approvals/{id}/deny"
      - "POST /leases/{leaseId}/non-renewal-notices (DRAFT creation)"
      - "POST /residents, GET reads"
  - name: Resident
    description: "The leaseholding resident; acts only on resources chained to a lease where resident_id == X-User-ID"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /renewal-offers/{id}/respond"
      - "POST /renewal-documents/{id}/sign-resident"
      - "POST /renewal-documents/{id}/rescind"
    shared_operations:
      - "GET /leases, GET /leases/{id}, GET /renewal-offers, GET /renewal-offers/{id}, GET /renewal-documents, GET /renewal-documents/{id} (ownership-scoped)"
