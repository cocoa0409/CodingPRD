          - entities.GameSession.fields.total_score
          - entities.GameSession.fields.shot_count
        distinguishing_aspect: |
          Empty/edge run-length boundary on a different metric (score streak) reached
          through the shots endpoint: a run of exactly 5 consecutive shots each >=10
          triggers the +25 bonus; a run of 4 would not. base 60 + bonus 25 = 85 with
          shot_count 5.
