              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-M", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { km: $.data.id }
            - call: "POST /surveillance/contacts/${km}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${km}/record-notification"
              payload: { outcome: "SUCCESS" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${km}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-16T00:00:00.000Z", end_date: "2026-03-29T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${km}/start-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts/${km}/complete-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MONITORING_NOT_ELAPSED"

