  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_windows_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - entities.InsurancePolicy.fields.coverage_start
          - validations[priority=10]
          - errors[ERR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on InsurancePolicy: a second policy for
          the same (borrower, crop, county) starting exactly at the first
          policy's coverage_end is accepted (adjacency touches but does not
          overlap), while a strictly overlapping window is rejected with
          ERR_COVERAGE_OVERLAP.
        test_recipe:
          setup:
            - "Borrower exists; policy P1 ACTIVE with window [2026-03-01, 2027-03-01) for CORN/BLACKHAWK"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol1: $.data.id } }
          trigger:
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-ADJ", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2027-03-01T00:00:00Z", coverage_end: "2028-03-01T00:00:00Z", coverage_amount_cents: 30000000 }, as: LoanOfficer, captures: { pol_adj: $.data.id } }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-OVR", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2027-06-01T00:00:00Z", coverage_amount_cents: 30000000 }, as: LoanOfficer, captures: { err: $.data.error_id } }
          assert:
            - "adjacent policy [2027-03-01, 2028-03-01) created: id ${pol_adj} exists (coverage_end == coverage_start touches without overlapping)"
            - "overlapping policy [2026-06-01, 2027-06-01) rejected: error_id == ERR_COVERAGE_OVERLAP (${err})"

      - name: deferral_windows_require_thirty_day_buffer
        grounds:
          - state_machines.DeferralRequest.SUBMITTED_to_APPROVED
          - errors[ERR_DEFERRAL_OVERLAP]
          - errors[ERR_DEFERRAL_GAP_TOO_SMALL]
        distinguishing_aspect: |
          Buffer semantics on DeferralRequest (different resource and different
          geometry from the policy half-open rule): overlap is rejected
          (ERR_DEFERRAL_OVERLAP), mere adjacency is ALSO rejected
          (ERR_DEFERRAL_GAP_TOO_SMALL), and only a start exactly 30 days after
          the prior window's end (2026-08-31 after 2026-08-01) is approved.
        test_recipe:
          setup:
            - "ACTIVE loan for a BLACKHAWK borrower; disaster DR-2026-07 declared covering BLACKHAWK 2026-05-01..2026-12-31; clock 2026-05-15; deferral D1 [2026-06-01, 2026-08-01) APPROVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
            - { call: "POST /associations/${assoc}/declare_disaster", payload: { disaster_ref: "DR-2026-07", counties: ["BLACKHAWK"], start_date: "2026-05-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: AssociationBoard }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: System }
            - { call: "POST /deferral-requests", payload: { loan_account_id: "${loan}", disaster_ref: "DR-2026-07", requested_start: "2026-06-01T00:00:00Z", requested_end: "2026-08-01T00:00:00Z" }, as: Borrower, as_user_id: "${bor}", captures: { d1: $.data.id } }
            - { call: "POST /deferral-requests/${d1}/approve", as: CreditCommittee }
          trigger:
            - { call: "POST /deferral-requests", payload: { loan_account_id: "${loan}", disaster_ref: "DR-2026-07", requested_start: "2026-07-01T00:00:00Z", requested_end: "2026-09-01T00:00:00Z" }, as: Borrower, as_user_id: "${bor}", captures: { d2: $.data.id } }
            - { call: "POST /deferral-requests/${d2}/approve", as: CreditCommittee, captures: { err_ovr: $.data.error_id } }
            - { call: "POST /deferral-requests", payload: { loan_account_id: "${loan}", disaster_ref: "DR-2026-07", requested_start: "2026-08-15T00:00:00Z", requested_end: "2026-10-01T00:00:00Z" }, as: Borrower, as_user_id: "${bor}", captures: { d3: $.data.id } }
            - { call: "POST /deferral-requests/${d3}/approve", as: CreditCommittee, captures: { err_gap: $.data.error_id } }
            - { call: "POST /deferral-requests", payload: { loan_account_id: "${loan}", disaster_ref: "DR-2026-07", requested_start: "2026-08-31T00:00:00Z", requested_end: "2026-10-15T00:00:00Z" }, as: Borrower, as_user_id: "${bor}", captures: { d4: $.data.id } }
            - { call: "POST /deferral-requests/${d4}/approve", as: CreditCommittee, captures: { st4: $.data.status } }
          assert:
            - "D2 overlapping [2026-07-01, 2026-09-01): error_id == ERR_DEFERRAL_OVERLAP (${err_ovr})"
            - "D3 at 14-day gap (2026-08-15): error_id == ERR_DEFERRAL_GAP_TOO_SMALL (${err_gap}) — adjacency alone is NOT acceptable here"
            - "D4 at exactly 30 days (2026-08-31 = end 2026-08-01 + 30d): status == APPROVED (${st4})"
            - "D1 remains APPROVED throughout"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: draw_disburse_rescind_conserves_loan_balances
        grounds:
          - state_machines.DrawRequest.DISBURSED_to_RESCINDED
          - calculations.interest_accrual
          - calculations.draw_availability
        distinguishing_aspect: |
          Conserved currency quantity: a same-UTC-day disburse-then-rescind
          pair must leave outstanding_principal_cents, accrued_interest_cents
          and available_credit_cents exactly at their pre-draw values — the
          zero-day accrual segment guarantees no interest drift.
        test_recipe:
          setup:
            - "ACTIVE loan commitment 50,000,000, BB 50,000,000; principal 0, accrued 0, availability 50,000,000; clock fixed at 2026-04-01 for the whole pair"
