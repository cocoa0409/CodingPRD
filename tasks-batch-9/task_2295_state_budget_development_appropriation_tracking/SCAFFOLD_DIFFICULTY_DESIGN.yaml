            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { src_id: $.data.id }
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P200", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { tgt_id: $.data.id }
            - call: "POST /fiscal/appropriations/${src_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
              captures: { src_v: $.data.version }
            - call: "POST /fiscal/appropriations/${tgt_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-transfers"
              payload: { source_appropriation_id: "${src_id}", target_appropriation_id: "${tgt_id}", amount_cents: 100000000, transfer_type: "INTRA_AGENCY", justification: "realign operating authority within the department", expected_source_appropriation_version: "${src_v}" }
              as: BudgetAnalyst
              as_user_id: "analyst-1"
              captures: { xfer_id: $.data.id }
            - call: "POST /fiscal/budget-transfers/${xfer_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /fiscal/budget-transfers/${xfer_id}/execute"
              payload: {}
              as: StateController
            - call: "POST /fiscal/budget-transfers/${xfer_id}/reverse"
              payload: { reason: "transfer authority withdrawn by the legislature" }
              as: StateController
            - call: "POST /fiscal/budget-transfers/${xfer_id}/reverse"
              payload: { reason: "duplicate reversal attempt" }
              as: StateController
          assert:
            - "after the execute: BudgetTransfer.${xfer_id}.status == EXECUTED, Appropriation.${src_id}.transfers_out_cents == 100000000 and Appropriation.${tgt_id}.transfers_in_cents == 100000000"
            - "after the execute: available_authority_cents is 900000000 for ${src_id} and 1100000000 for ${tgt_id}, summing to 2000000000"
            - "after the reverse: BudgetTransfer.${xfer_id}.status == REVERSED with decision_reason == \"transfer authority withdrawn by the legislature\""
            - "after the reverse: Appropriation.${src_id}.transfers_out_cents == 0 and Appropriation.${tgt_id}.transfers_in_cents == 0"
            - "after the reverse: available_authority_cents is 1000000000 for both ${src_id} and ${tgt_id}, still summing to 2000000000"
            - "enacted_amount_cents remains 1000000000 on both appropriations throughout, so no authority was created or destroyed"
            - "the second POST /fiscal/budget-transfers/${xfer_id}/reverse returns HTTP 409 with error_id == ERR_INVALID_STATE and no ledger field moves"

      - name: void_restores_expenditure_ledger_and_flips_the_moe_verdict_back
        grounds:
          - invariants.expenditure_ledger_conservation
          - state_machines.Expenditure.POSTED_to_VOIDED
          - calculations.appropriation_available_balance
          - calculations.federal_moe_compliance
          - entities.FederalGrant.fields.moe_compliance_ratio
        distinguishing_aspect: |
          A third compensating action (expenditure void) whose conserved quantity is the
          posted-charge ledger, and the only instance in this rule where the compensation
          also reverses a derived compliance verdict: the 250000000-cent charge lifts
          moe_current_spend_cents above the 200000000-cent baseline (COMPLIANT, ratio
          1.250000) and the void drops the re-assessed figure to 0 (DEFICIENT, ratio
          0.000000) while both balance bases return to their pre-posting values.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000 with an Allotment of 400000000 cents RELEASED for quarter 1"
            - "FederalGrant with moe_baseline_cents 200000000, moe_prior_year1_spend_cents 200000000 and moe_prior_year2_spend_cents 200000000"
            - "Logical clock at the default 2026-08-01T00:00:00Z, which is quarter 1"
