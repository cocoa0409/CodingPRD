    instances:
      - name: overtime_threshold_exactly_40
        grounds:
          - calculations.timesheet_pay
          - calculations.timesheet_bill
          - entities.Timesheet.fields.bill_cents
        distinguishing_aspect: |
          Numeric boundary on the OT threshold via POST /staffing/timesheets: hours == 40.0 yields
          0 overtime (bill 480000); hours == 40.5 yields 0.5 OT hours (bill 480000 + round_half_up(0.5*12000*1.5)=9000 => 489000).
          The strict '> 40' boundary is the distinguishing metric.
