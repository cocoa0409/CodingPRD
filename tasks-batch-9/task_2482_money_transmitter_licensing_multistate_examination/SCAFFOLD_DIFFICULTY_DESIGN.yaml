            - "Licensee.${lic_id}.coverage_posture == DEFICIENT"
            - "StateLicense.${lic_ca_id}.expansion_gate == BLOCKED"
            - "DelegateAuthorization.${auth_id}.status == SUSPENDED_BY_POSTURE"
            - "Delegate.${del_id}.status == SUSPENDED and oversight_hold == true"
            - "Delegate.${del_id}.authorized_state_count == 0 (the authorization was never ACTIVE, so no counter moved)"

      - name: bond_cancellation_cascades_license_authorization_and_delegate
        grounds:
          - state_machines.StateLicense.license_status.ACTIVE_to_SUSPENDED
          - state_machines.DelegateAuthorization.ACTIVE_to_SUSPENDED
          - state_machines.Delegate.ACTIVE_to_SUSPENDED
