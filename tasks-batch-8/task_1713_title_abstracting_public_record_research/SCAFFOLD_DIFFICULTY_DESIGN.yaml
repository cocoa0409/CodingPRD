scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_fee_provisional_estimate_vs_final_actuals
        grounds:
          - calculations.order_fee_provisional
          - calculations.order_fee_actualization
          - entities.AbstractOrder.fields.provisional_fee_cents
          - entities.AbstractOrder.fields.final_fee_cents
        distinguishing_aspect: |
          Dual variant on the AbstractOrder fee domain: the provisional variant prices
          8 PROJECTED per-document retrievals at creation (75000 for this RUSH order),
          while the final variant at delivery prices only ACTUAL posted fees (54688) —
          same order, two valid algorithms, different cents. Distinct entity domain from
          the CountyRetrieval per-mode pricing instance.
        test_recipe:
          setup:
            - "RUSH AbstractOrder (liability STANDARD) with one accepted CHAIN_OF_TITLE search, two verified documents, two fee-posted retrievals (PER_PAGE 10pp = 1250; PER_DOCUMENT = 2500), report approved; logical clock never advanced (received_at = 2026-08-01T00:00:00Z, due_at = 2026-08-02T00:00:00Z)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_701", property_address: "100 Pine St", county: "Travis", state_code: "TX", legal_description_text: "LOT 4 BLK B", search_period_years: 30, effective_date: "2026-01-15", sla_tier: "RUSH" }
              as: Client
              as_user_id: client_701
              captures: { ord: $.data.id, prov: $.data.provisional_fee_cents }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_701", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "Alice Smith", grantee_name: "Bob Jones", instrument_number: "INST-701-A", recording_date: "2010-06-01" }
              as: Abstracter
              as_user_id: abs_701
              captures: { doc1: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "MORTGAGE", grantor_name: "Bob Jones", grantee_name: "First Bank", instrument_number: "INST-701-B", recording_date: "2012-03-15" }
              as: Abstracter
              as_user_id: abs_701
              captures: { doc2: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc1}", county: "Travis", fee_mode: "PER_PAGE", page_count: 10 }
              as: Abstracter
              as_user_id: abs_701
              captures: { ret1: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc2}", county: "Travis", fee_mode: "PER_DOCUMENT" }
              as: Abstracter
              as_user_id: abs_701
              captures: { ret2: $.data.id }
            - call: "POST /api/county-retrievals/${ret1}/post-fee"
              payload: {}
              as: OperationsManager
              captures: { fee1: $.data.fee_cents }
            - call: "POST /api/county-retrievals/${ret2}/post-fee"
              payload: {}
              as: OperationsManager
              captures: { fee2: $.data.fee_cents }
            - call: "POST /api/record-documents/${doc1}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_701
            - call: "POST /api/record-documents/${doc2}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_701
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_701
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_701
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ord_v: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord}", title: "Abstract Report 701", expected_abstract_order_version: "${ord_v}" }
              as: Abstracter
              as_user_id: abs_701
              captures: { rep: $.data.id }
            - call: "POST /api/abstract-reports/${rep}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_701
            - call: "POST /api/abstract-reports/${rep}/start-review"
              payload: { review_slot_start: "2026-08-02T10:00:00Z", review_slot_end: "2026-08-02T11:00:00Z" }
              as: Examiner
              as_user_id: ex_701
            - call: "POST /api/abstract-reports/${rep}/approve"
              payload: {}
              as: Examiner
              as_user_id: ex_701
          trigger:
            - call: "POST /api/abstract-orders/${ord}/deliver"
              payload: {}
              as: OperationsManager
          assert:
            - "captured provisional_fee_cents at creation (${prov}) == 75000"
            - "captured fee1 == 1250 and fee2 == 2500"
            - "deliver response data.final_fee_cents == 54688 (subtotal 43750 + round_half_up(43750*0.25)=10938)"
            - "deliver response data.final_fee_cents != captured ${prov} (75000) — variants diverge on identical order data"
            - "deliver response data.late_credit_cents == 0 and data.billed_fee_cents == 54688"
            - "deliver response data.liability_cap_cents == 164064 (min(3*54688, 200000))"
            - "deliver response data.status == DELIVERED"

      - name: retrieval_fee_per_page_vs_per_document
        grounds:
          - calculations.retrieval_fee
          - entities.CountyRetrieval.fields.fee_cents
        distinguishing_aspect: |
          Dual variant on the CountyRetrieval pricing domain (NOT the order fee domain):
          the same 10-page instrument is legitimately priced 1250 under PER_PAGE and
          2500 under PER_DOCUMENT — two valid county charging modes, different cents.
        test_recipe:
          setup:
            - "STANDARD order with one IN_PROGRESS assignment and two recorded documents (a 10-page MORTGAGE and a DEED)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_702", property_address: "200 Oak Ave", county: "Travis", state_code: "TX", legal_description_text: "LOT 9 BLK C", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_702
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_702", search_type: "LIEN_JUDGMENT_TAX", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "MORTGAGE", grantor_name: "Bob Jones", grantee_name: "First Bank", instrument_number: "INST-702-A", recording_date: "2015-04-01" }
              as: Abstracter
              as_user_id: abs_702
              captures: { docA: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "Alice Smith", grantee_name: "Bob Jones", instrument_number: "INST-702-B", recording_date: "2010-06-01" }
              as: Abstracter
              as_user_id: abs_702
              captures: { docB: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${docA}", county: "Travis", fee_mode: "PER_PAGE", page_count: 10 }
              as: Abstracter
              as_user_id: abs_702
              captures: { retA: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${docB}", county: "Travis", fee_mode: "PER_DOCUMENT" }
              as: Abstracter
              as_user_id: abs_702
              captures: { retB: $.data.id }
          trigger:
            - call: "POST /api/county-retrievals/${retA}/post-fee"
              payload: {}
              as: OperationsManager
              captures: { feeA: $.data.fee_cents }
            - call: "POST /api/county-retrievals/${retB}/post-fee"
              payload: {}
              as: OperationsManager
              captures: { feeB: $.data.fee_cents }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { accrued: $.data.accrued_fees_cents }
          assert:
            - "captured feeA == 1250 (10 pages * 125)"
            - "captured feeB == 2500 (flat per-document)"
            - "feeA != feeB — two valid pricing variants on the same retrieval subject"
            - "captured accrued == 43750 (40000 base + 1250 + 2500, STANDARD tier has no premium)"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: liability_cap_nested_min_max_tier_branch
        grounds:
          - calculations.liability_cap
          - entities.AbstractOrder.fields.liability_cap_cents
        distinguishing_aspect: |
          Mode (a): three inputs (liability_tier, fee_basis, ABSOLUTE_CAP_CENTS) with
          non-linear interaction — a nested MIN() whose selected branch flips with the
          tier-conditional multiplier: STANDARD selects 3*basis (150000), EXTENDED
          selects the absolute cap (200000) because 5*50000 exceeds it.
        test_recipe:
          setup:
            - "Two RUSH orders with no retrievals (accrued basis 50000 each): one STANDARD liability tier, one EXTENDED"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_711", property_address: "1 Capitol Way", county: "Travis", state_code: "TX", legal_description_text: "LOT 1 BLK A", search_period_years: 20, effective_date: "2026-01-15", sla_tier: "RUSH", liability_tier: "STANDARD" }
              as: Client
              as_user_id: client_711
              captures: { ord_std: $.data.id, accrued_std: $.data.accrued_fees_cents }
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_711", property_address: "2 Congress Ave", county: "Travis", state_code: "TX", legal_description_text: "LOT 2 BLK A", search_period_years: 20, effective_date: "2026-01-15", sla_tier: "RUSH", liability_tier: "EXTENDED" }
              as: Client
              as_user_id: client_711
              captures: { ord_ext: $.data.id, accrued_ext: $.data.accrued_fees_cents }
          trigger:
            - call: "GET /api/abstract-orders/${ord_std}"
              as: OperationsManager
              captures: { cap_std: $.data.liability_cap_cents }
            - call: "GET /api/abstract-orders/${ord_ext}"
              as: OperationsManager
              captures: { cap_ext: $.data.liability_cap_cents }
          assert:
            - "captured accrued_std == 50000 and accrued_ext == 50000 (identical fee basis)"
            - "captured cap_std == 150000 (min branch selects 3*50000)"
            - "captured cap_ext == 200000 (min branch selects ABSOLUTE_CAP_CENTS because 5*50000 = 250000 > 200000)"
            - "cap_std != cap_ext despite identical fee basis — tier branch is load-bearing"

      - name: rush_premium_rounded_once_on_subtotal
        grounds:
          - calculations.order_fee_actualization
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the rush premium is rounded
          ONCE on the whole subtotal (pinned), giving 51406; the forbidden per-line
          rounding order gives 51407 (base premium 10000 + 3*round_half_up(375*0.25)=282
          + line sum... precisely 41125+10282). One literal distinguishes the orders.
        test_recipe:
          setup:
            - "RUSH order, one assignment, three documents each with a PER_PAGE 3-page retrieval (375 cents per line), all fees posted"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_712", property_address: "5 Lamar Blvd", county: "Travis", state_code: "TX", legal_description_text: "LOT 5 BLK D", search_period_years: 30, effective_date: "2026-01-15", sla_tier: "RUSH" }
              as: Client
              as_user_id: client_712
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_712", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-712-A", recording_date: "2008-01-10" }
              as: Abstracter
              as_user_id: abs_712
              captures: { doc1: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "B Jones", grantee_name: "C Lee", instrument_number: "INST-712-B", recording_date: "2012-05-20" }
              as: Abstracter
              as_user_id: abs_712
              captures: { doc2: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "MORTGAGE", grantor_name: "C Lee", grantee_name: "Second Bank", instrument_number: "INST-712-C", recording_date: "2014-09-02" }
              as: Abstracter
              as_user_id: abs_712
              captures: { doc3: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc1}", county: "Travis", fee_mode: "PER_PAGE", page_count: 3 }
              as: Abstracter
              as_user_id: abs_712
              captures: { ret1: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc2}", county: "Travis", fee_mode: "PER_PAGE", page_count: 3 }
              as: Abstracter
              as_user_id: abs_712
              captures: { ret2: $.data.id }
            - call: "POST /api/county-retrievals"
              payload: { order_id: "${ord}", record_document_id: "${doc3}", county: "Travis", fee_mode: "PER_PAGE", page_count: 3 }
              as: Abstracter
              as_user_id: abs_712
              captures: { ret3: $.data.id }
            - call: "POST /api/county-retrievals/${ret1}/post-fee"
              payload: {}
              as: OperationsManager
            - call: "POST /api/county-retrievals/${ret2}/post-fee"
              payload: {}
              as: OperationsManager
            - call: "POST /api/county-retrievals/${ret3}/post-fee"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { accrued: $.data.accrued_fees_cents }
          assert:
            - "captured accrued == 51406 (subtotal 40000+1125=41125; premium round_half_up(41125*0.25)=10281; 41125+10281)"
            - "captured accrued != 51407 (the value the forbidden per-line premium rounding would produce)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_submit_return_resume_cycle
        grounds:
          - state_machines.SearchAssignment.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.SearchAssignment.RETURNED_FOR_CORRECTION_to_IN_PROGRESS
          - entities.SearchAssignment.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on SearchAssignment (IN_PROGRESS -> SUBMITTED ->
          RETURNED_FOR_CORRECTION -> IN_PROGRESS) with a monotonic revision_count;
          distinct entity from the AbstractReport review cycle.
        test_recipe:
          setup:
            - "Order with one assignment whose single document is verified; assignment submitted once"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_721", property_address: "9 Rio Grande St", county: "Travis", state_code: "TX", legal_description_text: "LOT 7 BLK E", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_721
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_721", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-721-A", recording_date: "2011-02-14" }
              as: Abstracter
              as_user_id: abs_721
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_721
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_721
          trigger:
            - call: "POST /api/search-assignments/${asg}/return"
              payload: { reason: "missing deed book reference" }
              as: Examiner
              as_user_id: ex_721
              captures: { st1: $.data.status, rc1: $.data.revision_count }
            - call: "POST /api/search-assignments/${asg}/resume"
              payload: {}
              as: Abstracter
              as_user_id: abs_721
              captures: { st2: $.data.status }
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_721
              captures: { st3: $.data.status }
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_721
              captures: { st4: $.data.status, rc4: $.data.revision_count }
          assert:
            - "captured st1 == RETURNED_FOR_CORRECTION and rc1 == 1"
            - "captured st2 == IN_PROGRESS (cycle loops back)"
            - "captured st3 == SUBMITTED (resubmission from the loop is legal)"
            - "captured st4 == ACCEPTED and rc4 == 1 (revision count monotonic, not reset)"

      - name: report_review_revision_cycle
        grounds:
          - state_machines.AbstractReport.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.AbstractReport.REVISION_REQUIRED_to_SUBMITTED
          - entities.AbstractReport.fields.revision_number
        distinguishing_aspect: |
          Cyclic machine on AbstractReport (SUBMITTED -> UNDER_REVIEW ->
          REVISION_REQUIRED -> SUBMITTED) with the AbstractOrder status mirroring the
          loop (REPORT_UNDER_REVIEW <-> REPORT_DRAFTING); distinct entity from the
          SearchAssignment correction cycle.
        test_recipe:
          setup:
            - "Order driven to REPORT_UNDER_REVIEW with the report booked under examiner ex_722 (slot 2026-08-02 10:00-11:00)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_722", property_address: "12 San Jacinto", county: "Travis", state_code: "TX", legal_description_text: "LOT 3 BLK F", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_722
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_722", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-722-A", recording_date: "2013-07-04" }
              as: Abstracter
              as_user_id: abs_722
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_722
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_722
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_722
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ord_v: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord}", title: "Abstract Report 722", expected_abstract_order_version: "${ord_v}" }
              as: Abstracter
              as_user_id: abs_722
              captures: { rep: $.data.id }
            - call: "POST /api/abstract-reports/${rep}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_722
            - call: "POST /api/abstract-reports/${rep}/start-review"
              payload: { review_slot_start: "2026-08-02T10:00:00Z", review_slot_end: "2026-08-02T11:00:00Z" }
              as: Examiner
              as_user_id: ex_722
          trigger:
            - call: "POST /api/abstract-reports/${rep}/require-revision"
              payload: { reason: "exception list incomplete" }
              as: Examiner
              as_user_id: ex_722
              captures: { st1: $.data.status, rn1: $.data.revision_number }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ost1: $.data.status }
            - call: "POST /api/abstract-reports/${rep}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_722
              captures: { st2: $.data.status }
            - call: "POST /api/abstract-reports/${rep}/start-review"
              payload: { review_slot_start: "2026-08-02T11:30:00Z", review_slot_end: "2026-08-02T12:00:00Z" }
              as: Examiner
              as_user_id: ex_722
              captures: { st3: $.data.status }
            - call: "POST /api/abstract-reports/${rep}/approve"
              payload: {}
              as: Examiner
              as_user_id: ex_722
              captures: { st4: $.data.status }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ost2: $.data.status }
          assert:
            - "captured st1 == REVISION_REQUIRED and rn1 == 1"
            - "captured ost1 == REPORT_DRAFTING (order mirrors the report loop backward)"
            - "captured st2 == SUBMITTED and st3 == UNDER_REVIEW (rebooking a second slot with exactly 30-minute gap is legal)"
            - "captured st4 == APPROVED and ost2 == READY_FOR_DELIVERY"

  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_finalizes_report_retrievals_and_fees
        grounds:
          - state_machines.AbstractOrder.READY_FOR_DELIVERY_to_DELIVERED
          - state_machines.AbstractReport.APPROVED_to_DELIVERED
          - state_machines.CountyRetrieval.FEE_POSTED_to_INVOICED
          - calculations.order_fee_actualization
        distinguishing_aspect: |
          Depth-4 chain from POST deliver: order -> DELIVERED mutates the report
          (APPROVED -> DELIVERED), whose delivery invoices each FEE_POSTED retrieval,
          whose invoicing recomputes order.final_fee_cents / billed_fee_cents /
          liability_cap_cents — each link caused by the previous link, not fan-out.
        test_recipe:
          setup:
            - "STANDARD order in READY_FOR_DELIVERY; one PER_DOCUMENT retrieval in FEE_POSTED (accrued 42500); logical clock unset"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_731", property_address: "30 Brazos St", county: "Travis", state_code: "TX", legal_description_text: "LOT 8 BLK G", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_731
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
