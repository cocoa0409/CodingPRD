            - "no ledger row was written for a free return: GET /blinds/territories/${t1}/ledger-entries returns total_count 0"
            - "the hold starting exactly at 2026-08-07T17:00:00.000Z fails 409 with error_id == ERR_SAMPLE_KIT_HOLD_CONFLICT - both endpoints are inclusive and a RETURNED checkout still occupies its recorded interval"
            - "the hold starting one millisecond later succeeds 201: SampleCheckout.${co2}.status == OPEN with hold_start_at 2026-08-07T17:00:00.001Z"
            - "SampleKit.${k1}.status == ON_LOAN, loan_count == 2 and open_loan_count == 1 after the accepted checkout"
            - "Territory.${t1}.available_kit_count == 0 and on_loan_kit_count == 1; the refused attempt moved no counter"

  # -------------------------------------------------------------------
  # Rule 9 - compensating_invariant
  # -------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: full_credit_remake_restores_the_royalty_ledger_but_not_the_chargeback
        grounds:
          - calculations.royalty_accrual
          - calculations.remake_chargeback_waterfall
          - state_machines.VendorOrder.RECEIVED_to_CANCELLED
          - entities.Territory.fields.royalty_accrued_cents
          - entities.Quote.fields.credited_net_sales_cents
          - endpoints.POST_blinds_vendor_orders_id_remake
        distinguishing_aspect: |
          The compensating action is a FULL_CREDIT remake against the money ledger, and it
          is only PARTIALLY compensating on purpose: royalty_accrued_cents and
          net_sales_cents return to exactly zero because the reversal is re-derived from
          the full basis, yet remake_chargeback_cents keeps the 1420 the compensation
          itself cost. The ledger grows to three rows while two of its aggregates return
          to their pre-acceptance values - restoration is proved by the signed sum, not by
          deleting rows.
