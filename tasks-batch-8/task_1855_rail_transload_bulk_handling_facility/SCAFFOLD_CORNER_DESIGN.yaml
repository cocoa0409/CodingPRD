  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: sit_free_window_boundary
        claim_type: correct_result
        grounds: ["calculations.sit_accrual", "entities.InventoryLot.fields.sit_billable_days"]
        distinguishing_aspect: "SIT boundary precision: at the exact window start (sit_start + 2 free days) whole_days == 0 -> 0 billable days / 0 cents; exactly 24h later -> 1 day / 5000 cents (floor of whole 24h blocks, free period inclusive)."
        test_recipe:
          setup: ["Facility (sit_free_days 2); customer CALENDAR; product; lot created at clock 2026-08-03T00:00Z with rate 5000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-C1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: FacilityAdmin, captures: { d1: $.data.sit_billable_days, c1: $.data.sit_accrued_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: FacilityAdmin, captures: { d2: $.data.sit_billable_days, c2: $.data.sit_accrued_cents } }
          assert:
            - "at exactly window_start (2026-08-05T00:00Z): sit_billable_days == 0 and sit_accrued_cents == 0"
            - "at 2026-08-06T00:00Z: sit_billable_days == 1 and sit_accrued_cents == 5000"
      - name: invoice_period_bounds_inclusive
        claim_type: input_set_filtering
        grounds: ["calculations.invoice_total", "entities.Invoice.fields.charge_count"]
        distinguishing_aspect: "The issue sweep includes ACCRUED charges with created_at exactly equal to period_start and period_end (inclusive both bounds) and excludes one created one second past period_end."
        test_recipe:
          setup: ["Facility; customer; product; lot; track cap 3; three ARRIVED cars with spot orders (windows [01:00,02:00), [03:00,04:00), [05:00,06:00) on spots 1-3); charges created at exactly 2026-08-01T00:00:00Z (SO1 schedule), 2026-08-31T23:59:59Z (SO2), and 2026-09-01T00:00:00Z (SO3)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-C2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 3 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car1: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car2: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97003", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car3: $.data.id } }
            - { call: "POST /transload/railcars/${car1}/arrive", payload: {}, as: YardMaster, captures: { car1_v: $.data.version } }
            - { call: "POST /transload/railcars/${car2}/arrive", payload: {}, as: YardMaster, captures: { car2_v: $.data.version } }
            - { call: "POST /transload/railcars/${car3}/arrive", payload: {}, as: YardMaster, captures: { car3_v: $.data.version } }
            - { call: "POST /transload/railcars/${car1}/spot-orders", payload: { expected_railcar_version: "${car1_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T02:00:00Z" }, as: YardMaster, captures: { so1: $.data.id } }
            - { call: "POST /transload/railcars/${car2}/spot-orders", payload: { expected_railcar_version: "${car2_v}", track_id: "${trk}", spot_number: 2, window_start: "2026-08-03T03:00:00Z", window_end: "2026-08-03T04:00:00Z" }, as: YardMaster, captures: { so2: $.data.id } }
            - { call: "POST /transload/railcars/${car3}/spot-orders", payload: { expected_railcar_version: "${car3_v}", track_id: "${trk}", spot_number: 3, window_start: "2026-08-03T05:00:00Z", window_end: "2026-08-03T06:00:00Z" }, as: YardMaster, captures: { so3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so1}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so2}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so3}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /transload/invoices", payload: { customer_id: "${cust}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: BillingClerk, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /transload/invoices/${inv}/issue", payload: {}, as: BillingClerk, captures: { inv_tot: $.data.total_cents, inv_cnt: $.data.charge_count } }
            - { call: "GET /transload/charges?customer_id=${cust}&status=ACCRUED", payload: {}, as: BillingClerk, captures: { left_id: "$.data[0].id", left_st: "$.data[0].status" } }
          assert:
            - "issue sweeps exactly SO1's and SO2's charges: charge_count == 2, total_cents == 37000"
            - "SO3's charge (created 2026-09-01T00:00:00Z, one second past period_end) remains ACCRUED and unswept"
      - name: posture_threshold_aggregation
        claim_type: correct_result
        grounds: ["calculations.safety_posture", "entities.Facility.fields.open_incident_count"]
        distinguishing_aspect: "Posture thresholds: 1 open MINOR -> ELEVATED; 2 open -> still ELEVATED; exactly 3 open (SUSPEND_INCIDENT_COUNT) -> SUSPENDED; resolving back to 2 -> ELEVATED; all resolved -> NORMAL (threshold uses >=, boundary at exactly 3)."
        test_recipe:
          setup: ["Facility only."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-C3" }, as: FacilityAdmin, captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /transload/incidents", payload: { severity: "MINOR", description: "a" }, as: SafetyOfficer, captures: { i1: $.data.id } }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { p1: $.data.safety_posture, n1: $.data.open_incident_count } }
            - { call: "POST /transload/incidents", payload: { severity: "MAJOR", description: "b" }, as: SafetyOfficer, captures: { i2: $.data.id } }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { p2: $.data.safety_posture, n2: $.data.open_incident_count } }
            - { call: "POST /transload/incidents", payload: { severity: "MINOR", description: "c" }, as: SafetyOfficer, captures: { i3: $.data.id } }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { p3: $.data.safety_posture, n3: $.data.open_incident_count } }
            - { call: "POST /transload/incidents/${i1}/resolve", payload: {}, as: SafetyOfficer }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { p4: $.data.safety_posture, n4: $.data.open_incident_count } }
            - { call: "POST /transload/incidents/${i2}/resolve", payload: {}, as: SafetyOfficer }
            - { call: "POST /transload/incidents/${i3}/resolve", payload: {}, as: SafetyOfficer }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: SafetyOfficer, captures: { p5: $.data.safety_posture, n5: $.data.open_incident_count } }
          assert:
            - "1 open: ELEVATED, count 1; 2 open: ELEVATED, count 2; 3 open: SUSPENDED, count 3 (>= boundary)"
            - "after one resolve: ELEVATED, count 2; after all resolved: NORMAL, count 0"
      - name: calc_demurrage_correct_result
        claim_type: correct_result
        grounds: ["calculations.demurrage_accrual"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / demurrage_free_minute_boundary and dual_variant_calc / demurrage_constructive_vs_actual_basis and combinatorial_formula / demurrage_tiered_hazard_credit_straddle"
          rationale: "Correct-result, boundary, tier-straddle, and both variants of demurrage_accrual are asserted in the named §1.8 instances."
      - name: calc_switching_allowance
        claim_type: correct_result
        grounds: ["calculations.switching_fee"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / switching_fee_allowance_sequence"
          rationale: "Free-allowance boundary and per-move-type fees asserted in the named §1.8 instance."
      - name: calc_contamination_variants
        claim_type: variant_divergence
        grounds: ["calculations.contamination_risk_score"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / contamination_strict_vs_weighted_policy"
          rationale: "Both variants and the 100-point block threshold asserted in the named §1.8 instance."
  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: auth_and_priority_ordering_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]", "validations[priority=4]", "validations[priority=5]", "errors[ERR_UNAUTHENTICATED]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_NOT_FOUND]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Priority ladder: unauthenticated (401) beats everything; wrong role (403) beats existence; unknown id (404) beats state; malformed body (400) beats state — each pair fired on a single request violating both rules."
        test_recipe:
          setup: ["Facility; customer; product; lot; track; car REGISTERED (not ARRIVED)."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-V1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id, cust_v: $.data.version } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97101", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id, car_v: $.data.version } }
          trigger:
            - { call: "POST /transload/customers", payload: { name: "X", allocated_car_spots: 1 }, as: Anonymous, captures: { e_auth: $.data.error_id } }
            - { call: "POST /transload/customers/00000000-0000-0000-0000-000000000000/allocation-adjustments", payload: { expected_customer_version: "${cust_v}", new_allocated_car_spots: 9 }, as: CustomerRep, as_user_id: "${cust}", captures: { e_role: $.data.error_id } }
            - { call: "POST /transload/spot-orders/00000000-0000-0000-0000-000000000000/schedule", payload: {}, as: YardMaster, captures: { e_nf: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T05:00:00Z", window_end: "2026-08-03T01:00:00Z" }, as: YardMaster, captures: { e_shape: $.data.error_id } }
          assert:
            - "no/invalid role header: 401 ERR_UNAUTHENTICATED (priority 1)"
            - "CustomerRep on an admin-only endpoint with a non-existent path id: 403 ERR_FORBIDDEN_ROLE (role beats existence)"
            - "valid role, unknown spot-order id: 404 ERR_NOT_FOUND (existence beats state)"
            - "REGISTERED car + reversed window (also wrong state): 400 ERR_INVALID_REQUEST (shape beats state/business)"
      - name: validation_satisfaction_passes
        claim_type: satisfaction_pass
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed request with proper role and existing ids passes validation and performs the operation (spot order created REQUESTED), proving the ladder does not over-reject."
        test_recipe:
          setup: ["Facility; customer; product; lot; track; car ARRIVED."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-V2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97102", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
          trigger:
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-04T01:00:00Z", window_end: "2026-08-04T03:00:00Z" }, as: YardMaster, captures: { so: $.data.id, so_st: $.data.status } }
          assert:
            - "create succeeds: 201, status == REQUESTED, id assigned"
