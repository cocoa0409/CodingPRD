      - name: listing_return_depth2_quote_recompute
        grounds:
          - state_machines.ResaleListing.SOLD_to_RETURNED
          - state_machines.Item.SOLD_to_FOR_RESALE
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the process cascade:
          return(listing) -> item SOLD -> FOR_RESALE (link 1) -> the manifest's
          QUOTE_OPEN settlement recomputes so the realized 51000 proceeds line is
          replaced by the 40000 catalog estimate (link 2, caused by the item revert).
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; DROPOFF manifest (declared 1) RECEIVED; one non-data-bearing LAPTOP grade A sold at 60000"
            - "A QUOTE settlement exists (gross 51000, reflecting the realized sale)"
