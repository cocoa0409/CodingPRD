          case_price_cents: 12000
        as: ClubAdmin
        captures:
          pv_oat_1: $.data.id
      trigger:
      - call: POST /price-versions
        payload:
          item_id: ${i_oat}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 12500
        as: ClubAdmin
        captures:
          err: $.data.error_id
      - call: POST /price-versions
