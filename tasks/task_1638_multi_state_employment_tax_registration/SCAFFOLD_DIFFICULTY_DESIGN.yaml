# =============================================================================
# §1.8 Scaffold Difficulty Design — Multi-State Employment Tax Registration
# Test Targeting Index: 2+ instances per §0.5 rule, every instance grounded in
# SCAFFOLD.yaml §1.1–§1.7 and replayable from empty-DB via §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_frequency_provisional_vs_lookback_diverge
        grounds:
          - calculations.deposit_schedule_assignment
          - entities.Registration.fields.filing_frequency
          - entities.Registration.fields.frequency_basis
        distinguishing_aspect: |
          Same registration, two valid algorithms on the SAME metric produce
          different frequencies: PROVISIONAL (projected $1,000,000 -> SEMIWEEKLY)
          at activation vs LOOKBACK (trailing actuals = 0 -> QUARTERLY) after
          recompute_schedule. Entity domain: Registration/deposit scheduling.
        test_recipe:
          setup:
            - "Employer exists; OR STATE_WITHHOLDING agency at 500bp; one OR employee (hired 2026-08-01, wage 1,000,000 cents); OR NexusCase CONFIRMED on 2026-08-20"
            - "Registration created with projected_annual_withholding_cents = 100000000 ($1M) and activated while clock = 2026-08-20"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-001", full_name: "Pat Roe", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 1000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 100000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000001" }, as: NexusAnalyst, captures: { freq_at_activate: $.data.filing_frequency, basis_at_activate: $.data.frequency_basis } }
          trigger:
            - { call: "POST /etax/registrations/${reg_or}/recompute_schedule", payload: {}, as: NexusAnalyst, captures: { freq_after: $.data.filing_frequency, basis_after: $.data.frequency_basis, lookback_after: $.data.lookback_liability_cents } }
          assert:
            - "Registration.${reg_or} at activation: filing_frequency == SEMIWEEKLY and frequency_basis == PROVISIONAL (captured ${freq_at_activate}/${basis_at_activate})"
            - "After recompute_schedule: filing_frequency == QUARTERLY (lookback_liability_cents == 0 < 250000) and frequency_basis == LOOKBACK"
            - "The two variants disagree for identical registration input: SEMIWEEKLY (provisional) != QUARTERLY (lookback)"

      - name: ui_rate_standard_vs_buydown_diverge
        grounds:
          - calculations.ui_experience_rate
          - calculations.voluntary_contribution_optimization
          - entities.UIRate.fields.final_rate_bp
        distinguishing_aspect: |
          Same UIRate inputs (contributions 600,000 / benefits 200,000 / payroll
          10,000,000 cents): the standard variant yields final_rate_bp 390 while
          the buy-down variant (voluntary_contribution_applied 100,000) yields 270.
          Entity domain: UIRate — different domain from the deposit-schedule
          instance above.
        test_recipe:
          setup:
            - "Employer; PA STATE_UI agency (new_employer_rate_bp 270, solvency_surcharge_bp 30, ui_wage_base_cents 5000000); five PA employees (hired 2026-08-01, wage 6,000,000 each); PA NexusCase CONFIRMED 2026-08-20"
            - "PA-UI registration ACTIVE; UIRate 2026 experience_rated=true EFFECTIVE with final_rate_bp 390"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_UI", state_code: "PA", agency_name: "PA UC", new_employer_rate_bp: 270, solvency_surcharge_bp: 30, ui_wage_base_cents: 5000000 }, as: TaxDirector, captures: { ag_pa_ui: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Philly Office", address_line1: "1 Liberty Pl", city: "Philadelphia", state_code: "PA", postal_code: "19103", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_pa: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-101", full_name: "A One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-102", full_name: "B Two", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-103", full_name: "C Three", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-104", full_name: "D Four", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-105", full_name: "E Five", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "PA" }, as: NexusAnalyst, captures: { nc_pa: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_pa}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_pa}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_pa_ui}", projected_annual_withholding_cents: 0, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_pa_ui: $.data.id } }
            - { call: "POST /etax/registrations/${reg_pa_ui}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_pa_ui}/activate", payload: { account_number: "PA-UI-0001" }, as: NexusAnalyst, captures: { reg_pa_ui_v: $.data.version } }
            - { call: "POST /etax/ui-rates", payload: { registration_id: "${reg_pa_ui}", rate_year: 2026, experience_rated: true, assigned_rate_bp: 420, contributions_paid_3yr_cents: 600000, benefits_charged_3yr_cents: 200000, taxable_payroll_3yr_cents: 10000000, expected_registration_version: "${reg_pa_ui_v}" }, as: UISpecialist, captures: { rate_id: $.data.id, rate_standard: $.data.final_rate_bp, reserve_ratio: $.data.reserve_ratio_bp } }
            - { call: "POST /etax/ui-rates/${rate_id}/review", payload: {}, as: UISpecialist }
            - { call: "POST /etax/ui-rates/${rate_id}/make_effective", payload: {}, as: UISpecialist }
            - { call: "POST /etax/voluntary-contributions", payload: { ui_rate_id: "${rate_id}", proposed_amount_cents: 100000, decision_deadline: "2026-09-01T00:00:00Z" }, as: UISpecialist, as_user_id: "uis-1", captures: { vc_id: $.data.id } }
            - { call: "POST /etax/voluntary-contributions/${vc_id}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /etax/voluntary-contributions/${vc_id}/remit", payload: {}, as: UISpecialist, as_user_id: "uis-1" }
          trigger:
            - { call: "POST /etax/voluntary-contributions/${vc_id}/apply", payload: {}, as: UISpecialist, as_user_id: "uis-1" }
            - { call: "GET /etax/ui-rates/${rate_id}", payload: {}, as: TaxDirector, captures: { rate_buydown: $.data.final_rate_bp, vc_applied: $.data.voluntary_contribution_applied_cents } }
          assert:
            - "UIRate.${rate_id}.final_rate_bp at creation == 390 (reserve 400bp -> bracket 360 + surcharge 30), captured ${rate_standard}"
            - "After VC apply: final_rate_bp == 270 (reserve 500bp -> bracket 240 + 30) and voluntary_contribution_applied_cents == 100000"
            - "Same base inputs, buy-down variant output 270 != standard variant output 390"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: ui_experience_rate_multi_input_bracket
        grounds:
          - calculations.ui_experience_rate
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (contributions, benefits, payroll, surcharge,
          clamps) with non-linear interaction — bracket selection on a negative
          reserve ratio plus additive surcharge. reserve -400bp -> bracket 600,
          +30 surcharge -> final 630. A single aggregation+threshold does not
          reproduce this.
        test_recipe:
          setup:
            - "Employer; PA STATE_UI agency (surcharge 30bp); one PA employee (hired 2026-08-01); PA NexusCase CONFIRMED; PA-UI registration ACTIVE"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_UI", state_code: "PA", agency_name: "PA UC", new_employer_rate_bp: 270, solvency_surcharge_bp: 30, ui_wage_base_cents: 5000000 }, as: TaxDirector, captures: { ag_pa_ui: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Philly Office", address_line1: "1 Liberty Pl", city: "Philadelphia", state_code: "PA", postal_code: "19103", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_pa: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-201", full_name: "F Six", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "PA" }, as: NexusAnalyst, captures: { nc_pa: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_pa}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_pa}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_pa_ui}", projected_annual_withholding_cents: 0, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_pa_ui: $.data.id } }
            - { call: "POST /etax/registrations/${reg_pa_ui}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_pa_ui}/activate", payload: { account_number: "PA-UI-0002" }, as: NexusAnalyst, captures: { reg_pa_ui_v: $.data.version } }
          trigger:
            - { call: "POST /etax/ui-rates", payload: { registration_id: "${reg_pa_ui}", rate_year: 2026, experience_rated: true, assigned_rate_bp: 700, contributions_paid_3yr_cents: 100000, benefits_charged_3yr_cents: 500000, taxable_payroll_3yr_cents: 10000000, expected_registration_version: "${reg_pa_ui_v}" }, as: UISpecialist, captures: { rate_id: $.data.id, rr: $.data.reserve_ratio_bp, final_bp: $.data.final_rate_bp } }
          assert:
            - "UIRate.${rate_id}.reserve_ratio_bp == -400 (round_half_up(10000*(100000-500000)/10000000))"
            - "UIRate.${rate_id}.final_rate_bp == 630 (bracket -499..-1 -> 600, + 30 surcharge, within clamp [50, 900])"

      - name: vc_optimization_circular_order
        grounds:
          - calculations.voluntary_contribution_optimization
          - entities.VoluntaryContribution.fields.projected_net_savings_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the proposed contribution
          itself shifts the reserve ratio, which shifts the bracket, which
          determines the savings the contribution produces. Pinned evaluation
          order (rate_without -> rate_with -> taxable wages -> savings) yields
          projected 390 -> 270 and net savings exactly 200000 cents; any other
          evaluation order is non-conformant.
        test_recipe:
          setup:
            - "Employer; PA STATE_UI agency (surcharge 30bp, wage base 5,000,000); five PA employees wage 6,000,000 each (>= 1 attributed day in PA in 2026 -> taxable 5 x min(6000000, 5000000) = 25000000); PA nexus CONFIRMED; PA-UI registration ACTIVE; UIRate EFFECTIVE (600000/200000/10000000 -> 390bp)"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_UI", state_code: "PA", agency_name: "PA UC", new_employer_rate_bp: 270, solvency_surcharge_bp: 30, ui_wage_base_cents: 5000000 }, as: TaxDirector, captures: { ag_pa_ui: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Philly Office", address_line1: "1 Liberty Pl", city: "Philadelphia", state_code: "PA", postal_code: "19103", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_pa: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-301", full_name: "G One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-302", full_name: "H Two", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-303", full_name: "I Three", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-304", full_name: "J Four", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-305", full_name: "K Five", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "PA" }, as: NexusAnalyst, captures: { nc_pa: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_pa}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_pa}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_pa_ui}", projected_annual_withholding_cents: 0, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_pa_ui: $.data.id } }
            - { call: "POST /etax/registrations/${reg_pa_ui}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_pa_ui}/activate", payload: { account_number: "PA-UI-0003" }, as: NexusAnalyst, captures: { reg_pa_ui_v: $.data.version } }
            - { call: "POST /etax/ui-rates", payload: { registration_id: "${reg_pa_ui}", rate_year: 2026, experience_rated: true, assigned_rate_bp: 420, contributions_paid_3yr_cents: 600000, benefits_charged_3yr_cents: 200000, taxable_payroll_3yr_cents: 10000000, expected_registration_version: "${reg_pa_ui_v}" }, as: UISpecialist, captures: { rate_id: $.data.id } }
            - { call: "POST /etax/ui-rates/${rate_id}/review", payload: {}, as: UISpecialist }
            - { call: "POST /etax/ui-rates/${rate_id}/make_effective", payload: {}, as: UISpecialist }
          trigger:
            - { call: "POST /etax/voluntary-contributions", payload: { ui_rate_id: "${rate_id}", proposed_amount_cents: 100000, decision_deadline: "2026-09-01T00:00:00Z" }, as: UISpecialist, as_user_id: "uis-1", captures: { vc_id: $.data.id, p_wo: $.data.projected_rate_without_vc_bp, p_w: $.data.projected_rate_with_vc_bp, p_net: $.data.projected_net_savings_cents } }
          assert:
            - "VoluntaryContribution.${vc_id}.projected_rate_without_vc_bp == 390"
            - "VoluntaryContribution.${vc_id}.projected_rate_with_vc_bp == 270 (100000 contribution lifts reserve 400 -> 500, crossing the bracket boundary)"
            - "VoluntaryContribution.${vc_id}.projected_net_savings_cents == 200000 ((390-270) * 25000000 / 10000 - 100000)"

      - name: withholding_deposit_per_line_rounding_order
        grounds:
          - calculations.withholding_obligation_amount
        distinguishing_aspect: |
          Mode (b): nested rounding order — round per employee line then sum
          (pinned) yields 50136 cents for two 3,000,000-cent-wage employees over
          the 61 attributed days of Q3 at 500bp; sum-then-round yields 50137.
          The scaffold pins per-line-then-sum; the alternative order is
          non-conformant by exactly 1 cent.
        test_recipe:
          setup:
            - "Employer; OR STATE_WITHHOLDING agency 500bp; two OR employees (hired 2026-08-01, wage 3,000,000 each); OR NexusCase CONFIRMED; OR registration activated with projected 200000 -> QUARTERLY (single Q3 WITHHOLDING_DEPOSIT row)"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-401", full_name: "L One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-402", full_name: "M Two", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 200000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000002" }, as: NexusAnalyst }
          trigger:
            - { call: "GET /etax/filing-obligations", payload: { registration_id: "${reg_or}", obligation_kind: "WITHHOLDING_DEPOSIT" }, as: NexusAnalyst, captures: { dep_amt: "$.data[0].amount_due_cents", dep_kind: "$.data[0].obligation_kind" } }
          assert:
            - "Exactly one WITHHOLDING_DEPOSIT row exists (QUARTERLY frequency, Q3 2026)"
            - "amount_due_cents == 50136 (per-line: round_half_up(3000000*61/365*0.05) = 25068 per employee; 2 x 25068; sum-then-round 50137 is the pinned-wrong order)"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_reject_resubmit_cycle
        grounds:
          - state_machines.Registration.SUBMITTED_to_REJECTED
          - state_machines.Registration.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Registration is cyclic (SUBMITTED -> REJECTED -> SUBMITTED), not a
          linear pipeline: a rejected filing can be resubmitted and later
          activated. Different entity from the NexusCase instance below.
        test_recipe:
          setup:
            - "Employer; OR STATE_WITHHOLDING agency; one OR employee; OR NexusCase CONFIRMED (2026-08-20); OR registration in DRAFT"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-501", full_name: "N One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
          trigger:
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst, captures: { st1: $.data.status } }
            - { call: "POST /etax/registrations/${reg_or}/reject", payload: { rejection_reason: "Agency requested corrected FEIN" }, as: NexusAnalyst, captures: { st2: $.data.status } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst, captures: { st3: $.data.status } }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000003" }, as: NexusAnalyst, captures: { st4: $.data.status } }
          assert:
            - "status sequence: ${st1} == SUBMITTED, ${st2} == REJECTED, ${st3} == SUBMITTED (cycle traversed), ${st4} == ACTIVE"
            - "Registration.${reg_or}.account_number == OR-00000003 after the resubmission loop"

      - name: nexus_case_watch_threshold_watch_cycle
        grounds:
          - state_machines.NexusCase.WATCH_to_THRESHOLD_MET
          - state_machines.NexusCase.THRESHOLD_MET_to_WATCH
          - state_machines.LocationChange.APPROVED_to_EFFECTIVE
        distinguishing_aspect: |
          NexusCase is cyclic: WATCH -> THRESHOLD_MET at 20 days, then back to
          WATCH when a location change removes the 20th day (19 days after
          truncation). Different entity from the Registration cycle.
        test_recipe:
          setup:
            - "Employer; OR and NJ work locations; employee hired 2026-08-01 in OR (wage 3,000,000); OR NexusCase reaches THRESHOLD_MET at clock 2026-08-20; NJ NexusCase exists (WATCH)"
            - "Approved LocationChange OR -> NJ effective 2026-08-20"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-601", full_name: "O Two", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "NJ" }, as: NexusAnalyst, captures: { nc_nj: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { or_before: $.data.status } }
            - { call: "POST /etax/location-changes", payload: { employee_id: "${e_id}", to_work_location_id: "${wl_nj}", effective_date: "2026-08-20T00:00:00Z", reason: "Relocating" }, as: Employee, as_user_id: "${e_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /etax/location-changes/${lc_id}/approve", payload: {}, as: NexusAnalyst, as_user_id: "na-1" }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { or_after: $.data.status, or_days: $.data.employee_days_ytd } }
          assert:
            - "OR case before move: ${or_before} == THRESHOLD_MET (20 days)"
            - "After effectuation at 2026-08-20: OR segment covers Aug 1..19 -> employee_days_ytd == 19 and status == WATCH (cycle WATCH -> THRESHOLD_MET -> WATCH)"
            - "LocationChange.${lc_id}.status == EFFECTIVE after the sweep"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: location_change_effectuation_cascade
        grounds:
          - state_machines.LocationChange.APPROVED_to_EFFECTIVE
          - state_machines.LocalAssignment.CURRENT_to_SUPERSEDED
          - state_machines.NexusCase.THRESHOLD_MET_to_WATCH
          - calculations.compliance_posture
        distinguishing_aspect: |
          Depth-3 cascade from the APPROVED->EFFECTIVE transition: effectuation
          mutates Employee/LocalAssignment; the assignment truncation itself
          triggers NexusCase recompute (THRESHOLD_MET -> WATCH at 19 days); the
          nexus transition itself triggers Employer.compliance_posture
          (WATCH -> GOOD_STANDING). Distinct trigger from the late-filing
          cascade.
        test_recipe:
          setup:
            - "Employer; OR/NJ work locations; employee in OR hired 2026-08-01 (wage 3,000,000); OR NexusCase THRESHOLD_MET at 2026-08-20 (posture WATCH); NJ NexusCase WATCH; LocationChange OR->NJ APPROVED effective 2026-08-20"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-701", full_name: "P Three", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "NJ" }, as: NexusAnalyst, captures: { nc_nj: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "GET /etax/employers/${emp_id}", payload: {}, as: TaxDirector, captures: { posture_before: $.data.compliance_posture } }
            - { call: "POST /etax/location-changes", payload: { employee_id: "${e_id}", to_work_location_id: "${wl_nj}", effective_date: "2026-08-20T00:00:00Z", reason: "Relocating" }, as: Employee, as_user_id: "${e_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /etax/location-changes/${lc_id}/approve", payload: {}, as: NexusAnalyst, as_user_id: "na-1" }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/employees/${e_id}", payload: {}, as: TaxDirector, captures: { e_loc: $.data.current_work_location_id } }
            - { call: "GET /etax/nexus-cases/${nc_or}", payload: {}, as: TaxDirector, captures: { or_status: $.data.status, or_days: $.data.employee_days_ytd } }
            - { call: "GET /etax/nexus-cases/${nc_nj}", payload: {}, as: TaxDirector, captures: { nj_days: $.data.employee_days_ytd } }
            - { call: "GET /etax/employers/${emp_id}", payload: {}, as: TaxDirector, captures: { posture_after: $.data.compliance_posture } }
          assert:
            - "Pre-effectuation posture ${posture_before} == WATCH (THRESHOLD_MET case present)"
            - "Employee.${e_id}.current_work_location_id == ${wl_nj} (link B mutated)"
            - "OR NexusCase: employee_days_ytd == 19 and status == WATCH (link C auto-transition fired by the cascade, not by a direct call)"
            - "NJ NexusCase: employee_days_ytd == 1 (Aug 20)"
            - "Employer.compliance_posture == GOOD_STANDING (link D recomputed from C's transition)"

      - name: late_obligation_notice_posture_cascade
        grounds:
          - state_machines.FilingObligation.DUE_to_LATE
          - calculations.late_penalty_assessment
          - calculations.compliance_posture
        distinguishing_aspect: |
          Depth-3 cascade from the DUE->LATE sweep transition (different trigger
          from the location-change cascade): obligation LATE -> AgencyNotice
          auto-created with provisional penalty -> Employer counters and posture
          recomputed (open_notice_count 1, outstanding 2500, WATCH). Zero-amount
          July deposit also goes LATE but creates NO notice (amount == 0 skip).
        test_recipe:
          setup:
            - "Employer; OR STATE_WITHHOLDING 500bp; one OR employee hired 2026-08-01 wage 9,125,000; OR nexus CONFIRMED; MONTHLY registration ACTIVE (projected 3,000,000); Q3 obligations generated (Jul 0 cents, Aug 38750, Sep 37500 + return)"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-801", full_name: "Q Four", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 9125000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 3000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/activate", payload: { account_number: "OR-00000004" }, as: NexusAnalyst }
          trigger:
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: TaxDirector }
            - { call: "GET /etax/agency-notices", payload: { registration_id: "${reg_or}" }, as: PayrollComplianceLead, captures: { n_id: "$.data[0].id", n_pen: "$.data[0].penalty_amount_cents", n_type: "$.data[0].notice_type" } }
            - { call: "GET /etax/employers/${emp_id}", payload: {}, as: TaxDirector, captures: { open_n: $.data.open_notice_count, out_pen: $.data.outstanding_penalty_cents, posture: $.data.compliance_posture } }
          assert:
            - "Exactly one AgencyNotice was cascade-created (the zero-amount July deposit went LATE without a notice)"
            - "Notice ${n_id}: notice_type == PENALTY_ASSESSMENT and penalty_amount_cents == 2500 (provisional: max(2500, round_half_up(38750 * 0.02)) = max(2500, 775))"
            - "Employer: open_notice_count == 1, outstanding_penalty_cents == 2500, compliance_posture == WATCH (link D)"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: remit_declined_vc_state_beats_deadline
        grounds:
          - validations[priority=6]
          - validations[priority=24]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair state x business_temporal: remitting a DECLINED
          VoluntaryContribution whose deadline has ALSO passed fails both
          priority-6 (state) and priority-24 (temporal); the state error
          ERR_INVALID_STATE_TRANSITION must win.
        test_recipe:
          setup:
            - "Employer; PA STATE_UI agency; five PA employees wage 6,000,000; PA nexus CONFIRMED; PA-UI registration ACTIVE; UIRate EFFECTIVE (390bp); VC proposed 100,000 deadline 2026-09-01T00:00:00Z then DECLINED; clock advanced past deadline"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_UI", state_code: "PA", agency_name: "PA UC", new_employer_rate_bp: 270, solvency_surcharge_bp: 30, ui_wage_base_cents: 5000000 }, as: TaxDirector, captures: { ag_pa_ui: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Philly Office", address_line1: "1 Liberty Pl", city: "Philadelphia", state_code: "PA", postal_code: "19103", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_pa: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-901", full_name: "R One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-902", full_name: "R Two", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-903", full_name: "R Three", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-904", full_name: "R Four", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-905", full_name: "R Five", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "PA" }, as: NexusAnalyst, captures: { nc_pa: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_pa}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_pa}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_pa_ui}", projected_annual_withholding_cents: 0, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_pa_ui: $.data.id } }
            - { call: "POST /etax/registrations/${reg_pa_ui}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_pa_ui}/activate", payload: { account_number: "PA-UI-0004" }, as: NexusAnalyst, captures: { reg_pa_ui_v: $.data.version } }
            - { call: "POST /etax/ui-rates", payload: { registration_id: "${reg_pa_ui}", rate_year: 2026, experience_rated: true, assigned_rate_bp: 420, contributions_paid_3yr_cents: 600000, benefits_charged_3yr_cents: 200000, taxable_payroll_3yr_cents: 10000000, expected_registration_version: "${reg_pa_ui_v}" }, as: UISpecialist, captures: { rate_id: $.data.id } }
            - { call: "POST /etax/ui-rates/${rate_id}/review", payload: {}, as: UISpecialist }
            - { call: "POST /etax/ui-rates/${rate_id}/make_effective", payload: {}, as: UISpecialist }
            - { call: "POST /etax/voluntary-contributions", payload: { ui_rate_id: "${rate_id}", proposed_amount_cents: 100000, decision_deadline: "2026-09-01T00:00:00Z" }, as: UISpecialist, as_user_id: "uis-1", captures: { vc_id: $.data.id } }
            - { call: "POST /etax/voluntary-contributions/${vc_id}/decline", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: TaxDirector }
          trigger:
            - { call: "POST /etax/voluntary-contributions/${vc_id}/remit", payload: {}, as: UISpecialist, as_user_id: "uis-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state precondition, priority 6, beats the also-true deadline failure ERR_DEADLINE_PASSED at priority 24)"

      - name: election_create_daterange_beats_reciprocity
        grounds:
          - validations[priority=5]
          - validations[priority=20]
          - errors[ERR_INVALID_DATE_RANGE]
          - errors[ERR_RECIPROCITY_NOT_AVAILABLE]
        distinguishing_aspect: |
          Category pair business_temporal x business_referential (different pair
          from the state x temporal instance): an election whose effective range
          is inverted AND whose state pair lacks any reciprocity agreement fails
          both checks; the priority-5 ERR_INVALID_DATE_RANGE must win.
        test_recipe:
          setup:
            - "Employer; NJ work location; employee resident OR working NJ (no OR-NJ reciprocity agreement exists in the catalog)"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-911", full_name: "S One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE (temporal sanity, priority 5, beats the also-true missing-agreement failure ERR_RECIPROCITY_NOT_AVAILABLE at priority 20)"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: nexus_day_threshold_exactly_20
        grounds:
          - calculations.nexus_threshold_evaluation
          - entities.NexusCase.fields.employee_days_ytd
        distinguishing_aspect: |
          Metric = employee-day count, endpoint = recompute: 19 days leaves the
          case WATCH (basis NONE) while exactly 20 days (>= threshold) flips it
          to THRESHOLD_MET with basis DAYS. Off-by-one in the day-count
          comparison fails this.
        test_recipe:
          setup:
            - "Employer; OR work location; employee hired 2026-08-01 wage 3,000,000 (wage track stays below 5,000,000 cents at day 20: 164,384); OR NexusCase open"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1001", full_name: "T One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: TaxDirector }
          trigger:
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { d19: $.data.employee_days_ytd, s19: $.data.status, b19: $.data.threshold_basis } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst, captures: { d20: $.data.employee_days_ytd, s20: $.data.status, b20: $.data.threshold_basis, w20: $.data.wages_ytd_cents } }
          assert:
            - "At 2026-08-19: employee_days_ytd == 19, status == WATCH, threshold_basis == NONE"
            - "At 2026-08-20: employee_days_ytd == 20, status == THRESHOLD_MET, threshold_basis == DAYS (>= 20 triggers; 19 does not)"
            - "wages_ytd_cents == 164384 at day 20 (round_half_up(3000000*20/365)), confirming the DAYS basis alone fired"

      - name: vc_remit_deadline_exact_instant
        grounds:
          - validations[priority=24]
          - state_machines.VoluntaryContribution.APPROVED_to_REMITTED
          - errors[ERR_DEADLINE_PASSED]
        distinguishing_aspect: |
          Metric = timestamp, endpoint = remit (different metric from the
          day-count instance): remitting at exactly decision_deadline succeeds
          (<= deadline), while one second later fails with ERR_DEADLINE_PASSED.
        test_recipe:
          setup:
            - "Employer; PA-UI agency; five PA employees wage 6,000,000; PA nexus CONFIRMED; PA-UI registration ACTIVE; UIRate EFFECTIVE (390bp); TWO approved VCs of 100,000 each with decision_deadline 2026-09-01T17:00:00Z"
          setup_api_calls:
