      - name: safe_harbor_gate_runs_before_the_enrollment_gate_on_ingestion
        claim_type: cascading_validation
        grounds:
          - validations.priority_9
          - validations.priority_14
        distinguishing_aspect: "POST /dmca/ingestion-batches can violate the safe-harbor gate and the enrollment gate at once; the priority-9 result must win."
        excluded_because:
          difficulty_instance: ingestion_safe_harbor_gate_precedes_enrollment_referential_check
          rationale: "The §1.8 instance stages both violations simultaneously and then repairs them one at a time to show the ordered unmasking, which is a strictly stronger cascading-validation claim."
      - name: temporal_window_check_outranks_the_terminated_account_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_13
          - validations.priority_14
        distinguishing_aspect: "A counter-notice filed after the window by a terminated account violates both priority 13 and priority 14; the temporal error must be returned."
        excluded_because:
          difficulty_instance: counter_notice_window_temporal_check_precedes_terminated_account_check
          rationale: "The §1.8 instance constructs the exact double violation and then removes the temporal violation to reveal ERR_ACCOUNT_TERMINATED, covering both directions of the priority pair."
      - name: notice_validation_is_gated_by_the_registration_state_of_another_entity
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_7
          - errors[ERR_DESIGNATED_AGENT_NOT_REGISTERED]
        distinguishing_aspect: "A validation whose verdict depends on a different aggregate's state must be tested in both directions: invalid while the DesignatedAgent is not REGISTERED, valid once it is."
        excluded_because:
          difficulty_instance: notice_validation_depends_on_designated_agent_registration_state
          rationale: "The §1.8 instance walks the same notice through the un-registered and registered states of the provider's agent and asserts both the refusal and the pass, which is exactly the both-directions claim."
      - name: duplicate_claim_is_detected_from_the_still_open_dispute_interval
        claim_type: temporal_validation
        grounds:
          - validations.priority_14
          - calculations.claim_dispute_interval_overlap
          - errors[ERR_DUPLICATE_ACTIVE_CLAIM]
        distinguishing_aspect: "A temporal validation must be shown to fire while the earlier interval is still open and to stop firing once it closes, including at the interval's own bound."
        excluded_because:
          difficulty_instance: duplicate_claim_rejected_inside_half_open_dispute_interval_and_allowed_at_its_upper_bound
          rationale: "The §1.8 instance tests the half-open dispute interval on both sides of its upper bound with the same second notice, which subsumes any narrower temporal recipe."
