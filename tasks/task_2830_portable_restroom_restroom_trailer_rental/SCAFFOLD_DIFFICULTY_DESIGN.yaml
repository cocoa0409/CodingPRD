              as: DispatchPlanner
              captures: { gap15_after_error: $.data.error_id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${schedule_id}", visit_kind: "TEARDOWN", scheduled_date: "2026-08-10", window_start_minute: 400, window_end_minute: 465 }
              as: DispatchPlanner
              captures: { gap15_before_error: $.data.error_id }
            - call: "POST /service-visits"
