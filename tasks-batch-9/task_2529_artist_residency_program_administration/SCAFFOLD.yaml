  - method: GET
    path: "/panel-assignments/{id}"
    description: "Reads one review record including its rubric scores and weighted total."
    roles: [ProgramAdmin, PanelChair, Panelist]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: []

  - method: POST
    path: "/panel-assignments/{id}/scores"
    description: "Records the reviewer's four rubric scores. Reviewer-only, self-service."
    roles: [Panelist]
    code: 200
    input: [score_artistic_merit, score_feasibility, score_community_fit, score_technical_readiness, "notes?"]
    output: PanelAssignment
    side_effects:
      - "computes panelist_total_100 per calculations.application_composite_score and sets scored_at from the logical clock"
      - "recomputes Application.scored_panelist_count, provisional_screening_score, final_panel_score and rank_in_discipline"
      - "drives Application PANEL_REVIEW -> SCORED once Cycle.panel_quorum is met, and recomputes Cycle.slate_ready_count / panel_review_complete"
      - "increments PanelAssignment.version, Application.version and (on the quorum edge) Cycle.version by 1"

  - method: POST
    path: "/panel-assignments/{id}/declare-conflict"
    description: "The reviewer declares a conflict of interest. FAMILIAL and FINANCIAL conflicts are
      severe and recuse the reviewer from the entire cycle - the head of cascade B."
    roles: [Panelist]
    code: 200
    input: [conflict_type, conflict_detail]
    output: PanelAssignment
    side_effects:
      - "clears the four rubric scores, scored_at and panelist_total_100 on this assignment"
      - "FAMILIAL / FINANCIAL: sets Panelist.status = RECUSED_FOR_CYCLE and Panelist.recused_cycle_id, then VACATES every other assignment of that panelist in the same cycle (clearing their scores too)"
      - "recomputes each affected Application's assigned_panelist_count, scored_panelist_count and provisional_screening_score, nulls final_panel_score and rank_in_discipline where quorum is lost, and drives SCORED -> PANEL_REVIEW"
      - "recomputes Cycle.slate_ready_count and panel_review_complete"
      - "increments the version of every touched PanelAssignment, Panelist, Application and Cycle by 1"

  # ---------------------------------------------------------------- residencies
  - method: POST
    path: "/residencies"
    description: "Creates a residency outside the competitive slate: an invited or commissioned
      residency, or a follow-on residency extending a COMPLETED one via predecessor_residency_id.
      The cycle must not be DRAFT or CLOSED. Cycle-selected residencies are created by the offer-ACCEPT
      cascade instead, never here. Session dates, the stipend commitment and the obligations arrive
      later, through POST /residencies/{id}/schedule."
    roles: [ProgramAdmin]
    code: 201
    input: [cycle_id, applicant_id, discipline_id, "predecessor_residency_id?", "application_id?"]
    output: Residency
    side_effects:
      - "copies discipline_code from the named Discipline and sets status = SCHEDULED / compliance_status = TRAINING_PENDING with stipend_basis = PROVISIONAL and stipend_total_cents = 0"
      - "computes visa_required and tax_form_type from the applicant, and creates a VisaCase in INITIATED when the artist is international"
      - "recomputes Cycle.slots_filled_count and slots_open_count"
      - "increments Cycle.version by 1"

  - method: GET
    path: "/residencies"
    description: "Lists residencies (reverse reachability for cycle_id, application_id, applicant_id
      and predecessor_residency_id)."
    roles: [ProgramAdmin, FinanceOfficer, VisaCoordinator, FacilitiesManager, Funder, Applicant]
    code: 200
    input: ["cycle_id?", "application_id?", "applicant_id?", "predecessor_residency_id?", "status?", "compliance_status?", "limit?", "offset?"]
    output: Residency[]
    side_effects: []

  - method: GET
    path: "/residencies/{id}"
    description: "Reads one residency: both state axes, the stipend ledger and the obligation counters."
    roles: [ProgramAdmin, FinanceOfficer, VisaCoordinator, FacilitiesManager, Funder, Applicant]
    code: 200
    input: []
    output: Residency
    side_effects: []

  - method: POST
    path: "/residencies/{id}/schedule"
    description: "Fixes the session start date and length, provisioning the derived session end date,
      the training requirement list, the engagement obligations and the visa timeline."
    roles: [ProgramAdmin]
    code: 200
    input: [session_start_date, session_length_weeks]
    output: Residency
    side_effects:
      - "computes session_end_date = session_start_date + session_length_weeks*7 - 1 day"
      - "recomputes required_training_types from the discipline's capability tags and hazmat flag"
      - "runs calculations.obligation_provisioning, creating or re-deriving the PENDING Obligation rows"
      - "re-bases stipend_total_cents to the provisional_award for the confirmed length and recomputes the Cycle ledger"
      - "recomputes the VisaCase's case_type, filing_deadline_date and earliest_entry_date"
      - "increments Residency.version by 1, Cycle.version by 1 and the VisaCase.version by 1 when present"

  - method: POST
    path: "/residencies/{id}/lifecycle"
    description: "Drives the residency status axis: CHECK_IN, COMPLETE, TERMINATE or WITHDRAW.
      TERMINATE is the head of cascade C."
    roles: [ProgramAdmin, Applicant]
    code: 200
    input: [action, "reason?"]
    output: Residency
    side_effects:
      - "CHECK_IN requires compliance_status == CLEARED and, for international residents, an APPROVED VisaCase"
      - "COMPLETE breaches every unmet PENDING Obligation, releases studio and housing assignments and bumps Applicant.completed_residency_count"
      - "TERMINATE sets actual_weeks_in_residence, VOIDS the SCHEDULED disbursements, switches stipend_basis to FINAL_SETTLED, re-prices stipend_total_cents and releases the difference back to Cycle.stipend_uncommitted_cents"
      - "WITHDRAW reverses the whole acceptance: the full committed stipend is released, disbursements are VOIDED, obligations are WAIVED, assignments released and the VisaCase denied"
      - "increments Residency.version by 1 plus the version of every touched Cycle, Studio, HousingUnit, StipendDisbursement, Obligation and VisaCase"

  - method: POST
    path: "/residencies/{id}/compliance"
    description: "Drives the residency compliance axis independently of its status: SUSPEND or REINSTATE."
    roles: [FacilitiesManager, ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: Residency
    side_effects:
      - "SUSPEND releases the ACTIVE StudioAssignment (released_reason='COMPLIANCE_SUSPENDED'), recomputes Studio.reserved_resident_days and clears assigned_studio_code"
      - "REINSTATE requires every required training to be recorded and does NOT restore the studio"
      - "increments Residency.version by 1 and, when a studio was released, Studio.version and StudioAssignment.version by 1"

  - method: POST
    path: "/residencies/{id}/trainings"
    description: "Records completion of one required safety, equipment or hazardous-material training."
    roles: [FacilitiesManager, ProgramAdmin]
    code: 200
    input: [training_type]
    output: Residency
    side_effects:
      - "appends to completed_training_types (sorted, de-duplicated)"
      - "drives compliance_status TRAINING_PENDING -> CLEARED once required_training_types is fully covered"
      - "increments Residency.version by 1"

  - method: POST
    path: "/residencies/{id}/stipend-schedule"
    description: "Generates the residency's stipend disbursement schedule, optionally at a corrected
      weekly rate. Regeneration VOIDs the existing SCHEDULED rows and leaves PAID / REVERSED history intact.
      OCC-guarded on the residency's version."
    roles: [FinanceOfficer]
    code: 201
    input: [expected_residency_version, "weekly_rate_override_cents?"]
    output: Residency
    side_effects:
      - "runs calculations.stipend_period_split, creating StipendDisbursement rows in ascending period_index with scheduled_by_user_id = acting X-User-ID"
      - "sets Residency.stipend_weekly_rate_cents to the effective rate and re-bases stipend_total_cents to the provisional_award"
      - "recomputes the Cycle stipend ledger"
      - "increments Residency.version by 1 and Cycle.version by 1"
      - "rejects with ERR_STALE_VERSION (412) when expected_residency_version does not match"

  - method: GET
    path: "/residencies/{id}/tax-report"
    description: "Computed read: the resident's W-9 / 1042-S withholding statement, reporting both
      withholding variants and their reconciliation delta."
    roles: [FinanceOfficer, ProgramAdmin]
    code: 200
    input: []
    output: { tax_form_type: string, withholding_rate: number, annual_gross_cents: integer, annual_taxable_cents: integer, withheld_actual_cents: integer, statutory_liability_cents: integer, reconciliation_delta_cents: integer, paid_period_count: integer }
    side_effects:
      - "runs both variants of calculations.stipend_withholding; writes nothing"

  # ---------------------------------------------------------------- studios
  - method: POST
