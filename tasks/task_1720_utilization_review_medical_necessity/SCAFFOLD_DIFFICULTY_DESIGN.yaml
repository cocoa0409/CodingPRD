            - call: "POST /api/utilization-cases/${case_x}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_x: $.data.id }
            - call: "POST /api/admission-reviews/${rev_x}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_x}"
              as: URNurse
              captures: { case_x_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_x}/condition-code-44-requests"
              payload: { rationale: "Criteria not met at review.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_x_v}" }
              as: URNurse
