              as: FinanceOfficer
              as_user_id: "finance-1"
          assert:
            - "${e1} == ERR_UNAUTHORIZED with 403 — the logical clock is LeagueAdmin-only, so the Scout call also failed to move the clock"
            - "${e2} == ERR_UNAUTHORIZED (POST /players is Scout-exclusive), ${e3} == ERR_UNAUTHORIZED (POST /contract-offers is GeneralManager-exclusive)"
            - "${e4} == ERR_UNAUTHORIZED (team-house creation is OpsManager-exclusive), ${e5} == ERR_UNAUTHORIZED (deal creation is SponsorshipManager-exclusive)"
            - "${e6} == ERR_UNAUTHORIZED — priority 2 outranks the priority-8 state check, so the DRAFT distribution does NOT yield ERR_DISTRIBUTION_NOT_CALCULATED"
            - "${e7} == ERR_UNAUTHORIZED — an unrecognised role name is rejected even with a valid X-User-Id"
            - "POST /sponsorship-deals as SponsorshipManager returned 201 with deal_status DRAFT, so the endpoint itself was reachable and only the role was wrong before"
            - "GET /players returned 200 for both GeneralManager and Scout with total_count == 1 — a shared read works for every listed role"
            - "GET /prize-distributions/${dist_id} still reports distribution_status DRAFT and version == ${dist_v1}"

      - name: empty_identity_headers_are_refused_before_any_other_check
        claim_type: Exclusive Operation Denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 requires both identity headers to be present AND non-empty, so an empty
          X-User-Id with a valid role, an empty X-User-Role with a valid id, and both empty against
          a non-existent player id all return ERR_UNAUTHENTICATED (401) — the last one proving
          priority 1 outranks the priority-3 existence check that would have produced
          ERR_PLAYER_NOT_FOUND. The identical call with both headers populated succeeds.
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been set"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: ""
              captures: { e1: $.data.error_id }
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: ""
              as_user_id: "admin-1"
              captures: { e2: $.data.error_id }
            - call: "GET /players/00000000-0000-0000-0000-0000000000ff"
              as: ""
              as_user_id: ""
              captures: { e3: $.data.error_id }
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "GET /leagues"
              payload: { limit: 10, offset: 0 }
              as: LeagueAdmin
              as_user_id: "admin-1"
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with 401 — the X-User-Id header was sent as the empty string, not omitted"
            - "${e2} == ERR_UNAUTHENTICATED with 401 — an empty X-User-Role is not treated as an unknown role (ERR_UNAUTHORIZED)"
            - "${e3} == ERR_UNAUTHENTICATED with 401, not ERR_PLAYER_NOT_FOUND — priority 1 runs before the priority-3 path lookup"
            - "The fourth call, identical except for the two populated headers, returned 201 and minted ${league_id}"
            - "GET /leagues returns total_count == 1 — the three 401s created nothing"

      - name: entity_backed_callers_are_scoped_to_their_own_organization_or_player
        claim_type: Peer Role Isolation
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles[GeneralManager].identity
          - roles[OpsManager].identity
          - roles[SponsorshipManager].identity
          - roles[PlayerAgent].identity
          - roles[GuardianRepresentative].identity
          - roles[Scout].identity
          - complexity_profile.role_model
        distinguishing_aspect: |
          The five entity_backed roles carry an X-User-Id that IS an entity id, so organization B's
          GeneralManager, OpsManager and SponsorshipManager and player P's agent are each refused
          with ERR_NOT_RESOURCE_OWNER (403) on organization A's / player Q's resources — including a
          read (cap-summary) — while the identical call from the rightful owner succeeds. The opaque
          Scout is not scoped at all and may patch any player.
        test_recipe:
          setup:
            - "One league with organizations A and B; players P and Q; P holds an ACTIVE contract with A and Q holds an open offer from A"
            - "Organization A owns an ACTIVE ENERGY_DRINK sponsorship deal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, max_roster_size: 7 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { orgA_id: $.data.id }
            - call: "POST /organizations"
