          trigger:
            - call: "POST /cycles/${c1}/deliver"
              payload: {}
              as: OpsAdmin
              captures: { earned: $.data.points_earned }
          assert:
            - "${earned} == 2000"
            - "LoyaltyAccount.${loy_id}.points_balance == 2000"
            - "LoyaltyAccount.${loy_id}.trailing_earned_points == 2000"
            - "LoyaltyAccount.${loy_id}.tier == SILVER"
