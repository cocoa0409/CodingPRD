      - name: gas_well_connect_requires_cell_past_authorization
        grounds:
          - validations[priority=10]
          - state_machines.GasWell.DRILLED_to_CONNECTED
          - state_machines.Cell.QA_CERTIFIED_to_READY_FOR_WASTE
          - state_machines.Cell.READY_FOR_WASTE_to_ACTIVE
        distinguishing_aspect: |
          Connecting a well is gated on the parent Cell being in {ACTIVE, FULL, CLOSED}, and
          the interesting part is what is NOT in that set: QA_CERTIFIED and READY_FOR_WASTE
          both fail, so the well cannot be connected merely because the regulator authorized
          the cell. The same connect request is refused twice against two different cell
          states and then succeeds, with the GasWell row itself untouched by either refusal.
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 in QA_CERTIFIED and a FUNDED assurance position."
            - "GasWell W-1 created on C-1, so it sits in its initial state DRILLED."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lf_v2: $.data.version }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id, req_amount: $.data.required_assurance_amount }
            - call: "POST /closure-cost-estimates/${est_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /closure-cost-estimates/${est_id}/fund-assurance"
              payload: { instrument_type: "INSURANCE", funded_amount: "${req_amount}" }
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /gas-wells"
              payload: { cell_id: "${c1_id}", well_code: "W-1", depth_ft: 85 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { w1_id: $.data.id, w1_state0: $.data.status }
          trigger:
            - call: "POST /gas-wells/${w1_id}/connect"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
            - call: "POST /cells/${c1_id}/authorize-waste-placement"
              payload: { approval_reference: "AGY-2026-77" }
              as: RegulatoryAgency
              as_user_id: "agency-inspector-1"
              captures: { c1_state1: $.data.status }
            - call: "POST /gas-wells/${w1_id}/connect"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
            - call: "POST /cells/${c1_id}/activate"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_state2: $.data.status }
            - call: "POST /gas-wells/${w1_id}/connect"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { w1_state1: $.data.status }
          assert:
            - "${w1_state0} == 'DRILLED'"
            - "the first connect returns ERR_CELL_NOT_READY_FOR_WELLFIELD with HTTP 409 (cell is QA_CERTIFIED)"
            - "${c1_state1} == 'READY_FOR_WASTE'"
            - "the second connect ALSO returns ERR_CELL_NOT_READY_FOR_WELLFIELD with HTTP 409 — regulatory authorization is not enough"
            - "GasWell.${w1_id}.status is still 'DRILLED' and its version is unchanged after both refusals"
            - "${c1_state2} == 'ACTIVE'"
