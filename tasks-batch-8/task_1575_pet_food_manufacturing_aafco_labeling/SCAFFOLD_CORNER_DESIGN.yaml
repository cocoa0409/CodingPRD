  # ===========================================================================
  # Section 6: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: pagination_params_out_of_bounds_fail
        claim_type: violation_to_error
        grounds:
          - response_envelope.pagination_defaults
          - errors[ERR_PAGINATION]
        distinguishing_aspect: |
          Pagination bounds are enforced exactly: limit 0 (below min 1),
          limit 101 (above max 100), and offset -1 each fail with
          ERR_PAGINATION (400).
        test_recipe:
          setup:
            - "One ingredient exists so the list endpoint has data"
          setup_api_calls:
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Barley", ingredient_code: "BRLY0020", nutrient_matrix: { CRUDE_PROTEIN: 0.10, CRUDE_FAT: 0.02, MOISTURE: 0.11 }, allergen_class: "GRAIN" }
              as: FormulationScientist
          trigger:
            - call: "GET /petfood/ingredients"
              payload: { limit: 0 }
              as: FormulationScientist
              captures: { err1: $.data.error_id }
            - call: "GET /petfood/ingredients"
              payload: { limit: 101 }
              as: FormulationScientist
              captures: { err2: $.data.error_id }
            - call: "GET /petfood/ingredients"
              payload: { offset: -1 }
              as: FormulationScientist
              captures: { err3: $.data.error_id }
          assert:
            - "limit 0: err1 == ERR_PAGINATION, http 400"
            - "limit 101: err2 == ERR_PAGINATION, http 400"
            - "offset -1: err3 == ERR_PAGINATION, http 400"

      - name: err_supplier_suspended_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUPPLIER_SUSPENDED]
        excluded_because:
          difficulty_instance: batch_release_depends_on_supplier_state
          rationale: "ERR_SUPPLIER_SUSPENDED is triggered and asserted as the failure path of the named §1.8 instance."

      - name: err_open_recall_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_RECALL]
        excluded_because:
          difficulty_instance: registration_acceptance_depends_on_recall_flag
          rationale: "ERR_OPEN_RECALL is triggered and asserted as the failure path of the named §1.8 instance."

      - name: err_inclusion_sum_invalid_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INCLUSION_SUM_INVALID]
        excluded_because:
          difficulty_instance: revision_cycle_preserves_inclusion_sum
          rationale: "ERR_INCLUSION_SUM_INVALID is triggered and asserted as the failure path of the named §1.8 instance."

      - name: err_line_schedule_conflict_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: line_schedule_half_open_window_conflict
          rationale: "ERR_LINE_SCHEDULE_CONFLICT is triggered and asserted as the failure path of the named §1.8 instance."

      - name: err_yield_variance_hold_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_YIELD_VARIANCE_HOLD]
        excluded_because:
          difficulty_instance: yield_variance_exactly_at_hold_threshold
          rationale: "ERR_YIELD_VARIANCE_HOLD is triggered and asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  # Section 7: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_denied_formulation_scientist_create_brand
        claim_type: role_denial
        grounds:
          - roles.PlatformAdmin
          - roles.FormulationScientist
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          POST /petfood/brand-owners is a PlatformAdmin exclusive; a
          FormulationScientist caller is denied with ERR_UNAUTHORIZED_ROLE
          (403) and no brand row is created.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Sneaky Co", fein: "555000010", contact_email: "x@sneaky.example" }
              as: FormulationScientist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, http 403"

      - name: rbac_denied_qa_approver_create_ingredient
        claim_type: role_denial
        grounds:
          - roles.FormulationScientist
          - roles.QAApprover
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          POST /petfood/ingredients is a FormulationScientist exclusive; a
          QAApprover caller is denied with ERR_UNAUTHORIZED_ROLE (403).
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Fish Meal", ingredient_code: "FSML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.63, CRUDE_FAT: 0.11, MOISTURE: 0.07 }, allergen_class: "FISH" }
              as: QAApprover
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, http 403"

      - name: rbac_denied_quality_analyst_approve_pairing
        claim_type: role_denial
        grounds:
          - roles.QualityAnalyst
          - roles.QAApprover
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          The requester role (QualityAnalyst) cannot decide its own pairing:
          the approve endpoint is QAApprover-exclusive and denies the analyst
          with ERR_UNAUTHORIZED_ROLE (403) — role-level segregation before any
          user-level SoD check.
        test_recipe:
          setup:
