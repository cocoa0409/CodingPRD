        excluded_because:
          difficulty_instance: combinatorial_formula / assessment_per_lot_rounding_order_produces_residual
          rationale: "The pinned per-lot-first rounding order and the non-zero residual_cents it produces are asserted as literals in the named §1.8 instance."

      - name: corner_subsidy_balance_is_conserved_across_post_and_reverse
        claim_type: Correct Result
        grounds:
