      - name: certification_program_is_immutable_and_exposes_no_version
        claim_type: immutability
        grounds:
          - entities.CertificationProgram
          - endpoints[GET /certification-programs/{programId}]
        distinguishing_aspect: "CertificationProgram is declared with common_fields: false, so it carries no created_at / updated_at / version and §1.5 exposes no PATCH, no action and no delete for it — a program's rules are frozen once SKUs are certified against them."
        test_recipe:
          setup:
            - "Two programs exist, RCERT-PS and RCERT-LM, so the immutable pair can be listed as well as fetched."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /certification-programs"
              payload: { code: "RCERT-LM", conformance_basis: "LOT_MEAN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 1, retest_limit: 2, derate_allowed: false }
              as: CorporateOps
              captures: { prog_lm: "$.data.id" }
          trigger:
            - call: "GET /certification-programs/${prog_ps}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "GET /certification-programs"
              payload: { limit: 10, offset: 0 }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "the GET body carries id, code, conformance_basis, r_value_tolerance, min_specimen_count, max_concurrent_lab_tests, retest_limit and derate_allowed and nothing else — no created_at, no updated_at and above all no version field"
            - "§1.5 declares only POST /certification-programs, GET /certification-programs/{programId} and GET /certification-programs: there is no update, action or delete route, so the row cannot be mutated through the API at all"
            - "CertificationProgram.${prog_ps}.derate_allowed == true and CertificationProgram.${prog_lm}.derate_allowed == false — the two programs stay independently frozen"
            - "no AllocationCycle-style OCC token is ever required for a program, because it has no version to be stale against"

