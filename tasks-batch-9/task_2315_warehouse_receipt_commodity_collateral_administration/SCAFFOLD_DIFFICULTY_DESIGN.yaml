# =============================================================================
# task_2315 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
#   Every asserted number was computed against the §1.3 formulas and constants.
#
#   BASE CHAIN (reused, adapted per instance): clock 2026-08-05T08:00:00Z ->
#   STATE warehouse (cap 500000, bond 2,500,000, nw 5,000,000, 2 lanes,
#   registry participant) -> licence ISSUE -> producer + lender parties ->
#   COMMINGLED agreement (rate 350 millicents/bu/day, receiving 6c/bu,
#   loadout 8c/bu, 15 free days, max moisture 14.0, declared value 420c/bu) ->
#   bin B1 (40000 bu, CORN, commingling) -> ticket gross 1005 / dockage 4.5 /
#   moisture 15.0 -> net 949 -> accept -> receipt WR-0001 NEGOTIABLE ELECTRONIC.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: storage_charge_provisional_vs_final_on_receipt
        grounds:
          - calculations.storage_charge_accrual
          - entities.WarehouseReceipt.fields.provisional_storage_charge_cents
          - entities.DeliveryOrder.fields.storage_charge_cents
          - state_machines.DeliveryOrder.REQUESTED_to_LOADED
        distinguishing_aspect: |
          Entity domain = storage cost accounting on a WarehouseReceipt: the PROVISIONAL variant
          ignores the agreement's 15 free storage days and the FINAL variant subtracts them, so the
          same 949-bushel receipt on 2026-09-14 accrues 13618 cents provisionally and 8636 cents
          finally — a 4982-cent divergence from identical data.
        test_recipe:
          setup:
            - "Base chain complete: licensed STATE warehouse, ACTIVE COMMINGLED agreement at 350 millicents/bu/day with 15 free storage days, bin B1 SOUND, receipt WR-0001 ISSUED for 949 bushels of US_NO_1 corn with issued_at 2026-08-05T08:00:00Z."
            - "Logical clock advanced to 2026-09-14T09:00:00Z, i.e. an inclusive day_count of 41 days since issuance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /warehouses"
              payload: { name: "Prairie Elevator", operator_name: "Prairie Grain Co", state_code: "KS", license_program: "STATE", licensed_capacity_bushels: 500000, bond_amount_cents: 2500000, net_worth_cents: 5000000, loadout_lane_count: 2, registry_participant: true }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { wh_id: $.data.id }
            - call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "ISSUE", license_effective_date: "2026-08-01", license_expiry_date: "2027-07-31" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /parties"
              payload: { name: "Ada Farms", party_kind: "PRODUCER_DEPOSITOR", state_code: "KS" }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { dep_id: $.data.id }
            - call: "POST /storage-agreements"
              payload: { warehouse_id: "${wh_id}", depositor_party_id: "${dep_id}", commodity: "CORN", storage_kind: "COMMINGLED", min_grade: "US_NO_3", max_moisture_pct: 14.0, storage_rate_millicents_per_bushel_day: 350, receiving_charge_cents_per_bushel: 6, loadout_charge_cents_per_bushel: 8, free_storage_days: 15, declared_value_cents_per_bushel: 420 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /bins"
              payload: { warehouse_id: "${wh_id}", bin_code: "B1", capacity_bushels: 40000, commodity: "CORN", commingling_allowed: true }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_id: $.data.id }
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 1005, test_weight_lbs: 56.5, moisture_pct: 15.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 4.5, fill_start_at: "2026-08-05T09:00:00Z", fill_end_at: "2026-08-05T11:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_id: $.data.id }
            - call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v: $.data.version }
            - call: "POST /deposit-tickets/${tk_id}/accept"
              payload: { expected_bin_version: "${bin_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { wh_v: $.data.version }
            - call: "POST /receipts"
              payload: { deposit_ticket_id: "${tk_id}", holder_party_id: "${dep_id}", receipt_number: "WR-0001", form: "NEGOTIABLE", medium: "ELECTRONIC", expected_warehouse_version: "${wh_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "GET /receipts/${rc_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 949, appointment_start_at: "2026-09-14T10:00:00Z", appointment_end_at: "2026-09-14T12:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/load"
              payload: { delivered_bushels: 949, delivered_test_weight_lbs: 56.5, delivered_moisture_pct: 13.0, delivered_damage_pct: 2.0, delivered_foreign_material_pct: 1.0 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "WarehouseReceipt.${rc_id}.quantity_bushels == 949"
            - "WarehouseReceipt.${rc_id}.provisional_storage_charge_cents == 13618"
            - "DeliveryOrder.${do_id}.storage_charge_cents == 8636"
            - "WarehouseReceipt.${rc_id}.provisional_storage_charge_cents - DeliveryOrder.${do_id}.storage_charge_cents == 4982"
            - "DeliveryOrder.${do_id}.delivery_state == LOADED"

      - name: lien_valuation_mark_to_market_vs_face_advance
        grounds:
          - calculations.collateral_valuation_and_advance_limit
          - entities.CollateralLien.fields.valuation_basis
          - entities.CollateralLien.fields.advance_limit_cents
          - entities.WarehouseReceipt.fields.face_price_cents_per_bushel
        distinguishing_aspect: |
          Entity domain = credit risk valuation on a CollateralLien against a lender's credit line
          (not storage cost on a receipt): MARK_TO_MARKET at 450c/bu charges the 25 bps administration
          fee and yields advance_limit_cents 290482, while FACE_ADVANCE on the same receipt uses the
          pinned 420c/bu face price, charges no fee, and yields 271300.
        test_recipe:
          setup:
            - "Base chain complete with receipt WR-0001 ISSUED for 949 bushels of US_NO_1 corn, face price pinned at 420 cents/bushel, receiving charge 5694 cents."
            - "A LENDER party with a 50,000,000-cent credit line exists."
            - "Logical clock at 2026-08-20T09:00:00Z, so the receipt's PROVISIONAL storage charge is 5314 cents (16 inclusive days)."
          setup_api_calls:
            - &b_clock call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - &b_wh call: "POST /warehouses"
              payload: { name: "Prairie Elevator", operator_name: "Prairie Grain Co", state_code: "KS", license_program: "STATE", licensed_capacity_bushels: 500000, bond_amount_cents: 2500000, net_worth_cents: 5000000, loadout_lane_count: 2, registry_participant: true }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { wh_id: $.data.id }
            - &b_lic call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "ISSUE", license_effective_date: "2026-08-01", license_expiry_date: "2027-07-31" }
              as: StateRegulator
              as_user_id: "reg-001"
            - &b_dep call: "POST /parties"
              payload: { name: "Ada Farms", party_kind: "PRODUCER_DEPOSITOR", state_code: "KS" }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { dep_id: $.data.id }
            - &b_len call: "POST /parties"
              payload: { name: "AgCredit Bank", party_kind: "LENDER", state_code: "KS", credit_line_cents: 50000000 }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { len_id: $.data.id }
            - &b_agr call: "POST /storage-agreements"
              payload: { warehouse_id: "${wh_id}", depositor_party_id: "${dep_id}", commodity: "CORN", storage_kind: "COMMINGLED", min_grade: "US_NO_3", max_moisture_pct: 14.0, storage_rate_millicents_per_bushel_day: 350, receiving_charge_cents_per_bushel: 6, loadout_charge_cents_per_bushel: 8, free_storage_days: 15, declared_value_cents_per_bushel: 420 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { agr_id: $.data.id }
            - &b_bin call: "POST /bins"
              payload: { warehouse_id: "${wh_id}", bin_code: "B1", capacity_bushels: 40000, commodity: "CORN", commingling_allowed: true }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_id: $.data.id }
            - &b_tk call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 1005, test_weight_lbs: 56.5, moisture_pct: 15.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 4.5, fill_start_at: "2026-08-05T09:00:00Z", fill_end_at: "2026-08-05T11:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_id: $.data.id }
            - &b_binv call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v: $.data.version }
            - &b_acc call: "POST /deposit-tickets/${tk_id}/accept"
              payload: { expected_bin_version: "${bin_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - &b_whv call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { wh_v: $.data.version }
            - &b_rc call: "POST /receipts"
              payload: { deposit_ticket_id: "${tk_id}", holder_party_id: "${dep_id}", receipt_number: "WR-0001", form: "NEGOTIABLE", medium: "ELECTRONIC", expected_warehouse_version: "${wh_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 250000, valuation_basis: "MARK_TO_MARKET", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_mtm_id: $.data.id }
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 250000, valuation_basis: "FACE_ADVANCE", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_face_id: $.data.id }
          assert:
            - "CollateralLien.${lien_mtm_id}.gross_value_cents == 427050"
            - "CollateralLien.${lien_mtm_id}.eligible_value_cents == 427050"
            - "CollateralLien.${lien_mtm_id}.admin_fee_cents == 1068"
            - "CollateralLien.${lien_mtm_id}.warehouseman_lien_cents == 12076"
            - "CollateralLien.${lien_mtm_id}.net_collateral_cents == 414974"
            - "CollateralLien.${lien_mtm_id}.advance_limit_cents == 290482"
            - "CollateralLien.${lien_face_id}.gross_value_cents == 398580"
            - "CollateralLien.${lien_face_id}.admin_fee_cents == 0"
            - "CollateralLien.${lien_face_id}.warehouseman_lien_cents == 11008"
            - "CollateralLien.${lien_face_id}.net_collateral_cents == 387572"
            - "CollateralLien.${lien_face_id}.advance_limit_cents == 271300"
            - "Party.${len_id}.committed_advance_cents == 0 (neither lien is perfected yet)"

  # ===========================================================================
  # Later instances re-use the anchored base calls defined above (&b_clock,
  # &b_wh, &b_lic, &b_dep, &b_len, &b_agr, &b_bin, &b_tk, &b_binv, &b_acc,
  # &b_whv, &b_rc). Each alias expands to the identical structured call object,
  # including its captures, so every ${var} stays bound inside every instance.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: deposit_net_bushels_stepwise_rounding_order
        grounds:
          - calculations.deposit_grade_and_net_bushels
          - entities.DepositTicket.fields.dockage_bushels
          - entities.DepositTicket.fields.shrink_bushels
          - entities.DepositTicket.fields.net_bushels
        distinguishing_aspect: |
          §0.5 mode (b) — nested rounding where the order matters: dockage is rounded to whole bushels
          FIRST (45 of 1005) and the 1.18%-per-point moisture shrink is then applied to the rounded
          960 clean bushels (11), giving net_bushels 949; collapsing the two factors into one
          multiplication and rounding once gives 948.
        test_recipe:
          setup:
            - "Licensed STATE warehouse with an ACTIVE COMMINGLED agreement whose max_moisture_pct is 14.0 and min_grade is US_NO_3, and an empty SOUND bin B1 of 40000 bushels."
            - "No other deposit ticket occupies the bin's fill window."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
          trigger:
            - *b_tk
          assert:
            - "DepositTicket.${tk_id}.assigned_grade == US_NO_1"
            - "DepositTicket.${tk_id}.dockage_bushels == 45"
            - "DepositTicket.${tk_id}.clean_bushels == 960"
            - "DepositTicket.${tk_id}.shrink_bushels == 11"
            - "DepositTicket.${tk_id}.net_bushels == 949"
            - "DepositTicket.${tk_id}.net_bushels != 948, the value produced by rounding once on the combined 4.5% dockage and 1.18% shrink factors"
            - "DepositTicket.${tk_id}.settlement_variant == COMMINGLED"
            - "DepositTicket.${tk_id}.ticket_state == WEIGHED"

      - name: lien_admin_fee_keyed_on_pre_lien_eligible_value
        grounds:
          - calculations.collateral_valuation_and_advance_limit
          - entities.CollateralLien.fields.admin_fee_cents
          - entities.CollateralLien.fields.advance_rate_bps
          - entities.CollateralLien.fields.net_collateral_cents
        distinguishing_aspect: |
          §0.5 mode (c) — circular-looking dependency with a pinned evaluation order: the 25 bps
          administration fee is keyed on the PRE-lien eligible value (10,000,000 -> 25,000) yet it is
          itself a component of the warehouseman lien deducted to reach the net value, and the
          advance-rate tier is keyed on that POST-lien net value (9,685,000 < 10,000,000 -> 7000 bps,
          limit 6,779,500) rather than on the eligible value that would have selected 8000 bps and
          produced 7,748,000.
        test_recipe:
          setup:
            - "Licensed STATE warehouse, COMMINGLED agreement as in the base chain, bin B1 SOUND."
            - "A deposit ticket of exactly 25000 net bushels: gross 25000, dockage 0.0, moisture 14.0 (no excess over the agreement maximum), so dockage_bushels 0 and shrink_bushels 0."
            - "Receipt WR-0100 ISSUED for 25000 bushels of US_NO_1 corn, receiving charge 150,000 cents."
            - "Logical clock at 2026-08-20T09:00:00Z, so the receipt's PROVISIONAL storage charge is 140,000 cents (16 inclusive days)."
            - "A LENDER party with a 50,000,000-cent credit line."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 25000, test_weight_lbs: 56.5, moisture_pct: 14.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 0.0, fill_start_at: "2026-08-05T09:00:00Z", fill_end_at: "2026-08-05T11:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_big_id: $.data.id }
            - call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v2: $.data.version }
            - call: "POST /deposit-tickets/${tk_big_id}/accept"
              payload: { expected_bin_version: "${bin_v2}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { wh_v2: $.data.version }
            - call: "POST /receipts"
              payload: { deposit_ticket_id: "${tk_big_id}", holder_party_id: "${dep_id}", receipt_number: "WR-0100", form: "NEGOTIABLE", medium: "ELECTRONIC", expected_warehouse_version: "${wh_v2}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rc_big_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_big_id}", lender_party_id: "${len_id}", principal_cents: 1000000, valuation_basis: "MARK_TO_MARKET", mark_price_cents_per_bushel: 400, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_tier_id: $.data.id }
          assert:
            - "DepositTicket.${tk_big_id}.net_bushels == 25000"
            - "WarehouseReceipt.${rc_big_id}.receiving_charge_cents == 150000"
            - "WarehouseReceipt.${rc_big_id}.provisional_storage_charge_cents == 140000"
            - "CollateralLien.${lien_tier_id}.gross_value_cents == 10000000"
            - "CollateralLien.${lien_tier_id}.eligible_value_cents == 10000000"
            - "CollateralLien.${lien_tier_id}.admin_fee_cents == 25000"
            - "CollateralLien.${lien_tier_id}.warehouseman_lien_cents == 315000"
            - "CollateralLien.${lien_tier_id}.net_collateral_cents == 9685000"
            - "CollateralLien.${lien_tier_id}.advance_rate_bps == 7000"
            - "CollateralLien.${lien_tier_id}.advance_limit_cents == 6779500"
            - "CollateralLien.${lien_tier_id}.advance_limit_cents != 7748000, the value produced by selecting the 8000 bps tier from the eligible value instead of the net value"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: warehouse_license_cycle_and_insolvency_dimension_independence
        grounds:
          - state_machines.Warehouse.LICENSED_to_SUSPENDED
          - state_machines.Warehouse.SUSPENDED_to_LICENSED
          - state_machines.Warehouse.SOLVENT_to_DECLARED
          - entities.Warehouse.fields.license_state
          - entities.Warehouse.fields.insolvency_state
          - calculations.operational_posture_derivation
        distinguishing_aspect: |
          Non-linear shape on the Warehouse entity: the licensing dimension carries a revert cycle
          (LICENSED -> SUSPENDED -> LICENSED) and the insolvency dimension advances independently on
          the same row, so after DECLARE the warehouse reads license_state LICENSED with
          insolvency_state DECLARED — a combination no linear pipeline can express.
        test_recipe:
          setup:
            - "Base chain complete: warehouse LICENSED and SOLVENT with receipt WR-0001 ISSUED for 949 bushels; operational_posture OPEN because position_variance_bushels is 0."
            - "No deposit ticket is left in ticket_state WEIGHED, so the suspension cascade has nothing to reject."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
          trigger:
            - call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "SUSPEND", note: "moisture control findings" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "REINSTATE", note: "findings cleared" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "DECLARE", insolvency_price_cents_per_bushel: 400, note: "operator default" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "After SUSPEND: Warehouse.${wh_id}.license_state == SUSPENDED and Warehouse.${wh_id}.insolvency_state == SOLVENT and Warehouse.${wh_id}.operational_posture == CLOSED"
            - "After REINSTATE: Warehouse.${wh_id}.license_state == LICENSED and Warehouse.${wh_id}.operational_posture == OPEN"
            - "After DECLARE: Warehouse.${wh_id}.license_state == LICENSED (unchanged by the insolvency dimension)"
            - "After DECLARE: Warehouse.${wh_id}.insolvency_state == DECLARED and Warehouse.${wh_id}.operational_posture == CLOSED"
            - "Warehouse.${wh_id}.insolvency_price_cents_per_bushel == 400"
            - "WarehouseReceipt.${rc_id}.receipt_state == ISSUED throughout — the stored obligation survives both dimensions moving"

      - name: receipt_encumbrance_cycle_independent_of_receipt_state
        grounds:
          - state_machines.WarehouseReceipt.UNENCUMBERED_to_PLEDGED
          - state_machines.WarehouseReceipt.PLEDGED_to_RELEASED
          - state_machines.WarehouseReceipt.RELEASED_to_PLEDGED
          - entities.WarehouseReceipt.fields.encumbrance_state
          - entities.WarehouseReceipt.fields.registry_control_party_id
        distinguishing_aspect: |
          Non-linear shape on a different entity, WarehouseReceipt: the encumbrance dimension is a
          true cycle (UNENCUMBERED -> PLEDGED -> RELEASED -> PLEDGED) with no terminal state, and it
          runs while receipt_state stays ISSUED, so the receipt ends the sequence PLEDGED for a second
          lien with registry_control_party_id set again.
        test_recipe:
          setup:
            - "Base chain complete plus a LENDER party with a 50,000,000-cent credit line; clock at 2026-08-20T09:00:00Z."
            - "Receipt WR-0001 is NEGOTIABLE and ELECTRONIC at a registry-participating warehouse, held by the producer, encumbrance_state UNENCUMBERED."
            - "One REQUESTED CollateralLien exists on it with perfection_method ELECTRONIC_CONTROL."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 250000, valuation_basis: "MARK_TO_MARKET", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien1_id: $.data.id }
          trigger:
            - call: "POST /collateral-liens/${lien1_id}/perfect"
              payload: { attestation_note: "registry control taken" }
              as: Lender
              as_user_id: "${len_id}"
            - call: "POST /collateral-liens/${lien1_id}/release"
              payload: { payoff_received_cents: 250000 }
              as: Lender
              as_user_id: "${len_id}"
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 100000, valuation_basis: "FACE_ADVANCE", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien2_id: $.data.id }
            - call: "POST /collateral-liens/${lien2_id}/perfect"
              payload: { attestation_note: "re-pledged" }
              as: Lender
              as_user_id: "${len_id}"
          assert:
            - "After the first perfect: WarehouseReceipt.${rc_id}.encumbrance_state == PLEDGED and registry_control_party_id == ${len_id} and holder_party_id == ${dep_id}"
            - "After the release: WarehouseReceipt.${rc_id}.encumbrance_state == RELEASED and registry_control_party_id == null and holder_party_id == ${dep_id}"
            - "After the second perfect: WarehouseReceipt.${rc_id}.encumbrance_state == PLEDGED and registry_control_party_id == ${len_id}"
            - "WarehouseReceipt.${rc_id}.receipt_state == ISSUED at every step"
            - "CollateralLien.${lien1_id}.lien_state == RELEASED and CollateralLien.${lien2_id}.lien_state == PERFECTED"
            - "CollateralLien.${lien2_id}.advance_limit_cents == 271300"
            - "Party.${len_id}.committed_advance_cents == 271300 and Party.${len_id}.available_credit_cents == 49728700"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: bin_out_of_condition_impairs_receipt_then_lien_then_lender_credit
        grounds:
          - state_machines.Bin.SOUND_to_OUT_OF_CONDITION
          - calculations.bin_condition_assessment
          - calculations.collateral_valuation_and_advance_limit
          - calculations.operational_posture_derivation
          - entities.WarehouseReceipt.fields.quality_flag
          - entities.Party.fields.committed_advance_cents
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /bins/{bin_id}/condition-assessment: the bin entering
          OUT_OF_CONDITION flips WarehouseReceipt.quality_flag to IMPAIRED; that flip (not the original
          call) forces the PERFECTED CollateralLien to be revalued from 290482 down to 215935; that
          revaluation (not the flip) lowers Party.committed_advance_cents to 215935; and the same bin
          change independently drops sound_physical_bushels to 0, moving operational_posture to
          RESTRICTED.
        test_recipe:
          setup:
            - "Base chain complete plus a LENDER party with a 50,000,000-cent credit line; clock at 2026-08-20T09:00:00Z."
            - "A MARK_TO_MARKET lien at 450 cents/bushel with principal 250,000 cents is PERFECTED by ELECTRONIC_CONTROL, so committed_advance_cents is 290482 and available_credit_cents is 49709518."
            - "Bin B1 is SOUND holding all 949 bushels, so Warehouse.position_variance_bushels is 0 and operational_posture is OPEN."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 250000, valuation_basis: "MARK_TO_MARKET", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_casc_id: $.data.id }
            - call: "POST /collateral-liens/${lien_casc_id}/perfect"
              payload: { attestation_note: "registry control taken" }
              as: Lender
              as_user_id: "${len_id}"
          trigger:
            - call: "POST /bins/${bin_id}/condition-assessment"
              payload: { moisture_pct: 16.0, temperature_f: 70 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "Hop 1: Bin.${bin_id}.condition_state == OUT_OF_CONDITION and Bin.${bin_id}.last_moisture_pct == 16.0"
            - "Hop 2: WarehouseReceipt.${rc_id}.quality_flag == IMPAIRED"
            - "Hop 3: CollateralLien.${lien_casc_id}.grade_discount_bps == 2500"
            - "Hop 3: CollateralLien.${lien_casc_id}.eligible_value_cents == 320288"
            - "Hop 3: CollateralLien.${lien_casc_id}.admin_fee_cents == 801"
            - "Hop 3: CollateralLien.${lien_casc_id}.warehouseman_lien_cents == 11809"
            - "Hop 3: CollateralLien.${lien_casc_id}.net_collateral_cents == 308479"
            - "Hop 3: CollateralLien.${lien_casc_id}.advance_limit_cents == 215935"
            - "Hop 3: CollateralLien.${lien_casc_id}.margin_deficiency_cents == 34065 and margin_status == DEFICIENT"
            - "Hop 4: Party.${len_id}.committed_advance_cents == 215935 and Party.${len_id}.available_credit_cents == 49784065"
            - "Warehouse.${wh_id}.sound_physical_bushels == 0 and system_physical_bushels == 949"
            - "Warehouse.${wh_id}.position_variance_bushels == -949 and examination_tolerance_bushels == 500"
            - "Warehouse.${wh_id}.operational_posture == RESTRICTED"
            - "CollateralLien.${lien_casc_id}.lien_state == PERFECTED (the cascade revalues, it does not release)"

      - name: critical_examination_suspends_license_then_closes_posture_then_rejects_weighed_tickets
        grounds:
          - state_machines.PositionReport.UNDER_EXAMINATION_to_REJECTED
          - state_machines.Warehouse.LICENSED_to_SUSPENDED
          - state_machines.DepositTicket.WEIGHED_to_REJECTED
          - calculations.position_reconciliation
          - validations[priority=27]
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger, POST /position-reports/{report_id}/examine with
          result CRITICAL: the report moving to REJECTED suspends the licence; the suspension (not the
          examine call) closes the operational posture and rejects every WEIGHED DepositTicket with
          rejection_reason LICENSE_SUSPENDED, while the already-RECEIPTED ticket is untouched.
        test_recipe:
          setup:
            - "Base chain complete: receipt WR-0001 ISSUED for 949 bushels; obligation_bushels 949, system_physical_bushels 949."
            - "A second deposit ticket is left in ticket_state WEIGHED on the same bin with fill window 2026-08-05T16:00Z-17:00Z, clear of the first ticket's window plus its 240-minute rest buffer."
            - "A DRAFT PositionReport for 2026-08-01..2026-08-31 with as_of_date 2026-08-05 is submitted declaring only 400 physical bushels, so count_discrepancy_bushels is -549 against a tolerance of 500 and the report is UNDER_EXAMINATION."
            - "A second regulator identity reg-002 exists so the examination does not violate segregation of duties."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 500, test_weight_lbs: 56.5, moisture_pct: 13.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 0.0, fill_start_at: "2026-08-05T16:00:00Z", fill_end_at: "2026-08-05T17:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk2_id: $.data.id }
            - call: "POST /position-reports"
              payload: { warehouse_id: "${wh_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", as_of_date: "2026-08-05" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /position-reports/${pr_id}/submit"
              payload: { reported_physical_bushels: 400, reported_obligation_bushels: 949 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          trigger:
            - call: "POST /position-reports/${pr_id}/examine"
              payload: { result: "CRITICAL", findings_note: "unexplained 549-bushel shortage" }
              as: StateRegulator
              as_user_id: "reg-002"
          assert:
            - "Hop 1: PositionReport.${pr_id}.report_state == REJECTED and examination_result == CRITICAL and examined_by_user_id == reg-002"
            - "PositionReport.${pr_id}.count_discrepancy_bushels == -549 and examination_tolerance_bushels == 500 and examination_required == true"
            - "Hop 2: Warehouse.${wh_id}.license_state == SUSPENDED and insolvency_state == SOLVENT"
            - "Hop 2: Warehouse.${wh_id}.operational_posture == CLOSED"
            - "Hop 3: DepositTicket.${tk2_id}.ticket_state == REJECTED and rejection_reason == LICENSE_SUSPENDED"
            - "DepositTicket.${tk_id}.ticket_state == RECEIPTED (already terminal, untouched by the cascade)"
            - "WarehouseReceipt.${rc_id}.receipt_state == ISSUED and quantity_bushels == 949"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_gate_beats_capacity_fiscal_on_receipt_issuance
        grounds:
          - validations[priority=60]
          - validations[priority=84]
          - errors[ERR_WAREHOUSE_NOT_LICENSED]
          - errors[ERR_LICENSED_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 60, ERR_WAREHOUSE_NOT_LICENSED) versus
          business_fiscal (priority 84, ERR_LICENSED_CAPACITY_EXCEEDED): one POST /receipts violates
          both — the licence is SUSPENDED and 949 bushels would blow through a 500-bushel licensed
          capacity — and the response must be ERR_WAREHOUSE_NOT_LICENSED with HTTP 422.
        test_recipe:
          setup:
            - "A STATE warehouse licensed with licensed_capacity_bushels 500 (its 5,000,000-cent net worth and 2,500,000-cent bond still satisfy the STATE minimums, so the ISSUE decision succeeds)."
            - "A deposit ticket of 949 net bushels is ACCEPTED into bin B1, which has ample 40000-bushel capacity, so no bin-capacity error competes."
            - "The licence is then SUSPENDED, which sets operational_posture CLOSED rather than RESTRICTED, so priority 62 does not participate."
            - "expected_warehouse_version is read AFTER the suspension so the OCC check at priority 50 passes."
          setup_api_calls:
            - *b_clock
            - call: "POST /warehouses"
              payload: { name: "Small Crib", operator_name: "Prairie Grain Co", state_code: "KS", license_program: "STATE", licensed_capacity_bushels: 500, bond_amount_cents: 2500000, net_worth_cents: 5000000, loadout_lane_count: 2, registry_participant: true }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { wh_id: $.data.id }
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "SUSPEND", note: "records violation" }
              as: StateRegulator
              as_user_id: "reg-001"
            - *b_whv
          trigger:
            - call: "POST /receipts"
              payload: { deposit_ticket_id: "${tk_id}", holder_party_id: "${dep_id}", receipt_number: "WR-0001", form: "NEGOTIABLE", medium: "ELECTRONIC", expected_warehouse_version: "${wh_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP status == 422 and data.error_id == ERR_WAREHOUSE_NOT_LICENSED"
            - "data.error_id != ERR_LICENSED_CAPACITY_EXCEEDED even though 0 + 949 > 500"
            - "DepositTicket.${tk_id}.ticket_state == ACCEPTED (unchanged)"
            - "Warehouse.${wh_id}.receipted_obligation_bushels == 0"

      - name: bin_condition_safety_beats_fill_window_constraint_on_deposit_ticket
        grounds:
          - validations[priority=65]
          - validations[priority=71]
          - errors[ERR_BIN_OUT_OF_CONDITION]
          - errors[ERR_BIN_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different error-category pair — business_safety (priority 65, ERR_BIN_OUT_OF_CONDITION)
          versus business_temporal (priority 71, ERR_BIN_WINDOW_CONFLICT): one POST /deposit-tickets
          both targets an OUT_OF_CONDITION bin and requests a fill window overlapping a WEIGHED
          ticket's window, and the response must be ERR_BIN_OUT_OF_CONDITION with HTTP 422.
        test_recipe:
          setup:
            - "Licensed STATE warehouse with an ACTIVE COMMINGLED agreement and bin B1."
            - "One deposit ticket is WEIGHED on bin B1 occupying 2026-08-05T09:00Z-11:00Z."
            - "Bin B1 has been assessed at 16.0% moisture and 70F, so condition_state is OUT_OF_CONDITION."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - call: "POST /bins/${bin_id}/condition-assessment"
              payload: { moisture_pct: 16.0, temperature_f: 70 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          trigger:
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 800, test_weight_lbs: 56.5, moisture_pct: 13.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 0.0, fill_start_at: "2026-08-05T10:00:00Z", fill_end_at: "2026-08-05T12:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP status == 422 and data.error_id == ERR_BIN_OUT_OF_CONDITION"
            - "data.error_id != ERR_BIN_WINDOW_CONFLICT even though the requested window overlaps the WEIGHED ticket's window"
            - "Bin.${bin_id}.scheduled_inbound_bushels == 949 (only the first ticket's reservation stands)"
            - "GET /deposit-tickets?bin_id=${bin_id} returns exactly 1 DepositTicket"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: examination_tolerance_exact_equality_does_not_require_examination
        grounds:
          - calculations.position_reconciliation
          - entities.PositionReport.fields.examination_required
          - entities.PositionReport.fields.examination_tolerance_bushels
          - state_machines.PositionReport.DRAFT_to_ACCEPTED
        distinguishing_aspect: |
          Metric 1 — numeric threshold precision on POST /position-reports/{report_id}/submit: a
          count_discrepancy of exactly -500 against an examination_tolerance_bushels of 500 is NOT
          strictly greater, so the report auto-ACCEPTS, while -501 on an adjacent period crosses the
          boundary and routes to UNDER_EXAMINATION.
        test_recipe:
          setup:
            - "Base chain complete: obligation_bushels 949, system_physical_bushels 949, sound_physical_bushels 949, so examination_tolerance_bushels is max(500, round_half_up(949 * 50 / 10000) = 5) = 500."
            - "Two non-overlapping DRAFT position reports exist: 2026-08-01..2026-08-10 (as_of 2026-08-05) and 2026-08-11..2026-08-20 (as_of 2026-08-15)."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /position-reports"
              payload: { warehouse_id: "${wh_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-10", as_of_date: "2026-08-05" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { pr_eq_id: $.data.id }
            - call: "POST /position-reports"
              payload: { warehouse_id: "${wh_id}", period_start_date: "2026-08-11", period_end_date: "2026-08-20", as_of_date: "2026-08-15" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { pr_gt_id: $.data.id }
          trigger:
            - call: "POST /position-reports/${pr_eq_id}/submit"
              payload: { reported_physical_bushels: 449, reported_obligation_bushels: 949 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "POST /position-reports/${pr_gt_id}/submit"
              payload: { reported_physical_bushels: 448, reported_obligation_bushels: 949 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "PositionReport.${pr_eq_id}.examination_tolerance_bushels == 500"
            - "PositionReport.${pr_eq_id}.count_discrepancy_bushels == -500"
            - "PositionReport.${pr_eq_id}.obligation_misstatement_bushels == 0 and position_variance_bushels == 0"
            - "PositionReport.${pr_eq_id}.examination_required == false and report_state == ACCEPTED and examination_result == PASS and examined_by_user_id == null"
            - "PositionReport.${pr_gt_id}.count_discrepancy_bushels == -501"
            - "PositionReport.${pr_gt_id}.examination_required == true and report_state == UNDER_EXAMINATION"
            - "Warehouse.${wh_id}.operational_posture == OPEN after the first submit"

      - name: indemnity_allocation_with_zero_allowed_claims
        grounds:
          - calculations.indemnity_waterfall_allocation
          - state_machines.Warehouse.CLAIMS_OPEN_to_ALLOCATED
          - state_machines.IndemnityClaim.FILED_to_DISALLOWED
          - entities.Warehouse.fields.allowed_claim_total_cents
        distinguishing_aspect: |
          Metric 2 — an empty-set edge on a different endpoint, POST
          /warehouses/{warehouse_id}/insolvency with action ALLOCATE: the only claim was DISALLOWED so
          total_allowed is 0, the pro-rata denominator is empty, and every allocation total must read
          exactly 0 with insolvency_state advancing to ALLOCATED rather than erroring.
        test_recipe:
          setup:
            - "Base chain complete, then insolvency DECLARED at 400 cents/bushel and moved to CLAIMS_OPEN."
            - "The producer files one claim of 1,000,000 cents on receipt WR-0001, and the regulator DISALLOWS it, so no claim remains FILED and none is ALLOWED."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "DECLARE", insolvency_price_cents_per_bushel: 400, note: "operator default" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "OPEN_CLAIMS" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /indemnity-claims"
              payload: { warehouse_id: "${wh_id}", receipt_id: "${rc_id}", claimant_party_id: "${dep_id}", claimed_cents: 1000000 }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { clm_zero_id: $.data.id }
            - call: "POST /indemnity-claims/${clm_zero_id}/adjudicate"
              payload: { decision: "DISALLOW", adjudication_note: "receipt already satisfied" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "ALLOCATE" }
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "HTTP status == 200 and Warehouse.${wh_id}.insolvency_state == ALLOCATED"
            - "Warehouse.${wh_id}.allowed_claim_total_cents == 0"
            - "Warehouse.${wh_id}.bond_allocated_cents == 0 and fund_allocated_cents == 0"
            - "Warehouse.${wh_id}.allocated_total_cents == 0 and unpaid_claim_total_cents == 0"
            - "IndemnityClaim.${clm_zero_id}.claim_state == DISALLOWED (not SETTLED)"
            - "IndemnityClaim.${clm_zero_id}.allowed_cents == 0 and bond_share_cents == 0 and fund_share_cents == 0 and unpaid_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: delivery_order_blocked_by_bin_out_of_condition
        grounds:
          - validations[priority=65]
          - state_machines.Bin.SOUND_to_OUT_OF_CONDITION
          - errors[ERR_BIN_OUT_OF_CONDITION]
          - entities.Bin.fields.condition_state
        distinguishing_aspect: |
          Entity pair DeliveryOrder -> Bin: the depositor's delivery right on an ISSUED, UNENCUMBERED
          receipt is refused solely because a different entity, the Bin holding the grain, is
          OUT_OF_CONDITION; the same request succeeds once the bin is conditioned back to WATCH.
        test_recipe:
          setup:
            - "Base chain complete: receipt WR-0001 ISSUED for 949 bushels, held by the producer, encumbrance_state UNENCUMBERED."
            - "Bin B1 assessed at 16.0% moisture and 70F, so condition_state is OUT_OF_CONDITION and Warehouse.operational_posture is RESTRICTED (which does not gate delivery orders)."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /bins/${bin_id}/condition-assessment"
              payload: { moisture_pct: 16.0, temperature_f: 70 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          trigger:
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 400, appointment_start_at: "2026-08-06T10:00:00Z", appointment_end_at: "2026-08-06T12:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
            - call: "POST /bins/${bin_id}/condition-assessment"
              payload: { moisture_pct: 14.2, temperature_f: 70, treatment_action: "DRY" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 400, appointment_start_at: "2026-08-06T10:00:00Z", appointment_end_at: "2026-08-06T12:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_ok_id: $.data.id }
          assert:
            - "First trigger: HTTP status == 422 and data.error_id == ERR_BIN_OUT_OF_CONDITION"
            - "First trigger: Bin.${bin_id}.held_bushels == 0 (no hold was placed)"
            - "After the DRY assessment: Bin.${bin_id}.condition_state == WATCH and WarehouseReceipt.${rc_id}.quality_flag == SOUND"
            - "Second trigger: HTTP status == 201 and DeliveryOrder.${do_ok_id}.delivery_state == REQUESTED and lane_index == 0"
            - "Bin.${bin_id}.held_bushels == 400 after the successful order"

      - name: indemnity_claim_requires_warehouse_claims_open
        grounds:
          - validations[priority=55]
          - state_machines.Warehouse.DECLARED_to_CLAIMS_OPEN
          - state_machines.IndemnityClaim.FILED_to_ALLOWED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A different entity pair, IndemnityClaim -> Warehouse on the insolvency dimension: filing is
          refused with ERR_INVALID_STATE while insolvency_state is DECLARED and accepted the moment the
          same warehouse reaches CLAIMS_OPEN, with no change to the claim payload.
        test_recipe:
          setup:
            - "Base chain complete with receipt WR-0001 ISSUED for 949 bushels held by the producer."
            - "Insolvency DECLARED at 400 cents/bushel; insolvency_state is DECLARED and has NOT yet been moved to CLAIMS_OPEN."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "DECLARE", insolvency_price_cents_per_bushel: 400, note: "operator default" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /indemnity-claims"
              payload: { warehouse_id: "${wh_id}", receipt_id: "${rc_id}", claimant_party_id: "${dep_id}", claimed_cents: 300000 }
              as: Depositor
              as_user_id: "${dep_id}"
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "OPEN_CLAIMS" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /indemnity-claims"
              payload: { warehouse_id: "${wh_id}", receipt_id: "${rc_id}", claimant_party_id: "${dep_id}", claimed_cents: 300000 }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { clm_ok_id: $.data.id }
          assert:
            - "First trigger: HTTP status == 409 and data.error_id == ERR_INVALID_STATE"
            - "First trigger: GET /indemnity-claims?warehouse_id=${wh_id} returns 0 IndemnityClaims"
            - "Second trigger: HTTP status == 201 and IndemnityClaim.${clm_ok_id}.claim_state == FILED"
            - "IndemnityClaim.${clm_ok_id}.claimed_cents == 300000 and bond_share_cents == 0 and fund_share_cents == 0"
            - "Warehouse.${wh_id}.insolvency_state == CLAIMS_OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bin_fill_window_buffered_closed_interval_conflict
        grounds:
          - validations[priority=71]
          - errors[ERR_BIN_WINDOW_CONFLICT]
          - entities.DepositTicket.fields.fill_start_at
          - entities.DepositTicket.fields.fill_end_at
        distinguishing_aspect: |
          Interval semantics 1 on the Bin resource: fill windows are CLOSED intervals inflated by a
          240-minute trailing rest buffer, so a window starting at exactly 15:00:00Z — the existing
          11:00:00Z end plus the buffer — still conflicts, while 15:00:01Z is admitted.
        test_recipe:
          setup:
            - "Licensed STATE warehouse, ACTIVE COMMINGLED agreement, bin B1 SOUND with 40000 bushels of capacity."
            - "One WEIGHED deposit ticket of 949 net bushels occupies 2026-08-05T09:00:00Z-11:00:00Z on bin B1."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
          trigger:
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 800, test_weight_lbs: 56.5, moisture_pct: 13.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 0.0, fill_start_at: "2026-08-05T15:00:00Z", fill_end_at: "2026-08-05T16:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "POST /deposit-tickets"
              payload: { storage_agreement_id: "${agr_id}", bin_id: "${bin_id}", gross_bushels: 800, test_weight_lbs: 56.5, moisture_pct: 13.0, damage_pct: 2.0, foreign_material_pct: 1.0, dockage_pct: 0.0, fill_start_at: "2026-08-05T15:00:01Z", fill_end_at: "2026-08-05T16:00:00Z" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_edge_id: $.data.id }
          assert:
            - "First trigger: HTTP status == 409 and data.error_id == ERR_BIN_WINDOW_CONFLICT"
            - "Second trigger: HTTP status == 201 and DepositTicket.${tk_edge_id}.ticket_state == WEIGHED"
            - "DepositTicket.${tk_edge_id}.net_bushels == 800 (dockage 0, moisture 13.0 is under the 14.0 maximum so shrink is 0)"
            - "Bin.${bin_id}.scheduled_inbound_bushels == 1749 after the accepted ticket"
            - "GET /deposit-tickets?bin_id=${bin_id} returns exactly 2 DepositTickets"

      - name: loadout_lane_half_open_aggregate_capacity_conflict
        grounds:
          - validations[priority=72]
          - errors[ERR_LOADOUT_CAPACITY_EXCEEDED]
          - entities.DeliveryOrder.fields.lane_index
          - entities.Warehouse.fields.loadout_lane_count
        distinguishing_aspect: |
          Interval semantics 2 on a different resource, the warehouse's two loadout lanes: appointments
          are HALF-OPEN [start, end) with aggregate capacity, so a third overlapping appointment is
          refused with ERR_LOADOUT_CAPACITY_EXCEEDED while an appointment starting exactly at another's
          12:00:00Z end does not overlap it and takes the freed lane_index 0.
        test_recipe:
          setup:
            - "Base chain complete on a warehouse with loadout_lane_count 2; receipt WR-0001 ISSUED for 949 bushels, held by the producer, bin B1 SOUND."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
          trigger:
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 300, appointment_start_at: "2026-09-14T10:00:00Z", appointment_end_at: "2026-09-14T12:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_a_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 300, appointment_start_at: "2026-09-14T11:00:00Z", appointment_end_at: "2026-09-14T13:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_b_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 100, appointment_start_at: "2026-09-14T11:30:00Z", appointment_end_at: "2026-09-14T12:30:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
            - call: "POST /delivery-orders"
              payload: { receipt_id: "${rc_id}", requested_bushels: 100, appointment_start_at: "2026-09-14T12:00:00Z", appointment_end_at: "2026-09-14T13:00:00Z" }
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_d_id: $.data.id }
          assert:
            - "DeliveryOrder.${do_a_id}.lane_index == 0 and DeliveryOrder.${do_b_id}.lane_index == 1"
            - "Third trigger: HTTP status == 409 and data.error_id == ERR_LOADOUT_CAPACITY_EXCEEDED"
            - "Fourth trigger: HTTP status == 201 and DeliveryOrder.${do_d_id}.lane_index == 0, because [12:00,13:00) does not overlap [10:00,12:00)"
            - "Bin.${bin_id}.held_bushels == 700 (300 + 300 + 100; the refused order placed no hold)"
            - "GET /delivery-orders?receipt_id=${rc_id} returns exactly 3 DeliveryOrders"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: obligation_bushels_conserved_across_receipt_issue_and_void
        grounds:
          - state_machines.WarehouseReceipt.ISSUED_to_VOIDED
          - state_machines.DepositTicket.ACCEPTED_to_RECEIPTED
          - calculations.position_reconciliation
          - entities.Warehouse.fields.obligation_bushels
          - validations[priority=70]
        distinguishing_aspect: |
          Conserved quantity 1 is a physical quantity in bushels: Warehouse.obligation_bushels ==
          sum(ISSUED receipt quantity) + sum(ACCEPTED ticket net_bushels) reads exactly 949 before
          issuance, after issuance and after the void, because voiding returns the ticket from
          RECEIPTED to ACCEPTED; only the receipted/unreceipted split moves.
        test_recipe:
          setup:
            - "Base chain complete: ticket of 949 net bushels ACCEPTED, receipt WR-0001 ISSUED at 2026-08-05T08:00:00Z, obligation_bushels 949, receipted_obligation_bushels 949, Bin.stored_bushels 949."
            - "Clock advanced to 2026-08-06T08:00:00Z — 24 hours after issuance, inside the 72-hour void window."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T08:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /receipts/${rc_id}/void"
              payload: { void_reason: "wrong holder recorded" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}/position-summary"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "Warehouse.${wh_id}.obligation_bushels == 949 both before and after the void"
            - "Warehouse.${wh_id}.receipted_obligation_bushels == 0 after the void (949 before)"
            - "WarehouseReceipt.${rc_id}.receipt_state == VOIDED and quantity_bushels == 0"
            - "DepositTicket.${tk_id}.ticket_state == ACCEPTED (restored from RECEIPTED)"
            - "Bin.${bin_id}.stored_bushels == 949 unchanged — voiding a receipt moves no grain"
            - "Warehouse.${wh_id}.position_variance_bushels == 0 and operational_posture == OPEN"

      - name: lender_credit_line_conserved_across_lien_perfect_and_release
        grounds:
          - state_machines.CollateralLien.REQUESTED_to_PERFECTED
          - state_machines.CollateralLien.PERFECTED_to_RELEASED
          - entities.Party.fields.committed_advance_cents
          - entities.Party.fields.available_credit_cents
          - calculations.collateral_valuation_and_advance_limit
        distinguishing_aspect: |
          Conserved quantity 2 is a monetary quantity in cents: Party.available_credit_cents ==
          credit_line_cents - committed_advance_cents returns to exactly 50000000 after release even
          though an intervening revaluation at 500 cents/bushel moved the committed amount from 290482
          to 323614 — the compensating release leaves zero drift.
        test_recipe:
          setup:
            - "Base chain complete plus a LENDER party with credit_line_cents 50000000; clock at 2026-08-20T09:00:00Z."
            - "A REQUESTED MARK_TO_MARKET lien at 450 cents/bushel with principal 250000 cents and perfection_method ELECTRONIC_CONTROL exists on receipt WR-0001."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /collateral-liens"
              payload: { receipt_id: "${rc_id}", lender_party_id: "${len_id}", principal_cents: 250000, valuation_basis: "MARK_TO_MARKET", mark_price_cents_per_bushel: 450, perfection_method: "ELECTRONIC_CONTROL" }
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_cons_id: $.data.id }
          trigger:
            - call: "POST /collateral-liens/${lien_cons_id}/perfect"
              payload: { attestation_note: "registry control taken" }
              as: Lender
              as_user_id: "${len_id}"
            - call: "POST /collateral-liens/${lien_cons_id}/revalue"
              payload: { mark_price_cents_per_bushel: 500 }
              as: Lender
              as_user_id: "${len_id}"
            - call: "POST /collateral-liens/${lien_cons_id}/release"
              payload: { payoff_received_cents: 250000 }
              as: Lender
              as_user_id: "${len_id}"
            - call: "GET /parties/${len_id}"
              payload: {}
              as: Lender
              as_user_id: "${len_id}"
          assert:
            - "Before perfection: Party.${len_id}.committed_advance_cents == 0 and available_credit_cents == 50000000"
            - "After perfection: CollateralLien.${lien_cons_id}.advance_limit_cents == 290482, Party.${len_id}.committed_advance_cents == 290482, available_credit_cents == 49709518"
            - "After revaluation at 500: CollateralLien.${lien_cons_id}.eligible_value_cents == 474500, admin_fee_cents == 1186, warehouseman_lien_cents == 12194, net_collateral_cents == 462306, advance_limit_cents == 323614"
            - "After revaluation: Party.${len_id}.committed_advance_cents == 323614 and available_credit_cents == 49676386"
            - "After release: CollateralLien.${lien_cons_id}.lien_state == RELEASED and payoff_received_cents == 250000"
            - "After release: Party.${len_id}.committed_advance_cents == 0 and available_credit_cents == 50000000 — identical to the pre-perfection value, zero drift"
            - "After release: WarehouseReceipt.${rc_id}.encumbrance_state == RELEASED, holder_party_id == ${dep_id}, registry_control_party_id == null"
