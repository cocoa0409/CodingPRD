              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1", requires_contrast: false }
              as: SchedulingClerk
              captures: { ord1_id: $.data.id }
            - call: "POST /imaging-orders/${ord1_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord1_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { o1v: $.data.version }
            - call: "POST /imaging-orders/${ord1_id}/exams"
              payload: { room_id: "${room1_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${o1v}" }
              as: SchedulingClerk
              captures: { exam1_id: $.data.id }
            - call: "POST /imaging-exams/${exam1_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam1_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam1_id}/image-series"
              payload: { series_label: "PA" }
              as: Technologist
