      - name: eso_expires_at_sixty_day_boundary
        grounds:
          - state_machines.EmergencyServiceOrder.ACTIVE_to_EXPIRED
          - entities.EmergencyServiceOrder.fields.expires_at
        claim_type: valid_transition
        distinguishing_aspect: "System auto-transition on the logical clock: an ESO issued 2026-09-01T00:00:00Z expires at 2026-10-31T00:00:00Z; at 2026-10-30T23:59:59Z it still reads ACTIVE, at exactly the expiry instant it reads EXPIRED (>= boundary), and the carrier's standing recomputes to GOOD."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Carrier CSXT; service complaint escalated -> ESO ACTIVE with expires_at 2026-10-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-gal", carrier_id: "${c1}", issue_type: "DELAY", territory_code: "GULF-COAST" }
              as: Shipper
              as_user_id: "shp-gal"
              captures: { sc1: $.data.id }
            - call: "POST /stb/service-complaints/${sc1}/escalate"
              payload: { directive: "Restore service within 72 hours" }
              as: BoardAdjudicator
              captures: { eso1: $.data.id }
          trigger:
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /stb/carriers/${c1}/emergency-service-orders"
              as: BoardAdjudicator
              captures: { st_before: "$.data[0].status" }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /stb/carriers/${c1}/emergency-service-orders"
              as: BoardAdjudicator
              captures: { st_after: "$.data[0].status" }
          assert:
            - "st_before == ACTIVE (one second before expiry)"
            - "st_after == EXPIRED (at exactly expires_at)"
            - "Carrier.${c1}.compliance_standing == GOOD after expiry"

