              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-1", transaction_date: "2026-07-05", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 1, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_id: $.data.id }
            - call: "POST /submission-lots/${lot_id}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://w1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-1" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { rv1: $.data.version }
            - call: "POST /retailers/${ret_id}/fraud-rescore"
              payload: { expected_retailer_version: "${rv1}" }
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /retailers/${ret_id}/fraud-rescore"
              payload: { expected_retailer_version: "${rv1}" }
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { rv2: $.data.version }
            - call: "POST /retailers/${ret_id}/fraud-rescore"
              payload: { expected_retailer_version: "${rv2}" }
              as: FraudAnalyst
              as_user_id: "fa-1"
          assert:
            - "trigger call 2: 200 with data.duplicate_rate \"0.00\", data.misredemption_rate \"0.00\", data.counterfeit_rate \"0.00\", data.fraud_score \"0.00\", data.status \"ACTIVE\" and data.handling_fee_tier equal to data.base_fee_tier"
            - "trigger call 2: data.last_rescored_at == \"2026-08-01\" — the score is stamped from the logical clock"
            - "trigger call 2: data.version is one greater than the version captured in trigger call 1, even though no score field changed value"
            - "trigger call 3: 412 with error.code == \"ERR_STALE_RETAILER_VERSION\""
            - "trigger call 4: data.version is one greater than the version captured in trigger call 1 — the refused rescore neither bumped the version nor rewrote last_rescored_at"
