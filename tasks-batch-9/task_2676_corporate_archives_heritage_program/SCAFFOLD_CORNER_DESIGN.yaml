      - name: requester_suspend_twice_returns_requester_state_invalid
        claim_type: idempotency
        grounds:
          - state_machines.Requester.ACTIVE_to_SUSPENDED
          - errors[ERR_REQUESTER_STATE_INVALID]
        distinguishing_aspect: "The second suspend on an already SUSPENDED requester returns ERR_REQUESTER_STATE_INVALID (409) and leaves the original suspend_reason intact rather than overwriting it."
        test_recipe:
          setup:
            - "One Requester already suspended once."
          setup_api_calls:
            - call: "POST /requesters"
              payload: { display_name: "D. Farkas", requester_class: "MEDIA", affiliation: "Trade Press", nda_on_file: false }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
