  # ===========================================================================
  # Rule 6 - boundary precision on different metrics at different endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: chill_intermediate_inclusive_at_exactly_120_minutes_and_80_0_degrees
        grounds:
          - calculations.temperature_log_in_range
          - calculations.temperature_log_in_range.constants.CHILL_INTERMEDIATE_MAX_MINUTES
          - calculations.temperature_log_in_range.constants.CHILL_INTERMEDIATE_MAX_F
          - entities.TemperatureLog.fields.minutes_since_cook_end
          - endpoints[POST /cfs/production-batches/{id}/temperature-logs]
        distinguishing_aspect: |
          The metric is the floored elapsed-minute count from cook_end_at, measured at the
          POST /cfs/production-batches/{id}/temperature-logs endpoint. Three readings held at the
          identical temperature of exactly 80.0 F (itself the inclusive CHILL_INTERMEDIATE ceiling)
          are posted at 119, 120 and 121 minutes. Only the 121-minute reading is out of range, so
          an implementation using a strict "< 120" comparison or a rounded rather than floored
          minute count fails on the middle reading while the other two still pass.
        test_recipe:
          setup:
            - "ServiceContract CFS-2515-BP1 ACTIVE, Facility FAC-BP1 (blast_chiller_capacity 2), ACTIVE 1-day MenuCycle, LOCKED MealForecast for 2026-08-02 BREAKFAST (total_forecast_trays 22)."
            - "One ProductionBatch of 10 planned trays, service_site MAIN_KITCHEN."
            - "COOK_END logged at exactly 2026-08-01T10:00:00Z at 170.0 F, and the batch advanced to production_stage COOKED with produced_trays 10."
