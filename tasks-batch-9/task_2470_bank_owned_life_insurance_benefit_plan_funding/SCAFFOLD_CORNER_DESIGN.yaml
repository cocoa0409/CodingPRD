              payload: { legal_name: "Elmwood Life", naic_code: "71031", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "IL" }
              as: PlatformAdmin
              captures: { carrier_ew_id: $.data.id }
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_ew_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_ew_id: $.data.id }
            - call: "POST /diligence-reviews/${rev_ew_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /diligence-reviews/${rev_ew_id}/approve"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-2"
            - call: "POST /diligence-reviews/${rev_ew_id}/request-info"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-2"
            - call: "POST /carriers/${carrier_ew_id}/suspend"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-2"
          assert:
            - "trigger call 1 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "trigger call 2 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "trigger call 3 returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "DiligenceReview.${rev_ew_id}.status == UNDER_REVIEW with info_request_count == 0 and decided_by_user_id == null"
            - "Carrier.${carrier_ew_id}.status == PENDING_DILIGENCE"

      - name: the_same_user_id_cannot_submit_and_then_decide_the_same_review
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.RiskOfficer.exclusive_operations
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID and not on role: a RiskOfficer whose X-User-ID is analyst-1 — the operator recorded in submitted_by_user_id — is refused on both approve and decline with ERR_SEGREGATION_OF_DUTIES (403), and a different X-User-ID with the same role succeeds."
