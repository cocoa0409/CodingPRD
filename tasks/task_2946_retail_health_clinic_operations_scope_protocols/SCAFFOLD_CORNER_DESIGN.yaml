          - errors[ERR_COVERAGE_ALREADY_EXISTS]
        distinguishing_aspect: "Both halves of the guard are exercised on one assignment: covering it while still ACTIVE returns ERR_COVERAGE_ALREADY_EXISTS (409), and after cancellation the FIRST cover succeeds while a SECOND cover of the same assignment returns the same error — the endpoint is not idempotent and never stacks two FLOAT rows."
