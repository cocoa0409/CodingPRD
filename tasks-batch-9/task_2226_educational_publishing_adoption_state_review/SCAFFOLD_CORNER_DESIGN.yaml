        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCESSIBILITY_COMMITMENT_MISSING]
          - errors[ERR_PRIVACY_ADDENDUM_MISSING]
          - errors[ERR_ROSTERING_STANDARD_UNSUPPORTED]
          - errors[ERR_BUNDLE_TITLE_MISMATCH]
        distinguishing_aspect: |
          Four proposals that differ only in which bundle they attach return four different 422 codes
          - accessibility, privacy, rostering and bundle-title - and because every one of them fails,
          the submission's version never advances, so the same expected_submission_version works for
          all four attempts.
