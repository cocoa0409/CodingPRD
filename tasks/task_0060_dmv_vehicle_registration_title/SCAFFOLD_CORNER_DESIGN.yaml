        claim_type: Constants Applied
        grounds: [calculations.registration_fee, entities.Vehicle.fields.model_year]
        distinguishing_aspect: "msrp 2,000,000c PASSENGER at model_year 2023 (age 3 -> band1 0.0090) yields registration_fee 22300; at 2022 (age 4 -> band2 0.0060) yields 16300 — the age-band tier boundary."
        test_recipe:
          setup: ["Two KING owners; two vehicles msrp 2,000,000c PASSENGER, model_year 2023 and 2022; INITIAL registrations on each."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Band Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000220", model_year: 2023, purchase_price_cents: 2000000, msrp_cents: 2000000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { v23_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000221", model_year: 2022, purchase_price_cents: 2000000, msrp_cents: 2000000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { v22_id: $.data.id }
            - call: "POST /registrations"
              payload: { vehicle_id: "${v23_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg23_id: $.data.id }
            - call: "POST /registrations"
              payload: { vehicle_id: "${v22_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg22_id: $.data.id }
          trigger:
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg23_id}" }
              as: ClerkAgent
              captures: { fa23_id: $.data.id }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg22_id}" }
              as: ClerkAgent
              captures: { fa22_id: $.data.id }
          assert:
            - "FeeAssessment.${fa23_id}.registration_fee_cents == 22300"
            - "FeeAssessment.${fa22_id}.registration_fee_cents == 16300"

