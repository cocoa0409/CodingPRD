      - name: segment_withdraw_restores_request_page_partition
        grounds:
          - calculations.request_page_ledger
          - state_machines.RecordSegment.retrieval_status.RETRIEVED_to_WITHDRAWN
          - state_machines.RecordSegment.sensitivity_status.to_UNCLASSIFIED
        distinguishing_aspect: >
          The invariant is a page partition — page_count_total must always equal
          billable + withheld + redacted_total — and it is asserted at four points
          across a withhold, a redaction and a withdrawal. Withdrawing a RETRIEVED
          segment is the compensation: it must simultaneously drop the segment from
          the gross total, clear the withheld bucket it was filling, reset its two
          classification dimensions, and leave the OTHER segment's in-flight
          redaction untouched — and it is only legal while the parent is still in
          COMPILATION, SENSITIVE_REVIEW or REDACTION.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility with the default sensitive-category list (BEHAVIORAL_HEALTH and HIV both segregate)."
            - "ATTORNEY requester authorized for GENERAL_MEDICAL, BEHAVIORAL_HEALTH and HIV in scope, but with only BEHAVIORAL_HEALTH in sensitive_categories_authorized."
            - "Three RETRIEVED segments on one request: GENERAL_MEDICAL 40, BEHAVIORAL_HEALTH 22, HIV 18 -> page_count_total 80."
            - "Sensitive review INCLUDEs the behavioral-health segment with redaction_required and WITHHOLDs the HIV segment, so the request sits in REDACTION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}", legacy_archive_enabled: true, legacy_retrieval_surcharge_cents: 2000, legacy_gateway_job_minutes: 30, legacy_gateway_buffer_minutes: 10 }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH", "HIV"], sensitive_categories_authorized: ["BEHAVIORAL_HEALTH"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH", "HIV"], date_range_start: "2024-01-01", date_range_end: "2024-12-31", delivery_format: "SECURE_PORTAL" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq: $.data.id }
            - call: "POST /roi/requests/${rq}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq}", source_system: "EHR_CURRENT", category: "GENERAL_MEDICAL" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg_gen: $.data.id }
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq}", source_system: "EHR_CURRENT", category: "BEHAVIORAL_HEALTH" }
