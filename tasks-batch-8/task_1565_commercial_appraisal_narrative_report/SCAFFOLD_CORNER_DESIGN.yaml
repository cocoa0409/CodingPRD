  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error
        claim_type: envelope_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + response_type object + data; errors carry response_type error + data.error_id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "success response: meta.api_request_id present, response_type == object, data.id == ${cl_id}"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND"

      - name: list_pagination_has_more
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints[GET /engagements]"]
        distinguishing_aspect: "With 3 engagements and limit 2: data length 2, total_count 3, has_more true; offset 2 page returns the remaining 1 with has_more false."
        test_recipe:
          setup: ["one client, two appraisers, three engagements created"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "1 A St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { e1: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "2 B St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { e2: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "3 C St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /engagements?limit=2"
              payload: { limit: 2 }
              as: EngagementManager
            - call: "GET /engagements?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: EngagementManager
          assert:
            - "page 1: len(data) == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): len(data) == 1, has_more == false, total_count == 3"

      - name: filtered_list_reverse_reachability
        claim_type: listing
        grounds: [entities.Engagement.fields.client_id, "endpoints[GET /engagements]"]
        distinguishing_aspect: "GET /engagements?client_id=X returns exactly X's engagements — the FK reverse-reachability channel."
        test_recipe:
          setup: ["two clients with one engagement each"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_a: $.data.id }
            - call: "POST /clients"
              payload: { name: "Beta Trust", client_type: "INVESTOR" }
              as: EngagementManager
              captures: { cl_b: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_a}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "1 A St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_a: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_b}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "2 B St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Beta Trust"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_b: $.data.id }
          trigger:
            - call: "GET /engagements?client_id=${cl_a}"
              payload: { client_id: "${cl_a}" }
              as: EngagementManager
              captures: { hit_id: "$.data[0].id" }
          assert:
            - "filtered list: total_count == 1 and data[0].id == ${eng_a} (client B's engagement excluded)"

  # ===================================================================
  # Section: errors
  # ===================================================================
  - section: errors
    instances:
      - name: value_pressure_accept_rejected_409
        claim_type: violation_to_error
        grounds: [state_machines.RevisionRequest.OPEN_to_ACCEPTED, "errors[ERR_INDEPENDENCE_COMPROMISE]"]
