  # =========================================================================
  # Rule 5 - priority-pair validation conflicts (two distinct category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_spend_axis_frozen_outranks_insufficient_renovation_balance
        grounds:
          - validations.priority_18_ERR_PACKAGE_SPEND_FROZEN
          - validations.priority_43_ERR_INSUFFICIENT_TRANCHE_BALANCE
          - calculations.renovation_cost_allocation
          - calculations.encumbrance_waterfall
        distinguishing_aspect: |
          Category pair state (priority 18) vs business_fiscal (priority 43) on one endpoint,
          POST /renovation-projects/{id}/award. The very same request violates both rules: the
          package's spend axis is still NOT_YET_AVAILABLE and the MODERATE award of 60_000_000
          leaves a package charge of 45_000_000 against a RENOVATION tranche holding 12_000_000.
          The first attempt must return the state error ERR_PACKAGE_SPEND_FROZEN (409); after the
          package is activated - the fiscal shortfall untouched - the identical request must return
          ERR_INSUFFICIENT_TRANCHE_BALANCE (422), proving the ordering rather than a coincidence.
