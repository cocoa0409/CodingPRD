  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: grant_changes_requested_revision_cycle
        grounds:
          - state_machines.Grant.PENDING_APPROVAL_to_CHANGES_REQUESTED
          - state_machines.Grant.CHANGES_REQUESTED_to_PENDING_APPROVAL
          - state_machines.Grant.PENDING_APPROVAL_to_APPROVED
          - entities.Grant.fields.changes_requested_count
          - validations[priority=66]
          - errors[ERR_MAX_GRANT_REVISIONS_EXCEEDED]
        distinguishing_aspect: |
          The cyclic entity here is Grant: PENDING_APPROVAL -> CHANGES_REQUESTED ->
          PENDING_APPROVAL is traversable exactly twice because request-changes compares
          changes_requested_count with < MAX_GRANT_REVISIONS (2) before opening the loop,
          so the third request-changes returns ERR_MAX_GRANT_REVISIONS_EXCEEDED while the
          grant stays in PENDING_APPROVAL and remains approvable.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z; EquityPlan 'Plan E Revision' ACTIVE with 1000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "Participant 'Eve Cycle' ACTIVE."
            - "One RSU Grant of 10000 target shares in DRAFT with a single TIME tranche of 4000 shares."
