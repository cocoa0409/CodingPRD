scenario: |
  Office Sublease & Assignment Administration (office tenant rep broker): sublease marketing & landlord consent requirement, subtenant credit review & consent conditions, rent differential & profit-sharing with landlord, assignment vs sublease liability retention, space measurement & partial floor demising, restoration obligation allocation, consent timeline & deemed-approval provisions, documentation & recognition agreement

domain_name: "office-sublease-assignment"
api_prefix: "/sublease-admin"

complexity_profile:
  primary_archetype: multi_party_negotiation   # Tenant / Landlord / Subtenant / Assignee / Broker must converge on consent
  secondary_archetype: compliance_audit        # deemed-approval timers, recognition agreement, audit ledger
  complexity_layers:
    - optimistic_concurrency                   # OCC on Lease.version for TransferRequest creation-with-supersede; OCC on ConsentReview.version for decision submission
    - scheduled_deferred_actions               # deemed-approval timers fire via logical clock; settlement accrual epochs
    - derived_field_reconciliation             # Lease.cumulative_profit_share_cents, TransferRequest.derived fields recomputed from children
    - cascading_side_effects                   # consent grant -> sublease activation -> settlement accrual -> lease ledger debit (3+ hops)
  entity_topology: flat                        # peer entities joined by FK references; no nested URL hierarchy
  state_machine_shape: branching               # TransferRequest forks on SUBLEASE vs ASSIGNMENT and on GRANTED / DENIED / DEEMED_APPROVED; ConsentReview cycles on rescission
  relationship_patterns:
    - one_to_many        # Lease -> TransferRequest -> ConsentCondition / Settlement
    - cross_aggregate    # RecognitionAgreement references both TransferRequest and SubleaseAgreement; Settlement references Lease and SubleaseAgreement
    - self_referential   # DemisedArea.superseded_by_id chains re-measurement revisions
  role_model: segregation_of_duties            # Broker who marketed may not attest credit review; Tenant who submitted may not decide consent
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the party"
      - name: party_kind
        type: enum
        source: input
        description: "Which side of the transfer this party can act on"
        constraints: "LANDLORD | TENANT | SUBTENANT | ASSIGNEE"
      - name: credit_rating_bps
        type: integer
        source: input
        description: "Internal credit score in basis points (0-10000); used by subtenant credit review"
        constraints: "0 <= value <= 10000"

  - name: Building
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Building display name"
      - name: total_rentable_sf
        type: integer
        source: input
        description: "Whole-building rentable square footage used as denominator for pro-rata share"
        constraints: "> 0"
      - name: loss_factor_bps
        type: integer
        source: input
        description: "Building loss factor in basis points; RSF = USF * (1 + loss_factor_bps/10000)"
        constraints: "0 <= value <= 5000"

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; the building containing the premises"
      - name: tenant_party_id
        type: string
        source: input
        description: "FK -> Party.id; party_kind must be TENANT"
      - name: landlord_party_id
        type: string
        source: input
        description: "FK -> Party.id; party_kind must be LANDLORD"
      - name: base_rent_per_rsf_annual_cents
        type: integer
        source: input
        description: "Annual base rent per rentable SF in cents (the pass-through rent floor for differential calc)"
        constraints: "> 0"
      - name: leased_rsf
        type: integer
        source: input
        description: "Rentable SF under this lease at execution; denominator anchor for partial-floor demising"
        constraints: "> 0"
      - name: consent_window_business_days
        type: integer
        source: input
        description: "Landlord response window in business days before deemed-approval becomes reachable"
        constraints: ">= 1 and <= 60"
      - name: deemed_approval_enabled
        type: boolean
        source: input
        description: "Whether lease contains a deemed-approval provision; if false, landlord silence is not consent"
      - name: profit_share_tier1_pct_bps
        type: integer
        source: input
        description: "Landlord share of net sublease profit up to the tier-1 threshold, basis points"
        constraints: "0 <= value <= 10000"
      - name: profit_share_tier1_threshold_annual_cents
        type: integer
        source: input
        description: "Annual net-profit threshold above which tier-2 split applies"
        constraints: ">= 0"
      - name: profit_share_tier2_pct_bps
        type: integer
        source: input
        description: "Landlord share of net sublease profit above the tier-1 threshold, basis points; must be >= tier1"
        constraints: "profit_share_tier2_pct_bps >= profit_share_tier1_pct_bps"
      - name: status
        type: enum
        source: system
        description: "Lease lifecycle; this administration surface manages transfers on ACTIVE leases only (lease expiry/termination is out of scope of the transfer-consent domain)"
        default: ACTIVE
        constraints: "ACTIVE"
      - name: cumulative_profit_share_cents
        type: integer
        source: computed
        description: "Running total of landlord profit share across all FINALIZED settlements of this lease; recomputed on settlement finalize and on settlement void"
        default: 0
      - name: open_transfer_count
        type: integer
        source: computed
        description: "Count of TransferRequests of this lease in a non-terminal status; drives the one-open-transfer gate"
        default: 0

  - name: DemisedArea
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease whose premises are measured"
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; the transfer this measurement supports"
      - name: measurement_standard
        type: enum
        source: input
        description: "Measurement method; changes RSF for identical USF"
        constraints: "METHOD_A | METHOD_B"
      - name: usable_sf
        type: integer
        source: input
        description: "Measured usable square footage of the demised portion"
        constraints: "> 0"
      - name: rentable_sf
        type: integer
        source: computed
        description: "RSF derived per measurement_standard: METHOD_A uses building loss factor, METHOD_B uses half the loss factor plus a fixed 250bps floor-common add-on"
      - name: prorata_share_bps
        type: integer
        source: computed
        description: "rentable_sf / building.total_rentable_sf in basis points, rounded half-up to integer bps"
      - name: is_partial_floor
        type: boolean
        source: computed
        description: "true iff rentable_sf < lease.leased_rsf; partial-floor demise triggers the partial-floor expense gross-up in settlement calc"
      - name: supersedes_id
        type: string
        source: input
        description: "FK -> DemisedArea.id; earlier measurement this one revises; null for the first measurement of a transfer"
      - name: superseded_by_id
        type: string
        source: system
        description: "FK -> DemisedArea.id; set when a revision replaces this record; a superseded record is read-only for settlement math"
      - name: status
        type: enum
        source: system
        description: "Measurement lifecycle"
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease being transferred"
      - name: counterparty_id
        type: string
        source: input
        description: "FK -> Party.id; the proposed subtenant (party_kind SUBTENANT) or assignee (party_kind ASSIGNEE)"
      - name: broker_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the TenantRepBroker who submitted the request; the same broker is barred from attesting the credit review (segregation of duties)"
      - name: transfer_type
        type: enum
        source: input
        description: "SUBLEASE retains tenant privity and liability; ASSIGNMENT novates and (subject to consent terms) releases the assignor"
        constraints: "SUBLEASE | ASSIGNMENT"
      - name: proposed_rent_per_rsf_annual_cents
        type: integer
        source: input
        description: "Proposed subrent / assignee rent per RSF per year in cents; feeds the rent differential"
        constraints: "> 0"
      - name: term_start
        type: datetime
        source: input
        description: "Proposed commencement, ISO8601 UTC; must be strictly after request submission date and before lease expiry"
      - name: term_end
        type: datetime
        source: input
        description: "Proposed expiration, ISO8601 UTC; must be strictly after term_start and not after lease expiry"
      - name: marketing_period_days
        type: integer
        source: input
        description: "Days the space was marketed before submission; leases require >= minimum marketing period before consent request is complete"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CONSENT_PENDING | CONSENT_GRANTED | CONSENT_DENIED | DEEMED_APPROVED | DOCUMENTED | EFFECTIVE | WITHDRAWN | RESCINDED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when status entered SUBMITTED"
      - name: consent_deadline
        type: datetime
        source: computed
        description: "submitted_at + lease.consent_window_business_days business days (Mon-Fri), evaluated at 17:00 UTC on the last day"
      - name: reminder_sent_at
        type: datetime
        source: system
        description: "Timestamp of the tenant's deemed-approval reminder notice; deemed approval requires this to be set and 2 further business days to elapse"
      - name: consent_granted_at
        type: datetime
        source: system
        description: "Timestamp when landlord consent (express or deemed) became final"
      - name: liability_released
        type: boolean
        source: computed
        description: "true only when transfer_type==ASSIGNMENT AND the granted ConsentReview carries release_of_assignor=true; SUBLEASE never releases tenant liability"
      - name: annual_rent_differential_cents
        type: integer
        source: computed
        description: "max(0, proposed_rent - lease.base_rent) * certified RSF, per rent_differential calculation; negative differential clamps to zero (no negative profit)"
      - name: effective_at
        type: datetime
        source: system
        description: "Timestamp the transfer became EFFECTIVE (recognition agreement fully executed)"

  - name: ConsentReview
    parent: null
    common_fields: true
    fields:
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; exactly one open review per transfer"
      - name: reviewer_landlord_id
        type: string
        source: system
        description: "FK -> Party.id; landlord party who submitted the decision (from X-User-ID)"
      - name: decision
        type: enum
        source: system
        description: "Landlord decision on the transfer"
        default: PENDING
        constraints: "PENDING | GRANTED | GRANTED_WITH_CONDITIONS | DENIED | RESCINDED"
      - name: denial_reason_code
        type: enum
        source: input
        description: "Required when decision==DENIED; leases permit denial only on enumerated commercially-reasonable grounds"
        constraints: "INSUFFICIENT_CREDIT | USE_CONFLICT | INSUFFICIENT_MARKETING | EXISTING_TENANT_SOLICITATION"
      - name: release_of_assignor
        type: boolean
        source: input
        description: "Landlord elects to release assignor from post-assignment liability; only meaningful for ASSIGNMENT transfers; defaults false"
        default: false
      - name: conditions_imposed_count
        type: integer
        source: computed
        description: "Count of ConsentCondition rows attached to this review; decision==GRANTED_WITH_CONDITIONS requires >= 1"
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: "Timestamp of decision; null while PENDING"
      - name: rescinded_at
        type: datetime
        source: system
        description: "Timestamp of rescission; landlord may rescind GRANTED_WITH_CONDITIONS if tenant rejects a condition"

  - name: ConsentCondition
    parent: null
    common_fields: true
    fields:
      - name: consent_review_id
        type: string
        source: input
        description: "FK -> ConsentReview.id; review this condition is attached to"
      - name: condition_kind
        type: enum
        source: input
        description: "Category of consent condition"
        constraints: "RESTORATION_REQUIRED | ADDITIONAL_SECURITY | RENT_RESET_TO_MARKET | RECAPTURE_RIGHT"
      - name: detail
        type: string
        source: input
        description: "Free-text condition terms"
      - name: status
        type: enum
        source: system
        description: "Tenant disposition of the condition"
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: responded_at
        type: datetime
        source: system
        description: "Timestamp the tenant accepted or rejected"

  - name: CreditReview
    parent: null
    common_fields: true
    fields:
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; credit review of the counterparty"
      - name: attesting_broker_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the attesting broker; MUST differ from TransferRequest.broker_user_id (segregation of duties)"
      - name: reviewed_credit_rating_bps
        type: integer
        source: input
        description: "Credit rating the broker verified for the counterparty, basis points 0-10000"
      - name: outcome
        type: enum
        source: system
        description: "Credit determination"
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: minimum_pass_bps
        type: integer
        source: system
        description: "Pass threshold fixed at 6000 bps; outcome PASS requires reviewed_credit_rating_bps >= minimum_pass_bps"
      - name: attested_at
        type: datetime
        source: system
        description: "Timestamp of attestation"

  - name: SubleaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; one executed instrument per granted transfer"
      - name: demised_area_id
        type: string
        source: input
        description: "FK -> DemisedArea.id; the certified measurement locked into the instrument at execution (version-pinning)"
      - name: executed_rent_per_rsf_annual_cents
        type: integer
        source: input
        description: "Final executed rent; must equal TransferRequest.proposed_rent_per_rsf_annual_cents unless transfer was granted with RENT_RESET_TO_MARKET condition accepted"
      - name: status
        type: enum
        source: system
        description: "Instrument lifecycle"
        default: EXECUTED
        constraints: "EXECUTED | RECOGNIZED | TERMINATED"
      - name: executed_at
        type: datetime
        source: system
        description: "Timestamp of execution"

  - name: RecognitionAgreement
    parent: null
    common_fields: true
    fields:
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id"
      - name: sublease_agreement_id
        type: string
        source: input
        description: "FK -> SubleaseAgreement.id; null until the instrument exists (recognition can be drafted against an assignment with no sublease)"
      - name: landlord_signed_at
        type: datetime
        source: system
        description: "Timestamp landlord countersigned; null until signed"
      - name: counterparty_signed_at
        type: datetime
        source: system
        description: "Timestamp subtenant/assignee countersigned; null until signed"
      - name: status
        type: enum
        source: system
        description: "Recognition lifecycle; FULLY_EXECUTED only when both signatures present"
        default: DRAFTED
        constraints: "DRAFTED | PARTIALLY_SIGNED | FULLY_EXECUTED | VOIDED"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id"
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; the EFFECTIVE transfer whose differential is being settled"
      - name: period_start
        type: datetime
        source: input
        description: "Accrual period start, inclusive"
      - name: period_end
        type: datetime
        source: input
        description: "Accrual period end, exclusive (half-open); must be strictly after period_start"
      - name: subrent_collected_cents
        type: integer
        source: input
        description: "Subrent actually collected in the period; settlement math uses collected, not billed, rent"
        constraints: ">= 0"
      - name: passthrough_rent_cents
        type: integer
        source: computed
        description: "Lease base rent attributable to the demised area for the period, per settlement calc (pro-rated by day count and partial-floor factor)"
      - name: net_profit_cents
        type: integer
        source: computed
        description: "max(0, subrent_collected_cents - passthrough_rent_cents)"
      - name: landlord_share_cents
        type: integer
        source: computed
        description: "Tiered split of net_profit_cents per lease tier constants, rounded half-up per tier then summed"
      - name: tenant_share_cents
        type: integer
        source: computed
        description: "net_profit_cents - landlord_share_cents"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle"
        default: DRAFT
        constraints: "DRAFT | FINALIZED | VOID"
      - name: finalized_at
        type: datetime
        source: system
        description: "Timestamp of finalization; ledger sync to Lease.cumulative_profit_share_cents happens here"

  - name: RestorationObligation
    parent: null
    common_fields: true
    fields:
      - name: transfer_request_id
        type: string
        source: input
        description: "FK -> TransferRequest.id; restoration duty created when a RESTORATION_REQUIRED consent condition is accepted"
      - name: responsible_party
        type: enum
        source: input
        description: "Who bears restoration cost; allocation is negotiable at condition acceptance"
        constraints: "TENANT | SUBTENANT_OR_ASSIGNEE | SHARED"
      - name: escrow_amount_cents
        type: integer
        source: input
        description: "Escrow posted against restoration; required > 0 when responsible_party != TENANT"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Restoration lifecycle"
        default: OPEN
        constraints: "OPEN | ESCROW_POSTED | COMPLETED | WAIVED"
      - name: completed_at
        type: datetime
        source: system
        description: "Timestamp landlord certified restoration complete"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TransferRequest
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN, RESCINDED, CONSENT_DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sublease-admin/transfer-requests/{id}/submit"
        actor: TenantRepBroker
        preconditions:
          - "Lease.status == ACTIVE for TransferRequest.lease_id"
          - "transfer.marketing_period_days >= 30 (lease minimum marketing period)"
          - "certified DemisedArea exists for this transfer (DemisedArea.status == CERTIFIED, superseded_by_id IS NULL)"
          - "term_start strictly after logical-clock now and term_end strictly after term_start"
        side_effects:
          - "sets submitted_at to logical-clock now"
          - "computes consent_deadline = submitted_at + lease.consent_window_business_days business days (Mon-Fri skip Sat/Sun), at 17:00:00.000Z of the final day"
          - "creates ConsentReview(decision=PENDING) for this transfer"
          - "creates CreditReview(outcome=PENDING) for this transfer"
          - "increments Lease.open_transfer_count by 1 and Lease.version by 1"
      - from: SUBMITTED
        to: CONSENT_PENDING
        trigger: "system auto-transition when CreditReview.outcome flips PENDING -> PASS or FAIL"
        actor: system
        preconditions:
          - "CreditReview for this transfer has outcome != PENDING"
        side_effects:
          - "if CreditReview.outcome == FAIL, the landlord's subsequent DENIED decision may cite INSUFFICIENT_CREDIT; a FAIL does not itself deny the transfer"
      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "POST /sublease-admin/_clock/set_current_utc advancing the logical clock at or past (consent_deadline + 2 business days) while reminder_sent_at is set and reminder_sent_at >= consent_deadline"
        actor: system
        preconditions:
          - "Lease.deemed_approval_enabled == true"
          - "ConsentReview.decision still PENDING at clock-advance evaluation"
          - "reminder_sent_at is not null AND reminder_sent_at >= consent_deadline"
          - "logical-clock now >= consent_deadline + 2 business days (17:00:00.000Z)"
        side_effects:
          - "sets consent_granted_at to logical-clock now"
          - "ConsentReview.decision := GRANTED (deemed), decided_at := now"
      - from: CONSENT_PENDING
        to: DEEMED_APPROVED
        trigger: "POST /sublease-admin/_clock/set_current_utc advancing the logical clock at or past (consent_deadline + 2 business days) while reminder_sent_at is set and reminder_sent_at >= consent_deadline"
        actor: system
        preconditions:
          - "Lease.deemed_approval_enabled == true"
          - "ConsentReview.decision still PENDING at clock-advance evaluation"
          - "reminder_sent_at is not null AND reminder_sent_at >= consent_deadline"
          - "logical-clock now >= consent_deadline + 2 business days (17:00:00.000Z)"
        side_effects:
          - "sets consent_granted_at to logical-clock now"
          - "ConsentReview.decision := GRANTED (deemed), decided_at := now"
      - from: SUBMITTED
        to: CONSENT_GRANTED
        trigger: "POST /sublease-admin/consent-reviews/{id}/decide with decision GRANTED or GRANTED_WITH_CONDITIONS where all conditions are later accepted"
        actor: Landlord
        preconditions:
          - "ConsentReview.decision == PENDING"
          - "logical-clock now <= consent_deadline (express consent at or before the deadline pre-empts the deemed-approval timer; strictly after the deadline the decision is rejected ERR_CONSENT_WINDOW_LAPSED)"
          - "if decision == GRANTED_WITH_CONDITIONS: every attached ConsentCondition must reach ACCEPTED before the transfer enters CONSENT_GRANTED (see conditional-acceptance join below)"
        side_effects:
          - "sets consent_granted_at"
          - "computes annual_rent_differential_cents via rent_differential calculation using the certified non-superseded DemisedArea"
          - "computes liability_released = (transfer_type == ASSIGNMENT AND ConsentReview.release_of_assignor == true)"
      - from: CONSENT_PENDING
        to: CONSENT_GRANTED
        trigger: "same decide endpoint as above"
        actor: Landlord
        preconditions:
          - "ConsentReview.decision == PENDING"
          - "logical-clock now <= consent_deadline"
        side_effects:
          - "sets consent_granted_at"
          - "computes annual_rent_differential_cents via rent_differential calculation"
          - "computes liability_released per assignment rule"
      - from: SUBMITTED
        to: CONSENT_DENIED
        trigger: "POST /sublease-admin/consent-reviews/{id}/decide with decision DENIED"
        actor: Landlord
        preconditions:
          - "ConsentReview.decision == PENDING"
          - "denial_reason_code is present and commercially reasonable: INSUFFICIENT_CREDIT requires CreditReview.outcome == FAIL; INSUFFICIENT_MARKETING requires transfer.marketing_period_days < 30 (unreachable at submit-time gate, reserved); USE_CONFLICT and EXISTING_TENANT_SOLICITATION always available"
        side_effects:
          - "decrements Lease.open_transfer_count by 1 and increments Lease.version by 1"
      - from: CONSENT_PENDING
        to: CONSENT_DENIED
        trigger: "same decide endpoint, decision DENIED"
        actor: Landlord
        preconditions:
          - "ConsentReview.decision == PENDING"
          - "denial_reason_code present; INSUFFICIENT_CREDIT requires CreditReview.outcome == FAIL"
        side_effects:
          - "decrements Lease.open_transfer_count by 1 and increments Lease.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /sublease-admin/transfer-requests/{id}/withdraw"
        actor: TenantRepBroker
        preconditions:
          - "withdrawing broker's X-User-ID == TransferRequest.broker_user_id"
        side_effects:
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
          - "voids any DRAFTED/PARTIALLY_SIGNED RecognitionAgreement for this transfer (status := VOIDED)"
      - from: CONSENT_PENDING
        to: WITHDRAWN
        trigger: "POST /sublease-admin/transfer-requests/{id}/withdraw"
        actor: TenantRepBroker
        preconditions:
          - "withdrawing broker's X-User-ID == TransferRequest.broker_user_id"
        side_effects:
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
          - "voids open RecognitionAgreement"
      - from: CONSENT_GRANTED
        to: WITHDRAWN
        trigger: "POST /sublease-admin/transfer-requests/{id}/withdraw"
        actor: TenantRepBroker
        preconditions:
          - "withdrawing broker's X-User-ID == TransferRequest.broker_user_id"
        side_effects:
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
      - from: DOCUMENTED
        to: WITHDRAWN
        trigger: "POST /sublease-admin/transfer-requests/{id}/withdraw"
        actor: TenantRepBroker
        preconditions:
          - "withdrawing broker's X-User-ID == TransferRequest.broker_user_id"
          - "RecognitionAgreement.status != FULLY_EXECUTED (an executed recognition locks the transfer; withdraw after effectiveness is impossible)"
        side_effects:
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
          - "COMPENSATION cascade: voids the DRAFTED/PARTIALLY_SIGNED RecognitionAgreement (status := VOIDED); for SUBLEASE terminates the EXECUTED SubleaseAgreement (status := TERMINATED); RestorationObligations of the transfer flip OPEN|ESCROW_POSTED -> WAIVED"
      - from: CONSENT_GRANTED
        to: DOCUMENTED
        trigger: "POST /sublease-admin/transfer-requests/{id}/document (creates SubleaseAgreement for SUBLEASE, or records assignment instrument reference for ASSIGNMENT, and drafts RecognitionAgreement)"
        actor: TenantRepBroker
        preconditions:
          - "certified non-superseded DemisedArea still exists (a measurement revised after consent blocks documentation until re-certified)"
        side_effects:
          - "for SUBLEASE: creates SubleaseAgreement(status=EXECUTED) pinned to the certified DemisedArea.id (version-pinning on approval)"
          - "creates RecognitionAgreement(status=DRAFTED) for this transfer"
          - "for each ACCEPTED ConsentCondition with condition_kind == RESTORATION_REQUIRED: creates RestorationObligation(status=OPEN) carrying the negotiated responsible_party and escrow_amount_cents from the document payload"
      - from: DOCUMENTED
        to: EFFECTIVE
        trigger: "system auto-transition when RecognitionAgreement.status flips to FULLY_EXECUTED"
        actor: system
        preconditions:
          - "RecognitionAgreement.landlord_signed_at IS NOT NULL AND counterparty_signed_at IS NOT NULL"
        side_effects:
          - "sets effective_at to logical-clock now"
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
          - "for SUBLEASE: SubleaseAgreement.status := RECOGNIZED"
          - "CASCADE (hop 2): Settlement finalization becomes reachable for this transfer (creation of DRAFT settlements is permitted from CONSENT_GRANTED onward; finalization requires EFFECTIVE per Settlement machine)"
      - from: CONSENT_GRANTED
        to: RESCINDED
        trigger: "POST /sublease-admin/consent-reviews/{id}/rescind (landlord rescinds GRANTED_WITH_CONDITIONS after tenant rejected a condition)"
        actor: Landlord
        preconditions:
          - "ConsentReview.decision == GRANTED_WITH_CONDITIONS"
          - "at least one attached ConsentCondition has status == REJECTED"
        side_effects:
          - "ConsentReview.decision := RESCINDED, rescinded_at := now"
          - "decrements Lease.open_transfer_count by 1, increments Lease.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /sublease-admin/transfer-requests/{id}/withdraw"
        actor: TenantRepBroker
        preconditions:
          - "withdrawing broker's X-User-ID == TransferRequest.broker_user_id"
        side_effects:
          - "no Lease.open_transfer_count change (never incremented for DRAFT)"

  - entity: ConsentReview
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, RESCINDED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /sublease-admin/consent-reviews/{id}/decide {decision: GRANTED}"
        actor: Landlord
        preconditions:
          - "TransferRequest.status in {SUBMITTED, CONSENT_PENDING}"
          - "reviewer_landlord_id (from X-User-ID) == Lease.landlord_party_id of the parent transfer's lease"
          - "decision submitted at or before TransferRequest.consent_deadline"
        side_effects:
          - "decided_at := now"
          - "drives TransferRequest SUBMITTED|CONSENT_PENDING -> CONSENT_GRANTED (cross-entity)"
      - from: PENDING
        to: GRANTED_WITH_CONDITIONS
        trigger: "POST /sublease-admin/consent-reviews/{id}/decide {decision: GRANTED_WITH_CONDITIONS, conditions: [...]}"
        actor: Landlord
        preconditions:
          - "TransferRequest.status in {SUBMITTED, CONSENT_PENDING}"
          - "at least one condition supplied (conditions_imposed_count >= 1)"
          - "decision at or before consent_deadline"
        side_effects:
          - "creates one ConsentCondition(status=PENDING) per supplied condition"
          - "conditions_imposed_count := len(conditions)"
          - "TransferRequest remains CONSENT_PENDING until the conditional-acceptance join: every condition ACCEPTED -> TransferRequest -> CONSENT_GRANTED; any condition REJECTED arms landlord rescission"
      - from: PENDING
        to: DENIED
        trigger: "POST /sublease-admin/consent-reviews/{id}/decide {decision: DENIED, denial_reason_code}"
        actor: Landlord
        preconditions:
          - "TransferRequest.status in {SUBMITTED, CONSENT_PENDING}"
          - "denial_reason_code present; INSUFFICIENT_CREDIT only if CreditReview.outcome == FAIL"
        side_effects:
          - "decided_at := now"
          - "drives TransferRequest -> CONSENT_DENIED"
      - from: GRANTED_WITH_CONDITIONS
        to: RESCINDED
        trigger: "POST /sublease-admin/consent-reviews/{id}/rescind"
        actor: Landlord
        preconditions:
          - "exists ConsentCondition of this review with status == REJECTED"
          - "TransferRequest.status == CONSENT_PENDING (consent not yet joined)"
        side_effects:
          - "rescinded_at := now"
          - "drives TransferRequest -> RESCINDED (cross-entity)"
      - from: PENDING
        to: GRANTED
        trigger: "system deemed-approval (clock advance) — see TransferRequest DEEMED_APPROVED transitions"
        actor: system
        preconditions:
          - "Lease.deemed_approval_enabled and deadline+2bd elapsed and reminder_sent_at >= consent_deadline"
        side_effects:
          - "decision := GRANTED, decided_at := now, note: deemed approval never carries conditions and never releases assignor (release_of_assignor := false)"

  - entity: ConsentCondition
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /sublease-admin/consent-conditions/{id}/respond {response: ACCEPTED}"
        actor: Tenant
        preconditions:
          - "responding tenant X-User-ID == Lease.tenant_party_id of the parent lease"
          - "parent ConsentReview.decision == GRANTED_WITH_CONDITIONS"
        side_effects:
          - "responded_at := now"
          - "CONDITIONAL-ACCEPTANCE JOIN (cyclic fork-join): when ALL conditions of the review reach ACCEPTED, TransferRequest CONSENT_PENDING -> CONSENT_GRANTED fires with its documented side effects (consent_granted_at, differential computation, liability_released)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /sublease-admin/consent-conditions/{id}/respond {response: REJECTED}"
        actor: Tenant
        preconditions:
          - "responding tenant X-User-ID == Lease.tenant_party_id"
          - "parent ConsentReview.decision == GRANTED_WITH_CONDITIONS"
        side_effects:
          - "responded_at := now"
          - "arms landlord rescission (ConsentReview GRANTED_WITH_CONDITIONS -> RESCINDED becomes callable)"

  - entity: CreditReview
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /sublease-admin/credit-reviews/{id}/attest {reviewed_credit_rating_bps}"
        actor: TenantRepBroker
        preconditions:
          - "attesting broker X-User-ID != TransferRequest.broker_user_id (segregation of duties)"
          - "reviewed_credit_rating_bps >= minimum_pass_bps (6000) — else the transition target must be FAIL"
        side_effects:
          - "attested_at := now, attesting_broker_user_id := X-User-ID"
          - "drives TransferRequest SUBMITTED -> CONSENT_PENDING"
      - from: PENDING
        to: FAIL
        trigger: "POST /sublease-admin/credit-reviews/{id}/attest {reviewed_credit_rating_bps} below 6000"
        actor: TenantRepBroker
        preconditions:
          - "attesting broker X-User-ID != TransferRequest.broker_user_id"
          - "reviewed_credit_rating_bps < 6000"
        side_effects:
          - "attested_at := now"
          - "drives TransferRequest SUBMITTED -> CONSENT_PENDING (a FAIL does not itself deny; it arms INSUFFICIENT_CREDIT denial)"

  - entity: DemisedArea
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /sublease-admin/demised-areas/{id}/certify"
        actor: TenantRepBroker
        preconditions:
          - "parent TransferRequest.status in {DRAFT, SUBMITTED, CONSENT_PENDING}"
          - "recompute rentable_sf and prorata_share_bps per measurement_standard at certification time (values freeze on certify)"
        side_effects:
          - "if this record has supersedes_id set, the referenced prior record flips CERTIFIED -> SUPERSEDED and its superseded_by_id := this id (self-referential chain)"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system cascade when a revision DemisedArea (supersedes_id = this) is certified"
        actor: system
        preconditions:
          - "a DemisedArea with supersedes_id == this.id transitions DRAFT -> CERTIFIED"
        side_effects:
          - "superseded_by_id := new record id"
          - "if parent TransferRequest.status == CONSENT_GRANTED: documentation is blocked until a non-superseded CERTIFIED measurement exists again (derived gate re-evaluated on read)"
      - from: SUPERSEDED
        to: SUPERSEDED
        trigger: "POST /sublease-admin/demised-areas/{id}/certify on a SUPERSEDED record"
        actor: TenantRepBroker
        preconditions: []
        side_effects: []
        note: "not a real transition — certify on a SUPERSEDED record is rejected ERR_MEASUREMENT_SUPERSEDED (409); revision creation whose supersedes_id references a non-tip record (DRAFT or already SUPERSEDED) is likewise rejected ERR_MEASUREMENT_SUPERSEDED"

  - entity: SubleaseAgreement
    initial_state: EXECUTED
    terminal_states: [RECOGNIZED, TERMINATED]
    transitions:
      - from: EXECUTED
        to: RECOGNIZED
        trigger: "system cascade when RecognitionAgreement for the parent transfer reaches FULLY_EXECUTED"
        actor: system
        preconditions:
          - "RecognitionAgreement.status == FULLY_EXECUTED for the same transfer_request_id"
        side_effects:
          - "TransferRequest DOCUMENTED -> EFFECTIVE (hop 2 of recognition cascade)"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /sublease-admin/sublease-agreements/{id}/terminate"
        actor: Tenant
        preconditions:
          - "SubleaseAgreement.status == EXECUTED"
          - "calling tenant X-User-ID == Lease.tenant_party_id"
        side_effects:
          - "no Settlement may be created or finalized against the parent transfer after termination (existence gate on Settlement creation)"
      - from: RECOGNIZED
        to: TERMINATED
        trigger: "POST /sublease-admin/sublease-agreements/{id}/terminate"
        actor: Tenant
        preconditions:
          - "calling tenant X-User-ID == Lease.tenant_party_id"
        side_effects:
          - "blocks further Settlement creation/finalization for the parent transfer"

  - entity: RecognitionAgreement
    initial_state: DRAFTED
    terminal_states: [FULLY_EXECUTED, VOIDED]
    transitions:
      - from: DRAFTED
        to: PARTIALLY_SIGNED
        trigger: "POST /sublease-admin/recognition-agreements/{id}/sign {signatory: LANDLORD} or {signatory: COUNTERPARTY} (first signature)"
        actor: Landlord
        preconditions:
          - "first signature may come from either side; signatory LANDLORD requires X-User-ID == Lease.landlord_party_id; signatory COUNTERPARTY requires X-User-ID == TransferRequest.counterparty_id"
        side_effects:
          - "sets landlord_signed_at or counterparty_signed_at per signatory"
      - from: PARTIALLY_SIGNED
        to: FULLY_EXECUTED
        trigger: "POST /sublease-admin/recognition-agreements/{id}/sign (second, opposite signature)"
        actor: Landlord
        preconditions:
          - "the signing side has not already signed (same-side second signature rejected)"
        side_effects:
          - "sets the remaining signature timestamp"
          - "CASCADE hop 1: TransferRequest DOCUMENTED -> EFFECTIVE"
          - "CASCADE hop 2: SubleaseAgreement EXECUTED -> RECOGNIZED (SUBLEASE only)"
      - from: DRAFTED
        to: VOIDED
        trigger: "system cascade when parent TransferRequest is WITHDRAWN or RESCINDED"
        actor: system
        preconditions:
          - "parent TransferRequest entered WITHDRAWN or RESCINDED"
        side_effects: []
      - from: PARTIALLY_SIGNED
        to: VOIDED
        trigger: "system cascade when parent TransferRequest is WITHDRAWN or RESCINDED"
        actor: system
        preconditions:
          - "parent TransferRequest entered WITHDRAWN or RESCINDED"
        side_effects: []

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /sublease-admin/settlements/{id}/finalize"
        actor: TenantRepBroker
        preconditions:
          - "TransferRequest.status == EFFECTIVE"
          - "SubleaseAgreement (if any) not TERMINATED"
          - "period does not overlap any other FINALIZED Settlement for the same transfer (half-open interval [period_start, period_end))"
        side_effects:
          - "finalized_at := now"
          - "LEDGER SYNC: Lease.cumulative_profit_share_cents += landlord_share_cents; Lease.version += 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /sublease-admin/settlements/{id}/void"
        actor: TenantRepBroker
        preconditions:
          - "Settlement.status == DRAFT"
        side_effects: []

  - entity: RestorationObligation
    initial_state: OPEN
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: OPEN
        to: ESCROW_POSTED
        trigger: "system auto-transition when escrow_amount_cents > 0 is recorded at document time"
        actor: system
        preconditions:
          - "escrow_amount_cents > 0"
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST /sublease-admin/restoration-obligations/{id}/complete"
        actor: Landlord
        preconditions:
          - "responsible_party == TENANT OR escrow already satisfied (escrow_amount_cents == 0)"
        side_effects:
          - "completed_at := now"
      - from: ESCROW_POSTED
        to: COMPLETED
        trigger: "POST /sublease-admin/restoration-obligations/{id}/complete"
        actor: Landlord
        preconditions: []
        side_effects:
          - "completed_at := now; escrow is released out of band"
      - from: OPEN
        to: WAIVED
        trigger: "POST /sublease-admin/restoration-obligations/{id}/waive, or system compensation cascade on withdraw-from-DOCUMENTED of the parent transfer"
        actor: Landlord
        preconditions:
          - "for the endpoint: calling landlord X-User-ID == Lease.landlord_party_id; for the cascade: parent TransferRequest entered WITHDRAWN from DOCUMENTED"
        side_effects: []
      - from: ESCROW_POSTED
        to: WAIVED
        trigger: "POST /sublease-admin/restoration-obligations/{id}/waive, or system compensation cascade on withdraw-from-DOCUMENTED"
        actor: Landlord
        preconditions:
          - "same as OPEN -> WAIVED"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /sublease-admin/leases/{lease_id}/transfer-requests"
    occ_field: "expected_lease_version"
    description: |
      Creating a TransferRequest against a Lease whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just submitted or withdrawn a transfer (each
      of which legitimately changes Lease.open_transfer_count and therefore
      Lease.version) and the current writer's view of the lease is stale.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
  - rule_id: consent-decide-stale-review
    parent_entity: ConsentReview
    write_endpoint: "POST /sublease-admin/consent-reviews/{id}/decide"
    occ_field: "expected_consent_review_version"
    description: |
      Submitting a consent decision against a ConsentReview whose version has
      advanced since the landlord last observed it is rejected; the landlord's
      decision is based on a stale review record (e.g., conditions were amended
      or the review was touched by a prior decision attempt's side effects).
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: space_measurement
    trigger: "on DemisedArea certification (POST /demised-areas/{id}/certify) and on DemisedArea creation (provisional read)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned: rentable_sf first, then prorata_share_bps, then is_partial_floor.
      if measurement_standard == METHOD_A:
          rentable_sf = usable_sf * (10000 + building.loss_factor_bps) / 10000   # exact division, then round half-up to integer SF
      elif measurement_standard == METHOD_B:
          rentable_sf = usable_sf * (10000 + floor(building.loss_factor_bps / 2) + 250) / 10000  # half loss factor + fixed 250bps common add-on, round half-up
      prorata_share_bps = round_half_up(rentable_sf * 10000 / building.total_rentable_sf)   # integer bps
      is_partial_floor = (rentable_sf < lease.leased_rsf)
    input_set: "The single DemisedArea being certified; Building of the parent lease; Lease of the parent transfer"
    constants:
      METHOD_B_COMMON_ADDON_BPS: 250
      RSF_ROUND: "round_half_up to integer SF"
      PRORATA_ROUND: "round_half_up to integer bps"
    precision: "integer SF and integer bps, round_half_up"
    variants:
      - name: provisional_measurement
        when: "DemisedArea read while status == DRAFT (pre-certification)"
        difference: "rentable_sf/prorata_share_bps recomputed on every read against the CURRENT building loss factor; values not frozen"
      - name: certified_measurement
        when: "DemisedArea.status == CERTIFIED"
        difference: "values frozen at certification time; later building loss-factor changes do NOT alter the certified record"

  - name: rent_differential
    trigger: "on TransferRequest entering CONSENT_GRANTED (express or condition-join) and on Settlement creation for period math"
    algorithm: threshold
    formula: |
      # annual_rent_differential_cents uses the certified non-superseded DemisedArea of the transfer.
      # Clamps at zero: a sublease at or below pass-through rent yields zero differential and zero profit share.
      per_rsf_spread_cents = proposed_rent_per_rsf_annual_cents - lease.base_rent_per_rsf_annual_cents
      if per_rsf_spread_cents <= 0:
          annual_rent_differential_cents = 0
      else:
          annual_rent_differential_cents = per_rsf_spread_cents * certified_demised_area.rentable_sf
    input_set: "TransferRequest being granted; its certified non-superseded DemisedArea; parent Lease"
    constants:
      ZERO_FLOOR: 0
    precision: "integer cents (spread per RSF is integer cents times integer SF; no rounding needed)"
    variants:
      - name: granted_basis
        when: "consent granted before documentation"
        difference: "uses proposed_rent_per_rsf_annual_cents and the certified measurement at grant time"
      - name: documented_basis
        when: "after SubleaseAgreement execution with an accepted RENT_RESET_TO_MARKET condition"
        difference: "recomputed using SubleaseAgreement.executed_rent_per_rsf_annual_cents (which may differ from proposed) while the RSF stays pinned to the same certified DemisedArea"

  - name: settlement_profit_share
    trigger: "on POST /settlements (computes all derived fields at creation) and recomputed on finalize re-check"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (circular-looking dependency resolved):
      #   1) day_count       2) passthrough (with partial-floor gross-up)
      #   3) net_profit      4) tier split with PER-TIER rounding then sum.
      day_count = (period_end - period_start) in whole days (period_end exclusive)
      base_passthrough = lease.base_rent_per_rsf_annual_cents * demised.rentable_sf * day_count / 365
      base_passthrough = round_half_up(base_passthrough)                      # round step 1
      if demised.is_partial_floor:
          passthrough_rent_cents = round_half_up(base_passthrough * (10000 + PARTIAL_FLOOR_GROSSUP_BPS) / 10000)   # round step 2 — nested rounding, order matters
      else:
          passthrough_rent_cents = base_passthrough
      net_profit_cents = max(0, subrent_collected_cents - passthrough_rent_cents)
      # tier split: per-tier rounding then sum (PINNED — "round each tier then sum", NOT "sum then round")
      annualized_profit_cents = round_half_up(net_profit_cents * 365 / day_count)
      tier1_base_cents = min(annualized_profit_cents, lease.profit_share_tier1_threshold_annual_cents)
      tier2_base_cents = max(0, annualized_profit_cents - lease.profit_share_tier1_threshold_annual_cents)
      tier1_landlord = round_half_up(tier1_base_cents * lease.profit_share_tier1_pct_bps / 10000)
      tier2_landlord = round_half_up(tier2_base_cents * lease.profit_share_tier2_pct_bps / 10000)
      landlord_share_annualized = tier1_landlord + tier2_landlord             # sum AFTER per-tier rounding
      landlord_share_cents = round_half_up(landlord_share_annualized * day_count / 365)   # de-annualize, round step 3
      tenant_share_cents = net_profit_cents - landlord_share_cents            # may be negative if landlord share exceeds period net; tenant_share is NOT floored
    input_set: "Settlements of a single EFFECTIVE TransferRequest; period is half-open [period_start, period_end); DemisedArea is the certified non-superseded record pinned by the SubleaseAgreement (or the transfer's certified record for ASSIGNMENT)"
    constants:
      DAYS_PER_YEAR: 365
      PARTIAL_FLOOR_GROSSUP_BPS: 1500
      ANNUALIZE_ROUND: "round_half_up"
      TIER_ROUND: "round_half_up per tier before summing"
    precision: "integer cents, round_half_up at each pinned rounding step"
    variants:
      - name: provisional_settlement
        when: "Settlement.status == DRAFT (at creation)"
        difference: "all computed fields present but Lease.cumulative_profit_share_cents NOT updated; values recomputed on every read"
      - name: final_settlement
        when: "Settlement.status == FINALIZED"
        difference: "computed fields frozen; Lease.cumulative_profit_share_cents debited once; voiding a DRAFT has no ledger effect (voiding is impossible after FINALIZED)"

  - name: consent_deadline_business_days
    trigger: "on TransferRequest submit and on every clock advance evaluating deemed approval"
    algorithm: chronological
    formula: |
      # Business-day arithmetic: Mon-Fri count, Sat/Sun skipped. Deadline lands at 17:00:00.000Z on the Nth business day AFTER submission day.
      # If submitted_at falls on Sat/Sun, day-counting starts the following Monday.
      # deemed_approval_instant = consent_deadline + 2 business days (same 17:00 UTC rule), but ONLY if reminder_sent_at >= consent_deadline.
      deadline_day = first business day strictly after submitted_at's calendar day
      repeat lease.consent_window_business_days times: advance deadline_day by one business day
      consent_deadline = deadline_day at 17:00:00.000Z
      deemed_approval_instant = consent_deadline advanced by 2 business days at 17:00:00.000Z
    input_set: "TransferRequest.submitted_at; Lease.consent_window_business_days; TransferRequest.reminder_sent_at"
    constants:
      BUSINESS_DAY_END: "17:00:00.000Z"
      WEEKEND_DAYS: "Saturday, Sunday (no holiday calendar)"
      DEEMED_REMINDER_EXTRA_BDAYS: 2
    precision: "timestamps exact to milliseconds"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of Landlord, Tenant, Subtenant, Assignee, TenantRepBroker, AssetManager"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right (lease before transfer, transfer before review)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "FK referential integrity on creation: Lease.building_id/tenant_party_id/landlord_party_id exist; Party.party_kind matches role of reference (tenant_party_id -> TENANT, landlord_party_id -> LANDLORD); TransferRequest.counterparty_id exists with party_kind SUBTENANT for SUBLEASE or ASSIGNEE for ASSIGNMENT"
    error_id: ERR_FK_MISMATCH
    http_status: 422
    applies_to: "POST /sublease-admin/leases, POST /sublease-admin/leases/{lease_id}/transfer-requests, POST /sublease-admin/transfer-requests/{id}/demised-areas, POST /sublease-admin/transfer-requests/{id}/document, POST /sublease-admin/settlements"

  - priority: 5
    category: state
    check: "target resource in a valid from-state for the invoked transition (e.g., submit requires DRAFT; decide requires review PENDING; finalize requires settlement DRAFT); Settlement creation requires the referenced TransferRequest.status in {CONSENT_GRANTED, DOCUMENTED, EFFECTIVE} and (if a SubleaseAgreement exists) the instrument not TERMINATED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints, POST /sublease-admin/settlements"

  - priority: 6
    category: business_safety
    check: "segregation of duties: attesting broker X-User-ID != TransferRequest.broker_user_id; withdrawing broker == TransferRequest.broker_user_id; consent decision landlord == Lease.landlord_party_id; condition respondent == Lease.tenant_party_id"
    error_id: ERR_DUTY_SEGREGATION
    http_status: 403
    applies_to: "POST /sublease-admin/credit-reviews/{id}/attest, POST /sublease-admin/transfer-requests/{id}/withdraw, POST /sublease-admin/consent-reviews/{id}/decide, POST /sublease-admin/consent-conditions/{id}/respond"

  - priority: 7
    category: business_temporal
    check: "term window valid: term_start strictly after now; term_end strictly after term_start; settlement period_end strictly after period_start (the consent-decision deadline is governed separately by priority 11)"
    error_id: ERR_TEMPORAL_WINDOW
    http_status: 422
    applies_to: "POST /sublease-admin/transfer-requests/{id}/submit, POST /sublease-admin/settlements"

  - priority: 8
    category: business_constraint
    check: "uniqueness and exclusivity: at most one non-terminal TransferRequest per Lease (Lease.open_transfer_count gate); one ConsentReview and one CreditReview per TransferRequest; settlement periods of FINALIZED settlements for the same transfer must not overlap (half-open adjacency allowed)"
    error_id: ERR_DUPLICATE_ACTIVE
    http_status: 409
    applies_to: "POST /sublease-admin/leases/{lease_id}/transfer-requests, POST /sublease-admin/settlements/{id}/finalize"

  - priority: 9
    category: business_constraint
    check: "marketing completeness: transfer.marketing_period_days >= 30 at submit; certified non-superseded DemisedArea exists at submit and at document; revision integrity: DemisedArea creation with supersedes_id requires the referenced record to be CERTIFIED and not already superseded (chain off the current certified tip); certify of a SUPERSEDED record"
    error_id: ERR_PACKAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /sublease-admin/transfer-requests/{id}/submit, POST /sublease-admin/transfer-requests/{id}/document"
    note: "the revision-integrity and superseded-certify cases report ERR_MEASUREMENT_SUPERSEDED (409) instead of ERR_PACKAGE_INCOMPLETE"

  - priority: 10
    category: business_fiscal
    check: "fiscal coherence: lease tier2 pct >= tier1 pct; settlement subrent_collected_cents >= 0; restoration escrow_amount_cents > 0 when responsible_party != TENANT; proposed rent > 0"
    error_id: ERR_FISCAL_INCOHERENT
    http_status: 422
    applies_to: "POST /sublease-admin/leases, POST /sublease-admin/settlements, POST /sublease-admin/transfer-requests/{id}/document, POST /sublease-admin/leases/{lease_id}/transfer-requests"

  - priority: 11
    category: business_fiscal
    check: "consent decision window: an express landlord decision submitted strictly after TransferRequest.consent_deadline is rejected (the review is locked pending system deemed-approval evaluation); a decision at exactly consent_deadline is accepted (<=)"
    error_id: ERR_CONSENT_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /sublease-admin/consent-reviews/{id}/decide"

  - priority: 12
    category: business_temporal
    check: "reminder eligibility: remind requires TransferRequest.status in {SUBMITTED, CONSENT_PENDING}, ConsentReview.decision == PENDING, reminder_sent_at IS NULL, and logical-clock now strictly after consent_deadline"
    error_id: ERR_REMINDER_PREMATURE
    http_status: 409
    applies_to: "POST /sublease-admin/transfer-requests/{id}/remind"
    note: "the deemed_approval_enabled=false case is reported as ERR_DEEMED_APPROVAL_DISABLED and takes precedence over ERR_REMINDER_PREMATURE on the remind endpoint"

  - priority: 13
    category: business_constraint
    check: "OCC on transfer creation: expected_lease_version matches Lease.version"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /sublease-admin/leases/{lease_id}/transfer-requests"

  - priority: 14
    category: business_constraint
    check: "OCC on consent decision: expected_consent_review_version matches ConsentReview.version"
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412
    applies_to: "POST /sublease-admin/consent-reviews/{id}/decide"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Party ----
  - method: POST
    path: "/sublease-admin/parties"
    description: "Register a party (landlord, tenant, subtenant, assignee)"
    roles: [AssetManager]
    code: 201
    input: [legal_name, party_kind, credit_rating_bps]
    output: Party
    side_effects: []
  - method: GET
    path: "/sublease-admin/parties"
    description: "List parties with optional kind filter"
    roles: [AssetManager, Landlord, Tenant, Subtenant, Assignee, TenantRepBroker]
    code: 200
    input: ["party_kind?", "limit?", "offset?"]
    output: Party[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/parties/{id}"
    description: "Fetch one party"
    roles: [AssetManager, Landlord, Tenant, Subtenant, Assignee, TenantRepBroker]
    code: 200
    input: []
    output: Party
    side_effects: []

  # ---- Building ----
  - method: POST
    path: "/sublease-admin/buildings"
    description: "Register a building with total RSF and loss factor"
    roles: [AssetManager]
    code: 201
    input: [name, total_rentable_sf, loss_factor_bps]
    output: Building
    side_effects: []
  - method: GET
    path: "/sublease-admin/buildings/{id}"
    description: "Fetch one building"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Building
    side_effects: []
  - method: GET
    path: "/sublease-admin/buildings/{id}/leases"
    description: "Reverse-reachability: leases in a building"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Lease[]
    side_effects: []

  # ---- Lease ----
  - method: POST
    path: "/sublease-admin/leases"
    description: "Create a lease (starts ACTIVE, open_transfer_count 0, cumulative_profit_share_cents 0)"
    roles: [AssetManager]
    code: 201
    input: [building_id, tenant_party_id, landlord_party_id, base_rent_per_rsf_annual_cents, leased_rsf, consent_window_business_days, deemed_approval_enabled, profit_share_tier1_pct_bps, profit_share_tier1_threshold_annual_cents, profit_share_tier2_pct_bps]
    output: Lease
    side_effects: []
  - method: GET
    path: "/sublease-admin/leases/{id}"
    description: "Fetch one lease including computed cumulative_profit_share_cents and open_transfer_count"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/sublease-admin/leases"
    description: "List leases with optional landlord/tenant filter"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["landlord_party_id?", "tenant_party_id?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/leases/{id}/transfer-requests"
    description: "Reverse-reachability: transfers of a lease"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/leases/{id}/settlements"
    description: "Reverse-reachability: settlements of a lease"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  # ---- TransferRequest ----
  - method: POST
    path: "/sublease-admin/leases/{lease_id}/transfer-requests"
    description: "Create a transfer request (DRAFT) against a lease; OCC-guarded on Lease.version"
    roles: [TenantRepBroker]
    code: 201
    input: [counterparty_id, transfer_type, proposed_rent_per_rsf_annual_cents, term_start, term_end, marketing_period_days, expected_lease_version]
    output: TransferRequest
    side_effects:
      - "records broker_user_id from X-User-ID"
      - "increments Lease.version by 1 (OCC anchor; open_transfer_count NOT incremented until submit)"
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}"
    description: "Fetch one transfer including computed deadline and differential"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests"
    description: "Filtered list of transfers (by lease, status, type)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["lease_id?", "status?", "transfer_type?", "counterparty_id?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/transfer-requests/{id}/submit"
    description: "Submit the transfer: runs completeness gates, mints ConsentReview + CreditReview, starts the consent clock"
    roles: [TenantRepBroker]
    code: 200
    input: []
    output: TransferRequest
    side_effects:
      - "TransferRequest DRAFT -> SUBMITTED with all §1.2 side effects"
  - method: POST
    path: "/sublease-admin/transfer-requests/{id}/withdraw"
    description: "Withdraw a transfer from DRAFT, SUBMITTED, or CONSENT_PENDING; only the originating broker may withdraw"
    roles: [TenantRepBroker]
    code: 200
    input: []
    output: TransferRequest
    side_effects:
      - "TransferRequest -> WITHDRAWN with cascade to RecognitionAgreement"
  - method: POST
    path: "/sublease-admin/transfer-requests/{id}/remind"
    description: "Tenant sends the deemed-approval reminder notice; valid only after consent_deadline has passed and review still PENDING"
    roles: [Tenant]
    code: 200
    input: []
    output: TransferRequest
    side_effects:
      - "sets reminder_sent_at to logical-clock now"
  - method: POST
    path: "/sublease-admin/transfer-requests/{id}/document"
    description: "Document a granted transfer: mint SubleaseAgreement (SUBLEASE only; null for ASSIGNMENT), draft RecognitionAgreement, create RestorationObligations from accepted RESTORATION_REQUIRED conditions. Response is a documentation receipt object; sublease_agreement_id is null for assignments, recognition_agreement_id is always set."
    roles: [TenantRepBroker]
    code: 201
    input: [executed_rent_per_rsf_annual_cents, "restoration_allocations?"]
    output: { transfer_request_id: string, sublease_agreement_id: string, recognition_agreement_id: string }
    side_effects:
      - "TransferRequest CONSENT_GRANTED -> DOCUMENTED with all §1.2 side effects"
      - "restoration_allocations is an array of {responsible_party, escrow_amount_cents} aligned to accepted RESTORATION_REQUIRED conditions"
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/consent-review"
    description: "Reverse-reachability: the consent review of a transfer (array of 0-1)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: ConsentReview[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/credit-review"
    description: "Reverse-reachability: the credit review of a transfer (array of 0-1)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: CreditReview[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/demised-areas"
    description: "Reverse-reachability: measurements of a transfer"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: DemisedArea[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/recognition-agreement"
    description: "Reverse-reachability: recognition agreement of a transfer (array of 0-1)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: RecognitionAgreement[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/restoration-obligations"
    description: "Reverse-reachability: restoration obligations of a transfer"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: RestorationObligation[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/transfer-requests/{id}/settlements"
    description: "Reverse-reachability: settlements of a transfer"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  # ---- DemisedArea ----
  - method: POST
    path: "/sublease-admin/transfer-requests/{id}/demised-areas"
    description: "Create a measurement record for a transfer (DRAFT); supersedes_id optional for revisions"
    roles: [TenantRepBroker]
    code: 201
    input: [measurement_standard, usable_sf, "supersedes_id?"]
    output: DemisedArea
    side_effects:
      - "lease_id is derived from the parent transfer (not client-supplied)"
  - method: GET
    path: "/sublease-admin/demised-areas/{id}"
    description: "Fetch one measurement (provisional values recomputed while DRAFT)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: DemisedArea
    side_effects: []
  - method: GET
    path: "/sublease-admin/demised-areas"
    description: "Filtered list of measurements; supports self-FK reverse reachability (revisions of a record, records superseded by a record)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["lease_id?", "transfer_request_id?", "supersedes_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: DemisedArea[]
    side_effects: []
  - method: GET
    path: "/sublease-admin/leases/{id}/demised-areas"
    description: "Reverse-reachability: measurements of all transfers under a lease"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: DemisedArea[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/demised-areas/{id}/certify"
    description: "Certify a measurement: freezes computed values; supersedes the referenced prior record"
    roles: [TenantRepBroker]
    code: 200
    input: []
    output: DemisedArea
    side_effects:
      - "DemisedArea DRAFT -> CERTIFIED with supersession cascade"

  # ---- ConsentReview / ConsentCondition ----
  - method: GET
    path: "/sublease-admin/consent-reviews/{id}"
    description: "Fetch one consent review"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: ConsentReview
    side_effects: []
  - method: GET
    path: "/sublease-admin/consent-reviews"
    description: "Filtered list of consent reviews (by transfer or reviewing landlord)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["transfer_request_id?", "reviewer_landlord_id?", "decision?", "limit?", "offset?"]
    output: ConsentReview[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/consent-reviews/{id}/decide"
    description: "Landlord decision: GRANTED | GRANTED_WITH_CONDITIONS | DENIED; OCC-guarded on ConsentReview.version"
    roles: [Landlord]
    code: 200
    input: [decision, "denial_reason_code?", "release_of_assignor?", "conditions?", expected_consent_review_version]
    output: ConsentReview
    side_effects:
      - "ConsentReview transition per §1.2 and cross-entity drive of TransferRequest"
      - "increments ConsentReview.version by 1"
      - "conditions is an array of {condition_kind, detail}; required when decision == GRANTED_WITH_CONDITIONS"
  - method: POST
    path: "/sublease-admin/consent-reviews/{id}/rescind"
    description: "Landlord rescinds a GRANTED_WITH_CONDITIONS review after a tenant rejection"
    roles: [Landlord]
    code: 200
    input: []
    output: ConsentReview
    side_effects:
      - "ConsentReview GRANTED_WITH_CONDITIONS -> RESCINDED; TransferRequest -> RESCINDED"
  - method: GET
    path: "/sublease-admin/consent-reviews/{id}/conditions"
    description: "Reverse-reachability: conditions of a review"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: ConsentCondition[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/consent-conditions/{id}/respond"
    description: "Tenant accepts or rejects one condition; all-accepted join grants consent"
    roles: [Tenant]
    code: 200
    input: [response]
    output: ConsentCondition
    side_effects:
      - "ConsentCondition PENDING -> ACCEPTED|REJECTED; conditional-acceptance join may drive TransferRequest -> CONSENT_GRANTED"
  - method: GET
    path: "/sublease-admin/consent-conditions/{id}"
    description: "Fetch one condition"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: ConsentCondition
    side_effects: []

  # ---- CreditReview ----
  - method: GET
    path: "/sublease-admin/credit-reviews/{id}"
    description: "Fetch one credit review"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: CreditReview
    side_effects: []
  - method: POST
    path: "/sublease-admin/credit-reviews/{id}/attest"
    description: "Broker attests counterparty credit; PASS iff reviewed_credit_rating_bps >= 6000; attesting broker must differ from originating broker"
    roles: [TenantRepBroker]
    code: 200
    input: [reviewed_credit_rating_bps]
    output: CreditReview
    side_effects:
      - "CreditReview PENDING -> PASS|FAIL; drives TransferRequest SUBMITTED -> CONSENT_PENDING"

  # ---- SubleaseAgreement ----
  - method: GET
    path: "/sublease-admin/sublease-agreements/{id}"
    description: "Fetch one instrument"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: SubleaseAgreement
    side_effects: []
  - method: GET
    path: "/sublease-admin/sublease-agreements"
    description: "Filtered list of instruments"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["transfer_request_id?", "status?", "demised_area_id?", "limit?", "offset?"]
    output: SubleaseAgreement[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/sublease-agreements/{id}/terminate"
    description: "Tenant terminates an instrument; blocks further settlements for the transfer"
    roles: [Tenant]
    code: 200
    input: []
    output: SubleaseAgreement
    side_effects:
      - "SubleaseAgreement -> TERMINATED"

  # ---- RecognitionAgreement ----
  - method: GET
    path: "/sublease-admin/recognition-agreements/{id}"
    description: "Fetch one recognition agreement"
    roles: [AssetManager, Landlord, Tenant, Subtenant, Assignee, TenantRepBroker]
    code: 200
    input: []
    output: RecognitionAgreement
    side_effects: []
  - method: GET
    path: "/sublease-admin/recognition-agreements"
    description: "Filtered list of recognition agreements (by transfer or pinned instrument)"
    roles: [AssetManager, Landlord, Tenant, Subtenant, Assignee, TenantRepBroker]
    code: 200
    input: ["transfer_request_id?", "sublease_agreement_id?", "status?", "limit?", "offset?"]
    output: RecognitionAgreement[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/recognition-agreements/{id}/sign"
    description: "Sign the recognition agreement; signatory LANDLORD by landlord, COUNTERPARTY by subtenant/assignee"
    roles: [Landlord, Subtenant, Assignee]
    code: 200
    input: [signatory]
    output: RecognitionAgreement
    side_effects:
      - "signature transitions per §1.2; second signature cascades TransferRequest -> EFFECTIVE and SubleaseAgreement -> RECOGNIZED"

  # ---- Settlement ----
  - method: POST
    path: "/sublease-admin/settlements"
    description: "Create a settlement for an EFFECTIVE transfer over a half-open period; all derived fields computed at creation (provisional variant)"
    roles: [TenantRepBroker]
    code: 201
    input: [lease_id, transfer_request_id, period_start, period_end, subrent_collected_cents]
    output: Settlement
    side_effects:
      - "runs settlement_profit_share calculation (provisional variant)"
  - method: GET
    path: "/sublease-admin/settlements/{id}"
    description: "Fetch one settlement (provisional recompute while DRAFT)"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/sublease-admin/settlements"
    description: "Filtered list of settlements"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: ["lease_id?", "transfer_request_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/sublease-admin/settlements/{id}/finalize"
    description: "Finalize a settlement: freezes computed fields, debits Lease.cumulative_profit_share_cents, enforces non-overlap with existing FINALIZED periods"
    roles: [TenantRepBroker]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "Settlement DRAFT -> FINALIZED; Lease.cumulative_profit_share_cents += landlord_share_cents; Lease.version += 1"
  - method: POST
    path: "/sublease-admin/settlements/{id}/void"
    description: "Void a DRAFT settlement (no ledger effect)"
    roles: [TenantRepBroker]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "Settlement DRAFT -> VOID"

  # ---- RestorationObligation ----
  - method: GET
    path: "/sublease-admin/restoration-obligations/{id}"
    description: "Fetch one restoration obligation"
    roles: [AssetManager, Landlord, Tenant, TenantRepBroker]
    code: 200
    input: []
    output: RestorationObligation
    side_effects: []
  - method: POST
    path: "/sublease-admin/restoration-obligations/{id}/complete"
    description: "Landlord certifies restoration complete"
    roles: [Landlord]
    code: 200
    input: []
    output: RestorationObligation
    side_effects:
      - "RestorationObligation OPEN|ESCROW_POSTED -> COMPLETED"
  - method: POST
    path: "/sublease-admin/restoration-obligations/{id}/waive"
    description: "Landlord waives the restoration obligation"
    roles: [Landlord]
    code: 200
    input: []
    output: RestorationObligation
    side_effects:
      - "RestorationObligation OPEN|ESCROW_POSTED -> WAIVED"

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/sublease-admin/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00.000Z (Saturday); the clock MUST NOT fall back to wall-clock time. Advancing the clock evaluates deemed-approval auto-transitions and deadline gates."
    roles: [AssetManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, advanced_transitions: integer }
    side_effects:
      - "evaluates deemed-approval transitions for every TransferRequest in SUBMITTED|CONSENT_PENDING whose conditions are met"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "authenticated role not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist (left-to-right)"
  - id: ERR_FK_MISMATCH
    http: 422
    condition: "referenced entity missing or party_kind does not match the reference slot (e.g., landlord_party_id points to a TENANT party; counterparty kind mismatches transfer_type)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid from-state for the transition (submit non-DRAFT, decide non-PENDING, finalize non-DRAFT, sign already-signed side, etc.)"
  - id: ERR_DUTY_SEGREGATION
    http: 403
    condition: "segregation-of-duties breach: attesting broker == originating broker; withdrawing broker != originating broker; decision landlord != lease landlord; condition respondent != lease tenant"
  - id: ERR_TEMPORAL_WINDOW
    http: 422
    condition: "term_start not after now; term_end not after term_start; decision after consent_deadline; settlement period_end <= period_start"
  - id: ERR_DUPLICATE_ACTIVE
    http: 409
    condition: "a non-terminal TransferRequest already exists for the lease; or a FINALIZED settlement overlaps the proposed period (half-open adjacency is allowed)"
  - id: ERR_PACKAGE_INCOMPLETE
    http: 422
    condition: "marketing_period_days < 30 at submit; or no certified non-superseded DemisedArea at submit/document"
  - id: ERR_FISCAL_INCOHERENT
    http: 422
    condition: "tier2 pct < tier1 pct; negative collected subrent; restoration escrow <= 0 when responsible_party != TENANT; non-positive proposed rent"
  - id: ERR_CONSENT_WINDOW_LAPSED
    http: 409
    condition: "express landlord decision attempted strictly after TransferRequest.consent_deadline (decision at exactly the deadline is accepted)"
  - id: ERR_DEEMED_APPROVAL_DISABLED
    http: 409
    condition: "reminder notice sent on a lease with deemed_approval_enabled == false"
  - id: ERR_REMINDER_PREMATURE
    http: 409
    condition: "reminder notice sent while the logical clock is still at or before consent_deadline, or while the consent review is no longer PENDING, or when a reminder was already recorded"
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version does not match Lease.version at transfer creation"
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_consent_review_version does not match ConsentReview.version at decide"
  - id: ERR_DENIAL_REASON_INVALID
    http: 422
    condition: "DENIED without denial_reason_code, or INSUFFICIENT_CREDIT cited while CreditReview.outcome != FAIL"
  - id: ERR_MEASUREMENT_SUPERSEDED
    http: 409
    condition: "certify attempted on a SUPERSEDED DemisedArea, or revision creation whose supersedes_id points to a record that is already SUPERSEDED or still DRAFT (revisions must chain off the current CERTIFIED tip)"
  - id: ERR_SIGNATORY_MISMATCH
    http: 403
    condition: "signatory LANDLORD attempted by non-landlord party id, or COUNTERPARTY by a party id != TransferRequest.counterparty_id; or same side signing twice"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, enum value unknown, or type mismatch in request body"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssetManager
    description: "Portfolio operator who registers parties, buildings, leases, and drives the logical clock; cannot act on transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /sublease-admin/parties"
      - "POST /sublease-admin/buildings"
      - "POST /sublease-admin/leases"
      - "POST /sublease-admin/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: TenantRepBroker
    description: "Tenant-rep broker who originates transfers, measurements, credit attestations (for transfers they did not originate), documentation, and settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /sublease-admin/leases/{lease_id}/transfer-requests"
      - "POST /sublease-admin/transfer-requests/{id}/submit"
      - "POST /sublease-admin/transfer-requests/{id}/withdraw"
      - "POST /sublease-admin/transfer-requests/{id}/document"
      - "POST /sublease-admin/transfer-requests/{id}/demised-areas"
      - "POST /sublease-admin/demised-areas/{id}/certify"
      - "POST /sublease-admin/credit-reviews/{id}/attest"
      - "POST /sublease-admin/settlements"
      - "POST /sublease-admin/settlements/{id}/finalize"
      - "POST /sublease-admin/settlements/{id}/void"
    shared_operations:
      - "all GET endpoints"
  - name: Landlord
    description: "Building owner who decides consent, rescinds conditional consent, signs recognition agreements, and certifies or waives restoration"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /sublease-admin/consent-reviews/{id}/decide"
      - "POST /sublease-admin/consent-reviews/{id}/rescind"
      - "POST /sublease-admin/restoration-obligations/{id}/complete"
      - "POST /sublease-admin/restoration-obligations/{id}/waive"
    shared_operations:
      - "POST /sublease-admin/recognition-agreements/{id}/sign (signatory LANDLORD)"
      - "all GET endpoints"
  - name: Tenant
    description: "Existing tenant who responds to consent conditions, sends deemed-approval reminders, and terminates sublease instruments"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /sublease-admin/consent-conditions/{id}/respond"
      - "POST /sublease-admin/transfer-requests/{id}/remind"
      - "POST /sublease-admin/sublease-agreements/{id}/terminate"
    shared_operations:
      - "all GET endpoints"
  - name: Subtenant
    description: "Prospective subtenant; countersigns recognition agreements as COUNTERPARTY"
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "POST /sublease-admin/recognition-agreements/{id}/sign (signatory COUNTERPARTY)"
      - "all GET endpoints"
  - name: Assignee
    description: "Prospective assignee; countersigns recognition agreements as COUNTERPARTY"
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "POST /sublease-admin/recognition-agreements/{id}/sign (signatory COUNTERPARTY)"
      - "all GET endpoints"
