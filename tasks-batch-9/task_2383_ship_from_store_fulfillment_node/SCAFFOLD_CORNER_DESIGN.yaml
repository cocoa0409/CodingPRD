              as: NetworkPlanner
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 2, reorder_point_units: 1 }
              as: NetworkPlanner
              captures: { pg1: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
