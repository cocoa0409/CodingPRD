          assert:
            - "SittingAssignment.${asg_id}.credit_hours_settled == 4.00 (early_fraction == 0.25 exactly; strict > means NO proration)"
            - "SittingAssignment.${asgB_id}.credit_hours_settled == 1.49 (early_fraction 0.254166.. > 0.25; base 2.983333 x 1.0 x 0.5 = 1.491666.. -> round_half_up 1.49)"
            - "Member.${f2_id}.credit_balance_hours == 15.49 (10.00 + 4.00 + 1.49); Member.${f1_id}.credit_balance_hours == 4.51 (10.00 - 4.00 - 1.49)"

      - name: overdraft_margin_exactly_max_vs_beyond
        grounds:
          - validations[priority=14]
          - calculations.credit_hours_offered
          - entities.Member.fields.credit_balance_hours
        distinguishing_aspect: |
          Metric: owner credit margin in hours (balance - offered vs
          -MAX_OVERDRAFT_HOURS -5.0), endpoint POST /sitting-requests. Balance 10.00
          with offered 15.00 lands the margin exactly on -5.00 (>= passes -> 201);
          offered 15.50 lands at -5.50 (< fails -> 402). Distinct metric and
          endpoint from the early-fraction instance.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; holiday window [2026-12-24T00:00:00Z, 2026-12-27T00:00:00Z) mult 3.0"
            - "R_ok: 2026-12-25T10:00:00Z + 5h -> offered 5.0 x 3.0 == 15.00 -> margin exactly -5.00"
            - "R_bad: 2026-12-26T10:00:00Z + 5h10m -> offered 5.1666.. x 3.0 == 15.50 -> margin -5.50"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - call: "POST /coop/holiday-windows"
              payload: { name: "Xmas", window_start: "2026-12-24T00:00:00Z", window_end: "2026-12-27T00:00:00Z", demand_multiplier: 3.0 }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/sitting-requests"
