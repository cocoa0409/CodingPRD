      - name: writes_from_a_state_that_declares_no_such_transition_are_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_EXPENDITURE_STATE]
          - errors[ERR_INVALID_CLNA_PHASE_TRANSITION]
          - errors[ERR_INVALID_INDICATOR_STATE]
          - errors[ERR_INVALID_PLAN_STATE]
        distinguishing_aspect: |
          Four machines are probed from a state that declares no outgoing edge for the attempted trigger, and each must
          map to its OWN 409 error_id per priority 9's mapping table: expenditure void and obligate from REQUESTED,
          a clna phase skip from NOT_STARTED straight to GAP_ANALYSIS, accept-level from PROPOSED, and an
          improvement-plan return against a PerformanceIndicator that is not in IMPROVEMENT_REQUIRED.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with clna_phase NOT_STARTED."
            - "One PerformanceIndicator 4S1_CREDENTIAL / reporting_year 2027 / cohort_year 2026 in status PROPOSED with last_offer_pct null."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30 holding one REQUESTED CONSUMABLE Expenditure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/performance-indicators"
              payload: { indicator_code: "4S1_CREDENTIAL", reporting_year: 2027, baseline_pct: 60.00, cohort_year: 2026 }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { pi_id: $.data.id }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_id: $.data.id, grant_v1: $.data.version }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "Clinic consumables", unit_cost_cents: 100000, quantity: 1, service_period_start: "2026-09-01", service_period_end: "2026-09-30", expected_grant_award_version: "${grant_v1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { exp_id: $.data.id }
          trigger:
            - call: "POST /cte/expenditures/${exp_id}/void"
              payload: { void_reason: "Too early to void." }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
            - call: "POST /cte/expenditures/${exp_id}/obligate"
              payload: { obligation_reference: "PO-2027-0041" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
            - call: "POST /cte/programs-of-study/${pos_id}/clna-advance"
              payload: { to_phase: "GAP_ANALYSIS", evidence_url: "https://district.example/clna/gap.pdf" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/performance-indicators/${pi_id}/accept-level"
              payload: { acceptance_note: "Nothing to accept." }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/performance-indicators/${pi_id}/improvement-plans"
              payload: { milestones: [{ label: "Recruit", due_on: "2027-01-31" }, { label: "Train", due_on: "2027-03-31" }, { label: "Review", due_on: "2027-05-31" }] }
              as: CteDirector
              as_user_id: "u_dir_1"
          assert:
            - "the void call returns error_id == ERR_INVALID_EXPENDITURE_STATE with HTTP status 409"
            - "the obligate call returns error_id == ERR_INVALID_EXPENDITURE_STATE with HTTP status 409"
            - "the clna-advance call returns error_id == ERR_INVALID_CLNA_PHASE_TRANSITION with HTTP status 409"
            - "the accept-level call returns error_id == ERR_INVALID_INDICATOR_STATE with HTTP status 409"
            - "the improvement-plans call returns error_id == ERR_INVALID_INDICATOR_STATE with HTTP status 409"
            - "Expenditure.${exp_id}.status == REQUESTED and void_reason == null and obligation_reference == null"
            - "ProgramOfStudy.${pos_id}.clna_phase == NOT_STARTED"
            - "PerformanceIndicator.${pi_id}.status == PROPOSED and negotiated_level_pct == null"
            - "GET /cte/improvement-plans returns total_count == 0"

