            - "the review-decision returns 409 ERR_APPLICATION_NOT_IN_REVIEW"
            - "the resubmit returns 409 ERR_APPLICATION_NOT_REVISABLE"
            - "the second certify returns 409 ERR_APPLICATION_NOT_APPROVED"
            - "SeveranceApplication.${app_id}.status == CERTIFIED and requested_units == 22 and denial_reason == null"
            - "GET /tdr/certificates?origin_sending_area_id=${sa_id} returns total_count 1 — no second certificate was minted"
            - "SendingArea.${sa_id}.severed_units_total == 22 and issued_certificate_count == 1"
            - "GET /tdr/certificate-transfers?certificate_id=${cert_id} returns total_count 1"

      - name: certifying_an_application_still_under_review_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SeveranceApplication.APPROVED_to_CERTIFIED
          - validations.priority_14_application_approved
          - errors.ERR_APPLICATION_NOT_APPROVED
        distinguishing_aspect: "The APPROVED precondition is enforced ahead of everything the certify cascade would do: no easement is recorded, no certificate is minted, and the parcel and area counters are untouched. The segregation-of-duties check at priority 8 cannot mask this, because decided_by_user_id is still null."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2); application screened into UNDER_REVIEW with no decision recorded"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
