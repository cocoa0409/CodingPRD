          - calculations.participant_eligibility_replay
          - state_machines.ContributionReport.SUBMITTED_to_POSTED
        distinguishing_aspect: "The consistency model is immediate, so the very next read after POST /contribution-reports/{id}/post already shows credited_hours_total 300.00, hour_bank_hours 60.00, two GRANTED CoverageMonth rows and the recomputed PensionAccrual, with no second sweep or delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z with one SUBMITTED 2026-03 report of a single 300.00-hour JOURNEYMAN line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Immediate Fund", ein: "36-9500001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v}", lines: [ { participant_id: "${p1_id}", hours: 300.00, gross_wages_cents: 1200000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${r1_id}/post"
              payload: {}
              as: FundAdministrator
            - call: "GET /participants/${p1_id}"
              payload: {}
              as: FundAdministrator
              captures: { credited: $.data.credited_hours_total, bank: $.data.hour_bank_hours, through: $.data.coverage_through_month }
          assert:
            - "the post response itself already carries filing_status POSTED, total_contributions_due_cents 247650 and a non-null posted_at"
            - "${credited} == 300.00 and ${bank} == 60.00 and ${through} == '2026-06'"
            - "GET /coverage-months?participant_id=${p1_id}&status=GRANTED returns exactly 2 rows, 2026-05 and 2026-06"
            - "GET /participants/${p1_id}/pension-accruals returns 1 row with plan_year 2026, hours_credited 300.00, pension_credit 0.25 and accrual_status OPEN"
            - "Participant.${p1_id}.eligibility_status == ELIGIBLE"
