scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rolling_mg_forward_vs_completed_on_patient
        grounds:
          - calculations.rolling_mg_exposure
          - calculations.procedure_delivered_mg
          - validations[priority=20]
          - entities.Patient.fields.cumulative_mg_testosterone
        distinguishing_aspect: |
          The dual variant lives on the Patient exposure domain: COMPLETED_ONLY and
          INCLUDING_SCHEDULED read the identical database at the identical instant and
          return 1200 and 2400 respectively, because the forward variant also counts a
          procedure that is merely booked.
        test_recipe:
          setup:
            - "One patient with exactly one COMPLETED testosterone procedure delivering 1200 mg on 2026-05-10T09:00:00Z."
            - "One further testosterone procedure in status SCHEDULED for 2026-08-05T09:00:00Z with planned_total_mg 1200."
            - "Logical clock parked at 2026-07-25T09:00:00Z."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat One", date_of_birth: "1980-03-04", email: "p1@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { p1: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "TESTOSTERONE", title: "T pellet protocol v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/consents"
              payload: { patient_id: "${p1}", hormone_type: "TESTOSTERONE", protocol_version: 1, consented_max_dose_mg: 2000 }
              as: FrontDesk
              captures: { con1: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p1}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1150, symptom_score: 55, indication: "Hypogonadism" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs1: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE", "ESTRADIOL"], scope_injection_types: ["B12", "LIPOTROPIC", "VITAMIN_D", "GLUTATHIONE"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so1: $.data.id }
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-A", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-09-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_a: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_a}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T100-B", hormone_type: "TESTOSTERONE", strength_mg: 100, expiry_date: "2026-08-01T00:00:00Z", qty_received: 5 }
              as: InventoryManager
              captures: { lot_b: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_b}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p1}", provider_id: "${dr1}", consult_id: "${cs1}", standing_order_id: "${so1}", procedure_type: "INITIAL", room_code: "RM1", scheduled_start: "2026-05-10T09:00:00Z" }
              as: FrontDesk
              captures: { pr1: $.data.id }
            - call: "POST /clinic/procedures/${pr1}/consent-attach"
              payload: { consent_record_id: "${con1}" }
              as: FrontDesk
            - call: "GET /clinic/procedures/${pr1}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { pr1_v: $.data.version }
            - call: "POST /clinic/procedures/${pr1}/allocations"
              payload: { expected_procedure_version: "${pr1_v}" }
              as: InventoryManager
            - call: "POST /clinic/procedures/${pr1}/open-supply"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ClinicAdmin
            - call: "GET /clinic/patients/${p1}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { p1_v: $.data.version }
            - call: "POST /clinic/procedures/${pr1}/perform"
              payload: { expected_patient_version: "${p1_v}", pellets_wasted: 0 }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T09:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/lab-panels"
              payload: { patient_id: "${p1}", ordered_by_provider_id: "${dr1}", analyte: "TOTAL_TESTOSTERONE", value: 400, drawn_at: "2026-07-25T09:00:00Z", is_trough_draw: true }
              as: Physician
              as_user_id: "${dr1}"
              captures: { lab1: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p1}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1150, symptom_score: 55, indication: "Trough below optimal" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs2: $.data.id }
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p1}", provider_id: "${dr1}", consult_id: "${cs2}", standing_order_id: "${so1}", procedure_type: "REDOSE", room_code: "RM1", scheduled_start: "2026-08-05T09:00:00Z", lab_panel_id: "${lab1}" }
              as: FrontDesk
              captures: { pr2: $.data.id }
          trigger:
            - call: "GET /clinic/patients/${p1}/therapy-status"
              payload: { hormone_type: "TESTOSTERONE" }
              as: Physician
              as_user_id: "${dr1}"
          assert:
            - "therapy_status.rolling_mg_completed_only == 1200"
            - "therapy_status.rolling_mg_including_scheduled == 2400"
            - "therapy_status.rolling_mg_cap == 4800"
            - "Procedure.${pr1}.delivered_total_mg == 1200"
            - "Procedure.${pr2}.planned_total_mg == 1200"
            - "Procedure.${pr2}.status == SCHEDULED"

      - name: refund_quote_vs_final_settlement_on_procedure
        grounds:
          - calculations.refund_settlement_cents
          - calculations.late_cancel_fee_cents
          - calculations.financing_schedule_cents
          - state_machines.Procedure.SUPPLY_OPENED_to_CANCELLED
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain - Procedure and its
          FinancingPlan, not Patient exposure. PROVISIONAL_QUOTE returns 18120 while
          FINAL_SETTLEMENT on the very next call returns 3138, because cancelling from
          SUPPLY_OPENED itself converts the opened tray to WASTED and charges 14982.
        test_recipe:
          setup:
            - "An estradiol procedure of 85 mg (3 x 25 mg plus 1 x 10 mg) in status SUPPLY_OPENED."
            - "An ACTIVE FinancingPlan on that procedure with principal 47482, down payment 25000 and 4 installments, with installment 1 (5620) already PAID."
            - "Logical clock at 2026-05-20T00:00:00Z, ten hours before the slot, so the cancel lands in TIER2."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Two", date_of_birth: "1978-11-02", email: "p2@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { p2: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "ESTRADIOL", title: "E2 pellet protocol v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/consents"
              payload: { patient_id: "${p2}", hormone_type: "ESTRADIOL", protocol_version: 1, consented_max_dose_mg: 150 }
              as: FrontDesk
              captures: { con2: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p2}", physician_id: "${dr1}", hormone_type: "ESTRADIOL", prescribed_dose_mg: 80, symptom_score: 50, indication: "Menopausal symptoms" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs3: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["ESTRADIOL"], scope_injection_types: ["B12"], max_dose_mg: 150, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so2: $.data.id }
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "E25-A", hormone_type: "ESTRADIOL", strength_mg: 25, expiry_date: "2026-09-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_e25: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_e25}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "E10-A", hormone_type: "ESTRADIOL", strength_mg: 10, expiry_date: "2026-09-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_e10: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_e10}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p2}", provider_id: "${dr1}", consult_id: "${cs3}", standing_order_id: "${so2}", procedure_type: "INITIAL", room_code: "RM2", scheduled_start: "2026-05-20T10:00:00Z" }
              as: FrontDesk
              captures: { pr3: $.data.id }
            - call: "POST /clinic/procedures/${pr3}/consent-attach"
              payload: { consent_record_id: "${con2}" }
              as: FrontDesk
            - call: "GET /clinic/procedures/${pr3}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { pr3_v: $.data.version }
            - call: "POST /clinic/procedures/${pr3}/allocations"
              payload: { expected_procedure_version: "${pr3_v}" }
              as: InventoryManager
            - call: "POST /clinic/procedures/${pr3}/open-supply"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/financing-plans"
              payload: { patient_id: "${p2}", procedure_id: "${pr3}", principal_cents: 47482, down_payment_cents: 25000, installment_count: 4, first_due_date: "2026-06-20T00:00:00Z" }
              as: FrontDesk
              captures: { fp1: $.data.id }
            - call: "POST /clinic/financing-plans/${fp1}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /clinic/financing-plans/${fp1}/payments"
              payload: { installment_index: 1, amount_cents: 5620 }
              as: FrontDesk
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "GET /clinic/procedures/${pr3}/refund-quote"
              payload: {}
              as: FrontDesk
            - call: "POST /clinic/procedures/${pr3}/cancel"
              payload: { reason: "Patient declined at the door" }
              as: FrontDesk
          assert:
            - "refund_quote.variant == PROVISIONAL_QUOTE"
            - "refund_quote.paid_to_date_cents == 30620"
            - "refund_quote.cancel_tier == TIER2"
            - "refund_quote.cancel_fee_cents == 12500"
            - "refund_quote.wasted_pellet_charge_cents == 0"
            - "refund_quote.refund_cents == 18120"
            - "Procedure.${pr3}.status == CANCELLED"
            - "Procedure.${pr3}.pellets_wasted == 4"
            - "FinancingPlan.${fp1}.status == CANCELLED"
            - "FinancingPlan.${fp1}.refunded_cents == 3138"

      - name: lab_value_lab_normal_but_below_clinic_optimal
        grounds:
          - calculations.lab_band_classification
          - entities.LabPanel.fields.lab_reference_band
          - entities.LabPanel.fields.clinic_optimal_band
        distinguishing_aspect: |
          A third dual variant on yet another entity domain, LabPanel: the single
          measurement 400 ng/dL classifies IN_REF under LAB_REFERENCE and
          BELOW_OPTIMAL under CLINIC_OPTIMAL, and only the second classification
          unlocks a re-dose.
        test_recipe:
          setup:
            - "One provider and one patient; no other clinical state required."
            - "Clock at its 2026-05-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Three", date_of_birth: "1975-01-01", email: "p3@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /clinic/lab-panels"
              payload: { patient_id: "${p3}", ordered_by_provider_id: "${dr1}", analyte: "TOTAL_TESTOSTERONE", value: 400, drawn_at: "2026-05-01T00:00:00Z", is_trough_draw: true }
              as: Physician
              as_user_id: "${dr1}"
              captures: { lab_lownormal: $.data.id }
            - call: "POST /clinic/lab-panels"
              payload: { patient_id: "${p3}", ordered_by_provider_id: "${dr1}", analyte: "ESTRADIOL", value: 950, drawn_at: "2026-05-01T00:00:00Z", is_trough_draw: false }
              as: Physician
              as_user_id: "${dr1}"
              captures: { lab_crit: $.data.id }
          assert:
            - "LabPanel.${lab_lownormal}.lab_reference_band == IN_REF"
            - "LabPanel.${lab_lownormal}.clinic_optimal_band == BELOW_OPTIMAL"
            - "LabPanel.${lab_lownormal}.critical_flag == false"
            - "LabPanel.${lab_lownormal}.status == RECORDED"
            - "LabPanel.${lab_crit}.lab_reference_band == ABOVE_REF"
            - "LabPanel.${lab_crit}.clinic_optimal_band == ABOVE_OPTIMAL"
            - "LabPanel.${lab_crit}.critical_flag == true"
            - "LabPanel.${lab_crit}.status == CRITICAL_FLAGGED"

  - rule_id: combinatorial_formula
    instances:
      - name: pellet_ladder_greedy_ceiling_mode_a
        grounds:
          - calculations.pellet_count_from_dose
          - entities.Consult.fields.planned_total_mg
          - entities.Consult.fields.planned_pellet_count
        distinguishing_aspect: |
          Mode (a): three inputs (dose, the hormone-selected ladder, the remainder) fed
          through a nested floor-then-ceiling with a branch on hormone_type. A 1150 mg
          testosterone order resolves to 5+2 pellets and 1200 mg; an 80 mg estradiol
          order resolves to 3+1 pellets and 85 mg. Neither result is a linear function
          of the dose.
        test_recipe:
          setup:
            - "One physician and one patient."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Four", date_of_birth: "1982-06-06", email: "p4@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { p4: $.data.id }
          trigger:
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p4}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1150, symptom_score: 60, indication: "Fatigue" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs_t: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p4}", physician_id: "${dr1}", hormone_type: "ESTRADIOL", prescribed_dose_mg: 80, symptom_score: 60, indication: "Vasomotor" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs_e: $.data.id }
          assert:
            - "Consult.${cs_t}.planned_large_count == 5"
            - "Consult.${cs_t}.planned_small_count == 2"
            - "Consult.${cs_t}.planned_pellet_count == 7"
            - "Consult.${cs_t}.planned_total_mg == 1200"
            - "Consult.${cs_e}.planned_large_count == 3"
            - "Consult.${cs_e}.planned_small_count == 1"
            - "Consult.${cs_e}.planned_pellet_count == 4"
            - "Consult.${cs_e}.planned_total_mg == 85"

      - name: pellet_charge_round_per_line_then_sum_mode_b
        grounds:
          - calculations.procedure_pellet_charge_cents
          - calculations.visit_invoice_total_cents
          - entities.Procedure.fields.charge_cents
        distinguishing_aspect: |
          Mode (b): the pinned rounding order changes the answer. Rounding the 3 x 25 mg
          line to 13219 and the 1 x 10 mg line to 1763 and summing gives a pellet
          subtotal of 14982 and a charge of 47482; summing the raw products first and
          rounding once gives 14981 and a charge of 47481.
        test_recipe:
          setup:
            - "An estradiol procedure of 85 mg performed with zero wastage and no membership attached."
            - "Clock at 2026-05-20T10:00:00Z when the procedure is performed."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Five", date_of_birth: "1979-02-02", email: "p5@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { p5: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "ESTRADIOL", title: "E2 pellet protocol v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/consents"
              payload: { patient_id: "${p5}", hormone_type: "ESTRADIOL", protocol_version: 1, consented_max_dose_mg: 150 }
              as: FrontDesk
              captures: { con5: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${p5}", physician_id: "${dr1}", hormone_type: "ESTRADIOL", prescribed_dose_mg: 80, symptom_score: 50, indication: "Vasomotor" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs5: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["ESTRADIOL"], scope_injection_types: ["B12"], max_dose_mg: 150, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so5: $.data.id }
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "E25-A", hormone_type: "ESTRADIOL", strength_mg: 25, expiry_date: "2026-09-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_e25: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_e25}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "E10-A", hormone_type: "ESTRADIOL", strength_mg: 10, expiry_date: "2026-09-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_e10: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_e10}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p5}", provider_id: "${dr1}", consult_id: "${cs5}", standing_order_id: "${so5}", procedure_type: "INITIAL", room_code: "RM3", scheduled_start: "2026-05-20T10:00:00Z" }
              as: FrontDesk
              captures: { pr5: $.data.id }
            - call: "POST /clinic/procedures/${pr5}/consent-attach"
              payload: { consent_record_id: "${con5}" }
              as: FrontDesk
            - call: "GET /clinic/procedures/${pr5}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { pr5_v: $.data.version }
            - call: "POST /clinic/procedures/${pr5}/allocations"
              payload: { expected_procedure_version: "${pr5_v}" }
              as: InventoryManager
            - call: "POST /clinic/procedures/${pr5}/open-supply"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T10:00:00Z" }
              as: ClinicAdmin
            - call: "GET /clinic/patients/${p5}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { p5_v: $.data.version }
          trigger:
            - call: "POST /clinic/procedures/${pr5}/perform"
              payload: { expected_patient_version: "${p5_v}", pellets_wasted: 0 }
              as: Physician
              as_user_id: "${dr1}"
          assert:
            - "Procedure.${pr5}.pellets_inserted == 4"
            - "Procedure.${pr5}.delivered_total_mg == 85"
            - "Procedure.${pr5}.charge_cents == 47482"
            - "Procedure.${pr5}.charge_cents != 47481"

      - name: facility_fee_waiver_reads_post_discount_subtotal_mode_c
        grounds:
          - calculations.visit_invoice_total_cents
          - entities.Membership.fields.discount_pct
          - entities.Procedure.fields.charge_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency is pinned so the facility-fee waiver
          test reads the POST-discount subtotal. A 100 mg estradiol procedure with no
          membership totals 42625 with the fee waived at exactly the threshold, while
          the identical procedure for a PLUS member totals 45862 - the discount costs
          the member the waiver and they pay MORE.
        test_recipe:
          setup:
            - "Two patients, each with a 100 mg estradiol procedure allocated and opened in different rooms."
            - "The second patient holds an ACTIVE PLUS membership attached to their procedure."
            - "Clock at 2026-05-20T10:00:00Z at perform time."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ben Sato", provider_type: "PHYSICIAN", npi: "1000000002" }
              as: ClinicAdmin
              captures: { dr2: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Six", date_of_birth: "1970-04-04", email: "p6@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { p6: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat Seven", date_of_birth: "1971-05-05", email: "p7@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { p7: $.data.id }
            - call: "POST /clinic/memberships"
