# =============================================================================
# Adult Day Health & PACE Program — benchmark seed tables (v1)
# Difficulty tier: EXPERT
# Topology: flat-with-references (peer entities addressed under /pace/<collection>;
#           parent context carried as FK fields, validated cross-aggregate)
# =============================================================================

scenario: |
  Adult Day Health & PACE Program: participant enrollment & eligibility
  (nursing-home level of care), daily attendance & transportation,
  interdisciplinary care plan, capitated PACE payment & enrollment lock-in,
  meal/activity schedule, nursing & medication services, Medicaid/Medicare dual
  billing, voluntary/involuntary disenrollment

domain_name: adult-day-health-pace
api_prefix: /pace

# Selected structural DNA (informational; not consumed by lint).
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Participant.version for capitation finalize and disenroll finalize
    - cascading_side_effects        # disenrollment cascades across enrollment, care plan, attendance, transport, meds
    - dual_variant_calculation      # capitation proration: FULL_MONTH vs DAILY; dual vs Medicare-only supplement
    - rate_threshold_triggers       # live census boundary, lock-in window boundary, LOC expiry boundary
    - derived_field_reconciliation  # Participant ledger fields recomputed from CapitationPayment / AttendanceDay children

  entity_topology: flat             # peer entities under /pace/<collection>, FK cross-references validated
  state_machine_shape: branching    # disenrollment fork (approve/deny; voluntary/involuntary), care-plan revision cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # CapitationPayment finalize depends on Enrollment + LOC state; med order depends on CarePlan
    - self_referential              # CarePlan.supersedes_care_plan_id references a prior CarePlan
  role_model: segregation_of_duties # IntakeCoordinator enrolls but cannot certify LOC nor finalize billing; roles are disjoint
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "PACE center name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of operation (drives Medicaid rate)" }
      - { name: daily_census_capacity, type: integer, source: input, description: "Maximum participants physically present (CHECKED_IN) per attendance day (live census cap)", constraints: ">= 1" }
      - { name: max_roster, type: integer, source: input, description: "Maximum number of ENROLLED participants the program may carry (roster cap, independent of the daily live census cap)", constraints: ">= 1" }
      - { name: medicaid_monthly_rate_cents, type: integer, source: input, description: "State Medicaid capitation per enrolled member-month, in cents", constraints: ">= 0" }
      - { name: medicare_monthly_rate_cents, type: integer, source: input, description: "Medicare Part C+D PACE capitation per member-month, in cents", constraints: ">= 0" }
      - { name: medicare_only_supplement_cents, type: integer, source: input, default: 0, description: "Extra monthly amount a Medicare-only (non-dual) participant self-pays on top of the Medicaid share, in cents", constraints: ">= 0" }
      - { name: lock_in_days, type: integer, source: input, default: 30, description: "Days after enrollment_effective_date during which a finalized VOLUNTARY disenrollment incurs the lock-in penalty", constraints: ">= 0" }
      - { name: loc_validity_days, type: integer, source: input, default: 365, description: "Days a CERTIFIED level-of-care assessment stays valid before recertification is required" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Participants in this program whose status == ENROLLED" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED — SUSPENDED blocks new enroll and capitation finalize", default: "OPEN", constraints: "OPEN | SUSPENDED" }

  - name: Participant
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (ISO 8601 date); must be >= 55 years old at enrollment_effective_date to enroll" }
      - { name: dual_eligible, type: boolean, source: input, description: "true = dually eligible for Medicaid AND Medicare; false = Medicare-only, self-pays the Medicaid share as a supplement" }
      - { name: enrollment_effective_date, type: datetime, source: system, description: "First-of-month date the active Enrollment became effective; null until ENROLLED" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ELIGIBLE | ENROLLED | DISENROLLMENT_PENDING | DISENROLLED", default: "APPLICANT", constraints: "APPLICANT | ELIGIBLE | ENROLLED | DISENROLLMENT_PENDING | DISENROLLED" }
      - { name: active_loc_assessment_id, type: string, source: system, description: "FK -> LevelOfCareAssessment.id; the currently-CERTIFIED level-of-care assessment, null when none certified" }
      - { name: active_care_plan_id, type: string, source: system, description: "FK -> CarePlan.id; the currently-ACTIVE care plan, null when none active" }
      - { name: active_enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the OPEN Enrollment, null when never enrolled or fully disenrolled" }
      - { name: ledger_billed_cents, type: integer, source: computed, description: "Sum of total_billed_cents over this participant's CapitationPayment rows in status FINALIZED" }
      - { name: ledger_reconciled_cents, type: integer, source: computed, description: "Sum of reconciled_cents over this participant's CapitationPayment rows in status RECONCILED" }
      - { name: lifetime_attendance_days, type: integer, source: computed, description: "Count of this participant's AttendanceDay rows in status COMPLETED" }

  - name: Enrollment
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: enrollment_effective_date, type: datetime, source: input, description: "First-of-month effective date (ISO date with day == 01); PACE enrollment is always first-of-month" }
      - { name: lock_in_end_date, type: datetime, source: computed, description: "enrollment_effective_date + Program.lock_in_days; a VOLUNTARY disenrollment effective before this date triggers the lock-in penalty" }
      - { name: disenrollment_effective_date, type: datetime, source: system, description: "First-of-month date the Enrollment ends; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — CLOSED when disenrollment is finalized", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: LevelOfCareAssessment
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: nf_score, type: integer, source: input, description: "Nursing-facility clinical eligibility score 0..100; >= nf_threshold certifies nursing-home level of care", constraints: "0..100" }
      - { name: nf_threshold, type: integer, source: input, default: 60, description: "Minimum nf_score that certifies nursing-home level of care" }
      - { name: assessed_on, type: datetime, source: input, description: "ISO date the clinical assessment was performed" }
      - { name: expires_on, type: datetime, source: computed, description: "assessed_on + Program.loc_validity_days; a CERTIFIED assessment past this date is treated as EXPIRED" }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED | DENIED | EXPIRED | SUPERSEDED", default: "PENDING", constraints: "PENDING | CERTIFIED | DENIED | EXPIRED | SUPERSEDED" }

  - name: CarePlan
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: supersedes_care_plan_id, type: string, source: input, required: false, description: "FK -> CarePlan.id; the prior ACTIVE CarePlan this draft replaces on activation, null for the first plan" }
      - { name: idt_disciplines_signed, type: array, source: system, description: "Set of discipline codes that have signed; subset of {RN, SW, PT, DIETICIAN, MEDICAL_DIRECTOR}" }
      - { name: required_disciplines, type: array, source: input, default: ["RN", "SW", "MEDICAL_DIRECTOR"], description: "Discipline codes whose signatures are mandatory before activation; values from {RN, SW, PT, DIETICIAN, MEDICAL_DIRECTOR}" }
      - { name: goal_count, type: integer, source: computed, description: "Count of CarePlanGoal rows under this plan" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | ACTIVE | REVISION | SUPERSEDED | VOID — cyclic IN_REVIEW/REVISION review loop", default: "DRAFT", constraints: "DRAFT | IN_REVIEW | ACTIVE | REVISION | SUPERSEDED | VOID" }

  - name: CarePlanGoal
    parent: CarePlan
    common_fields: true
    fields:
      - { name: care_plan_id, type: string, source: input, description: "FK -> CarePlan.id" }
      - { name: discipline, type: enum, source: input, description: "Owning discipline: RN | SW | PT | DIETICIAN | MEDICAL_DIRECTOR", constraints: "RN | SW | PT | DIETICIAN | MEDICAL_DIRECTOR" }
      - { name: description, type: string, source: input, description: "Goal narrative" }
      - { name: target_attendance_days, type: integer, source: input, default: 0, description: "Attendance days targeted for this goal", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | MET | DISCONTINUED", default: "OPEN", constraints: "OPEN | MET | DISCONTINUED" }

  - name: AttendanceDay
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: service_date, type: datetime, source: input, description: "ISO date of the attendance day; unique per participant" }
      - { name: meals_provided, type: integer, source: input, default: 1, description: "Meals served this day (drives ancillary meal charge)", constraints: "0..3" }
      - { name: activities_count, type: integer, source: input, default: 0, description: "Therapeutic activities the participant joined" }
      - { name: transport_required, type: boolean, source: input, default: true, description: "Whether program transportation is scheduled for this day" }
      - { name: transport_leg_count, type: integer, source: computed, description: "Count of TransportLeg rows under this day" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }

  - name: TransportLeg
    parent: AttendanceDay
    common_fields: true
    fields:
      - { name: attendance_day_id, type: string, source: input, description: "FK -> AttendanceDay.id" }
      - { name: direction, type: enum, source: input, description: "PICKUP | DROPOFF", constraints: "PICKUP | DROPOFF" }
      - { name: window_start_min, type: integer, source: input, description: "Window start as minutes-from-midnight (0..1439)", constraints: "0..1439" }
      - { name: window_end_min, type: integer, source: input, description: "Window end as minutes-from-midnight; must be > window_start_min, <= 1440", constraints: "1..1440" }
      - { name: vehicle_id, type: string, source: input, description: "Logical vehicle identifier; PLANNED legs on the same vehicle and service_date may not overlap" }
      - { name: status, type: enum, source: system, description: "PLANNED | CANCELLED", default: "PLANNED", constraints: "PLANNED | CANCELLED" }

  - name: MedicationOrder
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: care_plan_id, type: string, source: input, description: "FK -> CarePlan.id; the care plan this order belongs to (must be ACTIVE to activate the order)" }
      - { name: drug_name, type: string, source: input, description: "Medication name" }
      - { name: daily_doses, type: integer, source: input, description: "Scheduled doses per attendance day", constraints: ">= 1" }
      - { name: administered_count, type: integer, source: computed, description: "Count of MedicationAdministration rows with outcome GIVEN under this order" }
      - { name: status, type: enum, source: system, description: "ORDERED | ACTIVE | HELD | DISCONTINUED", default: "ORDERED", constraints: "ORDERED | ACTIVE | HELD | DISCONTINUED" }

  - name: MedicationAdministration
    parent: MedicationOrder
    common_fields: false   # append-only event; carries only id + created_at
    fields:
      - { name: medication_order_id, type: string, source: input, description: "FK -> MedicationOrder.id" }
      - { name: attendance_day_id, type: string, source: input, description: "FK -> AttendanceDay.id; the day the dose was administered (must be CHECKED_IN or COMPLETED)" }
      - { name: outcome, type: enum, source: input, description: "GIVEN | REFUSED | HELD", constraints: "GIVEN | REFUSED | HELD" }
      - { name: administered_at, type: datetime, source: input, description: "ISO timestamp the dose event was recorded" }

  - name: CapitationPayment
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: service_month, type: datetime, source: input, description: "First-of-month date identifying the billed month (ISO date, day == 01); unique per participant" }
      - { name: medicaid_share_cents, type: integer, source: computed, description: "Medicaid portion for the month (0 for non-dual, where the supplement substitutes)" }
      - { name: medicare_share_cents, type: integer, source: computed, description: "Medicare portion for the month" }
      - { name: supplement_cents, type: integer, source: computed, description: "Self-pay supplement for non-dual participants (0 for dual)" }
      - { name: total_billed_cents, type: integer, source: computed, description: "medicaid_share_cents + medicare_share_cents + supplement_cents" }
      - { name: proration_mode, type: enum, source: input, default: "FULL_MONTH", description: "FULL_MONTH (whole member-month, no daily proration) | DAILY (calendar-day proration for partial months)", constraints: "FULL_MONTH | DAILY" }
      - { name: covered_days, type: integer, source: computed, description: "Number of covered calendar days in service_month used by DAILY proration" }
      - { name: reconciled_cents, type: integer, source: computed, description: "Amount confirmed paid after reconciliation: total_billed_cents - recoup_cents" }
      - { name: recoup_cents, type: integer, source: input, default: 0, description: "Amount clawed back at reconciliation (e.g. retroactive disenrollment); 0..total_billed_cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | RECONCILED | VOID", default: "DRAFT", constraints: "DRAFT | FINALIZED | RECONCILED | VOID" }

  - name: DisenrollmentRequest
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: kind, type: enum, source: input, description: "VOLUNTARY (participant-requested) | INVOLUNTARY (program-initiated for cause)", constraints: "VOLUNTARY | INVOLUNTARY" }
      - { name: reason_code, type: enum, source: input, description: "MOVED | DISSATISFIED | DECEASED | LOSS_OF_ELIGIBILITY | NONPAYMENT | DISRUPTIVE | FRAUD", constraints: "MOVED | DISSATISFIED | DECEASED | LOSS_OF_ELIGIBILITY | NONPAYMENT | DISRUPTIVE | FRAUD" }
      - { name: requested_effective_date, type: datetime, source: input, description: "Requested first-of-month disenrollment date (ISO date, day == 01)" }
      - { name: lock_in_penalty_cents, type: integer, source: computed, description: "Penalty assessed when a VOLUNTARY request is finalized inside the lock-in window; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | FINALIZED | DENIED | WITHDRAWN", default: "SUBMITTED", constraints: "SUBMITTED | APPROVED | FINALIZED | DENIED | WITHDRAWN" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Participant
    field: status
    initial_state: APPLICANT
    terminal_states: [DISENROLLED]
    transitions:
      - from: APPLICANT
        to: ELIGIBLE
        trigger: "system (automatic when a LevelOfCareAssessment for this participant transitions to CERTIFIED)"
        actor: system
        preconditions:
          - "Participant.status == APPLICANT"
          - "The certifying assessment's nf_score >= nf_threshold"
        side_effects:
          - "Participant.active_loc_assessment_id := the certified assessment id"
          - "Participant.updated_at refreshed; Participant.version += 1"

      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /pace/participants/{participant_id}/enroll"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.status == ELIGIBLE (ERR_INVALID_STATE)"
          - "Participant.active_loc_assessment_id is non-null and that assessment is CERTIFIED and (clock date <= expires_on) (ERR_LOC_NOT_CERTIFIED)"
          - "Participant.active_care_plan_id is non-null (an ACTIVE CarePlan exists) (ERR_NO_ACTIVE_CARE_PLAN)"
          - "Program.status == OPEN (ERR_PROGRAM_SUSPENDED)"
          - "Program.enrolled_count < Program.max_roster (ERR_CAPACITY_EXCEEDED)"
          - "Participant age at enrollment_effective_date >= 55 years (ERR_AGE_INELIGIBLE)"
          - "enrollment_effective_date day-of-month == 01 (ERR_NOT_FIRST_OF_MONTH)"
        side_effects:
          - "Create Enrollment(status=OPEN, enrollment_effective_date, lock_in_end_date = effective + Program.lock_in_days)"
          - "Participant.active_enrollment_id := new enrollment id; Participant.enrollment_effective_date := effective"
          - "Program.enrolled_count += 1"
          - "Participant.version += 1"

      - from: ENROLLED
        to: DISENROLLMENT_PENDING
        trigger: "POST /pace/disenrollment-requests/{request_id}/approve"
        actor: MedicalDirector
        preconditions:
          - "Participant.status == ENROLLED"
          - "The DisenrollmentRequest being approved targets this participant and is SUBMITTED"
        side_effects:
          - "Participant.version += 1"

      - from: DISENROLLMENT_PENDING
        to: DISENROLLED
        trigger: "POST /pace/disenrollment-requests/{request_id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "Participant.status == DISENROLLMENT_PENDING"
          - "expected_participant_version matches Participant.version (ERR_STALE_VERSION)"
        side_effects:
          - "Enrollment.status := CLOSED; Enrollment.disenrollment_effective_date := request.requested_effective_date"
          - "Cascade: the ACTIVE CarePlan → SUPERSEDED for non-death reasons, or → VOID when reason_code == DECEASED (its non-terminal MedicationOrders → DISCONTINUED in the same cascade)"
          - "Cascade: every SCHEDULED/CHECKED_IN AttendanceDay → CANCELLED (and each such day's PLANNED TransportLeg → CANCELLED)"
          - "If request.kind == VOLUNTARY and requested_effective_date < Enrollment.lock_in_end_date: DisenrollmentRequest.lock_in_penalty_cents computed (calc lock_in_penalty)"
          - "Participant.active_enrollment_id, active_care_plan_id cleared to null; Program.enrolled_count -= 1"
          - "DisenrollmentRequest.status := FINALIZED; Participant.version += 1"

      - from: DISENROLLMENT_PENDING
        to: ENROLLED
        trigger: "POST /pace/disenrollment-requests/{request_id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Participant.status == DISENROLLMENT_PENDING"
          - "The DisenrollmentRequest is APPROVED and kind == VOLUNTARY (an INVOLUNTARY request cannot be withdrawn; ERR_WITHDRAW_NOT_ALLOWED)"
        side_effects:
          - "DisenrollmentRequest.status := WITHDRAWN"
          - "Participant returns to ENROLLED; Participant.version += 1"

  - entity: LevelOfCareAssessment
    field: status
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /pace/loc-assessments/{assessment_id}/certify"
        actor: MedicalDirector
        preconditions:
          - "LevelOfCareAssessment.status == PENDING (ERR_INVALID_STATE)"
          - "nf_score >= nf_threshold (ERR_LOC_BELOW_THRESHOLD)"
        side_effects:
          - "expires_on := assessed_on + Program.loc_validity_days"
          - "If a prior CERTIFIED assessment exists for the participant, it → SUPERSEDED"
          - "Participant.active_loc_assessment_id := this assessment id"
          - "If Participant.status == APPLICANT: Participant → ELIGIBLE (bubble-up; Participant.version += 1)"
        note: "Segregation of duties: only MedicalDirector certifies LOC; IntakeCoordinator may create the assessment but may not certify it."

      - from: PENDING
        to: DENIED
        trigger: "POST /pace/loc-assessments/{assessment_id}/deny"
        actor: MedicalDirector
        preconditions:
          - "LevelOfCareAssessment.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "No participant state change"

      - from: CERTIFIED
        to: EXPIRED
        trigger: "system (automatic when clock date > expires_on, evaluated at enroll-time and capitation-finalize-time)"
        actor: system
        preconditions:
          - "LevelOfCareAssessment.status == CERTIFIED"
          - "clock date > expires_on"
        side_effects:
          - "Treated as not-certified for enrollment and capitation gating while no newer CERTIFIED assessment exists"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system (automatic when a newer assessment for the same participant is CERTIFIED)"
        actor: system
        preconditions:
          - "LevelOfCareAssessment.status == CERTIFIED"
        side_effects: []

  - entity: CarePlan
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /pace/care-plans/{care_plan_id}/submit"
        actor: IntakeCoordinator
        preconditions:
          - "CarePlan.status == DRAFT (ERR_INVALID_STATE)"
          - "goal_count >= 1 (ERR_CARE_PLAN_NO_GOALS)"
        side_effects: []

      - from: IN_REVIEW
        to: REVISION
        trigger: "POST /pace/care-plans/{care_plan_id}/request-revision"
        actor: MedicalDirector
        preconditions:
          - "CarePlan.status == IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "idt_disciplines_signed cleared to [] (revision invalidates prior signatures)"

      - from: REVISION
        to: IN_REVIEW
        trigger: "POST /pace/care-plans/{care_plan_id}/submit"
        actor: IntakeCoordinator
        preconditions:
          - "CarePlan.status == REVISION (ERR_INVALID_STATE)"
          - "goal_count >= 1 (ERR_CARE_PLAN_NO_GOALS)"
        side_effects: []
        note: "Cyclic revision loop: IN_REVIEW → REVISION → IN_REVIEW may repeat any number of times"

      - from: IN_REVIEW
        to: ACTIVE
        trigger: "POST /pace/care-plans/{care_plan_id}/activate"
        actor: MedicalDirector
        preconditions:
          - "CarePlan.status == IN_REVIEW (ERR_INVALID_STATE)"
          - "Every discipline in required_disciplines is present in idt_disciplines_signed (ERR_IDT_INCOMPLETE)"
        side_effects:
          - "Cascade: the prior Participant.active_care_plan_id (if any, and different) → SUPERSEDED, and that prior plan's MedicationOrders in {ORDERED, ACTIVE, HELD} → DISCONTINUED"
          - "Participant.active_care_plan_id := this plan id; Participant.version += 1"
        note: "Activation supersedes the prior active plan in one step (cross-entity cascade onto Participant and the prior plan's orders)"

      - from: ACTIVE
        to: REVISION
        trigger: "POST /pace/care-plans/{care_plan_id}/request-revision"
        actor: MedicalDirector
        preconditions:
          - "CarePlan.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Plan remains the participant's active plan during revision; idt_disciplines_signed cleared to []"

      - from: DRAFT
        to: VOID
        trigger: "POST /pace/care-plans/{care_plan_id}/void"
        actor: IntakeCoordinator
        preconditions:
          - "CarePlan.status in {DRAFT, IN_REVIEW, REVISION} (ERR_INVALID_STATE)"
          - "CarePlan.id != Participant.active_care_plan_id (ERR_CANNOT_VOID_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a superseding CarePlan is activated, or on disenrollment finalize for a non-death reason)"
        actor: system
        preconditions:
          - "CarePlan.status == ACTIVE"
        side_effects:
          - "Cascade: this plan's MedicationOrders in {ORDERED, ACTIVE, HELD} → DISCONTINUED"

      - from: ACTIVE
        to: VOID
        trigger: "system (automatic on disenrollment finalize when reason_code == DECEASED)"
        actor: system
        preconditions:
          - "CarePlan.status == ACTIVE"
        side_effects:
          - "Cascade: this plan's MedicationOrders in {ORDERED, ACTIVE, HELD} → DISCONTINUED"

  - entity: AttendanceDay
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /pace/attendance-days/{day_id}/check-in"
        actor: NurseStaff
        preconditions:
          - "AttendanceDay.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Participant.status == ENROLLED (ERR_PARTICIPANT_NOT_ENROLLED)"
          - "Count of AttendanceDay in status CHECKED_IN for this program on this service_date < Program.daily_census_capacity (ERR_CENSUS_FULL)"
        side_effects: []

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /pace/attendance-days/{day_id}/complete"
        actor: NurseStaff
        preconditions:
          - "AttendanceDay.status == CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "Participant.lifetime_attendance_days += 1"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /pace/attendance-days/{day_id}/no-show"
        actor: NurseStaff
        preconditions:
          - "AttendanceDay.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: all PLANNED TransportLeg under this day → CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pace/attendance-days/{day_id}/cancel"
        actor: NurseStaff
        preconditions:
          - "AttendanceDay.status in {SCHEDULED, CHECKED_IN} (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: all PLANNED TransportLeg under this day → CANCELLED"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (automatic on disenrollment finalize, for any SCHEDULED/CHECKED_IN day)"
        actor: system
        preconditions:
          - "AttendanceDay.status in {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "Cascade: all PLANNED TransportLeg under this day → CANCELLED"

  - entity: MedicationOrder
    field: status
    initial_state: ORDERED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ORDERED
        to: ACTIVE
        trigger: "POST /pace/medication-orders/{order_id}/activate"
        actor: NurseStaff
        preconditions:
          - "MedicationOrder.status == ORDERED (ERR_INVALID_STATE)"
          - "The order's care_plan_id references a CarePlan in status ACTIVE (ERR_CARE_PLAN_NOT_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: HELD
        trigger: "POST /pace/medication-orders/{order_id}/hold"
        actor: NurseStaff
        preconditions:
          - "MedicationOrder.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

      - from: HELD
        to: ACTIVE
        trigger: "POST /pace/medication-orders/{order_id}/resume"
        actor: NurseStaff
        preconditions:
          - "MedicationOrder.status == HELD (ERR_INVALID_STATE)"
          - "The order's care_plan_id references a CarePlan in status ACTIVE (ERR_CARE_PLAN_NOT_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /pace/medication-orders/{order_id}/discontinue"
        actor: NurseStaff
        preconditions:
          - "MedicationOrder.status in {ORDERED, ACTIVE, HELD} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: CapitationPayment
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /pace/capitation-payments/{payment_id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "CapitationPayment.status == DRAFT (ERR_INVALID_STATE)"
          - "Program.status == OPEN (ERR_PROGRAM_SUSPENDED)"
          - "Participant had an Enrollment covering >= 1 calendar day of service_month (ERR_NO_COVERAGE_FOR_MONTH)"
          - "Participant.active_loc_assessment_id is CERTIFIED and (first day of service_month <= expires_on) (ERR_LOC_NOT_CERTIFIED)"
          - "expected_participant_version matches Participant.version (ERR_STALE_VERSION)"
        side_effects:
          - "total_billed_cents and component shares computed (calc capitation_amount)"
          - "Participant.ledger_billed_cents += total_billed_cents"
          - "Participant.version += 1"

      - from: FINALIZED
        to: RECONCILED
        trigger: "POST /pace/capitation-payments/{payment_id}/reconcile"
        actor: BillingSpecialist
        preconditions:
          - "CapitationPayment.status == FINALIZED (ERR_INVALID_STATE)"
          - "recoup_cents <= total_billed_cents (ERR_RECOUP_EXCEEDS_BILLED)"
        side_effects:
          - "reconciled_cents := total_billed_cents - recoup_cents"
          - "Participant.ledger_reconciled_cents += reconciled_cents"

      - from: DRAFT
        to: VOID
        trigger: "POST /pace/capitation-payments/{payment_id}/void"
        actor: BillingSpecialist
        preconditions:
          - "CapitationPayment.status in {DRAFT, FINALIZED} (ERR_INVALID_STATE)"
        side_effects:
          - "If status was FINALIZED: Participant.ledger_billed_cents -= total_billed_cents (compensation; ledger returns to pre-finalize value)"

      - from: FINALIZED
        to: VOID
        trigger: "POST /pace/capitation-payments/{payment_id}/void"
        actor: BillingSpecialist
        preconditions:
          - "CapitationPayment.status in {DRAFT, FINALIZED} (ERR_INVALID_STATE)"
        side_effects:
          - "Participant.ledger_billed_cents -= total_billed_cents (compensation)"

  - entity: DisenrollmentRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [FINALIZED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pace/disenrollment-requests/{request_id}/approve"
        actor: MedicalDirector
        preconditions:
          - "DisenrollmentRequest.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Participant.status == ENROLLED (ERR_PARTICIPANT_NOT_ENROLLED)"
        side_effects:
          - "Participant.status → DISENROLLMENT_PENDING; Participant.version += 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pace/disenrollment-requests/{request_id}/deny"
        actor: MedicalDirector
        preconditions:
          - "DisenrollmentRequest.status == SUBMITTED (ERR_INVALID_STATE)"
          - "DisenrollmentRequest.kind == VOLUNTARY (an INVOLUNTARY for-cause request cannot be denied; ERR_INVOLUNTARY_CANNOT_DENY)"
        side_effects: []
        note: "Branching fork: SUBMITTED forks to APPROVED (proceed) or DENIED (reject); only VOLUNTARY may be denied"

      - from: APPROVED
        to: FINALIZED
        trigger: "POST /pace/disenrollment-requests/{request_id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "DisenrollmentRequest.status == APPROVED (ERR_INVALID_STATE)"
          - "Participant.status == DISENROLLMENT_PENDING (ERR_PARTICIPANT_NOT_ENROLLED)"
          - "expected_participant_version matches Participant.version (ERR_STALE_VERSION)"
        side_effects:
          - "Drives Participant DISENROLLMENT_PENDING → DISENROLLED with full cascade (see Participant SM)"
          - "lock_in_penalty_cents computed when VOLUNTARY and requested_effective_date < lock_in_end_date"

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /pace/disenrollment-requests/{request_id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "DisenrollmentRequest.status == APPROVED (ERR_INVALID_STATE)"
          - "DisenrollmentRequest.kind == VOLUNTARY (ERR_WITHDRAW_NOT_ALLOWED)"
        side_effects:
          - "Participant returns DISENROLLMENT_PENDING → ENROLLED; Participant.version += 1"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: capitation-finalize-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /pace/capitation-payments/{payment_id}/finalize"
    occ_field: "expected_participant_version"
    description: |
      Finalizing a CapitationPayment against a Participant whose version has
      advanced since the client last observed it is rejected. A prior finalize
      for another month (or an enroll/disenroll cascade) already bumped
      Participant.version and moved ledger_billed_cents, so a finalize carrying
      the stale version would debit an out-of-date ledger snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disenroll-finalize-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /pace/disenrollment-requests/{request_id}/finalize"
    occ_field: "expected_participant_version"
    description: |
      Finalizing a DisenrollmentRequest against a Participant whose version has
      advanced (e.g. a capitation finalize landed first and bumped the version)
      since the client read it is rejected. The disenrollment cascade closes the
      enrollment and recomputes the ledger, so a stale-version finalize would
      cascade against a Participant snapshot that no longer reflects the latest
      billed state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: capitation_amount
    trigger: "CapitationPayment finalize (DRAFT → FINALIZED)"
    algorithm: tiered_pricing
    formula: |
      # Member-month capitation with two proration modes and a dual/non-dual split.
      # days_in_month = calendar days in service_month (28/29/30/31).
      # covered_days  = count of calendar days d in service_month such that the
      #   participant's Enrollment window covers d, i.e.
      #   enrollment_effective_date <= d AND (disenrollment_effective_date is null
      #   OR d < disenrollment_effective_date). The disenrollment effective date
      #   itself is NOT covered (half-open interval [effective, disenroll)).
      #
      # Fixed evaluation order: (1) compute covered_days; (2) select the three
      # bases; (3) apply the proration factor to each base; (4) round EACH
      # component independently to whole cents with round_half_up; (5) sum the
      # three rounded components. (round-per-component, NOT sum-then-round.)
      #
      # if proration_mode == FULL_MONTH: factor = 1            # whole member-month
      # else (DAILY):                    factor = covered_days / days_in_month
      #
      # medicare_base = Program.medicare_monthly_rate_cents
      # if dual_eligible:
      #     medicaid_base   = Program.medicaid_monthly_rate_cents
      #     supplement_base = 0
      # else:
      #     medicaid_base   = 0
      #     supplement_base = Program.medicaid_monthly_rate_cents + Program.medicare_only_supplement_cents
      #
      # medicare_share_cents = round_half_up(medicare_base  * factor)
      # medicaid_share_cents = round_half_up(medicaid_base  * factor)
      # supplement_cents     = round_half_up(supplement_base * factor)
      # total_billed_cents   = medicare_share_cents + medicaid_share_cents + supplement_cents
    input_set: "Program rate fields; Participant.dual_eligible; the participant's Enrollment window intersected with service_month"
    constants:
      ROUND_MODE: round_half_up
    precision: "whole cents; each component rounded independently THEN summed"
    variants:
      - name: full_month
        when: "proration_mode == FULL_MONTH"
        difference: "factor fixed at 1; the whole member-month is billed regardless of covered_days (>= 1 covered day still required to finalize)"
      - name: daily_proration
        when: "proration_mode == DAILY"
        difference: "factor = covered_days / days_in_month applied to each base before independent rounding"

  - name: lock_in_penalty
    trigger: "DisenrollmentRequest finalize when kind == VOLUNTARY"
    algorithm: threshold
    formula: |
      # Lock-in penalty for a VOLUNTARY disenrollment that takes effect before the
      # enrollment's lock_in_end_date.
      # finalize_date    = DisenrollmentRequest.requested_effective_date.
      # lock_in_end_date = Enrollment.enrollment_effective_date + Program.lock_in_days.
      #
      # if kind != VOLUNTARY:                  lock_in_penalty_cents = 0
      # elif finalize_date >= lock_in_end_date: lock_in_penalty_cents = 0   # boundary: ON the end date => no penalty (>=)
      # else:
      #   remaining_days = (lock_in_end_date - finalize_date) in whole calendar days   # strictly positive here
      #   # one medicare member-month prorated by the unserved fraction of the lock-in window
      #   lock_in_penalty_cents = round_half_up(
      #       Program.medicare_monthly_rate_cents * remaining_days / Program.lock_in_days)
    input_set: "Enrollment.lock_in_end_date, DisenrollmentRequest.requested_effective_date, Program.medicare_monthly_rate_cents, Program.lock_in_days"
    constants:
      ROUND_MODE: round_half_up
    precision: "whole cents, round_half_up"
    note: "Boundary precision: finalize ON lock_in_end_date => penalty 0 (>=); one day earlier => penalty > 0"

  - name: ancillary_meal_charge
    trigger: "GET /pace/participants/{participant_id}/attendance-summary (computed read over COMPLETED days)"
    algorithm: aggregation
    formula: |
      # Per-completed-day ancillary charge, summed over a service month.
      # Only AttendanceDay rows with status == COMPLETED whose service_date falls
      # in the queried month are included; SCHEDULED, CHECKED_IN, NO_SHOW, and
      # CANCELLED days are excluded.
      # day_charge = meals_provided * MEAL_CHARGE_CENTS
      #            + (0 if activities_count == 0 else ACTIVITY_BONUS_CENTS)   # flat per day, NOT per activity
      # month_ancillary_cents = sum(day_charge over the included COMPLETED days)
      # completed_days = count of the included COMPLETED days
    input_set: "AttendanceDay rows for the participant with status == COMPLETED and service_date in the queried month"
    constants:
      MEAL_CHARGE_CENTS: 850
      ACTIVITY_BONUS_CENTS: 200
    precision: "whole cents (integer arithmetic); order-independent sum"
    note: "Activity bonus is flat per day when activities_count > 0; zero activities => no bonus; it is NOT ACTIVITY_BONUS_CENTS * activities_count"

  - name: idt_completeness
    trigger: "CarePlan activate (IN_REVIEW → ACTIVE)"
    algorithm: aggregation
    formula: |
      # required_disciplines and idt_disciplines_signed are both sets of codes.
      # complete = (required_disciplines is a subset of idt_disciplines_signed)
      # Extra signatures beyond required are allowed and never block activation.
      # Activation is rejected with ERR_IDT_INCOMPLETE iff complete == false.
    input_set: "CarePlan.required_disciplines, CarePlan.idt_disciplines_signed"
    precision: "exact set membership"

  - name: census_occupancy
    trigger: "AttendanceDay check-in (SCHEDULED → CHECKED_IN)"
    algorithm: aggregation
    formula: |
      # occupancy = count of AttendanceDay rows belonging to this Program with
      #   status == CHECKED_IN and the SAME service_date as the day being checked in.
      # Check-in is rejected with ERR_CENSUS_FULL iff occupancy >= Program.daily_census_capacity.
      #   (boundary: at exactly capacity the next check-in is rejected; '>=').
      # COMPLETED days do NOT count toward live census (participant has departed).
    input_set: "AttendanceDay rows for the program with status == CHECKED_IN on the target service_date"
    constants: {}
    precision: "integer count"
    note: "Boundary precision: occupancy == capacity rejects; occupancy == capacity-1 admits"

  - name: participant_ledger
    trigger: "CapitationPayment finalize/void/reconcile; AttendanceDay complete; disenrollment finalize"
    algorithm: aggregation
    formula: |
      # Derived-field reconciliation on Participant, kept consistent with children.
      # ledger_billed_cents      = sum(total_billed_cents) over CapitationPayment in status FINALIZED
      # ledger_reconciled_cents  = sum(reconciled_cents)    over CapitationPayment in status RECONCILED
      # lifetime_attendance_days = count(AttendanceDay with status == COMPLETED)
      # On void of a FINALIZED payment that payment leaves the FINALIZED set, so
      #   ledger_billed_cents returns exactly to its pre-finalize value (no drift).
    input_set: "CapitationPayment rows by status; AttendanceDay rows by status"
    precision: "whole cents / integer count"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources exist, validated left-to-right (path id first, then FK-body references)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Request body well-formed; required fields present and correctly typed; enum values legal; integers within declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Program is OPEN (not SUSPENDED) for enroll and capitation finalize"
    error_id: ERR_PROGRAM_SUSPENDED
    http_status: 409
    applies_to: "POST enroll, POST capitation finalize"

  - priority: 7
    category: state
    check: "Participant is ENROLLED for attendance check-in and disenrollment approval (DISENROLLMENT_PENDING for finalize)"
    error_id: ERR_PARTICIPANT_NOT_ENROLLED
    http_status: 409
    applies_to: "POST check-in, POST disenrollment approve, POST disenrollment finalize"

  - priority: 8
    category: business_safety
    check: "Level-of-care assessment is CERTIFIED and not EXPIRED at the gating date (enroll: clock now; capitation finalize: first day of service_month)"
    error_id: ERR_LOC_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST enroll, POST capitation finalize"

  - priority: 9
    category: business_safety
    check: "nf_score >= nf_threshold to certify level of care"
    error_id: ERR_LOC_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST loc-assessments certify"

  - priority: 10
    category: business_safety
    check: "Participant has an ACTIVE care plan (active_care_plan_id non-null) before enrollment"
    error_id: ERR_NO_ACTIVE_CARE_PLAN
    http_status: 409
    applies_to: "POST enroll"

  - priority: 11
    category: business_safety
    check: "Every required IDT discipline has signed before care-plan activation"
    error_id: ERR_IDT_INCOMPLETE
    http_status: 409
    applies_to: "POST care-plan activate"

  - priority: 12
    category: business_safety
    check: "Care plan must have >= 1 goal before submission for review"
    error_id: ERR_CARE_PLAN_NO_GOALS
    http_status: 409
    applies_to: "POST care-plan submit"

  - priority: 13
    category: business_safety
    check: "Medication order's care_plan must be ACTIVE before order activate/resume; a med-administration's day must be CHECKED_IN or COMPLETED"
    error_id: ERR_CARE_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST med-order activate, POST med-order resume, POST med-administration"

  - priority: 14
    category: business_referential
    check: "A care plan may not be voided while it is the participant's active care plan"
    error_id: ERR_CANNOT_VOID_ACTIVE
    http_status: 409
    applies_to: "POST care-plan void"

  - priority: 15
    category: business_referential
    check: "An INVOLUNTARY disenrollment request cannot be withdrawn"
    error_id: ERR_WITHDRAW_NOT_ALLOWED
    http_status: 409
    applies_to: "POST disenrollment withdraw"

  - priority: 16
    category: business_referential
    check: "An INVOLUNTARY (for-cause) disenrollment request cannot be DENIED"
    error_id: ERR_INVOLUNTARY_CANNOT_DENY
    http_status: 409
    applies_to: "POST disenrollment deny"

  - priority: 17
    category: business_temporal
    check: "Enrollment effective date must be first-of-month (day == 01). Disenrollment requested_effective_date may be any calendar date (mid-month allowed; a death/move date is rarely first-of-month) and DAILY proration uses it directly."
    error_id: ERR_NOT_FIRST_OF_MONTH
    http_status: 422
    applies_to: "POST enroll"

  - priority: 18
    category: business_temporal
    check: "Participant must be >= 55 years old at enrollment_effective_date"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST enroll"

  - priority: 19
    category: business_temporal
    check: "Transport leg window_end_min > window_start_min and both within 0..1440"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST transport-legs"

  - priority: 20
    category: business_constraint
    check: "A transport leg may not overlap another PLANNED leg on the same vehicle and service_date (half-open [start,end) intervals; touching endpoints allowed)"
    error_id: ERR_TRANSPORT_OVERLAP
    http_status: 409
    applies_to: "POST transport-legs"

  - priority: 21
    category: business_constraint
    check: "service_date unique per participant for AttendanceDay; service_month unique per participant for CapitationPayment"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST attendance-days, POST capitation-payments"

  - priority: 22
    category: business_constraint
    check: "Daily live census not exceeded at check-in (CHECKED_IN count on date < capacity)"
    error_id: ERR_CENSUS_FULL
    http_status: 409
    applies_to: "POST attendance-day check-in"

  - priority: 23
    category: business_constraint
    check: "Program enrolled_count below max_roster at enroll"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST enroll"

  - priority: 24
    category: business_fiscal
    check: "Capitation finalize requires Enrollment coverage of >= 1 calendar day in service_month"
    error_id: ERR_NO_COVERAGE_FOR_MONTH
    http_status: 409
    applies_to: "POST capitation finalize"

  - priority: 25
    category: business_fiscal
    check: "Reconciliation recoup_cents may not exceed total_billed_cents"
    error_id: ERR_RECOUP_EXCEEDS_BILLED
    http_status: 422
    applies_to: "POST capitation reconcile"

  - priority: 26
    category: concurrency
    check: "expected_participant_version must match Participant.version on capitation finalize and disenrollment finalize (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST capitation finalize, POST disenrollment finalize"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (flat addressing under /pace)
# =============================================================================
endpoints:
  # --- Program ---
  - method: POST
    path: "/pace/programs"
    description: "Create a PACE program/center"
    roles: [ProgramAdmin]
    code: 201
    input: [name, state_code, daily_census_capacity, max_roster, medicaid_monthly_rate_cents, medicare_monthly_rate_cents, "medicare_only_supplement_cents?", "lock_in_days?", "loc_validity_days?"]
    output: Program
    side_effects: ["status=OPEN, enrolled_count=0, version=1"]

  - method: GET
    path: "/pace/programs/{program_id}"
    description: "Get a program"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/pace/programs/{program_id}/suspend"
    description: "Suspend a program (blocks new enroll + capitation finalize)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/pace/programs/{program_id}/reopen"
    description: "Reopen a suspended program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → OPEN"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the server's current UTC instant used by time-gated logic (LOC expiry, lock-in window, age)"
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock fixed to to_iso8601 for subsequent requests"]

  # --- Participant ---
  - method: POST
    path: "/pace/participants"
    description: "Create a participant (applicant)"
    roles: [IntakeCoordinator]
    code: 201
    input: [program_id, full_name, date_of_birth, dual_eligible]
    output: Participant
    side_effects: ["status=APPLICANT; ledger fields=0; version=1"]

  - method: GET
    path: "/pace/participants/{participant_id}"
    description: "Get a participant"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/pace/participants"
    description: "List participants (filterable by program_id, status, and active_* FK references)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["program_id?", "status?", "active_loc_assessment_id?", "active_care_plan_id?", "active_enrollment_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: POST
    path: "/pace/participants/{participant_id}/enroll"
    description: "Enroll an ELIGIBLE participant (first-of-month effective)"
    roles: [IntakeCoordinator]
    code: 200
    input: [enrollment_effective_date]
    output: Participant
    side_effects:
      - "Participant.status → ENROLLED; create Enrollment(OPEN); Program.enrolled_count += 1; Participant.version += 1"

  - method: GET
    path: "/pace/participants/{participant_id}/attendance-summary"
    description: "Computed read: ancillary meal/activity charge over a service month (calc ancillary_meal_charge)"
    roles: [ProgramAdmin, BillingSpecialist, IntakeCoordinator]
    code: 200
    input: [service_month]
    output: "{ service_month: datetime, completed_days: integer, month_ancillary_cents: integer }"
    side_effects: []

  # --- Enrollment ---
  - method: GET
    path: "/pace/enrollments/{enrollment_id}"
    description: "Get an enrollment"
    roles: [ProgramAdmin, IntakeCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/pace/enrollments"
    description: "List enrollments (filterable by participant_id)"
    roles: [ProgramAdmin, IntakeCoordinator, BillingSpecialist]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # --- Level of Care ---
  - method: POST
    path: "/pace/loc-assessments"
    description: "Create a level-of-care assessment (PENDING)"
    roles: [MedicalDirector, IntakeCoordinator]
    code: 201
    input: [participant_id, nf_score, assessed_on, "nf_threshold?"]
    output: LevelOfCareAssessment
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/pace/loc-assessments/{assessment_id}"
    description: "Get a level-of-care assessment"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: LevelOfCareAssessment
    side_effects: []

  - method: GET
    path: "/pace/loc-assessments"
    description: "List level-of-care assessments (filterable by participant_id, status)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, BillingSpecialist]
    code: 200
    input: ["participant_id?", "status?"]
    output: LevelOfCareAssessment[]
    side_effects: []

  - method: POST
    path: "/pace/loc-assessments/{assessment_id}/certify"
    description: "Certify nursing-home level of care (segregation: MedicalDirector only)"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: LevelOfCareAssessment
    side_effects:
      - "status → CERTIFIED; expires_on set; prior CERTIFIED → SUPERSEDED; Participant.active_loc_assessment_id set; APPLICANT → ELIGIBLE"

  - method: POST
    path: "/pace/loc-assessments/{assessment_id}/deny"
    description: "Deny a level-of-care assessment"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: LevelOfCareAssessment
    side_effects: ["status → DENIED"]

  # --- Care Plan ---
  - method: POST
    path: "/pace/care-plans"
    description: "Create a care plan draft"
    roles: [IntakeCoordinator]
    code: 201
    input: [participant_id, "supersedes_care_plan_id?", "required_disciplines?"]
    output: CarePlan
    side_effects: ["status=DRAFT; idt_disciplines_signed=[]; goal_count=0"]

  - method: GET
    path: "/pace/care-plans/{care_plan_id}"
    description: "Get a care plan"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: GET
    path: "/pace/care-plans"
    description: "List care plans (filterable by participant_id, supersedes_care_plan_id, status)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["participant_id?", "supersedes_care_plan_id?", "status?"]
    output: CarePlan[]
    side_effects: []

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/goals"
    description: "Add a goal to a care plan"
    roles: [IntakeCoordinator, MedicalDirector]
    code: 201
    input: [discipline, description, "target_attendance_days?"]
    output: CarePlanGoal
    side_effects: ["CarePlan.goal_count += 1"]

  - method: GET
    path: "/pace/care-plan-goals/{goal_id}"
    description: "Get a care plan goal"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: CarePlanGoal
    side_effects: []

  - method: GET
    path: "/pace/care-plan-goals"
    description: "List care plan goals (filterable by care_plan_id)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["care_plan_id?", "status?"]
    output: CarePlanGoal[]
    side_effects: []

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/sign"
    description: "Record an IDT discipline signature on a care plan"
    roles: [MedicalDirector, NurseStaff, IntakeCoordinator]
    code: 200
    input: [discipline]
    output: CarePlan
    side_effects: ["discipline added to idt_disciplines_signed (idempotent set add)"]

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/submit"
    description: "Submit a care plan for IDT review (DRAFT/REVISION → IN_REVIEW)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status → IN_REVIEW"]

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/request-revision"
    description: "Send a care plan back for revision (IN_REVIEW/ACTIVE → REVISION; clears signatures)"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status → REVISION; idt_disciplines_signed cleared to []"]

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/activate"
    description: "Activate a reviewed care plan; supersedes the prior active plan"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: CarePlan
    side_effects:
      - "status → ACTIVE; prior active plan → SUPERSEDED (its meds → DISCONTINUED); Participant.active_care_plan_id set; Participant.version += 1"

  - method: POST
    path: "/pace/care-plans/{care_plan_id}/void"
    description: "Void a non-active draft/review care plan"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status → VOID"]

  # --- Attendance ---
  - method: POST
    path: "/pace/attendance-days"
    description: "Schedule an attendance day for a participant"
    roles: [IntakeCoordinator, NurseStaff]
    code: 201
    input: [participant_id, service_date, "meals_provided?", "activities_count?", "transport_required?"]
    output: AttendanceDay
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/pace/attendance-days/{day_id}"
    description: "Get an attendance day"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: AttendanceDay
    side_effects: []

  - method: GET
    path: "/pace/attendance-days"
    description: "List attendance days (filterable by participant_id, status)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: AttendanceDay[]
    side_effects: []

  - method: POST
    path: "/pace/attendance-days/{day_id}/check-in"
    description: "Check a participant in for the day (census-gated)"
    roles: [NurseStaff]
    code: 200
    input: []
    output: AttendanceDay
    side_effects: ["status → CHECKED_IN"]

  - method: POST
    path: "/pace/attendance-days/{day_id}/complete"
    description: "Complete a checked-in attendance day"
    roles: [NurseStaff]
    code: 200
    input: []
    output: AttendanceDay
    side_effects: ["status → COMPLETED; Participant.lifetime_attendance_days += 1"]

  - method: POST
    path: "/pace/attendance-days/{day_id}/no-show"
    description: "Mark a scheduled day as no-show"
    roles: [NurseStaff]
    code: 200
    input: []
    output: AttendanceDay
    side_effects: ["status → NO_SHOW; PLANNED transport legs → CANCELLED"]

  - method: POST
    path: "/pace/attendance-days/{day_id}/cancel"
    description: "Cancel a scheduled or checked-in day"
    roles: [NurseStaff, IntakeCoordinator]
    code: 200
    input: []
    output: AttendanceDay
    side_effects: ["status → CANCELLED; PLANNED transport legs → CANCELLED"]

  # --- Transport ---
  - method: POST
    path: "/pace/transport-legs"
    description: "Add a transport leg to an attendance day"
    roles: [IntakeCoordinator, NurseStaff]
    code: 201
    input: [attendance_day_id, direction, window_start_min, window_end_min, vehicle_id]
    output: TransportLeg
    side_effects: ["status=PLANNED; AttendanceDay.transport_leg_count += 1"]

  - method: GET
    path: "/pace/transport-legs/{leg_id}"
    description: "Get a transport leg"
    roles: [ProgramAdmin, IntakeCoordinator, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: TransportLeg
    side_effects: []

  - method: GET
    path: "/pace/transport-legs"
    description: "List transport legs (filterable by attendance_day_id)"
    roles: [ProgramAdmin, IntakeCoordinator, NurseStaff, BillingSpecialist]
    code: 200
    input: ["attendance_day_id?", "status?"]
    output: TransportLeg[]
    side_effects: []

  # --- Medication ---
  - method: POST
    path: "/pace/medication-orders"
    description: "Create a medication order against a care plan"
    roles: [MedicalDirector, NurseStaff]
    code: 201
    input: [participant_id, care_plan_id, drug_name, daily_doses]
    output: MedicationOrder
    side_effects: ["status=ORDERED"]

  - method: GET
    path: "/pace/medication-orders/{order_id}"
    description: "Get a medication order"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: []

  - method: GET
    path: "/pace/medication-orders"
    description: "List medication orders (filterable by participant_id, care_plan_id, status)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["participant_id?", "care_plan_id?", "status?"]
    output: MedicationOrder[]
    side_effects: []

  - method: POST
    path: "/pace/medication-orders/{order_id}/activate"
    description: "Activate a medication order (care plan must be ACTIVE)"
    roles: [NurseStaff]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/pace/medication-orders/{order_id}/hold"
    description: "Hold an active medication order"
    roles: [NurseStaff]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status → HELD"]

  - method: POST
    path: "/pace/medication-orders/{order_id}/resume"
    description: "Resume a held medication order (care plan must be ACTIVE)"
    roles: [NurseStaff]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/pace/medication-orders/{order_id}/discontinue"
    description: "Discontinue a medication order"
    roles: [NurseStaff, MedicalDirector]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status → DISCONTINUED"]

  - method: POST
    path: "/pace/medication-administrations"
    description: "Record a medication administration event"
    roles: [NurseStaff]
    code: 201
    input: [medication_order_id, attendance_day_id, outcome, administered_at]
    output: MedicationAdministration
    side_effects: ["If outcome==GIVEN: MedicationOrder.administered_count += 1"]

  - method: GET
    path: "/pace/medication-administrations/{administration_id}"
    description: "Get a medication administration event"
    roles: [ProgramAdmin, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: []
    output: MedicationAdministration
    side_effects: []

  - method: GET
    path: "/pace/medication-administrations"
    description: "List medication administration events (filterable by medication_order_id, attendance_day_id)"
    roles: [ProgramAdmin, MedicalDirector, NurseStaff, BillingSpecialist]
    code: 200
    input: ["medication_order_id?", "attendance_day_id?", "outcome?"]
    output: MedicationAdministration[]
    side_effects: []

  # --- Capitation ---
  - method: POST
    path: "/pace/capitation-payments"
    description: "Create a draft capitation payment for a service month"
    roles: [BillingSpecialist]
    code: 201
    input: [participant_id, service_month, "proration_mode?"]
    output: CapitationPayment
    side_effects: ["status=DRAFT; component shares computed at finalize-time"]

  - method: GET
    path: "/pace/capitation-payments/{payment_id}"
    description: "Get a capitation payment"
    roles: [ProgramAdmin, BillingSpecialist, IntakeCoordinator]
    code: 200
    input: []
    output: CapitationPayment
    side_effects: []

  - method: GET
    path: "/pace/capitation-payments"
    description: "List capitation payments (filterable by participant_id, status)"
    roles: [ProgramAdmin, BillingSpecialist, IntakeCoordinator]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: CapitationPayment[]
    side_effects: []

  - method: POST
    path: "/pace/capitation-payments/{payment_id}/finalize"
    description: "Finalize a draft capitation payment (computes shares, debits ledger; OCC on participant)"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_participant_version]
    output: CapitationPayment
    side_effects:
      - "shares computed; status → FINALIZED; Participant.ledger_billed_cents += total_billed_cents; Participant.version += 1"

  - method: POST
    path: "/pace/capitation-payments/{payment_id}/reconcile"
    description: "Reconcile a finalized payment with an optional recoup"
    roles: [BillingSpecialist]
    code: 200
    input: ["recoup_cents?"]
    output: CapitationPayment
    side_effects: ["reconciled_cents computed; status → RECONCILED; Participant.ledger_reconciled_cents += reconciled_cents"]

  - method: POST
    path: "/pace/capitation-payments/{payment_id}/void"
    description: "Void a draft or finalized payment (compensates ledger)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: CapitationPayment
    side_effects: ["status → VOID; if was FINALIZED: Participant.ledger_billed_cents -= total_billed_cents"]

  # --- Disenrollment ---
  - method: POST
    path: "/pace/disenrollment-requests"
    description: "Submit a voluntary or involuntary disenrollment request"
    roles: [IntakeCoordinator, MedicalDirector, ProgramAdmin]
    code: 201
    input: [participant_id, kind, reason_code, requested_effective_date]
    output: DisenrollmentRequest
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/pace/disenrollment-requests/{request_id}"
    description: "Get a disenrollment request"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, BillingSpecialist]
    code: 200
    input: []
    output: DisenrollmentRequest
    side_effects: []

  - method: GET
    path: "/pace/disenrollment-requests"
    description: "List disenrollment requests (filterable by participant_id, kind, status)"
    roles: [ProgramAdmin, IntakeCoordinator, MedicalDirector, BillingSpecialist]
    code: 200
    input: ["participant_id?", "kind?", "status?"]
    output: DisenrollmentRequest[]
    side_effects: []

  - method: POST
    path: "/pace/disenrollment-requests/{request_id}/approve"
    description: "Approve a disenrollment request (participant → DISENROLLMENT_PENDING)"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: DisenrollmentRequest
    side_effects: ["status → APPROVED; Participant.status → DISENROLLMENT_PENDING; Participant.version += 1"]

  - method: POST
    path: "/pace/disenrollment-requests/{request_id}/deny"
    description: "Deny a voluntary disenrollment request"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: DisenrollmentRequest
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/pace/disenrollment-requests/{request_id}/finalize"
    description: "Finalize disenrollment (full cascade; OCC on participant)"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_participant_version]
    output: DisenrollmentRequest
    side_effects:
      - "Participant DISENROLLMENT_PENDING → DISENROLLED with cascade; Enrollment CLOSED; care plan/attendance/meds cascaded; lock_in_penalty computed; Participant.version += 1"

  - method: POST
    path: "/pace/disenrollment-requests/{request_id}/withdraw"
    description: "Withdraw a voluntary disenrollment request (participant returns to ENROLLED)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: DisenrollmentRequest
    side_effects: ["status → WITHDRAWN; Participant → ENROLLED; Participant.version += 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Program, participant, or referenced sub-resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required fields, illegal enum, wrong type, or out-of-range integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PROGRAM_SUSPENDED, http: 409, condition: "Program is SUSPENDED; enroll / capitation-finalize blocked" }
  - { id: ERR_PARTICIPANT_NOT_ENROLLED, http: 409, condition: "Operation requires Participant.status ENROLLED (or DISENROLLMENT_PENDING for finalize)" }
  - { id: ERR_LOC_NOT_CERTIFIED, http: 409, condition: "No CERTIFIED, non-expired level-of-care assessment at the gating date" }
  - { id: ERR_LOC_BELOW_THRESHOLD, http: 409, condition: "nf_score below nf_threshold at certify" }
  - { id: ERR_NO_ACTIVE_CARE_PLAN, http: 409, condition: "Participant has no ACTIVE care plan at enroll" }
  - { id: ERR_IDT_INCOMPLETE, http: 409, condition: "A required IDT discipline signature is missing at care-plan activation" }
  - { id: ERR_CARE_PLAN_NO_GOALS, http: 409, condition: "Care plan has zero goals at submit" }
  - { id: ERR_CARE_PLAN_NOT_ACTIVE, http: 409, condition: "Referenced care plan is not ACTIVE for med-order activate/resume, or med-admin day not CHECKED_IN/COMPLETED" }
  - { id: ERR_CANNOT_VOID_ACTIVE, http: 409, condition: "Attempt to void the participant's active care plan" }
  - { id: ERR_WITHDRAW_NOT_ALLOWED, http: 409, condition: "Withdraw attempted on an INVOLUNTARY request" }
  - { id: ERR_INVOLUNTARY_CANNOT_DENY, http: 409, condition: "Deny attempted on an INVOLUNTARY (for-cause) request" }
  - { id: ERR_NOT_FIRST_OF_MONTH, http: 422, condition: "Effective date is not day-of-month 01" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Participant under 55 at enrollment_effective_date" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Transport leg window_end_min <= window_start_min, or window out of 0..1440" }
  - { id: ERR_TRANSPORT_OVERLAP, http: 409, condition: "Transport leg overlaps another PLANNED leg on same vehicle + service_date" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "Duplicate AttendanceDay.service_date or CapitationPayment.service_month for the participant" }
  - { id: ERR_CENSUS_FULL, http: 409, condition: "Live CHECKED_IN census on service_date already at capacity" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Program enrolled_count already at daily_census_capacity at enroll" }
  - { id: ERR_NO_COVERAGE_FOR_MONTH, http: 409, condition: "No enrollment coverage of any day in service_month at capitation finalize" }
  - { id: ERR_RECOUP_EXCEEDS_BILLED, http: 422, condition: "recoup_cents > total_billed_cents at reconcile" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_participant_version does not match Participant.version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operates the PACE center: creates programs, suspends/reopens, sets the test clock, reads everything, may submit involuntary disenrollment requests. Cannot perform clinical, enrollment, or billing actions."
    identity: "opaque"
    exclusive_operations:
      - "POST /pace/programs"
      - "POST /pace/programs/{id}/suspend"
      - "POST /pace/programs/{id}/reopen"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
      - "POST /pace/disenrollment-requests (submit, typically INVOLUNTARY)"

  - name: IntakeCoordinator
    description: "Applicant intake, care-plan authoring, enrollment, attendance scheduling, voluntary-disenrollment withdraw. Segregation: cannot certify LOC, cannot approve disenrollment, cannot finalize billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /pace/participants"
      - "POST /pace/participants/{id}/enroll"
      - "POST /pace/care-plans (create)"
      - "POST /pace/care-plans/{id}/submit"
      - "POST /pace/care-plans/{id}/void"
      - "POST /pace/disenrollment-requests/{id}/withdraw"
    shared_operations:
      - "POST /pace/loc-assessments (create)"
      - "POST /pace/care-plans/{id}/goals, /sign"
      - "POST /pace/attendance-days (create), /cancel"
      - "POST /pace/transport-legs"
      - "POST /pace/disenrollment-requests (submit)"
      - "Most GET reads"

  - name: MedicalDirector
    description: "Clinical authority: certifies/denies level of care, reviews/activates/revises care plans, orders meds, approves/denies disenrollment. Segregation: cannot enroll nor finalize billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /pace/loc-assessments/{id}/certify"
      - "POST /pace/loc-assessments/{id}/deny"
      - "POST /pace/care-plans/{id}/request-revision"
      - "POST /pace/care-plans/{id}/activate"
      - "POST /pace/disenrollment-requests/{id}/approve"
      - "POST /pace/disenrollment-requests/{id}/deny"
    shared_operations:
      - "POST /pace/loc-assessments (create)"
      - "POST /pace/care-plans/{id}/goals, /sign"
      - "POST /pace/medication-orders (create), /discontinue"
      - "POST /pace/disenrollment-requests (submit)"
      - "Most GET reads"

  - name: NurseStaff
    description: "Daily nursing & medication services: attendance check-in/complete/no-show, medication order lifecycle and administration."
    identity: "opaque"
    exclusive_operations:
      - "POST /pace/attendance-days/{id}/check-in"
      - "POST /pace/attendance-days/{id}/complete"
      - "POST /pace/attendance-days/{id}/no-show"
      - "POST /pace/medication-orders/{id}/activate, /hold, /resume"
      - "POST /pace/medication-administrations"
    shared_operations:
      - "POST /pace/attendance-days (create), /cancel"
      - "POST /pace/transport-legs"
      - "POST /pace/medication-orders (create), /discontinue"
      - "POST /pace/care-plans/{id}/sign"
      - "Most GET reads"

  - name: BillingSpecialist
    description: "Medicaid/Medicare dual billing: capitation draft/finalize/reconcile/void and disenrollment finalize. Segregation: cannot enroll, certify, or approve disenrollment."
    identity: "opaque"
