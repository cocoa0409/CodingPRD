      - name: failed_accessibility_inspection_cascade_overrides_the_refund_ladder
        grounds:
          - calculations.safety_inspection_outcome
          - state_machines.SafetyInspection.SCHEDULED_to_FINALIZED
          - state_machines.ExperienceRun.clearance_status.CLEARED_to_SUSPENDED
          - state_machines.TimedEntrySlot.OPEN_to_SUSPENDED
          - state_machines.TicketOrder.CONFIRMED_to_REFUND_DUE
          - calculations.refund_and_credit_settlement
        distinguishing_aspect: |
          Depth-4 chain whose every hop is caused by the previous one and whose triggering transition is
