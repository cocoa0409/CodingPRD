            - call: "POST /vks/assessment-windows"
              payload: { assessment_name: "Spring ELA", subject: "ELA", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-22T17:00:00Z" }
              as: ProctorCoordinator
              captures: { window_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Quinn", date_of_birth: "2011-10-10T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
