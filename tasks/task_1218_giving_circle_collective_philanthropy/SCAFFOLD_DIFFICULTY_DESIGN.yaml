  - rule_id: compensating_invariant
    instances:
      - name: receive_refund_pooled_conservation
        grounds:
          - calculations.pooled_balance
          - state_machines.Contribution.PLEDGED_to_RECEIVED
          - state_machines.Contribution.REFUND_REQUESTED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: pooled money. The forward action (receive) and
          its compensating action (request-refund + approve-refund) leave
          GivingCycle.pooled_balance_cents == 0 — exactly its pre-receive
          value — with refunded_total_cents absorbing the amount.
        test_recipe:
          setup:
            - "Cycle in POOLING; M1 ACTIVE with a PLEDGED contribution of 100000"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle CI1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.ci1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
          trigger:
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}/ledger", as: CircleAdmin, captures: { pooled_mid: $.data.pooled_balance_cents } }
            - { call: "POST /api/contributions/${c1_id}/request-refund", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/contributions/${c1_id}/approve-refund", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}/ledger", as: CircleAdmin, captures: { pooled_end: $.data.pooled_balance_cents, recv_end: $.data.received_total_cents, ref_end: $.data.refunded_total_cents } }
          assert:
            - "pooled after receive == 100000"
            - "pooled after refund == 0 (forward + compensating action conserve pooled_balance_cents)"
            - "received_total_cents == 0 and refunded_total_cents == 100000"
            - "Contribution.${c1_id}.status == REFUNDED"

      - name: cast_recast_points_conservation
        grounds:
          - calculations.voting_tally
          - state_machines.Ballot.CAST_to_CAST
          - concurrency_rules[ballot-recast-stale-version]
        distinguishing_aspect: |
          Conserved quantity: total tally points (a count, not money — a
          different conserved type). Recasting changes the per-finalist
          distribution (N1 60->30, N2 40->70) while total_points_cast stays
          exactly 100 == 1 ballot x POINTS_BUDGET_PER_BALLOT.
