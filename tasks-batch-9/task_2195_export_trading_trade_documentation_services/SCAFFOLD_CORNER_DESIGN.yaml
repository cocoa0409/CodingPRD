              captures: { lc_v_after_amendment: "$.data.version", amendment_round: "$.data.amendment_round", new_max: "$.data.max_drawable_usd" }
          trigger:
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_v_before_amendment}" }
              captures: { err_stale: "$.data.error_id" }
            - call: "GET /letters-of-credit/${lc_id}"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: {}
              captures: { lc_v_fresh: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
