scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: artist_payout_provisional_vs_final_on_show
        grounds:
          - calculations.artist_payout
          - state_machines.Settlement.DRAFT_to_SUBMITTED
          - state_machines.Settlement.DISPUTED_to_DRAFT
        distinguishing_aspect: |
          Same inputs produce different artist_total_due_cents between the
          provisional_draft variant (recomputed live) and the finalized_submitted
          variant (snapshotted at submit time) when an expense is approved
          between draft and submit. Entity domain: Show/Settlement.
        test_recipe:
          setup:
            - "Show in SHOW_NIGHT with Deal FLAT_GUARANTEE guarantee=100000, expense_budget=20000, bar_split=0.10, merch_split=0.20, support_budget=0"
            - "One APPROVED recoupable ExpenseReceipt amount=5000 at draft creation"
            - "Settlement drafted (recoupable=5000, net_door=95000 if gross=100000)"
            - "After draft, a second ExpenseReceipt amount=8000 is approved (recoupable would become 13000 if recomputed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "The Band", agency: "Agency X", guarantee_floor_cents: 50000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { artist_id: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "Agent A", agency_name: "Agency X" }
              as: VenueManager
              captures: { agent_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${artist_id}", room: "MAIN_ROOM", show_date: "2026-09-15", doors_at_utc: "2026-09-15T19:00:00Z", curfew_at_utc: "2026-09-15T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-15T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${agent_id}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { hold_id: $.data.id }
            - call: "POST /shows/${show_id}/date-holds/${hold_id}/confirm"
              payload: { expected_show_version: "${show_v1}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
            # Capture show version after hold create
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { show_v_after_confirm_attempt: $.data.version }
            # The confirm above will fail because show_v1 unbound — fix by using fresh capture
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { show_v_pre_offer: $.data.version }
            - call: "POST /shows/${show_id}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 100000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 20000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /shows/${show_id}/offers/${offer_id}/accept"
              payload: { expected_show_version: "${show_v_pre_offer}" }
              as: VenueManager
            # Deposit: 25% of 100000 = 25000
            - call: "POST /shows/${show_id}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 25000, recipient_artist_id: "${artist_id}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { deposit_wire_id: $.data.id }
            - call: "POST /shows/${show_id}/wire-transfers/${deposit_wire_id}/complete"
              payload: {}
              as: Accountant
            - call: "POST /shows/${show_id}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 500, tier_order: 1 }
              as: Promoter
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { show_v_pre_onsale: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${show_id}/on-sale"
              payload: { expected_show_version: "${show_v_pre_onsale}" }
              as: Promoter
            # Sell 50 tickets at 2000 = 100000 gross
            - call: "POST /shows/${show_id}/ticket-sales"
              payload: { tier_id: "${tier_id}", quantity: 50 }
              as: Promoter
            # Complete advance
            - call: "POST /shows/${show_id}/advance/items/hospitality/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/items/tech/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/items/backline/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/items/production_requirements/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/items/insurance_cert/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/items/w9/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${show_id}/advance/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T20:00:00Z" }
              as: VenueManager
            # First expense approved BEFORE draft
            - call: "POST /shows/${show_id}/expense-receipts"
              payload: { category: "SOUND", amount_cents: 5000, receipt_reference: "R1", is_recoupable: true }
              as: Promoter
              captures: { receipt1_id: $.data.id }
            - call: "POST /shows/${show_id}/expense-receipts/${receipt1_id}/approve"
              payload: {}
              as: VenueManager
            # Draft settlement (recoupable=5000, net_door=95000)
            - call: "POST /shows/${show_id}/settlement"
              payload: {}
              as: Promoter
              captures: { settlement_id: $.data.id, draft_net_door: $.data.net_door_cents }
            # Now approve a SECOND expense — but settlement is already DRAFT
            - call: "POST /shows/${show_id}/expense-receipts"
              payload: { category: "LIGHTS", amount_cents: 8000, receipt_reference: "R2", is_recoupable: true }
              as: Promoter
              captures: { receipt2_id: $.data.id }
            - call: "POST /shows/${show_id}/expense-receipts/${receipt2_id}/approve"
              payload: {}
              as: VenueManager
          trigger:
            - call: "GET /shows/${show_id}/settlement"
              payload: {}
              as: Promoter
              captures: { settled_net_door_after_second_expense: $.data.net_door_cents }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { show_v_for_submit: $.data.version }
            - call: "POST /shows/${show_id}/settlement/submit"
              payload: { expected_show_version: "${show_v_for_submit}" }
              as: Promoter
              captures: { submitted_net_door: $.data.net_door_cents }
          assert:
            - "Settlement.${settlement_id}.net_door_cents at draft time == 95000"
            - "After second expense approval but before submit, Settlement DRAFT field recoupable_expenses_cents remains 5000 (provisional draft snapshot semantics — does NOT auto-update on receipt approval once drafted)"
            - "After submit, Settlement.recoupable_expenses_cents == 5000 (finalized_submitted variant pinned at draft time snapshot)"
            - "Settlement.${settlement_id}.net_door_cents == 95000 after submit (finalized; unchanged by late receipt approval)"

      - name: cancellation_policy_artist_vs_force_majeure
        grounds:
          - calculations.cancellation_policy
          - state_machines.Show.CONFIRMED_to_CANCELLED
          - calculations.cancellation_policy.variants
        distinguishing_aspect: |
          Same Show state at cancellation time produces different artist_penalty_cents
          and deposit_refundable_cents between the artist_initiated variant (sliding
          scale, deposit retained) and the force_majeure variant (no penalty, deposit
          refunded). Entity domain: CancellationEvent/Show — distinct from Show/Settlement
          domain of artist_payout.
        test_recipe:
          setup:
            - "Two Shows (S1, S2), same artist, same guarantee=100000, deposit_pct=0.25, deposit 25000 paid in full"
            - "S1 cancelled by BookingAgent with reason=ARTIST 20 days before show_date (penalty tier 0.50)"
            - "S2 cancelled by VenueManager with reason=FORCE_MAJEURE 20 days before show_date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "The Band", agency: "Agency X", guarantee_floor_cents: 50000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { artist_id: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "Agent A", agency_name: "Agency X" }
              as: VenueManager
              captures: { agent_id: $.data.id }
            # Build S1 fully to CONFIRMED with deposit paid
            - call: "POST /shows"
              payload: { artist_id: "${artist_id}", room: "MAIN_ROOM", show_date: "2026-09-15", doors_at_utc: "2026-09-15T19:00:00Z", curfew_at_utc: "2026-09-15T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-15T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /shows/${s1_id}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${agent_id}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s1_hold: $.data.id }
            - call: "GET /shows/${s1_id}"
              payload: {}
              as: VenueManager
              captures: { s1_v0: $.data.version }
            - call: "POST /shows/${s1_id}/date-holds/${s1_hold}/confirm"
              payload: { expected_show_version: "${s1_v0}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
            - call: "POST /shows/${s1_id}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 100000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s1_offer: $.data.id }
            - call: "GET /shows/${s1_id}"
              payload: {}
              as: VenueManager
              captures: { s1_v1: $.data.version }
            - call: "POST /shows/${s1_id}/offers/${s1_offer}/accept"
              payload: { expected_show_version: "${s1_v1}" }
              as: VenueManager
            - call: "POST /shows/${s1_id}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 25000, recipient_artist_id: "${artist_id}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { s1_dep: $.data.id }
            - call: "POST /shows/${s1_id}/wire-transfers/${s1_dep}/complete"
              payload: {}
              as: Accountant
            # Build S2 identically
            - call: "POST /shows"
              payload: { artist_id: "${artist_id}", room: "LOUNGE", show_date: "2026-09-15", doors_at_utc: "2026-09-15T19:00:00Z", curfew_at_utc: "2026-09-15T23:00:00Z", total_capacity: 200, on_sale_at_utc: "2026-08-15T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /shows/${s2_id}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${agent_id}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s2_hold: $.data.id }
            - call: "GET /shows/${s2_id}"
              payload: {}
              as: VenueManager
              captures: { s2_v0: $.data.version }
            - call: "POST /shows/${s2_id}/date-holds/${s2_hold}/confirm"
              payload: { expected_show_version: "${s2_v0}" }
              as: BookingAgent
              as_user_id: "${agent_id}"
            - call: "POST /shows/${s2_id}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 100000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s2_offer: $.data.id }
            - call: "GET /shows/${s2_id}"
              payload: {}
              as: VenueManager
              captures: { s2_v1: $.data.version }
            - call: "POST /shows/${s2_id}/offers/${s2_offer}/accept"
              payload: { expected_show_version: "${s2_v1}" }
              as: VenueManager
            - call: "POST /shows/${s2_id}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 25000, recipient_artist_id: "${artist_id}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { s2_dep: $.data.id }
            - call: "POST /shows/${s2_id}/wire-transfers/${s2_dep}/complete"
              payload: {}
              as: Accountant
            # Set clock to 2026-08-26 (20 days before 2026-09-15)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T12:00:00Z" }
              as: VenueManager
          trigger:
            - call: "POST /shows/${s1_id}/cancel"
              payload: { reason: "ARTIST" }
              as: BookingAgent
              as_user_id: "${agent_id}"
              captures: { s1_cancel_penalty_cents: $.data.artist_penalty_cents, s1_deposit_refundable: $.data.deposit_refundable_cents }
            - call: "POST /shows/${s2_id}/cancel"
              payload: { reason: "FORCE_MAJEURE" }
              as: VenueManager
              captures: { s2_cancel_penalty_cents: $.data.artist_penalty_cents, s2_deposit_refundable: $.data.deposit_refundable_cents }
          assert:
            - "CancellationEvent(S1).artist_penalty_cents == 50000  # 0.50 × 100000"
            - "CancellationEvent(S1).artist_penalty_pct == 0.50"
            - "CancellationEvent(S1).deposit_refundable_cents == 0  # deposit retained by venue"
            - "CancellationEvent(S2).artist_penalty_cents == 0"
            - "CancellationEvent(S2).artist_penalty_pct == 0.0"
            - "CancellationEvent(S2).deposit_refundable_cents == 25000  # full refund"
            - "S1.deposit_paid_cents == 25000 after cancel (retained); S2.deposit_paid_cents == 0 after REFUND_TO_VENUE wire completes"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: artist_payout_versus_mode_a_multi_input_conditional
        grounds:
          - calculations.artist_payout
          - calculations.versus_threshold_straddle
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction: artist_door_share_cents
          depends on net_door_cents, versus_threshold_cents, artist_split_pct,
          guarantee_cents, AND a conditional branch on `net_door > threshold`;
          the branch flips the formula, so identical net_door at threshold ± 1 cent
          yields discontinuous output.
        test_recipe:
          setup:
            - "Show with VERSUS deal: guarantee=80000, threshold=100000, split=0.60, expense_budget=10000, bar/merch splits=0"
            - "Exactly 60 tickets sold at 2000 = 120000 gross; 15000 approved recoupable expenses capped at 10000 → recoupable=10000 → net_door=110000"
            - "net_door (110000) > threshold (100000) → bonus = round_half_up(10000 × 0.60) = 6000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "VS Band", agency: "A", guarantee_floor_cents: 50000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { va_id: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { vagent_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${va_id}", room: "MAIN_ROOM", show_date: "2026-09-20", doors_at_utc: "2026-09-20T19:00:00Z", curfew_at_utc: "2026-09-20T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${vagent_id}"
              captures: { vs_id: $.data.id }
            - call: "POST /shows/${vs_id}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${vagent_id}" }
              as: BookingAgent
              as_user_id: "${vagent_id}"
              captures: { vs_hold: $.data.id }
            - call: "GET /shows/${vs_id}"
              payload: {}
              as: VenueManager
              captures: { vs_v0: $.data.version }
            - call: "POST /shows/${vs_id}/date-holds/${vs_hold}/confirm"
              payload: { expected_show_version: "${vs_v0}" }
              as: BookingAgent
              as_user_id: "${vagent_id}"
            - call: "POST /shows/${vs_id}/offers"
              payload: { deal_kind: "VERSUS", guarantee_cents: 80000, artist_split_pct: 0.60, versus_threshold_cents: 100000, expense_budget_cents: 10000, support_budget_cents: 0, bar_split_pct: 0, merch_split_pct: 0 }
              as: BookingAgent
              as_user_id: "${vagent_id}"
              captures: { vs_offer: $.data.id }
            - call: "GET /shows/${vs_id}"
              payload: {}
              as: VenueManager
              captures: { vs_v1: $.data.version }
            - call: "POST /shows/${vs_id}/offers/${vs_offer}/accept"
              payload: { expected_show_version: "${vs_v1}" }
              as: VenueManager
            - call: "POST /shows/${vs_id}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 500, tier_order: 1 }
              as: Promoter
              captures: { vs_tier: $.data.id }
            - call: "GET /shows/${vs_id}"
              payload: {}
              as: Promoter
              captures: { vs_v_pre_sale: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${vs_id}/on-sale"
              payload: { expected_show_version: "${vs_v_pre_sale}" }
              as: Promoter
            - call: "POST /shows/${vs_id}/ticket-sales"
              payload: { tier_id: "${vs_tier}", quantity: 60 }
              as: Promoter
            - call: "POST /shows/${vs_id}/advance/items/hospitality/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/items/tech/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/items/backline/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/items/production_requirements/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/items/insurance_cert/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/items/w9/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${vs_id}/advance/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T20:00:00Z" }
              as: VenueManager
            - call: "POST /shows/${vs_id}/expense-receipts"
              payload: { category: "SOUND", amount_cents: 15000, receipt_reference: "E1", is_recoupable: true }
              as: Promoter
              captures: { vs_r1: $.data.id }
            - call: "POST /shows/${vs_id}/expense-receipts/${vs_r1}/approve"
              payload: {}
              as: VenueManager
          trigger:
            - call: "POST /shows/${vs_id}/settlement"
              payload: {}
              as: Promoter
              captures: { vs_recoup: $.data.recoupable_expenses_cents, vs_net: $.data.net_door_cents, vs_bonus: $.data.bonus_cents, vs_door: $.data.artist_door_share_cents, vs_total: $.data.artist_total_due_cents }
          assert:
            - "Settlement.recoupable_expenses_cents == 10000  # capped at expense_budget"
            - "Settlement.net_door_cents == 110000  # 120000 − 10000"
            - "Settlement.bonus_cents == 6000  # round_half_up((110000 − 100000) × 0.60)"
            - "Settlement.artist_door_share_cents == 86000  # 80000 + 6000"
            - "Settlement.artist_total_due_cents == 86000"

      - name: expense_recoupment_over_cap_truncation_mode_b
        grounds:
          - calculations.expense_recoupment_ordering
        distinguishing_aspect: |
          Mode (b) — nested rounding / per-line truncation where order matters:
          when cumulative receipts exceed expense_budget, the FIRST cap-crossing
          receipt is truncated and subsequent receipts recoup at 0; processing in
          a different order (e.g., amount-sorted) would yield different per-receipt
          breakdowns and a different "first-truncated" receipt identity.
        test_recipe:
          setup:
            - "Show with FLAT_GUARANTEE deal, expense_budget_cents = 10000"
            - "Three APPROVED recoupable receipts in created_at order: R1=6000, R2=5000, R3=4000"
            - "R1 fits fully (cumulative=6000); R2 truncated to 4000 (cumulative=10000); R3 recouped at 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "TR Band", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { tr_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { tr_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${tr_a}", room: "LOUNGE", show_date: "2026-09-25", doors_at_utc: "2026-09-25T19:00:00Z", curfew_at_utc: "2026-09-25T23:00:00Z", total_capacity: 200, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${tr_agent}"
              captures: { tr_s: $.data.id }
            - call: "POST /shows/${tr_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${tr_agent}" }
              as: BookingAgent
              as_user_id: "${tr_agent}"
              captures: { tr_h: $.data.id }
            - call: "GET /shows/${tr_s}"
              payload: {}
              as: VenueManager
              captures: { tr_v0: $.data.version }
            - call: "POST /shows/${tr_s}/date-holds/${tr_h}/confirm"
              payload: { expected_show_version: "${tr_v0}" }
              as: BookingAgent
