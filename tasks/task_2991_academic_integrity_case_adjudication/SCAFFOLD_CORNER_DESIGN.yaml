            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_notified}", kind: "GRADE_PENALTY_COURSE", ladder_rank: 3, effective_from: "2026-08-21T00:00:00Z" }
              as: AppealsDean
              captures: { err_dean_cannot_propose: $.data.error_id }
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: AppealsDean
              captures: { err_dean_cannot_decide_hearing: $.data.error_id }
            - call: "POST /integrity/cases/${case_id}/dismiss"
              payload: { dismiss_reason: "The registrar attempting an adjudication write." }
