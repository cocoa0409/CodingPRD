  # -------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: work_location_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.WorkLocation.fields.location_type, "validations[priority=31]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum location_type is rejected with ERR_INVALID_REQUEST (400), exercising the enum constraint on entity input fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /etax/work-locations", payload: { label: "Igloo", address_line1: "1 Ice Rd", city: "Anchorage", state_code: "AK", postal_code: "99501", location_type: "IGLOO" }, as: NexusAnalyst, captures: { err: $.data.error_id } }
