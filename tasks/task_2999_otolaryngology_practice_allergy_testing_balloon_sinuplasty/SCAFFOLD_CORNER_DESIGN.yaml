            - "Both 240-minute bookings are accepted, and each reports duration_minutes == 240"
            - "${booked_full} == 480, ${util_full} == 10000 and ${status_full} == \"FULL\" — booked_minutes reached capacity_minutes exactly"
            - "After the cancel: ProcedureBooking.${book_2}.status == \"CANCELLED\" and cancel_reason == \"PATIENT_REQUEST\""
            - "${booked_after} == 240, ${util_after} == 5000 and ${status_after} == \"OPEN\" — a CANCELLED booking leaves the input set, so the aggregate reverses cleanly"
            - "SurgeryCenterBlock.${block_id}.booked_case_count == 1 after the cancel"
            - "The third booking is accepted (HTTP 201) because the block is OPEN again, and afterwards booked_minutes == 360, utilization_bps == 7500, booked_case_count == 2, status == \"OPEN\""

      - name: refund_restock_floor_dominates_computed_percentage
        claim_type: precision
        grounds:
          - calculations.device_trial_refund
          - calculations.device_trial_refund.constants.PER_DAY_WEAR_CENTS
          - entities.PayerPolicy.fields.restock_fee_floor_cents
          - entities.DeviceDispense.fields.refund_cents
        distinguishing_aspect: "On a 60000-cent device the percentage fee is round_half_up(60000 * 1500 / 10000) == 9000, which the 12500-cent floor overrides; days_used counts the day of dispense so 39 elapsed days is 40 days of wear (14000 cents), leaving refund_cents 60000 - 12500 - 14000 == 33500."
        test_recipe:
          setup:
            - "PayerPolicy with device_trial_days 60, restock_fee_bps 1500, restock_fee_floor_cents 12500."
            - "One adult Patient; one AUDIOMETRY study with pta_db_hl 45.0 performed by u_aud_1 and interpreted by u_aud_2, so recommendation is HEARING_AID."
            - "One HEARING_AID supply lot LOT-1014; one dispense of device_serial HA400001 at price_cents 60000, dispensed at the default clock so trial_end_at is 2026-09-30T00:00:00Z."
            - "The clock is advanced to 2026-09-09T00:00:00Z — 39 whole days after dispense and still inside the trial window."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Floor Health", plan_code: "CALG-2999", device_trial_days: 60, restock_fee_bps: 1500, restock_fee_floor_cents: 12500 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10219", full_name: "Ida Brandt", date_of_birth: "1958-06-06", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_id: $.data.id }
            - call: "POST /diagnostic-studies/${study_id}/results"
              payload: { pta_db_hl: 45.0, word_recognition_pct: 72.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study_v: $.data.version, rec: $.data.recommendation }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1014", quantity_received: 5, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400001", ear: "LEFT", price_cents: 60000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_id: $.data.id, trial_end: $.data.trial_end_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /device-dispenses/${disp_id}/trial-return"
              payload: { return_reason: "DISSATISFIED" }
              as: Audiologist
              as_user_id: "u_aud_1"
          assert:
            - "${rec} == \"HEARING_AID\" and ${trial_end} == \"2026-09-30T00:00:00Z\" (dispensed_at + device_trial_days 60)"
            - "HTTP 200 and DeviceDispense.${disp_id}.refund_variant == \"IN_TRIAL\" — 2026-09-09 is strictly before trial_end_at"
            - "DeviceDispense.${disp_id}.days_used == 40 — floor(39 whole days) + 1 for the day of dispense"
            - "DeviceDispense.${disp_id}.restock_fee_cents == 12500 — the computed 9000 is raised to restock_fee_floor_cents, so the floor and not the percentage decides"
            - "DeviceDispense.${disp_id}.refund_cents == 33500 (60000 - 12500 - 350 * 40)"
            - "DeviceDispense.${disp_id}.fit_status == \"RETURNED\" and billing_status == \"REFUND_PENDING\""

