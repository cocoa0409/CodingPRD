              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CHANGE_BUDGET_EXCEEDED (0 approved + 200000 > 100000)"
      - name: dependency_cycle_rejected_on_patch
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DEPENDENCY_CYCLE]", state_machines.WorkItem.PLANNED_to_PLANNED]
        distinguishing_aspect: "The cycle check runs on PATCH too: with B already depending on A, patching A to depend on B would close a 2-cycle and is rejected with ERR_DEPENDENCY_CYCLE."
        test_recipe:
          setup: ["DRAFT project; item B depends on item A"]
          setup_api_calls:
            - call: "POST /v1/docks"
