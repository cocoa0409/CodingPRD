# =============================================================================
# SCAFFOLD — Multi-Brand Portfolio Rationalization & Assortment Reduction
# Task: task_3446_multi_brand_portfolio_rationalization_assortment_reduction
# =============================================================================
#
# CLOCK / PREFIX NOTES (normative):
# - All endpoints are served under api_prefix "/portfolio" EXCEPT the logical
#   clock endpoint POST /_clock/set_current_utc, which is UNPREFIXED (platform
#   endpoint, outside the /portfolio prefix).
# - The server maintains a logical clock. At startup, before any
#   set_current_utc call, the logical clock reads exactly
#   2026-09-01T00:00:00Z (fixed default; never falls back to wall-clock time).
# - All fixture dates in §1.8/§1.9 are chosen at or after this default.

scenario: |
  Multi-Brand Portfolio Rationalization & Assortment Reduction (Newell Brands): portfolio of many consumer brands across categories with shared manufacturing and distribution infrastructure, brand and item rationalization decisions removing low-volume items with retailer shelf impact and consumer backlash risk, divestiture of non-core brands with transition service agreements and separation of shared operations, manufacturing footprint consolidation with plant closures, product transfers and qualification runs, retailer relationship management where one buyer covers multiple brands with combined negotiations, private label competition within the same categories and channel conflict, innovation prioritization across many brands with limited capital, inventory and obsolescence management during rationalization

domain_name: multi-brand-portfolio-rationalization
api_prefix: /portfolio

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration      # guarded multi-step decision pipelines (cut case, divestiture, transfer)
  secondary_archetype: quota_allocation          # finite capital pool waterfall + plant capacity gate
  complexity_layers:
    - optimistic_concurrency                     # OCC on Item.version for sell-down
    - cascading_side_effects                     # TSA terminate -> items -> open cases -> plants
    - dual_variant_calculation                   # obsolescence STANDARD/SALVAGE; priority STANDARD/CORE_BRAND
    - rate_threshold_triggers                    # composite >= 65, reject-rate 250bp, capacity 110%
  entity_topology: flat                          # peer entities joined by foreign keys; no nested ownership trees
  state_machine_shape: branching                 # fork/revert branches on Item, Case, Negotiation, InnovationProject; self-loop on ProductTransfer
  relationship_patterns:
    - one_to_many                                # Brand->Item, Plant->Item, ProductTransfer->QualificationRun, Divestiture->TSA (1:1)
    - cross_aggregate                            # RationalizationCase->Item, ProductTransfer->Item+Plant x2, CombinedNegotiation->Retailer (+brands by id list)
  role_model: segregation_of_duties              # case proposer != decider; transfer planner != run certifier
  consistency_model: immediate                   # every mutation visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all parents null)
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand display name; unique across all brands" }
      - { name: category_name, type: string, source: input, description: "Free-form category label (e.g. 'kitchen-storage'); plain attribute, not an entity" }
      - { name: core_flag, type: boolean, source: input, description: "true = core brand (never divestable); false = non-core (divestiture candidate)" }
      - { name: private_label_share_pct, type: integer, source: input, description: "Private-label share of the brand's category, integer percent 0..100; damps consumer-backlash risk" }
      - { name: annual_net_revenue_cents, type: integer, source: input, description: "Brand-level annual net revenue in cents, >= 0" }
      - { name: brand_status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | DIVESTING | DIVESTED | EXITED", default: ACTIVE }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; owning brand" }
      - { name: primary_plant_id, type: string, source: input, description: "FK -> Plant.id; plant currently producing the item; rewritten by transfer execution" }
      - { name: sku_code, type: string, source: input, description: "SKU code; unique across all items" }
      - { name: annual_units, type: integer, source: input, description: "Annual unit volume, >= 0" }
      - { name: unit_net_revenue_cents, type: integer, source: input, description: "Net revenue per unit in cents, >= 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Fully absorbed cost per unit in cents, >= 0" }
      - { name: units_on_hand, type: integer, source: input, description: "Finished-goods units on hand at creation, >= 0; decremented by sell-down, zeroed by write-off cascades" }
      - { name: salvageable, type: boolean, source: input, default: false, description: "true = residual inventory has salvage value (obsolescence SALVAGE variant applies)" }
      - { name: item_status, type: enum, source: system, description: "LISTED | CUT_PROPOSED | SELL_THROUGH | DISCONTINUED", default: LISTED }
      - { name: sell_through_deadline, type: datetime, source: system, description: "Set at case APPROVE = approval timestamp + 90 days (SELL_THROUGH_DAYS); null otherwise" }
      - { name: units_sold_cumulative, type: integer, source: system, default: 0, description: "Cumulative units sold via sell-down" }
      - { name: units_written_off_cumulative, type: integer, source: system, default: 0, description: "Cumulative units written off at case finalize or TSA termination" }
      - { name: obsolescence_charge_cents, type: integer, source: system, default: 0, description: "Cumulative obsolescence charge posted against this item (calc obsolescence_charge)" }

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name; unique" }
      - { name: quarterly_capacity_units, type: integer, source: input, description: "Production capacity per quarter in units, > 0" }
      - { name: plant_status, type: enum, source: system, description: "OPERATING | CLOSING | CLOSED", default: OPERATING }
      - { name: closure_date, type: datetime, source: system, description: "Set by announce-closure; null while OPERATING" }
      - { name: committed_units_per_quarter, type: integer, source: computed, description: "Sum of round_half_up(annual_units/4) over Items with primary_plant_id = this plant AND item_status IN {LISTED, CUT_PROPOSED, SELL_THROUGH}" }
      - { name: utilization_pct, type: number, source: computed, description: "round_half_up(committed_units_per_quarter / quarterly_capacity_units * 100, 2 decimal places)" }

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retailer name; unique" }
      - { name: risk_rating, type: enum, source: input, description: "LOW | MEDIUM | HIGH; relationship risk rating" }

  - name: RationalizationCase
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; the item proposed for cutting; at most one open case per item" }
      - { name: proposer_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: volume_score, type: number, source: computed, description: "0..100, 2dp; low volume -> high cut rationale (calc rationalization_composite_score)" }
      - { name: margin_score, type: number, source: computed, description: "0..100, 2dp; low margin -> high cut rationale" }
      - { name: shelf_resilience_score, type: number, source: computed, description: "0..100, 2dp; retailer shelf can absorb the cut when item revenue share of brand is low" }
      - { name: backlash_resilience_score, type: number, source: computed, description: "0..100, 2dp; consumer backlash damped by small brand scale and high private-label share" }
      - { name: composite_score, type: number, source: computed, description: "2dp; weighted composite of the four rounded sub-scores" }
      - { name: recommendation, type: enum, source: computed, description: "CUT if composite_score >= 65 else KEEP" }
      - { name: case_status, type: enum, source: system, description: "SCORED | EXECUTING | REJECTED | EXECUTED | VOIDED", default: SCORED }
      - { name: decider_user_id, type: string, source: system, description: "X-User-ID of the decider; null until decide" }

  - name: Divestiture
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; the non-core brand being divested; at most one open divestiture per brand" }
      - { name: acquirer_name, type: string, source: input, description: "External acquirer display name" }
      - { name: headline_price_cents, type: integer, source: input, description: "Headline sale price in cents, >= 0" }
      - { name: expected_close_date, type: datetime, source: input, description: "Expected close; must lie within the TSA window signed at sign-spa" }
      - { name: divestiture_status, type: enum, source: system, description: "PROPOSED | SPA_SIGNED | CLOSED | SEPARATED", default: PROPOSED }

  - name: TransitionServiceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: divestiture_id, type: string, source: system, description: "FK -> Divestiture.id; exactly one TSA per divestiture, created by sign-spa" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly service fee charged to the acquirer, >= 0 (supplied at sign-spa)" }
      - { name: start_date, type: datetime, source: input, description: "TSA service window start (supplied at sign-spa)" }
      - { name: end_date, type: datetime, source: input, description: "TSA service window end (supplied at sign-spa)" }
      - { name: tsa_status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED", default: DRAFT }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock timestamp of termination; null while ACTIVE/DRAFT" }
      - { name: early_termination_penalty_cents, type: integer, source: system, default: 0, description: "Penalty posted at termination (calc tsa_early_termination_penalty); 0 for natural termination" }

  - name: ProductTransfer
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; the item whose production moves; at most one open transfer per item" }
      - { name: source_plant_id, type: string, source: input, description: "FK -> Plant.id; must equal item.primary_plant_id at creation" }
      - { name: target_plant_id, type: string, source: input, description: "FK -> Plant.id; must differ from source and be OPERATING" }
      - { name: transfer_status, type: enum, source: system, description: "PLANNED | QUALIFYING | EXECUTED", default: PLANNED }
      - { name: consecutive_pass_count, type: integer, source: system, default: 0, description: "Consecutive PASS qualification runs at the target plant; reset to 0 on any FAIL; reaches 2 (QUAL_REQUIRED_CONSECUTIVE_PASSES) -> auto-EXECUTED" }

  - name: QualificationRun
    parent: null
    common_fields: false
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> ProductTransfer.id; the transfer this run qualifies" }
      - { name: run_date, type: datetime, source: input, description: "Date the trial run was executed (logical date, any ISO instant)" }
      - { name: units_produced, type: integer, source: input, description: "Units produced in the trial run, >= 1" }
      - { name: units_rejected, type: integer, source: input, description: "Units rejected by QA, >= 0 and <= units_produced" }
      - { name: result, type: enum, source: computed, description: "PASS if units_rejected * 10000 <= units_produced * 250 (QUAL_MAX_REJECT_RATE_BP, integer comparison, no rounding) else FAIL" }
      - { name: certifier_plant_id, type: string, source: system, description: "X-User-ID of the recording PlantDirector; must equal the transfer's target_plant_id" }

  - name: CombinedNegotiation
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; the retailer whose single buyer negotiates across brands" }
      - { name: period_code, type: string, source: input, description: "Negotiation period label (e.g. '2027-H1'); at most one TERMS_PROPOSED negotiation per (retailer_id, period_code)" }
      - { name: brand_terms, type: array, source: input, description: "Array of {brand_id, baseline_facings, proposed_facings}; 2..5 entries; brand_ids distinct; every brand ACTIVE; each facings integer >= 0" }
      - { name: effective_from, type: datetime, source: input, description: "Effective window start (closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Effective window end (closed interval); must be > effective_from" }
      - { name: total_baseline_facings, type: integer, source: computed, description: "Sum of baseline_facings over brand_terms" }
      - { name: total_proposed_facings, type: integer, source: computed, description: "Sum of proposed_facings over brand_terms" }
      - { name: shelf_reduction_pct, type: number, source: computed, description: "round_half_up((total_baseline - total_proposed) / total_baseline * 100, 2dp); 0.00 when total_baseline = 0" }
      - { name: negotiation_status, type: enum, source: system, description: "TERMS_PROPOSED | ACCEPTED | REJECTED | EXPIRED", default: TERMS_PROPOSED }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 30 days (NEGOTIATION_TTL_DAYS); respond after this instant marks EXPIRED and fails" }

  - name: CapitalCycle
    parent: null
    common_fields: true
    fields:
      - { name: period_code, type: string, source: input, description: "Fiscal period label; unique across all cycles" }
      - { name: total_capital_cents, type: integer, source: input, description: "Total innovation capital available in this cycle, > 0" }
      - { name: window_start, type: datetime, source: input, description: "Funding window start; half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Funding window end (exclusive); must be > window_start" }
      - { name: allocated_cents, type: integer, source: system, default: 0, description: "Capital allocated to FUNDED projects by run-selection" }
      - { name: remaining_cents, type: integer, source: computed, description: "total_capital_cents - allocated_cents" }
      - { name: cycle_status, type: enum, source: system, description: "ALLOCATING | LOCKED", default: ALLOCATING }

  - name: InnovationProject
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; brand receiving the investment" }
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> CapitalCycle.id; the cycle this project competes in" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: requested_capital_cents, type: integer, source: input, description: "Capital requested, > 0 and <= cycle total_capital_cents" }
      - { name: expected_revenue_cents_year3, type: integer, source: input, description: "Expected annual revenue in year 3, >= 0" }
      - { name: strategic_fit_score, type: integer, source: input, description: "Strategic fit, integer 0..100" }
      - { name: priority_score, type: number, source: computed, description: "2dp; calc innovation_priority_score (STANDARD or CORE_BRAND variant by brand.core_flag)" }
      - { name: project_status, type: enum, source: system, description: "PROPOSED | FUNDED | DEFERRED", default: PROPOSED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Brand
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /portfolio/divestitures (side effect of divestiture creation on this brand)"
        actor: system
        preconditions: ["divestiture created for this brand (brand must be ACTIVE, core_flag = false)"]
        side_effects: ["brand_status := UNDER_REVIEW", "increments Brand.version by 1"]
      - from: UNDER_REVIEW
        to: DIVESTING
        trigger: "POST /portfolio/divestitures/{id}/sign-spa (side effect)"
        actor: system
        preconditions: ["divestiture moves PROPOSED -> SPA_SIGNED"]
        side_effects: ["brand_status := DIVESTING", "increments Brand.version by 1"]
      - from: DIVESTING
        to: DIVESTED
        trigger: "POST /portfolio/divestitures/{id}/close (side effect)"
        actor: system
        preconditions: ["divestiture moves SPA_SIGNED -> CLOSED"]
        side_effects: ["brand_status := DIVESTED", "increments Brand.version by 1"]
      - from: DIVESTED
        to: EXITED
        trigger: "POST /portfolio/divestitures/{id}/separate (side effect)"
        actor: system
        preconditions: ["divestiture moves CLOSED -> SEPARATED (requires TSA TERMINATED)"]
        side_effects: ["brand_status := EXITED", "increments Brand.version by 1"]
    note: "Brand has no direct transition endpoint; its lifecycle is driven entirely by the divestiture pipeline."

  - entity: Item
    initial_state: LISTED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: LISTED
        to: CUT_PROPOSED
        trigger: "POST /portfolio/rationalization-cases (side effect of case creation on this item)"
        actor: system
        preconditions: ["case created for this item: item LISTED (which implies no open case); an item in CUT_PROPOSED or SELL_THROUGH implies an open case and the create is rejected ERR_CASE_ALREADY_OPEN (priority 11); DISCONTINUED rejected ERR_INVALID_STATE (priority 7)"]
        side_effects: ["item_status := CUT_PROPOSED", "increments Item.version by 1"]
      - from: CUT_PROPOSED
        to: LISTED
        trigger: "POST /portfolio/rationalization-cases/{id}/decide with decision=REJECT (compensating revert)"
        actor: system
        preconditions: ["case decision is REJECT"]
        side_effects: ["item_status := LISTED", "increments Item.version by 1", "conserves Brand LISTED-item count (see compensating invariant inv_item_unit_and_listed)"]
      - from: CUT_PROPOSED
        to: SELL_THROUGH
        trigger: "POST /portfolio/rationalization-cases/{id}/decide with decision=APPROVE"
        actor: system
        preconditions: ["case decision is APPROVE"]
        side_effects: ["item_status := SELL_THROUGH", "sell_through_deadline := approval logical timestamp + 90 days (SELL_THROUGH_DAYS)", "increments Item.version by 1"]
      - from: SELL_THROUGH
        to: DISCONTINUED
        trigger: "POST /portfolio/rationalization-cases/{id}/finalize"
        actor: system
        preconditions: ["case EXECUTED (logical clock >= sell_through_deadline)"]
        side_effects: ["item_status := DISCONTINUED", "obsolescence charge posted (calc obsolescence_charge)", "units_written_off_cumulative += units_on_hand", "units_on_hand := 0", "host Plant committed_units_per_quarter and utilization_pct recomputed (item leaves the committed set)", "increments Item.version by 1"]
      - from: LISTED
        to: DISCONTINUED
        trigger: "POST /portfolio/tsas/{id}/terminate (cascade from TSA termination of the item's brand)"
        actor: system
        preconditions: ["TSA of the divestiture of item.brand_id terminates while item LISTED"]
        side_effects: ["item_status := DISCONTINUED", "obsolescence charge posted (calc obsolescence_charge)", "units_written_off_cumulative += units_on_hand", "units_on_hand := 0", "host Plant committed recomputed", "increments Item.version by 1"]
      - from: CUT_PROPOSED
        to: DISCONTINUED
        trigger: "POST /portfolio/tsas/{id}/terminate (cascade)"
        actor: system
        preconditions: ["TSA terminates while item CUT_PROPOSED"]
        side_effects: ["item_status := DISCONTINUED", "obsolescence charge posted", "units_written_off_cumulative += units_on_hand", "units_on_hand := 0", "host Plant committed recomputed", "open RationalizationCase on this item is auto-VOIDED (see RationalizationCase -> VOIDED)", "increments Item.version by 1"]
      - from: SELL_THROUGH
        to: DISCONTINUED
        trigger: "POST /portfolio/tsas/{id}/terminate (cascade)"
        actor: system
        preconditions: ["TSA terminates while item SELL_THROUGH"]
        side_effects: ["item_status := DISCONTINUED", "obsolescence charge posted", "units_written_off_cumulative += units_on_hand", "units_on_hand := 0", "host Plant committed recomputed", "open EXECUTING RationalizationCase on this item is auto-VOIDED", "increments Item.version by 1"]
    note: "Parallel mutation: sell-down (POST /portfolio/items/{id}/sell-down) does not change item_status; it is allowed only while LISTED or SELL_THROUGH and carries the OCC check on Item.version."

  - entity: Plant
    initial_state: OPERATING
    terminal_states: [CLOSED]
    transitions:
      - from: OPERATING
        to: CLOSING
        trigger: "POST /portfolio/plants/{id}/announce-closure"
        actor: PortfolioManager
        preconditions: ["plant_status = OPERATING"]
        side_effects: ["plant_status := CLOSING", "closure_date := request closure_date", "increments Plant.version by 1"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /portfolio/plants/{id}/complete-closure"
        actor: PortfolioManager
        preconditions:
          - "no Item with primary_plant_id = this plant and item_status IN {LISTED, CUT_PROPOSED, SELL_THROUGH} (all items transferred out or discontinued)"
          - "no ProductTransfer with source_plant_id = this plant and transfer_status IN {PLANNED, QUALIFYING}"
        side_effects: ["plant_status := CLOSED", "increments Plant.version by 1"]
    note: "CLOSING is one-way: there is no abort. A CLOSING plant still hosts sell-down and qualification runs already in flight, but cannot be a transfer target or item-creation plant."

  - entity: RationalizationCase
    initial_state: SCORED
    terminal_states: [REJECTED, EXECUTED, VOIDED]
    transitions:
      - from: SCORED
        to: EXECUTING
        trigger: "POST /portfolio/rationalization-cases/{id}/decide with decision=APPROVE"
        actor: PortfolioManager
        preconditions: ["case_status = SCORED", "decision = APPROVE", "decider X-User-ID != proposer_user_id (segregation of duties)", "item still CUT_PROPOSED"]
        side_effects: ["case_status := EXECUTING", "decider_user_id := X-User-ID", "item -> SELL_THROUGH with deadline (see Item machine)", "increments RationalizationCase.version by 1"]
      - from: SCORED
        to: REJECTED
        trigger: "POST /portfolio/rationalization-cases/{id}/decide with decision=REJECT"
        actor: PortfolioManager
        preconditions: ["case_status = SCORED", "decision = REJECT", "decider X-User-ID != proposer_user_id"]
        side_effects: ["case_status := REJECTED", "decider_user_id := X-User-ID", "item -> LISTED (compensating revert)", "increments RationalizationCase.version by 1"]
      - from: EXECUTING
        to: EXECUTED
        trigger: "POST /portfolio/rationalization-cases/{id}/finalize"
        actor: PortfolioManager
        preconditions: ["case_status = EXECUTING", "logical clock >= item.sell_through_deadline", "item still SELL_THROUGH"]
        side_effects: ["case_status := EXECUTED", "item -> DISCONTINUED with obsolescence charge (see Item machine)", "host Plant committed recomputed (cascade hop 2)", "increments RationalizationCase.version by 1"]
      - from: SCORED
        to: VOIDED
        trigger: "POST /portfolio/tsas/{id}/terminate (cascade: item of this case discontinued by TSA termination)"
        actor: system
        preconditions: ["case open (SCORED) on an item whose brand's TSA terminates"]
        side_effects: ["case_status := VOIDED", "decider_user_id := 'system'", "increments RationalizationCase.version by 1"]
      - from: EXECUTING
        to: VOIDED
        trigger: "POST /portfolio/tsas/{id}/terminate (cascade)"
        actor: system
        preconditions: ["case open (EXECUTING) on an item whose brand's TSA terminates"]
        side_effects: ["case_status := VOIDED", "decider_user_id := 'system'", "increments RationalizationCase.version by 1"]
    note: "Branching with compensation: REJECT reverts the item to LISTED, releasing the open-case slot so a later case may be proposed again."

  - entity: Divestiture
    initial_state: PROPOSED
    terminal_states: [SEPARATED]
    transitions:
      - from: PROPOSED
        to: SPA_SIGNED
        trigger: "POST /portfolio/divestitures/{id}/sign-spa"
        actor: PortfolioManager
        preconditions: ["divestiture_status = PROPOSED", "tsa_start_date < tsa_end_date", "tsa_start_date <= expected_close_date <= tsa_end_date"]
        side_effects: ["divestiture_status := SPA_SIGNED", "creates TransitionServiceAgreement (status DRAFT) bound to this divestiture with the supplied fee and window", "brand -> DIVESTING", "increments Divestiture.version by 1"]
      - from: SPA_SIGNED
        to: CLOSED
        trigger: "POST /portfolio/divestitures/{id}/close"
        actor: PortfolioManager
        preconditions: ["divestiture_status = SPA_SIGNED", "logical clock >= TSA start_date (else ERR_TSA_NOT_STARTED)"]
        side_effects: ["divestiture_status := CLOSED", "TSA DRAFT -> ACTIVE", "brand -> DIVESTED", "increments Divestiture.version by 1"]
      - from: CLOSED
        to: SEPARATED
        trigger: "POST /portfolio/divestitures/{id}/separate"
        actor: PortfolioManager
        preconditions: ["divestiture_status = CLOSED", "TSA status = TERMINATED (else ERR_TSA_STILL_ACTIVE)"]
        side_effects: ["divestiture_status := SEPARATED", "brand -> EXITED", "increments Divestiture.version by 1"]

  - entity: TransitionServiceAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /portfolio/divestitures/{id}/close (side effect)"
        actor: system
        preconditions: ["divestiture closes; logical clock >= start_date"]
        side_effects: ["tsa_status := ACTIVE", "increments TransitionServiceAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /portfolio/tsas/{id}/terminate"
        actor: FinanceController
        preconditions: ["tsa_status = ACTIVE"]
        side_effects:
          - "tsa_status := TERMINATED; terminated_at := logical clock"
          - "early_termination_penalty_cents := tsa_early_termination_penalty (0 when clock >= end_date)"
          - "cascade hop 1: every Item of the divested brand with item_status IN {LISTED, CUT_PROPOSED, SELL_THROUGH} -> DISCONTINUED with obsolescence charge and units zeroed"
          - "cascade hop 2: every open RationalizationCase (SCORED or EXECUTING) on those items -> VOIDED"
          - "cascade hop 3: every Plant hosting a discontinued item recomputes committed_units_per_quarter and utilization_pct"
          - "increments TransitionServiceAgreement.version by 1"

  - entity: ProductTransfer
    initial_state: PLANNED
    terminal_states: [EXECUTED]
    transitions:
      - from: PLANNED
        to: QUALIFYING
        trigger: "POST /portfolio/product-transfers/{id}/qualification-runs (first recorded run; auto-transition)"
        actor: system
        preconditions: ["transfer_status = PLANNED", "run accepted (see QualificationRun rules)"]
        side_effects: ["transfer_status := QUALIFYING", "consecutive_pass_count updated per run result", "increments ProductTransfer.version by 1"]
      - from: QUALIFYING
        to: QUALIFYING
        trigger: "POST /portfolio/product-transfers/{id}/qualification-runs (subsequent run; self-loop)"
        actor: system
        preconditions: ["transfer_status = QUALIFYING", "run accepted"]
        side_effects: ["consecutive_pass_count := consecutive_pass_count + 1 on PASS; := 0 on FAIL", "increments ProductTransfer.version by 1"]
      - from: QUALIFYING
        to: EXECUTED
        trigger: "POST /portfolio/product-transfers/{id}/qualification-runs (the run whose PASS makes consecutive_pass_count reach 2 = QUAL_REQUIRED_CONSECUTIVE_PASSES; auto-transition)"
        actor: system
        preconditions: ["run result = PASS", "consecutive_pass_count after increment = 2"]
        side_effects: ["transfer_status := EXECUTED", "item.primary_plant_id := target_plant_id", "source and target Plant committed_units_per_quarter and utilization_pct recomputed", "increments ProductTransfer.version by 1", "increments Item.version by 1"]
    note: "Cyclic shape: FAIL runs reset the pass counter and keep the transfer in QUALIFYING; there is no failure-ceiling and no cancel."

  - entity: CombinedNegotiation
    initial_state: TERMS_PROPOSED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: TERMS_PROPOSED
        to: ACCEPTED
        trigger: "POST /portfolio/combined-negotiations/{id}/respond with response=ACCEPT"
        actor: RetailerBuyer
        preconditions: ["negotiation_status = TERMS_PROPOSED", "logical clock <= expires_at (strictly-later clock marks EXPIRED instead)", "X-User-ID = retailer_id (the single buyer covers all brands in brand_terms)"]
        side_effects: ["negotiation_status := ACCEPTED", "increments CombinedNegotiation.version by 1"]
      - from: TERMS_PROPOSED
        to: REJECTED
        trigger: "POST /portfolio/combined-negotiations/{id}/respond with response=REJECT"
        actor: RetailerBuyer
        preconditions: ["negotiation_status = TERMS_PROPOSED", "logical clock <= expires_at", "X-User-ID = retailer_id"]
        side_effects: ["negotiation_status := REJECTED", "increments CombinedNegotiation.version by 1"]
      - from: TERMS_PROPOSED
        to: EXPIRED
        trigger: "POST /portfolio/combined-negotiations/{id}/respond when logical clock > expires_at (auto-transition on the rejected respond attempt)"
        actor: system
        preconditions: ["negotiation_status = TERMS_PROPOSED", "logical clock > expires_at"]
        side_effects: ["negotiation_status := EXPIRED", "the respond call fails with ERR_NEGOTIATION_EXPIRED", "increments CombinedNegotiation.version by 1"]
    note: "Diamond branch: one fork to three terminals. Boundary precision: clock exactly == expires_at is still valid (expiry only when clock > expires_at)."

  - entity: CapitalCycle
    initial_state: ALLOCATING
    terminal_states: [LOCKED]
    transitions:
      - from: ALLOCATING
        to: LOCKED
        trigger: "POST /portfolio/capital-cycles/{id}/run-selection"
        actor: FinanceController
        preconditions: ["cycle_status = ALLOCATING"]
        side_effects:
          - "selector: all InnovationProject with funding_cycle_id = this cycle AND project_status = PROPOSED, ranked priority_score DESC, tie-break created_at ASC (never id)"
          - "waterfall: scan ranked list; FUND each project whose requested_capital_cents <= current remaining_cents (allocated_cents += requested; remaining recomputed); DEFER each project that does not fit and CONTINUE scanning smaller requests"
          - "every FUNDED/DEFERRED project increments InnovationProject.version by 1"
          - "cycle_status := LOCKED; increments CapitalCycle.version by 1"
          - "conserves capital: allocated_cents + remaining_cents = total_capital_cents (invariant inv_capital_conservation)"

  - entity: InnovationProject
    initial_state: PROPOSED
    terminal_states: [FUNDED, DEFERRED]
    transitions:
      - from: PROPOSED
        to: FUNDED
        trigger: "POST /portfolio/capital-cycles/{id}/run-selection (side effect, waterfall)"
        actor: system
        preconditions: ["project in selector set; requested_capital_cents <= remaining_cents at its rank position"]
        side_effects: ["project_status := FUNDED", "increments InnovationProject.version by 1"]
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /portfolio/capital-cycles/{id}/run-selection (side effect, waterfall)"
        actor: system
        preconditions: ["project in selector set; requested_capital_cents > remaining_cents at its rank position"]
        side_effects: ["project_status := DEFERRED", "increments InnovationProject.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: item-sell-down-stale-version
    parent_entity: Item
    write_endpoint: "POST /portfolio/items/{id}/sell-down"
    occ_field: expected_item_version
    description: |
      Selling down an Item whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just sold down (or a cascade has touched) the same item and the current
      writer's view of units_on_hand is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rationalization_composite_score
    trigger: "on POST /portfolio/rationalization-cases (case creation); results stored on the case"
    algorithm: weighted_scoring
    input_set: "the Item referenced by item_id and its Brand (any brand_status); runs regardless of item inventory"
    formula: |
      volume_score    = clamp(100 - annual_units / VOLUME_REF_UNITS * 100, 0, 100)                       # round_half_up 2dp
      margin_pct      = (unit_net_revenue_cents - unit_cost_cents) / unit_net_revenue_cents
                        (if unit_net_revenue_cents = 0 then margin_score := 100.00 directly)
      margin_score    = clamp((MARGIN_REF_PCT - margin_pct) / MARGIN_REF_PCT * 100, 0, 100)             # round_half_up 2dp
      revenue_share   = (annual_units * unit_net_revenue_cents) / brand.annual_net_revenue_cents
                        (if brand.annual_net_revenue_cents = 0 then revenue_share := 0)
      shelf_resilience_score = clamp(100 - revenue_share / SHELF_SHARE_REF_PCT * 100, 0, 100)           # round_half_up 2dp
      backlash_resilience_score = clamp(100 * (1 - brand.annual_net_revenue_cents / BACKLASH_REV_REF_CENTS), 0, 100)
                                  * (PL_DAMPING_BASE + PL_DAMPING_SLOPE * brand.private_label_share_pct) # round_half_up 2dp
      composite_score = round_half_up(W_VOLUME*volume_score + W_MARGIN*margin_score
                        + W_SHELF*shelf_resilience_score + W_BACKLASH*backlash_resilience_score, 2dp)
                        # composite is computed from the ROUNDED sub-scores, then rounded again
      recommendation  = CUT if composite_score >= CUT_RECOMMEND_THRESHOLD else KEEP
    constants:
      VOLUME_REF_UNITS: 50000
      MARGIN_REF_PCT: 0.35
      SHELF_SHARE_REF_PCT: 0.20
      BACKLASH_REV_REF_CENTS: 10000000000
      PL_DAMPING_BASE: 0.5
      PL_DAMPING_SLOPE: 0.005
      W_VOLUME: 0.30
      W_MARGIN: 0.25
      W_SHELF: 0.20
      W_BACKLASH: 0.25
      CUT_RECOMMEND_THRESHOLD: 65
    precision: "2 decimal places, round_half_up; sub-scores rounded first, composite computed from rounded sub-scores"
    note: "Mode (a) combinatorial: 4 inputs with clamps, a zero-revenue conditional branch, and a thresholded recommendation. Worked fixture (used in §1.8): brand annual_net_revenue_cents=1000000000, private_label_share_pct=40; item annual_units=10000, unit_net_revenue_cents=2000, unit_cost_cents=1700 -> volume 80.00, margin 57.14, shelf 90.00, backlash 63.00, composite 72.04, recommendation CUT."

  - name: tsa_early_termination_penalty
    trigger: "on POST /portfolio/tsas/{id}/terminate"
    algorithm: threshold
    input_set: "the TSA being terminated; logical clock at termination time"
    formula: |
      days_remaining  = floor((end_date - terminated_at) in whole days)   # may be <= 0
      if days_remaining <= 0: penalty = 0                                  # natural termination
      else:
        months_remaining = ceil(days_remaining / DAYS_PER_PENALTY_MONTH)   # step 1: integer ceiling FIRST
        penalty = round_half_up(months_remaining * monthly_fee_cents * EARLY_TERM_PENALTY_RATE, integer cents)
                                                                           # step 2: multiply; step 3: round the PRODUCT
      # PINNED rounding order: ceil months -> multiply by fee and rate -> round_half_up the product.
      # The alternative order (round per-month penalty first, then multiply) is FORBIDDEN and
      # produces different cents: fee 120010, 3 months -> pinned 90008 vs forbidden 90009.
    constants:
      DAYS_PER_PENALTY_MONTH: 30
      EARLY_TERM_PENALTY_RATE: 0.25
    precision: "integer cents, round_half_up applied once to the product"
    note: "Mode (b) combinatorial: nested rounding where order matters. Worked fixture (used in §1.8): start 2026-09-01, end 2027-09-01, terminate at logical 2027-06-15 -> days_remaining 78 -> months 3 -> fee 120010 -> penalty 90008."

  - name: obsolescence_charge
    trigger: "on Item -> DISCONTINUED (case finalize or TSA-terminate cascade)"
    algorithm: aggregation
    input_set: "the item being discontinued; its units_on_hand at the moment of discontinuation"
    formula: |
      STANDARD variant (item.salvageable = false):
        charge = units_on_hand * unit_cost_cents
      SALVAGE variant (item.salvageable = true):
        charge = round_half_up(units_on_hand * unit_cost_cents * (1 - SALVAGE_RECOVERY_PCT), integer cents)
      posted: obsolescence_charge_cents += charge; units_written_off_cumulative += units_on_hand; units_on_hand := 0
    constants:
      SALVAGE_RECOVERY_PCT: 0.20
    precision: "integer cents; SALVAGE variant rounds the product half-up"
    variants:
      - name: STANDARD
        when: "item.salvageable = false"
        difference: "full cost charged: units_on_hand * unit_cost_cents (no recovery)"
      - name: SALVAGE
        when: "item.salvageable = true"
        difference: "20% of cost recovered: charge = 80% of full cost, rounded half-up; identical inputs yield a strictly smaller charge"
    note: "Dual-variant rule (Rule 1, item/fiscal domain). Worked fixture: units_on_hand 100, unit_cost_cents 500 -> STANDARD 50000 vs SALVAGE 40000."

  - name: innovation_priority_score
    trigger: "on POST /portfolio/innovation-projects (project creation); stored as priority_score"
    algorithm: weighted_scoring
    input_set: "the new project and its Brand (brand.core_flag selects the variant)"
    formula: |
      revenue_score  = min(100, expected_revenue_cents_year3 / REVENUE_REF_CENTS_YEAR3 * 100)
      STANDARD variant (brand.core_flag = false):
        priority_score = round_half_up(W_STRATEGIC_FIT * strategic_fit_score + W_REVENUE * revenue_score, 2dp)
      CORE_BRAND variant (brand.core_flag = true):
        priority_score = min(100, round_half_up(W_STRATEGIC_FIT * strategic_fit_score + W_REVENUE * revenue_score, 2dp) + CORE_PRIORITY_BONUS)
    constants:
      REVENUE_REF_CENTS_YEAR3: 2000000000
      W_STRATEGIC_FIT: 0.60
      W_REVENUE: 0.40
      CORE_PRIORITY_BONUS: 10
    precision: "2 decimal places, round_half_up; CORE_BRAND bonus added after rounding, then capped at 100"
    variants:
      - name: STANDARD
        when: "brand.core_flag = false"
        difference: "plain weighted blend"
      - name: CORE_BRAND
        when: "brand.core_flag = true"
        difference: "+10 bonus points capped at 100; identical project inputs score strictly higher for a core brand"
    note: "Dual-variant rule (Rule 1, capital/portfolio domain). Worked fixture: fit 80, expected_revenue_cents_year3 1000000000 -> STANDARD 68.00 vs CORE_BRAND 78.00."

  - name: plant_load
    trigger: "recomputed whenever an Item is created, discontinued (finalize/TSA cascade), or its primary_plant_id changes (transfer execution); read on GET /portfolio/plants"
    algorithm: aggregation
    input_set: "Items with primary_plant_id = plant AND item_status IN {LISTED, CUT_PROPOSED, SELL_THROUGH}; DISCONTINUED items are EXCLUDED"
    formula: |
      committed_units_per_quarter = SUM(round_half_up(item.annual_units / 4, integer))   # per item, then sum
      utilization_pct = round_half_up(committed_units_per_quarter / quarterly_capacity_units * 100, 2dp)
    constants: {}
    precision: "committed units integer (per-item half-up); utilization 2dp half-up"

  - name: transfer_capacity_gate
    trigger: "on POST /portfolio/product-transfers (creation validation)"
    algorithm: threshold
    input_set: "target plant's committed set (as plant_load) plus the incoming item"
    formula: |
      incoming_quarterly = round_half_up(item.annual_units / 4, integer)
      projected = target.committed_units_per_quarter + incoming_quarterly
      ALLOW iff projected * 100 <= target.quarterly_capacity_units * TRANSFER_MAX_UTILIZATION_PCT   # PURE INTEGER comparison, no floats
      # boundary: projected utilization exactly 110.00% is ALLOWED; 110.01% is REJECTED (ERR_PLANT_OVER_CAPACITY)
    constants:
      TRANSFER_MAX_UTILIZATION_PCT: 110
    precision: "integer cross-multiplication; boundary exact"

  - name: negotiation_shelf_reduction
    trigger: "on POST /portfolio/combined-negotiations (creation); stored on the negotiation"
    algorithm: aggregation
    input_set: "the brand_terms array supplied in the request"
    formula: |
      total_baseline_facings = SUM(brand_terms[*].baseline_facings)
      total_proposed_facings = SUM(brand_terms[*].proposed_facings)
      shelf_reduction_pct = round_half_up((total_baseline_facings - total_proposed_facings) / total_baseline_facings * 100, 2dp)
                            if total_baseline_facings = 0 then shelf_reduction_pct := 0.00
      expires_at = created_at + NEGOTIATION_TTL_DAYS days
    constants:
      NEGOTIATION_TTL_DAYS: 30
    precision: "2 decimal places, round_half_up"

  - name: capital_waterfall
    trigger: "on POST /portfolio/capital-cycles/{id}/run-selection"
    algorithm: waterfall_allocation
    input_set: "InnovationProject with funding_cycle_id = cycle AND project_status = PROPOSED (empty set is legal: cycle locks with allocated_cents = 0)"
    formula: |
      rank = ORDER BY priority_score DESC, created_at ASC       # tie-break created_at, never id
      remaining = total_capital_cents
      for project in rank:
        if project.requested_capital_cents <= remaining:        # boundary: exact fit (==) FUNDS
          project -> FUNDED; allocated_cents += requested; remaining -= requested
        else:
          project -> DEFERRED                                   # skip and CONTINUE scanning (smaller later projects may still fund)
      invariant: allocated_cents + remaining_cents = total_capital_cents
    constants: {}
    precision: "integer cents"

  # appended calc entries pinning gate constants referenced by entity field descriptions
  - name: qualification_gate
    trigger: "on POST /portfolio/product-transfers/{id}/qualification-runs (each recorded run)"
    algorithm: threshold
    input_set: "the run payload (units_produced, units_rejected) and the parent transfer's consecutive_pass_count"
    formula: |
      result = PASS iff units_rejected * 10000 <= units_produced * QUAL_MAX_REJECT_RATE_BP
               (pure integer comparison, no rounding; boundary: exactly 250bp PASSES)
      on PASS: consecutive_pass_count += 1; on FAIL: consecutive_pass_count := 0
      when consecutive_pass_count reaches QUAL_REQUIRED_CONSECUTIVE_PASSES the transfer auto-executes
    constants:
      QUAL_MAX_REJECT_RATE_BP: 250
      QUAL_REQUIRED_CONSECUTIVE_PASSES: 2
    precision: "integer basis points; no rounding"

  - name: sell_through_window
    trigger: "on POST /portfolio/rationalization-cases/{id}/decide with decision=APPROVE"
    algorithm: threshold
    input_set: "the decide logical-clock timestamp"
    formula: |
      sell_through_deadline = decide_timestamp + SELL_THROUGH_DAYS days (time-of-day preserved)
      finalize is allowed iff logical clock >= sell_through_deadline (boundary: exactly at the deadline is allowed)
    constants:
      SELL_THROUGH_DAYS: 90
    precision: "whole seconds; date arithmetic on the logical clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the six declared roles", error_id: ERR_MISSING_ROLE, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-ID header present and non-empty", error_id: ERR_MISSING_USER_ID, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "endpoint permits the caller's role (§1.7)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "request body well-formed: required fields present, types correct, enum members valid, integer ranges honored (e.g. private_label_share_pct 0..100, strategic_fit_score 0..100, units_produced >= 1); unknown enum values rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "path id parameters resolve, left-to-right (e.g. /items/{id} then sub-action)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints" }
  - { priority: 6, category: existence, check: "body foreign-key ids resolve (brand_id, primary_plant_id, item_id, source_plant_id, target_plant_id, retailer_id, funding_cycle_id, brand_terms[*].brand_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with FK inputs" }
  - { priority: 7, category: state, check: "single-entity and cross-entity state guards: decide requires SCORED; finalize requires EXECUTING + item SELL_THROUGH; sign-spa requires PROPOSED; close requires SPA_SIGNED; separate requires CLOSED and TSA TERMINATED (else ERR_TSA_STILL_ACTIVE); terminate requires ACTIVE; respond requires TERMS_PROPOSED; run requires PLANNED or QUALIFYING; sell-down requires item LISTED or SELL_THROUGH; announce-closure requires OPERATING; complete-closure requires CLOSING; run-selection requires ALLOCATING; case create requires item not DISCONTINUED (an item in CUT_PROPOSED or SELL_THROUGH has an open case and is rejected at priority 11 instead); divestiture create requires brand not EXITED; item create requires brand ACTIVE or UNDER_REVIEW and primary plant OPERATING; project create requires brand ACTIVE or UNDER_REVIEW and cycle ALLOCATING", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action and creation endpoints" }
  - { priority: 8, category: state, check: "transfer create requires item LISTED (else ERR_ITEM_NOT_TRANSFERABLE) and target plant OPERATING (else ERR_TARGET_PLANT_NOT_OPERATING)", error_id: ERR_ITEM_NOT_TRANSFERABLE, http_status: 409, applies_to: "POST /portfolio/product-transfers" }
  - { priority: 9, category: business_constraint, check: "entity-backed ownership: BrandManager X-User-ID must equal brand_id on item/project creation; PlantDirector X-User-ID must equal transfer.target_plant_id when recording a run; RetailerBuyer X-User-ID must equal negotiation.retailer_id when responding; opaque roles exempt", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /portfolio/items, POST /portfolio/innovation-projects, POST /portfolio/product-transfers/{id}/qualification-runs, POST /portfolio/combined-negotiations/{id}/respond" }
  - { priority: 10, category: business_constraint, check: "segregation of duties: decide caller X-User-ID must differ from case proposer_user_id", error_id: ERR_SELF_DECISION, http_status: 403, applies_to: "POST /portfolio/rationalization-cases/{id}/decide" }
  - { priority: 11, category: business_constraint, check: "uniqueness: brand/plant/retailer name unique, item sku_code unique, cycle period_code unique (all ERR_DUPLICATE); at most one open RationalizationCase per item in {SCORED, EXECUTING} (ERR_CASE_ALREADY_OPEN); at most one open Divestiture per brand in {PROPOSED, SPA_SIGNED, CLOSED} (ERR_DIVESTITURE_ALREADY_OPEN); at most one open ProductTransfer per item in {PLANNED, QUALIFYING} (ERR_TRANSFER_ALREADY_OPEN); at most one TERMS_PROPOSED CombinedNegotiation per (retailer_id, period_code) (ERR_NEGOTIATION_ALREADY_OPEN)", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "creation endpoints" }
  - { priority: 12, category: business_referential, check: "transfer structure: target_plant_id != source_plant_id (ERR_SAME_PLANT); source_plant_id must equal item.primary_plant_id (ERR_SOURCE_PLANT_MISMATCH)", error_id: ERR_SAME_PLANT, http_status: 422, applies_to: "POST /portfolio/product-transfers" }
  - { priority: 13, category: business_constraint, check: "negotiation composition: brand_terms has 2..5 entries with distinct brand_ids (else ERR_NOT_COMBINED); every referenced brand has brand_status = ACTIVE (else ERR_BRAND_NOT_NEGOTIABLE — channel conflict guard); each facings integer >= 0", error_id: ERR_NOT_COMBINED, http_status: 422, applies_to: "POST /portfolio/combined-negotiations" }
  - { priority: 14, category: business_constraint, check: "divestiture eligibility: brand.core_flag must be false (ERR_BRAND_CORE); sign-spa requires tsa_start_date < tsa_end_date and tsa_start_date <= expected_close_date <= tsa_end_date (else ERR_CLOSE_DATE_OUTSIDE_TSA)", error_id: ERR_BRAND_CORE, http_status: 422, applies_to: "POST /portfolio/divestitures, POST /portfolio/divestitures/{id}/sign-spa" }
  - { priority: 15, category: business_constraint, check: "run payload sanity: units_rejected <= units_produced (else ERR_INVALID_RUN)", error_id: ERR_INVALID_RUN, http_status: 422, applies_to: "POST /portfolio/product-transfers/{id}/qualification-runs" }
  - { priority: 16, category: business_temporal, check: "capital cycle window: window_start < window_end and half-open [start, end) does not overlap any existing cycle's window (overlap iff start < other_end AND end > other_start; adjacency allowed) — else ERR_CYCLE_WINDOW_OVERLAP", error_id: ERR_CYCLE_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /portfolio/capital-cycles" }
  - { priority: 17, category: business_temporal, check: "negotiation window: effective_from < effective_to and CLOSED interval [effective_from, effective_to] does not overlap any other negotiation of the same retailer in {TERMS_PROPOSED, ACCEPTED} (overlap iff start <= other_end AND end >= other_start; shared boundary day IS overlap) — else ERR_NEGOTIATION_WINDOW_OVERLAP", error_id: ERR_NEGOTIATION_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /portfolio/combined-negotiations" }
  - { priority: 18, category: business_temporal, check: "respond TTL: logical clock > expires_at marks negotiation EXPIRED and rejects; clock == expires_at is still valid", error_id: ERR_NEGOTIATION_EXPIRED, http_status: 409, applies_to: "POST /portfolio/combined-negotiations/{id}/respond" }
  - { priority: 19, category: business_temporal, check: "finalize timing: logical clock >= item.sell_through_deadline (decide timestamp + 90 days), else ERR_SELL_THROUGH_OPEN; divestiture close timing: logical clock >= TSA start_date, else ERR_TSA_NOT_STARTED", error_id: ERR_SELL_THROUGH_OPEN, http_status: 409, applies_to: "POST /portfolio/rationalization-cases/{id}/finalize, POST /portfolio/divestitures/{id}/close" }
  - { priority: 20, category: business_fiscal, check: "transfer capacity gate: transfer_capacity_gate (integer comparison, <= 110% projected) else ERR_PLANT_OVER_CAPACITY", error_id: ERR_PLANT_OVER_CAPACITY, http_status: 422, applies_to: "POST /portfolio/product-transfers" }
  - { priority: 21, category: business_fiscal, check: "sell-down quantity: units_sold >= 1 and units_sold <= item.units_on_hand, else ERR_INSUFFICIENT_UNITS", error_id: ERR_INSUFFICIENT_UNITS, http_status: 422, applies_to: "POST /portfolio/items/{id}/sell-down" }
  - { priority: 22, category: business_fiscal, check: "project size: requested_capital_cents <= cycle total_capital_cents, else ERR_CAPITAL_REQUEST_TOO_LARGE", error_id: ERR_CAPITAL_REQUEST_TOO_LARGE, http_status: 422, applies_to: "POST /portfolio/innovation-projects" }
  - { priority: 23, category: business_constraint, check: "OCC: sell-down expected_item_version must equal item.version, else ERR_STALE_VERSION", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /portfolio/items/{id}/sell-down" }

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints; all under /portfolio except the clock)
# =============================================================================
endpoints:
  # --- platform (UNPREFIXED) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "UNPREFIXED platform endpoint (outside /portfolio). Sets the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock; all deadline/window/TTL rules read this clock."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutations"]

  # --- brands ---
  - method: POST
    path: "/portfolio/brands"
    description: "Create a brand (ACTIVE)."
    roles: [PortfolioManager]
    code: 201
    input: [name, category_name, core_flag, private_label_share_pct, annual_net_revenue_cents]
    output: Brand
    side_effects: []
  - method: GET
    path: "/portfolio/brands"
    description: "List brands with optional filters."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["brand_status?", "category_name?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []

  # --- items ---
  - method: POST
    path: "/portfolio/items"
    description: "Create an item (LISTED) under a brand, produced at a primary plant. BrandManager callers must own the brand (X-User-ID == brand_id)."
    roles: [PortfolioManager, BrandManager]
    code: 201
    input: [brand_id, primary_plant_id, sku_code, annual_units, unit_net_revenue_cents, unit_cost_cents, units_on_hand, "salvageable?"]
    output: Item
    side_effects: ["host Plant committed_units_per_quarter and utilization_pct recomputed (calc plant_load)"]
  - method: GET
    path: "/portfolio/items"
    description: "List items with optional filters (FK reverse-reachability for brand_id and primary_plant_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["brand_id?", "primary_plant_id?", "item_status?", "limit?", "offset?"]
    output: Item[]
    side_effects: []
  - method: GET
    path: "/portfolio/items/{id}"
    description: "Get one item."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: POST
    path: "/portfolio/items/{id}/sell-down"
    description: "Sell down finished-goods inventory (OCC-guarded). Allowed while item LISTED or SELL_THROUGH."
    roles: [SupplyChainPlanner]
    code: 200
    input: [units_sold, expected_item_version]
    output: Item
    side_effects: ["units_on_hand -= units_sold", "units_sold_cumulative += units_sold", "increments Item.version by 1", "conserves unit balance (invariant inv_item_unit_and_listed)"]

  # --- plants ---
  - method: POST
    path: "/portfolio/plants"
    description: "Create a plant (OPERATING)."
    roles: [PortfolioManager]
    code: 201
    input: [name, quarterly_capacity_units]
    output: Plant
    side_effects: []
  - method: GET
    path: "/portfolio/plants"
    description: "List plants (includes computed committed_units_per_quarter and utilization_pct)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["plant_status?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []
  - method: POST
    path: "/portfolio/plants/{id}/announce-closure"
    description: "Announce plant closure: OPERATING -> CLOSING, sets closure_date."
    roles: [PortfolioManager]
    code: 200
    input: [closure_date]
    output: Plant
    side_effects: ["plant_status := CLOSING", "closure_date := input", "increments Plant.version by 1"]
  - method: POST
    path: "/portfolio/plants/{id}/complete-closure"
    description: "Complete plant closure: CLOSING -> CLOSED. Guarded: no live items primarily produced here and no open transfers sourced here."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: Plant
    side_effects: ["plant_status := CLOSED", "increments Plant.version by 1"]

  # --- retailers ---
  - method: POST
    path: "/portfolio/retailers"
    description: "Create a retailer."
    roles: [PortfolioManager]
    code: 201
    input: [name, risk_rating]
    output: Retailer
    side_effects: []

  # --- rationalization cases ---
  - method: POST
    path: "/portfolio/rationalization-cases"
    description: "Propose cutting an item. Computes and stores the four sub-scores, composite_score and recommendation at creation; item LISTED -> CUT_PROPOSED."
    roles: [PortfolioManager]
    code: 201
    input: [item_id]
    output: RationalizationCase
    side_effects: ["calc rationalization_composite_score stored on the case", "proposer_user_id := X-User-ID", "item -> CUT_PROPOSED", "increments Item.version by 1"]
  - method: GET
    path: "/portfolio/rationalization-cases"
    description: "List cases (FK reverse-reachability for item_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["item_id?", "case_status?", "limit?", "offset?"]
    output: RationalizationCase[]
    side_effects: []
  - method: GET
    path: "/portfolio/rationalization-cases/{id}"
    description: "Get one case."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: RationalizationCase
    side_effects: []
  - method: POST
    path: "/portfolio/rationalization-cases/{id}/decide"
    description: "Decide a SCORED case. APPROVE -> EXECUTING and item -> SELL_THROUGH (deadline = now + 90 days); REJECT -> REJECTED and item -> LISTED (compensation). Decider must differ from proposer."
    roles: [PortfolioManager]
    code: 200
    input: [decision]
    output: RationalizationCase
    side_effects: ["decider_user_id := X-User-ID", "APPROVE: item -> SELL_THROUGH, sell_through_deadline := clock + SELL_THROUGH_DAYS(90)", "REJECT: item -> LISTED", "increments RationalizationCase.version by 1", "increments Item.version by 1"]
  - method: POST
    path: "/portfolio/rationalization-cases/{id}/finalize"
    description: "Finalize an EXECUTING case once the sell-through window has elapsed: item -> DISCONTINUED, obsolescence charge posted, inventory written off, plant load recomputed."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: RationalizationCase
    side_effects: ["case -> EXECUTED", "item -> DISCONTINUED (calc obsolescence_charge; units_written_off_cumulative += units_on_hand; units_on_hand := 0)", "host Plant committed_units_per_quarter and utilization_pct recomputed (cascade hop 2)", "increments RationalizationCase.version by 1", "increments Item.version by 1"]

  # --- divestitures ---
  - method: POST
    path: "/portfolio/divestitures"
    description: "Propose divesting a non-core ACTIVE brand; brand -> UNDER_REVIEW."
    roles: [PortfolioManager]
    code: 201
    input: [brand_id, acquirer_name, headline_price_cents, expected_close_date]
    output: Divestiture
    side_effects: ["brand -> UNDER_REVIEW", "increments Brand.version by 1"]
  - method: GET
    path: "/portfolio/divestitures"
    description: "List divestitures (FK reverse-reachability for brand_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["brand_id?", "divestiture_status?", "limit?", "offset?"]
    output: Divestiture[]
    side_effects: []
  - method: GET
    path: "/portfolio/divestitures/{id}"
    description: "Get one divestiture."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: Divestiture
    side_effects: []
  - method: POST
    path: "/portfolio/divestitures/{id}/sign-spa"
    description: "Sign the sale-and-purchase agreement with embedded TSA terms: PROPOSED -> SPA_SIGNED; creates the TSA (DRAFT); brand -> DIVESTING."
    roles: [PortfolioManager]
    code: 200
    input: [tsa_monthly_fee_cents, tsa_start_date, tsa_end_date]
    output: Divestiture
    side_effects: ["creates TransitionServiceAgreement (DRAFT) with supplied fee/window", "brand -> DIVESTING", "increments Divestiture.version by 1", "increments Brand.version by 1"]
  - method: POST
    path: "/portfolio/divestitures/{id}/close"
    description: "Close the divestiture once the TSA window has started: SPA_SIGNED -> CLOSED; TSA DRAFT -> ACTIVE; brand -> DIVESTED."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: Divestiture
    side_effects: ["TSA DRAFT -> ACTIVE", "brand -> DIVESTED", "increments Divestiture.version by 1", "increments TransitionServiceAgreement.version by 1", "increments Brand.version by 1"]
  - method: POST
    path: "/portfolio/divestitures/{id}/separate"
    description: "Final separation: CLOSED -> SEPARATED; requires TSA TERMINATED; brand -> EXITED."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: Divestiture
    side_effects: ["brand -> EXITED", "increments Divestiture.version by 1", "increments Brand.version by 1"]

  # --- transition service agreements ---
  - method: GET
    path: "/portfolio/tsas"
    description: "List TSAs (FK reverse-reachability for divestiture_id; the only read channel for the TSA created by sign-spa)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["divestiture_id?", "tsa_status?", "limit?", "offset?"]
    output: TransitionServiceAgreement[]
    side_effects: []
  - method: GET
    path: "/portfolio/tsas/{id}"
    description: "Get one TSA."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: TransitionServiceAgreement
    side_effects: []
  - method: POST
    path: "/portfolio/tsas/{id}/terminate"
    description: "Terminate an ACTIVE TSA. Early termination (clock < end_date) posts early_termination_penalty_cents per calc tsa_early_termination_penalty; natural termination (clock >= end_date) posts 0. Cascade: divested brand's live items -> DISCONTINUED with obsolescence charges; their open cases -> VOIDED; host plants recompute load."
    roles: [FinanceController]
    code: 200
    input: []
    output: TransitionServiceAgreement
    side_effects: ["tsa -> TERMINATED, terminated_at := logical clock", "calc tsa_early_termination_penalty", "cascade: items DISCONTINUED (calc obsolescence_charge each)", "cascade: open cases VOIDED", "cascade: plants recompute committed_units_per_quarter and utilization_pct", "increments TransitionServiceAgreement.version by 1"]

  # --- product transfers & qualification runs ---
  - method: POST
    path: "/portfolio/product-transfers"
    description: "Plan a product transfer of a LISTED item from its current primary plant to another OPERATING plant. Subject to the 110% projected-utilization capacity gate on the target."
    roles: [SupplyChainPlanner]
    code: 201
    input: [item_id, source_plant_id, target_plant_id]
    output: ProductTransfer
    side_effects: []
  - method: GET
    path: "/portfolio/product-transfers"
    description: "List transfers (FK reverse-reachability for item_id, source_plant_id, target_plant_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["item_id?", "source_plant_id?", "target_plant_id?", "transfer_status?", "limit?", "offset?"]
    output: ProductTransfer[]
    side_effects: []
  - method: GET
    path: "/portfolio/product-transfers/{id}"
    description: "Get one transfer."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: ProductTransfer
    side_effects: []
  - method: POST
    path: "/portfolio/product-transfers/{id}/qualification-runs"
    description: "Record a qualification run at the target plant. Caller must be the PlantDirector of the transfer's target plant (X-User-ID == target_plant_id). PASS/FAIL computed by reject-rate gate; first run moves PLANNED -> QUALIFYING; a FAIL resets consecutive_pass_count to 0; the PASS that reaches 2 consecutive passes auto-executes the transfer."
    roles: [PlantDirector]
    code: 201
    input: [run_date, units_produced, units_rejected]
    output: QualificationRun
    side_effects: ["result computed (PASS iff units_rejected * 10000 <= units_produced * 250)", "certifier_plant_id := X-User-ID", "transfer PLANNED -> QUALIFYING on first run", "consecutive_pass_count incremented on PASS, reset to 0 on FAIL", "on reaching 2 consecutive passes: transfer -> EXECUTED, item.primary_plant_id := target_plant_id, both plants recompute load", "increments ProductTransfer.version by 1; on auto-execution also increments Item.version by 1"]
  - method: GET
    path: "/portfolio/product-transfers/{id}/qualification-runs"
    description: "List qualification runs of a transfer (FK reverse-reachability for QualificationRun.transfer_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: QualificationRun[]
    side_effects: []

  # --- combined negotiations ---
  - method: POST
    path: "/portfolio/combined-negotiations"
    description: "Open a combined multi-brand negotiation with one retailer (single buyer covers all brands in brand_terms). Terms are proposed at creation (state TERMS_PROPOSED); shelf-reduction aggregates computed."
    roles: [PortfolioManager]
    code: 201
    input: [retailer_id, period_code, brand_terms, effective_from, effective_to]
    output: CombinedNegotiation
    side_effects: ["calc negotiation_shelf_reduction (totals, shelf_reduction_pct, expires_at := created_at + 30 days)"]
  - method: GET
    path: "/portfolio/combined-negotiations"
    description: "List negotiations (FK reverse-reachability for retailer_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["retailer_id?", "negotiation_status?", "limit?", "offset?"]
    output: CombinedNegotiation[]
    side_effects: []
  - method: GET
    path: "/portfolio/combined-negotiations/{id}"
    description: "Get one negotiation."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: CombinedNegotiation
    side_effects: []
  - method: POST
    path: "/portfolio/combined-negotiations/{id}/respond"
    description: "The retailer's buyer accepts or rejects the combined terms. After expires_at the negotiation auto-transitions to EXPIRED and the call fails with ERR_NEGOTIATION_EXPIRED."
    roles: [RetailerBuyer]
    code: 200
    input: [response]
    output: CombinedNegotiation
    side_effects: ["ACCEPT -> ACCEPTED; REJECT -> REJECTED; past TTL -> EXPIRED", "increments CombinedNegotiation.version by 1"]

  # --- capital cycles & innovation projects ---
  - method: POST
    path: "/portfolio/capital-cycles"
    description: "Create a capital cycle (ALLOCATING) with a half-open funding window; windows may not overlap existing cycles."
    roles: [FinanceController]
    code: 201
    input: [period_code, total_capital_cents, window_start, window_end]
    output: CapitalCycle
    side_effects: []
  - method: POST
    path: "/portfolio/capital-cycles/{id}/run-selection"
    description: "Run the allocation waterfall over this cycle's PROPOSED projects (priority_score DESC, created_at ASC tie-break; skip-and-continue on overflow), then lock the cycle. Response carries allocated_cents and remaining_cents."
    roles: [FinanceController]
    code: 200
    input: []
    output: CapitalCycle
    side_effects: ["calc capital_waterfall: projects -> FUNDED or DEFERRED", "cycle -> LOCKED", "increments CapitalCycle.version by 1", "increments each touched InnovationProject.version by 1"]
  - method: POST
    path: "/portfolio/innovation-projects"
    description: "Propose an innovation project into an ALLOCATING cycle. BrandManager callers must own the brand. priority_score computed at creation (STANDARD or CORE_BRAND variant)."
    roles: [PortfolioManager, BrandManager]
    code: 201
    input: [brand_id, funding_cycle_id, title, requested_capital_cents, expected_revenue_cents_year3, strategic_fit_score]
    output: InnovationProject
    side_effects: ["calc innovation_priority_score stored as priority_score"]
  - method: GET
    path: "/portfolio/innovation-projects"
    description: "List innovation projects (FK reverse-reachability for brand_id and funding_cycle_id)."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: ["brand_id?", "funding_cycle_id?", "project_status?", "limit?", "offset?"]
    output: InnovationProject[]
    side_effects: []
  - method: GET
    path: "/portfolio/innovation-projects/{id}"
    description: "Get one innovation project."
    roles: [PortfolioManager, BrandManager, PlantDirector, RetailerBuyer, SupplyChainPlanner, FinanceController]
    code: 200
    input: []
    output: InnovationProject
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, invalid enum member, or out-of-range value" }
  - { id: ERR_MISSING_ROLE, http: 401, condition: "X-User-Role header absent or not one of the six declared roles" }
  - { id: ERR_MISSING_USER_ID, http: 401, condition: "X-User-ID header absent or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller's X-User-ID does not match the required owning entity id (brand, target plant, or retailer)" }
  - { id: ERR_SELF_DECISION, http: 403, condition: "Case decider X-User-ID equals the case proposer_user_id (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that permits the requested action (generic state guard)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique scalar violated: brand/plant/retailer name, item sku_code, cycle period_code" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "Item already has an open RationalizationCase (SCORED or EXECUTING)" }
  - { id: ERR_DIVESTITURE_ALREADY_OPEN, http: 409, condition: "Brand already has an open Divestiture (PROPOSED, SPA_SIGNED, or CLOSED)" }
  - { id: ERR_TRANSFER_ALREADY_OPEN, http: 409, condition: "Item already has an open ProductTransfer (PLANNED or QUALIFYING)" }
  - { id: ERR_NEGOTIATION_ALREADY_OPEN, http: 409, condition: "Retailer already has a TERMS_PROPOSED negotiation for the same period_code" }
  - { id: ERR_ITEM_NOT_TRANSFERABLE, http: 409, condition: "Transfer create: item_status is not LISTED" }
  - { id: ERR_TARGET_PLANT_NOT_OPERATING, http: 409, condition: "Transfer create: target plant is CLOSING or CLOSED" }
  - { id: ERR_TSA_NOT_STARTED, http: 409, condition: "Divestiture close: logical clock is before the TSA start_date" }
  - { id: ERR_TSA_STILL_ACTIVE, http: 409, condition: "Divestiture separate: TSA is not TERMINATED" }
  - { id: ERR_SELL_THROUGH_OPEN, http: 409, condition: "Case finalize: logical clock is before the item's sell_through_deadline" }
  - { id: ERR_NEGOTIATION_EXPIRED, http: 409, condition: "Respond after expires_at (created_at + 30 days); negotiation auto-transitions to EXPIRED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_item_version does not match the item's current version on sell-down" }
  - { id: ERR_SAME_PLANT, http: 422, condition: "Transfer create: target_plant_id equals source_plant_id" }
  - { id: ERR_SOURCE_PLANT_MISMATCH, http: 422, condition: "Transfer create: source_plant_id differs from item.primary_plant_id" }
  - { id: ERR_NOT_COMBINED, http: 422, condition: "Negotiation brand_terms has fewer than 2 or more than 5 entries, or duplicate brand_ids" }
  - { id: ERR_BRAND_NOT_NEGOTIABLE, http: 422, condition: "Negotiation includes a brand whose brand_status is not ACTIVE (channel-conflict guard)" }
  - { id: ERR_BRAND_CORE, http: 422, condition: "Divestiture proposed for a brand with core_flag = true" }
  - { id: ERR_CLOSE_DATE_OUTSIDE_TSA, http: 422, condition: "Sign-spa: expected_close_date not within [tsa_start_date, tsa_end_date], or tsa_start_date >= tsa_end_date" }
  - { id: ERR_INVALID_RUN, http: 422, condition: "Qualification run: units_rejected > units_produced" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 422, condition: "Capital cycle half-open window [window_start, window_end) overlaps an existing cycle's window" }
  - { id: ERR_NEGOTIATION_WINDOW_OVERLAP, http: 422, condition: "Negotiation closed window [effective_from, effective_to] overlaps another TERMS_PROPOSED/ACCEPTED negotiation of the same retailer (shared boundary day counts as overlap)" }
  - { id: ERR_PLANT_OVER_CAPACITY, http: 422, condition: "Transfer create: projected utilization of target plant exceeds 110% (integer gate: projected * 100 > capacity * 110)" }
  - { id: ERR_INSUFFICIENT_UNITS, http: 422, condition: "Sell-down units_sold exceeds item.units_on_hand (or units_sold < 1)" }
  - { id: ERR_CAPITAL_REQUEST_TOO_LARGE, http: 422, condition: "Innovation project requested_capital_cents exceeds the cycle's total_capital_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortfolioManager
    description: "Corporate portfolio executive; owns brands, plants, retailers, rationalization cases, divestitures, footprint closures, and combined negotiations"
    identity: opaque
    exclusive_operations: ["POST /portfolio/brands", "POST /portfolio/plants", "POST /portfolio/plants/{id}/announce-closure", "POST /portfolio/plants/{id}/complete-closure", "POST /portfolio/retailers", "POST /portfolio/rationalization-cases", "POST /portfolio/rationalization-cases/{id}/decide", "POST /portfolio/rationalization-cases/{id}/finalize", "POST /portfolio/divestitures", "POST /portfolio/divestitures/{id}/sign-spa", "POST /portfolio/divestitures/{id}/close", "POST /portfolio/divestitures/{id}/separate", "POST /portfolio/combined-negotiations"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc", "POST /portfolio/items", "POST /portfolio/innovation-projects"]
  - name: BrandManager
    description: "Manages one brand; X-User-ID equals the managed Brand.id"
    identity: "entity_backed:Brand"
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc", "POST /portfolio/items (own brand only)", "POST /portfolio/innovation-projects (own brand only)"]
  - name: PlantDirector
    description: "Directs one plant; X-User-ID equals the directed Plant.id; certifies qualification runs at that plant"
    identity: "entity_backed:Plant"
    exclusive_operations: ["POST /portfolio/product-transfers/{id}/qualification-runs (only when X-User-ID == transfer.target_plant_id)"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: RetailerBuyer
    description: "The retailer's single buyer covering multiple brands; X-User-ID equals the Retailer.id"
    identity: "entity_backed:Retailer"
    exclusive_operations: ["POST /portfolio/combined-negotiations/{id}/respond (own retailer only)"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: SupplyChainPlanner
    description: "Plans product transfers between plants and manages finished-goods sell-down"
    identity: opaque
    exclusive_operations: ["POST /portfolio/product-transfers", "POST /portfolio/items/{id}/sell-down"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: FinanceController
    description: "Controls capital cycles and allocation, and terminates TSAs (penalty authority)"
    identity: opaque
    exclusive_operations: ["POST /portfolio/capital-cycles", "POST /portfolio/capital-cycles/{id}/run-selection", "POST /portfolio/tsas/{id}/terminate"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

# =============================================================================
# Named invariants (referenced by §1.8/§1.9)
# =============================================================================
invariants:
  - id: inv_item_unit_and_listed
    statement: "Per item: units_on_hand + units_sold_cumulative + units_written_off_cumulative == units_on_hand_at_creation, across every sell-down, finalize, and TSA-terminate cascade; separately, decide=REJECT restores item LISTED so the brand's LISTED-item count is unchanged across propose+reject."
  - id: inv_capital_conservation
    statement: "Per capital cycle after run-selection: allocated_cents + remaining_cents == total_capital_cents."
