    instances:

      - name: stale_order_version_on_shipment_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-create-stale-order]
          - errors[ERR_STALE_VERSION]
          - entities.Order.fields.version
        distinguishing_aspect: "The order is ALLOCATED with no open shipment and the carrier accepts the class, so every rule from 10 downward would pass; supplying an expected_order_version one behind the current value fires ERR_STALE_VERSION at HTTP 412 and creates no Shipment row."
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, one all-classes carrier, one STANDARD TX account, model IB-AGM-95 and a 30-unit lot."
            - "One order of 2 units submitted and allocated, whose version was captured from the allocate response."
