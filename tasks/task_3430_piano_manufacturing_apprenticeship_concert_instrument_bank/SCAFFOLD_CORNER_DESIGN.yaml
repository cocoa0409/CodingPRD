  - section: validations
    instances:
      - name: shape_validation_beats_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "Priority 3 beats 4: advance with hours_applied 0 (shape violation) and an illegal stage target returns ERR_VALIDATION, not ERR_BUILD_STAGE_INVALID."
        test_recipe:
          setup: ["build at SEASONING, version 3"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
