          setup:
            - "Clock 2026-09-01; Market LIT budget 10000000; GUARANTEE ACTIVE (500000 / min 1); driver enrolled; one COMPLETED 100000 ride; settlement FINALIZED (make_up 400000); fraud flag OPEN on the ride."
