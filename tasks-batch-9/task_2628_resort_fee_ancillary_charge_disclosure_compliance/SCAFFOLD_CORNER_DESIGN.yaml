            - "the 650 term is 325 * MODEL_REFERENCE_GUESTS (2) — the constant, not the 2 guests of any particular booking, which is why the figure is stable across bookings"
            - "data.inclusion_coverage_ratio == 1.0000, printed with exactly four fractional digits: 3 of 3 mandatory fees carry an inclusion with included_value_cents > 0"
            - "Property.${p1}.published_fee_program_count == 1 and GET /properties/${p1}/disclosure-summary echoes total_mandatory_fee_cents_per_night 4388"

      - name: posture_excludes_draft_profiles_from_the_minimum_score
        claim_type: input_set_filtering
        grounds:
          - calculations.property_disclosure_posture
          - state_machines.ChannelDisclosureProfile
        distinguishing_aspect: "The candidate set is exactly {DEPLOYED, FLAGGED, REMEDIATED}: a DRAFT profile scoring 10 sits in the database the whole time and must never lower min_channel_disclosure_score, which would otherwise read 10 and flip the posture to AT_RISK."
