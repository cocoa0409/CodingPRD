            - {call: "POST /shadow-deployments/{id}/grant-grace", payload: {grace_days: 10}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {sd_v2: "$.data.version"}}
          trigger:
            - {call: "POST /shadow-deployments/{id}/grant-grace", payload: {grace_days: 5}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the first grant moved the row DISCOVERED -> GRACE_GRANTED at version 2 with grace_days_granted 10 and grace_deadline_at 2026-09-10T00:00:00Z"
            - "HTTP 409 with data.error_id == ERR_SHADOW_NOT_ACTIONABLE"
            - "grace_days_granted is still 10 and grace_deadline_at is still 2026-09-10T00:00:00Z - the second grant neither overwrote nor accumulated"
            - "the response is NOT ERR_GRACE_PERIOD_ELAPSED: the clock is inside the deadline"

