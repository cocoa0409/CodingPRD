              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2845700, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15", commission_eligible: true, max_commission_bps: 1000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-4001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
