      - name: withdrawal_is_refused_at_every_post_closing_stage_and_closeout_needs_clean_monitoring_and_ledger
        claim_type: conditional_action
        grounds:
          - validations.priority_61
          - validations.priority_45
          - validations.priority_57
          - endpoints.POST_mitigation_projects_project_id_closeout
          - calculations.monitoring_schedule
          - calculations.program_income_federal_share
        distinguishing_aspect: |
          One acquisition carried to OPEN_SPACE_RECORDED shows the withdrawal door closing at three
          successive acquisition states (CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED all return
          ERR_OPEN_SPACE_RESTRICTION_ACTIVE) and then shows closeout gated twice on different derived
          state: INITIATE is refused while a recorded restriction's next_monitoring_due_date has passed
          (ERR_MONITORING_OVERDUE), and after a compliant inspection re-anchors the schedule, FINALIZE
          is refused while program_income_balance_cents is non-zero (ERR_PROGRAM_INCOME_OUTSTANDING).
          Reversing the ledger entry returns the balance to 0 and the same FINALIZE then succeeds.
        test_recipe:
          setup:
            - "The golden path through a FUNDED closing (parcel CLOSED) on a project whose period_of_performance_end_date is 2030-12-31, plus an ACTIVE asbestos-certified contractor."
