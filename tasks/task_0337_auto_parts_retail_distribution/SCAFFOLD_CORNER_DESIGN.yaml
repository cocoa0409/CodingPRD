  # ===========================================================================
  - section: errors
    instances:
      - name: err_duplicate_bay_code_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_BAY_CODE]"]
        distinguishing_aspect: "Creating a second Bay with an existing code returns ERR_DUPLICATE_BAY_CODE 409."
        test_recipe:
          setup: ["a Bay with code BAY-Z exists"]
          setup_api_calls:
            - call: "POST /bays"
              payload: { code: "BAY-Z" }
              as: WholesaleRep
          trigger:
            - call: "POST /bays"
              payload: { code: "BAY-Z" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_BAY_CODE with HTTP 409"

      - name: err_run_order_not_ready_on_dispatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_RUN_ORDER_NOT_READY]", "state_machines.DeliveryRun.SCHEDULED_to_DISPATCHED"]
        distinguishing_aspect: "Dispatching a run whose referenced order is still OPEN (not ALLOCATED/SHIPPED) returns ERR_RUN_ORDER_NOT_READY 409."
        test_recipe:
          setup: ["a scheduled run created against an order, then... order must be allocated to schedule run; build an OPEN order separately"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "RR-1", description: "Special", list_price_cents: 7000, cost_cents: 3000, stockable: false, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "Drv", turnaround_min: 0 }
              as: WholesaleRep
              captures: { drv: $.data.id }
            - call: "POST /bays"
              payload: { code: "BAY-RR" }
              as: WholesaleRep
              captures: { bay: $.data.id }
            # allocated order to legally create the run
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { ord_alloc: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord_alloc}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord_alloc}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${ord_alloc}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
            - call: "POST /delivery-runs"
              payload: { order_id: "${ord_alloc}", driver_id: "${drv}", bay_id: "${bay}", window_start_min: 10, window_end_min: 50 }
              as: WholesaleRep
              captures: { run_id: $.data.id }
            # now cancel the order's allocation so it is no longer ALLOCATED/SHIPPED
            - call: "POST /sales-orders/${ord_alloc}/cancel"
              as: WholesaleRep
          trigger:
            - call: "POST /delivery-runs/${run_id}/dispatch"
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RUN_ORDER_NOT_READY with HTTP 409"

