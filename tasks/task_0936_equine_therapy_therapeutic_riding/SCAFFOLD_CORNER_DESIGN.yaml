  - section: validations
    instances:
      - name: session_create_missing_required_duration_returns_400
        claim_type: violation_to_error
        grounds: ['validations[priority=6]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Omitting the required duration_minutes on POST /sessions is caught at rung 6 with ERR_VALIDATION before any existence or gate rung runs."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; one horse, one instructor, one rider - none of them needs to be valid for this rung."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_B", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: [] }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:00:00Z" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP status 400"
            - "The response is NOT ERR_RIDER_NOT_ACTIVE even though the rider is still INTAKE"

      - name: rider_create_invalid_enum_band_returns_400
        claim_type: violation_to_error
        grounds: ['validations[priority=8]', 'errors[ERR_INVALID_ENUM]', 'constants.ENUM_ERROR_FIELD_LIST']
        distinguishing_aspect: "household_income_band is on ENUM_ERROR_FIELD_LIST, so the value BAND_Z returns ERR_INVALID_ENUM, not ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_Z", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: [] }
              as: IntakeCoordinator
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_INVALID_ENUM with HTTP status 400"
            - "GET /riders returns total_count == 0"

      - name: riders_list_invalid_enum_query_filter_returns_400_as_validation
        claim_type: violation_to_error
        grounds: ['validations[priority=8]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "The ENUM_ERROR_FIELD_LIST is closed and applies only to request BODY fields, so an out-of-range status QUERY parameter returns ERR_VALIDATION rather than ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /riders"
              payload: { status: "BANANA" }
              as: IntakeCoordinator
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP status 400"
            - "The response is NOT ERR_INVALID_ENUM"

      - name: session_create_with_unknown_rider_and_horse_returns_rider_not_found_first
        claim_type: cascading_validation
        grounds: ['validations[priority=13]', 'errors[ERR_RIDER_NOT_FOUND]', 'errors[ERR_HORSE_NOT_FOUND]']
        distinguishing_aspect: "Body foreign keys are validated in the declared order rider_id then horse_id, so a request with BOTH unknown returns ERR_RIDER_NOT_FOUND."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; one instructor exists so only the rider and horse ids are unknown."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
