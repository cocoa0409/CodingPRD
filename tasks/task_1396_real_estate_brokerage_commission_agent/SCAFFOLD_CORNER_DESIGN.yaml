  # ==================================================================
  - section: validations
    instances:
      - name: put_nonexistent_deal_missing_fields_returns_invalid_request
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Schema (priority 5) precedes existence (priority 6): a PUT to a nonexistent deal id with an incomplete body returns 400 ERR_INVALID_REQUEST, not 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "PUT /brokerage/deals/00000000-0000-0000-0000-000000000000"
              payload: { address: "Only Address" }
              as: TransactionCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status 400 and ${err} == ERR_INVALID_REQUEST (schema beats existence)"

      - name: deal_fiscal_validation_battery
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_NONPOSITIVE_GROSS]", "errors[ERR_COBROKE_EXCEEDS_GROSS]", "errors[ERR_PCT_OUT_OF_RANGE]"]
        distinguishing_aspect: "Fiscal guards on deal create: gross 0 -> ERR_NONPOSITIVE_GROSS; cobroke == gross -> ERR_COBROKE_EXCEEDS_GROSS; referral_pct 1.5 -> ERR_PCT_OUT_OF_RANGE."
        test_recipe:
          setup: ["agent ACTIVE; a second agent exists as a valid referral target so the pct check reaches priority 17"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Fiscal Fred", email: "ff2@x.com", license_number: "LIC-FV1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents"
              payload: { full_name: "Ref Target", email: "rt@x.com", license_number: "LIC-FV2", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "90 Zero St", gross_commission_cents: 0, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "91 Cobroke Ct", gross_commission_cents: 500000, closing_date: "2026-01-15", cobroke_payout_cents: 500000, cobroke_payee_name: "Outside" }
              as: TransactionCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "92 Pct Pl", gross_commission_cents: 500000, closing_date: "2026-01-15", referral_pct: 1.5, referral_agent_id: "${ref_id}" }
              as: TransactionCoordinator
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_NONPOSITIVE_GROSS, ${e2} == ERR_COBROKE_EXCEEDS_GROSS (cobroke must be strictly < gross), ${e3} == ERR_PCT_OUT_OF_RANGE"
            - "no deals persisted for ${ag_id}"

      - name: plan_tier_shape_validation
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_PLAN_TIERS_INVALID]"]
        distinguishing_aspect: "Tier list shape is enforced: non-ascending thresholds and a nonzero final broker_split_pct are both ERR_PLAN_TIERS_INVALID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerage/plans"
              payload: { name: "BadTiers1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 1000000, broker_split_pct: 0.20 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/plans"
              payload: { name: "BadTiers2", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 } ] }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_PLAN_TIERS_INVALID (descending thresholds)"
            - "${e2} == ERR_PLAN_TIERS_INVALID (final tier must have broker_split_pct 0)"

      - name: referral_cobroke_linkage_battery
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_REFERRAL_INCOMPLETE]", "errors[ERR_COBROKE_PAYEE_MISSING]"]
        distinguishing_aspect: "Conditional-linkage validation: referral_pct > 0 without referral_agent_id (and vice versa) -> ERR_REFERRAL_INCOMPLETE; cobroke amount without payee name -> ERR_COBROKE_PAYEE_MISSING."
        test_recipe:
          setup: ["agent ACTIVE"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Link Lora", email: "ll4@x.com", license_number: "LIC-LK1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
          trigger:
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "93 Half Ref", gross_commission_cents: 500000, closing_date: "2026-01-15", referral_pct: 0.25 }
              as: TransactionCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "94 No Payee", gross_commission_cents: 500000, closing_date: "2026-01-15", cobroke_payout_cents: 100000 }
              as: TransactionCoordinator
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_REFERRAL_INCOMPLETE"
            - "${e2} == ERR_COBROKE_PAYEE_MISSING"

      - name: duplicate_license_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_LICENSE_NUMBER_TAKEN]"]
        distinguishing_aspect: "license_number is globally unique: a second agent with the same license is rejected ERR_LICENSE_NUMBER_TAKEN (409)."
        test_recipe:
          setup: ["one agent with license LIC-DUP"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "First", email: "f@x.com", license_number: "LIC-DUP", joined_at: "2025-09-01" }
              as: BrokerAdmin
          trigger:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Second", email: "s@x.com", license_number: "LIC-DUP", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status 409 and ${err} == ERR_LICENSE_NUMBER_TAKEN"

      - name: clock_regression_and_future_closing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CLOCK_REGRESSION]", "errors[ERR_FUTURE_CLOSING]"]
        distinguishing_aspect: "Temporal guards on the clock and on closing: setting the clock to the default instant (not strictly greater) is ERR_CLOCK_REGRESSION; closing a deal with a future actual_closing_date is ERR_FUTURE_CLOSING."
        test_recipe:
          setup: ["agent ACTIVE; deal PENDING_CLOSING with closing_date 2026-01-15"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Clock Carol", email: "cc@x.com", license_number: "LIC-CK1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "95 Future Ave", gross_commission_cents: 100000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: { actual_closing_date: "2026-12-31" }
              as: TransactionCoordinator
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_CLOCK_REGRESSION (2026-07-01 is before the default 2026-08-01)"
            - "${e2} == ERR_FUTURE_CLOSING (actual closing after the clock date)"
            - "deal remains PENDING_CLOSING"

      - name: settle_without_enrollment_returns_no_plan_enrollment
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_NO_PLAN_ENROLLMENT]"]
        distinguishing_aspect: "A CLOSED deal for an ACTIVE agent with no covering enrollment fails settle with ERR_NO_PLAN_ENROLLMENT (the pure referential path, distinct from the state-first priority instance in §1.8)."
        test_recipe:
          setup: ["agent ACTIVE, never enrolled; deal carried to CLOSED"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "NoPlan Nate", email: "nn@x.com", license_number: "LIC-NP1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "96 Coverage Gap", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_PLAN_ENROLLMENT and no Settlement row is created"

      - name: priority_conflicts_state_referential_temporal_fiscal_safety
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=9]", "validations[priority=10]", "validations[priority=15]", "validations[priority=17]"]
        excluded_because:
          difficulty_instance: settle_state_error_beats_missing_enrollment_referential
          rationale: "All three dual-failure priority pairs (state>referential, temporal>fiscal, state>safety) are asserted by the three §1.8 priority_pair_validation_conflict instances."

