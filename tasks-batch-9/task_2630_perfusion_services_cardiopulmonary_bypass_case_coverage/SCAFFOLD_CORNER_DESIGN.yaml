          - state_machines.BypassCase.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_bypass_and_billing_dimensions_advance_independently
          rationale: "The parallel-shape row asks exactly what that §1.8 instance asserts: the two BypassCase dimensions advance on different triggers and the combined state is correct after each."
      - name: critical_alarm_cascade_reaches_case_checklist_and_ledger
        claim_type: cascade_down
        grounds:
          - state_machines.PerfusionDevice.AVAILABLE_or_RESERVED_or_IN_USE_to_NEEDS_SERVICE
          - endpoints[POST /perfusion-devices/{id}/event-logs]
        excluded_because:
          difficulty_instance: transitive_cascade / critical_alarm_cascades_device_case_checklist_billing
          rationale: "The four-link device -> case -> checklist -> billing chain, including the ordering of affected cases, is the whole subject of that §1.8 instance."
      - name: systemic_finding_reaches_certification_and_rotation_slots
        claim_type: cross_entity
        grounds:
          - state_machines.Certification.ACTIVE_to_PROBATION
          - state_machines.CallRotationSlot.SCHEDULED_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / systemic_incident_closure_cascades_cert_probation_slot_release
          rationale: "That §1.8 instance walks the incident -> certification -> slot -> coverage-posture chain across four entities and asserts each hop."
      - name: device_reservation_ledger_reconciles_after_release
        claim_type: ledger_sync
        grounds:
          - calculations.device_reservation_ledger
          - entities.PerfusionDevice.fields.open_reservation_count
        excluded_because:
          difficulty_instance: compensating_invariant / pack_reserve_and_verify_then_cancel_restores_device_reservation_ledger
          rationale: "The before/after reconciliation of open_reservation_count against its derived source is asserted end-to-end there."
      - name: cancel_reverses_every_accrual_side_effect
        claim_type: compensation
        grounds:
          - state_machines.BypassCase.PROVISIONAL_ACCRUED_to_UNBILLED
          - endpoints[POST /bypass-cases/{id}/cancel]
        excluded_because:
          difficulty_instance: compensating_invariant / assign_supersede_then_cancel_restores_contract_accrual_ledger
          rationale: "The undo-with-no-drift claim over the contract accrual ledger, including a superseded assignment before the cancel, is that §1.8 instance's core assertion."

  - section: calculations
    instances:
      - name: coverage_posture_merges_clips_and_gates_case_creation
        claim_type: interval_merge
        grounds:
          - calculations.contract_coverage_posture
          - entities.HospitalContract.fields.coverage_posture
          - validations[priority=70]
          - errors.ERR_CONTRACT_COVERAGE_INSUFFICIENT
          - endpoints[POST /call-rotation-slots]
        distinguishing_aspect: |
          The posture calculation is an interval_merge over a rolling 72-hour horizon and this
          instance walks every clause of it with pre-computed minute totals: disjoint slots stay
          separate, gap-zero adjacency merges (08-02T00:00 continues 08-01T00:00-08-02T00:00 into one
          2880-minute block), a slot that starts before the clock contributes only its clipped
          remainder, and the PRIMARY_CALL dimension must reach 100 percent while BACKUP_CALL only
          needs 50 percent. Each posture step is read back and the gate at priority 70 is exercised
          at UNCOVERED (rejected) and at THIN (admitted), with the EMERGENT exemption admitted even
          at UNCOVERED.
