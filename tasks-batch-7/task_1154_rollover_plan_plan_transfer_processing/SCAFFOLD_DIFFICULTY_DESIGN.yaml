            - "after the new doc is submitted: status == ELIGIBILITY_REVIEW again (${st_review2}) — second visit, cycle closed"
            - "after all three docs ACCEPTED and APPROVE: status == ELIGIBLE (${st_final})"

      - name: document_resubmit_cycle
        grounds:
