      - name: sm_part_discontinue_cancels_open_reorders_cascade
        claim_type: Cascade down
        grounds: [state_machines.Part.ACTIVE_to_DISCONTINUED, state_machines.ReorderRequest]
        distinguishing_aspect: "Discontinuing a part with a SUGGESTED reorder cascades the reorder to CANCELLED."
