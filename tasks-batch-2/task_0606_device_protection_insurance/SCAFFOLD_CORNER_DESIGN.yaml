# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims
# Device Protection & Mobile Insurance Claims (Expert)
#
# Shared fixtures (same conventions as SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   PLAN_STD: monthly_premium_cents=2000, base_deductible_cents=10000,
#       loss_deductible_multiplier_bps=15000, annual_claim_limit=2,
#       replacement_value_cap_cents=80000
#   SKU_BOOK: msrp_cents=90000, depreciation_rate_bps_per_month=200, stock_on_hand=5
#       -> depreciated@6mo = 79200; CRACKED/GREEN deductible = 10000
#   Clock default startup 2026-01-01T00:00:00Z; tests set 2026-06-01T00:00:00Z
#   device_purchase_date 2025-12-01 => age_months 6
#   IMEI_A=356758901234560 (Luhn-valid), IMEI_BAD=356758901234561 (fails Luhn)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_green_risk_flag
        claim_type: Creation
        grounds: ["entities.Customer.fields.risk_flag"]
        distinguishing_aspect: "POST /customers with full_name + carrier_account_number returns 201, risk_flag defaults GREEN, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-1" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
          assert:
            - "response code == 201"
            - "Customer.${cust}.risk_flag == GREEN"
            - "Customer.${cust}.version == 1"

      - name: get_enrollment_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /enrollments/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_enrollment_missing_imei_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /enrollments omitting the required imei field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Customer, plan, SKU exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-2" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_VALIDATION"

      - name: enrollment_invalid_imei_luhn_returns_invalid_imei
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_IMEI]"]
        distinguishing_aspect: "POST /enrollments with a 15-digit IMEI failing the Luhn checksum returns ERR_INVALID_IMEI (422)."
        test_recipe:
          setup: ["Customer, plan, SKU exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-3" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234561", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_IMEI"

      - name: enrollment_computed_status_pending_eligibility_on_create
        claim_type: Computed Fields
        grounds: ["entities.Enrollment.fields.status", "entities.Enrollment.fields.premium_paid_through_cycle"]
        distinguishing_aspect: "A new enrollment starts status PENDING_ELIGIBILITY, premium_paid_through_cycle -1, enrolled_at null, regardless of input."
        test_recipe:
          setup: ["Customer, plan, SKU exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-4" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
          assert:
            - "Enrollment.${enr}.status == PENDING_ELIGIBILITY"
            - "Enrollment.${enr}.premium_paid_through_cycle == -1"
            - "Enrollment.${enr}.enrolled_at is null"

      - name: list_enrollments_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Enrollment.fields.customer_id"]
        distinguishing_aspect: "GET /enrollments returns array response_type with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One enrollment exists for the customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-5" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /enrollments?customer_id=${cust}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_enrollment_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Enrollment.PENDING_ELIGIBILITY_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an enrollment already ACTIVE has no defined transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE enrollment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-6" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_enrollment_with_open_claim_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.Enrollment.ACTIVE_to_CANCELLED", "entities.Enrollment.fields.open_claim_id"]
        distinguishing_aspect: "Cancelling an ACTIVE enrollment with a non-null open_claim_id is rejected ERR_INVALID_STATE (409); status stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE enrollment with one open SUBMITTED claim."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-7" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/cancel"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr}.status == ACTIVE (unchanged)"

      - name: approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.UNDER_REVIEW_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a SUBMITTED (un-screened) claim has no transition -> ERR_INVALID_STATE; OCC check not reached."
        test_recipe:
          setup: ["ACTIVE enrollment with a fresh SUBMITTED claim."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-8" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: withdraw_after_fulfilled_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Claim.SUBMITTED_to_WITHDRAWN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a FULFILLED (terminal) claim is rejected ERR_INVALID_STATE; no transition leaves a terminal state."
        test_recipe:
          setup: ["A CRACKED claim routed REPAIR and completed -> FULFILLED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-9" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${cust}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/route"
              payload: { repair_cost_cents: 20000 }
              as: ClaimsAdjuster
            - call: "GET /repair-orders?claim_id=${cl}"
              payload: {}
              as: ClaimsAdjuster
              captures: { ro: $.data.0.id }
            - call: "POST /repair-orders/${ro}/complete"
              payload: {}
              as: LogisticsAgent
          trigger:
            - call: "POST /claims/${cl}/withdraw"
              payload: {}
              as: Subscriber
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${cl}.status == FULFILLED before the trigger"
            - "response code == 409 and error_id == ERR_INVALID_STATE"

      - name: deny_fraud_blocks_customer_cascade
        claim_type: side_effect_execution
        grounds: ["state_machines.Claim.UNDER_REVIEW_to_DENIED", "entities.Customer.fields.risk_flag"]
        distinguishing_aspect: "Denying an UNDER_REVIEW claim with denial_reason FRAUD sets Customer.risk_flag BLOCKED and clears Enrollment.open_claim_id."
        test_recipe:
          setup: ["ACTIVE enrollment, one UNDER_REVIEW claim (PASS screen)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-10" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "CRACKED", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl}/deny"
              payload: { denial_reason: "FRAUD" }
              as: ClaimsAdjuster
              captures: { st: $.data.status }
          assert:
            - "Claim.${cl}.status == DENIED and denial_reason == FRAUD"
            - "Customer.${cust}.risk_flag == BLOCKED"
            - "Enrollment.${enr}.open_claim_id is null"

      - name: tradein_recycle_ewaste_path
        claim_type: side_effect_execution
        grounds: ["state_machines.TradeIn.GRADED_to_RECYCLED", "entities.TradeIn.fields.credit_cents"]
        distinguishing_aspect: "An EWASTE-graded trade-in recycles to RECYCLED with credit_cents 0 (no credit issued)."
        test_recipe:
          setup: ["A delivered exchange with an EWASTE trade-in graded (credit 0)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Ann", carrier_account_number: "CA-CN-11" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "LOST", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/route"
              payload: {}
              as: ClaimsAdjuster
              captures: { cl_v: $.data.version }
            - call: "GET /advanced-exchanges?claim_id=${cl}"
              payload: {}
              as: LogisticsAgent
              captures: { ax: $.data.0.id }
            - call: "POST /advanced-exchanges/${ax}/ship"
              payload: { expected_claim_version: "${cl_v}" }
              as: LogisticsAgent
            - call: "POST /advanced-exchanges/${ax}/deliver"
              payload: {}
              as: LogisticsAgent
            - call: "POST /trade-ins"
              payload: { advanced_exchange_id: "${ax}", condition_grade: "EWASTE" }
              as: LogisticsAgent
              captures: { ti: $.data.id }
            - call: "POST /trade-ins/${ti}/grade"
              payload: {}
              as: LogisticsAgent
              captures: { ti_credit: $.data.credit_cents }
          trigger:
            - call: "POST /trade-ins/${ti}/recycle"
              payload: {}
              as: LogisticsAgent
              captures: { ti_status: $.data.status }
          assert:
            - "TradeIn.${ti}.credit_cents == 0 after grade"
            - "TradeIn.${ti}.status == RECYCLED after recycle"

  # ===========================================================================
  - section: calculations
    instances:
      - name: deductible_cracked_green_base_only
        claim_type: correct_result
        grounds: ["calculations.quote_deductible", "entities.Claim.fields.deductible_cents"]
        distinguishing_aspect: "A CRACKED claim on a GREEN customer quotes deductible_cents 10000 (base only, no surcharge)."
        test_recipe:
          setup: ["ACTIVE enrollment, GREEN customer, CRACKED claim screened PASS."]
          setup_api_calls:
