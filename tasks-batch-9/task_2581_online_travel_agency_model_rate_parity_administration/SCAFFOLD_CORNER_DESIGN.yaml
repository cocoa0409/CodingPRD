      - name: mediation_fee_uses_the_base_cents_constant_plus_the_selected_tier
        claim_type: constants_applied
        grounds:
          - calculations.dispute_settlement_total
          - entities.DisputeCase.fields.mediation_fee_cents
        distinguishing_aspect: "MEDIATION_FEE_BASE_CENTS 2500 is added on top of the tier percentage, and the tier is keyed on refund_due_cents AFTER the availability cap: a 1000-cent claim gives 2500 + 20 == 2520, while a 60000-cent claim capped to 24240 gives 2500 + 485 == 2985 - still the 0.020 tier, because the cap keeps refund_due_cents below the 50000 threshold."
        test_recipe:
          setup:
            - "A CAPTURED booking on the LIVE 24240 offer with refunded_cents 0."
            - "A second booking on the same offer, also CAPTURED, so the two claims are filed against independent bookings."
