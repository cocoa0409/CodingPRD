        grounds:
          - concurrency_rules[sample-membership-add-stale-set]
          - validations[priority=11]
          - errors[ERR_STALE_SAMPLE_SET_VERSION]
        distinguishing_aspect: "The sample-set OCC field is independent of the rating one: after one accepted add, re-using the creation-time version for a second home is 412 ERR_STALE_SAMPLE_SET_VERSION and member_count stays 1 until the refreshed version is supplied."
        test_recipe:
          setup:
            - "A FORMING sample set spans 2026-08-01..2026-08-31 with homes L-7601 and L-7602 available, and the set's version at creation is captured"
