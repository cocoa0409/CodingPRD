            - { call: "POST /api/patient-cases/${cb}/assignments", payload: { investigator_id: "${inv2}", assignment_role: "PRIMARY", expected_case_version: "${cbv3}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "GET /api/staff-members/${inv1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { n1: $.data.open_assignment_count } }
            - { call: "GET /api/staff-members/${inv2}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { n2: $.data.open_assignment_count } }
            - { call: "GET /api/case-assignments?investigator_id=${inv1}&status=ACTIVE", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { act1: $.data } }
