      - name: issuing_an_already_issued_audit_engagement_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.AuditEngagement.ENGAGED_to_ISSUED
          - errors.ERR_AUDIT_NOT_ISSUABLE
          - entities.AuditEngagement.fields.issued_by_user_id
          - calculations.audit_unreconciled_delta
        distinguishing_aspect: "ISSUED is terminal for an AuditEngagement, so a second issue is ERR_AUDIT_NOT_ISSUABLE (409) and must not re-freeze the snapshot: audited_receivable_snapshot_cents keeps the 30000 captured at the first issuance and issued_by_user_id keeps auditor-9, even though a later in-window accrual has since moved the association's receivable to 55000 and flipped finding_status to EXCEPTION_NOTED."
        test_recipe:
          setup:
            - "Association 'Wychwood' with declarant_monthly_subsidy_cents 30000."
            - "SubsidyEntry ACCRUAL 30000 for period_month 2026-02, posted by declarant-1, so subsidy_receivable_cents is 30000."
            - "AuditEngagement over 2026-01-01..2026-03-31 in ENGAGED."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Wychwood", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 30000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 30000, period_month: "2026-02" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_in_window_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 25000, period_month: "2026-03" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_later_id: $.data.id }
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
              captures: { e_reissue: $.data.error_id }
          assert:
            - "first trigger call returns 200 with data.status == ISSUED, data.audited_receivable_snapshot_cents == 30000, data.unreconciled_delta_cents == 0, data.finding_status == CLEAN, data.issued_by_user_id == auditor-9"
            - "after the second trigger call: Association.${assoc_id}.subsidy_receivable_cents == 55000"
            - "after the second trigger call: AuditEngagement.${eng_id}.unreconciled_delta_cents == 25000 and finding_status == EXCEPTION_NOTED"
            - "e_reissue == ERR_AUDIT_NOT_ISSUABLE with HTTP 409"
            - "AuditEngagement.${eng_id}.audited_receivable_snapshot_cents == 30000, never re-frozen to 55000"
            - "AuditEngagement.${eng_id}.status == ISSUED and issued_by_user_id == auditor-9"

      - name: reserve_study_recompute_and_adopt_after_adoption_are_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReserveStudy.DRAFT_to_ADOPTED
          - state_machines.ReserveStudy.DRAFT_to_DRAFT
          - state_machines.ReserveStudy.DRAFT_to_SUPERSEDED
          - errors.ERR_NOT_IN_DRAFT
          - validations[priority=9]
        distinguishing_aspect: "Both study actions are DRAFT-only: once ADOPTED, RECOMPUTE and a second ADOPT both return ERR_NOT_IN_DRAFT (409) and every computed field of the study is frozen — the refused COMPONENT_FULL_FUNDING recompute must not overwrite evaluated_method, and the association keeps exactly one ADOPTED study."
        test_recipe:
          setup:
            - "Association 'Yarrow Fields' with reserve_pool_cents 1200000 and no components."
            - "One ReserveStudy RECOMPUTEd under CASH_FLOW (verdict ADEQUATE, recommendation 700000) and then ADOPTED."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Yarrow Fields", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study1_id: $.data.id }
            - call: "POST /hoa/reserve-studies/${study1_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study1_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/reserve-studies/${study1_id}/actions"
              payload: { action: "RECOMPUTE", method: "COMPONENT_FULL_FUNDING" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_recompute_after_adopt: $.data.error_id }
            - call: "POST /hoa/reserve-studies/${study1_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_adopt_twice: $.data.error_id }
            - call: "GET /hoa/associations/${assoc_id}/reserve-studies"
              payload: { status: "ADOPTED", limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "e_recompute_after_adopt == ERR_NOT_IN_DRAFT with HTTP 409"
            - "e_adopt_twice == ERR_NOT_IN_DRAFT with HTTP 409"
            - "ReserveStudy.${study1_id}.status == ADOPTED, evaluated_method == CASH_FLOW, adequacy_verdict == ADEQUATE, min_projected_balance_cents == 1200000, recommended_annual_contribution_cents == 700000"
            - "ReserveStudy.${study1_id}.percent_funded == 0.00 and component_count == 0, unchanged by the refused COMPONENT_FULL_FUNDING recompute"
            - "third trigger call: total_count == 1"

      - name: reversing_a_reversed_entry_or_a_reversal_mirror_is_rejected
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SubsidyEntry.POSTED_to_REVERSED
          - errors.ERR_SUBSIDY_ENTRY_ALREADY_REVERSED
          - calculations.subsidy_receivable_balance
          - entities.SubsidyEntry.fields.reverses_entry_id
          - endpoints[GET /hoa/subsidy-entries]
        distinguishing_aspect: "One reverse produces exactly one mirror row with direction REVERSAL and reverses_entry_id set, restores subsidy_receivable_cents to its pre-post value (20000), and is not repeatable: reversing the same entry again and reversing the mirror itself both return ERR_SUBSIDY_ENTRY_ALREADY_REVERSED (409), and no second mirror appears."
        test_recipe:
          setup:
            - "Association 'Zephyr Glen' with declarant_monthly_subsidy_cents 50000."
            - "Two POSTED SubsidyEntries: ACCRUAL 50000 for 2026-01 and PAYMENT 30000 for 2026-01, so subsidy_receivable_cents is 20000."
            - "A third POSTED entry, ACCRUAL 40000 for 2026-02, lifting the receivable to 60000."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Zephyr Glen", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 50000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 50000, period_month: "2026-01" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_accrual_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "PAYMENT", amount_cents: 30000, period_month: "2026-01" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_payment_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 40000, period_month: "2026-02" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { entry_second_accrual_id: $.data.id }
          trigger:
            - call: "POST /hoa/subsidy-entries/${entry_second_accrual_id}/reverse"
              payload: { reason: "posted against the wrong period" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "GET /hoa/subsidy-entries"
              payload: { reverses_entry_id: "${entry_second_accrual_id}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { mirror_id: "$.data[0].id" }
            - call: "POST /hoa/subsidy-entries/${entry_second_accrual_id}/reverse"
              payload: { reason: "double undo attempt" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_already: $.data.error_id }
            - call: "POST /hoa/subsidy-entries/${mirror_id}/reverse"
              payload: { reason: "undo the undo" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_mirror: $.data.error_id }
            - call: "GET /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "auditor-9"
          assert:
            - "before the triggers: Association.${assoc_id}.subsidy_receivable_cents == 60000"
            - "first trigger call returns 200 with data.id == ${entry_second_accrual_id} and data.status == REVERSED, returning the target and not the mirror"
            - "second trigger call: total_count == 1, and that row has direction == REVERSAL, amount_cents == 40000, period_month == 2026-02, status == POSTED, reverses_entry_id == ${entry_second_accrual_id}"
            - "Association.${assoc_id}.subsidy_receivable_cents == 20000, exactly its pre-post value"
            - "e_already == ERR_SUBSIDY_ENTRY_ALREADY_REVERSED with HTTP 409"
            - "e_mirror == ERR_SUBSIDY_ENTRY_ALREADY_REVERSED with HTTP 409"
            - "fifth trigger call: total_count == 4 — three posted entries plus exactly one mirror, no second mirror"
            - "SubsidyEntry.${entry_accrual_id}.status == POSTED and SubsidyEntry.${entry_payment_id}.status == POSTED"

      - name: settlement_blocked_by_an_unresolved_developer_affiliated_contract
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TurnoverCase.AUDIT_IN_PROGRESS_to_SETTLED
          - state_machines.VendorContract.CANCELLABLE_to_CANCELLED
          - errors.ERR_ASSIGNMENT_CONSENT_REQUIRED
          - validations[priority=13]
        distinguishing_aspect: "A developer-affiliated contract left in CANCELLABLE blocks settlement with ERR_ASSIGNMENT_CONSENT_REQUIRED (422) — and CONSENT does NOT clear it, because consent moves assignment_status while the blocking predicate reads status. Only CANCEL (or refusal) removes the contract from the CANCELLABLE set, after which the identical advance settles the case."
        test_recipe:
          setup:
            - "Association 'Ashcombe' with fixed_turnover_date 2026-07-01T00:00:00Z, reached at the default clock 2026-08-01T00:00:00Z; no AMENITY components, no RecordsTransferItems, no DefectClaims, no SubsidyEntries."
            - "One INFRASTRUCTURE component carrying one developer-affiliated ACTIVE VendorContract."
            - "TurnoverCase (total_seats 3) certified, two OWNER_ELECTED directors seated, governance advanced to OWNER_CONTROL; the certification cascade left the affiliated contract CANCELLABLE with window end 2026-10-30T00:00:00Z."
            - "AuditEngagement ISSUED with delta 0 and finding_status CLEAN; financial dimension advanced to AUDIT_IN_PROGRESS."
