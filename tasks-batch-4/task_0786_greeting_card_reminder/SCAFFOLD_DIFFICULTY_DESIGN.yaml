scaffold_difficulty_design:

  # ================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_estimate_vs_final_diverges
        grounds:
          - calculations.order_total
          - calculations.order_tax
          - entities.Order.fields.estimated_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.SCHEDULED_to_IN_PRODUCTION
        distinguishing_aspect: "On the SAME Order, the estimate variant (postage+gift, no discount/tax) yields 2050 while the final variant (postage + discounted gift + tax) yields 1823 — a divergence on the Order entity domain."
        test_recipe:
          setup:
            - "PRO account (12 credits) with a VERIFIED contact in region CA."
            - "Card base 500 / 25g; GiftItem 800 / 40g; order carries gift_quantity 2 (total weight 105g -> postage tier 450)."
            - "Order submitted, proof approved, scheduled, artist reserved, clock at/after send date, then produced."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a1@x.com", display_name: "A1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Bob", address_line1: "1 A St", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "C1", title: "Bday", category: "BIRTHDAY", base_price_cents: 500, weight_grams: 25 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /gift-items"
              payload: { sku: "G1", title: "Choc", kind: "CHOCOLATE", price_cents: 800, weight_grams: 40 }
              as: PlatformAdmin
              captures: { gift_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pen", daily_capacity: 5, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z", gift_item_id: "${gift_id}", gift_quantity: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id, est: $.data.estimated_total_cents }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/schedule"
              as: StudioOperator
            - call: "POST /orders/${order_id}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }
              as: StudioOperator
              captures: { asg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/produce"
              as: StudioOperator
              captures: { fin: $.data.final_total_cents }
          assert:
            - "Order.${order_id}.estimated_total_cents == 2050"
            - "Order.${order_id}.postage_cents == 450"
            - "Order.${order_id}.gift_discount_cents == 320"
            - "Order.${order_id}.tax_cents == 93"
            - "Order.${order_id}.final_total_cents == 1823"
            - "Order.${order_id}.estimated_total_cents != Order.${order_id}.final_total_cents"

      - name: renewal_full_grant_vs_prorated_upgrade_diverges
        grounds:
          - calculations.renewal_credit_grant
          - entities.Account.fields.card_credit_balance
          - entities.Subscription.fields.current_period_end
          - state_machines.Subscription.ACTIVE_to_ACTIVE
        distinguishing_aspect: "On the Account/Subscription domain (distinct from order pricing): the new_or_renew variant grants the full 12 credits, whereas mid_cycle_upgrade with 10 of 30 days left grants only ceil(12*10/30)=4."
        test_recipe:
          setup:
            - "Account with a FREE subscription created at clock 2026-03-01 (period_end 2026-03-31, 0 credits)."
            - "Clock advanced to 2026-03-21 (10 days remain), then tier changed to PRO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a2@x.com", display_name: "A2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "FREE" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/change-tier"
              payload: { tier: "PRO" }
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "Account.${acct_id}.card_credit_balance == 4"
            - "a full new_or_renew PRO grant would be 12, so mid_cycle_upgrade (4) is strictly fewer"

  # ================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_final_total_tiered_postage_and_conditional_discount
        grounds:
          - calculations.order_total
          - calculations.order_tax
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: "Mode (a): final_total = postage_tier(weight) + (gift_price - discount) + tax combines >=3 inputs with non-linear tier selection and a subscription-state conditional branch; not a single linear sum."
        test_recipe:
          setup:
            - "PRO account, VERIFIED CA contact, Card 500/25g, Gift 800/40g qty 2 (weight 105 -> tier 450)."
            - "Order produced (final variant)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a3@x.com", display_name: "A3" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Bo", address_line1: "1 A", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "C3", title: "Bday", category: "BIRTHDAY", base_price_cents: 500, weight_grams: 25 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /gift-items"
              payload: { sku: "G3", title: "Choc", kind: "CHOCOLATE", price_cents: 800, weight_grams: 40 }
              as: PlatformAdmin
              captures: { gift_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pen3", daily_capacity: 5, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z", gift_item_id: "${gift_id}", gift_quantity: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/schedule"
              as: StudioOperator
            - call: "POST /orders/${order_id}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }
              as: StudioOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/produce"
              as: StudioOperator
          assert:
            - "Order.${order_id}.final_total_cents == 1823"

      - name: order_tax_sum_then_round_not_per_unit
        grounds:
          - calculations.order_tax
          - entities.Order.fields.gift_discount_cents
          - entities.Order.fields.tax_cents
        distinguishing_aspect: "Mode (b): with gift unit 333 x qty 3 and PLUS discount 0.10, sum-then-round discount = round(999*0.10)=100, whereas the forbidden round-per-unit-then-sum = 33*3 = 99; the pinned order yields 100."
        test_recipe:
          setup:
            - "PLUS account (discount 0.10), VERIFIED NY contact."
            - "Card 100/10g; Gift 333/5g qty 3 (weight 25 -> tier 150)."
            - "Order produced."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a4@x.com", display_name: "A4" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PLUS" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Ny", address_line1: "1 NY", city: "NYC", region: "NY", postal_code: "10001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "C4", title: "TY", category: "THANK_YOU", base_price_cents: 100, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /gift-items"
              payload: { sku: "G4", title: "Note", kind: "CUSTOM_NOTE", price_cents: 333, weight_grams: 5 }
              as: PlatformAdmin
              captures: { gift_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pen4", daily_capacity: 5, region_code: "NY" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "ty", scheduled_send_at: "2026-04-01T00:00:00Z", gift_item_id: "${gift_id}", gift_quantity: 3 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/schedule"
              as: StudioOperator
            - call: "POST /orders/${order_id}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }
              as: StudioOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/produce"
              as: StudioOperator
          assert:
            - "Order.${order_id}.gift_discount_cents == 100"
            - "Order.${order_id}.tax_cents == 80"
            - "Order.${order_id}.final_total_cents == 1129"

  # ================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proof_revision_cycle_loops_twice
        grounds:
          - state_machines.Proof.PENDING_to_CHANGES_REQUESTED
          - state_machines.Proof.CHANGES_REQUESTED_to_PENDING
          - state_machines.Proof.PENDING_to_APPROVED
          - entities.Proof.fields.revision_count
        distinguishing_aspect: "Proof is cyclic: PENDING->CHANGES_REQUESTED->PENDING repeats twice (revision_count reaches 2) before APPROVED — not a linear pipeline."
        test_recipe:
          setup:
            - "One submitted order with a PENDING proof."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "p1@x.com", display_name: "P1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Pc", address_line1: "1 P", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CP", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
          trigger:
            - call: "POST /proofs/${proof_id}/request-changes"
              payload: { reviewer_notes: "fix name" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /proofs/${proof_id}/revise"
              payload: { proof_image_ref: "img-2" }
              as: StudioOperator
            - call: "POST /proofs/${proof_id}/request-changes"
              payload: { reviewer_notes: "fix date" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /proofs/${proof_id}/revise"
              payload: { proof_image_ref: "img-3" }
              as: StudioOperator
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "Proof.${proof_id}.revision_count == 2"
            - "Proof.${proof_id}.status == APPROVED"
            - "Order.${order_id}.status == PROOF_APPROVED"

      - name: order_status_and_credit_status_evolve_independently
        grounds:
          - state_machines.Order.DRAFT_to_PENDING_PROOF
          - state_machines.Order.PENDING_PROOF_to_CANCELLED
          - entities.Order.fields.status
          - entities.Order.fields.credit_status
        distinguishing_aspect: "Order carries two parallel state dimensions on one row: after submit (status PENDING_PROOF, credit_status HELD); after cancel (status CANCELLED, credit_status REFUNDED) — the credit axis advances on a schedule independent of the fulfillment axis."
        test_recipe:
          setup:
            - "PRO account, VERIFIED contact, submitted order (status PENDING_PROOF, credit_status HELD)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "p2@x.com", display_name: "P2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Pc2", address_line1: "1 P", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CP2", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "Order.${order_id}.status == CANCELLED"
            - "Order.${order_id}.credit_status == REFUNDED"

  # ================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scheduler_fires_recurring_creates_order_holds_credit
        grounds:
          - state_machines.ImportantDate.ACTIVE_to_ACTIVE
          - state_machines.Order.DRAFT_to_PENDING_PROOF
          - calculations.account_credit_balance
          - entities.Account.fields.card_credit_balance
          - entities.ImportantDate.fields.next_trigger_at
        distinguishing_aspect: "Depth-3 chain from the scheduler trigger: scheduler fires ImportantDate -> auto-creates+submits Order -> Order submit posts a CreditTransaction(-1) -> Account.card_credit_balance drops 12->11; each link is caused by the prior one."
        test_recipe:
          setup:
            - "PRO account (12 credits), VERIFIED contact, ACTIVE Card."
            - "Clock set to 2026-03-25; ANNUAL auto_send ImportantDate for event 2026-04-01 lead 7 (next_trigger_at 2026-03-25, due now)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s1@x.com", display_name: "S1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sc", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CS", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contacts/${contact_id}/important-dates"
              payload: { occasion_type: "BIRTHDAY", event_date: "2026-04-01T00:00:00Z", lead_days: 7, recurrence: "ANNUAL", auto_send: true, default_card_id: "${card_id}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { id_id: $.data.id }
          trigger:
            - call: "POST /_scheduler/run"
              as: PlatformAdmin
              captures: { created: $.data.created_order_ids }
          assert:
            - "response.data.created_order_ids has length 1"
            - "Account.${acct_id}.card_credit_balance == 11"
            - "ImportantDate.${id_id}.next_trigger_at == 2027-03-25T00:00:00.000Z"

      - name: cancel_scheduled_order_releases_assignment_updates_artist_count
        grounds:
          - state_machines.Order.SCHEDULED_to_CANCELLED
          - state_machines.ArtistAssignment.RESERVED_to_RELEASED
          - entities.HandwritingArtist.fields.reserved_assignment_count
        distinguishing_aspect: "Depth-2 chain from the cancel trigger: cancel Order -> ArtistAssignment RESERVED->RELEASED -> HandwritingArtist.reserved_assignment_count recomputed 1->0; the artist update is caused by the assignment release, not directly by cancel."
        test_recipe:
          setup:
            - "PRO account, VERIFIED contact, order submitted+approved+scheduled, artist reserved (count 1)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s2@x.com", display_name: "S2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sc2", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CS2", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "PenS", daily_capacity: 5, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
