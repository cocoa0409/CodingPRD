              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Drop Gloss", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Drop", shade_code: "DR-01", finish: "DEWY", undertone: "WARM", depth_index: 6, price_cents: 2500, is_limited_launch: true, launch_open_rouge_at: "2026-05-01T01:00:00Z", launch_open_vib_at: "2026-05-01T02:00:00Z", launch_open_public_at: "2026-05-02T00:00:00Z", per_customer_cap: 2 }
              as: MerchandisingAdmin
              captures: { v_ltd_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_ltd_id}", units_received: 5, launch_reserved_units: 3 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c7@x.com", name: "C Seven", initial_points: 500 }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: MerchandisingAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", points_redeemed: 300, lines: [ { variant_id: "${v_ltd_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { total_due: "$.data.total_due_cents"}
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { reason: "CUSTOMER_CHANGED_MIND" }
              as: StoreAssociate
              captures: { ful: "$.data.fulfillment_status"}
          assert:
            - "${total_due} == 3500"
            - "${ful} == CANCELLED"
            - "InventoryLot.${lot_id}.on_hand_units == 5 and reserved_units == 0"
            - "InventoryLot.${lot_id}.launch_reserved_units == 3"
            - "Customer.${cust_id}.points_balance == 500"
            - "GET /points-ledger?customer_id=${cust_id} returns exactly 3 entries: SEED +500, REDEEM -300, REVERSAL +300"
            - "Order.${order_id}.payment_status == UNPAID (never authorised, so nothing to void)"

      - name: approve_return_cascades_refund_spend_clawback_and_rolling_tier
        grounds:
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - calculations.refund_settlement
          - calculations.tier_evaluation
          - entities.Order.fields.refunded_cents
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (POST /return-requests/{id}/decision, not order
          cancel): refund_settlement produces refund_cents, which causes Order.refunded_cents /
          payment_status to move, which causes Customer.qualifying_spend_cents to drop and a CLAWBACK
          ledger entry to be appended, which causes ROLLING tier_evaluation to re-run (and, being
          upgrade-only, to leave the tier at VIB).
        test_recipe:
          setup:
            - "Customer C (INSIDER) ships a 40000-cent MAKEUP/SEALED order; ROLLING upgrades C to VIB, 400 EARN points, qualifying_spend 40000, payment CAPTURED."
            - "C files a full-line return (1 unit, SEALED, inside the 30-day window)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Palette", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 40000 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Studio", shade_code: "ST-01", finish: "MATTE", undertone: "NEUTRAL", depth_index: 6, price_cents: 40000 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c8@x.com", name: "C Eight" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
              captures: { earned: "$.data.points_earned"}
            - call: "GET /order-lines"
              payload: {}
              as: StoreAssociate
              captures: { line_id: "$.data[0].id"}
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr_id: "$.data.id"}
          trigger:
            - call: "POST /return-requests/${rr_id}/decision"
              payload: { decision: "APPROVE" }
              as: StoreAssociate
              captures: { refund: "$.data.refund_cents", claw: "$.data.points_clawback", disp: "$.data.disposition"}
          assert:
            - "${earned} == 400"
            - "${refund} == 40000 and ${claw} == 400 and ${disp} == RESTOCK"
            - "Order.${order_id}.refunded_cents == 40000 and Order.${order_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.qualifying_spend_cents == 0 and Customer.${cust_id}.points_balance == 0"
            - "Customer.${cust_id}.tier == VIB (ROLLING tier_evaluation refuses to downgrade inside the cycle)"
            - "InventoryLot.${lot_id}.sold_units == 0 and on_hand_units == 5 and destroyed_units == 0"

  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hand_over_from_reserved_and_unpaid_returns_invalid_order_state
        grounds:
          - validations[priority=7]
          - validations[priority=23]
          - errors[ERR_INVALID_ORDER_STATE]
          - errors[ERR_PAYMENT_NOT_CAPTURED]
        distinguishing_aspect: |
          Error-category pair: `state` (priority 7) versus `business_fiscal` (priority 23). A
          HAND_OVER on an order that is RESERVED (not READY_FOR_PICKUP) AND still UNPAID violates
          both; the state check runs first, so ERR_INVALID_ORDER_STATE (409) is returned and
          ERR_PAYMENT_NOT_CAPTURED is never reached.
        test_recipe:
          setup:
            - "A BOPIS order is RESERVED with payment_status UNPAID (never authorised)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA", bopis_slot_capacity: 2 }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c9@x.com", name: "C Nine" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "HAND_OVER" }
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_ORDER_STATE"
            - "HTTP status is 409"
            - "the response is NOT ERR_PAYMENT_NOT_CAPTURED"
            - "Order.${order_id}.fulfillment_status is still RESERVED and payment_status is still UNPAID"

