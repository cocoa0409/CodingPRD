            - call: "POST /roofing/branches/${br_v2}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_v2: $.data.id }
            - call: "POST /roofing/orders/${ord_v2}/deliveries"
              payload: { delivery_slot_id: "${slot_v2}", equipment_type: "GROUND" }
