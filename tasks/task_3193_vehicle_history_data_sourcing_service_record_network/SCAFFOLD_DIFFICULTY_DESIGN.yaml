            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${veh}", asking_price_cents: 700000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lst: $.data.id }
            - call: "POST /dealers/${dl}/listings/${lst}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lv: $.data.version }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B1", claim_reason: "salvage" }
              as: GuaranteeAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B2", claim_reason: "overlap attempt" }
              as: GuaranteeAdmin
            - call: "POST /claims/${c1}/reject"
              payload: {}
              as: GuaranteeAdmin
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B3", claim_reason: "after terminal" }
              as: GuaranteeAdmin
              captures: { c2: $.data.id }
          assert:
            - "Second claim while C1 OPEN -> HTTP 409 ERR_CLAIM_OVERLAP (closed occupancy)"
            - "After C1 REJECTED (terminal), third claim succeeds: GuaranteeClaim.${c2}.status == 'OPEN'"

      - name: publication_window_half_open_boundary
        grounds:
          - calculations.claim_window_overlap
          - entities.InventoryListing.fields.window_end_epoch
          - errors[ERR_LISTING_WINDOW_CLOSED]
        distinguishing_aspect: |
          Half-open interval semantics on the same listing resource but a
          different geometric rule: the publication window
          [window_start_epoch, window_end_epoch) treats window_end_epoch as
          exclusive — filing at window_end_epoch - 1 is valid while filing at
          exactly window_end_epoch collides with the closed window and is
          rejected; adjacency (epoch == end) is EXCLUDED here whereas the
          claim-occupancy rule has no notion of adjacency at all.
        test_recipe:
          setup:
            - "Network; vehicle escalated to SALVAGE; dealer listing published at epoch 0 with window_end_epoch = 2 and enrolled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${veh}", asking_price_cents: 700000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lst: $.data.id }
            - call: "POST /dealers/${dl}/listings/${lst}/publish"
              payload: { window_end_epoch: 2 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lv: $.data.version }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${mva}"
          trigger:
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B1", claim_reason: "at end-1" }
              as: GuaranteeAdmin
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/reject"
              payload: {}
              as: GuaranteeAdmin
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B2", claim_reason: "at end" }
              as: GuaranteeAdmin
          assert:
            - "Claim at epoch 1 (window_end_epoch - 1) succeeds: GuaranteeClaim.${c1}.status == 'OPEN' (half-open interior)"
            - "Claim at epoch 2 (== window_end_epoch) -> HTTP 409 ERR_LISTING_WINDOW_CLOSED (exclusive end rejects adjacency)"

  # =====================================================================
  # Rule 9 — compensating_invariant across different conserved quantities.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: enrolled_listing_count_preserved_over_enroll_delist
        grounds:
          - entities.Network.fields.enrolled_listing_count
          - state_machines.InventoryListing.PUBLISHED_to_DELISTED
        distinguishing_aspect: |
          Conserved quantity = Network.enrolled_listing_count. Forward action
          enroll_guarantee increments it; the compensating delist decrements it;
          enroll + delist must leave the count exactly unchanged
          (count_after == count_before).
        test_recipe:
          setup:
            - "Network with enrolled_listing_count == 0; vehicle CLEAN; dealer listing published"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${veh}", asking_price_cents: 700000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lst: $.data.id }
            - call: "POST /dealers/${dl}/listings/${lst}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lv: $.data.version }
          trigger:
            - call: "GET /networks/${net}"
              as: Any
              captures: { c0: $.data.enrolled_listing_count }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "GET /networks/${net}"
              as: Any
              captures: { c1: $.data.enrolled_listing_count }
            - call: "POST /dealers/${dl}/listings/${lst}/delist"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "GET /networks/${net}"
              as: Any
              captures: { c2: $.data.enrolled_listing_count }
          assert:
            - "c0 == 0"
            - "c1 == 1 (forward action: enroll)"
            - "c2 == 0 (compensating action: delist) — invariant c2 == c0 holds exactly"

      - name: consumer_credit_conserved_over_snapshot_then_withdraw
        grounds:
          - entities.ConsumerAccount.fields.credit_balance_cents
          - entities.ReportOrder.fields.snapshot
          - state_machines.HistoryRecord.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = report snapshot immutability paired with exact
          ledger debit: a consumer's credit is debited exactly price_cents at
          purchase (3999 -> 0) and the frozen snapshot must remain SALVAGE after
          the underlying record is later WITHDRAWN — the compensated ledger
          (no refund) and the immutable snapshot together form the conserved
          pair (no drift on either side).
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE; vehicle with SALVAGE title; consumer with exactly 3999c credit"
            - "Consumer buys CONSUMER_SINGLE report (debit to 0), then the title record is withdrawn via correction"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id, vv: $.data.version }
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
            - call: "POST /consumers/${con}/credit"
              payload: { amount_cents: 3999 }
              as: NetworkAdmin
          trigger:
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "CONSUMER_SINGLE", buyer_consumer_id: "${con}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { rpt: $.data.id, snap_brand: $.data.snapshot.canonical_brand }
            - call: "GET /consumers/${con}"
              as: Any
              captures: { bal: $.data.credit_balance_cents }
            - call: "POST /vehicles/${veh}/corrections"
              payload: { target_record_id: "${rec}", reason: "erroneous salvage", expected_vehicle_version: "${vv}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { cr: $.data.id }
            - call: "POST /corrections/${cr}/route_to_source"
              payload: {}
              as: NetworkAdmin
            - call: "POST /corrections/${cr}/source_confirm"
              payload: {}
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /corrections/${cr}/apply"
              payload: { resolution_action: "WITHDRAW" }
              as: NetworkAdmin
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { live_brand: $.data.canonical_brand }
            - call: "GET /reports/${rpt}"
              as: Any
              captures: { snap_brand_after: $.data.snapshot.canonical_brand }
            - call: "GET /consumers/${con}"
              as: Any
              captures: { bal_after: $.data.credit_balance_cents }
          assert:
            - "snap_brand == 'SALVAGE' at purchase (snapshot captured pre-withdrawal)"
            - "bal == 0 (3999 - 3999 exactly; no over/under debit)"
            - "live_brand == 'NONE' after the WITHDRAW compensation"
            - "snap_brand_after == 'SALVAGE' (snapshot conserved — no drift after compensation)"
            - "bal_after == 0 (withdrawal issues no refund; ledger stays conserved)"
