            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "G-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g09: $.data.id } }
