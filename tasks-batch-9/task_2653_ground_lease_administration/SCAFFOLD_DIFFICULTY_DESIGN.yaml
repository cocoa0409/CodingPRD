            - "Clock at its 2026-08-01T00:00:00Z default."
            - "One lease, base rent 10000000, envelope 200000 sqft."
            - "One ACTIVE sublease S1 on UNIT-A for 2027-01-01 to 2030-01-01, 150000 sqft at 12000000/yr: allocable 7500000, profit 4500000, gross 2250000, admin 56250, total 2306250, paid in full."
