            - "final_required_observer_sea_days == 30 (FINAL: ceil(max(0, 100 - min(0, floor(100*0.40))) * 0.30))"
            - "Notice ${n_id} cascade on close: ACCEPTED with remaining_sea_days 30 > 0 -> DEFAULTED and Vessel.selection_penalty_points == 2"

      - name: em_enrollment_terminate_blocked_while_trip_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EMEnrollment.ACTIVE_to_TERMINATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          EMEnrollment -> TERMINATED is guarded by "no EMTrip of this enrollment
          in DECLARED|FOOTAGE_SUBMITTED|IN_REVIEW|REVIEWED"; with a DECLARED trip
