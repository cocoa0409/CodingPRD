# =============================================================================
# Task 0841 — Traffic Signal & Streetlight Maintenance
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  841. Traffic Signal & Streetlight Maintenance: device inventory & GIS,
  outage/malfunction ticket (311/detector), knockdown & emergency response,
  timing/plan change request, locate & electric-utility coordination, PM &
  lamp/LED replacement, warranty/pole-attachment, reporting

domain_name: traffic-signal-streetlight
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every
  # collection is top-level (/devices, /poles, /tickets, ...); FK integrity
  # is enforced by body-supplied ids, discoverable via filtered-list GETs.

  state_machine_shape: cyclic
  # Ticket carries a RESOLVED->TRIAGED reopen loop; TimingPlanChangeRequest
  # carries a branching UNDER_REVIEW->{APPROVED,REJECTED,CHANGES_REQUESTED}
  # fork plus a CHANGES_REQUESTED->SUBMITTED revision loop.

  relationship_patterns:
    - one_to_many          # Intersection -> Devices/Poles; Device -> Tickets/WorkOrders
    - flat_foreign_key     # WorkOrder references Ticket, Device, Crew, LocateRequest
    - cross_aggregate      # WorkOrder completion mutates Device then Intersection posture

  role_model: peer_roles
  # Dispatcher owns tickets/work-orders; TrafficEngineer owns timing changes;
  # UtilityCoordinator owns locates/attachments/warranty; FieldTech (entity-
  # backed by Crew) completes its own crew's work-orders; Admin is the
  # hierarchical-override inventory/clock owner.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Intersection
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Human-readable intersection name" }
      - { name: district, type: string, source: input, description: "Maintenance district / jurisdiction code" }
      - { name: latitude, type: number, source: input, description: "GIS latitude (decimal degrees)" }
      - { name: longitude, type: number, source: input, description: "GIS longitude (decimal degrees)" }
      - { name: active_cycle_length_sec, type: integer, source: system, default: 0, description: "Currently applied signal cycle length; set by the most recently APPROVED TimingPlanChangeRequest" }
      - { name: active_offset_sec, type: integer, source: system, default: 0, description: "Currently applied coordination offset; set by the most recently APPROVED TimingPlanChangeRequest" }
      - { name: active_plan_revision, type: integer, source: system, default: 0, description: "Monotone counter incremented each time an APPROVED timing change is applied" }
      - { name: operational_posture, type: enum, source: computed, description: "NORMAL | DEGRADED | EMERGENCY — derived from statuses of this intersection's non-DECOMMISSIONED Devices (see calculations.intersection_posture)" }

  - name: Pole
    parent: null
    common_fields: true
    fields:
      - { name: intersection_id, type: string, source: input, description: "FK -> Intersection.id; null for a standalone streetlight pole", constraints: "nullable" }
      - { name: label, type: string, source: input, description: "Field asset tag" }
      - { name: latitude, type: number, source: input, description: "GIS latitude" }
      - { name: longitude, type: number, source: input, description: "GIS longitude" }
      - { name: load_capacity_units, type: integer, source: input, description: "Total structural/attachment load the pole may carry, in abstract load units" }
      - { name: committed_load_units, type: integer, source: computed, default: 0, description: "Sum of load_units over this pole's APPROVED PoleAttachments (see calculations.pole_load_ledger)" }
      - { name: available_load_units, type: integer, source: computed, description: "= load_capacity_units - committed_load_units" }
      - { name: status, type: enum, source: system, default: "STANDING", description: "STANDING | DOWN — DOWN after a knockdown that struck this pole; restored to STANDING when the emergency WorkOrder completes" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: intersection_id, type: string, source: input, description: "FK -> Intersection.id" }
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; null if not pole-mounted (e.g. cabinet controller)", constraints: "nullable" }
      - { name: device_type, type: enum, source: input, description: "SIGNAL_CONTROLLER | SIGNAL_HEAD | PED_SIGNAL | DETECTOR | STREETLIGHT" }
      - { name: criticality, type: enum, source: input, description: "CRITICAL | STANDARD | LOW — feeds ticket priority scoring" }
      - { name: model, type: string, source: input, description: "Manufacturer model designation" }
      - { name: installed_at, type: datetime, source: input, description: "In-service install date; warranty age is measured from here" }
      - { name: replacement_cost, type: number, source: input, description: "Full replacement value in dollars; basis for warranty payout" }
      - { name: warranty_provider, type: string, source: input, description: "Warranty issuer name" }
      - { name: last_pm_at, type: datetime, source: system, default: null, description: "Timestamp of the most recent completed PM/lamp WorkOrder", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | OUT_OF_SERVICE | UNDER_MAINTENANCE | KNOCKED_DOWN | DECOMMISSIONED (see state_machines.Device)" }

  - name: PoleAttachment
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id" }
      - { name: attacher_name, type: string, source: input, description: "Third party requesting the pole attachment" }
      - { name: mount_zone, type: enum, source: input, description: "LOW | MID | HIGH — the vertical mounting band occupied on the pole; overlap is checked per (pole_id, mount_zone)" }
      - { name: load_units, type: integer, source: input, description: "Load units this attachment consumes from the pole while APPROVED" }
      - { name: effective_from, type: datetime, source: input, description: "Start of the attachment occupancy window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of the attachment occupancy window (inclusive)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | DENIED | REVOKED (see state_machines.PoleAttachment)" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew display name" }
      - { name: specialty, type: enum, source: input, description: "SIGNAL | LIGHTING | LOCATE | GENERAL" }
      - { name: labor_capacity_hours, type: number, source: input, description: "Total labor-hour pool the crew can commit across open work" }
      - { name: committed_labor_hours, type: number, source: computed, default: 0, description: "Sum of estimated_labor_hours over this crew's WorkOrders in {SCHEDULED, DISPATCHED} (see calculations.crew_labor_ledger)" }
      - { name: available_labor_hours, type: number, source: computed, description: "= labor_capacity_hours - committed_labor_hours" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: source, type: enum, source: input, description: "SRC_311 | DETECTOR | KNOCKDOWN — reporting channel; KNOCKDOWN drives emergency cascade on triage" }
      - { name: reported_severity, type: integer, source: input, description: "Reporter-assessed severity 1..5", constraints: "1 <= reported_severity <= 5" }
      - { name: hazard_flag, type: boolean, source: input, default: false, description: "True when a public-safety hazard was reported" }
      - { name: struck_pole, type: boolean, source: input, default: false, description: "Knockdown only: true if the supporting pole was struck; drives Pole.status -> DOWN on triage" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: priority_score, type: integer, source: computed, default: null, description: "0..100 combinatorial score set at triage (see calculations.ticket_priority_score)", constraints: "nullable until triaged" }
      - { name: priority_band, type: enum, source: computed, default: null, description: "P1 | P2 | P3 | P4 set at triage", constraints: "nullable until triaged" }
      - { name: triaged_at, type: datetime, source: system, default: null, description: "Logical clock value captured when triage ran", constraints: "nullable" }
      - { name: response_due, type: datetime, source: computed, default: null, description: "triaged_at + response SLA minutes for the band (see calculations.ticket_sla_windows)", constraints: "nullable" }
      - { name: resolution_due, type: datetime, source: computed, default: null, description: "triaged_at + resolution SLA minutes for the band", constraints: "nullable" }
      - { name: sla_response_status, type: enum, source: computed, description: "PENDING (untriaged) | ON_TRACK | BREACHED — BREACHED when clock has reached response_due and the ticket is not yet RESOLVED/CLOSED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical clock value captured when resolve ran; cleared on reopen", constraints: "nullable" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times this ticket has been reopened" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | TRIAGED | IN_PROGRESS | RESOLVED | CLOSED (see state_machines.Ticket)" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> Ticket.id; null for standalone PM or emergency knockdown work orders", constraints: "nullable" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: crew_id, type: string, source: system, default: null, description: "FK -> Crew.id; assigned on schedule, null while DRAFT", constraints: "nullable" }
      - { name: locate_request_id, type: string, source: input, description: "FK -> LocateRequest.id; required when work_type == EXCAVATION", constraints: "nullable" }
      - { name: work_type, type: enum, source: input, description: "REPAIR | PM_LAMP | LED_REPLACEMENT | EXCAVATION | EMERGENCY" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Estimated crew hours; basis for provisional cost and crew commitment" }
      - { name: estimated_parts, type: array, source: input, default: [], description: "Array of {qty, unit_price} line items estimated at creation" }
      - { name: actual_labor_hours, type: number, source: input, default: null, description: "Actual crew hours reported at completion", constraints: "nullable" }
      - { name: actual_parts, type: array, source: input, default: [], description: "Array of {qty, unit_price} line items reported at completion" }
      - { name: scheduled_start, type: datetime, source: system, default: null, description: "Crew occupancy window start (inclusive)", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: system, default: null, description: "Crew occupancy window end (exclusive)", constraints: "nullable" }
      - { name: provisional_cost, type: number, source: computed, default: null, description: "Cost from estimated inputs, computed at creation (see calculations.work_order_cost variant=provisional)", constraints: "nullable" }
      - { name: final_cost, type: number, source: computed, default: null, description: "Cost from actual inputs, computed at completion (variant=final)", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SCHEDULED | DISPATCHED | COMPLETED | CANCELLED (see state_machines.WorkOrder)" }

  - name: TimingPlanChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: intersection_id, type: string, source: input, description: "FK -> Intersection.id" }
      - { name: proposed_cycle_length_sec, type: integer, source: input, description: "Requested signal cycle length" }
      - { name: proposed_offset_sec, type: integer, source: input, description: "Requested coordination offset" }
      - { name: rationale, type: string, source: input, description: "Engineering justification" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Incremented on each resubmit" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical clock value at approve/reject", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | REJECTED | SUSPENDED (see state_machines.TimingPlanChangeRequest)" }

  - name: LocateRequest
    parent: null
    common_fields: true
    fields:
      - { name: intersection_id, type: string, source: input, description: "FK -> Intersection.id" }
      - { name: requested_by, type: string, source: input, description: "Requesting utility/coordinator name" }
      - { name: valid_days, type: integer, source: input, default: 21, description: "Number of days the clearance remains valid once created" }
      - { name: valid_until, type: datetime, source: computed, default: null, description: "= creation clock + valid_days days; excavation dispatch is blocked once clock passes this", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | MARKED | CLEARED (see state_machines.LocateRequest)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the repair that exposed the defect, null if standalone", constraints: "nullable" }
      - { name: defect_description, type: string, source: input, description: "Description of the warrantable defect" }
      - { name: coverage_variant, type: enum, source: computed, default: null, description: "FULL | PRORATED — selected at creation from device age vs coverage windows (see calculations.warranty_payout)", constraints: "nullable" }
      - { name: payout_amount, type: number, source: computed, default: null, description: "Computed reimbursement at creation", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | DENIED (see state_machines.WarrantyClaim)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ticket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /tickets/{id}/triage"
        actor: Dispatcher
        preconditions:
          - "Device referenced by device_id exists and is not DECOMMISSIONED"
        side_effects:
          - "Compute priority_score and priority_band (calculations.ticket_priority_score)"
          - "Set triaged_at = current logical clock; set response_due and resolution_due (calculations.ticket_sla_windows)"
          - "If source != KNOCKDOWN: Device.status -> OUT_OF_SERVICE (from IN_SERVICE); recompute the Device's Intersection.operational_posture"
          - "If source == KNOCKDOWN: Device.status -> KNOCKED_DOWN; if struck_pole and Device.pole_id is set then that Pole.status -> DOWN; the Device's Intersection.operational_posture recomputes to EMERGENCY; because the Intersection became EMERGENCY, every TimingPlanChangeRequest of that Intersection in {SUBMITTED, UNDER_REVIEW} transitions to SUSPENDED; an EMERGENCY WorkOrder (work_type=EMERGENCY, ticket_id=this, device_id=this device) is auto-created in DRAFT"
      - from: TRIAGED
        to: IN_PROGRESS
        trigger: "system (automatic when a WorkOrder linked by ticket_id is DISPATCHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /tickets/{id}/resolve"
        actor: Dispatcher
        preconditions:
          - "At least one WorkOrder with ticket_id == this ticket is COMPLETED"
        side_effects:
          - "Set resolved_at = current logical clock"
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /tickets/{id}/reopen"
        actor: Dispatcher
        preconditions:
          - "current clock - resolved_at <= REOPEN_WINDOW_HOURS (72h), else ERR_REOPEN_WINDOW_EXPIRED"
        side_effects:
          - "reopen_count += 1; clear resolved_at"
        note: "Cyclic revision loop back into the active pipeline"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /tickets/{id}/close"
        actor: Dispatcher
        preconditions:
          - "No WorkOrder with ticket_id == this ticket is in {DRAFT, SCHEDULED, DISPATCHED} (else ERR_TICKET_HAS_OPEN_WORK)"
        side_effects: []

  - entity: TimingPlanChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /timing-change-requests/{id}/start-review"
        actor: TrafficEngineer
        preconditions:
          - "Intersection.operational_posture != EMERGENCY (else ERR_INTERSECTION_EMERGENCY)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /timing-change-requests/{id}/approve"
        actor: TrafficEngineer
        preconditions:
          - "Intersection.operational_posture != EMERGENCY (safety) (else ERR_INTERSECTION_EMERGENCY)"
        side_effects:
          - "Intersection.active_cycle_length_sec = proposed_cycle_length_sec; Intersection.active_offset_sec = proposed_offset_sec; Intersection.active_plan_revision += 1; Intersection.version += 1"
          - "Set decided_at = current clock"
        note: "Branch A of the fork"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /timing-change-requests/{id}/reject"
        actor: TrafficEngineer
        preconditions: []
        side_effects:
          - "Set decided_at = current clock"
        note: "Branch B of the fork; divergent side-effect set (no Intersection mutation)"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /timing-change-requests/{id}/request-changes"
        actor: TrafficEngineer
        preconditions: []
        side_effects: []
        note: "Branch C of the fork"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /timing-change-requests/{id}/resubmit"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "revision_count += 1; optionally overwrite proposed_cycle_length_sec / proposed_offset_sec / rationale from the request body"
        note: "Revision loop closes the cycle"
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system (automatic when the Intersection transitions to EMERGENCY via a knockdown cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system (automatic when the Intersection transitions to EMERGENCY via a knockdown cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /timing-change-requests/{id}/resubmit"
        actor: Dispatcher
        preconditions:
          - "Intersection.operational_posture != EMERGENCY"
        side_effects:
          - "revision_count += 1"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Crew referenced by crew_id exists"
          - "If work_type == EXCAVATION: locate_request_id is set, its LocateRequest.status == CLEARED, and current clock <= LocateRequest.valid_until (safety) (else ERR_LOCATE_NOT_CLEARED / ERR_LOCATE_EXPIRED / ERR_LOCATE_REQUIRED)"
          - "No other WorkOrder of the same crew in {SCHEDULED, DISPATCHED} has a [scheduled_start, scheduled_end) interval overlapping this one (temporal) (else ERR_CREW_SCHEDULE_CONFLICT)"
          - "estimated_labor_hours <= Crew.available_labor_hours (fiscal) (else ERR_CREW_CAPACITY_EXCEEDED)"
        side_effects:
          - "crew_id, scheduled_start, scheduled_end set; Crew.committed_labor_hours += estimated_labor_hours (Crew.available_labor_hours recomputes)"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Device referenced by device_id is not DECOMMISSIONED (referential) (else ERR_DEVICE_DECOMMISSIONED)"
        side_effects:
          - "Device.status -> UNDER_MAINTENANCE (unless KNOCKED_DOWN); recompute Intersection.operational_posture"
          - "If ticket_id set and that Ticket.status == TRIAGED: Ticket.status -> IN_PROGRESS (bubble up)"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: FieldTech
        preconditions:
          - "Acting FieldTech's X-User-ID == this WorkOrder.crew_id (ownership)"
        side_effects:
          - "Compute final_cost (calculations.work_order_cost variant=final) from actual_labor_hours and actual_parts"
          - "Crew.committed_labor_hours -= estimated_labor_hours (release commitment)"
          - "Device.status -> IN_SERVICE; if this Device was KNOCKED_DOWN and had a struck Pole (Pole.status == DOWN) then that Pole.status -> STANDING; recompute the Device's Intersection.operational_posture (may drop EMERGENCY/DEGRADED back to NORMAL)"
          - "If work_type in {PM_LAMP, LED_REPLACEMENT}: Device.last_pm_at = current clock"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Crew.committed_labor_hours -= estimated_labor_hours (compensating release; Crew.available_labor_hours returns to its pre-schedule value)"

  - entity: PoleAttachment
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pole-attachments/{id}/approve"
        actor: UtilityCoordinator
        preconditions:
          - "Pole.status == STANDING (else ERR_POLE_NOT_STANDING)"
          - "No other APPROVED PoleAttachment on the same (pole_id, mount_zone) whose [effective_from, effective_to] window is within ATTACHMENT_BUFFER_DAYS (7) of this one — windows must be disjoint AND separated by at least the buffer (temporal) (else ERR_ATTACHMENT_WINDOW_CONFLICT)"
          - "load_units <= Pole.available_load_units, i.e. committed_load_units + load_units <= load_capacity_units (constraint) (else ERR_POLE_LOAD_EXCEEDED)"
        side_effects:
          - "Pole.committed_load_units += load_units (Pole.available_load_units recomputes); Pole.version += 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /pole-attachments/{id}/deny"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /pole-attachments/{id}/revoke"
        actor: UtilityCoordinator
        preconditions: []
        side_effects:
          - "Pole.committed_load_units -= load_units (compensating release; Pole.available_load_units returns to its pre-approval value); Pole.version += 1"

  - entity: LocateRequest
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: MARKED
        trigger: "POST /locate-requests/{id}/mark"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
      - from: MARKED
        to: CLEARED
        trigger: "POST /locate-requests/{id}/clear"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
        note: "Only CLEARED (and not past valid_until) unblocks EXCAVATION WorkOrder scheduling"

  - entity: Device
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (automatic on triage of a non-KNOCKDOWN Ticket for this Device)"
        actor: system
        preconditions: []
        side_effects: ["Recompute Intersection.operational_posture"]
      - from: IN_SERVICE
        to: KNOCKED_DOWN
        trigger: "system (automatic on triage of a KNOCKDOWN Ticket for this Device)"
        actor: system
        preconditions: []
        side_effects: ["Recompute Intersection.operational_posture -> EMERGENCY"]
      - from: OUT_OF_SERVICE
        to: KNOCKED_DOWN
        trigger: "system (automatic on triage of a KNOCKDOWN Ticket for this Device)"
        actor: system
        preconditions: []
        side_effects: ["Recompute Intersection.operational_posture -> EMERGENCY"]
      - from: OUT_OF_SERVICE
        to: UNDER_MAINTENANCE
        trigger: "system (automatic on WorkOrder dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: UNDER_MAINTENANCE
        trigger: "system (automatic on WorkOrder dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_MAINTENANCE
        to: IN_SERVICE
        trigger: "system (automatic on WorkOrder completion)"
        actor: system
        preconditions: []
        side_effects: ["Recompute Intersection.operational_posture"]
      - from: KNOCKED_DOWN
        to: IN_SERVICE
        trigger: "system (automatic on emergency WorkOrder completion)"
        actor: system
        preconditions: []
        side_effects: ["If struck Pole is DOWN, Pole.status -> STANDING; recompute Intersection.operational_posture"]
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Admin
        preconditions:
          - "No WorkOrder for this Device in {DRAFT, SCHEDULED, DISPATCHED}"
        side_effects: ["Recompute Intersection.operational_posture"]
      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Admin
        preconditions:
          - "No WorkOrder for this Device in {DRAFT, SCHEDULED, DISPATCHED}"
        side_effects: ["Recompute Intersection.operational_posture"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: attachment-create-stale-pole
    parent_entity: Pole
    write_endpoint: "POST /pole-attachments"
    occ_field: "expected_pole_version"
    description: |
      Creating a PoleAttachment against a Pole whose version has advanced since
      the client last observed it is rejected. A prior attachment create or
      approve on the same pole legitimately advances the pole's version (and its
      committed_load_units); a create still carrying the previously observed
      version is therefore working from a stale view of remaining capacity and
      is rejected on the stale-version check.
    error_id: ERR_STALE_POLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_priority_score
    trigger: "POST /tickets/{id}/triage"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): >=3 inputs with non-linear interaction
      # (capped sum + tiered band + hazard override).
      source_weight = { SRC_311: 10, DETECTOR: 15, KNOCKDOWN: 30 }[ticket.source]
      criticality_weight = { CRITICAL: 40, STANDARD: 20, LOW: 10 }[device.criticality]
      severity_weight = ticket.reported_severity * SEVERITY_MULT      # 1..5 -> 8..40
      hazard_bonus = HAZARD_BONUS if ticket.hazard_flag else 0
      priority_score = min(SCORE_CAP, source_weight + criticality_weight + severity_weight + hazard_bonus)

      # Tiered band selection with a hazard+CRITICAL override that forces P1
      # even when the numeric score would fall in a lower band.
      if priority_score >= P1_MIN or (ticket.hazard_flag and device.criticality == "CRITICAL"):
        priority_band = "P1"
      elif priority_score >= P2_MIN:
        priority_band = "P2"
      elif priority_score >= P3_MIN:
        priority_band = "P3"
      else:
        priority_band = "P4"
    input_set: "The single triaged Ticket plus its referenced Device (for criticality)."
    constants:
      SEVERITY_MULT: 8
      HAZARD_BONUS: 25
      SCORE_CAP: 100
      P1_MIN: 80
      P2_MIN: 60
      P3_MIN: 35
    precision: "integer score (no rounding); band is categorical"

  - name: ticket_sla_windows
    trigger: "POST /tickets/{id}/triage (set due dates); read-time evaluation of sla_response_status"
    algorithm: threshold
    formula: |
      response_sla_minutes  = { P1: 60,  P2: 240,  P3: 1440, P4: 4320  }[priority_band]
      resolution_sla_minutes= { P1: 240, P2: 1440, P3: 4320, P4: 10080 }[priority_band]
      response_due   = triaged_at + response_sla_minutes minutes
      resolution_due = triaged_at + resolution_sla_minutes minutes

      # Boundary is inclusive '>=': at exactly response_due the ticket is BREACHED.
      if ticket.status in { RESOLVED, CLOSED }:
        sla_response_status = ON_TRACK if resolved_at < response_due else BREACHED
      elif triaged_at is null:
        sla_response_status = PENDING
      elif current_clock >= response_due:
        sla_response_status = BREACHED
      else:
        sla_response_status = ON_TRACK
    input_set: "One Ticket; the logical clock supplies current_clock."
    precision: "minute-resolution datetime arithmetic"

  - name: work_order_cost
    trigger: "POST /work-orders (variant=provisional); POST /work-orders/{id}/complete (variant=final)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding order is pinned. Each parts line is
      # rounded to cents FIRST, then summed. Labor is rounded to cents. Overhead
      # is rounded to cents on the rounded subtotal. Summing raw then rounding
      # once ("sum-then-round") is explicitly WRONG and forbidden.
      labor_cost = round(hours * LABOR_RATE_PER_HOUR, 2)
      parts_cost = sum( round(line.qty * line.unit_price, 2) for line in parts_lines )   # round-per-line then sum
      subtotal   = labor_cost + parts_cost
      overhead   = round(subtotal * OVERHEAD_PCT, 2)
      cost       = subtotal + overhead
    input_set: "One WorkOrder; parts_lines and hours come from the estimated_* fields (provisional) or actual_* fields (final)."
    constants:
      LABOR_RATE_PER_HOUR: 95.00
      OVERHEAD_PCT: 0.15
    precision: "2 decimal places, round_half_up, applied per pinned order above"
    variants:
      - name: provisional
        when: "At WorkOrder creation, using estimated_labor_hours and estimated_parts"
        difference: "Writes provisional_cost; uses the estimate inputs"
      - name: final
        when: "At WorkOrder completion, using actual_labor_hours and actual_parts"
        difference: "Writes final_cost; uses the actual inputs — diverges from provisional_cost whenever actuals differ from estimates"

  - name: warranty_payout
    trigger: "POST /warranty-claims"
    algorithm: decay_function
    formula: |
      # Straight-line depreciation with a full-coverage grace window.
      age_months = whole calendar months from device.installed_at to current_clock
      if age_months > WARRANTY_TERM_MONTHS:
        reject with ERR_WARRANTY_EXPIRED
      elif age_months <= FULL_COVERAGE_MONTHS:
        coverage_variant = "FULL"
        payout_amount = round(device.replacement_cost, 2)
      else:
        coverage_variant = "PRORATED"
        payout_amount = round(device.replacement_cost * (WARRANTY_TERM_MONTHS - age_months) / WARRANTY_TERM_MONTHS, 2)
    input_set: "One WarrantyClaim plus its Device (replacement_cost, installed_at); logical clock supplies current_clock."
    constants:
      WARRANTY_TERM_MONTHS: 60
      FULL_COVERAGE_MONTHS: 12
    precision: "2 decimal places, round_half_up"
    variants:
      - name: full
        when: "age_months <= FULL_COVERAGE_MONTHS (12)"
        difference: "Pays full replacement_cost"
      - name: prorated
        when: "FULL_COVERAGE_MONTHS < age_months <= WARRANTY_TERM_MONTHS"
        difference: "Pays straight-line depreciated value — a different number than full for the same device"

  - name: crew_labor_ledger
    trigger: "WorkOrder schedule (debit) / cancel of a SCHEDULED WO / complete (release)"
    algorithm: aggregation
    formula: |
      committed_labor_hours = sum( wo.estimated_labor_hours
                                    for wo in WorkOrders
                                    where wo.crew_id == crew.id
                                      and wo.status in { SCHEDULED, DISPATCHED } )
      available_labor_hours = crew.labor_capacity_hours - committed_labor_hours
      # Conserved invariant: committed_labor_hours + available_labor_hours == labor_capacity_hours at all times.
    input_set: "All WorkOrders of the crew whose status is SCHEDULED or DISPATCHED."
    precision: "hour arithmetic, no rounding (inputs are already fixed-precision)"

  - name: pole_load_ledger
    trigger: "PoleAttachment approve (debit) / revoke (credit)"
    algorithm: aggregation
    formula: |
      committed_load_units = sum( a.load_units
                                  for a in PoleAttachments
                                  where a.pole_id == pole.id and a.status == APPROVED )
      available_load_units = pole.load_capacity_units - committed_load_units
      # Conserved invariant: committed_load_units + available_load_units == load_capacity_units at all times.
    input_set: "All APPROVED PoleAttachments of the pole."
    precision: "integer units"

  - name: intersection_posture
    trigger: "any Device.status change for a Device of the intersection; Pole knockdown/restore"
    algorithm: aggregation
    formula: |
      devs = [ d for d in Devices where d.intersection_id == intersection.id and d.status != DECOMMISSIONED ]
      if any(d.status == KNOCKED_DOWN for d in devs):
        operational_posture = "EMERGENCY"
      elif any(d.status in { OUT_OF_SERVICE, UNDER_MAINTENANCE } for d in devs):
        operational_posture = "DEGRADED"
      else:
        operational_posture = "NORMAL"
    input_set: "All non-DECOMMISSIONED Devices of the intersection."
    precision: "categorical"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC (includes FieldTech ownership: X-User-ID == WorkOrder.crew_id on complete)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id and every FK supplied in the body resolves to an existing resource (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and typed; enum members valid; reported_severity in 1..5"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "EXCAVATION WorkOrder scheduling requires a CLEARED, non-expired LocateRequest; TimingPlanChangeRequest start-review/approve require Intersection.operational_posture != EMERGENCY"
    error_id: "ERR_LOCATE_NOT_CLEARED / ERR_LOCATE_EXPIRED / ERR_LOCATE_REQUIRED / ERR_INTERSECTION_EMERGENCY"
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule; POST /timing-change-requests/{id}/start-review; POST /timing-change-requests/{id}/approve"

  - priority: 7
    category: business_referential
    check: "Referenced cross-entity resource is in a usable state — WorkOrder dispatch requires its Device not DECOMMISSIONED; PoleAttachment approve requires Pole STANDING"
    error_id: "ERR_DEVICE_DECOMMISSIONED / ERR_POLE_NOT_STANDING"
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch; POST /pole-attachments/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Interval-occupancy conflicts — crew schedule overlap on [scheduled_start, scheduled_end); pole-attachment window within ATTACHMENT_BUFFER_DAYS on (pole_id, mount_zone)"
    error_id: "ERR_CREW_SCHEDULE_CONFLICT / ERR_ATTACHMENT_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule; POST /pole-attachments/{id}/approve"

  - priority: 9
    category: business_constraint
    check: "Pole load capacity — committed_load_units + load_units must not exceed load_capacity_units"
    error_id: ERR_POLE_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /pole-attachments/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Crew labor budget — estimated_labor_hours must not exceed Crew.available_labor_hours"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 11
    category: business_temporal
    check: "Ticket reopen only within REOPEN_WINDOW_HOURS of resolved_at"
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /tickets/{id}/reopen"

  - priority: 12
    category: business_constraint
    check: "Ticket close blocked while any linked WorkOrder is in {DRAFT, SCHEDULED, DISPATCHED}"
    error_id: ERR_TICKET_HAS_OPEN_WORK
    http_status: 409
    applies_to: "POST /tickets/{id}/close"

  - priority: 13
    category: business_fiscal
    check: "Warranty age must not exceed WARRANTY_TERM_MONTHS at claim creation"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 14
    category: state
    check: "OCC — expected_pole_version must equal the Pole's current version"
    error_id: ERR_STALE_POLE_VERSION
    http_status: 412
    applies_to: "POST /pole-attachments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock advanced to to_iso8601"]

  # --- Intersection ---
  - method: POST
    path: "/intersections"
    description: "Create an intersection"
    roles: [Admin]
    code: 201
    input: [name, district, latitude, longitude]
    output: Intersection
    side_effects: ["operational_posture=NORMAL; active_plan_revision=0"]

  - method: GET
    path: "/intersections/{id}"
    description: "Get one intersection (includes computed operational_posture)"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: Intersection
    side_effects: []

  - method: GET
    path: "/intersections/{id}/summary"
    description: "Reporting: rolled-up status for one intersection"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: "{ intersection_id: string, operational_posture: string, device_count: integer, out_of_service_count: integer, open_ticket_count: integer }"
    side_effects: []

  # --- Pole ---
  - method: POST
    path: "/poles"
    description: "Create a pole"
    roles: [Admin]
    code: 201
    input: [label, latitude, longitude, load_capacity_units, "intersection_id?"]
    output: Pole
    side_effects: ["status=STANDING; committed_load_units=0; available_load_units=load_capacity_units"]

  - method: GET
    path: "/poles/{id}"
    description: "Get one pole"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: Pole
    side_effects: []

  - method: GET
    path: "/poles"
    description: "List poles (filterable); reverse-reachability for Pole.intersection_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["intersection_id?", "status?", "limit?", "offset?"]
    output: Pole[]
    side_effects: []

  # --- Device ---
  - method: POST
    path: "/devices"
    description: "Create a device (inventory + GIS)"
    roles: [Admin]
    code: 201
    input: [intersection_id, device_type, criticality, model, installed_at, replacement_cost, warranty_provider, "pole_id?"]
    output: Device
    side_effects: ["status=IN_SERVICE; recompute Intersection.operational_posture"]

  - method: GET
    path: "/devices/{id}"
    description: "Get one device"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/devices"
    description: "List devices (filterable); reverse-reachability for Device.intersection_id and Device.pole_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["intersection_id?", "pole_id?", "status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: POST
    path: "/devices/{id}/decommission"
    description: "Retire a device from service"
    roles: [Admin]
    code: 200
    input: []
    output: Device
    side_effects: ["status -> DECOMMISSIONED; recompute Intersection.operational_posture"]

  # --- Crew ---
  - method: POST
    path: "/crews"
    description: "Create a maintenance crew"
    roles: [Admin]
    code: 201
    input: [name, specialty, labor_capacity_hours]
    output: Crew
    side_effects: ["committed_labor_hours=0; available_labor_hours=labor_capacity_hours"]

  - method: GET
    path: "/crews/{id}"
    description: "Get one crew (includes committed/available labor hours)"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- PoleAttachment ---
  - method: POST
    path: "/pole-attachments"
    description: "Request a pole attachment (OCC on the parent Pole)"
    roles: [UtilityCoordinator]
    code: 201
    input: [pole_id, attacher_name, mount_zone, load_units, effective_from, effective_to, expected_pole_version]
    output: PoleAttachment
    side_effects: ["status=REQUESTED; increments Pole.version by 1"]

  - method: GET
    path: "/pole-attachments/{id}"
    description: "Get one pole attachment"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: PoleAttachment
    side_effects: []

  - method: GET
    path: "/pole-attachments"
    description: "List pole attachments (filterable); reverse-reachability for PoleAttachment.pole_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["pole_id?", "status?", "limit?", "offset?"]
    output: PoleAttachment[]
    side_effects: []

  - method: POST
    path: "/pole-attachments/{id}/approve"
    description: "Approve a pole attachment"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: PoleAttachment
    side_effects: ["status -> APPROVED; Pole.committed_load_units += load_units; increments Pole.version by 1"]

  - method: POST
    path: "/pole-attachments/{id}/deny"
    description: "Deny a pole attachment"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: PoleAttachment
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/pole-attachments/{id}/revoke"
    description: "Revoke an approved pole attachment (compensating release of load)"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: PoleAttachment
    side_effects: ["status -> REVOKED; Pole.committed_load_units -= load_units; increments Pole.version by 1"]

  # --- Ticket ---
  - method: POST
    path: "/tickets"
    description: "Open an outage/malfunction/knockdown ticket (311, detector, or knockdown)"
    roles: [Dispatcher]
    code: 201
    input: [device_id, source, reported_severity, description, "hazard_flag?", "struck_pole?"]
    output: Ticket
    side_effects: ["status=OPEN; sla_response_status=PENDING"]

  - method: GET
    path: "/tickets/{id}"
    description: "Get one ticket (includes computed priority and sla_response_status)"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets (filterable); reverse-reachability for Ticket.device_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["device_id?", "status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/tickets/{id}/triage"
    description: "Triage a ticket: score/band, set SLA windows, and fire the source-specific device/posture cascade"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Ticket
    side_effects: ["priority_score/priority_band/response_due/resolution_due set; Device/Pole/Intersection/TimingPlanChangeRequest cascade per state_machines.Ticket"]

  - method: POST
    path: "/tickets/{id}/resolve"
    description: "Mark a ticket resolved"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> RESOLVED; resolved_at set"]

  - method: POST
    path: "/tickets/{id}/reopen"
    description: "Reopen a resolved ticket within the reopen window"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> TRIAGED; reopen_count += 1; resolved_at cleared"]

  - method: POST
    path: "/tickets/{id}/close"
    description: "Close a resolved ticket"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> CLOSED"]

  # --- WorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Create a work order (repair, PM/lamp, LED replacement, excavation, or emergency)"
    roles: [Dispatcher]
    code: 201
    input: [device_id, work_type, estimated_labor_hours, "estimated_parts?", "ticket_id?", "locate_request_id?"]
    output: WorkOrder
    side_effects: ["status=DRAFT; compute provisional_cost (work_order_cost variant=provisional)"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Get one work order"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders (filterable); reverse-reachability for WorkOrder.ticket_id/device_id/crew_id/locate_request_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["ticket_id?", "device_id?", "crew_id?", "locate_request_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/schedule"
    description: "Assign a crew and time window to a work order"
    roles: [Dispatcher]
    code: 200
    input: [crew_id, scheduled_start, scheduled_end]
    output: WorkOrder
    side_effects: ["status -> SCHEDULED; crew_id/scheduled_start/scheduled_end set; Crew.committed_labor_hours += estimated_labor_hours"]

  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch a scheduled work order to the field"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> DISPATCHED; Device.status -> UNDER_MAINTENANCE; linked TRIAGED Ticket -> IN_PROGRESS"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete a dispatched work order (FieldTech of the owning crew); computes final cost and restores device"
    roles: [FieldTech]
    code: 200
    input: [actual_labor_hours, "actual_parts?"]
    output: WorkOrder
    side_effects: ["status -> COMPLETED; compute final_cost; Crew.committed_labor_hours -= estimated_labor_hours; Device -> IN_SERVICE (+ Pole restore); recompute Intersection.operational_posture; last_pm_at set for PM/LED"]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a DRAFT or SCHEDULED work order (releases crew commitment if scheduled)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CANCELLED; if was SCHEDULED, Crew.committed_labor_hours -= estimated_labor_hours"]

  # --- TimingPlanChangeRequest ---
  - method: POST
    path: "/timing-change-requests"
    description: "Submit a signal timing/plan change request"
    roles: [Dispatcher, TrafficEngineer]
    code: 201
    input: [intersection_id, proposed_cycle_length_sec, proposed_offset_sec, rationale]
    output: TimingPlanChangeRequest
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/timing-change-requests/{id}"
    description: "Get one timing change request"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: TimingPlanChangeRequest
    side_effects: []

  - method: GET
    path: "/timing-change-requests"
    description: "List timing change requests (filterable); reverse-reachability for intersection_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["intersection_id?", "status?", "limit?", "offset?"]
    output: TimingPlanChangeRequest[]
    side_effects: []

  - method: POST
    path: "/timing-change-requests/{id}/start-review"
    description: "Begin engineering review"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TimingPlanChangeRequest
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/timing-change-requests/{id}/approve"
    description: "Approve and apply the proposed plan to the intersection"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TimingPlanChangeRequest
    side_effects: ["status -> APPROVED; Intersection active plan fields updated; Intersection.active_plan_revision += 1; Intersection.version += 1; decided_at set"]

  - method: POST
    path: "/timing-change-requests/{id}/reject"
    description: "Reject the request"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TimingPlanChangeRequest
    side_effects: ["status -> REJECTED; decided_at set"]

  - method: POST
    path: "/timing-change-requests/{id}/request-changes"
    description: "Return the request to the submitter for changes"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TimingPlanChangeRequest
    side_effects: ["status -> CHANGES_REQUESTED"]

  - method: POST
    path: "/timing-change-requests/{id}/resubmit"
    description: "Resubmit a CHANGES_REQUESTED or SUSPENDED request"
    roles: [Dispatcher, TrafficEngineer]
    code: 200
    input: ["proposed_cycle_length_sec?", "proposed_offset_sec?", "rationale?"]
    output: TimingPlanChangeRequest
    side_effects: ["status -> SUBMITTED; revision_count += 1"]

  # --- LocateRequest ---
  - method: POST
    path: "/locate-requests"
    description: "Open a utility locate / electric-utility coordination request"
    roles: [UtilityCoordinator]
    code: 201
    input: [intersection_id, requested_by, "valid_days?"]
    output: LocateRequest
    side_effects: ["status=OPEN; valid_until = current clock + valid_days days"]

  - method: GET
    path: "/locate-requests/{id}"
    description: "Get one locate request"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: LocateRequest
    side_effects: []

  - method: GET
    path: "/locate-requests"
    description: "List locate requests (filterable); reverse-reachability for intersection_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["intersection_id?", "status?", "limit?", "offset?"]
    output: LocateRequest[]
    side_effects: []

  - method: POST
    path: "/locate-requests/{id}/mark"
    description: "Mark utility lines located"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: LocateRequest
    side_effects: ["status -> MARKED"]

  - method: POST
    path: "/locate-requests/{id}/clear"
    description: "Clear the locate — unblocks excavation scheduling until valid_until"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: LocateRequest
    side_effects: ["status -> CLEARED"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim; payout and coverage variant computed at creation"
    roles: [UtilityCoordinator]
    code: 201
    input: [device_id, defect_description, "work_order_id?"]
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED; compute coverage_variant and payout_amount (warranty_payout)"]

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get one warranty claim"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims (filterable); reverse-reachability for device_id and work_order_id"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["device_id?", "work_order_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a warranty claim"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a warranty claim"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> DENIED"]

  # --- Reporting ---
  - method: GET
    path: "/reports/device-availability"
    description: "Reporting: fleet availability roll-up, optionally scoped to one intersection"
    roles: [Admin, Dispatcher, FieldTech, TrafficEngineer, UtilityCoordinator]
    code: 200
    input: ["intersection_id?"]
    output: "{ total_devices: integer, in_service: integer, out_of_service: integer, knocked_down: integer, availability_pct: number }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or FieldTech acting on a work order whose crew_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing/mistyped field, invalid enum, or reported_severity outside 1..5" }
  - { id: ERR_INTERSECTION_NOT_FOUND, http: 404, condition: "intersection_id does not resolve" }
  - { id: ERR_POLE_NOT_FOUND, http: 404, condition: "pole_id does not resolve" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "device_id does not resolve" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "ticket_id does not resolve" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "work order id does not resolve" }
  - { id: ERR_ATTACHMENT_NOT_FOUND, http: 404, condition: "pole attachment id does not resolve" }
  - { id: ERR_TCR_NOT_FOUND, http: 404, condition: "timing change request id does not resolve" }
  - { id: ERR_LOCATE_NOT_FOUND, http: 404, condition: "locate_request_id does not resolve" }
  - { id: ERR_WARRANTY_NOT_FOUND, http: 404, condition: "warranty claim id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_DEVICE_DECOMMISSIONED, http: 409, condition: "Work order dispatch blocked because its Device is DECOMMISSIONED" }
  - { id: ERR_LOCATE_REQUIRED, http: 409, condition: "EXCAVATION work order scheduled without a locate_request_id" }
  - { id: ERR_LOCATE_NOT_CLEARED, http: 409, condition: "EXCAVATION scheduling blocked because the LocateRequest is not CLEARED" }
  - { id: ERR_LOCATE_EXPIRED, http: 409, condition: "EXCAVATION scheduling blocked because the clock is past LocateRequest.valid_until" }
  - { id: ERR_INTERSECTION_EMERGENCY, http: 409, condition: "Timing change start-review/approve blocked because the Intersection is in EMERGENCY posture" }
  - { id: ERR_POLE_NOT_STANDING, http: 409, condition: "Attachment approve blocked because the Pole.status is DOWN" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Crew already has a SCHEDULED/DISPATCHED work order overlapping [scheduled_start, scheduled_end)" }
  - { id: ERR_ATTACHMENT_WINDOW_CONFLICT, http: 409, condition: "An APPROVED attachment on the same (pole_id, mount_zone) is within ATTACHMENT_BUFFER_DAYS of the requested window" }
  - { id: ERR_POLE_LOAD_EXCEEDED, http: 409, condition: "committed_load_units + load_units would exceed load_capacity_units" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "estimated_labor_hours exceeds Crew.available_labor_hours" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "Reopen attempted more than REOPEN_WINDOW_HOURS after resolved_at" }
  - { id: ERR_TICKET_HAS_OPEN_WORK, http: 409, condition: "Ticket close blocked while a linked work order is DRAFT/SCHEDULED/DISPATCHED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Device age exceeds WARRANTY_TERM_MONTHS at claim creation" }
  - { id: ERR_STALE_POLE_VERSION, http: 412, condition: "expected_pole_version does not match the Pole's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Inventory and system owner; hierarchical override. Creates intersections/poles/devices/crews, decommissions devices, and sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /intersections"
      - "POST /poles"
      - "POST /devices"
      - "POST /devices/{id}/decommission"
      - "POST /crews"
    shared_operations:
      - "All GET endpoints"

  - name: Dispatcher
    description: "Owns the ticket and work-order pipelines; may submit and resubmit timing change requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /tickets"
      - "POST /tickets/{id}/triage"
      - "POST /tickets/{id}/resolve"
      - "POST /tickets/{id}/reopen"
      - "POST /tickets/{id}/close"
      - "POST /work-orders"
      - "POST /work-orders/{id}/schedule"
      - "POST /work-orders/{id}/dispatch"
      - "POST /work-orders/{id}/cancel"
    shared_operations:
      - "POST /timing-change-requests (with TrafficEngineer)"
      - "POST /timing-change-requests/{id}/resubmit (with TrafficEngineer)"
      - "All GET endpoints"

  - name: FieldTech
    description: "Field crew member; completes work orders assigned to their own crew."
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /work-orders/{id}/complete (only when WorkOrder.crew_id == X-User-ID)"
    shared_operations:
      - "All GET endpoints"

  - name: TrafficEngineer
    description: "Reviews and decides signal timing/plan change requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /timing-change-requests/{id}/start-review"
      - "POST /timing-change-requests/{id}/approve"
      - "POST /timing-change-requests/{id}/reject"
      - "POST /timing-change-requests/{id}/request-changes"
    shared_operations:
      - "POST /timing-change-requests (with Dispatcher)"
      - "POST /timing-change-requests/{id}/resubmit (with Dispatcher)"
      - "All GET endpoints"

  - name: UtilityCoordinator
    description: "Owns locate coordination, pole attachments, and warranty claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /pole-attachments"
      - "POST /pole-attachments/{id}/approve"
      - "POST /pole-attachments/{id}/deny"
      - "POST /pole-attachments/{id}/revoke"
      - "POST /locate-requests"
      - "POST /locate-requests/{id}/mark"
      - "POST /locate-requests/{id}/clear"
      - "POST /warranty-claims"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/deny"
    shared_operations:
      - "All GET endpoints"
