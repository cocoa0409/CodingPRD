      - name: lost_earnings_round_per_line_then_sum
        grounds:
          - calculations.lost_earnings_correction
          - calculations.excise_tax_on_late_deposit
          - calculations.remittance_deadline
          - state_machines.RemittanceBatch.LATE_to_CORRECTION_PENDING
          - entities.RemittanceCorrection.fields.line_breakdown
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-half-up per line item BEFORE summation. With
          calendar_days_late 40 and lines of 555555, 333333 and 111111 cents the per-line
          rounding yields 3653 + 2192 + 731 == 6576 cents, whereas summing the unrounded
          products and rounding once yields 6575 cents; the correction MUST report 6576 and
          the excise tax MUST be 986, computed on that already-summed total.
