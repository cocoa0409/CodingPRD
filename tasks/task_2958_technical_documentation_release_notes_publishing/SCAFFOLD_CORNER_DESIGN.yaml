      - name: release_train_readiness_empty_set_is_vacuously_one
        claim_type: threshold
        grounds: ["calculations.release_train_doc_readiness", "entities.ReleaseTrain.fields.approved_topic_ratio", "entities.ReleaseTrain.fields.doc_readiness_posture"]
        distinguishing_aspect: "The empty-set convention is 1.00, not 0.00 and not null, and it survives the PLANNED -> DOC_FREEZE advance: the train is vacuously OPEN with zero plan items and only collapses to FROZEN when the FIRST unapproved plan item drags the ratio to 0.00. An implementation that divides by zero, or that seeds the ratio at 0.00, fails on the second read rather than the first."
        test_recipe:
          setup:
            - "One freshly created release train with no plan items at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
          trigger:
            - call: "GET /release-trains/${rt_id}"
              payload: {}
              as: DocsLead
            - call: "POST /release-trains/${rt_id}/advance"
              payload: { target_status: "DOC_FREEZE" }
              as: DocsLead
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "GET /release-trains/${rt_id}"
              payload: {}
              as: DocsLead
          assert:
            - "read 1 (PLANNED, empty): plan_item_count == 0, approved_plan_item_count == 0, approved_topic_ratio == 1.00, doc_readiness_posture == OPEN"
            - "after the advance (DOC_FREEZE, still empty): approved_topic_ratio == 1.00 and doc_readiness_posture == OPEN — the ratio band is now live and 1.00 >= 0.80 keeps it OPEN"
            - "read 2 (DOC_FREEZE, one DRAFTED item): plan_item_count == 1, approved_plan_item_count == 0, approved_topic_ratio == 0.00, doc_readiness_posture == FROZEN (0.00 < 0.50)"
            - "ReleaseTrain.${rt_id}.version incremented exactly once across the three writes (the advance); the plan-item create does not bump the train's version"

