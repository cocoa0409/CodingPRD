  - rule_id: transitive_cascade
    instances:
      - name: bind_cascade_policy_parts_insured_capacity
        grounds:
          - state_machines.Policy.null_to_INCEPTED
          - state_machines.Quote.OFFERED_to_ACCEPTED
          - calculations.bound_premium_exclusion_adjustment
          - calculations.entity_side_c_capacity
          - entities.CoveragePart.fields.limit_usd
          - entities.Insured.fields.capacity_posture
          - endpoints[POST /dno/quotes/{id}/accept]
        distinguishing_aspect: |
          One accept call propagates through four dependency hops that each read the previous hop's
          output: Quote -> Policy (hop 1) -> the three CoverageParts (hop 2) -> the insured's
          aggregate Side C exposure (hop 3) -> the insured's capacity_posture and open_policy_count
          (hop 4). Hop 4 depends on hop 3's sum divided by the cap, so a bind that skipped the
