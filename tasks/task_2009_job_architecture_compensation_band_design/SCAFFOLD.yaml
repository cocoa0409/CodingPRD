scenario: '2009. Job Architecture & Compensation Band Design (corporate compensation team): job family/level framework & leveling criteria, job description library
  & FLSA exemption determination, market pricing & band midpoint construction, band overlap & progression rules, job mapping exercise & reslotting decisions, geographic
  differential structure, band refresh cadence & budget impact, manager guidance & exception approval'
domain_name: job-architecture-compensation-band-design
api_prefix: /comp
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: multi_party_negotiation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: CompProgram
  parent: null
  common_fields: true
  fields:
  - name: fiscal_year
    type: integer
    source: input
    description: Fiscal year the program governs (e.g., 2027)
  - name: refresh_cadence_months
    type: integer
    source: input
    default: 12
    description: Months between scheduled band refreshes; must be >= 1
  - name: pricing_as_of_date
    type: string
    source: input
    description: ISO date market data is aged to when pricing bands in this program
  - name: merit_budget_cents
    type: integer
    source: input
    description: Total merit/adjustment budget for the cycle, in cents
  - name: refresh_budget_cents
    type: integer
    source: input
    description: Budget ceiling for a single refresh cycle's salary impact, in cents
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | FRAMEWORK_LOCKED | PRICING | MAPPING_OPEN | PUBLISHED | ARCHIVED
  - name: total_payroll_projection_cents
    type: integer
    source: computed
    default: 0
    description: Sum of Department.projected_payroll_cents over all departments; recomputed on every employee salary/status change
  - name: refresh_budget_spent_cents
    type: integer
    source: computed
    default: 0
    description: Cumulative applied refresh adjustments charged to the program
- name: JobFamily
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Unique family code (e.g., ENG)
  - name: name
    type: string
    source: input
    description: Display name
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | RETIRED
- name: JobLevel
  parent: null
  common_fields: true
  fields:
  - name: level_code
    type: string
    source: input
    description: Unique level code (e.g., P1)
  - name: title
    type: string
    source: input
    description: Level title
  - name: rank_order
    type: integer
    source: input
    description: Framework-wide seniority rank; unique across JobLevel; higher = more senior
  - name: scope_criteria
    type: string
    source: input
    description: Leveling criteria narrative (scope, autonomy, impact)
  - name: min_years_experience
    type: integer
    source: input
    default: 0
    description: Minimum years of experience guideline
- name: GeoZone
  parent: null
  common_fields: true
  fields:
  - name: zone_code
    type: string
    source: input
    description: Unique zone code (e.g., US-NAT)
  - name: name
    type: string
    source: input
    description: Zone display name
  - name: parent_zone_id
    type: string
    source: input
    description: FK -> GeoZone.id; null for root zones; parent chain must be acyclic
  - name: differential_ratio
    type: number
    source: input
    description: Zone differential relative to parent zone, 6 decimal places (e.g., 1.180000)
  - name: effective_ratio
    type: number
    source: computed
    description: Compounded ratio to the root, per geo_effective_ratio calculation, 6 decimal places
- name: JobProfile
  parent: null
  common_fields: true
  fields:
  - name: job_family_id
    type: string
    source: input
    description: FK -> JobFamily.id
  - name: job_level_id
    type: string
    source: input
    description: FK -> JobLevel.id
  - name: title
    type: string
    source: input
    description: Job title in the description library
  - name: summary
    type: string
    source: input
    description: Job description summary
  - name: salary_basis_weekly_cents
    type: integer
    source: input
    description: Weekly salary basis used by the FLSA salary-basis test, in cents
  - name: duties_test_passed
    type: boolean
    source: input
    description: Whether the duties test for exemption is met
  - name: flsa_classification
    type: enum
    source: system
    default: PENDING
    description: PENDING | EXEMPT | NON_EXEMPT — set only by determine-flsa
  - name: flsa_determined_at
    type: datetime
    source: system
    description: Logical-clock timestamp of last FLSA determination; null until determined
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | IN_REVIEW | APPROVED | RETIRED
- name: MarketSurvey
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Survey name
  - name: publisher
    type: string
    source: input
    description: Survey publisher
  - name: survey_year
    type: integer
    source: input
    description: Survey vintage year
  - name: effective_date
    type: string
    source: input
    description: ISO date the survey data is effective
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | ACCEPTED | REJECTED
- name: MarketCut
  parent: null
  common_fields: true
  fields:
  - name: market_survey_id
    type: string
    source: input
    description: FK -> MarketSurvey.id
  - name: job_profile_id
    type: string
    source: input
    description: FK -> JobProfile.id
  - name: geo_zone_id
    type: string
    source: input
    description: FK -> GeoZone.id
  - name: p25_cents
    type: integer
    source: input
    description: 25th percentile annual salary observation, cents; optional
  - name: p50_cents
    type: integer
    source: input
    description: 50th percentile annual salary observation, cents
  - name: p75_cents
    type: integer
    source: input
    description: 75th percentile annual salary observation, cents; optional
  - name: sample_size
    type: integer
    source: input
    description: Incumbent count behind the observation; must be >= 1
  - name: effective_date
    type: string
    source: input
    description: ISO date the cut is effective; two cuts for the same (job_profile_id, geo_zone_id) must be >= 30 days apart
  - name: excluded_from_composite
    type: boolean
    source: input
    default: false
    description: When true, cut is excluded from market_composite_pricing candidate sets
- name: ProgressionPolicy
  parent: null
  common_fields: true
  fields:
  - name: job_family_id
    type: string
    source: input
    description: FK -> JobFamily.id
  - name: from_level_id
    type: string
    source: input
    description: FK -> JobLevel.id; lower level of the adjacent pair
  - name: to_level_id
    type: string
    source: input
    description: FK -> JobLevel.id; upper level of the adjacent pair; rank_order must exceed from level's
  - name: min_midpoint_progression_pct
    type: number
    source: input
    description: Minimum midpoint progression from lower to upper band, 4 decimal places
  - name: max_overlap_pct
    type: number
    source: input
    description: Maximum permitted band overlap for the pair, 4 decimal places
- name: PayBand
  parent: null
  common_fields: true
  fields:
  - name: comp_program_id
    type: string
    source: input
    description: FK -> CompProgram.id
  - name: job_family_id
    type: string
    source: input
    description: FK -> JobFamily.id
  - name: job_level_id
    type: string
    source: input
    description: FK -> JobLevel.id
  - name: geo_zone_id
    type: string
    source: input
    description: FK -> GeoZone.id
  - name: target_percentile
    type: enum
    source: input
    description: P50 | P62_5 | P75 — market positioning target
  - name: spread_pct
    type: number
    source: input
    description: Band width as decimal, 4 decimal places (e.g., 0.3000); min = midpoint*(1-spread/2), max = midpoint*(1+spread/2)
  - name: policy_adjustment_factor
    type: number
    source: input
    default: 1.0
    description: Policy lever applied after geo adjustment in midpoint construction, 4 decimal places
  - name: pricing_variant
    type: enum
    source: system
    description: PROVISIONAL | OFFICIAL — variant used in the most recent price call; null until priced
  - name: market_composite_cents
    type: integer
    source: computed
    description: Composite market value from market_composite_pricing; null until priced
  - name: composite_cut_count
    type: integer
    source: computed
    description: Number of candidate cuts used in the last pricing
  - name: midpoint_cents
    type: integer
    source: computed
    description: Band midpoint from band_midpoint_construction; null until priced
  - name: min_cents
    type: integer
    source: computed
    description: Band minimum from band_min_max_construction
  - name: max_cents
    type: integer
    source: computed
    description: Band maximum from band_min_max_construction
  - name: geo_ratio_snapshot
    type: number
    source: computed
    description: GeoZone.effective_ratio captured at pricing time
  - name: priced_at
    type: datetime
    source: system
    description: Logical-clock timestamp of last pricing; null until priced
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | PRICED | COMP_APPROVED | PUBLISHED | SUPERSEDED
  - name: superseded_by_band_id
    type: string
    source: system
    description: FK -> PayBand.id; set on the old band when a refresh publishes its replacement; self-referential
- name: Department
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Department name
  - name: code
    type: string
    source: input
    description: Unique department code
  - name: adjustment_pool_cents
    type: integer
    source: input
    description: Adjustment budget pool available to this department, cents
  - name: committed_pool_cents
    type: integer
    source: computed
    default: 0
    description: Pool cents committed by APPROVED mapping adjustments and exception deltas; released on reverse/rescind
  - name: projected_payroll_cents
    type: integer
    source: computed
    default: 0
    description: Sum of base_salary_cents over the department's ACTIVE employees
- name: Employee
  parent: null
  common_fields: true
  fields:
  - name: employee_ref
    type: string
    source: input
    description: Unique external employee reference
  - name: department_id
    type: string
    source: input
    description: FK -> Department.id
  - name: job_profile_id
    type: string
    source: input
    description: FK -> JobProfile.id; must reference an APPROVED profile
  - name: geo_zone_id
    type: string
    source: input
    description: FK -> GeoZone.id
  - name: base_salary_cents
    type: integer
    source: input
    description: Current annual base salary, cents
  - name: hire_date
    type: string
    source: input
    description: ISO hire date; used as rollup ordering key
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | TERMINATED
  - name: compa_ratio
    type: number
    source: computed
    description: base_salary_cents / current PUBLISHED band midpoint, 4 decimal places round_half_up; null when UNBANDED
  - name: range_position
    type: enum
    source: computed
    description: BELOW_MIN | IN_RANGE | ABOVE_MAX | UNBANDED vs current PUBLISHED band
  - name: red_circled
    type: boolean
    source: computed
    default: false
    description: True when salary exceeds current band max and is frozen
- name: MappingDecision
  parent: null
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: input
    description: FK -> Employee.id
  - name: from_job_profile_id
    type: string
    source: system
    description: FK -> JobProfile.id; snapshot of employee's profile at submit time
  - name: to_job_profile_id
    type: string
    source: input
    description: FK -> JobProfile.id; target profile, must be APPROVED at submit
  - name: justification
    type: string
    source: input
    description: Business justification; optional
  - name: kind
    type: enum
    source: computed
    description: UPSLOT | DOWNSLOT | LATERAL — computed at submit from level rank_order comparison
  - name: provisional_adjustment_cents
    type: integer
    source: computed
    description: Estimate computed at submit using band values as of submit (reslot_salary_adjustment PROVISIONAL variant)
  - name: final_adjustment_cents
    type: integer
    source: computed
    description: Actual adjustment applied at approve using band values as of approve (FINAL variant); null until approved
  - name: pre_salary_cents
    type: integer
    source: system
    description: Employee salary snapshot at approve; restored on reverse
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | SUBMITTED | HRBP_REVIEWED | COMP_TRIAGED | APPROVED | REJECTED | RETURNED | WITHDRAWN | REVERSED
  - name: submitted_by_user_id
    type: string
    source: system
    description: X-User-ID of the submitter
  - name: decided_by_user_id
    type: string
    source: system
    description: X-User-ID of the approver/rejecter
  - name: approved_at
    type: datetime
    source: system
    description: Logical-clock timestamp of approval; null until approved
- name: ExceptionRequest
  parent: null
  common_fields: true
  fields:
  - name: employee_id
    type: string
    source: input
    description: FK -> Employee.id
  - name: pay_band_id
    type: string
    source: input
    description: FK -> PayBand.id; must reference a PUBLISHED band matching the employee's family/level/geo
  - name: type
    type: enum
    source: input
    description: ABOVE_MAX_HIRE | BELOW_MIN_RETENTION | OFF_CYCLE_INCREASE | GEO_MISMATCH
  - name: requested_salary_cents
    type: integer
    source: input
    description: Requested new salary, cents; validated against exception_cap_evaluation
  - name: justification
    type: string
    source: input
    description: Manager justification
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | HRBP_PASSED | FINANCE_REVIEW | APPROVED | DENIED | RETURNED | RESCINDED
  - name: finance_required
    type: boolean
    source: computed
    description: True iff type == ABOVE_MAX_HIRE; gates the FINANCE_REVIEW branch
  - name: pre_exception_salary_cents
    type: integer
    source: system
    description: Employee salary snapshot at final approval; restored on rescind
  - name: applied_delta_cents
    type: integer
    source: computed
    description: requested_salary_cents - pre_exception_salary_cents at approval; debited from department pool when positive
  - name: created_by_user_id
    type: string
    source: system
    description: X-User-ID of creator; segregation-of-duties anchor ('system' for refresh-auto-created requests)
  - name: comp_gate_by_user_id
    type: string
    source: system
    description: X-User-ID that passed the comp gate
  - name: applied_at
    type: datetime
    source: system
    description: Logical-clock timestamp of approval application; null until approved
- name: RefreshCycle
  parent: null
  common_fields: true
  fields:
  - name: comp_program_id
    type: string
    source: input
    description: FK -> CompProgram.id
  - name: planned_window_start
    type: string
    source: input
    description: ISO date; half-open window start
  - name: planned_window_end
    type: string
    source: input
    description: ISO date; half-open window end; must be after start
  - name: effective_date
    type: string
    source: input
    description: ISO date new bands take effect; apply is blocked before this date (logical clock)
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | IMPACT_COMPUTED | APPROVED | APPLIED | CANCELLED
  - name: budget_impact_cents
    type: integer
    source: computed
    description: Rollup from refresh_budget_impact_rollup; null until compute-impact
  - name: affected_employee_count
    type: integer
    source: computed
    description: Employees receiving a nonzero adjustment in the rollup
  - name: applied_at
    type: datetime
    source: system
    description: Logical-clock timestamp of application; null until applied
state_machines:
- entity: CompProgram
  initial_state: DRAFT
  terminal_states:
  - ARCHIVED
  transitions:
  - from: DRAFT
    to: FRAMEWORK_LOCKED
    trigger: 'POST /comp/programs/{id}/transition {to_state: FRAMEWORK_LOCKED}'
    actor: CompAdmin
    preconditions:
    - '>= 1 JobFamily with status == ACTIVE exists'
    - '>= 2 JobLevel rows exist'
    side_effects:
    - CompProgram.version += 1
    - job family/level structure becomes read-only for this program's pricing inputs
  - from: FRAMEWORK_LOCKED
    to: PRICING
    trigger: 'POST /comp/programs/{id}/transition {to_state: PRICING}'
    actor: CompAdmin
    preconditions:
    - '>= 1 JobProfile with status == APPROVED exists'
    side_effects:
    - CompProgram.version += 1
    - PayBand price calls become legal for this program
  - from: PRICING
    to: MAPPING_OPEN
    trigger: 'POST /comp/programs/{id}/transition {to_state: MAPPING_OPEN}'
    actor: CompAdmin
    preconditions:
    - '>= 1 PayBand of this program with status == PUBLISHED exists'
    side_effects:
    - CompProgram.version += 1
    - MappingDecision submit becomes legal
  - from: MAPPING_OPEN
    to: PUBLISHED
    trigger: 'POST /comp/programs/{id}/transition {to_state: PUBLISHED}'
    actor: CompAdmin
    preconditions:
    - No MappingDecision in this program's scope with status IN {SUBMITTED, HRBP_REVIEWED, COMP_TRIAGED}
    side_effects:
    - CompProgram.version += 1
    - ExceptionRequest creation and RefreshCycle scheduling become legal
  - from: PUBLISHED
    to: ARCHIVED
    trigger: 'POST /comp/programs/{id}/transition {to_state: ARCHIVED}'
    actor: CompAdmin
    preconditions:
    - No RefreshCycle of this program with status IN {SCHEDULED, IMPACT_COMPUTED, APPROVED}
    - No ExceptionRequest with status IN {SUBMITTED, HRBP_PASSED, FINANCE_REVIEW, RETURNED} on employees in scope
    side_effects:
    - CompProgram.version += 1
    - all child writes become illegal (posture lockdown)
- entity: JobProfile
  initial_state: DRAFT
  terminal_states:
  - RETIRED
  transitions:
  - from: DRAFT
    to: IN_REVIEW
    trigger: POST /comp/job-profiles/{id}/submit
    actor: CompAnalyst
    preconditions:
    - flsa_classification != PENDING
    side_effects:
    - JobProfile.version += 1
  - from: IN_REVIEW
    to: DRAFT
    trigger: POST /comp/job-profiles/{id}/return
    actor: CompManager
    preconditions: []
    side_effects:
    - JobProfile.version += 1
    - 'revision loop: profile may be re-determined and resubmitted'
  - from: IN_REVIEW
    to: APPROVED
    trigger: POST /comp/job-profiles/{id}/approve
    actor: CompManager
    preconditions:
    - flsa_classification IN {EXEMPT, NON_EXEMPT}
    side_effects:
    - JobProfile.version += 1
    - profile becomes eligible as mapping target and employee assignment
  - from: APPROVED
    to: IN_REVIEW
    trigger: POST /comp/job-profiles/{id}/revise
    actor: CompAnalyst
    preconditions: []
    side_effects:
    - JobProfile.version += 1
    - flsa_classification reset to PENDING, flsa_determined_at reset to null
  - from: APPROVED
    to: RETIRED
    trigger: POST /comp/job-profiles/{id}/retire
    actor: CompManager
    preconditions:
    - No Employee with job_profile_id == this profile and status == ACTIVE
    side_effects:
    - JobProfile.version += 1
  - from: DRAFT
    to: DRAFT
    trigger: POST /comp/job-profiles/{id}/determine-flsa
    actor: CompAnalyst
    preconditions: []
    side_effects:
    - flsa_classification computed per flsa_determination
    - flsa_determined_at = logical clock
    - JobProfile.version += 1
    note: determine-flsa is also legal in IN_REVIEW (self-transition IN_REVIEW -> IN_REVIEW with identical side effects)
- entity: MarketSurvey
  initial_state: SUBMITTED
  terminal_states:
  - ACCEPTED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /comp/market-surveys/{id}/accept
    actor: CompManager
    preconditions: []
    side_effects:
    - survey's cuts enter the OFFICIAL pricing candidate set
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /comp/market-surveys/{id}/reject
    actor: CompManager
    preconditions: []
    side_effects:
    - survey's cuts leave all pricing candidate sets
- entity: PayBand
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: PRICED
    trigger: POST /comp/pay-bands/{id}/price
    actor: CompAnalyst
    preconditions:
    - CompProgram.status IN {PRICING, MAPPING_OPEN} for band's comp_program_id (mid-exercise repricing is legitimate)
    - 'OCC: expected_pay_band_version == current PayBand.version'
    - candidate cut set for chosen variant non-empty
    side_effects:
    - market_composite_pricing runs (variant from request)
    - band_midpoint_construction and band_min_max_construction run; midpoint_cents/min_cents/max_cents set
    - geo_ratio_snapshot = GeoZone.effective_ratio at pricing time
    - priced_at = logical clock; PayBand.version += 1
  - from: PRICED
    to: PRICED
    trigger: POST /comp/pay-bands/{id}/price
    actor: CompAnalyst
    preconditions:
    - same as DRAFT->PRICED (re-price loop)
    side_effects:
    - same as DRAFT->PRICED; pricing_variant overwritten
  - from: PRICED
    to: COMP_APPROVED
    trigger: POST /comp/pay-bands/{id}/approve
    actor: CompManager
    preconditions:
    - pricing_variant == OFFICIAL
    - 'FLSA safety: for every APPROVED JobProfile in band''s family+level with flsa_classification == EXEMPT, min_cents >= FLSA_ANNUAL_MINIMUM_CENTS'
    - 'overlap check: unrounded overlap vs adjacent lower band <= policy max_overlap_pct (or DEFAULT_MAX_OVERLAP_PCT)'
    - 'progression check: unrounded midpoint progression vs adjacent lower band >= policy min_midpoint_progression_pct (or DEFAULT_MIN_PROGRESSION_PCT)'
    side_effects:
    - PayBand.version += 1
  - from: COMP_APPROVED
    to: PUBLISHED
    trigger: POST /comp/pay-bands/{id}/publish
    actor: CompManager
    preconditions:
    - CompProgram.status IN {PRICING, MAPPING_OPEN}
    side_effects:
    - PayBand.version += 1
    - compa_ratio_and_range_position recomputed for every ACTIVE employee whose profile's family+level and geo match this band
  - from: COMP_APPROVED
    to: DRAFT
    trigger: POST /comp/pay-bands/{id}/reopen
    actor: CompManager
    preconditions: []
    side_effects:
    - PayBand.version += 1
    - priced fields retained but band must be re-priced before re-approval
  - from: PUBLISHED
    to: SUPERSEDED
    trigger: system (RefreshCycle apply publishes replacement band)
    actor: system
    preconditions: []
    side_effects:
    - superseded_by_band_id set to replacement band id
    - PayBand.version += 1
- entity: MappingDecision
  initial_state: DRAFT
  terminal_states:
  - REJECTED
  - WITHDRAWN
  - REVERSED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /comp/mapping-decisions/{id}/submit
    actor: DepartmentManager
    preconditions:
    - CompProgram.status == MAPPING_OPEN for the current program
    - Employee.status == ACTIVE
    - to_job_profile_id references JobProfile with status == APPROVED
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects:
    - from_job_profile_id snapshot = Employee.job_profile_id
    - kind computed from level rank_order comparison
    - reslot_salary_adjustment PROVISIONAL variant runs -> provisional_adjustment_cents
    - submitted_by_user_id = X-User-ID
  - from: SUBMITTED
    to: HRBP_REVIEWED
    trigger: POST /comp/mapping-decisions/{id}/hrbp-review
    actor: HRBP
    preconditions: []
    side_effects:
    - MappingDecision.version += 1
  - from: SUBMITTED
    to: RETURNED
    trigger: POST /comp/mapping-decisions/{id}/return
    actor: HRBP
    preconditions: []
    side_effects:
    - MappingDecision.version += 1
  - from: HRBP_REVIEWED
    to: COMP_TRIAGED
    trigger: POST /comp/mapping-decisions/{id}/comp-triage
    actor: CompAnalyst
    preconditions: []
    side_effects:
    - MappingDecision.version += 1
  - from: HRBP_REVIEWED
    to: RETURNED
    trigger: POST /comp/mapping-decisions/{id}/return
    actor: CompAnalyst
    preconditions: []
    side_effects:
    - MappingDecision.version += 1
  - from: RETURNED
    to: SUBMITTED
    trigger: POST /comp/mapping-decisions/{id}/resubmit
    actor: DepartmentManager
    preconditions:
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects:
    - reslot_salary_adjustment PROVISIONAL variant re-runs (bands may have moved)
  - from: COMP_TRIAGED
    to: APPROVED
    trigger: POST /comp/mapping-decisions/{id}/approve
    actor: CompManager
    preconditions:
    - Employee.status == ACTIVE
    - 'OCC: expected_employee_version == current Employee.version'
    - target band (program, to-profile family+level, employee geo) exists with status == PUBLISHED
    - 'segregation of duties: X-User-ID != submitted_by_user_id'
    - 'fiscal: positive adjustment <= Department.adjustment_pool_cents - Department.committed_pool_cents'
    side_effects:
    - 'link 1: Employee.job_profile_id = to_job_profile_id; reslot FINAL variant runs -> final_adjustment_cents; Employee.base_salary_cents updated per kind (UPSLOT/LATERAL:
      max(current, band.min); DOWNSLOT: unchanged, red_circled set if > band.max); pre_salary_cents snapshot; approved_at = logical clock; decided_by_user_id = X-User-ID;
      Employee.version += 1'
    - 'link 2 (caused by link 1''s salary mutation): Department.committed_pool_cents += final_adjustment_cents when positive; Department.projected_payroll_cents recomputed'
    - 'link 3 (caused by link 2''s payroll recompute): CompProgram.total_payroll_projection_cents recomputed'
  - from: COMP_TRIAGED
    to: REJECTED
    trigger: POST /comp/mapping-decisions/{id}/reject
    actor: CompManager
    preconditions: []
    side_effects:
    - decided_by_user_id = X-User-ID
  - from: DRAFT
    to: WITHDRAWN
    trigger: POST /comp/mapping-decisions/{id}/withdraw
    actor: DepartmentManager
    preconditions:
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects: []
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: POST /comp/mapping-decisions/{id}/withdraw
    actor: DepartmentManager
    preconditions:
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects: []
  - from: RETURNED
    to: WITHDRAWN
    trigger: POST /comp/mapping-decisions/{id}/withdraw
    actor: DepartmentManager
    preconditions:
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects: []
  - from: APPROVED
    to: REVERSED
    trigger: POST /comp/mapping-decisions/{id}/reverse
    actor: CompManager
    preconditions:
    - logical clock <= approved_at + 30 days
    - CompProgram.status IN {MAPPING_OPEN, PUBLISHED}
    side_effects:
    - 'compensation: Employee.base_salary_cents = pre_salary_cents; Employee.job_profile_id = from_job_profile_id; Employee.version += 1'
    - Department.committed_pool_cents -= final_adjustment_cents when positive; Department.projected_payroll_cents recomputed
    - 'CompProgram.total_payroll_projection_cents recomputed (conserved invariant: approve+reverse leaves payroll projection and committed pool unchanged)'
- entity: ExceptionRequest
  initial_state: SUBMITTED
  terminal_states:
  - DENIED
  - RESCINDED
  transitions:
  - from: SUBMITTED
    to: HRBP_PASSED
    trigger: POST /comp/exception-requests/{id}/hrbp-pass
    actor: HRBP
    preconditions: []
    side_effects:
    - ExceptionRequest.version += 1
  - from: HRBP_PASSED
    to: FINANCE_REVIEW
    trigger: 'POST /comp/exception-requests/{id}/comp-pass (branch: type == ABOVE_MAX_HIRE)'
    actor: CompManager
    preconditions:
    - 'segregation of duties: X-User-ID != created_by_user_id'
    side_effects:
    - comp_gate_by_user_id = X-User-ID
    - ExceptionRequest.version += 1
    note: 'branching fork: ABOVE_MAX_HIRE routes to FINANCE_REVIEW; all other types route straight to APPROVED with salary application'
  - from: HRBP_PASSED
    to: APPROVED
    trigger: 'POST /comp/exception-requests/{id}/comp-pass (branch: type != ABOVE_MAX_HIRE)'
    actor: CompManager
    preconditions:
    - 'segregation of duties: X-User-ID != created_by_user_id'
    - requested_salary_cents <= exception_cap_evaluation cap
    - 'fiscal: max(0, requested_salary_cents - Employee.base_salary_cents) <= Department.adjustment_pool_cents - Department.committed_pool_cents'
    side_effects:
    - comp_gate_by_user_id = X-User-ID
    - 'application: pre_exception_salary_cents snapshot; Employee.base_salary_cents = requested_salary_cents; applied_delta_cents computed; Department.committed_pool_cents
      += max(0, applied_delta_cents); payroll rollups recomputed; applied_at = logical clock'
  - from: FINANCE_REVIEW
    to: APPROVED
    trigger: POST /comp/exception-requests/{id}/finance-pass
    actor: FinancePartner
    preconditions:
    - requested_salary_cents <= exception_cap_evaluation cap
    - 'fiscal: max(0, requested_salary_cents - Employee.base_salary_cents) <= Department.adjustment_pool_cents - Department.committed_pool_cents'
    side_effects:
    - same application side effects as the comp-pass APPROVED branch
  - from: SUBMITTED
    to: DENIED
    trigger: POST /comp/exception-requests/{id}/deny
    actor: HRBP
    preconditions: []
    side_effects: []
  - from: HRBP_PASSED
    to: DENIED
    trigger: POST /comp/exception-requests/{id}/deny
    actor: CompManager
    preconditions: []
    side_effects: []
  - from: FINANCE_REVIEW
    to: DENIED
    trigger: POST /comp/exception-requests/{id}/deny
    actor: FinancePartner
    preconditions: []
    side_effects: []
  - from: SUBMITTED
    to: RETURNED
    trigger: POST /comp/exception-requests/{id}/return
    actor: HRBP
    preconditions: []
    side_effects: []
  - from: HRBP_PASSED
    to: RETURNED
    trigger: POST /comp/exception-requests/{id}/return
    actor: CompManager
    preconditions: []
    side_effects: []
  - from: RETURNED
    to: SUBMITTED
    trigger: POST /comp/exception-requests/{id}/resubmit
    actor: DepartmentManager
    preconditions:
    - 'ownership: Employee.department_id == X-User-ID'
    side_effects:
    - gate history cleared; original created_at retained for rolling-window cap
  - from: APPROVED
    to: RESCINDED
    trigger: POST /comp/exception-requests/{id}/rescind
    actor: CompManager
    preconditions:
    - logical clock <= applied_at + 30 days
    side_effects:
    - 'compensation: Employee.base_salary_cents = pre_exception_salary_cents; Department.committed_pool_cents -= max(0, applied_delta_cents); payroll rollups recomputed'
    - 'conserved invariant: approve+rescind leaves Department.committed_pool_cents and Employee.base_salary_cents unchanged'
- entity: RefreshCycle
  initial_state: SCHEDULED
  terminal_states:
  - APPLIED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IMPACT_COMPUTED
    trigger: POST /comp/refresh-cycles/{id}/compute-impact
    actor: CompAnalyst
    preconditions: []
    side_effects:
    - refresh_budget_impact_rollup runs; budget_impact_cents and affected_employee_count set
    - RefreshCycle.version += 1
  - from: IMPACT_COMPUTED
    to: APPROVED
    trigger: POST /comp/refresh-cycles/{id}/approve
    actor: FinancePartner
    preconditions:
    - budget_impact_cents <= CompProgram.refresh_budget_cents (integer cents, <= passes on equality)
    side_effects:
    - RefreshCycle.version += 1
  - from: APPROVED
    to: APPLIED
    trigger: POST /comp/refresh-cycles/{id}/apply
    actor: CompManager
    preconditions:
    - logical clock current date >= effective_date
    - 'OCC: expected_comp_program_version == current CompProgram.version'
    side_effects:
    - 'link 1: every PUBLISHED PayBand of the program is re-priced OFFICIAL as of effective_date; old band -> SUPERSEDED with superseded_by_band_id set; replacement
      band created directly in PUBLISHED status'
    - 'link 2 (caused by link 1''s band publication): every ACTIVE employee''s compa_ratio_and_range_position recomputed against replacement band; bring-to-minimum
      salary raises applied per rollup ordering; salaries above new max frozen with red_circled = true; each mutated Employee.version += 1'
    - 'link 3 (caused by link 2''s range_position mutation): every employee landing ABOVE_MAX gets an auto-created ExceptionRequest (type ABOVE_MAX_HIRE, requested_salary_cents
      = current salary, created_by_user_id = ''system'', status SUBMITTED)'
    - CompProgram.refresh_budget_spent_cents += budget_impact_cents; applied_at = logical clock; RefreshCycle.version += 1
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /comp/refresh-cycles/{id}/cancel
    actor: CompManager
    preconditions: []
    side_effects: []
  - from: IMPACT_COMPUTED
    to: CANCELLED
    trigger: POST /comp/refresh-cycles/{id}/cancel
    actor: CompManager
    preconditions: []
    side_effects: []
- entity: Employee
  initial_state: ACTIVE
  terminal_states:
  - TERMINATED
  transitions:
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /comp/employees/{id}/terminate
    actor: HRBP
    preconditions:
    - no in-flight MappingDecision (status IN {DRAFT, SUBMITTED, HRBP_REVIEWED, COMP_TRIAGED, RETURNED}) for this employee
    side_effects:
    - Department.projected_payroll_cents recomputed excluding this employee
    - CompProgram.total_payroll_projection_cents recomputed
    - Employee.version += 1
concurrency_rules:
- rule_id: band-price-stale-band
  parent_entity: PayBand
  write_endpoint: POST /comp/pay-bands/{id}/price
  occ_field: expected_pay_band_version
  description: 'Pricing a PayBand whose version has advanced since the client last

    observed it is rejected. The client priced against market/composite

    inputs read at an older version; because a prior accepted price call

    already advanced the band version, the stale write is refused.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: mapping-approve-stale-employee
  parent_entity: Employee
  write_endpoint: POST /comp/mapping-decisions/{id}/approve
  occ_field: expected_employee_version
  description: 'Approving a MappingDecision against an Employee whose version has

    advanced since the client last observed it is rejected, because the

    decision''s provisional estimate and pool check were derived from a

    stale salary/profile view of the employee.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: refresh-apply-stale-program
  parent_entity: CompProgram
  write_endpoint: POST /comp/refresh-cycles/{id}/apply
  occ_field: expected_comp_program_version
  description: 'Applying a RefreshCycle against a CompProgram whose version has

    advanced since the impact was computed is rejected, because band or

    budget mutations under the newer program version invalidate the

    approved impact rollup.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: employee-patch-stale-employee
  parent_entity: Employee
  write_endpoint: PATCH /comp/employees/{id}
  occ_field: expected_employee_version
  description: 'Administratively patching an Employee whose version has advanced

    since the client last observed it is rejected, preventing a data fix

    from silently overwriting a mapping or exception side effect.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: geo_effective_ratio
  trigger: on GeoZone creation (and read)
  algorithm: constraint_propagation
  formula: "effective_ratio(zone):\n  if zone.parent_zone_id is null: return round6(zone.differential_ratio)\n  else: return round6(effective_ratio(parent(zone))\
    \ * zone.differential_ratio)\nEvaluation order is strictly root -> leaf: each step's product is rounded\nto 6 decimal places (round_half_up) BEFORE the next multiplication.\n\
    The parent chain must be acyclic; a cycle is rejected at create time\nwith ERR_GEO_CYCLE.\n"
  input_set: GeoZone row and its transitive parent chain
  constants:
    RATIO_DECIMALS: 6
  precision: 6 decimal places, round_half_up at every chain step
- name: market_cut_aging
  trigger: invoked per candidate cut inside market_composite_pricing (OFFICIAL variant only)
  algorithm: chronological
  formula: 'months_aged = whole calendar months between cut.effective_date and the

    pricing date (program.pricing_as_of_date for manual pricing; the

    RefreshCycle.effective_date for refresh pricing), floor — a partial

    month never counts.

    aged_p50 = round_half_up(cut.p50_cents * (1 + ESCALATION_RATE * months_aged / 12))

    aged_p50 is an integer number of cents.

    '
  input_set: single MarketCut row
  constants:
    ESCALATION_RATE: 0.03
  precision: integer cents, round_half_up
- name: market_composite_pricing
  trigger: POST /comp/pay-bands/{id}/price; also per-band inside RefreshCycle apply
  algorithm: weighted_scoring
  formula: "Candidate set (OFFICIAL): MarketCut rows where\n  cut.job_profile.job_family_id == band.job_family_id\n  AND cut.job_profile.job_level_id == band.job_level_id\n\
    \  AND cut.job_profile.status == APPROVED\n  AND cut.geo_zone_id == band.geo_zone_id\n  AND cut.excluded_from_composite == false\n  AND cut.market_survey.status\
    \ == ACCEPTED\ncomposite_cents = round_half_up( SUM(aged_p50 * sample_size) / SUM(sample_size) )\nEmpty candidate set -> ERR_NO_MARKET_DATA.\n"
  input_set: MarketCut rows joined to JobProfile and MarketSurvey, filtered as above
  constants:
    ESCALATION_RATE: 0.03
  precision: integer cents, round_half_up
  variants:
  - name: PROVISIONAL
    when: price call with pricing_variant=PROVISIONAL (allowed only while band is DRAFT or PRICED)
    difference: 'candidate set admits surveys in {SUBMITTED, ACCEPTED}; no aging is applied; composite is the UNWEIGHTED mean of raw p50_cents: round_half_up(SUM(p50_cents)/COUNT(cuts))'
  - name: OFFICIAL
    when: price call with pricing_variant=OFFICIAL; mandatory before band approval
    difference: ACCEPTED surveys only, sample-size weighted, aged per market_cut_aging
- name: band_midpoint_construction
  trigger: immediately after market_composite_pricing inside price
  algorithm: tiered_pricing
  formula: 'step1: pct_value   = round_half_up(market_composite_cents * PERCENTILE_FACTOR[band.target_percentile])

    step2: geo_value   = round_half_up(pct_value * band.geo_ratio_snapshot)

    step3: midpoint    = round_half_up(geo_value * band.policy_adjustment_factor)

    Rounding is applied after EVERY step (integer cents, round_half_up);

    skipping intermediate rounding produces a different midpoint and is

    non-conformant.

    '
  input_set: the band being priced
  constants:
    PERCENTILE_FACTOR:
      P50: 1.0
      P62_5: 1.06
      P75: 1.12
  precision: integer cents, round_half_up per step
- name: band_min_max_construction
  trigger: immediately after band_midpoint_construction inside price
  algorithm: aggregation
  formula: 'min_cents = round_half_up(midpoint_cents * (1 - spread_pct / 2))

    max_cents = round_half_up(midpoint_cents * (1 + spread_pct / 2))

    Invariant: max_cents >= min_cents always holds (spread_pct >= 0).

    '
  input_set: the band being priced
  constants: {}
  precision: integer cents, round_half_up
- name: band_overlap_percentage
  trigger: POST /comp/pay-bands/{id}/approve; GET /comp/pay-bands/{id}/overlap-report
  algorithm: aggregation
  formula: 'Let A = the adjacent-lower band: same comp_program_id, job_family_id,

    geo_zone_id; job_level.rank_order the greatest rank strictly below the

    candidate band''s level rank; status IN {COMP_APPROVED, PUBLISHED};

    tie-break (multiple bands qualify after supersession windows): latest

    created_at. If none exists, both checks are vacuously satisfied and the

    report returns nulls.

    raw = MIN(A.max_cents, B.max_cents) - MAX(A.min_cents, B.min_cents)

    overlap_pct = round4( MAX(0, raw) / (A.max_cents - A.min_cents) )

    Clamp: negative raw (gap between bands) yields 0.0000, never negative.

    Guard: if A.max_cents == A.min_cents the ratio is defined as 0.0000.

    APPROVAL CHECK compares the UNROUNDED ratio <= policy max_overlap_pct

    (or DEFAULT_MAX_OVERLAP_PCT when no ProgressionPolicy row exists).

    '
  input_set: candidate band B and its adjacent-lower band A
  constants:
    DEFAULT_MAX_OVERLAP_PCT: 0.3
  precision: stored value 4 decimal places round_half_up; approval check on unrounded ratio
- name: midpoint_progression_percentage
  trigger: POST /comp/pay-bands/{id}/approve; GET /comp/pay-bands/{id}/overlap-report
  algorithm: threshold
  formula: 'progression_pct = round4( (B.midpoint_cents - A.midpoint_cents) / A.midpoint_cents )

    with A selected exactly as in band_overlap_percentage.

    APPROVAL CHECK compares the UNROUNDED ratio >= policy

    min_midpoint_progression_pct (or DEFAULT_MIN_PROGRESSION_PCT).

    Boundary: an unrounded ratio of exactly the policy minimum PASSES (>=).

    '
  input_set: candidate band B and its adjacent-lower band A
  constants:
    DEFAULT_MIN_PROGRESSION_PCT: 0.1
  precision: stored value 4 decimal places round_half_up; approval check on unrounded ratio
- name: compa_ratio_and_range_position
  trigger: band publish; refresh apply; employee create/patch; mapping approve/reverse; exception apply/rescind
  algorithm: threshold
  formula: "Band resolution: the unique PayBand with comp_program_id == current\nprogram, job_family_id/job_level_id == employee.job_profile's\nfamily/level, geo_zone_id\
    \ == employee.geo_zone_id, status == PUBLISHED.\nIf none: compa_ratio = null, range_position = UNBANDED, red_circled unchanged.\ncompa_ratio = round4(base_salary_cents\
    \ / band.midpoint_cents)\nrange_position: base < band.min_cents -> BELOW_MIN;\n                base > band.max_cents -> ABOVE_MAX; else IN_RANGE.\nguidance_zone\
    \ (reported, not stored): compa_ratio < GUIDANCE_LOW -> BELOW_ZONE;\n                > GUIDANCE_HIGH -> ABOVE_ZONE; else IN_ZONE.\nBoundary: compa_ratio exactly\
    \ GUIDANCE_LOW or GUIDANCE_HIGH is IN_ZONE.\n"
  input_set: one Employee row and its resolved PUBLISHED band
  constants:
    GUIDANCE_LOW: 0.8
    GUIDANCE_HIGH: 1.2
  precision: 4 decimal places, round_half_up
- name: reslot_salary_adjustment
  trigger: MappingDecision submit/resubmit (PROVISIONAL); MappingDecision approve (FINAL)
  algorithm: constraint_propagation
  formula: "Band selection:\n  PROVISIONAL: the band for (current program, to-profile family+level,\n    employee.geo_zone_id) with status IN {PRICED, COMP_APPROVED,\n\
    \    PUBLISHED}; if several qualify, latest created_at; if none,\n    provisional_adjustment_cents = null.\n  FINAL: the band with status == PUBLISHED for the\
    \ same key; if none,\n    approve fails with ERR_REFERENCED_ENTITY_STATE.\nAdjustment (both variants), given band B and current salary S:\n  kind == UPSLOT or\
    \ LATERAL: new_salary = MAX(S, B.min_cents); adjustment = new_salary - S\n  kind == DOWNSLOT: new_salary = S; adjustment = 0; red_circled = (S > B.max_cents)\n\
    kind derives from rank_order: to_level.rank > from_level.rank -> UPSLOT;\n  < -> DOWNSLOT; == -> LATERAL.\n"
  input_set: MappingDecision row, its Employee, and the selected band
  constants: {}
  precision: integer cents (no rounding needed)
  variants:
  - name: PROVISIONAL
    when: submit / resubmit
    difference: uses band values as of submit time; band may be PRICED (not yet PUBLISHED); result stored in provisional_adjustment_cents
  - name: FINAL
    when: approve
    difference: re-reads the PUBLISHED band at approve time; if the band was re-priced between submit and approve, final_adjustment_cents differs from provisional_adjustment_cents
      for identical employee data
- name: exception_cap_evaluation
  trigger: ExceptionRequest create; comp-pass (non-finance branch); finance-pass
  algorithm: threshold
  formula: "Evaluation order is pinned (the request would change its own ratio):\n  step1: r_pre = round4(Employee.base_salary_cents / band.midpoint_cents)\n    \
    \     using CURRENT (pre-exception) salary\n  step2: tier multiplier m: r_pre < 1.0000 -> CAP_TIER_LOW;\n                           1.0000 <= r_pre < 1.2000 ->\
    \ CAP_TIER_MID;\n                           r_pre >= 1.2000 -> CAP_TIER_HIGH\n  step3: cap_cents = round_half_up(band.max_cents * m)\n  step4: reject ERR_EXCEPTION_CAP_EXCEEDED\
    \ iff requested_salary_cents > cap_cents\nBoundary: requested == cap_cents PASSES (strict > rejects).\n"
  input_set: ExceptionRequest row, its Employee, and the referenced PUBLISHED band
  constants:
    CAP_TIER_LOW: 1.1
    CAP_TIER_MID: 1.05
    CAP_TIER_HIGH: 1.0
  precision: cap in integer cents round_half_up; ratio at 4 decimal places round_half_up
- name: refresh_budget_impact_rollup
  trigger: POST /comp/refresh-cycles/{id}/compute-impact
  algorithm: waterfall_allocation
  formula: "step1: For every PUBLISHED band of the program, compute the replacement\n       midpoint via market_composite_pricing OFFICIAL aged to\n       effective_date,\
    \ then band_midpoint_construction /\n       band_min_max_construction with the band's existing\n       target_percentile, spread_pct, policy_adjustment_factor,\
    \ and the\n       geo zone's current effective_ratio. Bands whose OFFICIAL\n       candidate set is empty are EXCLUDED from the refresh (kept\n       PUBLISHED,\
    \ not superseded).\nstep2: Candidate employees: status == ACTIVE whose resolved PUBLISHED\n       band received a replacement in step1.\nstep3: Processing order:\
    \ hire_date ASC, tie-break created_at ASC.\nstep4: Per employee adjustment = MAX(0, new_band.min_cents -\n       base_salary_cents); 0 for red-circle (salary\
    \ > new max) cases.\nstep5: budget_impact_cents = SUM(adjustments); affected_employee_count =\n       COUNT(adjustment > 0).\nThe rollup is uncapped; the budget\
    \ gate lives in the approve transition.\n"
  input_set: all PUBLISHED bands of the program; all ACTIVE employees whose band was re-priced
  constants:
    ESCALATION_RATE: 0.03
  precision: integer cents
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and a declared role; X-User-ID header present (non-empty)
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: 'acting role is listed in the endpoint''s roles (ERR_FORBIDDEN_ROLE); ownership scope: DepartmentManager endpoints require the target employee''s department_id
    == X-User-ID (ERR_OWNERSHIP_MISMATCH)'
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all
  note: ERR_OWNERSHIP_MISMATCH shares this authorization tier and applies to POST /comp/mapping-decisions, POST /comp/mapping-decisions/{id}/submit, POST /comp/mapping-decisions/{id}/resubmit,
    POST /comp/mapping-decisions/{id}/withdraw, POST /comp/exception-requests, POST /comp/exception-requests/{id}/resubmit
- priority: 3
  category: business_constraint
  check: 'request body shape: every endpoint-required field present (ERR_INVALID_REQUEST); enum fields hold declared members (ERR_INVALID_ENUM); numeric fields in
    declared domains (sample_size >= 1, spread_pct >= 0, differential_ratio > 0, percentages >= 0, dates ISO); unknown fields are IGNORED (never an error)'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 4
  category: existence
  check: path ids and body FK references exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: state
  check: 'OCC: expected_<parent>_version equals the parent entity''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /comp/pay-bands/{id}/price; POST /comp/mapping-decisions/{id}/approve; POST /comp/refresh-cycles/{id}/apply; PATCH /comp/employees/{id}
- priority: 6
  category: state
  check: 'program posture gate: band price requires CompProgram status IN {PRICING, MAPPING_OPEN}; band publish requires PRICING or MAPPING_OPEN; mapping submit requires
    MAPPING_OPEN; exception create requires PUBLISHED; refresh create requires PUBLISHED; refresh apply requires PUBLISHED'
  error_id: ERR_PROGRAM_STATE_FORBIDS
  http_status: 409
  applies_to: POST /comp/pay-bands/{id}/price; POST /comp/pay-bands/{id}/publish; POST /comp/mapping-decisions/{id}/submit; POST /comp/exception-requests; POST /comp/refresh-cycles;
    POST /comp/refresh-cycles/{id}/apply
- priority: 7
  category: state
  check: 'entity transition legality: trigger not declared for the entity''s current state; ERR_ALREADY_TERMINAL when the entity sits in a terminal state'
  error_id: ERR_INVALID_STATE_TRANSITION
  http_status: 409
  applies_to: all action endpoints
- priority: 8
  category: business_safety
  check: 'FLSA salary basis: band approve fails when any APPROVED JobProfile in the band''s family+level is EXEMPT and band min_cents < FLSA_ANNUAL_MINIMUM_CENTS;
    determine-flsa requires salary_basis_weekly_cents >= FLSA_WEEKLY_MINIMUM_CENTS and duties_test_passed == true to classify EXEMPT; profile submit/approve while
    flsa_classification == PENDING fails with ERR_FLSA_TESTS_INCOMPLETE'
  error_id: ERR_FLSA_SALARY_BASIS_VIOLATION
  http_status: 422
  applies_to: POST /comp/pay-bands/{id}/approve; POST /comp/job-profiles/{id}/determine-flsa; POST /comp/job-profiles/{id}/submit; POST /comp/job-profiles/{id}/approve
  note: ERR_FLSA_TESTS_INCOMPLETE (http 409) shares this safety tier
- priority: 9
  category: business_safety
  check: 'segregation of duties: ExceptionRequest comp-pass rejects X-User-ID == created_by_user_id; MappingDecision approve rejects X-User-ID == submitted_by_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /comp/exception-requests/{id}/comp-pass; POST /comp/mapping-decisions/{id}/approve
- priority: 10
  category: business_referential
  check: 'referenced-entity states: employee create requires APPROVED profile; mapping submit requires APPROVED to-profile and ACTIVE employee; mapping approve requires
    PUBLISHED target band; employee terminate requires no in-flight MappingDecision; profile retire requires no ACTIVE employees'
  error_id: ERR_REFERENCED_ENTITY_STATE
  http_status: 422
  applies_to: POST /comp/employees; POST /comp/mapping-decisions/{id}/submit; POST /comp/mapping-decisions/{id}/approve; POST /comp/employees/{id}/terminate; POST
    /comp/job-profiles/{id}/retire
  note: ERR_PROFILE_IN_USE (http 409) shares this referential tier for the profile-retire-in-use check; ERR_EMPLOYEE_NOT_ACTIVE semantics fold into ERR_REFERENCED_ENTITY_STATE
- priority: 11
  category: business_temporal
  check: 'temporal rules: refresh planned windows are half-open [start, end) per program and must not overlap non-terminal cycles (adjacency allowed); refresh apply
    requires logical clock >= effective_date; mapping reverse and exception rescind require clock <= anchor + 30 days; cuts for the same (profile, geo) >= 30 days
    apart; exception rolling cap: < 2 in-flight-or-approved requests per employee in trailing 365 days'
  error_id: ERR_REFRESH_WINDOW_CONFLICT
  http_status: 409
  applies_to: POST /comp/refresh-cycles; POST /comp/refresh-cycles/{id}/apply; POST /comp/mapping-decisions/{id}/reverse; POST /comp/exception-requests/{id}/rescind;
    POST /comp/market-cuts; POST /comp/exception-requests
  note: each temporal sub-rule maps to its own error_id in §1.6 (ERR_REFRESH_WINDOW_CONFLICT, ERR_REFRESH_NOT_DUE, ERR_REVERSE_WINDOW_EXPIRED, ERR_CUT_TOO_CLOSE,
    ERR_EXCEPTION_ROLLING_CAP); they share one priority tier
- priority: 12
  category: business_constraint
  check: 'structural constraints: band uniqueness per (comp_program_id, job_family_id, job_level_id, geo_zone_id) among status != SUPERSEDED; progression-policy uniqueness
    per (job_family_id, from_level_id, to_level_id); geo parent chain acyclic; overlap and progression policy checks at band approve; exception salary cap'
  error_id: ERR_DUPLICATE_BAND
  http_status: 409
  applies_to: POST /comp/pay-bands; POST /comp/progression-policies; POST /comp/geo-zones; PATCH /comp/geo-zones/{id}; POST /comp/pay-bands/{id}/approve; POST /comp/exception-requests;
    POST /comp/exception-requests/{id}/comp-pass; POST /comp/exception-requests/{id}/finance-pass
  note: 'sub-rules map to ERR_DUPLICATE_BAND / ERR_DUPLICATE_POLICY / ERR_GEO_CYCLE / ERR_BAND_OVERLAP_EXCEEDS_POLICY / ERR_PROGRESSION_BELOW_POLICY / ERR_EXCEPTION_CAP_EXCEEDED
    / ERR_NO_MARKET_DATA (empty candidate set at price); they share one priority tier; internal tie-break order inside this tier: (1) duplicate-uniqueness, (2) geo
    cycle, (3) no-market-data, (4) overlap, (5) progression, (6) exception cap'
- priority: 13
  category: business_fiscal
  check: 'fiscal capacity: mapping approve requires positive adjustment <= department pool headroom; exception approval (comp-pass non-finance branch or finance-pass)
    requires max(0, delta) <= department pool headroom; refresh approve requires budget_impact_cents <= refresh_budget_cents'
  error_id: ERR_DEPARTMENT_POOL_EXHAUSTED
  http_status: 422
  applies_to: POST /comp/mapping-decisions/{id}/approve; POST /comp/exception-requests/{id}/comp-pass; POST /comp/exception-requests/{id}/finance-pass; POST /comp/refresh-cycles/{id}/approve
  note: ERR_BUDGET_IMPACT_EXCEEDS is the refresh-side error in the same fiscal tier
