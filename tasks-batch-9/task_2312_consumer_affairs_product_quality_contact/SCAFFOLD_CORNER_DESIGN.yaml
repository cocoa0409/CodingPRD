      - name: corner_pagination_bounds_are_enforced_at_both_ends
        claim_type: violation_to_error
        grounds: ["validations[priority 9]", response_envelope.pagination_defaults, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "The declared 1..100 limit range and the offset floor are probed just outside and exactly at each bound on the same list endpoint."
        test_recipe:
          setup: ["One consumer so the list is non-empty."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 0 }, captures: { e1: "$.data.error_id" } }
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 101 }, captures: { e2: "$.data.error_id" } }
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { offset: -1 }, captures: { e3: "$.data.error_id" } }
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 1, offset: 0 }, captures: { l1: "$.limit", t1: "$.total_count" } }
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 100 }, captures: { l2: "$.limit", h2: "$.has_more" } }
            - { call: "GET /consumers", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { l3: "$.limit", o3: "$.offset" } }
          assert:
            - "limit 0: HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "limit 101: HTTP 400 \"ERR_VALIDATION\""
            - "offset -1: HTTP 400 \"ERR_VALIDATION\""
            - "limit 1 and limit 100 are both accepted with HTTP 200 and echo back the requested limit — the range is inclusive at both ends"
            - "omitting both applies the declared defaults: limit == 10 and offset == 0"

      - name: corner_postal_code_is_required_before_a_kit_ships
