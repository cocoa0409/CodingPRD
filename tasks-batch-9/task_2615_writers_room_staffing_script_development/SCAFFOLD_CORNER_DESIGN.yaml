              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "EXEC_STORY_EDITOR", offered_weekly_compensation_cents: 700000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "EXEC_STORY_EDITOR", offered_weekly_compensation_cents: 700000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_program_funded: true, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w8}", level_at_hire: "CO_PRODUCER", offered_weekly_compensation_cents: 850000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_program_funded: true, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w8}", level_at_hire: "EXEC_STORY_EDITOR", offered_weekly_compensation_cents: 700000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_program_funded: true, expected_room_version: "${rv1}" }
              as: Showrunner
