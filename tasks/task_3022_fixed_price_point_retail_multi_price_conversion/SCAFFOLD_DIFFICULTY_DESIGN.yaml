            - call: "POST /merchandise/conversion-projects/${conv_empty_id}/start"
              payload: {}
              as: StoreOperationsManager
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { store_v1: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp125_id}", expected_store_version: "${store_v1}" }
              as: StoreOperationsManager
              captures: { err_same_id: $.data.error_id }
          trigger:
