        distinguishing_aspect: |
          The conserved quantity is the BudgetPlan media-commitment identity
          committed_total_cents + top_up_total_cents == available_cents + reserved_cents + consumed_cents:
          the forward action Campaign PENDING_REVIEW -> SCHEDULED moves 2000000 from available_cents into
