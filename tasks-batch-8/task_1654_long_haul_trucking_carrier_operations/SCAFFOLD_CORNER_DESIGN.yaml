        distinguishing_aspect: "Every success response wraps data with meta.api_request_id + api_request_timestamp and response_type 'object' for single-resource writes."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cid: $.data.id } }
          assert:
            - "201; meta.api_request_id present and non-empty; meta.api_request_timestamp present; response_type == object; data.id == ${cid}"

      - name: error_envelope_shape
        claim_type: retrieval
        grounds: ["response_envelope", "errors[ERR_DRIVER_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error' and data.{error_id, message}."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /drivers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dispatcher, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "404; response_type == error; ${err} == ERR_DRIVER_NOT_FOUND; ${msg} non-empty"

      - name: loads_filtered_by_status
        claim_type: standard_crud
        grounds: ["endpoints[GET /loads]"]
        distinguishing_aspect: "Filter + list interaction: ?status=ACCEPTED returns only the accepted load (the TENDERED one excluded)."
        test_recipe:
          setup: ["two loads; load1 SCREENED+ACCEPTED; load2 TENDERED"]
