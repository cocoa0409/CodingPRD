            - { call: "POST /taxpayers", payload: { full_name: "Tp C", ssn_token: "SSN-303", phone: "555-1303" }, as: Screener, as_user_id: "${scr_id}", captures: { tp3: $.data.id } }
          trigger:
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp1}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt1: $.data.id } }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp2}", volunteer_id: "${coord_id}", purpose: PREPARATION, start_at: "2026-08-03T10:30:00Z", end_at: "2026-08-03T11:30:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp3}", volunteer_id: "${coord_id}", purpose: FOLLOW_UP, start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt3: $.data.id } }
          assert:
            - "First appointment created (201)"
            - "Overlapping appointment rejected with ERR_SITE_CAPACITY_FULL (409) — overlap count 1 >= station_capacity 1, even though a different volunteer would staff it"
            - "Adjacent appointment 11:00-12:00 created (201) — overlap set is empty (0 < 1)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: refund_allocation_conservation
        grounds:
          - validations[priority=10]
          - errors[ERR_ALLOCATION_SUM_MISMATCH]
          - entities.TaxReturn.fields.final_refund_cents
          - entities.RefundAllocation.fields.amount_cents
        distinguishing_aspect: |
