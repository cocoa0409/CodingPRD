      - name: reviewer_conflict_of_interest_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3.25]", "errors[ERR_REVIEWER_CONFLICT_OF_INTEREST]"]
        distinguishing_aspect: "Segregation of duties: the case's receiving physician may not begin the quality review of their own case — ERR_REVIEWER_CONFLICT_OF_INTEREST (403); an independent physician begins it successfully."
