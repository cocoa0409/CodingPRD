            - call: "GET /sponsorship-deals/${deal_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /deliverable-assignments/${d1_id}"
              as: GeneralManager
              as_user_id: "${org_id}"
          assert:
            - "The acceptance response (201) already carries contract_status ACTIVE, obligation_status COMPLIANT and provisional_cap_charge_cents == 12328767 — no second read is needed to see the computed values"
