scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # Two calculations whose two valid approaches produce different results,
  # operating on different entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overdue_fee_live_vs_settled_on_rental
        grounds:
          - calculations.overdue_fee_accrual
          - state_machines.Rental.OVERDUE_to_RETURNED
          - state_machines.Rental.OVERDUE_to_FORCE_CLEARED
          - endpoints.GET_/rentals/{rental_id}
        distinguishing_aspect: |
          Same OVERDUE rental data produces two different overdue_fee_cents
          values: a GET /rentals/{rental_id} read at T=grace_end+1h30m returns
          the live_estimate variant (forward-looking, ceil to 2 started hours
          → 400 cents), while a RETURN executed at T=grace_end+1h30m persists
          the final_settled variant computed at ended_at=that exact moment
          (also 400 cents). However, if the renter does NOT return and the
          live read is taken at T=grace_end+1h00m00s exactly (1 started hour
          → 200 cents) but then returns at T=grace_end+1h00m01s (now 2 started
          hours due to ceil → 400 cents), the live read at one moment and the
          settled value at a fractionally-later moment disagree.
        test_recipe:
          setup:
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:HOURLY, unit_price_cents:500, deposit_cents:2000, grace_minutes:15, overdue_rate_cents_per_hour:200, forced_clearance_hours:48}"
            - "POST /cabinets, then POST /cabinets/{cid}/compartments {slot_number:1, size_class:SMALL}"
            - "POST /cabinets/{cid}/compartments/{compid}/rentals {rental_mode:HOURLY, billing_units:1, insurance_tier:NONE, declared_value_cents:0, unlock_channel:QR}"
            - "POST /_clock/advance to started_at + 1h15m1s (so grace_end + 1s)"
            - "POST /_sweep/run (transitions rental to OVERDUE)"
          trigger:
            - "POST /_clock/advance to started_at + 1h15m + 1h00m00s (i.e., grace_end + 3600s)"
            - "GET /rentals/{rental_id} (live_estimate read)"
            - "POST /_clock/advance by +1s (now grace_end + 3601s)"
            - "POST /rentals/{rental_id}/return (final_settled)"
          assert:
            - "live_estimate read returns Rental.overdue_fee_cents == 200 (1 started hour * 200)"
            - "final_settled value persisted on RETURN equals 400 (2 started hours * 200 due to ceil)"
            - "Rental.status after RETURN == 'RETURNED'"

      - name: revenue_share_per_row_vs_per_period_on_revenuerecord
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueRecord.fields.partner_share_cents
          - entities.RevenueRecord.fields.platform_share_cents
          - entities.Cabinet.fields.partner_share_pct
          - endpoints.GET_/revenue-records
          - endpoints.GET_/cabinets/{cabinet_id}/revenue-summary
        distinguishing_aspect: |
          DIFFERENT entity domain from the overdue_fee instance above — this
          one operates on RevenueRecord (and the Cabinet revenue-summary
          aggregate), not Rental. Same source data (three gross_cents=15 rows
          on a cabinet with partner_share_pct=30) produces two different
          partner totals: the per_row variant rounds within each row
          (round_half_up(4.5)=5; sum=15), while the per_period_aggregate
          variant rounds the sum (round_half_up(13.5)=14). The GET
          /revenue-records endpoint reflects the per_row variant (summed in
          the test); GET /cabinets/{cabinet_id}/revenue-summary reflects the
          per_period_aggregate variant. The two valid approaches produce a
          1-cent difference.
        test_recipe:
          setup:
            - "POST /cabinets {partner_share_pct: 30, ...}"
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:DAILY, unit_price_cents:15, deposit_cents:0, grace_minutes:15, overdue_rate_cents_per_hour:0, forced_clearance_hours:48}"
            - "Create 3 SMALL compartments + 3 rentals (DAILY, billing_units=1 each, insurance_tier=NONE, declared_value_cents=0)"
            - "Return each rental — each emits one RevenueRecord RENTAL_FEE row with gross_cents=15"
          trigger:
            - "GET /revenue-records?cabinet_id={cid}&revenue_kind=RENTAL_FEE"
            - "GET /cabinets/{cabinet_id}/revenue-summary"
          assert:
            - "Three RevenueRecord rows, each with gross_cents=15, partner_share_cents=5, platform_share_cents=10 (per_row variant; round_half_up(4.5)=5)"
            - "SUM over rows of partner_share_cents == 15"
            - "GET /revenue-summary returns total_partner_cents == 14 (per_period_aggregate: round_half_up(45*0.30)=round_half_up(13.5)=14)"
            - "GET /revenue-summary returns total_platform_cents == 31 (= 45 - 14)"
            - "GET /revenue-summary returns total_gross_cents == 45"
            - "The two variants differ by 1 cent (15 vs 14)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # Need ≥2 instances each in a different mode {(a),(b),(c)}.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: insurance_premium_three_inputs_nonlinear
        grounds:
          - calculations.insurance_premium
          - entities.Rental.fields.insurance_tier
          - entities.Rental.fields.declared_value_cents
          - entities.Rental.fields.billing_units
          - entities.Rental.fields.rental_mode
        distinguishing_aspect: |
          MODE (a) — formula with ≥3 inputs and non-linear interaction:
          insurance_premium_cents depends on (tier, rental_mode×billing_units→days,
          declared_value_cents) with branching on tier (BASIC/PREMIUM/NONE),
          ceil-then-multiply for value_loading, and a per-tier cap (min). Four
          inputs interact non-linearly: tier selects which constants apply,
          days multiplies the base, declared_value_cents drives the loading
          with ceil applied, and the cap clamps the result.
        test_recipe:
          setup:
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:DAILY, unit_price_cents:500, deposit_cents:2000, grace_minutes:15, overdue_rate_cents_per_hour:200, forced_clearance_hours:48}"
            - "POST /cabinets, POST /cabinets/{cid}/compartments {slot_number:1, size_class:SMALL}"
          trigger:
            - "POST /cabinets/{cid}/compartments/{compid}/rentals {rental_mode:DAILY, billing_units:2, insurance_tier:BASIC, declared_value_cents:500000, unlock_channel:QR}"
            - "POST /cabinets/{cid}/compartments/{compid2}/rentals {rental_mode:DAILY, billing_units:2, insurance_tier:PREMIUM, declared_value_cents:500000, unlock_channel:QR} on a sibling compartment"
          assert:
            - "Rental_BASIC.insurance_premium_cents == 1100  # 50*2 + ceil(500000*0.002) = 100+1000"
            - "Rental_PREMIUM.insurance_premium_cents == 2800  # 150*2 + ceil(500000*0.005) = 300+2500"
            - "Rental_BASIC.rental_fee_cents == 1000  # 2 * 500"
            - "Rental_BASIC.total_charged_cents == Rental_BASIC.rental_fee_cents + Rental_BASIC.insurance_premium_cents + 2000  # 1000+1100+2000=4100"

      - name: overdue_fee_round_then_multiply_order_pinned
        grounds:
          - calculations.overdue_fee_accrual
          - entities.Rental.fields.overdue_fee_cents
          - entities.Rental.fields.grace_minutes_snapshot
          - entities.Rental.fields.overdue_rate_snapshot
        distinguishing_aspect: |
          MODE (b) — nested rounding where order matters: overdue_fee_cents is
          'ceil hours, then multiply by rate' (round-then-multiply). The
          alternative 'multiply seconds-rate then round' would produce different
          cents at fractional-hour boundaries. The scaffold pins
          `overdue_hours = ceil(overdue_seconds / 3600)` followed by
          `* overdue_rate_snapshot`, so 3601 seconds at 200 cents/hour yields
          400 cents (ceil to 2 hours), NOT round(3601 * 200/3600) = 200 cents.
          This is a different mode from the insurance_premium instance, which
          falls in mode (a).
        test_recipe:
          setup:
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:HOURLY, unit_price_cents:500, deposit_cents:2000, grace_minutes:15, overdue_rate_cents_per_hour:200, forced_clearance_hours:48}"
            - "POST /cabinets, POST /cabinets/{cid}/compartments {slot_number:1, size_class:SMALL}"
            - "POST .../rentals {rental_mode:HOURLY, billing_units:1, insurance_tier:NONE, declared_value_cents:0, unlock_channel:QR} → started_at T0"
            - "POST /_clock/advance to T0 + 1h15m + 1h0m1s (1 second past 1 full hour of overdue beyond grace)"
            - "POST /_sweep/run (rental becomes OVERDUE earlier; this sweep just refreshes)"
          trigger:
            - "POST /rentals/{rental_id}/return"
          assert:
            - "Rental.overdue_fee_cents == 400  # ceil(3601/3600)*200 = 2*200, NOT 200"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ≥2 non-linear machines on different entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: insurance_claim_evidence_rejection_cycle
        grounds:
          - state_machines.InsuranceClaim.EVIDENCE_PENDING_to_UNDER_REVIEW
          - state_machines.InsuranceClaim.UNDER_REVIEW_to_EVIDENCE_REJECTED
          - state_machines.InsuranceClaim.EVIDENCE_REJECTED_to_EVIDENCE_PENDING
          - endpoints.POST_/insurance-claims/{claim_id}/reject-evidence
          - endpoints.POST_/insurance-claims/{claim_id}/request-evidence
        distinguishing_aspect: |
          The InsuranceClaim state machine contains the cycle
          EVIDENCE_PENDING → UNDER_REVIEW → EVIDENCE_REJECTED → EVIDENCE_PENDING.
          A linear pipeline would not allow re-entry into EVIDENCE_PENDING
          after a rejection. The cycle is the non-linear shape and is anchored
          on the InsuranceClaim entity.
        test_recipe:
          setup:
            - "Create rental with insurance_tier=BASIC and declared_value_cents=500000"
            - "POST /insurance-claims {rental_id, claim_type:DAMAGE, claimed_amount_cents:300000} (status REPORTED)"
            - "POST /insurance-claims/{cid}/request-evidence (EVIDENCE_PENDING)"
            - "POST /insurance-claims/{cid}/evidence {evidence_description:'photo'} (UNDER_REVIEW)"
          trigger:
            - "POST /insurance-claims/{cid}/reject-evidence {rejection_reason:'blurry'} (EVIDENCE_REJECTED)"
            - "POST /insurance-claims/{cid}/request-evidence (cycle: back to EVIDENCE_PENDING)"
            - "POST /insurance-claims/{cid}/evidence {evidence_description:'clearer photo'} (UNDER_REVIEW again)"
          assert:
            - "InsuranceClaim.status sequence == ['REPORTED','EVIDENCE_PENDING','UNDER_REVIEW','EVIDENCE_REJECTED','EVIDENCE_PENDING','UNDER_REVIEW']"
            - "InsuranceClaim.evidence_count == 2 (incremented on each submission)"

      - name: rental_branching_renewal_vs_force_clearance
        grounds:
          - state_machines.Rental.ACTIVE_to_ACTIVE
          - state_machines.Rental.EXPIRING_SOON_to_ACTIVE
          - state_machines.Rental.OVERDUE_to_FORCE_CLEARED
          - state_machines.Rental.OVERDUE_to_RETURNED
        distinguishing_aspect: |
          The Rental state machine is branching with a self-loop (ACTIVE→ACTIVE
          via renew, EXPIRING_SOON→ACTIVE via renew) AND a divergent fork at
          OVERDUE that goes to either RETURNED (renter action) or FORCE_CLEARED
          (system sweep), with mutually exclusive side-effect sets — RETURNED
          path may refund deposit (return_path variant), FORCE_CLEARED forfeits
          the deposit (force_clearance_path variant). This non-linear shape is
          on the Rental entity, distinct from the InsuranceClaim cycle above.
        test_recipe:
          setup:
            - "Standard pricing profile + cabinet + 2 compartments + 2 rentals R1, R2 (HOURLY, billing_units=1)"
            - "Both rentals at T0"
          trigger:
            - "Advance clock by 30 minutes; POST /rentals/{R1.id}/renew {renewal_billing_units:1} — branching self-loop"
            - "Advance clock to T0 + 1h15m + 48h1m; POST /_sweep/run — divergent branch (force-clearance)"
            - "Earlier branch: at T0 + 1h15m + 1h, POST /rentals/{R2.id}/return BEFORE force-clearance — divergent branch (return)"
          assert:
            - "R1 was ACTIVE → ACTIVE (self-loop). R1.renewal_count == 1 and R1.current_expires_at extended by 1h"
            - "R2.status == 'RETURNED' with deposit_refunded_cents > 0 (return branch)"
            - "After force-clearance branch (separate compartment, separate rental), that rental's status == 'FORCE_CLEARED' with deposit_forfeited_cents == deposit_cents_snapshot"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ≥2 cascades, one depth ≥3 and one depth ≥2; each link caused by previous.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: force_clearance_three_hop_cascade
        grounds:
          - state_machines.Rental.OVERDUE_to_FORCE_CLEARED
          - state_machines.Compartment.OVERDUE_to_HOLDING
          - calculations.cabinet_capacity_stats
          - calculations.cabinet_capacity_alert
          - endpoints.POST_/_sweep/run
        distinguishing_aspect: |
          Trigger: POST /_sweep/run when now() >= forced_clearance boundary.
          HOP 1: Rental.OVERDUE → FORCE_CLEARED (action on Rental).
          HOP 2: BECAUSE Rental terminated, Compartment.occupancy_status →
          HOLDING (the Compartment mutation is caused by hop 1, not the sweep
          directly). HOP 3: BECAUSE the Compartment occupancy_status changed,
          Cabinet capacity stats recompute and capacity_alert_level may
          re-tier (e.g., from CRITICAL back to WARNING when an OVERDUE slot
          becomes HOLDING and is no longer counted toward occupied).
          Depth = 3. Each link is causally chained, not fan-out.
        test_recipe:
          setup:
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:HOURLY, unit_price_cents:500, deposit_cents:2000, grace_minutes:15, overdue_rate_cents_per_hour:200, forced_clearance_hours:48}"
            - "POST /cabinets, then POST 20 compartments with size_class=SMALL"
            - "Create 19 rentals on 19 different compartments at T0 → occupancy 95% → CRITICAL"
            - "Advance to T0 + 1h15m + 48h0m1s; POST /_sweep/run so each rental OVERDUE then FORCE_CLEARED"
          trigger:
            - "(The same sweep continues the cascade through compartments and cabinet stats.)"
          assert:
            - "All 19 Rentals.status == 'FORCE_CLEARED' (hop 1)"
            - "All 19 Compartments.occupancy_status == 'HOLDING' (hop 2 caused by hop 1)"
            - "Cabinet.small_occupancy_pct == 0.0 (hop 3 — HOLDING does not count as occupied)"
            - "Cabinet.capacity_alert_level == 'NONE' (re-tiered down from CRITICAL)"

      - name: repair_acceptance_two_hop_cascade
        grounds:
          - state_machines.RepairTicket.REPAIRED_to_ACCEPTED
          - state_machines.Compartment.FAULT_to_OK
          - calculations.cabinet_capacity_stats
          - endpoints.POST_/repair-tickets/{ticket_id}/accept
        distinguishing_aspect: |
          Trigger: POST /repair-tickets/{ticket_id}/accept — a DIFFERENT
          triggering transition than the sweep-driven force-clearance cascade.
          HOP 1: RepairTicket.REPAIRED → ACCEPTED (action on RepairTicket).
          HOP 2: BECAUSE the ticket was accepted, Compartment.operational_status
          flips FAULT → OK and fault_category clears (the Compartment mutation
          is caused by hop 1, not directly by the actor). Depth = 2. Different
          trigger from the force_clearance cascade.
        test_recipe:
          setup:
            - "Create cabinet + 1 SMALL compartment"
            - "POST /repair-tickets {compartment_id, fault_category:DOOR_NOT_CLOSED} (Compartment now FAULT)"
            - "POST /repair-tickets/{tid}/dispatch {assigned_technician_id:'tech_a'}"
            - "POST /repair-tickets/{tid}/repair {repair_notes:'door re-aligned'} as tech_a"
          trigger:
            - "POST /repair-tickets/{tid}/accept as Operator"
          assert:
            - "RepairTicket.status == 'ACCEPTED' (hop 1)"
            - "Compartment.operational_status == 'OK' (hop 2 caused by hop 1)"
            - "Compartment.fault_category == null"
            - "POST a new rental on this compartment NOW succeeds (was previously blocked by ERR_COMPARTMENT_FAULT)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ≥2 dual-failure scenarios with different category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_vs_invalid_state_on_renewal
        grounds:
          - validations[priority=4]   # category: auth (ownership)
          - validations[priority=6]   # category: state
          - errors.ERR_FORBIDDEN
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/rentals/{rental_id}/renew
        distinguishing_aspect: |
          Categories `auth` (priority 4: ownership) vs `state` (priority 6).
          When a non-owner Renter calls /renew on a rental that is also already
          OVERDUE (would fail both ownership and state), the higher-priority
          ownership check fires first → ERR_FORBIDDEN, not ERR_INVALID_STATE.
          This is the auth-vs-state pair.
        test_recipe:
          setup:
            - "Renter A creates a HOURLY 1-unit rental"
            - "Advance to T0 + 1h15m + 1s; POST /_sweep/run → rental is OVERDUE"
          trigger:
            - "POST /rentals/{rental_id}/renew with X-User-Role=Renter, X-User-ID=renter_B (NON-OWNER) and renewal_billing_units=1"
          assert:
            - "Response HTTP status == 403"
            - "Response.data.error_id == 'ERR_FORBIDDEN' (NOT 'ERR_INVALID_STATE' nor 'ERR_RENEWAL_NOT_PERMITTED')"

      - name: cabinet_offline_vs_compartment_unavailable_on_rental_creation
        grounds:
          - validations[priority=8]   # category: business_safety (cabinet OFFLINE)
          - validations[priority=9]   # category: business_referential (compartment occupied)
          - errors.ERR_CABINET_OFFLINE
          - errors.ERR_COMPARTMENT_UNAVAILABLE
          - endpoints.POST_/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals
        distinguishing_aspect: |
          Categories `business_safety` (priority 8) vs `business_referential`
          (priority 9). When a cabinet is OFFLINE AND the target compartment is
          already RENTED, both checks fail; the safety check (cabinet offline +
          QR unlock_channel) fires first → ERR_CABINET_OFFLINE, not
          ERR_COMPARTMENT_UNAVAILABLE. This is the
          business_safety-vs-business_referential pair, distinct from the
          auth-vs-state pair above.
        test_recipe:
          setup:
            - "Create cabinet with a compartment. Renter R1 creates a rental on it (compartment now RENTED)"
            - "Advance clock past OFFLINE_THRESHOLD; POST /_sweep/run so Cabinet.online_status = OFFLINE"
          trigger:
            - "Renter R2 POSTs /cabinets/{cid}/compartments/{compid}/rentals with unlock_channel=QR"
          assert:
            - "Response HTTP status == 409"
            - "Response.data.error_id == 'ERR_CABINET_OFFLINE' (NOT 'ERR_COMPARTMENT_UNAVAILABLE')"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ≥2 boundaries on different metrics, each reachable via a distinct endpoint.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grace_period_boundary_inclusive_on_sweep
        grounds:
          - calculations.overdue_fee_accrual
          - state_machines.Compartment.RENTED_to_OVERDUE
          - endpoints.POST_/_sweep/run
          - entities.Rental.fields.overdue_fee_cents
        distinguishing_aspect: |
          Numeric threshold boundary on the OVERDUE accrual: at exactly
          T = current_expires_at + grace_minutes_snapshot (overdue_seconds=0),
          overdue_fee_cents = 0 AND Rental.status remains ACTIVE (or
          EXPIRING_SOON); at T = current_expires_at + grace_minutes_snapshot
          + 1 second, sweep transitions Rental.status → OVERDUE and a single
          overdue hour begins accruing (overdue_fee_cents == 200). The
          difference of one second changes both the state AND the fee. The
          boundary uses `>` (not `>=`) on overdue_seconds for "is overdue",
          and `ceil(overdue_seconds/3600)` for hours.
        test_recipe:
          setup:
            - "Standard pricing profile (grace_minutes:15, overdue_rate:200); HOURLY 1-unit rental started at T0"
          trigger:
            - "Run 1: POST /_clock/advance to T0 + 1h15m0s (exactly grace_end); POST /_sweep/run; GET /rentals/{rental_id}"
            - "Run 2 (separate rental on a sibling compartment): POST /_clock/advance to T0 + 1h15m1s; POST /_sweep/run; GET /rentals/{rental_id}"
          assert:
            - "Run 1: Rental.status in ['ACTIVE','EXPIRING_SOON'] AND Rental.overdue_fee_cents == 0"
            - "Run 2: Rental.status == 'OVERDUE' AND Rental.overdue_fee_cents == 200"

      - name: capacity_alert_threshold_exactly_80_pct
        grounds:
          - calculations.cabinet_capacity_alert
          - entities.Cabinet.fields.capacity_alert_level
          - entities.Cabinet.fields.small_occupancy_pct
          - endpoints.GET_/cabinets/{cabinet_id}
          - endpoints.POST_/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals
        distinguishing_aspect: |
          Different metric (occupancy percentage, a fraction-derived number) and
          different endpoint (GET /cabinets/{id}, reached via the rental-create
          endpoint as a side effect). With 5 SMALL compartments, 4 rented yields
          small_occupancy_pct == 80.00 and capacity_alert_level == 'WARNING'
          (>= 80.0 boundary is inclusive). 3 rented yields 60.00 and 'NONE'.
          19 of 20 rented yields 95.00 and 'CRITICAL'. The boundary uses `>=`,
          NOT `>`. This is a different metric and a different endpoint than
          the grace-period boundary above.
        test_recipe:
          setup:
            - "POST /pricing-profiles {size_class:SMALL, rental_mode:DAILY, unit_price_cents:500, deposit_cents:2000, grace_minutes:15, overdue_rate_cents_per_hour:200, forced_clearance_hours:48}"
            - "POST /cabinets; POST 5 compartments under it (slots 1..5, size_class=SMALL)"
            - "Create 3 rentals on compartments 1, 2, 3"
          trigger:
            - "GET /cabinets/{cabinet_id} (occupancy 3/5)"
            - "Create 1 more rental on compartment 4 (now 4/5)"
            - "GET /cabinets/{cabinet_id} (occupancy 4/5)"
          assert:
            - "At 3/5: small_occupancy_pct == 60.00 AND capacity_alert_level == 'NONE'"
            - "At 4/5: small_occupancy_pct == 80.00 AND capacity_alert_level == 'WARNING'  # >= 80.0 inclusive"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ≥2 dependencies; different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_creation_requires_compartment_ok_and_idle
        grounds:
          - validations[priority=7]   # ERR_COMPARTMENT_FAULT
          - validations[priority=9]   # ERR_COMPARTMENT_UNAVAILABLE
          - state_machines.Compartment.OK_to_FAULT
          - state_machines.Compartment.IDLE_to_RENTED
          - endpoints.POST_/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals
        distinguishing_aspect: |
          Rental's IDLE-state creation transition depends on the Compartment's
          state: operational_status MUST be OK (else ERR_COMPARTMENT_FAULT) and
          occupancy_status MUST be IDLE (else ERR_COMPARTMENT_UNAVAILABLE).
          Pair: Rental ← Compartment.
        test_recipe:
          setup:
            - "Create cabinet + compartment C1"
            - "POST /repair-tickets {compartment_id:C1, fault_category:DOOR_NOT_CLOSED}  → C1 operational_status=FAULT"
          trigger:
            - "POST /cabinets/{cid}/compartments/C1/rentals {rental_mode:DAILY, billing_units:1, insurance_tier:NONE, declared_value_cents:0, unlock_channel:QR}"
          assert:
            - "Response HTTP status == 409"
            - "Response.data.error_id == 'ERR_COMPARTMENT_FAULT'"
            - "After dispatch+repair+accept on C1, the same POST /rentals succeeds with HTTP 201"

      - name: rental_refund_blocked_by_open_insurance_claim
        grounds:
          - validations[priority=16]   # ERR_REFUND_BLOCKED_BY_CLAIM
          - state_machines.Rental.RETURNED_to_REFUNDED
          - state_machines.InsuranceClaim.REPORTED_to_EVIDENCE_PENDING
          - endpoints.POST_/rentals/{rental_id}/refund
        distinguishing_aspect: |
          Rental's RETURNED → REFUNDED transition depends on an entity-pair
          relationship to InsuranceClaim: the transition is permitted only
          when there is NO InsuranceClaim on this rental in status REPORTED,
          EVIDENCE_PENDING, UNDER_REVIEW, EVIDENCE_REJECTED, APPROVED, or PAID
          (a claim in DENIED or no claim at all is acceptable). Pair: Rental
          ← InsuranceClaim — DIFFERENT pair from Rental ← Compartment above.
        test_recipe:
          setup:
            - "Create rental with insurance_tier=BASIC; return it normally (RETURNED)"
            - "POST /insurance-claims {rental_id, claim_type:DAMAGE, claimed_amount_cents:300000} (REPORTED)"
          trigger:
            - "POST /rentals/{rental_id}/refund {version}"
          assert:
            - "Response HTTP status == 409"
            - "Response.data.error_id == 'ERR_REFUND_BLOCKED_BY_CLAIM'"
            - "After POST /insurance-claims/{cid}/request-evidence + reject-evidence + ... + deny (claim → DENIED), the same /refund call now succeeds with HTTP 200"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ≥2 overlap rules on different resources, with different interval semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: compartment_active_rental_uniqueness_open_interval
        grounds:
          - validations[priority=9]   # ERR_COMPARTMENT_UNAVAILABLE
          - state_machines.Compartment.IDLE_to_RENTED
          - state_machines.Compartment.RENTED_to_IDLE
          - concurrency_rules[compartment_unavailable]
          - endpoints.POST_/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals
        distinguishing_aspect: |
          Compartment is occupied by a Rental over a half-open time interval
          [started_at, ended_at). A second rental whose started_at falls
          inside another rental's [started_at, ended_at) on the same
          compartment is rejected with ERR_COMPARTMENT_UNAVAILABLE. Adjacency
          (one ends exactly when the next starts) is allowed: at
          T = R1.ended_at, R1 is no longer occupying (Compartment.occupancy
          flipped to IDLE), so R2 can start at that exact instant.
          Geometric semantics: half-open intervals, adjacency permitted.
        test_recipe:
          setup:
            - "Create cabinet + 1 SMALL compartment + pricing profile (HOURLY)"
            - "R1 = POST .../rentals at T0 (HOURLY, 1 unit) — compartment now RENTED"
          trigger:
            - "Attempt 1: At T0+30m, R2 = POST .../rentals as a different renter on the same compartment"
            - "Attempt 2: At T0+30m, POST /rentals/{R1.id}/return (ended_at = T0+30m); then immediately POST .../rentals R3 on same compartment"
          assert:
            - "Attempt 1: response error_id == 'ERR_COMPARTMENT_UNAVAILABLE' (HTTP 409) — R1's occupancy interval still contains T0+30m"
            - "Attempt 2: R3 created with HTTP 201 — adjacency (R1.ended_at == R3.started_at) is allowed since Compartment.occupancy_status flipped to IDLE before R3 was issued"

      - name: cabinet_capacity_aggregate_overflow_at_creation
        grounds:
          - calculations.cabinet_capacity_stats
          - entities.Cabinet.fields.small_occupancy_pct
          - entities.Cabinet.fields.medium_occupancy_pct
          - entities.Cabinet.fields.large_occupancy_pct
          - validations[priority=9]   # ERR_COMPARTMENT_UNAVAILABLE applied per-compartment
          - endpoints.POST_/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals
        distinguishing_aspect: |
          DIFFERENT interval semantics: this is an aggregate-capacity overlap
          on the Cabinet (the resource), not per-compartment. The Cabinet has
          total_S compartments per size-class S; the simultaneously-occupied
          set across ALL compartments of class S cannot exceed total_S. Unlike
          the half-open per-compartment rule, here the "overlap" is a SET
          intersection size (count of currently RENTED/OVERDUE per class), not
          a time-window intersection. At total_S = 5 with 5 already RENTED, a
          6th simultaneous rental on ANY SMALL compartment in this cabinet
          fails — but only because every individual compartment is already
          RENTED (per-compartment rule). The distinguishing aggregate aspect
          is observable on Cabinet.small_occupancy_pct == 100.00 with
          capacity_alert_level == 'CRITICAL', which the per-compartment rule
          alone does not produce — different resource, different geometric
          treatment (set-cardinality vs interval-intersection).
        test_recipe:
          setup:
            - "Create cabinet with 5 SMALL compartments + pricing profile (DAILY)"
            - "Create 5 rentals at T0, one per compartment"
          trigger:
            - "GET /cabinets/{cabinet_id}"
            - "Attempt POST .../rentals on a 6th request choosing any of the 5 compartments"
          assert:
            - "Cabinet.small_occupancy_pct == 100.00"
            - "Cabinet.capacity_alert_level == 'CRITICAL' (>= 95.0)"
            - "6th rental attempt fails with error_id == 'ERR_COMPARTMENT_UNAVAILABLE' (HTTP 409)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ≥2 invariants on different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rental_refund_revenue_net_zero_invariant
        grounds:
          - state_machines.Rental.RETURNED_to_REFUNDED
          - calculations.revenue_share_split
          - entities.RevenueRecord.fields.gross_cents
          - entities.RevenueRecord.fields.partner_share_cents
          - entities.RevenueRecord.fields.platform_share_cents
          - endpoints.POST_/rentals/{rental_id}/refund
        distinguishing_aspect: |
          Conserved quantity #1: cumulative gross_cents across all
          RevenueRecord rows for a (rental_id, cabinet_id). Forward action:
          /return emits RENTAL_FEE (and optional OVERDUE_FEE) rows with
          positive gross_cents. Compensating action: /refund emits a single
          REFUND_REVERSAL row with gross_cents equal to the NEGATIVE of the
          sum of all prior RENTAL_FEE + OVERDUE_FEE rows for that rental.
          Invariant: SUM(RevenueRecord.gross_cents WHERE rental_id == R) == 0
          after /refund. AND, by the partner-residual rule:
          SUM(partner_share_cents) == 0 AND SUM(platform_share_cents) == 0.
        test_recipe:
          setup:
            - "Cabinet with partner_share_pct=30. Rental created, used, returned (1 RENTAL_FEE row with gross=1000, partner=300, platform=700)"
          trigger:
            - "POST /rentals/{rental_id}/refund {version}"
            - "GET /revenue-records?cabinet_id={cid}"
          assert:
            - "Two RevenueRecord rows for this rental: kinds {'RENTAL_FEE','REFUND_REVERSAL'}"
            - "RENTAL_FEE.gross_cents == 1000, REFUND_REVERSAL.gross_cents == -1000"
            - "SUM of RevenueRecord.gross_cents for rental_id == R is 0"
            - "SUM of RevenueRecord.partner_share_cents for rental_id == R is 0"
            - "SUM of RevenueRecord.platform_share_cents for rental_id == R is 0"

      - name: compartment_occupancy_count_conservation_on_return
        grounds:
          - state_machines.Compartment.IDLE_to_RENTED
          - state_machines.Compartment.RENTED_to_IDLE
          - calculations.cabinet_capacity_stats
          - entities.Cabinet.fields.small_capacity_total
          - entities.Cabinet.fields.small_occupancy_pct
          - endpoints.POST_/rentals/{rental_id}/return
        distinguishing_aspect: |
          Conserved quantity #2: total Compartment count by (cabinet, size_class)
          is invariant across rental forward+compensating cycles. Forward
          action: POST .../rentals decrements idle_count_S, increments
          occupied_count_S (count of RENTED/OVERDUE Compartments). Compensating
          action: POST /rentals/{id}/return increments idle_count_S, decrements
          occupied_count_S. Invariant:
          small_capacity_total == count(Compartment WHERE size=SMALL) is
          unchanged across the cycle; AND occupancy_pct after return equals
          occupancy_pct before forward action. This is a DIFFERENT conserved
          quantity (compartment occupancy counts) than the revenue invariant
          above (monetary cents).
        test_recipe:
          setup:
            - "Cabinet with 4 SMALL compartments, all IDLE"
            - "Take a snapshot S0 = GET /cabinets/{cabinet_id} → small_occupancy_pct = 0.00"
          trigger:
            - "POST .../rentals on compartment C1 (forward action)"
            - "Take snapshot S1 = GET /cabinets/{cabinet_id} → small_occupancy_pct = 25.00"
            - "POST /rentals/{rental_id}/return (compensating action)"
            - "Take snapshot S2 = GET /cabinets/{cabinet_id}"
          assert:
            - "S0.small_capacity_total == S1.small_capacity_total == S2.small_capacity_total == 4 (total invariant)"
            - "S0.small_occupancy_pct == 0.00, S1.small_occupancy_pct == 25.00, S2.small_occupancy_pct == 0.00 (returns to pre-forward value)"
            - "S2.capacity_alert_level == S0.capacity_alert_level == 'NONE'"
