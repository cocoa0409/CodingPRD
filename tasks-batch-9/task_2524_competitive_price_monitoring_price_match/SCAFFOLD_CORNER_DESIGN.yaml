              payload: { product_id: "${p_id}", competitor_id: "00000000-0000-4000-8000-000000000000", match_method: "ATTRIBUTE", identifier_score: 70, attribute_score: 70, image_score: 70 }
              as: PricingAnalyst
              captures: { e_competitor: $.data.error_id }
            - call: "POST /pricing/observations"
