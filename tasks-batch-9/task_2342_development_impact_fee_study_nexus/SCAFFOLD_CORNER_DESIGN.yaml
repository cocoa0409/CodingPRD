      - name: deferral_due_date_must_be_after_the_clock
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DEFERRAL_DUE_DATE_INVALID
          - validations[priority=45]
          - entities.DeferralAgreement.fields.requested_due_at
        distinguishing_aspect: |
          The due-date rule is strict, not inclusive: a requested_due_at equal to the current
          logical clock is already 'not after' it and must be rejected, which is the exact
          boundary an implementation using >= gets wrong. A date in the past is rejected the
          same way, and one second into the future is accepted, stamping due_at from the
          request.
