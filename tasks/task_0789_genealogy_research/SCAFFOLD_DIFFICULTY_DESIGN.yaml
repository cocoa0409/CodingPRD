  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: researcher_buffered_exclusive_overlap
        grounds:
          - validations[priority=7]
          - entities.RepositoryAppointment.fields.researcher_id
          - errors[ERR_RESEARCHER_UNAVAILABLE]
        distinguishing_aspect: |
          Buffered-exclusive interval on the Researcher resource: a second appointment for the same
          researcher starting only 15 minutes after the first ends (inside the 30-minute buffer) is
          rejected with ERR_RESEARCHER_UNAVAILABLE even though the raw intervals do not overlap.
        test_recipe:
          setup:
            - "repository concurrent_capacity 5; researcher with a BOOKED appointment 09:00-10:00"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C15", email: "c15@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
