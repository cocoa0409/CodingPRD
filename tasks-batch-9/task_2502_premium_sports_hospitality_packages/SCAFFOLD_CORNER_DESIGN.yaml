      - name: risk_score_weighted_sum_crosses_elevated_then_critical_band
        claim_type: correct_result
        grounds: >-
          calculations.event_fulfillment_risk_score (gap_component,
          lapse_component, horizon_component, status_component; constants
          GAP_WEIGHT 40, LAPSE_WEIGHT 30, CRITICAL_THRESHOLD 70,
          ELEVATED_THRESHOLD 40; bands compared with `>=`);
          state_machines.ReleaseTranche PENDING -> LAPSED via
          POST /operations/daily-run; entities.Event.risk_posture.
        distinguishing_aspect: >-
          The score is walked across both band boundaries by adding ONE component
          at a time, so a wrong weight shows up as a wrong band: 40 exactly (gap
          saturated, lapse 0) lands on ELEVATED because the comparison is `>=`,
          55 stays ELEVATED after half the promised units lapse
          (30 * 30/60 = 15), and 70 exactly tips to CRITICAL once all 60 promised
          units have lapsed (30 * 60/60 = 30). The gap component is saturated by
          min(1, ...) — 20 committed ticket units against 0 released is a ratio of
          1, not 20 — and the horizon component stays 0 throughout because the
          fixture is more than 30 days out at every step, so the three
          observations differ only in the lapse term.
        test_recipe:
          setup: >-
            Canonical event (2027-02-01, so >= 122 days out at every step) with a
            60-unit TICKET deal guaranteeing 20 units, a published BRONZE package,
            one client and one 10-unit CORPORATE booking (= 20 committed ticket
            units). Two 30-unit tranches are promised and then allowed to lapse
            one at a time.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_net: "$.data.net_price_cents", bk_sur: "$.data.guarantee_surcharge_cents" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { score1: "$.data.fulfillment_risk_score", posture1: "$.data.risk_posture" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 30, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-02T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { lapsed1: "$.data.lapsed_tranche_count", shortfall1: "$.data.shortfall_deal_count" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { score2: "$.data.fulfillment_risk_score", posture2: "$.data.risk_posture" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 30, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_b: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-02T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { lapsed2: "$.data.lapsed_tranche_count" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { score3: "$.data.fulfillment_risk_score", posture3: "$.data.risk_posture" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_st3: "$.data.deal_status", sf3: "$.data.shortfall_units" } }
          assert: >-
            Booking: ${bk_net} == 1109520 with ${bk_sur} == 38640
            (= round_half_up(1104000 * 0.035)) — the deal is COMMITTED with
            0 of 60 units released, so the exposure surcharge IS on here.
            Observation 1: ${score1} == 40 (gap 40 * min(1, (20 - 0)/20) = 40,
            lapse 0, horizon 0 because 184 days out, status 0) and
            ${posture1} == "ELEVATED" — the `>=` band boundary.
            After tranche A lapses: ${lapsed1} == 1, ${shortfall1} == 1,
            ${score2} == 55 (= 40 + 30 * 30/60) and ${posture2} == "ELEVATED"
            (55 < 70).
            After tranche B lapses: ${lapsed2} == 1, ${score3} == 70
            (= 40 + 30 * 60/60, the lapse component saturating at LAPSE_WEIGHT)
            and ${posture3} == "CRITICAL" — the second `>=` boundary, hit exactly.
            The deal is back in shortfall: ${deal_st3} == "SHORTFALL_DECLARED"
            with ${sf3} == 20 (= guaranteed 20 - released 0).

      - name: risk_horizon_component_steps_at_the_thirty_and_fourteen_day_marks
        claim_type: constants_applied
        grounds: >-
          calculations.event_fulfillment_risk_score constants HORIZON_WEIGHT 20,
          HORIZON_NEAR_DAYS 14, HORIZON_MID_DAYS 30 and its branch
          (days_to_event <= 14 -> 20; <= 30 -> 10; else 0); its trigger list
          (POST /release-tranches recomputes the score).
        distinguishing_aspect: >-
          Isolates the horizon term completely: the fixture has a 60-unit deal
          with a zero guaranteed minimum and NO bookings, so gap, lapse and
          status are all 0 and the whole score IS the horizon component. Four
          whole-day clock positions bracket both branch points (31 -> 0,
          30 -> 10, 15 -> 10, 14 -> 20), which pins both comparisons as `<=`
          rather than `<`. Each observation is taken after a fresh tranche
          promise, because the score is recomputed on mutation rather than on
          read — a subtlety an implementation that recomputes inside the GET
          would mask.
        test_recipe:
          setup: "Canonical event with one COMMITTED 60-unit deal (guaranteed_minimum 0) and no packages, clients or bookings."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-01T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 15, promised_release_at: "2027-01-31T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { s31: "$.data.fulfillment_risk_score", p31: "$.data.risk_posture" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-02T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 15, promised_release_at: "2027-01-31T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { s30: "$.data.fulfillment_risk_score" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-17T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 15, promised_release_at: "2027-01-31T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { s15: "$.data.fulfillment_risk_score" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-01-18T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 15, promised_release_at: "2027-01-31T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights }
            - { call: "GET /events/${ev_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { s14: "$.data.fulfillment_risk_score", p14: "$.data.risk_posture" } }
          assert: >-
            The four tranche promises sum to 60 = contracted_units, so priority 67
            never fires, and none of them lapses (all are promised for
            2027-01-31, after the last clock position), so lapse_component stays
            0 throughout. With no bookings, committed_units is 0 and
            gap_component is 40 * min(1, max(0, 0 - 0) / max(1, 0)) == 0.
            31 days out: ${s31} == 0 with ${p31} == "NORMAL".
            30 days out (`<= 30` boundary): ${s30} == 10.
            15 days out: ${s15} == 10 — still the mid band, not yet 20.
            14 days out (`<= 14` boundary): ${s14} == 20 with
            ${p14} == "NORMAL" (20 < ELEVATED_THRESHOLD 40).
            The event's version advanced only through the tranche promises; the
            clock calls alone never rewrote the score, which is why each
            observation had to follow a mutation.

      - name: payment_schedule_remainder_lands_on_the_last_line_and_dates_are_floored
        claim_type: precision
        grounds: >-
          calculations.payment_schedule_generation (a1 =
          round_half_up(payable * DEPOSIT_PCT 0.30), a2 =
          round_half_up(payable * SECOND_PCT 0.40), a3 = payable - a1 - a2;
          d1 = logical_now + IMMEDIATE_DAYS 3; d2 = max(event_date - 90 days,
          d1); d3 = max(event_date - 30 days, d2); single line when
          days_to_event < SCHEDULE_MIN_DAYS 30) and its precision note ("a3 is a
          pure subtraction so the three lines sum exactly to payable with zero
          drift"); endpoints "POST /bookings".
        distinguishing_aspect: >-
          The fixture is engineered so the two rounded lines both round UP
          (4365.6 -> 4366 and 5820.8 -> 5821), which makes the third line 4365 —
          strictly SMALLER than the deposit. Computing a3 as
          round_half_up(payable * 0.30) instead of by subtraction yields 4366 and
          a schedule that over-bills by one cent, and any drift is visible in the
          conservation identity. The same instance then walks the
          SCHEDULE_MIN_DAYS boundary: at exactly 30 days out the three-line
          schedule survives but the max() floors collapse d2 and d3 onto d1, and
          at 29 days out a single line replaces it.
        test_recipe:
          setup: >-
            Canonical event; BRONZE package with one component (quantity 1,
            unit_cost 10001, markup 0.5000) so line_price =
            round_half_up(15001.5) = 15002, base_cost 10001, list_price 15002 and
            margin_pct 0.3334; published; one client with a 50000000 limit. A
            1-unit CORPORATE booking on it nets 14552 (gross 15002, no volume
            discount, commission round_half_up(450.06) = 450).
