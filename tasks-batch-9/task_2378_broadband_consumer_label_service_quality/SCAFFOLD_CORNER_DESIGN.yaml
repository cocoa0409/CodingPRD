              as: NetworkEngineer
              captures: { run_a_id: $.data.id }
          assert:
            - "200 with MethodologyDocument.${doc_id}.status == PUBLISHED, published_at == 2026-09-01T00:00:00.000Z and version == 2"
            - "the run that cites the now-published document returns 201: TestRun.${run_a_id}.status == INCLUDED and sample_count == 6"
