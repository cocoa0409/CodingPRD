        grounds:
          - validations[priority=27]
          - errors[ERR_CREDIT_BALANCE_INSUFFICIENT]
          - entities.TicketOrder.applied_credit_cents
        distinguishing_aspect: |
          apply_credit is meaningless without a member to draw from, so the honesty rule refuses the request
          rather than silently applying zero credit. It fails if the flag is quietly ignored, which would let a
          walk-up believe a credit was applied.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset."
            - "Showtime SA at 2026-08-14T12:00:00Z has open sales, 8 sellable seats and public_sale_opens_at equal to the startup clock."
            - "No member is referenced in the order, yet apply_credit is set to true."
