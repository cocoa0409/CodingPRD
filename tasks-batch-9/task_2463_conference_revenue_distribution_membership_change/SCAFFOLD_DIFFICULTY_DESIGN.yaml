          The FINAL_AUDITED FY2027 run leaves exactly 2 remainder cents against a
          (weight_bps DESC, created_at ASC) queue in which South and East both carry
          13000 bps; the pinned order therefore awards the second cent to South, the
          earlier-created member, so South ends on 118009709 and East on 118009708 -
