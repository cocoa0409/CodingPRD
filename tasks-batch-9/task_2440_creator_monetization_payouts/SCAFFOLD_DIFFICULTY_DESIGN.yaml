      - name: policy_strike_two_hop_cascade_invalidates_creator_version_for_occ
        trigger_transition: "Creator eligibility_status ELIGIBLE -> SUSPENDED via POST /monetization/creators/{creator_id}/policy-strikes"
        depth: 2
        grounds:
          - "endpoints.POST /monetization/creators/{creator_id}/policy-strikes"
          - calculations.eligibility_evaluation
          - entities.Creator.fields.active_strike_count
          - entities.Creator.fields.eligibility_status
          - entities.Creator.fields.version
          - concurrency_rules.tax-profile-create-stale-creator
          - errors.ERR_STALE_CREATOR_VERSION
        distinguishing_aspect: |
          A fourth distinct triggering transition (recording a policy strike)
          drives the shortest legal chain, depth 2: (1) active_strike_count is
          incremented and last_strike_at stamped; (2) BECAUSE the strike counter
          moved, eligibility_evaluation is re-run inside the same request and
          its policy short-circuit forces SUSPENDED with exactly
          ["POLICY_COMPLIANCE"]. The cascade is observed not by reading the
          creator but by its side effect on optimistic concurrency: the
          Creator.version a client read BEFORE the strike is now stale, so
          POST /monetization/tax-profiles carrying that version is rejected 412
          while the post-cascade version succeeds.
        test_recipe:
          setup:
            - "One US Creator with follower_count 10000 and watch_time_minutes_365d 240000, freshly created, so eligibility_status == PENDING_REVIEW, active_strike_count == 0, evaluation_count == 0 and version == 1; that version has been read by the client."
            - "No TaxProfile exists for the creator yet."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Kip Stale", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/creators/${cr_id}/policy-strikes"
              payload: { reason: "Coordinated inauthentic engagement." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { cr_v2: "$.data.version", strike_elig: "$.data.eligibility_status", strike_count: "$.data.active_strike_count", strike_evals: "$.data.evaluation_count" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: FinanceOperator
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id", tp_rate: "$.data.withholding_rate_bps", tp_status: "$.data.status" }
          assert:
            - "hop 1: ${strike_count} == 1 and Creator.${cr_id}.last_strike_at == '2026-08-01T00:00:00.000Z'"
            - "hop 2: ${strike_elig} == SUSPENDED and ${strike_evals} == 1 and Creator.${cr_id}.last_evaluation_failed_criteria == ['POLICY_COMPLIANCE']"
            - "hop 2: ${cr_v2} == ${cr_v1} + 1 (the cascade advanced Creator.version exactly once, not once per hop)"
            - "trigger step 1 returns HTTP 412 with error_id ERR_STALE_CREATOR_VERSION"
            - "after trigger step 1, GET /monetization/tax-profiles?creator_id=${cr_id} returns total_count 0 (the rejected create wrote nothing)"
            - "after trigger step 1, Creator.${cr_id}.version == ${cr_v2} (a rejected OCC attempt does not bump the version)"
            - "trigger step 2 returns HTTP 201 with ${tp_status} == DRAFT and ${tp_rate} == 2400 (BACKUP_WITHHOLDING_BPS while not yet VERIFIED)"
            - "after trigger step 2, Creator.${cr_id}.version == ${cr_v2} + 1"
            - "Creator.${cr_id}.eligibility_status == SUSPENDED and active_strike_count == 1 (the tax-profile create does not re-evaluate)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payout_create_arrears_state_outranks_zero_balance_fiscal
        error_category_pair: "state vs business_fiscal"
        grounds:
          - "validations.priority_37"
          - "validations.priority_74"
          - errors.ERR_CREATOR_NOT_PAYABLE
          - errors.ERR_NO_PAYABLE_BALANCE
          - calculations.payout_state_resolution
          - calculations.clawback_waterfall
        distinguishing_aspect: |
          A single POST /monetization/payouts violates exactly two rows at once:
          the state row (payout_state == ARREARS, priority 37) and the
          business_fiscal row (available_balance_cents == 0, priority 74). The
          lower priority number must win, so the response is 409
          ERR_CREATOR_NOT_PAYABLE and never 422 ERR_NO_PAYABLE_BALANCE. The
          creator is deliberately given a VERIFIED TaxProfile so the only two
          violated rows are these two.
        test_recipe:
          setup:
            - "One US Creator, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE, with a VERIFIED W9 TaxProfile (tin_provided true) so the business_safety tax row at priority 47 is satisfied."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0) accrued one event of gross 40000 on 2026-07-05, creator_share_cents 20000, in an OPEN period that is NEVER closed - so no EarningsStatement ever exists and statement_payable_cents stays 0."
            - "PolicyReviewer reviewer-r1 opened an Investigation with hold_payouts false over the closed window [2026-07-01T00:00:00Z, 2026-07-31T23:59:59Z]; reviewer-r2 substantiated it, so the single ACCRUED event became CLAWED_BACK, clawback_base_cents == 20000, no bucket existed, clawback_recovered_cents == 0 and clawback_unrecovered_cents == 20000."
            - "Consequently Creator.outstanding_clawback_cents == 20000, payout_state == ARREARS, held_cents == 0, statement_payable_cents == 0 and available_balance_cents == 0; the ledger holds only the ACCRUAL +20000 (a zero-recovery waterfall writes no CLAWBACK entry)."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Lu Arrears", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 40000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev_id: "$.data.id" }
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${cr_id}", scope: "Tip laundering review.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T23:59:59Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { inv_id: "$.data.id" }
            - call: "POST /monetization/investigations/${inv_id}/substantiate"
              payload: { finding: "Tips were self-funded through stolen instruments." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
              captures: { inv_unrec: "$.data.clawback_unrecovered_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pre_state: "$.data.payout_state", pre_avail: "$.data.available_balance_cents", pre_ledger: "$.data.ledger_balance_cents" }
          trigger:
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
          assert:
            - "${inv_unrec} == 20000 and ${pre_state} == ARREARS and ${pre_avail} == 0 and ${pre_ledger} == 20000"
            - "trigger returns HTTP 409 with error_id ERR_CREATOR_NOT_PAYABLE"
            - "trigger does NOT return HTTP 422 ERR_NO_PAYABLE_BALANCE (priority 74 loses to priority 37)"
            - "GET /monetization/payouts?creator_id=${cr_id} returns total_count 0"
            - "Creator.${cr_id}.outstanding_clawback_cents == 20000 and payout_state == ARREARS and ledger_balance_cents == 20000"
            - "RevenueEvent.${ev_id}.status == CLAWED_BACK"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 1 (only the ACCRUAL +20000)"

      - name: substantiate_closed_investigation_state_outranks_segregation_safety
        error_category_pair: "state vs business_safety"
        grounds:
          - "validations.priority_31"
          - "validations.priority_44"
          - errors.ERR_INVESTIGATION_NOT_OPEN
          - errors.ERR_SEGREGATION_OF_DUTIES
          - "validations.priority_44"
          - "state_machines.Investigation.transitions[OPEN -> SUBSTANTIATED]"
        distinguishing_aspect: |
          A different category pair from the arrears conflict: the request is
          sent by the very reviewer who opened the Investigation (violating the
          business_safety SoD row at priority 44) against an Investigation that
          is already SUBSTANTIATED (violating the state row at priority 31).
          The state row wins, so the caller learns ERR_INVESTIGATION_NOT_OPEN
          (409) and the SoD violation is never surfaced - and no second strike
          is issued.
        test_recipe:
          setup:
            - "One US Creator with follower_count 10000 and watch_time_minutes_365d 240000, evaluated to ELIGIBLE, with no RevenueEvents at all."
            - "PolicyReviewer reviewer-r1 opened an Investigation (hold_payouts false) over [2026-07-01T00:00:00Z, 2026-07-31T23:59:59Z], so Investigation.opened_by_user_id == 'reviewer-r1'."
            - "PolicyReviewer reviewer-r2 already substantiated it: state == SUBSTANTIATED, resolved_by_user_id == 'reviewer-r2', clawback_base_cents == 0, clawback_recovered_cents == 0, clawback_unrecovered_cents == 0, and the strike hop left active_strike_count == 1 with eligibility_status == SUSPENDED."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Mia Closed", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${cr_id}", scope: "Bot-driven subscription review.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T23:59:59Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { inv_id: "$.data.id", inv_opener: "$.data.opened_by_user_id" }
            - call: "POST /monetization/investigations/${inv_id}/substantiate"
              payload: { finding: "Subscriptions were purchased with compromised cards." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
              captures: { inv_state: "$.data.state", inv_resolver: "$.data.resolved_by_user_id" }
          trigger:
            - call: "POST /monetization/investigations/${inv_id}/substantiate"
              payload: { finding: "Re-confirming my own original finding." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
          assert:
            - "${inv_opener} == 'reviewer-r1' and ${inv_state} == SUBSTANTIATED and ${inv_resolver} == 'reviewer-r2'"
            - "trigger returns HTTP 409 with error_id ERR_INVESTIGATION_NOT_OPEN"
            - "trigger does NOT return HTTP 403 ERR_SEGREGATION_OF_DUTIES (priority 44 loses to priority 31)"
            - "Investigation.${inv_id}.resolved_by_user_id == 'reviewer-r2' and finding == 'Subscriptions were purchased with compromised cards.' (unchanged)"
            - "Creator.${cr_id}.active_strike_count == 1 (no second strike was issued)"
            - "Creator.${cr_id}.outstanding_clawback_cents == 0 and payout_state == ACCRUING"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 0"

      - name: payout_create_missing_tax_safety_outranks_below_threshold_fiscal
        error_category_pair: "business_safety vs business_fiscal"
        grounds:
          - "validations.priority_47"
          - "validations.priority_75"
          - errors.ERR_TAX_DOCUMENTATION_MISSING
          - errors.ERR_BELOW_PAYOUT_THRESHOLD
          - calculations.withholding_rate_resolution
          - calculations.statement_withholding
        distinguishing_aspect: |
          A third distinct category pair: the creator has no TaxProfile at all
          (business_safety row, priority 47) AND an available_balance_cents of
          3800 that is strictly below payout_threshold_cents 10000
          (business_fiscal row, priority 75). Both are 422s, so only the
          priority ordering distinguishes them: ERR_TAX_DOCUMENTATION_MISSING
          must be returned, never ERR_BELOW_PAYOUT_THRESHOLD. The absent profile
          also forces BACKUP_WITHHOLDING_BPS 2400 on the statement, which is how
          the balance became 3800 in the first place.
        test_recipe:
          setup:
            - "One GB Creator, follower_count 10000, watch_time_minutes_365d 240000, default payout_threshold_cents 10000, payout_method BANK_TRANSFER, evaluated to ELIGIBLE, payout_state ACCRUING."
            - "The creator has NO TaxProfile row of any status, so withholding_rate_resolution returns BACKUP_WITHHOLDING_BPS == 2400."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0) accrued one event of gross 10000 on 2026-07-05, creator_share_cents 5000."
            - "Period 2026-07 was CLOSED, producing a PROVISIONAL statement with withholding_rate_bps 2400, withholding_cents ROUND_HALF_UP(5000*2400/10000) == 1200, net_payable_cents 3800 and a WITHHOLDING LedgerEntry of -1200."
            - "The statement was FINALIZED; the FINAL variant re-derives ROUND_HALF_UP(5000*2400/10000) == 1200 over the single event, so the delta is 0 and no WITHHOLDING_TRUE_UP entry exists. available_balance_cents == 3800."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ned NoTax", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000, payout_method: "BANK_TRANSFER" }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
