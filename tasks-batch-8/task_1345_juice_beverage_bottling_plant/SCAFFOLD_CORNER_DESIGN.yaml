      - name: batch_create_size_bounds
        claim_type: boundary_edge
        grounds:
          - errors[ERR_BATCH_TOO_SMALL]
          - errors[ERR_TANK_CAPACITY_EXCEEDED]
          - entities.Batch.fields.quantity_liters
        distinguishing_aspect: |
          Batch size gates at creation: 400 L is below the 500 L floor
          (ERR_BATCH_TOO_SMALL), 6000 L exceeds the 5000 L tank
          (ERR_TANK_CAPACITY_EXCEEDED), and exactly 500 L is accepted — the
          floor is inclusive.
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank T-SZ cap 5000 AVAILABLE"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "SizeCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SZ-1", name: "Size Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-SZ", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
          trigger:
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 400 }, as: BlendOperator, captures: { err_small: $.data.error_id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 6000 }, as: BlendOperator, captures: { err_big: $.data.error_id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 500 }, as: BlendOperator, captures: { ok_batch: $.data.id, ok_status: $.data.status } }
          assert:
            - "err_small == ERR_BATCH_TOO_SMALL, HTTP 422 (400 < 500)"
            - "err_big == ERR_TANK_CAPACITY_EXCEEDED, HTTP 422 (6000 > 5000)"
            - "ok_status == PLANNED (500 == floor, inclusive) — and failed creates left the tank AVAILABLE"

  # ===========================================================================
  # Section: endpoints (claim-extraction-guide Table 5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_and_envelope_shape
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: |
          The fixed envelope applies everywhere: list responses carry
          response_type "array" plus limit/offset/total_count/has_more with
          default limit 10; a 404 carries response_type "error" with
          data.error_id — both shapes in one pass.
        test_recipe:
          setup:
            - "Eleven container lots received (CAN_330, SUP-PG-01 .. SUP-PG-11)"
          setup_api_calls:
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-01" }, as: WarehouseLead }
