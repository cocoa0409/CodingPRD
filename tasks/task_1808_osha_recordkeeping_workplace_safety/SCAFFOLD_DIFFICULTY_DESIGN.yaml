              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T08:00:00Z", description: "Cut sutured", body_part: "finger", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_4: $.data.id, case_4_v: $.data.version }
            - call: "POST /safety/cases/${case_4}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_4_v}" }
              as: SafetyOfficer
          trigger:
            - call: "GET /safety/summaries/${sum_id}"
              payload: {}
              as: RecordkeepingCoordinator
              captures: { sum_trir_cert: $.data.trir, sum_dart_cert: $.data.dart_rate, sum_status: $.data.status }
            - call: "GET /safety/establishments/${est_id}/rates?year=2026"
              payload: { year: 2026 }
              as: SafetyOfficer
              captures: { live_trir: $.data.trir, live_cases: $.data.total_recordable_cases }
          assert:
            - "provisional at prepare: trir == 10.0, dart_rate == 3.3 (3 recordable, 1 DART, 60000h)"
            - "after certification + 4th recordable case: summary.status == CERTIFIED"
            - "certified summary.trir == 10.0 and summary.dart_rate == 3.3 (frozen snapshot unchanged)"
            - "live rates endpoint: trir == 13.3 (4 x 200000 / 60000 = 13.333... round_half_up), total_recordable_cases == 4"
            - "certified 10.0 != live 13.3 for identical year — variant divergence on AnnualSummary domain"

      - name: day_count_projected_vs_recorded
        grounds:
          - calculations.day_count_rollup
          - entities.IncidentCase.fields.restricted_days_count
        distinguishing_aspect: |
          IncidentCase-domain dual variant (distinct from the AnnualSummary
          rate domain): a RECORDABLE case holding an ACTIVE RESTRICTED entry
          2026-08-10..2026-08-30 read at clock 2026-08-20 reports stored
          RECORDED restricted_days_count == 21 while the read-time
          PROJECTED_FINAL projected_restricted_days_count == 11 (accrual
          through clock date) — identical stored entries, two variant answers.
        test_recipe:
          setup:
            - "Company C, Establishment E (non-exempt), Employee W"
            - "Case K classified JOB_TRANSFER_RESTRICTION (occurred 2026-08-05, clock 2026-08-05)"
            - "Day entry RESTRICTED 2026-08-10..2026-08-30 (21 calendar days recorded span)"
            - "Logical clock advanced to 2026-08-20; K not day_count_closed"
          setup_api_calls:
