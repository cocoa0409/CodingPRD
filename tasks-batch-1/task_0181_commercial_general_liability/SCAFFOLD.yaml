# =============================================================================
# Scaffold: Commercial General Liability (CGL) administration platform
# Difficulty: Expert (§0.4)
# =============================================================================

scenario: |
  181. Commercial General Liability: policy schedule (occurrence/claims-made),
  additional insured endorsement, certificate of insurance (COI), aggregate-limit
  erosion, premium audit (payroll/sales basis), loss run, retroactive date

domain_name: commercial-general-liability
api_prefix: /

complexity_profile:
  primary_archetype: ledger reconciliation        # estimated premium vs audited premium on identical exposure
  secondary_archetype: compliance / audit          # COI / additional-insured / retroactive-date regulatory gating
  complexity_layers:
    - dual_variant_calculation                     # estimated vs audited premium; occurrence vs claims-made coverage test
    - cascading_side_effects                        # claim transaction -> aggregate erosion -> policy posture -> COI/endorsement invalidation
    - optimistic_concurrency                        # OCC on Policy.version for claim-transaction posting and audit finalization
    - rate_threshold_triggers                       # aggregate-limit erosion crossing zero; audit waiver threshold; impairment fraction

  entity_topology: flat
  # Every entity is a top-level collection (/policies, /claims, ...) linked by
  # foreign keys; insurer scoping is by insurer_id FK + filter, not URL nesting.

  state_machine_shape: compound
  # Policy posture (aggregate health) is derived from children (claims/transactions);
  # PremiumAudit has a revision cycle; Claim has a reopen cycle; CGL coverage trigger
  # branches occurrence vs claims-made with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Insurer->Policy, Policy->Claim, Claim->ClaimTransaction, Audit->ExposureRecord
    - cross_aggregate    # CertificateOfInsurance references AdditionalInsuredEndorsement; LossRun snapshots Claims

  role_model: peer_roles
  # Underwriter owns policy/endorsement/certificate issuance; ClaimsAdjuster owns
  # claims/transactions; PremiumAuditor owns audits/exposure; CertificateHolder is
  # an entity-backed read party; InsurerAdmin is the operational superuser.

  consistency_model: immediate
  # All erosion, posture, and reconciliation effects are applied atomically within
  # the triggering request.

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity Relationship Table
# =============================================================================
entities:
  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurer (carrier) legal name" }
      - { name: naic_code, type: string, source: input, description: "NAIC company code, 5 digits" }
      - { name: current_date, type: datetime, source: system, default: "2026-01-01T00:00:00.000Z", description: "Carrier business clock (ISO 8601 UTC); advanced only via POST /insurers/{id}/clock" }
      - { name: audit_waiver_threshold_cents, type: integer, source: input, default: 50000, description: "Net audit premium adjustment at or below which (absolute value) the audit auto-WAIVES" }

  - name: Insured
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: legal_name, type: string, source: input, description: "First Named Insured legal name" }
      - { name: fein, type: string, source: input, description: "Federal Employer ID Number, unique within insurer" }
      - { name: primary_basis, type: enum, source: input, description: "Premium exposure basis: PAYROLL | SALES" }

  - name: CertificateHolder
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: holder_name, type: string, source: input, description: "Certificate holder legal name (e.g., landlord, GC)" }
      - { name: address, type: string, source: input, description: "Holder mailing address" }

  - name: Policy
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: insured_id, type: string, source: input, description: "FK -> Insured.id; the First Named Insured" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number, unique within insurer" }
      - { name: coverage_trigger, type: enum, source: input, description: "OCCURRENCE | CLAIMS_MADE" }
      - { name: retroactive_date, type: datetime, source: input, default: null, description: "CLAIMS_MADE only: earliest occurrence date covered (ISO 8601). MUST be null for OCCURRENCE policies" }
      - { name: effective_date, type: datetime, source: input, description: "Policy inception date (ISO 8601 UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Policy expiration date (ISO 8601 UTC, exclusive upper bound of the policy period)" }
      - { name: each_occurrence_limit_cents, type: integer, source: input, description: "Per-occurrence indemnity limit" }
      - { name: general_aggregate_limit_cents, type: integer, source: input, description: "General Aggregate limit (caps non-products incurred losses)" }
      - { name: products_aggregate_limit_cents, type: integer, source: input, description: "Products/Completed-Operations Aggregate limit (separate bucket)" }
      - { name: premium_basis, type: enum, source: input, description: "PAYROLL | SALES; basis used for exposure rating" }
      - { name: rate_per_unit_cents, type: integer, source: input, description: "Premium rate in cents per $1,000 of basis exposure" }
      - { name: minimum_premium_cents, type: integer, source: input, description: "Floor premium the policy never bills below" }
      - { name: estimated_exposure_units, type: integer, source: input, description: "Estimated basis exposure in whole dollars at binding (payroll or sales)" }
      - { name: estimated_premium_cents, type: integer, source: computed, default: null, description: "Premium computed at binding from estimated_exposure_units (see calc estimated_premium); null before bind" }
      - { name: audited_premium_cents, type: integer, source: computed, default: null, description: "Premium computed at audit close; null until an audit FINALIZES or WAIVES" }
      - { name: general_aggregate_remaining_cents, type: integer, source: computed, default: null, description: "general_aggregate_limit_cents minus eroding incurred GENERAL losses; floored at 0; null before bind" }
      - { name: products_aggregate_remaining_cents, type: integer, source: computed, default: null, description: "products_aggregate_limit_cents minus eroding incurred PRODUCTS losses; floored at 0; null before bind" }
      - { name: posture, type: enum, source: computed, default: null, description: "Derived aggregate-health gate: HEALTHY | IMPAIRED | EXHAUSTED (see calc policy_posture); null before bind" }
      - { name: status, type: enum, source: system, description: "DRAFT | BOUND | IN_FORCE | EXPIRED | CANCELLED | AUDIT_CLOSED" }

  - name: AdditionalInsuredEndorsement
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: certificate_holder_id, type: string, source: input, description: "FK -> CertificateHolder.id; the party being added as additional insured" }
      - { name: form_number, type: enum, source: input, description: "ISO form: CG2010 (ongoing ops) | CG2037 (completed ops) | CG2010_2037 (both)" }
      - { name: scope, type: enum, source: computed, description: "ONGOING_OPS | COMPLETED_OPS | BOTH; derived from form_number" }
      - { name: ai_effective_date, type: datetime, source: input, description: "Date AI status begins (ISO 8601); must be within the policy period" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | VOID" }

  - name: CertificateOfInsurance
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: certificate_holder_id, type: string, source: input, description: "FK -> CertificateHolder.id; recipient of the COI" }
      - { name: additional_insured_endorsement_id, type: string, source: input, default: null, description: "FK -> AdditionalInsuredEndorsement.id; null for an informational (non-AI) certificate" }
      - { name: names_as_additional_insured, type: boolean, source: input, default: false, description: "Whether this COI asserts the holder is an Additional Insured" }
      - { name: issue_date, type: datetime, source: computed, default: null, description: "Insurer clock at issuance; null until ISSUED" }
      - { name: snapshot_each_occurrence_cents, type: integer, source: computed, default: null, description: "Per-occurrence limit frozen onto the certificate at issuance" }
      - { name: snapshot_general_aggregate_remaining_cents, type: integer, source: computed, default: null, description: "general_aggregate_remaining_cents frozen at issuance" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | REVOKED | EXPIRED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: claimant_name, type: string, source: input, description: "Name of the third-party claimant" }
      - { name: loss_type, type: enum, source: input, description: "BODILY_INJURY | PROPERTY_DAMAGE | PRODUCTS_COMPLETED_OPS" }
      - { name: occurrence_date, type: datetime, source: input, description: "Date the loss occurred (ISO 8601 UTC)" }
      - { name: reported_date, type: datetime, source: input, description: "Date the claim was first reported to the insurer (ISO 8601 UTC)" }
      - { name: aggregate_bucket, type: enum, source: computed, description: "PRODUCTS if loss_type==PRODUCTS_COMPLETED_OPS else GENERAL; selects which aggregate this claim erodes" }
      - { name: incurred_cents, type: integer, source: computed, default: 0, description: "Open reserve + payments minus recoveries for this claim (see calc claim_incurred)" }
      - { name: recognized_incurred_cents, type: integer, source: computed, default: 0, description: "incurred_cents capped at per-occurrence and aggregate room actually applied to erosion (see calc aggregate_erosion)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESERVED | PAID | CLOSED | DENIED | REOPENED" }

  - name: ClaimTransaction
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: txn_type, type: enum, source: input, description: "RESERVE_SET | PAYMENT | RECOVERY | RESERVE_RELEASE" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount in cents; semantics depend on txn_type" }
      - { name: posted_sequence, type: integer, source: system, description: "Monotonic per-claim posting order; first posted transaction is 1" }
      - { name: memo, type: string, source: input, default: null, description: "Optional adjuster note" }

  - name: PremiumAudit
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: audit_basis, type: enum, source: input, description: "PAYROLL | SALES; basis enumerated in this audit (MUST equal Policy.premium_basis)" }
      - { name: audited_exposure_units, type: integer, source: computed, default: 0, description: "Sum of ExposureRecord.basis_amount_units across this audit's records" }
      - { name: computed_audited_premium_cents, type: integer, source: computed, default: null, description: "Premium from audited exposure (see calc audited_premium); null until COMPLETED" }
      - { name: net_adjustment_cents, type: integer, source: computed, default: null, description: "computed_audited_premium_cents minus Policy.estimated_premium_cents (signed: + additional / - return); null until COMPLETED" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments each time a DISPUTED audit is reopened to IN_PROGRESS" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | DISPUTED | FINALIZED | WAIVED" }

  - name: ExposureRecord
    parent: PremiumAudit
    common_fields: true
    fields:
      - { name: premium_audit_id, type: string, source: input, description: "FK -> PremiumAudit.id" }
      - { name: class_code, type: string, source: input, description: "ISO classification code for the exposure (e.g., 91560)" }
      - { name: basis_amount_units, type: integer, source: input, description: "Actual audited basis (payroll or sales) in whole dollars for this class code" }

  - name: LossRun
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: as_of_date, type: datetime, source: computed, description: "Insurer clock at generation; defines the snapshot cutoff (claims with reported_date <= as_of_date)" }
      - { name: total_incurred_cents, type: integer, source: computed, description: "Sum of incurred_cents over included claims at snapshot time" }
      - { name: general_incurred_cents, type: integer, source: computed, description: "Incurred over GENERAL-bucket claims at snapshot" }
      - { name: products_incurred_cents, type: integer, source: computed, description: "Incurred over PRODUCTS-bucket claims at snapshot" }
      - { name: claim_count, type: integer, source: computed, description: "Number of claims included in the snapshot" }
      - { name: open_claim_count, type: integer, source: computed, description: "Number of included claims not in CLOSED or DENIED at snapshot" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    initial_state: DRAFT
    terminal_states: [CANCELLED, AUDIT_CLOSED]
    transitions:
      - from: DRAFT
        to: BOUND
        trigger: "POST /policies/{policyId}/bind"
        actor: Underwriter
        preconditions:
          - "coverage_trigger==CLAIMS_MADE => retroactive_date is non-null AND retroactive_date <= effective_date (ERR_RETRO_DATE_REQUIRED)"
          - "coverage_trigger==OCCURRENCE => retroactive_date is null (ERR_RETRO_DATE_NOT_ALLOWED)"
          - "effective_date < expiration_date (ERR_INVALID_POLICY_PERIOD)"
          - "products_aggregate_limit_cents <= general_aggregate_limit_cents (ERR_AGGREGATE_LIMIT_INVALID)"
        side_effects:
          - "Compute estimated_premium_cents via calc estimated_premium"
          - "Initialize general_aggregate_remaining_cents = general_aggregate_limit_cents"
          - "Initialize products_aggregate_remaining_cents = products_aggregate_limit_cents"
          - "Set posture = HEALTHY"
          - "increments Policy.version by 1"

      - from: BOUND
        to: IN_FORCE
        trigger: "POST /policies/{policyId}/activate"
        actor: Underwriter
        preconditions:
          - "Insurer.current_date >= effective_date (ERR_POLICY_NOT_YET_EFFECTIVE)"
        side_effects:
          - "increments Policy.version by 1"

      - from: IN_FORCE
        to: EXPIRED
        trigger: "system (auto on POST /insurers/{insurerId}/clock advancing current_date >= expiration_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Any ISSUED CertificateOfInsurance on this policy transitions ISSUED -> EXPIRED (cascade)"
          - "increments Policy.version by 1"

      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /policies/{policyId}/cancel"
        actor: Underwriter
        preconditions:
          - "No Claim in OPEN/RESERVED/PAID/REOPENED status (ERR_OPEN_CLAIMS_BLOCK_CANCEL)"
        side_effects:
          - "All ACTIVE AdditionalInsuredEndorsement on this policy -> VOID (cascade)"
          - "All ISSUED CertificateOfInsurance on this policy -> REVOKED (cascade)"
          - "increments Policy.version by 1"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /policies/{policyId}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "increments Policy.version by 1"

      - from: EXPIRED
        to: AUDIT_CLOSED
        trigger: "system (auto when a PremiumAudit on this policy FINALIZES or WAIVES)"
        actor: system
        preconditions: []
        side_effects:
          - "Set Policy.audited_premium_cents = audit.computed_audited_premium_cents (FINALIZED) or = estimated_premium_cents (WAIVED)"
          - "increments Policy.version by 1"
    note: "posture is a computed field (calc policy_posture), not a status enum value; status and posture evolve on independent axes (parallel dimension)."

  - entity: Claim
    initial_state: OPEN
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "POST /claims/{claimId}/transactions (txn_type=RESERVE_SET)"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy.status == IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
          - "coverage applies under calc coverage_test (ERR_OCCURRENCE_OUTSIDE_PERIOD / ERR_CLAIM_BEFORE_RETRO_DATE)"
        side_effects:
          - "Append ClaimTransaction; recompute Claim.incurred_cents"
          - "Cascade aggregate_erosion -> Policy.general/products_aggregate_remaining_cents"
          - "Cascade policy_posture -> Policy.posture"
          - "increments Policy.version by 1"

      - from: RESERVED
        to: RESERVED
        trigger: "POST /claims/{claimId}/transactions (txn_type in RESERVE_SET/RESERVE_RELEASE/RECOVERY)"
        actor: ClaimsAdjuster
        preconditions:
          - "expected_policy_version matches Policy.version (ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Append ClaimTransaction; recompute incurred_cents"
          - "Cascade aggregate_erosion and policy_posture"
          - "increments Policy.version by 1"

      - from: RESERVED
        to: PAID
        trigger: "POST /claims/{claimId}/transactions (txn_type=PAYMENT)"
        actor: ClaimsAdjuster
        preconditions:
          - "expected_policy_version matches Policy.version (ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Append ClaimTransaction; recompute incurred_cents"
          - "Cascade aggregate_erosion and policy_posture"
          - "increments Policy.version by 1"

      - from: PAID
        to: PAID
        trigger: "POST /claims/{claimId}/transactions (txn_type in PAYMENT/RESERVE_SET/RESERVE_RELEASE/RECOVERY)"
        actor: ClaimsAdjuster
        preconditions:
          - "expected_policy_version matches Policy.version (ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Append ClaimTransaction; recompute incurred_cents (post-payment reserve/recovery adjustments allowed)"
          - "Cascade aggregate_erosion and policy_posture"
          - "increments Policy.version by 1"

      - from: PAID
        to: CLOSED
        trigger: "POST /claims/{claimId}/close"
        actor: ClaimsAdjuster
        preconditions:
          - "Net open reserve (RESERVE_SET minus RESERVE_RELEASE) == 0 (ERR_OPEN_RESERVE_REMAINS)"
        side_effects:
          - "Cascade aggregate_erosion (released reserve room may return) and policy_posture"
          - "increments Policy.version by 1"

      - from: RESERVED
        to: CLOSED
        trigger: "POST /claims/{claimId}/close"
        actor: ClaimsAdjuster
        preconditions:
          - "Net open reserve == 0 (ERR_OPEN_RESERVE_REMAINS)"
        side_effects:
          - "Cascade aggregate_erosion and policy_posture"
          - "increments Policy.version by 1"

      - from: OPEN
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim has no PAYMENT transaction (ERR_PAID_CLAIM_CANNOT_DENY)"
        side_effects:
          - "increments Policy.version by 1"

      - from: RESERVED
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim has no PAYMENT transaction (ERR_PAID_CLAIM_CANNOT_DENY); reachable only while status==RESERVED (a PAID claim is blocked)"
        side_effects:
          - "Release the erosion this claim caused: drop recognized_incurred_cents to 0 and cascade aggregate_erosion + policy_posture (general/products room returns)"
          - "increments Policy.version by 1"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /claims/{claimId}/reopen"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy.status == IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
        side_effects:
          - "increments Policy.version by 1"

      - from: REOPENED
        to: RESERVED
        trigger: "POST /claims/{claimId}/transactions (txn_type=RESERVE_SET)"
        actor: ClaimsAdjuster
        preconditions:
          - "expected_policy_version matches Policy.version (ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Append ClaimTransaction; recompute incurred_cents; cascade aggregate_erosion and policy_posture"
          - "increments Policy.version by 1"

  - entity: PremiumAudit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audits/{auditId}/start"
        actor: PremiumAuditor
        preconditions:
          - "Policy.status == EXPIRED (ERR_POLICY_NOT_AUDITABLE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /audits/{auditId}/complete"
        actor: PremiumAuditor
        preconditions:
          - "At least one ExposureRecord exists for this audit (ERR_NO_EXPOSURE_RECORDS)"
        side_effects:
          - "Compute audited_exposure_units, computed_audited_premium_cents (calc audited_premium), net_adjustment_cents"

      - from: COMPLETED
        to: WAIVED
        trigger: "POST /audits/{auditId}/finalize (auto-branch: small adjustment)"
        actor: PremiumAuditor
        preconditions:
          - "abs(net_adjustment_cents) <= Insurer.audit_waiver_threshold_cents"
        side_effects:
          - "Policy -> AUDIT_CLOSED; Policy.audited_premium_cents = estimated_premium_cents (cascade)"

      - from: COMPLETED
        to: FINALIZED
        trigger: "POST /audits/{auditId}/finalize (auto-branch: material adjustment)"
        actor: PremiumAuditor
        preconditions:
          - "abs(net_adjustment_cents) > Insurer.audit_waiver_threshold_cents"
          - "expected_policy_version matches Policy.version (ERR_STALE_POLICY_VERSION)"
        side_effects:
          - "Policy -> AUDIT_CLOSED; Policy.audited_premium_cents = computed_audited_premium_cents (cascade)"
          - "increments Policy.version by 1"

      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /audits/{auditId}/dispute"
        actor: InsurerAdmin
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: IN_PROGRESS
        trigger: "POST /audits/{auditId}/reopen"
        actor: PremiumAuditor
        preconditions: []
        side_effects:
          - "revision_round += 1; clears computed_audited_premium_cents and net_adjustment_cents (recomputed on next complete)"
    note: "DISPUTED -> IN_PROGRESS -> COMPLETED -> DISPUTED forms a revision cycle (non-linear)."

  - entity: AdditionalInsuredEndorsement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (auto when a newer ACTIVE endorsement is created for the same certificate_holder_id on the same policy)"
        actor: system
        preconditions: []
        side_effects:
          - "Any ISSUED CertificateOfInsurance pointing at this endorsement -> REVOKED (cascade)"

      - from: ACTIVE
        to: VOID
        trigger: "POST /endorsements/{endorsementId}/void"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Any ISSUED CertificateOfInsurance pointing at this endorsement -> REVOKED (cascade)"

  - entity: CertificateOfInsurance
    initial_state: DRAFT
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /certificates/{certificateId}/issue"
        actor: Underwriter
        preconditions:
          - "Policy.status == IN_FORCE (ERR_POLICY_NOT_IN_FORCE)"
          - "Policy.posture != EXHAUSTED (ERR_POLICY_EXHAUSTED)"
          - "names_as_additional_insured==true => additional_insured_endorsement_id non-null AND its endorsement is ACTIVE AND its certificate_holder_id == this COI certificate_holder_id (ERR_AI_ENDORSEMENT_MISSING)"
        side_effects:
          - "Freeze snapshot_each_occurrence_cents = Policy.each_occurrence_limit_cents"
          - "Freeze snapshot_general_aggregate_remaining_cents = Policy.general_aggregate_remaining_cents"
          - "Set issue_date = Insurer.current_date"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /certificates/{certificateId}/revoke"
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: EXPIRED
        trigger: "system (auto when the parent Policy transitions IN_FORCE -> EXPIRED on clock advance)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-txn-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /claims/{claimId}/transactions"
    occ_field: "expected_policy_version"
    description: |
      Posting a ClaimTransaction against a Policy whose version has advanced
      since the adjuster last observed it is rejected. The transaction's erosion
      math is computed against the aggregate-remaining the adjuster saw; if a
      prior transaction (on this or a sibling claim) has since eroded the
      aggregate and bumped Policy.version, the writer's view of remaining room
      is stale and the post is rejected. expected_policy_version is omitted only
      on the very first RESERVE_SET that opens a claim (no prior observation to
      pin); every subsequent transaction supplies it.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: audit-finalize-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /audits/{auditId}/finalize"
    occ_field: "expected_policy_version"
    description: |
      Finalizing a PremiumAudit (which writes Policy.audited_premium_cents and
      drives the policy to AUDIT_CLOSED) against a Policy whose version advanced
      since the auditor computed the net adjustment is rejected, since a late
      claim transaction may have changed the policy state the adjustment was
      computed against.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_premium
    trigger: "Policy DRAFT -> BOUND (POST /policies/{policyId}/bind)"
    algorithm: tiered_pricing
    formula: |
      basis_units = Policy.estimated_exposure_units            # whole dollars
      raw = floor(basis_units / 1000) * Policy.rate_per_unit_cents
      # rate_per_unit_cents is cents per $1,000 of basis; partial thousands are
      # truncated (floor) BEFORE multiplying, NOT rounded.
      estimated_premium_cents = max(raw, Policy.minimum_premium_cents)
    input_set: "Single Policy at bind time"
    constants:
      BASIS_DIVISOR: 1000
    precision: "integer cents; floor on basis/1000 BEFORE multiply (per-unit-then-multiply order pinned)"
    variants:
      - name: estimated
        when: "at bind, from estimated_exposure_units"
        difference: "uses the estimate supplied at binding; populates estimated_premium_cents"

  - name: audited_premium
    trigger: "PremiumAudit IN_PROGRESS -> COMPLETED (POST /audits/{auditId}/complete)"
    algorithm: tiered_pricing
    formula: |
      audited_exposure_units = sum(ExposureRecord.basis_amount_units
                                   for records of this audit)            # order-independent sum
      raw = floor(audited_exposure_units / 1000) * Policy.rate_per_unit_cents
      computed_audited_premium_cents = max(raw, Policy.minimum_premium_cents)
      net_adjustment_cents = computed_audited_premium_cents - Policy.estimated_premium_cents
    input_set: "All ExposureRecord rows under the audit; Policy.rate_per_unit_cents and minimum_premium_cents"
    constants:
      BASIS_DIVISOR: 1000
    precision: "integer cents; SAME floor-then-multiply order as estimated_premium so the two are reconcilable"
    variants:
      - name: audited
        when: "at audit complete, from summed ExposureRecord exposure"
        difference: "DUAL-VARIANT vs estimated_premium: identical rate/minimum, actual audited exposure replaces the estimate; net_adjustment_cents is the signed reconciliation delta (+ additional premium owed by insured, - return premium owed to insured)"

  - name: coverage_test
    trigger: "First RESERVE_SET on a Claim (OPEN/REOPENED -> RESERVED)"
    algorithm: threshold
    formula: |
      eff = Policy.effective_date ; exp = Policy.expiration_date    # period is [eff, exp)
      if Policy.coverage_trigger == OCCURRENCE:
        # OCCURRENCE: the OCCURRENCE must fall within the policy period.
        covered = (occurrence_date >= eff) AND (occurrence_date < exp)
        if not covered: reject ERR_OCCURRENCE_OUTSIDE_PERIOD
      else:  # CLAIMS_MADE
        # CLAIMS-MADE: the CLAIM must be REPORTED within the period AND the
        # occurrence must be on/after the retroactive_date.
        occ_after_retro = (occurrence_date >= Policy.retroactive_date)
        if not occ_after_retro: reject ERR_CLAIM_BEFORE_RETRO_DATE
        reported_in_period = (reported_date >= eff) AND (reported_date < exp)
        if not reported_in_period: reject ERR_OCCURRENCE_OUTSIDE_PERIOD
    input_set: "Single Claim + its Policy; boundary is half-open [effective_date, expiration_date)"
    precision: "datetime comparison; lower bound inclusive, upper bound exclusive"
    variants:
      - name: occurrence_trigger
        when: "Policy.coverage_trigger == OCCURRENCE"
        difference: "gates on occurrence_date within period; reported_date and retroactive_date are ignored"
      - name: claims_made_trigger
        when: "Policy.coverage_trigger == CLAIMS_MADE"
        difference: "DUAL-VARIANT vs occurrence: gates on reported_date within period AND occurrence_date >= retroactive_date; the SAME (occurrence_date, reported_date) pair can be covered under one trigger and excluded under the other; ERR_CLAIM_BEFORE_RETRO_DATE is checked before ERR_OCCURRENCE_OUTSIDE_PERIOD"

  - name: claim_incurred
    trigger: "Any ClaimTransaction append; Claim close/deny/reopen"
    algorithm: aggregation
    formula: |
      open_reserve = sum(RESERVE_SET.amount_cents) - sum(RESERVE_RELEASE.amount_cents)
      open_reserve = max(open_reserve, 0)
      payments = sum(PAYMENT.amount_cents)
      recoveries = sum(RECOVERY.amount_cents)
      incurred_cents = max(open_reserve + payments - recoveries, 0)
    input_set: "All ClaimTransaction rows of the claim; replayed by posted_sequence ASC (the sum is order-independent, posted_sequence pins replay)"
    precision: "integer cents; floored at 0"

  - name: aggregate_erosion
    trigger: "Cascade after claim_incurred recompute (transaction append, close, deny, reopen)"
    algorithm: waterfall_allocation
    formula: |
      # Per claim, recognized erosion is capped at the per-occurrence limit FIRST,
      # then claims fill their bucket's aggregate in posted order.
      for each non-DENIED claim of the policy, ordered by
          (first RESERVE_SET posted_sequence ASC, then Claim.created_at ASC):
        per_occ_capped = min(claim.incurred_cents, Policy.each_occurrence_limit_cents)
        bucket = claim.aggregate_bucket            # GENERAL or PRODUCTS
        limit  = (general_aggregate_limit_cents if bucket==GENERAL
                  else products_aggregate_limit_cents)
        room   = limit - cumulative_recognized[bucket]
        recognized = min(per_occ_capped, max(room, 0))
        claim.recognized_incurred_cents = recognized
        cumulative_recognized[bucket] += recognized
      general_aggregate_remaining_cents = max(general_aggregate_limit_cents
                                              - cumulative_recognized[GENERAL], 0)
      products_aggregate_remaining_cents = max(products_aggregate_limit_cents
                                              - cumulative_recognized[PRODUCTS], 0)
    input_set: "All non-DENIED claims of the policy; DENIED claims contribute 0; partitioned by aggregate_bucket"
    precision: "integer cents; per-occurrence cap applied BEFORE aggregate cap; ordering pinned by first-RESERVE_SET posted_sequence then Claim.created_at"
    variants:
      - name: general_bucket
        when: "claim.aggregate_bucket == GENERAL"
        difference: "erodes general_aggregate_remaining_cents only; BODILY_INJURY and PROPERTY_DAMAGE losses"
      - name: products_bucket
        when: "claim.aggregate_bucket == PRODUCTS"
        difference: "erodes products_aggregate_remaining_cents independently; PRODUCTS losses never touch the general aggregate and vice versa (the two aggregates are separately conserved)"

  - name: policy_posture
    trigger: "Cascade after aggregate_erosion recompute"
    algorithm: threshold
    formula: |
      g = general_aggregate_remaining_cents ; p = products_aggregate_remaining_cents
      if g == 0 AND p == 0:
        posture = EXHAUSTED
      elif g <= floor(general_aggregate_limit_cents * IMPAIRED_FRACTION_NUM / IMPAIRED_FRACTION_DEN)
           OR p <= floor(products_aggregate_limit_cents * IMPAIRED_FRACTION_NUM / IMPAIRED_FRACTION_DEN):
        posture = IMPAIRED
      else:
        posture = HEALTHY
    input_set: "Policy aggregate-remaining fields after erosion"
    constants:
      IMPAIRED_FRACTION_NUM: 1
      IMPAIRED_FRACTION_DEN: 4       # IMPAIRED when a bucket's remaining drops to <= 25% of its limit
    precision: "integer comparison; threshold uses <= (at exactly 25% remaining the policy IS impaired)"

  - name: loss_run_snapshot
    trigger: "POST /policies/{policyId}/loss-runs (generate)"
    algorithm: aggregation
    formula: |
      cutoff = Insurer.current_date
      included = { claims of policy with reported_date <= cutoff }
      total_incurred_cents = sum(c.incurred_cents for c in included)
      general_incurred_cents = sum(c.incurred_cents for c in included if c.aggregate_bucket==GENERAL)
      products_incurred_cents = sum(c.incurred_cents for c in included if c.aggregate_bucket==PRODUCTS)
      claim_count = count(included)
      open_claim_count = count(c in included where c.status not in {CLOSED, DENIED})
    input_set: "All claims of the policy with reported_date <= Insurer.current_date at generation; DENIED claims included in claim_count but contribute incurred 0"
    precision: "integer cents; snapshot is immutable once written (later claim changes do not mutate an existing LossRun)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-addressed resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Body FKs (insurer_id, insured_id, policy_id, certificate_holder_id, additional_insured_endorsement_id, claim_id, premium_audit_id) resolve, and cross-insurer references are rejected"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST insureds, policies, endorsements, certificates, claims, audits, exposure-records"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCCURRENCE policy must have null retroactive_date; CLAIMS_MADE must have non-null retroactive_date <= effective_date"
    error_id: "ERR_RETRO_DATE_NOT_ALLOWED / ERR_RETRO_DATE_REQUIRED"
    http_status: 422
    applies_to: "policy bind"

  - priority: 7
    category: business_constraint
    check: "effective_date < expiration_date; products_aggregate_limit_cents <= general_aggregate_limit_cents"
    error_id: "ERR_INVALID_POLICY_PERIOD / ERR_AGGREGATE_LIMIT_INVALID"
    http_status: 422
    applies_to: "policy bind"

  - priority: 8
    category: business_temporal
    check: "Claim coverage_test: CLAIMS_MADE checks occurrence>=retro BEFORE reported-in-period; OCCURRENCE checks occurrence-in-period"
    error_id: "ERR_CLAIM_BEFORE_RETRO_DATE / ERR_OCCURRENCE_OUTSIDE_PERIOD"
    http_status: 409
    applies_to: "first RESERVE_SET transaction on a claim"

  - priority: 9
    category: business_fiscal
    check: "ClaimTransaction amount_cents must be a positive integer"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "claim transactions"

  - priority: 10
    category: business_constraint
    check: "RESERVE_RELEASE cannot exceed open reserve; RECOVERY cannot exceed cumulative payments"
    error_id: ERR_RELEASE_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "claim transactions"

  - priority: 11
    category: business_safety
    check: "COI cannot assert Additional Insured without an ACTIVE matching endorsement for the same certificate holder"
    error_id: ERR_AI_ENDORSEMENT_MISSING
    http_status: 409
    applies_to: "certificate issue"

  - priority: 12
    category: business_constraint
    check: "COI cannot be issued while Policy.posture == EXHAUSTED"
    error_id: ERR_POLICY_EXHAUSTED
    http_status: 409
    applies_to: "certificate issue"

  - priority: 13
    category: business_temporal
    check: "ai_effective_date must fall within [effective_date, expiration_date) of the policy"
    error_id: ERR_AI_DATE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST endorsements"

  - priority: 14
    category: business_constraint
    check: "PremiumAudit.audit_basis must equal Policy.premium_basis"
    error_id: ERR_AUDIT_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST audits"

  - priority: 15
    category: concurrency
    check: "expected_policy_version matches Policy.version for OCC-guarded writes"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "claim transactions (after the opening RESERVE_SET), audit finalize"

# =============================================================================
# Table 1.5: API Endpoint Table  (flat topology — every entity a top-level collection)
# =============================================================================
endpoints:
  # --- Insurer ---
  - method: POST
    path: "/insurers"
    description: "Create an Insurer (carrier tenant)"
    roles: [InsurerAdmin]
    code: 201
    input: [name, naic_code, "audit_waiver_threshold_cents?"]
    output: Insurer
    side_effects: ["current_date initialized to 2026-01-01T00:00:00.000Z"]

  - method: GET
    path: "/insurers/{insurerId}"
    description: "Get an Insurer"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor, CertificateHolder]
    code: 200
    input: []
    output: Insurer
    side_effects: []

  - method: POST
    path: "/insurers/{insurerId}/clock"
    description: "Advance the insurer business clock (drives auto-expiry of policies)"
    roles: [InsurerAdmin]
    code: 200
    input: [to_iso8601]
    output: Insurer
    side_effects:
      - "current_date set to to_iso8601 (must be >= current value, else ERR_CLOCK_NOT_MONOTONIC)"
      - "Any IN_FORCE policy with current_date >= expiration_date -> EXPIRED (cascade -> its ISSUED COIs -> EXPIRED)"

  # --- Insured ---
  - method: POST
    path: "/insureds"
    description: "Create a Named Insured"
    roles: [InsurerAdmin, Underwriter]
    code: 201
    input: [insurer_id, legal_name, fein, primary_basis]
    output: Insured
    side_effects: ["ERR_DUPLICATE_FEIN if fein already used within insurer"]

  - method: GET
    path: "/insureds/{insuredId}"
    description: "Get a Named Insured"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: []
    output: Insured
    side_effects: []

  - method: GET
    path: "/insureds"
    description: "List Named Insureds (reverse-reachability for Insured.insurer_id)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["insurer_id?"]
    output: "Insured[]"
    side_effects: []

  # --- CertificateHolder ---
  - method: POST
    path: "/certificate-holders"
    description: "Create a Certificate Holder"
    roles: [InsurerAdmin, Underwriter]
    code: 201
    input: [insurer_id, holder_name, address]
    output: CertificateHolder
    side_effects: []

  - method: GET
    path: "/certificate-holders/{holderId}"
    description: "Get a Certificate Holder"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor, CertificateHolder]
    code: 200
    input: []
    output: CertificateHolder
    side_effects: []

  - method: GET
    path: "/certificate-holders"
    description: "List Certificate Holders (reverse-reachability for CertificateHolder.insurer_id)"
    roles: [InsurerAdmin, Underwriter, PremiumAuditor]
    code: 200
    input: ["insurer_id?"]
    output: "CertificateHolder[]"
    side_effects: []

  # --- Policy ---
  - method: POST
    path: "/policies"
    description: "Create a draft Policy"
    roles: [Underwriter]
    code: 201
    input: [insurer_id, insured_id, policy_number, coverage_trigger, "retroactive_date?", effective_date, expiration_date, each_occurrence_limit_cents, general_aggregate_limit_cents, products_aggregate_limit_cents, premium_basis, rate_per_unit_cents, minimum_premium_cents, estimated_exposure_units]
    output: Policy
    side_effects: ["status=DRAFT; ERR_DUPLICATE_POLICY_NUMBER if policy_number used within insurer"]

  - method: GET
    path: "/policies/{policyId}"
    description: "Get a Policy (includes posture, aggregate-remaining, premiums)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor, CertificateHolder]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List Policies (reverse-reachability for Policy.insurer_id and Policy.insured_id)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["insurer_id?", "insured_id?", "status?"]
    output: "Policy[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/bind"
    description: "Bind a draft Policy (computes estimated premium, initializes aggregates)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status -> BOUND; estimated_premium_cents computed; aggregates initialized; posture=HEALTHY; increments Policy.version by 1"]

  - method: POST
    path: "/policies/{policyId}/activate"
    description: "Activate a bound Policy into force"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status -> IN_FORCE; increments Policy.version by 1"]

  - method: POST
    path: "/policies/{policyId}/cancel"
    description: "Cancel a Policy"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["status -> CANCELLED; cascade VOID endorsements + REVOKE COIs (if IN_FORCE); increments Policy.version by 1"]

  # --- Additional Insured Endorsement ---
  - method: POST
    path: "/endorsements"
    description: "Add an Additional Insured Endorsement to a policy"
    roles: [Underwriter]
    code: 201
    input: [policy_id, certificate_holder_id, form_number, ai_effective_date]
    output: AdditionalInsuredEndorsement
    side_effects:
      - "status=ACTIVE; scope derived from form_number"
      - "Any prior ACTIVE endorsement for same certificate_holder_id on this policy -> SUPERSEDED (cascade -> its ISSUED COIs -> REVOKED)"

  - method: GET
    path: "/endorsements/{endorsementId}"
    description: "Get an Endorsement"
    roles: [InsurerAdmin, Underwriter, CertificateHolder, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: []
    output: AdditionalInsuredEndorsement
    side_effects: []

  - method: GET
    path: "/endorsements"
    description: "List Endorsements (reverse-reachability for AdditionalInsuredEndorsement.policy_id and .certificate_holder_id)"
    roles: [InsurerAdmin, Underwriter, CertificateHolder, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["policy_id?", "certificate_holder_id?", "status?"]
    output: "AdditionalInsuredEndorsement[]"
    side_effects: []

  - method: POST
    path: "/endorsements/{endorsementId}/void"
    description: "Void an Endorsement"
    roles: [Underwriter]
    code: 200
    input: []
    output: AdditionalInsuredEndorsement
    side_effects: ["status -> VOID; cascade REVOKE its ISSUED COIs"]

  # --- Certificate of Insurance ---
  - method: POST
    path: "/certificates"
    description: "Create a draft Certificate of Insurance"
    roles: [Underwriter]
    code: 201
    input: [policy_id, certificate_holder_id, "additional_insured_endorsement_id?", "names_as_additional_insured?"]
    output: CertificateOfInsurance
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/certificates/{certificateId}"
    description: "Get a Certificate of Insurance"
    roles: [InsurerAdmin, Underwriter, CertificateHolder, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: []
    output: CertificateOfInsurance
    side_effects: []

  - method: GET
    path: "/certificates"
    description: "List Certificates (reverse-reachability for CertificateOfInsurance.policy_id, .certificate_holder_id, .additional_insured_endorsement_id)"
    roles: [InsurerAdmin, Underwriter, CertificateHolder, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["policy_id?", "certificate_holder_id?", "additional_insured_endorsement_id?", "status?"]
    output: "CertificateOfInsurance[]"
    side_effects: []

  - method: POST
    path: "/certificates/{certificateId}/issue"
    description: "Issue (snapshot) a Certificate of Insurance"
    roles: [Underwriter]
    code: 200
    input: []
    output: CertificateOfInsurance
    side_effects: ["status -> ISSUED; freeze snapshot limits; set issue_date=Insurer.current_date"]

  - method: POST
    path: "/certificates/{certificateId}/revoke"
    description: "Revoke an issued Certificate of Insurance"
    roles: [Underwriter]
    code: 200
    input: []
    output: CertificateOfInsurance
    side_effects: ["status -> REVOKED"]

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "Open a Claim against a policy"
    roles: [ClaimsAdjuster]
    code: 201
    input: [policy_id, claimant_name, loss_type, occurrence_date, reported_date]
    output: Claim
    side_effects: ["status=OPEN; aggregate_bucket derived from loss_type"]

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a Claim (includes incurred/recognized)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List Claims (reverse-reachability for Claim.policy_id)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["policy_id?", "loss_type?", "status?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/transactions"
    description: "Post a financial transaction (reserve/payment/recovery/release) on a claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: [txn_type, amount_cents, "expected_policy_version?", "memo?"]
    output: ClaimTransaction
    side_effects:
      - "Append ClaimTransaction with next posted_sequence; recompute Claim.incurred_cents"
      - "Cascade aggregate_erosion -> Policy aggregate-remaining; cascade policy_posture"
      - "Claim state advances OPEN/REOPENED->RESERVED (RESERVE_SET) or RESERVED->PAID (PAYMENT)"
      - "increments Policy.version by 1"

  - method: GET
    path: "/claim-transactions/{transactionId}"
    description: "Get a single claim transaction"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: []
    output: ClaimTransaction
    side_effects: []

  - method: GET
    path: "/claim-transactions"
    description: "List claim transactions in posted order (reverse-reachability for ClaimTransaction.claim_id)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 200
    input: ["claim_id?", "txn_type?"]
    output: "ClaimTransaction[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/close"
    description: "Close a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> CLOSED; cascade aggregate_erosion + policy_posture; increments Policy.version by 1"]

  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> DENIED; release erosion this claim caused; cascade policy_posture; increments Policy.version by 1"]

  - method: POST
    path: "/claims/{claimId}/reopen"
    description: "Reopen a closed claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> REOPENED; increments Policy.version by 1"]

  # --- Premium Audit ---
  - method: POST
    path: "/audits"
    description: "Schedule a premium audit on an expired policy"
    roles: [PremiumAuditor, InsurerAdmin]
    code: 201
    input: [policy_id, audit_basis]
    output: PremiumAudit
    side_effects: ["status=SCHEDULED; revision_round=0"]

  - method: GET
    path: "/audits/{auditId}"
    description: "Get a Premium Audit"
    roles: [InsurerAdmin, Underwriter, PremiumAuditor]
    code: 200
    input: []
    output: PremiumAudit
    side_effects: []

  - method: GET
    path: "/audits"
    description: "List Audits (reverse-reachability for PremiumAudit.policy_id)"
    roles: [InsurerAdmin, Underwriter, PremiumAuditor]
    code: 200
    input: ["policy_id?", "status?"]
    output: "PremiumAudit[]"
    side_effects: []

  - method: POST
    path: "/audits/{auditId}/start"
    description: "Start the audit (SCHEDULED -> IN_PROGRESS)"
    roles: [PremiumAuditor]
    code: 200
    input: []
    output: PremiumAudit
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/audits/{auditId}/exposure-records"
    description: "Record an audited exposure line for a class code"
    roles: [PremiumAuditor]
    code: 201
    input: [class_code, basis_amount_units]
    output: ExposureRecord
    side_effects: ["recompute audited_exposure_units on the audit"]

  - method: GET
    path: "/exposure-records/{exposureRecordId}"
    description: "Get an exposure record"
    roles: [InsurerAdmin, Underwriter, PremiumAuditor]
    code: 200
    input: []
    output: ExposureRecord
    side_effects: []

  - method: GET
    path: "/exposure-records"
    description: "List exposure records (reverse-reachability for ExposureRecord.premium_audit_id)"
    roles: [InsurerAdmin, Underwriter, PremiumAuditor]
    code: 200
    input: ["premium_audit_id?", "class_code?"]
    output: "ExposureRecord[]"
    side_effects: []

  - method: POST
    path: "/audits/{auditId}/complete"
    description: "Complete the audit (computes audited premium + net adjustment)"
    roles: [PremiumAuditor]
    code: 200
    input: []
    output: PremiumAudit
    side_effects: ["status -> COMPLETED; compute computed_audited_premium_cents + net_adjustment_cents"]

  - method: POST
    path: "/audits/{auditId}/dispute"
    description: "Dispute a completed audit"
    roles: [InsurerAdmin]
    code: 200
    input: []
    output: PremiumAudit
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/audits/{auditId}/reopen"
    description: "Reopen a disputed audit for revision"
    roles: [PremiumAuditor]
    code: 200
    input: []
    output: PremiumAudit
    side_effects: ["status -> IN_PROGRESS; revision_round += 1; clears computed premium for recompute"]

  - method: POST
    path: "/audits/{auditId}/finalize"
    description: "Finalize a completed audit; auto-branches WAIVED vs FINALIZED on the waiver threshold"
    roles: [PremiumAuditor]
    code: 200
    input: [expected_policy_version]
    output: PremiumAudit
    side_effects:
      - "If abs(net_adjustment_cents) <= waiver threshold: status -> WAIVED; Policy.audited_premium_cents = estimated_premium_cents"
      - "Else: status -> FINALIZED; Policy.audited_premium_cents = computed_audited_premium_cents; increments Policy.version by 1"
      - "Policy -> AUDIT_CLOSED (cascade)"

  # --- Loss Run ---
  - method: POST
    path: "/policies/{policyId}/loss-runs"
    description: "Generate an immutable loss-run snapshot at the current insurer clock"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor]
    code: 201
    input: []
    output: LossRun
    side_effects: ["snapshot as_of_date=Insurer.current_date; compute incurred totals + claim counts"]

  - method: GET
    path: "/loss-runs/{lossRunId}"
    description: "Get a Loss Run snapshot"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor, CertificateHolder]
    code: 200
    input: []
    output: LossRun
    side_effects: []

  - method: GET
    path: "/loss-runs"
    description: "List Loss Run snapshots (reverse-reachability for LossRun.policy_id)"
    roles: [InsurerAdmin, Underwriter, ClaimsAdjuster, PremiumAuditor, CertificateHolder]
    code: 200
    input: ["policy_id?"]
    output: "LossRun[]"
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Existence / reference ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-addressed resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A body foreign key does not resolve, or points across insurer boundaries" }

  # --- Request validation ---
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "ClaimTransaction amount_cents not a positive integer" }
  - { id: ERR_DUPLICATE_FEIN, http: 409, condition: "Insured fein already used within the insurer" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "policy_number already used within the insurer" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "clock set to a time earlier than current current_date" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state allowing the requested transition" }

  # --- Policy structural constraints ---
  - { id: ERR_RETRO_DATE_REQUIRED, http: 422, condition: "CLAIMS_MADE policy missing retroactive_date or retroactive_date > effective_date" }
  - { id: ERR_RETRO_DATE_NOT_ALLOWED, http: 422, condition: "OCCURRENCE policy supplied a non-null retroactive_date" }
  - { id: ERR_INVALID_POLICY_PERIOD, http: 422, condition: "effective_date not strictly before expiration_date" }
  - { id: ERR_AGGREGATE_LIMIT_INVALID, http: 422, condition: "products_aggregate_limit_cents exceeds general_aggregate_limit_cents" }
  - { id: ERR_POLICY_NOT_YET_EFFECTIVE, http: 409, condition: "Activate attempted before Insurer.current_date reaches effective_date" }
  - { id: ERR_POLICY_NOT_IN_FORCE, http: 409, condition: "Operation requires Policy.status == IN_FORCE" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_CANCEL, http: 409, condition: "Cannot cancel an IN_FORCE policy with non-terminal claims" }

  # --- Coverage / claims ---
  - { id: ERR_OCCURRENCE_OUTSIDE_PERIOD, http: 409, condition: "OCCURRENCE: occurrence_date outside policy period; or CLAIMS_MADE: reported_date outside period" }
  - { id: ERR_CLAIM_BEFORE_RETRO_DATE, http: 409, condition: "CLAIMS_MADE: occurrence_date earlier than retroactive_date" }
  - { id: ERR_RELEASE_EXCEEDS_RESERVE, http: 422, condition: "RESERVE_RELEASE exceeds open reserve, or RECOVERY exceeds cumulative payments" }
  - { id: ERR_OPEN_RESERVE_REMAINS, http: 409, condition: "Cannot close a claim while net open reserve > 0" }
  - { id: ERR_PAID_CLAIM_CANNOT_DENY, http: 409, condition: "Cannot deny a claim that already has a PAYMENT transaction" }

  # --- Certificates / endorsements ---
  - { id: ERR_AI_ENDORSEMENT_MISSING, http: 409, condition: "COI asserts Additional Insured without an ACTIVE matching endorsement for the same holder" }
  - { id: ERR_AI_DATE_OUTSIDE_PERIOD, http: 422, condition: "ai_effective_date not within the policy period" }
  - { id: ERR_POLICY_EXHAUSTED, http: 409, condition: "Cannot issue a COI while Policy.posture == EXHAUSTED" }

  # --- Audit ---
  - { id: ERR_POLICY_NOT_AUDITABLE, http: 409, condition: "Audit start requires Policy.status == EXPIRED" }
  - { id: ERR_AUDIT_BASIS_MISMATCH, http: 422, condition: "audit_basis does not equal Policy.premium_basis" }
  - { id: ERR_NO_EXPOSURE_RECORDS, http: 409, condition: "Cannot complete an audit with zero exposure records" }

  # --- Concurrency ---
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version does not match Policy.version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: InsurerAdmin
    description: "Carrier operations superuser: creates insurer/insured/holder, advances the clock, schedules and disputes audits, reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /insurers — Create insurer"
      - "POST /insurers/{id}/clock — Advance clock"
      - "POST /audits/{id}/dispute — Dispute completed audit"
    shared_operations:
      - "POST /insureds — with Underwriter"
      - "POST /certificate-holders — with Underwriter"
      - "POST /audits — with PremiumAuditor"
      - "POST /policies/{id}/loss-runs — generate loss run"
      - "GET endpoints — broad read"

  - name: Underwriter
    description: "Owns policy issuance lifecycle, endorsements, and certificates"
    identity: opaque
    exclusive_operations:
      - "POST /policies — Create policy"
      - "POST /policies/{id}/bind — Bind policy"
      - "POST /policies/{id}/activate — Activate policy"
      - "POST /policies/{id}/cancel — Cancel policy"
      - "POST /endorsements — Create endorsement"
      - "POST /endorsements/{id}/void — Void endorsement"
      - "POST /certificates — Create certificate"
      - "POST /certificates/{id}/issue — Issue certificate"
      - "POST /certificates/{id}/revoke — Revoke certificate"
    shared_operations:
      - "POST /insureds — with InsurerAdmin"
      - "POST /certificate-holders — with InsurerAdmin"
      - "POST /policies/{id}/loss-runs — generate loss run"
      - "GET endpoints — broad read"

  - name: ClaimsAdjuster
    description: "Owns claims and claim financial transactions; drives aggregate erosion"
    identity: opaque
    exclusive_operations:
      - "POST /claims — Open claim"
      - "POST /claims/{id}/transactions — Post claim transaction"
      - "POST /claims/{id}/close — Close claim"
      - "POST /claims/{id}/deny — Deny claim"
      - "POST /claims/{id}/reopen — Reopen claim"
    shared_operations:
      - "POST /policies/{id}/loss-runs — generate loss run"
      - "GET endpoints — broad read"

  - name: PremiumAuditor
    description: "Owns premium audits, exposure records, audit lifecycle and finalization"
    identity: opaque
    exclusive_operations:
      - "POST /audits/{id}/start — Start audit"
      - "POST /audits/{id}/exposure-records — Record exposure"
      - "POST /audits/{id}/complete — Complete audit"
      - "POST /audits/{id}/reopen — Reopen disputed audit"
      - "POST /audits/{id}/finalize — Finalize audit"
    shared_operations:
      - "POST /audits — with InsurerAdmin"
      - "POST /policies/{id}/loss-runs — generate loss run"
      - "GET endpoints — broad read"

  - name: CertificateHolder
    description: "Entity-backed third party: read-only access to its certificates, endorsements, policy summary, and loss runs"
    identity: "entity_backed:CertificateHolder"
    exclusive_operations: []
    shared_operations:
      - "GET /certificates, /endorsements, /policies/{id}, /loss-runs — read certificate-relevant data"
