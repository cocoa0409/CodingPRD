scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: meal_count_ledger_vs_census_billing
        grounds:
          - calculations.meal_count_reconciliation
          - calculations.ticket_billed_amount
          - entities.BillingReconciliation.fields.ticket_ledger_total_cents
          - entities.BillingReconciliation.fields.census_projection_total_cents
          - entities.BillingReconciliation.fields.variance_cents
          - state_machines.BillingReconciliation.none_to_RECONCILED
        distinguishing_aspect: |
          This dual variant lives in the billing domain on BillingReconciliation: TICKET_LEDGER
          prices what the point of service recorded while CENSUS_PROJECTION prices the
          reservation book, so one RESERVED-never-seated DINNER reservation (800) and one
          walk-in RESIDENT LUNCH ticket (650) over the identical period produce
          ticket_ledger_total_cents 650 against census_projection_total_cents 800.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community with one MAIN_DINING venue of seat_capacity 20."
            - "One ACTIVE resident holding a DietOrder with clinical_status ACTIVE and review_status APPROVED."
            - "One DINNER reservation on 2026-08-10 left in RESERVED (never seated) — visible to CENSUS_PROJECTION only."
            - "One walk-in RESIDENT LUNCH ticket on 2026-08-10 moved to SERVED — visible to TICKET_LEDGER only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Riverbend", care_levels_offered: ["ASSISTED_LIVING", "MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Riverbend Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 20, care_levels_served: ["ASSISTED_LIVING", "MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Ada Lin", care_level: "ASSISTED_LIVING", baseline_weight_kg: 78.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v1: $.data.version }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v_id}", service_date: "2026-08-10", meal_period: "DINNER", seat_start_utc: "2026-08-10T18:00:00Z", party_size: 1, expected_venue_version: "${v_v1}" }
              as: DiningServicesManager
              captures: { res_id: $.data.id }
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "RESIDENT", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { t_id: $.data.id }
            - call: "POST /meal-tickets/${t_id}/serve"
              payload: {}
              as: DiningServicesManager
          trigger:
            - call: "POST /reconciliations"
              payload: { community_id: "${c_id}", period_start_date: "2026-08-10", period_end_date: "2026-08-10" }
              as: BillingSpecialist
              captures: { rec_id: $.data.id }
          assert:
            - "BillingReconciliation.${rec_id}.ticket_ledger_total_cents == 650"
            - "BillingReconciliation.${rec_id}.census_projection_total_cents == 800"
            - "BillingReconciliation.${rec_id}.variance_cents == -150"
            - "BillingReconciliation.${rec_id}.ledger_meal_counts == { RESIDENT: 1, GUEST: 0, TAKEOUT: 0 }"
            - "BillingReconciliation.${rec_id}.census_meal_counts == { RESIDENT: 1, GUEST: 0, TAKEOUT: 0 }"
            - "BillingReconciliation.${rec_id}.pre_fee_base_cents == 650"
            - "BillingReconciliation.${rec_id}.administrative_fee_cents == 39"
            - "BillingReconciliation.${rec_id}.net_billable_total_cents == 689"
            - "SeatingReservation.${res_id}.status == RESERVED (it was never seated, yet it still priced 800 into CENSUS_PROJECTION)"
      - name: weight_trend_rolling_vs_baseline_clinical
        grounds:
          - calculations.resident_weight_trend
          - entities.Resident.fields.rolling_30d_weight_change_pct
          - entities.Resident.fields.baseline_weight_change_pct
          - entities.Resident.fields.baseline_weight_kg
          - state_machines.PlanOfCareReview.none_to_OPEN
        distinguishing_aspect: |
          This dual variant lives in the clinical domain on Resident, not on any billing row:
          for baseline 78.0 kg with observations 80.0 kg (2026-08-02) then 76.0 kg (2026-08-20),
          ROLLING_30D reads -5.00 and opens a PlanOfCareReview while BASELINE_ANCHORED reads
          -2.56 and would not have opened one, proving only ROLLING_30D gates.
        test_recipe:
          setup:
            - "One community and one resident with baseline_weight_kg 78.0 and no diet order."
            - "Logical clock at 2026-08-02T08:00:00Z when the first observation (80.0 kg, intake 80) is recorded."
            - "Logical clock advanced to 2026-08-20T08:00:00Z; both observations stay inside the 30-day rolling window [2026-07-21, 2026-08-20]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Elmhurst", care_levels_offered: ["ASSISTED_LIVING", "MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Bea Ortiz", care_level: "ASSISTED_LIVING", baseline_weight_kg: 78.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-02", meal_period: "LUNCH", intake_pct: 80, weight_kg: 80.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 60, weight_kg: 76.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs2_id: $.data.id }
            - call: "GET /plan-of-care-reviews"
              payload: { resident_id: "${r_id}", status: "OPEN" }
              as: RegisteredDietitian
              captures: { rev_id: "$.data[0].id", rev_reason: "$.data[0].trigger_reason", rev_score: "$.data[0].risk_score_at_open" }
          assert:
            - "Resident.${r_id}.rolling_30d_weight_change_pct == -5.00"
            - "Resident.${r_id}.baseline_weight_change_pct == -2.56"
            - "Resident.${r_id}.current_weight_kg == 76.0"
            - "Resident.${r_id}.avg_intake_pct_7d == 60.00 (only the 2026-08-20 observation is inside the 7-day window)"
            - "Resident.${r_id}.intake_risk_score == 45.00"
            - "${rev_reason} == WEIGHT_LOSS_30D (the -2.56 baseline variant is above the -5.00 trigger and could not have opened this review)"
            - "${rev_score} == 45.00"
            - "PlanOfCareReview.${rev_id}.trigger_observation_id == ${obs2_id}"

  - rule_id: combinatorial_formula
    instances:
      - name: ticket_amount_round_per_component_then_sum
        grounds:
          - calculations.ticket_billed_amount
          - entities.MealServiceTicket.fields.billed_amount_cents
          - entities.Community.fields.guest_meal_sponsor_cap_cents
          - state_machines.MealServiceTicket.none_to_ISSUED
        distinguishing_aspect: |
          Mode (b): the scaffold pins "round each component then sum". A sponsored TAKEOUT
          DINNER ticket must bill 1549 cents (discount 181 + subtotal 1444 + tax 105); summing
          the unrounded components and rounding once at the end yields 1548, so the two
          rounding orders are distinguishable in a single assertion.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community (guest_meal_sponsor_cap_cents at its 20000 default) with one BISTRO venue."
            - "One ACTIVE resident who sponsors both tickets, so SPONSOR_DISCOUNT_PCT applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Fairhaven", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Fairhaven Bistro", venue_kind: "BISTRO", seat_capacity: 12, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Cal Vega", care_level: "ASSISTED_LIVING", baseline_weight_kg: 70.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "TAKEOUT", service_date: "2026-08-10", meal_period: "DINNER", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { t_takeout_id: $.data.id, t_takeout_amount: $.data.billed_amount_cents }
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { t_guest_id: $.data.id, t_guest_amount: $.data.billed_amount_cents }
          assert:
            - "${t_takeout_amount} == 1549"
            - "${t_takeout_amount} != 1548 (the sum-then-round order is wrong)"
            - "${t_guest_amount} == 1173"
            - "Resident.${r_id}.guest_meal_charge_balance_cents == 2722"
            - "MealServiceTicket.${t_takeout_id}.status == ISSUED"
            - "MealServiceTicket.${t_guest_id}.status == ISSUED"
      - name: net_billable_fee_tier_keyed_on_pre_fee_base
        grounds:
          - calculations.reconciliation_net_billable
          - calculations.ticket_billed_amount
          - entities.BillingReconciliation.fields.pre_fee_base_cents
          - entities.BillingReconciliation.fields.administrative_fee_cents
          - entities.BillingReconciliation.fields.net_billable_total_cents
        distinguishing_aspect: |
          Mode (c): net_billable_total_cents = pre_fee_base_cents + administrative_fee_cents while
          the fee tier looks like it should key on the total. With pre_fee_base_cents 3386 the pinned
          order gives SMALL 0.06 -> fee 203 -> net 3589; keying the tier on the resulting 3589
          (> 3500 -> MID 0.045) would give fee 152 and net 3538, so the evaluation order is
          observable in one assertion.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community with one MAIN_DINING venue and one ACTIVE resident holding an APPROVED, ACTIVE DietOrder."
            - "Three unsponsored GUEST BREAKFAST tickets (912 cents each) plus one walk-in RESIDENT LUNCH ticket (650 cents), all moved to SERVED, giving a ticket ledger of 3386 cents."
            - "No voids anywhere, so void_credit_cents is 0 and pre_fee_base_cents equals the ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Northgate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Northgate Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 30, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Dee Marsh", care_level: "ASSISTED_LIVING", baseline_weight_kg: 66.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "BREAKFAST" }
              as: DiningServicesManager
              captures: { g1_id: $.data.id, g1_amount: $.data.billed_amount_cents }
            - call: "POST /meal-tickets/${g1_id}/serve"
              payload: {}
              as: DiningServicesManager
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "BREAKFAST" }
              as: DiningServicesManager
              captures: { g2_id: $.data.id }
            - call: "POST /meal-tickets/${g2_id}/serve"
              payload: {}
              as: DiningServicesManager
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "GUEST", service_date: "2026-08-10", meal_period: "BREAKFAST" }
              as: DiningServicesManager
              captures: { g3_id: $.data.id }
            - call: "POST /meal-tickets/${g3_id}/serve"
              payload: {}
              as: DiningServicesManager
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "RESIDENT", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}" }
              as: DiningServicesManager
              captures: { rt_id: $.data.id }
            - call: "POST /meal-tickets/${rt_id}/serve"
              payload: {}
              as: DiningServicesManager
          trigger:
            - call: "POST /reconciliations"
              payload: { community_id: "${c_id}", period_start_date: "2026-08-10", period_end_date: "2026-08-10" }
              as: BillingSpecialist
              captures: { rec_id: $.data.id, rec_fee: $.data.administrative_fee_cents, rec_net: $.data.net_billable_total_cents }
          assert:
            - "${g1_amount} == 912 (unsponsored GUEST BREAKFAST: no discount, tax 62)"
            - "BillingReconciliation.${rec_id}.ticket_ledger_total_cents == 3386"
            - "BillingReconciliation.${rec_id}.void_credit_cents == 0"
            - "BillingReconciliation.${rec_id}.pre_fee_base_cents == 3386"
            - "${rec_fee} == 203"
            - "${rec_fee} != 152 (that is the value produced by keying the tier on net_billable_total_cents)"
            - "${rec_net} == 3589"
            - "BillingReconciliation.${rec_id}.census_projection_total_cents == 2736"
            - "BillingReconciliation.${rec_id}.variance_cents == 650"

  - rule_id: non_linear_state_machine
    instances:
      - name: diet_order_parallel_axes_rereview_while_active
        grounds:
          - state_machines.DietOrder.APPROVED_to_REREVIEW_REQUIRED
          - state_machines.DietOrder.REREVIEW_REQUIRED_to_APPROVED
          - entities.DietOrder.fields.clinical_status
          - entities.DietOrder.fields.review_status
          - entities.DietOrder.fields.review_round
          - calculations.plan_of_care_trigger
        distinguishing_aspect: |
          DietOrder carries two independent state dimensions on one row: the monitoring cascade
          moves review_status APPROVED -> REREVIEW_REQUIRED and back to APPROVED while
          clinical_status stays ACTIVE for the whole sequence and review_round never leaves 0,
          proving the review axis moves without the clinical axis following it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T08:00:00Z, then advanced to 2026-08-20T08:00:00Z."
            - "One community and one resident with baseline_weight_kg 78.0."
            - "One DietOrder (MINCED_MOIST, MILDLY_THICK, therapeutic_codes LOW_SODIUM + RENAL) approved by rd-1, so clinical_status is ACTIVE and review_status is APPROVED."
            - "One prior observation on 2026-08-02 at 80.0 kg with intake 80, which breaches nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Larkspur", care_levels_offered: ["ASSISTED_LIVING", "MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Eli Nakamura", care_level: "ASSISTED_LIVING", baseline_weight_kg: 78.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "MINCED_MOIST", liquid_consistency: "MILDLY_THICK", therapeutic_codes: ["LOW_SODIUM", "RENAL"], expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { activated_at_1: $.data.activated_at }
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-02", meal_period: "LUNCH", intake_pct: 80, weight_kg: 80.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 60, weight_kg: 76.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "GET /diet-orders/${do_id}"
              payload: {}
              as: RegisteredDietitian
              captures: { rs_after_obs: $.data.review_status, cs_after_obs: $.data.clinical_status, rr_after_obs: $.data.review_round }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { rs_final: $.data.review_status, cs_final: $.data.clinical_status, activated_at_2: $.data.activated_at }
          assert:
            - "${rs_after_obs} == REREVIEW_REQUIRED"
            - "${cs_after_obs} == ACTIVE"
            - "${rr_after_obs} == 0 (the re-review push is not a REQUEST_CHANGES round)"
            - "${rs_final} == APPROVED"
            - "${cs_final} == ACTIVE"
            - "${activated_at_2} == ${activated_at_1} (the clinical axis never re-activated)"
            - "Resident.${r_id}.tray_card_state == CLEAR (the HOLD set by the cascade is lifted by the re-approval)"
            - "Resident.${r_id}.intake_risk_score == 75.00"
      - name: therapeutic_extension_bounded_revision_cycle
        grounds:
          - state_machines.TherapeuticExtension.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.TherapeuticExtension.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.TherapeuticExtension.SUBMITTED_to_APPROVED
          - entities.TherapeuticExtension.fields.review_round
          - entities.MenuItem.fields.extension_coverage_status
          - validations[priority=26]
          - errors[id=ERR_REVIEW_ROUND_LIMIT]
        distinguishing_aspect: |
          TherapeuticExtension is a different entity from DietOrder and its non-linearity is a
          bounded cycle rather than parallel axes: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED
          runs three times, the fourth REQUEST_CHANGES is refused with ERR_REVIEW_ROUND_LIMIT
          while review_round stays 3, and the loop still terminates through APPROVE.
        test_recipe:
          setup:
            - "One community with a DRAFT MenuCycle (2026-08-10 to 2026-08-16, week_count 1)."
            - "One MenuItem at day_index 1 / LUNCH declaring required_therapeutic_codes LOW_SODIUM, so extension_coverage_status starts INCOMPLETE."
            - "One TherapeuticExtension for LOW_SODIUM authored by rd-1 and pushed round-trip three times by reviewer rd-2, leaving review_round 3 and review_status SUBMITTED."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Saltmeadow", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 1, week_count: 1, effective_start_date: "2026-08-10", effective_end_date: "2026-08-16" }
              as: DiningServicesManager
              captures: { mc_id: $.data.id }
            - call: "POST /menu-cycles/${mc_id}/items"
              payload: { item_code: "LS-CHICKEN", name: "Herb Chicken", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR", required_therapeutic_codes: ["LOW_SODIUM"] }
              as: DiningServicesManager
              captures: { mi_id: $.data.id }
            - call: "POST /menu-items/${mi_id}/therapeutic-extensions"
              payload: { diet_code: "LOW_SODIUM", nutrient_overrides: { sodium_mg: 400 } }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { ext_id: $.data.id }
            - call: "POST /therapeutic-extensions/${ext_id}/submit"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /therapeutic-extensions/${ext_id}/review"
              payload: { decision: "REQUEST_CHANGES", reviewer_note: "round 1" }
              as: RegisteredDietitian
              as_user_id: "rd-2"
            - call: "POST /therapeutic-extensions/${ext_id}/submit"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /therapeutic-extensions/${ext_id}/review"
              payload: { decision: "REQUEST_CHANGES", reviewer_note: "round 2" }
              as: RegisteredDietitian
              as_user_id: "rd-2"
            - call: "POST /therapeutic-extensions/${ext_id}/submit"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /therapeutic-extensions/${ext_id}/review"
              payload: { decision: "REQUEST_CHANGES", reviewer_note: "round 3" }
              as: RegisteredDietitian
              as_user_id: "rd-2"
              captures: { rr_third: $.data.review_round }
            - call: "POST /therapeutic-extensions/${ext_id}/submit"
              payload: {}
