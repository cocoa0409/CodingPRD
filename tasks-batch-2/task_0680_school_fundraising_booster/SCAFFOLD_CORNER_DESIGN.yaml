            - call: "GET /fundraising/volunteers/${vol_id}"
              payload: {}
              as: CampaignAdmin
              captures: { cm: $.data.committed_minutes }
          assert:
            - "VolunteerShift.${sh_id}.status == RELEASED"
            - "Volunteer.${vol_id}.committed_minutes == 0"

