scenario: |
  Membership Overnight Parking at Host Businesses (Harvest Hosts): host business
  onboarding with parking capacity, arrival window and amenity declarations,
  member subscription granting the right to request overnight stays without a
  site fee, stay request and confirmation flow with host approval and same-day
  availability, member conduct expectations including self-contained vehicle
  requirements and a support-the-host norm, host and member review exchange with
  removal for repeated violations, seasonal and event-driven host availability
  changes, local ordinance and zoning constraints on overnight parking at
  commercial properties, host category expansion across wineries, farms,
  breweries and attractions.

domain_name: membership-overnight-parking
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HostBusiness
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name of the host venue" }
      - { name: category, type: enum, source: input, description: "WINERY | FARM | BREWERY | ATTRACTION", constraints: "enum set = {WINERY, FARM, BREWERY, ATTRACTION}" }
      - { name: address_line1, type: string, source: input, description: "Street address of the parking area" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; selects the parking ordinance profile" }
      - { name: arrival_window_start_hour, type: integer, source: input, default: 14, description: "Local hour at which a member may occupy a site on the arrival day; the day the host starts accepting rigs" }
      - { name: arrival_window_end_hour, type: integer, source: input, default: 11, description: "Local hour by which a member must vacate on the final morning" }
      - { name: self_contained_required, type: boolean, source: input, default: true, description: "Whether member vehicles must be fully self-contained (no hookups, no waste discharge)" }
      - { name: onboarding_status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | SUSPENDED | REJECTED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | LIMITED | UNAVAILABLE | SUSPENDED — derived aggregate that gates every stay request against this host" }
      - { name: effective_capacity, type: integer, source: computed, description: "Base parking capacity used for reservation arithmetic when posture is OPEN or LIMITED; 0 when UNAVAILABLE or SUSPENDED" }
      - { name: committed_sites, type: integer, source: computed, description: "Count of scheduled stays plus non-terminal stay requests against this host" }
      - { name: free_sites, type: integer, source: computed, description: "= effective_capacity - committed_sites; never negative" }
      - { name: latest_checkout_at, type: datetime, source: computed, description: "= max(occupancy_end) over this host's stays in {CONFIRMED, CHECKED_IN}, or null when none; the far edge of outstanding occupancy" }
      - { name: seasonal_windows_reserved_sites, type: integer, source: computed, description: "Count of reserved sites summed over every ACTIVE availability window's reserved_sites" }
      - { name: electric_site_count, type: integer, source: computed, description: "= count of HostParkingSite rows for this host with is_active true and has_electric true; the amenity surface the onboarding decision inspects" }
      - { name: patronization_credit_cents, type: integer, source: computed, default: 0, description: "Lifetime support-the-host credit in cents accrued from verified member receipts at this host" }
      - { name: host_rating_average, type: number, source: computed, default: 0.00, description: "= round_half_up(mean rating, 2) over HOST-author HostReview rows of this host with review_status PUBLISHED; 0.00 when that set is empty" }

  - name: HostParkingSite
    parent: HostBusiness
    common_fields: true
    fields:
      - { name: host_id, type: string, source: system, description: "FK -> HostBusiness.id; owning host of this physical parking site" }
      - { name: site_label, type: string, source: input, description: "Operator-facing label for the site, unique within the host" }
      - { name: site_class, type: enum, source: input, description: "PULL_THROUGH | BACK_IN", constraints: "enum set = {PULL_THROUGH, BACK_IN}" }
      - { name: max_vehicle_length_feet, type: integer, source: input, description: "Longest vehicle this site can physically hold" }
      - { name: has_electric, type: boolean, source: input, default: false, description: "Whether the site offers an electric pedestal at all" }
      - { name: electric_service_code, type: enum, source: input, default: "NONE", description: "NONE | ELECTRIC_30A | ELECTRIC_50A", constraints: "enum set = {NONE, ELECTRIC_30A, ELECTRIC_50A}" }
      - { name: blocks_sites, type: string, source: input, description: "Pipe-delimited list of other HostParkingSite.site_label values on the same host whose approach a stay circulates through this site blocks; no site may block itself. A stay circulates when its assigned site has site_class PULL_THROUGH", default: "" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the site participates in reservation arithmetic and occupancy checks" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email address" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: plan_tier, type: enum, source: input, description: "CLASSIC | PLUS | PREMIER", constraints: "enum set = {CLASSIC, PLUS, PREMIER}" }
      - { name: subscription_status, type: enum, source: system, description: "PENDING | ACTIVE | LAPSED | CANCELLED" }
      - { name: standing_score, type: integer, source: computed, default: 100, description: "= max(0, 100 + sum of conduct penalty points over non-WITHDRAWN incidents)" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "Count of non-WITHDRAWN conduct incidents whose severity is MAJOR or SEVERE; a strike is never consumed by a response" }
      - { name: removal_status, type: enum, source: system, default: "NONE", description: "NONE | REMOVED; removal is terminal, there is no reinstatement path", constraints: "enum set = {NONE, REMOVED}" }
      - { name: guest_passes_remaining, type: integer, source: system, description: "Overnight guest passes remaining in the current calendar year; resets only while no stay is SCHEDULED" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state code of the member's registered residence; selects the vehicle inspection requirement" }
      - { name: total_stays_completed, type: integer, source: computed, default: 0, description: "Count of stays on this member that reached the CHECKED_OUT state" }
      - { name: member_rating_average, type: number, source: computed, default: 0.00, description: "= round_half_up(mean rating, 2) over MEMBER-author HostReview rows written by this member with review_status PUBLISHED; 0.00 when that set is empty" }

  - name: MemberVehicle
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member of this rig" }
      - { name: vehicle_class, type: enum, source: input, description: "CLASS_A | CLASS_B | CLASS_C | FIFTH_WHEEL | TRAVEL_TRAILER | CONVERSION_VAN", constraints: "enum set = {CLASS_A, CLASS_B, CLASS_C, FIFTH_WHEEL, TRAVEL_TRAILER, CONVERSION_VAN}" }
      - { name: length_feet, type: integer, source: input, description: "Overall vehicle length in feet" }
      - { name: self_contained, type: boolean, source: input, description: "Whether the rig carries onboard water, waste and power; mandatory true when the host declares self_contained_required" }
      - { name: inspection_state_code, type: string, source: input, description: "Two-letter state code of the inspecting authority for the annual self-containment certificate" }
      - { name: inspection_expires_on, type: datetime, source: input, default: null, description: "Expiry instant of the current self-containment inspection; required in the body only when inspection_state_code differs from the member's home_state_code, absent otherwise" }
      - { name: is_primary, type: boolean, source: system, description: "Whether this is the member's designated primary rig; exactly one per member" }

  - name: HostAvailabilityWindow
    parent: HostBusiness
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> HostBusiness.id; host whose availability this window modifies (supplied in the body)" }
      - { name: kind, type: enum, source: input, description: "SEASONAL | EVENT", constraints: "enum set = {SEASONAL, EVENT}" }
      - { name: label, type: string, source: input, description: "Human-readable name of the window, e.g. harvest closure or festival weekend" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive day on which the window takes effect" }
      - { name: end_date, type: datetime, source: input, description: "Exclusive day on which the window stops applying; must be strictly after start_date" }
      - { name: window_status, type: enum, source: system, description: "SCHEDULED | ACTIVE | CANCELLED" }
      - { name: capacity_override, type: integer, source: input, description: "Total parking capacity in effect during the window; replaces HostBusiness base capacity for reservation arithmetic" }
      - { name: reserved_sites, type: integer, source: input, default: 0, description: "Sites inside capacity_override withheld from member stays, e.g. for a festival vendor or event staff" }
      - { name: member_capacity_ceiling, type: integer, source: computed, description: "= max(0, capacity_override - reserved_sites); the live capacity basis while the window is ACTIVE" }

  - name: StayRequest
    parent: HostBusiness
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> HostBusiness.id; host this stay request is addressed to (supplied in the body)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member requesting the overnight stay (supplied in the body, must match X-User-ID for a Member actor)" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> MemberVehicle.id; rig that will occupy the site" }
      - { name: arrival_date, type: datetime, source: input, description: "Requested arrival day, inclusive; midnight UTC" }
      - { name: nights, type: integer, source: input, description: "Number of consecutive nights requested" }
      - { name: departure_date, type: computed, description: "= arrival_date + nights days; exclusive checkout boundary" }
      - { name: occupancy_start, type: computed, description: "= arrival_date + host.arrival_window_start_hour; the hour-level instant the rig may occupy the site" }
      - { name: occupancy_end, type: computed, description: "= departure_date + host.arrival_window_end_hour; the hour-level instant the rig must be gone. The vehicle-collision rule uses the half-open DATE interval [arrival_date 00:00 UTC, departure_date 00:00 UTC) instead, so a same-day turnaround on one vehicle touches and is therefore a conflict." }
      - { name: party_size, type: integer, source: input, default: 1, description: "Total people in the rig including the driver" }
      - { name: electric_request_code, type: enum, source: input, default: "NONE", description: "NONE | ELECTRIC_30A | ELECTRIC_50A", constraints: "enum set = {NONE, ELECTRIC_30A, ELECTRIC_50A}" }
      - { name: request_depth, type: integer, source: system, default: 0, description: "Number of times this request has been made or responded: INITIAL, then 1 after the first host response, then 2 after the member counter, then 3 after the second host response" }
      - { name: request_status, type: enum, source: system, description: "REQUESTED | CONFIRMED | DECLINED | CANCELLED | CHECKED_IN | CHECKED_OUT | NO_SHOW" }
      - { name: count_toward_capacity, type: boolean, source: computed, description: "Whether this request counts against the host's committed_sites; true for CONFIRMED, and for REQUESTED whose request_depth is 1 or under" }
      - { name: same_day_hold, type: boolean, source: system, default: false, description: "Whether the request is exempt from the 48h lead-time guard because the host enabled same-day availability" }
      - { name: confirmed_site_id, type: string, source: system, description: "FK -> HostParkingSite.id; site assigned when the stay is confirmed, otherwise null" }
      - { name: ancillary_charge_cents, type: integer, source: computed, default: 0, description: "Electric and guest-pass ancillary computed at confirmation; zero while REQUESTED" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Late-cancellation fee computed against ancillary_charge_cents; zero when cancelled outside the late window" }
      - { name: checked_in_at, type: datetime, source: system, description: "Instant the member checked in; null until CHECKED_IN" }
      - { name: checked_out_at, type: datetime, source: system, description: "Instant the member checked out; null until CHECKED_OUT" }
      - { name: no_show_recorded_at, type: datetime, source: system, description: "Instant the host recorded the no-show; null unless NO_SHOW" }
      - { name: request_origin, type: enum, source: system, description: "MEMBER_INITIATED | HOST_INITIATED", constraints: "enum set = {MEMBER_INITIATED, HOST_INITIATED}" }

  - name: HostReview
    parent: HostBusiness
    common_fields: false
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> HostBusiness.id; host the review exchange belongs to (supplied in the body for a host-author review, otherwise derived from the stay)" }
      - { name: author_review_id, type: string, source: input, default: null, description: "FK -> HostReview.id; the review this one answers as a counter-review, supplied in the body and absent for an original review (self-referential counter-review link)" }
      - { name: subject_member_id, type: string, source: system, description: "FK -> Member.id; member this host-author review is about" }
      - { name: subject_host_id, type: string, source: input, description: "FK -> HostBusiness.id; host this member-author review is about, null for host-author reviews" }
      - { name: author_kind, type: enum, source: input, description: "HOST | MEMBER; identifies which side of the exchange wrote this review", constraints: "enum set = {HOST, MEMBER}" }
      - { name: author_member_id, type: string, source: system, description: "FK -> Member.id; the member who wrote this review, null when author_kind == HOST" }
      - { name: rating, type: integer, source: input, description: "Overall rating 1..5 inclusive" }
      - { name: public_note, type: string, source: input, description: "Free-text public note accompanying the rating" }
      - { name: private_report, type: string, source: input, description: "Private conduct report visible to platform staff only; triggers a conduct incident when non-empty on a HOST-author review" }
      - { name: review_status, type: enum, source: system, description: "PUBLISHED | WITHDRAWN" }
      - { name: advance_notice_hours, type: integer, source: input, description: "Hours of advance notice the author's stay actually had; drives the arriving_under_24h_notice tag" }
      - { name: counter_review_count, type: integer, source: computed, description: "Reviews in this host's exchange whose author_review_id points at this review" }

  - name: Incident
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member the conduct incident is filed against (supplied in the body)" }
      - { name: host_id, type: string, source: input, description: "FK -> HostBusiness.id; host that reported or was affected by the incident (supplied in the body)" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | SEVERE", constraints: "enum set = {MINOR, MAJOR, SEVERE}" }
      - { name: origin, type: enum, source: system, description: "MEMBER_REPORT | STAFF_FILING | REVIEW_REPORT", constraints: "enum set = {MEMBER_REPORT, STAFF_FILING, REVIEW_REPORT}" }
      - { name: incident_status, type: enum, source: system, description: "OPEN | UPHELD | DISMISSED | WITHDRAWN" }
      - { name: narrative, type: string, source: input, description: "Description of what the host reported" }
      - { name: waived_days_remaining, type: integer, source: system, default: 0, description: "Whole days of dues waiver granted when the incident is upheld" }

  - name: HostPatronizationRecord
    parent: HostBusiness
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> HostBusiness.id; host where the purchase was made (supplied in the body)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member who made the purchase" }
      - { name: stay_request_id, type: string, source: input, description: "FK -> StayRequest.id; stay during which the purchase was made" }
      - { name: receipt_cents, type: integer, source: input, description: "Purchase amount in cents, must be positive" }
      - { name: purchase_kind, type: enum, source: input, description: "TASTING | MERCHANDISE | TICKET | MEAL", constraints: "enum set = {TASTING, MERCHANDISE, TICKET, MEAL}" }
      - { name: verification_code, type: string, source: system, description: "Server-minted code the host scans to mark the receipt verified" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: host_credit_cents, type: integer, source: computed, default: 0, description: "Support-the-host credit this record accrues once VERIFIED; zero while PENDING" }

  - name: ConductDisposition
    parent: Incident
    common_fields: false
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id; the conduct incident this disposition resolves" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member the originating incident was filed against" }
      - { name: requested_decision, type: enum, source: input, description: "UPHOLD | DISMISS", constraints: "enum set = {UPHOLD, DISMISS}" }
      - { name: decided_by_display_name, type: string, source: input, description: "Display name the member supplied; segmented from every other member's display name so no displayed name collides" }
      - { name: decision, type: enum, source: system, description: "UPHELD | DISMISSED" }
      - { name: decided_at, type: datetime, source: system, description: "Instant the review board ruled on the incident" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HostBusiness
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /hosts/{hostId}/onboarding_decisions with decision=APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == PENDING_REVIEW"
          - "HostBusiness.effective_capacity >= 1 (at least one active HostParkingSite)"
          - "HostBusiness.electric_site_count >= 1"
        side_effects:
          - "HostBusiness.onboarding_status = APPROVED"
          - "recompute HostBusiness.posture and HostBusiness.committed_sites (calculation host_posture_derivation)"
          - "if a SEP_01ACTIVE HostAvailabilityWindow overlaps the current clock instant: window.window_status = ACTIVE"
          - "if no ACTIVE window overlaps the current clock instant: every SCHEDULED window with capacity_override <= 0 is CANCELLED"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /hosts/{hostId}/onboarding_decisions with decision=REJECT"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == PENDING_REVIEW"
        side_effects:
          - "HostBusiness.onboarding_status = REJECTED"
          - "every REQUESTED StayRequest on this host -> DECLINED (cascade hop 1)"
          - "each such StayRequest files a MAJOR Incident with origin=REVIEW_REPORT on its member (cascade hop 2)"
          - "the new Incident recomputes Member.standing_score and Member.strike_count; when Member.strike_count >= 3 the member -> REMOVED (cascade hop 3, calculation member_standing_score)"
          - "each member that flips to REMOVED releases its in-flight reservations: countable StayRequests beyond request_depth 1 -> DECLINED (cascade hop 4)"
          - "recompute HostBusiness.posture, committed_sites, free_sites"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /hosts/{hostId}/suspensions"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == APPROVED"
          - "HostBusiness.posture IN {OPEN, LIMITED, UNAVAILABLE}"
        side_effects:
          - "HostBusiness.onboarding_status = SUSPENDED"
          - "HostBusiness.posture = SUSPENDED"
          - "every StayRequest on this host in {REQUESTED, CONFIRMED} -> DECLINED (cascade hop 1)"
          - "each such StayRequest recomputes its Member: standing_score, strike_count, total_stays_completed, guest_passes_remaining (cascade hop 2)"
          - "the new Incident recomputes Member.standing_score and Member.strike_count; when Member.strike_count >= 3 the member -> REMOVED (cascade hop 3, calculation member_standing_score)"
          - "each member that flips to REMOVED releases its in-flight reservations: countable StayRequests beyond request_depth 1 -> DECLINED (cascade hop 4)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /hosts/{hostId}/reinstatements"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == SUSPENDED"
          - "HostBusiness has at least one active HostParkingSite"
        side_effects:
          - "HostBusiness.onboarding_status = APPROVED"
          - "recompute HostBusiness.posture, committed_sites, free_sites"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /hosts/{hostId}/onboarding_decisions with decision=REJECT"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == APPROVED"
        side_effects:
          - "HostBusiness.onboarding_status = REJECTED"
          - "every StayRequest on this host in {REQUESTED, CONFIRMED} -> DECLINED (cascade hop 1)"
          - "each such StayRequest recomputes its Member: standing_score, strike_count, total_stays_completed, guest_passes_remaining (cascade hop 2)"
          - "the new Incident recomputes Member.standing_score and Member.strike_count; when Member.strike_count >= 3 the member -> REMOVED (cascade hop 3, calculation member_standing_score)"
          - "each member that flips to REMOVED releases its in-flight reservations: countable StayRequests beyond request_depth 1 -> DECLINED (cascade hop 4)"
      - from: SUSPENDED
        to: REJECTED
        trigger: "POST /hosts/{hostId}/onboarding_decisions with decision=REJECT"
        actor: PlatformAdmin
        preconditions:
          - "HostBusiness.onboarding_status == SUSPENDED"
        side_effects:
          - "HostBusiness.onboarding_status = REJECTED"

  - entity: HostAvailabilityWindow
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (automatic when POST /_clock/set_current_utc advances the logical clock to >= start_date and < end_date)"
        actor: system
        preconditions:
          - "HostAvailabilityWindow.window_status == SCHEDULED"
          - "HostAvailabilityWindow.start_date <= current logical clock < HostAvailabilityWindow.end_date"
          - "host.HostBusiness.onboarding_status == APPROVED"
        side_effects:
          - "HostAvailabilityWindow.window_status = ACTIVE"
          - "recompute HostBusiness.effective_capacity, committed_sites, free_sites, posture (calculation host_posture_derivation)"
          - "same rewrite pass: every other ACTIVE HostAvailabilityWindow of the same host with end_date <= current logical clock -> CANCELLED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /availability-windows/{windowId}/amend"
        actor: HostOperator
        preconditions:
          - "HostAvailabilityWindow.window_status == ACTIVE (ERR_WINDOW_NOT_ACTIVE)"
          - "capacity_override >= reserved_sites (ERR_WINDOW_CAPACITY_BELOW_RESERVED)"
          - "reserved_sites >= 0"
          - "the amendment must not evict a CONFIRMED stay; rejected with ERR_WINDOW_EVICTS_CONFIRMED_STAY when member_capacity_ceiling would drop below the count of CONFIRMED stays whose occupancy_start falls inside [start_date, end_date)"
        side_effects:
          - "HostAvailabilityWindow.capacity_override, reserved_sites, start_date, end_date updated in place"
          - "recompute member_capacity_ceiling"
          - "recompute HostBusiness.effective_capacity, committed_sites, free_sites, posture"
          - "HostAvailabilityWindow.version += 1"
        note: "Cyclic self-transition — a live window can be amended repeatedly without leaving ACTIVE."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /availability-windows/{windowId}/cancellations"
        actor: HostOperator
        preconditions:
          - "HostAvailabilityWindow.window_status == ACTIVE"
        side_effects:
          - "HostAvailabilityWindow.window_status = CANCELLED"
          - "recompute HostBusiness.effective_capacity, committed_sites, free_sites, posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /availability-windows/{windowId}/cancellations"
        actor: HostOperator
        preconditions:
          - "HostAvailabilityWindow.window_status == SCHEDULED"
        side_effects:
          - "HostAvailabilityWindow.window_status = CANCELLED"
      - from: ACTIVE
        to: SCHEDULED
        trigger: "system (automatic when POST /_clock/set_current_utc moves the logical clock back before start_date)"
        actor: system
        preconditions:
          - "HostAvailabilityWindow.window_status == ACTIVE"
          - "current logical clock < HostAvailabilityWindow.start_date"
        side_effects:
          - "HostAvailabilityWindow.window_status = SCHEDULED"
          - "recompute HostBusiness.effective_capacity, committed_sites, free_sites, posture"
        note: "Cyclic revert — the window can re-enter SCHEDULED and later re-activate."

  - entity: StayRequest
    initial_state: REQUESTED
    terminal_states: [DECLINED, CANCELLED, CHECKED_OUT, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /stay-requests/{requestId}/decisions with decision=CONFIRM"
        actor: HostOperator
        preconditions:
          - "StayRequest.request_status == REQUESTED"
          - "host.HostBusiness.onboarding_status == APPROVED"
          - "host.HostBusiness.posture IN {OPEN, LIMITED}"
          - "current logical clock >= StayRequest.occupancy_start - 48h, unless StayRequest.same_day_hold is true (ERR_REQUEST_LEAD_TIME)"
          - "the vehicle fits the assigned site: assigned HostParkingSite.max_vehicle_length_feet >= vehicle.length_feet (ERR_VEHICLE_LENGTH_EXCEEDS_SITE)"
          - "electric compatibility: when StayRequest.electric_request_code != NONE the assigned site must have has_electric true, and the site's electric_service_code must be >= the requested code in {NONE < ELECTRIC_30A < ELECTRIC_50A} (ERR_SITE_ELECTRIC_INCOMPATIBLE)"
          - "capacity excluding this request's own reservation: host.effective_capacity - (host.committed_sites - 1) >= 1 (ERR_HOST_CAPACITY_FULL)"
        side_effects:
          - "StayRequest.request_status = CONFIRMED"
          - "StayRequest.confirmed_site_id set"
          - "compute StayRequest.ancillary_charge_cents (calculation stay_ancillary_charge)"
          - "recompute HostBusiness.committed_sites and free_sites; posture recomputed by host_posture_derivation"
          - "Member.total_stays_completed unchanged until checkout"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /stay-requests/{requestId}/decisions with decision=DECLINE"
        actor: HostOperator
        preconditions:
          - "StayRequest.request_status == REQUESTED"
          - "request_depth reaches 1 on this response, so the later DECLINED -> REQUESTED counter is admitted exactly once"
        side_effects:
          - "StayRequest.request_status = DECLINED"
          - "StayRequest.request_depth += 1"
          - "recompute HostBusiness.committed_sites and free_sites"
          - "recompute Member.standing_score, Member.strike_count, Member.total_stays_completed, Member.guest_passes_remaining"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /stay-requests/{requestId}/cancellations"
        actor: Member
        preconditions:
          - "StayRequest.request_status == REQUESTED"
          - "acting Member owns StayRequest.member_id"
        side_effects:
          - "StayRequest.request_status = CANCELLED"
          - "recompute HostBusiness.committed_sites and free_sites"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /stay-requests/{requestId}/cancellations"
        actor: Member
        preconditions:
          - "StayRequest.request_status == CONFIRMED"
          - "acting Member owns StayRequest.member_id"
        side_effects:
          - "StayRequest.request_status = CANCELLED"
          - "StayRequest.request_depth += 1"
          - "compute StayRequest.cancellation_fee_cents against the stored ancillary_charge_cents (calculation late_cancellation_fee)"
          - "recompute HostBusiness.committed_sites and free_sites"
          - "recompute Member.standing_score, Member.strike_count, Member.total_stays_completed, Member.guest_passes_remaining"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /stays/{stayId}/check_ins"
        actor: HostOperator
        preconditions:
          - "StayRequest.request_status == CONFIRMED"
          - "current logical clock >= StayRequest.occupancy_start"
        side_effects:
          - "StayRequest.request_status = CHECKED_IN"
          - "StayRequest.checked_in_at = current logical clock"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /stays/{stayId}/check_outs"
        actor: HostOperator
        preconditions:
          - "StayRequest.request_status == CHECKED_IN"
          - "current logical clock >= StayRequest.occupancy_end"
        side_effects:
          - "StayRequest.request_status = CHECKED_OUT"
          - "StayRequest.checked_out_at = current logical clock"
          - "Member.total_stays_completed += 1"
          - "recompute HostBusiness.committed_sites, free_sites, posture"
          - "Member.guest_passes_remaining resets to the plan allotment only when the member has no other countable StayRequest"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /stay-requests/{requestId}/no_show_records"
        actor: HostOperator
        preconditions:
          - "StayRequest.request_status == CONFIRMED"
          - "current logical clock >= StayRequest.occupancy_end"
        side_effects:
          - "StayRequest.request_status = NO_SHOW"
          - "StayRequest.no_show_recorded_at = current logical clock"
          - "auto-create an Incident with severity=MAJOR, origin=STAFF_FILING, incident_status=OPEN on the member (cascade hop 1)"
          - "the new Incident recomputes Member.standing_score and Member.strike_count (cascade hop 2, calculation member_standing_score)"
          - "Member standing recompute rate-threshold check: when Member.strike_count >= 3 the member -> REMOVED (cascade hop 3)"
          - "each member flipping to REMOVED releases its in-flight reservations: countable StayRequests beyond request_depth 1 -> DECLINED (cascade hop 4)"
          - "recompute HostBusiness.committed_sites, free_sites, posture"
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /stay-requests/{requestId}/counter_requests"
        actor: Member
        preconditions:
          - "StayRequest.request_status == DECLINED"
          - "StayRequest.request_depth == 1"
          - "acting Member owns StayRequest.member_id"
          - "current logical clock <= StayRequest.occupancy_end (ERR_STAY_WINDOW_PASSED)"
        side_effects:
          - "StayRequest.request_status = REQUESTED"
          - "StayRequest.request_depth = 2"
          - "recompute HostBusiness.committed_sites and free_sites (depth-2 requests still count)"
          - "Member.standing_score, Member.strike_count, Member.total_stays_completed, Member.guest_passes_remaining recomputed"
      - from: CANCELLED
        to: REQUESTED
        trigger: "POST /stay-requests/{requestId}/counter_requests"
        actor: Member
        preconditions:
          - "StayRequest.request_status == CANCELLED"
          - "StayRequest.request_depth <= 1"
          - "acting Member owns StayRequest.member_id"
          - "current logical clock <= StayRequest.occupancy_end (ERR_STAY_WINDOW_PASSED)"
        side_effects:
          - "StayRequest.request_status = REQUESTED"
          - "StayRequest.request_depth = 2"
          - "recompute HostBusiness.committed_sites and free_sites"
          - "Member.standing_score, Member.strike_count, Member.total_stays_completed, Member.guest_passes_remaining recomputed"
        note: "Second cycle — the request can be cancelled and then re-opened once, producing the second round of host negotiation."
      - from: NO_SHOW
        to: REQUESTED
        trigger: "POST /stay-requests/{requestId}/counter_requests"
        actor: Member
        preconditions:
          - "StayRequest.request_status == NO_SHOW"
          - "StayRequest.request_depth <= 1"
          - "acting Member owns StayRequest.member_id"
          - "current logical clock <= StayRequest.occupancy_end (ERR_STAY_WINDOW_PASSED)"
        side_effects:
          - "StayRequest.request_status = REQUESTED"
          - "StayRequest.request_depth = 2"
          - "recompute HostBusiness.committed_sites and free_sites"
          - "Member.standing_score, Member.strike_count, Member.total_stays_completed, Member.guest_passes_remaining recomputed"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /members/{memberId}/lapse"
        actor: PlatformAdmin
        preconditions:
          - "Member.subscription_status == ACTIVE"
          - "Member has no StayRequest in {REQUESTED, CONFIRMED, CHECKED_IN}"
        side_effects:
          - "Member.subscription_status = LAPSED"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /members/{memberId}/renewals"
        actor: PlatformAdmin
        preconditions:
          - "Member.subscription_status == LAPSED"
        side_effects:
          - "Member.subscription_status = ACTIVE"
      - from: ACTIVE
        to: REMOVED
        trigger: "system (automatic when Member.strike_count reaches 3 after any incident disposition or cascade recompute)"
        actor: system
        preconditions:
          - "Member.strike_count >= 3 (calculation member_standing_score)"
          - "Member.removal_status == NONE"
        side_effects:
          - "Member.removal_status = REMOVED"
          - "Member.subscription_status = CANCELLED"
          - "every countable StayRequest of this member beyond request_depth 1 -> DECLINED"
          - "recompute HostBusiness.committed_sites and free_sites for each affected host"
        note: "Derived removal — the member machine has no terminal state, and this is its only automatic edge"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /members/{memberId}/cancellations"
        actor: Member
        preconditions:
          - "Member.subscription_status IN {ACTIVE, LAPSED}"
          - "acting Member owns the resource id"
        side_effects:
          - "Member.subscription_status = CANCELLED"
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /members/{memberId}/cancellations"
        actor: Member
        preconditions:
          - "Member.subscription_status == LAPSED"
          - "acting Member owns the resource id"
        side_effects:
          - "Member.subscription_status = CANCELLED"
      - from: CANCELLED
        to: LAPSED
        trigger: "POST /members/{memberId}/lapse"
        actor: PlatformAdmin
        preconditions:
          - "Member.subscription_status == CANCELLED"
        side_effects:
          - "Member.subscription_status = LAPSED"
        note: "Cyclic revert — a cancelled subscription can be re-lapsed for a re-engagement campaign, then renewed."

  - entity: HostReview
    initial_state: PUBLISHED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /reviews/{reviewId}/withdrawals"
        actor: Any
        preconditions:
          - "HostReview.review_status == PUBLISHED (ERR_REVIEW_ALREADY_WITHDRAWN)"
        side_effects:
          - "HostReview.review_status = WITHDRAWN"
          - "recompute HostBusiness.host_rating_average and Member.member_rating_average through both rating aggregates"
          - "a REVIEW_REPORT Incident whose origin is REVIEW_REPORT and whose narrative names this review -> incident_status = WITHDRAWN, waived_days_remaining = 0, and the subject member's standing_score and strike_count recomputed"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /incidents/{incidentId}/dispositions with requested_decision=UPHOLD"
        actor: Member
        preconditions:
          - "Incident.incident_status == OPEN (ERR_INCIDENT_NOT_OPEN)"
          - "decided_by_display_name supplied in the body is segmented from every other Member.full_name (ERR_DISPOSITION_NAME_COLLISION)"
        side_effects:
          - "Incident.incident_status = UPHELD"
          - "Incident.waived_days_remaining = 3 when severity in {MINOR, MAJOR}, else 7 when severity == SEVERE"
          - "Member.standing_score recomputed from non-WITHDRAWN incidents (calculation member_standing_score)"
          - "Member.strike_count recomputed; when >= 3: Member.removal_status = REMOVED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /incidents/{incidentId}/dispositions with requested_decision=DISMISS"
        actor: Member
        preconditions:
          - "Incident.incident_status == OPEN (ERR_INCIDENT_NOT_OPEN)"
          - "decided_by_display_name supplied in the body is segmented from every other Member.full_name (ERR_DISPOSITION_NAME_COLLISION)"
        side_effects:
          - "Incident.incident_status = DISMISSED"
          - "Member.standing_score and Member.strike_count recomputed"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /incidents/{incidentId}/dispositions with requested_decision=UPHOLD when the originating HostReview is WITHDRAWN"
        actor: system
        preconditions:
          - "Incident.incident_status == OPEN"
          - "Incident.origin == REVIEW_REPORT"
          - "the originating HostReview.review_status == WITHDRAWN"
        side_effects:
          - "Incident.incident_status = WITHDRAWN"
          - "Incident.waived_days_remaining = 0"
          - "Member.standing_score and Member.strike_count recomputed; the withdrawn incident contributes no penalty and no strike"

  - entity: HostPatronizationRecord
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /patronization-records/{recordId}/verifications"
        actor: HostOperator
        preconditions:
          - "HostPatronizationRecord.verification_status == PENDING"
          - "verification_code in the body equals the record's server-minted verification_code (ERR_PATRONIZATION_CODE_INVALID)"
        side_effects:
          - "HostPatronizationRecord.verification_status = VERIFIED"
          - "compute HostPatronizationRecord.host_credit_cents (calculation host_patronization_credit)"
          - "recompute HostBusiness.patronization_credit_cents as the sum of host_credit_cents over VERIFIED records (calculation host_patronization_credit)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /patronization-records/{recordId}/verification with action=REJECT"
        actor: HostOperator
        preconditions:
          - "HostPatronizationRecord.verification_status == PENDING"
        side_effects:
          - "HostPatronizationRecord.verification_status = REJECTED"
          - "HostPatronizationRecord.host_credit_cents stays 0"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-host
    parent_entity: HostBusiness
    write_endpoint: "POST /stay-requests/{requestId}/decisions"
    occ_field: "expected_host_version"
    description: |
      Confirming a stay request against a HostBusiness whose version has
      advanced since the operator last read it is rejected, because the
      operator's view of free_sites and posture is stale — availability
      windows or other confirmations may already have consumed the site.
    error_id: ERR_STALE_HOST_VERSION
    http_status: 412

  - rule_id: record-stale-request
    parent_entity: StayRequest
    write_endpoint: "POST /patronization-records"
    occ_field: "expected_request_version"
    description: |
      Recording a patronization purchase against a StayRequest whose version
      has advanced since the client last observed it is rejected; the caller's
      view of which stay is active is stale.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: host_effective_capacity
    trigger: "any change to HostBusiness.base capacity, HostParkingSite.is_active, HostAvailabilityWindow.window_status, capacity_override or reserved_sites"
    algorithm: aggregation
    formula: |
      live_basis(host) =
        window = the HostAvailabilityWindow of `host` with window_status == ACTIVE
                 and start_date <= current logical clock < end_date;
                 if several, the one with the greatest start_date; ties broken by created_at ASC
        if such a window exists:
          return max(0, window.capacity_override - window.reserved_sites)
        else:
          return count(HostParkingSite where host_id == host.id and is_active == true)
      effective_capacity =
        if host.posture in {UNAVAILABLE, SUSPENDED}: 0
        else: live_basis(host)
    input_set: "Active sites only on the base basis; exactly one window on the live basis. Inactive sites and CANCELLED/SCHEDULED windows are excluded."
    precision: "integer"
    variants:
      - name: base_basis
        when: "no HostAvailabilityWindow is ACTIVE for the host — onboarding, off-season, or before the first window activates"
        difference: "Capacity is the count of active HostParkingSite rows, so adding or deactivating a site changes availability immediately"
      - name: live_basis
        when: "a HostAvailabilityWindow is ACTIVE for the host"
        difference: "Capacity is window.capacity_override minus window.reserved_sites; the physical site count is ignored, so an event window can grant far more, or far fewer, member sites than the host physically has"

  - name: host_committed_sites
    trigger: "any StayRequest create, confirm, decline, cancel, check-in, check-out, no-show, counter-request, or any host suspension/rejection cascade"
    algorithm: aggregation
    formula: |
      committed_sites = count(StayRequest where host_id == host.id
                              and count_toward_capacity == true)
      count_toward_capacity =
        request_status == CONFIRMED
        OR (request_status == REQUESTED AND request_depth <= 1)
      free_sites = max(0, effective_capacity - committed_sites)
      # At confirmation the request being confirmed is already inside
      # committed_sites, so the admission test is evaluated against
      # effective_capacity - (committed_sites - 1); the request's own
      # reservation never blocks its own confirmation.
    input_set: "CONFIRMED stays of any depth, plus REQUESTED requests at request_depth 0 or 1. DECLINED, CANCELLED, CHECKED_IN, CHECKED_OUT and NO_SHOW requests never count."
    precision: "integer"
    variants:
      - name: reserved_basis
        when: "computing whether a new request may be accepted"
        difference: "counts CONFIRMED stays and first-round REQUESTED requests, so a request at request_depth 0 holds a site before the host has answered"
      - name: occupied_basis
        when: "computing the host's live occupancy for its public card"
        difference: "counts only request_status in {CONFIRMED, CHECKED_IN}; first-round REQUESTED requests are excluded"

  - name: host_posture_derivation
    trigger: "any change to effective_capacity, free_sites, committed_sites, or HostBusiness.onboarding_status"
    algorithm: threshold
    formula: |
      if onboarding_status in {SUSPENDED, REJECTED}: posture = SUSPENDED
      else if effective_capacity < 1:              posture = UNAVAILABLE
      else if free_sites < 1:                      posture = LIMITED
      else if free_sites <= ceil(effective_capacity * 0.20): posture = LIMITED
      else:                                        posture = OPEN
      free_sites = max(0, effective_capacity - committed_sites)
    input_set: "Derived purely from HostBusiness and its capacity calculations. No child state is consulted directly."
    constants:
      LIMITED_BAND_PCT: 0.20
    precision: "integer free_sites; band computed with ceil, so free_sites == ceil(capacity*0.20) is still LIMITED"
    variants:
      - name: inclusive_band
        when: "free_sites lands exactly on ceil(effective_capacity * 0.20)"
        difference: "posture is LIMITED — the rule is `<=` not `<`, so a host with 2 of 10 free sites is LIMITED while 3 of 10 is OPEN"
      - name: suspended_override
        when: "onboarding_status is SUSPENDED or REJECTED"
        difference: "posture collapses to SUSPENDED regardless of how many sites are free, and effective_capacity is forced to 0"

  - name: stay_ancillary_charge
    trigger: "StayRequest transition REQUESTED -> CONFIRMED"
    algorithm: combinatorial
    formula: |
      # Step 1 — electric nightly rate, by vehicle class and pedestal code
      if electric_request_code == NONE:       electric_night_cents = 0
      if electric_request_code == ELECTRIC_30A: electric_night_cents = 700
      if electric_request_code == ELECTRIC_50A:
        if vehicle_class in {CLASS_A, FIFTH_WHEEL}: electric_night_cents = 1200
        else:                                      electric_night_cents = 900
      electric_night_cents = min(electric_night_cents, 1200)          # per-night ceiling
      electric_cents = electric_night_cents * nights
      # Step 2 — guest passes; the driver is never a guest
      guests_beyond_driver = max(0, party_size - 1)
      billable_guests      = max(0, guests_beyond_driver - member.guest_passes_remaining)
      guest_cents          = 500 * billable_guests
      # Step 3 — subtotal, then a tier percentage applied to the SUBTOTAL
      subtotal_cents = electric_cents + guest_cents
      pct = {CLASSIC: 0, PLUS: 10, PREMIER: 20}[member.plan_tier]
      discount_cents = round_half_up(subtotal_cents * pct / 100)
      # Step 4 — clamp
      ancillary_charge_cents = min(max(0, subtotal_cents - discount_cents), 25000)   # 25000-cent hard cap
      # Rounding order is pinned: the tier discount is computed ONCE on the
      # rounded-to-cent subtotal, never per night and never per guest.
    input_set: "Reads StayRequest.nights, electric_request_code, party_size; MemberVehicle.vehicle_class; Member.plan_tier, guest_passes_remaining. Site electric capability is validated before this runs, never inside it."
    constants:
      ELECTRIC_30A_PER_NIGHT_CENTS: 700
      ELECTRIC_50A_PER_NIGHT_CENTS: 1200
      ELECTRIC_50A_PER_NIGHT_CENTS_TRAILER: 900
      ELECTRIC_SHORT_TRIP_CEILING_CENTS: 1200
      GUEST_PASS_PURCHASE_CENTS: 500
      ANCILLARY_HARD_CAP_CENTS: 25000
    precision: "integer cents; the tier discount uses round_half_up to 0 decimals"
    variants:
      - name: class_rated
        when: "vehicle_class is different across two otherwise identical stays"
        difference: "a CLASS_A and a CONVERSION_VAN requesting the same 50A pedestal pay 1200 and 900 cents per night respectively, so the same request payload produces different ancillary totals"
      - name: tier_discounted
        when: "the member's plan_tier changes"
        difference: "PREMIER divides the subtotal by 5 before clamping while CLASSIC applies no discount at all"

  - name: host_patronization_credit
    trigger: "HostPatronizationRecord transition PENDING -> VERIFIED, and any verification while other verified records exist"
    algorithm: aggregation
    formula: |
      # Per-record credit — rounded BEFORE summing, never after
      rate = 0.05
      host_credit_cents(record) = min(round_half_up(record.receipt_cents * rate), 1500)
      host.patronization_credit_cents =
        sum(host_credit_cents(r) for r in HostPatronizationRecord
            where r.host_id == host.id and r.verification_status == VERIFIED)
    input_set: "VERIFIED records only. PENDING and REJECTED records contribute zero and are excluded from the recompute."
    constants:
      PATRONIZATION_RATE: 0.05
      PER_RECORD_CREDIT_CAP_CENTS: 1500
    precision: "integer cents; round_half_up to 0 decimals per record, then summed"
    variants:
      - name: per_record_rounding
        when: "any host with more than one verified receipt"
        difference: "each record is rounded to a whole cent before summing; two receipts of 10050 and 33333 produce 503 + 1500 = 2003, while rounding the combined total would produce 2169"
      - name: capped_then_summed
        when: "a single receipt is large enough that the uncapped credit would exceed 1500 cents"
        difference: "the cap applies per record before the sum, so three 40000-cent receipts still yield 4500 rather than a single 6000-cent extent"

  - name: late_cancellation_fee
    trigger: "StayRequest transition CONFIRMED -> CANCELLED"
    algorithm: tiered_pricing
    formula: |
      days_before_arrival = number of whole days between current logical clock
                            and StayRequest.occupancy_start,
                            using date_diff('day', clock, occupancy_start); a negative value means the arrival window already opened
      if days_before_arrival >= 7:         cancellation_fee_cents = 0
      elif ancillary_charge_cents <= 2000: cancellation_fee_cents = 0
      elif ancillary_charge_cents <= 5000: cancellation_fee_cents = round_half_up(ancillary_charge_cents * 0.15) + 500
      else:                                cancellation_fee_cents = round_half_up(ancillary_charge_cents * 0.25) + 1500
      # The band is selected from ancillary_charge_cents; the percentage is
      # applied to the same value, and the flat component is added AFTER
      # rounding the percentage component.
    input_set: "Reads the acting clock and the already-computed StayRequest.ancillary_charge_cents, never a re-derived ancillary figure."
    constants:
      FREE_CANCEL_DAYS: 7
      TIER_LOW_MAX_CENTS: 2000
      TIER_MID_MAX_CENTS: 5000
      TIER_MID_PCT: 0.15
      TIER_MID_FLAT_CENTS: 500
      TIER_HIGH_PCT: 0.25
      TIER_HIGH_FLAT_CENTS: 1500
    precision: "integer cents; percentage component rounded round_half_up to 0 decimals before the flat component is added"
    variants:
      - name: within_free_window
        when: "days_before_arrival >= 7 or ancillary_charge_cents <= 2000"
        difference: "the fee is zero — a late cancellation of an ancillary-free stay costs nothing"
      - name: tier_boundary
        when: "ancillary_charge_cents lands exactly on 5000"
        difference: "5000 selects the middle tier and bills 1250, while 5001 selects the high tier and bills 2750 — the boundary is inclusive on the lower band"

  - name: member_standing_score
    trigger: "any Incident transition OPEN -> UPHELD/DISMISSED/WITHDRAWN, and any StayRequest confirmation or cancellation for the member"
    algorithm: weighted_scoring
    formula: |
      penalty = {MINOR: -5, MAJOR: -15, SEVERE: -40}[incident.severity]
      standing_score = max(0, 100 + sum(penalty for each Incident i
                        where i.member_id == member.id
                          and i.incident_status != WITHDRAWN))
      strike_count = count(Incident i where i.member_id == member.id
                          and i.incident_status != WITHDRAWN
                          and i.severity in {MAJOR, SEVERE})
    input_set: "Every non-WITHDRAWN Incident counts, including OPEN and DISMISSED ones; WITHDRAWN incidents contribute neither penalty nor strike."
    constants:
      BASE_SCORE: 100
      PENALTY_MINOR: -5
      PENALTY_MAJOR: -15
      PENALTY_SEVERE: -40
      SCORE_FLOOR: 0
      STRIKE_REMOVAL_THRESHOLD: 3
    precision: "integer"
    variants:
      - name: score_basis
        when: "computing the member's visible standing score"
        difference: "DISMISSED incidents still subtract their penalty, so a dismissed SEVERE incident leaves the score at 60 while a WITHDRAWN one restores it to 100"
      - name: strike_basis
        when: "deciding whether the removal threshold has been reached"
        difference: "strike_count ignores severity MINOR entirely, so a member with five upheld MINOR incidents keeps strike_count 0 and is never removed even though the standing score has hit 75"

  - name: host_review_rating_aggregate
    trigger: "HostReview moving into the PUBLISHED state on a host-author review, and any later publish or withdrawal on the same host"
    algorithm: aggregation
    formula: |
      ratings = [r.rating for r in HostReview
                 where r.author_kind == HOST
                   and r.host_id == host.id
                   and r.review_status == PUBLISHED]
      if ratings is empty: host_rating_average = 0.00
      else: host_rating_average = round_half_up(sum(ratings) / len(ratings), 2)
    input_set: "HOST-author reviews of this host already in PUBLISHED status, including the one being published. WITHDRAWN reviews are excluded from numerator and denominator alike."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: wrote_a_review
        when: "at least one PUBLISHED host-author review exists for the host"
        difference: "the denominator is the count of published host-author reviews, so ratings 5 and 4 average to 4.50"
      - name: never_reviewed
        when: "no PUBLISHED host-author review exists — a host whose only review was WITHDRAWN falls here"
        difference: "the aggregate is 0.00 rather than a division error or a null"

  - name: member_review_aggregate
    trigger: "HostReview moving into the PUBLISHED state on a member-author review, and any later publish or withdrawal on the same member"
    algorithm: aggregation
    formula: |
      ratings = [r.rating for r in HostReview
                 where r.author_kind == MEMBER
                   and r.author_member_id == member.id
                   and r.review_status == PUBLISHED]
      if ratings is empty: member_rating_average = 0.00
      else: member_rating_average = round_half_up(sum(ratings) / len(ratings), 2)
    input_set: "MEMBER-author reviews written by this member already in PUBLISHED status, including the one being published. WITHDRAWN reviews are excluded."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: wrote_a_review
        when: "at least one PUBLISHED member-author review exists for the member"
        difference: "the denominator is the published count, so ratings 5, 4 and 4 average to 4.33"
      - name: never_reviewed
        when: "no PUBLISHED member-author review exists for the member"
        difference: "the aggregate is 0.00 — the member's rating axis has a defined empty value"

  - name: guest_pass_allotment
    trigger: "StayRequest transition CHECKED_IN -> CHECKED_OUT, and any member-state recompute cascade"
    algorithm: decay_function
    formula: |
      allotment = {CLASSIC: 0, PLUS: 2, PREMIER: 4}[member.plan_tier]
      on checkout or on any cascade recompute:
        if member has no StayRequest in {REQUESTED, CONFIRMED, CHECKED_IN}:
          member.guest_passes_remaining = max(0, allotment - guests_used_this_year)
        else:
          member.guest_passes_remaining unchanged
      guests_used_this_year = sum over the member's CHECKED_OUT stays in the
        current calendar year of max(0, party_size - 1)
    input_set: "Considers CHECKED_OUT stays of the current calendar year only; in-flight stays never decrement the pass pool."
    constants:
      ALLOTMENT_CLASSIC: 0
      ALLOTMENT_PLUS: 2
      ALLOTMENT_PREMIER: 4
    precision: "integer, floor at 0"
    variants:
      - name: frozen_while_stay_active
        when: "the member has any StayRequest in {REQUESTED, CONFIRMED, CHECKED_IN}"
        difference: "the pass pool is frozen at its current value even if the calendar year has rolled over"
      - name: reset_when_idle
        when: "the member has no in-flight StayRequest"
        difference: "the pool is recomputed from the plan allotment minus this year's guest usage, which can raise it back up on a plan upgrade"

  - name: ordinance_compliance
    trigger: "HostBusiness onboarding decision, and any HostBusiness field update"
    algorithm: constraint_propagation
    formula: |
      RULE_SET = [
        (state_code == "OR", category == "WINERY",    max_nightly_total_sites = 2,  min_self_containment = true),
        (state_code == "OR", category == "FARM",      max_nightly_total_sites = 6,  min_self_containment = true),
        (state_code == "CA", category == "WINERY",    max_nightly_total_sites = 4,  min_self_containment = true),
        (state_code == "CA", category == "BREWERY",   max_nightly_total_sites = 3,  min_self_containment = false),
        (state_code == "TX", category == "FARM",      max_nightly_total_sites = 8,  min_self_containment = false),
        (state_code == "TX", category == "ATTRACTION", max_nightly_total_sites = 10, min_self_containment = false),
      ]
      active_rule = the single RULE_SET entry matching (state_code, category);
                    when no entry matches, no ordinance cap applies
      ordinance_violation =
        active_rule exists AND (
          self_contained_required == false when active_rule.min_self_containment == true
          OR base_capacity > active_rule.max_nightly_total_sites   # base_capacity = count of active HostParkingSite rows
        )
      Onboarding transitions from PENDING_REVIEW with ordinance_violation true are
      rejected with ERR_ORDINANCE_CONSTRAINT.
    input_set: "Reads HostBusiness.state_code, HostBusiness.category, HostBusiness.self_contained_required and the host base capacity (count of active HostParkingSite rows); an availability-window override never relaxes the cap. Exactly one rule matches; matching is on the ordered tuple (state_code, category)."
    constants:
      OR_WINERY_MAX_SITES: 2
      OR_FARM_MAX_SITES: 6
      CA_WINERY_MAX_SITES: 4
      CA_BREWERY_MAX_SITES: 3
      TX_FARM_MAX_SITES: 8
      TX_ATTRACTION_MAX_SITES: 10
    precision: "integer site counts; the cap is inclusive (capacity == cap passes, cap + 1 fails)"
    variants:
      - name: capped_states
        when: "the host's (state_code, category) appears in RULE_SET"
        difference: "the ordinance cap applies and self-containment may be forced on"
      - name: uncapped_states
        when: "the host's (state_code, category) matches no RULE_SET entry"
        difference: "no ordinance cap and no forced self-containment — the same category is treated differently in a different state"


# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and the role is recognized by §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation, and a Member acting on a stay request, vehicle or incident disposition must own the referenced member_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path and body resource id resolves; path ids are validated left to right so the outer resource is reported before the inner one"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request well-formedness: every required input is present, every enum member is in its declared set, and every numeric range holds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_safety
    check: "HostBusiness.onboarding_status must be APPROVED and HostBusiness.posture must not be SUSPENDED for a stay to be requested or confirmed"
    error_id: ERR_HOST_NOT_ACCEPTING_STAYS
    http_status: 409
    applies_to: "POST /api/stay-requests, POST /api/stay-requests/{requestId}/decisions"

  - priority: 6
    category: business_safety
    check: "Local ordinance and zoning profile: the (state_code, category) rule set, its nightly member site cap and its forced self-containment must hold on an onboarding decision"
    error_id: ERR_ORDINANCE_CONSTRAINT
    http_status: 422
    applies_to: "POST /api/hosts/{hostId}/decisions"

  - priority: 7
    category: state
    check: "Target resource is in a state that permits the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 8
    category: business_temporal
    check: "48-hour lead-time guard: the current logical clock must be at least 48 hours before StayRequest.occupancy_start unless same_day_hold is true"
    error_id: ERR_REQUEST_LEAD_TIME
    http_status: 422
    applies_to: "POST /api/stay-requests"

  - priority: 9
    category: business_temporal
    check: "Departed stay window: a counter-request may only be filed while the current logical clock is at or before StayRequest.occupancy_end"
    error_id: ERR_STAY_WINDOW_PASSED
    http_status: 422
    applies_to: "POST /api/stay-requests/{requestId}/counter_requests"

  - priority: 10
    category: business_temporal
    check: "Vehicle occupancy conflict on one MemberVehicle: no two stays on the same vehicle may have occupancy intervals that touch or overlap"
    error_id: ERR_VEHICLE_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: "POST /api/stay-requests, POST /api/stay-requests/{requestId}/decisions"

  - priority: 11
    category: business_temporal
    check: "Blocked approach conflict on one HostParkingSite: a site may not be assigned while any site whose blocks_sites names it is occupied by a circulating stay over the new interval buffered by 2 hours"
    error_id: ERR_SITE_APPROACH_BLOCKED
    http_status: 409
    applies_to: "POST /api/stay-requests/{requestId}/decisions"

  - priority: 12
    category: business_constraint
    check: "Host capacity: the host posture must not be UNAVAILABLE, and effective_capacity minus (committed_sites - 1) must be at least 1 when confirming (a request's own reservation never blocks its own confirmation)"
    error_id: ERR_HOST_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /api/stay-requests, POST /api/stay-requests/{requestId}/decisions"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: HostParkingSite.site_label is unique within its host"
    error_id: ERR_DUPLICATE_SITE_LABEL
    http_status: 409
    applies_to: "POST /api/hosts/{hostId}/parking-sites, PATCH /api/hosts/{hostId}/parking-sites/{siteId}"

  - priority: 14
    category: business_constraint
    check: "Uniqueness: Member.email is globally unique"
    error_id: ERR_MEMBER_EMAIL_DUPLICATE
    http_status: 409
    applies_to: "POST /api/members"

  - priority: 15
    category: business_constraint
    check: "Vehicle fit: the site assigned at confirmation must be at least as long as MemberVehicle.length_feet"
    error_id: ERR_VEHICLE_LENGTH_EXCEEDS_SITE
    http_status: 422
    applies_to: "POST /api/stay-requests/{requestId}/decisions"

  - priority: 16
    category: business_constraint
    check: "Electric pedestal compatibility: the site assigned at confirmation must carry an electric_service_code at least as capable as StayRequest.electric_request_code"
    error_id: ERR_SITE_ELECTRIC_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /api/stay-requests/{requestId}/decisions"

  - priority: 17
    category: business_constraint
    check: "Self-contained vehicle rule: when HostBusiness.self_contained_required is true the MemberVehicle.self_contained flag must be true and the vehicle must carry an inspection record"
    error_id: ERR_VEHICLE_NOT_SELF_CONTAINED
    http_status: 422
    applies_to: "POST /api/stay-requests, POST /api/stay-requests/{requestId}/decisions"

  - priority: 18
    category: business_constraint
    check: "Member eligibility: subscription_status must be ACTIVE and removal_status must not be REMOVED"
    error_id: ERR_MEMBER_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /api/stay-requests, POST /api/stay-requests/{requestId}/counter_requests"

  - priority: 19
    category: business_referential
    check: "Member reviewer eligibility: a member-author review requires a stay request between the member and the host in {CHECKED_IN, CHECKED_OUT} whose occupancy_end is at or before the current logical clock"
    error_id: ERR_REVIEW_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /api/reviews"

  - priority: 20
    category: business_referential
    check: "Disposition display-name segmentation: decided_by_display_name must be segmented from every other Member.full_name; the deciding member's own full_name is exempt"
    error_id: ERR_DISPOSITION_NAME_COLLISION
    http_status: 409
    applies_to: "POST /api/incidents/{incidentId}/dispositions"

  - priority: 21
    category: business_constraint
    check: "Availability window integrity: capacity_override >= reserved_sites and end_date strictly after start_date"
    error_id: ERR_WINDOW_CAPACITY_BELOW_RESERVED
    http_status: 422
    applies_to: "POST /api/availability-windows, POST /api/availability-windows/{windowId}/amend"

  - priority: 22
    category: business_constraint
    check: "Window amendment must not evict a scheduled stay: the window's member_capacity_ceiling may not drop below the count of CONFIRMED stays whose occupancy_start falls inside [start_date, end_date)"
    error_id: ERR_WINDOW_EVICTS_CONFIRMED_STAY
    http_status: 422
    applies_to: "POST /api/availability-windows/{windowId}/amend"

  - priority: 23
    category: business_fiscal
    check: "Membership dues and outstanding cancellation fees must be settled before a new stay request is accepted"
    error_id: ERR_BALANCE_DUE
    http_status: 402
    applies_to: "POST /api/stay-requests"

  - priority: 24
    category: business_constraint
    check: "optimistic concurrency: expected_host_version must equal the HostBusiness.version the caller last observed"
    error_id: ERR_STALE_HOST_VERSION
    http_status: 412
    applies_to: "POST /api/hosts/{hostId}/decisions, PATCH /api/hosts/{hostId}, POST /api/stay-requests/{requestId}/decisions"

  - priority: 25
    category: business_constraint
    check: "optimistic concurrency: expected_request_version must equal the StayRequest.version the caller last observed"
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /api/patronization-records"

# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }


endpoints:
  # --- HostBusiness ---
  - method: POST
    path: "/api/hosts"
    description: "Declare a host business and start onboarding"
    roles: [HostOperator, PlatformAdmin]
    code: 201
    input: [legal_name, category, address_line1, state_code, "arrival_window_start_hour?", "arrival_window_end_hour?", "self_contained_required?"]
    output: HostBusiness
    side_effects: ["onboarding_status=PENDING_REVIEW", "posture=UNAVAILABLE", "effective_capacity=0", "committed_sites=0", "free_sites=0", "total_amenity_count=0", "patronization_credit_cents=0", "latest_checkout_at=null"]

  - method: GET
    path: "/api/hosts"
    description: "List hosts with optional filters"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["state_code?", "category?", "onboarding_status?", "posture?", "limit?", "offset?"]
    output: HostBusiness[]
    side_effects: []

  - method: GET
    path: "/api/hosts/{hostId}"
    description: "Get a host business and its derived posture fields"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: HostBusiness
    side_effects: []

  - method: GET
    path: "/api/hosts/{hostId}/capacity_summary"
    description: "Computed read of the host's live capacity basis, both occupancy bases and its posture"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: "{ capacity_basis: string, base_capacity: integer, effective_capacity: integer, committed_sites_reserved_basis: integer, committed_sites_occupied_basis: integer, free_sites: integer, active_window_id: string, active_window_member_ceiling: integer, latest_checkout_at: datetime, posture: string }"
    side_effects: []

  - method: POST
    path: "/api/hosts/{hostId}/decisions"
    description: "Platform decides an onboarding, suspension or reinstatement for a host"
    roles: [PlatformAdmin]
    code: 200
    input: [action, reason, expected_host_version]
    output: HostBusiness
    side_effects:
      - "action=APPROVE from PENDING_REVIEW sets onboarding_status=APPROVED; an overlapping availability window becomes ACTIVE and zero-capacity SCHEDULED windows are CANCELLED"
      - "action=REJECT sets onboarding_status=REJECTED; cascade: REQUESTED and CONFIRMED stays -> DECLINED (hop 1), each stranded stay files a MAJOR REVIEW_REPORT Incident on its member (hop 2), each new Incident recomputes the member's standing_score and strike_count and strike_count >= 3 flips removal_status to REMOVED (hop 3), each removed member releases its in-flight reservations by declining every countable StayRequest beyond request_depth 1 (hop 4)"
      - "action=SUSPEND sets onboarding_status=SUSPENDED and posture=SUSPENDED with the same four-hop cascade as REJECT"
      - "action=REINSTATE sets onboarding_status=APPROVED from SUSPENDED"
      - "recompute effective_capacity, committed_sites, free_sites, posture"
      - "increments HostBusiness.version by 1"

  - method: PATCH
    path: "/api/hosts/{hostId}"
    description: "Update host declarations: name, category, address, state or self-contained requirement"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: ["legal_name?", "category?", "address_line1?", "state_code?", "self_contained_required?", "expected_host_version"]
    output: HostBusiness
    side_effects: ["recompute ordinance_compliance and posture", "increments HostBusiness.version by 1"]

  # --- HostParkingSite ---
  - method: POST
    path: "/api/hosts/{id}/parking-sites"
    description: "Declare a physical parking site with its length, electric pedestal and blocked approaches"
    roles: [HostOperator, PlatformAdmin]
    code: 201
    input: [site_label, site_class, max_vehicle_length_feet, "has_electric?", "electric_service_code?", "blocks_sites?"]
    output: HostParkingSite
    side_effects: ["is_active=true", "recompute HostBusiness.effective_capacity, free_sites, posture on the base capacity basis", "increments HostBusiness.version by 1"]

  - method: GET
    path: "/api/hosts/{id}/parking-sites"
    description: "List the parking sites a host has declared"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["is_active?", "site_class?", "limit?", "offset?"]
    output: HostParkingSite[]
    side_effects: []

  - method: PATCH
    path: "/api/hosts/{hostId}/parking-sites/{siteId}"
    description: "Update a parking site's declared attributes"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: ["site_label?", "site_class?", "max_vehicle_length_feet?", "has_electric?", "electric_service_code?", "blocks_sites?", "is_active?"]
    output: HostParkingSite
    side_effects: ["recompute HostBusiness.effective_capacity, free_sites, posture", "increments HostBusiness.version by 1"]

  - method: GET
    path: "/api/hosts/{hostId}/parking-sites/{siteId}/availability"
    description: "Computed read of a site's occupied intervals, the sites that block it, and whether it is assignable"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: ["from_date?", "to_date?"]
    output: "{ site_id: string, occupied_intervals: array, blocked_by_site_labels: array, is_assignable: boolean }"
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/api/members"
    description: "Register a member and open a subscription"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, full_name, plan_tier, home_state_code]
    output: Member
    side_effects: ["subscription_status=PENDING", "standing_score=100", "strike_count=0", "removal_status=NONE", "total_stays_completed=0", "guest_passes_remaining set from the plan allotment"]

  - method: GET
    path: "/api/members"
    description: "List members"
    roles: [PlatformAdmin]
    code: 200
    input: ["plan_tier?", "subscription_status?", "removal_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/api/members/{memberId}"
    description: "Get a member's subscription, standing score and strikes"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/api/members/{memberId}/subscription_actions"
    description: "Platform advance a member subscription: activate, lapse, renew, or pin the guest-pass pool"
    roles: [PlatformAdmin]
    code: 200
    input: [action, "guest_passes_remaining?"]
    output: Member
    side_effects:
      - "action=ACTIVATE sets subscription_status=ACTIVE from PENDING"
      - "action=LAPSE sets subscription_status=LAPSED"
      - "action=RENEW sets subscription_status=ACTIVE from LAPSED"
      - "action=SET_GUEST_PASSES pins guest_passes_remaining to the supplied value"
      - "recompute standing_score and strike_count"

  - method: POST
    path: "/api/members/{memberId}/cancellations"
    description: "Member cancels their own subscription"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["subscription_status=CANCELLED"]

  # --- MemberVehicle ---
  - method: POST
    path: "/api/members/{id}/vehicles"
    description: "Declare a member's rig: class, length, self-containment and inspection record"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [vehicle_class, length_feet, self_contained, inspection_state_code, "inspection_expires_on?"]
    output: MemberVehicle
    side_effects: ["is_primary=true when this is the member's first vehicle, else false"]

  - method: GET
    path: "/api/members/{id}/vehicles"
    description: "List a member's declared vehicles"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MemberVehicle[]
    side_effects: []

  - method: PATCH
    path: "/api/members/{memberId}/vehicles/{vehicleId}"
    description: "Update a vehicle's declared attributes or inspection record"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["vehicle_class?", "length_feet?", "self_contained?", "inspection_state_code?", "inspection_expires_on?"]
    output: MemberVehicle
    side_effects: []

  # --- HostAvailabilityWindow ---
  - method: POST
    path: "/api/availability-windows"
    description: "Declare a seasonal or event availability window with a capacity override and reserved sites"
    roles: [HostOperator, PlatformAdmin]
    code: 201
    input: [host_id, kind, label, start_date, end_date, capacity_override, "reserved_sites?"]
    output: HostAvailabilityWindow
    side_effects: ["window_status=ACTIVE when start_date <= current logical clock < end_date AND HostBusiness.onboarding_status is APPROVED, else SCHEDULED", "recompute member_capacity_ceiling and HostBusiness.effective_capacity, free_sites, posture", "increments HostBusiness.version by 1"]

  - method: GET
    path: "/api/hosts/{id}/availability-windows"
    description: "List a host's seasonal and event availability windows"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["window_status?", "kind?", "overlaps_date?", "limit?", "offset?"]
    output: HostAvailabilityWindow[]
    side_effects: []

  - method: GET
    path: "/api/availability-windows/{windowId}"
    description: "Get a specific availability window"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: HostAvailabilityWindow
    side_effects: []

  - method: POST
    path: "/api/availability-windows/{windowId}/amend"
    description: "Amend a live window's capacity override, reserved sites or dates"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: ["capacity_override?", "reserved_sites?", "start_date?", "end_date?", expected_window_version]
    output: HostAvailabilityWindow
    side_effects: ["window_status stays ACTIVE", "recompute member_capacity_ceiling and HostBusiness.effective_capacity, free_sites, posture", "increments HostAvailabilityWindow.version by 1", "increments HostBusiness.version by 1"]

  - method: POST
    path: "/api/availability-windows/{windowId}/cancellations"
    description: "Cancel a scheduled or active availability window"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: HostAvailabilityWindow
    side_effects: ["window_status=CANCELLED", "recompute HostBusiness.effective_capacity, free_sites, posture when the window was ACTIVE", "increments HostBusiness.version by 1"]

  # --- StayRequest ---
  - method: POST
    path: "/api/stay-requests"
    description: "File an overnight stay request against a host"
    roles: [Member]
    code: 201
    input: [host_id, member_id, vehicle_id, arrival_date, nights, "party_size?", "electric_request_code?", "request_depth?", "same_day_hold?"]
    output: StayRequest
    side_effects: ["request_status=REQUESTED", "count_toward_capacity=true at request_depth <= 1", "request_origin=MEMBER_INITIATED", "ancillary_charge_cents=0 while REQUESTED", "recompute HostBusiness.committed_sites, free_sites, posture"]

  - method: GET
    path: "/api/stay-requests"
    description: "List stay requests, filterable by host, member, vehicle, assigned site or status"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["host_id?", "member_id?", "vehicle_id?", "confirmed_site_id?", "request_status?", "from_date?", "limit?", "offset?"]
    output: StayRequest[]
    side_effects: []

  - method: GET
    path: "/api/stay-requests/{requestId}"
    description: "Get a specific stay request with its computed charges"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: StayRequest
    side_effects: []

  - method: POST
    path: "/api/stay-requests/{requestId}/decisions"
    description: "Host confirms or declines a stay request, optionally naming the site to assign"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: [decision, "site_id?", expected_host_version]
    output: StayRequest
    side_effects: ["request_status -> CONFIRMED or DECLINED", "CONFIRM sets confirmed_site_id and computes ancillary_charge_cents", "DECLINE recomputes the member standing and strike fields", "recompute HostBusiness.committed_sites, free_sites, posture", "increments HostBusiness.version by 1"]

  - method: POST
    path: "/api/stay-requests/{requestId}/cancellations"
    description: "Member cancels a requested or confirmed stay"
    roles: [Member]
    code: 200
    input: []
    output: StayRequest
    side_effects: ["request_status=CANCELLED", "a CONFIRMED cancellation computes cancellation_fee_cents against the stored ancillary_charge_cents", "recompute HostBusiness.committed_sites, free_sites", "recompute member standing, strike and guest-pass fields"]

  - method: POST
    path: "/api/stay-requests/{requestId}/counter_requests"
    description: "Member asks the host to revisit a declined, cancelled or no-show request, once"
    roles: [Member]
    code: 200
    input: ["arrival_date?", "nights?", "party_size?"]
    output: StayRequest
    side_effects: ["request_status=REQUESTED with request_depth=2", "recompute HostBusiness.committed_sites, free_sites", "recompute member standing, strike and guest-pass fields"]

  - method: POST
    path: "/api/stay-requests/{requestId}/check_ins"
    description: "Host records member arrival at the site"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: StayRequest
    side_effects: ["request_status=CHECKED_IN", "checked_in_at=current logical clock"]

  - method: POST
    path: "/api/stay-requests/{requestId}/check_outs"
    description: "Host records member departure, releasing the site"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: StayRequest
    side_effects: ["request_status=CHECKED_OUT", "checked_out_at=current logical clock", "Member.total_stays_completed += 1", "recompute HostBusiness.committed_sites, free_sites, posture", "guest-pass pool reset when the member has no in-flight stay"]

  - method: POST
    path: "/api/stay-requests/{requestId}/no_show_records"
    description: "Host records that a confirmed member never arrived"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: [narrative]
    output: StayRequest
    side_effects: ["request_status=NO_SHOW", "auto-creates a MAJOR Incident with origin=STAFF_FILING", "cascade: member standing and strike recomputed, strike_count >= 3 -> REMOVED, in-flight reservations released", "recompute HostBusiness.committed_sites, free_sites"]

  # --- HostReview (the host/member review exchange) ---
  - method: POST
    path: "/api/reviews"
    description: "Post a review in a host/member exchange: host-author by HostOperator, member-author by the member, or a counter-review answering an existing review"
    roles: [HostOperator, Member]
    code: 201
    input: ["host_id?", "subject_member_id?", "author_member_id?", "subject_host_id?", "author_review_id?", rating, public_note, advance_notice_hours, "private_report?", "expected_host_version?"]
    output: HostReview
    side_effects: ["author_kind=HOST when the actor is HostOperator, MEMBER when the actor is Member", "review_status=PUBLISHED", "recompute HostBusiness.host_rating_average and Member.member_rating_average through host_review_rating_aggregate and member_review_aggregate", "counter_review_count of author_review_id incremented when author_review_id is present", "a non-empty private_report on a host-author review auto-creates a REVIEW_REPORT Incident with severity=MAJOR"]

  - method: GET
    path: "/api/reviews"
    description: "List reviews in host/member exchanges"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["host_id?", "author_member_id?", "subject_member_id?", "subject_host_id?", "author_review_id?", "author_kind?", "review_status?", "limit?", "offset?"]
    output: HostReview[]
    side_effects: []

  - method: GET
    path: "/api/reviews/{reviewId}"
    description: "Get a specific review"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: HostReview
    side_effects: []

  - method: POST
    path: "/api/reviews/{reviewId}/withdrawals"
    description: "Author withdraws a published review"
    roles: [HostOperator, Member, PlatformAdmin]
    code: 200
    input: []
    output: HostReview
    side_effects: ["review_status=WITHDRAWN", "recompute HostBusiness.host_rating_average and Member.member_rating_average through both rating aggregates", "a REVIEW_REPORT Incident sourced from this review -> WITHDRAWN and its subject member's standing and strike fields recomputed"]

  # --- Incident ---
  - method: POST
    path: "/api/incidents"
    description: "File a conduct incident against a member"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 201
    input: [member_id, host_id, severity, narrative, "origin?"]
    output: Incident
    side_effects: ["incident_status=OPEN", "waived_days_remaining=0", "recompute the member's standing_score and strike_count"]

  - method: GET
    path: "/api/incidents"
    description: "List conduct incidents"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["member_id?", "host_id?", "incident_status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: GET
    path: "/api/incidents/{incidentId}"
    description: "Get a specific conduct incident"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/api/incidents/{id}/dispositions"
    description: "Review board rules on an open incident: uphold it, dismiss it, or withdraw it when the originating report is retracted"
    roles: [Member]
    code: 200
    input: [action, decided_by_display_name, "requested_decision?"]
    output: Incident
    side_effects: ["action=UPHOLD sets incident_status=UPHELD and waived_days_remaining=3 for MINOR or MAJOR, 7 for SEVERE", "action=DISMISS sets incident_status=DISMISSED", "action=WITHDRAW sets incident_status=WITHDRAWN and waived_days_remaining=0", "recompute the member's standing_score and strike_count", "strike_count >= 3 -> Member.removal_status=REMOVED via the automatic ACTIVE_to_REMOVED edge"]

  - method: GET
    path: "/api/patronization-records"
    description: "List patronization records"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["host_id?", "member_id?", "stay_request_id?", "verification_status?", "limit?", "offset?"]
    output: HostPatronizationRecord[]
    side_effects: []

  # --- HostPatronizationRecord ---
  - method: POST
    path: "/api/patronization-records"
    description: "Record a member purchase at the host during a stay, minting a verification code"
    roles: [HostOperator, Member]
    code: 201
    input: [host_id, member_id, stay_request_id, receipt_cents, purchase_kind, expected_request_version]
    output: HostPatronizationRecord
    side_effects: ["verification_status=PENDING", "verification_code minted", "host_credit_cents=0 until verified", "increments StayRequest.version by 1"]

  - method: GET
    path: "/api/patronization-records"
    description: "List patronization records"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: ["host_id?", "member_id?", "stay_request_id?", "verification_status?", "limit?", "offset?"]
    output: HostPatronizationRecord[]
    side_effects: []

  - method: GET
    path: "/api/patronization-records/{recordId}"
    description: "Get a specific patronization record"
    roles: [Member, HostOperator, PlatformAdmin]
    code: 200
    input: []
    output: HostPatronizationRecord
    side_effects: []

  - method: POST
    path: "/api/patronization-records/{recordId}/verification"
    description: "Host verifies or rejects a member's purchase receipt"
    roles: [HostOperator, PlatformAdmin]
    code: 200
    input: [action, "verification_code?"]
    output: HostPatronizationRecord
    side_effects: ["action=VERIFY sets verification_status=VERIFIED and computes host_credit_cents, then recomputes HostBusiness.patronization_credit_cents over every VERIFIED record of the host", "action=REJECT sets verification_status=REJECTED leaving host_credit_cents at 0"]

  - method: GET
    path: "/api/members/{id}/dispositions"
    description: "List the dispositions recorded against a member's incidents"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ConductDisposition[]
    side_effects: []

  - method: GET
    path: "/api/incidents/{id}/dispositions"
    description: "List the dispositions recorded against an incident"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ConductDisposition[]
    side_effects: []

  # --- PlatformAdmin test-driving namespace ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to real wall-clock time. Advancing the clock past a window's start_date activates it; rewinding before start_date returns it to SCHEDULED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, activated_window_ids: array, deactivated_window_ids: array }"
    side_effects: ["drives the SCHEDULED -> ACTIVE and ACTIVE -> SCHEDULED window transitions", "recompute effective_capacity, free_sites, posture for every host whose live basis changed"]

  - method: POST
    path: "/api/_members/{memberId}/conduct_injections"
    description: "Test-driving endpoint that seeds a conduct history for a member in one call"
    roles: [PlatformAdmin]
    code: 201
    input: [severity, resolve_as, narrative]
    output: Incident
    side_effects: ["creates an Incident and, unless resolve_as is OPEN, resolves it through the disposition machine", "recompute the member's standing_score and strike_count", "strike_count >= 3 -> Member.removal_status=REMOVED via the automatic ACTIVE_to_REMOVED edge"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not declared in §1.7"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not permitted for the operation, or a Member acts on a resource owned by a different member"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path or body resource id does not resolve; path ids are reported left to right"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input missing, an enum member outside its declared set, or a numeric range violated"

  - id: ERR_HOST_NOT_ACCEPTING_STAYS
    http: 409
    condition: "HostBusiness.onboarding_status is not APPROVED, or posture is SUSPENDED, at request or confirmation time"

  - id: ERR_ORDINANCE_CONSTRAINT
    http: 422
    condition: "The (state_code, category) ordinance profile's nightly member site cap or forced self-containment is violated"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state that does not permit the requested operation"

  - id: ERR_REQUEST_LEAD_TIME
    http: 422
    condition: "Stay request filed inside the 48-hour lead-time guard with same_day_hold false"

  - id: ERR_STAY_WINDOW_PASSED
    http: 422
    condition: "Counter-request filed after StayRequest.occupancy_end has passed"

  - id: ERR_VEHICLE_OCCUPANCY_OVERLAP
    http: 409
    condition: "Session/closing reasoning: two stays on one MemberVehicle whose occupancy intervals touch or overlap"

  - id: ERR_SITE_APPROACH_BLOCKED
    http: 409
    condition: "Assigned site is blocked by a circulating stay on a site named in its blocks_sites over the 2-hour buffered interval"

  - id: ERR_HOST_CAPACITY_FULL
    http: 409
    condition: "HostBusiness.free_sites < 1, or posture is UNAVAILABLE"

  - id: ERR_DUPLICATE_SITE_LABEL
    http: 409
    condition: "HostParkingSite.site_label already exists on the same host"

  - id: ERR_MEMBER_EMAIL_DUPLICATE
    http: 409
    condition: "Member.email already registered"

  - id: ERR_VEHICLE_LENGTH_EXCEEDS_SITE
    http: 422
    condition: "Assigned site is shorter than MemberVehicle.length_feet"

  - id: ERR_SITE_ELECTRIC_INCOMPATIBLE
    http: 422
    condition: "Assigned site's electric_service_code is less capable than StayRequest.electric_request_code"

  - id: ERR_VEHICLE_NOT_SELF_CONTAINED
    http: 422
    condition: "Host requires self-contained rigs but the vehicle's self_contained flag is false or its inspection record is absent"

  - id: ERR_MEMBER_NOT_ELIGIBLE
    http: 403
    condition: "subscription_status is not ACTIVE or removal_status is REMOVED"

  - id: ERR_REVIEW_NOT_ELIGIBLE
    http: 403
    condition: "Member-author review posted with no completed stay between that member and the host"

  - id: ERR_DISPOSITION_NAME_COLLISION
    http: 409
    condition: "decided_by_display_name is not segmented from every other Member.full_name"

  - id: ERR_WINDOW_CAPACITY_BELOW_RESERVED
    http: 422
    condition: "capacity_override < reserved_sites, or end_date is not strictly after start_date"

  - id: ERR_WINDOW_EVICTS_CONFIRMED_STAY
    http: 422
    condition: "A window amendment would drop member_capacity_ceiling below the count of CONFIRMED stays inside the window"

  - id: ERR_BALANCE_DUE
    http: 402
    condition: "Outstanding membership dues or unpaid cancellation fees block a new stay request"

  - id: ERR_STALE_HOST_VERSION
    http: 412
    condition: "expected_host_version does not equal the current HostBusiness.version"

  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not equal the current StayRequest.version"

  - id: ERR_WINDOW_NOT_ACTIVE
    http: 409
    condition: "Amendment attempted on a window that is not ACTIVE"

  - id: ERR_PATRONIZATION_CODE_INVALID
    http: 422
    condition: "Verification code supplied for a patronization record does not match the minted code"

  - id: ERR_REVIEW_ALREADY_WITHDRAWN
    http: 409
    condition: "Withdrawal attempted on a review already in WITHDRAWN status"

  - id: ERR_INCIDENT_NOT_OPEN
    http: 409
    condition: "Disposition attempted on an incident that is not OPEN"

# =============================================================================
# §1.7 RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller. May only register a new member; every other operation requires an authenticated role."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/members — register a member"
    shared_operations: []

  - name: Member
    description: "Subscribing camper. Owns their subscription, their vehicles and their stay requests, and is the only role that may file counter-requests, dispositions and patronization records."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/stay-requests — file a stay request"
      - "POST /api/stay-requests/{requestId}/cancellations — cancel a stay"
      - "POST /api/stay-requests/{requestId}/counter_requests — counter-request a host decision"
      - "POST /api/members/{memberId}/cancellations — cancel own subscription"
      - "POST /api/incidents/{incidentId}/dispositions — rule on a conduct incident"
      - "POST /api/reviews as a member author or counter-review"
    shared_operations:
      - "POST /api/members/{memberId}/vehicles — declare a vehicle"
      - "GET on every list and detail route"

  - name: HostOperator
    description: "Staff of one host business. Owns that host's sites, availability windows, stay decisions, stay check-ins and check-outs, patronization verification and the host side of the review exchange. X-User-ID must equal the id of the HostBusiness being operated on."
    identity: "entity_backed:HostBusiness"
    exclusive_operations:
      - "POST /api/stay-requests/{requestId}/decisions — confirm or decline a stay"
      - "POST /api/stay-requests/{requestId}/check_ins and /check_outs — record arrival and departure"
      - "POST /api/stay-requests/{requestId}/no_show_records — record a no-show"
      - "POST /api/availability-windows — declare a seasonal or event window"
      - "POST /api/availability-windows/{windowId}/amend and /cancellations"
      - "POST /api/patronization-records/{recordId}/verification — verify a purchase"
      - "POST /api/reviews as a host author"
    shared_operations:
      - "POST /api/hosts — declare a host"
      - "PATCH /api/hosts/{hostId} — update host declarations"
      - "POST /api/hosts/{hostId}/parking-sites — declare a site"

  - name: PlatformAdmin
    description: "Platform operator. Handles host onboarding, suspensions and reinstatements, subscription state, the logical clock and the test-driving namespace. Not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/hosts/{hostId}/decisions — onboarding, suspension and reinstatement rulings"
      - "POST /api/members/{memberId}/subscription_actions — subscription state transitions"
      - "POST /api/_clock/set_current_utc — set the logical clock"
      - "POST /api/_members/{memberId}/conduct_injections — seed conduct history"
    shared_operations:
      - "POST /api/members — register a member"
      - "POST /api/incidents — file a conduct incident"
      - "POST /api/reviews/{reviewId}/withdrawals — withdraw a review"
      - "GET on every list and detail route"
