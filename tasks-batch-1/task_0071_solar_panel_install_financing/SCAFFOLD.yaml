        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this plan finances."
      - name: model
        type: enum
        source: input
        description: "Financing model. Branches downstream economics and ITC/SREC ownership."
        constraints: "enum: {PPA, LEASE, LOAN}"
      - name: status
        type: enum
        source: system
        description: "FinancingPlan lifecycle state."
        default: DRAFT
        constraints: "enum: {DRAFT, ACTIVE, TERMINATED}"
      - name: term_years
        type: integer
        source: input
        description: "Contract term in years. PPA/LEASE: 1–25; LOAN: 1–25."
        constraints: "1 <= x <= 25"
      - name: ppa_rate_cents_per_kwh
        type: number
        source: input
        description: "PPA energy price in cents/kWh (PPA only; ignored for LEASE/LOAN)."
        default: 0.0
        constraints: ">= 0"
      - name: ppa_escalator_pct
        type: number
        source: input
        description: "Annual PPA price escalator as a fraction (e.g., 0.029 = 2.9%/yr). PPA only."
        default: 0.0
        constraints: "0.0 <= x <= 0.10"
      - name: lease_monthly_cents
        type: integer
        source: input
        description: "Fixed monthly lease payment in cents (LEASE only)."
        default: 0
        constraints: ">= 0"
      - name: loan_principal_cents
        type: integer
        source: input
        description: "Loan principal in cents (LOAN only)."
        default: 0
        constraints: ">= 0"
      - name: loan_apr
        type: number
        source: input
        description: "Loan nominal annual interest rate as a fraction (LOAN only)."
        default: 0.0
        constraints: "0.0 <= x <= 0.30"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Computed level monthly payment in cents (calc: financing_monthly_payment); model-dependent."
        default: 0
      - name: srec_owner
        type: enum
        source: computed
        description: "Who owns minted SRECs under this model. LOAN -> HOMEOWNER; PPA/LEASE -> FINANCIER. Set on plan creation."
        constraints: "enum: {HOMEOWNER, FINANCIER}"
      - name: itc_beneficiary
        type: enum
        source: computed
        description: "Who claims the Federal ITC. LOAN -> HOMEOWNER; PPA/LEASE -> FINANCIER. Set on plan creation."
        constraints: "enum: {HOMEOWNER, FINANCIER}"

