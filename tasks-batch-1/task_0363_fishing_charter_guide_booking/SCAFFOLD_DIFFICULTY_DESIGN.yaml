  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: charter_cancel_to_booking_cancel_to_addon_void
        grounds:
          - state_machines.Charter.transitions.DRAFT_SCHEDULED_WEATHER_HOLD_to_CANCELLED
          - state_machines.Booking.transitions.RESERVED_CONFIRMED_to_CANCELLED
          - state_machines.AddOnLine.transitions.PENDING_FULFILLED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain from charter cancel: Charter -> CANCELLED mutates each Booking ->
          CANCELLED, and that booking mutation itself mutates each AddOnLine -> VOIDED.
          Each hop is caused by the prior hop, not directly by the cancel call.
        test_recipe:
          setup:
            - "Charter SCHEDULED with a CONFIRMED booking that carries a PENDING add-on line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Casc Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "E1", max_boat_length_ft: 40 }
              as: DockMaster
