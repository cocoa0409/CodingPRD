            - call: "POST /complaints/${cmp_id}/triage"
              payload: { route: "REMEDIATION" }
              as: AccessibilityLead
            - call: "POST /complaints/${cmp_id}/link-issue"
              payload: { known_issue_id: "${iss_id}" }
              as: AccessibilityLead
              captures: { linked_state: $.data.state }
          trigger:
            - call: "POST /complaints/${cmp_id}/close"
              payload: { closure_outcome: "REMEDIATION_SCHEDULED" }
              as: AccessibilityLead
              captures: { blocked: $.data.error_id }
            - call: "POST /known-issues/${iss_id}/resolve"
              payload: { resolution_note: "Accessible names added to every thumbnail", resolution_run_id: "${run_sr_id}" }
              as: AccessibilityTester
              captures: { resolved_state: $.data.state }
            - call: "POST /complaints/${cmp_id}/close"
              payload: { closure_outcome: "REMEDIATION_SCHEDULED" }
              as: AccessibilityLead
              captures: { closed_state: $.data.state }
          assert:
            - "${committed_state} == COMMITTED"
            - "${linked_state} == LINKED"
            - "First close returns HTTP 409 and ${blocked} == ERR_LINKED_ISSUE_UNRESOLVED"
            - "${resolved_state} == RESOLVED"
            - "KnownIssue.${iss_id}.resolved_at == 2026-08-01T00:00:00Z"
            - "ReleaseTrain.${train_id}.committed_effort_points == 0"
            - "${closed_state} == CLOSED"
            - "Complaint.${cmp_id}.closure_outcome == REMEDIATION_SCHEDULED"
            - "Complaint.${cmp_id}.linked_issue_id == ${iss_id}"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: environment_reconfiguration_buffer_is_half_open
        grounds:
          - validations[priority=63]
          - entities.TestEnvironment.fields.reconfiguration_buffer_minutes
          - entities.AssessmentRun.fields.scheduled_start
        distinguishing_aspect: |
          Overlap 1 of 2 guards the TestEnvironment bench with half-open timestamp intervals that
          are inflated by a per-bench reconfiguration buffer: a run at 12:15 collides with the
          09:00-12:00 booking whose busy window runs to 12:30, and a run starting exactly at 12:30
          is admitted because the busy interval excludes its own endpoint.
        test_recipe:
          setup:
            - "One SCREEN_READER bench with reconfiguration_buffer_minutes 30"
            - "One in-scope component with applicable_criteria_count 40"
            - "One SCHEDULED MANUAL run occupies 2026-08-03T09:00:00Z..12:00:00Z, so the bench is busy over [09:00, 12:30)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_first_id: $.data.id, first_status: $.data.status }
          trigger:
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "AUTOMATED", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T12:15:00Z", scheduled_end: "2026-08-03T13:15:00Z", criteria_exercised: 10, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { conflict_error: $.data.error_id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "AUTOMATED", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T12:30:00Z", scheduled_end: "2026-08-03T13:30:00Z", criteria_exercised: 10, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { accepted_id: $.data.id, accepted_status: $.data.status }
          assert:
            - "${first_status} == SCHEDULED"
            - "Overlapping create returns HTTP 409 and ${conflict_error} == ERR_ENVIRONMENT_WINDOW_CONFLICT (12:15 falls inside the busy window [09:00, 12:30))"
            - "Adjacent create returns HTTP 201 and ${accepted_status} == SCHEDULED"
            - "AssessmentRun.${accepted_id}.scheduled_start == 2026-08-03T12:30:00Z"
            - "AssessmentRun.${accepted_id}.environment_id == ${env_sr_id}"
            - "ProductComponent.${comp_id}.evidence_units_total == 0 (scheduling alone credits no coverage)"

      - name: release_train_windows_require_a_full_day_gap
        grounds:
          - validations[priority=64]
          - entities.ReleaseTrain.fields.window_start
          - entities.ReleaseTrain.fields.window_end
        distinguishing_aspect: |
          Overlap 2 of 2 guards a different resource entity (ReleaseTrain delivery capacity) under
          the opposite interval semantics: closed calendar-date windows that must not even touch.
          2026-10-01 is rejected against a train ending 2026-09-30 despite zero intersection, and
          2026-10-02 is admitted — the inverse of the half-open bench rule.
        test_recipe:
          setup:
            - "One release train already occupies the closed window 2026-09-01..2026-09-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-01", window_end: "2026-09-30", freeze_days: 5, effort_capacity_points: 10, remediation_budget_cents: 60327 }
              as: AccessibilityLead
              captures: { train_sep_id: $.data.id, sep_end: $.data.window_end }
          trigger:
            - call: "POST /release-trains"
              payload: { name: "Train 2026.10 touching", window_start: "2026-10-01", window_end: "2026-10-31", freeze_days: 5, effort_capacity_points: 10, remediation_budget_cents: 0 }
              as: AccessibilityLead
              captures: { adjacent_error: $.data.error_id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.10 gapped", window_start: "2026-10-02", window_end: "2026-10-31", freeze_days: 5, effort_capacity_points: 10, remediation_budget_cents: 0 }
              as: AccessibilityLead
              captures: { accepted_train_id: $.data.id, accepted_start: $.data.window_start }
          assert:
            - "${sep_end} == 2026-09-30"
            - "Touching create returns HTTP 409 and ${adjacent_error} == ERR_TRAIN_WINDOW_ADJACENT (a zero-day gap is not a gap)"
            - "Gapped create returns HTTP 201 and ${accepted_start} == 2026-10-02"
            - "ReleaseTrain.${accepted_train_id}.allocation_state == UNALLOCATED"
            - "ReleaseTrain.${accepted_train_id}.unallocated_cents == 0"
            - "ReleaseTrain.${train_sep_id}.window_end == 2026-09-30 (untouched by either attempt)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: remediation_budget_conservation
        grounds:
          - calculations.remediation_budget_allocation
          - entities.ReleaseTrain.fields.unallocated_cents
          - entities.KnownIssue.fields.funded_cents
          - validations[priority=40]
        distinguishing_aspect: |
          Conserved quantity 1 of 2 is money: remediation_budget_cents == unallocated_cents +
          SUM(funded_cents) must hold both after the waterfall grants 3 x 20109 cents and after
          deallocation returns every cent, with no rounding drift left behind in the remainder.
        test_recipe:
          setup:
            - "Release train 2026.09 with remediation_budget_cents 60327, capacity 10 points, window 2026-09-01..2026-09-30 and freeze_days 5"
            - "Three COMMITTED known issues of one effort point each (BLOCKER, SERIOUS, MODERATE) with target_remediation_date 2026-09-10"
            - "The waterfall has already run, so each issue is FULLY_FUNDED at 20109 cents and unallocated_cents is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-01", window_end: "2026-09-30", freeze_days: 5, effort_capacity_points: 10, remediation_budget_cents: 60327 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_blocker_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_serious_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "MODERATE", summary: "Status messages are not announced politely", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_moderate_id: $.data.id }
            - call: "POST /known-issues/${iss_blocker_id}/triage"
              payload: { triage_note: "Reproduced on Windows and macOS" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_serious_id}/triage"
              payload: { triage_note: "Reproduced with NVDA" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_moderate_id}/triage"
              payload: { triage_note: "Reproduced with VoiceOver" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_blocker_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_serious_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_moderate_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
            - call: "POST /release-trains/${train_id}/allocate-budget"
              payload: { product_id: "${prod_id}" }
              as: AccessibilityLead
              captures: { remainder_after_allocate: $.data.unallocated_cents, state_after_allocate: $.data.allocation_state }
          trigger:
            - call: "POST /release-trains/${train_id}/deallocate-budget"
              payload: { product_id: "${prod_id}", reason: "Train scope pulled back for re-planning" }
              as: AccessibilityLead
              captures: { remainder_after_deallocate: $.data.unallocated_cents, state_after_deallocate: $.data.allocation_state }
          assert:
            - "${remainder_after_allocate} == 0"
            - "${state_after_allocate} == ALLOCATED"
            - "Invariant before: 60327 == 0 + 20109 + 20109 + 20109"
            - "${remainder_after_deallocate} == 60327"
            - "${state_after_deallocate} == UNALLOCATED"
            - "KnownIssue.${iss_blocker_id}.funded_cents == 0"
            - "KnownIssue.${iss_serious_id}.funded_cents == 0"
            - "KnownIssue.${iss_moderate_id}.funded_cents == 0"
            - "KnownIssue.${iss_moderate_id}.funding_state == UNFUNDED"
            - "Invariant after: 60327 == 60327 + 0 + 0 + 0"
            - "ReleaseTrain.${train_id}.committed_effort_points == 3 (deallocation returns money, not capacity)"

      - name: evidence_units_conservation
        grounds:
          - calculations.component_testing_coverage_pct
          - entities.ProductComponent.fields.evidence_units_total
          - state_machines.AssessmentRun.COMPLETED_to_VOID
          - entities.ProductComponent.fields.validated_disability_categories
        distinguishing_aspect: |
          Conserved quantity 2 of 2 is testing evidence rather than money: evidence_units_total must
          equal the summed criteria_exercised of the component's COMPLETED runs at every step, so
          voiding the 20-unit keyboard run must return the component from 60 units and 62.50 to
          exactly the 40 units and 45.00 it held before, with the validated category set rebuilt
          from the surviving manual run rather than merely decremented.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40"
            - "A SCREEN_READER bench and a KEYBOARD bench, each with reconfiguration_buffer_minutes 30"
            - "A COMPLETED MANUAL SCREEN_READER run of 40 exercised criteria validating VISION and COGNITIVE, so evidence_units_total is 40 and coverage_pct is 45.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "Keyboard Bench 1", at_profile: "KEYBOARD", at_product_name: "Keyboard only", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_kb_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_sr_id: $.data.id }
            - call: "POST /assessment-runs/${run_sr_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { units_before: $.data.evidence_units_total, cov_before: $.data.coverage_pct }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_kb_id}", method: "MANUAL", at_profile: "KEYBOARD", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T11:00:00Z", criteria_exercised: 20, disability_categories_validated: ["MOTOR"] }
              as: AccessibilityTester
              captures: { run_kb_id: $.data.id }
            - call: "POST /assessment-runs/${run_kb_id}/complete"
              payload: { defects_found: 5 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { units_peak: $.data.evidence_units_total, cov_peak: $.data.coverage_pct }
          trigger:
            - call: "POST /assessment-runs/${run_kb_id}/void"
              payload: { void_reason: "Keyboard bench had a stuck modifier key throughout the session" }
              as: AccessibilityTester
              captures: { void_status: $.data.status }
          assert:
            - "${units_before} == 40"
            - "${cov_before} == 45.00"
            - "${units_peak} == 60"
            - "${cov_peak} == 62.50"
            - "${void_status} == VOID"
            - "ProductComponent.${comp_id}.evidence_units_total == 40 (exactly the pre-keyboard total, no drift)"
            - "ProductComponent.${comp_id}.coverage_pct == 45.00"
            - "ProductComponent.${comp_id}.assessment_state == COMPLETE (45.00 still meets MIN_ATTEST_COVERAGE_PCT, so no revalidation cascade fires)"
            - "ProductComponent.${comp_id}.validated_disability_categories == [VISION, COGNITIVE] (rebuilt from the surviving MANUAL run, MOTOR removed)"
            - "AssessmentRun.${run_sr_id}.status == COMPLETED"
            - "Product.${prod_id}.components_complete_count == 1"
