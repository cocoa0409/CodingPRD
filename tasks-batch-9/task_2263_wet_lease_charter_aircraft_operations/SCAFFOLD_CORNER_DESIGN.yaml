      - name: withheld_consent_is_terminal_and_survives_a_later_superseding_request
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AircraftSubstitution[LESSEE_CONSENT_PENDING -> REJECTED]
          - state_machines.AircraftSubstitution[LESSEE_CONSENT_PENDING -> WITHDRAWN]
          - validations[priority 44 ERR_SUBSTITUTION_INVALID_STATE]
          - endpoints[POST /wetlease/substitutions/{substitutionId}/consent]
        distinguishing_aspect: |
          WITHHOLD is a hard refusal, not a pause: REJECTED accepts neither an effectuate nor a second
          consent, both of which are 409 ERR_SUBSTITUTION_INVALID_STATE - and note the effectuate here
          must NOT be the 403 ERR_SUBSTITUTION_CONSENT_REQUIRED that the same call produces from
          LESSEE_CONSENT_PENDING, because priority 44's fall-through is scoped to that one source state.
          Supersession is likewise scoped: a later request on the same lease withdraws only OPEN
          requests, so the REJECTED row must remain REJECTED and the WITHDRAWN listing must be empty.
          The consent_note recorded with the refusal is preserved.
          
