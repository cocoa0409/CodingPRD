            - { call: "POST /properties/${p15}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G15", email: "g15@x.com" }, as: Anonymous, captures: { g15: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p15}", guest_id: "${g15}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { bx: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { property_id: "${p15}", guest_id: "${g15}", check_in: "2026-07-04T00:00:00Z", check_out: "2026-07-06T00:00:00Z" }, as: PropertyManager, captures: { badj: "$.data.id", adj_stay: "$.data.stay_status" } }
            - { call: "POST /bookings", payload: { property_id: "${p15}", guest_id: "${g15}", check_in: "2026-07-03T00:00:00Z", check_out: "2026-07-05T00:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
