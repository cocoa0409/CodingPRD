            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_s10}", full_name: "Dana Reyes", ownership_pct: "100.00", country_code: "US", date_of_birth: "1980-05-05", government_id_last4: "1234" }
              as: Applicant
              as_user_id: "${app_s10}"
              captures: { own_s10: "$.data.id" }
            - call: "POST /merchant-applications/${app_s10}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_s10}"
          trigger:
            - call: "POST /business-verifications"
              payload: { application_id: "${app_s10}", registry_match: false, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
              captures: { bv1_s10: "$.data.id" }
            - call: "GET /merchant-applications/${app_s10}"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_s10}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_s10}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_s10}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
              captures: { bv2_s10: "$.data.id" }
          assert:
            - "BusinessVerification.${bv1_s10}.attempt_index == 1"
            - "BusinessVerification.${bv1_s10}.mismatch_count == 1"
            - "BusinessVerification.${bv1_s10}.status == FAILED"
            - "after the first verification MerchantApplication.${app_s10}.state == INFO_REQUESTED"
            - "after the first verification MerchantApplication.${app_s10}.outstanding_info_items == [REGISTRY_MATCH]"
            - "after the first verification MerchantApplication.${app_s10}.verification_attempt_count == 1"
            - "after the resubmit MerchantApplication.${app_s10}.state == SUBMITTED"
            - "after the resubmit MerchantApplication.${app_s10}.outstanding_info_items == []"
            - "BusinessVerification.${bv2_s10}.attempt_index == 2"
            - "BusinessVerification.${bv2_s10}.mismatch_count == 0"
            - "BusinessVerification.${bv2_s10}.status == PASSED"
            - "MerchantApplication.${app_s10}.state == IN_VERIFICATION"
            - "MerchantApplication.${app_s10}.verification_attempt_count == 2"
            - "GET /merchant-applications/${app_s10}/business-verifications returns meta.total_count == 2"
