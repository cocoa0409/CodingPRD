  - rule_id: compensating_invariant
    instances:

      - name: order_cancel_conserves_store_stock_units
        grounds:
          - state_machines.ProOrder.fulfillment_status.RESERVED_to_CANCELLED
          - state_machines.Reservation.ALLOCATED_to_RELEASED
          - entities.StoreStock.fields.reserved_units
          - entities.StoreStock.fields.available_units
          - entities.CreditLine.fields.exposure_cents
        distinguishing_aspect: |
          Conserved quantity #1 = physical stock units at the sourcing store. Reserving 40 units moves
          reserved 0 -> 40 and available 600 -> 560; cancelling the order must put the ledger back exactly
          (reserved 40 -> 0, available 560 -> 600) with on_hand_units untouched at 600 and no orphan
          reservation left in HELD/ALLOCATED. The credit authorization is voided in the same breath, so
          exposure returns to 0 with no drift.
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825) stocking SHINGLE-BUNDLE at list 1999 with exactly 600 on hand."
            - "GOLD account (baseline 6000000) with a 1000000-cent credit line."
            - "A 40-unit will-call CREDIT_LINE order submitted, reserved and allocated (total 82227, exposure 82227)."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
              captures: { stock_main_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Ridgeline Roofing", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 6000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "${acct_id}", limit_cents: 1000000, terms_days: 30 }
              as: CreditManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CREDIT_LINE", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 40 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "assoc-1"
              captures: { resv_id: "$.data[0].id" }
            - call: "POST /pro/reservations/${resv_id}/allocate"
              payload: {}
              as: StoreOperations
              as_user_id: "ops-1"
            - call: "GET /pro/store-stocks/${stock_main_id}"
              payload: {}
              as: StoreOperations
              as_user_id: "ops-1"
              captures: { before_on_hand: "$.data.on_hand_units", before_reserved: "$.data.reserved_units", before_available: "$.data.available_units" }
            - call: "GET /pro/credit-lines/${cl_id}"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
              captures: { before_exposure: "$.data.exposure_cents" }
          trigger:
            - call: "POST /pro/pro-orders/${order_id}/cancel"
              payload: { reason_code: "JOB_POSTPONED" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          assert:
            - "${before_on_hand} == 600"
            - "${before_reserved} == 40"
            - "${before_available} == 560"
            - "${before_exposure} == 82227"
            - "ProOrder.${order_id}.total_cents == 82227"
            - "ProOrder.${order_id}.fulfillment_status == CANCELLED"
            - "ProOrder.${order_id}.credit_status == VOIDED"
            - "Reservation.${resv_id}.status == RELEASED"
            - "Reservation.${resv_id}.released_reason_code == ORDER_CANCELLED"
            - "StoreStock.${stock_main_id}.on_hand_units == 600"
            - "StoreStock.${stock_main_id}.reserved_units == 0"
            - "StoreStock.${stock_main_id}.available_units == 600"
            - "CreditLine.${cl_id}.exposure_cents == 0"
            - "CreditLine.${cl_id}.available_cents == 1000000"
            - "CreditLine.${cl_id}.status == ACTIVE"
            - "GET /pro/reservations?pro_order_id=${order_id}&status=HELD returns 0 rows"

      - name: return_credit_conserves_rebate_against_net_volume
        grounds:
          - calculations.rebate_accrual_and_clawback
          - state_machines.ReturnRequest.APPROVED_to_CREDITED
          - entities.RebateAccrual.fields.clawed_back_cents
          - entities.ProAccount.fields.rebate_accrued_cents
          - entities.ProOrder.fields.net_volume_cents
        distinguishing_aspect: |
          A different conserved quantity — the rebate ledger measured against net invoiced volume. After
          invoicing a 12000-cent quote-bound order the GOLD 1% accrual is 120 on net volume 12000; crediting
          a 6000-cent gross return must claw back exactly 60, leaving payable 60 against net volume 6000,
          i.e. the 1% relationship survives the reversal (60 == round_half_up(6000 * 0.010)) and the
          account's trailing volume drops by exactly the returned gross.
        test_recipe:
          setup:
            - "Store HD-101 (IL, tax 0.0825) stocking SHINGLE-BUNDLE at list 1999 with 600 on hand."
            - "GOLD account (baseline 6000000, rebate_rate_pct 0.010) with a 100000000-cent credit line."
