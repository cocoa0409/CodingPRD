            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 200000001, window_start: "2026-10-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_one_cent: $.data.error_id }
            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 200000000, window_start: "2026-10-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { sa4: $.data.id }
            - call: "POST /builders-risk/storage-assignments/${sa1}/release"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { sa1_status: $.data.status, sa1_reason: $.data.release_reason }
            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 100000000, window_start: "2026-11-15T00:00:00Z", window_end: "2026-12-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { sa5: $.data.id }
          assert:
            - "sa1 and sa2 are both APPROVED: window_start 2026-12-01 touching window_end 2026-12-01 is not an overlap, so peak exposure stayed at 400000000 while the two rows total 700000000"
            - "err_straddle == ERR_FACILITY_CAPACITY_EXCEEDED with HTTP 422 - the straddling window overlaps both incumbents, giving a peak of 100000000 + 300000000 + 400000000 = 800000000"
            - "err_one_cent == ERR_FACILITY_CAPACITY_EXCEEDED at a peak of exactly 500000001"
            - "the 200000000 retry over the identical window succeeds (sa4 APPROVED) at a peak of exactly 500000000 - the comparison is strictly greater-than"
            - "sa1_status == RELEASED and sa1_reason == MANUAL"
            - "sa5 is APPROVED: with sa1 RELEASED the same window that produced err_straddle now peaks at 100000000 + 400000000 = 500000000 (sa4 ends exactly when sa5 starts, so it does not count)"
            - "StorageFacility.${f1}.committed_value_cents == 700000000 at the end - the plain sum over APPROVED rows (sa2 400000000 + sa4 200000000 + sa5 100000000), with the RELEASED sa1 contributing 0, even though no instant ever carried more than 500000000"
            - "GET /builders-risk/facilities/${f1}/storage-assignments returns exactly 4 rows, one RELEASED and three APPROVED"
      - name: testing_window_hot_work_buffer_is_symmetric_and_rejects_a_one_second_shortfall
        grounds:
          - calculations.testing_window_separation
          - validations[priority=80].ERR_TESTING_WINDOW_CONFLICT
          - entities.TestingCommissioningNotice.fields.hot_work
        distinguishing_aspect: |
          A different shared resource (the project's testing/commissioning calendar) and different
          interval semantics from the facility instance: separation is buffered rather than plain,
          the buffer is 24 hours rather than zero, it is symmetric so it applies when EITHER side
          carries hot_work, and it degrades to bare half-open overlap when neither does. The same
          window is refused with hot_work true and admitted with hot_work false, a hot-work notice
          one second short of the buffer is refused while exactly 24 hours passes, and a
          non-hot-work notice is still buffered against an incumbent hot-work notice.
        test_recipe:
          setup:
            - "One project screened ELIGIBLE with engineering_grade B, so hot_work notices need no mitigation_plan_ref."
            - "Notice T1: SPRINKLER_HYDROSTATIC, 2027-03-01T08:00:00Z to 2027-03-01T17:00:00Z, hot_work false, water_charged true."
            - "No policy is needed - notices attach to the project."
