# §1.8 Scaffold Difficulty Design - Test Targeting Index
# Task 2218 - Camp Accreditation & Health Care Compliance
# Nine §0.5 Difficulty Rules; 19 differentiated instances.
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: mandatory_compliance_score_provisional_versus_office_final_diverge
        grounds:
          - calculations.mandatory_compliance_score
          - calculations.mandatory_compliance_score.variants.visit_provisional
          - calculations.mandatory_compliance_score.variants.office_final
          - calculations.accreditation_decision_level
          - entities.StandardEvaluation.fields.score_source
          - entities.StandardEvaluation.fields.visitor_score
          - entities.AccreditationVisit.fields.provisional_mandatory_pct
          - entities.AccreditationCycle.fields.final_mandatory_pct
          - state_machines.AccreditationCycle.VISIT_SCHEDULED_to_VISIT_COMPLETED
        distinguishing_aspect: |
          This instance lives in the compliance-scoring domain (AccreditationCycle /
          StandardEvaluation): the visit_provisional variant drops INTERVIEW-sourced
          rows and visitor NOT_APPLICABLE rows from BOTH sides of the fraction while
          office_final keeps every applicable mandatory row in the denominator, so
          the identical four stored rows yield 100.00 in the field and 75.00 at the
          national office - a 25.00 point delta that flips the outcome to DENIED.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-D is PUBLISHED with exactly four universal mandatory SUPERVISION standards, scoring_weight 1 each, no written plan required."
            - "Pine Day Camp is a DAY / YOUTH_ONLY camp in OH with no program elements and health_staffing_level FIRST_AIDER_ONLY, so required_health_staffing_level is FIRST_AIDER_ONLY and compliance_posture is OPEN."
            - "Cycle 2026 pins ACA-2026-D: applicable_standard_count 4, applicable_mandatory_count 4."
            - "Self-assessment is complete and submitted; a two-person visitor team is scheduled for 2026-09-01..2026-09-05 and the visit is IN_PROGRESS at logical clock 2026-09-02T09:00:00Z."
            - "All four mandatory standards carry a visitor score: MET/OBSERVED, MET/INTERVIEW, NOT_APPLICABLE/OBSERVED, MET/DOCUMENT."
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-D", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { dset_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${dset_id}", code: "SU.1", title: "Staff supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { d1_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${dset_id}", code: "SU.2", title: "Staff screening", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { d2_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${dset_id}", code: "SU.3", title: "Staff orientation", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { d3_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${dset_id}", code: "SU.4", title: "Camper supervision plan", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { d4_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets/${dset_id}/publish"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Pine Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 80, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${dset_id}", cycle_year: 2026, expected_camp_version: "${camp_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${d1_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev1_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${d2_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev2_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${d3_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev3_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${d4_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev4_id: "$.data[0].id" }
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev2_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev3_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev4_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cyc_id}/submit-self-assessment"
              payload: {}
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Lead One", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_lead_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Member Two", home_state_code: "NY", trained_through_year: 2026, certifications: [] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_mem_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cyc_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_v: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cyc_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-05", expected_cycle_version: "${cyc_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_lead_id}", team_role: "LEAD", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_mem_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/schedule"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/start"
              payload: {}
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev2_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "INTERVIEW" }
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev3_id}/visitor-score"
              payload: { visitor_score: "NOT_APPLICABLE", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev4_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "DOCUMENT" }
              as: Visitor
              as_user_id: "${v_lead_id}"
          trigger:
            - call: "POST /accreditation/visits/${visit_id}/finalize-scoring"
              payload: {}
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "GET /accreditation/cycles/${cyc_id}/compliance-summary"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-2"
            - call: "POST /accreditation/cycles/${cyc_id}/decision"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-2"
          assert:
            - "AccreditationVisit.${visit_id}.provisional_mandatory_pct == 100.00"
            - "AccreditationCycle.${cyc_id}.provisional_mandatory_pct == 100.00"
            - "GET /accreditation/cycles/${cyc_id}/compliance-summary returns provisional_denominator == 2 and provisional_numerator == 2"
            - "GET /accreditation/cycles/${cyc_id}/compliance-summary returns final_denominator == 4 and final_numerator == 3"
            - "AccreditationCycle.${cyc_id}.final_mandatory_pct == 75.00"
            - "AccreditationCycle.${cyc_id}.final_weighted_pct == 75.00"
            - "AccreditationCycle.${cyc_id}.decision_level == DENIED"
            - "AccreditationCycle.${cyc_id}.status == TERMINATED"
            - "AccreditationCycle.${cyc_id}.assessed_fee_cents == 204400"
            - "Camp.${camp_id}.accreditation_status == REVOKED"
            - "GET /accreditation/deficiencies?visit_id=${visit_id} returns total_count == 0"

      - name: camp_risk_index_pre_visit_versus_post_visit_diverge
        grounds:
          - calculations.camp_risk_index
          - calculations.camp_risk_index.variants.pre_visit
          - calculations.camp_risk_index.variants.post_visit
          - calculations.deficiency_penalty_and_deadline
          - entities.Camp.fields.risk_index
          - entities.Camp.fields.risk_index_variant
          - entities.Camp.fields.program_elements
        distinguishing_aspect: |
          This instance lives in the risk-scoring domain (Camp), not the compliance
          domain: the pre_visit variant reads StandardEvaluation.self_score while the
          post_visit variant ignores self scores entirely and reads open Deficiency
          rows, so the very same camp row moves from 74.20 to 46.20 with its
          self_score values untouched and risk_index_variant flipping PRE_VISIT to
          POST_VISIT.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-R is PUBLISHED with three universal mandatory SUPERVISION standards, scoring_weight 1 each."
            - "Ridge Resident Camp is RESIDENT / MEDICALLY_FRAGILE in OH with program_elements [TRANSPORTATION, TRIP_CAMPING], resident_census 140, distance_to_hospital_km 45 and health_staffing_level PHYSICIAN_ONSITE, so required_health_staffing_level is PHYSICIAN_ONSITE and there is no staffing gap."
            - "state_license_status stays NONE, so license_penalty is 6; program_component is 4 + 3 = 7; population multiplier is 1.4."
            - "All three mandatory evaluations carry self_score PARTIAL and the self-assessment is submitted, so the pre_visit compliance_component is the full 30.00."
            - "required_specialist_domains is [HEALTH_WELLNESS] because the population is MEDICALLY_FRAGILE, so the team is a LEAD plus a certified SPECIALIST_HEALTH."
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-R", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { rset_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${rset_id}", code: "SU.1", title: "Staff supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { r1_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${rset_id}", code: "SU.2", title: "Staff screening", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { r2_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${rset_id}", code: "SU.3", title: "Staff orientation", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { r3_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets/${rset_id}/publish"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Ridge Resident Camp", camp_type: "RESIDENT", state_code: "OH", population_served: "MEDICALLY_FRAGILE", program_elements: ["TRANSPORTATION", "TRIP_CAMPING"], resident_census: 140, distance_to_hospital_km: 45, max_daily_census: 160, health_staffing_level: "PHYSICIAN_ONSITE", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${rset_id}", cycle_year: 2026, expected_camp_version: "${camp_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${r1_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev1_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${r2_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev2_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${r3_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev3_id: "$.data[0].id" }
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/self-assessment"
              payload: { self_score: "PARTIAL" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev2_id}/self-assessment"
              payload: { self_score: "PARTIAL" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev3_id}/self-assessment"
              payload: { self_score: "PARTIAL" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cyc_id}/submit-self-assessment"
              payload: {}
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Lead One", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_lead_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Health Spec", home_state_code: "NY", trained_through_year: 2026, certifications: ["HEALTH_SPECIALIST"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_hw_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cyc_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_v: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cyc_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-05", expected_cycle_version: "${cyc_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_lead_id}", team_role: "LEAD", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${v_hw_id}", team_role: "SPECIALIST_HEALTH", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/schedule"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/start"
              payload: {}
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev2_id}/visitor-score"
              payload: { visitor_score: "NOT_MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev3_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${v_lead_id}"
          trigger:
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/finalize-scoring"
              payload: {}
              as: Visitor
              as_user_id: "${v_lead_id}"
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "the first GET /accreditation/camps/${camp_id}/risk-index returns risk_index_variant == PRE_VISIT, compliance_component == 30.00, program_component == 7, license_penalty == 6, staffing_gap_penalty == 0, population_multiplier == 1.4 and risk_index == 74.20"
            - "the second GET /accreditation/camps/${camp_id}/risk-index returns risk_index_variant == POST_VISIT, compliance_component == 10.00 and risk_index == 46.20"
            - "Camp.${camp_id}.risk_index == 46.20 and Camp.${camp_id}.risk_index_variant == POST_VISIT after finalize-scoring"
            - "StandardEvaluation.${ev1_id}.self_score == PARTIAL and StandardEvaluation.${ev2_id}.self_score == PARTIAL and StandardEvaluation.${ev3_id}.self_score == PARTIAL are unchanged by the variant switch"
            - "Camp.${camp_id}.penalty_point_balance == 5 and Camp.${camp_id}.compliance_posture == RESTRICTED"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: required_health_staffing_level_combination_bump_promotes_family_camp
        grounds:
          - calculations.required_health_staffing_level
          - calculations.required_health_staffing_level.constants.COMBINATION_BUMP_MIN_COMPONENTS
          - calculations.required_health_staffing_level.constants.COMBINATION_BUMP_RANK_FLOOR
          - calculations.camp_compliance_posture
          - entities.Camp.fields.required_health_staffing_level
          - endpoints.PATCH_/accreditation/camps/{campId}/health-center
        distinguishing_aspect: |
          Mode (a) - a five-input interaction the naive reading gets wrong: the level
          is NOT max(component ranks). Two camps whose max component is identical
          (rank 2) land on different required levels because the count of components
          at rank 2 or above crosses COMBINATION_BUMP_MIN_COMPONENTS in only one of
          them, and a later census PATCH re-enters the bump with a higher base to
          reach the min(4, base+bump) ceiling path.
        test_recipe:
          setup:
            - "Two FAMILY / ADULT_INCLUSIVE camps in OH with no program elements and distance_to_hospital_km 10, both created with health_staffing_level FIRST_AIDER_ONLY."
            - "Camp BUMP has resident_census 60, so its components are r_type 2, r_pop 2, r_census 2, r_dist 1, r_prog 1: base 2 with three components at rank 2 or above, so the bump fires."
            - "Camp NOBUMP has resident_census 30, so its components are r_type 2, r_pop 2, r_census 1, r_dist 1, r_prog 1: base 2 with only two components at rank 2 or above, so no bump fires."
          setup_api_calls:
            - call: "POST /accreditation/camps"
              payload: { name: "Bump Family Camp", camp_type: "FAMILY", state_code: "OH", population_served: "ADULT_INCLUSIVE", program_elements: [], resident_census: 60, distance_to_hospital_km: 10, max_daily_census: 90, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { bump_camp_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Nobump Family Camp", camp_type: "FAMILY", state_code: "OH", population_served: "ADULT_INCLUSIVE", program_elements: [], resident_census: 30, distance_to_hospital_km: 10, max_daily_census: 90, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { nobump_camp_id: "$.data.id" }
          trigger:
            - call: "GET /accreditation/camps/${bump_camp_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${nobump_camp_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/camps/${nobump_camp_id}/health-center"
              payload: { resident_census: 130 }
              as: CampDirector
              as_user_id: "${nobump_camp_id}"
          assert:
            - "Camp.${bump_camp_id}.required_health_staffing_level == RN_ONSITE"
            - "Camp.${nobump_camp_id}.required_health_staffing_level == LPN_ONSITE before the PATCH, proving the identical base rank 2 does not decide the answer"
            - "Camp.${nobump_camp_id}.required_health_staffing_level == PHYSICIAN_ONSITE after the PATCH sets resident_census to 130, because base 3 plus the re-entered bump reaches rank 4"
            - "Camp.${bump_camp_id}.compliance_posture == RESTRICTED because the actual FIRST_AIDER_ONLY rank 1 is below the required rank 3"
            - "Camp.${nobump_camp_id}.compliance_posture == RESTRICTED after the PATCH"

