    side_effects: ["effective_on computed", "case.version += 1"]

  - method: POST
    path: "/trustee/fee_applications/{id}/deny"
    description: "Court denies a fee application"
    roles: [Court]
    code: 200
    input: []
    output: FeeApplication
    side_effects: ["case.version += 1"]

  - method: POST
    path: "/trustee/fee_applications/{id}/pay"
    description: "Trustee disburses an approved fee after effective date"
    roles: [Trustee]
    code: 200
    input: []
    output: FeeApplication
    side_effects: ["case.estate_cash_on_hand_cents -= approved_amount_cents", "case.version += 1"]

  # --- FinalReport ---
  - method: GET
    path: "/trustee/cases/{id}/final_report"
    description: "Get the case final report (0 or 1 row, returned as an array of length 0-1)"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "FinalReport[]"
    side_effects: []

  - method: GET
    path: "/trustee/cases/{id}/allocations"
    description: "List plan class allocations across all plans of a case (FK reverse-lookup for PlanClassAllocation.case_id)"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "PlanClassAllocation[]"
    side_effects: []

  - method: POST
