  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_failure_cascade_to_event_bid_count
        grounds:
          - state_machines.AuditCase.OPEN_to_FAILED
          - state_machines.Certification.VERIFIED_to_REVOKED
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.BidderInvitation.BID_SUBMITTED_to_WITHDRAWN
          - entities.SourcingEvent.fields.diverse_bid_count
        distinguishing_aspect: |
          Depth-4 chain from POST /api/v1/audit-cases/{id}/record-outcome: outcome FAILED
          mutates the Certification (-> REVOKED, link 1); revocation mutates the Supplier
          (-> SUSPENDED, diverse_eligible false, link 2); suspension mutates the
          BidderInvitation (BID_SUBMITTED -> WITHDRAWN, link 3); the withdrawal recomputes
          the SourcingEvent.diverse_bid_count 1 -> 0 (link 4). Different trigger than the
          admin-suspension instance.
        test_recipe:
          setup:
            - "BU AERO (lead-1); diverse supplier with VERIFIED SELF_CERT covering the default clock 2026-08-01; supplier ACTIVE and diverse_eligible"
            - "OPEN sourcing event with required_diverse_bidders 1; supplier invited and BID_SUBMITTED, so diverse_bid_count == 1"
            - "OPEN audit case (auditor-9) on the self-certification"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1", inclusion_min_diverse_bidders: 1 }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Cascade Co", tax_id: "T-CAS", kind: "DIVERSE", contact_email: "c@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-9", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Bracket fabrication", estimated_value_cents: 500000, required_diverse_bidders: 1 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sup_id}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/invitations/${inv_id}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "GET /api/v1/sourcing-events/${ev_id}"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { cnt_pre: $.data.diverse_bid_count }
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert_id}", reason: "RANDOM_SAMPLE" }
              as: Auditor
              as_user_id: auditor-9
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/v1/audit-cases/${case_id}/record-outcome"
              payload: { outcome: "FAILED" }
              as: Auditor
              as_user_id: auditor-9
            - call: "GET /api/v1/suppliers/${sup_id}/certifications"
              payload: {}
              as: DiversityAdmin
              captures: { cert_status: "$.data[0].status" }
            - call: "GET /api/v1/suppliers/${sup_id}"
              payload: {}
              as: DiversityAdmin
              captures: { sup_status: $.data.status, sup_elig: $.data.diverse_eligible, sup_risk: $.data.risk_score_standard }
            - call: "GET /api/v1/sourcing-events/${ev_id}/invitations"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { inv_status: "$.data[0].status" }
            - call: "GET /api/v1/sourcing-events/${ev_id}"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { cnt_post: $.data.diverse_bid_count }
          assert:
            - "cnt_pre == 1 before the outcome"
            - "cert_status == REVOKED (link 1: outcome mutated the certification)"
            - "sup_status == SUSPENDED and sup_elig == false (link 2: revocation mutated the supplier)"
            - "inv_status == WITHDRAWN (link 3: suspension mutated the BID_SUBMITTED invitation)"
            - "cnt_post == 0 (link 4: withdrawal recomputed the event's diverse_bid_count)"
            - "sup_risk == 40 (FAILED audit term)"

      - name: admin_suspension_cascade_to_event_bid_count
        grounds:
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.BidderInvitation.BID_SUBMITTED_to_WITHDRAWN
          - entities.SourcingEvent.fields.diverse_bid_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /api/v1/suppliers/{id}/suspend):
          suspension mutates the BidderInvitation (BID_SUBMITTED -> WITHDRAWN, link 1);
          the withdrawal recomputes the SourcingEvent.diverse_bid_count 1 -> 0 (link 2).
          No audit case or certification revocation is involved.
        test_recipe:
          setup:
            - "BU AERO (lead-1); diverse supplier with VERIFIED VET cert covering the default clock; supplier ACTIVE"
            - "OPEN event (required_diverse_bidders 1) with the supplier BID_SUBMITTED, diverse_bid_count == 1"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1", inclusion_min_diverse_bidders: 1 }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Vet Works", tax_id: "T-VET", kind: "DIVERSE", contact_email: "v@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "VET", certifying_body: "NVBDC", certificate_number: "V-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Grounds maintenance", estimated_value_cents: 300000, required_diverse_bidders: 1 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sup_id}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/invitations/${inv_id}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
          trigger:
            - call: "POST /api/v1/suppliers/${sup_id}/suspend"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "GET /api/v1/sourcing-events/${ev_id}/invitations"
              payload: {}
              as: DiversityAdmin
              captures: { inv_status: "$.data[0].status" }
            - call: "GET /api/v1/sourcing-events/${ev_id}"
              payload: {}
              as: DiversityAdmin
              captures: { cnt_post: $.data.diverse_bid_count }
          assert:
            - "Supplier is SUSPENDED after the admin action"
            - "inv_status == WITHDRAWN (link 1: suspension mutated the invitation)"
            - "cnt_post == 0 (link 2: the withdrawal recomputed diverse_bid_count from 1 to 0)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: verify_expired_cert_state_error_beats_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_CERT_NOT_REVIEWABLE]
          - errors[ERR_CERT_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Pair state vs business_temporal: the certification is EXPIRED (no verify
          transition defined -> priority-4 state failure) AND its window ended before the
          clock date (priority-7 temporal failure); the state error
          ERR_CERT_NOT_REVIEWABLE must win.
        test_recipe:
          setup:
            - "Clock set back to 2026-03-01 so a cert with window 2026-01-01..2026-06-30 can be verified"
            - "Certification VERIFIED, then clock advanced to 2026-07-15 so the sweep moves it to EXPIRED"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DiversityAdmin
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Old Cert Co", tax_id: "T-OLD", kind: "DIVERSE", contact_email: "o@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-OLD", valid_from: "2026-01-01", valid_to: "2026-06-30" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { st_ok: $.data.status }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: DiversityAdmin
            - call: "GET /api/v1/suppliers/${sup_id}/certifications"
              payload: {}
              as: DiversityAdmin
              captures: { st_exp: "$.data[0].status" }
          trigger:
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "st_ok == VERIFIED and st_exp == EXPIRED after the clock advance (setup replay)"
            - "err == ERR_CERT_NOT_REVIEWABLE — the priority-4 state failure is returned, not ERR_CERT_WINDOW_EXPIRED, although the temporal condition also holds"

      - name: award_ineligible_supplier_safety_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_SUPPLIER_NOT_ELIGIBLE]
          - errors[ERR_AWARD_ABOVE_LIMIT]
        distinguishing_aspect: |
          Pair business_safety vs business_fiscal: the award names a REGISTERED (never
          activated) supplier holding a BID_SUBMITTED invitation (safety failure,
          priority 5) AND an award_amount_cents twice the estimate (fiscal failure,
          priority 8); ERR_SUPPLIER_NOT_ELIGIBLE must win.
        test_recipe:
          setup:
            - "BU AERO (lead-1); supplier with no certifications (status REGISTERED)"
            - "OPEN event with required_diverse_bidders 0 so the inclusion check passes and cannot mask the pair"
            - "Supplier invited and BID_SUBMITTED"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Unproven LLC", tax_id: "T-UNP", kind: "DIVERSE", contact_email: "u@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Cable harnesses", estimated_value_cents: 100000, required_diverse_bidders: 0 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sup_id}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/invitations/${inv_id}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
          trigger:
            - call: "POST /api/v1/sourcing-events/${ev_id}/award"
              payload: { award_supplier_id: "${sup_id}", award_amount_cents: 200000 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUPPLIER_NOT_ELIGIBLE — winner is REGISTERED, not ACTIVE (safety, priority 5), and the award_amount_cents 200000 > estimated_value_cents 100000 fiscal failure (priority 8) must NOT surface"
            - "Event remains OPEN after the rejected award"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: certification_window_inclusive_end_boundary
        grounds:
          - calculations.diverse_spend_attribution
          - entities.Certification.fields.valid_to
        distinguishing_aspect: |
          Date metric via the scorecard-generation endpoint: a spend record dated exactly
          on valid_to (2026-11-15) is inside the closed certification window and counts;
          an identical record dated 2026-11-16 does not. The boundary moves
          direct_diverse_spend_cents by exactly 100000.
        test_recipe:
          setup:
            - "BU AERO; diverse supplier with VERIFIED MBE cert covering 2026-10-01..2026-11-15"
            - "R1: 100000 on the boundary day 2026-11-15; R2: 50000 on 2026-11-16 (both inside Q4)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Boundary Co", tax_id: "T-BND", kind: "DIVERSE", contact_email: "b@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-BND", valid_from: "2026-10-01", valid_to: "2026-11-15" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 100000, transaction_date: "2026-11-15", payment_date: "2026-11-15" }
              as: DiversityAnalyst
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 50000, transaction_date: "2026-11-16", payment_date: "2026-11-16" }
              as: DiversityAnalyst
          trigger:
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q4", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { sc_total: $.data.total_spend_cents, sc_diverse: $.data.direct_diverse_spend_cents, sc_rating: $.data.rating }
          assert:
            - "total_spend_cents == 150000 (both records inside 2026-Q4)"
            - "direct_diverse_spend_cents == 100000 — the 2026-11-15 record is covered (closed window includes valid_to), the 2026-11-16 record is not"
            - "spend_by_category == { MBE: 100000 }"
            - "rating == NO_GOAL and attainment_pct is null (no PUBLISHED goal exists)"

      - name: inclusion_count_exact_minimum_boundary
        grounds:
          - calculations.inclusion_compliance_check
          - state_machines.SourcingEvent.OPEN_to_AWARDED
          - errors[ERR_INCLUSION_SHORTFALL]
        distinguishing_aspect: |
          Integer-count metric via the award endpoint: with required_diverse_bidders == 2,
          an event with exactly 2 diverse BID_SUBMITTED invitations awards successfully
          (>= passes at equality), while an event with 1 fails with ERR_INCLUSION_SHORTFALL.
        test_recipe:
