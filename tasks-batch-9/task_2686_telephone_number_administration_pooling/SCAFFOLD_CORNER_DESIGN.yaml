        distinguishing_aspect: "The ATTESTED -> VERIFIED transition requires interconnection_ready == true, so a carrier that attested with interconnection_ready false cannot be verified: ERR_INVALID_STATE_TRANSITION (409) and facilities_readiness_status stays ATTESTED."
