        grounds:
          - validations[priority=15]
          - entities.Subscription.fields.organization_id
          - errors[ERR_SUBSCRIPTION_EXISTS]
        distinguishing_aspect: >-
          DIFFERENT resource (Subscription) and DIFFERENT interval semantics: at-most-one-occupant capacity
          on the organization_id axis (not URL point-equality) — a second Subscription for the org is rejected
          ERR_SUBSCRIPTION_EXISTS.
        test_recipe:
          setup:
