          setup:
            - "Two units of the same vessel, each surveyed with severity_index 66 (claim mandatory) and each with a CarrierClaim on file."
            - "Unit A gets a repair estimate of 149999 cents (below the 150000 threshold -> AUTO fork)."
            - "Unit B gets a repair estimate of 220000 cents (at or above the threshold -> ESCALATED fork)."
