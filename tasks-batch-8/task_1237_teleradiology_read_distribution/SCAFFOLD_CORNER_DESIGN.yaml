scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: hospital_create_defaults_applied
        claim_type: defaults
        grounds: [entities.ClientHospital.fields.pricing_mode, entities.ClientHospital.fields.tat_stat_minutes, entities.ClientHospital.fields.credentialing_mode]
        distinguishing_aspect: "Creating a hospital with only name+state_code applies defaults: pricing_mode MARGINAL, credentialing_mode BY_PROXY, tat_stat 60 / tat_urgent 240 / tat_routine 1440, penalty 50c/min, cap 20000c, status ONBOARDING."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /telerad/hospitals", payload: { name: "Defaults Hosp", state_code: "WA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
          assert:
            - "response status == ONBOARDING, pricing_mode == MARGINAL, credentialing_mode == BY_PROXY"
            - "tat_stat_minutes == 60, tat_urgent_minutes == 240, tat_routine_minutes == 1440"
            - "penalty_per_breach_minute_cents == 50, breach_penalty_cap_cents == 20000, version == 1"

      - name: study_create_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Study.fields.accession_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required accession_number on study creation is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ACTIVE CA hospital"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Req", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "P1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION; http 400; no Study created"

      - name: study_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_STUDY_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent study id returns ERR_STUDY_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /telerad/studies/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STUDY_NOT_FOUND; http 404"

      - name: not_found_sweep_across_entities
        claim_type: not_found
        grounds: ["errors[ERR_HOSPITAL_NOT_FOUND]", "errors[ERR_RADIOLOGIST_NOT_FOUND]", "errors[ERR_SHIFT_NOT_FOUND]", "errors[ERR_POLICY_NOT_FOUND]", "errors[ERR_GRANT_NOT_FOUND]", "errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]", "errors[ERR_NOTICE_NOT_FOUND]", "errors[ERR_BILLING_PERIOD_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET returns its domain-specific 404 error for a nonexistent id; the error identity is per-entity, not a generic NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /telerad/hospitals/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_hosp: $.data.error_id } }
            - { call: "GET /telerad/radiologists/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_rad: $.data.error_id } }
            - { call: "GET /telerad/shifts/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_shift: $.data.error_id } }
            - { call: "GET /telerad/routing-policies/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_pol: $.data.error_id } }
            - { call: "GET /telerad/credential-grants/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_grant: $.data.error_id } }
            - { call: "GET /telerad/assignments/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_asg: $.data.error_id } }
            - { call: "GET /telerad/reports/00000000-0000-0000-0000-000000000000", payload: {}, as: QaReviewer, captures: { e_rep: $.data.error_id } }
            - { call: "GET /telerad/discrepancy-cases/00000000-0000-0000-0000-000000000000", payload: {}, as: QaReviewer, captures: { e_case: $.data.error_id } }
            - { call: "GET /telerad/critical-notices/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_notice: $.data.error_id } }
            - { call: "GET /telerad/billing-periods/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_per: $.data.error_id } }
            - { call: "GET /telerad/invoices/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e_inv: $.data.error_id } }
          assert:
            - "e_hosp == ERR_HOSPITAL_NOT_FOUND; e_rad == ERR_RADIOLOGIST_NOT_FOUND; e_shift == ERR_SHIFT_NOT_FOUND"
            - "e_pol == ERR_POLICY_NOT_FOUND; e_grant == ERR_GRANT_NOT_FOUND; e_asg == ERR_ASSIGNMENT_NOT_FOUND"
            - "e_rep == ERR_REPORT_NOT_FOUND; e_case == ERR_CASE_NOT_FOUND; e_notice == ERR_NOTICE_NOT_FOUND"
            - "e_per == ERR_BILLING_PERIOD_NOT_FOUND; e_inv == ERR_INVOICE_NOT_FOUND"

      - name: study_due_at_computed_and_extra_field_ignored
        claim_type: computed_fields
        grounds: [entities.Study.fields.due_at, calculations.tat_deadline]
        distinguishing_aspect: "due_at is computed from received_at + hospital TAT (STAT default 60min); a client-supplied due_at in the create payload is ignored, not honored."
        test_recipe:
          setup: ["ACTIVE CA hospital with default TAT config; logical clock 2026-05-10T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Due", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-DUE", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "D1", due_at: "1999-01-01T00:00:00Z" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { due: $.data.due_at, rcv: $.data.received_at } }
          assert:
            - "Study.received_at == 2026-05-10T10:00:00Z (logical clock)"
            - "Study.due_at == 2026-05-10T11:00:00Z (received + 60min), NOT 1999-01-01T00:00:00Z — extra field ignored"

      - name: hospital_version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.ClientHospital]
        distinguishing_aspect: "version starts at 1 and increments by exactly 1 per mutation; updated_at refreshes on suspend."
        test_recipe:
          setup: ["one hospital"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Ver", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, v0: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /telerad/hospitals/${hosp}/suspend", payload: {}, as: PlatformAdmin, captures: { v2: $.data.version, st: $.data.status, upd: $.data.updated_at } }
          assert:
            - "version at create == 1; after activate == 2; after suspend == 3 (suspend response v2 == 3)"
            - "status == SUSPENDED; updated_at differs from created_at"

      - name: study_create_with_invalid_enum_modality
        claim_type: type_constraints
        grounds: [entities.Study.fields.modality, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "modality 'PT' is not a declared enum member and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["ACTIVE CA hospital"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Enum", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-E", modality: "PT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "E1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION; http 400"

      - name: assignment_create_rejects_unknown_study
        claim_type: parent_relationships
        grounds: [entities.Assignment.fields.study_id, "errors[ERR_STUDY_NOT_FOUND]"]
        distinguishing_aspect: "Creating an assignment against a nonexistent study_id fails existence (priority 3) with ERR_STUDY_NOT_FOUND before any OCC or state check."
        test_recipe:
          setup: ["one real study exists to donate a syntactically valid version value"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp FK", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-FK", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "FK" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "00000000-0000-0000-0000-000000000000", expected_study_version: "${sv}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STUDY_NOT_FOUND; http 404"

      - name: study_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry the fixed envelope: limit/offset paging with total_count and has_more; page 1 (limit 2) has_more=true, page 2 (offset 2) has_more=false."
        test_recipe:
          setup: ["ACTIVE hospital with 3 studies"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Page", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-P1", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "P1" }, as: ClientHospitalUser, as_user_id: "${hosp}" }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-P2", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "P2" }, as: ClientHospitalUser, as_user_id: "${hosp}" }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-P3", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "P3" }, as: ClientHospitalUser, as_user_id: "${hosp}" }
          trigger:
            - { call: "GET /telerad/studies", payload: { hospital_id: "${hosp}", limit: 2, offset: 0 }, as: DispatchOps }
            - { call: "GET /telerad/studies", payload: { hospital_id: "${hosp}", limit: 2, offset: 2 }, as: DispatchOps }
          assert:
            - "page 1: response_type == array, 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: study_created_with_initial_state_received
        claim_type: initial_state
        grounds: [state_machines.Study]
        distinguishing_aspect: "A newly created study starts in RECEIVED with addendum_count 0 and tat_breached false."
        test_recipe:
          setup: ["ACTIVE CA hospital"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Init", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-I", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "I1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { st: $.data.status, ac: $.data.addendum_count, tb: $.data.tat_breached } }
          assert:
            - "status == RECEIVED; addendum_count == 0; tat_breached == false; routing_policy_id is null"

      - name: route_already_queued_study_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Study.RECEIVED_to_QUEUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Routing a study already in QUEUED is an invalid transition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["full routing fixture; study already QUEUED"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp RR", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-RR", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "RR" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps }
          trigger:
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; http 409; study remains QUEUED"

      - name: cancel_cancelled_study_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Study]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE hospital; one study created and cancelled"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp TL", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-TL", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "TL" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/cancel", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}" }
          trigger:
            - { call: "POST /telerad/studies/${sid}/cancel", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; study remains CANCELLED"

      - name: sign_already_signed_report_rejected
        claim_type: idempotency
        grounds: [state_machines.Report.DRAFT_to_SIGNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Signing the same report twice: the second sign observes report.status == SIGNED and is rejected with ERR_INVALID_STATE (no duplicate credit)."
        test_recipe:
          setup: ["full read fixture; FINAL report signed once"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Idem", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Idem Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-ID", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "ID" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
          trigger:
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}", captures: { err: $.data.error_id } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { done24: $.data.completed_rvu_24h } }
          assert:
            - "second sign: error_id == ERR_INVALID_STATE"
            - "Radiologist.${rad}.completed_rvu_24h == 1.5 (credited exactly once)"

      - name: cancel_assigned_study_releases_assignment_and_rvu
        claim_type: side_effect_execution
        grounds: [state_machines.Study.ASSIGNED_to_CANCELLED, state_machines.Assignment.ACTIVE_to_RELEASED]
        distinguishing_aspect: "Cancelling an ASSIGNED study cascades: assignment -> RELEASED and radiologist.reserved_rvu decremented to 0.0 (compensation pattern)."
        test_recipe:
          setup: ["full fixture; one study ASSIGNED to rad (reserved 1.5)"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp CX", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "CX Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-CX", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "CX" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /telerad/studies/${sid}/cancel", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { st: $.data.status } }
            - { call: "GET /telerad/assignments/${asg}", payload: {}, as: DispatchOps, captures: { asg_st: $.data.status } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res: $.data.reserved_rvu } }
          assert:
            - "Study.${sid}.status == CANCELLED"
            - "Assignment.${asg}.status == RELEASED (cascade hop 2)"
            - "Radiologist.${rad}.reserved_rvu == 0.0 (cascade hop 3)"

      - name: clock_sweep_activates_then_completes_shift
        claim_type: valid_transition
        grounds: [state_machines.CoverageShift.SCHEDULED_to_ACTIVE, state_machines.CoverageShift.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "Shift transitions are clock-driven: SCHEDULED at creation, ACTIVE once the logical clock enters [starts_at, ends_at), COMPLETED once it passes ends_at."
        test_recipe:
          setup: ["radiologist with shift 2026-05-01T08:00:00Z..2026-05-01T16:00:00Z; default clock 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /telerad/radiologists", payload: { full_name: "Sweep Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-01T08:00:00Z", ends_at: "2026-05-01T16:00:00Z", modalities: ["CT"] }, as: PlatformAdmin, captures: { sh: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/shifts/${sh}", payload: {}, as: PlatformAdmin, captures: { st1: $.data.status } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T16:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/shifts/${sh}", payload: {}, as: PlatformAdmin, captures: { st2: $.data.status } }
          assert:
            - "at creation (clock 00:00 < starts_at): status == SCHEDULED"
            - "at 09:00 inside window: status == ACTIVE"
            - "at 16:00 == ends_at: status == COMPLETED (half-open window end)"

      - name: clock_sweep_expires_grant_after_valid_until
        claim_type: valid_transition
        grounds: [state_machines.CredentialGrant.GRANTED_to_EXPIRED]
        distinguishing_aspect: "Grant remains GRANTED through valid_until (inclusive) and flips to EXPIRED only when date(now) strictly exceeds valid_until."
        test_recipe:
          setup: ["hospital + radiologist; grant GRANTED valid 2026-01-01..2026-12-31"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Exp", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Exp Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-12-31T23:59:59Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/credential-grants/${g}", payload: {}, as: PlatformAdmin, captures: { st1: $.data.status } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/credential-grants/${g}", payload: {}, as: PlatformAdmin, captures: { st2: $.data.status } }
          assert:
            - "on 2026-12-31 (last valid day): status == GRANTED"
            - "on 2027-01-01 (first day past valid_until): status == EXPIRED"

      - name: notice_auto_escalates_pending_after_30_minutes
        claim_type: valid_transition
        grounds: [state_machines.CriticalResultNotice.PENDING_to_ESCALATED]
        distinguishing_aspect: "A PENDING notice is auto-escalated by the clock sweep only when now > created_at + 30min: at +29min still PENDING, at +31min ESCALATED with escalation_count 1."
        test_recipe:
          setup: ["prelim flow with critical_finding=true signed at 2026-05-10T10:00:00Z producing a PENDING notice"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Esc", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Esc Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-ESC", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "ESC" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i", critical_finding: true }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "GET /telerad/critical-notices", payload: { report_id: "${rep}" }, as: DispatchOps, captures: { nid: "$.data[0].id" } }
          trigger:
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:29:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/critical-notices/${nid}", payload: {}, as: DispatchOps, captures: { st1: $.data.status } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:31:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/critical-notices/${nid}", payload: {}, as: DispatchOps, captures: { st2: $.data.status, ec: $.data.escalation_count } }
          assert:
            - "at +29min: status == PENDING (escalation requires strictly more than 30 minutes)"
            - "at +31min: status == ESCALATED and escalation_count == 1"

      - name: cancel_blocked_after_preliminary_signed
        claim_type: invalid_transition
        grounds: [state_machines.Study, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only declared from {RECEIVED, QUEUED, ASSIGNED, IN_PROGRESS}; from PRELIMINARY_SIGNED it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["prelim-required flow driven to PRELIMINARY_SIGNED"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp CB", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "CB Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-CB", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "CB" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
          trigger:
            - { call: "POST /telerad/studies/${sid}/cancel", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; study remains PRELIMINARY_SIGNED"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: tat_deadline_uses_hospital_override
        claim_type: correct_result
        grounds: [calculations.tat_deadline, entities.ClientHospital.fields.tat_stat_minutes]
        distinguishing_aspect: "A hospital-level TAT override (tat_stat_minutes=30) replaces the platform default 60: due_at = received_at + 30min."
        test_recipe:
          setup: ["ACTIVE hospital with tat_stat_minutes 30; clock 2026-05-10T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp TAT30", state_code: "CA", tat_stat_minutes: 30 }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-T30", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "T30" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { due: $.data.due_at } }
          assert:
            - "Study.due_at == 2026-05-10T10:30:00Z (override 30min applied, not default 60min)"

      - name: study_rvu_modality_constants_applied
        claim_type: constants_applied
        grounds: [calculations.study_rvu, entities.Assignment.fields.reserved_rvu]
        distinguishing_aspect: "RVU_BASE is modality-keyed: an XR assignment reserves exactly 0.5 RVU, a CT assignment reserves 1.5."
        test_recipe:
          setup: ["full fixture (policies XR+CT/NEURO/ROUTINE); credentialed rad with shift covering XR,CT"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp RVU", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "XR", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "RVU Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["XR", "CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-XR", modality: "XR", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "XR" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { rvu: $.data.reserved_rvu } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res: $.data.reserved_rvu } }
          assert:
            - "Assignment.reserved_rvu == 0.5 (RVU_BASE[XR])"
            - "Radiologist.${rad}.reserved_rvu == 0.5"

      - name: selector_prefers_lower_utilization_ratio
        claim_type: correct_result
        grounds: [calculations.auto_assignment_selector]
        distinguishing_aspect: "Auto-assignment ranks by projected utilization ratio: rad_a (reserved 1.5, cap 10 -> 0.30 projected) loses to rad_b (reserved 0, cap 10 -> 0.15 projected)."
        test_recipe:
          setup: ["full fixture with two eligible radiologists rad_a/rad_b; rad_a already holds one ACTIVE CT assignment (reserved 1.5); a second CT study is QUEUED"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Sel", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Sel A", subspecialties: ["NEURORAD"], license_states: ["CA"], fatigue_cap_rvu: 10.0 }, as: PlatformAdmin, captures: { rad_a: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Sel B", subspecialties: ["NEURORAD"], license_states: ["CA"], fatigue_cap_rvu: 10.0 }, as: PlatformAdmin, captures: { rad_b: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_a}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { ga: $.data.id } }
            - { call: "POST /telerad/credential-grants/${ga}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_b}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { gb: $.data.id } }
            - { call: "POST /telerad/credential-grants/${gb}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_a}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_b}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-S1", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "S1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s1: $.data.id } }
            - { call: "POST /telerad/studies/${s1}/route", payload: {}, as: DispatchOps, captures: { s1v: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s1}", radiologist_id: "${rad_a}", expected_study_version: "${s1v}" }, as: DispatchOps }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-S2", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "S2" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s2: $.data.id } }
            - { call: "POST /telerad/studies/${s2}/route", payload: {}, as: DispatchOps, captures: { s2v: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${s2}", expected_study_version: "${s2v}" }, as: DispatchOps, captures: { winner: $.data.radiologist_id, auto: $.data.auto_selected } }
          assert:
            - "Assignment.radiologist_id == ${rad_b} (lower projected ratio 0.15 beats 0.30)"
            - "Assignment.auto_selected == true"

      - name: selector_tie_breaks_by_created_at
        claim_type: correct_result
        grounds: [calculations.auto_assignment_selector]
        distinguishing_aspect: "When utilization ratio and stat_active_count tie exactly (two fresh identical radiologists), the earlier-created radiologist wins (created_at ASC); id is never a decision input."
        test_recipe:
          setup: ["full fixture with two identical fresh radiologists (rad_first created before rad_second); one QUEUED CT study"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Tie", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "First", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_first: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Second", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_second: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_first}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g1: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g1}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_second}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g2: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g2}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_first}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_second}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-TIE", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "TIE" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { winner: $.data.radiologist_id } }
          assert:
            - "Assignment.radiologist_id == ${rad_first} (ratio tie 0.15==0.15, stat tie 0==0 -> created_at ASC wins)"

      - name: selector_excludes_released_reader_on_reassign
        claim_type: input_set_filtering
        grounds: [calculations.auto_assignment_selector, entities.Study.fields.excluded_radiologist_ids]
        distinguishing_aspect: "A radiologist who released this study is filtered out of the auto-selector candidate set for THAT study only: reassign auto-selects the other eligible radiologist."
        test_recipe:
          setup: ["full fixture with rad_a + rad_b; study assigned to rad_a then released (rad_a excluded)"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Excl", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Ex A", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_a: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Ex B", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_b: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_a}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { ga: $.data.id } }
            - { call: "POST /telerad/credential-grants/${ga}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_b}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { gb: $.data.id } }
            - { call: "POST /telerad/credential-grants/${gb}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_a}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_b}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-EX", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "EX" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_a}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/release", payload: {}, as: Radiologist, as_user_id: "${rad_a}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv2: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { winner: $.data.radiologist_id } }
          assert:
            - "Assignment.radiologist_id == ${rad_b} (released ${rad_a} excluded from the candidate set)"

      - name: selector_empty_pool_rejected
        claim_type: violation_to_error
        grounds: [calculations.auto_assignment_selector, "errors[ERR_NO_ELIGIBLE_RADIOLOGIST]"]
        distinguishing_aspect: "When every candidate is filtered (here: the only radiologist released and is therefore excluded), auto-assign fails with ERR_NO_ELIGIBLE_RADIOLOGIST and the study stays QUEUED."
        test_recipe:
          setup: ["full fixture with a single radiologist; study assigned to him then released"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Empty", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Only Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-EM", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "EM" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/release", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv2: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_RADIOLOGIST; http 422"
            - "Study.${sid}.status remains QUEUED"

      - name: volume_tier_boundary_1000_vs_1001
        claim_type: threshold_boundary
        grounds: [calculations.invoice_volume_pricing]
        distinguishing_aspect: "Tier boundary precision: 1000 units price entirely at tier1 (gross 901000c); the 1001st unit prices at tier2 (gross 901000+801 = 901801c)."
        test_recipe:
          setup: ["MARGINAL hospital; period May with 1000 on-time regular studies; period June with 1001"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Tier", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1000, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1001, received_at: "2026-06-04T10:00:00Z", final_signed_at: "2026-06-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /telerad/billing-periods/${p1}/close", payload: {}, as: PlatformAdmin, captures: { p1v: $.data.version } }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-06-01", period_end: "2026-06-30" }, as: PlatformAdmin, captures: { p2: $.data.id } }
            - { call: "POST /telerad/billing-periods/${p2}/close", payload: {}, as: PlatformAdmin, captures: { p2v: $.data.version } }
          trigger:
            - { call: "POST /telerad/billing-periods/${p1}/generate-invoice", payload: { expected_billing_period_version: "${p1v}" }, as: PlatformAdmin, captures: { g1: $.data.gross_cents, c1: $.data.billable_study_count } }
            - { call: "POST /telerad/billing-periods/${p2}/generate-invoice", payload: { expected_billing_period_version: "${p2v}" }, as: PlatformAdmin, captures: { g2: $.data.gross_cents, c2: $.data.billable_study_count } }
          assert:
            - "1000 units: billable_study_count == 1000, gross_cents == 901000 (all tier1 @ 901)"
            - "1001 units: billable_study_count == 1001, gross_cents == 901801 (1000*901 + 1*801)"

      - name: breach_penalty_capped_and_total_floored
        claim_type: threshold_boundary
        grounds: [calculations.tat_breach_and_penalty, calculations.invoice_total_composition]
        distinguishing_aspect: "Penalty per study is capped at breach_penalty_cap_cents (4860 breach minutes * 50c = 243000c -> capped 20000c), and invoice total floors at 0 (max(0, 901-20000))."
        test_recipe:
          setup: ["MARGINAL hospital with default penalty config; 1 seeded ROUTINE study received 2026-05-01T00:00:00Z (due 2026-05-02T00:00:00Z) finalized 2026-05-05T09:00:00Z -> 4860 breach minutes"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Cap", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1, received_at: "2026-05-01T00:00:00Z", final_signed_at: "2026-05-05T09:00:00Z" }, as: PlatformAdmin, captures: { sid: "$.data.study_ids[0]" } }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: PlatformAdmin, captures: { tb: $.data.tat_breached, bm: $.data.breach_minutes } }
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${pv}" }, as: PlatformAdmin, captures: { pen: $.data.penalty_credits_cents, gross: $.data.gross_cents, tot: $.data.total_cents } }
          assert:
            - "Study.${sid}.tat_breached == true and breach_minutes == 4860"
            - "Invoice.penalty_credits_cents == 20000 (min(4860*50, 20000) — cap binds)"
            - "Invoice.gross_cents == 901 and total_cents == 0 (max(0, 901 - 20000) — floor binds)"

  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_take_priority_over_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no auth headers against a NONEXISTENT study id must return ERR_UNAUTHENTICATED (priority 1 beats existence priority 3)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /telerad/studies/00000000-0000-0000-0000-000000000000", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http 401 (auth precedes existence)"

      - name: duplicate_accession_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ACCESSION]"]
        distinguishing_aspect: "(hospital_id, accession_number) is unique among non-CANCELLED studies: a second live study with the same accession is rejected."
        test_recipe:
          setup: ["ACTIVE hospital with one study ACC-DUP"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Dup", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-DUP", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "D1" }, as: ClientHospitalUser, as_user_id: "${hosp}" }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-DUP", modality: "MR", body_part_group: "BODY", priority: "STAT", patient_ref: "D2" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACCESSION; http 409"

      - name: grant_type_mismatch_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_GRANT_TYPE_MISMATCH]", entities.ClientHospital.fields.credentialing_mode]
        distinguishing_aspect: "Conditional on hospital.credentialing_mode: a BY_PROXY hospital rejects an INDEPENDENT grant application with ERR_GRANT_TYPE_MISMATCH."
        test_recipe:
          setup: ["hospital credentialing_mode BY_PROXY (default); radiologist exists"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp GT", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "GT Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
          trigger:
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "INDEPENDENT", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GRANT_TYPE_MISMATCH; http 422"

      - name: final_sign_before_prelim_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Study.IN_PROGRESS_to_FINAL_SIGNED, "errors[ERR_FINAL_NOT_DUE]"]
        distinguishing_aspect: "When the resolved policy has prelim_required=true, signing a FINAL report before any PRELIMINARY is signed fails with ERR_FINAL_NOT_DUE."
        test_recipe:
          setup: ["prelim_required STAT fixture; study IN_PROGRESS under a PRELIMINARY-phase assignment; DRAFT FINAL report exists"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp FD", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "FD Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-FD", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "FD" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id, ph: $.data.phase } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "FINAL", findings_text: "f", impression_text: "i", discrepancy_grade: 0 }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}", captures: { err: $.data.error_id } }
          assert:
            - "assignment phase was PRELIMINARY (prelim_required, no prelim signed)"
            - "sign FINAL: error_id == ERR_FINAL_NOT_DUE; report remains DRAFT; study remains IN_PROGRESS"

      - name: prelim_sign_when_not_required_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Study.IN_PROGRESS_to_PRELIMINARY_SIGNED, "errors[ERR_PRELIM_NOT_PERMITTED]"]
        distinguishing_aspect: "When the resolved policy has prelim_required=false, signing a PRELIMINARY report fails with ERR_PRELIM_NOT_PERMITTED."
        test_recipe:
          setup: ["non-prelim ROUTINE fixture; study IN_PROGRESS; DRAFT PRELIMINARY report exists"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp PN", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "PN Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-PN", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "PN" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRELIM_NOT_PERMITTED; report remains DRAFT; study remains IN_PROGRESS"

      - name: same_reader_final_sign_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SAME_READER_CONFLICT]"]
        distinguishing_aspect: "Segregation of readers: the radiologist who signed the PRELIMINARY may not sign the FINAL of the same study (ERR_SAME_READER_CONFLICT), even when manually assigned the final phase."
        test_recipe:
          setup: ["prelim_required STAT fixture; prelim signed by rad; final-phase assignment manually given to the SAME rad; DRAFT FINAL report exists"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp SR", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hv}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "SR Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-SR", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "SR" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg1: $.data.id } }
            - { call: "POST /telerad/assignments/${asg1}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg1}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep1: $.data.id } }
            - { call: "POST /telerad/reports/${rep1}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv2: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { asg2: $.data.id } }
            - { call: "POST /telerad/assignments/${asg2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg2}", report_type: "FINAL", findings_text: "f2", impression_text: "i2", discrepancy_grade: 1 }, as: Radiologist, as_user_id: "${rad}", captures: { rep2: $.data.id } }
          trigger:
            - { call: "POST /telerad/reports/${rep2}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SAME_READER_CONFLICT; study remains IN_PROGRESS; report remains DRAFT"

      - name: reopen_after_grace_window_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_REOPEN_WINDOW_EXPIRED]", state_machines.BillingPeriod.CLOSED_to_OPEN]
        distinguishing_aspect: "Reopen is temporal: allowed when logical clock <= period_end + 7 days (2026-06-07 OK), rejected one day later (2026-06-08 -> ERR_REOPEN_WINDOW_EXPIRED)."
        test_recipe:
          setup: ["hospital; billing period 2026-05-01..2026-05-31 CLOSED"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp RO", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-06-07T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods/${per}/reopen", payload: {}, as: PlatformAdmin, captures: { st1: $.data.status } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods/${per}/reopen", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "reopen at period_end + 6 days: status == OPEN (within grace)"
            - "reopen at period_end + 8 days: error_id == ERR_REOPEN_WINDOW_EXPIRED; http 422"

