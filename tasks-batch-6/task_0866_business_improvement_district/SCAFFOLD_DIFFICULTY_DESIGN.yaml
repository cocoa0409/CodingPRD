# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Numeric asserts pre-computed against SCAFFOLD.yaml §1.3 formulas + constants.
# Baseline weights (unless noted): W_VALUE=0.0005, W_FRONTAGE=2.0, W_SQFT=0.01.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_estimate_vs_certify_diverge
        grounds:
          - calculations.certify_assessment
          - state_machines.Budget.DRAFT_to_PROPOSED
          - state_machines.Budget.PROPOSED_to_ADOPTED
          - entities.Assessment.fields.estimated_amount_cents
          - entities.Assessment.fields.certified_amount_cents
        distinguishing_aspect: "Same parcel P1 (weighted_base 700): ESTIMATED at PROPOSE uses denom 2760 (rate 5000) -> 3500000; after P2 withdraws, CERTIFIED at ADOPT uses denom 2400 (rate 5750) -> 4025000 (Assessment domain)."
        test_recipe:
          setup:
            - "Downtown BID ACTIVE with parcels P1(wb700), P2(wb360), P3(wb1700); FY2028 budget balanced at 15800000 with other_revenue 2000000 (required_levy 13800000); budget PROPOSED so P1 has an ESTIMATED assessment; then P2 withdrawn and budget ADOPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Downtown BID", boundary_description: "Core downtown", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "AAA-1", owner_name: "Alice Co", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "BBB-2", owner_name: "Bob LLC", use_class: "COMMERCIAL", assessed_value_cents: 50000000, linear_frontage_ft: 30, building_sqft: 5000 }
              as: DistrictAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "CCC-3", owner_name: "Cara Inc", use_class: "RETAIL", assessed_value_cents: 200000000, linear_frontage_ft: 80, building_sqft: 20000 }
              as: DistrictAdministrator
              captures: { p3_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 15800000, other_revenue_cents: 2000000 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 6000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "SAFE", allocated_amount_cents: 6000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "MARKETING", allocated_amount_cents: 2000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "ADMIN", allocated_amount_cents: 1800000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /assessments"
              payload: { parcel_id: "${p1_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /parcels/${p2_id}/withdraw"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
          assert:
            - "Assessment.${a1_id}.estimated_amount_cents == 3500000"
            - "Assessment.${a1_id}.certified_amount_cents == 4025000"
            - "Assessment.${a1_id}.status == CERTIFIED"

      - name: payoff_quote_vs_final_diverge
        grounds:
          - calculations.delinquency_penalty_interest
          - entities.CollectionAccount.fields.interest_accrued_cents
          - endpoints.payoff-quote
        distinguishing_aspect: "payoff_quote as_of 2027-11-09 (day 100) projects interest 201250 -> quoted_balance 4628750 WITHOUT mutating; final_payoff at clock 2027-09-10 (day 40) realizes interest 80500 -> balance 4508000 (CollectionAccount domain)."
        test_recipe:
          setup:
            - "Single-parcel BID; parcel PX certified at 4025000; account DELINQUENT with penalty 402500; logical clock at 2027-09-10 (due_date 2027-08-01 + 40 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "PO BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PX-1", owner_name: "Xavier", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { px_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "GET /assessments"
              payload: { parcel_id: "${px_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { ax_id: "$.data[0].id" }
            - call: "GET /assessments/${ax_id}/collection-account"
              payload: {}
              as: TaxCollector
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-10T00:00:00Z" }
              as: TaxCollector
            - call: "POST /collection-accounts/${acct_id}/assess-delinquency"
              payload: {}
              as: TaxCollector
          trigger:
            - call: "GET /collection-accounts/${acct_id}/payoff-quote"
              payload: { as_of_date: "2027-11-09T00:00:00Z" }
              as: TaxCollector
              captures: { quoted: $.data.quoted_balance_cents }
            - call: "POST /collection-accounts/${acct_id}/payments"
              payload: { amount_cents: 4508000 }
              as: TaxCollector
              as_user_id: "${px_id}"
          assert:
            - "payoff-quote quoted_balance_cents == 4628750"
            - "payoff-quote interest_cents == 201250"
            - "CollectionAccount.${acct_id}.status == PAID after the 4508000 final payment (realized interest 80500, != projected 201250)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_multiplier_and_cap_nonlinear
        grounds:
          - calculations.certify_assessment
          - calculations.parcel_weighted_base
          - entities.Parcel.fields.use_class
        distinguishing_aspect: "Mode (a): weighted_base folds 3 inputs (assessed_value, frontage, sqft); RETAIL x1.25 gives PR raw 17000000 clamped to max 10000000 while OFFICE x1.10 gives PC 7700000 uncapped (nested min/max + branch)."
        test_recipe:
          setup:
            - "BID_CA with two parcels: PR RETAIL (weighted_base 1700) and PC OFFICE (weighted_base 770); budget required_levy 24700000, estimate_rate 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "CA BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PR-1", owner_name: "Retail Owner", use_class: "RETAIL", assessed_value_cents: 200000000, linear_frontage_ft: 80, building_sqft: 20000 }
              as: DistrictAdministrator
              captures: { pr_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PC-1", owner_name: "Office Owner", use_class: "OFFICE", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { pc_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 24700000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 24700000 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /assessments"
              payload: { parcel_id: "${pr_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { apr_id: "$.data[0].id" }
            - call: "GET /assessments"
              payload: { parcel_id: "${pc_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { apc_id: "$.data[0].id" }
          assert:
            - "Assessment.${apr_id}.estimated_amount_cents == 10000000"
            - "Assessment.${apc_id}.estimated_amount_cents == 7700000"

      - name: levy_round_per_parcel_then_sum
        grounds:
          - calculations.levy_rounding_order
          - calculations.certify_assessment
          - entities.FiscalYear.fields.total_certified_levy_cents
        distinguishing_aspect: "Mode (b): rate 10000/3=3333.333 -> each of 3 parcels rounds to 3333, summed to 9999; sum-then-round would give 10000. Pinned round-per-parcel-then-sum."
        test_recipe:
          setup:
            - "BID_LR (weights value 0, frontage 0, sqft 1.0) with 3 parcels each weighted_base 1; budget required_levy 10000; certified_rate 3333.333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "LR BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0, assessment_weight_frontage: 0, assessment_weight_sqft: 1.0, min_assessment_cents: 1, max_assessment_cents: 100000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "L-1", owner_name: "O1", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 1 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "L-2", owner_name: "O2", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 1 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "L-3", owner_name: "O3", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 1 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 10000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 10000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "GET /fiscal-years/${fy_id}"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "FiscalYear.${fy_id}.total_certified_levy_cents == 9999"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_info_request_review_cycle
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Dispute.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Dispute.fields.status
        distinguishing_aspect: "Dispute revisits UNDER_REVIEW twice via the INFO_REQUESTED<->UNDER_REVIEW loop before resolving (cyclic shape on the Dispute entity)."
        test_recipe:
          setup:
            - "Single-parcel BID certified; PropertyOwner PX has filed a dispute on the certified assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Cyc BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PX-1", owner_name: "Xavier", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { px_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "GET /assessments"
              payload: { parcel_id: "${px_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { ax_id: "$.data[0].id" }
            - call: "POST /assessments/${ax_id}/disputes"
              payload: { claimed_value_cents: 60000000, requested_amount_cents: 3000000, reason: "over-assessed" }
              as: PropertyOwner
              as_user_id: "${px_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "REVIEW" }
              as: DistrictAdministrator
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "REQUEST_INFO" }
              as: DistrictAdministrator
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "RESPOND" }
              as: PropertyOwner
              as_user_id: "${px_id}"
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "REQUEST_INFO" }
              as: DistrictAdministrator
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "RESPOND" }
              as: PropertyOwner
              as_user_id: "${px_id}"
          assert:
            - "Dispute.${d_id}.status == UNDER_REVIEW (after the second RESPOND, having traversed INFO_REQUESTED->UNDER_REVIEW twice)"

      - name: petition_verify_fork_approve_vs_reject
        grounds:
          - state_machines.RenewalPetition.SUBMITTED_to_VERIFIED
          - state_machines.RenewalPetition.VERIFIED_to_APPROVED
          - state_machines.RenewalPetition.VERIFIED_to_REJECTED
          - state_machines.BusinessImprovementDistrict.RENEWAL_PENDING_to_ACTIVE
        distinguishing_aspect: "VERIFIED forks: APPROVE reactivates the BID (RENEWAL_PENDING->ACTIVE) and extends authorization, whereas the sibling REJECT branch expires it — divergent side-effect sets on the RenewalPetition entity."
        test_recipe:
          setup:
            - "BID_PET certified with two equal parcels (each certified 10000000); a CIRCULATING petition has one SUPPORT signature then submitted and verified VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Pet BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0, assessment_weight_frontage: 0, assessment_weight_sqft: 1.0, min_assessment_cents: 1, max_assessment_cents: 100000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PA-1", owner_name: "PA", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { pa_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PB-1", owner_name: "PB", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { pb_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 20000000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 20000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/renewal-petitions"
              payload: { circulation_deadline: "2027-06-20T00:00:00Z", required_threshold_pct: 0.50, renewal_term_months: 60 }
              as: DistrictAdministrator
              captures: { pet_id: $.data.id }
            - call: "POST /renewal-petitions/${pet_id}/signatures"
              payload: { parcel_id: "${pa_id}", support: true }
              as: PropertyOwner
              as_user_id: "${pa_id}"
            - call: "POST /renewal-petitions/${pet_id}/submit"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /renewal-petitions/${pet_id}/verify"
              payload: {}
              as: BoardMember
              as_user_id: "board-verifier"
          trigger:
            - call: "POST /renewal-petitions/${pet_id}/vote"
              payload: { decision: "APPROVE" }
              as: BoardMember
              as_user_id: "board-voter"
          assert:
            - "RenewalPetition.${pet_id}.status == APPROVED"
            - "BusinessImprovementDistrict.${bid_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_adjust_deep_refund_cascade
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_ADJUSTED
          - state_machines.Assessment.CERTIFIED_to_ADJUSTED
          - state_machines.CollectionAccount.BILLED_to_CREDIT
          - entities.FiscalYear.fields.total_certified_levy_cents
        distinguishing_aspect: "Depth-4 chain: Dispute RESOLVED_ADJUSTED (4025000->3000000) -> Assessment ADJUSTED -> CollectionAccount CREDIT (credit 1025000) -> FiscalYear.total_certified_levy_cents 4025000->3000000; each hop caused by the prior."
        test_recipe:
          setup:
            - "Single-parcel BID certified at 4025000; owner paid the account in full (PAID); dispute filed, reviewed to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
