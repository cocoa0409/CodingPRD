scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_season_returns_envelope_and_initial_ledger
        claim_type: Creation
        grounds:
          - entities.Season
          - response_envelope.success
          - endpoints.POST_/seasons
        distinguishing_aspect: "A brand-new Season must come back 201 inside the success envelope with every computed money field seeded from the input budget: allocated 0, unallocated == total, season_net 0, status PLANNING, version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000, market_rotation_cooldown_days: 21 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
          assert:
            - "HTTP 201 with response_type == \"object\" and a meta block carrying api_request_id and api_request_timestamp"
            - "Season.${season}.status == PLANNING, version == 1"
            - "Season.${season}.marketing_allocated_cents == 0 and marketing_unallocated_cents == 40000000"
            - "Season.${season}.season_net_cents == 0, booking_count == 0, settled_stop_count == 0"
            - "Season.${season}.created_at and updated_at are set to the current logical clock 2026-08-01T00:00:00Z"

      - name: corner_venue_turnaround_hours_default_is_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Venue.fields.turnaround_hours
          - global_constants.DEFAULT_VENUE_TURNAROUND_HOURS
        distinguishing_aspect: "turnaround_hours is the only optional field on POST /venues and it feeds the occupancy pad; omitting it must yield 12, not 0, otherwise back-to-back bookings would stop colliding."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Omaha Pavilion", market_code: "OMA", city: "Omaha", state_code: "NE", seat_capacity: 6000, floor_type: "CONCRETE", catch_fence_max_height_ft: 9, medical_bay_count: 1, load_in_hours_required: 8, staging_bay_count: 2 }
              as: SeriesPromoter
              captures: { venue_oma: "$.data.id" }
          assert:
            - "HTTP 201 and Venue.${venue_oma}.turnaround_hours == 12 (DEFAULT_VENUE_TURNAROUND_HOURS)"
            - "Venue.${venue_oma}.floor_type == CONCRETE and staging_bay_count == 2 as supplied"
            - "GET /venues/${venue_oma} echoes turnaround_hours == 12, so the default was persisted and not merely defaulted in the response"

      - name: corner_tour_stop_computed_fields_are_denormalized_from_the_booking
        claim_type: Computed Fields
        grounds:
          - entities.TourStop.fields.market_code
          - entities.TourStop.fields.event_date
          - entities.TourStop.fields.season_id
          - state_machines.VenueBooking.TERMS_PROPOSED_to_CONFIRMED
        distinguishing_aspect: "TourStop has no create endpoint at all — it is born from booking acceptance — so market_code, event_date, season_id and venue_booking_id must be copied by the system and every ticket/segment counter must start at its zero value."
        test_recipe:
          setup:
            - "A Season and a Venue in market OMA; a booking for 2026-11-20 accepted so its TourStop exists"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Omaha Pavilion", market_code: "OMA", city: "Omaha", state_code: "NE", seat_capacity: 6000, floor_type: "CONCRETE", catch_fence_max_height_ft: 9, medical_bay_count: 1, load_in_hours_required: 8, staging_bay_count: 2, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_oma: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_oma}", tour_date: "2026-11-20", rental_base_cents: 2200000, revenue_share_pct: 0.10, per_ticket_facility_fee_cents: 300, load_in_start_utc: "2026-11-19T14:00:00Z", tear_down_end_utc: "2026-11-21T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_oma: "$.data.id" }
          trigger:
            - call: "POST /venue-bookings/${b_oma}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_oma}" }
              as: SeriesPromoter
              captures: { stop_oma: "$.data[0].id" }
          assert:
            - "TourStop.${stop_oma}.market_code == \"OMA\" and event_date == \"2026-11-20\", both denormalized rather than supplied"
            - "TourStop.${stop_oma}.season_id == \"${season}\" and venue_booking_id == \"${b_oma}\""
            - "TourStop.${stop_oma}.sales_state == SALES_PENDING, safety_state == SAFETY_DRAFT, readiness_posture == RESTRICTED"
            - "TourStop.${stop_oma}.expected_attendance == 0, competition_segment_count == 0, tickets_sold_count == 0, gross_ticket_revenue_cents == 0, run_order_end_offset_minutes == 0"
            - "TourStop.${stop_oma}.doors_open_utc and show_start_utc are null, show_window_minutes == 150 and pit_party_capacity == 0 by default"

      - name: corner_tech_inspection_is_an_immutable_append_only_record
        claim_type: Immutability
        grounds:
          - entities.TechInspection
          - endpoints.POST_/vehicle-entries/{id}/tech-inspections
          - endpoints.GET_/vehicle-entries/{id}/tech-inspections
        distinguishing_aspect: "TechInspection is declared with common_fields: false — it carries no version and §1.5 exposes no PATCH or DELETE for it, so the inspection log is append-only and attempt_no is assigned by the system."
        test_recipe:
          setup:
            - "A CONFIRMED booking, its TourStop with show timing, and one STAGED vehicle entry at clock 2026-11-14T17:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Thunder Ridge Racing", driver_name: "R. Anderson", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "11", vehicle_weight_lbs: 7200, haul_distance_miles: 400, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { entry1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T17:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${entry1}/check-in"
              payload: {}
              as: SeriesPromoter
          trigger:
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "CONDITIONAL", defect_severity: "MINOR", notes: "tether wear noted" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
              captures: { insp1: "$.data.id" }
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "PASSED", defect_severity: "NONE" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
              captures: { insp2: "$.data.id" }
          assert:
            - "TechInspection.${insp1}.attempt_no == 1 and TechInspection.${insp2}.attempt_no == 2, both assigned by the system and never taken from the payload"
            - "neither TechInspection row exposes a version field, and §1.5 declares no PATCH or DELETE endpoint under /vehicle-entries/{id}/tech-inspections"
            - "TechInspection.${insp1}.result == CONDITIONAL is unchanged after the second inspection is filed — history is appended, not corrected"
            - "GET /vehicle-entries/${entry1}/tech-inspections returns exactly 2 rows in attempt_no ascending order"
            - "VehicleEntry.${entry1}.tech_status == TECH_CLEARED and tech_attempt_count == 2, so the mutable summary lives on the parent while the log stays immutable"

      - name: corner_missing_required_field_on_vehicle_entry_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.VehicleEntry.fields.vehicle_weight_lbs
          - endpoints.POST_/vehicle-entries
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Every field of POST /vehicle-entries' input is required and vehicle_weight_lbs has no default; omitting it must be a 422 at validation order 3, before any FK resolution or staging-bay assignment happens."
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking with its TourStop and one Competitor"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "POST /competitors"
              payload: { team_name: "Thunder Ridge Racing", driver_name: "R. Anderson", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
          trigger:
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "11", haul_distance_miles: 400, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err_missing} == ERR_INVALID_REQUEST and response_type == \"error\""
            - "no VehicleEntry row is created: GET /vehicle-entries with tour_stop_id ${stop_atl} returns an empty list"
            - "no staging bay is consumed, so a later well-formed entry still receives staging_bay_index == 1"

      - name: corner_enum_and_minimum_constraints_rejected_on_marketing_allocation
        claim_type: Type Constraints
        grounds:
          - entities.MarketingAllocation.fields.channel
          - entities.MarketingAllocation.fields.amount_cents
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "channel is an enum limited to RADIO | DIGITAL | GRASSROOTS and amount_cents is constrained to >= 1; both violations are order-3 shape failures that must precede the OCC version check at order 10, so a stale expected_season_version must NOT be reported instead."
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking and its TourStop; the Season read once so a deliberately stale version can be sent"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
          trigger:
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "PRINT", amount_cents: 500000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 0, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
              captures: { err_min: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 500000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
              captures: { alloc_ok: "$.data.id" }
          assert:
            - "trigger call 1 returns HTTP 422 with ${err_enum} == ERR_INVALID_REQUEST (PRINT is outside the declared enum)"
            - "trigger call 2 returns HTTP 422 with ${err_min} == ERR_INVALID_REQUEST (amount_cents 0 violates >= 1)"
            - "neither rejection touched the ledger: Season.${season}.marketing_allocated_cents == 0 and version is still ${season_v1}"
            - "trigger call 3 with the same expected_season_version succeeds with HTTP 201, MarketingAllocation.${alloc_ok}.state == COMMITTED and amount_cents == 500000, proving the earlier failures were shape failures and not stale-version failures"

      - name: corner_unknown_path_id_returns_the_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[order=4]
          - errors.ERR_VENUE_BOOKING_NOT_FOUND
          - errors.ERR_SETTLEMENT_NOT_FOUND
        distinguishing_aspect: "Order 4 requires the 404 to name the addressed ENTITY, not a generic not-found, and it must outrank body-level checks: a settlement id that does not resolve must report ERR_SETTLEMENT_NOT_FOUND even when the body is also unusable."
        test_recipe:
          setup:
            - "Empty database except for one Season, so no bookings or settlements exist at all"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
          trigger:
            - call: "GET /venue-bookings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: SeriesPromoter
              captures: { err_booking: "$.data.error_id" }
            - call: "GET /settlements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FinanceController
              captures: { err_settlement: "$.data.error_id" }
            - call: "GET /vehicle-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: SeriesPromoter
              captures: { err_entry: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 404 with ${err_booking} == ERR_VENUE_BOOKING_NOT_FOUND"
            - "trigger call 2 returns HTTP 404 with ${err_settlement} == ERR_SETTLEMENT_NOT_FOUND"
            - "trigger call 3 returns HTTP 404 with ${err_entry} == ERR_VEHICLE_ENTRY_NOT_FOUND"
            - "each response uses the error envelope with response_type == \"error\" and a non-empty message"

      - name: corner_flat_topology_fk_integrity_on_ticket_order_body_references
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - validations[order=5]
          - validations[order=26]
          - errors.ERR_TICKET_TIER_NOT_FOUND
          - errors.ERR_CHILD_STOP_MISMATCH
        distinguishing_aspect: "The topology is flat, so cross-references are validated by FK rather than by URL nesting. POST /ticket-orders carries two independent FKs and must distinguish an unresolvable tier (404 at order 5) from a resolvable tier that belongs to a different stop (422 at order 26)."
        test_recipe:
          setup:
            - "One Season with two accepted bookings at two different venues, ATL for 2026-11-14 and DAL for 2026-12-05, so two TourStops exist"
            - "Each stop gets one COMPETITION segment, one tier, a CERTIFIED safety plan and RADIO marketing; only the ATL stop is taken ON_SALE"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Dallas Coliseum", market_code: "DAL", city: "Dallas", state_code: "TX", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_dal: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dal}", tour_date: "2026-12-05", rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 400, load_in_start_utc: "2026-12-04T14:00:00Z", tear_down_end_utc: "2026-12-06T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_dal: "$.data.id" }
            - call: "POST /venue-bookings/${b_dal}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_dal}" }
              as: SeriesPromoter
              captures: { stop_dal: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 1", run_order_position: 1, duration_minutes: 30 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "GA", price_cents: 3200, allotment: 500, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z" }
              as: TicketingManager
              captures: { tier_atl: "$.data.id" }
            - call: "PATCH /tour-stops/${stop_dal}/logistics"
              payload: { doors_open_utc: "2026-12-05T22:00:00Z", show_start_utc: "2026-12-05T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_dal}/ticket-tiers"
              payload: { tier_code: "GA", price_cents: 3300, allotment: 500, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-12-05T18:00:00Z" }
              as: TicketingManager
              captures: { tier_dal: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1200, catch_fence_height_ft: 6, medical_als_staff_count: 1, medical_bls_staff_count: 2, ambulance_count: 1, emergency_access_lanes: 1 }
              as: SafetyOfficial
              as_user_id: "so-author-1"
              captures: { plan_atl: "$.data.id" }
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-author-1"
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "certified" }
              as: SafetyOfficial
              as_user_id: "so-certifier-2"
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 500000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/on-sale"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_atl}"
              payload: {}
              as: TicketingManager
              captures: { atl_v: "$.data.version" }
            - call: "GET /ticket-tiers/${tier_dal}"
              payload: {}
              as: TicketingManager
              captures: { dal_v: "$.data.version" }
          trigger:
