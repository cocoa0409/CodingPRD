# =============================================================================
# Task 0744 — Faith Congregation & Church Management
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pledge_campaign_projected_vs_chronological_diverge
        grounds:
          - calculations.pledge_campaign_progress
          - entities.PledgeCampaign.fields.pledged_total_cents
          - entities.PledgeCampaign.fields.received_total_cents
        distinguishing_aspect: |
          Same campaign, same inputs; the PROJECTED variant sums Pledge.pledged_amount_cents
          on ACTIVE+FULFILLED pledges (=70000), the CHRONOLOGICAL variant sums POSTED
          Donation.amount_cents (=15000). Delta = 55000 cents. Anchored on the
          PledgeCampaign / Pledge / Donation entity domain (fundraising).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Campaign C1 target=100000 cents, ACTIVE, dates 2026-05-01..2026-12-31"
            - "Member M1 ADULT under Household H1"
            - "Pledge P1 40000 ACTIVE on C1, Pledge P2 30000 ACTIVE on C1, Pledge P3 20000 CANCELLED on C1"
            - "Donation D1 10000 POSTED on 2026-06-01 to P1; Donation D2 5000 POSTED on 2026-06-10 to P1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "Member One", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Building Fund", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 40000, frequency: "MONTHLY", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 30000, frequency: "MONTHLY", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 20000, frequency: "MONTHLY", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /pledges/${p3_id}/cancel"
              payload: {}
              as: FinanceAdmin
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c1_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 5000, donation_date: "2026-06-10", payment_method: "CHECK", campaign_id: "${c1_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { d2_id: $.data.id }
          trigger:
            - call: "GET /pledge-campaigns/${c1_id}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "PledgeCampaign.${c1_id}.pledged_total_cents == 70000"
            - "PledgeCampaign.${c1_id}.received_total_cents == 15000"
            - "PROJECTED and CHRONOLOGICAL variants of pledge_campaign_progress on ${c1_id} differ by exactly 55000 cents (70000 - 15000)"

      - name: statement_provisional_vs_final_diverge_on_pending
        grounds:
          - calculations.member_ytd_deductible
          - entities.YearEndStatement.fields.total_deductible_cents
          - entities.YearEndStatement.fields.variant
        distinguishing_aspect: |
          Same member, same tax year; PROVISIONAL includes PENDING+POSTED (=35000),
          FINAL includes only POSTED-by-Jan-15 (=20000). Anchored on the YearEndStatement /
          Donation domain (contributor tax reporting) — different entity family from
          the projected/chronological instance above (fundraising).
        test_recipe:
          setup:
            - "Clock at 2027-01-20T00:00:00Z (past FINAL cutoff of 2027-01-16)"
            - "Member M1 ADULT under Household H1"
            - "Donation D1 amount 20000 POSTED via CHECK on 2026-03-15 (is_tax_deductible=true)"
            - "Donation D2 amount 15000 PENDING via CARD on 2026-05-01 (is_tax_deductible=true; never simulated to SUCCEEDED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "Member One", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 20000, donation_date: "2026-03-15", payment_method: "CHECK", is_tax_deductible: true }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 15000, donation_date: "2026-05-01", payment_method: "CARD", is_tax_deductible: true }
              as: FinanceAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /year-end-statements"
              payload: { member_id: "${m1_id}", tax_year: 2026, variant: "PROVISIONAL" }
              as: FinanceAdmin
              captures: { s_prov_id: $.data.id }
          trigger:
            - call: "POST /year-end-statements"
              payload: { member_id: "${m1_id}", tax_year: 2026, variant: "FINAL" }
              as: FinanceAdmin
              captures: { s_final_id: $.data.id }
          assert:
            - "YearEndStatement.${s_prov_id}.total_deductible_cents == 35000"
            - "YearEndStatement.${s_prov_id}.donation_count == 2"
            - "YearEndStatement.${s_final_id}.total_deductible_cents == 20000"
            - "YearEndStatement.${s_final_id}.donation_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: volunteer_coverage_score_three_input_nonlinear
        grounds:
          - calculations.volunteer_coverage_score
          - entities.Event.fields.volunteer_filled_count
          - entities.Event.fields.event_type
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (fill_ratio, urgency, priority_weight), non-linear
          interaction (min-clamp on fill_ratio, linear decay on urgency, priority
          multiplier). SERVICE event 48h out with 2/4 filled: score = 56.67.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T10:00:00Z"
            - "Facility F1 capacity 200, buffer 0"
            - "Event E1 SERVICE at F1, starts 2026-05-03T10:00:00Z (exactly 48h later), ends +1h, volunteer_slots=4, expected_attendance=150"
            - "Household H1 with 4 ADULT members M1..M4 (REGULAR); volunteer assignments A1..A4 for E1 role=USHER; A1 and A2 ACCEPTED, A3 and A4 still INVITED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "PATCH /members/${m1_id}"
              payload: { membership_status: "REGULAR" }
              as: Registrar
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M2", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m2@x.com" }
              as: Registrar
              captures: { m2_id: $.data.id }
            - call: "PATCH /members/${m2_id}"
              payload: { membership_status: "REGULAR" }
              as: Registrar
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M3", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m3@x.com" }
              as: Registrar
              captures: { m3_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M4", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m4@x.com" }
              as: Registrar
              captures: { m4_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Sanctuary", capacity: 200, buffer_minutes: 0 }
              as: Coordinator
              captures: { f1_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Sun 10am", event_type: "SERVICE", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T11:00:00Z", expected_attendance: 150, volunteer_slots: 4 }
              as: Coordinator
              captures: { e1_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m1_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a1_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m2_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a2_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m3_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a3_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m4_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a4_id: $.data.id }
            - call: "POST /volunteer-assignments/${a1_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /volunteer-assignments/${a2_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          trigger:
            - call: "GET /events/${e1_id}"
              payload: {}
              as: Coordinator
          assert:
            - "Event.${e1_id}.volunteer_slots == 4"
            - "Event.${e1_id}.volunteer_filled_count == 2"
            - "volunteer_coverage_score of Event.${e1_id} == 56.67  # 100 * 1.00 * (0.60*0.50 + 0.40*(1 - 48/72)) = 56.67 after round_half_up to 2 dp"

      - name: donation_split_last_pledge_absorbs_rounding_remainder
        grounds:
          - calculations.donation_split_across_pledges
          - entities.Pledge.fields.received_amount_cents
          - errors[ERR_NO_ACTIVE_PLEDGE]
        distinguishing_aspect: |
          Mode (b): nested rounding — round-per-item then last absorbs remainder.
          Donation 10000 split across P1.remaining=6000 (sorted first, floor share),
          P2.remaining=3000 (sorted last, absorbs remainder). Pinned split
          (6666, 3334); the alternative sum-then-round order produces (6667, 3333).
          Different mode from the ≥3-input non-linear formula above.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Campaign C1 ACTIVE with target 100000, dates 2026-05-01..2026-12-31"
            - "Member M1 ADULT REGULAR"
            - "Pledge P1: pledged 6000, ACTIVE, created first (earlier created_at). Pledge P2: pledged 3000, ACTIVE, created second."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Split", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 6000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 3000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-06-15", payment_method: "CHECK", campaign_id: "${c1_id}", split_across: true }
              as: FinanceAdmin
              captures: { d_parent_id: $.data.id }
          assert:
            - "Pledge.${p1_id}.received_amount_cents == 6666  # floor(10000 * 6000 / 9000) with per-item rounding"
            - "Pledge.${p2_id}.received_amount_cents == 3334  # 10000 - 6666, absorbs remainder; note sum-then-round would give 3333"
            - "PledgeCampaign.${c1_id}.received_total_cents == 10000  # invariant: split shares total to the parent amount"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pledge_cyclic_fulfilled_to_active_on_refund
        grounds:
          - state_machines.Pledge.ACTIVE_to_FULFILLED
          - state_machines.Pledge.FULFILLED_to_ACTIVE
          - state_machines.Donation.POSTED_to_REFUNDED
        distinguishing_aspect: |
          Cyclic state machine on Pledge (ACTIVE -> FULFILLED -> ACTIVE) driven by
          POSTED / REFUNDED donation transitions. Different entity from the second
          instance (YearEndStatement cycle).
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Campaign C1 ACTIVE; Pledge P1 pledged 10000, currently FULFILLED via Donation D1 (10000 POSTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Cycle", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c1_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Donation.${d1_id}.status == REFUNDED"
            - "Pledge.${p1_id}.status == ACTIVE  # cycled back FULFILLED -> ACTIVE"
            - "Pledge.${p1_id}.received_amount_cents == 0"
            - "PledgeCampaign.${c1_id}.fulfilled_pledge_count == 0"

      - name: statement_cyclic_voided_to_draft_regenerate
        grounds:
          - state_machines.YearEndStatement.DRAFT_to_ISSUED
          - state_machines.YearEndStatement.ISSUED_to_VOIDED
          - state_machines.YearEndStatement.VOIDED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on YearEndStatement (DRAFT -> ISSUED -> VOIDED -> DRAFT).
          Different entity from the Pledge cycle above.
        test_recipe:
          setup:
            - "Donations D1 (20000, 2026-03-15) and D2 (30000, 2026-11-01) BOTH POSTED via CHECK before the FINAL cutoff (both auto-post at creation with posted_at = server clock, which is set to their donation dates)"
            - "Clock at 2027-01-20T00:00:00Z (past FINAL create cutoff of 2027-01-16)"
            - "Statement S1 (FINAL, member=M1, tax_year=2026) created at DRAFT, transitioned to ISSUED, then to VOIDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 20000, donation_date: "2026-03-15", payment_method: "CHECK", is_tax_deductible: true }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 30000, donation_date: "2026-11-01", payment_method: "CHECK", is_tax_deductible: true }
              as: FinanceAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /year-end-statements"
              payload: { member_id: "${m1_id}", tax_year: 2026, variant: "FINAL" }
              as: FinanceAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /year-end-statements/${s1_id}/issue"
              payload: {}
              as: FinanceAdmin
            - call: "POST /year-end-statements/${s1_id}/void"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /year-end-statements/${s1_id}/regenerate"
              payload: {}
              as: FinanceAdmin
          assert:
            - "YearEndStatement.${s1_id}.status == DRAFT  # completed cycle DRAFT -> ISSUED -> VOIDED -> DRAFT"
            - "YearEndStatement.${s1_id}.total_deductible_cents == 50000  # 20000 + 30000 (both POSTED before Jan-15 cutoff, FINAL variant)"
            - "YearEndStatement.${s1_id}.donation_count == 2"
            - "YearEndStatement.${s1_id}.issued_at is null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: donation_refund_depth_three_cascade_to_campaign_counter
        grounds:
          - state_machines.Donation.POSTED_to_REFUNDED
          - state_machines.Pledge.FULFILLED_to_ACTIVE
          - entities.PledgeCampaign.fields.fulfilled_pledge_count
        distinguishing_aspect: |
          Depth-3 chain: refund action mutates Donation (Link 0), which causes
          Pledge.received_amount_cents update (Link 1), which causes Pledge state
          flip FULFILLED -> ACTIVE (Link 2 — caused by Link 1, not by the refund
          action directly), which causes PledgeCampaign.fulfilled_pledge_count
          decrement (Link 3 — caused by Link 2). Each link is caused by the
          previous. Origin: POST /donations/{id}/refund.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Campaign C1 ACTIVE; Pledge P1 pledged 10000 FULFILLED with Donation D1 10000 POSTED; PledgeCampaign.fulfilled_pledge_count == 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Household 1", address_line1: "1 Main St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Depth3", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c1_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Donation.${d1_id}.status == REFUNDED  # Link 0"
            - "Pledge.${p1_id}.received_amount_cents == 0  # Link 1: caused by donation state change"
            - "Pledge.${p1_id}.status == ACTIVE  # Link 2: caused by Link 1 crossing threshold"
            - "PledgeCampaign.${c1_id}.fulfilled_pledge_count == 0  # Link 3: caused by Link 2 pledge state flip"

      - name: event_cancel_depth_two_cascade_to_facility_hours
        grounds:
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - state_machines.FacilityBooking.CONFIRMED_to_CANCELLED
          - entities.Facility.fields.upcoming_booked_hours
        distinguishing_aspect: |
          Depth-2 chain, different trigger: POST /events/{id}/cancel mutates
          Event (Link 0), which causes linked FacilityBooking CONFIRMED->CANCELLED
          (Link 1 — caused by the Event state change), which causes
          Facility.upcoming_booked_hours recompute (Link 2 — caused by the
          FacilityBooking state change). Origin differs from the depth-3 chain above.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T09:00:00Z"
            - "Facility F1 capacity 200 buffer 0; Facility.upcoming_booked_hours == 2.0 (from one CONFIRMED booking)"
            - "Event E1 SCHEDULED at F1 with FacilityBooking B1 CONFIRMED [2026-05-03T10:00:00Z, 2026-05-03T12:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Sanctuary", capacity: 200, buffer_minutes: 0 }
              as: Coordinator
              captures: { f1_id: $.data.id, f1_v0: $.data.version }
            - call: "POST /events"
              payload: { name: "Sun 10am", event_type: "SERVICE", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T12:00:00Z", expected_attendance: 100, volunteer_slots: 0, facility_id: "${f1_id}" }
              as: Coordinator
              captures: { e1_id: $.data.id }
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f1_id}", booking_type: "EVENT", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T12:00:00Z", headcount: 100, expected_facility_version: "${f1_v0}", event_id: "${e1_id}" }
              as: Coordinator
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /events/${e1_id}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "Event.${e1_id}.status == CANCELLED  # Link 0"
            - "FacilityBooking.${b1_id}.status == CANCELLED  # Link 1: caused by Event state change"
            - "Facility.${f1_id}.upcoming_booked_hours == 0  # Link 2: caused by Link 1's booking state change"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_on_refunded_donation_past_window_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Two violations fire on POST /donations/{id}/refund: (a) donation.status
          is already REFUNDED (priority 5, category=state), (b) donation_date is
          > 60 days in the past (priority 10, category=business_temporal). The
          state check wins. Pair = {state, business_temporal}.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
            - "Donation D1: amount 10000, donation_date 2026-01-01 (152 days ago), payment_method=CHECK, status=POSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-01-01", payment_method: "CHECK" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
              # First refund succeeds (within window at 2026-01-01 clock). Donation now REFUNDED.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              # Advance clock so a fresh refund would also fail the 60-day window.
          trigger:
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE  # priority 5 beats priority 10"

      - name: donation_pledge_campaign_mismatch_and_zero_amount_referential_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_REFERENCE_MISMATCH]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          Two violations fire on POST /donations: (a) pledge_id's campaign differs
          from donation's campaign_id (priority 4, category=business_referential),
          (b) amount_cents == 0 (priority 11, category=business_fiscal). The
          referential check wins. Pair = {business_referential, business_fiscal};
          different pair from the state/temporal instance above.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Two ACTIVE campaigns C1, C2; Pledge P1 attached to C1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledge-campaigns"
              payload: { name: "C2", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /pledge-campaigns/${c2_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 0, donation_date: "2026-06-15", payment_method: "CHECK", campaign_id: "${c2_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_REFERENCE_MISMATCH  # priority 4 beats priority 11"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refund_at_exact_60_day_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
          - state_machines.Donation.POSTED_to_REFUNDED
        distinguishing_aspect: |
          Numeric boundary on a temporal metric (elapsed days since donation_date).
          Metric: date delta. At exactly current_date == donation_date + 60 days
          the refund is permitted; at donation_date + 61 days it is rejected with
          ERR_REFUND_WINDOW_EXPIRED. Endpoint: POST /donations/{id}/refund.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z"
            - "Donation D1: donation_date=2026-03-01, amount 5000, POSTED (CASH)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 5000, donation_date: "2026-03-01", payment_method: "CASH" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
              # exactly 60 days later — boundary permitted
          trigger:
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Donation.${d1_id}.status == REFUNDED  # boundary at day 60 succeeds"
            - "response.status == 200"

      - name: donation_split_across_empty_active_pledge_set
        grounds:
          - calculations.donation_split_across_pledges
          - errors[ERR_NO_ACTIVE_PLEDGE]
          - validations[priority=5]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (count of candidate pledges).
          When split_across=true and the member has zero ACTIVE pledges on the
          campaign, the endpoint rejects with ERR_NO_ACTIVE_PLEDGE. Endpoint:
          POST /donations. Different metric and different endpoint from the
          60-day boundary above.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "ACTIVE campaign C1; Member M1; M1 has ONE pledge P1 but it is CANCELLED (so active pledge count for (M1, C1) is 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "C1", target_amount_cents: 100000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pledges/${p1_id}/cancel"
              payload: {}
