        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - validations.priority_25
          - endpoints.GET_fiber_grades
        distinguishing_aspect: "limit=101 is one past the declared 1..100 ceiling, so the list call must return 400 ERR_INVALID_PAGINATION rather than silently clamping to 100 — the response carries no data array at all."
        test_recipe:
          setup: ["One FiberGrade row exists so the list would otherwise return data."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          trigger:
            - call: "GET /fiber-grades?limit=101"
              payload: {}
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 400"
            - "response.data.error_id == 'ERR_INVALID_PAGINATION'"
            - "GET /fiber-grades?limit=100 as FiberBuyer reports total_count == 1"

      - name: steam_window_ending_before_it_starts_is_unprocessable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_WINDOW]
          - validations.priority_27
          - endpoints.POST_steam_allocations
        distinguishing_aspect: "window_end 06:00 precedes window_start 12:00, so priority 27 returns 422 ERR_INVALID_WINDOW before the waterfall dispatch runs; no SteamAllocation row is created and the header stays completely uncommitted."
        test_recipe:
          setup: ["An empty steam header with the clock at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T06:00:00Z", demand_tph: 40.000, priority_rank: 2 }
              as: EnergyManager
              as_user_id: "energy-1"
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == 'ERR_INVALID_WINDOW'"
            - "GET /steam-allocations as EnergyManager reports total_count == 0"

      - name: a_reading_dated_after_the_logical_clock_is_out_of_range
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DATE_OUT_OF_RANGE]
          - validations.priority_65
          - endpoints.POST_effluent_permits_id_readings
        distinguishing_aspect: "The logical clock reads 2026-08-01, so a reading_date of 2026-08-02 is in the future and must fail with 422 ERR_DATE_OUT_OF_RANGE; the permit's rolling figures stay 0.000 and its posture stays COMPLIANT, proving the guard runs before the rolling recompute."
        test_recipe:
          setup: ["Permit MILL-NPDES-1 with no readings and the clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "POST /effluent-permits"
              payload: { permit_number: "MILL-NPDES-1", bod_limit_kg_per_day: 500.00, tss_limit_kg_per_day: 400.00, flow_limit_m3_per_day: 9000.00, rolling_window_days: 30 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { permit_id: "$.data.id" }
          trigger:
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-08-02", flow_m3: 100.00, bod_kg: 10.00, tss_kg: 5.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == 'ERR_DATE_OUT_OF_RANGE'"
            - "GET /effluent-permits/${permit_id} as EnvironmentalOfficer reports rolling_bod_kg_per_day == 0.000, exceedance_day_count == 0, compliance_posture == 'COMPLIANT'"
            - "GET /effluent-permits/${permit_id}/readings as EnvironmentalOfficer reports total_count == 0"

      - name: reusing_a_machine_name_hits_the_uniqueness_guard
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_KEY]
          - validations.priority_57
          - endpoints.POST_paper_machines
        distinguishing_aspect: "A second machine named PM1 must fail with 409 ERR_DUPLICATE_KEY even though every other field differs, and the first machine's version must not move — uniqueness is enforced on name, not on the whole row."
        test_recipe:
          setup: ["Machine PM1 already registered with a 5600 mm deckle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_id: "$.data.id", machine_v: "$.data.version" }
          trigger:
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 12.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.800 }
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == 'ERR_DUPLICATE_KEY'"
            - "GET /paper-machines/${machine_id} as MillPlanner reports wire_width_mm == 5600, changeover_buffer_minutes == 30, version == ${machine_v}"

      - name: a_fully_committed_steam_header_refuses_the_next_overlapping_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STEAM_HEADER_SATURATED]
          - validations.priority_69
          - calculations.steam_waterfall_dispatch
          - calculations.steam_waterfall_dispatch.constants.HEADER_CAPACITY_TPH
        distinguishing_aspect: "The incumbent grant consumes the entire 180.000 tph header across an overlapping window, so remaining is exactly 0.000 and the new request is refused with 409 ERR_STEAM_HEADER_SATURATED instead of being created as a CURTAILED zero-tonnage grant. The incumbent's granted_tph must be untouched at 180.000."
        test_recipe:
          setup: ["One GRANTED priority 1 allocation of 180.000 tph over 2026-08-01T06:00-12:00, which is the whole header."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "DEINK_PLANT", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", demand_tph: 180.000, priority_rank: 1 }
              as: EnergyManager
              as_user_id: "energy-1"
              captures: { alloc_a: "$.data.id" }
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T09:00:00Z", demand_tph: 10.000, priority_rank: 3 }
              as: EnergyManager
              as_user_id: "energy-1"
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == 'ERR_STEAM_HEADER_SATURATED'"
            - "GET /steam-allocations/${alloc_a} as EnergyManager reports granted_tph == 180.000, curtailed_tph == 0.000, status == 'GRANTED'"
            - "GET /steam-allocations as EnergyManager reports total_count == 1"

      - name: voiding_an_already_voided_reading_is_an_env_record_state_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENV_RECORD_INVALID_STATE]
          - validations.priority_35
          - endpoints.POST_effluent_readings_id_void
          - calculations.effluent_rolling_compliance
        distinguishing_aspect: "The first void succeeds and drops the reading out of the rolling window (rolling_bod_kg_per_day returns to 0.000); the second void on the same row must fail with 409 ERR_ENV_RECORD_INVALID_STATE and must not re-run the rolling recompute or flip voided back."
        test_recipe:
          setup: ["Permit MILL-NPDES-1 with a single reading on 2026-07-20 (bod 300.00) that has already been voided once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "POST /effluent-permits"
              payload: { permit_number: "MILL-NPDES-1", bod_limit_kg_per_day: 500.00, tss_limit_kg_per_day: 400.00, flow_limit_m3_per_day: 9000.00, rolling_window_days: 30 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { permit_id: "$.data.id" }
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-07-20", flow_m3: 8000.00, bod_kg: 300.00, tss_kg: 100.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { reading_id: "$.data.id" }
            - call: "POST /effluent-readings/${reading_id}/void"
              payload: {}
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          trigger:
            - call: "POST /effluent-readings/${reading_id}/void"
              payload: {}
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == 'ERR_ENV_RECORD_INVALID_STATE'"
            - "GET /effluent-readings/${reading_id} as EnvironmentalOfficer reports voided == true"
            - "GET /effluent-permits/${permit_id} as EnvironmentalOfficer reports rolling_bod_kg_per_day == 0.000, rolling_tss_kg_per_day == 0.000, compliance_posture == 'COMPLIANT'"
            - "GET /effluent-permits/${permit_id}/readings?voided=false as EnvironmentalOfficer reports total_count == 0"

      - name: an_order_wider_than_the_customers_envelope_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CUSTOMER_SPEC_VIOLATION]
          - validations.priority_59
          - endpoints.POST_customer_orders
        distinguishing_aspect: "roll_width_mm 2600 is a shape-legal value (the field range is 400..2800) but exceeds the customer's max_roll_width_mm of 2400, so the failure must be 422 ERR_CUSTOMER_SPEC_VIOLATION rather than ERR_VALIDATION, and no CustomerOrder row may be created."
        test_recipe:
          setup: ["Grade spec TL_140 and customer Great Lakes Converting whose envelope is 2400 mm width, 1400 mm diameter, KRAFT_ONLY."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-grade-specs"
              payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.50, min_sct_kn_m: 2.50, requires_deink_pulp: false, rank_order: 10 }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /customers"
              payload: { name: "Great Lakes Converting", allocation_priority_tier: "P1", max_roll_diameter_mm: 1400, max_roll_width_mm: 2400, wrap_spec: "KRAFT_ONLY" }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { customer_id: "$.data.id" }
          trigger:
            - call: "POST /customer-orders"
              payload: { customer_id: "${customer_id}", product_code: "TL_140", ordered_tons: 10.00, requested_ship_date: "2026-09-10T00:00:00Z", roll_width_mm: 2600, roll_diameter_mm: 1300, wrap_spec: "KRAFT_ONLY" }
              as: Customer
              as_user_id: "${customer_id}"
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == 'ERR_CUSTOMER_SPEC_VIOLATION'"
            - "GET /customer-orders as Customer with X-User-ID ${customer_id} reports total_count == 0"

