              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Ivy", max_tables: 4 }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-kk", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v}" }
              as: FloorManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-17T03:45:00Z" }
              as: FloorManager
          trigger:
            - call: "POST /reservations/${res_id}/no-show"
              payload: {}
              as: FloorManager
          assert:
            - "SeatTable.${table_id}.status == AVAILABLE after no-show (table freed)"
            - "Server.${server_id}.assigned_table_count == 1 (server still owns T1; load conserved)"
            - "Reservation.${res_id}.booking_status == NO_SHOW"
