            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
