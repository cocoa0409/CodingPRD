      - name: say_on_pay_support_exactly_at_pass_floor_passes_and_excludes_abstentions
        grounds:
          - calculations.say_on_pay_support
          - state_machines.PayProgram.vote_status_NOT_VOTED_to_PASSED
          - entities.PayProgram.fields.enhanced_engagement_required
          - entities.PayProgram.fields.design_status
        distinguishing_aspect: |
          Two thresholds are probed by one call. votes_for 500,000 against votes_against 500,000 is exactly
          PASS_FLOOR_PCT 50.00, which passes because the comparison is `>=`; and the 250,000 abstentions are
          excluded from the denominator, so an implementation that includes them computes 40.00 and reports FAILED.
          The same 50.00 is strictly below RESPONSIVENESS_FLOOR_PCT 70.00, so the program must stay DISCLOSED with
          enhanced_engagement_required true rather than advancing to CLOSED. The boundary is therefore
          simultaneously satisfied at one floor and breached at another.
