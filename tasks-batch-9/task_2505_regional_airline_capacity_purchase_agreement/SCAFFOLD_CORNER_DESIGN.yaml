          rationale: "That §1.8 instance triggers the understaffed refusal and then satisfies it by line-qualifying one more captain."

      - name: error_remediation_not_verified_on_close
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REMEDIATION_NOT_VERIFIED]
          - validations[priority=63]
        excluded_because:
          difficulty_instance: non_linear_state_machine / brand_audit_two_independent_status_dimensions
          rationale: "That §1.8 instance attempts closure with an ACKNOWLEDGED finding whose remediation is still IN_PROGRESS, which is exactly this error's cross-dimension guard."

  # ===========================================================================
  # Guide section 7 — RBAC (role_model: segregation_of_duties)
  # ===========================================================================
  - section: rbac
    instances:
      - name: every_role_can_read_the_shared_get_surface
        claim_type: shared_operations
        grounds:
          - rbac.CPAAdministrator
          - rbac.MainlineScheduler
          - rbac.RegionalOpsController
          - rbac.BaseChiefPilot
          - rbac.BrandAuditor
          - endpoints[GET /cpa/agreements]
        distinguishing_aspect: "All five roles are declared on every GET, so the identical read returns HTTP 200 with the same total_count for each of them — read access is never partitioned by role in this domain."
        test_recipe:
          setup:
            - "One DRAFT agreement with one CrewBase."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
          trigger:
            - call: "GET /cpa/agreements"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/agreements"
              payload: {}
              as: RegionalOpsController
            - call: "GET /cpa/crew-bases"
              payload: {}
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "GET /cpa/crew-bases"
              payload: {}
              as: BrandAuditor
          assert:
            - "All four reads return HTTP 200"
            - "Both agreement reads return total_count == 1 with data[0].id == ${ag}; both crew-base reads return total_count == 1 with data[0].id == ${base}"
            - "Every response carries the §1.0 envelope keys limit == 10, offset == 0, total_count and has_more == false"

      - name: mainline_scheduler_cannot_create_agreements
        claim_type: exclusive_operations_denied
        grounds:
          - rbac.MainlineScheduler.denied
          - endpoints[POST /cpa/agreements]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Agreement creation is exclusive to CPAAdministrator: the mainline scheduler's identical payload is a 403 and no row is written, even though the same role may create schedule cycles under an existing agreement."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: MainlineScheduler
          assert:
            - "HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /cpa/agreements as CPAAdministrator returns data == [] and total_count == 0"

      - name: regional_ops_controller_cannot_reconcile_passthrough
        claim_type: exclusive_operations_denied
        grounds:
          - rbac.RegionalOpsController.denied
          - endpoints[POST /cpa/pass-through-claims/{claimId}/reconcile]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The party that files the actual may not adjudicate it at all: the filer's role is denied the reconcile endpoint outright at priority 2, which is a stronger separation than the same-user check at priority 56."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base, an OPEN cycle 2026-09 (published_departures 0) and one AIRPORT_FEES claim in ACTUAL_SUBMITTED."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 0 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 8000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { c1: $.data.id }
            - call: "POST /cpa/pass-through-claims/${c1}/submit-actual"
              payload: { actual_amount_usd: 8100.00, supporting_doc_ref: "DOC-C1" }
              as: RegionalOpsController
              as_user_id: "ops-1"
          trigger:
            - call: "POST /cpa/pass-through-claims/${c1}/reconcile"
              payload: { decision: "APPROVE" }
              as: RegionalOpsController
              as_user_id: "ops-1"
          assert:
            - "HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" — not ERR_SEGREGATION_OF_DUTIES, which presupposes an allowed role"
            - "PassThroughClaim.${c1}.status == \"ACTUAL_SUBMITTED\", allowed_amount_usd == null, reconciled_by_user_id == null"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd == 0.00"

      - name: brand_auditor_cannot_acknowledge_its_own_finding
        claim_type: exclusive_operations_denied
        grounds:
          - rbac.BrandAuditor.denied
          - endpoints[POST /cpa/brand-audits/{auditId}/acknowledge]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The auditor raises and closes findings but may not acknowledge or remediate them; the carrier's acknowledgement is what unlocks closure, so the auditor cannot manufacture a closable audit alone."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and one OPEN BrandAudit."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/brand-audits"
              payload: { base_id: "${base}", audit_scope: "SERVICE_SCRIPT", findings_count: 1, severity: "MAJOR" }
              as: BrandAuditor
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /cpa/brand-audits/${a1}/acknowledge"
              payload: {}
              as: BrandAuditor
            - call: "POST /cpa/brand-audits/${a1}/close"
              payload: {}
              as: BrandAuditor
          assert:
            - "The acknowledge call returns HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "The close call returns HTTP 409 with data.error_id == \"ERR_INVALID_STATE\" — finding_status is still OPEN, so the ACKNOWLEDGED→CLOSED transition does not apply"
            - "BrandAudit.${a1}.finding_status == \"OPEN\" and remediation_status == \"NOT_STARTED\""

      - name: base_chief_pilot_cannot_advance_a_pilot_at_another_base
        claim_type: peer_roles
        grounds:
          - validations[priority=6]
          - errors[ERR_BASE_NOT_OWNED]
          - rbac.BaseChiefPilot
        distinguishing_aspect: "BaseChiefPilot is entity-backed by CrewBase: the same request is a 403 ERR_BASE_NOT_OWNED when X-User-ID is the other base's id and a 200 when it is the pilot's own base id — role membership alone is not enough."
        test_recipe:
          setup:
            - "ACTIVE agreement with two bases (MKE and IND); one PIPELINE captain hired at MKE."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base1: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "IND", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base2: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base1}", employee_ref: "EMP-5601", seat: "CAPTAIN", hire_class_date: "2026-05-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base2}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base1}"
          assert:
            - "The first call returns HTTP 403 with data.error_id == \"ERR_BASE_NOT_OWNED\" and Pilot.${p1}.status stays \"PIPELINE\""
            - "The second call returns HTTP 200 with data.status == \"IN_TRAINING\""
            - "CrewBase.${base1}.in_training_pilot_count == 1 and CrewBase.${base2}.in_training_pilot_count == 0"

      - name: same_user_cannot_reconcile_the_actual_it_filed
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=56]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PassThroughClaim.fields.actual_submitted_by_user_id
        distinguishing_aspect: "The check compares X-User-ID against actual_submitted_by_user_id, not roles: the very same CPAAdministrator role succeeds under admin-2 and is refused under admin-1, the identity that filed the actual."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base, an OPEN cycle 2026-09 (published_departures 0) and one INSURANCE claim whose actual was filed by admin-1."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 0 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "INSURANCE", estimated_amount_usd: 20000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { c1: $.data.id }
            - call: "POST /cpa/pass-through-claims/${c1}/submit-actual"
              payload: { actual_amount_usd: 20500.00, supporting_doc_ref: "DOC-INS-1" }
              as: CPAAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /cpa/pass-through-claims/${c1}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
            - call: "POST /cpa/pass-through-claims/${c1}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-2"
          assert:
            - "The admin-1 call returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"; PassThroughClaim.${c1}.status stays \"ACTUAL_SUBMITTED\""
            - "The admin-2 call returns HTTP 200 with data.status == \"RECONCILED\", reconciled_by_user_id == \"admin-2\", actual_submitted_by_user_id == \"admin-1\""
            - "allowed_amount_usd == 20500.00 — min(20500.00, round2(20000.00 * 1.05) == 21000.00) — and variance_usd == 500.00"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd == 21115.00 — base 20500.00 plus a 3.0% admin fee of 615.00"

      - name: offering_party_cannot_accept_its_own_standing_offer
        claim_type: segregation_of_duties
        grounds:
          - state_machines.ExtensionNegotiation.OFFERED_to_ACCEPTED
          - validations[priority=56]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The accept endpoint admits both negotiating roles, so the guard is state-dependent rather than role-static: on an OFFERED round the mainline author is refused and only the regional carrier may accept."
        test_recipe:
          setup:
            - "ACTIVE agreement (term_end_date 2029-12-31) with one base and one OFFERED extension negotiation proposing 2031-12-31 at 1500.00."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/agreements/${ag}"
              payload: {}
              as: MainlineScheduler
              captures: { ag_v: $.data.version }
            - call: "POST /cpa/agreements/${ag}/extension-negotiations"
              payload: { proposed_term_end_date: "2031-12-31", proposed_block_hour_rate_usd: 1500.00, expected_agreement_version: "${ag_v}" }
              as: MainlineScheduler
              captures: { neg: $.data.id }
          trigger:
            - call: "POST /cpa/extension-negotiations/${neg}/accept"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/extension-negotiations/${neg}/accept"
              payload: {}
              as: RegionalOpsController
          assert:
            - "The MainlineScheduler call returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"; ExtensionNegotiation.${neg}.status stays \"OFFERED\" and Agreement.${ag}.term_end_date stays \"2029-12-31\""
            - "The RegionalOpsController call returns HTTP 200 with data.status == \"ACCEPTED\""
            - "Agreement.${ag}.status == \"ACTIVE\", term_end_date == \"2031-12-31\", block_hour_rate_usd == 1500.00, extension_round_count == 1"

  # ===========================================================================
  # Guide section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_agreement_version_on_extension_offer_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.extension-offer-stale-agreement
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - endpoints[POST /cpa/agreements/{agreementId}/extension-negotiations]
        distinguishing_aspect: "The OCC guard is on the Agreement: an expected_agreement_version one behind the observed value is a 412 that creates nothing, while the observed value succeeds and itself bumps the agreement's version."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base; its current version has just been read."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/agreements/${ag}"
              payload: {}
              as: MainlineScheduler
              captures: { ag_v: $.data.version }
          trigger:
            - call: "POST /cpa/agreements/${ag}/extension-negotiations"
              payload: { proposed_term_end_date: "2031-12-31", proposed_block_hour_rate_usd: 1500.00, expected_agreement_version: "${ag_v} - 1" }
              as: MainlineScheduler
            - call: "POST /cpa/agreements/${ag}/extension-negotiations"
              payload: { proposed_term_end_date: "2031-12-31", proposed_block_hour_rate_usd: 1500.00, expected_agreement_version: "${ag_v}" }
              as: MainlineScheduler
              captures: { neg: $.data.id }
          assert:
            - "The stale call returns HTTP 412 with data.error_id == \"ERR_STALE_AGREEMENT_VERSION\""
            - "After the stale call Agreement.${ag}.status == \"ACTIVE\", extension_round_count == 0, version == ${ag_v} — a refused write bumps nothing"
            - "The current-version call returns HTTP 201 with data.status == \"OFFERED\" and data.round_index == 1"
            - "Agreement.${ag}.status == \"EXTENSION_PENDING\", extension_round_count == 1 and version is exactly one greater than ${ag_v}"

      - name: stale_cycle_version_on_invoice_creation_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.invoice-create-stale-cycle
          - errors[ERR_STALE_CYCLE_VERSION]
          - endpoints[POST /cpa/schedule-cycles/{cycleId}/invoices]
        distinguishing_aspect: "The second §1.2.1 rule guards a different parent with a different field name and error code: expected_schedule_cycle_version one behind the cycle's version is a 412 that leaves open_invoice_count at 0."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and an OPEN cycle 2026-09 (published_departures 0); the cycle's current version has just been read."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 0 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "PROVISIONAL", expected_schedule_cycle_version: "${cyc_v} - 1" }
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "PROVISIONAL", expected_schedule_cycle_version: "${cyc_v}" }
              as: CPAAdministrator
              captures: { inv: $.data.id }
          assert:
            - "The stale call returns HTTP 412 with data.error_id == \"ERR_STALE_CYCLE_VERSION\"; GET /cpa/invoices?cycle_id=${cyc} returns total_count == 0 and Agreement.${ag}.open_invoice_count == 0"
            - "ScheduleCycle.${cyc}.version == ${cyc_v} after the refused call"
            - "The current-version call returns HTTP 201 with data.status == \"DRAFT\", variant \"PROVISIONAL\", fixed_component_usd == 250000.00, variable_component_usd == 0.00, passthrough_component_usd == 0.00, total_usd == 250000.00"
            - "ScheduleCycle.${cyc}.version is exactly one greater than ${cyc_v} and Agreement.${ag}.open_invoice_count == 1"

      - name: five_hop_cascade_from_claim_finalization
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CancellationClaim.CLASSIFIED_to_FINALIZED
        excluded_because:
          difficulty_instance: transitive_cascade / claim_finalize_five_hop_cascade_unwinds_issued_invoice
          rationale: "That §1.8 instance verifies all five hops end to end, including the ISSUED invoice void and the SETTLED → CLOSED revert."

      - name: both_invoice_variants_produce_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - calculations.invoice_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_component_divergence
          rationale: "That §1.8 instance computes both variants over one cycle and asserts the signed delta between their totals."

      - name: performance_tier_thresholds_at_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.performance_incentive_penalty.constants.CF_TIER_HIGH_PCT
          - calculations.on_time_arrival.constants.ON_TIME_GRACE_MINUTES
        excluded_because:
          difficulty_instance: boundary_precision_check / on_time_grace_inclusive_boundary_on_leg_completion
          rationale: "That §1.8 instance tests the inclusive grace threshold at 14:00 and 14:01 on leg completion; its sibling instance covers the completion-factor tier at 99.00."

      - name: settled_money_reconciles_after_void
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Agreement.fields.settled_to_date_usd
        excluded_because:
          difficulty_instance: compensating_invariant / settled_money_restored_by_invoice_void
          rationale: "That §1.8 instance asserts the derived money field after create, after issue and after void, which is exactly this layer's three-point check."

  # ===========================================================================
  # Guide section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: completion_response_and_parent_ledger_are_immediately_consistent
        claim_type: immediate
        grounds:
          - endpoints[POST /cpa/flight-legs/{legId}/complete]
          - entities.ScheduleCycle.fields.credited_block_hours
          - calculations.variable_flight_payment
        distinguishing_aspect: "Every derived value is visible in the same request that caused it: the completion response already carries the leg's computed payment and on-time flag, and an immediately following read of the parent cycle shows the updated ledger with no second write and no delay."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one IN_SERVICE tail."
            - "OPEN cycle 2026-09 with published_departures 2 and one SCHEDULED leg (planned 2.000)."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-5901", seat: "CAPTAIN", hire_class_date: "2026-05-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N5901RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 2 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM8901", origin: "MKE", destination: "DEN", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T10:00:00Z", planned_block_hours: 2.000 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.750, actual_arrival_utc: "2026-09-02T10:20:00Z", enplaned_bags: 150, mishandled_bags: 1 }
              as: RegionalOpsController
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: MainlineScheduler
          assert:
            - "The completion response already carries data.status == \"COMPLETED\", data.on_time == false (20 minutes late exceeds the 14-minute grace) and data.leg_variable_payment_usd == 2858.81 — round2(1.750 * 1450.75) == 2538.81 plus 320.00"
            - "The immediately following cycle read shows credited_block_hours == 1.750, recorded_completed_legs == 1, open_leg_count == 0, enplaned_bags_total == 150, mishandled_bags_total == 1, on_time_leg_count == 0"
            - "metric_completed_departures == 2 and departure_ledger_total == 2 — no cancellation occurred, so the conserved ledger still equals published_departures"
