        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_REVIEW_ALREADY_PENDING]"]
        distinguishing_aspect: "A second submit while a review is PENDING fails ERR_REVIEW_ALREADY_PENDING; only one PENDING review exists."
