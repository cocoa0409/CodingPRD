# =============================================================================
# SCAFFOLD.yaml — §1.0-§1.7 seed tables
# Task: task_2983_retina_practice_intravitreal_injection_buy_and_bill
# =============================================================================

scenario: |
  2983. Retina Practice & Intravitreal Injection Buy-and-Bill (retina specialty practice):
  imaging-driven treatment decision with treat-and-extend interval logic, drug acquisition
  under buy-and-bill with lot and vial tracking, step therapy and prior authorization by
  payer with biosimilar preference, injection encounter documentation supporting the drug
  and administration codes, wastage billing with single-dose vial modifiers, inventory
  carrying cost and expiration risk on high-cost biologics, patient assistance and copay
  foundation coordination, endophthalmitis adverse-event surveillance and reporting,
  recall/return of a lot with patient notification

domain_name: retina-intravitreal-buy-and-bill
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Peer entities joined by explicit foreign keys; no nesting in URL paths.
  # Every collection is addressed at the top level (/vials, /claims, /drug-lots)
  # and every parent->child hop is discovered through a filtered list endpoint.

  state_machine_shape: parallel
  # Claim carries two independent status axes (drug_line_status x admin_line_status)
  # that advance separately from one remittance posting. TreatmentPlan
  # (MAINTENANCE <-> INTENSIFIED) and PriorAuthorization
  # (SUBMITTED <-> INFO_REQUESTED, DENIED -> APPEALED -> APPROVED) are cyclic;
  # AdverseEvent adjudication is a fork with divergent side-effect sets; Vial is
  # branching-with-revert.

  relationship_patterns:
    - one_to_many          # DrugLot -> Vial, LotRecall -> RecallNotification
    - many_to_many         # PayerDrugPolicy joins Payer and Drug
    - self_referential     # Drug.reference_drug_id -> Drug.id (biosimilar -> reference product)
                           # InjectionEncounter.previous_encounter_id -> InjectionEncounter.id
    - cross_aggregate      # Claim reads DrugLot acquisition cost; AdverseEvent reaches DrugLot

  role_model: segregation_of_duties
  # Three same-person prohibitions keyed on X-User-ID: the injecting clinician may
  # not attest their own wastage, may not adjudicate an adverse event on their own
  # encounter, and the operator who initiated a lot recall may not close it.

  consistency_model: immediate

difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: payer or plan display name
        constraints: 1-120 chars, unique
      - name: payer_type
        type: enum
        source: input
        description: contract family the payer belongs to
        constraints: "one of COMMERCIAL, MEDICARE_ADVANTAGE, MEDICARE_PART_B, MEDICAID"
      - name: federal_program
        type: boolean
        source: computed
        description: "true when payer_type IN {MEDICARE_PART_B, MEDICARE_ADVANTAGE, MEDICAID}; blocks manufacturer copay cards"
      - name: coinsurance_rate
        type: number
        source: input
        description: fraction of the allowed amount that lands on the patient
        constraints: 0 <= value <= 1, at most 4 decimal places
      - name: pa_required
        type: boolean
        source: input
        description: payer-level default for prior-authorization requirement
        default: true
      - name: biosimilar_preference
        type: enum
        source: input
        description: "biosimilar substitution posture: one of NONE, PREFERRED, MANDATORY"
        default: NONE
      - name: appeal_window_days
        type: integer
        source: input
        description: days after a denial during which a drug-line appeal is accepted
        default: 60
        constraints: 1 <= value <= 365
      - name: status
        type: enum
        source: system
        description: "one of ACTIVE, INACTIVE"
        default: ACTIVE

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - name: brand_name
        type: string
        source: input
        description: product display name
        constraints: 1-120 chars
      - name: hcpcs_code
        type: string
        source: input
        description: HCPCS J-code billed on the drug line
        constraints: unique across Drug, 5-8 chars
      - name: vial_type
        type: enum
        source: input
        description: "one of SINGLE_DOSE (wastage is billable), MULTI_DOSE_COMPOUNDED (no wastage line)"
      - name: vial_fill_ml
        type: number
        source: input
        description: total volume in one vial as supplied
        constraints: "> 0, at most 3 decimal places"
      - name: label_dose_ml
        type: number
        source: input
        description: labelled intravitreal dose volume
        constraints: "> 0, <= vial_fill_ml, at most 3 decimal places"
      - name: mg_per_ml
        type: number
        source: input
        description: drug concentration used to convert volume to milligrams
        constraints: "> 0"
      - name: billing_unit_mg
        type: number
        source: input
        description: milligrams represented by one HCPCS billing unit
        constraints: "> 0"
      - name: asp_cents_per_billing_unit
        type: integer
        source: input
        description: published average sales price per billing unit, in cents; the standard-cost basis
        constraints: ">= 0"
      - name: min_interval_days
        type: integer
        source: input
        description: shortest safe gap between two injections of this drug in one eye
        constraints: ">= 1"
      - name: max_interval_days
        type: integer
        source: input
        description: longest treat-and-extend interval permitted for this drug
        constraints: ">= min_interval_days"
      - name: is_biosimilar
        type: boolean
        source: input
        description: true when this product is a biosimilar of another Drug
        default: false
      - name: reference_drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the reference product this biosimilar copies; null for reference products (self-referential)"
        default: null
      - name: status
        type: enum
        source: system
        description: "one of ACTIVE, INACTIVE"
        default: ACTIVE

  - name: PayerDrugPolicy
    parent: null
    common_fields: true
    fields:
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; payer side of the coverage pair"
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; drug side of the coverage pair"
      - name: coverage_tier
        type: enum
        source: input
        description: "one of PREFERRED, NON_PREFERRED, EXCLUDED"
      - name: drug_allowed_cents_per_billing_unit
        type: integer
        source: input
        description: contracted allowable per billing unit, in cents
        constraints: ">= 0"
      - name: admin_allowed_cents
        type: integer
        source: input
        description: contracted allowable for the administration CPT line, in cents
        constraints: ">= 0"
      - name: wastage_reimbursed
        type: boolean
        source: input
        description: whether the payer allows the JW wastage line
        default: false
      - name: pa_required
        type: boolean
        source: input
        description: prior authorization requirement for this payer/drug pair; overrides Payer.pa_required
        default: true
      - name: pa_validity_days
        type: integer
        source: input
        description: days an approved authorization stays effective
        default: 180
        constraints: 1 <= value <= 730
      - name: pa_max_injections
        type: integer
        source: input
        description: injections a single approved authorization may cover
        default: 3
        constraints: ">= 1"
      - name: step_therapy_prerequisite_drug_id
        type: string
        source: input
        description: "FK -> Drug.id; drug that must be documented as failed before this drug is authorized; null when no step therapy applies"
        default: null
      - name: required_prior_failures
        type: integer
        source: input
        description: number of documented failures of the prerequisite drug demanded by the payer
        default: 0
        constraints: ">= 0"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: practice medical record number
        constraints: unique across Patient, 4-24 chars
      - name: full_name
        type: string
        source: input
        description: patient display name
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the patient's current payer"
      - name: member_id
        type: string
        source: input
        description: payer-issued subscriber id
      - name: notification_channel
        type: enum
        source: input
        description: "recall-notification channel: one of SMS, EMAIL, PHONE"
        default: PHONE
      - name: contact_point
        type: string
        source: input
        description: phone number or email matching notification_channel
      - name: status
        type: enum
        source: system
        description: "one of ACTIVE, INACTIVE"
        default: ACTIVE

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: clinician display name
      - name: npi
        type: string
        source: input
        description: national provider identifier
        constraints: unique across Clinician, exactly 10 digits
      - name: credential
        type: enum
        source: input
        description: "one of MD, DO"
      - name: injection_privilege
        type: boolean
        source: input
        description: whether the practice has granted intravitreal injection privileges
        default: true
      - name: max_injections_per_day
        type: integer
        source: input
        description: aggregate injection capacity inside any closed 24-hour window
        default: 12
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "one of ACTIVE, SUSPENDED"
        default: ACTIVE
      - name: suspension_reason
        type: string
        source: system
        description: free-text reason captured when the clinician was suspended; null while ACTIVE
        default: null

  - name: ImagingStudy
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient imaged"
      - name: interpreted_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the acting RetinaSpecialist (X-User-ID) who interpreted the study"
      - name: eye
        type: enum
        source: input
        description: "laterality: one of OD, OS"
      - name: study_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC instant the OCT was captured
      - name: central_subfield_thickness_um
        type: integer
        source: input
        description: OCT central subfield thickness in micrometres
        constraints: 100 <= value <= 900
      - name: intraretinal_fluid
        type: boolean
        source: input
        description: intraretinal fluid present on OCT
      - name: subretinal_fluid
        type: boolean
        source: input
        description: subretinal fluid present on OCT
      - name: new_hemorrhage
        type: boolean
        source: input
        description: new haemorrhage seen on examination
      - name: va_letter_score
        type: integer
        source: input
        description: ETDRS letter score
        constraints: 0 <= value <= 100
      - name: disease_activity
        type: enum
        source: computed
        description: "ACTIVE or QUIESCENT, derived by calculations.disease_activity_classification; client input is ignored"

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient under treatment"
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the planned product before any biosimilar substitution"
      - name: eye
        type: enum
        source: input
        description: "one of OD, OS; one non-terminal plan per (patient_id, eye)"
      - name: loading_doses_required
        type: integer
        source: input
        description: injections that must be administered before the plan leaves LOADING
        default: 3
        constraints: 1 <= value <= 6
      - name: status
        type: enum
        source: system
        description: "one of DRAFT, LOADING, MAINTENANCE, INTENSIFIED, SUSPENDED, DISCONTINUED"
        default: DRAFT
      - name: baseline_imaging_study_id
        type: string
        source: input
        description: "FK -> ImagingStudy.id; the ACTIVE study that justified activation; null while DRAFT"
        default: null
      - name: current_interval_days
        type: integer
        source: computed
        description: current treat-and-extend interval, written by calculations.treat_and_extend_interval; null while DRAFT
        default: null
      - name: next_due_date
        type: datetime
        source: computed
        description: instant the next injection is due; null while DRAFT, SUSPENDED or DISCONTINUED
        default: null
      - name: injections_administered
        type: integer
        source: computed
        description: count of this plan's InjectionEncounters with status IN {DOCUMENTED, ATTESTED, BILLED, CLOSED}
        default: 0
      - name: consecutive_quiescent_visits
        type: integer
        source: computed
        description: run length of consecutive documented encounters whose imaging study was QUIESCENT; reset to 0 by an ACTIVE study
        default: 0
      - name: last_encounter_id
        type: string
        source: computed
        description: "FK -> InjectionEncounter.id; the plan's non-VOIDED encounter with the greatest encounter_datetime (tie-break: greatest created_at); null before the first"
        default: null
      - name: suspension_reason
        type: enum
        source: system
        description: "one of ADVERSE_EVENT, CLINICIAN_HOLD, LOT_RECALL, PATIENT_REQUEST; null unless SUSPENDED"
        default: null
      - name: discontinuation_reason
        type: string
        source: system
        description: free text captured at discontinuation; null otherwise
        default: null

  - name: DrugLot
    parent: null
    common_fields: true
    fields:
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; product this lot contains"
      - name: lot_number
        type: string
        source: input
        description: manufacturer lot number
        constraints: unique per drug_id, 3-24 chars
      - name: expiration_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the lot expires; a vial is ineligible once clock >= this instant
      - name: received_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the lot was received into inventory
      - name: unit_acquisition_cost_cents
        type: integer
        source: input
        description: buy-and-bill acquisition cost of one vial from this lot, in cents
        constraints: ">= 0"
      - name: vials_received
        type: integer
        source: input
        description: vials booked in at receipt; fixes the conserved vial count for this lot
        constraints: 1 <= value <= 500
      - name: vials_on_hand
        type: integer
        source: computed
        description: count of this lot's Vials with status IN_STOCK
      - name: vials_reserved
        type: integer
        source: computed
        description: count of this lot's Vials with status RESERVED
      - name: vials_administered
        type: integer
        source: computed
        description: count of this lot's Vials with status ADMINISTERED
      - name: vials_quarantined
        type: integer
        source: computed
        description: count of this lot's Vials with status QUARANTINED
      - name: vials_returned
        type: integer
        source: computed
        description: count of this lot's Vials with status RETURNED
      - name: vials_expired
        type: integer
        source: computed
        description: count of this lot's Vials with status EXPIRED
      - name: status
        type: enum
        source: system
        description: "one of AVAILABLE, QUARANTINED, RECALLED, EXPIRED"
        default: AVAILABLE
      - name: quarantine_reason
        type: string
        source: system
        description: reason captured when the lot moved to QUARANTINED; null otherwise
        default: null
      - name: carrying_cost_accrued_cents
        type: integer
        source: computed
        description: financing cost of unconsumed inventory, refreshed only by POST /inventory/expiration-sweep per calculations.lot_exposure
        default: 0
      - name: last_swept_at
        type: datetime
        source: computed
        description: logical-clock instant of the last expiration sweep that touched this lot; null before the first sweep
        default: null
      - name: related_endophthalmitis_count
        type: integer
        source: computed
        description: count of AdverseEvents with event_type ENDOPHTHALMITIS and status ADJUDICATED_RELATED whose source_drug_lot_id is this lot
        default: 0

  - name: Vial
    parent: null
    common_fields: true
    fields:
      - name: drug_lot_id
        type: string
        source: input
        description: "FK -> DrugLot.id; lot this vial belongs to"
      - name: serial_number
        type: string
        source: system
        description: "practice-minted vial label, formatted <lot_number>-<0-padded 3-digit sequence starting at 001 in creation order>"
      - name: status
        type: enum
        source: system
        description: "one of IN_STOCK, RESERVED, ADMINISTERED, QUARANTINED, RETURNED, EXPIRED"
        default: IN_STOCK
      - name: reserved_for_encounter_id
        type: string
        source: system
        description: "FK -> InjectionEncounter.id; the encounter that reserved and, once ADMINISTERED, consumed this vial; cleared to null when the reservation is released"
        default: null
      - name: reserved_at
        type: datetime
        source: system
        description: logical-clock instant of reservation; null when never reserved
        default: null
      - name: administered_at
        type: datetime
        source: system
        description: the consuming encounter's encounter_datetime; null unless ADMINISTERED
        default: null

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: "FK -> TreatmentPlan.id; plan this authorization covers"
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the plan at creation"
      - name: drug_id
        type: string
        source: computed
        description: "FK -> Drug.id; copied from the plan's drug_id at creation and never re-derived"
      - name: payer_id
        type: string
        source: computed
        description: "FK -> Payer.id; copied from the patient's payer_id at creation"
      - name: status
        type: enum
        source: system
        description: "one of DRAFT, SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, APPEALED, EXPIRED, EXHAUSTED"
        default: DRAFT
      - name: auth_number
        type: string
        source: input
        description: payer-issued authorization number recorded with an APPROVED decision; null otherwise
        default: null
      - name: approved_injections
        type: integer
        source: input
        description: injections the payer authorized; null until APPROVED
        default: null
      - name: injections_used
        type: integer
        source: computed
        description: count of non-VOIDED InjectionEncounters whose prior_authorization_id is this authorization
        default: 0
      - name: effective_date
        type: datetime
        source: input
        description: first instant the authorization covers; set with the APPROVED decision
        default: null
      - name: expiration_date
        type: datetime
        source: computed
        description: effective_date + PayerDrugPolicy.pa_validity_days; the authorization is usable while clock <= this instant
        default: null
      - name: clinical_justification
        type: string
        source: input
        description: narrative attached at submission
        default: null
      - name: information_requested
        type: string
        source: input
        description: payer's outstanding-information note captured with an INFO_REQUESTED decision
        default: null
      - name: denial_reason
        type: enum
        source: input
        description: "one of STEP_THERAPY, NOT_MEDICALLY_NECESSARY, NON_FORMULARY, INCOMPLETE_DOCUMENTATION; null unless denied"
        default: null
      - name: appeal_basis
        type: string
        source: input
        description: narrative attached when a denial is appealed
        default: null
      - name: submission_count
        type: integer
        source: computed
        description: number of times this authorization has entered SUBMITTED
        default: 0
      - name: step_therapy_failures_documented
        type: integer
        source: computed
        description: prerequisite-drug failures counted at submission time by calculations.step_therapy_failure_count
        default: 0

  - name: InjectionEncounter
    parent: null
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: "FK -> TreatmentPlan.id; plan this visit belongs to"
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the plan"
      - name: clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the acting RetinaSpecialist (X-User-ID) who created the encounter and injects"
      - name: imaging_study_id
        type: string
        source: input
        description: "FK -> ImagingStudy.id; the study that drove this treatment decision"
      - name: vial_id
        type: string
        source: computed
        description: "FK -> Vial.id; vial chosen by calculations.vial_selection; never client-supplied"
      - name: prior_authorization_id
        type: string
        source: computed
        description: "FK -> PriorAuthorization.id; authorization consumed by this encounter; null when the payer/drug pair needs none"
        default: null
      - name: previous_encounter_id
        type: string
        source: computed
        description: "FK -> InjectionEncounter.id; the plan's last_encounter_id at creation time; null for the first encounter of a plan (self-referential)"
        default: null
      - name: effective_drug_id
        type: string
        source: computed
        description: "FK -> Drug.id; the product actually injected after calculations.biosimilar_substitution"
      - name: substituted_from_drug_id
        type: string
        source: computed
        description: "FK -> Drug.id; the plan drug displaced by a biosimilar substitution; null when no substitution occurred"
        default: null
      - name: eye
        type: enum
        source: computed
        description: "OD or OS, copied from the plan"
      - name: encounter_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the injection
      - name: medical_necessity_override
        type: boolean
        source: input
        description: clinician's request to keep the reference product despite a MANDATORY biosimilar preference
        default: false
      - name: override_reason
        type: string
        source: input
        description: justification required whenever medical_necessity_override is true
        default: null
      - name: administered_dose_ml
        type: number
        source: input
        description: volume injected, supplied at documentation; null while DRAFT
        default: null
      - name: wasted_ml
        type: number
        source: computed
        description: "vial_fill_ml - administered_dose_ml for SINGLE_DOSE products, exactly 0 for MULTI_DOSE_COMPOUNDED; null while DRAFT"
        default: null
      - name: administered_billing_units
        type: integer
        source: computed
        description: billing units for the injected volume per calculations.billing_units_split
        default: null
      - name: wasted_billing_units
        type: integer
        source: computed
        description: billing units for the discarded volume per calculations.billing_units_split
        default: null
      - name: total_billed_billing_units
        type: integer
        source: computed
        description: administered_billing_units + wasted_billing_units
        default: null
      - name: modifiers
        type: array
        source: computed
        description: "ordered modifier list per calculations.modifier_assembly: [eye modifier, wastage modifier]"
        default: null
      - name: interval_days_from_previous
        type: integer
        source: computed
        description: whole days between previous_encounter_id's encounter_datetime and this one; null for the first encounter of a plan
        default: null
      - name: status
        type: enum
        source: system
        description: "one of DRAFT, DOCUMENTED, ATTESTED, BILLED, CLOSED, VOIDED"
        default: DRAFT
      - name: injection_site_prep_confirmed
        type: boolean
        source: input
        description: aseptic prep attestation captured at documentation
        default: null
      - name: post_injection_iop_mmhg
        type: integer
        source: input
        description: intraocular pressure recorded after injection
        default: null
      - name: attested_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the second clinician who attested wastage; null before attestation"
        default: null
      - name: void_reason
        type: string
        source: input
        description: reason recorded when the encounter is voided, including cascade-generated reasons
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: injection_encounter_id
        type: string
        source: input
        description: "FK -> InjectionEncounter.id; the billed encounter; at most one non-VOIDED Claim per encounter"
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the encounter"
      - name: payer_id
        type: string
        source: computed
        description: "FK -> Payer.id; copied from the patient at claim creation"
      - name: assistance_enrollment_id
        type: string
        source: computed
        description: "FK -> AssistanceEnrollment.id; enrollment selected by calculations.patient_responsibility_waterfall; null when none qualified"
        default: null
      - name: drug_line_status
        type: enum
        source: system
        description: "one of PENDING, SUBMITTED, PAID, DENIED, APPEALED, WRITTEN_OFF"
        default: PENDING
      - name: admin_line_status
        type: enum
        source: system
        description: "one of PENDING, SUBMITTED, PAID, DENIED"
        default: PENDING
      - name: hcpcs_code
        type: string
        source: computed
        description: copied from the encounter's effective drug hcpcs_code
      - name: administration_cpt_code
        type: string
        source: computed
        description: "always 67028 (intravitreal injection)"
      - name: modifiers
        type: array
        source: computed
        description: copied from the encounter's modifiers array at claim creation
      - name: billed_billing_units
        type: integer
        source: computed
        description: copied from the encounter's total_billed_billing_units
      - name: drug_billed_cents
        type: integer
        source: computed
        description: administered_billing_units * policy allowable per unit
      - name: wastage_billed_cents
        type: integer
        source: computed
        description: wasted_billing_units * policy allowable per unit, billed whether or not the payer reimburses it
      - name: admin_billed_cents
        type: integer
        source: computed
        description: policy admin_allowed_cents
      - name: drug_allowed_cents
        type: integer
        source: computed
        description: expected allowable at claim creation, replaced by the remitted allowable at remittance
      - name: wastage_allowed_cents
        type: integer
        source: computed
        description: 0 when the policy does not reimburse wastage; replaced by the remitted allowable at remittance
      - name: admin_allowed_cents
        type: integer
        source: computed
        description: expected admin allowable at claim creation, replaced by the remitted allowable at remittance
      - name: drug_paid_cents
        type: integer
        source: computed
        description: cents the payer paid on the drug line; 0 until a remittance posts
        default: 0
      - name: wastage_paid_cents
        type: integer
        source: computed
        description: cents the payer paid on the JW wastage line; 0 until a remittance posts
        default: 0
      - name: admin_paid_cents
        type: integer
        source: computed
        description: cents the payer paid on the administration line; 0 until a remittance posts
        default: 0
      - name: total_allowed_cents
        type: integer
        source: computed
        description: drug_allowed_cents + wastage_allowed_cents + admin_allowed_cents
      - name: coinsurance_cents
        type: integer
        source: computed
        description: round_half_up(total_allowed_cents * Payer.coinsurance_rate)
      - name: foundation_applied_cents
        type: integer
        source: computed
        description: assistance dollars applied per calculations.patient_responsibility_waterfall
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: coinsurance left after foundation support and small-balance write-off
        default: 0
      - name: practice_writeoff_cents
        type: integer
        source: computed
        description: cents the practice absorbs (small balance plus any payer shortfall)
        default: 0
      - name: standard_drug_cost_cents
        type: integer
        source: computed
        description: total_billed_billing_units * effective drug asp_cents_per_billing_unit
      - name: actual_acquisition_cost_cents
        type: integer
        source: computed
        description: unit_acquisition_cost_cents of the administered vial's lot; null until the claim reaches a terminal pair
        default: null
      - name: provisional_margin_cents
        type: integer
        source: computed
        description: ASP-basis margin written at claim creation by calculations.claim_margin variant provisional
      - name: realized_margin_cents
        type: integer
        source: computed
        description: actual-lot-cost margin written when both lines are terminal by calculations.claim_margin variant realized; null before then
        default: null
      - name: denial_code
        type: enum
        source: input
        description: "one of NOT_COVERED, AUTHORIZATION_MISSING, WASTAGE_NOT_PAYABLE, DUPLICATE_CLAIM; null unless a line was denied"
        default: null
      - name: appeal_basis
        type: string
        source: input
        description: narrative attached when the drug line is appealed
        default: null

  - name: AssistanceEnrollment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; enrolled patient"
      - name: program_type
        type: enum
        source: input
        description: "one of MANUFACTURER_COPAY_CARD, INDEPENDENT_FOUNDATION, FREE_DRUG_PAP"
      - name: status
        type: enum
        source: system
        description: "one of PENDING, ACTIVE, EXHAUSTED, EXPIRED, TERMINATED"
        default: PENDING
      - name: annual_benefit_cents
        type: integer
        source: input
        description: total benefit available for the enrollment year, in cents
        constraints: ">= 0"
      - name: per_encounter_cap_cents
        type: integer
        source: input
        description: high-tier cap applied to one encounter, in cents
        constraints: ">= 0"
      - name: benefit_used_cents
        type: integer
        source: computed
        description: sum of foundation_applied_cents across this enrollment's Claims
        default: 0
      - name: effective_date
        type: datetime
        source: input
        description: first instant the benefit covers
      - name: expiration_date
        type: datetime
        source: input
        description: last instant the benefit covers
      - name: termination_reason
        type: string
        source: input
        description: reason recorded at termination; null otherwise
        default: null

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: injection_encounter_id
        type: string
        source: input
        description: "FK -> InjectionEncounter.id; the suspected source encounter"
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the encounter"
      - name: reported_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the acting RetinaSpecialist (X-User-ID) who filed the report"
      - name: adjudicated_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the adjudicating RetinaSpecialist; null before adjudication"
        default: null
      - name: source_drug_lot_id
        type: string
        source: computed
        description: "FK -> DrugLot.id; lot of the encounter's administered vial, resolved at report time"
      - name: event_type
        type: enum
        source: input
        description: "one of ENDOPHTHALMITIS, IOP_SPIKE, RETINAL_DETACHMENT, INTRAOCULAR_INFLAMMATION"
      - name: onset_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC instant symptoms began
      - name: days_post_injection
        type: integer
        source: computed
        description: whole days from the encounter's encounter_datetime to onset_datetime
      - name: severity
        type: enum
        source: input
        description: "one of MILD, MODERATE, SEVERE"
      - name: culture_result
        type: enum
        source: input
        description: "one of PENDING, POSITIVE, NEGATIVE"
        default: PENDING
      - name: status
        type: enum
        source: system
        description: "one of REPORTED, UNDER_INVESTIGATION, ADJUDICATED_RELATED, ADJUDICATED_UNRELATED"
        default: REPORTED
      - name: reportable
        type: boolean
        source: computed
        description: written by calculations.adverse_event_reportability
        default: false
      - name: fda_report_due_date
        type: datetime
        source: computed
        description: reporting deadline written by calculations.adverse_event_reportability; null when not reportable
        default: null
      - name: adjudication_note
        type: string
        source: input
        description: narrative recorded at adjudication
        default: null

  - name: LotRecall
    parent: null
    common_fields: true
    fields:
      - name: drug_lot_id
        type: string
        source: input
        description: "FK -> DrugLot.id; recalled lot; at most one non-CLOSED recall per lot"
      - name: recall_class
        type: enum
        source: input
        description: "one of CLASS_I, CLASS_II, CLASS_III"
      - name: reason
        type: string
        source: input
        description: manufacturer or practice recall rationale
      - name: status
        type: enum
        source: system
        description: "one of INITIATED, PATIENTS_NOTIFIED, RETURN_SHIPPED, CREDIT_RECONCILED, CLOSED"
        default: INITIATED
      - name: initiated_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ComplianceOfficer who initiated the recall
      - name: closed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ComplianceOfficer who closed the recall; null before closure
        default: null
      - name: notification_deadline_date
        type: datetime
        source: computed
        description: initiation instant plus the class deadline from calculations.recall_notification_plan
      - name: notifications_required
        type: integer
        source: computed
        description: count of RecallNotifications generated for this recall
        default: 0
      - name: notifications_acknowledged
        type: integer
        source: computed
        description: count of this recall's RecallNotifications with status ACKNOWLEDGED
        default: 0
      - name: notifications_unreachable
        type: integer
        source: computed
        description: count of this recall's RecallNotifications with status UNREACHABLE
        default: 0
      - name: vials_returned_count
        type: integer
        source: computed
        description: count of the lot's Vials with status RETURNED
        default: 0
      - name: credit_expected_cents
        type: integer
        source: computed
        description: vials_returned_count * DrugLot.unit_acquisition_cost_cents, fixed when the return ships
        default: 0
      - name: credit_received_cents
        type: integer
        source: input
        description: manufacturer credit actually posted; null before reconciliation
        default: null
      - name: carrier_reference
        type: string
        source: input
        description: return shipment tracking reference
        default: null
      - name: closure_note
        type: string
        source: input
        description: narrative recorded at closure
        default: null

  - name: RecallNotification
    parent: null
    common_fields: true
    fields:
      - name: lot_recall_id
        type: string
        source: system
        description: "FK -> LotRecall.id; recall this notification belongs to"
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; patient who received a vial from the recalled lot"
      - name: injection_encounter_id
        type: string
        source: system
        description: "FK -> InjectionEncounter.id; the exposing encounter"
      - name: channel
        type: enum
        source: computed
        description: "one of SMS, EMAIL, PHONE, copied from Patient.notification_channel when the notification is generated"
      - name: status
        type: enum
        source: system
        description: "one of PENDING, SENT, ACKNOWLEDGED, UNREACHABLE"
        default: PENDING
      - name: sent_at
        type: datetime
        source: system
        description: logical-clock instant the notification was dispatched; null while PENDING
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant the patient acknowledged; null otherwise
        default: null
      - name: attempt_note
        type: string
        source: input
        description: outreach note recorded when the patient is marked unreachable
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- TreatmentPlan
  # Cyclic: MAINTENANCE <-> INTENSIFIED, and SUSPENDED -> MAINTENANCE.
  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: LOADING
        trigger: "POST /treatment-plans/{id}/activate"
        actor: RetinaSpecialist
        preconditions:
          - "plan.status == DRAFT"
          - "Patient.status == ACTIVE"
          - "Drug.status == ACTIVE"
          - "baseline_imaging_study_id resolves to an ImagingStudy with patient_id == plan.patient_id, eye == plan.eye and disease_activity == ACTIVE"
          - "the baseline study's study_datetime is within IMAGING_VALIDITY_DAYS (14) days at or before the logical clock"
        side_effects:
          - "sets baseline_imaging_study_id"
          - "sets current_interval_days = LOADING_INTERVAL_DAYS (28)"
          - "sets next_due_date = logical clock + 28 days"
          - "increments TreatmentPlan.version by 1"

      - from: LOADING
        to: MAINTENANCE
        trigger: "system, evaluated inside POST /injection-encounters/{id}/document once injections_administered reaches loading_doses_required"
        actor: system
        preconditions:
          - "plan.status == LOADING"
          - "plan.injections_administered (after this documentation) == plan.loading_doses_required"
        side_effects:
          - "recomputes current_interval_days and next_due_date via calculations.treat_and_extend_interval"
          - "updates consecutive_quiescent_visits per the documenting encounter's imaging disease_activity"
          - "sets last_encounter_id to the documenting encounter"
          - "increments TreatmentPlan.version by 1"

      - from: MAINTENANCE
        to: INTENSIFIED
        trigger: "system, inside POST /injection-encounters/{id}/document when the encounter's ImagingStudy.disease_activity == ACTIVE"
        actor: system
        preconditions:
          - "plan.status == MAINTENANCE"
          - "the documenting encounter's imaging study has disease_activity == ACTIVE"
        side_effects:
          - "shortens current_interval_days per calculations.treat_and_extend_interval variant reduction"
          - "resets consecutive_quiescent_visits to 0"
          - "sets next_due_date = encounter_datetime + current_interval_days days"
          - "sets last_encounter_id to the documenting encounter"
          - "increments TreatmentPlan.version by 1"

      - from: INTENSIFIED
        to: MAINTENANCE
        trigger: "system, inside POST /injection-encounters/{id}/document when the encounter's ImagingStudy.disease_activity == QUIESCENT"
        actor: system
        preconditions:
          - "plan.status == INTENSIFIED"
          - "the documenting encounter's imaging study has disease_activity == QUIESCENT"
        side_effects:
          - "extends current_interval_days per calculations.treat_and_extend_interval variant extension"
          - "increments consecutive_quiescent_visits by 1"
          - "sets next_due_date = encounter_datetime + current_interval_days days"
          - "sets last_encounter_id to the documenting encounter"
          - "increments TreatmentPlan.version by 1"
        note: "closes the MAINTENANCE <-> INTENSIFIED cycle; the plan can oscillate indefinitely"

      - from: MAINTENANCE
        to: MAINTENANCE
        trigger: "system, inside POST /injection-encounters/{id}/document when the plan is already MAINTENANCE and imaging is QUIESCENT"
        actor: system
        preconditions:
          - "plan.status == MAINTENANCE"
          - "the documenting encounter's imaging study has disease_activity == QUIESCENT"
        side_effects:
          - "extends current_interval_days per calculations.treat_and_extend_interval variant extension"
          - "increments consecutive_quiescent_visits by 1"
          - "sets next_due_date = encounter_datetime + current_interval_days days"
          - "sets last_encounter_id to the documenting encounter"
          - "increments TreatmentPlan.version by 1"

      - from: LOADING
        to: SUSPENDED
        trigger: "POST /treatment-plans/{id}/suspend"
        actor: RetinaSpecialist
        preconditions:
          - "plan.status IN {LOADING, MAINTENANCE, INTENSIFIED}"
        side_effects:
          - "sets suspension_reason from the request"
          - "sets next_due_date = null"
          - "releases every Vial with status RESERVED whose reserved_for_encounter_id points at a DRAFT encounter of this plan back to IN_STOCK, and voids those encounters with void_reason PLAN_SUSPENDED"
          - "recomputes injections_used on every PriorAuthorization that lost an encounter, returning EXHAUSTED authorizations to APPROVED"
          - "increments TreatmentPlan.version by 1"

      - from: MAINTENANCE
        to: SUSPENDED
        trigger: "POST /treatment-plans/{id}/suspend, or system cascade from POST /adverse-events/{id}/adjudicate with outcome RELATED"
        actor: RetinaSpecialist | system
        preconditions:
          - "plan.status IN {LOADING, MAINTENANCE, INTENSIFIED}"
        side_effects:
          - "sets suspension_reason (ADVERSE_EVENT when cascaded from adjudication)"
          - "sets next_due_date = null"
          - "releases RESERVED vials of this plan's DRAFT encounters back to IN_STOCK and voids those encounters"
          - "recomputes injections_used on the affected PriorAuthorizations, returning EXHAUSTED to APPROVED"
          - "increments TreatmentPlan.version by 1"

      - from: INTENSIFIED
        to: SUSPENDED
        trigger: "POST /treatment-plans/{id}/suspend, or system cascade from POST /adverse-events/{id}/adjudicate with outcome RELATED"
        actor: RetinaSpecialist | system
        preconditions:
          - "plan.status IN {LOADING, MAINTENANCE, INTENSIFIED}"
        side_effects:
          - "same side-effect set as MAINTENANCE -> SUSPENDED"
          - "increments TreatmentPlan.version by 1"

      - from: SUSPENDED
        to: MAINTENANCE
        trigger: "POST /treatment-plans/{id}/resume"
        actor: RetinaSpecialist
        preconditions:
          - "plan.status == SUSPENDED"
          - "no AdverseEvent linked to this plan's encounters has status IN {REPORTED, UNDER_INVESTIGATION}"
          - "the plan's drug (or its substitute) has at least one eligible vial per calculations.vial_selection, else the resume still succeeds but next_due_date is set anyway"
        side_effects:
          - "clears suspension_reason to null"
          - "sets next_due_date = logical clock + current_interval_days days"
          - "increments TreatmentPlan.version by 1"
        note: "closes the SUSPENDED cycle; a resumed plan always re-enters MAINTENANCE even if it was INTENSIFIED before suspension"

      - from: SUSPENDED
        to: DISCONTINUED
        trigger: "POST /treatment-plans/{id}/discontinue"
        actor: RetinaSpecialist
        preconditions:
          - "plan.status IN {DRAFT, LOADING, MAINTENANCE, INTENSIFIED, SUSPENDED}"
        side_effects:
          - "sets discontinuation_reason"
          - "sets next_due_date = null"
          - "releases RESERVED vials of this plan's DRAFT encounters and voids those encounters"
          - "increments TreatmentPlan.version by 1"

      - from: MAINTENANCE
        to: DISCONTINUED
        trigger: "POST /treatment-plans/{id}/discontinue"
        actor: RetinaSpecialist
        preconditions:
          - "plan.status IN {DRAFT, LOADING, MAINTENANCE, INTENSIFIED, SUSPENDED}"
        side_effects:
          - "same side-effect set as SUSPENDED -> DISCONTINUED"
          - "increments TreatmentPlan.version by 1"

  # ---------------------------------------------------------- PriorAuthorization
  # Cyclic: SUBMITTED <-> INFO_REQUESTED and DENIED -> APPEALED -> APPROVED|DENIED.
  - entity: PriorAuthorization
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /prior-authorizations/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {DRAFT, INFO_REQUESTED}"
          - "the PayerDrugPolicy for (pa.payer_id, pa.drug_id) exists and coverage_tier != EXCLUDED"
          - "calculations.step_therapy_failure_count >= policy.required_prior_failures"
        side_effects:
          - "stores clinical_justification"
          - "writes step_therapy_failures_documented from calculations.step_therapy_failure_count"
          - "increments submission_count by 1"

      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /prior-authorizations/{id}/decision with decision INFO_REQUESTED"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {SUBMITTED, APPEALED}"
        side_effects:
          - "stores information_requested"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /prior-authorizations/{id}/submit (resubmission)"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {DRAFT, INFO_REQUESTED}"
          - "calculations.step_therapy_failure_count >= policy.required_prior_failures"
        side_effects:
          - "replaces clinical_justification"
          - "clears information_requested to null"
          - "recomputes step_therapy_failures_documented"
          - "increments submission_count by 1"
        note: "closes the SUBMITTED <-> INFO_REQUESTED cycle"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/decision with decision APPROVED"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {SUBMITTED, APPEALED}"
          - "request carries auth_number, approved_injections and effective_date"
          - "approved_injections <= PayerDrugPolicy.pa_max_injections for (pa.payer_id, pa.drug_id)"
          - "the closed interval [effective_date, effective_date + policy.pa_validity_days days] does not overlap the same interval of another PriorAuthorization on this treatment_plan_id whose status IN {APPROVED, EXHAUSTED}"
        side_effects:
          - "stores auth_number, approved_injections, effective_date"
          - "computes expiration_date = effective_date + policy.pa_validity_days days"
          - "clears denial_reason to null"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/decision with decision DENIED"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {SUBMITTED, APPEALED}"
          - "request carries denial_reason"
        side_effects:
          - "stores denial_reason"
          - "leaves approved_injections null"

      - from: DENIED
        to: APPEALED
        trigger: "POST /prior-authorizations/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "pa.status == DENIED"
          - "logical clock <= pa.updated_at + Payer.appeal_window_days days"
        side_effects:
          - "stores appeal_basis"

      - from: APPEALED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/decision with decision APPROVED"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {SUBMITTED, APPEALED}"
          - "approved_injections <= policy.pa_max_injections"
        side_effects:
          - "stores auth_number, approved_injections, effective_date and computes expiration_date"
          - "clears denial_reason to null"
        note: "closes the DENIED -> APPEALED -> APPROVED cycle"

      - from: APPEALED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/decision with decision DENIED"
        actor: BillingSpecialist
        preconditions:
          - "pa.status IN {SUBMITTED, APPEALED}"
        side_effects:
          - "replaces denial_reason"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system, inside POST /injection-encounters once injections_used reaches approved_injections"
        actor: system
        preconditions:
          - "pa.status == APPROVED"
          - "pa.injections_used (after this encounter) == pa.approved_injections"
        side_effects:
          - "no field other than status and updated_at changes"

      - from: EXHAUSTED
        to: APPROVED
        trigger: "system, when an encounter consuming this authorization is voided (POST /injection-encounters/{id}/void or a cascade)"
        actor: system
        preconditions:
          - "pa.status == EXHAUSTED"
          - "pa.injections_used (after the void) < pa.approved_injections"
          - "logical clock <= pa.expiration_date"
        side_effects:
          - "recomputes injections_used"
        note: "compensating transition that restores authorization capacity"

      - from: APPROVED
        to: EXPIRED
        trigger: "system, lazily evaluated at POST /injection-encounters when logical clock > pa.expiration_date"
        actor: system
        preconditions:
          - "pa.status IN {APPROVED, EXHAUSTED}"
          - "logical clock > pa.expiration_date"
        side_effects:
          - "the triggering encounter creation is rejected with ERR_AUTHORIZATION_EXPIRED after the status flip is persisted"

      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system, lazily evaluated at POST /injection-encounters when logical clock > pa.expiration_date"
        actor: system
        preconditions:
          - "pa.status IN {APPROVED, EXHAUSTED}"
          - "logical clock > pa.expiration_date"
        side_effects:
          - "the triggering encounter creation is rejected with ERR_AUTHORIZATION_EXPIRED after the status flip is persisted"

  # ------------------------------------------------------- InjectionEncounter
  - entity: InjectionEncounter
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /injection-encounters/{id}/document"
        actor: RetinaSpecialist
        preconditions:
          - "encounter.status == DRAFT"
          - "acting X-User-ID == encounter.clinician_id"
          - "the reserved Vial's DrugLot.status == AVAILABLE"
          - "0 < administered_dose_ml <= effective Drug.vial_fill_ml"
          - "injection_site_prep_confirmed == true"
        side_effects:
          - "writes wasted_ml, administered_billing_units, wasted_billing_units, total_billed_billing_units per calculations.billing_units_split"
          - "writes modifiers per calculations.modifier_assembly"
          - "moves the reserved Vial RESERVED -> ADMINISTERED and stamps Vial.administered_at = encounter_datetime"
          - "recomputes the Vial's DrugLot counters (vials_reserved, vials_administered)"
          - "increments TreatmentPlan.injections_administered and advances the plan through calculations.treat_and_extend_interval"

      - from: DOCUMENTED
        to: ATTESTED
        trigger: "POST /injection-encounters/{id}/attest-wastage"
        actor: RetinaSpecialist
        preconditions:
          - "encounter.status == DOCUMENTED"
          - "acting X-User-ID != encounter.clinician_id (segregation of duties)"
          - "the acting Clinician has status ACTIVE"
          - "attested_wasted_ml equals encounter.wasted_ml to 3 decimal places"
        side_effects:
          - "sets attested_by_clinician_id to the acting clinician"

      - from: ATTESTED
        to: BILLED
        trigger: "system, inside POST /claims when a Claim is created for this encounter"
        actor: system
        preconditions:
          - "encounter.status == ATTESTED"
        side_effects:
          - "no encounter field other than status and updated_at changes"

      - from: BILLED
        to: CLOSED
        trigger: "system, inside POST /claims/{id}/remittance once drug_line_status IN {PAID, WRITTEN_OFF} and admin_line_status IN {PAID, DENIED}"
        actor: system
        preconditions:
          - "encounter.status == BILLED"
          - "the claim's two line dimensions are both terminal"
        side_effects:
          - "no encounter field other than status and updated_at changes"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /injection-encounters/{id}/void, or a system cascade from plan suspension, plan discontinuation or lot recall"
        actor: RetinaSpecialist | system
        preconditions:
          - "encounter.status IN {DRAFT, DOCUMENTED}"
        side_effects:
          - "stores void_reason"
          - "releases the reserved Vial RESERVED -> IN_STOCK, clearing reserved_for_encounter_id and reserved_at"
          - "recomputes the Vial's DrugLot counters"
          - "recomputes PriorAuthorization.injections_used, flipping EXHAUSTED -> APPROVED when capacity is freed"

      - from: DOCUMENTED
        to: VOIDED
        trigger: "POST /injection-encounters/{id}/void"
        actor: RetinaSpecialist
        preconditions:
          - "encounter.status IN {DRAFT, DOCUMENTED}"
          - "no Claim exists for this encounter"
        side_effects:
          - "stores void_reason"
          - "the ADMINISTERED Vial is NOT returned to stock; it moves ADMINISTERED -> QUARANTINED so the conserved vial count is preserved"
          - "recomputes the Vial's DrugLot counters"
          - "decrements TreatmentPlan.injections_administered and re-derives last_encounter_id, current_interval_days and next_due_date from the plan's remaining non-VOIDED encounters in encounter_datetime order"
          - "recomputes PriorAuthorization.injections_used, flipping EXHAUSTED -> APPROVED when capacity is freed"

  # -------------------------------------------------------------------- Vial
  # Branching with revert: RESERVED -> IN_STOCK is the compensating edge.
  - entity: Vial
    initial_state: IN_STOCK
    terminal_states: [ADMINISTERED, RETURNED, EXPIRED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "system, inside POST /injection-encounters when calculations.vial_selection picks this vial"
        actor: system
        preconditions:
          - "vial.status == IN_STOCK"
          - "the vial's DrugLot.status == AVAILABLE"
          - "the vial's DrugLot.expiration_date > logical clock"
        side_effects:
          - "sets reserved_for_encounter_id and reserved_at (logical clock)"
          - "recomputes DrugLot.vials_on_hand and DrugLot.vials_reserved"

      - from: RESERVED
        to: ADMINISTERED
        trigger: "system, inside POST /injection-encounters/{id}/document"
        actor: system
        preconditions:
          - "vial.status == RESERVED"
          - "the vial's DrugLot.status == AVAILABLE"
        side_effects:
          - "stamps administered_at = encounter.encounter_datetime"
          - "recomputes DrugLot.vials_reserved and DrugLot.vials_administered"

      - from: RESERVED
        to: IN_STOCK
        trigger: "system, inside POST /injection-encounters/{id}/void or a cascade that voids a DRAFT encounter"
        actor: system
        preconditions:
          - "vial.status == RESERVED"
        side_effects:
          - "clears reserved_for_encounter_id and reserved_at to null"
          - "recomputes DrugLot.vials_on_hand and DrugLot.vials_reserved"
        note: "compensating edge that keeps DrugLot.vials_received conserved"

      - from: IN_STOCK
        to: QUARANTINED
        trigger: "system, inside POST /drug-lots/{id}/quarantine, POST /lot-recalls, or the AdverseEvent cluster cascade"
        actor: system
        preconditions:
          - "vial.status == IN_STOCK"
        side_effects:
          - "recomputes DrugLot.vials_on_hand and DrugLot.vials_quarantined"

      - from: RESERVED
        to: QUARANTINED
        trigger: "system, inside POST /lot-recalls"
        actor: system
        preconditions:
          - "vial.status == RESERVED"
        side_effects:
          - "voids the DRAFT encounter holding the reservation with void_reason LOT_RECALLED and clears reserved_for_encounter_id"
          - "recomputes DrugLot.vials_reserved and DrugLot.vials_quarantined"

      - from: ADMINISTERED
        to: QUARANTINED
        trigger: "system, inside POST /injection-encounters/{id}/void from DOCUMENTED"
        actor: system
        preconditions:
          - "vial.status == ADMINISTERED"
          - "the consuming encounter is being voided from DOCUMENTED"
        side_effects:
          - "recomputes DrugLot.vials_administered and DrugLot.vials_quarantined"

      - from: QUARANTINED
        to: IN_STOCK
        trigger: "system, inside POST /drug-lots/{id}/release"
        actor: system
        preconditions:
          - "vial.status == QUARANTINED"
          - "the vial's DrugLot.status == QUARANTINED and no non-CLOSED LotRecall exists for that lot"
          - "reserved_for_encounter_id == null"
        side_effects:
          - "recomputes DrugLot.vials_on_hand and DrugLot.vials_quarantined"

      - from: QUARANTINED
        to: RETURNED
        trigger: "system, inside POST /lot-recalls/{id}/ship-return"
        actor: system
        preconditions:
          - "vial.status == QUARANTINED"
          - "the vial's DrugLot.status == RECALLED"
        side_effects:
          - "recomputes DrugLot.vials_quarantined and DrugLot.vials_returned"
          - "recomputes LotRecall.vials_returned_count and LotRecall.credit_expected_cents"

      - from: IN_STOCK
        to: EXPIRED
        trigger: "system, inside POST /inventory/expiration-sweep"
        actor: system
        preconditions:
          - "vial.status == IN_STOCK"
          - "the vial's DrugLot.expiration_date <= logical clock"
        side_effects:
          - "recomputes DrugLot.vials_on_hand and DrugLot.vials_expired"

  # ----------------------------------------------------------------- DrugLot
  - entity: DrugLot
    initial_state: AVAILABLE
    terminal_states: [RECALLED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /drug-lots/{id}/quarantine, or a system cascade when related_endophthalmitis_count reaches LOT_CLUSTER_THRESHOLD (2)"
        actor: PharmacyTech | system
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects:
          - "stores quarantine_reason"
          - "moves every IN_STOCK Vial of this lot to QUARANTINED"
          - "recomputes vials_on_hand and vials_quarantined"
          - "increments DrugLot.version by 1"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /drug-lots/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "lot.status == QUARANTINED"
          - "no LotRecall on this lot has status != CLOSED"
          - "lot.expiration_date > logical clock"
        side_effects:
          - "clears quarantine_reason to null"
          - "moves every QUARANTINED Vial with reserved_for_encounter_id == null back to IN_STOCK"
          - "recomputes vials_on_hand and vials_quarantined"
          - "increments DrugLot.version by 1"

      - from: AVAILABLE
        to: RECALLED
        trigger: "system, inside POST /lot-recalls"
        actor: system
        preconditions:
          - "lot.status IN {AVAILABLE, QUARANTINED}"
        side_effects:
          - "moves every Vial with status IN_STOCK or RESERVED to QUARANTINED (voiding DRAFT encounters that held reservations)"
          - "generates RecallNotification rows per calculations.recall_notification_plan"
          - "increments DrugLot.version by 1"

      - from: QUARANTINED
        to: RECALLED
        trigger: "system, inside POST /lot-recalls"
        actor: system
        preconditions:
          - "lot.status IN {AVAILABLE, QUARANTINED}"
        side_effects:
          - "same side-effect set as AVAILABLE -> RECALLED"
          - "increments DrugLot.version by 1"

      - from: AVAILABLE
        to: EXPIRED
        trigger: "system, inside POST /inventory/expiration-sweep"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "lot.expiration_date <= logical clock"
        side_effects:
          - "moves every IN_STOCK Vial of this lot to EXPIRED"
          - "refreshes carrying_cost_accrued_cents and last_swept_at"
          - "increments DrugLot.version by 1"

  # ------------------------------------------------------- Claim (drug line axis)
  # Parallel dimension 1 of 2 on the same row.
  - entity: Claim
    dimension: drug_line_status
    initial_state: PENDING
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status == PENDING"
        side_effects:
          - "advances admin_line_status PENDING -> SUBMITTED in the same request"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{id}/remittance with drug_line_outcome PAID"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status IN {SUBMITTED, APPEALED}"
          - "request carries drug_allowed_cents and drug_paid_cents"
        side_effects:
          - "stores drug_allowed_cents, drug_paid_cents, wastage_allowed_cents, wastage_paid_cents"
          - "re-runs calculations.patient_responsibility_waterfall on remitted allowables"
          - "writes realized_margin_cents once admin_line_status is also terminal"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/remittance with drug_line_outcome DENIED"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status IN {SUBMITTED, APPEALED}"
          - "request carries denial_code"
        side_effects:
          - "sets drug_paid_cents = 0 and wastage_paid_cents = 0"
          - "stores denial_code"
          - "re-runs calculations.patient_responsibility_waterfall, pushing the payer shortfall into practice_writeoff_cents"

      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal-drug-line"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status == DENIED"
          - "logical clock <= claim.updated_at + Payer.appeal_window_days days"
        side_effects:
          - "stores appeal_basis"

      - from: APPEALED
        to: PAID
        trigger: "POST /claims/{id}/remittance with drug_line_outcome PAID"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status IN {SUBMITTED, APPEALED}"
        side_effects:
          - "stores the remitted amounts and re-runs the waterfall, unwinding the shortfall previously parked in practice_writeoff_cents"
        note: "compensating edge for the money-conservation invariant"

      - from: DENIED
        to: WRITTEN_OFF
        trigger: "POST /claims/{id}/remittance with drug_line_outcome WRITTEN_OFF"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status IN {DENIED, APPEALED}"
        side_effects:
          - "leaves drug_paid_cents at 0 and keeps the shortfall in practice_writeoff_cents"

      - from: APPEALED
        to: WRITTEN_OFF
        trigger: "POST /claims/{id}/remittance with drug_line_outcome WRITTEN_OFF"
        actor: BillingSpecialist
        preconditions:
          - "claim.drug_line_status IN {DENIED, APPEALED}"
        side_effects:
          - "leaves drug_paid_cents at 0 and keeps the shortfall in practice_writeoff_cents"

  # ------------------------------------------------ Claim (administration axis)
  # Parallel dimension 2 of 2; advances independently of drug_line_status.
  - entity: Claim
    dimension: admin_line_status
    initial_state: PENDING
    terminal_states: [PAID, DENIED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim.admin_line_status == PENDING"
        side_effects:
          - "no independent side effect; both dimensions leave PENDING together"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{id}/remittance with admin_line_outcome PAID"
        actor: BillingSpecialist
        preconditions:
          - "claim.admin_line_status == SUBMITTED"
          - "request carries admin_allowed_cents and admin_paid_cents"
        side_effects:
          - "stores admin_allowed_cents and admin_paid_cents"
          - "closes the encounter only when drug_line_status is also terminal"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/remittance with admin_line_outcome DENIED"
        actor: BillingSpecialist
        preconditions:
          - "claim.admin_line_status == SUBMITTED"
        side_effects:
          - "sets admin_paid_cents = 0 and stores denial_code"
          - "closes the encounter only when drug_line_status is also terminal"
        note: "the administration line has no appeal edge; DENIED is terminal on this axis while the drug axis may still be APPEALED"

  # ----------------------------------------------------------- AdverseEvent
  # Branching fork: one investigation splits into two outcomes with divergent
  # side-effect sets.
  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [ADJUDICATED_RELATED, ADJUDICATED_UNRELATED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /adverse-events/{id}/start-investigation"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == REPORTED"
        side_effects:
          - "no field other than status and updated_at changes"

      - from: UNDER_INVESTIGATION
        to: ADJUDICATED_RELATED
        trigger: "POST /adverse-events/{id}/adjudicate with outcome RELATED"
        actor: RetinaSpecialist
        preconditions:
          - "event.status == UNDER_INVESTIGATION"
          - "acting X-User-ID != the source encounter's clinician_id"
        side_effects:
          - "sets adjudicated_by_clinician_id and adjudication_note"
          - "recomputes reportable and fda_report_due_date via calculations.adverse_event_reportability"
          - "hop 2: because the event became ADJUDICATED_RELATED, the source encounter's TreatmentPlan moves to SUSPENDED with suspension_reason ADVERSE_EVENT and next_due_date = null"
          - "hop 3: because that plan became SUSPENDED, every Vial RESERVED for one of the plan's DRAFT encounters returns to IN_STOCK and those encounters move to VOIDED with void_reason PLAN_SUSPENDED"
          - "hop 4: because those encounters became VOIDED, PriorAuthorization.injections_used is recomputed and any EXHAUSTED authorization on the plan returns to APPROVED"
          - "conditional hop: when event_type == ENDOPHTHALMITIS, source_drug_lot_id.related_endophthalmitis_count is incremented and, if it reaches LOT_CLUSTER_THRESHOLD (2), that DrugLot moves AVAILABLE -> QUARANTINED which in turn moves all its IN_STOCK vials to QUARANTINED"

      - from: UNDER_INVESTIGATION
        to: ADJUDICATED_UNRELATED
        trigger: "POST /adverse-events/{id}/adjudicate with outcome UNRELATED"
        actor: RetinaSpecialist
        preconditions:
          - "event.status == UNDER_INVESTIGATION"
          - "acting X-User-ID != the source encounter's clinician_id"
        side_effects:
          - "sets adjudicated_by_clinician_id and adjudication_note"
          - "recomputes reportable and fda_report_due_date"
          - "the TreatmentPlan is left untouched, no vial is released, no authorization is recomputed and related_endophthalmitis_count is not incremented"
        note: "divergent branch: the RELATED edge fires a four-hop cascade, the UNRELATED edge fires none"

  # --------------------------------------------------------------- LotRecall
  - entity: LotRecall
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: PATIENTS_NOTIFIED
        trigger: "POST /lot-recalls/{id}/send-notifications"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == INITIATED"
        side_effects:
          - "moves every PENDING RecallNotification of this recall to SENT with sent_at = logical clock"

      - from: PATIENTS_NOTIFIED
        to: RETURN_SHIPPED
        trigger: "POST /lot-recalls/{id}/ship-return"
        actor: PharmacyTech
        preconditions:
          - "recall.status == PATIENTS_NOTIFIED"
          - "the lot has at least one QUARANTINED vial"
        side_effects:
          - "moves every QUARANTINED Vial of the lot to RETURNED"
          - "stores carrier_reference"
          - "recomputes vials_returned_count and freezes credit_expected_cents = vials_returned_count * DrugLot.unit_acquisition_cost_cents"

      - from: RETURN_SHIPPED
        to: CREDIT_RECONCILED
        trigger: "POST /lot-recalls/{id}/reconcile-credit"
        actor: BillingSpecialist
        preconditions:
          - "recall.status == RETURN_SHIPPED"
          - "credit_received_cents <= credit_expected_cents"
        side_effects:
          - "stores credit_received_cents"

      - from: CREDIT_RECONCILED
        to: CLOSED
        trigger: "POST /lot-recalls/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == CREDIT_RECONCILED"
          - "notifications_acknowledged + notifications_unreachable == notifications_required"
          - "acting X-User-ID != recall.initiated_by_user_id (segregation of duties)"
        side_effects:
          - "stores closure_note and closed_by_user_id"

  # ------------------------------------------------------ RecallNotification
  - entity: RecallNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, UNREACHABLE]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "system, inside POST /lot-recalls/{id}/send-notifications"
        actor: system
        preconditions:
          - "notification.status == PENDING"
        side_effects:
          - "sets sent_at = logical clock"

      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /recall-notifications/{id}/acknowledge"
        actor: Patient
        preconditions:
          - "notification.status == SENT"
          - "acting X-User-ID == notification.patient_id"
        side_effects:
          - "sets acknowledged_at = logical clock"
          - "increments LotRecall.notifications_acknowledged"

      - from: SENT
        to: UNREACHABLE
        trigger: "POST /recall-notifications/{id}/mark-unreachable"
        actor: ComplianceOfficer
        preconditions:
          - "notification.status == SENT"
        side_effects:
          - "stores attempt_note"
          - "increments LotRecall.notifications_unreachable"

  # --------------------------------------------------- AssistanceEnrollment
  - entity: AssistanceEnrollment
    initial_state: PENDING
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /assistance-enrollments/{id}/approve"
        actor: BillingSpecialist
        preconditions:
          - "enrollment.status == PENDING"
          - "no other AssistanceEnrollment for this patient_id has status ACTIVE"
        side_effects:
          - "no field other than status and updated_at changes"

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system, inside POST /claims or POST /claims/{id}/remittance once benefit_used_cents reaches annual_benefit_cents"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE"
          - "benefit_used_cents (after the waterfall) >= annual_benefit_cents"
        side_effects:
          - "no further foundation dollars are applied while EXHAUSTED"

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system, inside POST /claims/{id}/remittance when a re-run of the waterfall lowers benefit_used_cents below annual_benefit_cents"
        actor: system
        preconditions:
          - "enrollment.status == EXHAUSTED"
          - "benefit_used_cents (after the re-run) < annual_benefit_cents"
        side_effects:
          - "no field other than status and updated_at changes"
        note: "compensating transition restoring benefit capacity"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system, lazily evaluated at POST /claims when logical clock > enrollment.expiration_date"
        actor: system
        preconditions:
          - "enrollment.status IN {PENDING, ACTIVE}"
          - "logical clock > enrollment.expiration_date"
        side_effects:
          - "the claim's waterfall proceeds with foundation_applied_cents = 0"

      - from: "PENDING | ACTIVE | EXHAUSTED"
        to: TERMINATED
        trigger: "POST /assistance-enrollments/{id}/terminate"
        actor: BillingSpecialist
        preconditions:
          - "enrollment.status IN {PENDING, ACTIVE, EXHAUSTED}"
        side_effects:
          - "stores termination_reason"

  # ---------------------------------------------------------------- Clinician
  - entity: Clinician
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clinicians/{id}/suspend"
        actor: PracticeAdmin
        preconditions:
          - "clinician.status == ACTIVE"
        side_effects:
          - "stores suspension_reason"
          - "does NOT void the clinician's existing encounters"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on TreatmentPlan.version only
# =============================================================================
concurrency_rules:
  - rule_id: encounter-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /injection-encounters"
    occ_field: "expected_treatment_plan_version"
    description: |
      Creating an InjectionEncounter against a TreatmentPlan whose version has
      advanced past the value the client last observed is rejected. Encounter
      creation legitimately mutates the plan (last_encounter_id, interval,
      next_due_date, version), so a client holding an older plan snapshot is
      reasoning about a superseded interval schedule; the stale-version check
      rejects it before any vial is reserved.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: pa-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /prior-authorizations"
    occ_field: "expected_treatment_plan_version"
    description: |
      Creating a PriorAuthorization supersedes the plan's prior authorization
      record for renewal purposes, so a create whose expected_treatment_plan_version
      is behind the plan's current version is rejected: the requester has not
      observed the authorization that already superseded theirs.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: disease_activity_classification
    trigger: "POST /imaging-studies (writes ImagingStudy.disease_activity)"
    algorithm: threshold
    formula: |
      disease_activity =
        ACTIVE   if central_subfield_thickness_um >= CST_ACTIVE_THRESHOLD_UM
                 or intraretinal_fluid == true
                 or subretinal_fluid == true
                 or new_hemorrhage == true
        QUIESCENT otherwise
      # Boundary is inclusive on the threshold: 299 um with no fluid and no
      # hemorrhage is QUIESCENT, 300 um with no fluid is ACTIVE.
    input_set: "the single ImagingStudy being created; no other row participates"
    constants:
      CST_ACTIVE_THRESHOLD_UM: 300
    precision: "integer micrometres, no rounding"

  - name: treat_and_extend_interval
    trigger: "POST /injection-encounters/{id}/document (side effect on the encounter's TreatmentPlan)"
    algorithm: constraint_propagation
    formula: |
      # Step 1 — count the dose just documented.
      injections_after = plan.injections_administered + 1
      activity          = ImagingStudy[encounter.imaging_study_id].disease_activity
      drug              = Drug[encounter.effective_drug_id]
      quiescent_run_in  = plan.consecutive_quiescent_visits     # value BEFORE this visit

      # Step 2 — pick exactly one branch, in this order.
      if injections_after < plan.loading_doses_required:
          new_interval = LOADING_INTERVAL_DAYS
          new_run      = (quiescent_run_in + 1) if activity == QUIESCENT else 0
      elif activity == QUIESCENT:
          step = EXTENSION_STEP_DAYS * 2 if quiescent_run_in >= QUIESCENT_RUN_FOR_DOUBLE_STEP
                 else EXTENSION_STEP_DAYS
          new_interval = min(plan.current_interval_days + step, drug.max_interval_days)
          new_run      = quiescent_run_in + 1
      else:   # activity == ACTIVE
          new_interval = max(plan.current_interval_days - REDUCTION_STEP_DAYS, drug.min_interval_days)
          new_run      = 0

      # Step 3 — publish.
      plan.current_interval_days         = new_interval
      plan.consecutive_quiescent_visits  = new_run
      plan.next_due_date                 = encounter.encounter_datetime + new_interval days
      plan.injections_administered       = injections_after
      plan.last_encounter_id             = encounter.id
    input_set: |
      Exactly one ImagingStudy (encounter.imaging_study_id) and the plan's own
      counters. plan.injections_administered counts this plan's InjectionEncounters
      with status IN {DOCUMENTED, ATTESTED, BILLED, CLOSED}; VOIDED encounters are
      excluded and a void re-derives the counters from the surviving encounters in
      encounter_datetime ASC order (tie-break created_at ASC).
    constants:
      LOADING_INTERVAL_DAYS: 28
      EXTENSION_STEP_DAYS: 14
      REDUCTION_STEP_DAYS: 14
      QUIESCENT_RUN_FOR_DOUBLE_STEP: 3
    precision: "whole days; next_due_date keeps the encounter_datetime time-of-day"
    variants:
      - name: extension
        when: "the loading course is complete and the driving study is QUIESCENT"
        difference: "interval grows by EXTENSION_STEP_DAYS (doubled once quiescent_run_in >= 3) and is clamped by drug.max_interval_days"
      - name: reduction
        when: "the loading course is complete and the driving study is ACTIVE"
        difference: "interval shrinks by REDUCTION_STEP_DAYS, clamped below by drug.min_interval_days, and the quiescent run resets to 0"
      - name: loading
        when: "injections_after < plan.loading_doses_required"
        difference: "interval is pinned to LOADING_INTERVAL_DAYS regardless of imaging activity, but the quiescent run still accumulates"

  - name: biosimilar_substitution
    trigger: "POST /injection-encounters (writes effective_drug_id and substituted_from_drug_id)"
    algorithm: selector_policy
    formula: |
      plan_drug = Drug[plan.drug_id]
      payer     = Payer[patient.payer_id]

      # (a) eligibility filter — candidate biosimilars
      candidates = { d in Drug :
                       d.reference_drug_id == plan_drug.id
                       and d.status == ACTIVE
                       and exists PayerDrugPolicy p where p.payer_id == payer.id
                                   and p.drug_id == d.id
                                   and p.coverage_tier == PREFERRED }
      # (b) ranking expression
      order candidates by PayerDrugPolicy(payer, d).drug_allowed_cents_per_billing_unit ASC
      # (c) tie-break
      then by d.created_at ASC          # never by d.id
      # (d) empty-pool fallback
      chosen = first(candidates) or NONE

      if encounter.medical_necessity_override == true:
          effective_drug_id       = plan_drug.id
          substituted_from_drug_id = null
      elif plan_drug.is_biosimilar == true or chosen == NONE:
          effective_drug_id       = plan_drug.id
          substituted_from_drug_id = null
      elif payer.biosimilar_preference == MANDATORY:
          effective_drug_id       = chosen.id
          substituted_from_drug_id = plan_drug.id
      elif payer.biosimilar_preference == PREFERRED
           and PayerDrugPolicy(payer, plan_drug).coverage_tier == NON_PREFERRED:
          effective_drug_id       = chosen.id
          substituted_from_drug_id = plan_drug.id
      else:
          effective_drug_id       = plan_drug.id
          substituted_from_drug_id = null
    input_set: "Drug rows with status ACTIVE only; PayerDrugPolicy rows for the patient's payer only"
    constants: {}
    precision: "not numeric"

  - name: vial_selection
    trigger: "POST /injection-encounters (writes InjectionEncounter.vial_id and reserves the vial)"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter
      pool = { v in Vial :
                 v.status == IN_STOCK
                 and DrugLot[v.drug_lot_id].status == AVAILABLE
                 and DrugLot[v.drug_lot_id].drug_id == encounter.effective_drug_id
                 and DrugLot[v.drug_lot_id].expiration_date > logical_clock }
      # (b) ranking expression — first-expiring-first-out
      order pool by DrugLot.expiration_date ASC
      # (c) tie-breaks, in order
      then by DrugLot.unit_acquisition_cost_cents DESC   # burn the dearest capital first
      then by Vial.created_at ASC                        # never by Vial.id
      # (d) empty-pool fallback
      if pool is empty: reject with ERR_NO_ELIGIBLE_VIAL (409)
      chosen = first(pool); chosen.status = RESERVED
    input_set: "Vials with status IN_STOCK under lots with status AVAILABLE and expiration_date strictly after the logical clock; a lot expiring exactly at the clock is excluded"
    constants: {}
    precision: "not numeric"

  - name: billing_units_split
    trigger: "POST /injection-encounters/{id}/document"
    algorithm: aggregation
    formula: |
      drug = Drug[encounter.effective_drug_id]

      wasted_ml = round_half_up(drug.vial_fill_ml - administered_dose_ml, 3)
                    if drug.vial_type == SINGLE_DOSE else 0

      administered_mg = administered_dose_ml * drug.mg_per_ml
      wasted_mg       = wasted_ml * drug.mg_per_ml

      # PINNED ROUNDING ORDER: round each billed line to whole billing units
      # FIRST, then sum. Summing milligrams and rounding once is WRONG and
      # produces a different unit count.
      administered_billing_units = round_half_up(administered_mg / drug.billing_unit_mg, 0)
      wasted_billing_units       = round_half_up(wasted_mg / drug.billing_unit_mg, 0)
      total_billed_billing_units = administered_billing_units + wasted_billing_units

      # Worked divergence (vial_fill_ml 0.27, mg_per_ml 40, billing_unit_mg 1,
      # administered_dose_ml 0.06): administered 2.4 mg -> 2 units,
      # wasted 8.4 mg -> 8 units, total 10 units. Rounding the summed
      # 10.8 mg once would yield 11 units — that answer is rejected.
    input_set: "the single encounter being documented and its effective Drug row"
    constants: {}
    precision: "wasted_ml to 3 decimals half-up; billing units are whole numbers, each line rounded half-up independently before summation"

  - name: modifier_assembly
    trigger: "POST /injection-encounters/{id}/document (writes InjectionEncounter.modifiers; copied to Claim.modifiers at claim creation)"
    algorithm: aggregation
    formula: |
      modifiers = []
      modifiers.append("RT" if encounter.eye == OD else "LT")     # position 0 always laterality
      if Drug[encounter.effective_drug_id].vial_type == SINGLE_DOSE:
          modifiers.append("JW" if wasted_billing_units > 0 else "JZ")
      # MULTI_DOSE_COMPOUNDED products carry neither JW nor JZ.
      # Array order is pinned: laterality first, wastage modifier second.
    input_set: "the encounter's own computed wastage units and its effective Drug row"
    constants: {}
    precision: "not numeric"

  - name: step_therapy_failure_count
    trigger: "POST /prior-authorizations/{id}/submit (writes PriorAuthorization.step_therapy_failures_documented)"
    algorithm: aggregation
    formula: |
      policy = PayerDrugPolicy(pa.payer_id, pa.drug_id)
      if policy.step_therapy_prerequisite_drug_id == null:
          step_therapy_failures_documented = 0   # and the gate is skipped entirely
      else:
          count = | { e in InjectionEncounter :
                        e.patient_id == pa.patient_id
                        and e.status IN {DOCUMENTED, ATTESTED, BILLED, CLOSED}
                        and e.effective_drug_id == policy.step_therapy_prerequisite_drug_id
                        and ImagingStudy[e.imaging_study_id].disease_activity == ACTIVE } |
          step_therapy_failures_documented = count
          gate: count >= policy.required_prior_failures else ERR_STEP_THERAPY_NOT_SATISFIED
    input_set: |
      InjectionEncounters of this patient only, statuses IN {DOCUMENTED, ATTESTED,
      BILLED, CLOSED} (DRAFT and VOIDED excluded), keyed on effective_drug_id (the
      product actually injected, not the plan's drug_id). No time window: the whole
      history counts. The count is order-insensitive, so no tie-break is needed.
    constants: {}
    precision: "whole count"

  - name: clinician_day_capacity
    trigger: "POST /injection-encounters (gate only; no field is persisted)"
    algorithm: aggregation
    formula: |
      t = requested encounter_datetime
      window = [t - 24 hours, t]                    # CLOSED at both ends
      used = | { e in InjectionEncounter :
                   e.clinician_id == acting_clinician_id
                   and e.status != VOIDED
                   and window.lower <= e.encounter_datetime <= window.upper } |
      gate: used < Clinician[acting_clinician_id].max_injections_per_day
            else ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED
      # An encounter sitting exactly 24 hours before t is INSIDE the window and
      # consumes capacity; one at 24 hours plus one second is outside.
    input_set: "all non-VOIDED encounters of the acting clinician across every patient and plan; the closed 24h window is measured from the requested encounter_datetime, not from the clock"
    constants:
      CAPACITY_WINDOW_HOURS: 24
    precision: "whole count"

  - name: patient_responsibility_waterfall
    trigger: "POST /claims (provisional pass) and POST /claims/{id}/remittance (final pass)"
    algorithm: waterfall_allocation
    formula: |
      # The evaluation order below is normative. The tier cap depends on the
      # coinsurance, the coinsurance depends on the allowed total, and the
      # write-off depends on the pre-write-off responsibility — every value is
      # read exactly once, in this sequence, and never re-fed into an earlier step.
      #
      # 1. allowed total
      total_allowed_cents = drug_allowed_cents + wastage_allowed_cents + admin_allowed_cents
      # 2. coinsurance
      coinsurance_cents = round_half_up(total_allowed_cents * Payer.coinsurance_rate)
      # 3. enrollment selection
      #    (a) eligibility filter
      pool = { a in AssistanceEnrollment :
                 a.patient_id == claim.patient_id
                 and a.status == ACTIVE
                 and a.effective_date <= logical_clock <= a.expiration_date
                 and not (Payer.federal_program == true
                          and a.program_type == MANUFACTURER_COPAY_CARD) }
      #    (b) ranking  (c) tie-break  (d) empty fallback
      order pool by (a.annual_benefit_cents - a.benefit_used_cents) DESC,
                    then a.per_encounter_cap_cents DESC,
                    then a.created_at ASC          # never by a.id
      enrollment = first(pool) or NONE
      # 4. tier cap — keyed on the coinsurance computed in step 2
      if enrollment == NONE:
          per_encounter_cap = 0
      elif coinsurance_cents >= FOUNDATION_HIGH_TIER_CENTS:
          per_encounter_cap = enrollment.per_encounter_cap_cents
      else:
          per_encounter_cap = round_half_up(enrollment.per_encounter_cap_cents * LOW_TIER_CAP_FACTOR)
      # 5. foundation dollars
      remaining_benefit    = enrollment.annual_benefit_cents - enrollment.benefit_used_cents
                             (0 when enrollment == NONE; benefit_used_cents is read
                              EXCLUSIVE of this claim's own prior contribution, which
                              is first reversed when the final pass re-runs)
      foundation_applied_cents = min(coinsurance_cents, per_encounter_cap, remaining_benefit)
      # 6. patient balance before small-balance relief
      responsibility_pre = coinsurance_cents - foundation_applied_cents
      # 7. small-balance write-off, then the payer shortfall
      small_balance_writeoff = responsibility_pre if responsibility_pre <= WRITEOFF_THRESHOLD_CENTS else 0
      patient_responsibility_cents = responsibility_pre - small_balance_writeoff
      payer_paid_total  = drug_paid_cents + wastage_paid_cents + admin_paid_cents
      payer_shortfall   = max(0, total_allowed_cents - payer_paid_total
                                 - coinsurance_cents)
      practice_writeoff_cents = small_balance_writeoff + payer_shortfall
      # 8. ledger side effect
      enrollment.benefit_used_cents += foundation_applied_cents
      if enrollment.benefit_used_cents >= enrollment.annual_benefit_cents:
          enrollment.status = EXHAUSTED
    input_set: |
      On the provisional pass the allowed amounts are the policy-derived expectations
      and payer_paid_total is treated as (total_allowed_cents - coinsurance_cents), so
      payer_shortfall is 0. On the final pass the allowed and paid amounts come from
      the remittance posting; a re-run first reverses this claim's previous
      foundation_applied_cents out of enrollment.benefit_used_cents, then re-applies.
    constants:
      FOUNDATION_HIGH_TIER_CENTS: 50000
      LOW_TIER_CAP_FACTOR: 0.5
      WRITEOFF_THRESHOLD_CENTS: 1000
    precision: "integer cents; every multiplication is rounded half-up to whole cents immediately"

  - name: claim_margin
    trigger: "POST /claims (provisional_margin_cents) and POST /claims/{id}/remittance once both line dimensions are terminal (realized_margin_cents)"
    algorithm: forward_looking
    formula: |
      # Shared inputs
      units_admin = encounter.administered_billing_units
      units_waste = encounter.wasted_billing_units
      policy      = PayerDrugPolicy(claim.payer_id, encounter.effective_drug_id)
      asp         = Drug[encounter.effective_drug_id].asp_cents_per_billing_unit

      drug_billed_cents    = units_admin * policy.drug_allowed_cents_per_billing_unit
      wastage_billed_cents = units_waste * policy.drug_allowed_cents_per_billing_unit
      admin_billed_cents   = policy.admin_allowed_cents

      # VARIANT provisional — ASP standard-cost basis, expected allowables
      drug_allowed_cents    = drug_billed_cents
      wastage_allowed_cents = wastage_billed_cents if policy.wastage_reimbursed else 0
      admin_allowed_cents   = admin_billed_cents
      standard_drug_cost_cents = (units_admin + units_waste) * asp
      provisional_margin_cents =
          (drug_allowed_cents + wastage_allowed_cents + admin_allowed_cents)
          - standard_drug_cost_cents

      # VARIANT realized — actual acquisition basis, remitted cash
      actual_acquisition_cost_cents =
          DrugLot[Vial[encounter.vial_id].drug_lot_id].unit_acquisition_cost_cents
      realized_margin_cents =
          (drug_paid_cents + wastage_paid_cents + admin_paid_cents
           + patient_responsibility_cents + foundation_applied_cents)
          - actual_acquisition_cost_cents
      # practice_writeoff_cents is deliberately excluded: it is never collected.
    input_set: |
      One encounter and one claim. The provisional variant reads only reference data
      (policy allowables and published ASP). The realized variant reads only posted
      cash (remittance amounts, patient balance, foundation dollars) and the whole-vial
      acquisition cost of the exact lot dispensed — buy-and-bill charges the full vial
      to cost even though only part of it was injected.
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "written at POST /claims, before any remittance"
        difference: "costs the drug at published ASP per billed unit (units_admin + units_waste), and credits expected allowables"
      - name: realized
        when: "written at POST /claims/{id}/remittance once drug_line_status IN {PAID, WRITTEN_OFF} and admin_line_status IN {PAID, DENIED}"
        difference: "costs the drug at the dispensed lot's whole-vial unit_acquisition_cost_cents and credits only cash actually posted; diverges from provisional even when every payer amount equals its expectation"

  - name: lot_exposure
    trigger: "GET /drug-lots/{id}/exposure (both variants); the CARRYING variant is additionally persisted to DrugLot.carrying_cost_accrued_cents by POST /inventory/expiration-sweep"
    algorithm: decay_function
    formula: |
      lot = DrugLot[id]

      # VARIANT carrying — financing cost of capital still sitting on the shelf
      days_held = floor((logical_clock - lot.received_date) / 1 day)
      carrying_exposure_cents = round_half_up(
          lot.vials_on_hand * lot.unit_acquisition_cost_cents
          * (CARRYING_RATE_BASIS_POINTS / 10000) * days_held / DAYS_PER_YEAR )

      # VARIANT expiration — acquisition value that will never be injected
      burn_window = [logical_clock - BURN_WINDOW_DAYS days, logical_clock)   # half-open
      burned = | { v in Vial :
                     v.status == ADMINISTERED
                     and DrugLot[v.drug_lot_id].drug_id == lot.drug_id
                     and burn_window.lower <= v.administered_at < burn_window.upper } |
      burn_rate_per_day  = burned / BURN_WINDOW_DAYS          # exact rational, no rounding
      days_to_expiry     = max(0, floor((lot.expiration_date - logical_clock) / 1 day))
      projected_consumable = floor(burn_rate_per_day * days_to_expiry)
      unusable_vials     = max(0, (lot.vials_on_hand + lot.vials_reserved) - projected_consumable)
      expiration_exposure_cents = unusable_vials * lot.unit_acquisition_cost_cents
    input_set: |
      CARRYING counts only Vials with status IN_STOCK (RESERVED capital is treated as
      already committed) and measures whole days from received_date to the clock.
      EXPIRATION counts IN_STOCK plus RESERVED vials against a burn rate drawn from
      ADMINISTERED vials of the SAME drug_id across ALL lots inside the half-open
      30-day window ending at the clock. Both variants are order-insensitive.
    constants:
      CARRYING_RATE_BASIS_POINTS: 2000
      DAYS_PER_YEAR: 365
      BURN_WINDOW_DAYS: 30
    precision: "integer cents; the carrying variant rounds half-up exactly once at the end, the expiration variant floors the projected consumption before multiplying"
    variants:
      - name: carrying
        when: "basis == CARRYING on GET /drug-lots/{id}/exposure, and inside the expiration sweep"
        difference: "time-value accrual on unconsumed vials; grows every day the lot sits unused and ignores the expiration date entirely"
      - name: expiration
        when: "basis == EXPIRATION on GET /drug-lots/{id}/exposure"
        difference: "expected write-off of vials that cannot be consumed before expiry at the trailing 30-day burn rate; ignores how long the lot has been held"

  - name: adverse_event_reportability
    trigger: "POST /adverse-events and POST /adverse-events/{id}/adjudicate"
    algorithm: threshold
    formula: |
      days_post_injection = floor((onset_datetime - encounter.encounter_datetime) / 1 day)
      reportable =
          (event_type == ENDOPHTHALMITIS and days_post_injection <= ENDOPHTHALMITIS_WINDOW_DAYS)
          or severity == SEVERE
          or culture_result == POSITIVE
      fda_report_due_date =
          onset_datetime + (SEVERE_REPORT_DAYS if severity == SEVERE else ROUTINE_REPORT_DAYS) days
          if reportable else null
    input_set: "the single AdverseEvent row plus its source encounter's encounter_datetime"
    constants:
      ENDOPHTHALMITIS_WINDOW_DAYS: 30
      SEVERE_REPORT_DAYS: 15
      ROUTINE_REPORT_DAYS: 30
      LOT_CLUSTER_THRESHOLD: 2
    precision: "whole days"

  - name: recall_notification_plan
    trigger: "POST /lot-recalls (generates RecallNotification rows and writes notification_deadline_date)"
    algorithm: aggregation
    formula: |
      class_days = { CLASS_I: 3, CLASS_II: 10, CLASS_III: 30 }[recall.recall_class]
      notification_deadline_date = logical_clock + class_days days

      exposed = { e in InjectionEncounter :
                    Vial[e.vial_id].drug_lot_id == recall.drug_lot_id
                    and e.status IN {DOCUMENTED, ATTESTED, BILLED, CLOSED} }
      # One notification per exposed encounter, created in this order:
      order exposed by e.encounter_datetime ASC, then e.created_at ASC   # never by e.id
      for each e: create RecallNotification{ lot_recall_id, patient_id = e.patient_id,
                                             injection_encounter_id = e.id,
                                             channel = Patient[e.patient_id].notification_channel,
                                             status = PENDING }
      notifications_required = |exposed|
    input_set: "encounters whose administered vial belongs to the recalled lot, statuses IN {DOCUMENTED, ATTESTED, BILLED, CLOSED}; DRAFT and VOIDED encounters generate no notification even when they held a vial from the lot"
    constants:
      CLASS_I_NOTICE_DAYS: 3
      CLASS_II_NOTICE_DAYS: 10
      CLASS_III_NOTICE_DAYS: 30
    precision: "whole days and whole counts"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles array"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID resolves to an existing row: RetinaSpecialist -> Clinician.id, Patient -> Patient.id"
    error_id: ERR_ACTING_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include RetinaSpecialist or Patient"

  - priority: 5
    category: business_constraint
    check: "request body and query parameters carry every required field with the declared type, enum member, numeric range and pagination bounds (limit 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_PAYER_NOT_FOUND | ERR_DRUG_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_IMAGING_STUDY_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_VIAL_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_ADVERSE_EVENT_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the body resolves, validated in the order the fields are declared in §1.5 input"
    error_id: "same catalog as priority 6"
    http_status: 404
    applies_to: "all endpoints whose input carries a foreign key"

  - priority: 8
    category: auth
    check: "an acting Patient may only touch RecallNotifications whose patient_id equals X-User-ID"
    error_id: ERR_NOT_NOTIFICATION_OWNER
    http_status: 403
    applies_to: "POST /recall-notifications/{id}/acknowledge, GET /recall-notifications, GET /recall-notifications/{id}"

  - priority: 9
    category: business_constraint
    check: "segregation of duties: the wastage attester is not the injecting clinician"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /injection-encounters/{id}/attest-wastage"

  - priority: 10
    category: business_constraint
    check: "segregation of duties: the adjudicating clinician is not the encounter's injecting clinician"
    error_id: ERR_ADJUDICATOR_IS_INJECTOR
    http_status: 403
    applies_to: "POST /adverse-events/{id}/adjudicate"

  - priority: 11
    category: business_constraint
    check: "segregation of duties: the closing operator's X-User-ID differs from LotRecall.initiated_by_user_id"
    error_id: ERR_RECALL_CLOSER_CONFLICT
    http_status: 403
    applies_to: "POST /lot-recalls/{id}/close"

  - priority: 12
    category: state
    check: "expected_treatment_plan_version equals TreatmentPlan.version (optimistic concurrency)"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /injection-encounters, POST /prior-authorizations"

  - priority: 13
    category: state
    check: "the target resource is in a state the transition allows, per §1.2 (plan not treatable, authorization not decidable, encounter not documentable, claim line not remittable, recall step out of order, notification not sendable, lot not releasable, enrollment not approvable)"
    error_id: "ERR_PLAN_NOT_TREATABLE | ERR_PLAN_STATE_INVALID | ERR_AUTHORIZATION_STATE_INVALID | ERR_ENCOUNTER_STATE_INVALID | ERR_CLAIM_LINE_STATE_INVALID | ERR_LOT_STATE_INVALID | ERR_RECALL_STATE_INVALID | ERR_NOTIFICATION_STATE_INVALID | ERR_ENROLLMENT_STATE_INVALID | ERR_ADVERSE_EVENT_STATE_INVALID | ERR_VIAL_STATE_INVALID"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 14
    category: business_safety
    check: "the acting clinician has status ACTIVE and injection_privilege == true"
    error_id: ERR_CLINICIAN_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 15
    category: business_safety
    check: "the imaging study belongs to the plan's patient and its eye equals the plan's eye"
    error_id: ERR_IMAGING_EYE_MISMATCH
    http_status: 422
    applies_to: "POST /injection-encounters, POST /treatment-plans/{id}/activate"

  - priority: 16
    category: business_temporal
    check: "0 <= encounter_datetime - ImagingStudy.study_datetime <= IMAGING_VALIDITY_DAYS (14) days"
    error_id: ERR_IMAGING_STUDY_STALE
    http_status: 422
    applies_to: "POST /injection-encounters, POST /treatment-plans/{id}/activate"

  - priority: 17
    category: business_safety
    check: "when the plan already has a non-VOIDED encounter, floor((encounter_datetime - previous.encounter_datetime)/1 day) >= effective Drug.min_interval_days; the lower bound is inclusive"
    error_id: ERR_INJECTION_INTERVAL_VIOLATION
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 18
    category: business_temporal
    check: "the acting clinician's non-VOIDED encounters inside the closed 24-hour window ending at encounter_datetime number strictly fewer than max_injections_per_day"
    error_id: ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 19
    category: business_constraint
    check: "override_reason is present and non-empty whenever medical_necessity_override is true"
    error_id: ERR_OVERRIDE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /injection-encounters"

  - priority: 20
    category: business_referential
    check: "a PayerDrugPolicy exists for (patient's payer, effective_drug_id)"
    error_id: ERR_PAYER_POLICY_MISSING
    http_status: 409
    applies_to: "POST /injection-encounters, POST /claims"

  - priority: 21
    category: business_referential
    check: "the PayerDrugPolicy for (payer, effective_drug_id) has coverage_tier != EXCLUDED"
    error_id: ERR_DRUG_EXCLUDED_BY_PAYER
    http_status: 422
    applies_to: "POST /injection-encounters, POST /prior-authorizations/{id}/submit"

  - priority: 22
    category: business_referential
    check: "when the policy sets pa_required, the plan has at least one PriorAuthorization with status IN {APPROVED, EXHAUSTED}"
    error_id: ERR_AUTHORIZATION_MISSING
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 23
    category: business_temporal
    check: "the selected authorization covers the clock: effective_date <= logical clock <= expiration_date. Selection takes the plan's authorizations with status IN {APPROVED, EXHAUSTED} whose closed window contains the clock, ranked by effective_date DESC then created_at DESC; when none contains the clock, the one with the greatest expiration_date (tie-break created_at DESC) is selected, flipped to EXPIRED and rejected"
    error_id: ERR_AUTHORIZATION_EXPIRED
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 24
    category: business_referential
    check: "the selected authorization's drug_id equals the encounter's effective_drug_id (a biosimilar substitution invalidates an authorization written for the reference product)"
    error_id: ERR_AUTHORIZATION_DRUG_MISMATCH
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 25
    category: business_fiscal
    check: "the selected authorization has injections_used < approved_injections"
    error_id: ERR_AUTHORIZATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 26
    category: business_safety
    check: "calculations.vial_selection yields a non-empty candidate pool"
    error_id: ERR_NO_ELIGIBLE_VIAL
    http_status: 409
    applies_to: "POST /injection-encounters"

  - priority: 27
    category: business_safety
    check: "at documentation time the reserved vial's DrugLot.status is still AVAILABLE"
    error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /injection-encounters/{id}/document"

  - priority: 28
    category: business_constraint
    check: "0 < administered_dose_ml <= effective Drug.vial_fill_ml"
    error_id: ERR_DOSE_EXCEEDS_VIAL_FILL
    http_status: 422
    applies_to: "POST /injection-encounters/{id}/document"

  - priority: 29
    category: business_safety
    check: "injection_site_prep_confirmed == true"
    error_id: ERR_PREP_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /injection-encounters/{id}/document"

  - priority: 30
    category: business_constraint
    check: "attested_wasted_ml equals the encounter's computed wasted_ml to 3 decimal places"
    error_id: ERR_ATTESTED_WASTAGE_MISMATCH
    http_status: 422
    applies_to: "POST /injection-encounters/{id}/attest-wastage"

  - priority: 31
    category: business_referential
    check: "calculations.step_therapy_failure_count >= PayerDrugPolicy.required_prior_failures"
    error_id: ERR_STEP_THERAPY_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /prior-authorizations/{id}/submit"

  - priority: 32
    category: business_constraint
    check: "approved_injections <= PayerDrugPolicy.pa_max_injections"
    error_id: ERR_APPROVED_INJECTIONS_EXCEED_POLICY
    http_status: 422
    applies_to: "POST /prior-authorizations/{id}/decision"

  - priority: 33
    category: business_temporal
    check: "the closed interval [effective_date, effective_date + pa_validity_days days] does not overlap the same interval of another authorization on the plan whose status IN {APPROVED, EXHAUSTED}; touching endpoints count as an overlap, so a new window must start at least one day after the prior window's last day"
    error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /prior-authorizations/{id}/decision"

  - priority: 34
    category: business_temporal
    check: "logical clock <= target.updated_at + Payer.appeal_window_days days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /prior-authorizations/{id}/appeal, POST /claims/{id}/appeal-drug-line"

  - priority: 35
    category: business_constraint
    check: "lot_number is unique within drug_id"
    error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    applies_to: "POST /drug-lots"

  - priority: 36
    category: business_constraint
    check: "the patient has no TreatmentPlan with status IN {DRAFT, LOADING, MAINTENANCE, INTENSIFIED, SUSPENDED} for the same eye"
    error_id: ERR_DUPLICATE_ACTIVE_PLAN
    http_status: 409
    applies_to: "POST /treatment-plans"

  - priority: 37
    category: business_constraint
    check: "the encounter has no existing Claim"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /claims"

  - priority: 38
    category: business_fiscal
    check: "program_type != MANUFACTURER_COPAY_CARD when the patient's Payer.federal_program == true"
    error_id: ERR_COPAY_CARD_FEDERAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /assistance-enrollments"

  - priority: 39
    category: business_constraint
    check: "the patient has no other AssistanceEnrollment with status ACTIVE"
    error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http_status: 409
    applies_to: "POST /assistance-enrollments/{id}/approve"

  - priority: 40
    category: business_constraint
    check: "the lot has no LotRecall with status != CLOSED"
    error_id: ERR_RECALL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /lot-recalls, POST /drug-lots/{id}/release"

  - priority: 41
    category: business_constraint
    check: "the lot has at least one Vial with status QUARANTINED"
    error_id: ERR_NO_QUARANTINED_VIALS
    http_status: 409
    applies_to: "POST /lot-recalls/{id}/ship-return"

  - priority: 42
    category: business_fiscal
    check: "credit_received_cents <= LotRecall.credit_expected_cents"
    error_id: ERR_CREDIT_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /lot-recalls/{id}/reconcile-credit"

  - priority: 43
    category: business_constraint
    check: "notifications_acknowledged + notifications_unreachable == notifications_required"
    error_id: ERR_PATIENT_NOTIFICATIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /lot-recalls/{id}/close"

  - priority: 44
    category: business_constraint
    check: "no AdverseEvent on the plan's encounters has status IN {REPORTED, UNDER_INVESTIGATION}"
    error_id: ERR_OPEN_ADVERSE_EVENT
    http_status: 409
    applies_to: "POST /treatment-plans/{id}/resume"

  - priority: 45
    category: business_constraint
    check: "cross-row uniqueness: Payer.name, Drug.hcpcs_code, Patient.mrn, Clinician.npi and the (payer_id, drug_id) pair of PayerDrugPolicy"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /payers, POST /drugs, POST /patients, POST /clinicians, POST /payer-drug-policies"

  - priority: 46
    category: business_referential
    check: "reference_drug_id, when supplied, points at a Drug whose is_biosimilar is false, and is_biosimilar true requires a non-null reference_drug_id"
    error_id: ERR_INVALID_REFERENCE_DRUG
    http_status: 422
    applies_to: "POST /drugs"

# =============================================================================
# §1.5 Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- logical clock
  - method: POST
    path: /_clock/set_current_utc
    roles: [PracticeAdmin]
    input: [current_utc]
    output: "{ current_utc: string }"
    description: "sets the logical clock; every temporal rule reads it. Default before any call: 2026-08-01T00:00:00Z"
    side_effects:
      - "no domain row is mutated; lazy transitions are evaluated only on the next domain request"

  # ------------------------------------------------------------------- Payer
  - method: POST
    path: /payers
    roles: [PracticeAdmin]
    input: [name, payer_type, coinsurance_rate, "pa_required?", "biosimilar_preference?", "appeal_window_days?"]
    output: Payer
    side_effects:
      - "computes federal_program from payer_type"

  - method: GET
    path: /payers/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Payer

  - method: GET
    path: /payers
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["payer_type?", "status?", "limit?", "offset?"]
    output: Payer[]

  # -------------------------------------------------------------------- Drug
  - method: POST
    path: /drugs
    roles: [PracticeAdmin]
    input: [brand_name, hcpcs_code, vial_type, vial_fill_ml, label_dose_ml, mg_per_ml, billing_unit_mg, asp_cents_per_billing_unit, min_interval_days, max_interval_days, "is_biosimilar?", "reference_drug_id?"]
    output: Drug
    side_effects:
      - "rejects reference_drug_id pointing at a Drug with is_biosimilar true"

  - method: GET
    path: /drugs/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Drug

  - method: GET
    path: /drugs
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["reference_drug_id?", "is_biosimilar?", "vial_type?", "status?", "limit?", "offset?"]
    output: Drug[]

  # -------------------------------------------------------- PayerDrugPolicy
  - method: POST
    path: /payer-drug-policies
    roles: [PracticeAdmin]
    input: [payer_id, drug_id, coverage_tier, drug_allowed_cents_per_billing_unit, admin_allowed_cents, "wastage_reimbursed?", "pa_required?", "pa_validity_days?", "pa_max_injections?", "step_therapy_prerequisite_drug_id?", "required_prior_failures?"]
    output: PayerDrugPolicy
    side_effects:
      - "one policy per (payer_id, drug_id) pair"

  - method: GET
    path: /payer-drug-policies/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: PayerDrugPolicy

  - method: GET
    path: /payer-drug-policies
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["payer_id?", "drug_id?", "step_therapy_prerequisite_drug_id?", "coverage_tier?", "limit?", "offset?"]
    output: PayerDrugPolicy[]

  # ----------------------------------------------------------------- Patient
  - method: POST
    path: /patients
    roles: [PracticeAdmin]
    input: [mrn, full_name, payer_id, member_id, contact_point, "notification_channel?"]
    output: Patient

  - method: GET
    path: /patients/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Patient

  - method: GET
    path: /patients
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["payer_id?", "status?", "limit?", "offset?"]
    output: Patient[]

  # --------------------------------------------------------------- Clinician
  - method: POST
    path: /clinicians
    roles: [PracticeAdmin]
    input: [full_name, npi, credential, "injection_privilege?", "max_injections_per_day?"]
    output: Clinician

  - method: GET
    path: /clinicians/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Clinician

  - method: GET
    path: /clinicians
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["status?", "credential?", "injection_privilege?", "limit?", "offset?"]
    output: Clinician[]

  - method: POST
    path: /clinicians/{id}/suspend
    roles: [PracticeAdmin]
    input: [suspension_reason]
    output: Clinician
    side_effects:
      - "ACTIVE -> SUSPENDED; existing encounters are left untouched"

  # ------------------------------------------------------------ ImagingStudy
  - method: POST
    path: /imaging-studies
    roles: [RetinaSpecialist]
    input: [patient_id, eye, study_datetime, central_subfield_thickness_um, intraretinal_fluid, subretinal_fluid, new_hemorrhage, va_letter_score]
    output: ImagingStudy
    side_effects:
      - "stamps interpreted_by_clinician_id from X-User-ID"
      - "writes disease_activity via calculations.disease_activity_classification"

  - method: GET
    path: /imaging-studies/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: ImagingStudy

  - method: GET
    path: /imaging-studies
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["patient_id?", "interpreted_by_clinician_id?", "eye?", "disease_activity?", "limit?", "offset?"]
    output: ImagingStudy[]

  # ----------------------------------------------------------- TreatmentPlan
  - method: POST
    path: /treatment-plans
    roles: [RetinaSpecialist]
    input: [patient_id, drug_id, eye, "loading_doses_required?"]
    output: TreatmentPlan
    side_effects:
      - "starts in DRAFT with version 1"

  - method: GET
    path: /treatment-plans/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: TreatmentPlan

  - method: GET
    path: /treatment-plans
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["patient_id?", "drug_id?", "baseline_imaging_study_id?", "last_encounter_id?", "status?", "eye?", "limit?", "offset?"]
    output: TreatmentPlan[]

  - method: POST
    path: /treatment-plans/{id}/activate
    roles: [RetinaSpecialist]
    input: [baseline_imaging_study_id]
    output: TreatmentPlan
    side_effects:
      - "DRAFT -> LOADING; writes current_interval_days = LOADING_INTERVAL_DAYS and next_due_date"
      - "increments version"

  - method: POST
    path: /treatment-plans/{id}/suspend
    roles: [RetinaSpecialist]
    input: [suspension_reason]
    output: TreatmentPlan
    side_effects:
      - "LOADING | MAINTENANCE | INTENSIFIED -> SUSPENDED; next_due_date = null"
      - "cascade: releases vials reserved by the plan's DRAFT encounters and voids those encounters"
      - "cascade: recomputes PriorAuthorization.injections_used"
      - "increments version"

  - method: POST
    path: /treatment-plans/{id}/resume
    roles: [RetinaSpecialist]
    input: []
    output: TreatmentPlan
    side_effects:
      - "SUSPENDED -> MAINTENANCE; recomputes next_due_date from the logical clock"
      - "increments version"

  - method: POST
    path: /treatment-plans/{id}/discontinue
    roles: [RetinaSpecialist]
    input: [discontinuation_reason]
    output: TreatmentPlan
    side_effects:
      - "-> DISCONTINUED (terminal); voids DRAFT encounters and releases their vials"
      - "increments version"

  # ---------------------------------------------------------------- DrugLot
  - method: POST
    path: /drug-lots
    roles: [PharmacyTech]
    input: [drug_id, lot_number, expiration_date, received_date, unit_acquisition_cost_cents, vials_received]
    output: DrugLot
    side_effects:
      - "creates exactly vials_received Vial rows in IN_STOCK, serial numbers <lot_number>-001 upward in creation order"
      - "vials_on_hand == vials_received, every other vial counter 0"

  - method: GET
    path: /drug-lots/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: DrugLot

  - method: GET
    path: /drug-lots
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["drug_id?", "status?", "limit?", "offset?"]
    output: DrugLot[]

  - method: GET
    path: /drug-lots/{id}/exposure
    roles: [PracticeAdmin, PharmacyTech, BillingSpecialist]
    input: [basis]
    output: "{ drug_lot_id: string, basis: string, days_held: integer, unconsumed_vials: integer, unconsumed_value_cents: integer, exposure_cents: integer, projected_burn_vials: integer, at_risk_vials: integer }"
    description: "computed read over calculations.lot_exposure; basis is CARRYING or EXPIRATION"
    side_effects:
      - "read-only: persists nothing"

  - method: POST
    path: /drug-lots/{id}/quarantine
    roles: [PharmacyTech]
    input: [quarantine_reason]
    output: DrugLot
    side_effects:
      - "AVAILABLE -> QUARANTINED; every IN_STOCK vial of the lot becomes QUARANTINED"

  - method: POST
    path: /drug-lots/{id}/release
    roles: [ComplianceOfficer]
    input: []
    output: DrugLot
    side_effects:
      - "QUARANTINED -> AVAILABLE; every QUARANTINED vial of the lot returns to IN_STOCK"
      - "refused when an open LotRecall exists"

  - method: POST
    path: /inventory/expiration-sweep
    roles: [PharmacyTech]
    input: []
    output: "{ lots_swept: integer, lots_expired: integer, vials_expired: integer, carrying_cost_accrued_cents_total: integer, swept_at: string }"
    description: "walks every DrugLot, expires vials whose lot expiration_date <= logical clock and refreshes carrying_cost_accrued_cents"
    side_effects:
      - "sets last_swept_at on every lot it touches"

  # ------------------------------------------------------------------- Vial
  - method: GET
    path: /vials/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Vial

  - method: GET
    path: /vials
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["drug_lot_id?", "reserved_for_encounter_id?", "status?", "limit?", "offset?"]
    output: Vial[]

  # ------------------------------------------------------ PriorAuthorization
  - method: POST
    path: /prior-authorizations
    roles: [BillingSpecialist]
    input: [treatment_plan_id, expected_treatment_plan_version]
    output: PriorAuthorization
    side_effects:
      - "copies patient_id, drug_id and payer_id from the plan and the patient; starts in DRAFT"
      - "OCC: rejects a stale expected_treatment_plan_version with ERR_STALE_PLAN_VERSION (412)"
      - "increments TreatmentPlan.version"

  - method: GET
    path: /prior-authorizations/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: PriorAuthorization

  - method: GET
    path: /prior-authorizations
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["treatment_plan_id?", "patient_id?", "drug_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: PriorAuthorization[]

  - method: POST
    path: /prior-authorizations/{id}/submit
    roles: [BillingSpecialist]
    input: [clinical_justification]
    output: PriorAuthorization
    side_effects:
      - "DRAFT | INFO_REQUESTED -> SUBMITTED; increments submission_count"
      - "writes step_therapy_failures_documented via calculations.step_therapy_failure_count and enforces required_prior_failures"

  - method: POST
    path: /prior-authorizations/{id}/decision
    roles: [BillingSpecialist]
    input: [decision, "auth_number?", "approved_injections?", "effective_date?", "denial_reason?", "information_requested?"]
    output: PriorAuthorization
    side_effects:
      - "decision APPROVED requires auth_number, approved_injections and effective_date; computes expiration_date = effective_date + pa_validity_days days"
      - "decision DENIED requires denial_reason; decision INFO_REQUESTED requires information_requested"
      - "APPROVED windows on one plan may not overlap"

  - method: POST
    path: /prior-authorizations/{id}/appeal
    roles: [BillingSpecialist]
    input: [appeal_basis]
    output: PriorAuthorization
    side_effects:
      - "DENIED -> APPEALED inside Payer.appeal_window_days"

  # ----------------------------------------------------- InjectionEncounter
  - method: POST
    path: /injection-encounters
    roles: [RetinaSpecialist]
    input: [treatment_plan_id, imaging_study_id, encounter_datetime, expected_treatment_plan_version, "medical_necessity_override?", "override_reason?"]
    output: InjectionEncounter
    side_effects:
      - "stamps clinician_id from X-User-ID, copies patient_id and eye from the plan"
      - "resolves effective_drug_id and substituted_from_drug_id via calculations.biosimilar_substitution"
      - "selects and RESERVES a vial via calculations.vial_selection, writing vial_id"
      - "selects the covering PriorAuthorization, writes prior_authorization_id and bumps its injections_used, flipping it to EXHAUSTED when the cap is reached"
      - "writes previous_encounter_id and interval_days_from_previous"
      - "increments TreatmentPlan.version"

  - method: GET
    path: /injection-encounters/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: InjectionEncounter

  - method: GET
    path: /injection-encounters
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["treatment_plan_id?", "patient_id?", "clinician_id?", "imaging_study_id?", "vial_id?", "prior_authorization_id?", "previous_encounter_id?", "effective_drug_id?", "substituted_from_drug_id?", "attested_by_clinician_id?", "status?", "eye?", "limit?", "offset?"]
    output: InjectionEncounter[]

  - method: POST
    path: /injection-encounters/{id}/document
    roles: [RetinaSpecialist]
    input: [administered_dose_ml, injection_site_prep_confirmed, post_injection_iop_mmhg]
    output: InjectionEncounter
    side_effects:
      - "DRAFT -> DOCUMENTED; the reserved vial becomes ADMINISTERED with administered_at = encounter_datetime"
      - "writes wasted_ml, administered_billing_units, wasted_billing_units, total_billed_billing_units via calculations.billing_units_split"
      - "writes modifiers via calculations.modifier_assembly"
      - "advances the plan: injections_administered, consecutive_quiescent_visits, current_interval_days, next_due_date, last_encounter_id, status and version"

  - method: POST
    path: /injection-encounters/{id}/attest-wastage
    roles: [RetinaSpecialist]
    input: [attested_wasted_ml]
    output: InjectionEncounter
    side_effects:
      - "DOCUMENTED -> ATTESTED; stamps attested_by_clinician_id from X-User-ID"
      - "the attester must differ from clinician_id (segregation of duties)"

  - method: POST
    path: /injection-encounters/{id}/void
    roles: [RetinaSpecialist]
    input: [void_reason]
    output: InjectionEncounter
    side_effects:
      - "DRAFT -> VOIDED releases the reserved vial back to IN_STOCK"
      - "DOCUMENTED -> VOIDED quarantines the administered vial instead of returning it to stock"
      - "recomputes the plan's counters and the authorization's injections_used, reviving an EXHAUSTED authorization"

  # ------------------------------------------------------------------- Claim
  - method: POST
    path: /claims
    roles: [BillingSpecialist]
    input: [injection_encounter_id]
    output: Claim
    side_effects:
      - "requires the encounter to be ATTESTED; copies hcpcs_code, modifiers and billed units"
      - "prices the three lines from the PayerDrugPolicy and writes total_allowed_cents and coinsurance_cents"
      - "runs calculations.patient_responsibility_waterfall, writing assistance_enrollment_id, foundation_applied_cents, patient_responsibility_cents and practice_writeoff_cents"
      - "writes provisional_margin_cents via calculations.claim_margin variant provisional"
      - "moves the encounter ATTESTED -> BILLED"

  - method: GET
    path: /claims/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: Claim

  - method: GET
    path: /claims
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["injection_encounter_id?", "patient_id?", "payer_id?", "assistance_enrollment_id?", "drug_line_status?", "admin_line_status?", "limit?", "offset?"]
    output: Claim[]

  - method: POST
    path: /claims/{id}/submit
    roles: [BillingSpecialist]
    input: []
    output: Claim
    side_effects:
      - "moves both line dimensions PENDING -> SUBMITTED in one call"

  - method: POST
    path: /claims/{id}/remittance
    roles: [BillingSpecialist]
    input: ["drug_line_outcome?", "drug_allowed_cents?", "drug_paid_cents?", "wastage_allowed_cents?", "wastage_paid_cents?", "admin_line_outcome?", "admin_allowed_cents?", "admin_paid_cents?", "denial_code?"]
    output: Claim
    side_effects:
      - "posts either line dimension independently; at least one outcome must be supplied"
      - "re-runs calculations.patient_responsibility_waterfall on the remitted allowables"
      - "writes actual_acquisition_cost_cents and realized_margin_cents once both dimensions are terminal, and moves the encounter BILLED -> CLOSED"

  - method: POST
    path: /claims/{id}/appeal-drug-line
    roles: [BillingSpecialist]
    input: [appeal_basis]
    output: Claim
    side_effects:
      - "drug_line_status DENIED -> APPEALED inside Payer.appeal_window_days; admin_line_status is untouched"

  # ------------------------------------------------- AssistanceEnrollment
  - method: POST
    path: /assistance-enrollments
    roles: [BillingSpecialist]
    input: [patient_id, program_type, annual_benefit_cents, per_encounter_cap_cents, effective_date, expiration_date]
    output: AssistanceEnrollment
    side_effects:
      - "starts in PENDING; a manufacturer copay card is refused for a federal-program patient"

  - method: GET
    path: /assistance-enrollments/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: AssistanceEnrollment

  - method: GET
    path: /assistance-enrollments
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["patient_id?", "program_type?", "status?", "limit?", "offset?"]
    output: AssistanceEnrollment[]

  - method: POST
    path: /assistance-enrollments/{id}/approve
    roles: [BillingSpecialist]
    input: []
    output: AssistanceEnrollment
    side_effects:
      - "PENDING -> ACTIVE; only one ACTIVE enrollment per patient"

  - method: POST
    path: /assistance-enrollments/{id}/terminate
    roles: [BillingSpecialist]
    input: [termination_reason]
    output: AssistanceEnrollment
    side_effects:
      - "PENDING | ACTIVE | EXHAUSTED -> TERMINATED (terminal); already-applied benefit on paid claims is not clawed back"

  # ------------------------------------------------------------ AdverseEvent
  - method: POST
    path: /adverse-events
    roles: [RetinaSpecialist]
    input: [injection_encounter_id, event_type, onset_datetime, severity, "culture_result?"]
    output: AdverseEvent
    side_effects:
      - "stamps reported_by_clinician_id from X-User-ID and resolves source_drug_lot_id from the encounter's vial"
      - "writes days_post_injection, reportable and fda_report_due_date via calculations.adverse_event_reportability"

  - method: GET
    path: /adverse-events/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: AdverseEvent

  - method: GET
    path: /adverse-events
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["injection_encounter_id?", "patient_id?", "reported_by_clinician_id?", "adjudicated_by_clinician_id?", "source_drug_lot_id?", "event_type?", "severity?", "status?", "limit?", "offset?"]
    output: AdverseEvent[]

  - method: POST
    path: /adverse-events/{id}/start-investigation
    roles: [ComplianceOfficer]
    input: []
    output: AdverseEvent
    side_effects:
      - "REPORTED -> UNDER_INVESTIGATION and nothing else"

  - method: POST
    path: /adverse-events/{id}/adjudicate
    roles: [RetinaSpecialist]
    input: [outcome, adjudication_note]
    output: AdverseEvent
    side_effects:
      - "outcome RELATED fires the four-hop cascade of §1.2; outcome UNRELATED fires none"
      - "the adjudicator's X-User-ID must differ from the source encounter's clinician_id"

  # --------------------------------------------------------------- LotRecall
  - method: POST
    path: /lot-recalls
    roles: [ComplianceOfficer]
    input: [drug_lot_id, recall_class, reason]
    output: LotRecall
    side_effects:
      - "stamps initiated_by_user_id from X-User-ID and writes notification_deadline_date via calculations.recall_notification_plan"
      - "the lot moves to RECALLED, its IN_STOCK and RESERVED vials move to QUARANTINED and DRAFT encounters holding them are VOIDED"
      - "generates one PENDING RecallNotification per exposed patient and writes notifications_required"

  - method: GET
    path: /lot-recalls/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: []
    output: LotRecall

  - method: GET
    path: /lot-recalls
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer]
    input: ["drug_lot_id?", "recall_class?", "status?", "limit?", "offset?"]
    output: LotRecall[]

  - method: POST
    path: /lot-recalls/{id}/send-notifications
    roles: [ComplianceOfficer]
    input: []
    output: LotRecall
    side_effects:
      - "INITIATED -> PATIENTS_NOTIFIED; every PENDING RecallNotification becomes SENT with sent_at = logical clock"

  - method: POST
    path: /lot-recalls/{id}/ship-return
    roles: [PharmacyTech]
    input: [carrier_reference]
    output: LotRecall
    side_effects:
      - "PATIENTS_NOTIFIED -> RETURN_SHIPPED; every QUARANTINED vial of the lot becomes RETURNED"
      - "fixes vials_returned_count and credit_expected_cents"

  - method: POST
    path: /lot-recalls/{id}/reconcile-credit
    roles: [BillingSpecialist]
    input: [credit_received_cents]
    output: LotRecall
    side_effects:
      - "RETURN_SHIPPED -> CREDIT_RECONCILED; credit_received_cents may not exceed credit_expected_cents"

  - method: POST
    path: /lot-recalls/{id}/close
    roles: [ComplianceOfficer]
    input: [closure_note]
    output: LotRecall
    side_effects:
      - "CREDIT_RECONCILED -> CLOSED (terminal); stamps closed_by_user_id, which must differ from initiated_by_user_id"
      - "requires notifications_acknowledged + notifications_unreachable == notifications_required"

  # ------------------------------------------------------ RecallNotification
  - method: GET
    path: /recall-notifications/{id}
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer, Patient]
    input: []
    output: RecallNotification

  - method: GET
    path: /recall-notifications
    roles: [PracticeAdmin, RetinaSpecialist, PharmacyTech, BillingSpecialist, ComplianceOfficer, Patient]
    input: ["lot_recall_id?", "patient_id?", "injection_encounter_id?", "status?", "limit?", "offset?"]
    output: RecallNotification[]

  - method: POST
    path: /recall-notifications/{id}/acknowledge
    roles: [Patient]
    input: []
    output: RecallNotification
    side_effects:
      - "SENT -> ACKNOWLEDGED with acknowledged_at = logical clock; only the owning patient may call it"
      - "increments the parent recall's notifications_acknowledged"

  - method: POST
    path: /recall-notifications/{id}/mark-unreachable
    roles: [ComplianceOfficer]
    input: [attempt_note]
    output: RecallNotification
    side_effects:
      - "SENT -> UNREACHABLE; increments the parent recall's notifications_unreachable"

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:

  # ---------------------------------------------------------------- auth 401/403
  - error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    message: "X-User-Role and X-User-ID headers are required"
    trigger: "either header absent or empty on any endpoint"

  - error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    message: "unknown role"
    trigger: "X-User-Role is not one of the six declared roles"

  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message: "role may not perform this operation"
    trigger: "a known role calls an endpoint that does not list it"

  - error_id: ERR_ACTING_IDENTITY_NOT_FOUND
    http_status: 403
    message: "acting identity does not exist"
    trigger: "X-User-Role is RetinaSpecialist or Patient and X-User-ID matches no Clinician or Patient row"

  - error_id: ERR_NOT_NOTIFICATION_OWNER
    http_status: 403
    message: "notification belongs to another patient"
    trigger: "an acting Patient acknowledges a RecallNotification whose patient_id differs from X-User-ID"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "wastage must be attested by a second clinician"
    trigger: "POST /injection-encounters/{id}/attest-wastage with X-User-ID equal to the encounter's clinician_id"

  - error_id: ERR_ADJUDICATOR_IS_INJECTOR
    http_status: 403
    message: "the injecting clinician may not adjudicate this event"
    trigger: "POST /adverse-events/{id}/adjudicate with X-User-ID equal to the source encounter's clinician_id"

  - error_id: ERR_RECALL_CLOSER_CONFLICT
    http_status: 403
    message: "the recall initiator may not close the recall"
    trigger: "POST /lot-recalls/{id}/close with X-User-ID equal to initiated_by_user_id"

  # ------------------------------------------------------------------ shape 400
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "request payload or query is invalid"
    trigger: "missing required field, wrong type, unknown enum member, out-of-range number, malformed instant, limit outside 1..100 or negative offset"

  # -------------------------------------------------------------- existence 404
  - error_id: ERR_PAYER_NOT_FOUND
    http_status: 404
    message: "payer not found"
    trigger: "payer id in a path or body resolves to nothing"

  - error_id: ERR_DRUG_NOT_FOUND
    http_status: 404
    message: "drug not found"
    trigger: "drug_id, reference_drug_id or step_therapy_prerequisite_drug_id resolves to nothing"

  - error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    message: "payer drug policy not found"
    trigger: "GET /payer-drug-policies/{id} with an unknown id"

  - error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    message: "patient not found"
    trigger: "patient_id in a path or body resolves to nothing"

  - error_id: ERR_CLINICIAN_NOT_FOUND
    http_status: 404
    message: "clinician not found"
    trigger: "clinician id in a path resolves to nothing"

  - error_id: ERR_IMAGING_STUDY_NOT_FOUND
    http_status: 404
    message: "imaging study not found"
    trigger: "imaging_study_id or baseline_imaging_study_id resolves to nothing"

  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    message: "treatment plan not found"
    trigger: "treatment_plan_id in a path or body resolves to nothing"

  - error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    message: "drug lot not found"
    trigger: "drug_lot_id in a path or body resolves to nothing"

  - error_id: ERR_VIAL_NOT_FOUND
    http_status: 404
    message: "vial not found"
    trigger: "GET /vials/{id} with an unknown id"

  - error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    message: "prior authorization not found"
    trigger: "prior authorization id in a path resolves to nothing"

  - error_id: ERR_ENCOUNTER_NOT_FOUND
    http_status: 404
    message: "injection encounter not found"
    trigger: "injection_encounter_id in a path or body resolves to nothing"

  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    message: "claim not found"
    trigger: "claim id in a path resolves to nothing"

  - error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    message: "assistance enrollment not found"
    trigger: "assistance enrollment id in a path resolves to nothing"

  - error_id: ERR_ADVERSE_EVENT_NOT_FOUND
    http_status: 404
    message: "adverse event not found"
    trigger: "adverse event id in a path resolves to nothing"

  - error_id: ERR_RECALL_NOT_FOUND
    http_status: 404
    message: "lot recall not found"
    trigger: "lot recall id in a path resolves to nothing"

  - error_id: ERR_NOTIFICATION_NOT_FOUND
    http_status: 404
    message: "recall notification not found"
    trigger: "recall notification id in a path resolves to nothing"

  # ------------------------------------------------------------------- OCC 412
  - error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    message: "treatment plan version is stale"
    trigger: "expected_treatment_plan_version differs from TreatmentPlan.version at POST /injection-encounters or POST /prior-authorizations"

  # ----------------------------------------------------------------- state 409
  - error_id: ERR_PLAN_NOT_TREATABLE
    http_status: 409
    message: "treatment plan is not in a treatable state"
    trigger: "POST /injection-encounters when the plan status is not LOADING, MAINTENANCE or INTENSIFIED"

  - error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    message: "treatment plan transition not allowed from this state"
    trigger: "activate on a non-DRAFT plan, suspend on a DRAFT or terminal plan, resume on a non-SUSPENDED plan, or any transition out of DISCONTINUED"

  - error_id: ERR_AUTHORIZATION_STATE_INVALID
    http_status: 409
    message: "authorization transition not allowed from this state"
    trigger: "submit on an APPROVED authorization, decision on a DRAFT authorization, appeal on a non-DENIED authorization"

  - error_id: ERR_ENCOUNTER_STATE_INVALID
    http_status: 409
    message: "encounter transition not allowed from this state"
    trigger: "document twice, attest a DRAFT encounter, void a BILLED or CLOSED encounter"

  - error_id: ERR_CLAIM_LINE_STATE_INVALID
    http_status: 409
    message: "claim line transition not allowed from this state"
    trigger: "submit an already submitted claim, remit a PENDING line, appeal a line that is not DENIED"

  - error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    message: "lot transition not allowed from this state"
    trigger: "quarantine a lot that is not AVAILABLE, release a lot that is not QUARANTINED, act on a RECALLED or EXPIRED lot"

  - error_id: ERR_RECALL_STATE_INVALID
    http_status: 409
    message: "recall step out of order"
    trigger: "ship-return before notifications are sent, reconcile-credit before the return ships, close before credit reconciliation"

  - error_id: ERR_NOTIFICATION_STATE_INVALID
    http_status: 409
    message: "notification transition not allowed from this state"
    trigger: "acknowledge a PENDING notification, or acknowledge or mark-unreachable one that is already terminal"

  - error_id: ERR_ENROLLMENT_STATE_INVALID
    http_status: 409
    message: "enrollment transition not allowed from this state"
    trigger: "approve a non-PENDING enrollment, terminate an already TERMINATED or EXPIRED enrollment"

  - error_id: ERR_ADVERSE_EVENT_STATE_INVALID
    http_status: 409
    message: "adverse event transition not allowed from this state"
    trigger: "start-investigation on a non-REPORTED event, adjudicate an event that is not UNDER_INVESTIGATION"

  - error_id: ERR_VIAL_STATE_INVALID
    http_status: 409
    message: "vial is not in a usable state"
    trigger: "an internal reservation or consumption attempt against a vial that is no longer IN_STOCK or RESERVED for this encounter"

  # -------------------------------------------------------------- business
  - error_id: ERR_CLINICIAN_NOT_ELIGIBLE
    http_status: 409
    message: "clinician may not inject"
    trigger: "acting clinician is SUSPENDED or has injection_privilege false"

  - error_id: ERR_IMAGING_EYE_MISMATCH
    http_status: 422
    message: "imaging study does not match the plan's patient and eye"
    trigger: "study.patient_id differs from the plan's patient_id or study.eye differs from the plan's eye"

  - error_id: ERR_IMAGING_STUDY_STALE
    http_status: 422
    message: "imaging study is outside the 14-day validity window"
    trigger: "encounter_datetime precedes study_datetime or exceeds it by more than IMAGING_VALIDITY_DAYS"

  - error_id: ERR_INJECTION_INTERVAL_VIOLATION
    http_status: 409
    message: "injection is earlier than the drug's minimum safe interval"
    trigger: "whole days since the previous non-VOIDED encounter are fewer than min_interval_days"

  - error_id: ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED
    http_status: 409
    message: "clinician injection capacity for the 24-hour window is exhausted"
    trigger: "the acting clinician already has max_injections_per_day non-VOIDED encounters inside the closed 24-hour window"

  - error_id: ERR_OVERRIDE_REASON_REQUIRED
    http_status: 422
    message: "override_reason is required when medical_necessity_override is true"
    trigger: "medical_necessity_override true with override_reason null or empty"

  - error_id: ERR_PAYER_POLICY_MISSING
    http_status: 409
    message: "no payer policy for this drug"
    trigger: "no PayerDrugPolicy exists for the (payer, effective drug) pair"

  - error_id: ERR_DRUG_EXCLUDED_BY_PAYER
    http_status: 422
    message: "payer excludes this drug"
    trigger: "the governing policy has coverage_tier EXCLUDED"

  - error_id: ERR_AUTHORIZATION_MISSING
    http_status: 409
    message: "an approved prior authorization is required"
    trigger: "policy pa_required is true and the plan has no APPROVED or EXHAUSTED authorization"

  - error_id: ERR_AUTHORIZATION_EXPIRED
    http_status: 409
    message: "prior authorization has expired"
    trigger: "the selected authorization's window does not contain the logical clock"

  - error_id: ERR_AUTHORIZATION_DRUG_MISMATCH
    http_status: 409
    message: "authorization was issued for a different product"
    trigger: "the selected authorization's drug_id differs from the encounter's effective_drug_id, typically after a mandatory biosimilar substitution"

  - error_id: ERR_AUTHORIZATION_EXHAUSTED
    http_status: 409
    message: "prior authorization has no injections left"
    trigger: "injections_used has reached approved_injections"

  - error_id: ERR_NO_ELIGIBLE_VIAL
    http_status: 409
    message: "no eligible vial of the effective drug is in stock"
    trigger: "calculations.vial_selection finds no IN_STOCK vial in an AVAILABLE, unexpired lot of the effective drug"

  - error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 409
    message: "the reserved vial's lot is no longer available"
    trigger: "the lot was quarantined or recalled between reservation and documentation"

  - error_id: ERR_DOSE_EXCEEDS_VIAL_FILL
    http_status: 422
    message: "administered dose exceeds the vial fill volume"
    trigger: "administered_dose_ml greater than the effective drug's vial_fill_ml, or not greater than zero"

  - error_id: ERR_PREP_ATTESTATION_REQUIRED
    http_status: 422
    message: "aseptic preparation must be confirmed"
    trigger: "injection_site_prep_confirmed is false at documentation"

  - error_id: ERR_ATTESTED_WASTAGE_MISMATCH
    http_status: 422
    message: "attested wastage does not match the documented wastage"
    trigger: "attested_wasted_ml differs from the encounter's computed wasted_ml"

  - error_id: ERR_STEP_THERAPY_NOT_SATISFIED
    http_status: 422
    message: "documented prerequisite failures are insufficient"
    trigger: "counted prerequisite-drug failures are fewer than required_prior_failures at submission"

  - error_id: ERR_APPROVED_INJECTIONS_EXCEED_POLICY
    http_status: 422
    message: "approved_injections exceeds the policy maximum"
    trigger: "an APPROVED decision whose approved_injections is greater than pa_max_injections"

  - error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_status: 409
    message: "authorization window overlaps an existing authorization"
    trigger: "an APPROVED decision whose closed window touches or overlaps another APPROVED or EXHAUSTED window on the same plan"

  - error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    message: "the appeal window has closed"
    trigger: "an appeal filed more than Payer.appeal_window_days after the denial"

  - error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    message: "lot number already exists for this drug"
    trigger: "POST /drug-lots repeating a (drug_id, lot_number) pair"

  - error_id: ERR_DUPLICATE_ACTIVE_PLAN
    http_status: 409
    message: "an open treatment plan already exists for this eye"
    trigger: "POST /treatment-plans for a (patient_id, eye) that already has a non-terminal plan"

  - error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    message: "a claim already exists for this encounter"
    trigger: "POST /claims for an encounter that already has a claim"

  - error_id: ERR_COPAY_CARD_FEDERAL_INELIGIBLE
    http_status: 422
    message: "manufacturer copay cards are not permitted for federal-program patients"
    trigger: "POST /assistance-enrollments with program_type MANUFACTURER_COPAY_CARD for a patient whose payer has federal_program true"

  - error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http_status: 409
    message: "the patient already has an active assistance enrollment"
    trigger: "approving a second enrollment while another is ACTIVE"

  - error_id: ERR_RECALL_ALREADY_OPEN
    http_status: 409
    message: "an open recall already exists for this lot"
    trigger: "POST /lot-recalls or POST /drug-lots/{id}/release while a non-CLOSED recall exists"

  - error_id: ERR_NO_QUARANTINED_VIALS
    http_status: 409
    message: "no quarantined vials to return"
    trigger: "ship-return on a lot with zero QUARANTINED vials"

  - error_id: ERR_CREDIT_EXCEEDS_EXPECTED
    http_status: 422
    message: "credit received exceeds the expected credit"
    trigger: "credit_received_cents greater than credit_expected_cents"

  - error_id: ERR_PATIENT_NOTIFICATIONS_INCOMPLETE
    http_status: 409
    message: "patient notifications are not fully resolved"
    trigger: "close attempted while acknowledged + unreachable is below notifications_required"

  - error_id: ERR_OPEN_ADVERSE_EVENT
    http_status: 409
    message: "an open adverse event blocks resumption"
    trigger: "resume attempted while an AdverseEvent on the plan is REPORTED or UNDER_INVESTIGATION"

  - error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    message: "a resource with this unique key already exists"
    trigger: "duplicate Payer.name, Drug.hcpcs_code, Patient.mrn, Clinician.npi or PayerDrugPolicy (payer_id, drug_id)"

  - error_id: ERR_INVALID_REFERENCE_DRUG
    http_status: 422
    message: "reference drug is invalid for this biosimilar"
    trigger: "reference_drug_id points at a biosimilar, or is_biosimilar is true with a null reference_drug_id"

# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:

  - role: RetinaSpecialist
    identity: "entity_backed:Clinician"
    description: "treating retina physician; interprets imaging, opens plans and injects"
    exclusive_operations:
      - "POST /imaging-studies"
      - "POST /treatment-plans and its activate, suspend, resume and discontinue actions"
      - "POST /injection-encounters and its document, attest-wastage and void actions"
      - "POST /adverse-events"
      - "POST /adverse-events/{id}/adjudicate"
    shared_operations:
      - "all GET endpoints except GET /recall-notifications scoped to a patient"
    denied_operations:
      - "any inventory, billing, assistance or recall write"
    notes: "X-User-ID must resolve to a Clinician; wastage attestation and adverse-event adjudication additionally require a different clinician than the injector"

  - role: PharmacyTech
    identity: opaque
    description: "buy-and-bill inventory custodian"
    exclusive_operations:
      - "POST /drug-lots"
      - "POST /drug-lots/{id}/quarantine"
      - "POST /inventory/expiration-sweep"
      - "POST /lot-recalls/{id}/ship-return"
    shared_operations:
      - "all GET endpoints including GET /drug-lots/{id}/exposure"
    denied_operations:
      - "clinical writes, billing writes, recall initiation and closure"

  - role: BillingSpecialist
    identity: opaque
    description: "revenue-cycle operator for authorizations, claims and patient assistance"
    exclusive_operations:
      - "POST /prior-authorizations and its submit, decision and appeal actions"
      - "POST /claims and its submit, remittance and appeal-drug-line actions"
      - "POST /assistance-enrollments and its approve and terminate actions"
      - "POST /lot-recalls/{id}/reconcile-credit"
    shared_operations:
      - "all GET endpoints including GET /drug-lots/{id}/exposure"
    denied_operations:
      - "clinical writes and inventory writes"

  - role: ComplianceOfficer
    identity: opaque
    description: "quality and regulatory officer owning recalls and adverse-event triage"
    exclusive_operations:
      - "POST /lot-recalls"
      - "POST /lot-recalls/{id}/send-notifications"
      - "POST /lot-recalls/{id}/close"
      - "POST /drug-lots/{id}/release"
      - "POST /adverse-events/{id}/start-investigation"
      - "POST /recall-notifications/{id}/mark-unreachable"
    shared_operations:
      - "all GET endpoints"
    denied_operations:
      - "clinical writes, billing writes, lot receipt, adverse-event adjudication"
    notes: "the officer who initiated a recall may not close it"

  - role: PracticeAdmin
    identity: opaque
    description: "reference-data administrator and clock operator"
    exclusive_operations:
      - "POST /payers"
      - "POST /drugs"
      - "POST /payer-drug-policies"
      - "POST /patients"
      - "POST /clinicians"
      - "POST /clinicians/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints including GET /drug-lots/{id}/exposure"
    denied_operations:
      - "every clinical, inventory, billing and recall write"

  - role: Patient
    identity: "entity_backed:Patient"
    description: "notified patient acting on their own recall notifications"
    exclusive_operations:
      - "POST /recall-notifications/{id}/acknowledge"
    shared_operations:
      - "GET /recall-notifications and GET /recall-notifications/{id}, restricted to rows whose patient_id equals X-User-ID"
    denied_operations:
      - "every other endpoint in the API"
    notes: "X-User-ID must resolve to a Patient row"
