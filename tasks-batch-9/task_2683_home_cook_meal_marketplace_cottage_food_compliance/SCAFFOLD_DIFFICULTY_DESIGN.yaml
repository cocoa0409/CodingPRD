  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cutoff_priority_14_beats_capacity_priority_46
        grounds:
          - validations[priority=14]
          - validations[priority=46]
          - errors.ERR_WINDOW_CUTOFF_PASSED
          - errors.ERR_WINDOW_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          One POST /orders request violates two rules 32 priority steps apart. The window is past
          its order_cutoff_at (priority 14) AND the requested quantity exceeds
          effective_capacity_meals (priority 46). The response must be
          409 ERR_WINDOW_CUTOFF_PASSED, never 422 ERR_WINDOW_CAPACITY_EXCEEDED, and the test
          proves both rules are independently live by firing the capacity rule alone before the
          clock crosses the cutoff.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Jae is ACTIVE and CLEAR with weekly_capacity_meals 5."
            - "One APPROVED MenuItem at 1200 cents."
            - "One OPEN ProductionWindow with capacity_meals 5 and order_cutoff_at 2026-08-05T00:00:00Z, holding one order of quantity 4 (committed_meals 4, spoilage_reserve_meals 1, effective_capacity_meals 4)."
            - "Logical clock still at the default 2026-08-01T00:00:00Z for the first trigger call."
