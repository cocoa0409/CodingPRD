    roles: [SiteSustainabilityManager]
    input: []
    output: BaselinePeriod
    side_effects: ["state_machines.BaselinePeriod.OPEN_to_SUBMITTED — freezes calculations.baseline_period_metrics"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_BASELINE_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_BASELINE_STATE, ERR_BASELINE_NO_DATA]

